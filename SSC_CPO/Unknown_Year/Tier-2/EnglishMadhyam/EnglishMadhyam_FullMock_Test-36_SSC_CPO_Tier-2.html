ects of extreme weather events.\n                                                                <input checked=\"checked\" class=\"question_options3\" name=\"selected_option_184\" type=\"radio\" value=\"569530_138184\"/>\n<span class=\"checkmark radio_check3\"></span>"], "correct_answer": 4, "correct_option": "4) It consistently strengthens the effects of extreme weather events.\n                                                                <input checked=\"checked\" class=\"question_options3\" name=\"selected_option_184\" type=\"radio\" value=\"569530_138184\"/>\n<span class=\"checkmark radio_check3\"></span>", "explanation": "D) It consistently strengthens the effects of extreme weather events. <br /> A: The passage explicitly states that La Nina affects crop cycles, energy usage, and local pollution, making this true. <br /> B: La Nina is described as having cooling effects, which aligns with this inference. <br /> C. Its delayed onset in 2024 has perplexed scientists (Correct): The passage mentions that scientists are “perplexed” by the delayed or weak onset of La Nina. <br /> D: The passage does not indicate that La Nina strengthens extreme weather events consistently; instead, it discusses its variability and delayed onset in 2024.", "marks": {"positive": 1.0, "negative": 0.2}}, {"question_number": 186, "question_text": "<strong>Comprehension:</strong> <br /> The Draft UGC (Minimum Standards of Instruction for the Grant of Undergraduate Degree and Postgraduate Degree) Regulations, 2024 propose significant changes to India’s higher education landscape. These include bi-annual admissions to undergraduate (UG) and postgraduate (PG) courses, enabling students from any stream to pursue any discipline in UG and PG if they pass a relevant national qualifying examination, and allowing for the extension or acceleration of courses. Students can pursue multiple degrees simultaneously. Higher educational institutions will have the autonomy to determine student attendance requirements. According to the UGC Chairman, M. Jagadesh Kumar, these changes will remove rigidity, ensuring that global standards are met. While the intent is laudable, one provision further centralises examinations as a qualifying criterion, which may limit flexibility. The draft rules align with the National Education Policy (NEP) 2020, which emphasises hybrid learning models and skill-based education. The draft rules also support the implementation of the National Credit Framework, providing students greater academic flexibility.<br/>\r\nHowever, while the goals of these reforms are clear, the question is whether there are resources to implement such sweeping changes. Hurdles exist as systemic issues such as insufficient faculty strength, underfunded institutions, and a lack of adequately trained or motivated teachers. Moreover, the regulatory framework, such as on class strength requirements, governing affiliated colleges where a majority of the students study, is ill-equipped to support these new rules that may be implemented more easily in autonomous institutions. Since education is on the concurrent list, State governments often show initial compliance with new regulations only to backtrack. The inertia within academic bodies and administrative procedures further complicates the effective adoption of changes such as the ‘academic bank of credits’. This initiative allows students to register at one institution, take courses from another, and complete apprenticeships in a company, with the degree being awarded by the first institution. While such flexibility is groundbreaking, it faces considerable resistance from traditional academic structures. Moreover, the success of these reforms hinges on a substantial increase in investment in education. Unfortunately, this year’s Budget allocates 15% less funding to higher education compared to the previous year’s revised estimates. While the draft UGC rules offer a promising vision, their success will depend on addressing existing systemic challenges and ensuring that there are adequate resources in place.<br/>\n<strong>What is the tone of the passage?</strong>", "options": ["1) Cautiously optimistic about the reforms but aware of implementation challenges\n                                                                <input checked=\"checked\" class=\"question_options0\" name=\"selected_option_185\" type=\"radio\" value=\"569531_138185\"/>\n<span class=\"checkmark radio_check0\"></span>", "2) Completely critical of the proposed reforms\n                                                                <input class=\"question_options1\" name=\"selected_option_185\" type=\"radio\" value=\"569532_138185\"/>\n<span class=\"checkmark radio_check1\"></span>", "3) Overwhelmingly positive about the UGC reforms\n                                                                <input class=\"question_options2\" name=\"selected_option_185\" type=\"radio\" value=\"569533_138185\"/>\n<span class=\"checkmark radio_check2\"></span>", "4) Indifferent to the proposed changes\n                                                                <input class=\"question_options3\" name=\"selected_option_185\" type=\"radio\" value=\"569534_138185\"/>\n<span class=\"checkmark radio_check3\"></span>"], "correct_answer": 1, "correct_option": "1) Cautiously optimistic about the reforms but aware of implementation challenges\n                                                                <input checked=\"checked\" class=\"question_options0\" name=\"selected_option_185\" type=\"radio\" value=\"569531_138185\"/>\n<span class=\"checkmark radio_check0\"></span>", "explanation": "A) Cautiously optimistic about the reforms but aware of implementation challenges <br /> The passage appreciates the goals of UGC reforms but highlights challenges such as limited resources, underfunded institutions, and lack of faculty. This reflects a cautiously optimistic tone with concerns about feasibility.B. The passage acknowledges the merits of the reforms and does not outright dismiss them.C. The passage balances praise with criticism, avoiding an overly positive stance.D. The author is clearly engaged in the discussion, offering detailed analysis, not showing indifference.", "marks": {"positive": 1.0, "negative": 0.2}}, {"question_number": 187, "question_text": "<strong>Comprehension:</strong> <br /> The Draft UGC (Minimum Standards of Instruction for the Grant of Undergraduate Degree and Postgraduate Degree) Regulations, 2024 propose significant changes to India’s higher education landscape. These include bi-annual admissions to undergraduate (UG) and postgraduate (PG) courses, enabling students from any stream to pursue any discipline in UG and PG if they pass a relevant national qualifying examination, and allowing for the extension or acceleration of courses. Students can pursue multiple degrees simultaneously. Higher educational institutions will have the autonomy to determine student attendance requirements. According to the UGC Chairman, M. Jagadesh Kumar, these changes will remove rigidity, ensuring that global standards are met. While the intent is laudable, one provision further centralises examinations as a qualifying criterion, which may limit flexibility. The draft rules align with the National Education Policy (NEP) 2020, which emphasises hybrid learning models and skill-based education. The draft rules also support the implementation of the National Credit Framework, providing students greater academic flexibility.<br/>\r\nHowever, while the goals of these reforms are clear, the question is whether there are resources to implement such sweeping changes. Hurdles exist as systemic issues such as insufficient faculty strength, underfunded institutions, and a lack of adequately trained or motivated teachers. Moreover, the regulatory framework, such as on class strength requirements, governing affiliated colleges where a majority of the students study, is ill-equipped to support these new rules that may be implemented more easily in autonomous institutions. Since education is on the concurrent list, State governments often show initial compliance with new regulations only to backtrack. The inertia within academic bodies and administrative procedures further complicates the effective adoption of changes such as the ‘academic bank of credits’. This initiative allows students to register at one institution, take courses from another, and complete apprenticeships in a company, with the degree being awarded by the first institution. While such flexibility is groundbreaking, it faces considerable resistance from traditional academic structures. Moreover, the success of these reforms hinges on a substantial increase in investment in education. Unfortunately, this year’s Budget allocates 15% less funding to higher education compared to the previous year’s revised estimates. While the draft UGC rules offer a promising vision, their success will depend on addressing existing systemic challenges and ensuring that there are adequate resources in place.<br/>\n<strong>What is the main theme of the passage?</strong>", "options": ["1) The UGC reforms are well-designed but face major implementation challenges\n                                                                <input checked=\"checked\" class=\"question_options0\" name=\"selected_option_186\" type=\"radio\" value=\"569535_138186\"/>\n<span class=\"checkmark radio_check0\"></span>", "2) India’s higher education system does not need reforms\n                                                                <input class=\"question_options1\" name=\"selected_option_186\" type=\"radio\" value=\"569536_138186\"/>\n<span class=\"checkmark radio_check1\"></span>", "3) Education reforms are always destined to fail in India\n                                                                <input class=\"question_options2\" name=\"selected_option_186\" type=\"radio\" value=\"569537_138186\"/>\n<span clas  educational institutions will have the autonomy to determine student attendance requirements. According to the UGC Chairman, M. Jagadesh Kumar, these changes will remove rigidity, ensuring that global standards are met. While the intent is laudable, one provision further centralises examinations as a qualifying criterion, which may limit flexibility. The draft rules align with the National Education Policy (NEP) 2020, which emphasises hybrid learning models and skill-based education. The draft rules also support the implementation of the National Credit Framework, providing students greater academic flexibility.<br/>\r\nHowever, while the goals of these reforms are clear, the question is whether there are resources to implement such sweeping changes. Hurdles exist as systemic issues such as insufficient faculty strength, underfunded institutions, and a lack of adequately trained or motivated teachers. Moreover, the regulatory framework, such as on class strength requirements, governing affiliated colleges where a majority of the students study, is ill-equipped to support these new rules that may be implemented more easily in autonomous institutions. Since education is on the concurrent list, State governments often show initial compliance with new regulations only to backtrack. The inertia within academic bodies and administrative procedures further complicates the effective adoption of changes such as the ‘academic bank of credits’. This initiative allows students to register at one institution, take courses from another, and complete apprenticeships in a company, with the degree being awarded by the first institution. While such flexibility is groundbreaking, it faces considerable resistance from traditional academic structures. Moreover, the success of these reforms hinges on a substantial increase in investment in education. Unfortunately, this year’s Budget allocates 15% less funding to higher education compared to the previous year’s revised estimates. While es such as the ‘academic bank of credits’. This initiative allows students to register at one institution, take courses from another, and complete apprenticeships in a company, with the degree being awarded by the first institution. While such flexibility is groundbreaking, it faces considerable resistance from traditional academic structures. Moreover, the success of these reforms hinges on a substantial increase in investment in education. Unfortunately, this year’s Budget allocates 15% less funding to higher education compared to the previous year’s revised estimates. While the draft UGC rules offer a promising vision, their success will depend on addressing existing systemic challenges and ensuring that there are adequate resources in place.<br/>\n<strong>The draft UGC rules emphasize __________ learning models and skill-based education, aligning with the National Education Policy (NEP) 2020.</strong>", "options": ["1) Traditional\n                                                                <input class=\"question_options0\" name=\"selected_option_188\" type=\"radio\" value=\"569543_138188\"/>\n<span class=\"checkmark radio_check0\"></span>", "2) Rigid\n                                                                <input class=\"question_options1\" name=\"selected_option_188\" type=\"radio\" value=\"569544_138188\"/>\n<span class=\"checkmark radio_check1\"></span>", "3) Hybrid\n                                                                <input checked=\"checked\" class=\"question_options2\" name=\"selected_option_188\" type=\"radio\" value=\"569545_138188\"/>\n<span class=\"checkmark radio_check2\"></span>", "4) Static\n                                                                <input class=\"question_options3\" name=\"selected_option_188\" type=\"radio\" value=\"569546_138188\"/>\n<span class=\"checkmark radio_check3\"></span>"], "correct_answer": 3, "correct_option": "3) Hybrid\n                                                                <in  systemic issues such as insufficient faculty strength, underfunded institutions, and a lack of adequately trained or motivated teachers. Moreover, the regulatory framework, such as on class strength requirements, governing affiliated colleges where a majority of the students study, is ill-equipped to support these new rules that may be implemented more easily in autonomous institutions. Since education is on the concurrent list, State governments often show initial compliance with new regulations only to backtrack. The inertia within academic bodies and administrative procedures further complicates the effective adoption of changes such as the ‘academic bank of credits’. This initiative allows students to register at one institution, take courses from another, and complete apprenticeships in a company, with the degree being awarded by the first institution. While such flexibility is groundbreaking, it faces considerable resistance from traditional academic structures. Moreover, the success of these reforms hinges on a substantial increase in investment in education. Unfortunately, this year’s Budget allocates 15% less funding to higher education compared to the previous year’s revised estimates. While the draft UGC rules offer a promising vision, their success will depend on addressing existing systemic challenges and ensuring that there are adequate resources in place.<br/>\n<strong>Why do the proposed UGC reforms face implementation challenges, according to the passage?</strong>", "options": ["1) Lack of clarity in the policy\n                                                                <input class=\"question_options0\" name=\"selected_option_189\" type=\"radio\" value=\"569547_138189\"/>\n<span class=\"checkmark radio_check0\"></span>", "2) Resistance from the National Education Policy (NEP)\n                                                                <input class=\"question_options1\" name=\"selected_option_189\" type=\"radio\" value=\"569548_138189\"/>\n<span class=\"checkmark radio_check1\"></span>", "3) Insufficient resources and systemic issues\n                                                                <input checked=\"checked\" class=\"question_options2\" name=\"selected_option_189\" type=\"radio\" value=\"569549_138189\"/>\n<span class=\"checkmark radio_check2\"></span>", "4) Disapproval from students and teachers\n                                                                <input class=\"question_options3\" name=\"selected_option_189\" type=\"radio\" value=\"569550_138189\"/>\n<span class=\"checkmark radio_check3\"></span>"], "correct_answer": 3, "correct_option": "3) Insufficient resources and systemic issues\n                                                                <input checked=\"checked\" class=\"question_options2\" name=\"selected_option_189\" type=\"radio\" value=\"569549_138189\"/>\n<span class=\"checkmark radio_check2\"></span>", "explanation": "C) Insufficient resources and systemic issuesThe passage clearly states that the reforms face \"systemic issues such as insufficient faculty strength, underfunded institutions, and a lack of adequately trained or motivated teachers.\"A. Lack of clarity in the policy is incorrect, as the goals of the reforms are described as clear.B. Resistance from the NEP is incorrect, as the reforms align with the NEP.D. Disapproval from students and teachers is never mentioned in the passage.", "marks": {"positive": 1.0, "negative": 0.2}}, {"question_number": 191, "question_text": "<strong>Comprehension:</strong><br/>\r\nWhether it’s self-doubt at work or struggles in relationships, the roots often trace back to unresolved childhood wounds. <br /> Have you ever wondered why life keeps pulling you back, no matter how hard you try to move forward? Maybe you find yourself repeating the same mistakes in relationships, doubting your abilities at work, or battling the constant ache of “not being enough.” <br /> It’s easy to blame bad luck or personal failure. But often, these struggles run deeper—in unresolved childhood wounds. Childhood is when we learn how to love, trust and value ourselves. But not all childhoods are built on safety and support. Even seemingly small moments can leave deep scars. <br /> A parent saying, “Stop crying, you’re embarrassing me,” or a teacher comparing you to someone else may seem insignificant at the time but can shape how we see ourselves for years to come. Take Radhika, for example. At 35, she thrived in her career but couldn’t maintain a relationship. Every time someone got close, she would pull away, convinced they would leave her eventually. Therapy revealed that her fear of abandonment stemmed from her father leaving when she was six. Her emotional walls weren’t about keeping others out; they were about protecting herself from feeling that pain again. Then there’s Arjun, 28, who struggled to hold a job. His pattern was predictable: procrastinate, miss deadlines and eventually lose the role. <br /> He believed he lacked discipline, but therapy uncovered a deeper truth. He had grown up under relentless criticism—nothing he did was ever good enough. That internalised voice followed him into adulthood, leading him to self-sabotage before anyone else could judge him. These aren’t isolated stories. Many of us carry invisible wounds from our childhood. <br /> A parent’s absence, constant comparisons, or even a single harsh word can create emotional patterns—fear of intimacy, perfectionism, or shrinking ourselves to avoid rejection. Over time, these patterns create setbacks that seem external but are deeply internal. Therapy is where this cycle ends. It’s not about blaming our parents or reliving the past. It’s about understanding why we feel stuck and learning how to let go of the pain. Imagine carrying a heavy bag for years, thinking it’s just part of life—then discovering you can put it down. That’s what healing feels like. <br /> One client described the process beautifully: “For the first time, I understand myself. I’m not broken. I’ve just been carrying pain I didn’t know was there.” Your setbacks aren’t failures; they’re signals that something inside you needs attention. Healing childhood wounds allows you to stop reacting from a place of fear and start living from a place of freedom. It’s not an easy journey, but it’s one worth taking. The truth is, you deserved love and safety as a child, and you still do now. <br /> Healing isn’t about erasing the past—it’s about reclaiming your future. If this resonates, consider giving yourself the gift of therapy. You’re not broken—you’re healing. <br /> <strong>What is the underlying reason why some individuals struggle with maintaining relationships as per the passage?</strong>", "options": ["1) They are inherently incapable of loving others.\n                                                                <input class=\"question_options0\" name=\"selected_option_190\" type=\"radio\" value=\"569551_138190\"/>\n<span class=\"checkmark radio_check0\"></span>", "2) They are too focused on their careers.\n                                                                <input class=\"question_options1\" name=\"selected_option_190\" type=\"radio\" value=\"569552_138190\"/>\n<span class=\"checkmark radio_check1\"></span>", "3) They fear emotional pain due to past experiences.\n                                                                <input checked=\"checked\" class=\"question_options2\" name=\"selected_option_190\" type=\"radio\" value=\"569553_138190\"/>\n<span class=\"checkmark radio_check2\"></span>", "4) They have difficulty trusting because of societal expectations.\n                                                                <input class=\"question_options3\" name=\"selected_option_190\" type=\"radio\" value=\"569554_138190\"/>\n<span class=\"checkmark radio_check3\"></span>"], "correct_answer": 3, "correct_option": "3) They fear emotional pain due to past experiences.\n nt and timeless call: abolish nuclear weapons before they abolish us. Representing the hibakushas — survivors of Hiroshima and Nagasaki — 92-year-old Terumi Tanaka's speech in Oslo reverberated with haunting memories of 1945 and dire warnings for the present. The horrors etched in Tanaka's narrative — a \"bright, white light\", the charred remains of loved ones and a city reduced to ashes — are more than history. They are a moral imperative. The bombings killed over two lakh people by the year's end, with countless others succumbing to the radiation's insidious grip. Yet, nearly eight decades later, humanity teeters on the brink of repeating its gravest mistake.<br/>\r\nDespite a longstanding global taboo against nuclear weapon use, cracks are showing. Russia's veiled threats to Ukraine, Israel's nuclear rhetoric amid the Gaza conflict and relentless modernisation of arsenals by nuclear-armed states paint a chilling picture. The Treaty on the Non-Proliferation of Nuclear Weapons, once a beacon of hope, is now a neglected promise. The hibakushas' campaign underscores the catastrophic human toll of nuclear warfare and the futility of seeking peace through annihilation. Yet, their struggle also highlights systemic failures — decades of societal discrimination, insufficient state support and political inertia. Their plea for a nuclear-free world is not just an anti-war cry; it is a fight for dignity and survival. Tanaka's words, \"Nuclear weapons cannot — and must not — coexist with humanity\", should resonate beyond Oslo. Our collective survival depends on our ability to learn from the past and act decisively in the present. Let us heed the hibakushas' call before their voices, like their memories, fade into silence.<br/>\n<strong>What is the tone of the passage?</strong>", "options": ["1) Urgent and cautionary\n                                                                <input checked=\"checked\" class=\"question_options0\" name=\"selected_option_195\" type=\"radi                 case '3':
                case '4':
                    const optionIndex = parseInt(event.key) - 1;
                    const options = document.querySelectorAll('.option');
                    if (options[optionIndex]) {
                        // Add visual feedback for option selection
                        options[optionIndex].classList.add('keyboard-selected');
                        
                        // Actually select the option
                        const radio = options[optionIndex].querySelector('input[type="radio"]');
                        if (radio) {
                            radio.checked = true;
                            userAnswers[currentQuestionIndex] = optionIndex + 1;
                            
                            // Update the option's visual state
                            options.forEach(opt => opt.classList.remove('selected'));
                            options[optionIndex].classList.add('selected');
                            
                            // Update the question palette
                            updateQuestionPalette();
                        }
                        
                        // Remove the selection effect after animation
                        setTimeout(() => {
                            options[optionIndex].classList.remove('keyboard-selected');
                        }, 200);
                    }
                    break;
            }
        }

        function setupQuestionPalette() {
            const palette = document.getElementById('question-palette');
            palette.innerHTML = '';
            
            for (let i = 0; i < testData.questions.length; i++) {
                const item = document.createElement('div');
                item.className = 'palette-item not-visited';
                item.textContent = i + 1;
                item.addEventListener('click', () => {
                    showQuestion(i);
                    // Close the palette if it's currently visible (for mobile view)
                    const paletteElement = document.querySelector('.question-palette');
                    if (paletteElement.classList.contains('visible')) {
                        toggleQuestionPalette();
                    }
                });
                palette.appendChild(item);
            }
            
            // Ensure palette toggle button is visible on mobile
            updatePaletteToggleDisplay();
        }

        function updateQuestionPalette() {
            const items = document.querySelectorAll('.palette-item');
            items.forEach((item, index) => {
                item.className = 'palette-item';
                
                // Only add status classes if the question has been visited
                if (visitedQuestions.has(index)) {
                    if (bookmarkedQuestions.has(index)) {
                        item.classList.add('marked-review');
                    } else if (userAnswers[index] !== null) {
                        item.classList.add('answered');
                    } else {
                        item.classList.add('not-answered');
                    }
                } else {
                    item.classList.add('not-visited');
                }
                
                if (index === currentQuestionIndex) {
                    item.classList.add('active');
                }
            });
        }

        function filterQuestions(filter) {
            const items = document.querySelectorAll('.palette-item');
            items.forEach((item, index) => {
                const isMarkedReview = bookmarkedQuestions.has(index);
                const isAnswered = userAnswers[index] !== null;
                const isVisited = visitedQuestions.has(index);
                
                switch(filter) {
                    case 'answered':
                        item.style.display = isAnswered ? 'flex' : 'none';
                        break;
                    case 'not-answered':
                        item.style.display = (isVisited && !isAnswered) ? 'flex' : 'none';
                        break;
                    case 'marked-review':
                        item.style.display = isMarkedReview ? 'flex' : 'none';
                        break;
                    default:
                        item.style.display = 'flex';
                }
            });
        }
        
        function setupTimer() {
            const duration = parseFloat(testData.test_info.duration);
            let timeLeft = Math.floor(duration * 60);
            const timerElement = document.getElementById('timer');
            
            timerInterval = setInterval(() => {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                
                if (timeLeft <= 300) { // 5 minutes warning
                    timerElement.classList.add('timer-warning');
                }
                
                timerElement.innerHTML = `
                    <i class="fas fa-clock"></i>
                    Time Remaining: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}
                `;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitTest();
                }
                
                timeLeft--;
            }, 1000);
        }
        
        function showQuestion(index) {
            currentQuestionIndex = index;
            // Mark question as visited when opened
            visitedQuestions.add(index);
            const question = testData.questions[index];
            const container = document.getElementById('current-question');
            
            // Add fade-out animation
            container.style.opacity = '0';
            container.style.transform = 'translateY(10px)';
            
            setTimeout(() => {
                container.innerHTML = `
                    <div class="question-container">
                        <div class="question-number">
                            <span>Question ${question.question_number} of ${testData.questions.length}</span>
                            <span class="marks-info">
                                <i class="fas fa-plus-circle"></i> ${question.marks.positive}
                                <i class="fas fa-minus-circle"></i> ${question.marks.negative}
                            </span>
                        </div>
                        <div class="question">${question.question_text}</div>
                        <div class="options">
                            ${question.options.map((option, optIndex) => `
                                <label class="option ${userAnswers[index] === optIndex + 1 ? 'selected' : ''}">
                                    <input type="radio" name="question${index}" value="${optIndex + 1}" 
                                        ${userAnswers[index] === optIndex + 1 ? 'checked' : ''}>
                                        <div class="option-content">
                                    <span class="option-number">${optIndex + 1}</span> ${option}
                                        </div>
                                </label>
                            `).join('')}
                        </div>
                        <div style="flex-grow: 1;"></div>
                    </div>
                `;
                
                // Update bookmark button
                const bookmarkBtn = document.getElementById('bookmark-btn');
                bookmarkBtn.classList.toggle('active', bookmarkedQuestions.has(index));
                bookmarkBtn.innerHTML = bookmarkedQuestions.has(index) 
                    ? '<i class="fas fa-flag"></i> Marked for Review'
                    : '<i class="far fa-flag"></i> Mark for Review <span class="shortcut-hint">(B)</span>';
                
                // Add event listeners to options
                const options = container.querySelectorAll('.option');
                    options.forEach((option, optIdx) => {
                    option.addEventListener('click', function() {
                        const radio = this.querySelector('input[type="radio"]');
                        radio.checked = true;
                        
                            options.forEach(opt => {
                                opt.classList.remove('selected');
                                opt.style.transform = 'translateX(0)';
                            });
                            
                            // Animate the selected option
                        this.classList.add('selected');
                            this.style.transform = 'translateX(10px)';
                        
                        userAnswers[index] = parseInt(radio.value);
                        updateQuestionPalette();

                            // Highlight the option number with a pulse animation
                        const optionNumber = this.querySelector('.option-number');
                        optionNumber.style.animation = 'pulse 0.5s ease';
                        setTimeout(() => {
                            optionNumber.style.animation = '';
                        }, 500);
                });

                        // Add a small delay to each option's appearance
                        option.style.opacity = '0';
                        option.style.transform = 'translateX(20px)';
                        setTimeout(() => {
                            option.style.opacity = '1';
                            option.style.transform = 'translateX(0)';
                        }, 100 + (optIdx * 50));
                    });
                    
                    // Fade in the content
                    setTimeout(() => {
                        container.style.opacity = '1';
                        container.style.transform = 'translateY(0)';
                    }, 50);
                
                // Update navigation buttons
                updateNavigationButtons();
                
                // Update question palette
                updateQuestionPalette();
                }, 150);
        }
        
        function updateNavigationButtons() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const submitBtn = document.getElementById('submit-test');
            
            prevBtn.disabled = currentQuestionIndex === 0;
            
            if (currentQuestionIndex === testData.questions.length - 1) {
                nextBtn.style.display = 'none';
                submitBtn.style.display = 'block';
            } else {
                nextBtn.style.display = 'block';
                submitBtn.style.display = 'none';
            }
        }
        
        function goToPreviousQuestion() {
            if (currentQuestionIndex > 0) {
                showQuestion(currentQuestionIndex - 1);
            }
        }
        
        function goToNextQuestion() {
            if (currentQuestionIndex < testData.questions.length - 1) {
                showQuestion(currentQuestionIndex + 1);
            }
        }

        function toggleBookmark() {
            const btn = document.getElementById('bookmark-btn');
            if (bookmarkedQuestions.has(currentQuestionIndex)) {
                bookmarkedQuestions.delete(currentQuestionIndex);
                btn.classList.remove('active');
                btn.innerHTML = `
                    <i class="far fa-flag"></i> 
                    Mark for Review <span class="shortcut-hint">(B)</span>
                `;
            } else {
                bookmarkedQuestions.add(currentQuestionIndex);
                btn.classList.add('active');
                btn.innerHTML = `
                    <i class="fas fa-flag"></i> 
                    Marked for Review
                `;
            }
            updateQuestionPalette();
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.body.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
            const themeToggle = document.getElementById('theme-toggle');
            themeToggle.innerHTML = `<i class="fas fa-${isDarkMode ? 'sun' : 'moon'}"></i>`;
        }

        function showReviewWarning() {
            // Skip the warning and directly submit the test
            submitTest();
        }
        
        function submitTest() {
            // Add submission animation
            const testContainer = document.getElementById('test-container');
            const questionPalette = document.querySelector('.question-palette');
            const resultContainer = document.getElementById('result');
            
            // Animate test container sliding out
            testContainer.style.transition = 'all 0.5s var(--animation-bounce)';
            testContainer.style.transform = 'translateX(-50px)';
            testContainer.style.opacity = '0';
            
            // Animate question palette fading out
            questionPalette.style.transition = 'all 0.5s var(--animation-bounce)';
            questionPalette.style.transform = 'translateX(50px)';
            questionPalette.style.opacity = '0';
            
            // Clear the timer
            clearInterval(timerInterval);
            
            // Calculate results with a slight delay for animation
            setTimeout(() => {
            let score = 0;
            let correctCount = 0;
            let attemptedCount = 0;
            const reviewAnswers = [];
            
            // Calculate score and statistics
            testData.questions.forEach((question, index) => {
                const userAnswer = userAnswers[index];
                const isCorrect = userAnswer === question.correct_answer;
                
                if (userAnswer !== null) {
                    attemptedCount++;
                    if (isCorrect) {
                        score += question.marks.positive;
                        correctCount++;
                    } else {
                        score -= question.marks.negative;
                    }
                }
                
                reviewAnswers.push({
                    questionNumber: question.question_number,
                    questionText: question.question_text,
                    userChoice: userAnswer,
                    userChoiceText: userAnswer !== null ? question.options[userAnswer - 1] : 'Not answered',
                    correctAnswer: question.correct_answer,
                    correctAnswerText: question.correct_option,
                    isCorrect: isCorrect,
                    answered: userAnswer !== null
                });
            });
            
            // Update statistics
            document.getElementById('total-questions').textContent = testData.questions.length;
            document.getElementById('attempted-questions').textContent = attemptedCount;
            document.getElementById('correct-answers').textContent = correctCount;
            document.getElementById('accuracy').textContent = 
                `${Math.round((correctCount / (attemptedCount || 1)) * 100)}%`;
            
            // Display score
            document.getElementById('score').innerHTML = `
                <div style="font-size: 36px; color: var(--primary-color);">
                    ${score.toFixed(2)} / ${testData.questions.length * testData.questions[0].marks.positive}
                </div>
                <div style="color: var(--text-color); margin-top: 10px;">
                    Percentage: ${Math.round((score / (testData.questions.length * testData.questions[0].marks.positive)) * 100)}%
                </div>
            `;
            
            // Create performance chart
            const chartContainer = document.getElementById('performance-chart');
            chartContainer.innerHTML = ''; // Clear previous chart if any
            const ctx = document.createElement('canvas');
            chartContainer.appendChild(ctx);
                
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Correct', 'Incorrect', 'Not Attempted'],
                    datasets: [{
                        data: [
                            correctCount,
                            attemptedCount - correctCount,
                            testData.questions.length - attemptedCount
                        ],
                        backgroundColor: [
                                '#16a34a', // Fixed success green
                                '#dc2626', // Fixed error red
                                '#8b5cf6'  // Fixed purple for not attempted
                        ],
                            borderColor: 'var(--bg-color)',
                        borderWidth: 2,
                            hoverOffset: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                                display: false
                            },
                            tooltip: {
                                backgroundColor: 'var(--bg-color)',
                                titleColor: 'var(--text-color)',
                                bodyColor: 'var(--text-color)',
                                borderColor: 'var(--border-color)',
                                borderWidth: 1,
                                padding: 12,
                                boxPadding: 6,
                                usePointStyle: true,
                                callbacks: {
                                    label: function(context) {
                                        let label = context.label || '';
                                        let value = context.raw || 0;
                                        let total = context.dataset.data.reduce((a, b) => a + b, 0);
                                        let percentage = Math.round((value / total) * 100);
                                        return `${label}: ${value} (${percentage}%)`;
                                    }
                                }
                            },
                            title: {
                                display: true,
                                text: 'Test Performance',
                                color: 'var(--text-color)',
                                font: {
                                    family: 'Inter, sans-serif',
                                    size: 16,
                                    weight: '600'
                                },
                                padding: {
                                    bottom: 15
                            }
                        }
                    },
                    cutout: '65%',
                    animation: {
                        animateScale: true,
                        animateRotate: true,
                            duration: 1500,
                            easing: 'easeOutQuart'
                    }
                }
            });
                
                // Replace the chart's built-in legend with a custom one
                const customLegend = document.createElement('div');
                customLegend.className = 'custom-chart-legend';

                chartContainer.appendChild(customLegend);
            
            // Update the analytics container title
            document.querySelector('.analytics-container h3').innerHTML = 
                '<i class="fas fa-chart-pie"></i> Performance Analysis';
            
            // Add event listener to the download analysis buttons with a small delay to ensure UI is ready
            setTimeout(() => {
                const downloadBtn = document.getElementById('download-analysis');
                const bottomDownloadBtn = document.getElementById('bottom-download-analysis');
                if (downloadBtn) {
                    downloadBtn.addEventListener('click', function() {
                        downloadAnalysis(testData, reviewAnswers, score, correctCount, attemptedCount);
                    });
                }
                if (bottomDownloadBtn) {
                    bottomDownloadBtn.addEventListener('click', function() {
                        downloadAnalysis(testData, reviewAnswers, score, correctCount, attemptedCount);
                    });
                }
            }, 500);
            
            // Fix any palette toggle issue
            if (window.innerWidth <= 768) {
                const paletteToggle = document.getElementById('palette-toggle');
                if (paletteToggle) {
                    paletteToggle.style.display = 'flex';
                }
                
                // Add close button to palette if not exists
                const palette = document.querySelector('.question-palette');
                if (palette && !document.querySelector('.palette-close-btn')) {
                    const closeBtn = document.createElement('button');
                    closeBtn.className = 'palette-close-btn';
                    closeBtn.innerHTML = '<i class="fas fa-times"></i>';
                    closeBtn.addEventListener('click', toggleQuestionPalette);
                    
                    const paletteHeader = palette.querySelector('.palette-header');
                    if (paletteHeader) {
                        paletteHeader.appendChild(closeBtn);
                    }
                }
            }
            
                // Display answer review with staggered animation
            const answersDiv = document.getElementById('answers');
            answersDiv.innerHTML = '<h3>Answer Review:</h3>';
            
                reviewAnswers.forEach((answer, idx) => {
                const answerDiv = document.createElement('div');
                answerDiv.className = 'answer-review';
                    answerDiv.style.opacity = '0';
                    answerDiv.style.transform = 'translateY(20px)';
                
                answerDiv.innerHTML = `
                    <p><strong>Question ${answer.questionNumber}:</strong> ${answer.questionText}</p>
                    <p class="${answer.answered ? (answer.isCorrect ? 'correct' : 'incorrect') : ''}">
                        Your answer: ${answer.userChoiceText}
                        ${answer.isCorrect ? '<i class="fas fa-check"></i>' : 
                        (answer.answered ? '<i class="fas fa-times"></i>' : '')}
                    </p>
                    ${!answer.isCorrect ? `
                        <p class="correct">
                            Correct answer: ${answer.correctAnswerText}
                            <i class="fas fa-check"></i>
                        </p>
                    ` : ''}
                    ${testData.questions[idx].explanation ? `
                        <div class="explanation">
                            <p><strong>Explanation:</strong></p>
                            <p>${testData.questions[idx].explanation}</p>
                        </div>
                    ` : ''}
                `;
                
                answersDiv.appendChild(answerDiv);
                    
                    // Animate each answer review with a staggered delay
                    setTimeout(() => {
                        answerDiv.style.transition = 'all 0.5s var(--animation-bounce)';
                        answerDiv.style.opacity = '1';
                        answerDiv.style.transform = 'translateY(0)';
                    }, 200 + (idx * 100));
                });
                
                // Show results container with animation
                resultContainer.style.display = 'block';
                resultContainer.style.opacity = '0';
                resultContainer.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    resultContainer.style.transition = 'all 0.6s var(--animation-bounce)';
                    resultContainer.style.opacity = '1';
                    resultContainer.style.transform = 'translateY(0)';
                }, 100);
                
                // Hide test components
                testContainer.style.display = 'none';
                questionPalette.style.display = 'none';
                document.getElementById('palette-toggle').style.display = 'none';
            }, 600);
        }
        
        // Initialize the test
        initializeTest();

        // Add CSS transitions to the current-question container
        document.addEventListener('DOMContentLoaded', function() {

                    </div>
                    <div class="summary-card">
                        <h3>Accuracy</h3>
                        <div class="value">${Math.round((correctCount / (attemptedCount || 1)) * 100)}%</div>
                    </div>
                </div>
                
                <h2>Question Review</h2>
                <div class="question-review">
            `;

            // Add each question and answer to the HTML content
            reviewAnswers.forEach((answer, idx) => {
                const question = testData.questions[idx];
                htmlContent += `
                    <div class="question">
                        <div class="question-header">
                            <strong>Question ${answer.questionNumber}</strong>
                            <span>${answer.isCorrect ? '+' : (answer.answered ? '-' : '0')}${question.marks.positive} marks</span>
                        </div>
                        <div class="question-text">${answer.questionText}</div>
                        <div class="user-answer ${answer.isCorrect ? 'correct' : (answer.answered ? 'incorrect' : 'unattempted')}">
                            <strong>${answer.answered ? 'Your answer: ' : 'Not attempted'}</strong> 
                            ${answer.answered ? answer.userChoiceText : ''}
                            ${answer.isCorrect ? ' ✓' : (answer.answered ? ' ✗' : '')}
                        </div>
                        ${!answer.isCorrect ? `
                            <div class="correct-answer">
                                <strong>Correct answer:</strong> ${answer.correctAnswerText}
                            </div>
                        ` : ''}
                        ${question.explanation ? `
                            <div class="explanation">
                                <div class="explanation-title">Explanation:</div>
                                <div>${question.explanation}</div>
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            // Close HTML content
            htmlContent += `
                </div>
                
                <div class="footer">
                    <p>&copy; 2025 KUNAL Test Platform. All rights reserved.</p>
                    <p>Created by @finallygotnirvana</p>
                </div>
            </body>
            </html>
            `;

            // Create a download link
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const downloadLink = document.createElement('a');
            downloadLink.href = url;
            
            // Format date for filename
            const date = new Date();
            const formattedDate = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            
            downloadLink.download = `Test_Analysis_${formattedDate}.html`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        document.addEventListener('keydown', function(e) {
            // Prevent default behavior for arrow keys
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                e.preventDefault();
            }

            switch(e.key) {
                case 'ArrowLeft':
                    goToPreviousQuestion();
                    break;
                case 'ArrowRight':
                    goToNextQuestion();
                    break;
                case 'ArrowUp':
                case 'ArrowDown':
                    // Get all options for the current question
                    const options = document.querySelectorAll('.option');
                    if (options.length === 0) return;

                    // Find currently selected option
                    let currentIndex = Array.from(options).findIndex(opt => opt.classList.contains('selected'));
                    
                    // Calculate new index
                    if (e.key === 'ArrowUp') {
                        currentIndex = currentIndex <= 0 ? options.length - 1 : currentIndex - 1;
                    } else {
                        currentIndex = currentIndex >= options.length - 1 ? 0 : currentIndex + 1;
                    }

                    // Select the new option
                    options.forEach(opt => opt.classList.remove('selected'));
                    options[currentIndex].classList.add('selected');
                    options[currentIndex].querySelector('input[type="radio"]').checked = true;
                    
                    // Update user answer
                    userAnswers[currentQuestionIndex] = currentIndex + 1;
                    updateQuestionPalette();
                    break;
                case 'b':
                case 'B':
                    toggleBookmark();
                    break;
            }
        });
    </script>
</body>
</html>
