as to take a meaningful break. <br /> According to a recent article in Harvard Business Review, one method is to detach psychologically from work. The mind has to be engaged in something removed from work. The authors suggest practising mindfulness as a solution. <br /> What did our forefathers do? One way was to practise evening sandhya, a practice prevalent throughout the land. It is performed at dusk, a time for transitioning from day activities to contemplation, of connecting with the Divine. In the past, everyone did it as dharm. The bindings of dharm are no longer applicable today. However, people can embrace proven methods from the past because they can help solve today’s problems. <br /> The key is to engage the mind and to train it to stay engaged. In this field, we can be proud of inheriting humanity’s treasure trove of knowledge. The time has come to unearth the eternal treasures and profit from them.​ <br /> <strong>Which of the following best reflects the author's stance on the work-life balance?</strong>", "options": ["1) It is impossible to achieve a work-life balance in today's fast-paced world.\n                                                                <input class=\"question_options0\" name=\"selected_option_176\" type=\"radio\" value=\"542717_131756\"/>\n<span class=\"checkmark radio_check0\"></span>", "2) Individuals must take personal responsibility to create their own work-life balance.\n                                                                <input checked=\"checked\" class=\"question_options1\" name=\"selected_option_176\" type=\"radio\" value=\"542718_131756\"/>\n<span class=\"checkmark radio_check1\"></span>", "3) The government should strictly regulate workplaces to ensure a balanced lifestyle.\n                                                                <input class=\"question_options2\" name=\"selected_option_176\" type=\"radio\" value=\"542719_131756\"/>\n<span class=\"checkmark radio_check2\"></span>", "4) Modern work environments are balanced and do not cause any harm to individuals.\n                                                                <input class=\"question_options3\" name=\"selected_option_176\" type=\"radio\" value=\"542720_131756\"/>\n<span class=\"checkmark radio_check3\"></span>"], "correct_answer": 2, "correct_option": "2) Individuals must take personal responsibility to create their own work-life balance.\n                                                                <input checked=\"checked\" class=\"question_options1\" name=\"selected_option_176\" type=\"radio\" value=\"542718_131756\"/>\n<span class=\"checkmark radio_check1\"></span>", "explanation": "B) Individuals must take personal responsibility to create their own work-life balance. <br /> A is incorrect because the author does not claim that work-life balance is impossible but suggests it is achievable through personal efforts. <br /> C is incorrect because while the author mentions the state has a role, they emphasize that there’s only so much the government can do, shifting the onus onto individuals. <br /> D is incorrect because the passage clearly discusses the toxicity and stress of modern work environments, suggesting they are indeed harmful. <br /> B is correct because the author advocates for personal responsibility in managing work-life balance, as seen in the recommendation to take control of one’s stress management.", "marks": {"positive": 1.0, "negative": 0.2}}, {"question_number": 178, "question_text": "<strong>Comprehension:</strong><br/>\r\nThe recent tragic death of a young woman working for a prestigious firm has evoked anguish, with so much being discussed about having a reasonable work-life balance. This highly qualified individual worked for a firm with presumably world-class corporate governance. However, there is only so much the human body can handle; lack of sleep, rest, and proper nutrition can destroy health. It is the responsibility of society and the state to protect the citizens when these things are violated. <br /> People have pointed out that the working environment in modern offices has become toxic and unhealthy. Perhaps they are right. But these are times of great revival in the nation, and a demanding work environment is an inescapable reality. This is the reality of the challenges, opportunities and rewards of the times, and there is only so much the state can do to regulate the modern workplace. So, it’s crucial that we, as individuals, take matters into our own hands to protect ourselves and our young. <br /> The first is to examine the work environment. A famous leader of our country was recently asked about what he does to relax, especially with the mind-boggling stress his job brings. His answer is revelatory and inspirational. He said his work was relaxation, an answer that aligned with India’s ethos. After all, our forefathers were emperors, merchants and scholars, and we can find their imprints across the globe. Even the most nationalistic Indians of today cannot claim to have surpassed their achievements. They did not have to resort to finding a balance because dharm governed their lives. Somewhere, in the mad rush for modernity and prosperity, we have abandoned principles based on ancient Indic wisdom, so work and workplaces have become so stressful. <br /> But what about life after work, which is supposed to act as a counterbalance? A cursory examination reveals that we are not doing enough to unwind; our activities are contrary. If work brings stress, we should do those things that counteract it. Watching movies on a mobile phone, binge shopping, or binge eating are not solutions. It is not enough to hit the gym; the workplace stress builds up during the day, and even thinking about it in the evening hampers recovery – the mind has to take a meaningful break. <br /> According to a recent article in Harvard Business Review, one method is to detach psychologically from work. The mind has to be engaged in something removed from work. The authors suggest practising mindfulness as a solution. <br /> What did our forefathers do? One way was to practise evening sandhya, a practice prevalent throughout the land. It is performed at dusk, a time for transitioning from day activities to contemplation, of connecting with the Divine. In the past, everyone did it as dharm. The bindings of dharm are no longer applicable today. However, people can embrace proven methods from the past because they can help solve today’s problems. <br /> The key is to engage the mind and to train it to stay engaged. In this field, we can be proud of inheriting humanity’s treasure trove of knowledge. The time has come to unearth the eternal treasures and profit from them.​ <br /> <strong>According to the passage, which of the following statements is TRUE regarding how modern individuals deal with stress after work?</strong>", "options": ["1) Engaging in binge shopping and eating effectively relieves stress.\n                                                                <input class=\"question_options0\" name=\"selected_option_177\" type=\"radio\" value=\"542721_131757\"/>\n<span class=\"checkmark radio_check0\"></span>", "2) Hitting the gym is the best way to counteract workplace stress.\n                                                                <input class=\"question_options1\" name=\"selected_option_177\" type=\"radio\" value=\"542722_131757\"/>\n<span class=\"checkmark radio_check1\"></span>", "3) Most post-work activities individuals engage in fail to provide meaningful recovery.\n                                                                <input checked=\"checked\" class=\"question_options2\" name=\"selected_option_177\" type=\"radio\" value=\"542723_131757\"/>\n<span class=\"checkmark radio_check2\"></span>", "4) Watching movies on a mobile phone provides a break for the mind.\n                                                                <input class=\"question_options3\" name=\"selected_option_177\" type=\"radio\" value=\"542724_131757\"/>\n<span class=\"checkmark radio_check3\"></span>"], "correct_answer": 3, "correct_option": "3) Most post-work activities individuals engage in fail to provide meaningful recovery.\n                                                                <input checked=\"checked\" class=\"question_options2\" name=\"selected_option_177\" type=\"radio\" value=\"542723_131757\"/>\n<span class=\"checkmark radio_check2\"></span>", "explanation": "C) Most post-work activities individuals engage in fail to provide meaningful recovery. <br /> A is incorrect because the passage mentions that binge shopping and eating are not solutions to stress. <br /> B is incorrect because although hitting the gym is mentioned, it is not seen as sufficient, as stress buildup continues to affect recovery. <br /> D is incorrect because the passage argues against using mobile phones to watch movies, as it is not considered a mental break. <br /> C is correct because the passage highlights that most post-work activities (like watching movies or binge eating) are ineffective at helping individuals unwind or meaningfully recover.", "marks": {"positive": 1.0, "negative": 0.2}}, {"question_number": 179, "question_text": "<strong>Comprehension:</strong><br/>\r\nThe recent tragic death of a young woman working for a prestigious firm has evoked anguish, with so much being discussed about having a reasonable work-life balance. This highly qualified individual worked for a firm with presumably world-class corporate governance. However, there is only so much the human body can handle; lack of sleep, rest, and proper nutrition can destroy health. It is the responsibility of society and the state to protect the citizens when these things are violated. <br /> People have pointed out that the working environment in modern offices has become toxic and unhealthy. Perhaps they are right. But these are times of great revival in the nation, and a demanding work environment is an inescapable reality. This is the reality of the challenges, opportunities and rewards of the times, and there is only so much the state can do to regulate the modern workplace. So, it’s crucial that we, as individuals, take matters into our own hands to protect ourselves and our young. <br /> The first is to examine the work environment. A famous leader of our country was recently asked about what he does to relax, especially with the mind-boggling stress his job brings. His answer is revelatory and inspirational. He said his work was relaxation, an answer that aligned with India’s ethos. After all, our forefathers were emperors, merchants and scholars, and we can find their imprints across the globe. Even the most nationalistic Indians of today cannot claim to have surpassed their achievements. They did not have to resort to finding a balance because dharm governed their lives. Somewhere, in the mad rush for modernity and prosperity, we have abandoned principles based on ancient Indic wisdom, so work and workplaces have become so stressful. <br /> But what about life after work, which is supposed to act as a counterbalance? A cursory examination reveals that we are not doing enough to unwind; our activities are contrary. If work brings stress, we should do those things that counteract it. Watching movies on a mobile phone, binge shopping, or binge eating are not solutions. It is not enough to hit the gym; the workplace stress builds up during the day, and even thinking about it in the evening hampers recovery – the mind has to take a meaningful break. <br /> According to a recent article in Harvard Business Review, one method is to detach psychologically from work. The mind has to be engaged in something removed from work. The authors suggest practising mindfulness as a solution. <br /> What did our forefathers do? One way was to practise evening sandhya, a practice prevalent throughout the land. It is performed at dusk, a time for transitioning from day activities to contemplation, of connecting with the Divine. In the past, everyone did it as dharm. The bindings of dharm are no longer applicable today. However, people can embrace proven methods from the past because they can help solve today’s problems. <br /> The key is to engage the mind and to train it to stay engaged. In this field, we can be proud of inheriting humanity’s treasure trove of knowledge. The time has come to unearth the eternal treasures and profit from them.​ <br /> <strong>Based on the passage, which of the following can be inferred about the author’s view on ancient practices like evening sandhya?</strong>", "options": ["1) Ancient practices like evening sandhya are outdated and irrelevant in the modern world.\n                                                                <input class=\"question_options0\" name=\"selected_option_178\" type=\"radio\" value=\"542725_131758\"/>\n<span class=\"checkmark radio_check0\"></span>", "2) Practicing mindfulness is more effective than ancient methods in dealing with stress.\n                                                                <input class=\"question_options1\" name=\"selected_option_178\" type=\"radio\" value=\"542726_131758\"/>\n<span class=\"checkmark radio_check1\"></span>", "3) The author believes ancient practices can still be relevant and beneficial today.\n                                                                <input checked=\"checked\" class=\"question_options2\" name=\"selected_option_178\" type=\"radio\" value=\"542727_131758\"/>\n<span class=\"checkmark radio_check2\"></span>", "4) The decline of dharm-based practices has led to the downfall of society.\n                                                                <input class=\"question_options3\" name=\"selected_option_178\" type=\"radio\" value=\"542728_131758\"/>\n<span class=\"checkmark radio_check3\"></span>"], "correct_answer": 3, "correct_option": "3) The author believes ancient practices can still be relevant and beneficial today.\n                                                                <input checked=\"checked\" class=\"question_options2\" name=\"selected_option_178\" type=\"radio\" value=\"542727_131758\"/>\n<span class=\"checkmark radio_check2\"></span>", "explanation": "C) The author believes ancient practices can still be relevant and beneficial today. <br /> A is incorrect because the author suggests that although the bindings of dharm are no longer applicable, ancient practices still hold value and can help solve modern problems. <br /> B is incorrect because the author does not argue that mindfulness is more effective than ancient methods but highlights the importance of both approaches. <br /> D is incorrect because the passage doesn’t state that society’s downfall is due to the decline of dharm-based practices, but rather emphasizes a lost opportunity to utilize beneficial methods. <br /> C is correct because the author explicitly mentions that embracing proven methods from the past, like evening sandhya, can help solve today’s problems, making them relevant and useful.", "marks": {"positive": 1.0, "negative": 0.2}}, {"question_number": 180, "question_text": "<strong>Comprehension:</strong><br/>\r\nThe recent tragic death of a young woman working for a prestigious firm has evoked anguish, with so much being discussed about having a reasonable work-life balance. This highly qualified individual worked for a firm with presumably world-class corporate governance. However, there is only so much the human body can handle; lack of sleep, rest, and proper nutrition can destroy health. It is the responsibility of society and the state to protect the citizens when these things are violated. <br /> People have pointed out that the working environment in modern offices has become toxic and unhealthy. Perhaps they are right. But these are times of great revival in the nation, and a demanding work environment is an inescapable reality. This is the reality of the challenges, opportunities and rewards of the times, and there is only so much the state can do to regulate the modern workplace. So, it’s crucial that we, as individuals, take matters into our own hands to protect ourselves and our young. <br /> The first is to examine the work environment. A famous leader of our country was recently asked about what he does to relax, especially with the mind-boggling stress his job brings. His answer is revelatory and inspirational. He said his work was relaxation, an answer that aligned with India’s ethos. After all, our forefathers were emperors, merchants and scholars, and we can find their imprints across the globe. Even the most nationalistic Indians of today cannot claim to have surpassed their achievements. They did not have to resort to finding a balance because dharm governed their lives. Somewhere, in the mad rush for modernity and prosperity, we have abandoned principles based on ancient Indic wisdom, so work and workplaces have become so stressful. <br /> But what about life after work, which is supposed to act as a counterbalance? A cursory examination reveals that we are not doing enough to unwind; our activities are contrary. If work brings stress, we should do those things that counteract it. Watching movies on a mobile phone, binge shopping, or binge eating are not solutions. It is not enough to hit the gym; the workplace stress builds up during the day, and even thinking about it in the evening hampers recovery – the mind has to take a meaningful break. <br /> According to a recent article in Harvard Business Review, one method is to detach psychologically from work. The mind has to be engaged in something removed from work. The authors suggest practising mindfulness as a solution. <br /> What did our forefathers do? One way was to practise evening sandhya, a practice prevalent throughout the land. It is performed at dusk, a time for transitioning from day activities to contemplation, of connecting with the Divine. In the past, everyone did it as dharm. The bindings of dharm are no longer applicable today. However, people can embrace proven methods from the past because they can help solve today’s problems. <br /> The key is to engage the mind and to train it to stay engaged. In this field, we can be proud of inheriting humanity’s treasure trove of knowledge. The time has come to unearth the eternal treasures and profit from them.​ <br /> <strong>Which of the following statements best aligns with the main argument presented in the passage?</strong>", "options": ["1) The modern solution to stress lies in adopting completely new methods, unrelated to ancient practices.\n                                                                <input class=\"question_options0\" name=\"selected_option_179\" type=\"radio\" value=\"542729_131759\"/>\n<span class=\"checkmark radio_check0\"></span>", "2) A balance between modern techniques like mindfulness and ancient practices can address today’s mental health challenges.\n                                                                <input checked=\"checked\" class=\"question_options1\" name=\"selected_option_179\" type=\"radio\" value=\"542730_131759\"/>\n<span class=\"checkmark radio_check1\"></span>", "3) The past holds no answers to today’s stress management, and only contemporary psychology can provide solutions.\n                                                                <input class=\"question_options2\" name=\"selected_option_179\" type=\"radio\" value=\"542731_131759\"/>\n<span class=\"checkmark radio_check2\"></span>", "4) Practicing evening sandhya alone is sufficient to deal with workplace stress and related issues.\n                                                                <input class=\"question_options3\" name=\"selected_option_179\" type=\"radio\" value=\"542732_131759\"/>\n<span class=\"checkmark radio_check3\"></span>"], "correct_answer": 2, "correct_option": "2) A balance between modern techniques like mindfulness and ancient practices can address today’s mental health challenges.\n                                                                <input checked=\"checked\" class=\"question_options1\" name=\"selected_option_179\" type=\"radio\" value=\"542730_131759\"/>\n<span class=\"checkmark radio_check1\"></span>", "explanation": "B) A balance between modern techniques like mindfulness and ancient practices can address today’s mental health challenges. <br /> A is incorrect because the passage encourages drawing on both modern and ancient methods, not only new methods. <br /> C is incorrect because the author promotes revisiting ancient wisdom, which contradicts the idea that only contemporary psychology is useful. <br /> D is incorrect because the author does not suggest that evening sandhya alone is sufficient; rather, it is one of many practices that can help. <br /> B is correct because the passage advocates for utilizing both mindfulness (a modern technique) and practices like evening sandhya (an ancient method) as a balanced approach to managing stress.", "marks": {"positive": 1.0, "negative": 0.2}}, {"question_number": 181, "question_text": "<strong>Comprehension:</strong><br/>\r\nNo one says, “I do not want to be happy.” Everyone is looking for happiness in different places. Consuming as much as possible is also a source of happiness, points out Prof Samdhong Rinpoche, speaking at the ‘Spirit of Tibet’ festival held in Delhi recently. Anything that brings temporary happiness like possession of material goods, will only create more greed, and an unending circle of joy and sorrow. Your happiness should not become the cause of unhappiness. To define happiness is a slippery task as each one of us has a different notion of happiness. Happiness is really a mindset, a mental attitude. Your body may experience disease and pain, while your mind might be happy. Conversely, your body may be fit and healthy, but your mind is filled with unhappiness due to turmoil. Therefore, you need to discover what makes you unhappy and overcome that root cause. Very often, the root cause of unhappiness is avidya, ignorance. To cultivate inner wisdom, you need to be disciplined, in mind and body. Happiness is not a set of emotions but a cessation of all negative emotions. When you are at peace, free of contamination, that is happiness. Sustainable happiness comes with nirvana. But most people do not experience nirvana. <br /> Buddhists talk of equality of all sentient beings on three basic grounds. First, no living being wants unhappiness. Second, the basic nature of consciousness in every individual is the same. Everyone has the right to seek happiness and avoid unhappiness. Third, every individual has the potential to evolve to buddha nature. <br /> Since we are all equal, an individual’s approach to all sentient beings has to be with a sense of equilibrium. The basis of happiness is understanding equanimity, so that one can feel the oneness that is built into the web of life. Shantideva asks, why worry about problems, why not seek remedies instead? Prof Samdhong Rinpoche talked of how unfulfilled desires, fear, anxiety, jealousy and anger are all causes of unhappiness. If anger is the cause of your discomfort, find out the root cause of that anger and try to overcome it. Learn to differentiate between actor and action. The Buddha did not see the person with negative emotions as the enemy; he recognised kleshas, negativities, as enemy. <br /> In other words, hate the sin but love the sinner. Avoid violent action. Only something that is the opposite nature of fire, can put out the fire. Overcome anger with compassion, violence with love. Under the complete influence of negative emotions, the actor has no freedom and so no control over himself. Hence, we need to address the cause and not the symptom. <br /> When you react in anger or anxiety, you become its ally and the first outcome will be violence. Unless you are compassionate, you cannot counter kleshas. Understand your needs. This is important because you are indoctrinated to need or want more than is necessary. <br /> Gandhiji promoted control of oneself. This will give you freedom to think and recognise who you are. When you compare yourself with others, you forget your true identity and personality. Never get brainwashed into believing what others say about you, that you are stupid or a coward. Free your mind. Be happy. <br /> <strong>What is the tone of the passage?</strong>", "options": ["1) Philosophical\n                                                                <input checked=\"checked\" class=\"question_options0\" name=\"selected_option_180\" type=\"radio\" value=\"542733_131760\"/>\n<span class=\"checkmark radio_check0\"></span>", "2) Critical\n                                                                <input class=\"question_options1\" name=\"selected_option_180\" type=\"radio\" value=\"542734_131760\"/>\n<span class=\"checkmark radio_check1\"></span>", "3) Optimistic\n                                                                <input class=\"question_options2\" name=\"selected_option_180\" type=\"radio\" value=\"542735_131760\"/>\n<span class=\"checkmark radio_check2\"></span>", "4) Aggressive\n                                                                <input class=\"question_options3\" name=\"selected_option_180\" type=\"radio\" value=\"542736_131760\"/>\n<span class=\"checkmark radio_check3\"></span>"], "correct_answer": 1, "correct_option": "1) Philosophical\n                                                                <input checked=\"checked\" class=\"question_options0\" name=\"selected_option_180\" type=\"radio\" value=\"542733_131760\"/>\n<span class=\"checkmark radio_check0\"></span>", "explanation": "A)Philosophical <br /> A. This is the correct answer because the passage delves deeply into the nature of happiness and inner peace, discussing concepts like nirvana, equanimity, and self-control, which are hallma y often, the root cause of unhappiness is avidya, ignorance. To cultivate inner wisdom, you need to be disciplined, in mind and body. Happiness is not a set of emotions but a cessation of all negative emotions. When you are at peace, free of contamination, that is happiness. Sustainable happiness comes with nirvana. But most people do not experience nirvana. <br /> Buddhists talk of equality of all sentient beings on three basic grounds. First, no living being wants unhappiness. Second, the basic nature of consciousness in every individual is the same. Everyone has the right to seek happiness and avoid unhappiness. Third, every individual has the potential to evolve to buddha nature. <br /> Since we are all equal, an individual’s approach to all sentient beings has to be with a sense of equilibrium. The basis of happiness is understanding equanimity, so that one can feel the oneness that is built into the web of life. Shantideva asks, why worry about problems, why not seek remedies instead? Prof Samdhong Rinpoche talked of how unfulfilled desires, fear, anxiety, jealousy and anger are all causes of unhappiness. If anger is the cause of your discomfort, find out the root cause of that anger and try to overcome it. Learn to differentiate between actor and action. The Buddha did not see the person with negative emotions as the enemy; he recognised kleshas, negativities, as enemy. <br /> In other words, hate the sin but love the sinner. Avoid violent action. Only something that is the opposite nature of fire, can put out the fire. Overcome anger with compassion, violence with love. Under the complete influence of negative emotions, the actor has no freedom and so no control over himself. Hence, we need to address the cause and not the symptom. <br /> When you react in anger or anxiety, you become its ally and the first outcome will be violence. Unless you are compassionate, you cannot counter kleshas. Understand your needs. This is important because you are indoctrinated to need or want more than is necessary. <br /> Gandhiji promoted control of oneself. This will give you freedom to think and recognise who you are. When you compare yourself with others, you forget your true identity and personality. Never get brainwashed into believing what others say about you, that you are stupid or a coward. Free your mind. Be happy. <br /> <strong>Which of the following best summarizes the central idea of the passage?</strong> <br /> i Unhappiness is primarily caused by external circumstances, and one should change their environment to achieve inner peace. <br /> ii Unhappiness arises from negative emotions like anger and jealousy, and it is crucial to understand and address these emotions to attain true happiness. <br /> iii Practicing anger and violence helps one understand the cause of their negative emotions and thus overcome them. <br /> iv Compassion, self-control, and understanding one’s true needs are the key methods to counter negative emotions and find happiness.", "options": ["1) i and iii\n                                                                <input class=\"question_options0\" name=\"selected_option_184\" type=\"radio\" value=\"542749_131764\"/>\n<span class=\"checkmark radio_check0\"></span>", "2) ii and iv\n                                                                <input checked=\"checked\" class=\"question_options1\" name=\"selected_option_184\" type=\"radio\" value=\"542750_131764\"/>\n<span class=\"checkmark radio_check1\"></span>", "3) i and ii\n                                                                <input class=\"question_options2\" name=\"selected_option_184\" type=\"radio\" value=\"542751_131764\"/>\n<span class=\"checkmark radio_check2\"></span>", "4) iii and iv\n                                                                <input class=\"question_options3\" name=\"selected_option_184\" type=\"radio\" value=\"542752_131764\"/>\n<span class=\"checkmark radio_check3\"></span>"], "correct_answer": 2, "correct_option": "2) ii and iv\n                                                                <input checked=\"checked\" class=\"question_options1\" name=\"selected_option_184\" type=\"radio\" value=\"542750_131764\"/>\n<span class=\"checkmark radio_check1\"></span>", "explanation": "B) ii and iv <br /> ii and iv are correct: Both options ii and iv focus on the passage’s emphasis on identifying the root causes of negative emotions (like anger and jealousy) and using compassion, self-control, and self-understanding to overcome them. This aligns perfectly with the passage’s central idea. <br /> i is incorrect: It suggests that external circumstances are the primary cause of unhappiness, which is not discussed in the passage. <br /> iii is incorrect: It misinterprets the passage by suggesting that practicing negative emotions can help overcome them, which contradicts the author's message.", "marks": {"positive": 1.0, "negative": 0.2}}, {"question_number": 186, "question_text": "<strong>Comprehension:</strong> <br /> India has solidified its defence partnership with the United States through two pivotal agreements, signaling a deepening American commitment to South Asia at a time when China's military influence is expanding across the region. The agreements, secured during Indian Defence Minister Rajnath Singh's recent four-day visit to the United States, include a Security of Supply Arrangement (SOSA) and a Memorandum of Agreement on the Assignment of Liaison Officers. These developments underscore a significant shift in the dynamics of Indo-US relations, with both nations moving closer in their defence cooperation. The SOSA, a non-binding bilateral pact, is designed to prioritise support for defence-related goods and services between the two countries. This agreement is particularly crucial in addressing supply chain vulnerabilities that are critical to national security. Under the SOSA, India will receive assurances from Washington’s Defence Priorities and Allocations System, while Indian companies will provide priority support to the United States. India's inclusion in the elite group of 18 SOSA partners, which includes nations like Australia, Canada, and Britain, marks a significant step in defence cooperation. <br /> In effect it means if either of two nations ended up in combat with an adversary, the SOSA could help accelerate the delivery of crucial weapons and materials required for defence, thereby ensuring robust supply chains in times of crisis. India and the United States have already established several key strategic agreements, including the Logistics Exchange Memorandum of Agreement (LEMOA) signed in 2016 and real-time intelligence sharing since 2018 under the Communications Compatibility and Security Agreement (COMCASA). These agreements, alongside the new SOSA, create a framework for expedited deliveries of contracted goods and services, potentially streamlining defence commerce between the two nations. In 2019, the signing of the Industrial Security Annex marked another significant step, allowing the sharing of classified US information with private Indian defence firms-a departure from previous restrictions. The Reciprocal Defence Procurement Agreement could further streamline defence commerce, enabling private companies in both countries to bid on each other's contracts. Indeed, a technologically advanced Indian military aligns with American interests. The recent Indo-US defence agreements mark a significant milestone in the evolving relationship between the two nations. As China's influence continues to grow across South Asia, particularly in Islamabad and the Maldives, these agreements provide a foundation for enhanced collaboration and a shared commitment to regional stability. With these developments, India and the United States are poised to further deepen their defence ties, building a partnership that could play a crucial role in shaping the future of the region. <br /> <strong>Which of the follo         window.addEventListener('load', updatePaletteToggleDisplay);
        window.addEventListener('resize', updatePaletteToggleDisplay);

        function handleKeyPress(event) {
            console.log('Key pressed:', event.key); // Add debug logging
            
            // Ignore keyboard shortcuts if user is typing in an input field
            if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') {
                return;
            }

            // Ignore keyboard shortcuts if test is submitted
            if (document.getElementById('result').style.display === 'block') {
                return;
            }

            // Prevent default behavior for arrow keys and numbers to avoid page scrolling
            if (['ArrowLeft', 'ArrowRight', '1', '2', '3', '4'].includes(event.key)) {
                event.preventDefault();
            }

            switch(event.key) {
                case 'ArrowLeft':
                    if (currentQuestionIndex > 0) {
                        goToPreviousQuestion();
                    }
                    break;
                case 'ArrowRight':
                    if (currentQuestionIndex < testData.questions.length - 1) {
                        goToNextQuestion();
                    }
                    break;
                case 'b':
                case 'B':
                    toggleBookmark();
                    break;
                case 'Enter':
                    if (currentQuestionIndex === testData.questions.length - 1) {
                        showReviewWarning();
                    } else {
                        goToNextQuestion();
                    }
                    break;
                case '1':
                case '2':
                case '3':
                case '4':
                    const optionIndex = parseInt(event.key) - 1;
                    const options = document.querySelectorAll('.option');
                    if (options[optionIndex]) {
                        // Add visual feedback for option selection
                        options[optionIndex].classList.add('keyboard-selected');
                        
                        // Actually select the option
                        const radio = options[optionIndex].querySelector('input[type="radio"]');
                        if (radio) {
                            radio.checked = true;
                            userAnswers[currentQuestionIndex] = optionIndex + 1;
                            
                            // Update the option's visual state
                            options.forEach(opt => opt.classList.remove('selected'));
                            options[optionIndex].classList.add('selected');
                            
                            // Update the question palette
                            updateQuestionPalette();
                        }
                        
                        // Remove the selection effect after animation
                        setTimeout(() => {
                            options[optionIndex].classList.remove('keyboard-selected');
                        }, 200);
                    }
                    break;
            }
        }

        function setupQuestionPalette() {
            const palette = document.getElementById('question-palette');
            palette.innerHTML = '';
            
            for (let i = 0; i < testData.questions.length; i++) {
                const item = document.createElement('div');
                item.className = 'palette-item not-visited';
                item.textContent = i + 1;
                item.addEventListener('click', () => {
                    showQuestion(i);
                    // Close the palette if it's currently visible (for mobile view)
                    const paletteElement = document.querySelector('.question-palette');
                    if (paletteElement.classList.contains('visible')) {
                        toggleQuestionPalette();
                    }
                });
                palette.appendChild(item);
            }
            
            // Ensure palette toggle button is visible on mobile
            updatePaletteToggleDisplay();
        }

        function updateQuestionPalette() {
            const items = document.querySelectorAll('.palette-item');
            items.forEach((item, index) => {
                item.className = 'palette-item';
                
                // Only add status classes if the question has been visited
                if (visitedQuestions.has(index)) {
                    if (bookmarkedQuestions.has(index)) {
                        item.classList.add('marked-review');
                    } else if (userAnswers[index] !== null) {
                        item.classList.add('answered');
                    } else {
                        item.classList.add('not-answered');
                    }
                } else {
                    item.classList.add('not-visited');
                }
                
                if (index === currentQuestionIndex) {
                    item.classList.add('active');
                }
            });
        }

        function filterQuestions(filter) {
            const items = document.querySelectorAll('.palette-item');
            items.forEach((item, index) => {
                const isMarkedReview = bookmarkedQuestions.has(index);
                const isAnswered = userAnswers[index] !== null;
                const isVisited = visitedQuestions.has(index);
                
                switch(filter) {
                    case 'answered':
                        item.style.display = isAnswered ? 'flex' : 'none';
                        break;
                    case 'not-answered':
                        item.style.display = (isVisited && !isAnswered) ? 'flex' : 'none';
                        break;
                    case 'marked-review':
                        item.style.display = isMarkedReview ? 'flex' : 'none';
                        break;
                    default:
                        item.style.display = 'flex';
                }
            });
        }
        
        function setupTimer() {
            const duration = parseFloat(testData.test_info.duration);
            let timeLeft = Math.floor(duration * 60);
            const timerElement = document.getElementById('timer');
            
            timerInterval = setInterval(() => {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                
                if (timeLeft <= 300) { // 5 minutes warning
                    timerElement.classList.add('timer-warning');
                }
                
                timerElement.innerHTML = `
                    <i class="fas fa-clock"></i>
                    Time Remaining: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}
                `;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitTest();
                }
                
                timeLeft--;
            }, 1000);
        }
        
        function showQuestion(index) {
            currentQuestionIndex = index;
            // Mark question as visited when opened
            visitedQuestions.add(index);
            const question = testData.questions[index];
            const container = document.getElementById('current-question');
            
            // Add fade-out animation
            container.style.opacity = '0';
            container.style.transform = 'translateY(10px)';
            
            setTimeout(() => {
                container.innerHTML = `
                    <div class="question-container">
                        <div class="question-number">
                            <span>Question ${question.question_number} of ${testData.questions.length}</span>
                            <span class="marks-info">
                                <i class="fas fa-plus-circle"></i> ${question.marks.positive}
                                <i class="fas fa-minus-circle"></i> ${question.marks.negative}
                            </span>
                        </div>
                        <div class="question">${question.question_text}</div>
                        <div class="options">
                            ${question.options.map((option, optIndex) => `
                                <label class="option ${userAnswers[index] === optIndex + 1 ? 'selected' : ''}">
                                    <input type="radio" name="question${index}" value="${optIndex + 1}" 
                                        ${userAnswers[index] === optIndex + 1 ? 'checked' : ''}>
                                        <div class="option-content">
                                    <span class="option-number">${optIndex + 1}</span> ${option}
                                        </div>
                                </label>
                            `).join('')}
                        </div>
                        <div style="flex-grow: 1;"></div>
                    </div>
                `;
                
                // Update bookmark button
                const bookmarkBtn = document.getElementById('bookmark-btn');
                bookmarkBtn.classList.toggle('active', bookmarkedQuestions.has(index));
                bookmarkBtn.innerHTML = bookmarkedQuestions.has(index) 
                    ? '<i class="fas fa-flag"></i> Marked for Review'
                    : '<i class="far fa-flag"></i> Mark for Review <span class="shortcut-hint">(B)</span>';
                
                // Add event listeners to options
                const options = container.querySelectorAll('.option');
                    options.forEach((option, optIdx) => {
                    option.addEventListener('click', function() {
                        const radio = this.querySelector('input[type="radio"]');
                        radio.checked = true;
                        
                            options.forEach(opt => {
                                opt.classList.remove('selected');
                                opt.style.transform = 'translateX(0)';
                            });
                            
                            // Animate the selected option
                        this.classList.add('selected');
                            this.style.transform = 'translateX(10px)';
                        
                        userAnswers[index] = parseInt(radio.value);
                        updateQuestionPalette();

                            // Highlight the option number with a pulse animation
                        const optionNumber = this.querySelector('.option-number');
                        optionNumber.style.animation = 'pulse 0.5s ease';
                        setTimeout(() => {
                            optionNumber.style.animation = '';
                        }, 500);
                });

                        // Add a small delay to each option's appearance
                        option.style.opacity = '0';
                        option.style.transform = 'translateX(20px)';
                        setTimeout(() => {
                            option.style.opacity = '1';
                            option.style.transform = 'translateX(0)';
                        }, 100 + (optIdx * 50));
                    });
                    
                    // Fade in the content
                    setTimeout(() => {
                        container.style.opacity = '1';
                        container.style.transform = 'translateY(0)';
                    }, 50);
                
                // Update navigation buttons
                updateNavigationButtons();
                
                // Update question palette
                updateQuestionPalette();
                }, 150);
        }
        
        function updateNavigationButtons() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const submitBtn = document.getElementById('submit-test');
            
            prevBtn.disabled = currentQuestionIndex === 0;
            
            if (currentQuestionIndex === testData.questions.length - 1) {
                nextBtn.style.display = 'none';
                submitBtn.style.display = 'block';
            } else {
                nextBtn.style.display = 'block';
                submitBtn.style.display = 'none';
            }
        }
        
        function goToPreviousQuestion() {
            if (currentQuestionIndex > 0) {
                showQuestion(currentQuestionIndex - 1);
            }
        }
        
        function goToNextQuestion() {
            if (currentQuestionIndex < testData.questions.length - 1) {
                showQuestion(currentQuestionIndex + 1);
            }
        }

        function toggleBookmark() {
            const btn = document.getElementById('bookmark-btn');
            if (bookmarkedQuestions.has(currentQuestionIndex)) {
                bookmarkedQuestions.delete(currentQuestionIndex);
                btn.classList.remove('active');
                btn.innerHTML = `
                    <i class="far fa-flag"></i> 
                    Mark for Review <span class="shortcut-hint">(B)</span>
                `;
            } else {
                bookmarkedQuestions.add(currentQuestionIndex);
                btn.classList.add('active');
                btn.innerHTML = `
                    <i class="fas fa-flag"></i> 
                    Marked for Review
                `;
            }
            updateQuestionPalette();
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.body.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
            const themeToggle = document.getElementById('theme-toggle');
            themeToggle.innerHTML = `<i class="fas fa-${isDarkMode ? 'sun' : 'moon'}"></i>`;
        }

        function showReviewWarning() {
            // Skip the warning and directly submit the test
            submitTest();
        }
        
        function submitTest() {
            // Add submission animation
            const testContainer = document.getElementById('test-container');
            const questionPalette = document.querySelector('.question-palette');
            const resultContainer = document.getElementById('result');
            
            // Animate test container sliding out
            testContainer.style.transition = 'all 0.5s var(--animation-bounce)';
            testContainer.style.transform = 'translateX(-50px)';
            testContainer.style.opacity = '0';
            
            // Animate question palette fading out
            questionPalette.style.transition = 'all 0.5s var(--animation-bounce)';
            questionPalette.style.transform = 'translateX(50px)';
            questionPalette.style.opacity = '0';
            
            // Clear the timer
            clearInterval(timerInterval);
            
            // Calculate results with a slight delay for animation
            setTimeout(() => {
            let score = 0;
            let correctCount = 0;
            let attemptedCount = 0;
            const reviewAnswers = [];
            
            // Calculate score and statistics
            testData.questions.forEach((question, index) => {
                const userAnswer = userAnswers[index];
                const isCorrect = userAnswer === question.correct_answer;
                
                if (userAnswer !== null) {
                    attemptedCount++;
                    if (isCorrect) {
                        score += question.marks.positive;
                        correctCount++;
                    } else {
                        score -= question.marks.negative;
                    }
                }
                
                reviewAnswers.push({
                    questionNumber: question.question_number,
                    questionText: question.question_text,
                    userChoice: userAnswer,
                    userChoiceText: userAnswer !== null ? question.options[userAnswer - 1] : 'Not answered',
                    correctAnswer: question.correct_answer,
                    correctAnswerText: question.correct_option,
                    isCorrect: isCorrect,
                    answered: userAnswer !== null
                });
            });
            
            // Update statistics
            document.getElementById('total-questions').textContent = testData.questions.length;
            document.getElementById('attempted-questions').textContent = attemptedCount;
            document.getElementById('correct-answers').textContent = correctCount;
            document.getElementById('accuracy').textContent = 
                `${Math.round((correctCount / (attemptedCount || 1)) * 100)}%`;
            
            // Display score
            document.getElementById('score').innerHTML = `
                <div style="font-size: 36px; color: var(--primary-color);">
                    ${score.toFixed(2)} / ${testData.questions.length * testData.questions[0].marks.positive}
                </div>
                <div style="color: var(--text-color); margin-top: 10px;">
                    Percentage: ${Math.round((score / (testData.questions.length * testData.questions[0].marks.positive)) * 100)}%
                </div>
            `;
            
            // Create performance chart
            const chartContainer = document.getElementById('performance-chart');
            chartContainer.innerHTML = ''; // Clear previous chart if any
            const ctx = document.createElement('canvas');
            chartContainer.appendChild(ctx);
                
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Correct', 'Incorrect', 'Not Attempted'],
                    datasets: [{
                        data: [
                            correctCount,
                            attemptedCount - correctCount,
                            testData.questions.length - attemptedCount
                        ],
                        backgroundColor: [
                                '#16a34a', // Fixed success green
                                '#dc2626', // Fixed error red
                                '#8b5cf6'  // Fixed purple for not attempted
                        ],
                            borderColor: 'var(--bg-color)',
                        borderWidth: 2,
                            hoverOffset: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                                display: false
                            },
                            tooltip: {
                                backgroundColor: 'var(--bg-color)',
                                titleColor: 'var(--text-color)',
                                bodyColor: 'var(--text-color)',
                                borderColor: 'var(--border-color)',
                                borderWidth: 1,
                                padding: 12,
                                boxPadding: 6,
                                usePointStyle: true,
                                callbacks: {
                                    label: function(context) {
                                        let label = context.label || '';
                                        let value = context.raw || 0;
                                        let total = context.dataset.data.reduce((a, b) => a + b, 0);
                                        let percentage = Math.round((value / total) * 100);
                                        return `${label}: ${value} (${percentage}%)`;
                                    }
                                }
                            },
                            title: {
                                display: true,
                                text: 'Test Performance',
                                color: 'var(--text-color)',
                                font: {
                                    family: 'Inter, sans-serif',
                                    size: 16,
                                    weight: '600'
                                },
                                padding: {
                                    bottom: 15
                            }
                        }
                    },
                    cutout: '65%',
                    animation: {
                        animateScale: true,
                        animateRotate: true,
                            duration: 1500,
                            easing: 'easeOutQuart'
                    }
                }
            });
                
                // Replace the chart's built-in legend with a custom one
                const customLegend = document.createElement('div');
                customLegend.className = 'custom-chart-legend';

                chartContainer.appendChild(customLegend);
            
            // Update the analytics container title
            document.querySelector('.analytics-container h3').innerHTML = 
                '<i class="fas fa-chart-pie"></i> Performance Analysis';
            
            // Add event listener to the download analysis buttons with a small delay to ensure UI is ready
            setTimeout(() => {
                const downloadBtn = document.getElementById('download-analysis');
                const bottomDownloadBtn = document.getElementById('bottom-download-analysis');
                if (downloadBtn) {
                    downloadBtn.addEventListener('click', function() {
                        downloadAnalysis(testData, reviewAnswers, score, correctCount, attemptedCount);
                    });
                }
                if (bottomDownloadBtn) {
                    bottomDownloadBtn.addEventListener('click', function() {
                        downloadAnalysis(testData, reviewAnswers, score, correctCount, attemptedCount);
                    });
                }
            }, 500);
            
            // Fix any palette toggle issue
            if (window.innerWidth <= 768) {
                const paletteToggle = document.getElementById('palette-toggle');
                if (paletteToggle) {
                    paletteToggle.style.display = 'flex';
                }
                
                // Add close button to palette if not exists
                const palette = document.querySelector('.question-palette');
                if (palette && !document.querySelector('.palette-close-btn')) {
                    const closeBtn = document.createElement('button');
                    closeBtn.className = 'palette-close-btn';
                    closeBtn.innerHTML = '<i class="fas fa-times"></i>';
                    closeBtn.addEventListener('click', toggleQuestionPalette);
                    
                    const paletteHeader = palette.querySelector('.palette-header');
                    if (paletteHeader) {
                        paletteHeader.appendChild(closeBtn);
                    }
                }
            }
            
                // Display answer review with staggered animation
            const answersDiv = document.getElementById('answers');
            answersDiv.innerHTML = '<h3>Answer Review:</h3>';
            
                reviewAnswers.forEach((answer, idx) => {

                        ${answer.isCorrect ? '<i class="fas fa-check"></i>' : 
                        (answer.answered ? '<i class="fas fa-times"></i>' : '')}
                    </p>
                    ${!answer.isCorrect ? `
                        <p class="correct">
                            Correct answer: ${answer.correctAnswerText}
                            <i class="fas fa-check"></i>

                    ${testData.questions[idx].explanation ? `
                        <div class="explanation">
                            <p><strong>Explanation:</strong></p>
                            <p>${testData.questions[idx].explanation}</p>
                        </div>
                    ` : ''}
                `;
                
                answersDiv.appendChild(answerDiv);
                    
                    // Animate each answer review with a staggered delay
                    setTimeout(() => {
                        answerDiv.style.transition = 'all 0.5s var(--animation-bounce)';
                        answerDiv.style.opacity = '1';
                        answerDiv.style.transform = 'translateY(0)';
                    }, 200 + (idx * 100));
                });
                
                // Show results container with animation
                resultContainer.style.display = 'block';
                resultContainer.style.opacity = '0';
                resultContainer.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    resultContainer.style.transition = 'all 0.6s var(--animation-bounce)';
                    resultContainer.style.opacity = '1';
                    resultContainer.style.transform = 'translateY(0)';
                }, 100);
                
                // Hide test components
                testContainer.style.display = 'none';
                questionPalette.style.display = 'none';
                document.getElementById('palette-toggle').style.display = 'none';
            }, 600);
        }

                    }
                    /* Responsive fixes */
                    @media (max-width: 768px) {
                        body {
                            padding: 10px;
                        }
                        .summary {
                            grid-template-columns: 1fr;
                        }
                        .score-highlight .score {
                            font-size: 36px;
                        }
                        .question-header {
                            flex-direction: column;
                            align-items: flex-start;
                        }
                    }
                </style>
            </head>
            <body>
                <div class="header">
                    <h1>${testData.test_info.title}</h1>
                    <div class="date">Generated on: ${new Date().toLocaleString()}</div>
                </div>
                
                <div class="score-highlight">
                    <div class="score">${score.toFixed(2)} / ${maxScore}</div>
                    <div class="percentage">Percentage: ${percentage}%</div>
                </div>
                
                <div class="summary">
                    <div class="summary-card">
                        <h3>Total Questions</h3>
                        <div class="value">${testData.questions.length}</div>
                    </div>
                    <div class="summary-card">
                        <h3>Attempted</h3>
                        <div class="value">${attemptedCount}</div>
                    </div>
                    <div class="summary-card">
                        <h3>Correct</h3>
                        <div class="value">${correctCount}</div>
                    </div>
                    <div class="summary-card">
                        <h3>Accuracy</h3>
                        <div class="value">${Math.round((correctCount / (attemptedCount || 1)) * 100)}%</div>
                    </div>
                </div>
                
                <h2>Question Review</h2>
                <div class="question-review">
            `;

            // Add each question and answer to the HTML content
            reviewAnswers.forEach((answer, idx) => {
                const question = testData.questions[idx];
                htmlContent += `
                    <div class="question">
                        <div class="question-header">
                            <strong>Question ${answer.questionNumber}</strong>
                            <span>${answer.isCorrect ? '+' : (answer.answered ? '-' : '0')}${question.marks.positive} marks</span>
                        </div>
                        <div class="question-text">${answer.questionText}</div>
                        <div class="user-answer ${answer.isCorrect ? 'correct' : (answer.answered ? 'incorrect' : 'unattempted')}">
                            <strong>${answer.answered ? 'Your answer: ' : 'Not attempted'}</strong> 
                            ${answer.answered ? answer.userChoiceText : ''}
                            ${answer.isCorrect ? ' ✓' : (answer.answered ? ' ✗' : '')}
                        </div>
                        ${!answer.isCorrect ? `
                            <div class="correct-answer">
                                <strong>Correct answer:</strong> ${answer.correctAnswerText}
                            </div>
                        ` : ''}
                        ${question.explanation ? `
                            <div class="explanation">
                                <div class="explanation-title">Explanation:</div>
                                <div>${question.explanation}</div>
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            // Close HTML content
            htmlContent += `
                </div>
                
                <div class="footer">
                    <p>&copy; 2025 KUNAL Test Platform. All rights reserved.</p>
                    <p>Created by @finallygotnirvana</p>
                </div>
            </body>
            </html>
            `;

            // Create a download link
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const downloadLink = document.createElement('a');
            downloadLink.href = url;
            
            // Format date for filename
            const date = new Date();
            const formattedDate = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            
            downloadLink.download = `Test_Analysis_${formattedDate}.html`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        document.addEventListener('keydown', function(e) {
            // Prevent default behavior for arrow keys
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                e.preventDefault();
            }

            switch(e.key) {
                case 'ArrowLeft':
                    goToPreviousQuestion();
                    break;
                case 'ArrowRight':
                    goToNextQuestion();
                    break;
                case 'ArrowUp':
                case 'ArrowDown':
                    // Get all options for the current question
                    const options = document.querySelectorAll('.option');
                    if (options.length === 0) return;

                    // Find currently selected option
                    let currentIndex = Array.from(options).findIndex(opt => opt.classList.contains('selected'));
                    
                    // Calculate new index
                    if (e.key === 'ArrowUp') {
                        currentIndex = currentIndex <= 0 ? options.length - 1 : currentIndex - 1;
                    } else {
                        currentIndex = currentIndex >= options.length - 1 ? 0 : currentIndex + 1;
                    }

                    // Select the new option
                    options.forEach(opt => opt.classList.remove('selected'));
                    options[currentIndex].classList.add('selected');
                    options[currentIndex].querySelector('input[type="radio"]').checked = true;
                    
                    // Update user answer
                    userAnswers[currentQuestionIndex] = currentIndex + 1;
                    updateQuestionPalette();
                    break;
                case 'b':
                case 'B':
                    toggleBookmark();
                    break;
            }
        });
    </script>
</body>
</html>
