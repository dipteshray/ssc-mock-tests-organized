"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Created in 1991, widely used today in AI and data science, but not the first.</span></li></ul>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Coriolis Force, which deflects winds and ocean currents on the rotating Earth, is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Equator</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Poles</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Tropics</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mid-latitudes</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Poles</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Coriolis Force</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> arises due to the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">rotation of the Earth</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, causing moving air and water to be deflected:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">To the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">right in the Northern Hemisphere</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">To the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">left in the Southern Hemisphere</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Its strength depends on </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">latitude</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Maximum at the poles</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Zero at the equator</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This force is crucial in shaping </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">global wind patterns</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">ocean currents</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, and the rotation of </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">cyclones</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Example: The Coriolis effect explains why </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">trade winds</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">westerlies</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, and </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">cyclones</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> follow curved paths instead of straight lines.</span></li></ul>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The dimensional formula of Planck's constant (h) is identical to that of:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-h ht:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">not</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> share any boundary with Bangladesh.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Instead, Manipur shares its international border with </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Myanmar</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, making it strategically important in India’s eastern frontier.</span></li></ul>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The book “The Argumentative Indian” was written by:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sunil Khilnani</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Shashi Tharoor</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ramachandra Guha</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Amartya Sen</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Amartya Sen</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The book </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">The Argumentative Indian</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> was written by </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Amartya Sen</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, Nobel Prize–winning economist and philosopher.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Published in </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">2005</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, it is a collection of essays exploring India’s long tradition of </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">public debate, intellectual pluralism, and cultural diversity</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Sen argues that India’s democratic and secular values are deeply rooted in its historical traditions of dialogue and reasoning.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The book covers themes such as </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">identity, history, culture, and globalization</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, making it highly relevant for understanding modern India.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sunil Khilnani</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Author of The Idea of India (1997), not The Argumentative Indian.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Shashi Tharoor</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Wrote India: From Midnight to the Millennium (1997), not this book.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ramachandra Guha</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Wrote India After Gandhi (2007), a post-independence history.</span></li></ul>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which network topology has a central hub or switch connected to all nodes?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ring</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bus</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Star</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mesh</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Star</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">In a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Star topology</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, all devices (nodes) are connected to a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">central hub or switch</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The hub acts as a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">controller</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, managing data transmission between nodes.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">If one connection fails, it does not affect the rest of the network, but if the hub fails, the entire network goes down.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This topology is widely used in </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">LANs (Local Area Networks)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> because it is easy to install, manage, and troubleshoot.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ring</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Devices are connected in a circular path; no central hub.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bus</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → All devices share a single backbone cable; no hub.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mesh</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Every device is connected to every other device; no central hub.</span></li></ul>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The ICC Champions Trophy 2025, hosted by Pakistan and UAE, was won by which national team?</span></p>", n style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Most Wickets:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> Matt Henry (10 wickets)</span></li></ul>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The famous Persian translation of the Mahabharata, “Razmnama”, was prepared during the reign of:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Humayun</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Akbar</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Jahangir</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Shah Jahan</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Akbar.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The famous Persian translation of the Mahabharata, known as Razmnama (meaning \"Book of War\"), was commissioned by Mughal Emperor Akbar in 1582. Akbar established a translation bureau called Maktab Khana in Fatehpur Sikri around 1574 to render key Sanskrit texts like the Mahabharata into Persian, promoting cultural integration in his empire. This project was carried out by scholars such as Faizi and Abd al-Qadir Bada'uni during Akbar's reign (1556–1605)</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The “Bhabar” region in northern India is characterised by:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Black cotton soil</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Marshy lowland plains</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Deltaic alluvial deposits</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pebble-rich porous belt</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Pebble-rich porous belt</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bhabar region</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> lies along the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">foothills of the Himalayas</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, just south of the Shiwalik range.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It is characterized by a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">narrow belt of coarse alluvium</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> consisting of </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">pebbles, boulders, and gravel</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> deposited by mountain streams.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Because the soil is </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">porous</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, rivers often </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">disappear underground</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> in this belt and re-emerge further south in the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Terai region</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Width: about </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">8–16 km</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This unique feature makes the Bhabar unsuitable for cultivation, unlike the fertile Terai plains that follow it.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Black cotton soil</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Found in Deccan plateau, not in Himalayan foothills.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Marshy lowland plains</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Refers to the Terai region, not Bhabar.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Deltaic alluvial deposits</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Found in river deltas (e.g., Ganga-Brahmaputra delta), not in Bhabar.</span></li></ul>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The numerical value of absolute zero temperature on the Celsius scale is approximately:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">-100.15 °C</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">-173.15 °C</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">-273.15 °C</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">-373.15 °C</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: -273.15 °C</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Absolute zero</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">lowest possible temperature</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, where the motion of all particles theoretically stops.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">On the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Celsius scale</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, absolute zero is approximately </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">−273.15 °C</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">On the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kelvin scale</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, absolute zero is defined as </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">0 K</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">On the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Fahrenheit scale</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, it corresponds to about </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">−459.67 °F</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This value is fundamental in </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">thermodynamics</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> and marks the starting point of the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kelvin scale</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The famous 'Pratapgad Fort Incident' of 1659, where Shivaji killed the Bijapuri general, involved which general?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Diler Khan</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Jai Singh</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Shaista Khan </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Afzal Khan</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Afzal Khan</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pratapgad Fort Incident</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> took place in </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1659</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> at </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pratapgad Fort (near Satara, Maharashtra)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It involved </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Chhatrapati Shivaji Maharaj</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> and the Bijapuri general </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Afzal Khan</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Afzal Khan, sent by the Adil Shahi Sultanate of Bijapur, attempted to crush Shivaji’s rising power.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">During a meeting arranged for negotiation, Afzal Khan tried to attack Shivaji.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Shivaji, prepared with concealed weapons (the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">wagh nakh</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> – tiger claws, and a dagger), killed Afzal Khan in self-defense.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This incident boosted Shivaji’s reputation and marked a turning point in the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Maratha struggle against the Bijapur Sultanate</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-f :12pt;font-weight:bold;font-family:'Cambria Math'\">Canada, Mexico, and the United States of America</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It is also the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">first World Cup with 48 teams</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, expanded from the traditional 32-team format.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Key highlights:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">USA:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> Hosting the majority of matches, including the final at </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">MetLife Stadium, New Jersey</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mexico:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> Hosting matches in cities like </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mexico City, Guadalajara, Monterrey</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Canada:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> Hosting matches in </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Toronto and Vancouver</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This marks Mexico’s </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">third time hosting</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (1970, 1986), USA’s </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">second time</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (1994), and Canada’s </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">first time</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following substances is used as an antacid to reduce stomach acidity?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Magnesium hydroxide</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sodium chloride</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Potassium nitrate</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Calcium sulphate</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Magnesium hydroxide</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Magnesium hydroxide</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is commonly used as an </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">antacid</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> to neutralize excess stomach acid (</span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">HCl</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">) and relieve conditions like </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">heartburn, indigestion, and acidity</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It works by reacting with hydrochloric acid in the stomach:</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1778761801960_image018.png\" width=\"252\" height=\"21\" alt style=\"vertical-align:middle\" ></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This reaction reduces acidity and provides quick relief.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It is also the active ingredient in </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">milk of magnesia</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sodium chloride</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Common salt; does not act as an antacid.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Potassium nitrate</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Used in fertilizers and explosives, not for acidity.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Calcium sulphate</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Used in construction (plaster of Paris), not as an antacid.</span></li></ul>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Karakoram Highway (KKH), a strategic mountain road, connects China with which neighbouring country?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Afghanistan</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pakistan</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Tajikistan </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kyrgyzstan</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Pakistan</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Karakoram Highway (KKH)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is a strategic mountain road that connects </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">China</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> with </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pakistan</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It runs through the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Karakoram mountain range</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, linking </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Xinjiang province (China)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> with </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Gilgit-Baltistan (Pakistan)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Often called the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">“Friendship Highway”</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, it is one of the highest paved international roads in the world.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The highway is a vital part of the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">China–Pakistan Economic Corridor (CPEC)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, enhancing trade and strategic cooperation between the two nations.</span></li></ul>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Junagadh Rock Inscription of Rudradaman-I, dated c. 150 CE, is composed in which language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pali language</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Prakrit language</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sanskrit language</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Tamil language</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Sanskrit language</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Junagadh Rock Inscription</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> of </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Rudradaman I</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, dated around </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">150 CE</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, is one of the earliest long inscriptions in </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">classical Sanskrit</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Rudradaman I was a ruler of the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Western Kshatrapas (Shaka dynasty)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This inscription is significant because:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It marks the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">first major political inscription in Sanskrit</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, moving away from the earlier tradition of using </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Prakrit</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> for royal edicts (like Ashoka’s edicts).</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It records the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">repair of the Sudarshana Lake</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> at Junagadh, originally built during the Mauryan period.</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It highlights Rudradaman’s achievements, military conquests, ight:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Modem</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Modem</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">A </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">modem</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (short for modulator–demodulator) is the device used to </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">convert digital signals into analogue signals and vice versa</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Digital signals</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (binary data) from a computer are converted into </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">analogue signals</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> for transmission over telephone lines or other communication channels.</span></li><l  15th</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Vishesh is </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">13th from the right</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, so from the left = 37 - 13 + 1 = </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">25th</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">. </span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Namrata is </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">10th to the left</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> of Vishesh. </span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Namrata’s position from left = 25 - 10 = </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">15th</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">. </span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Hence, the correct answer is </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">(c) 15th</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></u let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;

  } catch (err) {

  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
