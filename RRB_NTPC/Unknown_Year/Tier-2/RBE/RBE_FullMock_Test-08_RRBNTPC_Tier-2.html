y:'Nirmala UI'\">बाद में</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1956 </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">के राज्य पुनर्गठन अधिनियम</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Cambria Math'\">(States Reorganisation Act) </span><span style=\"font-family:'Nirmala UI'\">के तहत पूरे भारत में भाषाई आधार पर राज्यों का पुनर्गठन किया गया</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">जिसमें आंध्र राज्य को हैदराबाद राज्य के तेलुगु भाषी क्षेत्रों के साथ मिलाकर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आंध्र प्रदेश</span><span style=\"font-family:'Nirmala UI'\"> बनाया गया।</span></li></ul>", "question_heading": ""}, {"sr_no": 114, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ध्वनि में </span><span style=\"font-family:'Cambria Math'\">'</span><span style=\"font-family:'Nirmala UI'\">बीट्स</span><span style=\"font-family:'Cambria Math'\">' </span><span style=\"font-family:'Nirmala UI'\">की घटना निम्नलिखित में से किसके कारण होती है</span><span style=\"font-family:'Cambria Math'\">?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">परावर्तन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अपवर्तन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">व्यतिकरण</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डॉप्लर प्रभाव</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: व्यतिकरण (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Interference)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ध्वनि में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बीट्स (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Beats)</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Nirmala UI'\">या विस्पंद की घटना तब होती है जब थोड़ा अलग आवृत्तियों (</span><span style=\"font-family:'Cambria Math'\">frequencies) </span><span style=\"font-family:'Nirmala UI'\">वाली दो ध्वनि तरंगें एक-दूसरे के साथ </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्यतिकरण (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">interfere)</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Nirmala UI'\">करती हैं।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह व्यतिकरण क्रमिक रूप से रचनात्मक (</span><span style=\"font-family:'Cambria Math'\">constructive) </span><span style=\"font-family:'Nirmala UI'\">और विनाशकारी (</span><span style=\"font-family:'Cambria Math'\">destructive) </span><span style=\"font-family:'Nirmala UI'\">व्यतिकरण के क्षेत्र उत्पन्न करता है</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">जिससे ध्वनि की तीव्रता (</span><span style=\"font-family:'Cambria Math'\">loudness) </span><span style=\"font-family:'Nirmala UI'\">में आवधिक परिवर्तन होता है।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बीट आवृत्ति (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Beat Frequency)</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Nirmala UI'\">का सूत्र है:</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1777355384415_image010.png\" width=\"121\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जहाँ </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1777355384415_image011.png\" width=\"17\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-family:'Nirmala UI'\"> और </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1777355384415_image012.png\" width=\"17\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-family:'Nirmala UI'\"> दो तरंगों की आवृत्तियाँ हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उदाहरण:</span><span style=\"font-family:'Nirmala UI'\"> यदि एक ट्यूनिंग फोर्क (स्वरित्र द्विभुज) की आवृत्ति </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">256 Hz</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Nirmala UI'\">है और दूसरे की </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">258 Hz</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">तो बीट आवृत्ति </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">2 </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बीट्स प्रति सेकंड</span><span style=\"font-family:'Nirmala UI'\"> होगी।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का विवरण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">परावर्तन (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Reflection)</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> → </span><span style=\"font-family:'Nirmala UI'\">किसी सतह से ध्वनि तरंगों का टकराकर वापस आना (जैसे गूँज)।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अपवर्तन (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Refraction)</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> → </span><span style=\"font-family:'Nirmala UI'\">माध्यम बदलने के कारण ध्वनि तरंगों का मुड़ना।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्यतिकरण (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Interference)</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> → </span><span style=\"font-family:'Nirmala UI'\">सही</span><span style=\"font-family:'Cambria Math'\">; </span><span style=\"font-family:'Nirmala UI'\">थोड़ा अलग आवृत्तियों वाली दो तरंगों का अध्यारोपण (</span><span style=\"font-family:'Cambria Math'\">superposition) </span><span style=\"font-family:'Nirmala UI'\">बीट्स का कारण बनता है।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">डॉप्लर प्रभाव (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Doppler Effect)</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> → </span><span style=\"font-family:'Nirmala UI'\">स्रोत और प्रेक्षक की सापेक्ष गति के कारण आवृत्ति में होने वाला परिवर्तन।</span></li></ul>", "question_heading": ""}, {"sr_no": 115, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">'</span><span style=\"font-family:'Nirmala UI'\">सामाजिक न्याय की प्रतिमा</span><span style=\"font-family:'Cambria Math'\">' (</span><span style=\"font-family:'Nirmala UI'\">डॉ. बी.आर. अंबेडकर की एक विशाल प्रतिमा) का अनावरण किस शहर में किया गया था</span><span style=\"font-family:'Cambria Math'\">?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हैदराबाद</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नागपुर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लखनऊ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विजयवाड़ा</span></p>", "answer": "4", "negative_marking": "0.33", "po ala UI'\">रॉकेट लॉन्च पर नहीं।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बेलाट्रिक्स एयरोस्पेस (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bellatrix Aerospace)</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> → </span><span style=\"font-family:'Nirmala UI'\">प्रणोदन प्रणाली (</span><span style=\"font-family:'Cambria Math'\">propulsion systems) </span><span style=\"font-family:'Nirmala UI'\">पर काम करता है</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">लॉन्च वाहनों पर नहीं।</span></li></ul>", "question_heading": ""}, {"sr_no": 117, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">'</span><span style=\"font-family:'Nirmala UI'\">सुजिनी</span><span style=\"font-family:'Cambria Math'\">' </span><span style=\"font-family:'Nirmala UI'\">किस राज्य की पारंपरिक कढ़ाई कला है</span><span style=\"font-family:'Cambria Math'\">?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बिहार</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पश्चिम बंगाल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ओडिशा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">असम</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: बिहार (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bihar)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सुजिनी कढ़ाई (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sujini embroidery)</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Nirmala UI'\">की शुरुआत बिहार के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भूसरा गांव (मुजफ्फरपुर जिला)</span><span style=\"font-family:'Nirmala UI'\"> से हुई थी। यहाँ महिलाएँ पुरानी साड़ियों को आपस में जोड़कर उन पर </span><span style=\"font-family:'Cambria Math'\">'</span><span style=\"font-family:'Nirmala UI'\">रनिंग स्टिच</span><span style=\"font-family:'Cambria Math'\">' (running stitches) </span><span style=\"font-family:'Nirmala UI'\">के माध्यम से प्रकृति</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">लोककथाओं और दैनिक जीवन के दृश्यों को उकेरते हुए रजाई या </span><span style=\"font-family:'Cambria Math'\">'</span><span style=\"font-family:'Nirmala UI'\">क्विल्ट</span><span style=\"font-family:'Cambria Math'\">' </span><span style=\"font-family:'Nirmala UI'\">बनाती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसे </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">2006</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Nirmala UI'\">से </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">\"</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बिहार के सुजनी कढ़ाई कार्य\"</span><span style=\"font-family:'Nirmala UI'\"> के रूप में </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">GI </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">टैग</span><span style=\"font-family:'Nirmala UI'\"> प्राप्त है। इसकी विशेषता यह है कि इसमें सूती कपड़े की परतों पर चेन या साटन स्टिच के साथ मोर</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">फूल और कछुए जैसे रूपांकनों (</span><span style=\"font-family:'Cambria Math'\">motifs) </span><span style=\"font-family:'Nirmala UI'\">का उपयोग किया जाता है।</span></p>", "question_heading": ""}, {"sr_no": 118, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत में प्रसिद्ध </span><span style=\"font-family:'Cambria Math'\">'</span><span style=\"font-family:'Nirmala UI'\">कोह-ए-नूर</span><span style=\"font-family:'Cambria Math'\">' </span><span style=\"font-family:'Nirmala UI'\">हीरा किस खान से निकाला गया था</span><span style=\"font-family:'Cambria Math'\">?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पन्ना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गोलकोंडा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कोलार</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हट्टी</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: गोलकोंडा (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Golconda)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कोहिनूर हीरा</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">जो दुनिया के सबसे प्रसिद्ध हीरों में से एक है</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">वर्तमान भारत के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">तेलंगाना</span><span style=\"font-family:'Nirmala UI'\"> में स्थित </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गोलकोंडा की खदानों</span><span style=\"font-family:'Nirmala UI'\"> से निकाला गया था।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऐतिहासिक रूप से गोलकुंडा क्षेत्र दुनिया के कुछ बेहतरीन हीरों के उत्पादन के लिए प्रसिद्ध था</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">जिनमें कोहिनूर के अलावा </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">होप डायमंड</span><span style=\"font-family:'Nirmala UI'\"> और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रीजेंट डायमंड</span><span style=\"font-family:'Nirmala UI'\"> भी शामिल हैं।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कोहिनूर का एक लंबा इतिहास रहा है</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">जहाँ यह भारतीय शासकों</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">फारसी आक्रमणकारियों</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">अफगान राजवंशों और अंततः ब्रिटिश क्राउन के हाथों में गया।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आज</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">यह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ब्रिटिश क्राउन ज्वेल्स</span><span style=\"font-family:'Nirmala UI'\"> का हिस्सा है और क्वीन मदर के मुकुट में जड़ा हुआ है।</span></li></ul>", "question_heading": ""}, {"sr_no": 119, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संविधान के तहत</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">किस निकाय को अखिल भारतीय सेवाओं (जैसे आईएएस और आईपीएस) को सृजित करने या समाप्त करने का अनन्य अधिकार प्राप्त है जो संघ और राज्यों दोनों के लिए समान हैं</span><span style=\"font-family:'Cambria Math'\">?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रधानमंत्री की सलाह पर राष्ट्रपति</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संघ लोक सेवा आयोग</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कानून द्वारा संसद</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रधानमंत्री और मंत्रिपरिषद</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: विधि द्वारा संसद (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">The Parliament by law)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संविधान के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">312</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Nirmala UI'\">के तहत</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">संसद</span><span style=\"font-family:'Nirmala UI'\"> के पास अखिल भारतीय सेवाओं (जैसे </span><span style=\"font-family:'Cambria Math'\">IAS, IPS, IFS) </span><span style=\"font-family:'Nirmala UI'\">को बनाने या समाप्त करने की विशेष शक्ति है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऐसा केवल </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विधि (कानून) द्वारा</span><span style=\"font-family:'Nirmala UI'\"> ही किया जा सकता है</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">और वह भी तब जब </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राज्यसभा</span><span style=\"font-family:'Nirmala UI'\"> दो-तिहाई बहुमत से एक प्रस्ताव पारित कर यह घोषणा करे कि राष्ट्रहित में ऐसा करना आवश्यक है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो राष्ट्रपति</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">न प्रधानमंत्री और न ही मंत्रिपरिषद स्वतंत्र रूप से इन सेवाओं का सृजन या उन्मूलन कर सकते हैं।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">संघ लोक सेवा आयोग (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">UPSC)</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Nirmala UI'\">भर्ती के लिए परीक्षाएं आयोजित करता है</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">लेकिन उसके पास सेवाओं को बनाने या समाप्त करने का अधिकार नहीं है।</span></li></ul>", "question_heading": ""}, {"sr_no": 120, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किस प्रकार का मैलवेयर बिना मानवीय हस्तक्षेप के स्वयं को दोहराता है और अन्य कंप्यूटरों में फैलता है</span><span style=\"font-family:'Cambria Math'\">?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ट्रोजन हॉर्स</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वर्म</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्पाइवेयर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\">< let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
