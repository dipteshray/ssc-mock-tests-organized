<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>16.) Maths Sectional Mock Test-8 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

12pt\"><span style=\"font-family:'Nirmala UI'\">Logic: Each letter increases by +3 in the next term.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">PVF </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> SYI</span><br><span style=\"font-family:'Nirmala UI'\">P + 3 = S, V + 3 = Y, F + 3 = I</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">SYI </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> VBL</span><br><span style=\"font-family:'Nirmala UI'\">S + 3 = V, Y + 3 = B, I + 3 = L</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">VBL </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> YEO</span><br><span style=\"font-family:'Nirmala UI'\">V + 3 = Y, B + 3 = E, L + 3 = O</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">So, after YEO:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Y + 3 = B, E + 3 = H, O + 3 = R</span><br><span style=\"font-family:'Nirmala UI'\">Correct term should be BHR, but given term is BGR.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Incorrect letter-cluster: BGR</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">छह विद्यार्थी एक वृत्ताकार मेज के चारों ओर केंद्र की ओर मुख करके बैठे हैं। L, J और H दोनों का निकटतम पड़ोसी है। I, J के बाईं ओर दूसरे स्थान पर बैठा है। K, H के दाईं ओर तीसरे स्थान पर बैठा है। G, I और H दोनों का निकटतम पड़ोसी है। यदि सभी व्यक्तियों को G से शुरू करते हुए (G को शामिल करते हुए) दक्षिणावर्त (clockwise) दिशा में अंग्रेजी वर्णमाला के क्रम में व्यवस्थित किया जाए, तो कितने व्यक्तियों का स्थान अपरिवर्तित रहेगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तीन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चार</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1777355298861_image003.png\" width=\"358\" height=\"201\" alt ></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक निश्चित कूट भाषा (code) में, ‘copy book pencil’ को ‘fd rl sg’ के रूप में कूटबद्ध किया गया है, ‘pencil crayon eraser’ को ‘bz xw rl’ के रूप में कूटबद्ध किया गया है, और ‘crayon copy pen’ को ‘xw sg xo’ के रूप में कूटबद्ध किया गया है। उसी भाषा में ‘book’ के लिए कूट क्या है? (नोट: सभी कूट केवल दो अक्षरों के हैं।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">rl</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">xo</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">fd</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">sg</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">pencil is common in 1st and 2nd statements, so pencil = rl.</span><br><span style=\"font-family:'Nirmala UI'\">copy is common in 1st and 3rd statements, so copy = sg.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">In 1st statement: copy book pencil = fd rl sg</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Remaining word book = fd</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Answer: (c) fd</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अंग्रेजी वर्णमाला के क्रम के आधार पर, PEST एक निश्चित तरीके से QGVX से संबंधित है। उसी प्रकार, NOPE, OQSI से संबंधित है। समान तर्क का पालन करते हुए, ROPE दिए गए विकल्पों में से किससे संबंधित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">SPSI</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">SQSH</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">SQSI</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">SPQH</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Logic: +1, +2, +3, +4</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">PEST </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> P+1 = Q, E+2 = G, S+3 = V, T+4 = X </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> QGVX</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">NOPE </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> N+1 = O, O+2 = Q, P+3 = S, E+4 = I </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> OQSI</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ROPE </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> R+1 = S, O+2 = Q, P+3 = S, E+4 = I </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> SQSI</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Answer: SQSI</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित समीकरण को सही बनाने के लिए किन दो संख्याओं को आपस में बदला जाना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">64 + (36 × 5) ÷ 3 + 6 × 8 – 12 = 96</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-siz family:'Nirmala UI'\">R + 3 = U, U + 3 = X, X + 3 = A, A + 3 = D</span><br><span style=\"font-family:'Nirmala UI'\">K + 4 = O, O + 4 = S, S + 4 = W, W + 4 = A</span><br><span style=\"font-family:'Nirmala UI'\">J + 5 = O, O + 5 = T, T + 5 = Y, Y + 5 = D</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">So, next letters = DAD</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Number pattern:</span><br><span style=\"font-family:'Nirmala UI'\">38 + 32 = 70</span><br><span style=\"font-family:'Nirmala UI'\">70 + 52 = 122</span><br><span style=\"font-family:'Nirmala UI'\">122 + 92 = 214</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Difference pattern: 32, 52, 92, 152</span><br><span style=\"font-family:'Nirmala UI'\">So, 214 + 152 = 366</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Answer: DAD366</span></p>", "question_heading": ""}, {"sr_no": 23, "question": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वह आकृति चुनें जो बाकी आकृतियों से भिन्न हो?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1777355298861_image006.png\" width=\"368\" height=\"100\" alt ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">B</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-fami rmala UI'\">Logic: Sum of letter positions = 45</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">MWI </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> M(13) + W(23) + I(9) = 45 </span><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><br><span style=\"font-family:'Nirmala UI'\">ZGL </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> Z(26) + G(7) + L(12) = 45 </span><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><br><span style=\"font-family:'Nirmala UI'\">OEY </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> O(15) + E(5) + Y(25) = 45 </span><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><br><span style=\"font-family:'Nirmala UI'\">OLM </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> O(15) + L(12) + M(13) = 40 </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Correct Answer: OLM</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित प्रत्येक प्रश्न में, पहले शब्द पर एक विशिष्ट वर्णमाला कोडिंग पैटर्न लागू करके दूसरा शब्द बनाया गया है। दिए गए विकल्पों में से सही विकल्प चुनने के लिए तीसरे शब्द पर भी वही पैटर्न लागू करें।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">CUT : BDTVSU :: TIP : ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">UVHJOQ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">SUHJOQ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">USJHQO</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">SUJHOQ</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">In CUT </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> BDTVSU:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">C </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> B, D</span><br><span style=\"font-family:'Nirmala UI'\">U </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> T, V</span><br><span style=\"font-family:'Nirmala UI'\">T </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> S, U</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Each letter is changed into its previous and next letters.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Now apply the same pattern to TIP:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">T </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> S, U</span><br><span style=\"font-family:'Nirmala UI'\">I </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> H, J</span><br><span style=\"font-family:'Nirmala UI'\">P </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> O, Q</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">So, TIP </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> SUHJOQ</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Answer: (b) SUHJOQ</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा विकल्प प्रश्न चिह्न के स्थान पर आएगा?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अल्फा, बीटा, गामा, डेल्टा, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सिग्मा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ज़ेटा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एप्सिलॉन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">थीटा</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ग्रीक वर्णमाला के अक्षरों का क्रम इस प्रकार है:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अल्फा, बीटा, गामा, डेल्टा, एप्सिलॉन</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उत्तर: (c) एप्सिलॉन</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उत्तर दिशा की ओर मुख करके बैठी 42 विद्यार्थियों की एक पंक्ति में सुनील बाईं ओर से 17वें स्थान पर है। यदि हर्ष सुनील के दाईं ओर 12वें स्थान पर है, तो पंक्ति के दाईं ओर से हर्ष की स्थिति क्या होगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">10वीं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">12वीं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">14वीं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">15वीं</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सुनील बाईं ओर से 17वें स्थान पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हर्ष सुनील के दाईं ओर 12वें स्थान पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हर्ष बाईं ओर से 17 + 12 = 29वें स्थान पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दाईं ओर से स्थान = कुल विद्यार्थी - बाईं ओर से स्थान + 1</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">= 42 - 29 + 1</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">= 14वें स्थान पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उत्तर: (c) 14वां स्थान</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सात डिब्बे D, E, F, R, S, T और U एक के ऊपर एक रखे गए हैं, लेकिन जरूरी नहीं कि इसी क्रम में हों। U को T के ठीक ऊपर रखा गया है। E को D के ठीक ऊपर रखा गया है। केवल F को S के ऊपर रखा गया है। U के ऊपर केवल दो डिब्बे रखे गए हैं। E को नीचे से तीसरे स्थान पर नहीं रखा गया है। R और F के बीच कितने डिब्बे रखे गए हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चार</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तीन</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1777355298861_image009.png\" width=\"61\" height=\"284\" alt ></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">R और F के बीच तीन बॉक्स</span><span style=\"font-family:'Nirmala UI'\"> हैं।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पांच अंकों की संख्या 45yz0, 40 से विभाज्य है। (2y + z) का अधिकतम संभावित मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">16</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">20</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">24</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">22</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">For divisibility of 40 number must be divisible by 8 and 5</span></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Divisibility of 5:</span><span style=\"font-family:'Nirmala UI'\"> A number is divisible by 5 if its last digit is 0 or 5</span></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Divisibility of 8:</span><span style=\"font-family:'Nirmala UI'\"> if the last three digits of the number are either all zeros or are divisible by 8</span></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Maximum possible value of y and z be 8 and 8 respectively,</span></p><p style=\"margin-top:14pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">So, the value of (2y + z) = 16 + 8 = 24</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">New area = Original area + 100</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">20.8L = 20L + 100</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">0.8L = 100</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">L = 125</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">New area = 20.8 × 125 = 2600 cm²</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दिए गए व्यंजक को सरल कीजिए: </span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">b + 2a - [(3b + a) - (2a + b) + 2a] - a</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">-a</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">-b</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">a</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">b</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Given:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">b + 2a - [(3b + a) - (2a + b) + 2a] - a</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">First solve bracket:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">(3b + a) - (2a + b) + 2a</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">= 3b + a - 2a - b + 2a</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">= (3b - b) + (a - 2a + 2a)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">= 2b + a</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Now expression:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">= b + 2a - (2b + a) - a</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">= b + 2a - 2b - a - a</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">= (b - 2b) + (2a - a - a)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">= -b + 0</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">= -b</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Answer = -b</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;fon :108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Inner radius = 4x = 4 × 60 = 240 m</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यदि दो वृत्तों के केंद्रों के बीच की दूरी 14 सेमी है और त्रिज्याएँ क्रमशः 6 सेमी और 4 सेमी हैं, तो अनुप्रस्थ उभयनिष्ठ स्पर्श रेखा की लंबाई (सेमी में) क्या होगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">3</span><span style=\"font-family:'Cambria Math'\">√</span><span style=\"font-family:'Nirmala UI'\">6 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">4</span><span style=\"font-family:'Cambria Math'\">√</span><span style=\"font-family:'Nirmala UI'\">6 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">4</span><span style=\"font-family:'Cambria Math'\">√</span><span style=\"font-family:'Nirmala UI'\">5 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">3</span><span style=\"font-family:'Cambria Math'\">√</span><span style=\"font-family:'Nirmala UI'\">5 cm</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Distance between centres (d) = 14 cm</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Radii = 6 cm and 4 cm</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">For transverse commo eft:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक बार अनुमोदित होने के बाद:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">यह एक बार में </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">6 </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">महीने</span><span style=\"font-family:'Nirmala UI'\"> तक जारी रह सकता है।</span></li><li style=\"margin-left:30.2pt;margin-bottom:8pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">अधिकतम अवधि: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">3 </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">वर्ष</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">लेकिन केवल बार-बार संसदीय अनुमोदन और विशेष परिस्थितियों (जैसे राष्ट्रीय आपातकाल) के साथ।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">'</span><span style=\"font-family:'Nirmala UI'\">मैगसेसे पुरस्कार</span><span style=\"font-family:'Cambria Math'\">' </span><span style=\"font-family:'Nirmala UI'\">प्राप्त करने वाले पहले भारतीय कौन थे</span><span style=\"font-family:'Cambria Math'\">?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विनोबा भावे </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मदर टेरेसा </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जे.आर.डी. टाटा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सत्यजीत रे</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रमन मैग्सेसे पुरस्कार प्राप्त करने वाले पहले भारतीय </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आचार्य विनोबा भावे</span><span style=\"font-family:'Nirmala UI'\"> थे</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">जिन्हें </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1958</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Nirmala UI'\">में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भूदान</span><span style=\"font-family:'Nirmala UI'\"> आंदोलन में उनके नेतृत्व के लिए सम्मानित किया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुख्य तथ्य</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्राप्तकर्ता:</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आचार्य विनोबा भावे</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">वर्ष:</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1958</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">श्रेणी:</span><span style=\"font-family:'Nirmala UI'\"> सामुदायिक नेतृत्व eft:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सर्वाधिक जनघनत्व वाला राज्य:</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बिहार</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Cambria Math'\">(≈1,102 </span><span style=\"font-family:'Nirmala UI'\">व्यक्ति/किमी</span><span style=\"font-family:'Cambria Math'\">²)</span><span style=\"font-family:'Nirmala UI'\">।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">न्यूनतम जनघनत्व वाला राज्य:</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अरुणाचल प्रदेश</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Cambria Math'\">(≈17 </span><span style=\"font-family:'Nirmala UI'\">व्यक्ति/किमी</span><span style=\"font-family:'Cambria Math'\">²)</span><span style=\"font-family:'Nirmala UI'\">।</span></li></ul>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">समुद्र के नीचे वस्तुओं का पता लगाने के लिए सोनार (ध्वनि नेविगेशन और रेंजिंग) द्वारा किस प्रकार की तरंग का उपयोग किया जाता है</span><span style=\"font-family:'Cambria Math'\">?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इन्फ्रासोनिक तरंगें</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अल्ट्रासोनिक तरंगें</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">माइक्रोवेव</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रेडियो तरंगें</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: अल्ट्रासोनिक तरंगें (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Ultrasonic waves)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सोनार (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">SONAR - Sound Navigation and Ranging)</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अल्ट्रासोनिक तरंगों</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Cambria Math'\">(20 kHz </span><span style=\"font-family:'Nirmala UI'\">से अधिक आवृत्ति वाली ध्वनि तरंगें</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">जो मानवीय श्रवण शक्ति से परे हैं) को प्रसारित करके काम करता है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ये तरंगें पानी के माध्यम से यात्रा करती हैं</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">किसी वस्तु (जैसे पनडुब्बी</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">जहाज का मलबा</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">या समुद्र तल) से टकराती हैं और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">परावर्तित (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">reflect)</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Nirmala UI'\">होकर वापस आती हैं।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रतिध्वनि (</span><span style=\"font-family:'Cambria Math'\">echo) </span><span style=\"font-family:'Nirmala UI'\">के वापस आने में लगने वाले </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">समय को मापकर</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">सोनार वस्तु की </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दूरी और स्थान</span><span style=\"font-family:'Nirmala UI'\"> की गणना करता है।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अल्ट्रासोनिक तरंगों</span><span style=\"font-family:'Nirmala UI'\"> को इसलिए चुना जाता है क्योंकि वे पानी में लंबी दूरी तय कर सकती हैं और पहचान के लिए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उच्च रिज़ॉल्यूशन (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">high resolution)</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Nirmala UI'\">प्रदान करती हैं।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का विवरण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;pa ia Math'\"> → </span><span style=\"font-family:'Nirmala UI'\">विद्युत चुम्बकीय तरंगें</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रडार और संचार</span><span style=\"font-family:'Nirmala UI'\"> में उपयोग की जाती हैं</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">पानी के नीचे सोनार में नहीं।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रेडियो तरंगें (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Radio waves)</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> → </span><span style=\"font-family:'Nirmala UI'\">विद्युत चुम्बकीय तरंगें</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रसारण और संचार</span><span style=\"font-family:'Nirmala UI'\"> में उपयोग की जाती हैं</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">पानी के नीचे पता लगाने के लिए नहीं।</span></li></ul>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत का सर्वोच्च नागरिक पुरस्कार कौन सा है</span><span style=\"font-family:'Cambria Math'\">?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पद्म विभूषण </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">परमवीर चक्र </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nir :'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> → </span><span style=\"font-family:'Nirmala UI'\">सही</span><span style=\"font-family:'Cambria Math'\">; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रथम उपदेश</span><span style=\"font-family:'Nirmala UI'\"> का स्थल।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बोधगया</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> → </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ज्ञान प्राप्ति</span><span style=\"font-family:'Nirmala UI'\"> का स्थान।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लुंबिनी</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> → </span><span style=\"font-family:'Nirmala UI'\">बुद्ध का </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जन्मस्थान</span><span style=\"font-family:'Nirmala UI'\">।</span></li></ul>", "question_heading": ""}, {"sr_no": 108, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के गुकेश डोम्माराजू दिसंबर </span><span style=\"font-family:'Cambria Math'\">2024 </span><span style=\"font-family:'Nirmala UI'\">में विश्व शतरंज चैंपियन बनने वाले अब तक के सबसे कम उम्र के खिलाड़ी बने। उन्होंने किस मौजूदा चैंपियन को हराकर यह खिताब जीता</span><span style=\"font-family:'Cambria Math'\">?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डिंग लिरेन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मैग्नस कार्लसन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हिकारू नाकामुरा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">फैबियानो कारुआना</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गुकेश डोमराजू</span><span style=\"font-family:'Nirmala UI'\"> ने सिंगापुर में मौजूदा चैंपियन चीन के डिंग लिरेन को हराकर दिसंबर </span><span style=\"font-family:'Cambria Math'\">2024 </span><span style=\"font-family:'Nirmala UI'\">में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सबसे कम उम्र के विश्व शतरंज चैंपियन</span><span style=\"font-family:'Nirmala UI'\"> बनकर इतिहास रच दिया।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुख्य तथ्य</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विजेता:</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गुकेश डोमराजू (भारत)</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रतिद्वंद्वी:</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">डिंग लिरेन (चीन)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Cambria Math'\">– 2023 </span><span style=\"font-family:'Nirmala UI'\">से मौजूदा विश्व चैंपियन।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रतियोगिता:</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">फिडे (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">FIDE) </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विश्व शतरंज चैंपियनशिप </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">2024</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">तारीख:</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Cambria Math'\">25 </span><span style=\"font-family:'Nirmala UI'\">नवंबर – </span><span style=\"font-family:'Cambria Math'\">12 </span><span style=\"font-family:'Nirmala UI'\">दिसंबर </span><span style=\"font-family:'Cambria Math'\">2024</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्थान:</span><span style=\"font-family:'Nirmala UI'\"> रिसॉर्ट्स वर्ल्ड सेंटोसा</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सिंगापुर</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अंतिम स्कोर:</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गुकेश </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">7½ – 6½ </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">डिंग लिरेन</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">महत्व:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">18 </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">वर्ष</span><span style=\"font-family:'Nirmala UI'\"> की आयु में</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">गुकेश इतिहास के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सबसे कम उम्र के विश्व शतरंज चैंपियन</span><span style=\"font-family:'Nirmala UI'\"> बन गए</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">उन्होंने गैरी कास्परोव का रिकॉर्ड तोड़ दिया (कास्परोव ने </span><span style=\"font-family:'Cambria Math'\">1985 </span><span style=\"font-family:'Nirmala UI'\">में </span><span style=\"font-family:'Cambria Math'\">22 </span><span style=\"font-family:'Nirmala UI'\">वर्ष की आयु में जीत हासिल की थी)।</span></li><li style=\"margin-left:30.2pt;margin-bottom:8pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">यह भारत के लिए एक ऐतिहासिक मील का पत्थर है</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">जो पिछले दशकों में विश्वनाथन आनंद के लंबे शासन और चुनौती के बाद भारत का गौरव बढ़ाता है।</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का विवरण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">डिंग लिरेन (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Ding Liren)</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> → </span><span style=\"font-family:'Nirmala UI'\">सही</span><span style=\"font-family:'Cambria Math'\">; 2024 </span><span style=\"font-family:'Nirmala UI'\">में गुकेश द्वारा पराजित।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मैग्नस कार्लसन (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Magnus Carlsen)</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> → </span><span style=\"font-family:'Nirmala UI'\">पूर्व चैंपियन</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">जिन्होंने </span><span style=\"font-family:'Cambria Math'\">2023 </span><span style=\"font-family:'Nirmala UI'\">में अपने खिताब का बचाव करने से कदम पीछे खींच लिए थे।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हिकारू नाकामुरा (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Hikaru Nakamura)</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> → </span><span style=\"font-family:'Nirmala UI'\">शीर्ष अमेरिकी ग्रैंडमास्टर</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">लेकिन विश्व चैंपियन नहीं।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-we  नीला (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Blue)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह घटना </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रेले प्रकीर्णन (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Rayleigh scattering)</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Nirmala UI'\">के कारण होती है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रकाश की छोटी तरंगदैर्घ्य (</span><span style=\"font-family:'Cambria Math'\">wavelengths) </span><span style=\"font-family:'Nirmala UI'\">पृथ्वी के वायुमंडल में अणुओं द्वारा अधिक मजबूती से प्रकीर्णित (</span><span style=\"font-family:'Cambria Math'\">scatter) </span><span style=\"font-family:'Nirmala UI'\">होती हैं।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दृश्य प्रकाश (</span><span style=\"font-family:'Cambria Math'\">visible light) </span><span style=\"font-family:'Nirmala UI'\">के बीच:</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नीले प्रकाश</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Cambria Math'\">(≈450 nm) </span><span style=\"font-family:'Nirmala UI'\">की तरंगदैर्घ्य लाल</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-family:'Nirmala UI'\">पीले या हरे रंग की तुलना में कम होती ": 112, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रक्त का कौन सा घटक मुख्य रूप से शरीर के विभिन्न भागों तक ऑक्सीजन पहुंचाने के लिए जिम्मेदार है</span><span style=\"font-family:'Cambria Math'\">?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">श्वेत रक्त कोशिकाएं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्लाज्मा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लाल रक्त कोशिकाएं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्लेटलेट्स</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: लाल रक्त कोशिकाएं (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Red Blood Cells - RBCs)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लाल रक्त कोशिकाओं (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">RBCs)</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Nirmala UI'\">में </span><
