"><span style=\"font-family:'Cambria Math'\">LVG 10</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">HGG 12</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Letter pattern:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">First letters:</span><br><span style=\"font-family:'Cambria Math'\">F → I → L → O → R (+3)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Third letters:</span><br><span style=\"font-family:'Cambria Math'\">A → E → I → M → Q (+4)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So, missing letters = LHI</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Number pattern:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">29 → 22 (-7)</span><br><span style=\"font-family:'Cambria Math'\">22 → 13 (-9)</span><br><span style=\"font-family:'Cambria Math'\">13 → 2 (-11)</span><br><span style=\"font-family:'Cambria Math'\">2 → -11 (-13)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So, missing number = 13</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Answer: LHI 13</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Select the option that is related to the fifth term in the same way as the second term is related to the first term and fourth term is related to third term.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(NOTE: Operations should be performed on the whole numbers, without breaking down the number into its constituent digits.)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">? : LN720 :: KP910 : LQ1100 :: CD340 : DE530</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">LK530</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">KM530</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">MK540</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">KM540</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">KP910 → LQ1100</span><br><span style=\"font-family:'Cambria Math'\">K + 1 = L</span><br><span style=\"font-family:'Cambria Math'\">P + 1 = Q</span><br><span style=\"font-family:'Cambria Math'\">910 + 190 = 1100</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">CD340 → DE530</span><br><span style=\"font-family:'Cambria Math'\">C + 1 = D</span><br><span style=\"font-family:'Cambria Math'\">D + 1 = E</span><br><span style=\"font-family:'Cambria Math'\">340 + 190 = 530</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Same logic:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">? → LN720</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So, reverse:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">L - 1 = K</span><br><span style=\"font-family:'Cambria Math'\">N - 1 = M</span><br><span style=\"font-family:'Cambria Math'\">720 - 190 = 530</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Therefore, ? = KM530</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Correct Answer: (b) KM530</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Select the number from among the given options that can replace the question mark (?) in the following series.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2, 10, 30, 68, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">136</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">106</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">124</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">130</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Series: 2, 10, 30, 68, ?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pattern:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1³ + 1 = 2</span><br><span style=\"font-family:'Cambria Math'\">2³ + 2 = 10</span><br><span style=\"font-family:'Cambria Math'\">3³ + 3 = 30</span><br><span style=\"font-family:'Cambria Math'\">4³ + 4 = 68</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So,</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">5³ + 5 = 125 + 5 = 130</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(or use double difference)</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A person standing in front of a mirror finds their image to be erect and of the same size, but laterally inverted. Which type of mirror is being used?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Concave mirror</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Convex mirror</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Plane mirror</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Cylindrical mirror</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Plane mirror</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">A </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">plane mirror</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> always forms an image that is:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Erect (straight, not inverted vertically)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Same size as the object</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Laterally inverted (left-right reversal)</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">This matches exactly with the description in the question.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Concave mirror</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Can form real or virtual images depending on object position; size may vary (magnified or diminished).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Convex mirror</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Always forms diminished, virtual, and erect images.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Cylindrical mirror</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Produces distorted images, not same-size erect ones.</span></li></ul>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements about the President of India:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. The President is elected by a method of direct election.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. The minimum age to become President is 35 years.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">III. The President holds office for a term of five years.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the statements given above are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I and II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II and III</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I and III</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I, II and III All</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Only II and III</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> False</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The President of India is </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">not elected directly</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> by the people.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">He/She is elected </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">indirectly</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> by an </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Electoral College</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> consisting of elected members of both Houses of Parliament and elected members of the Legislative Assemblies of the States and Union Territories.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> True</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The minimum age required to become President of India is </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">35 years</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement III</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> True</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The President holds office for a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">term of five years</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, unless impeached earlier.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which is the largest freshwater lake in India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Wular Lake</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Dal Lake</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Chilika Lake</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Loktak Lake</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">The largest freshwater lake in India is Wular Lake, located in Bandipora district of Jammu &amp; Kashmir.</span><span style=\"font-family:'Cambria Math'\"> It covers an area that seasonally varies between </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">30–189 sq km</span><span style=\"font-family:'Cambria Math'\">, making it not only India’s largest freshwater lake but also one of the largest in Asia.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Wular Lake</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Situated about </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">40 km northwest of Srinagar</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in Jammu &amp; Kashmir.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Fed by the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Jhelum River</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and other mountain streams.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Declared a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ramsar Wetland of International Importance</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in 1990.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Supports rich biodiversity: migratory birds (e.g., mallards, pochards, shoveler ducks) and fish species (carp, schizothorax).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Provides livelihood to </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">8,000+ fishermen</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in the Kashmir Valley.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Dal Lake</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Much smaller, famous for houseboats and tourism, but not the largest.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Chilika Lake</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Largest brackish water lagoon in India, not freshwater.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Loktak Lake</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Known for floating phumdis in Manipur, but smaller than Wular.</span></li></ul>", "question_heading": ""}, {"sr_no": 74, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Match the following table:</span></p><table cellspacing=\"0\" cellpadding=\"0\" style=\"border:0.75pt solid #000000;border-collapse:collapse\"><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">List-I (Movement) </span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">List-II (Year of launch)</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A. Non-Cooperation</span><span style=\"font-family:'Cambria Math'\">  </span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. 1942</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">B. Civil Disobedience</span><span style=\"font-family:'Cambria Math'\">  </span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. 1920</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">C. Quit India</span><span style=\"font-family:'Cambria Math'\">  </span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3. 1930</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">D. Khilafat Movement</span><span style=\"font-family:'Cambria Math'\">  </span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">4. 1919</span></p></td></tr></table><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-2, B-4, C-1, D-3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-1, B-2, C-3, D-4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-3, B-2, C-1, D-4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-2, B-3, C-1, D-4</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: </span><span style=\"font-family:'Cambria Math'\">A-2, B-3, C-1, D-4</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Non-Cooperation Movement</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Launched in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1920</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> under Mahatma Gandhi after the Jallianwala Bagh massacre and Rowlatt Act.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Civil Disobedience Movement</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Started in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1930</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> with Gandhi’s </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Dandi March</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (Salt Satyagraha).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Quit India Movement</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Began in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1942</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> during World War II, demanding immediate independence.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Khilafat Movement</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Initiated in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1919</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> to protect the Ottoman Caliphate, led by Ali brothers.</span></li></ul>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The folk culture of ‘Hiljatra’ belongs to which Indian State?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Assam</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bihar</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Himachal Pradesh</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Uttarakhand</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">The folk culture of Hiljatra belongs to the state of Uttarakhand, specifically celebrated in the Pithoragarh district of the Kumaon region.</span><span style=\"font-family:'Cambria Math'\"> It is an agrarian festival linked to paddy transplantation and pastoral traditions. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Details:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">State</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Uttarakhand</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Region</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Sor Valley, Pithoragarh district (Kumaon region)</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Origin</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Traced back to the Sorar region of West Nepal, later introduced in Kumaon villages.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Theme</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Agricultural and pastoral activities, especially </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">paddy transplantation</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Special Features</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> →</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Mask dances depicting agrarian life.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Characters like Lakhiya Bhoot, Hiran Chital, and Mahakali.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Rituals include goat sacrifice, dramatic performances, and folk songs.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Recent Update</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → In 2024, Uttarakhand CM Pushkar Singh Dhami announced Hiljatra will be celebrated as a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">state festival</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">. </span></li></ul>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is an alloy consisting primarily of Copper, Zinc, and Nickel, often used in making silverware and gears due to its corrosion resistance?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Brass</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bronze</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">German Silver</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Duralumin</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: </span><span style=\"font-family:'Cambria Math'\">German Silver</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">German Silver</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (also called Nickel Silver) is an alloy made primarily of:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Copper (Cu)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Zinc (Zn)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Nickel (Ni)</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Despite its name, it contains </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">no actual silver</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It is valued for:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Corrosion resistance</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Silvery appearance</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Durability</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Common uses: </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">silverware, cutlery, gears, musical instruments, coins, and decorative items</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Brass</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Copper + Zinc (no Nickel).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bronze</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Copper + Tin (sometimes other metals).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Duralumin</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Aluminum + Copper + Magnesium + Manganese (used in aircraft, not silverware/gears).</span></li></ul>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Assertion (A):</span><span style=\"font-family:'Cambria Math'\"> The Rajya Sabha is a permanent house of Parliament.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Reason (R):</span><span style=\"font-family:'Cambria Math'\"> One-third of its members retire every two years.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Select the most appropriate answer:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is true, but the R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is false, but the R is true</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Both A and R are true, and R is the correct explanation of A</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Assertion (A)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → True</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Rajya Sabha</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">permanent house</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> of Parliament.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Unlike the Lok Sabha, it is </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">never dissolved</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Reason (R)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → True</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">One-third of its members </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">retire every two years</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, ensuring continuity.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This system of staggered retirement keeps the Rajya Sabha functioning permanently.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Since the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Reason (R)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> directly explains </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Assertion (A)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, the correct answer is: </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Both A and R are true, and R is the correct explanation of A.</span></li></ul>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Who took oath as the President of the United States in January 2025?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">JD Vance</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Joseph Biden</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kamala Harris</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Donald Trump</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Donald J. Trump was sworn in as the 47th President of the United States on January 20, 2025, at the U.S. Capitol in Washington, D.C.</span><span style=\"font-family:'Cambria Math'\"> This marked his return to the presidency, with JD Vance taking oath as Vice President.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Details:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Date of Oath Ceremony:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> January 20, 2025</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Location:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> U.S. Capitol, Washington, D.C.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">President Sworn In:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Donald J. Trump</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (47th President of the United States)</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Vice President:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">JD Vance</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Administered By:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> Chief Justice John Roberts of the U.S. Supreme Court</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Other Options Are Wrong:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Joseph Biden</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Served as the 46th President (2021–2025), did not take oath in 2025.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kamala Harris</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Served as Vice President under Biden, not sworn in as President.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">JD Vance</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Took oath as Vice President in 2025, not President.</span></li></ul>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which index is commonly used to measure retail inflation in India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">CPI</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">WPI</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">PPI</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">IIP</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option A: </span><span style=\"font-family:'Cambria Math'\">Consumer Price Index (CPI)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Consumer Price Index (CPI)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> →</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Measures </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">changes in the prices of goods and services consumed by households</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It reflects </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">retail inflation</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, i.e., the rise in cost of living for the common people.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Published monthly by the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">National Statistical Office (NSO)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Used by the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Reserve Bank of India (RBI)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> to frame monetary policy and inflation targeting.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Wholesale Price Index (WPI)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Measures wholesale inflation, not retail.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Producer Price Index (PPI)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Tracks prices received by producers; not India’s main retail inflation measure.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Index of Industrial Production (IIP)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Measures industrial output, not inflation.</span></li></ul>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The capital of the Mauryan Empire was located at which ancient city?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ujjaini</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pataliputra</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Taxila</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mathura</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option B: </span><span style=\"font-family:'Cambria Math'\">Pataliputra</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pataliputra</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (modern-day Patna, Bihar) was the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">capital city of the Mauryan Empire</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Founded by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ajatashatru</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in the 5th century BCE, it later became the political center under </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Chandragupta Maurya</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and flourished during </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ashoka’s reign</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It was strategically located near the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">confluence of the Ganga, Son, and Gandak rivers</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, making it ideal for administration, trade, and defense.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Known for its </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">grand palaces, fortified walls, and administrative efficiency</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, Pataliputra was one of the largest cities of the ancient world.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ujjaini</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Important city in western India, but not the Mauryan capital.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Taxila</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → A major center of learning in Gandhara, but not the capital.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mathura</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Significant religious and cultural hub, but not the capital.</span></li></ul>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements about the Himalayan mountain range:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. They are the youngest fold mountains in the world.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. Mount Everest is the highest peak of the world.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">III. The Himalayas extend over a length of about 2,400 km.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the statements given above are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I and II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II and III</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I and III</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I, II and III All</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: </span><span style=\"font-family:'Cambria Math'\">I, II and III All</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> True</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The Himalayas are the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">youngest fold mountains</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in the world, formed about </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">40–50 million years ago</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> due to the collision of the Indian Plate with the Eurasian Plate.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> True</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mount Everest (8,848.86 m)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">highest peak in the world</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, located in the Nepal Himalayas.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement III</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> True</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The Himalayas extend over a length of about </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">2,400 km</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, spanning across </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">five countries</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">: India, Nepal, Bhutan, China, and Pakistan.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">What does the abbreviation 'GUI' stand for in computer terminology?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Graphical Unified Inputs</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">General Utility Interface</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Graphical User Interface</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Generated Unique Inputs</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option C: Graphical User Interface</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Graphical User Interface (GUI)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> →</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">A type of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">user interface</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> that allows interaction with computers using </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">visual elements</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> like windows, icons, menus, and buttons.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Makes computing more </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">user-friendly</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> compared to text-based command-line interfaces (CLI).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Examples: Microsoft Windows, macOS, Android, iOS.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Indian Paramilitary Force successfully completed its first-ever all-women international mountaineering expedition to Mount Everest in 2026?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Indo-Tibetan Border Police</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sashastra Seema Bal</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Border Security Force </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Central Industrial Security Force</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">The Indo-Tibetan Border Police (ITBP) successfully completed its first-ever all-women international mountaineering expedition to Mount Everest in May 2026, marking a historic achievement for India’s paramilitary forces.</span><span style=\"font-family:'Cambria Math'\"> The 14-member team, including 11 women climbers, summited via the South Col route on May 21, 2026. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Facts about the ITBP Expedition</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Force:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> Indo-Tibetan Border Police (ITBP)</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Date of Summit:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">21 May 2026</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Route:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> South Col (Nepal side)</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Team Composition:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> 14 members (11 women climbers + 3 technical/support staff)</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">First Summit Time:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> 06:52 AM IST</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Campaign:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> Part of ITBP’s “Clean Himalaya – Save Glacier” initiative (collected non-biodegradable waste during expedition).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Significance:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> First-ever all-women international expedition by ITBP; reflects focus on </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">women empowerment</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">high-altitude operational excellence</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Fundamental Rights in the Indian Constitution are contained in which Articles?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Articles 12 to 35</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Articles 36 to 51</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Articles 52 to 78</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Articles 79 to 124</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option A: </span><span style=\"font-family:'Cambria Math'\">Articles 12 to 35</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Articles 12 to 35</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → These form </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Part III of the Constitution</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, often called the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">“Magna Carta of India.”</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">They guarantee essential rights such as:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Right to Equality</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (Articles 14–18)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Right to Freedom</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (Articles 19–22)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Right against Exploitation</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (Articles 23–24)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Right to Freedom of Religion</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (Articles 25–28)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Cultural and Educational Rights</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (Articles 29–30)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Right to Constitutional Remedies</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (Article 32)</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Other options are incorrect:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Articles 36–51</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Directive Principles of State Policy (Part IV).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Articles 52–78</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Union Executive (President, Council of Ministers).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Articles 79–124</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Parliament (Lok Sabha, Rajya Sabha, procedures).</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">World Environment Day is observed on which date every year?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">8th of March</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">22nd of April</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">5th of June</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">21st of June</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option C: </span><span style=\"font-family:'Cambria Math'\">5th of June</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">World Environment Day</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> was established by the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">United Nations General Assembly in 1972</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, following the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Stockholm Conference on the Human Environment</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">First celebrated in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1974</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, it has become the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">largest global platform for environmental awareness</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Each year, it is hosted by a different country with a specific </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">theme</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> focusing on pressing environmental issues (e.g., biodiversity, climate change, plastic pollution).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It encourages </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">global participation</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> through campaigns, tree planting, clean</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">up drives, and awareness programs.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">8th March</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → International Women’s Day.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">22nd April</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Earth Day, not World Environment Day.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">21st June</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → International Day of Yoga.</span></li></ul>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambri "font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">right to safe passage on highways</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 14</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Equality before law, not related to highways.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 16</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Equality of opportunity in public employment.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 19</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Freedom of speech, movement, association, etc.</span></li></ul>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following curves graphically represents the inverse relationship between the rate of unemployment and the rate of inflation in an economy?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Laffer Curve</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lorenz Curve</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Phillips Curve</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kuznets Curve</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Phillips Curve</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Phillips Curve</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> shows the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">inverse relationship</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> between the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">rate of unemployment</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">rate of inflation</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in an economy.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Concept:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;paddi
