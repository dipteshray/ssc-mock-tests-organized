ng-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">When unemployment is low → demand for goods/services rises → inflation tends to increase.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">When unemployment is high → demand falls → inflation tends to decrease.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It was first introduced by economist </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">A.W. Phillips</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in 1958, based on UK data.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Laffer Curve</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Shows relation between tax rates and government revenue.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Lorenz Curve</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Represents income inequality in a population.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kuznets Curve</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Shows relationship between economic growth and income inequality.</span></li></ul>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following flagship welfare schemes was launched by Prime Minister Narendra Modi on May 1, 2016 at Ballia (Uttar Pradesh)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pradhan Mantri Shram Yogi Maan-Dhan </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pradhan Mantri Ujjwala Yojana</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pradhan Mantri Jan Dhan Yojana</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pradhan Mantri Awas Yojana - Gramin </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Pradhan Mantri Ujjwala Yojana (PMUY)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pradhan Mantri Ujjwala Yojana</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> was launched by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Prime Minister Narendra Modi on 1 May 2016 at Ballia, Uttar Pradesh</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Objective:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> Provide </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">LPG connections to women from Below Poverty Line (BPL) households</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, reducing dependence on firewood and kerosene.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Target:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> Initially 5 crore connections, later expanded to 8 crore.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Significance:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Promotes </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">women’s health and empowerment</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Reduces indoor air pollution.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Encourages clean cooking fuel adoption.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Cambria Math'\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pradhan Mantri Shram Yogi Maan-Dhan</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Launched in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">2019</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, pension scheme for unorganized workers.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pradhan Mantri Jan Dhan Yojana</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Launched in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">2014</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, financial inclusion scheme.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pradhan Mantri Awas Yojana – Gramin</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Launched in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">2016</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, but in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">November 2016</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, not May 1.</span></li></ul>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In context to malicious software and cybersecurity, what is a \"Trojan Horse\"? </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A hardware device designed to monitor network traffic</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">An automated tool to clean operating system registries</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A legitimate-looking software that misleads users of its true intent </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A type of network protocol used for secure file transfer</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: </span><span style=\"font-family:'Cambria Math'\">A legitimate-looking software that misleads users of its true intent</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">A </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Trojan Horse</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in cybersecurity refers to </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">malicious software disguised as legitimate software</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It tricks users into installing or running it, often appearing as a useful program, file, or update.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Once executed, it can:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Steal sensitive data (passwords, banking info).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Install backdoors for hackers.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Damage or control the system.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The name comes from the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Greek myth of the Trojan Horse</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, where soldiers hid inside a wooden horse to infiltrate Troy.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Hardware device monitoring traffic</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → That’s a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">network sniffer</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> or </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">packet analyzer</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, not a Trojan.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Automated tool to clean registries</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Legitimate utility software, not malware.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Network protocol for secure file transfer</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Refers to </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">SFTP/FTPS</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, not a Trojan.</span></li></ul>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Who won the Australian Open Men's Singles title in January 2026?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Jannik Sinner</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Carlos Alcaraz</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Novak Djokovic</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Daniil Medvedev</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Carlos Alcaraz won the Australian Open Men’s Singles title in January 2026, defeating Novak Djokovic in the final 2–6, 6–2, 6–3, 7–5 at Rod Laver Arena, Melbourne.</span><span style=\"font-family:'Cambria Math'\"> This victory made him the youngest man in the Open Era to complete a career Grand Slam. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Highlights:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Champion:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> Carlos Alcaraz (Spain, World No. 1)</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Runner-up:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> Novak Djokovic (Serbia, 10-time AO champion)</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Final Score:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> 2–6, 6–2, 6–3, 7–5</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Date:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> 1 February 2026</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Venue:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> Rod Laver Arena, Melbourne, Australia</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Historic Note:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> Alcaraz became the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">youngest man (22 years)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> to achieve a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Career Grand Slam</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (titles at all four majors).</span></li></ul>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In the human digestive system, which enzyme is secreted by the gastric glands of the stomach to initiate the chemical breakdown of complex proteins into smaller peptides?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Trypsin</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Amylase</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pepsin</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lipase</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Pepsin</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">In the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">human digestive system</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">gastric glands of the stomach</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> secrete </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pepsinogen</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, which is converted into </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pepsin</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in the presence of hydrochloric acid (HCl).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pepsin</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">primary proteolytic enzyme</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in the stomach.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Function: It initiates the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">chemical breakdown of complex proteins into smaller peptides</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This is the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">first major step</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in protein digestion before further breakdown by enzymes like </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">trypsin</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in the small intestine.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Trypsin</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Secreted by the pancreas into the small intestine, not by gastric glands.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Amylase</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Breaks down starch into sugars; secreted by salivary glands and pancreas, not stomach.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Lipase</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Breaks down fats into fatty acids and glycerol; mainly secreted by pancreas.</span></li></ul>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The famous traveler Ibn Battuta, who authored the book Rihla, visited India during the reign of which Delhi Sultanate ruler?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Alauddin Khalji</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ghiyasuddin Tughluq</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bahlol Lodhi</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Muhammad bin Tughluq</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Muhammad bin Tughluq</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The famous Moroccan traveler </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ibn Battuta</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> visited India during the reign of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Muhammad bin Tughluq</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> of the Delhi Sultanate.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">He arrived in India in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1333 CE</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and stayed for about </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">7 years</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Muhammad bin Tughluq appointed him as the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Qazi (judge)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> of Delhi.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Ibn Battuta later authored the travelogue </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">“Rihla”</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, which provides valuable insights into the social, cultural, and political conditions of 14th</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">century India.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Alauddin Khalji</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Reigned earlier (1296–1316 CE), before Ibn Battuta’s visit.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ghiyasuddin Tughluq</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Founder of Tughluq dynasty, ruled 1320–1325 CE; Ibn Battuta came later.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bahlol Lodhi</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Founder of Lodhi dynasty, ruled much later (1451–1489 CE).</span></li></ul>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In forestry, the dense \"Sunderbans\" region of West Bengal represents which specific ecological category of forests?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Tropical Deciduous Forests</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Montane Forests</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Thorn and Scrub Forests</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Tidal Forests</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Tidal Forests</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sunderbans</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in West Bengal represent </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Tidal Forests</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, also known as </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mangrove Forests</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">These forests grow in the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">deltaic regions</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> where rivers meet the sea, influenced by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">tides</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Key features:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Dense mangrove vegetation.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Saline and waterlogged soil.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Specialized roots like </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">stilt roots</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">pneumatophores</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> for breathing in waterlogged conditions.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Famous for the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Royal Bengal Tiger</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, estuarine crocodiles, and rich biodiversity.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Tropical Deciduous Forests</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Found in central India; shed leaves seasonally, not tidal.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Montane Forests</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Found in Himalayan regions; altitude-based vegetation.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Thorn and Scrub Forests</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Found in arid regions (Rajasthan, Gujarat); not deltaic.</span></li></ul>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following subjects are listed under the Concurrent List of the Indian Constitution?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. Education</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. Defence</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">III. Criminal Law</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Select the correct option:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I and II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II and III</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I and III</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I, II and III All</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Only I and III (Education and Criminal Law)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Concurrent List</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in the Indian Constitution contains subjects on which </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">both the Union and State legislatures can make laws</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Education</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Added to the Concurrent List by the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">42nd Constitutional Amendment Act, 1976</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Criminal Law</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Always part of the Concurrent List, as uniformity is needed across the country.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Defence</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Falls under the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Union List</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, since it is a matter of national importance and cannot be legislated by states.</span></li></ul>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following sports terms is associated with the game of football?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Libro</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Deuce</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rally</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Offside</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Offside</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">In </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">football (soccer)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, the term </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Offside</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> refers to a rule violation where an attacking player is positioned closer to the opponent’s goal line than both the ball and the second-last defender at the moment the ball is played to them.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Purpose: Prevents attackers from “goal-hanging” and ensures fair play.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It is one of the most fundamental and frequently debated rules in football.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Libro</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → A defensive specialist in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">volleyball</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, not football.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Deuce</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → A tied score (40–40) in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">tennis</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, not football.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Rally</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → A sequence of shots in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">badminton/tennis</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, not football.</span></li></ul>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Who was the British Prime Minister who announced the infamous \"Communal Award\" in 1932, establishing separate electorates for minority communities and depressed classes?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ramsay MacDonald</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Winston Churchill</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Clement Attlee</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lord Linlithgow</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Ramsay MacDonald</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Communal Award</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> was announced in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">August 1932</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">British Prime Minister Ramsay MacDonald</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It introduced </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">separate electorates</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> for minority communities such as Muslims, Sikhs, Indian Christians, Anglo-Indians, Europeans, and also for the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Depressed Classes (Scheduled Castes)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The Award was intended to provide political representation to marginalized groups but was widely criticized for deepening communal divisions.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">In response, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mahatma Gandhi</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> launched a fast unto death against separate electorates for the Depressed Classes, leading to the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Poona Pact (1932)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> between Gandhi and B.R. Ambedkar.</span></li></ul>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In database management systems (DBMS), a unique identifier key within a table that ensures no duplicate rows or null entries are permitted is called a:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Foreign Key</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Composite Key</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Primary Key</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Candidate Key</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Primary Key</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">In a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Database Management System (DBMS)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Primary Key</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">unique identifier</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> for each record in a table.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Properties:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Ensures </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">uniqueness</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → No two rows can have the same primary key value.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Prevents </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">null entries</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Primary key fields cannot be left blank.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Used to uniquely identify tuples (rows) in a relation (table).</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Foreign Key</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Links one table to another; ensures referential integrity, but not uniqueness within the same table.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Composite Key</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → A combination of two or more columns used together to uniquely identify a record; not necessarily a single unique identifier.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Candidate Key</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Any attribute(s) that can potentially serve as a primary key; once chosen, it becomes the primary key.</span></li></ul>", "question_heading": ""}, {"sr_no": 100, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following state borders does NOT share a boundary line with the landlocked state of Chhattisgarh?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Jharkhand</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bihar</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Andhra Pradesh</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Maharashtra</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Bihar</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The landlocked state of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Chhattisgarh</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> shares its boundaries with </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">7 states</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Uttar Pradesh</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (north)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Jharkhand</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (north-east)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Odisha</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (east)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Andhra Pradesh</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (south)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Telangana</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (south-west)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Maharashtra</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (west)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Madhya Pradesh</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (north-west)</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bihar</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> does </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">not</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> share a boundary with Chhattisgarh.</span></li></ul>", "question_heading": ""}, {"sr_no": 101, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The ideal of \"Liberty, Equality, and Fraternity\" enshrined in the Preamble of the Indian Constitution was inspired by the revolution of which country?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Russian Revolution</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">American Revolution</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">French Revolution</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Irish Revolution</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: </span><span style=\"font-family:'Cambria Math'\">French Revolution</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The ideal of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Liberty, Equality, and Fraternity</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> enshrined in the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Preamble of the Indian Constitution</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> was inspired by the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">French Revolution (1789–1799)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">These three principles became the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">motto of the French Republic</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and symbolized the fight against monarchy, feudalism, and inequality.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The framers of the Indian Constitution adopted these ideals to emphasize:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Liberty</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Freedom of thought, expression, belief, faith, and worship.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Equality</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Equal status and opportunity for all citizens.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Fraternity</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Promoting unity and brotherhood among diverse communities.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 102, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is an example of a volatile memory in a computer system?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">ROM</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">RAM</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">SSD</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">HDD</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option B: </span><span style=\"font-family:'Cambria Math'\">RAM (Random Access Memory)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">RAM</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> →</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">A </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">volatile memory</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, meaning it loses all stored data once the power is switched off.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Used as the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">main working memory</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> of a computer for temporary storage of programs and data currently in use.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Provides </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">fast read/write access</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, essential for system performance.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Other options are non</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">volatile:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">ROM (Read</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Only Memory)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Non</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">volatile, retains data permanently.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">SSD (Solid State Drive)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Non</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">volatile storage device.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">HDD (Hard Disk Drive)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Non</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">volatile magnetic storage device.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 103, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The famous iron pillar located near the Qutub Minar complex in Delhi, noted for its exceptional resistance to corrosion, was constructed during the reign of which historical dynasty?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sunga Dynasty</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Haryanka Dynasty</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Maurya Dynasty</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Gupta Dynasty</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Gupta Dynasty</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The famous </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Iron Pillar of Delhi</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, located near the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Qutub Minar complex</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, is renowned for its </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">exceptional resistance to corrosion</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> despite being over 1,600 years old.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It was constructed during the reign of the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Gupta Dynasty</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, most likely under </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Chandragupta II (Vikramaditya)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">4th century CE</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The pillar is about </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">7.2 meters high</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and weighs over </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">6 tonnes</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Its </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">inscription in Sanskrit (Brahmi script)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> praises the Gupta ruler’s military conquests.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The iron’s purity and advanced metallurgical techniques of the Gupta period explain its remarkable durability.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sunga Dynasty</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Much earlier (2nd–1st century BCE), not linked to the pillar.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Haryanka Dynasty</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Ancient Magadha dynasty (6th–5th century BCE), far before Gupta metallurgy.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Maurya Dynasty</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Famous for Ashokan pillars, but the corrosion-resistant iron pillar is Gupta-era.</span></li></ul>", "question_heading": ""}, {"sr_no": 104, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is a Fundamental Right under Part III of the Indian Constitution?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Right to Health</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Right to Property</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Right to Work</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Right to Equality</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option D: </span><span style=\"font-family:'Cambria Math'\">                           </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Right to Equality</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Enshrined in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Articles 14–18</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, guarantees:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Equality before law</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (Article 14)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Prohibition of discrimination</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (Article 15)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Equality of opportunity in public employment</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (Article 16)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Abolition of untouchability</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (Article 17)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Abolition of titles</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (Article 18)</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Other options are not Fundamental Rights:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Right to Health</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Directive Principle (Article 47), not a Fundamental Right.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Right to Property</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Originally a Fundamental Right (Article 31), but removed by the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">44th Amendment, 1978</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">; now a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">legal right under Article 300A</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Right to Work</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Directive Principle (Article 41), not enforceable as a Fundamental Right.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 105, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In physical geography, the deep, steep-sided valleys formed by the structural down-faulting of the Earth's crust between two parallel faults are termed as:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Hanging Valleys</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rift Valleys</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Karst Valleys</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">U-shaped Valleys</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Rift Valleys</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Rift Valleys</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> are </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">deep, steep-sided valleys</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> formed due to </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">structural down-faulting of the Earth’s crust between two parallel faults</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">They occur when a block of the Earth’s crust </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">sinks</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> between two faults due to tectonic forces.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Famous examples:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">East African Rift Valley</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (Kenya, Tanzania, Ethiopia)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Rhine Rift Valley</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (Germany)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Narmada Rift Valley</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (India)</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Hanging Valleys</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Formed by glacial erosion; smaller valleys join a main valley at a higher level.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Karst Valleys</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Created by chemical weathering of limestone; associated with caves and sinkholes.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">U-shaped Valleys</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Formed by glaciers; have a characteristic U-shape due to ice erosion.</span></li></ul>", "question_heading": ""}, {"sr_no": 106, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The COP31 United Nations Climate Change Conference of 2026 is scheduled to be hosted in which city?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Istanbul</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Athens</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Antalya</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rome</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">COP31 United Nations Climate Change Conference of 2026</span><span style=\"font-family:'Cambria Math'\"> will be hosted in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Antalya, Türkiye</span><span style=\"font-family:'Cambria Math'\">, from </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">9–20 November 2026</span><span style=\"font-family:'Cambria Math'\"> at the Antalya EXPO Center. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Details about COP31:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10
