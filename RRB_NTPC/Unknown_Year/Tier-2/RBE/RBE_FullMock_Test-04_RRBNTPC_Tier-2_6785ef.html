>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Nepal</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Myanmar</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Tibet</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bhutan</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option C: Tibet</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">In </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Tibet</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, the Brahmaputra is called </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Tsang Po (Yarlung Tsangpo)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It originates from the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Chemayungdung Glacier</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> near Mount Kailash in Tibet.</span></li><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The river flows eastward across Tibet as Tsang Po before entering India (Arunachal Pradesh) as the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Siang/Dihang</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, and then Assam as the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Brahmaputra</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 101, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which disease is caused by deficiency of Iodine?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Scurvy</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Beriberi</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rickets</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Goitre</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option D: </span><span style=\"font-family:'Cambria Math'\">Goitre</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Goitre</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Caused by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">iodine deficiency</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, leading to enlargement of the thyroid gland.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Iodine is essential for the synthesis of thyroid hormones (T3 and T4).</span></li><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Deficiency results in swelling in the neck region and can cause hypothyroidism.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Scurvy</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Caused by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Vitamin C deficiency</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Beriberi</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Caused by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Vitamin B1 (Thiamine) deficiency</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Rickets</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Caused by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Vitamin D deficiency</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, leading to weak and deformed bones in children.</span></li></ul>", "question_heading": ""}, {"sr_no": 102, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Article of the Indian Constitution deals with the appointment of the Prime Minister by the President?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 74</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 75</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 76</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 78</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option B: </span><span style=\"font-family:'Cambria Math'\">Article 75</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 75</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → States that the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Prime Minister shall be appointed by the President</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The President appoints the leader of the majority party (or coalition) in the Lok Sabha as the Prime Minister.</span></li><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Other ministers are appointed by the President on the advice of the Prime Minister.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 74</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Deals with the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Council of Ministers</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> to aid and advise the President.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 76</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Deals with the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Attorney General of India</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, the highest law officer.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 78</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Specifies the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">duties of the Prime Minister</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (to communicate decisions of the Council of Ministers to the President, etc.).</span></li></ul>", "question_heading": ""}, {"sr_no": 103, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which gas turns lime water milky?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Hydrogen</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Nitrogen</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Oxygen</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Carbon dioxide</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option D: Carbon dioxide</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Carbon dioxide</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → When passed through lime water (Ca(OH)₂ solution), it reacts to form </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">calcium carbonate (CaCO₃)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, which is insoluble and gives a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">milky appearance</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Reaction:</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1780652151708_image001.png\" width=\"217\" height=\"21\" alt style=\"vertical-align:middle\" ></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Hydrogen</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Does not react with lime water.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Nitrogen</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Inert, no reaction with lime water.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Oxygen</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → No reaction with lime water.</span></li></ul>", "question_heading": ""}, {"sr_no": 104, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Assertion (A):</span><span style=\"font-family:'Cambria Math'\"> A fuse wire is connected in series with an electrical appliance.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Reason (R):</span><span style=\"font-family:'Cambria Math'\"> It protects the circuit by hardening when excessive current flows.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, but R is not the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, and R is the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is false, but R is true</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is true, but R is false</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option D: </span><span style=\"font-family:'Cambria Math'\">A is true, but R is false</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Assertion (A)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">A </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">fuse wire</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is always connected in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">series</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> with an electrical appliance or circuit.</span></li><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This ensures that if the fuse blows, the circuit is broken and current stops flowing, protecting the appliance.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Reason (R)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → False.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">A fuse does </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">not harden</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> when excessive current flows.</span></li><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Instead, it is made of a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">low melting point material</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (like tin-lead alloy).</span></li><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">When excessive current flows, the fuse wire </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">melts</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> due to heating, breaking the circuit.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 105, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Sikh Guru founded the Khalsa in 1699?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Guru Nanak Dev</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Guru Arjan Dev</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Guru Gobind Singh</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Guru Tegh Bahadur</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option C: </span><span style=\"font-family:'Cambria Math'\">Guru Gobind Singh</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Guru Gobind Singh</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (1666–1708), the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">10th Sikh Guru</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, founded the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Khalsa Panth</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> on </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Baisakhi, 13 April 1699</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> at Anandpur Sahib.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">He initiated the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Panj Pyare (Five Beloved Ones)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and introduced the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Khalsa code of conduct</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, including the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Five Ks (Kesh, Kangha, Kara, Kachera, Kirpan)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The Khalsa was created to instill courage, discipline, and unity among Sikhs against Mughal oppression.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Guru Nanak Dev</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Founder of Sikhism, but not the Khalsa.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Guru Arjan Dev</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Compiled the Adi Granth, but did not found the Khalsa.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Guru Tegh Bahadur</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → 9th Guru, martyred for defending religious freedom, but Khalsa was founded by his son Guru Gobind Singh.</span></li></ul>", "question_heading": ""}, {"sr_no": 106, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Assertion (A):</span><span style=\"font-family:'Cambria Math'\"> Laterite soil is generally poor in humus.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Reason (R):</span><span style=\"font-family:'Cambria Math'\"> Heavy rainfall causes intense leaching in laterite regions.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is false, but R is true</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, and R is the correct explanation of A</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is true, but R is false</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option C: </span><span style=\"font-family:'Cambria Math'\">Both A and R are true, and R is the correct explanation of A</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Assertion (A)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Laterite soil is generally </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">poor in humus</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> because organic matter gets washed away due to heavy rainfall.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Reason (R)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">In regions of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">high rainfall and temperature</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, intense </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">leaching</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> occurs.</span></li><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Soluble minerals and nutrients are removed, leaving behind oxides of iron and aluminum.</span></li><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This explains why laterite soil is poor in humus and fertility.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Since the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">reason directly explains the assertion</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, both are true and R is the correct explanation of A.</span></li></ul>", "question_heading": ""}, {"sr_no": 107, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which vitamin is mainly produced in the human body when the skin is exposed to sunlight?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Vitamin C</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Vitamin A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Vitamin D</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Vitamin K</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option C: </span><span style=\"font-family:'Cambria Math'\">Vitamin D</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Vitamin D</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → When the skin is exposed to </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">ultraviolet-B (UVB) rays</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> from sunlight, it synthesizes </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Vitamin D3 (cholecalciferol)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This vitamin is essential for </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">calcium absorption</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and maintaining healthy bones and teeth.</span></li><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Deficiency can lead to </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">rickets</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in children and </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">osteomalacia/osteoporosis</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in adults.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Vitamin C</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Obtained mainly from citrus fruits, not produced by sunlight.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Vitamin A</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Found in carrots, leafy vegetables, fish oils; important for vision.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Vitamin K</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Produced by gut bacteria, important for blood clotting.</span></li></ul>", "question_heading": ""}, {"sr_no": 108, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which crop is mainly associated with the Rabi season in India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Jute</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Wheat</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rice</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Cotton</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option B: Wheat</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Wheat</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → The most important </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Rabi crop</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, sown in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">winter (October–December)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and harvested in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">spring (March–April)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Rabi crops</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> depend on </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">irrigation</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> rather than monsoon rains.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Jute</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → A </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kharif crop</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, grown in rainy season.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Rice</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Mainly a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kharif crop</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, dependent on monsoon rains.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Cotton</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Also a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kharif crop</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, sown in summer and harvested in autumn.</span></li></ul>", "question_heading": ""}, {"sr_no": 109, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which metal is the main constituent of haemoglobin in human blood?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Copper</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Zinc</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Calcium</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Iron</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option D: </span><span style=\"font-family:'Cambria Math'\">Iron</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Iron</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Haemoglobin is a protein in red blood cells that carries oxygen.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Each haemoglobin molecule contains </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">heme groups</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, and at the center of each heme group is an </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">iron (Fe²⁺) atom</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This iron atom binds reversibly with oxygen, allowing haemoglobin to transport oxygen from the lungs to tissues and return carbon dioxide to the lungs.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Copper</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Important for enzymes, but not the main constituent of haemoglobin.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Zinc</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Found in enzymes like carbonic anhydrase, not haemoglobin.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Calcium</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Essential for bones and muscle contraction, not haemoglobin.</span></li></ul>", "question_heading": ""}, {"sr_no": 110, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The headquarters of the International Court of Justice is located in which city?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Vienna</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Hague</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">New York</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Geneva</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">The headquarters of the International Court of Justice (ICJ) is located in The Hague, Netherlands, inside the Peace Palace.</span><span style=\"font-family:'Cambria Math'\"> It is the principal judicial organ of the United Nations and the only UN organ not based in New York. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Facts about the ICJ Headquarters:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">City &amp; Country:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> The Hague, Netherlands</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Building:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> Peace Palace (constructed 1907–1913, funded by Andrew Carnegie)</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Established:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> 1945 (began functioning in 1946)</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Significance:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> The ICJ settles disputes between states and gives advisory opinions on legal questions referred by UN organs.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Unique Feature:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> Of the six principal UN organs, the ICJ is the only one located outside New York. </span></li></ul>", "question_heading": ""}, {"sr_no": 111, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which gland is known as the master gland of the human body?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pituitary gland</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pancreas</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Adrenal gland</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Thyroid gland</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option A: </span><span style=\"font-family:'Cambria Math'\">Pituitary gland</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pituitary gland</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Called the master gland because it controls and regulates the activity of many other endocrine glands (thyroid, adrenal, gonads).</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It secretes hormones like </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Growth Hormone (GH)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Thyroid Stimulating Hormone (TSH)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Adrenocorticotropic Hormone (ACTH)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, and </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Follicle Stimulating Hormone (FSH)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Located at the base of the brain, just below the hypothalamus.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pancreas</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Produces insulin and glucagon, regulates blood sugar.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Adrenal gland</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Produces adrenaline, cortisol, aldosterone.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Thyroid gland</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Produces thyroxine, regulates metabolism.</span></li></ul>", "question_heading": ""}, {"sr_no": 112, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following statements about Indian ports is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. Kandla is located on the western coast of India.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. Paradip Port is located in Andhra Pradesh.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">III. Chennai Port lies on the Bay of Bengal coast.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I and II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II and III</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I and III</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I, II and III All</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option C: Only I and III</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kandla Port</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (now Deendayal Port) is located in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Gujarat</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> on the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">western coast of India</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Incorrect.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Paradip Port</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is located in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Odisha</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, not Andhra Pradesh.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement III</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Chennai Port</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> lies on the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bay of Bengal coast</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in Tamil Nadu.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 113, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which layer of the atmosphere contains the ozone layer?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Troposphere</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Stratosphere</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Thermosphere</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mesosphere</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option B: Stratosphere</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Stratosphere</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (10–50 km above Earth’s surface) contains the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">ozone layer</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, which absorbs harmful </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">ultraviolet (UV) radiation</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> from the Sun.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This protective layer prevents excessive UV rays from reaching Earth, safeguarding life from genetic damage and skin cancers.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Troposphere</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Lowest layer, where weather phenomena occur.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Thermosphere</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Contains the ionosphere, important for radio communication.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mesosphere</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Meteors burn up here, but no ozone layer.</span></li></ul>", "question_heading": ""}, {"sr_no": 114, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">What protocol dynamically maps IP addresses to local MAC addresses?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Address Resolution Protocol</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Domain Name Specification</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Dynamic Host Configuration</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">File Transfer Framework</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option A: </span><span style=\"font-family:'Cambria Math'\">Address Resolution Protocol (ARP)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Address Resolution Protocol (ARP)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Used in IPv4 networks to map a device’s </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">IP address</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (logical address) to its </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">MAC address</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (physical hardware address).</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Example: When a computer wants to send data to another device on the same LAN, it uses ARP to find the MAC address corresponding to the IP address.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Domain Name Specification</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Refers to DNS, which maps domain names to IP addresses, not IP to MAC.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Dynamic Host Configuration</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → DHCP assigns IP addresses dynamically, but does not map them to MAC addresses.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">File Transfer Framework</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Refers to protocols like FTP, used for file transfer, unrelated to IP–MAC mapping.</span></li></ul>", "question_heading": ""}, {"sr_no": 115, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is an input device of a computer?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Monitor</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Speaker</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Keyboard</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Printer</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option C: </span><span style=\"font-family:'Cambria Math'\">Keyboard</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Keyboard</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → An </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">input device</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> used to enter data (letters, numbers, commands) into the computer.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Monitor</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Output device, displays information.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Speaker</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Output device, produces sound.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Printer</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Output device, gives hard copy of data.</span></li></ul>", "question_heading": ""}, {"sr_no": 116, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Mughal emperor built the Buland Darwaza at Fatehpur Sikri?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Akbar</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Jahangir</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Shah Jahan</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Aurangzeb</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option A: Akbar</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Akbar</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> constructed the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Buland Darwaza (Gate of Magnificence)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1601</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> to commemorate his victory over Gujarat.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It is the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">largest gateway in India</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, located at Fatehpur Sikri near Agra.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Architectural style: Mughal, with Persian influences.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Height: About </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">54 meters</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (177 feet).</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Jahangir</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Known for his patronage of art and gardens, not for Buland Darwaza.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Shah Jahan</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Famous for the Taj Mahal and other marble architecture.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Aurangzeb</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Known for strict religious policies, not monumental gateways.</span></li></ul>", "question_heading": ""}, {"sr_no": 117, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which acid is present in lemon juice?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Acetic acid</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lactic acid</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Citric acid</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Oxalic acid</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option C: Citric acid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Citric acid</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → A weak organic acid naturally found in citrus fruits like lemon, orange, and grapefruit.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Gives lemon juice its </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">sour taste</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Plays a role in the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">citric acid cycle (Krebs cycle)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in metabolism.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Acetic acid</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Found in vinegar, not lemon.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Lactic acid</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Found in sour milk and curd, produced by lactic acid bacteria.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Oxalic acid</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Found in spinach and leafy vegetables, not in lemon juice.</span></li></ul>", "question_heading": ""}, {"sr_no": 118, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following statements about the Lok Sabha is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. Members are directly elected by the people.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. Its normal term is five years unless dissolved earlier.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">III. The Vice-President is the ex-officio Speaker of the Lok Sabha.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I and II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II and III</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I and III</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I, II and III All </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option A: </span><span style=\"font-family:'Cambria Math'\">Only I and II</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Members of the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Lok Sabha</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> are directly elected by the people of India through </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">universal adult suffrage</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The normal term of the Lok Sabha is </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">five years</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, unless dissolved earlier by the President.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement III</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → False.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-fam
