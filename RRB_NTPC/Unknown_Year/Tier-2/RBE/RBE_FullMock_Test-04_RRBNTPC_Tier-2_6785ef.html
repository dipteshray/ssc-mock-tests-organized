h'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Reserve Bank of India (RBI)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> issues all currency notes in India </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">except the one-rupee note</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, which is issued by the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ministry of Finance</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The RBI acts as the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">banker to the Government of India</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, managing public debt, issuing loans, and handling government accounts.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement III</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The RBI controls </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">monetary policy</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in India, using tools like Repo Rate, Reverse Repo Rate, CRR, and SLR to regulate inflation, liquidity, and economic stability.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which system anomaly occurs when virtual memory paging overloads physical RAM?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Core Dump Exception</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Deadlock Thread Lock</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Severe System Thrashing</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Buffer Overflow Fault</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option C: </span><span style=\"font-family:'Cambria Math'\">Severe System Thrashing</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Severe System Thrashing</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Happens when the operating system spends more time </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">swapping pages in and out of RAM</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> than executing actual processes.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Caused by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">excessive paging</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> when RAM is insufficient.</span></li><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Results in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">extreme slowdown</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and poor system performance.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Core Dump Exception</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Occurs when a program crashes and memory contents are dumped for debugging, not related to paging overload.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Deadlock Thread Lock</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → A concurrency issue where processes wait indefinitely for resources, unrelated to paging.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Buffer Overflow Fault</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Security vulnerability caused by writing more data into a buffer than it can hold, not linked to virtual memory paging.</span></li></ul>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Who founded the Indian National Congress in 1885?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A. O. Hume</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Surendranath Banerjee</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Dadabhai Naoroji</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">W. C. Banerjee</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option A: Allan Octavian Hume (A. O. Hume)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">A. O. Hume</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → A retired British civil servant, he played a key role in establishing the INC in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">December 1885</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">His aim was to provide a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">platform for Indians</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> to voice their political concerns and demands peacefully.</span></li><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The first session was held in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bombay (Mumbai)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, attended by 72 delegates.</span></li></ul></li><li style=\"margin-left:27.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">W. C. Bonnerjee</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Presided over the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">first session</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> of INC in 1885, but he was not the founder.</span></li><li style=\"margin-left:27.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Dadabhai Naoroji</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Known as the Grand Old Man of India, later became INC President, but not the founder.</span></li><li style=\"margin-left:27.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Surendranath Banerjee</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Early nationalist leader, founded the Indian National Association, which later merged with INC.</span></li></ul>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which organelle is called the powerhouse of the cell?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ribosome</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lysosome</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mitochondria</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Golgi body</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option C: Mitochondria</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mitochondria</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Known as the powerhouse of the cell because they generate </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">ATP (Adenosine Triphosphate)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, the energy currency of the cell, through </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">cellular respiration</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">They play a vital role in energy production, metabolism, and regulation of cell death (apoptosis).</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ribosome</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Called the protein factory of the cell, not the powerhouse.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Lysosome</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Known as the suicidal bags of the cell, responsible for digestion and breakdown.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Golgi body</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Functions as the post office of the cell, modifying and packaging proteins.</span></li></ul>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which city is located on the banks of the Sabarmati River?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Surat</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Vadodara</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rajkot</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ahmedabad</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option D: Ahmedabad</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ahmedabad</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Situated on the banks of the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sabarmati River</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in Gujarat.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Famous for the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sabarmati Ashram</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, established by Mahatma Gandhi.</span></li><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The riverfront development project has made it a landmark of modern urban planning.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Surat</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Located on the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Tapti River</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, not Sabarmati.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Vadodara</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Situated on the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Vishwamitri River</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Rajkot</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Lies on the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Aji River</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following statements about the Himalayas is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. They are young fold mountains.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. They were formed mainly due to plate collision.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">III. They are older than the Aravalli range.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I, II and III All</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I and II</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II and III</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I and III</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option B: Only I and II</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The Himalayas are </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">young fold mountains</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, formed during the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Tertiary period</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (about 40–50 million years ago).</span></li><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">They are still rising due to tectonic activity.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Formed mainly due to the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">collision of the Indian Plate with the Eurasian Plate</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, leading to folding and uplift.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement III</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Incorrect.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Aravalli Range</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is one of the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">oldest mountain ranges in the world</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (Precambrian era, over 2.5 billion years old).</span></li><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The Himalayas are much younger, hence they are </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">not older than the Aravallis</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which key is commonly used to refresh a web page in most browsers?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">F2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">F5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">F7</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">F12</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option B: F5</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">F5</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Standard shortcut to </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">reload/refresh</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> the current webpage in browsers like Chrome, Edge, Firefox, and Internet Explorer.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">F2</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Used to rename files/folders in Windows, not for refreshing.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">F7</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Activates spell check in MS Word, not refresh.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">F12</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Opens </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Developer Tools</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in most browsers, not refresh.</span></li></ul>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is used as a moderator in a nuclear reactor?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sodium chloride</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sulphur</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Graphite</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Copper sulphate</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option C:</span><span style=\"font-family:'Cambria Math'\"> Graphite</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Graphite</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Acts as a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">moderator</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> by slowing down fast-moving neutrons, making them more effective in sustaining the nuclear chain reaction.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Moderators are essential in reactors using natural uranium fuel, as they increase the probability of neutron capture by fissile nuclei.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sodium chloride</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Common salt, not used as a moderator.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sulphur</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Not suitable as a moderator.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Copper sulphate</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → A chemical compound, not used in nuclear reactors.</span></li></ul>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following statements about the Revolt of 1857 is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. It began at Meerut.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. Bahadur Shah Zafar was proclaimed as the symbolic leader.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">III. It was led everywhere by the Indian National Congress.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I and II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I and III</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II and III</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I, II and III All</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option A: </span><span style=\"font-family:'Cambria Math'\">Only I and II</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The Revolt of 1857 began at </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Meerut</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> on </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">10 May 1857</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, when Indian sepoys rose against the British.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The rebels proclaimed </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bahadur Shah Zafar</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, the last Mughal emperor, as their symbolic leader to give legitimacy to the uprising.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement III</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Incorrect.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Indian National Congress (INC)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> was founded later in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1885</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, almost three decades after the revolt.</span></li><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Hence, INC had </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">no role</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in leading the 1857 revolt.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements about sound and answer which of them is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. Sound requires a material medium for propagation.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. Sound travels faster in solids than in gases.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both I and II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither I and II</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option C: Both I and II</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Sound is a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">mechanical wave</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and requires a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">material medium</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (solid, liquid, or gas) for propagation.</span></li><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It cannot travel through vacuum.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The speed of sound depends on the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">density and elasticity</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> of the medium.</span></li><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Sound travels fastest in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">solids</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, slower in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">liquids</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, and slowest in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">gases</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Example: In steel, sound speed ≈ 5000 m/s; in air ≈ 343 m/s.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is a non-renewable source of energy?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bio Gas</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Wind Energy</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Solar Energy</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Coal and Petroleum</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option D: Coal and Petroleum</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Coal and Petroleum</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → These are </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">non-renewable sources of energy</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> because they are formed over millions of years from fossilized organic matter and cannot be replenished quickly. Once exhausted, they cannot be regenerated within a human timescale.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bio Gas</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Renewable, produced from decomposition of organic waste.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Wind Energy</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Renewable, generated by wind turbines.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Solar Energy</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Renewable, harnessed from sunlight.</span></li></ul>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">What CPU register continuously references the upcoming execution address?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Program Counter Register</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Memory Address Register</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Instruction Decoding Register</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Accumulator Storage Register</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option A: Program Counter Register</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Program Counter (PC)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Holds the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">address of the next instruction</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> to be executed.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">After fetching the current instruction, the PC is automatically updated to point to the next one.</span></li><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It ensures the CPU executes instructions sequentially unless a jump/branch modifies the flow.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Memory Address Register (MAR)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Holds the address of memory being accessed, not the upcoming instruction.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Instruction Decoding Register</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Decodes the fetched instruction, but does not track the next address.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Accumulator Storage Register</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Stores intermediate arithmetic/logic results, not instruction addresses.</span></li></ul>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which constitutional amendment added the Fundamental Duties to the Indian Constitution?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">42nd Constitutional Amendment</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">44th Constitutional Amendment</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">52nd Constitutional Amendment</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">61st Constitutional Amendment</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option A: </span><span style=\"font-family:'Cambria Math'\">42nd Constitutional Amendment</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">42nd Constitutional Amendment Act, 1976</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, often called the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">“Mini Constitution”</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, introduced </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 51A</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> which listed </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">10 Fundamental Duties</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> for citizens.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Later, the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">86th Amendment (2002)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> added one more duty (regarding education for children aged 6–14), making the total </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">11 Fundamental Duties</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">44th Amendment (1978)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Restored certain Fundamental Rights curtailed during Emergency, but did not add Fundamental Duties.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">52nd Amendment (1985)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Introduced the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">anti-defection law</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">61st Amendment (1989)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Reduced the voting age from 21 to 18 years.</span></li></ul>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following statements about the Election Commission of India is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. It conducts elections to the Lok Sabha and State Legislative Assemblies.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. It conducts elections to the offices of President and Vice-President.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">III. It is mentioned under Article 324 of the Constitution.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II and III</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I and III</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I and II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I, II and III All</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option D: </span><span style=\"font-family:'Cambria Math'\">I, II and III All</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Election Commission of India (ECI)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> conducts elections to the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Lok Sabha</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">State Legislative Assemblies</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The ECI also conducts elections to the offices of the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">President</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Vice-President of India</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement III</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The ECI is mentioned under </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 324</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> of the Indian Constitution, which vests the power of superintendence, direction, and control of elections in the Commission.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements about the Green Revolution in India and answer which of them is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. It increased the production of wheat and rice.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. It began mainly with the promotion of jute cultivation.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">III. It was strongly linked with high-yielding variety seeds.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I and II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II and III</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I and III</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I, II and III All</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option C: </span><span style=\"font-family:'Cambria Math'\">Only I and III</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Green Revolution in India (1960s–70s)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> significantly increased the production of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">wheat and rice</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, especially in Punjab, Haryana, and western Uttar Pradesh.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Incorrect.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The Green Revolution was </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">not about jute cultivation</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">. It focused mainly on </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">food grains (wheat and rice)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> to achieve self-sufficiency in food.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement III</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It was strongly linked with the introduction of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">High-Yielding Variety (HYV) seeds</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, along with chemical fertilizers, irrigation, and pesticides.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Assertion (A):</span><span style=\"font-family:'Cambria Math'\"> The apparent weight of a body decreases when it is immersed in water.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Reason (R):</span><span style=\"font-family:'Cambria Math'\"> Water exerts an upward buoyant force on the body.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, but R is not the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, and R is the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is false, but R is true</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is true, but R is false</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option B: </span><span style=\"font-family:'Cambria Math'\">Both A and R are true, and R is the correct explanation of A</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Assertion (A)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">When a body is immersed in water, its </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">apparent weight decreases</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> compared to its actual weight in air.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Reason (R)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This happens because water exerts an </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">upward buoyant force</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (Archimedes’ principle) on the body.</span></li><li style=\"margin-left:29pt;page-break-after:avoid;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The buoyant force reduces the net downward force, hence the apparent weight decreases.</span></li></ul></li><li style=\"margin-left:9.6pt;page-break-after:avoid;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Since the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">reason directly explains the assertion</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, both are true and R is the correct explanation of A.</span></li></ul>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which national park is famous for one-horned rhinoceros?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kaziranga National Park</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span style=\"font-family:'Cambria Mat
