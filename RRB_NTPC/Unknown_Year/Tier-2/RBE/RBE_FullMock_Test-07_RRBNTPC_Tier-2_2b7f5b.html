<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>14.) Reasoning Sectional Mock Test-7 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

tyle=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सोमवार</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">From 31 Jan 2009 to 31 Jan 2010 = 365 days = 1 odd day</span><br><span style=\"font-family:'Nirmala UI'\">From 31 Jan 2010 to 31 Jan 2011 = 365 days = 1 odd day</span><br><span style=\"font-family:'Nirmala UI'\">From 31 Jan 2011 to 31 Jan 2012 = 365 days = 1 odd day</span><br><span style=\"font-family:'Nirmala UI'\">From 31 Jan 2012 to 31 Jan 2013 = 366 days = 2 odd days (Leap Year)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Total odd days = 1 + 1 + 1 + 2 = 5 odd days</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Saturday + 5 days = Thursday (31 Jan 2013)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">So, 30 Jan 2013 was one day before Thursday = Wednesday</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Answer: (a) Wednesday</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दी गई श्रृंखला को तार्किक रूप से पूर्ण बनाने के लिए प्रश्न चिह्न (?) के स्थान पर निम्नलिखित में से कौन सा विकल्प आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">11, 13, 17, 25, 41, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Ni  290</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Answer: 290</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यदि 9 $ 3 = 18, 8 $ 2 = 12, तो 6 $ 4 का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">8</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">10</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">12</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">14</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Logic:</span><span style=\"font-family:'Nirmala UI'\"> First number - second number, then multiply by second number</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">9 $ 3 = (9 - 3) × 3 = 6 × 3 = </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">18</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">8 $ 2 = (8 - 2) × 2 = 6 × 2 = </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">12</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">6 $ 4 = (6 - 4) × 4 = 2 × 4 = </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">8</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Answer: [A] 8</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यदि दिए गए दो प्रतीकों को आपस में बदल दिया जाए, तो निम्नलिखित में से कौन सा समीकरण सही नहीं होगा?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आपस में बदले जाने वाले प्रतीक: + और -</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. 18 ÷ 3 + 8 × 5 - 4 = 20</span><br><span style=\"font-family:'Nirmala UI'\">II. 6 + 8 × 9 ÷ 3 - 4 = 14</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो I, न ही II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I और II दोनों</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">After interchanging </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">+ and -</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">I.</span><span style=\"font-family:'Nirmala UI'\"> 18 ÷ 3 - 8 × 5 + 4</span><br><span style=\"font-family:'Nirmala UI'\">= 6 - 40 + 4</span><br><span style=\"font-family:'Nirmala UI'\">= -30</span><br><span style=\"font-family:'Nirmala UI'\">So, equation I is </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">not correct</span><span style=\"font-family:'Nirmala UI'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">II.</span><span style=\"font-family:'Nirmala UI'\"> 6 - 8 × 9 ÷ 3 + 4</span><br><span style=\"font-family:'Nirmala UI'\">= 6 - 24 + 4</span><br><span style=\"font-family:'Nirmala UI'\">= -14</span><br><span style=\"font-family:'Nirmala UI'\">So, equation II is also </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">not correct</span><span style=\"font-family:'Nirmala UI'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Answer: [B] Both I and II</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित कथन को ध्यान से पढ़ें और निष्कर्ष निकालें।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नए कानून के अनुसार, सार्वजनिक स्थानों पर धूम्रपान वर्जित है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. लोग निजी स्थानों पर धूम्रपान कर सकते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. धूम्रपान सार्वजनिक स्वास्थ्य के लिए हानिकारक है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल निष्कर्ष I अनुसरण करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल निष्कर्ष II अनुसरण करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I और II दोनों अनुसरण करते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो I और न ही II अनुसरण करता है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">निष्कर्ष I: लोग निजी स्थानों पर धूम्रपान कर सकते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> निश्चित नहीं है</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कथन में केवल सार्वजनिक स्थानों की बात की गई है। इसमें निजी स्थानों का स्पष्ट रूप से उल्लेख नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसलिए हम यह नहीं मान सकते कि निजी स्थानों पर धूम्रपान की अनुमति है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">निष्कर्ष II: धूम्रपान सार्वजनिक स्वास्थ्य के लिए हानिकारक है।</span></p><p style=\"margin-top:0pt pan style=\"font-weight:bold;font-family:'Nirmala UI'\">कोबे 2024:</span><span style=\"font-family:'Nirmala UI'\"> 17 पदक</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नई दिल्ली 2025:</span><span style=\"font-family:'Nirmala UI'\"> 22 पदक (रिकॉर्ड)</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऑक्सीजन के निशान को हटाने के लिए निर्वात ट्यूबों में निम्नलिखित में से किस तत्व का उपयोग 'गेटर' के रूप में किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मैग्नीशियम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बेरियम</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वैनेडियम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कोबाल्ट</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: बेरियम</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· वैक्यूम ट्यूब में, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गेटर (getter)</span><span style=\"font-family:'Nirmala UI'\"> ट्यूब के अंदर रखा जाने वाला एक पदार्थ है जो निकासी (evacuation) के बाद बची हुई गैसों (जैसे ऑक्सीजन, नाइट्रोजन और कार्बन डाइऑक्साइड) को अवशोषित करने और हटाने के लिए उपयोग किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बेरियम</span><span style=\"font-family:'Nirmala UI'\"> का उपयोग आमतौर पर गेटर के रूप में किया जाता है क्योंकि:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o यह ऑक्सीजन और अन्य गैसों के साथ आसानी से प्रतिक्रिया करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o यह स्थिर ऑक्साइड और यौगिक बनाता है, जिससे वैक्यूम स्वच्छ रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o निर्माण के दौरान इसे ट्यूब के अंदर एक पतली धात्विक परत के रूप में जमा किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· यह सुनिश्चित करता है कि वैक्यूम बरकरार रहे, जिससे ट्यूब की दक्षता और जीवनकाल में सुधार होता है।</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राष्ट्रपति और उपराष्ट्रपति दोनों की अनुपस्थिति में राष्ट्रपति के कर्तव्यों का निर्वहन कौन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लोकसभा अध्यक्ष</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सबसे वरिष्ठ राज्यपाल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के मुख्य न्यायाधीश</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राज्यसभा के उपसभापति</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: भारत के मुख्य न्यायाधीश</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· भारतीय संविधान के अनुसार, यदि राष्ट्रपति और उपराष्ट्रपति दोनों अनुपस्थित हों (मृत्यु, त्यागपत्र, निष्कासन, या अन्यथा अपने कर्तव्यों का निर्वहन करने में असमर्थ होने के कारण), तो </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारत के मुख्य न्यायाधीश (CJI)</span><span style=\"font-family:'Nirmala UI'\">, या उनकी अनुपस्थिति में सर्वोच्च न्यायालय के वरिष्ठतम न्यायाधीश, नया राष्ट्रपति चुने जाने तक राष्ट्रपति के कर्तव्यों का पालन करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· यह व्यवस्था उच्चतम स्तर पर संवैधानिक अधिकार की निरंतरता सुनिश्चित करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उदाहरण:</span><span style=\"font-family:'Nirmala UI'\"> 1969 में, राष्ट्रपति जाकिर हुसैन की मृत्यु और उपराष्ट्रपति वी.वी. गिरि के इस्तीफे के बाद, मुख्य न्यायाधीश </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एम. हिदायतुल्ला</span><span style=\"font-family:'Nirmala UI'\"> ने नए राष्ट्रपति के चुने जाने तक भारत के कार्यवाहक राष्ट्रपति के रूप में कार्य किया था।</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सूर्य सेन के साथ 'चिट्टागोंग शस्त्रागार छापे' में कौन सा क्रांतिकारी शामिल था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बटुकेश्वर दत्त </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सचिन्द्र सान्याल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रासबिहारी बोस</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रीतिलता वादेदार</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: प्रीतिलता वाडेदार</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">चटगाँव शस्त्रागार छापा (Chittagong Armoury Raid)</span><span style=\"font-family:'Nirmala UI'\"> 18 अप्रैल 1930 को हुआ था, जिसका नेतृत्व </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सूर्य सेन (मास्टरदा)</span><span style=\"font-family:'Nirmala UI'\"> ने किया था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· यह ब्रिटिश हथियारों के डिपो पर कब्जा करने और औपनिवेशिक शासन के खिलाफ बड़े विद्रोह को प्रेरित करने का एक साहसी प्रयास था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· इसमें कई क्रांतिकारियों ने भाग लिया, जिनमें </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रीतिलता वाडेदार</span><span style=\"font-family:'Nirmala UI'\"> भी शामिल थीं, जो बाद में सबसे प्रमुख महिला स्वतंत्रता सेनानियों में से एक बनीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· प्रीतिलता सूर्य सेन के समूह में शामिल हुईं और क्रांतिकारी गतिविधियों को अंजाम दिया, जिसमें प्रसिद्ध </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पहाड़तली यूरोपीय क्लब हमला (1932)</span><span style=\"font-family:'Nirmala UI'\"> शामिल था, जहाँ उन्होंने गिरफ्तारी से बचने के लिए साइनाइड खाकर अपने प्राणों की आहुति दे दी थी।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· उनकी भागीदारी भारत के क्रांतिकारी संघर्ष में महिलाओं की हिस्सेदारी का प्रतीक थी।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का विवरण</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बटुकेश्वर दत्त</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सेंट्रल असेंबली बमबारी (1929) में भगत सिंह के साथ जुड़े थे, न कि चटगाँव छापे से।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सचिंद्र सान्याल</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> हिंदुस्तान रिपब्लिकन एसोसिएशन के संस्थापक और क्रांतिकारियों के गुरु थे, लेकिन चटगाँव छापे का हिस्सा नहीं थे।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रास बिहारी बोस</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> प्रमुख क्रांतिकारी नेता थे, जो बाद में INA (आजाद हिंद फौज) के गठन में शामिल हुए, लेकिन चटगाँव छापे से नहीं जुड़े थे।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रीतिलता वादेदार</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; सूर्य सेन के साथ सीधे तौर पर शामिल थीं।</span></p>", "question_heading": ""}, {"sr_no": 75, "question": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\">< Nirmala UI'\"> है, जिसे समकालीन मूल्य संरचनाओं को बेहतर ढंग से प्रतिबिंबित करने के लिए मई 2017 में अपनाया गया था।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">&middot; इस संशोधन ने WPI को राष्ट्रीय लेखा आधार वर्ष (2011-12) के साथ संरेखित किया और वस्तुओं तथा उनके भार (weights) के कवरेज में सुधार किया।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">&middot; WPI मासिक आधार पर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आर्थिक सलाहकार कार्यालय</span><span style=\"font-family:'Nirmala UI'\">, उद्योग और आंतरिक व्यापार संवर्धन विभाग (DPIIT), वाणिज्य एवं उद्योग मंत्रालय द्वारा जारी किया जाता है।</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक्सेल में, 'एब्सोल्यूट सेल रेफरेंस (Absolute Cell Reference)' बनाने के लिए किस प्रतीक का उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">$ </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\"># </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">&amp;</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">%</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: $</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· माइक्रोसॉफ्ट एक्सेल में, डॉलर चिह्न ($) का उपयोग करके एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एब्सोल्यूट सेल रेफरेंस (absolute cell reference)</span><span style=\"font-family:'Nirmala UI'\"> बनाया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· यह किसी विशिष्ट रो (row) और/या कॉलम (column) के रेफरेंस को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लॉक</span><span style=\"font-family:'Nirmala UI'\"> कर देता है, ताकि जब फॉर्मूले कॉपी किए जाएं, तो वह रेफरेंस नहीं बदलता है।</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत रत्न से सम्मानित होने वाले पहले विदेशी कौन थे?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नेल्सन मंडेला</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मदर टेरेसा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मिखाइल गोर्बाचेव</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अब्दुल गफ्फार खान</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: अब्दुल गफ्फार खान</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· भारत रत्न से सम्मानित होने वाले पहले विदेशी </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">खान अब्दुल गफ्फार खान</span><span style=\"font-family:'Nirmala UI'\"> थे, जिन्हें लोकप्रिय रूप से </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">\"सीमांत गांधी\" (Frontier Gandhi)</span><span style=\"font-family:'Nirmala UI'\"> के नाम से जाना जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· उन्हें अहिंसा के प्रति उनकी आजीवन प्रतिबद्धता और भारत के स्वतंत्रता संग्राम में उनकी भूमिका के लिए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1987</span><span style=\"font-family:'Nirmala UI'\"> में भारत रत्न से सम्मानित किया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· हालाँकि वह वर्तमान पाकिस्तान से थे, लेकिन भारत के स्वतंत्रता आंदोलन और गांधीवादी दर्शन के साथ उनके गहरे जुड़ाव ने उन्हें यह सम्मान दिलाया।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· वह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">खुदाई खिदमतगार</span><span style=\"font-family:'Nirmala UI'\"> (\"ईश्वर के सेवक\") आंदोलन के संस्थापक थे, जिसने उत्तर-पश्चिम सीमा प्रांत में ब्रिटिश औपनिवेशिक शासन के खिलाफ अहिंसक प्रतिरोध को बढ़ावा दिया था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का विवरण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नेल्सन मंडेला</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> बाद में 1990 में सम्मानित किए गए, लेकिन वे पहले विदेशी नहीं थे।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मदर टेरेसा</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> 1980 में भारत रत्न से सम्मानित किया गया, लेकिन तब तक वे भारतीय नागरिक बन चुकी थीं।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मिखाइल गोर्बाचेव</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> इन्हें कभी भारत रत्न नहीं दिया गया।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अब्दुल गफ्फार खान</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; 1987 में सम्मानित होने वाले पहले विदेशी।</span></li></ul>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">'एक्सरसाइज SIMBEX' भारत और निम्नलिखित देशों के बीच एक द्विपक्षीय समुद्री अभ्यास है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">श्रीलंका</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सेशेल्स</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सिंगापुर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दक्षिण कोरिया</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: सिंगापुर</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">SIMBEX</span><span style=\"font-family:'Nirmala UI'\"> (सिंगापुर-भारत समुद्री द्विपक्षीय अभ्यास) भारतीय नौसेना और रिपब्लिक ऑफ सिंगापुर नेवी (RSN) के बीच आयोजित होने वाला वार्षिक नौसेना अभ्यास है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· इसकी शुरुआत </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1994</span><span style=\"font-family:'Nirmala UI'\"> में हुई थी और यह भारत के लिए सबसे उन्नत द्विपक्षीय नौसेना अभ्यासों में से एक बन गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· इस अभ्यास में शामिल हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सतह युद्ध (Surface warfare) अभ्यास</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पनडुब्बी रोधी (Anti-submarine) अभियान</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">वायु रक्षा (Air defence) अभ्यास</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">समुद्री निषेध (Maritime interdiction) अभियान</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· यह विशेष रूप से भारत-प्रशांत क्षेत्र में भारत और सिंगापुर के बीच मजबूत रणनीतिक और रक्षा साझेदारी को उजागर करता है।</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2025 का बैलोन डी'ओर पुरस्कार (पुरुष वर्ग) किसने जीता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किलियन म्बाप्पे</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ओस्मान डेम्बेले</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लैमिन यमल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लुका मोड्रिक</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2025 बैलन डी'ओर (पुरुष) के विजेता पेरिस सेंट-जर्मेन के फ्रांसीसी फॉरवर्ड </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ओस्मान डेम्बेले</span><span style=\"font-family:'Nirmala UI'\"> थे, जिनकी घोषणा 22 सितंबर 2025 को पेरिस में की गई थी। उन्होंने एक शानदार 2024-25 सीज़न के बाद अपना पहला बैलन डी'ओर जीता। </span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">2025 बैलन डी'ओर (पुरुष) के मुख्य विवरण</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विजेता:</span><span style=\"font-family:'Nirmala UI'\"> ओस्मान डेम्बेले (फ्रांस, PSG) </span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दिनांक और स्थान:</span><span style=\"font-family:'Nirmala UI'\"> 22 सितंबर 2025, थिएटर डू शाटेलेट, पेरिस </span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सीज़न पर विचार:</span><span style=\"font-family:'Nirmala UI'\"> 1 अगस्त 2024 – 13 जुलाई 2025 (फीफा क्लब विश्व कप फाइनल के साथ संरेखित) </span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रदर्शन की मुख्य विशेषताएं:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o सभी प्रतियोगिताओं में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">37 गोल</span><span style=\"font-family:'Nirmala UI'\"> किए और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">15 असिस्ट</span><span style=\"font-family:'Nirmala UI'\"> दिए। </span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o PSG द्वारा अपना पहला </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">UCL खिताब</span><span style=\"font-family:'Nirmala UI'\"> जीतने पर उन्हें यूईएफए चैंपियंस लीग </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्लेयर ऑफ द सीज़न</span><span style=\"font-family:'Nirmala UI'\"> नामित किया गया।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o PSG को घरेलू डबल (लीग 1 + कूप डी फ्रांस) सुरक्षित करने में मदद की। </span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से 'जलडमरूमध्य से जुड़े जल निकायों' का कौन सा युग्म सही ढंग से मेल खाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मलक्का जलडमरूमध्य – लाल सागर और भूमध्य सागर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जिब्राल्टर जलडमरूमध्य – जापान सागर और पूर्वी चीन सागर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सुंडा जलडमरूमध्य – इंग्लिश चैनल और उत्तरी सागर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">होर्मुज जलडमरूमध्य – फारस की खाड़ी और ओमान की खाड़ी</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: होर्मुज जलडमरूमध्य – फारस की खाड़ी और ओमान की खाड़ी</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">होर्मुज जलडमरूमध्य (Strait of Hormuz)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> फारस की खाड़ी को ओमान की खाड़ी (और आगे अरब सागर) से जोड़ता है। यह वैश्विक तेल व्यापार के लिए दुनिया के सबसे रणनीतिक चोकपॉइंट्स (chokepoints) में से एक है। </span><span style=\"font-family:'Symbol'\">✔</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य क्यों गलत हैं</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मलक्का जलडमरूमध्य – लाल सागर और भूमध्य सागर</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> गलत; यह वास्तव में अंडमान सागर (हिंद महासागर) को दक्षिण चीन सागर से जोड़ता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जिब्राल्टर जलडमरूमध्य – जापान सागर और पूर्वी चीन सागर</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> गलत; यह अटलांटिक महासागर को भूमध्य सागर से जोड़ता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सुंडा जलडमरूमध्य – इंग्लिश चैनल और उत्तरी सागर</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> गलत; यह जावा सागर को हिंद महासागर (जावा और सुमात्रा के बीच) से जोड़ता है।</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तकनीकी रूप से 'कांच' को निम्न श्रेणी में वर्गीकृत किया जाता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अतिशीतित द्रव</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">क्रिस्टलीय ठोस</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आयनिक द्रव</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पॉलिमर</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: अतिशीतित द्रव (Supercooled liquid)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कांच (Glass)</span><span style=\"font-family:'Nirmala UI'\"> एक क्रिस्टलीय ठोस नहीं है; इसमें लंबी दूरी की आवधिक परमाणु व्यवस्था (long-range periodic atomic arrangement) का अभाव होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· तकनीकी रूप से, इसे एक अक्रिस्टलीय ठोस (amorphous solid) के रूप में वर्गीकृत किया गया है या अक्सर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अतिशीतित द्रव</span><span style=\"font-family:'Nirmala UI'\"> के रूप में वर्णित किया जाता है, क्योंकि:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o इसके परमाणु तरल पदार्थों की तरह अनियमित रूप से व्यवस्थित होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o पिघली हुई अवस्था से ठंडा होने पर यह बिना क्रिस्टलीकरण के ठोस हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o यह ठोस की तरह कठोरता प्रदर्शित करता है लेकिन इसका कोई निश्चित गलनांक (sharp melting point) नहीं होता है।</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किस संशोधन के माध्यम से 'प्रशासनिक न्यायाधिकरणों' को संविधान में जोड़ा गया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">34वां संशोधन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">42वां संशोधन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">44वां संशोधन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">52वां संशोधन</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: 42वां संशोधन</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">42वां संवैधानिक संशोधन अधिनियम, 1976</span><span style=\"font-family:'Nirmala UI'\"> (जिसे अक्सर
