n><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> भूमि सुधार और नौवीं अनुसूची से संबंधित।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">42वां संशोधन (1976)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; प्रशासनिक न्यायाधिकरण (अनुच्छेद 323A और 323B) जोड़े गए।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">44वां संशोधन (1978)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> आपातकाल के बाद लोकतांत्रिक प्रावधानों को बहाल किया गया, लेकिन न्यायाधिकरण नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">52वां संशोधन (1985)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> दलबदल विरोधी कानून (दसवीं अनुसूची) पेश किया गया।</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कौन सा नियम यह बताता है कि स्थिर तापमान पर, किसी द्रव में गैस की घुलनशीलता गैस के आंशिक दाब के सीधे समानुपाती होती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हेनरी का नियम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राउल्ट का नियम</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डाल्टन का नियम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गे-लुसैक का नियम</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: हेनरी का नियम (Henry’s Law)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हेनरी का नियम</span><span style=\"font-family:'Nirmala UI'\"> बताता है कि: एक स्थिर तापमान पर, किसी तरल में गैस की घुलनशीलता तरल के ऊपर उस गैस के आंशिक दबाव (partial pressure) के सीधे आनुपातिक होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गणितीय रूप से:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1778741548442_image001.png\" width=\"68\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जहाँ:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">C</span><span style=\"font-family:'Nirmala UI'\"> = तरल में गैस की सांद्रता (concentration)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">kH</span><span style=\"font-family:'Nirmala UI'\"> = हेनरी नियम का स्थिरांक (constant)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">P</span><span style=\"font-family:'Nirmala UI'\"> = गैस का आंशिक दबाव (partial pressure)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अन्य विकल्प क्यों गलत हैं</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राउल्ट का नियम</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> यह विलयन (solution) के वाष्प दबाव से संबंधित है, न कि गैस की घुलनशीलता से।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">डाल्टन का नियम</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> यह बताता है कि गैसों के मिश्रण का कुल दबाव आंशिक दबावों के योग के बराबर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गे-लुसाक का नियम</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> यह स्थिर आयतन पर गैस के दबाव और तापमान के बीच संबंध बताता है।</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">RBI और बैंक नियामकों द्वारा वित्तीय संस्थानों की सुदृढ़ता का आकलन करने के लिए प्रयुक्त \"CAMELS\" फ्रेमवर्क में अक्षर \"L\" किसका प्रतिनिधित्व करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Leverage</span><span style=\"font-family:'Nirmala UI'\"> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Liquidity</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Labour</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Liability</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: तरलता (Liquidity)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">CAMELS</span><span style=\"font-family:'Nirmala UI'\"> ढांचा एक पर्यवेक्षी रेटिंग प्रणाली (supervisory rating system) है जिसका उपयोग RBI और अन्य नियामकों द्वारा बैंकों और वित्तीय संस्थानों के स्वास्थ्य का मूल्यांकन करने के लिए किया जाता है। प्रत्येक अक्षर एक प्रमुख पैरामीटर को दर्शाता है:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">C </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> पूंजी पर्याप्तता (Capital Adequacy)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">A </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> संपत्ति की गुणवत्ता (Asset Quality)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">M </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> प्रबंधन गुणवत्ता (Management Quality)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">E </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> आय (Earnings)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">L </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> तरलता (Liquidity)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">S </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> बाजार जोखिम के प्रति संवेदनशीलता (Sensitivity to Market Risk)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">तरलता (L)</span><span style=\"font-family:'Nirmala UI'\"> से तात्पर्य किसी बैंक की अपने अल्पकालिक दायित्वों को पूरा करने और महत्वपूर्ण नुकसान के बिना नकदी प्रवाह को कुशलतापूर्वक प्रबंधित करने की क्षमता से है। नियामक यह आकलन करते हैं कि क्या बैंक अचानक होने वाली निकासी को संभाल सकते हैं, पर्याप्त तरल संपत्ति बनाए रख सकते हैं और वित्तीय तनाव के दौरान स्थिरता सुनिश्चित कर सकते हैं।</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वर्ष 2024 में शुरू की गई एनपीएस वात्सल्य योजना का संचालन निम्न द्वारा किया जाता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">SEBI</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">RBI</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">IRDAI</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">PFRDA</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: PFRDA (पेंशन फंड नियामक और विकास प्राधिकरण)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एनपीएस वात्सल्य (NPS Vatsalya)</span><span style=\"font-family:'Nirmala UI'\"> योजना 2024 में नेशनल पेंशन सिस्टम (NPS) ढांचे के हिस्से के रूप में शुरू की गई थी।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· यह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पेंशन फंड नियामक और विकास प्राधिकरण (PFRDA)</span><span style=\"font-family:'Nirmala UI'\"> द्वारा प्रशासित है, जो भारत में पेंशन योजनाओं का नियमन और निरीक्षण करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उद्देश्य:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o सब्सक्राइबर की असामयिक मृत्यु के मामले में एनपीएस सब्सक्राइबर्स के बच्चों तक पेंशन कवरेज का विस्तार करना।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o आश्रितों को वित्तीय सुरक्षा और पेंशन लाभ की निरंतरता प्रदान करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">महत्व:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o एनपीएस के तहत सामाजिक सुरक्षा जाल को मजबूत करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o पारिवारिक सुरक्षा प्रदान करके पेंशन योजनाओं में व्यापक भागीदारी को प्रोत्साहित करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का विवरण</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">SEBI</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> प्रतिभूति बाजारों (securities markets) को नियंत्रित करता है, पेंशन को नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">RBI</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> केंद्रीय बैंक है, जो मौद्रिक नीति और बैंकिंग विनियमन से संबंधित है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">IRDAI</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> बीमा क्षेत्र को नियंत्रित करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">PFRDA</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; एनपीएस का प्रशासन करता है और एनपीएस वात्सल्य लॉन्च किया।</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1955 में नियुक्त प्रथम 'राजभाषा आयोग' के अध्यक्ष कौन थे?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बी.जी. खेर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जी.बी. पंत</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एस.के. धर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एच.एन. कुंजरू</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रथम </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राजभाषा आयोग</span><span style=\"font-family:'Nirmala UI'\"> (1955 में नियुक्त) के अध्यक्ष </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बी.जी. खेर</span><span style=\"font-family:'Nirmala UI'\"> थे।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· राजभाषा आयोग का गठन 7 जून 1955 को राष्ट्रपति डॉ. राजेंद्र प्रसाद द्वारा संविधान के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 344</span><span style=\"font-family:'Nirmala UI'\"> के तहत किया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· इसका उद्देश्य निम्नलिखित सिफारिशें करना था:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o संघ के आधिकारिक उद्देश्यों के लिए हिंदी का उत्तरोत्तर प्रयोग।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o अंग्रेजी के प्रयोग पर प्रतिबंध।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o उपयोग किए जाने वाले अंकों का रूप।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o सरकारी संचार में अंग्रेजी को हिंदी से बदलने के लिए एक समय सारणी।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· स्वतंत्रता के बाद बॉम्बे राज्य के पहले मुख्यमंत्री </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बी.जी. खेर</span><span style=\"font-family:'Nirmala UI'\"> (बालसाहब गंगाधर खेर) को अध्यक्ष नियुक्त किया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom: y:'Nirmala UI'\"> एंटी-रेडिएशन मिसाइल) को एकीकृत करने के लिए प्रौद्योगिकी हस्तांतरण (ToT) भी शामिल है। निर्माण प्रावधानों से एयरोस्पेस आपूर्ति श्रृंखला से जुड़े भारतीय MSMEs के लिए महत्वपूर्ण रोजगार और राजस्व उत्पन्न होने की उम्मीद है।</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किस कानून ने प्रांतीय सरकारों में \"द्वैध शासन\" की व्यवस्था शुरू की, जिसके तहत प्रजा को \"आरक्षित\" (ब्रिटिश द्वारा नियुक्त राज्यपालों द्वारा नियंत्रित) और \"स्थानांतरित\" (भारतीय मंत्रियों द्वारा संचालित) श्रेणियों में विभाजित किया गया?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विनियमन अधिनियम, 1773</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय परिषद अधिनियम, 1909 (मोर्ले-मिंटो)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत सरकार अधिनियम, 1919 (मोंटेग्यू-चेम्सफोर्ड)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत सरकार अधिनियम, 1935</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: भारत सरकार अधिनियम, 1919 (मोंटेग्यू-चेम्सफोर्ड सुधार)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारत सरकार अधिनियम, 1919</span><span style=\"font-family:'Nirmala UI'\">, जिसे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मोंटेग्यू-चेम्सफोर्ड सुधार</span><span style=\"font-family:'Nirmala UI'\"> के रूप में भी जाना जाता है, ने प्रांतों में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">द्वैध शासन (Dyarchy)</span><span style=\"font-family:'Nirmala UI'\"> की प्रणाली शुरू की।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· द्वैध शासन का अर्थ शासन की एक दोहरी प्रणाली थी:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आरक्षित विषय (Reserved Subjects)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> ब्रिटिश द्वारा नियुक्त गवर्नर द्वारा नियंत्रित (जैसे, कानून और व्यवस्था, वित्त, राजस्व)।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हस्तांतरित विषय (Transferred Subjects)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> विधान परिषदों के प्रति उत्तरदायी भारतीय मंत्रियों द्वारा संभाले जाने वाले विषय (जैसे, शिक्षा, स्वास्थ्य, स्थानीय स्वशासन)।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· यह प्रांतीय स्वायत्तता की ओर पहला कदम था, हालांकि यह सीमित था, और यह 1935 के भारत सरकार अधिनियम द्वारा प्रतिस्थापित होने तक लागू रहा।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का विवरण</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रेगुलेटिंग एक्ट, 1773</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> ईस्ट इंडिया कंपनी के प्रशासन से संबंधित था, द्वैध शासन से नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारतीय परिषद अधिनियम, 1909 (मार्ले-मिंटो)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> पृथक निर्वाचक मंडल (separate electorates) की शुरुआत की, द्वैध शासन की नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारत सरकार अधिनियम, 1919 (मोंटेग्यू-चेम्सफोर्ड)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; प्रांतों में द्वैध शासन की शुरुआत की।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारत सरकार अधिनियम, 1935</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> प्रांतों में द्वैध शासन को समाप्त कर दिया लेकिन इसे केंद्र में लागू किया।</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के 38वें राष्ट्रीय खेल, जो 28 जनवरी से 14 फरवरी, 2025 तक आयोजित किए गए, किस राज्य द्वारा आयोजित किए गए थे?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गोवा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मेघालय</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उत्तराखंड</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राजस्थान</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">38वें राष्ट्रीय खेल भारत</span><span style=\"font-family:'Nirmala UI'\"> (28 जनवरी – 14 फरवरी, 2025) की मेजबानी </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तराखंड</span><span style=\"font-family:'Nirmala UI'\"> राज्य द्वारा की गई थी, जिसके आयोजन देहरादून, हरिद्वार, नैनीताल, हल्द्वानी, रुद्रपुर, पिथोरागढ़ और नई टिहरी के स्थानों पर किए गए थे।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">38वें राष्ट्रीय खेलों के बारे में मुख्य तथ्य:</span></p><p style=\"margin-top:0pt;margin-bott है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· यह नदी </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अमेज़न बेसिन</span><span style=\"font-family:'Nirmala UI'\"> को सिंचित करती है, जिसमें दुनिया का सबसे बड़ा </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उष्णकटिबंधीय वर्षावन</span><span style=\"font-family:'Nirmala UI'\"> स्थित है, जो लगभग </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">70 लाख वर्ग किलोमीटर</span><span style=\"font-family:'Nirmala UI'\"> में फैला है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· औसत विसर्जन: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">~209,000 घन मीटर प्रति सेकंड</span><span style=\"font-family:'Nirmala UI'\">, जो इसे विश्व स्तर पर अद्वितीय बनाता है।</span></p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">महात्मा गांधी ने 8 अगस्त, 1942 को किस शहर से भारत छोड़ो आंदोलन की शुरुआत की और भारतीय जनता को \"करो या मरो\" का सशक्त आह्वान दिया?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कलकत्ता</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बॉम्बे</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लाहौर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दिल्ली</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: बॉम्बे (अब मुंबई)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारत छोड़ो आंदोलन</span><span style=\"font-family:'Nirmala UI'\"> की शुरुआत </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">महात्मा गांधी</span><span style=\"font-family:'Nirmala UI'\"> द्वारा </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">8 अगस्त 1942</span><span style=\"font-family:'Nirmala UI'\"> को बॉम्बे के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ग्वालिया टैंक मैदान</span><span style=\"font-family:'Nirmala UI'\"> (अब अगस्त क्रांति मैदान) में आयोजित अखिल भारतीय कांग्रेस कमेटी के सत्र के दौरान की गई थी।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· गांधीजी ने </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">\"करो या मरो\"</span><span style=\"font-family:'Nirmala UI'\"> का ऐतिहासिक नारा दिया, जिसमें भारतीयों से ब्रिटिश शासन से पूर्ण स्वतंत्रता के लिए लड़ने का आग्रह किया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· इस आंदोलन के कारण पूरे भारत में बड़े पैमाने पर विरोध प्रदर्शन, हड़तालें और विद्रोह हुए, हालाँकि ब्रिटिश अधिकारियों द्वारा इसे कड़े दमन का सामना करना पड़ा।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· दमन के बावजूद, इसने भारत के स्वतंत्रता संग्राम में एक महत्वपूर्ण मोड़ दिया, जिसने आजादी हासिल करने के लिए भारतीयों के दृढ़ संकल्प को प्रदर्शित किया।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का पुनरावलोकन</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कलकत्ता</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> राष्ट्रवादी आंदोलनों में महत्वपूर्ण, लेकिन भारत छोड़ो आंदोलन का लॉन्च स्थल नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बॉम्बे</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ग्वालिया टैंक मैदान, बॉम्बे</span><span style=\"font-family:'Nirmala UI'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लाहौर</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1929 के पूर्ण स्वराज प्रस्ताव</span><span style=\"font-family:'Nirmala UI'\"> से संबंधित है, भारत छोड़ो आंद pan style=\"font-weight:bold;font-family:'Nirmala UI'\">सर्वश्रेष्ठ अनुकूलित पटकथा:</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कॉन्क्लेव</span><span style=\"font-family:'Nirmala UI'\"> (पीटर स्ट्रॉघन)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सर्वश्रेष्ठ एनिमेटेड फीचर:</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">फ्लो</span><span style=\"font-family:'Nirmala UI'\"> (Flow)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सर्वश्रेष्ठ अंतर्राष्ट्रीय फीचर फिल्म:</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आई एम स्टिल हियर</span><span style=\"font-family:'Nirmala UI'\"> (ब्राजील)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">'अनोरा' की जीत का महत्व:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनोरा</span><span style=\"font-family:'Nirmala UI'\"> उस रात की सबसे बड़ी विजेता रही, जिसने सर्वश्रेष्ठ फिल्म, सर्वश्रेष्ठ निर्देशक, सर्वश्रेष्ठ अभिनेत्री, सर्वश्रेष्ठ मूल पटकथा और सर्वश्रेष्ठ संपादन सहित </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पाँच ऑस्कर</span><span style=\"font-family:'Nirmala UI'\"> अपने नाम किए।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· सीन बेकर की जीत ने </span><span style=\"font-weight:bold;font-family: t\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सर्वाधिक पसंदीदा राष्ट्र (MFN)</span><span style=\"font-family:'Nirmala UI'\"> सिद्धांत विश्व व्यापार संगठन (WTO) की व्यापार प्रणाली का एक आधार स्तंभ है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अर्थ:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o यदि कोई WTO सदस्य किसी एक देश को व्यापार रियायत (जैसे कम शुल्क) देता है, तो उसे वही व्यवहार सभी WTO सदस्यों के साथ करना होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o यह वैश्विक व्यापार में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गैर-भेदभाव</span><span style=\"font-family:'Nirmala UI'\"> और समान अवसर सुनिश्चित करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्पत्ति:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o इसे पहली बार </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">GATT</span><span style=\"font-family:'Nirmala UI'\"> (टैरिफ और व्यापार पर सामान्य समझौता, 1947) के तहत पेश किया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o इसे WTO (1995) के तहत आगे बढ़ाया और मजबूत किया गया।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उद्देश्य:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o अंतर्राष्ट्रीय व्यापार में निष्पक्षता, पारदर्शिता और पूर्वानुमेयता को बढ़ावा देना।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o चुनिंदा देशों के प्रति तरजीही व्यवहार को रोकना, सिवाय क्षेत्रीय व्यापार समझौतों या विकासशील देशों के लिए विशेष प्रावधानों के मामलों में।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का पुनरावलोकन</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">संयुक्त राष्ट्र (UN)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> शांति, सुरक्षा और विकास से संबंधित है, व्यापार नियमों से नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विश्व व्यापार संगठन (WTO)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; MFN इसका मौलिक सिद्धांत है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अंतर्राष्ट्रीय मुद्रा कोष (IMF)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> मौद्रिक स्थिरता और वित्तीय सहायता पर ध्यान केंद्रित करता है, MFN पर नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विश्व बैंक (World Bank)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> विकास ऋण प्रदान करता है, व्यापार नियम नहीं।</span></p>", "question_heading": ""}, {"sr_no": 103, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">'खेलो इंडिया विंटर गेम्स 2024' के शुभंकर का नाम क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">शीन-ए-शी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वीरा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मौली</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">धाकड़</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: शीन-ए-शी (Sheen-e-She)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">खेलो इंडिया विंटर गेम्स 2024</span><span style=\"font-family:'Nirmala UI'\"> का शुभंकर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">'शीन-ए-शी'</span><span style=\"font-family:'Nirmala UI'\"> नामक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हिम तेंदुआ (Snow Leopard)</span><span style=\"font-family:'Nirmala UI'\"> था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· कश्मीरी भाषा में इस नाम का अर्थ है </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“बर्फ की बर्फ”</span><span style=\"font-family:'Nirmala UI'\">, जो हिमालय के प्राचीन वातावरण का प्रतीक है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· हिम तेंदुए को निम्नलिखित बातों को उजागर करने के लिए चुना गया था:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o हिमालय की नाजुक पारिस्थितिकी तंत्र।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o वन्यजीव संरक्षण की आवश्यकता।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o शक्ति, लचीलापन और शालीनता के गुण जो एथलीटों में होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· इन खेलों का आयोजन फरवरी 2024 में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लेह (लद्दाख)</span><span style=\"font-family:'Nirmala UI'\"> और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गुलमर्ग (जम्मू और कश्मीर)</span><span style=\"font-family:'Nirmala UI'\"> में किया गया था।</span></p>", "question_heading": ""}, {"sr_no": 104, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संविधान के प्रावधानों के अनुसार लोकसभा अध्यक्ष का चुनाव किस प्रक्रिया द्वारा होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संसद के दोनों सदनों के सदस्यों द्वारा संयुक्त रूप से निर्वाचित</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लोकसभा के सभी सदस्यों द्वारा साधारण बहुमत से निर्वाचित</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रधानमंत्री की सलाह पर राष्ट्रपति द्वारा नियुक्त</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लोकसभा द्वारा दो-तिहाई विशेष बहुमत से निर्वाचित</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: लोकसभा के सभी सदस्यों द्वारा साधारण बहुमत से निर्वाचित</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लोकसभा के अध्यक्ष</span><span style=\"font-family:'Nirmala UI'\"> का चुनाव इसके सदस्यों में से ही किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· यह चुनाव नवनिर्वाचित लोकसभा की पहली बैठक के तुरंत बाद आयोजित किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रक्रिया:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारत के राष्ट्रपति</span><span style=\"font-family:'Nirmala UI'\"> चुनाव की तिथि निर्धारित करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o लोकसभा के सदस्य उम्मीदवारों के नाम प्रस्तावित करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o मतदान आयोजित किया जाता है, और जो उम्मीदवार उपस्थित और मतदान करने वाले सदस्यों के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">साधारण बहुमत</span><span style=\"font-family:'Nirmala UI'\"> से वोट प्राप्त करता है, उसे अध्यक्ष के रूप में निर्वाचित किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· निर्वाचित होने के बाद, अध्यक्ष तब तक पद पर बने रहते हैं जब तक:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o वे इस्तीफा न दे दें,</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o वे लोकसभा के सदस्य न रहें, या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o लोकसभा के सभी सदस्यों के बहुमत से पारित प्रस्ताव द्वारा उन्हें पद से हटा न दिया जाए।</span></p>", "question_heading": ""}, {"sr_no": 105, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के 5,000 से अधिक वर्षों के इतिहास का विस्तृत वर्णन करने वाली पुस्तक \"इंडिया: ए हिस्ट्री\", जिसमें प्राचीन सभ्यताओं से लेकर आधुनिक स्वतंत्रता तक का इतिहास शामिल है, के लेखक हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विलियम डेलरिम्पल</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रोमिला थापर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जॉन केय</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रामचंद्र गुहा</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: जॉन केय (John Keay)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">'इन्डिया: ए हिस्ट्री' (India: A History)</span><span style=\"font-family:'Nirmala UI'\"> पुस्तक के लेखक ब्रिटिश इतिहासकार और पत्रकार </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जॉन केय</span><span style=\"font-family:'Nirmala UI'\"> हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· पहली बार 2000 में प्रकाशित यह पुस्तक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सिंधु घाटी सभ्यता</span><span style=\"font-family:'Nirmala UI'\"> से लेकर आधुनिक स्वतंत्रता तक, भारत के 5,000 से अधिक वर्षों के इतिहास का एक व्यापक विवरण प्रदान करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· केय अपनी सुलभ शैली के लिए जाने जाते हैं, जो आकर्षक कहानी के साथ विद्वतापूर्ण शोध का मिश्रण पेश करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· यह पुस्तक भारत की सभ्यता की यात्रा में रुचि रखने वाले छात्रों और सामान्य पाठकों के लिए एक संदर्भ के रूप में व्यापक रूप से उपयोग की जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का पुनरावलोकन</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विलियम डेलरिम्पल</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> उन्होंने 'द लास्ट मुगल', 'व्हाइट मुगल्स', 'रिटर्न ऑफ ए किंग' जैसी पुस्तकें लिखीं, लेकिन 'इन्डिया: ए हिस्ट्री' नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रोमिला थापर</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\ argin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: महाराजा सवाई प्रताप सिंह</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· जयपुर में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हवा महल</span><span style=\"font-family:'Nirmala UI'\"> का निर्माण </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1799</span><span style=\"font-family:'Nirmala UI'\"> में महाराजा सवाई जय सिंह द्वितीय (जयपुर के संस्थापक) के पोते </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">महाराजा सवाई प्रताप सिंह</span><span style=\"font-family:'Nirmala UI'\"> द्वारा किया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">वास्तुकार:</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लाल चंद उस्ताद</span><span style=\"font-family:'Nirmala UI'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उद्देश्य:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o महल की शाही महिलाओं के लिए बनाया गया था ताकि वे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पर्दा प्रथा</span><span style=\"font-family:'Nirmala UI'\"> का पालन करते हुए बिना किसी को दिखे सड़क के उत्सवों और दैनिक जीवन का अवलोकन कर सकें।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o इसमें </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">953 छोटी खिड़कियाँ (झरोखे)</span><span style=\"font-family:'Nirmala UI'\"> हैं जो ठंडी हवा को प्रसारित होने देती थीं, जिससे इस महल को \"हवा महल\" नाम मिला।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">शैली:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o यह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राजपूत और मुगल वास्तुकला</span><span style=\"font-family:'Nirmala UI'\"> का एक मिश्रण है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o इसका निर्माण </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लाल और गुलाबी बलुआ पत्थर</span><span style=\"font-family:'Nirmala UI'\"> से किया गया है, जो जयपुर के उपनाम </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">\"गुलाबी शहर\" (Pink City)</span><span style=\"font-family:'Nirmala UI'\"> का प्रतीक है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का पुनरावलोकन</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">महाराजा सवाई जय सिंह द्वितीय</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> जयपुर के संस्थापक, लेकिन हवा महल के निर्माता नहीं।</span
