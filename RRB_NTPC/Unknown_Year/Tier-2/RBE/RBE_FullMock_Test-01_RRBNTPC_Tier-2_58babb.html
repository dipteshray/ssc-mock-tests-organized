<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2.) GK Sectional Mock Test-1 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

 UI'\">अक्षर -6, -5, -3 से घट रहे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">(b) QKFC</span><br><span style=\"font-family:'Nirmala UI'\">Q - 6 = K</span><br><span style=\"font-family:'Nirmala UI'\">K - 5 = F</span><br><span style=\"font-family:'Nirmala UI'\">F - 3 = C</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">(c) MGBY</span><br><span style=\"font-family:'Nirmala UI'\">M - 6 = G</span><br><span style=\"font-family:'Nirmala UI'\">G - 5 = B</span><br><span style=\"font-family:'Nirmala UI'\">B - 3 = Y</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">(d) XRMJ</span><br><span style=\"font-family:'Nirmala UI'\">X - 6 = R</span><br><span style=\"font-family:'Nirmala UI'\">R - 5 = M</span><br><span style=\"font-family:'Nirmala UI'\">M - 3 = J</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लेकिन (a) PJFB में:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">P - 6 = J</span><br><span style=\"font-family:'Nirmala UI'\">J - 4 = F</span><br><span style=\"font-family:'Nirmala UI'\">F - 4 = B</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसलिए, PJFB समान पैटर्न का पालन नहीं करता है।</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक निश्चित कूट भाषा में, 'RA + FE' को '246' के रूप में कूटबद्ध किया जाता है, और 'AB + JC' को '115' के रूप में कूटबद्ध किया जाता है। उसी भाषा में 'AC + BD' को कैसे कूटबद्ध किया जाएगा?</span></p>", "option1": "<p style=\"margin-top nt-family:'Nirmala UI'\"> Q &gt; R </span><span style=\"font-family:'Cambria Math'\">≤</span><span style=\"font-family:'Nirmala UI'\"> S</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निष्कर्ष:</span><br><span style=\"font-family:'Nirmala UI'\">I. P </span><span style=\"font-family:'Cambria Math'\">≤</span><span style=\"font-family:'Nirmala UI'\"> M</span><br><span style=\"font-family:'Nirmala UI'\">II. Q &gt; T</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो निष्कर्ष I और न ही निष्कर्ष II सत्य है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल निष्कर्ष I सत्य है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल निष्कर्ष II सत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निष्कर्ष I और II दोनों सत्य हैं</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कथन से:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">M &lt; W = P</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अतः, M &lt; P का अर्थ है P &gt; M।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निष्कर्ष I कहता है P </span><span style=\"font-family:'Cambria Math'\">≤</span><span style=\"font-family:'Nirmala UI'\"> M, जो गलत है।</  31 अगस्त 2012 तक:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2009 = 1 विषम दिन</span><br><span style=\"font-family:'Nirmala UI'\">2010 = 1 विषम दिन</span><br><span style=\"font-family:'Nirmala UI'\">2011 = 1 विषम दिन</span><br><span style=\"font-family:'Nirmala UI'\">2012 = लीप वर्ष = 2 विषम दिन</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कुल विषम दिन</span><span style=\"font-family:'Nirmala UI'\"> = 1 + 1 + 1 + 2 = 5</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अतः, 31 अगस्त 2012 = रविवार + 5 दिन = शुक्रवार</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लेकिन हमें 30 अगस्त 2012 चाहिए, जो शुक्रवार से एक दिन पहले है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अतः, 30 अगस्त 2012 गुरुवार था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">31 अगस्त 2008 से 31 अगस्त 2012 तक:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2009 = 1 विषम दिन</span><br><span style=\"font-family:'Nirmala UI'\">2010 = 1 विषम दिन</span><br><span style=\"font-family:'Nirmala UI'\">2011 = 1 विषम दिन</span><br><span style=\"font-family:'Nirmala UI'\">2012 = लीप वर्ष = 2 विषम दिन</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कुल विषम दिन</span><span style=\"font-family:'Nirmala UI'\"> = 1 + 1 + 1 + 2 = 5</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"fon ह का अनुसरण करता है?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">100 – 200 – 600 – 2400</span><br><span style=\"font-family:'Nirmala UI'\">315 – 630 – 1890 – 7560</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">16 – 32 – 96 – 180</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">220 – 440 – 1260 – 4500</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1 – 2 – 6 – 24</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">80 – 40 – 160 – 640</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तर्क:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पहली संख्या × 2 = दूसरी संख्या</span><br><span style=\"font-family:'Nirmala UI'\">दूसरी संख्या × 3 = तीसरी संख्या</span><br><span style=\"font-family:'Nirmala UI'\">तीसरी संख्या × 4 = चौथी संख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">100 – 200 – 600 – 2400 के लिए:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">100 × 2 = 200</span><br><span style=\"font-family:'Nirmala UI'\">200 × 3 = 600</span><br><span style=\"font-family:'Nirmala UI'\">600 × 4 = 2400</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">315 – 630 – 1890 – 7560 के लिए:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">315 × 2 = 630</span><br><span style=\"font-family:'Nirmala UI'\">630 × 3 = 1890</span><br><span style=\"font-family:'Nirmala UI'\">1890 × 4 = 7560</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अब विकल्प (c) की जाँच करें:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1 × 2 = 2</span><br><span style=\"font-family:'Nirmala UI'\">2 × 3 = 6</span><br><span style=\"font-family:'Nirmala UI'\">6 × 4 = 24</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अतः, सही उत्तर (c) 1 – 2 – 6 – 24 है।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जनवरी 2026 में विमान दुर्घटना में महाराष्ट्र के किस मंत्री की मृत्यु हुई?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अजित पवार</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एकनाथ शिंदे</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उद्धव ठाकरे</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">देवेंद्र फडणवीस</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-wei \">भारत के सर्वोच्च न्यायालय के बारे में निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. इसकी स्थापना जनवरी 1950 में हुई थी।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. भारत के मुख्य न्यायाधीश की नियुक्ति राष्ट्रपति द्वारा की जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">III. सर्वोच्च न्यायालय के न्यायाधीश 65 वर्ष की आयु में सेवानिवृत्त होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उपरोक्त में से कौन से कथन सही हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I और II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II और III</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I और III</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I, II और III सभी</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">I, II और III सभी</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"> ottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अमोनियम फॉस्फेट</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">नाइट्रोग्लिसरीन</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">औद्योगिक विस्फोटक पदार्थ </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">डायनामाइट</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का आविष्कार </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अल्फ्रेड नोबेल ने 1867</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में किया था।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इसे मुख्य रूप से </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">नाइट्रोग्लिसरीन</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (एक अत्यधिक अस्थिर तरल विस्फोटक) को </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">डायटमी मृदा (कीसेलगुहर)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> जैसे </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">निष्क्रिय सरंध्र स्थिरीकरण मैट्रिक्स</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अवशोषित कराकर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> बनाया जाता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह स्थिरीकरण नाइट्रोग्लिसरीन को संभालने और परिवहन करने के लिए सुरक्षित बनाता है, जबकि इसकी विस्फोटक शक्ति को बनाए रखता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">डायनामाइट ने एक शक्तिशाली लेकिन अपेक्षाकृत स्थिर विस्फोटक प्रदान करके खनन, निर्माण और युद्ध में क्रांति ला दी।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ट्रINITROTOLUENE (टीएनटी)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> यह एक और विस्फोटक है, लेकिन टीएनटी का उपयोग डायनामाइट में नहीं किया जाता है; यह एक अलग यौगिक है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पोटेशियम नाइट्रेट</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> इसका उपयोग बारूद में होता है, डायनामाइट में नहीं।</sp  "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत की हाल ही में चालू की गई तीसरी स्वदेशी अरिहंत श्रेणी की परमाणु-संचालित बैलिस्टिक मिसाइल पनडुब्बी (SSBN) का नाम क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आईएनएस चक्र</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आईएनएस अरिधमन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आईएनएस सिंधुघोष</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आईएनएस सिंधुकृति</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">आईएनएस अरिधमन</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">भारत की </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">तीसरी स्वदेशी अरिहंत-श्रेणी की परमाणु-संचालित बैलिस्टिक मिसाइल पनडुब्बी (SSBN)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, जिसे </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">2025-26</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में चालू किया गया था, क margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> अन्य विकल्प गलत क्यों हैं</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">वर्गीस कुरियन</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> श्वेत क्रांति (दुग्ध क्रांति) के जनक के रूप में जाने जाते हैं, लेकिन उन्हें भारत रत्न नहीं मिला है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">नॉर्मन बोरलॉग</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> अमेरिकी वैज्ञानिक, वैश्विक हरित क्रांति के प्रमुख व्यक्ति, लेकिन भारतीय भारत रत्न प्राप्तकर्ता नहीं हैं।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विक्रम साराभाई</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> भारत के अंतरिक्ष कार्यक्रम के जनक, लेकिन हरित क्रांति से जुड़े नहीं हैं।</span></li></ul>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आधुनिक कंप्यूटरों की किस पीढ़ी में पहली बार \"एकीकृत परिपथ\" (ICs) नामक सफल इलेक्ट्रॉनिक घटक को एकीकृत किया गया था, जिसने भारी ट्रांजिस्टर का स्थान लिया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पहली पीढ़ी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दूसरी पीढ़ी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तीसरी पीढ़ी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चौथी पीढ़ी</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: तीसरी पीढ़ी</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">कंप्यूटरों की </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">तीसरी पीढ़ी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (1960 के दशक के मध्य से 1970 के दशक की शुरुआत तक) में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">एकीकृत परिपथ (ICs)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> पेश किए गए, जिन्होंने भारी ट्रांजिस्टर का स्थान लिया।</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">ICs ने कई इलेक्ट्रॉनिक घटकों (ट्रांजिस्टर, रेसिस्टर, कैपेसिटर) को एक ही सिलिकॉन चिप पर निर्मित करने की अनुमति दी।</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इस सफलता ने कंप्यूटरों को बनाया:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">आकार में छोटा</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">प्रोसेसिंग में तेज़</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">अधिक विश्वसनीय और ऊर्जा-कुशल</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">उत्पादन में सस्ता</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> अन्य विकल्प गलत क्यों हैं</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पहली पीढ़ी (1940-1950 का दशक)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">वैक्यूम ट्यूब</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का उपयोग करती थी, बहुत बड़ी और बिजली की खपत अधिक थी।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">दूसरी पीढ़ी (1950-1960 का दशक)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ट्रांजिस्टर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का उपयोग करती थी, वैक्यूम ट्यूबों से छोटे और तेज़, लेकिन ICs की तुलना में अभी भी भारी थे।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">चौथी पीढ़ी (1970 के दशक से आगे)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">माइक्रोप्रोसेसर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> पेश किए, जिसमें हजारों ICs को एक ही चिप में एकीकृत किया गया।</span></li></ul>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अभिकथन (A): </span><span style=\"font-family:'Nirmala UI'\">मुद्रास्फीति धन की क्रय शक्ति को कम करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कारण (R):</span><span style=\"font-family:'Nirmala UI'\"> वस्तुओं की कीमतों में सामान्य वृद्धि से वही धनराशि कम वस्तुएँ और सेवाएँ खरीद पाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सबसे उपयुक्त उत्तर चुनें:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सही हैं, और R, A का सही स्पष्टीकरण है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सही हैं, लेकिन R, A का सही स्पष्टीकरण नहीं है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A सही है, लेकिन R गलत है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A गलत है, लेकिन R सही है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">A और R दोनों सही हैं, और R, A का सही स्पष्टीकरण है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अभिकथन (A): मुद्रास्फीति धन की क्रय शक्ति को कम करती है</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> सत्य।</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">मुद्रास्फीति का अर्थ है कि वस्तुओं और सेवाओं की कीमतें समय के साथ बढ़ती हैं।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">परिणामस्वरूप, वही धनराशि कम वस्तुएँ खरीद सकती है।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कारण (R): वस्तुओं की कीमतों में सामान्य वृद्धि से वही धनराशि कम वस्तुएँ और सेवाएँ खरीद पाती है</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> सत्य।</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यही कारण है कि मुद्रास्फीति क्रय शक्ति को कम करती है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">उदाहरण: यदि पिछले साल ₹100 में 10 सेब आते थे, और अब सेब की कीमत ₹12 प्रति सेब है, तो वही ₹100 में केवल ~8 सेब ही आएंगे।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">चूंकि </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">R, A को सही ढंग से समझाता है</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, इसलिए सबसे उपयुक्त उत्तर है: </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">A और R दोनों सही हैं, और R, A का सही स्पष्टीकरण है।</span></li></ul>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय राष्ट्रीय कांग्रेस की स्थापना किस वर्ष हुई थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1857</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1875</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1885</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1905</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">1885</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भारतीय राष्ट्रीय कांग्रेस (INC)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> की स्थापना </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">दिसंबर 1885</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में हुई थी।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">पहला अधिवेशन </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बॉम्बे (मुंबई)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में आयोजित किया गया था, जिसकी अध्यक्षता </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">व्योमेश चंद्र बनर्जी (W.C. बनर्जी)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> ने की थी।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इसकी स्थापना </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">एलन ऑक्टेवियन ह्यूम (A.O. ह्यूम)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, एक सेवानिवृत्त ब्रिटिश सिविल सेवक, द्वारा भारतीयों को अपनी राजनीतिक चिंताओं को शांतिपूर्वक व्यक्त करने के लिए एक मंच प्रदान करने के उद्देश्य से की गई थी।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">पहले अधिवेशन में 72 प्रतिनिधियों ने भाग लिया, जिसने भारत में संगठित राष्ट्रवादी राजनीति की शुरुआत को चिह्नित किया।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> अन्य विकल्प गलत क्यों हैं</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1857</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\" t:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">प्रसिद्ध पेंटिंग </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भारत माता</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1905</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में रवींद्रनाथ टैगोर के भतीजे </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अवनींद्रनाथ टैगोर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> द्वारा बनाई गई थी।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इसमें भारत माता को भगवा वस्त्र पहनी हुई एक महिला के रूप में चित्रित किया गया था, जो एक किताब, धान के गट्ठे, कपड़े का एक टुकड़ा और एक माला धारण किए हुए थीं — यह </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ज्ञान, भोजन, वस्त्र और आध्यात्मिक शक्ति</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का प्रतीक था।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह पेंटिंग </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">स्वदेशी आंदोलन का एक प्रतीक</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> बन गई, जिसने बंगाल के विभाजन (1905) के दौरान राष्ट्रवादी भावना को प्रेरित किया।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">अवनींद्रनाथ टैगोर </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बंगाल स्कूल ऑफ आर्ट के संस्थापक</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> भी थे, जिसने पश्चिमी शैलियों की तुलना में भारतीय परंपराओं पर जोर दिया।</span></li></ul><p  लिए नहीं।</span></li></ul>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मुगल सम्राट अकबर के बारे में निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. वह 13 वर्ष की आयु में सिंहासन पर बैठा था।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. उसने मुसलमानों पर लगे जजिया कर को समाप्त कर दिया था।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">III. उसने दीन-ए-इलाही नामक धर्म की स्थापना की थी।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उपर्युक्त कथनों में से कौन सा/से सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I और II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II और III</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I और III</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I, II और III सभी</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">केवल I और III</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कथन I: वह 13 वर्ष की आयु में सिंहासन पर बैठा था</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> सही।</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">अकबर </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1556</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में अपने पिता </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">हुमायूं</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> की मृत्यु के बाद, मात्र </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">13 वर्ष</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> की कम आयु में सम्राट बना।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">उसके संरक्षक </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बैरम खान</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> ने सत्ता के सुदृढीकरण तक उसे प्रारंभिक मार्गदर्शन दिया।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कथन II: उसने मुसलमानों पर लगे जजिया कर को समाप्त कर दिया था</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> गलत।</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">अकबर ने अपनी समावेशी धार्मिक नीति (सुलह-ए-कुल) के तहत </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1564</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">गैर-मुसलमानों पर लगे जजिया कर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> को समाप्त कर दिया था।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">कथन में गलत तरीके से “मुसलमानों पर” उल्लेख किया गया है।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कथन III: उसने दीन-ए-इलाही नामक धर्म की स्थापना की थी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> सही।</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1582</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में, अकबर ने </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">दीन-ए-इलाही (ईश्वर का धर्म)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> की शुरुआत की, यह एक समन्वयवादी विश्वास था जो विभिन्न धर्मों के तत्वों का मिश्रण था।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह एक जन धर्म की तुलना में एक नैतिक संहिता अधिक थी, और इसके बहुत कम अनुयायी थे।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वर्ष 2025 के लिए G20 समूह की अध्यक्षता किस देश ने की थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संयुक्त राज्य अमेरिका</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ब्राजील</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दक्षिण अफ्रीका</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इंडोनेशिया</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वर्ष 2025 के लिए G20 की अध्यक्षता </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दक्षिण अफ्रीका</span><span style=\"font-family:'Nirmala UI'\"> ने की थी, जो पहली बार किसी अफ्रीकी राष्ट्र द्वारा समूह की अध्यक्षता थी। 2025 का </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">G20 नेताओं का शिखर सम्मेलन</span><span style=\"font-family:'Nirmala UI'\"> जोहान्सबर्ग में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">22-23 नवंबर 2025</span><span style=\"font-family:'Nirmala UI'\"> को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राष्ट्रपति सिरिल रामाफोसा</span><span style=\"font-family:'Nirmala UI'\"> के नेतृत्व में हुआ था।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुख्य विवरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अध्यक्षता अवधि:</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> दक्षिण अफ्रीका ने </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1 दिसंबर 2024 से 30 नवंबर 2025</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> तक G20 की अध्यक्षता ग्रहण की थी।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">शिखर सम्मेलन स्थल:</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">जोहान्सबर्ग एक्सपो सेंटर, दक्षिण अफ्रीका</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">शिखर सम्मेलन की तिथियाँ:</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">22-23 नवंबर 2025</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विषय:</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> “एकजुटता, समानता, स्थिरता”।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">महत्व:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह पहली बार था जब </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अफ्रीकी महाद्वीप</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> ने G20 शिखर सम्मेलन की मेजबानी की।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अफ्रीका की विकास प्राथमिकताओं</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, ग्लोबल साउथ देशों की ऋण भेद्यता, जलवायु परिवर्तन और अंतरराष्ट्रीय वित्तीय संस्थानों के सुधार पर ध्यान केंद्रित किया गया।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">ग्लोबल साउथ की अध्यक्षताओं के क्रम को जारी रखा: इंडोनेशिया (2022), भारत (2023), ब्राजील (2024), दक्षिण अफ्रीका (2025)।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जापान की आधिकारिक मुद्रा क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">येन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वोन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">युआन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डॉन्ग</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: येन</span></p><p style=\"margi \">आयरलैंड के संविधान (1937) से लिए गए</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> थे।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">आयरलैंड में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सामाजिक नीति के निदेशक सिद्धांतों</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> से प्रेरित होकर, इन्हें भारतीय संविधान के भाग IV (अनुच्छेद 36-51) में शामिल किया गया।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">उद्देश्य: </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कल्याणकारी राज्य</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> की स्थापना में राज्य का मार्गदर्शन करना, सामाजिक और आर्थिक न्याय सुनिश्चित करना, हालांकि वे </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">गैर-न्यायसंगत</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> हैं (अदालतों द्वारा प्रवर्तनीय नहीं)।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> अन्य विकल्प गलत क्यों हैं</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">फ्रांस</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> प्रस्तावना में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">स्वतंत्रता, समानता, बंधुत्व</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के आदर्शों का स्रोत।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ऑस्ट्रेलिया</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">समवर्ती सूची</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> और संसद की संयुक्त बैठक का स्रोत।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कनाडा</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सशक्त केंद्र</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> और संघ के पास अवशिष्ट शक्तियों का स्रोत।</span></li></ul>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कौन सी जलसन्धि भारत को श्रीलंका से अलग करती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मलक्का जलसन्धि</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सुंडा जलसन
