<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>4.) Maths Sectional Mock Test-2 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

f;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">एक </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">समतल दर्पण</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> हमेशा ऐसा प्रतिबिंब बनाता है जो होता है:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सीधा (ऊर्ध्वाधर रूप से उल्टा नहीं)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">वस्तु के समान आकार का</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पार्श्व रूप से उल्टा (बाएं-दाएं उलटाव)</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह प्रश्न में दिए गए विवरण से पूरी तरह मेल खाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अवतल दर्पण</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> वस्तु की स्थिति के आधार पर वास्तविक या आभासी प्रतिबिंब बना सकता है; आकार भिन्न हो सकता है (आवर्धित या छोटा)।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उत्तल दर्पण</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> हमेशा छोटा, आभासी और सीधा प्रतिबिंब बनाता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बेलनाकार दर्पण</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> विकृत प्रतिबिंब बनाता है, समान आकार के सीधे नहीं।</span></li></ul>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के राष्ट्रपति के बारे में निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. राष्ट्रपति का चुनाव प्रत्यक्ष निर्वाचन की विधि से होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. राष्ट्रपति बनने की न्यूनतम आयु 35 वर्ष है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">III. राष्ट्रपति पाँच वर्ष की अवधि के लिए पद धारण करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उपरोक्त में से कौन से कथन सही हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I और II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II और III</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I और III</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I, II और III सभी</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">केवल II और III</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कथन I</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> गलत</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">भारत का राष्ट्रपति लोगों द्वारा </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सीधे निर्वाचित नहीं होता है</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">वह संसद के दोनों सदनों के निर्वाचित सदस्यों और राज्यों तथा केंद्र शासित प्रदेशों की विधान सभाओं के निर्वाचित सदस्यों से मिलकर बने एक </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">निर्वाचक मंडल</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> द्वारा </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अप्रत्यक्ष रूप से</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> चुना जाता/जाती है।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कथन II</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> सही</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">भारत का राष्ट्रपति बनने के लिए आवश्यक न्यूनतम आयु </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">35 वर्ष</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> है।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कथन III</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> सही</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">राष्ट्रपति </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पाँच वर्ष की अवधि</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के लिए पद धारण करता/करती है, जब तक कि उसे पहले महाभियोग द्वारा न हटाया जाए।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत की सबसे बड़ी ताजे पानी की झील कौन सी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वुलर झील</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डल झील</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चिल्का झील</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लोकटक झील</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारत की सबसे बड़ी मीठे पानी की झील वुलर झील है, जो जम्मू &amp; कश्मीर के बांदीपोरा जिले में स्थित है।</span><span style=\"font-family:'Nirmala UI'\"> यह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">30–189 वर्ग किमी</span><span style=\"font-family:'Nirmala UI'\"> के बीच मौसमी रूप से भिन्न क्षेत्र को कवर करती है, जो इसे न केवल भारत की सबसे बड़ी मीठे पानी की झील बनाती है बल्कि एशिया की सबसे बड़ी झीलों में से एक भी बनाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">वुलर झील</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">जम्मू &amp; कश्मीर में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">श्रीनगर से लगभग 40 किमी उत्तर-पश्चिम</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में स्थित है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">झेलम नदी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> और अन्य पर्वतीय धाराओं से पोषित है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">1990 में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अंतर्राष्ट्रीय महत्व की रामसर आर्द्रभूमि</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> घोषित किया गया।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">समृद्ध जैव विविधता का समर्थन करता है: प्रवासी पक्षी (जैसे, मल्लार्ड, पोचार्ड, शोवेलर बत्तख) और मछली प्रजातियाँ (कार्प, स्किज़ोथोरैक्स)।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">कश्मीर घाटी में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">8,000 से अधिक मछुआरों</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> को आजीविका प्रदान करता है।</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> अन्य विकल्प गलत क्यों हैं</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">डल झील</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> बहुत छोटी, हाउसबोट और पर्यटन के लिए प्रसिद्ध है, लेकिन सबसे बड़ी नहीं।</span></li>< pan style=\"font-weight:bold;font-family:'Nirmala UI'\">मुख्य विवरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राज्य</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> उत्तराखंड</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">क्षेत्र</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> सोर घाटी, पिथौरागढ़ जिला (कुमाऊं क्षेत्र)</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उत्पत्ति</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> पश्चिमी नेपाल के सोरार क्षेत्र से उत्पन्न हुआ, बाद में कुमाऊं के गांवों में पेश किया गया।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विषय</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> कृषि और पशुचारण गतिविधियाँ, विशेष रूप से </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">धान रोपण</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विशेष विशेषताएँ</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">कृषि जीवन को दर्शाने वाले मुखौटा नृत्य।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">लखिया भूत, हिरण चीतल और महाकाली जैसे पात्र।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">अनुष्ठानों में बकरे की बलि, नाटकीय प्रदर्शन और लोकगीत शामिल हैं।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">हालिया अपडेट</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> 2024 में, उत्तराखंड के मुख्यमंत्री पुष्कर सिंह धामी ने घोषणा की कि हिलजात्रा को </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राज्य उत्सव</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के रूप में मनाया जाएगा।</span></li></ul>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन-सी मिश्रधातु मुख्य रूप से तांबा, जस्ता और निकल से बनी होती है, जिसका उपयोग अक्सर इसके संक्षारण प्रतिरोध के कारण चांदी के बर्तन और गियर बनाने में किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पीतल</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कांस्य</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जर्मन सिल्वर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ड्यूरालुमिन</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">जर्मन सिल्वर</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">जर्मन सिल्वर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (जिसे निकल सिल्वर भी कहा जाता है) एक मिश्रधातु है जो मुख्य रूप से इससे बनी होती है:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">तांबा (Cu)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">जस्ता (Zn)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">निकल (Ni)</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इसके नाम के बावजूद, इसमें </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">वास्तविक चांदी नहीं</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> होती है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह इन गुणों के लिए महत्वपूर्ण है:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">संक्षारण प्रतिरोध</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">चांदी जैसा रूप</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">स्थायित्व</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">सामान्य उपयोग: </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">चांदी के बर्तन, कटलरी, गियर, संगीत वाद्ययंत्र, सिक्के और सजावटी वस्तुएँ</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पीतल</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> तांबा + जस्ता (निकल नहीं)।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कांस्य</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> तांबा + टिन (कभी-कभी अन्य धातुएँ)।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ड्यूरालुमिन</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> एल्युमीनियम + तांबा + मैग्नीशियम + मैंगनीज (विमानों में उपयोग किया जाता है, चांदी के बर्तन/गियर में नहीं)।</span></li></ul>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अभिकथन (A):</span><span style=\"font-family:'Nirmala UI'\"> राज्यसभा संसद का एक स्थायी सदन है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कारण (R):</span><span style=\"font-family:'Nirmala UI'\"> इसके एक-तिहाई सदस्य प्रत्येक दो वर्ष में सेवानिवृत्त होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सबसे उपयुक्त उत्तर का चयन करें:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सत्य हैं, और R, A का सही स्पष्टीकरण है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सत्य हैं, लेकिन R, A का सही स्पष्टीकरण नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A सत्य है, लेकिन R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A असत्य है, लेकिन R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">A और R दोनों सत्य हैं, और R, A का सही स्पष्टीकरण है</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अभिकथन (A)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> सत्य</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राज्यसभा</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> संसद का एक </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">स्थायी सदन</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">लोकसभा के विपरीत, यह </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कभी भंग नहीं होती</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कारण (R)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span> an><span style=\"font-family:'Nirmala UI'\">पाटलिपुत्र</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पाटलिपुत्र</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (आधुनिक पटना, बिहार) </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मौर्य साम्राज्य की राजधानी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> थी।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">5वीं शताब्दी ईसा पूर्व में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अजातशत्रु</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> द्वारा स्थापित, यह बाद में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">चंद्रगुप्त मौर्य</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के अधीन राजनीतिक केंद्र बन गया और </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अशोक के शासनकाल</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के दौरान फला-फूला।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">गंगा, सोन और गंडक नदियों के संगम</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के पास रणनीतिक रूप से स्थित था, जो इसे प्रशासन, व्यापार और रक्षा के लिए आदर्श बनाता था।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">अपने </span>< t:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कथन III</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> सत्य</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">हिमालय लगभग </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">2,400 किमी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> की लंबाई में फैला हुआ है, जो </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पांच देशों</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">: भारत, नेपाल, भूटान, चीन और पाकिस्तान में फैला हुआ है।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कंप्यूटर शब्दावली में 'GUI' का पूर्ण रूप क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ग्राफिकल यूनिफाइड इनपुट्स</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जनरल यूटिलिटी इंटरफ़ेस</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ग्राफिकल यूजर इंटरफ़ेस</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जनरेटेड यूनिक इनपुट्स</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्प C: ग्राफिकल यूजर इंटरफ़ेस</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ग्राफिकल यूजर इंटरफ़ेस (GUI)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">एक प्रकार का </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">यूजर इंटरफ़ेस</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> जो विंडोज, आइकन, मेनू और बटन जैसे </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">दृश्य तत्वों</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का उपयोग करके कंप्यूटर के साथ बातचीत करने की अनुमति देता है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह टेक्स्ट-आधारित कमांड-लाइन इंटरफेस (CLI) की तुलना में कंप्यूटिंग को अधिक </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उपयोगकर्ता-अनुकूल</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> बनाता है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">उदाहरण: माइक्रोसॉफ्ट विंडोज, मैकओएस, एंड्रॉइड, आईओएस।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किस भारतीय अर्धसैनिक बल ने 2026 में माउंट एवरेस्ट के लिए अपना पहला पूर्ण महिला अंतर्राष्ट्रीय पर्वतारोहण अभियान सफलतापूर्वक पूरा किया?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत-तिब्बत सीमा पुलिस</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सशस्त्र सीमा बल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सीमा सुरक्षा बल </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केंद्रीय औद्योगिक सुरक्षा बल</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारत-तिब्बत सीमा पुलिस (ITBP) ने मई 2026 में माउंट एवरेस्ट के लिए अपना पहला पूर्ण-महिला अंतर्राष्ट्रीय पर्वतारोहण अभियान सफलतापूर्वक पूरा किया, जो भारत के अर्धसैनिक बलों के लिए एक ऐतिहासिक उपलब्धि है।</span><span style=\"font-family:'Nirmala UI'\"> 11 महिला पर्वतारोहियों सहित 14 सदस्यीय टीम ने 21 मई 2026 को साउथ कोल मार्ग से शिखर पर चढ़ाई की। </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ITBP अभियान के बारे में मुख्य तथ्य</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बल:</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> भारत-तिब्बत सीमा पुलिस (ITBP)</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-w pan style=\"font-size:12pt;font-family:'Nirmala UI'\">शिक्षा का अधिकार</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">निजता का अधिकार</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">मासिक धर्म स्वच्छता का अधिकार</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">और अब, स्पष्ट रूप से, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राजमार्गों पर सुरक्षित आवागमन का अधिकार</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">।</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> अन्य विकल्प गलत क्यों हैं</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 14</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> कानून के समक्ष समानता, राजमार्गों से संबंधित नहीं।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 16</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> सार्वजनिक रोजगार में अवसर की समानता।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 19</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> भाषण, आवागमन, संघ बनाने आदि की स्वतंत्रता।</span></li></ul>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा वक्र किसी अर्थव्यवस्था में बेरोजगारी की दर और मुद्रास्फीति की दर के बीच विपरीत संबंध को ग्राफिक रूप से दर्शाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लाफ़र वक्र</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लॉरेंज वक्र</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">फिलिप्स वक्र</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कुज़नेट्स वक्र</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">फिलिप्स वक्र</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">फिलिप्स वक्र</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> किसी अर्थव्यवस्था में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बेरोजगारी की दर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> और </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मुद्रास्फीति की दर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के बीच </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विपरीत संबंध</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> दर्शाता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">अवधारणा:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">जब बेरोजगारी कम होती है </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> वस्तुओं/सेवाओं की मांग बढ़ती है </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> मुद्रास्फीति बढ़ने लगती है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">जब बेरोजगारी अधिक होती है </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> मांग घटती है </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> मुद्रास्फीति घटने लगती है।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इसे सबसे पहले अर्थशास्त्री </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ए.डब्ल्यू. फिलिप्स</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> ने 1958 में, यूके के आंकड़ों के आधार पर प्रस्तुत किया था।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लाफ़र वक्र</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> कर दरों और सरकारी राजस्व के बीच संबंध दर्शाता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लॉरेंज वक्र</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> जनसंख्या में आय असमानता का प्रतिनिधित्व करता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कुज़नेट्स वक्र</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> आर्थिक विकास और आय असमानता के बीच संबंध दर्शाता है।</span></li></ul>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सी प्रमुख कल्याणकारी योजना 1 मई, 2016 को बलिया (उत्तर प्रदेश) में प्रधान मंत्री नरेंद्र मोदी द्वारा शुरू की गई थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रधानमंत्री श्रम योगी मान-धन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रधानमंत्री उज्ज्वला योजना</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रधानमंत्री जन धन योजना</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रधानमंत्री आवास योजना - ग्रामीण</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">प्रधानमंत्री उज्ज्वला योजना (PMUY)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">प्रधानमंत्री उज्ज्वला योजना</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> 1 मई 2016 को बलिया, उत्तर प्रदेश में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">प्रधानमंत्री नरेंद्र मोदी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> द्वारा शुरू की गई थी।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उद्देश्य:</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> गरीबी रेखा से नीचे (BPL) के परिवारों की महिलाओं को </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">एलपीजी कनेक्शन प्रदान करना</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, जिससे लकड़ी और केरोसिन पर निर्भरता कम हो।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लक्ष्य:</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> शुरुआत में 5 करोड़ कनेक्शन, बाद में 8 करोड़ तक विस्तारित किया गया।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">महत्व:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">महिलाओं के </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">स्वास्थ्य और सशक्तिकरण को बढ़ावा</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> देता है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इनडोर वायु प्रदूषण को कम करता है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">स्वच्छ रसोई ईंधन अपनाने को प्रोत्साहित करता है।</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">प्रधानमंत्री श्रम योगी मान-धन</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">2019</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में शुरू की गई, असंगठि ": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक वैध दिखने वाला सॉफ्टवेयर जो उपयोगकर्ताओं को उसके वास्तविक इरादे के बारे में गुमराह करता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सुरक्षित फ़ाइल स्थानांतरण के लिए उपयोग किया जाने वाला एक प्रकार का नेटवर्क प्रोटोकॉल</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">एक वैध दिखने वाला सॉफ्टवेयर जो उपयोगकर्ताओं को उसके वास्तविक इरादे के बारे में गुमराह करता है</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">साइबर सुरक्षा में एक </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ट्रोजन हॉर्स</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> से तात्पर्य </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">वैध सॉफ्टवेयर के रूप में प्रच्छन्न दुर्भावनापूर्ण सॉफ्टवेयर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> से है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह उपयोगकर्ताओं को इसे इंस्टॉल या चलाने के लिए धोखा देता है, अक्सर एक उपयोगी प्रोग्राम, फ़ाइल या अपडेट के रूप में दिखाई देता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">एक बार निष्पादित होने पर, यह कर सकता है:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">संवेदनशील डेटा (पासवर्ड, बैंकिंग जानकारी) चुरा सकता है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">हैकरों के लिए बैकडोर स्थापित कर सकता है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">सिस्टम को नुकसान पहुंचा सकता है या नियंत्रित कर सकता है।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह नाम </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ट्रोजन हॉर्स के ग्रीक मिथक</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> से आया है, जहाँ सैनिक ट्रॉय में घुसपैठ करने के लिए एक लकड़ी के घोड़े के अंदर छिपे थे।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ट्रैफिक की निगरानी करने वाला हार्डवेयर डिवाइस</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> वह एक </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">नेटवर्क स्निफ़र</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> या </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पैकेट एनालाइज़र</span><span style= ght:bold;font-family:'Nirmala UI'\">ज्वार</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> से प्रभावित होती हैं।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">प्रमुख विशेषताएं:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">सघन मैंग्रोव वनस्पति।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">खारी और जलभराव वाली मिट्टी।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">जलभराव वाली स्थितियों में सांस लेने के लिए </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">स्टिल्ट जड़ें</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> और </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">न्यूमेटोफोर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> जैसी विशिष्ट जड़ें।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">रॉयल बंगाल टाइगर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, एस्टुरीन मगरमच्छ और समृद्ध जैव विविधता के लिए प्रसिद्ध।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> अन्य विकल्प गलत क्यों हैं</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उष्णकटिबंधीय पर्णपाती वन</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> मध्य भारत में पाए जाते हैं; मौसमी रूप से पत्ते झड़ते हैं, ज्वारीय नहीं।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पर्वतीय वन</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> हिमालयी क्षेत्रों में पाए जाते हैं; ऊंचाई-आधारित वनस्पति।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कांटेदार और झाड़ीदार वन</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> शुष्क क्षेत्रों (राजस्थान, गुजरात) में पाए जाते हैं; डेल्टाई नहीं।</span></li></ul>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संविधान की समवर्ती सूची के अंतर्गत निम्नलिखित में से कौन से विषय सूचीबद्ध हैं?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. शिक्षा</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. रक्षा</span></p><p style=\"margin-top:0pt;margi left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">शिक्षा</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> को </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">42वें संवैधानिक संशोधन अधिनियम, 1976</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> द्वारा समवर्ती सूची में जोड़ा गया था।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">आपराधिक कानून</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> हमेशा समवर्ती सूची का हिस्सा रहा है, क्योंकि पूरे देश में एकरूपता की आवश्यकता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">रक्षा</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">संघ सूची</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के अंतर्गत आता है, क्योंकि यह राष्ट्रीय महत्व का विषय है और राज्यों द्वारा इस पर कानून नहीं बनाया जा सकता है।</span></li></ul>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा खेल पद फुटबॉल के खेल से संबंधित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लिब्रो</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ड्यूस</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रैली</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऑफसाइड</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ऑफसाइड</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">फुटबॉल (सॉकर) में, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ऑफसाइड</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> एक नियम उल्लंघन को संदर्भित करता है जहाँ एक आक्रामक खिलाड़ी (attacking player) गेंद के पास आने के क्षण में, गेंद और दूसरे अंतिम डिफेंडर (second-last defender), दोनों की तुलना में प्रतिद्वंद्वी की गोल रेखा के अधिक करीब स्थित होता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उद्देश्य:</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> यह हमलावरों को गोल के पास खड़े होकर प्रतीक्षा करने (goal-hanging) से रोकता है और खेल में निष्पक्षता सुनिश्चित करता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह फुटबॉल के सबसे मौलिक और अक्सर "> यह बैडमिंटन/टेनिस में शॉट की एक श्रृंखला है, फुटबॉल में नहीं।</span></li></ul>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1932 में कुख्यात \"सांप्रदायिक पंचाट\" की घोषणा करने वाले ब्रिटिश प्रधान मंत्री कौन थे, जिसने अल्पसंख्यक समुदायों और दलित वर्गों के लिए पृथक निर्वाचक मंडल स्थापित किए थे?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रैमसे मैकडोनाल्ड</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विंस्टन चर्चिल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">क्लीमेंट एटली</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लॉर्ड लिनलिथगो</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">रेमसे मैकडोनाल्ड</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सांप्रदायिक पंचाट (Communal Award)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> की घोषणा </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अगस्त 1932</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ब्रिटिश प्रधानमंत्री रेमसे मैकडोनाल्ड</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> ने की थी।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इसने मुस्लिम, सिख, भारतीय ईसाई, एंग्लो-इंडियन, यूरोपीय जैसे अल्पसंख्यक समुदायों और साथ ही </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">दलित वर्गों (अनुसूचित जातियों)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के लिए </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पृथक निर्वाचन</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> की शुरुआत की।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इस पंचाट का उद्देश्य हाशिए पर पड़े समूहों को राजनीतिक प्रतिनिधित्व प्रदान करना था, लेकिन सांप्रदायिक विभाजन को गहरा करने के लिए इसकी व्यापक रूप से आलोचना की गई।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इसके जवाब में, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">महात्मा गांधी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> ने दलित वर्गों के लिए पृथक निर्वाचक मंडल के खिलाफ आमरण अनशन शुरू किया, जिसके परिणामस्वरूप गांधी और बी.आर. अंबेडकर के बीच </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पूना पैक्ट (1932)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> हुआ।</span></li></ul>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डेटाबेस प्रबंधन प्रणालियों (DBMS) में, एक तालिका के भीतर एक अद्वितीय पहचानकर्ता कुंजी जो यह सुनिश्चित करती है कि क
