mily:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सेंसेक्स (SENSEX)</span><span style=\"font-family:'Nirmala UI'\"> बॉम्बे स्टॉक एक्सचेंज (</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">BSE</span><span style=\"font-family:'Nirmala UI'\">) का बेंचमार्क शेयर बाजार सूचकांक है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1986</span><span style=\"font-family:'Nirmala UI'\"> में पेश किया गया था और यह भारतीय अर्थव्यवस्था के प्रमुख क्षेत्रों की </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">30 आर्थिक रूप से मजबूत और स्थापित कंपनियों</span><span style=\"font-family:'Nirmala UI'\"> के प्रदर्शन को ट्रैक करता है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इन 30 कंपनियों को समग्र बाजार प्रदर्शन का </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रतिनिधि</span><span style=\"font-family:'Nirmala UI'\"> माना जाता है।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सेंसेक्स का व्यापक रूप से भारतीय शेयर बाजार और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">निवेशक भावना</span><span style=\"font-family:'Nirmala UI'\"> के बैरोमीटर के रूप में उपयोग किया जाता है।</span></li></ul>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">'हिंद महासागर द्विध्रुव (आईओडी)' एक जलवायु घटना है जो भारत में मानसून की वर्षा को प्रभावित करती है। सकारात्मक आईओडी घटना आम तौर पर भारतीय मानसून पर किस प्रभाव से जुड़ी होती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत भर में सामान्य से कम वर्षा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत में वर्षा पर कोई खास प्रभाव नहीं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत में सामान्य से अधिक वर्षा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल उत्तरी भारत में अत्यधिक बाढ़</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: भारत में सामान्य से अधिक वर्षा (Above-normal rainfall in India)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हिंद महासागर द्विध्रुव (IOD)</span><span style=\"font-family:'Nirmala UI'\"> एक जलवायु घटना है, जो पश्चिमी और पूर्वी हिंद महासागर के बीच समुद्र की सतह के तापमान में अंतर द्वारा पहचानी जाती है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सकारात्मक (Positive) IOD</span><span style=\"font-family:'Nirmala UI'\"> घटना तब होती है जब:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">पश्चिमी हिंद महासागर (अफ्रीका के पास) </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अधिक गर्म</span><span style=\"font-family:'Nirmala UI'\"> हो जाता है।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">पूर्वी हिंद महासागर (इंडोनेशिया के पास) </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ठंडा</span><span style=\"font-family:'Nirmala UI'\"> हो जाता है।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">तापमान का यह अंतर भारतीय उपमहाद्वीप में संवहन और वर्षा को बढ़ाता है, जिससे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दक्षिण-पश्चिम मानसून</span><span style=\"font-family:'Nirmala UI'\"> मजबूत होता है।</span></li></ul></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रभाव:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सकारात्मक IOD</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> भारत में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सामान्य से अधिक वर्षा</span><span style=\"font-family:'Nirmala UI'\">।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नकारात्मक IOD</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> भारत में मानसूनी वर्षा में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कमी</span><span style=\"font-family:'Nirmala UI'\">।</span></li><li style=\"margin-left:30.2pt;margin-bottom:8pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">महत्वपूर्ण बात यह है कि IOD भारतीय मानसून पर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एल नीनो (El Niño)</span><span style=\"font-family:'Nirmala UI'\"> के नकारात्मक प्रभाव को बेअसर कर सकता है, जिससे यह वर्षा की भविष्यवाणी में एक महत्वपूर्ण कारक बन जाता है।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्राचीन भारतीय इतिहास में किस राजवंश के शासक ने 'हिरण्य-गर्भ' अनुष्ठान किया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पाल</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रतिहार</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चालुक्य</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राष्ट्रकुट</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: राष्ट्रकूट (Rashtrakuta)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हिरण्य-गर्भ</span><span style=\"font-family:'Nirmala UI'\"> अनुष्ठान (शाब्दिक अर्थ \"स्वर्ण गर्भ\") एक वैदिक अनुष्ठान था जो राजाओं द्वारा खुद को प्रतीकात्मक रूप से </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">क्षत्रिय</span><span style=\"font-family:'Nirmala UI'\"> के रूप में बदलने के लिए किया जाता था, जिससे उनके शासन को वैधता प्राप्त होती थी।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· इसका उपयोग अक्सर उन शासकों द्वारा किया जाता था जो मूल रूप से पारंपरिक क्षत्रिय वर्ण के नहीं थे लेकिन उच्च अनुष्ठानिक स्थिति का दावा करना चाहते थे। </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दंतिदुर्ग</span><span style=\"font-family:'Nirmala UI'\"> ने यह अनुष्ठान किया था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· प्राचीन भारतीय इतिहास में, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राष्ट्रकूट वंश</span><span style=\"font-family:'Nirmala UI'\"> के शासकों ने अपनी वैधता और अधिकार स्थापित करने के लिए यह अनुष्ठान किया था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· यह प्रारंभिक मध्यकालीन भारत में राजनीतिक शक्ति और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">धार्मिक अनुष्ठानिक अधिकार</span><span style=\"font-family:'Nirmala UI'\"> के बीच के अंतर्संबंध को उजागर करता है।</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संविधान में 'शक्तियों के पृथक्करण' की अवधारणा - विधायिका, कार्यपालिका और न्यायपालिका का पृथक्करण - मूल रूप से किस देश के संवैधानिक ढांचे से ली गई थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संयुक्त राज्य अमेरिका</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">फ्रांस</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आयरलैंड</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कनाडा</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: संयुक्त राज्य अमेरिका (United States of America)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">शक्तियों के पृथक्करण (Separation of Powers)</span><span style=\"font-family:'Nirmala UI'\"> की अवधारणा — जिसमें अधिकार को विधायिका, कार्यपालिका और न्यायपालिका के बीच विभाजित किया जाता है — मुख्य रूप से </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अमेरिकी संविधान</span><span style=\"font-family:'Nirmala UI'\"> से ली गई थी।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अमेरिकी ढांचे में:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विधायिका (कांग्रेस)</span><span style=\"font-family:'Nirmala UI'\"> कानून बनाती है।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कार्यपालिका (राष्ट्रपति)</span><span style=\"font-family:'Nirmala UI'\"> कानूनों को लागू करती है।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">न्यायपालिका (सुप्रीम कोर्ट)</span><span style=\"font-family:'Nirmala UI'\"> कानूनों की व्याख्या करती है।</span></li></ul></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह सिद्धांत मोंटेस्क्यू के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">'द स्पिरिट ऑफ लॉज' (1748)</span><span style=\"font-family:'Nirmala UI'\"> के सिद्धांत से प्रेरित था, जिसने अमेरिकी संविधान को बहुत प्रभावित किया।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संविधान ने इस विचार को अपनाया लेकिन एक संशोधित रूप में:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">भारत अमेरिका की तरह पूर्ण पृथक्करण का पालन नहीं करता है, बल्कि </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नियंत्रण और संतुलन (checks and balances)</span><span style=\"font-family:'Nirmala UI'\"> के साथ कार्यात्मक पृथक्करण का पालन करता है।</span></li><li style=\"margin-left:30.2pt;margin-bottom:8pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">उदाहरण: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कार्यपालिका</span><span style=\"font-family:'Nirmala UI'\"> (मंत्रिपरिषद) का चयन </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विधायिका</span><span style=\"font-family:'Nirmala UI'\"> (संसद) से ही किया जाता है।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से किस खेल में 'रेडर' शब्द का प्रयोग एक मूलभूत तकनीकी शब्द के रूप में किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">क्रिकेट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">खो-खो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कबड्डी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मुक्केबाज़ी</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: कबड्डी (Kabaddi)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कबड्डी में, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">\"रेडर\" (Raider)</span><span style=\"font-family:'Nirmala UI'\"> उस खिलाड़ी को कहा जाता है जो अंक हासिल करने के लिए विपक्षी पाले में प्रवेश करता है और रक्षकों (defenders) को छूकर सुरक्षित अपने पाले में वापस आने की कोशिश करता है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रेडर को रेड के दौरान लगातार </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">\"कबड्डी, कबड्डी\"</span><span style=\"font-family:'Nirmala UI'\"> का जाप करना पड़ता है, जो सांस पर नियंत्रण का प्रतीक है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसका उद्देश्य विरोधियों को छूकर अंक प्राप्त करना और पकड़े बिना वापस लौटना है।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रेडर खेल की रणनीति के केंद्र में होते हैं, जो हर चाल में जोखिम और इनाम के बीच संतुलन बनाते हैं।</span></li></ul>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">देवबंद आंदोलन की स्थापना मोहम्मद कासिम नानोतवी और किस अन्य व्यक्ति ने की थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सैयद अहमद खान</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रशीद अहमद गंगोही</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मिर्जा गुलाम अहमद</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">शाह वलीउल्लाह</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: रशीद अहमद गंगोही (Rashid Ahmed Gangohi)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">देवबंद आंदोलन</span><span style=\"font-family:'Nirmala UI'\"> की स्थापना 1866 में उत्तर प्रदेश के दारुल उलूम देवबंद में हुई थी।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· इसकी स्थापना </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मोहम्मद कासिम ननौनतवी</span><span style=\"font-family:'Nirmala UI'\"> और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रशीद अहमद गंगोही</span><span style=\"font-family:'Nirmala UI'\"> द्वारा की गई थी।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· उद्देश्य:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o इस्लामी शिक्षाओं को सुरक्षित रखना और ब्रिटिश औपनिवेशिक शासन के प्रभाव का विरोध करना।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o पारंपरिक इस्लामी मदरसों के माध्यम से धार्मिक शिक्षा को बढ़ावा देना।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o भारतीय मुसलमानों के बीच सामाजिक और धार्मिक सुधार को प्रोत्साहित करना।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· यह आंदोलन भारत में सबसे प्रभावशाली इस्लामी पुनरुत्थानवादी आंदोलनों में से एक बन गया, जिसने रूढ़िवादी सुन्नी इस्लाम पर जोर दिया और पश्चिमी सांस्कृतिक प्रभाव का विरोध किया।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का सारांश</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· सैयद अहमद खान </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अलीगढ़ आंदोलन</span><span style=\"font-family:'Nirmala UI'\"> के संस्थापक, देवबंद के नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· रशीद अहमद गंगोही </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; देवबंद आंदोलन के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सह-संस्थापक</span><span style=\"font-family:'Nirmala UI'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· मिर्जा गुलाम अहमद </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अहमदिया आंदोलन</span><span style=\"font-family:'Nirmala UI'\"> के संस्थापक।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· शाह वलीउल्लाह </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> 18वीं शताब्दी के सुधारक, पुनरुत्थानवादी विचार के अग्रदूत थे लेकिन देवबंद के संस्थापक नहीं।</span></p>", "question_heading": ""}, {"sr_no": 93, "question": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राज्य-प्रशासन, आर्थिक नीति और सैन्य रणनीति पर आधारित प्राचीन भारतीय ग्रंथ &#39;अर्थशास्त्र&#39; की रचना किसने की थी?</span></p>", "option1": "\r\n<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पाणिनी</span></p>", "option2": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चरक</span></p>", "option3": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कौटिल्य</span></p>", "option4": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विशाखदत्त</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: कौटिल्य (Kautilya)</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p>\r\n\r\n<ul style=\"margin:0pt;padding-left:0pt\" type=\"disc\">\r\n\t<li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अर्थशास्त्र</span><span style=\"font-family:'Nirmala UI'\"> शासनकला, आर्थिक नीति और सैन्य रणनीति पर एक प्राचीन भारतीय ग्रंथ है।</span></li>\r\n\t<li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसके लेखक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कौटिल्य</span><span style=\"font-family:'Nirmala UI'\"> थे, जिन्हें </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">चाणक्य</span><span style=\"font-family:'Nirmala UI'\"> या </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विष्णुगुप्त</span><span style=\"font-family:'Nirmala UI'\"> के नाम से भी जाना जाता है, जो चंद्रगुप्त मौर्य (मौर्य साम्राज्य के संस्थापक) के मुख्य सलाहकार थे।</span></li>\r\n\t<li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अर्थशास्त्र के मुख्य पहलू:</span>\r\n\t<ul style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\" type=\"circle\">\r\n\t\t<li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">शासन, प्रशासन, कराधान (taxation) और कूटनीति पर विस्तृत मार्गदर्शन।</span></li>\r\n\t\t<li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">यथार्थवाद (realpolitik)</span><span style=\"font-family:'Nirmala UI'\"> पर जोर &mdash; शासन करने के व्यावहारिक और रणनीतिक दृष्टिकोण।</span></li>\r\n\t\t<li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">सैन्य संगठन, जासूसी और विदेश नीति की रणनीतियाँ।</span></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह भारतीय इतिहास में राजनीति दर्शन और अर्थशास्त्र के सबसे प्रभावशाली कार्यों में से एक है।</span></li>\r\n</ul>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का सारांश</span></p>\r\n\r\n<ul style=\"margin:0pt;padding-left:0pt\" type=\"disc\">\r\n\t<li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पाणिनी </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">&rarr;</span><span style=\"font-family:'Nirmala UI'\"> प्रसिद्ध व्याकरणविद्, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अष्टाध्यायी</span><span style=\"font-family:'Nirmala UI'\"> के लेखक।</span></li>\r\n\t<li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चरक </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">&rarr;</span><span style=\"font-family:'Nirmala UI'\"> प्रसिद्ध चिकित्सक, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">चरक संहिता</span><span style=\"font-family:'Nirmala UI'\"> के लेखक।</span></li>\r\n\t<li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कौटिल्य </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">&rarr;</span><span style=\"font-family:'Nirmala UI'\"> सही; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अर्थशास्त्र</span><span style=\"font-family:'Nirmala UI'\"> के लेखक।</span></li>\r\n\t<li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विशाखदत्त </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">&rarr;</span><span style=\"font-family:'Nirmala UI'\"> नाटककार, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुद्राराक्षस</span><span style=\"font-family:'Nirmala UI'\"> के लेखक।</span></li>\r\n</ul>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1893 में स्थापित 'डूरंड रेखा' किन दो देशों के बीच अंतरराष्ट्रीय सीमा का काम करती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत और पाकिस्तान</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पाकिस्तान और अफगानिस्तान</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अफगानिस्तान और ईरान</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत और अफगानिस्तान</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: पाकिस्तान और अफगानिस्तान (Pakistan and Afghanistan)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">डूरंड रेखा</span><span style=\"font-family:'Nirmala UI'\"> की स्थापना 1893 में ब्रिटिश भारत और अफगानिस्तान के बीच सीमा के रूप में की गई थी, जिसका निर्धारण सर मोर्टिमर डूरंड (ब्रिटिश भारत के विदेश सचिव) और अफगानिस्तान के अमीर अब्दुर रहमान खान के बीच बातचीत के माध्यम से हुआ था।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1947 में भारत के विभाजन के बाद, यह सीमा </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पाकिस्तान और अफगानिस्तान</span><span style=\"font-family:'Nirmala UI'\"> के बीच अंतरराष्ट्रीय सीमा बन गई।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लंबाई: लगभग </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">2,640 किमी</span><span style=\"font-family:'Nirmala UI'\">, जो दुर्गम पहाड़ों और जनजातीय क्षेत्रों से होकर गुजरती है।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह एक विवादित सीमा बनी हुई है, क्योंकि अफगानिस्तान ने ऐतिहासिक रूप से इसे स्थायी सीमा के रूप में मान्यता देने से इनकार कर दिया है।</span></li></ul>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नाइट्रोजन चक्र के संदर्भ में, अमोनिया को नाइट्राइट में परिवर्तित करने के लिए कौन सा जीवाणु जिम्मेदार है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राइजोबियम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एज़ोटोबैक्टर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नाइट्रोसोमोनास</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्यूडोमोनास</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: नाइट्रोसोमोनास (Nitrosomonas)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नाइट्रोजन चक्र (Nitrogen Cycle)</span><span style=\"font-family:'Nirmala UI'\"> में, अमोनिया (NH</span><span style=\"font-family:'Cambria Math'\">₃</span><span style=\"font-family:'Nirmala UI'\">) का नाइट्राइट (NO</span><span style=\"font-family:'Cambria Math'\">₂⁻</span><span style=\"font-family:'Nirmala UI'\">) में परिवर्तन नाइट्रीकारी बैक्टीरिया (nitrifying bacteria) द्वारा किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· इस चरण के लिए जिम्मेदार प्रमुख बैक्टीरिया </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नाइट्रोसोमोनास (Nitrosomonas)</span><span style=\"font-family:'Nirmala UI'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· प्रक्रिया:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o अमोनिया </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नाइट्राइट</span><span style=\"font-family:'Nirmala UI'\"> (</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नाइट्रोसोमोनास</span><span style=\"font-family:'Nirmala UI'\"> द्वारा)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o नाइट्राइट </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नाइट्रेट</span><span style=\"font-family:'Nirmala UI'\"> (</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नाइट्रोबैक्टर</span><span style=\"font-family:'Nirmala UI'\"> द्वारा)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· यह दो-चरणीय नाइट्रीकरण प्रक्रिया मिट्टी की उर्वरता के लिए महत्वपूर्ण है, क्योंकि पौधे अमोनिया की तुलना में नाइट्रेट को अधिक कुशलता से अवशोषित कर सकते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· राइजोबियम (Rhizobium) </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> फलीदार पौधों की जड़ ग्रंथियों में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नाइट्रोजन स्थिरीकरण (nitrogen fixation)</span><span style=\"font-family:'Nirmala UI'\"> के लिए जिम्मेदार है, अमोनिया परिवर्तन के लिए नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· एज़ोटोबैक्टर (Azotobacter) </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> मुक्त-जीवित </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नाइट्रोजन-फिक्सिंग बैक्टीरिया</span><span style=\"font-family:'Nirmala UI'\"> है, नाइट्रीकरण में शामिल नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· नाइट्रोसोमोनास (Nitrosomonas) </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; अमोनिया को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नाइट्राइट</span><span style=\"font-family:'Nirmala UI'\"> में परिवर्तित करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· स्यूडोमोनास (Pseudomonas) </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विनाइट्रीकरण (denitrification)</span><span style=\"font-family:'Nirmala UI'\"> में शामिल है (नाइट्रेट को वापस नाइट्रोजन गैस में बदलना)।</span></p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यदि कोई व्यक्ति दूर की वस्तुओं को स्पष्ट रूप से नहीं देख पाता है, लेकिन पास की वस्तुओं को देख सकता है, तो इस समस्या को ठीक करने के लिए किस प्रकार के लेंस की आवश्यकता होती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बेलनाकार लेंस</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उत्तल लेंस</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">द्विफोकल लेंस</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अवतल लेंस</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: अवतल लेंस (Concave Lens)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· वह व्यक्ति जो दूर की वस्तुओं को स्पष्ट रूप से नहीं देख सकता लेकिन पास की वस्तुओं को देख सकता है, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">निकट-दृष्टि दोष (Myopia)</span><span style=\"font-family:'Nirmala UI'\"> से पीड़ित होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कारण:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o नेत्र लेंस छवियों को रेटिना पर सीधे केंद्रित करने के बजाय उसके </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सामने</span><span style=\"font-family:'Nirmala UI'\"> केंद्रित करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o ऐसा </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नेत्र गोलक के लंबा होने</span><span style=\"font-family:'Nirmala UI'\"> या लेंस की </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अत्यधिक वक्रता</span><span style=\"font-family:'Nirmala UI'\"> के कारण होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">निवारण:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अवतल लेंस (अपसारी लेंस)</span><span style=\"font-family:'Nirmala UI'\"> का उपयोग किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o यह आने वाली प्रकाश किरणों को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अपसारित (diverge)</span><span style=\"font-family:'Nirmala UI'\"> करता है ताकि प्रतिबिंब रेटिना पर बने, जिससे दूर की दृष्टि स्पष्ट हो जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का विवरण</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बेलनाकार लेंस</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अबिंदुकता (Astigmatism)</span><span style=\"font-family:'Nirmala UI'\"> को ठीक करने के लिए उपयोग किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर लेंस</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दूर-दृष्टि दोष (Hypermetropia)</span><span style=\"font-family:'Nirmala UI'\"> के लिए उपयोग किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">द्वि-फ़ोकसी लेंस</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जरा-दूरदृष्टिता (Presbyopia)</span><span style=\"font-family:'Nirmala UI'\"> के लिए उपयोग किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अवतल लेंस</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">निकट-दृष्टि दोष (Myopia)</span><span style=\"font-family:'Nirmala UI'\"> के लिए उपयोग किया जाता है।</span></p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत का सर्वोच्च युद्धकालीन वीरता पुरस्कार, 'परम वीर चक्र', सर्वप्रथम किस संघर्ष के संबंध में प्रदान किया गया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">द्वितीय विश्व युद्ध</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1947-48 का भारत-पाकिस्तान युद्ध</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1962 का चीन-भारत युद्ध</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1965 का भारत-पाकिस्तान युद्ध</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: भारत-पाकिस्तान युद्ध 1947–48</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">परमवीर चक्र (PVC)</span><span style=\"font-family:'Nirmala UI'\"> भारत का सर्वोच्च सैन्य वीरता पुरस्कार है, जिसे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">26 जनवरी 1950</span><span style=\"font-family:'Nirmala UI'\"> को स्थापित किया गया था।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह दुश्मन की उपस्थिति में सबसे विशिष्ट वीरता या आत्म-बलिदान के लिए दिया जाता है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रथम परमवीर चक्र </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मेजर सोमनाथ शर्मा</span><span style=\"font-family:'Nirmala UI'\"> (मरणोपरांत) को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारत-पाकिस्तान युद्ध 1947-48</span><span style=\"font-family:'Nirmala UI'\"> के दौरान </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बड़गाम की लड़ाई</span><span style=\"font-family:'Nirmala UI'\"> (कश्मीर) में उनके वीरतापूर्ण कार्य के लिए प्रदान किया गया था।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तब से, परमवीर चक्र बाद के युद्धों (</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1962, 1965, 1971 और कारगिल 1999</span><span style=\"font-family:'Nirmala UI'\">) में सैनिकों को प्रदान किया गया है।</span></li></ul>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कुषाण युग के प्रसिद्ध शासक कनिष्क के दरबारी चिकित्सक कौन थे?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सुश्रुत </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">धन्वंतरि</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चरक </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नागार्जुन</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: चरक (Charaka)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· प्राचीन भारतीय चिकित्सक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">चरक</span><span style=\"font-family:'Nirmala UI'\">, प्रसिद्ध कुषाण शासक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कनिष्क</span><span style=\"font-family:'Nirmala UI'\"> के राजवैद्य थे।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· उन्हें </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">चरक संहिता</span><span style=\"font-family:'Nirmala UI'\"> के लेखक के रूप में जाना जाता है, जो </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आयुर्वेद</span><span style=\"font-family:'Nirmala UI'\"> के मूलभूत ग्रंथों में से एक है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">योगदान:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o रोगों, निदान और उपचार का व्यवस्थित अध्ययन।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o औषधीय पौधों और उनके योगों का विस्तृत विवरण।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o निवारक स्वास्थ्य देखभाल और चिकित्सा नैतिकता पर जोर।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· कनिष्क के संरक्षण में चरक का कार्य फला-फूला, जिससे वे प्राचीन भारतीय चिकित्सा विज्ञान के सबसे प्रभावशाली व्यक्तियों में से एक बन गए।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सुश्रुत</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> प्रसिद्ध सर्जन, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सुश्रुत संहिता</span><span style=\"font-family:'Nirmala UI'\"> के लेखक।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">धन्वंतरि</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> पौराणिक चिकित्सक, जिन्हें आयुर्वेद का देवता माना जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span styl :bold;font-family:'Nirmala UI'\">सही उत्तर: कांसा (Bronze)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सिंधु घाटी सभ्यता (</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मोहनजोदड़ो</span><span style=\"font-family:'Nirmala UI'\">) से प्राप्त प्रसिद्ध </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">\"नर्तकी\" (Dancing Girl)</span><span style=\"font-family:'Nirmala UI'\"> की मूर्ति </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कांस्य</span><span style=\"font-family:'Nirmala UI'\"> से बनी है, जिसे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लुप्त-मोम तकनीक (lost-wax casting)</span><span style=\"font-family:'Nirmala UI'\"> का उपयोग करके बनाया गया था।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह लगभग 10.5 सेमी ऊंची है, जिसमें एक युवा लड़की को दर्शाया गया है जिसका एक हाथ उसकी कमर पर है, दूसरा स्वतंत्र रूप से लटका हुआ है और वह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">चूड़ियों</span><span style=\"font-family:'Nirmala UI'\"> से सुसज्जित है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह कलाकृति हड़प्पावासियों के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उन्नत धातुकर्म कौशल</span><span style=\"font-family:'Nirmala UI'\"> और उनकी कलात्मक उत्कृष्टता को प्रदर्शित करती है।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· यह सिंधु घाटी की कला और संस्कृति के सबसे प्रतिष्ठित प्रतीकों में से एक है।</span></li></ul>", "question_heading": ""}, {"sr_no": 102, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लोकसभा की पहली महिला अध्यक्ष कौन थीं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सुमित्रा महाजन </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मीरा कुमार </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रतिभा पाटिल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सरोजिनी नायडू</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: मीरा कुमार (Meira Kumar)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मीरा कुमार</span><span style=\"font-family:'Nirmala UI'\"> 2009 में लोकसभा की </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पहली महिला अध्यक्ष (स्पीकर)</span><span style=\"font-family:'Nirmala UI'\"> बनीं।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उन्होंने 2009 से 2014 तक लोकसभा की </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">15वीं अध्यक्ष</span><span style=\"font-family:'Nirmala UI'\"> के रूप में कार्य किया।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पृष्ठभूमि:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">एक वरिष्ठ कांग्रेस नेता और पांच बार की संसद सदस्य।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बाबू जगजीवन राम</span><span style=\"font-family:'Nirmala UI'\"> की सुपुत्री, जो एक प्रमुख स्वतंत्रता सेनानी और भारत के पूर्व उपप्रधानमंत्री थे।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">अध्यक्ष बनने से पहले, उन्होंने मंत्री पदों पर कार्य किया और वे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सामाजिक न्याय और अधिकारिता</span><span style=\"font-family:'Nirmala UI'\"> में अपने काम के लिए जानी जाती थीं।</span></li><li style=\"margin-left:30.2pt;margin-bottom:8pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">अध्यक्ष के रूप में उनका निर्वाचन ऐतिहासिक था, जो भारतीय राजनीति में महिलाओं के प्रतिनिधित्व में एक महत्वपूर्ण कदम था।</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सुमित्रा महाजन</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> बाद में अध्यक्ष बनीं (2014-2019), लेकिन पहली नहीं।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मीरा कुमार</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; लोकसभा की पहली महिला अध्यक्ष (2009)।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रतिभा पाटिल</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> भारत की </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पहली महिला राष्ट्रपति</span><span style=\"font-family:'Nirmala UI'\">, अध्यक्ष नहीं।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सरोजिनी नायडू</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> किसी भारतीय राज्य की </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पहली महिला राज्यपाल</span><span style=\"font-family:'Nirmala UI'\">, अध्यक्ष नहीं।</span></li></ul>", "question_heading": ""}, {"sr_no": 103, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय रिज़र्व बैंक (RBI) का राष्ट्रीयकरण किस वर्ष हुआ था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1947</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1948</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1949</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1950</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: 1949</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारतीय रिजर्व बैंक (RBI)</span><span style=\"font-family:'Nirmala UI'\"> की स्थापना </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1935</span><span style=\"font-family:'Nirmala UI'\"> में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">RBI अधिनियम, 1934</span><span style=\"font-family:'Nirmala UI'\"> के तहत एक निजी शेयरधारक बैंक के रूप में की गई थी।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्वतंत्रता के बाद, भारत सरकार ने केंद्रीय बैंक पर पूर्ण नियंत्रण लेने का निर्णय लिया।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इस प्रकार, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1 जनवरी 1949</span><span style=\"font-family:'Nirmala UI'\"> को RBI का </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राष्ट्रीयकरण</span><span style=\"font-family:'Nirmala UI'\"> किया गया, जिससे यह पूरी तरह से भारत सरकार के स्वामित्व में आ गया।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तब से, यह भारत के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">केंद्रीय बैंक</span><span style=\"font-family:'Nirmala UI'\"> के रूप में कार्य कर रहा है, जो मुद्रा, ऋण और मौद्रिक नीति को नियंत्रित करता है।</span></li></ul>", "question_heading": ""}, {"sr_no": 104, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रोसेसर की गति को निम्न तरीकों से मापा जा सकता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मेगाबाइट्स</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गीगाहर्ट्ज़</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डॉट्स प्रति इंच</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किलोवाट</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: गीगाहर्ट्ज़ (Gigahertz)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रोसेसर (CPU)</span><span style=\"font-family:'Nirmala UI'\"> की गति </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हर्ट्ज़ (Hz)</span><span style=\"font-family:'Nirmala UI'\"> में मापी जाती है, जो प्रति सेकंड चक्रों (cycles) की संख्या को दर्शाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· आधुनिक प्रोसेसर अत्यधिक उच्च गति पर काम करते हैं, इसलिए उपयोग की जाने वाली इकाई </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गीगाहर्ट्ज़ (GHz)</span><span style=\"font-family:'Nirmala UI'\"> है:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1 GHz = 1 बिलियन चक्र प्रति सेकंड।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· उच्च क्लॉक स्पीड का सामान्य अर्थ है कि प्रोसेसर प्रति सेकंड अधिक निर्देश निष्पादित कर सकता है, हालांकि प्रदर्शन आर्किटेक्चर, कोर की संख्या और कैश मेमोरी पर भी निर्भर करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का विवरण</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मेगाबाइट (Megabytes)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> डेटा स्टोरेज की इकाई है, गति की नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गीगाहर्ट्ज़ (Gigahertz)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; प्रोसेसर की गति को मापता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">डॉट्स प्रति इंच (DPI)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> प्रिंटर/स्कैनर के लिए रिज़ॉल्यूशन माप।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">किलोवाट (Kilowatts)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> शक्ति (power) की इकाई है, प्रोसेसर की गति की नहीं।</span></p>", "question_heading": ""}, {"sr_no": 105, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किस भारतीय राज्य ने सतत मत्स्य पालन को बढ़ावा देने के लिए 'जैविक मत्स्य पालन क्लस्टर' की शुरुआत की?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सिक्किम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मणिपुर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">असम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मेघालय</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सिक्किम</span><span style=\"font-family:'Nirmala UI'\"> के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सोरेंग जिले</span><span style=\"font-family:'Nirmala UI'\"> में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">'ऑर्गेनिक फिशरीज क्लस्टर'</span><span style=\"font-family:'Nirmala UI'\"> शुरू किया गया है, जो टिकाऊ जलीय कृषि (aquaculture) को बढ़ावा देने वाली भारत की पहली ऐसी पहल है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुख्य विवरण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राज्य/केंद्र शासित प्रदेश:</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सिक्किम</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्थान:</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सोरेंग जिला, सिक्किम</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लॉन्च तिथि:</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जनवरी 2025</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पहल:</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रधानमंत्री मत्स्य संपदा योजना (PMMSY)</span><span style=\"font-family:'Nirmala UI'\"> के तहत</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उद्देश्य:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जैविक (organic), रसायन मुक्त और एंटीबायोटिक मुक्त</span><span style=\"font-family:'Nirmala UI'\"> जलीय कृषि को बढ़ावा देना।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">पर्यावरण के अनुकूल मछली पालन सुनिश्चित करना जो प्रदूषण को रोकता है और जलीय पारिस्थितिकी तंत्र की रक्षा करता है।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">पर्यावरण के प्रति जागरूक घरेलू और वैश्विक बाजारों की जरूरतों को पूरा करना।</span></li></ul></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सहायता:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राष्ट्रीय कृषि और ग्रामीण विकास बैंक (NABARD)</span><span style=\"font-family:'Nirmala UI'\"> द्वारा वित्तपोषित।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">मत्स्य पालन-आधारित </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">किसान उत्पादक संगठनों (FFPOs)</span><span style=\"font-family:'Nirmala UI'\"> का गठन।</span></li><li style=\"margin-left:30.2pt;margin-bottom:8pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">स्थानीय मछली किसानों के लिए बुनियादी ढांचे का विकास और क्षमता निर्माण।</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सिक्किम ही क्यों?</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सिक्किम को पहले से ही भारत के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पहले पूर्ण जैविक राज्य (2016)</span><span style=\"font-family:'Nirmala UI'\"> के रूप में मान्यता प्राप्त है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इस प्रतिष्ठा को मत्स्य पालन तक बढ़ाना टिकाऊ कृषि और जलीय कृषि में एक अग्रणी के रूप में इसकी भूमिका को मजबूत करता है।</span></li><li style=\"margin-left:10.52pt;m \"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">HTML</span><span style=\"font-family:'Nirmala UI'\"> का पूर्ण रूप </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Hyper Text Markup Language</span><span style=\"font-family:'Nirmala UI'\"> है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह वेब पेज बनाने और उन्हें व्यवस्थित करने के लिए उपयोग की जाने वाली </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मानक भाषा</span><span style=\"font-family:'Nirmala UI'\"> है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुख्य बिंदु:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Hyper Text</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> उस टेक्स्ट को संदर्भित करता है जिसमें अन्य दस्तावेजों के लिंक (</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हाइपरलिंक</span><span style=\"font-family:'Nirmala UI'\">) होते हैं।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Markup Language</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> यह हेडिंग, पैराग्राफ, इमेज और लिंक जैसे तत्वों को परिभाषित करने के लिए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">टैग (&lt;tag&gt;)</span><span style=\"font-family:'Nirmala UI'\"> का उपयोग करती है।</span></li><li style=\"margin-left:30.2pt;margin-  UI'\">अनुच्छेद 124</span><span style=\"font-family:'Nirmala UI'\"> के तहत की गई है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हालांकि, वह अनुच्छेद जो इसके </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मूल क्षेत्राधिकार (Original Jurisdiction)</span><span style=\"font-family:'Nirmala UI'\"> — यानी कुछ विवादों को सीधे सुनने का अधिकार — को परिभाषित करता है, वह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 131</span><span style=\"font-family:'Nirmala UI'\"> है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 131</span><span style=\"font-family:'Nirmala UI'\"> प्रावधान करता है कि सर्वोच्च न्यायालय के पास निम्नलिखित विवादों में अनन्य मूल क्षेत्राधिकार है:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">भारत सरकार और एक या अधिक राज्यों के बीच।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">दो या दो से अधिक राज्यों के बीच।</span></li><li style=\"margin-left:30.2pt;margin-bottom:8pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">यह सुनिश्चित करता है कि </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">संघीय विवादों (Federal Disputes)</span><span style=\"font-family:'Nirmala UI'\"> का निपटारा उच्चतम न्यायिक स्तर पर किया जाए।</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का विवरण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><sp
