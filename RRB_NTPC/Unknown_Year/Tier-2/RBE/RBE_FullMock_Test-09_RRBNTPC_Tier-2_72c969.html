<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>18.) Maths Sectional Mock Test-9 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">W + C - 10 = 40</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">W + C = 50 ...(2)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">From (1) and (2):</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">H + 50 = 90</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">H = 40</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Final Answer: 40 years</span></p>", "question_heading": ""}, {"sr_no": 70, "question": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्मिता पीहू से तेज़ चलती है। स्मिता और पीहू दोनों 64 किमी चलती हैं। उनकी गति का योग 12 किमी/घंटा है और उनके द्वारा तय की गई दूरी का योग 24 घंटे है। स्मिता की गति क्या है?</span></p>", "option1": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">4.5 km/hr</span></p>", "option2": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">6 km/hr</span></p>", "option3": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">9 km/hr</span></p>", "option4": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">8 km/hr</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n\r\n\r\n<p><span style=\"font-size:14px;\"><span style=\"font-family:&quot;Cambria Math&quot;;\">Let Smita&rsquo;s speed = x km/hr<br />\r\nThen Pihu&rsquo;s speed = (12 &minus; x) km/hr</span></span></p>\r\n\r\n<p><span style=\"font-size:14px;\"><span style=\"font-family:&quot;Cambria Math&quot;;\">Smita&rsquo;s time = 64/x<br />\r\nPihu&rsquo;s time = 64/(12 &minus; x)</span></span></p>\r\n\r\n<p><span style=\"font-size:14px;\"><span style=\"font-family:&quot;Cambria Math&quot;;\">According to question:<br />\r\n64/x + 64/(12 &minus; x) = 24</span></span></p>\r\n\r\n<p><span style=\"font-size:14px;\"><span style=\"font-family:&quot;Cambria Math&quot;;\">Taking LCM:<br />\r\n64(12 &minus; x) + 64x / x(12 &minus; x) = 24</span></span></p>\r\n\r\n<p><span style=\"font-size:14px;\"><span style=\"font-family:&quot;Cambria Math&quot;;\">64 &times; 12 = 24x(12 &minus; x)</span></span></p>\r\n\r\n<p><span style=\"font-size:14px;\"><span style=\"font-family:&quot;Cambria Math&quot;;\">768 = 24(12x &minus; x&sup2;)</span></span></p>\r\n\r\n<p><span style=\"font-size:14px;\"><span style=\"font-family:&quot;Cambria Math&quot;;\">768 = 288x &minus; 24x&sup2;</span></span></p>\r\n\r\n<p><span style=\"font-size:14px;\"><span style=\"font-family:&quot;Cambria Math&quot;;\">Divide by 24:<br />\r\n32 = 12x &minus; x&sup2;</span></span></p>\r\n\r\n<p><span style=\"font-size:14px;\"><span style=\"font-family:&quot;Cambria Math&quot;;\">x&sup2; &minus; 12x + 32 = 0</span></span></p>\r\n\r\n<p><span style=\"font-size:14px;\"><span style=\"font-family:&quot;Cambria Math&quot;;\">(x &minus; 8)(x &minus; 4) = 0</span></span></p>\r\n\r\n<p><span style=\"font-size:14px;\"><span style=\"font-family:&quot;Cambria Math&quot;;\">x = 8 or 4</span></span></p>\r\n\r\n<p><span style=\"font-size:14px;\"><span style=\"font-family:&quot;Cambria Math&quot;;\">Smita is faster &rArr; <strong>Smita&rsquo;s speed = 8 km/hr</strong></span></span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:1 ttom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">फेल्डमैन-महालनोविस मॉडल</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> बाद में औद्योगीकरण की रणनीति के लिए अपनाया गया।</span></li></ul>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किस प्रकार की श्वेत रक्त कोशिकाएं रोगजनकों से लड़ने के लिए एंटीबॉडी बनाने के लिए जिम्मेदार होती हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मोनोसाइट्स</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बेसोफिल्स</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न्यूट्रोफिल्स</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लिम्फोसाइट्स</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: लिम्फोसाइट्स</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-siz ></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का विवरण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मोनोसाइट्स</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">फेगोसाइटोसिस</span><span style=\"font-family:'Nirmala UI'\"> के माध्यम से रोगजनकों को निगल जाते हैं, लेकिन एंटीबॉडी का उत्पादन नहीं करते हैं।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बेसोफिल्स</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एलर्जी प्रतिक्रियाओं</span><span style=\"font-family:'Nirmala UI'\"> में शामिल होते हैं और हिस्टामिने छोड़ते हैं।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">न्यूट्रोफिल्स</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रथम प्रतिक्रियाकर्ता</span><span style=\"font-family:'N span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Gmail में, अटैचमेंट के लिए अधिकतम फ़ाइल आकार </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">25 MB</span><span style=\"font-family:'Nirmala UI'\"> है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यदि कोई उपयोगकर्ता इस सीमा से बड़ी फ़ाइलें भेजने का प्रयास करता है, तो Gmail स्वचालित रूप से उन्हें </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Google Drive</span><span style=\"font-family:'Nirmala UI'\"> पर अपलोड कर देता है और इसके बजाय एक लिंक साझा करता है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आने वाले ईमेल के लिए, 25 MB से बड़े अटैचमेंट भी </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Google Drive लिंक</span><span style=\"font-family:'Nirmala UI'\"> के माध्यम से वितरित किए जाते हैं।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह सीमा एक ही ईमेल में सभी अटैचमेंट के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">संयुक्त आकार</span><span style=\"font-family:'Nirmala UI'\"> पर लागू होती है।</span></li></ul>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के किस राज्य/केंद्र शासित प्रदेश में 'त्सरप चू संरक्षण अभ्यारण्य' स्थित है, जिसे हाल के वर्षों में सबसे बड़े अभ्यारण्यों में से एक माना जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हिमाचल प्रदेश</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सिक्किम</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अरुणाचल प्रदेश</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लद्दाख</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">तसरप चू संरक्षण रिजर्व (Tsarap Chu Conservation Reserve)</span><span style=\"font-family:'Nirmala UI'\"> हिमाचल प्रदेश में स्थित है, विशेष रूप से </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पीति घाटी</span><span style=\"font-family:'Nirmala UI'\"> में, और इसे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">2025</span><span style=\"font-family:'Nirmala UI'\"> में भारत के सबसे बड़े संरक्षण रिजर्व के रूप में अधिसूचित किया गया था। यह उच्च ऊंचाई वाली जैव विविधता, विशेष रूप से </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हिम तेंदुओं (snow leopards)</span><span style=\"font-family:'Nirmala UI'\"> की रक्षा के लिए एक संयुक्त प्रयास है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">तसरप चू संरक्षण रिजर्व के बारे में मुख्य तथ्य</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राज्य/केंद्र शासित प्रदेश: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हिमाचल प्रदेश</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्थान: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पीति घाटी</span><span style=\"font-family:'Nirmala UI'\">, हिमाचल प्रदेश</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">क्षेत्रफल: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1,585 वर्ग किमी</span><span style=\"font-family:'Nirmala UI'\"> (भारत का सबसे बड़ा संरक्षण रिजर्व)</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्थापना: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">वन्यजीव (संरक्षण) अधिनियम, 1972</span><span style=\"font-family:'Nirmala UI'\"> की धारा 36A(1) के तहत </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मई 2025</span><span style=\"font-family:'Nirmala UI'\"> में अधिसूचित।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उद्देश्य:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हिम तेंदुओं</span><span style=\"font-family:'Nirmala UI'\"> और अन्य दुर्लभ हिमालयी जीवों का संरक्षण।</span></li><li style=\"margin-left:30.2pt;margin-bottom:8pt;padding-left:5.8pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">किब्बर वन्यजीव अभयारण्य</span><span style=\"font-family:'Nirmala UI'\"> और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">चंद्रताल वन्यजीव अभयारण्य</span><span style=\"font-family:'Nirmala UI'\"> को जोड़ने वाले वन्यजीव गलियारों को मजबूत करना।</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सीमाएँ:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उत्तर: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लद्दाख</span><span style=\"font-family:'Nirmala UI'\"> केंद्र शासित प्रदेश</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पूर्व: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">किब्बर वन्यजीव अभयारण्य</span><span style=\"font-family:'Nirmala UI'\">, मलंग नाला</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दक्षिण: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कब्जिमा नाला</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पश्चिम: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">चंद्रताल वन्यजीव अभयारण्य</span><span style=\"font-family:'Nirmala UI'\"> और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बारालाचा दर्रा</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">यह क्यों महत्वपूर्ण है</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जैव विविधता हॉटस्पॉट: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हिम तेंदुए, आइबेक्स</span><span style=\"font-family:'Nirmala UI'\"> और हिमालयी पक्षियों जैसी प्रजातियों की रक्षा करता है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">समुदाय-आधारित संरक्षण: स्थायी सुरक्षा के लिए स्पीति घाटी के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्थानीय समुदायों</span><span style=\"font-family:'Nirmala UI'\"> को शामिल करता है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रणनीतिक स्थान: लद्दाख और हिमाचल के रिजर्व के बीच एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गलियारे (corridor)</span><span style=\"font-family:'Nirmala UI'\"> के रूप में कार्य करता है, जो आनुवंशिक विविधता और प्रजातियों की आवाजाही सुनिश्चित करता है।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राष्ट्रीय महत्व: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारत का सबसे बड़ा संरक्षण रिजर्व</span><span style=\"font-family:'Nirmala UI'\">, जो उच्च ऊंचाई वाले पारिस्थितिकी तंत्र की सुरक्षा पर बढ़ते ध्यान को उजागर करता है।</span></li></ul>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">'मानव विकास सूचकांक' (एचडीआई) जीवन प्रत्याशा, शिक्षा और निम्नलिखित का एक समग्र सूचकांक है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">औद्योगिक विकास</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निर्यात क्षमता</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रति व्यक्ति आय</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">खुशहाली सूचकांक</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: प्रति व्यक्ति आय (Per Capita Income)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मानव विकास सूचकांक (HDI) एक संयुक्त सूचकांक है जिसे 1990 में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">संयुक्त राष्ट्र विकास कार्यक्रम (UNDP)</span><span style=\"font-family:'Nirmala UI'\"> द्वारा विकसित किया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह मानव विकास के तीन प्रमुख आयामों को मापता है:</span></p><ol type=\"1\"><li style=\"margin-left:32.07pt;margin-bottom:8pt;line-height:108%;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span style=\"font-weight:bold\">जीवन प्रत्याशा (Life Expectancy)</span><span> </span><span style=\"font-family:Arial\">→</span><span> स्वास्थ्य और दीर्घायु का संकेतक।</span></li><li style=\"margin-left:32.07pt;margin-bottom:8pt;line-height:108%;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span style=\"font-weight:bold\">शिक्षा (Education)</span><span> </span><span style=\"font-family:Arial\">→</span><span> स्कूली शिक्षा के औसत वर्ष और स्कूली शिक्षा के अपेक्षित वर्षों द्वारा मापा जाता है।</span></li><li style=\"margin-left:32.07pt;margin-bottom:8pt;line-height:108%;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span style=\"font-weight:bold\">प्रति व्यक्ति आय (GNI per capita, PPP)</span><span> </span><span style=\"font-family:Arial\">→</span><span> जीवन स्तर का संकेतक।</span></li></ol><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">HDI केवल आर्थिक विकास से परे विकास का एक व्यापक माप प्रदान करता है, जो </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जीवन की गुणवत्ता</span><span style=\"font-family:'Nirmala UI'\"> और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अवसरों</span><span style=\"font-family:'Nirmala UI'\"> पर ध्यान केंद्रित करता है।</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">'लोक अदालत' प्रणाली किस गांधीवादी सिद्धांत पर आधारित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विकेन्द्रीकरण</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ग्राम स्वराज</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सत्याग्रह</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सर्वोदय</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लोक अदालत प्रणाली गांधीवादी सिद्धांत </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ग्राम स्वराज</span><span style=\"font-family:'Nirmala UI'\"> (ग्राम स्वशासन) पर आधारित है, जो सुलह और समझौते के माध्यम से विकेंद्रीकृत, समुदाय-संचालित न्याय के गांधीजी के दृष्टिकोण को दर्शाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लोक अदालत (जनता का न्यायालय) को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कानूनी सेवा प्राधिकरण अधिनियम, 1987</span><span style=\"font-family:'Nirmala UI'\"> के तहत एक वैकल्पिक विवाद समाधान (ADR) तंत्र के रूप में पेश किया गया था।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसे औपचारिक अदालत प्रणाली के बाहर विवादों के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">त्वरित, सस्ता और सौहार्दपूर्ण</span><span style=\"font-family:'Nirmala UI'\"> समाधान प्रदान करने के लिए डिज़ाइन किया गया है।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह प्रणाली न्याय के गांधीवादी सिद्धांतों से प्रेरणा लेती है, विशेष रूप से:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ग्राम स्वराज</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> गांधीजी का ग्राम-स्तरीय स्वशासन का विचार, जहाँ समुदाय केंद्रीय अदालतों पर निर्भर हुए बिना स्थानीय स्तर पर विवादों का समाधान करते हैं।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह पारंपरिक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पंचायत प्रणाली</span><span style=\"font-family:'Nirmala UI'\"> को दर्शाता है, जहाँ विवादों का निपटारा आम सहमति और समझौते के माध्यम से किया जाता था।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जबकि लोक अदालत सुलह, समझौते और सभी के लिए न्याय के गांधीवादी आदर्शों को साकार करती है, इसका निकटतम संवैधानिक और दार्शनिक संरेखण </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ग्राम स्वराज</span><span style=\"font-family:'Nirmala UI'\"> के साथ है, जो स्थानीय सशक्तिकरण और सहभागी न्याय पर जोर देता है।</span></li></ul>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कबड्डी के खेल में, 'सुपर टैकल' तब माना जाता है जब रेडर को कितने डिफेंडरों द्वारा टैकल किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">3 या उससे कम डिफेंडर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">4 या उससे कम डिफेंडर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">5 या उससे कम डिफेंडर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किसी भी संख्या में डिफेंडर</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: 3 या उससे कम रक्षक (defenders)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कबड्डी में, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सुपर टैकल (Super Tackle)</span><span style=\"font-family:'Nirmala UI'\"> तब दिया जाता है जब बचाव करने वाली टीम मैट पर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">3 या उससे कम रक्षकों</span><span style=\"font-family:'Nirmala UI'\"> के साथ रेडर को सफलतापूर्वक पकड़ लेती है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आम तौर पर, जब कम रक्षक बचे होते हैं, तो रेडर को फायदा होता है। लेकिन अगर वे रक्षक रेडर को रोकने में कामयाब हो जाते हैं, तो इसे सुपर टैकल माना जाता है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अंक:</span><span style=\"font-family:'Nirmala UI'\"> बचाव करने वाली टीम को सुपर टैकल के लिए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">2 अंक</span><span style=\"font-family:'Nirmala UI'\"> मिलते हैं (सामान्य टैकल के लिए मिलने वाले सामान्य 1 अंक के बजाय)।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह नियम खेल में उत्साह और रणनीति जोड़ता है, क्योंकि टीमें संख्यात्मक रूप से कम होने पर भी खेल का रुख बदल सकती हैं।</span></li></ul>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भोजन की मात्रा बढ़ाने के लिए उसमें घटिया या हानिकारक पदार्थ मिलाने की प्रक्रिया को क्या कहा जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सुदृढ़ीकरण</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">परिरक्षण</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अपमिश्रण</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पाश्चुरीकरण</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: अपमिश्रण (Adulteration)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भोजन की मात्रा, वजन या लाभ मार्जिन बढ़ाने के लिए उसमें घटिया, हानिकारक या अखाद्य पदार्थ मिलाने की प्रक्रिया को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अपमिश्रण (Adulteration)</span><span style=\"font-family:'Nirmala UI'\"> कहा जाता है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह भोजन की गुणवत्ता और शुद्धता को कम करता है, और अक्सर गंभीर स्वास्थ्य जोखिम पैदा करता है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सामान्य उदाहरण:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">दूध में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पानी</span><span style=\"font-family:'Nirmala UI'\"> मिलाना।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">मसालों में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ईंट का पाउडर</span><span style=\"font-family:'Nirmala UI'\"> या कृत्रिम रंग मिलाना।</span></li><li style=\"margin-left:30.2pt;margin-bottom:8pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">फलों या सब्जियों को सुरक्षित रखने के लिए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हानिकारक रसायनों</span><span style=\"font-family:'Nirmala UI'\"> का उपयोग करना।</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का विवरण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">फोर्टिफिकेशन (Fortification)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> गुणवत्ता सुधारने के लिए भोजन में पोषक तत्व मिलाना (जैसे, आयोडीन युक्त नमक)।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">परिरक्षण (Preservation)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> खराब होने से बचाने के तरीके (जैसे, प्रशीतन, कैनिंग)।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अपमिश्रण (Adulteration)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; घटिया/हानिकारक पदार्थ मिलाना।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पाश्चुरीकरण (Pasteurization)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> रोगजनकों को मारने के लिए भोजन (जैसे दूध) को गर्म करना।</span></li></ul>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">साधारण पृष्ठभूमि से सर्वोच्च वैज्ञानिक और संवैधानिक पद तक की यात्रा का वर्णन करने वाली आत्मकथा 'विंग्स ऑफ फायर' किसके द्वारा लिखी गई थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रणब मुखर्जी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">शंकर दयाल शर्मा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">के.आर. नारायणन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एपीजे अब्दुल कलाम</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: एपीजे अब्दुल कलाम</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आत्मकथा </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">\"विंग्स ऑफ फायर\" (Wings of Fire)</span><span style=\"font-family:'Nirmala UI'\"> डॉ. एपीजे अब्दुल कलाम द्वारा </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अरुण तिवारी</span><span style=\"font-family:'Nirmala UI'\"> के साथ मिलकर लिखी गई थी।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह कलाम के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रामेश्वरम, तमिलनाडु</span><span style=\"font-family:'Nirmala UI'\"> की एक साधारण पृष्ठभूमि से भारत के सबसे प्रतिष्ठित वैज्ञानिकों में से एक और अंततः भारत के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">11वें राष्ट्रपति</span><span style=\"font-family:'Nirmala UI'\"> बनने तक की यात्रा का वर्णन करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पुस्तक इन बातों पर प्रकाश डालती है:</span></p><p style=\"margin-top:0pt;margin-left:18pt;margin-bottom:0pt;text-indent:-18pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Symbol'\"></span><span style=\"width:12.48pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">         </span><span style=\"font-family:'Nirmala UI'\">उनके बचपन के संघर्ष और प्रेरणाएँ।</span></p><p style=\"margin-top:0pt;margin-left:18pt;margin-bottom:0pt;text-indent:-18pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Symbol'\"></span><span style=\"width:12.48pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">         </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ISRO</span><span style=\"font-family:'Nirmala UI'\"> और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">DRDO</span><span style=\"font-family:'Nirmala UI'\"> में उनका कार्य, जिसमें </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">SLV परियोजना</span><span style=\"font-family:'Nirmala UI'\"> और मिसाइल विकास शामिल है।</span></p><p style=\"margin-top:0pt;margin-left:18pt;margin-bottom:0pt;text-indent:-18pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Symbol'\"></span><span style=\"width:12.48pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">         </span><span style=\"font-family:'Nirmala UI'\">कड़ी मेहनत, दूरदृष्टि और समर्पण का उनका दर्शन।</span></p><p style=\"margin-top:0pt;margin-left:18pt;margin-bottom:8pt;text-indent:-18pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Symbol'\"></span><span style=\"width:12.48pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">         </span><span style=\"font-family:'Nirmala UI'\">यह भारतीय साहित्य की सबसे प्रेरक आत्मकथाओं में से एक है, जो पीढ़ियों से छात्रों और अभ्यर्थियों को प्रेरित कर रही है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का विवरण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रणब मुखर्जी</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> उन्होंने </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">The Presidential Years</span><span style=\"font-family:'Nirmala UI'\"> लिखी, विंग्स ऑफ फायर नहीं।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">शंकर दयाल शर्मा</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> विंग्स ऑफ फायर नाम की कोई आत्मकथा नहीं।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">के.आर. नारायणन</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> पूर्व राष्ट्रपति, लेकिन विंग्स ऑफ फायर के लेखक नहीं।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एपीजे अब्दुल कलाम</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विंग्स ऑफ फायर</span><span style=\"font-family:'Nirmala UI'\"> के लेखक।</span></li></ul>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आनुवंशिकी में, गुणसूत्र पर जीन की विशिष्ट भौतिक स्थिति को क्या कहा जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एलील</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जीनोटाइप</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लोकस</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">फेनोटाइप</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: लोकोस (Locus)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आनुवंशिकी (genetics) में, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लोकोस</span><span style=\"font-family:'Nirmala UI'\"> एक गुणसूत्र (chromosome) पर जीन का </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विशिष्ट भौतिक स्थान</span><span style=\"font-family:'Nirmala UI'\"> होता है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रत्येक जीन एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">निश्चित स्थिति (लोकोस)</span><span style=\"font-family:'Nirmala UI'\"> पर स्थित होता है, जिसे साइटोजेनेटिक मैपिंग या आणविक तकनीकों द्वारा पहचाना जा सकता है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उदाहरण: </span><span style=\"font-family:Calibri\">β</span><span style=\"font-family:'Nirmala UI'\">-ग्लोबिन के लिए जीन गुणसूत्र 11, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लोकोस p15.5</span><span style=\"font-family:'Nirmala UI'\"> पर स्थित होता है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संबंधित शब्द:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एलील (Allele)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> एक ही लोकोस पर जीन के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विभिन्न रूप</span><span style=\"font-family:'Nirmala UI'\">।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जीनोटाइप (Genotype)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> किसी जीव की </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आनुवंशिक संरचना</span><span style=\"font-family:'Nirmala UI'\">।</span></li><li style=\"margin-left:30.2pt;margin-bottom:8pt;padding-left:5.8pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">फेनोटाइप (Phenotype)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> जीनोटाइप + पर्यावरण के परिणामस्वरूप </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अवलोकनीय लक्षण</span><span style=\"font-family:'Nirmala UI'\">।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जनगणना की परिभाषाओं के अनुसार, जो व्यक्ति एक वर्ष में 183 दिनों (6 महीने) से कम काम करता है, उसे निम्न श्रेणी में रखा जाता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मुख्य श्रमिक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मौसमी श्रमिक</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गैर-श्रमिक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सीमांत श्रमिक</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: सीमांत श्रमिक (Marginal Worker)</sp rmala UI'\">·</span><span style=\"width:15.4pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">           </span><span style=\"font-family:'Nirmala UI'\">एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गैर-श्रमिक (Non-Worker)</span><span style=\"font-family:'Nirmala UI'\"> वह है जो किसी भी आर्थिक रूप से उत्पादक गतिविधि में शामिल नहीं होता है।</span></p><p style=\"margin-top:0pt;margin-left:18pt;margin-bottom:8pt;text-indent:-18pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Symbol'\"></span><span style=\"width:12.48pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">         </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मौसमी श्रमिक (Seasonal Worker)</span><span style=\"font-family:'Nirmala UI'\"> आधिकारिक जनगणना श्रेणी नहीं है, हालांकि सीमांत श्रमिकों में अक्सर मौसमी मजदूर शामिल होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इस प्रकार, 183 दिनों से कम काम करने वाले किसी भी व्यक्ति को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सीमांत श्रमिक</span><span style=\"font-family:'Nirmala UI'\"> के रूप में वर्गीकृत किया गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का सारांश</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मुख्य श्रमिक </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">183 दिन या उससे अधिक</span><span style=\"font-family:'Nirmala UI'\"> काम करता है।</s 2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चांदी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एल्युमिनियम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आर्गन</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: सोना (Gold)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आवर्त सारणी (periodic table) में प्रतीक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">\"Au\"</span><span style=\"font-family:'Nirmala UI'\"> वाला रासायनिक तत्व </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सोना</span><span style=\"font-family:'Nirmala UI'\"> का प्रतिनिधित्व करता है।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रतीक Au लैटिन शब्द </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">\"Aurum\"</span><span style=\"font-family:'Nirmala UI'\"> से लिया गया है, जिसका अर्थ है चमकती भोर।</span></li><li style=\"margin-left:10.52pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-fami f;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 76 </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> भारत के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">महान्यायवादी (Attorney General)</span><span style=\"font-family:'Nirmala UI'\"> के पद की स्थापना करता है।</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 77 </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> भारत सरकार के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कार्यों के संचालन</span><span style=\"font-family:'Nirmala UI'\"> से संबंधित है।</span></li></ul>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय सशस्त्र बलों द्वारा मई 2025 में शुरू किया गया 'ऑपरेशन सिंदूर' किस बड़े आतंकी हमले के जवाब में सीमा पार स्थित आतंकी ढांचे को निशाना बनाने के लिए चलाया गया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उरी हमला</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पुलवामा हमला</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पहलगाम हमला</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पठानकोट हमला</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: पहलगाम हमला (Pahalgam Attack)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· मई 2025 में, भारतीय सशस्त्र बलों ने </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ऑपरेशन सिंदूर (Operation Sindoor)</span><span style=\"font-family:'Nirmala UI'\"> शुरू किया।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· यह पहलगाम आतंकी हमले के जवाब में आतंकी बुनियादी ढांचे को निशाना बनाने वाला एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सीमा पार आतंकवाद-विरोधी अभियान</span><span style=\"font-family:'Nirmala UI'\"> था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· पहलगाम हमला (2025) जम्मू-कश्मीर में एक बड़ी घटना थी जहाँ आतंकवादियों ने सुरक्षा बलों और नागरिकों को निशाना बनाया था, जिससे भारी हताहत हुए थे।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· ऑपरेशन सिंदूर को निम्नलिखित उद्देश्यों के लिए बनाया गया था:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o सीमा पार </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आतंकवादी लॉन्च पैड</span><span style=\"font-family:'Nirmala UI'\"> और शिविरों को नष्ट करना।</span></p><p style=\"marg
