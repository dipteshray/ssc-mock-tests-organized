8%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">16 – 32 – 96 – 180</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">220 – 440 – 1260 – 4500</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 – 2 – 6 – 24</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">80 – 40 – 160 – 640</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Logic:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">First number × 2 = Second number</span><br><span style=\"font-family:'Cambria Math'\">Second number × 3 = Third number</span><br><span style=\"font-family:'Cambria Math'\">Third number × 4 = Fourth number</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">For 100 – 200 – 600 – 2400:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">100 × 2 = 200</span><br><span style=\"font-family:'Cambria Math'\">200 × 3 = 600</span><br><span style=\"font-family:'Cambria Math'\">600 × 4 = 2400</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">For 315 – 630 – 1890 – 7560:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">315 × 2 = 630</span><br><span style=\"font-family:'Cambria Math'\">630 × 3 = 1890</span><br><span style=\"font-family:'Cambria Math'\">1890 × 4 = 7560</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Now check option (c):</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 × 2 = 2</span><br><span style=\"font-family:'Cambria Math'\">2 × 3 = 6</span><br><span style=\"font-family:'Cambria Math'\">6 × 4 = 24</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So, the correct answer is (c) 1 – 2 – 6 – 24.</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which Maharashtra Minister died in Airplane Crash in January 2026?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ajit Pawar</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Eknath Shinde</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Uddhav Thackeray</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Devendra Fadnavis</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>Ajit Pawar</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">In </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">January 2026</span><span style=\"font-family:Cambria;font-size:12pt\">, </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Ajit Pawar</span><span style=\"font-family:Cambria;font-size:12pt\">, senior NCP leader and then Deputy Chief Minister of Maharashtra, tragically </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">died in an airplane crash</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Following his demise, his widow </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Sunetra Pawar</span><span style=\"font-family:Cambria;font-size:12pt\"> was elected leader of the NCP Legislature Party and later sworn in as the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">first woman Deputy Chief Minister of Maharashtra</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Ajit Pawar’s death marked a significant turning point in Maharashtra politics, reshaping the leadership dynamics within the NCP.</span></li></ul>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Consider the following statements about the Supreme Court of India:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. It was established in January 1950.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. The Chief Justice of India is appointed by the President.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>III. Judges of the Supreme Court retire at the age of 65 years.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the statements given above are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I and II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only II and III</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I and III</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I, II and III All</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>I, II and III All</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Statement I: It was established in January 1950</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-family:Cambria;font-size:12pt\"> True</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Supreme Court of India</span><span style=\"font-family:Cambria;font-size:12pt\"> was established on </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">28 January 1950</span><span style=\"font-family:Cambria;font-size:12pt\">, two days after the Constitution came into effect (26 January 1950).</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Statement II: The Chief Justice of India is appointed by the President</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-family:Cambria;font-size:12pt\"> True</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">As per constitutional provisions, the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">President of India appoints the Chief Justice of India (CJI)</span><span style=\"font-family:Cambria;font-size:12pt\"> and other judges of the Supreme Court.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Statement III: Judges of the Supreme Court retire at the age of 65 years</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-family:Cambria;font-size:12pt\"> True</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Article 124 of the Constitution specifies that </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Supreme Court judges retire at 65 years</span><span style=\"font-family:Cambria;font-size:12pt\">, while High Court judges retire at 62 years.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The industrial explosive substance widely known as \"Dynamite\" is primarily manufactured by soaking an inert porous stabilizer matrix with which chemical compound?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Trinitrotoluene</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Nitroglycerin</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Potassium Nitrate</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ammonium Phosphate</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>Nitroglycerin</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The industrial explosive substance </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Dynamite</span><span style=\"font-family:Cambria;font-size:12pt\"> was invented by </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Alfred Nobel in 1867</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">It is primarily manufactured by </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">soaking nitroglycerin</span><span style=\"font-family:Cambria;font-size:12pt\"> (a highly unstable liquid explosive) into an </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">inert porous stabilizer matrix</span><span style=\"font-family:Cambria;font-size:12pt\"> such as </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">diatomaceous earth (kieselguhr)</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">This stabilizer makes nitroglycerin safer to handle and transport, while retaining its explosive power.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Dynamite revolutionized mining, construction, and warfare by providing a powerful yet relatively stable explosive.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Why Other Options Are Wrong:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Trinitrotoluene (TNT)</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Another explosive, but TNT is not used in dynamite; it is a separate compound.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Potassium Nitrate</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Used in gunpowder, not dynamite.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Ammonium Phosphate</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → A fertilizer, not an explosive.</span></li></ul>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which athlete has been named Para Archer of the Year 2025 by World Archery?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Avani Lekhara</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Deepa Malik</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sheetal Devi</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Preeti Pal</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>India’s teenage para-archer Sheetal Devi from Jammu &amp; Kashmir was named the World Archery Para Archer of the Year 2025, after a historic season that included winning gold at the World Para Archery Championships in Gwangju, South Korea, and a bronze medal at the Paris Paralympics. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">🏹</span><span style=\"font-weight:bold\"> About Sheetal Devi</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Nationality:</span><span style=\"font-family:Cambria;font-size:12pt\"> Indian (Jammu &amp; Kashmir)</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Unique Technique:</span><span style=\"font-family:Cambria;font-size:12pt\"> Born without arms, she uses her </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">feet, legs, and shoulder</span><span style=\"font-family:Cambria;font-size:12pt\"> to draw and release the bow.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Historic Achievement:</span><span style=\"font-family:Cambria;font-size:12pt\"> First female armless archer to win </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">gold at the World Para Archery Championships (2025)</span><span style=\"font-family:Cambria;font-size:12pt\"> in the women’s compound individual event.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Other Medals:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Silver in women’s team event (World Championships 2025)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Bronze in mixed team event (World Championships 2025)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Bronze in mixed team event at </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Paris Paralympics 2024</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Silver medals at </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">2022 Asian Para Games</span><span style=\"font-family:Cambria;font-size:12pt\"> and </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">2023 Asian Championships</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Bharatanatyam, one of the oldest classical dance forms of India, originated in which state?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Telangana</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Andhra Pradesh</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Karnataka</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Tamil Nadu</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>Tamil Nadu</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Bharatanatyam</span><span style=\"font-family:Cambria;font-size:12pt\"> is one of the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">oldest classical dance forms of India</span><span style=\"font-family:Cambria;font-size:12pt\">, with origins traced to </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Tamil Nadu</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">It was traditionally performed in </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">temples</span><span style=\"font-family:Cambria;font-size:12pt\"> as an offering to deities, symbolizing devotion and the union of the human soul with the divine.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Key features:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Mudras (hand gestures)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Abhinaya (expressions)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Nritta (pure dance movements)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Sculpturesque poses inspired by temple art</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Themes are drawn from </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Hindu epics</span><span style=\"font-family:Cambria;font-size:12pt\"> like the Ramayana, Mahabharata, and Puranas.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Telangana</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Not the origin state of Bharatanatyam.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Andhra Pradesh</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Associated more with Kuchipudi dance.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Karnataka</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Known for Yakshagana, not Bharatanatyam.</span></li></ul>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which organic acid is naturally present in lemon, orange and gooseberry?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Citric acid</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Lactic acid</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Acetic acid</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Formic acid</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>Citric acid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Citric acid</span><span style=\"font-family:Cambria;font-size:12pt\"> is the organic acid naturally present in </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">lemon, orange, and gooseberry (amla)</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">It gives these fruits their </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">sour taste</span><span style=\"font-family:Cambria;font-size:12pt\"> and plays a role in the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">citric acid cycle (Krebs cycle)</span><span style=\"font-family:Cambria;font-size:12pt\"> in metabolism.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Citric acid is widely used in the food industry as a </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">preservative and flavoring agent</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Lactic acid</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Found in sour milk and curd, produced by lactic acid bacteria.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Acetic acid</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Found in vinegar, not citrus fruits.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Formic acid</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Found in ant stings, not in lemon/orange/gooseberry.</span></li></ul>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Assertion (A):</span><span> The Governor of a state is appointed by the President of India.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Reason (R):</span><span> The Governor holds office for a fixed Constitutional Term of 5 years.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both A and R are true, and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both A and R are true, but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A is true, but the R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A is false, but the R is true</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: A is true, but the R is false</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Assertion (A): The Governor of a state is appointed by the President of India</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-family:Cambria;font-size:12pt\"> True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">As per </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Article 155</span><span style=\"font-family:Cambria;font-size:12pt\">, the Governor is appointed by the President.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Reason (R): The Governor holds office for a fixed Constitutional Term of 5 years</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> False.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">As per </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Article 156</span><span style=\"font-family:Cambria;font-size:12pt\">, the Governor </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">holds office during the pleasure of the President</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Although the Constitution mentions a </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">term of 5 years</span><span style=\"font-family:Cambria;font-size:12pt\">, this is </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">not fixed</span><span style=\"font-family:Cambria;font-size:12pt\"> — the Governor can be removed earlier by the President.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>What is the name of Israel Parliament, which passed a law imposing death penalty on Palestinians convicted of fatal attacks?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Duma</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Knesset</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>National Diet</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Shora</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>Knesset</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Knesset</span><span style=\"font-family:Cambria;font-size:12pt\"> is the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Parliament of Israel</span><span style=\"font-family:Cambria;font-size:12pt\">, located in Jerusalem.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">It has </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">120 members</span><span style=\"font-family:Cambria;font-size:12pt\"> and is responsible for passing laws, approving budgets, and overseeing the government.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Recently, the Knesset passed a controversial law imposing the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">death penalty on Palestinians convicted of fatal attacks</span><span style=\"font-family:Cambria;font-size:12pt\">, sparking international debate.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The Knesset plays a central role in Israel’s legislative process and political system.</span></li></ul>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>What is the full form of the abbreviation 'GDP' in economics?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Gross Direct Production</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>General Domestic Profits</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Gross Domestic Product</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>General Direct Product</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>Gross Domestic Product</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">GDP</span><span style=\"font-family:Cambria;font-size:12pt\"> stands for </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Gross Domestic Product</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">It measures the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">total monetary value of all final goods and services produced within a country’s borders during a specific period (usually a year or quarter)</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">GDP is a key indicator of a nation’s </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">economic performance and growth</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li></ul>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The First Battle of Panipat was fought in which year?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1526</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1556</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1576</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1761</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>1526</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">First Battle of Panipat</span><span style=\"font-family:Cambria;font-size:12pt\"> was fought in </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">1526</span><span style=\"font-family:Cambria;font-size:12pt\"> between </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Babur</span><span style=\"font-family:Cambria;font-size:12pt\"> (founder of the Mughal Empire in India) and </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Ibrahim Lodi</span><span style=\"font-family:Cambria;font-size:12pt\"> (last Sultan of the Delhi Sultanate).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Babur’s forces, though smaller, used </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">superior military tactics and artillery (gunpowder, cannons)</span><span style=\"font-family:Cambria;font-size:12pt\"> to decisively defeat Ibrahim Lodi.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">This battle marked the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">beginning of Mughal rule in India</span><span style=\"font-family:Cambria;font-size:12pt\">, which lasted for over three centuries.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">1556</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Year of the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Second Battle of Panipat</span><span style=\"font-family:Cambria;font-size:12pt\"> (Akbar’s forces led by Bairam Khan vs. Hemu).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">1576</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Year of the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Battle of Haldighati</span><span style=\"font-family:Cambria;font-size:12pt\"> (Akbar vs. Maharana Pratap).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">1761</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Year of the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Third Battle of Panipat</span><span style=\"font-family:Cambria;font-size:12pt\"> (Marathas vs. Ahmad Shah Abdali).</span></li></ul>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Consider the following statements about the Western Ghats:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. They run parallel to the western coast of India.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. They are also known as the Sahyadris.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>III. They are recognised as a UNESCO World Heritage Site.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the statements given above are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I and II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only II and III</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I and III</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I, II and III All</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>I, II and III All</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Statement I: They run parallel to the western coast of India</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-family:Cambria;font-size:12pt\"> True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Western Ghats</span><span style=\"font-family:Cambria;font-size:12pt\"> extend from Gujarat, Maharashtra, Goa, Karnataka, Kerala to Tamil Nadu, running </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">parallel to the western coast</span><span style=\"font-family:Cambria;font-size:12pt\"> along the Arabian Sea.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Statement II: They are also known as the Sahyadris</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-family:Cambria;font-size:12pt\"> True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">In Maharashtra and parts of Karnataka, the Western Ghats are popularly called the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Sahyadri Hills</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Statement III: They are recognised as a UNESCO World Heritage Site</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-family:Cambria;font-size:12pt\"> True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">In </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">2012</span><span style=\"font-family:Cambria;font-size:12pt\">, UNESCO declared the Western Ghats a </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">World Heritage Site</span><span style=\"font-family:Cambria;font-size:12pt\"> due to their rich biodiversity and ecological significance.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, </span><span style=\"font-weight:bold\">all three statements are correct</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which keyboard shortcut is used to paste copied content in MS Word?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + V</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + C</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + X</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + Z</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: Ctrl + V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">In </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">MS Word</span><span style=\"font-family:Cambria;font-size:12pt\"> (and most applications), the shortcut to </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">paste copied content</span><span style=\"font-family:Cambria;font-size:12pt\"> is </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Ctrl + V</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">This works after using </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Ctrl + C (Copy)</span><span style=\"font-family:Cambria;font-size:12pt\"> or </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Ctrl + X (Cut)</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The pasted content appears at the cursor’s current position in the document.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Ctrl + C</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Used to </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">copy</span><span style=\"font-family:Cambria;font-size:12pt\"> selected text/content.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Ctrl + X</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Used to </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">cut</span><span style=\"font-family:Cambria;font-size:12pt\"> (remove and copy) selected text/content.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Ctrl + Z</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Used to </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">undo</span><span style=\"font-family:Cambria;font-size:12pt\"> the last action.</span></li></ul>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Consider the following statements about India's Unified Payments Interface (UPI):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. UPI was developed by the National Payments Corporation of India (NPCI).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. It allows real-time bank-to-bank transactions.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the statements given above are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only II </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both I and II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither I and II</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>Both I and II</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Statement I: UPI was developed by the National Payments Corporation of India (NPCI)</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-family:Cambria;font-size:12pt\"> Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Unified Payments Interface (UPI)</span><span style=\"font-family:Cambria;font-size:12pt\"> was launched in </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">2016</span><span style=\"font-family:Cambria;font-size:12pt\"> by NPCI, an umbrella organization for retail payments in India.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Statement II: It allows real-time bank-to-bank transactions</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-family:Cambria;font-size:12pt\"> Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">UPI enables </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">instant fund transfers</span><span style=\"font-family:Cambria;font-size:12pt\"> between two bank accounts using mobile devices, without needing IFSC codes or account details.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Transactions are processed in </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">real-time</span><span style=\"font-family:Cambria;font-size:12pt\">, 24×7, including holidays.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Together, both statements are correct, and they explain the essence of UPI.</span></li></ul>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which Article of the Indian Constitution provides for the office of the Comptroller and Auditor-General?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Article 148</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Article 158</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Article 168</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Article 178</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>Article 148</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Comptroller and Auditor-General of India (CAG)</span><span style=\"font-family:Cambria;font-size:12pt\"> is provided for under </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Article 148</span><span style=\"font-family:Cambria;font-size:12pt\"> of the Indian Constitution.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The CAG is the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">supreme audit authority of India</span><span style=\"font-family:Cambria;font-size:12pt\">, responsible for auditing:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Accounts of the Union and State governments</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Public sector enterprises</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Other authorities as prescribed by law</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The CAG ensures </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">financial accountability</span><span style=\"font-family:Cambria;font-size:12pt\"> and acts as a watchdog of public finances.</span></li></ul>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>International Yoga Day is observed on which date every year?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8th of March</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>22nd of April</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5th of June</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>21st of June</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>21st of June</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">International Yoga Day</span><span style=\"font-family:Cambria;font-size:12pt\"> is observed every year on </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">21 June</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">It was </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">proposed by India</span><span style=\"font-family:Cambria;font-size:12pt\"> and adopted by the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">United Nations General Assembly in 2014</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The date was chosen because </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">21 June is the Summer Solstice</span><span style=\"font-family:Cambria;font-size:12pt\">, the longest day of the year in the Northern Hemisphere, symbolizing vitality and energy.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">First celebrated in </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">2015</span><span style=\"font-family:Cambria;font-size:12pt\">, it promotes the practice of yoga for </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">health, well-being, and harmony</span><span style=\"font-family:Cambria;font-size:12pt\"> worldwide.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">8th March</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → International Women’s Day.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">22nd April</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Earth Day.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">5th June</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → World Environment Day.</span></li></ul>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The 2025 Nobel Prize in Literature was awarded to which author?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Han Kang</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Annie Ernaux</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Olga Tokarczuk</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>László Krasznahorkai</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The 2025 Nobel Prize in Literature was awarded to Hungarian author László Krasznahorkai for his “compelling and visionary oeuvre that, in the midst of apocalyptic terror, reaffirms the power of art.” </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">About László Krasznahorkai:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Nationality:</span><span style=\"font-family:Cambria;font-size:12pt\"> Hungarian</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Born:</span><span style=\"font-family:Cambria;font-size:12pt\"> 1954, Gyula, Hungary</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Style:</span><span style=\"font-family:Cambria;font-size:12pt\"> Known for long, flowing sentences (sometimes entire novels written as a single sentence), often described as stream of consciousness.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Themes:</span><span style=\"font-family:Cambria;font-size:12pt\"> Apocalyptic visions, chaos vs. order, human despair, and the redemptive power of art and music.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Major Works:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Sátántangó (1985) → Breakthrough novel, later adapted into a film by Béla Tarr.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">The Melancholy of Resistance (1989) → Apocalyptic fantasy set in a Hungarian town.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">War &amp; War (1999) → Explores human fragility and the search for meaning.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Herscht 07769 → Written in a single 300+ page sentence, centered on music and existential dread.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The Tropic of Capricorn passes through how many continents of the world?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two continents</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three continents</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Four continents</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Five continents</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>Three continents</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Tropic of Capricorn</span><span style=\"font-family:Cambria;font-size:12pt\"> is the southernmost latitude where the Sun can be directly overhead.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">It passes through </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">three continents</span><span style=\"font-family:Cambria;font-size:12pt\">:</span><ol type=\"1\"><li style=\"margin-left:32.11pt;padding-left:3.89pt;font-family:Cambria;font-size:12pt\"><span style=\"font-weight:bold\">South America</span><span> → Brazil, Paraguay, Argentina, Chile</span></li><li style=\"margin-left:32.11pt;padding-left:3.89pt;font-family:Cambria;font-size:12pt\"><span style=\"font-weight:bold\">Africa</span><span> → Namibia, Botswana, South Africa, Mozambique, Madagascar</span></li><li style=\"margin-left:32.11pt;padding-left:3.89pt;font-family:Cambria;font-size:12pt\"><span style=\"font-weight:bold\">Australia</span><span> → Northern regions</span></li></ol></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Thus, the Tropic of Capricorn crosses </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">three continents in total</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li></ul>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Assertion (A):</span><span> A rainbow is formed in the sky after a rainfall.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Reason (R):</span><span> Water droplets in the atmosphere disperse sunlight into its seven constituent colours.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the most appropriate answer:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both A and R are true, and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both A and R are true, but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A is true, but the R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A is false, but the R is true</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>Both A and R are true, and R is the correct explanation of A</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Assertion (A): A rainbow is formed in the sky after a rainfall</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-family:Cambria;font-size:12pt\"> True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Rainbows appear when sunlight interacts with water droplets in the atmosphere after rain.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Reason (R): Water droplets in the atmosphere disperse sunlight into its seven constituent colours</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-family:Cambria;font-size:12pt\"> True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">The droplets act like tiny prisms, refracting, reflecting, and dispersing sunlight into the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">spectrum of seven colours (VIBGYOR)</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Since </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">R correctly explains A</span><span style=\"font-family:Cambria;font-size:12pt\">, the most appropriate answer is: </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Both A and R are true, and R is the correct explanation of A.</span></li></ul>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>How many members can be nominated to the Rajya Sabha by the President of India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10 members</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12 members</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14 members</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>16 members</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>12 members</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">President of India</span><span style=\"font-family:Cambria;font-size:12pt\"> can nominate </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">12 members to the Rajya Sabha</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">These members are chosen for their </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">special knowledge or practical experience</span><span style=\"font-family:Cambria;font-size:12pt\"> in fields such as:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Literature</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Science</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Art</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Social service</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">This provision ensures that distinguished individuals contribute to parliamentary debates and policymaking, even if they are not directly elected.</span></li></ul>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In which year was the demonetisation of ₹500 and ₹1000 currency notes announced in India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2014</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2015</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2016</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2017</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>2016</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">On </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">8 November 2016</span><span style=\"font-family:Cambria;font-size:12pt\">, the Government of India announced the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">demonetisation of ₹500 and ₹1000 currency notes</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The move was aimed at:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Curbing black money</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Eliminating counterfeit currency</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Promoting digital transactions</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Overnight, these notes ceased to be legal tender, and citizens had to deposit or exchange them in banks.</span></li></ul>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Who was the founder of the Sikh religion?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Guru Nanak Dev</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Guru Gobind Singh</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Guru Tegh Bahadur</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Guru Arjun Dev</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>Guru Nanak Dev</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Guru Nanak Dev Ji</span><span style=\"font-family:Cambria;font-size:12pt\"> (1469–1539) was the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">founder of Sikhism</span><span style=\"font-family:Cambria;font-size:12pt\"> and the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">first Sikh Guru</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">He preached the ideals of </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">equality, devotion to one God, service to humanity, and rejection of caste discrimination</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">His teachings are preserved in the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Guru Granth Sahib</span><span style=\"font-family:Cambria;font-size:12pt\">, the holy scripture of Sikhism.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The Sikh faith later developed under nine successive Gurus, culminating in Guru Gobind Singh Ji, who founded the Khalsa in 1699.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Guru Gobind Singh</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → 10th Guru, founded the Khalsa in 1699, but not the founder of Sikhism.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Guru Tegh Bahadur</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → 9th Guru, martyred defending religious freedom, but not the founder.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Guru Arjun Dev</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → 5th Guru, compiled the Adi Granth, but not the founder.</span></li></ul>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which state topped the medals tally at the Khelo India Tribal Games held in Chhattisgarh?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Jharkhand</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Odisha</span><
