n continent</span><span style=\"font-family:Cambria;font-size:12pt\"> hosted a G20 summit.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Focused on </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Africa’s development priorities</span><span style=\"font-family:Cambria;font-size:12pt\">, debt vulnerability of Global South nations, climate change, and reform of international financial institutions.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Continued the sequence of Global South presidencies: Indonesia (2022), India (2023), Brazil (2024), South Africa (2025).</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>What is the official currency of Japan?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Yen</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Won</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Yuan</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Dong</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: Yen</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">official currency of Japan</span><span style=\"font-family:Cambria;font-size:12pt\"> is the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Yen (JPY)</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Symbol: </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">¥</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Introduced: </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">1871</span><span style=\"font-family:Cambria;font-size:12pt\">, replacing the Tokugawa coinage system.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The Yen is one of the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">most traded currencies in the world</span><span style=\"font-family:Cambria;font-size:12pt\">, alongside the US Dollar (USD) and Euro (EUR).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Managed by the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Bank of Japan (BoJ)</span><span style=\"font-family:Cambria;font-size:12pt\">, which oversees monetary policy and currency issuance.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Won</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Currency of </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">South Korea</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Yuan</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Currency of </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">China</span><span style=\"font-family:Cambria;font-size:12pt\"> (Renminbi, CNY).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Dong</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Currency of </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Vietnam</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li></ul>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The Directive Principles of State Policy in the Indian Constitution are borrowed from the Constitution of which country?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>France</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ireland</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Australia</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Canada</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: Ireland</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Directive Principles of State Policy (DPSPs)</span><span style=\"font-family:Cambria;font-size:12pt\"> in the Indian Constitution were </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">borrowed from the Irish Constitution (1937)</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Inspired by the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Directive Principles of Social Policy</span><span style=\"font-family:Cambria;font-size:12pt\"> in Ireland, they were included in Part IV (Articles 36–51) of the Indian Constitution.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Purpose: To guide the state in establishing a </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">welfare state</span><span style=\"font-family:Cambria;font-size:12pt\">, ensuring social and economic justice, though they are </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">non-justiciable</span><span style=\"font-family:Cambria;font-size:12pt\"> (not enforceable by courts).</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">France</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Source of ideals of </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Liberty, Equality, Fraternity</span><span style=\"font-family:Cambria;font-size:12pt\"> in the Preamble.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Australia</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Source of </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Concurrent List</span><span style=\"font-family:Cambria;font-size:12pt\"> and joint sitting of Parliament.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Canada</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Source of </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">strong Centre</span><span style=\"font-family:Cambria;font-size:12pt\"> and residuary powers with Union.</span></li></ul>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which strait separates India from Sri Lanka?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Malacca Strait</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sunda Strait</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hormuz Strait</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Palk Strait</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>Palk Strait</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Palk Strait</span><span style=\"font-family:Cambria;font-size:12pt\"> separates </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">India (Tamil Nadu)</span><span style=\"font-family:Cambria;font-size:12pt\"> from </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Sri Lanka</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">It lies between the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">southeastern coast of India</span><span style=\"font-family:Cambria;font-size:12pt\"> and the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">northern coast of Sri Lanka</span><span style=\"font-family:Cambria;font-size:12pt\">, connecting the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Bay of Bengal</span><span style=\"font-family:Cambria;font-size:12pt\"> with the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Gulf of Mannar</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The strait is relatively shallow and dotted with small islands and shoals, forming part of the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Adam’s Bridge (Rama’s Bridge/Ram Setu)</span><span style=\"font-family:Cambria;font-size:12pt\"> region.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Malacca Strait</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Separates Malay Peninsula and Sumatra (Indonesia), not India–Sri Lanka.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Sunda Strait</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Between Java and Sumatra in Indonesia.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Hormuz Strait</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Between Oman and Iran, connecting Persian Gulf with Arabian Sea.</span></li></ul>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Who was sworn in as the 53rd Chief Justice of India in November 2025?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BR Gavai</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sanjiv Khanna</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Surya Kant</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>UU Lalit</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Justice Surya Kant was sworn in as the 53rd Chief Justice of India on 24 November 2025, succeeding Justice B.R. Gavai. The oath was administered by President Droupadi Murmu at Rashtrapati Bhavan.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Key Details:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Appointee:</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Justice Surya Kant</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Date of Oath:</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">24 November 2025</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Administered By:</span><span style=\"font-family:Cambria;font-size:12pt\"> President </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Droupadi Murmu</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Predecessor:</span><span style=\"font-family:Cambria;font-size:12pt\"> Justice </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Bhushan R. Gavai</span><span style=\"font-family:Cambria;font-size:12pt\"> (demitted office on 23 November 2025)</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Tenure:</span><span style=\"font-family:Cambria;font-size:12pt\"> Till </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">9 February 2027</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Background of Justice Surya Kant</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Born:</span><span style=\"font-family:Cambria;font-size:12pt\"> 10 February 1962, Petwar village, Hisar district, Haryana.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Education:</span><span style=\"font-family:Cambria;font-size:12pt\"> Law degree from Maharishi Dayanand University, Rohtak (1984).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Career Milestones:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Began practice at District Courts, Hisar (1984).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Shifted to Punjab &amp; Haryana High Court (1985).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Appointed </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">youngest Advocate General of Haryana</span><span style=\"font-family:Cambria;font-size:12pt\"> (2000).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Elevated as </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Judge of Punjab &amp; Haryana High Court</span><span style=\"font-family:Cambria;font-size:12pt\"> (2004).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Became </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Chief Justice of Himachal Pradesh High Court</span><span style=\"font-family:Cambria;font-size:12pt\"> (2018).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Elevated to </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Supreme Court of India</span><span style=\"font-family:Cambria;font-size:12pt\"> (2019).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Served as </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Executive Chairman of NALSA</span><span style=\"font-family:Cambria;font-size:12pt\"> (May 2025).</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Consider the following statements about computer peripherals:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. A keyboard is an input device.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. A printer is an output device.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>III. A computer mouse is a storage device.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the statements given above are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I and II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only II and III</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I and III</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I, II and III All</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: Only I and II</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Statement I: A keyboard is an input device</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-family:Cambria;font-size:12pt\"> Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Keyboard</span><span style=\"font-family:Cambria;font-size:12pt\"> is used to enter data and commands into the computer.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Statement II: A printer is an output device</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-family:Cambria;font-size:12pt\"> Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Printer</span><span style=\"font-family:Cambria;font-size:12pt\"> produces hard copies of digital data, making it an output device.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Statement III: A computer mouse is a storage device</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> Incorrect.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Mouse</span><span style=\"font-family:Cambria;font-size:12pt\"> is an input device used for pointing and selecting, not for storing data.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>According to the final empirical parameters recorded under Census 2011, which of the following Indian states registered the absolute lowest sex ratio (number of females per 1000 males)?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Haryana</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Punjab</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Rajasthan</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Bihar</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>Haryana</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">According to the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Census 2011</span><span style=\"font-family:Cambria;font-size:12pt\">, </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Haryana</span><span style=\"font-family:Cambria;font-size:12pt\"> recorded the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">lowest sex ratio among Indian states</span><span style=\"font-family:Cambria;font-size:12pt\">, with </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">879 females per 1000 males</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">This reflected a long-standing demographic imbalance due to socio-cultural factors like son preference and gender-based discrimination.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Other states in the options had comparatively higher sex ratios:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Punjab → 895</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Rajasthan → 928</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Bihar → 918</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>What is the operational nature of \"RAM\" (Random Access Memory) within a standard computer system framework?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Non-volatile and sequential access</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Volatile and temporary direct access</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Permanent magnetic read-only</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Optically structured flash memory</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>Volatile and temporary direct access</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">RAM (Random Access Memory)</span><span style=\"font-family:Cambria;font-size:12pt\"> is a </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">volatile memory</span><span style=\"font-family:Cambria;font-size:12pt\">, meaning it loses all stored data once the power supply is turned off.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">It provides </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">temporary storage</span><span style=\"font-family:Cambria;font-size:12pt\"> for programs and data currently in use by the CPU.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Access is </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">direct/random</span><span style=\"font-family:Cambria;font-size:12pt\">, i.e., any memory location can be accessed directly without sequential searching.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">This makes RAM essential for fast processing and smooth functioning of applications.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Non-volatile and sequential access</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Describes storage devices like HDDs, not RAM.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Permanent magnetic read-only</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Refers to ROM or magnetic storage (HDD), not RAM.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Optically structured flash memory</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Refers to optical discs or flash memory, which are non-volatile.</span></li></ul>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Consider the following statements about the Pradhan Mantri Jan Dhan Yojana (PMJDY):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. It was launched in August 2014.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. It aims to provide universal access to banking services.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>III. It offers paid RuPay debit cards to account holders.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the statements given above are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I and II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only II and III</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I and III</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I, II and III All</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>Only I and II</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Statement I: It was launched in August 2014</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-family:Cambria;font-size:12pt\"> Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Pradhan Mantri Jan Dhan Yojana (PMJDY)</span><span style=\"font-family:Cambria;font-size:12pt\"> was launched on </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">28 August 2014</span><span style=\"font-family:Cambria;font-size:12pt\"> by Prime Minister Narendra Modi.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Statement II: It aims to provide universal access to banking services</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-family:Cambria;font-size:12pt\"> Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">The scheme’s primary objective is </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">financial inclusion</span><span style=\"font-family:Cambria;font-size:12pt\"> by ensuring every household has access to a bank account, credit, insurance, and pension facilities.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Statement III: It offers paid RuPay debit cards to account holders</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> Incorrect.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">PMJDY provides </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">free RuPay debit cards</span><span style=\"font-family:Cambria;font-size:12pt\"> to account holders, along with accidental insurance coverage.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Who is the ex-officio Chairperson of the GST Council?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Prime Minister</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The President</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Finance Minister</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Speaker of Lok Sabha</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>Finance Minister</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">GST Council</span><span style=\"font-family:Cambria;font-size:12pt\"> was constituted under </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Article 279A of the Indian Constitution</span><span style=\"font-family:Cambria;font-size:12pt\"> after the introduction of the Goods and Services Tax (GST) in 2017.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Union Finance Minister</span><span style=\"font-family:Cambria;font-size:12pt\"> is the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">ex-officio Chairperson</span><span style=\"font-family:Cambria;font-size:12pt\"> of the GST Council.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Structure of the Council:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Chairperson (ex-officio):</span><span style=\"font-family:Cambria;font-size:12pt\"> Union Finance Minister</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Members:</span><span style=\"font-family:Cambria;font-size:12pt\"> Union Minister of State for Finance, and Finance/Taxation Ministers of all States and Union Territories with legislatures.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The Council makes recommendations on important aspects of GST such as tax rates, exemptions, threshold limits, and dispute resolution.</span></li></ul>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which Indian State launched the 'Subhadra Yojana' for women?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Telangana</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Bihar</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Madhya Pradesh</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Odisha</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">The 'Subhadra Yojana' was launched by the Government of Odisha in September 2024 as a flagship women</span><span style=\"font-weight:bold\">‑</span><span style=\"font-weight:bold\">centric welfare scheme.</span><span> It provides direct financial assistance and empowerment tools to women across all 30 districts of the state.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Key Details:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Launched by:</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Odisha Government</span><span style=\"font-family:Cambria;font-size:12pt\"> (officially announced in Bhubaneswar, September 2024).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Beneficiaries:</span><span style=\"font-family:Cambria;font-size:12pt\"> Women aged </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">21–60 years</span><span style=\"font-family:Cambria;font-size:12pt\">, residents of Odisha, covered under </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">NFSA/SFSS</span><span style=\"font-family:Cambria;font-size:12pt\"> or with family income ≤ ₹2.5 lakh.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Financial Benefit:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">₹50,000 over </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">5 years</span><span style=\"font-family:Cambria;font-size:12pt\"> (₹10,000 annually).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Paid in </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">two instalments</span><span style=\"font-family:Cambria;font-size:12pt\"> of ₹5,000 each:</span><ul type=\"square\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:27.58pt;padding-left:8.42pt\"><span style=\"font-family:Cambria;font-size:12pt\">On </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Rakhi Purnima</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:27.58pt;padding-left:8.42pt\"><span style=\"font-family:Cambria;font-size:12pt\">On </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">International Women’s Day (8 March)</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li></ul></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Delivery Mechanism:</span><span style=\"font-family:Cambria;font-size:12pt\"> Direct Benefit Transfer (DBT) into Aadhaar</span><span style=\"font-family:Cambria;font-size:12pt\">‑</span><span style=\"font-family:Cambria;font-size:12pt\">linked accounts.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Special Feature:</span><span style=\"font-family:Cambria;font-size:12pt\"> Beneficiaries receive a </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Subhadra Card (ATM</span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">‑</span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">cum</span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">‑</span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">debit card)</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Digital Incentives:</span><span style=\"font-family:Cambria;font-size:12pt\"> Top 100 women in each Gram Panchayat/ULB with the highest digital transactions get an extra ₹500 reward.</span></li></ul>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In a 150-meter race, R beats S by 6 meters. In a 250-meter race, R beats S by 2 seconds. As per this, in a race, if R runs for 30 seconds, then he beats S by __ meters.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">5.75</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">7.25</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">6.75</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">6.25</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Speed ratio from 150 m race:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">R : S = 150 : 144 = 25 : 24</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In 250 m race, R beats S by 2 sec.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So, time ratio = 24 : 25</span><br><span style=\"font-family:'Cambria Math'\">Difference = 1 unit = 2 sec</span><br><span style=\"font-family:'Cambria Math'\">R’s time = 24 × 2 = 48 sec</span><br><span style=\"font-family:'Cambria Math'\">S’s time = 50 sec</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1780729955848_image001.png\" width=\"176\" height=\"38\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1780729955848_image002.png\" width=\"250\" height=\"67\" alt style=\"vertical-align:middle\" ><span style=\"font-family:'Cambria Math'\">S covers = 5 × 30 = 150 m</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Difference = 6.25 m</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Answer: (d) 6.25</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Two runners A and B start simultaneously from the same point on a circular track of length 840 m and run in the clockwise direction. The speed of A is 7 m/s and the speed of B is 5 m/s. At what distance from the starting point in the clockwise direction and after how many complete rounds by A, does A meet with B again the first time?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">210 m after completing 3 rounds</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math' rgin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1780729955848_image007.png\" width=\"249\" height=\"40\" alt style=\"vertical-align:middle\" ></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is 20 percent more than B. B is 30 percent more than C. C is 10 percent less than D. D is 30 percent less than E. By how much percentage is A more/less than E?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1.72 percent less</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1.72 percent more</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1.86 percent less</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1.86 percent more</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Let E = 100</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">D = 30% less than E = 70</span><br><span style=\"font-family:'Cambria Math'\">C = 10% less than D = 63</span><br><span style=\"font-family:'Cambria Math'\">B = 30% more than C = 81.9</span><br><span style=\"font-family:'Cambria Math'\">A = 20% more than B = 98.28</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Compare A with E =\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Milk : Water = 3 : 2 in 120 L</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Milk = 72 L, Water = 48 L</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">24 L solution removed:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Milk removed = 14.4 L</span><br><span style=\"font-family:'Cambria Math'\">Water removed = 9.6 L</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Remaining:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Milk = 57.6 L</span><br><span style=\"font-family:'Cambria Math'\">Water = 38.4 L</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">24 L pure milk added:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Milk = 57.6 + 24 = 81.6 L</span><br><span style=\"font-family:'Cambria Math'\">Water = 38.4 L</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ratio = 81.6 : 38.4 = 17 : 8</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Answer: (a) 17 : 8</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Find the third proportional to a³ − b³ and a² + b² + ab, when a = 16 and b = 12.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">150</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">160</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">148</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">158</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">a³ − b³ = (a − b)(a² + ab + b²)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Given:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">a = 16, b = 12</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">a − b = 4</span><br><span style=\"font-family:'Cambria Math'\">a² + ab + b² = 592</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So,</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">First term = 4 × 592</span><br><span style=\"font-family:'Cambria Math'\">Second term = 592</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Third proportional:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/websit bria Math'\">5 years ago:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Father = x - 5</span><br><span style=\"font-family:'Cambria Math'\">Son = 55 - x</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Given:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(x - 5)(55 - x) = 525</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">x² - 60x + 800 = 0</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(x - 40)(x - 20) = 0</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">x = 40 or 20</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Father’s age is greater, so:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Answer: (b) 40</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The capacity of a cylindrical tank is 55440 cm³. If its base radius is 14 cm, then find the total surface area of the tank. Use π = 22/7</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">9252 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">9352 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:10 ht=\"21\" alt style=\"vertical-align:middle\" ></p>", "question_heading": ""}, {"sr_no": 105, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">When 13511, 13903 and 14589 are divided by the greatest number n, the remainder is m. What is the value of (n + m)?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">131</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">183</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">151</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">161</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Same remainder → take HCF of differences.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Numbers: 13511, 13903, 14589</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Differences:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">13903 - 13511 = 392</span><br><span style=\"font-family:'Cambria Math'\">14589 - 13903 = 686</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">HCF(392, 686) = 98</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So, n = 98</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Remainder:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">13511 ÷ 98 gives remainder 85</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So, m = 85</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">n + m = 98 + 85 = 183</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Answer: (b) 183</span></p>", "question_heading": ""}, {"sr_no": 106, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A can do a job in 10 days and B can do it in 15 days. If they work together, how long will it take them to complete the job?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">5 days</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">6 days</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">8 days</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">10 days</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1780729955848_image053.png\" width=\"  must sit next to each other?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">8</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">6</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">10</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">4</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Let the two fixed-together people be one block.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So, total units = 1 block + 2 people = 3 units</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Circular arrangements of 3 units:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(3 - 1)! = 2! = 2</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Now, the two people inside the block can interchange:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2! = 2</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Total ways:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2 × 2 = 4</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Answer: (d) 4</span></p>", "question_heading": ""}, {"sr_no": 110, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">If x² + y² + z² = 2(5x + 6y + 4z) - 77, then find the value of 2(x + y) - 3z.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">11</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">23</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">10</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">78</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">x² + y² + z² = 2(5x + 6y + 4z) - 77</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Compare with:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">x² + y² + z² = 2(ax + by + cz) - (a² + b² + c²)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Here,</span><br><span style=\"font-family:'Cambria Math'\">a = 5, b = 6, c = 4</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">And 5² + 6² + 4² = 77</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So,</span><br><span style=\"font-family:'Cambria Math'\">x = 5, y = 6, z = 4</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Required value:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2(x + y) - 3z</span><br><span style=\"font-family:'Cambria Math'\">= 2(5 + 6) - 3(4)</span><br><span style=\"font-family:'Cambria Math'\">= 22 - 12</span><br><span style=\"font-family:'Cambria Math'\">= 10</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Answer: (c) 10</span></p>", "question_heading": ""}, {"sr_no": 111, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In triangle ABC, the orthocenter O and the incenter I. If ∠BIC − ∠BOC = 90°, what is ∠A?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">100°</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">90°</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">110°</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">120°</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Given formulas:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img
