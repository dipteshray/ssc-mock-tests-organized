/p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Karnataka</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Madhya Pradesh</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Karnataka topped the medals tally at the inaugural Khelo India Tribal Games held in Chhattisgarh, finishing as overall champions with 23 gold, 8 silver, and 7 bronze medals. Odisha came second, while Jharkhand secured third place. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Detailed Medal Tally Highlights:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Karnataka (1st place)</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Gold:</span><span style=\"font-family:Cambria;font-size:12pt\"> 23</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Silver:</span><span style=\"font-family:Cambria;font-size:12pt\"> 8</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Bronze:</span><span style=\"font-family:Cambria;font-size:12pt\"> 7</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Total:</span><span style=\"font-family:Cambria;font-size:12pt\"> 38 medals</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Dominated in </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">swimming (15 gold)</span><span style=\"font-family:Cambria;font-size:12pt\">, athletics, and wrestling.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Odisha (2nd place)</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Gold:</span><span style=\"font-family:Cambria;font-size:12pt\"> 21</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Silver:</span><span style=\"font-family:Cambria;font-size:12pt\"> 15</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Bronze:</span><span style=\"font-family:Cambria;font-size:12pt\"> 21</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Total:</span><span style=\"font-family:Cambria;font-size:12pt\"> 57 medals (highest overall count).</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Jharkhand (3rd place)</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Gold:</span><span style=\"font-family:Cambria;font-size:12pt\"> 16</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Silver:</span><span style=\"font-family:Cambria;font-size:12pt\"> 8</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Bronze:</span><span style=\"font-family:Cambria;font-size:12pt\"> 11</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Total:</span><span style=\"font-family:Cambria;font-size:12pt\"> 35 medals.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Chhattisgarh (Host State)</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Gold:</span><span style=\"font-family:Cambria;font-size:12pt\"> 3</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Silver:</span><span style=\"font-family:Cambria;font-size:12pt\"> 10</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Bronze:</span><span style=\"font-family:Cambria;font-size:12pt\"> 6</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Total:</span><span style=\"font-family:Cambria;font-size:12pt\"> 19 medals (9th place).</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 58, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Match the following table:</span></p><table cellspacing=\"0\" cellpadding=\"0\" style=\"border:0.75pt solid #000000;border-collapse:collapse\"><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>List-I (National Park) </span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>List-II (State)</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A. Kaziranga</span><span>  </span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Madhya Pradesh</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B. Gir</span><span>  </span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Assam</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C. Kanha</span><span>  </span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Gujarat</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D. Sundarbans</span><span>  </span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. West Bengal</span></p></td></tr></table><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A-3, B-2, C-1, D-4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A-1, B-2, C-3, D-4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A-2, B-1, C-3, D-4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A-2, B-3, C-1, D-4</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>A-2, B-3, C-1, D-4</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Kaziranga National Park</span><span style=\"font-family:Cambria;font-size:12pt\"> → Located in </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Assam</span><span style=\"font-family:Cambria;font-size:12pt\">, famous for the one-horned rhinoceros.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Gir National Park</span><span style=\"font-family:Cambria;font-size:12pt\"> → Located in </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Gujarat</span><span style=\"font-family:Cambria;font-size:12pt\">, famous for Asiatic lions.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Kanha National Park</span><span style=\"font-family:Cambria;font-size:12pt\"> → Located in </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Madhya Pradesh</span><span style=\"font-family:Cambria;font-size:12pt\">, known for tigers and barasingha.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Sundarbans National Park</span><span style=\"font-family:Cambria;font-size:12pt\"> → Located in </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">West Bengal</span><span style=\"font-family:Cambria;font-size:12pt\">, famous for mangrove forests and Royal Bengal tigers.</span></li></ul>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Consider the following statements about the human heart:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. The human heart has four chambers.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. The left ventricle pumps oxygenated blood to the body.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>III. The right side of the heart carries oxygen-rich blood.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the statements given above are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I and II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only II and III</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I and III</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I, II and III All</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>Only I and II</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Statement I: The human heart has four chambers</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-family:Cambria;font-size:12pt\"> True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">The heart consists of </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">two atria (right &amp; left)</span><span style=\"font-family:Cambria;font-size:12pt\"> and </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">two ventricles (right &amp; left)</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Statement II: The left ventricle pumps oxygenated blood to the body</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-family:Cambria;font-size:12pt\"> True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">left ventricle</span><span style=\"font-family:Cambria;font-size:12pt\"> pumps oxygen-rich blood into the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">aorta</span><span style=\"font-family:Cambria;font-size:12pt\">, which distributes it throughout the body.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Statement III: The right side of the heart carries oxygen-rich blood</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> False.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">right atrium and right ventricle</span><span style=\"font-family:Cambria;font-size:12pt\"> carry </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">deoxygenated blood</span><span style=\"font-family:Cambria;font-size:12pt\"> from the body and pump it to the lungs for oxygenation.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">left side</span><span style=\"font-family:Cambria;font-size:12pt\"> of the heart carries oxygen-rich blood.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>India’s newly commissioned third indigenous Arihant class nuclear-powered ballistic missile submarine (SSBN) is named as?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>INS Chakra</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>INS Aridhaman</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>INS Sindhughosh</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>INS Sindhukirti</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>INS Aridhaman</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">India’s </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">third indigenous Arihant-class nuclear-powered ballistic missile submarine (SSBN)</span><span style=\"font-family:Cambria;font-size:12pt\">, commissioned in </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">2025-26</span><span style=\"font-family:Cambria;font-size:12pt\">, is named </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">INS Aridhaman</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The Arihant-class SSBNs are part of India’s </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">nuclear triad</span><span style=\"font-family:Cambria;font-size:12pt\">, ensuring second-strike capability with submarine-launched ballistic missiles (SLBMs).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">INS Aridhaman</span><span style=\"font-family:Cambria;font-size:12pt\"> follows </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">INS Arihant</span><span style=\"font-family:Cambria;font-size:12pt\"> (commissioned 2016) and </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">INS Arighat</span><span style=\"font-family:Cambria;font-size:12pt\"> (sea trials completed 2022, commissioned later).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">These submarines are designed and built by the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Ship Building Centre (SBC), Visakhapatnam</span><span style=\"font-family:Cambria;font-size:12pt\">, under the Advanced Technology Vessel (ATV) project.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">INS Chakra</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Russian Akula-class nuclear submarine leased to India, not indigenous.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">INS Sindhughosh</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Kilo-class diesel-electric submarine, not nuclear-powered SSBN.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">INS Sindhukirti</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Another Kilo-class conventional submarine, not SSBN.</span></li></ul>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In computer communication network topologies, which specific layout connects every individual node directly to a central network hub or switch device?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Bus Topology</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ring Topology</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Star Topology</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mesh Topology</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>Star Topology</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">In a </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Star Topology</span><span style=\"font-family:Cambria;font-size:12pt\">, every individual node (computer or device) is directly connected to a </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">central hub or switch</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The hub acts as a </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">controller</span><span style=\"font-family:Cambria;font-size:12pt\"> that manages data transmission between nodes.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">If one connection fails, it does not affect the rest of the network, but if the hub fails, the entire network goes down.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Bus Topology</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → All devices share a single backbone cable, no central hub.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Ring Topology</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Devices connected in a circular path, data travels in one direction.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Mesh Topology</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Every node connected to every other node, no central hub.</span></li></ul>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Who was the founder of the \"Indian Association\" established in Calcutta in 1876, which acted as one of the most important precursor political organizations to the Indian National Congress?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Gopal Krishna Gokhale</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Womesh Chandra Bonnerjee</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Dadabhai Naoroji</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Surendranath Banerjee</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>Surendranath Banerjee</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Indian Association</span><span style=\"font-family:Cambria;font-size:12pt\"> was founded in </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">1876</span><span style=\"font-family:Cambria;font-size:12pt\"> in Calcutta by </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Surendranath Banerjee</span><span style=\"font-family:Cambria;font-size:12pt\"> along with </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Anandamohan Bose</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">It was one of the most important </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">precursor political organizations</span><span style=\"font-family:Cambria;font-size:12pt\"> to the Indian National Congress.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Objectives:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">To create a </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">common political platform</span><span style=\"font-family:Cambria;font-size:12pt\"> for educated Indians.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">To demand reforms in the civil services and greater Indian representation in administration.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">To mobilize public opinion against colonial policies.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The Association played a key role in organizing political agitation and later merged its efforts with the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Indian National Congress (INC)</span><span style=\"font-family:Cambria;font-size:12pt\"> after 1885.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Gopal Krishna Gokhale</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Founded the Servants of India Society in 1905, not the Indian Association.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Womesh Chandra Bonnerjee</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → First President of INC in 1885, not founder of Indian Association.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Dadabhai Naoroji</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Known as the Grand Old Man of India, co-founder of INC, but not Indian Association.</span></li></ul>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which agricultural scientist was awarded the Bharat Ratna posthumously in 2024 for his role in the Green Revolution?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M S Swaminathan</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Verghese Kurien</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Norman Borlaug</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Vikram Sarabhai</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>M. S. Swaminathan</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">In </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">2024</span><span style=\"font-family:Cambria;font-size:12pt\">, renowned agricultural scientist </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">M. S. Swaminathan</span><span style=\"font-family:Cambria;font-size:12pt\"> was awarded the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Bharat Ratna posthumously</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">He is widely known as the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">“Father of India’s Green Revolution”</span><span style=\"font-family:Cambria;font-size:12pt\">, for introducing </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">High-Yielding Variety (HYV) seeds</span><span style=\"font-family:Cambria;font-size:12pt\"> of wheat and rice in the 1960s–70s.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">His work, in collaboration with Norman Borlaug, transformed India from a food-deficient nation into a </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">self-sufficient food grain producer</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The award recognized his </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">lifelong contribution to agricultural science, food security, and rural development</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Verghese Kurien</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Known as the Father of White Revolution (milk revolution), but not awarded Bharat Ratna.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Norman Borlaug</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → American scientist, key figure in global Green Revolution, but not an Indian Bharat Ratna awardee.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Vikram Sarabhai</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Father of India’s Space Programme, but not linked to Green Revolution.</span></li></ul>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which generation of modern computers integrated the breakthrough electronic component known as \"Integrated Circuits\" (ICs) for the first time, replacing bulky transistors?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First Generation</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Second Generation</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Third Generation</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Fourth Generation</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: Third Generation</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Third Generation of Computers</span><span style=\"font-family:Cambria;font-size:12pt\"> (mid-1960s to early 1970s) introduced </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Integrated Circuits (ICs)</span><span style=\"font-family:Cambria;font-size:12pt\">, which replaced bulky transistors.</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">ICs allowed multiple electronic components (transistors, resistors, capacitors) to be fabricated on a single silicon chip.</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">This breakthrough made computers:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Smaller in size</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Faster in processing</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">More reliable and energy-efficient</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Cheaper to produce</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">First Generation (1940s–1950s)</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Used </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">vacuum tubes</span><span style=\"font-family:Cambria;font-size:12pt\">, very large and power-hungry.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Second Generation (1950s–1960s)</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Used </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">transistors</span><span style=\"font-family:Cambria;font-size:12pt\">, smaller and faster than vacuum tubes, but still bulky compared to ICs.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Fourth Generation (1970s onwards)</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Introduced </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">microprocessors</span><span style=\"font-family:Cambria;font-size:12pt\">, integrating thousands of ICs into a single chip.</span></li></ul>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Assertion (A): </span><span>Inflation reduces the purchasing power of money.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Reason (R):</span><span> A general rise in the prices of goods makes the same amount of money buy fewer goods and services.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the most appropriate answer:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both A and R are true, and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both A and R are true, but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A is true, but the R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A is false, but the R is true</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>Both A and R are true, and R is the correct explanation of A</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Assertion (A): Inflation reduces the purchasing power of money</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-family:Cambria;font-size:12pt\"> True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Inflation means prices of goods and services rise over time.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">As a result, the same amount of money can buy fewer goods.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Reason (R): A general rise in the prices of goods makes the same amount of money buy fewer goods and services</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-family:Cambria;font-size:12pt\"> True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">This is exactly why inflation reduces purchasing power.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Example: If ₹100 bought 10 apples last year, and now apples cost ₹12 each, the same ₹100 buys only ~8 apples.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Since </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">R correctly explains A</span><span style=\"font-family:Cambria;font-size:12pt\">, the most appropriate answer is: </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Both A and R are true, and R is the correct explanation of A.</span></li></ul>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The Indian National Congress was founded in which year?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1857</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1875</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1885</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1905</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>1885</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Indian National Congress (INC)</span><span style=\"font-family:Cambria;font-size:12pt\"> was founded in </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">December 1885</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The first session was held in </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Bombay (Mumbai)</span><span style=\"font-family:Cambria;font-size:12pt\">, presided over by </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Womesh Chunder Bonnerjee (W.C. Bonnerjee)</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">It was established by </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Allan Octavian Hume (A.O. Hume)</span><span style=\"font-family:Cambria;font-size:12pt\">, a retired British civil servant, with the aim of providing Indians a platform to voice their political concerns peacefully.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">72 delegates attended the first session, marking the beginning of organized nationalist politics in India.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">1857</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Year of the First War of Independence (Sepoy Mutiny), not INC’s founding.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">1875</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Year of Arya Samaj’s founding by Swami Dayanand Saraswati, not INC.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">1905</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Year of Bengal Partition and Swadeshi Movement, not INC’s founding.</span></li></ul>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which company developed the Windows operating system?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Intel Corp.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Apple Inc</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>IBM Corp.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Microsoft</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>Microsoft</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Windows operating system</span><span style=\"font-family:Cambria;font-size:12pt\"> was developed by </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Microsoft Corporation</span><span style=\"font-family:Cambria;font-size:12pt\">, founded by </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Bill Gates</span><span style=\"font-family:Cambria;font-size:12pt\"> and </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Paul Allen</span><span style=\"font-family:Cambria;font-size:12pt\"> in 1975.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Windows was first released in </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">1985</span><span style=\"font-family:Cambria;font-size:12pt\"> as a graphical operating environment for MS-DOS.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">It evolved into a full-fledged </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">operating system family</span><span style=\"font-family:Cambria;font-size:12pt\">, becoming the most widely used OS for personal computers worldwide.</span></li></ul>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Under the PM Gati Shakti National Master Plan, the Indian Railways in 2025-26 approved 100 expansion projects with how much investment?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹1.21 lakh crore</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹1.53 lakh crore</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹1.77 lakh crore</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹1.95 lakh crore</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In FY2025-26, the Indian Railways approved 100 expansion projects under the PM Gati Shakti National Master Plan with a total investment of ₹1.53 lakh crore, covering over 6,000 km of new lines, doubling, and multitracking works. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Key Details</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Investment Amount:</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">₹1.53 lakh crore</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Projects Approved:</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">100 expansion projects</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Network Coverage:</span><span style=\"font-family:Cambria;font-size:12pt\"> Over </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">6,000 km</span><span style=\"font-family:Cambria;font-size:12pt\"> (new lines, doubling, multitracking, bypasses, flyovers, chord lines).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Growth Compared to FY2024-25:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Projects increased by </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">56%</span><span style=\"font-family:Cambria;font-size:12pt\"> (from 64 to 100).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Route coverage surged by </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">114%</span><span style=\"font-family:Cambria;font-size:12pt\"> (from ~2,800 km to ~6,000 km).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Financial commitment jumped by </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">110%</span><span style=\"font-family:Cambria;font-size:12pt\"> (from ~₹72,869 crore to ₹1.53 lakh crore).</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The voting age in India was lowered from 21 to 18 years by which Constitutional Amendment?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>42nd Amendment</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>44th Amendment</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>61st Amendment</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>73rd Amendment</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: 61st Amendment</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">61st Constitutional Amendment Act, 1989</span><span style=\"font-family:Cambria;font-size:12pt\"> lowered the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">voting age in India from 21 years to 18 years</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">This amendment modified </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Article 326</span><span style=\"font-family:Cambria;font-size:12pt\"> of the Constitution, which deals with elections to the Lok Sabha and State Legislative Assemblies based on adult suffrage.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The rationale was to </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">increase youth participation</span><span style=\"font-family:Cambria;font-size:12pt\"> in the democratic process and strengthen representative governance.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">42nd Amendment (1976)</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Known as the “Mini Constitution,” added Fundamental Duties and strengthened the Directive Principles.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">44th Amendment (1978)</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Restored rights curtailed during Emergency, but did not change voting age.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">73rd Amendment (1992)</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Introduced Panchayati Raj system, not related to voting age.</span></li></ul>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following Indian states share an international boundary with Bangladesh?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. Tripura</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. Meghalaya</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>III. Nagaland</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the correct option:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I and II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only II and III</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I and III</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I, II and III All</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: Only I and II</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Statement I: Tripura shares boundary with Bangladesh</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-family:Cambria;font-size:12pt\"> Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Tripura has a long international border with Bangladesh (~856 km).</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Statement II: Meghalaya shares boundary with Bangladesh</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-family:Cambria;font-size:12pt\"> Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Meghalaya shares about 443 km border with Bangladesh.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Statement III: Nagaland shares boundary with Bangladesh</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> Incorrect.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Nagaland borders Myanmar, not Bangladesh.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which country became India’s largest trading partner in FY2025-26, with total bilateral trade hitting $151.1 billion?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Saudi Arabia</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>United States of America</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>China</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Russia</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">China</span><span> was India’s </span><span style=\"font-weight:bold\">largest trading partner in FY2025-26</span><span>, with total bilateral trade valued at </span><span style=\"font-weight:bold\">$151.1 billion</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">India’s trade with </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">China</span><span style=\"font-family:Cambria;font-size:12pt\"> surged due to imports of electronics, machinery, chemicals, and active pharmaceutical ingredients (APIs).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Exports from India included iron ore, cotton, and petroleum products.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">While the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">United States</span><span style=\"font-family:Cambria;font-size:12pt\"> remains a major partner, in FY2025-26 China overtook it in terms of total trade volume.</span></li></ul>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which planet of our solar system is commonly known as the 'Red Planet'?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Venus</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mars</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Jupiter</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Saturn</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: Mars</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The planet </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Mars</span><span style=\"font-family:Cambria;font-size:12pt\"> is commonly known as the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Red Planet</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Its reddish appearance comes from </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">iron oxide (rust)</span><span style=\"font-family:Cambria;font-size:12pt\"> present on its surface and in its thin atmosphere.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Mars is the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">fourth planet</span><span style=\"font-family:Cambria;font-size:12pt\"> from the Sun and has been a major focus of space exploration due to its similarities with Earth and potential for past water.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Venus</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Known as Earth’s twin or Morning/Evening Star, not the Red Planet.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Jupiter</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Largest planet, called the Gas Giant, not red.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Saturn</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Famous for its rings, not red.</span></li></ul>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The famous painting 'Bharat Mata' was painted by which Indian artist in 1905?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Jamini Roy</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Raja Ravi Verma</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Nandalal Bose</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Abanindranath Tagore</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>Abanindranath Tagore</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The famous painting </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Bharat Mata</span><span style=\"font-family:Cambria;font-size:12pt\"> was created in </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">1905</span><span style=\"font-family:Cambria;font-size:12pt\"> by </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Abanindranath Tagore</span><span style=\"font-family:Cambria;font-size:12pt\">, the nephew of Rabindranath Tagore.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">It depicted Bharat Mata as a saffron-clad woman holding a book, sheaves of paddy, a piece of cloth, and a garland — symbolizing </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">knowledge, food, clothing, and spiritual strength</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">The painting became an </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">icon of the Swadeshi Movement</span><span style=\"font-family:Cambria;font-size:12pt\">, inspiring nationalist sentiment during the partition of Bengal (1905).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt\">Abanindranath Tagore was also the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">founder of the Bengal School of Art</span><span style=\"font-family:Cambria;font-size:12pt\">, which emphasized Indian traditions over Western styles.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Jamini Roy</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Known for folk-inspired modernist paintings, but not Bharat Mata.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Raja Ravi Varma</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Famous for mythological paintings like Shakuntala, but not Bharat Mata.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Nandalal Bose</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> → Disciple of Abanindranath, known for Haripura Posters, but not Bharat Mata.</span></li></ul>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Consider the following statements about Mughal emperor Akbar:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. He ascended the throne at the age of 13.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. He abolished the jizya tax on Muslims.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>III. He founded a religion called Din-i-Ilahi.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the statements given above are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I and II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only II and III</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I and III</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I, II and III All</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Correct Answer: </span><span>Only I and III</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Statement I: He ascended the throne at the age of 13</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-family:Cambria;font-size:12pt\"> Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Akbar became emperor in </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">1556</span><span style=\"font-family:Cambria;font-size:12pt\"> after the death of his father </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Humayun</span><span style=\"font-family:Cambria;font-size:12pt\">, at the young age of </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">13 years</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">His regent </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Bairam Khan</span><span style=\"font-family:Cambria;font-size:12pt\"> initially guided him until he consolidated power.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Statement II: He abolished the jizya tax on Muslims</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"font-family:Cambria;font-size:12pt\"> Incorrect.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">Akbar abolished the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">jizya tax on non-Muslims</span><span style=\"font-family:Cambria;font-size:12pt\"> in </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">1564</span><span style=\"font-family:Cambria;font-size:12pt\">, as part of his inclusive religious policy (Sulh-i-Kul).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">The statement wrongly mentions “on Muslims.”</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Statement III: He founded a religion called Din-i-Ilahi</span><span style=\"font-family:Cambria;font-size:12pt\"> → </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"font-family:Cambria;font-size:12pt\"> Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">In </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">1582</span><span style=\"font-family:Cambria;font-size:12pt\">, Akbar introduced </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Din-i-Ilahi (Religion of God)</span><span style=\"font-family:Cambria;font-size:12pt\">, a syncretic faith blending elements of various religions.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">It was more of an ethical code than a mass religion, and had very few followers.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which country held the presidency of the G20 grouping for the year 2025?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>United States of America</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Brazil</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>South Africa</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Indonesia</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The presidency of the G20 for the year 2025 was held by </span><span style=\"font-weight:bold\">South Africa</span><span>, marking the first time an African nation chaired the grouping. The 2025 </span><span style=\"font-weight:bold\">G20 Leaders’ Summit</span><span> took place in Johannesburg on </span><span style=\"font-weight:bold\">22–23 November 2025</span><span> under </span><span style=\"font-weight:bold\">President Cyril Ramaphosa.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Key Details:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Presidency Term:</span><span style=\"font-family:Cambria;font-size:12pt\"> South Africa assumed the G20 presidency from </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">1 December 2024 to 30 November 2025</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Summit Venue:</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Johannesburg Expo Centre, South Africa</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Summit Dates:</span><span style=\"font-family:Cambria;font-size:12pt\"> </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">22–23 November 2025</span><span style=\"font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Theme:</span><span style=\"font-family:Cambria;font-size:12pt\"> “Solidarity, Equality, Sustainability”.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Significance:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-family:Cambria;font-size:12pt\">First time the </span><span style=\"font-family:Cambria;font-size:12pt;font-weight:bold\">Africa
