 style=\"font-family:'Nirmala UI'\">एस.एस. संधू</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सुशील चंद्रा</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: ज्ञानेश कुमार (Gyanesh Kumar)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">26वें मुख्य चुनाव आयुक्त (CEC)</span><span style=\"font-family:'Nirmala UI'\"> ज्ञानेश कुमार हैं, जिन्होंने फरवरी 2025 में शपथ ली थी।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उन्होंने </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राजीव कुमार</span><span style=\"font-family:'Nirmala UI'\"> (25वें CEC) का स्थान लिया।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मुख्य चुनाव आयुक्त के रूप में, वह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारत निर्वाचन आयोग (ECI)</span><span style=\"font-family:'Nirmala UI'\"> के प्रमुख हैं, जो देश भर में स्वतंत्र और निष्पक्ष चुनाव कराने के लिए जिम्मेदार है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उनका कार्यकाल 2025 के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उपराष्ट्रपति चुनाव</span><span style=\"font-family:'Nirmala UI'\"> और 2026 के विधानसभा चुनावों की तैयारियों से ठीक पहले शुरू हुआ।</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जलवायु परिवर्तन पर पार्टियों का 30वां सम्मेलन (सीओपी30), जो नवंबर 2025 में आयोजित किया गया था, निम्नलिखित शहर में हुआ:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दुबई</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बाकू</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">शर्म अल - शेख</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बेलेम</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: बेलेम (Belem)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">COP30 जलवायु परिवर्तन सम्मेलन</span><span style=\"font-family:'Nirmala UI'\"> नवंबर 2025 में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बेलेम, ब्राजील</span><span style=\"font-family:'Nirmala UI'\"> में आयोजित किया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह महत्वपूर्ण था क्योंकि यह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अमेज़न क्षेत्र</span><span style=\"font-family:'Nirmala UI'\"> में आयोजित होने वाला पहला COP था, जो वैश्विक जलवायु कार्रवाई में वर्षावनों की रक्षा के महत्व पर प्रकाश डालता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुख्य फोकस क्षेत्र:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वनों की कटाई पर नियंत्रण और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अमेज़न संरक्षण</span><span style=\"font-family:'Nirmala UI'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विकासशील देशों के लिए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जलवायु वित्त (Climate finance)</span><span style=\"font-family:'Nirmala UI'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पेरिस समझौते</span><span style=\"font-family:'Nirmala UI'\"> के लक्ष्यों के प्रति प्रतिबद्धताओं को मजबूत करना।</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सांसदों की अयोग्यता के आधार के रूप में 'लाभ का पद' किस अनुच्छेद के अंतर्गत उल्लिखित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 102</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 105</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 110</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 112</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: अनुच्छेद 102 (Article 102)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संसद के सदस्यों (सांसदों) की अयोग्यता के आधार के रूप में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लाभ का पद (Office of Profit)</span><span style=\"font-family:'Nirmala UI'\"> का उल्लेख भारतीय संविधान के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 102(1)(a)</span><span style=\"font-family:'Nirmala UI'\"> के तहत किया गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह बताता है कि कोई व्यक्ति संसद के किसी भी सदन का सदस्य चुने जाने के लिए और बने रहने के लिए अयोग्य होगा, यदि वह भारत सरकार या किसी राज्य की सरकार के अधीन कोई </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लाभ का पद</span><span style=\"font-family:'Nirmala UI'\"> धारण करता है (ऐसे पद को छोड़कर जिसे संसद ने कानून द्वारा अयोग्य न ठहराया हो)।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">तर्क:</span><span style=\"font-family:'Nirmala UI'\"> यह सांसदों के कार्यकारी प्रभाव से स्वतंत्र रहने को सुनिश्चित करके </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हितों के टकराव (Conflict of interest)</span><span style=\"font-family:'Nirmala UI'\"> को रोकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प क्यों गलत हैं</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 105 (Article 105)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सांसदों की शक्तियों, विशेषाधिकारों और उन्मुक्तियों (immunities) से संबंधित है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 110 (Article 110)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">धन विधेयक (Money Bill)</span><span style=\"font-family:'Nirmala UI'\"> को परिभाषित करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 112 (Article 112)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">वार्षिक वित्तीय विवरण (केंद्रीय बजट)</span><span style=\"font-family:'Nirmala UI'\"> से संबंधित है।</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विंटन सर्फ को रॉबर्ट कान के साथ मिलकर किस मूलभूत प्रोटोकॉल को डिजाइन करने के लिए व्यापक रूप से 'इंटरनेट का जनक' माना जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">HTTP/HTTPS प्रोटोकॉल</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">TCP/IP प्रोटोकॉल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">FTP/SFTP प्रोटोकॉल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">SMTP/POP प्रोटोकॉल</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: TCP/IP प्रोटोकॉल (TCP/IP protocol)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विंटन सर्फ़ (Vinton Cerf)</span><span style=\"font-family:'Nirmala UI'\"> और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रॉबर्ट कान (Robert Kahn)</span><span style=\"font-family:'Nirmala UI'\"> को 1970 के दशक में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">TCP/IP प्रोटोकॉल</span><span style=\"font-family:'Nirmala UI'\"> डिजाइन करने के लिए व्यापक रूप से \"इंटरनेट के जनक\" के रूप में माना जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">TCP/IP (ट्रांसमिशन कंट्रोल प्रोटोकॉल / इंटरनेट प्रोटोकॉल)</span><span style=\"font-family:'Nirmala UI'\"> मौलिक संचार प्रोटोकॉल सूट बन गया जो कंप्यूटर और नेटवर्क को आपस में जोड़ने और डेटा का विश्वसनीय रूप से आदान-प्रदान करने की अनुमति देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसे आधिकारिक तौर पर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1 जनवरी, 1983</span><span style=\"font-family:'Nirmala UI'\"> को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ARPANET</span><span style=\"font-family:'Nirmala UI'\"> द्वारा अपनाया गया था, जो आधुनिक इंटरनेट के वास्तविक जन्म का प्रतीक था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प क्यों गलत हैं</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">HTTP/HTTPS प्रोटोकॉल</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> बाद में (1990 के दशक में) </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">टिम बर्नर्स-ली</span><span style=\"font-family:'Nirmala UI'\"> द्वारा वर्ल्ड वाइड वेब (WWW) के लिए विकसित किया गया था, न कि इंटरनेट की नींव के लिए।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">FTP/SFTP प्रोटोकॉल</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> फ़ाइल स्थानांतरण के लिए उपयोग किया जाता है, लेकिन इंटरनेट का मुख्य प्रोटोकॉल नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">SMTP/POP प्रोटोकॉल</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> ईमेल संचार प्रोटोकॉल हैं, न कि मौलिक इंटरनेट प्रोटोकॉल।</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मानव शरीर में पाई जाने वाली सबसे लंबी हड्डी है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">टिबिया</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">फिबुला</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">फीमर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ह्यूमरस</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: फीमर (Femur)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">फीमर</span><span style=\"font-family:'Nirmala UI'\">, जिसे जांघ की हड्डी भी कहा जाता है, मानव शरीर की सबसे लंबी और सबसे मजबूत हड्डी है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह कूल्हे के जोड़ से लेकर घुटने के जोड़ तक फैली होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वयस्कों में औसत लंबाई: लगभग </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">19 इंच (48 सेमी)</span><span style=\"font-family:'Nirmala UI'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कार्य:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">खड़े होने, चलने और दौड़ने के दौरान शरीर के वजन का समर्थन करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कूल्हे और जांघ की प्रमुख मांसपेशियों के लिए लगाव बिंदु (attachment points) प्रदान करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गति (locomotion) और संतुलन में महत्वपूर्ण भूमिका निभाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प क्यों गलत हैं</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">टिबिया (Tibia)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> पिंडली की हड्डी; दूसरी सबसे लंबी हड्डी, लेकिन फीमर से छोटी।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">फिबुला (Fibula)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> टिबिया के समानांतर चलती है, पतली और छोटी होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ह्यूमरस (Humerus)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> ऊपरी बांह की हड्डी; लंबी है लेकिन सबसे लंबी नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">फीमर (Femur)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; मानव शरीर की सबसे लंबी हड्डी।</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नवंबर 1951 में गठित भारत के पहले वित्त आयोग की अध्यक्षता निम्न व्यक्ति ने की थी:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">के. संथानम </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">के. सी. नियोगी </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">महावीर त्यागी </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वाई बी चव्हाण</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> भारत के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पहले वित्त आयोग</span><span style=\"font-family:'Nirmala UI'\"> का गठन नवंबर 1951 में किया गया था, जिसकी अध्यक्षता </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">क्षितिश चंद्र नियोगी (K. C. Neogy)</span><span style=\"font-family:'Nirmala UI'\"> ने की थी। उन्होंने 1951-1952 तक आयोग का नेतृत्व किया और संघ और राज्यों के बीच राजस्व वितरण पर सिफारिशें दीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पहले वित्त आयोग की स्थापना भारत के राष्ट्रपति द्वारा नवंबर 1951 में संविधान के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 280</span><span style=\"font-family:'Nirmala UI'\"> के तहत की गई थी।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अध्यक्ष:</span><span style=\"font-family:'Nirmala UI'\"> के. सी. नियोगी, एक प्रतिष्ठित सांसद और अर्थशास्त्री।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कार्यकाल:</span><span style=\"font-family:'Nirmala UI'\"> 1952-1957।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सदस्यों में शामिल थे:</span><span style=\"font-family:'Nirmala UI'\"> वी. पी. मेनन (बाद में इस्तीफा दे दिया), न्यायमूर्ति आर. कौशलेन्द्र राव, बी. के. मदा, एम. वी. रंगाचारी (सदस्य सचिव)।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रमुख सिफारिशें:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राज्यों को आयकर का </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">55%</span><span style=\"font-family:'Nirmala UI'\"> हिस्सा मिलना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केंद्रीय उत्पाद शुल्क: 3 वस्तुओं पर 40%, 8 वस्तुओं पर 25% और 35 वस्तुओं पर 20% का वितरण।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राज्यों के बीच क्षैतिज वितरण में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जनसंख्या (80%)</span><span style=\"font-family:'Nirmala UI'\"> को अत्यधिक महत्व दिया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 273 के तहत असम, बिहार, उड़ीसा और पश्चिम बंगाल जैसे राज्यों को सहायता अनुदान प्रदान किया गया।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केंद्र सरकार द्वारा सभी सिफारिशें स्वीकार कर ली गईं, जिससे भविष्य के वित्त आयोगों के लिए एक मिसाल कायम हुई।</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2011 की जनगणना के अनुसार, किस भारतीय राज्य में जनसंख्या की 'दशकीय वृद्धि दर' सबसे अधिक दर्ज की गई?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बिहार</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पश्चिम बंगाल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मेघालय</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उत्तर प्रदेश</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारत की 2011 की जनगणना</span><span style=\"font-family:'Nirmala UI'\"> के अनुसार, जिस राज्य ने जनसंख्या की सबसे अधिक दशकीय वृद्धि दर दर्ज की, वह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मेघालय</span><span style=\"font-family:'Nirmala UI'\"> था, जिसकी वृद्धि दर लगभग </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">27.95%</span><span style=\"font-family:'Nirmala UI'\"> थी।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत की 2011 की जनगणना में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">17.64% (2001-2011)</span><span style=\"font-family:'Nirmala UI'\"> की राष्ट्रीय दशकीय वृद्धि दर दर्ज की गई, जो पिछले दशक के 21.54% से कम थी।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय राज्यों में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मेघालय</span><span style=\"font-family:'Nirmala UI'\"> ने सबसे अधिक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">27.95%</span><span style=\"font-family:'Nirmala UI'\"> की वृद्धि दर दिखाई, जिसकी जनसंख्या 2.31 मिलियन (2001) से बढ़कर 2.96 मिलियन (2011) हो गई।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मेघालय में उच्च वृद्धि के कारण हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जनजातीय समुदायों में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उच्च प्रजनन दर</span><span style=\"font-family:'Nirmala UI'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्वास्थ्य सुविधाओं में सुधार, जिससे मृत्यु दर में कमी आई।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मुख्य रूप से कृषि में लगी ग्रामीण आबादी, जिसमें सीमित बाहरी प्रवास (out-migration) देखा गया।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प क्यों गलत हैं</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बिहार</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> बहुत अधिक वृद्धि (</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">25.07%</span><span style=\"font-family:'Nirmala UI'\">), लेकिन उच्चतम नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पश्चिम बंगाल</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> बहुत कम वृद्धि (</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">13.93%</span><span style=\"font-family:'Nirmala UI'\">), जो राष्ट्रीय औसत से नीचे है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर प्रदेश</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> बड़ी जनसंख्या, लेकिन वृद्धि दर केवल </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">20.09%</span><span style=\"font-family:'Nirmala UI'\">।</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अफ्रीका की सबसे ऊंची चोटी और निष्क्रिय ज्वालामुखी 'माउंट किलिमंजारो' किस देश में स्थित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केन्या</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इथियोपिया</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तंजानिया</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">युगांडा</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: तंजानिया (Tanzania)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">माउंट किलिमंजारो</span><span style=\"font-family:'Nirmala UI'\"> एक सुप्त ज्वालामुखी है और समुद्र तल से </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">5,895 मीटर (19,341 फीट)</span><span style=\"font-family:'Nirmala UI'\"> की ऊंचाई के साथ अफ्रीका की सबसे ऊंची चोटी है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह उत्तरी </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">तंजानिया</span><span style=\"font-family:'Nirmala UI'\"> में, केन्या की सीमा के पास स्थित है, लेकिन पूरी तरह से तंजानियाई क्षेत्र के भीतर है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किलींजारो में तीन ज्वालामुखी शंकु (cones) शामिल हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">किबो (Kibo)</span><span style=\"font-family:'Nirmala UI'\"> (उच्चतम, सुप्त)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मावेंजी (Mawenzi)</span><span style=\"font-family:'Nirmala UI'\"> (कठोर, नष्ट हुआ)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">शिरा (Shira)</span><span style=\"font-family:'Nirmala UI'\"> (विलुप्त)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह एक यूनेस्को विश्व धरोहर स्थल है और एक लोकप्रिय ट्रेकिंग गंतव्य है, जिसे अक्सर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">\"अफ्रीका की छत\"</span><span style=\"font-family:'Nirmala UI'\"> कहा जाता है।</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा एकमात्र अधिकारी है जिसे नियंत्रक एवं महालेखा परीक्षक को हटाने का अधिकार प्राप्त है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रधानमंत्री</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के मुख्य न्यायाधीश</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संसद</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राष्ट्रपति</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: राष्ट्रपति (The President)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नियंत्रक एवं महालेखा परीक्षक (CAG)</span><span style=\"font-family:'Nirmala UI'\"> की नियुक्ति संविधान के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 148</span><span style=\"font-family:'Nirmala UI'\"> के तहत भारत के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राष्ट्रपति</span><span style=\"font-family:'Nirmala UI'\"> द्वारा की जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">CAG को केवल राष्ट्रपति द्वारा ही हटाया जा सकता है, लेकिन इसकी प्रक्रिया वैसी ही है जैसे कि </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उच्चतम न्यायालय के न्यायाधीश</span><span style=\"font-family:'Nirmala UI'\"> को हटाने की होती है:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हटाने के लिए संसद के दोनों सदनों के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विशेष बहुमत</span><span style=\"font-family:'Nirmala UI'\"> की आवश्यकता होती है, जो सिद्ध कदाचार या अक्षमता के आधार पर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक बार जब संसद प्रस्ताव पारित कर देती है, तो राष्ट्रपति औपचारिक रूप से CAG को हटा देते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह सुरक्षा उपाय CAG की स्वतंत्रता सुनिश्चित करता है, जिससे कार्यपालिका द्वारा मनमानी बर्खास्तगी को रोका जा सके।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">'एक्सरसाइज डेजर्ट नाइट' 2024 भारत, फ्रांस और किस अन्य देश के बीच आयोजित एक संयुक्त हवाई अभ्यास था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संयुक्त अरब अमीरात</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सऊदी अरब</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ओमान</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कुवैत</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> सही उत्तर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">UAE (संयुक्त अरब अमीरात)</span><span style=\"font-family:'Nirmala UI'\"> है। </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अभ्यास डेजर्ट नाइट 2024</span><span style=\"font-family:'Nirmala UI'\"> भारत, फ्रांस और संयुक्त अरब अमीरात (UAE) के बीच आयोजित एक त्रिपक्षीय हवाई युद्ध अभ्यास था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अभ्यास डेजर्ट नाइट 2024</span><span style=\"font-family:'Nirmala UI'\"> जनवरी 2024 में आयोजित किया गया था, जिसमें </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारतीय वायु सेना (IAF)</span><span style=\"font-family:'Nirmala UI'\">, फ्रांसीसी वायु और अंतरिक्ष बल (FASF) और UAE वायु सेना शामिल थी।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्थान:</span><span style=\"font-family:'Nirmala UI'\"> यह अभ्यास </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अरब सागर</span><span style=\"font-family:'Nirmala UI'\"> के ऊपर और भारत के अड्डों और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अल धफरा एयर बेस (UAE)</span><span style=\"font-family:'Nirmala UI'\"> से आयोजित किया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रतिभागी विमान:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Su-30 MKI, MiG-29, जगुआर, AWACS, C-130J, IL-78</span><span style=\"font-family:'Nirmala UI'\"> रिफ्यूलर।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">फ्रांस: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राफेल</span><span style=\"font-family:'Nirmala UI'\"> लड़ाकू जेट, मल्टी रोल टैंकर ट्रांसपोर्ट (</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">MRTT</span><span style=\"font-family:'Nirmala UI'\">)।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">UAE: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">F-16</span><span style=\"font-family:'Nirmala UI'\"> लड़ाकू विमान।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उद्देश्य:</span><span style=\"font-family:'Nirmala UI'\"> तीनों वायु सेनाओं के बीच तालमेल, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अंतःक्रियाशीलता (interoperability)</span><span style=\"font-family:'Nirmala UI'\"> और युद्ध की तैयारी को बढ़ाना।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह अभ्यास </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारत-फ्रांस-UAE त्रिपक्षीय ढांचे</span><span style=\"font-family:'Nirmala UI'\"> (2022 में स्थापित) पर आधारित है, जो भारत-प्रशांत और फारस की खाड़ी क्षेत्रों में रक्षा, ऊर्जा और रणनीतिक सहयोग पर केंद्रित है।</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लोकसभा के प्रति मंत्रिपरिषद की 'सामूहिक उत्तरदायित्व' का सिद्धांत निम्नलिखित में निहित है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 74</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 75</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 78</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 88</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: अनुच्छेद 75 (Article 75)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लोकसभा के प्रति मंत्रिपरिषद की </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सामूहिक जिम्मेदारी (Collective Responsibility)</span><span style=\"font-family:'Nirmala UI'\"> का सिद्धांत भारतीय संविधान के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 75(3)</span><span style=\"font-family:'Nirmala UI'\"> में निहित है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह कहता है: \"मंत्रिपरिषद सामूहिक रूप से </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लोकसभा (House of the People)</span><span style=\"font-family:'Nirmala UI'\"> के प्रति उत्तरदायी होगी।\"</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अर्थ:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मंत्रिपरिषद प्रधानमंत्री के नेतृत्व में एक टीम के रूप में कार्य करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यदि लोकसभा </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अविश्वास प्रस्ताव (no-confidence motion)</span><span style=\"font-family:'Nirmala UI'\"> पारित करती है, तो पूरी मंत्रिपरिषद को इस्तीफा देना होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक मंत्री द्वारा लिए गए निर्णयों को पूरी परिषद का निर्णय माना जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह कार्रवाई की एकता और विधायिका के प्रति कार्यपालिका की जवाबदेही सुनिश्चित करता है, जो संसदीय लोकतंत्र का आधारशिला है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प क्यों गलत हैं</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 74 (Article 74)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> राष्ट्रपति को सहायता और सलाह देने के लिए मंत्रिपरिषद के अस्तित्व से संबंधित है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 78 (Article 78)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> राष्ट्रपति और मंत्रिपरिषद के बीच संचार के संबंध में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रधानमंत्री के कर्तव्यों</span><span style=\"font-family:'Nirmala UI'\"> को निर्धारित करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 88 (Article 88)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> मंत्रियों और महान्यायवादी (Attorney General) को संसद की कार्यवाही में भाग लेने का अधिकार देता है, लेकिन वोट देने का नहीं।</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वैज्ञानिक और इंजीनियरिंग अनुप्रयोगों के लिए विकसित की जाने वाली पहली उच्च-स्तरीय प्रोग्रामिंग भाषा कौन सी थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">PASCAL</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">COBOL</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">PYTHON</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">FORTRAN</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: FORTRAN</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">FORTRAN (Formula Translation)</span><span style=\"font-family:'Nirmala UI'\"> वैज्ञानिक और इंजीनियरिंग अनुप्रयोगों के लिए विकसित की गई पहली उच्च-स्तरीय प्रोग्रामिंग भाषा थी।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकास का वर्ष:</span><span style=\"font-family:'Nirmala UI'\"> 1957, आईबीएम (IBM) में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जॉन बैकस</span><span style=\"font-family:'Nirmala UI'\"> और उनकी टीम द्वारा।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उद्देश्य:</span><span style=\"font-family:'Nirmala UI'\"> जटिल गणितीय और वैज्ञानिक गणनाओं को सरल बनाना, जिससे इंजीनियरों और वैज्ञानिकों के लिए मशीन कोड की आवश्यकता के बिना प्रोग्रामिंग सुलभ हो सके।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रमुख विशेषताएं:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संख्यात्मक और गणितीय संचालन के लिए मजबूत समर्थन।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वैज्ञानिक गणनाओं के लिए कुशल निष्पादन गति।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एयरोस्पेस, भौतिकी सिमुलेशन, मौसम पूर्वानुमान और इंजीनियरिंग मॉडल में व्यापक रूप से उपयोग किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प क्यों गलत हैं</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">PASCAL</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> 1970 में मुख्य रूप से प्रोग्रामिंग अवधारणाओं को सिखाने के लिए पेश किया गया था, न कि वैज्ञानिक कंप्यूटिंग के लिए।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">COBOL</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> 1959 में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्यावसायिक अनुप्रयोगों</span><span style=\"font-family:'Nirmala UI'\"> (वित्त, प्रशासन) के लिए विकसित किया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">PYTHON</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> 1991 में बनाया गया, आज एआई और डेटा साइंस में व्यापक रूप से उपयोग किया जाता है, लेकिन यह पहली भाषा नहीं थी।</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पृथ्वी के घूर्णन पर हवाओं और समुद्री धाराओं को विक्षेपित करने वाला कोरिओलिस बल इस प्रकार है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भूमध्य रेखा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><s mily:'Nirmala UI'\"> द्वारा लिखी गई थी।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">2005</span><span style=\"font-family:'Nirmala UI'\"> में प्रकाशित, यह निबंधों का एक संग्रह है जो भारत की सार्वजनिक बहस, बौद्धिक बहुलवाद और सांस्कृतिक विविधता की लंबी परंपरा की खोज करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· सेन का तर्क है कि भारत के लोकतांत्रिक और धर्मनिरपेक्ष मूल्य संवाद और तर्क की इसकी ऐतिहासिक परंपराओं में गहराई से निहित हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· यह पुस्तक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पहचान, इतिहास, संस्कृति और वैश्वीकरण</span><span style=\"font-family:'Nirmala UI'\"> जैसे विषयों को कवर करती है, जो इसे आधुनिक भारत को समझने के लिए अत्यधिक प्रासंगिक बनाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प क्यों गलत हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सुनील खिलनानी</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">द आइडिया ऑफ इंडिया (1997)</span><span style=\"font-family:'Nirmala UI'\"> के लेखक हैं, द आर्गुमेंटेटिव इंडियन के नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">शशि थरूर</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> उन्होंने </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">इंडिया: फ्रॉम मिडनाइट टू द मिलेनियम (1997)</span><span style=\"font-family:'Nirmala UI'\"> लिखी थी, यह पुस्तक नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रामचंद्र गुहा</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> उन्होंने </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">इंडिया आफ्टर गांधी (2007)</span><span style=\"font-family:'Nirmala UI'\"> लिखी थी, जो स्वतंत्रता के बाद का इतिहास है।</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किस नेटवर्क टोपोलॉजी में एक केंद्रीय हब या स्विच सभी नोड्स से जुड़ा होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रिंग</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बस</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्टार</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मेश</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: Star (स्टार)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Star topology</span><span style=\"font-family:'Nirmala UI'\"> में, सभी डिवाइस (नोड्स) एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">केंद्रीय हब (hub) या स्विच</span><span style=\"font-family:'Nirmala UI'\"> से जुड़े होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हब एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नियंत्रक (controller)</span><span style=\"font-family:'Nirmala UI'\"> के रूप में कार्य करता है, जो नोड्स के बीच डेटा ट्रांसमिशन का प्रबंधन करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यदि </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एक कनेक्शन विफल</span><span style=\"font-family:'Nirmala UI'\"> हो जाता है, तो यह बाकी नेटवर्क को प्रभावित नहीं करता है, लेकिन यदि </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हब विफल</span><span style=\"font-family:'Nirmala UI'\"> हो जाता है, तो पूरा नेटवर्क बंद हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह टोपोलॉजी </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">LANs (Local Area Networks)</span><span style=\"font-family:'Nirmala UI'\"> में व्यापक रूप से उपयोग की जाती है क्योंकि इसे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्थापित करना, प्रबंधित करना और समस्या निवारण (troubleshoot)</span><span style=\"font-family:'Nirmala UI'\"> करना आसान है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Ring</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> डिवाइस एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">वृत्ताकार पथ (circular path)</span><span style=\"font-family:'Nirmala UI'\"> में जुड़े होते हैं; कोई केंद्रीय हब नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Bus</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सभी डिवाइस एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एकल बैकबोन केबल (single backbone cable)</span><span style=\"font-family:'Nirmala UI'\"> साझा करते हैं; कोई हब नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Mesh</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span
