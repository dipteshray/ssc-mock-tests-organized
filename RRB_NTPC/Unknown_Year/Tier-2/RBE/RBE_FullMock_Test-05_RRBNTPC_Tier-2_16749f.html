t:bold;font-family:'Nirmala UI'\">उपविजेता:</span><span style=\"font-family:'Nirmala UI'\"> न्यूजीलैंड</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्लेयर ऑफ द टूर्नामेंट:</span><span style=\"font-family:'Nirmala UI'\"> रचिन रवींद्र (न्यूजीलैंड)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सर्वाधिक रन:</span><span style=\"font-family:'Nirmala UI'\"> रचिन रवींद्र (263 रन)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सर्वाधिक विकेट:</span><span style=\"font-family:'Nirmala UI'\"> मैट हेनरी (10 विकेट)</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">महाभारत का प्रसिद्ध फारसी अनुवाद, \"रज़्मनामा\", किसके शासनकाल में तैयार किया गया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हुमायूं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अकबर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जहांगीर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">शाहजहाँ</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: अकबर (Akbar)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">महाभारत का प्रसिद्ध फारसी अनुवाद, जिसे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रज्मनामा (Razmnama)</span><span style=\"font-family:'Nirmala UI'\"> के नाम से जाना जाता है (जिसका अर्थ है \"युद्ध की पुस्तक\"), मुगल सम्राट </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अकबर</span><span style=\"font-family:'Nirmala UI'\"> द्वारा 1582 में शुरू करवाया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अकबर ने 1574 के आसपास </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">फतेहपुर सीकरी</span><span style=\"font-family:'Nirmala UI'\"> में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मकतब खाना (Maktab Khana)</span><span style=\"font-family:'Nirmala UI'\"> नामक एक अनुवाद ब्यूरो की स्थापना की थी, ताकि महाभारत जैसे महत्वपूर्ण संस्कृत ग्रंथों का फारसी में अनुवाद किया जा सके और अपने साम्राज्य में सांस्कृतिक एकीकरण को बढ़ावा दिया जा सके।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह परियोजना अकबर के शासनकाल (1556-1605) के दौरान </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">फैजी और अब्दुल कादिर बदायुनी</span><span style=\"font-family:'Nirmala UI'\"> जैसे विद्वानों द्वारा पूरी की गई थी।</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उत्तरी भारत का “भाबर” क्षेत्र निम्नलिखित विशेषताओं से युक्त है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">काली कपास मिट्टी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दलदली निचले मैदानी इलाके</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डेल्टा जलोढ़ निक्षेप</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कंकड़ युक्त छिद्रयुक्त पट्टी</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: कंकड़-युक्त छिद्रपूर्ण पट्टी (Pebble-rich porous belt)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भाबर क्षेत्र हिमालय की तलहटी में, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">शिवालिक श्रेणी</span><span style=\"font-family:'Nirmala UI'\"> के ठीक दक्षिण में स्थित है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसकी विशेषता </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मोटे जलोढ़</span><span style=\"font-family:'Nirmala UI'\"> की एक संकीर्ण पट्टी है जिसमें पहाड़ी नदियों द्वारा जमा किए गए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कंकड़, पत्थर और बजरी</span><span style=\"font-family:'Nirmala UI'\"> शामिल होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चूंकि मिट्टी </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">छिद्रपूर्ण (porous)</span><span style=\"font-family:'Nirmala UI'\"> होती है, इसलिए नदियाँ अक्सर इस पट्टी में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भूमिगत होकर गायब</span><span style=\"font-family:'Nirmala UI'\"> हो जाती हैं और आगे दक्षिण में तराई क्षेत्र में फिर से प्रकट होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">चौड़ाई:</span><span style=\"font-family:'Nirmala UI'\"> लगभग 8-16 किमी।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह अनूठी विशेषता भाबर को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">खेती के लिए अनुपयुक्त</span><span style=\"font-family:'Nirmala UI'\"> बनाती है, इसके विपरीत इसके बाद आने वाले उपजाऊ तराई के मैदान खेती के लिए उपयुक्त होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">काली कपास मिट्टी (Black cotton soil)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> यह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दक्कन के पठार</span><span style=\"font-family:'Nirmala UI'\"> में पाई जाती है, हिमालय की तलहटी में नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दलदली निचले मैदान (Marshy lowland plains)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> यह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">तराई क्षेत्र</span><span style=\"font-family:'Nirmala UI'\"> को संदर्भित करता है, भाबर को नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">डेल्टाई जलोढ़ निक्षेप (Deltaic alluvial deposits)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> ये </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नदी डेल्टा</span><span style=\"font-family:'Nirmala UI'\"> (जैसे गंगा-ब्रह्मपुत्र डेल्टा) में पाए जाते हैं, भाबर में नहीं।</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सेल्सियस पैमाने पर परम शून्य तापमान का संख्यात्मक मान लगभग है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">-100.15 °C</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">-173.15 °C</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">-273.15 °C</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">-373.15 °C</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: -273.15 °C</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">परम शून्य (Absolute zero)</span><span style=\"font-family:'Nirmala UI'\"> सबसे कम संभव तापमान है, जहाँ सैद्धांतिक रूप से सभी कणों की गति रुक जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सेल्सियस स्केल</span><span style=\"font-family:'Nirmala UI'\"> पर, परम शून्य लगभग </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">-273.15 °C</span><span style=\"font-family:'Nirmala UI'\"> होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">केल्विन स्केल</span><span style=\"font-family:'Nirmala UI'\"> पर, परम शून्य को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">0 K</span><span style=\"font-family:'Nirmala UI'\"> के रूप में परिभाषित किया गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">फारेनहाइट स्केल</span><span style=\"font-family:'Nirmala UI'\"> पर, यह लगभग </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">-459.67 °F</span><span style=\"font-family:'Nirmala UI'\"> के बराबर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह मान </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ऊष्मागतिकी (thermodynamics)</span><span style=\"font-family:'Nirmala UI'\"> में मौलिक है और केल्विन स्केल के शुरुआती बिंदु को चिह्नित करता है।</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सन् 1659 की प्रसिद्ध 'प्रतापगढ़ किला घटना', जिसमें शिवाजी ने बीजापुरी सेनापति को मार डाला था, में कौन सा सेनापति शामिल था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दिलेर खान</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जय सिंह</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">शाइस्ता खान </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अफ़ज़ल खान</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: अफजल खान (Afzal Khan)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रतापगढ़ किले की घटना</span><span style=\"font-family:'Nirmala UI'\"> 1659 में प्रतापगढ़ किले (सतारा, महाराष्ट्र के पास) में हुई थी।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसमें </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">छत्रपति शिवाजी महाराज</span><span style=\"font-family:'Nirmala UI'\"> और बीजापुर के सेनापति </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अफजल खान</span><span style=\"font-family:'Nirmala UI'\"> शामिल थे।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बीजापुर की </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आदिल शाही सल्तनत</span><span style=\"font-family:'Nirmala UI'\"> द्वारा भेजे गए अफजल खान ने शिवाजी की बढ़ती शक्ति को कुचलने का प्रयास किया था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बातचीत के लिए आयोजित एक बैठक के दौरान, अफजल खान ने शिवाजी पर हमला करने की कोशिश की।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">शिवाजी ने छिपे हुए हथियारों (</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बाघ नख</span><span style=\"font-family:'Nirmala UI'\"> और एक खंजर) के साथ तैयार होकर आत्मरक्षा में अफजल खान को मार डाला।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इस घटना ने शिवाजी की प्रतिष्ठा बढ़ाई और बीजापुर सल्तनत के खिलाफ मराठा संघर्ष में एक महत्वपूर्ण मोड़ साबित हुई।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दिलेर खान</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> मुगल सेनापति, जो प्रतापगढ़ की घटना में शामिल नहीं था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जय सिंह</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> मुगल कमांडर जिसने बाद में शिवाजी के खिलाफ अभियानों का नेतृत्व किया, लेकिन इस घटना का हिस्सा नहीं था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">शाइस्ता खान</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> दक्कन का मुगल सूबेदार, जिसे शिवाजी ने पुणे (1663) में हराया था, न कि प्रतापगढ़ में।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अफजल खान</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; बीजापुर का सेनापति जिसे 1659 में प्रतापगढ़ में शिवाजी ने मार गिराया था।</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा विकल्प मेमोरी इकाइयों को घटती एक्सेस गति के क्रम में (सबसे तेज़ पहले) सही ढंग से व्यवस्थित करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कैश, रजिस्टर, रैम, डिस्क</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रजिस्टर, कैश, रैम, डिस्क</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रैम, रजिस्टर, कैश, डिस्क</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रजिस्टर, रैम, कैश, डिस्क</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: Register, Cache, RAM, Disk</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मेमोरी इकाइयों की पहुंच की गति (access speed) उनके भौतिक स्थान और डिजाइन के कारण भिन्न होती है:</span></p><ol type=\"1\"><li style=\"margin-left:14.07pt;margin-bottom:8pt;line-height:108%;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span style=\"font-weight:bold\">Registers</span><span> </span><span style=\"font-family:Arial\">→</span><span> सबसे तेज़, CPU के अंदर स्थित, निष्पादन (execution) के दौरान तत्काल डेटा स्टोरेज के लिए उपयोग किए जाते हैं।</span></li><li style=\"margin-left:14.07pt;margin-bottom:8pt;line-height:108%;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span style=\"font-weight:bold\">Cache</span><span> </span><span style=\"font-family:Arial\">→</span><span> बहुत तेज़, CPU के करीब, RAM एक्सेस समय को कम करने के लिए अक्सर उपयोग किए जाने वाले डेटा को स्टोर करता है।</span></li><li style=\"margin-left:14.07pt;margin-bottom:8pt;line-height:108%;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span style=\"font-weight:bold\">RAM</span><span> </span><span style=\"font-family:Arial\">→</span><span> मुख्य मेमोरी, कैश और रजिस्टर से धीमी, लेकिन डिस्क से तेज़।</span></li><li style=\"margin-left:14.07pt;margin-bottom:8pt;line-height:108%;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span style=\"font-weight:bold\">Disk</span><span> </span><span style=\"font-family:Arial\">→</span><span> सेकेंडरी स्टोरेज, बहुत धीमी, स्थायी डेटा स्टोरेज के लिए उपयोग की जाती है।</span></li></ol><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अतः, एक्सेस स्पीड के घटते क्रम में सही क्रम है: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Register </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> Cache </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> RAM </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> Disk</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत में विधवा पुनर्विवाह अधिनियम किस वर्ष पारित हुआ था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1829</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1856</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1872</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1891</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: 1856</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हिंदू विधवा पुनर्विवाह अधिनियम (Widow Remarriage Act)</span><span style=\"font-family:'Nirmala UI'\"> 1856 में गवर्नर-जनरल </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लॉर्ड कैनिंग</span><span style=\"font-family:'Nirmala UI'\"> के कार्यकाल के दौरान पारित किया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसे एक महान समाज सुधारक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ईश्वर चंद्र विद्यासागर</span><span style=\"font-family:'Nirmala UI'\"> द्वारा समर्थित किया गया था, जिन्होंने हिंदू समाज में विधवा पुनर्विवाह की पुरजोर वकालत की थी।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अधिनियम ने हिंदू विधवाओं के पुनर्विवाह को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कानूनी मान्यता</span><span style=\"font-family:'Nirmala UI'\"> दी, जिससे उन्हें फिर से शादी करने का अधिकार मिला, हालांकि इसे समाज के कट्टरपंथी वर्गों के कड़े विरोध का सामना करना पड़ा।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह सुधार भारत में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">समाज सुधार आंदोलन</span><span style=\"font-family:'Nirmala UI'\"> में एक मील का पत्थर था, जिसका उद्देश्य महिलाओं का उत्थान करना और प्रतिगामी परंपराओं को चुनौती देना था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1829</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लॉर्ड विलियम बेंटिक</span><span style=\"font-family:'Nirmala UI'\"> द्वारा सती प्रथा के उन्मूलन का वर्ष, विधवा पुनर्विवाह का नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1872</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारतीय विवाह अधिनियम</span><span style=\"font-family:'Nirmala UI'\"> का वर्ष, जिसने अंतर-जातीय और अंतर-धार्मिक विवाहों को कानूनी रूप दिया था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1891</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एज ऑफ कंसेंट एक्ट (सहमति की आयु अधिनियम)</span><span style=\"font-family:'Nirmala UI'\"> का वर्ष, जिसने लड़कियों के लिए सहमति की आयु बढ़ा दी थी।</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बाइनरी संख्या (1101)</span><span style=\"font-family:'Cambria Math'\">₂</span><span style=\"font-family:'Nirmala UI'\"> को दशमलव में परिवर्तित करने पर यह निम्न के बराबर होता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दशमलव 11</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दशमलव 12</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दशमलव 13</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दशमलव 15</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: Decimal 13</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><spa amily:'Cambria Math'\">₂</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> = 15.</span></li></ul>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">फीफा विश्व कप 2026 की संयुक्त मेजबानी निम्नलिखित देशों द्वारा की जानी है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ब्राज़ील, अर्जेंटीना और चिली</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्पेन, पुर्तगाल और मोरक्को</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जर्मनी, फ्रांस और इटली</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कनाडा, मेक्सिको और संयुक्त राज्य अमेरिका</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: कनाडा, मैक्सिको और यूएसए (Canada, Mexico and USA)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">FIFA World Cup 2026</span><span style=\"font-family:'Nirmala UI'\"> तीन देशों: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कनाडा, मैक्सिको और संयुक्त राज्य अमेरिका</span><span style=\"font-family:'Nirmala UI'\"> द्वारा संयुक्त रूप से आयोजित होने वाला पहला संस्करण होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">48 टीमों</span><span style=\"font-family:'Nirmala UI'\"> वाला पहला विश्व कप भी है, जिसे पारंपरिक 32-टीम प्रारूप से विस्तारित किया गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रमुख विशेषताएं:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">USA:</span><span style=\"font-family:'Nirmala UI'\"> अधिकांश मैचों की मेजबानी कर रहा है, जिसमें </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मेटलाइफ स्टेडियम, न्यू जर्सी</span><span style=\"font-family:'Nirmala UI'\"> में होने वाला फाइनल भी शामिल है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मैक्सिको:</span><span style=\"font-family:'Nirmala UI'\"> मैक्सिको सिटी, गुआडालाजारा, मोंटेरे जैसे शहरों में मैचों की मेजबानी कर रहा है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कनाडा:</span><span style=\"font-family:'Nirmala UI'\"> टोरंटो और वैंकूवर में मैचों की मेजबानी कर रहा है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह मैक्सिको की </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">तीसरी बार</span><span style=\"font-family:'Nirmala UI'\"> (1970, 1986), यूएसए की </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दूसरी बार</span><span style=\"font-family:'Nirmala UI'\"> (1994), और कनाडा की </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पहली बार</span><span style=\"font-family:'Nirmala UI'\"> मेजबानी को चिह्नित करता है।</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से किस पदार्थ का उपयोग पेट की अम्लता को कम करने के लिए एंटासिड के रूप में किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मैग्नीशियम हाइड्रॉक्साइड</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सोडियम क्लोराइड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पोटेशियम नाइट्रेट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कैल्शियम सल्फेट</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: मैग्नीशियम हाइड्रॉक्साइड (Magnesium hydroxide)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मैग्नीशियम हाइड्रॉक्साइड</span><span style=\"font-family:'Nirmala UI'\"> का उपयोग आमतौर पर पेट की अतिरिक्त एसिड (HCl) को बेअसर करने और सीने में जलन, अपच और एसिडिटी जैसी स्थितियों से राहत देने के लिए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एंटासिड (antacid)</span><span style=\"font-family:'Nirmala UI'\"> के रूप में किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह पेट में हाइड्रोक्लोरिक एसिड के साथ प्रतिक्रिया करके काम करता है:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1778761918096_image015.png\" width=\"254\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह प्रतिक्रिया </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अम्लता (acidity) को कम करती है</span><span style=\"font-family:'Nirmala UI'\"> और त्वरित राहत प्रदान करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मिल्क ऑफ मैग्नीशिया (milk of magnesia)</span><span style=\"font-family:'Nirmala UI'\"> में सक्रिय घटक (active ingredient) भी है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सोडियम क्लोराइड (Sodium chloride)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> साधारण नमक; यह एंटासिड के रूप में कार्य नहीं करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पोटेशियम नाइट्रेट (Potassium nitrate)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> उर्वरकों और विस्फोटकों में उपयोग किया जाता है, एसिडिटी के लिए नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कैल्शियम सल्फेट (Calcium sulphate)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> निर्माण (प्लास्टर ऑफ पेरिस) में उपयोग किया जाता है, एंटासिड के रूप में नहीं।</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">काराकोरम राजमार्ग (केकेएच), एक रणनीतिक पर्वतीय मार्ग है, जो चीन को किस पड़ोसी देश से जोड़ता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अफ़ग़ानिस्तान</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पाकिस्तान</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तजाकिस्तान </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किर्गिज़स्तान</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: पाकिस्तान (Pakistan)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">काराकोरम हाईवे (KKH)</span><span style=\"font-family:'Nirmala UI'\"> एक रणनीतिक पहाड़ी सड़क है जो चीन को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पाकिस्तान</span><span style=\"font-family:'Nirmala UI'\"> से जोड़ती है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">काराकोरम पर्वत श्रृंखला</span><span style=\"font-family:'Nirmala UI'\"> से होकर गुजरता है, जो चीन के शिनजियांग प्रांत को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गिलगित-बाल्टिस्तान (पाकिस्तान)</span><span style=\"font-family:'Nirmala UI'\"> से जोड़ता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसे अक्सर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">\"मैत्री राजमार्ग\" (Friendship Highway)</span><span style=\"font-family:'Nirmala UI'\"> कहा जाता है, और यह दुनिया की सबसे ऊंची पक्की अंतरराष्ट्रीय सड़कों में से एक है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह राजमार्ग </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">चीन-पाकिस्तान आर्थिक गलियारे (CPEC)</span><span style=\"font-family:'Nirmala UI'\"> का एक महत्वपूर्ण हिस्सा है, जो दोनों देशों के बीच व्यापार और रणनीतिक सहयोग को बढ़ाता है।</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लगभग 150 ईस्वी सन् का रुद्रदमन-प्रथम का जूनागढ़ शिलालेख किस भाषा में रचा गया है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पाली भाषा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्राकृत भाषा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संस्कृत भाषा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तमिल भाषा</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: संस्कृत भाषा (Sanskrit language)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रुद्रदामन प्रथम का </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जूनागढ़ शिलालेख</span><span style=\"font-family:'Nirmala UI'\">, जो लगभग 150 ईस्वी का है, शास्त्रीय संस्कृत के शुरुआती लंबे शिलालेखों में से एक है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रुद्रदामन प्रथम </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पश्चिमी क्षत्रप (शक वंश)</span><span style=\"font-family:'Nirmala UI'\"> का एक शासक था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह शिलालेख महत्वपूर्ण है क्योंकि:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह संस्कृत में पहला प्रमुख </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राजनीतिक शिलालेख</span><span style=\"font-family:'Nirmala UI'\"> है, जो शाही फरमानों के लिए प्राकृत (जैसे अशोक के शिलालेख) का उपयोग करने की पिछली परंपरा से अलग हटकर लिखा गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसमें </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जूनागढ़ की सुदर्शन झील</span><span style=\"font-family:'Nirmala UI'\"> की मरम्मत का उल्लेख है, जो मूल रूप से मौर्य काल के दौरान बनाई गई थी।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह रुद्रदामन की उपलब्धियों, सैन्य विजय और संस्कृति के प्रति उनके संरक्षण पर प्रकाश डालता है।</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पहला सामान्य प्रयोजन वाला प्रोग्रामेबल डिजिटल कंप्यूटर 'ENIAC' 1945 में विकसित किया गया था:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यूनाइटेड किंगडम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जर्मनी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जापान</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संयुक्त राज्य अमेरिका</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: संयुक्त राज्य अमेरिका (United States of America)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ENIAC</span><span style=\"font-family:'Nirmala UI'\"> (इलेक्ट्रॉनिक न्यूमेरिकल इंटीग्रेटर एंड कंप्यूटर) पहला सामान्य प्रयोजन का प्रोग्राम योग्य डिजिटल कंप्यूटर था, जिसे 1945 में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पेंसिल्वेनिया विश्वविद्यालय, यूएसए</span><span style=\"font-family:'Nirmala UI'\"> में विकसित किया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकासकर्ता:</span><span style=\"font-family:'Nirmala UI'\"> जॉन प्रेस्पर एकर्ट और जॉन मौचली।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विशेषताएं:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गणना के लिए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">वैक्यूम ट्यूबों</span><span style=\"font-family:'Nirmala UI'\"> (</span><span style=\"font-family:'Cambria Math'\">≈</span><span style=\"font-family:'Nirmala UI'\">18,000) का उपयोग किया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह प्रति सेकंड 5,000 जोड़ कर सकता था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसे मुख्य रूप से अमेरिकी सेना के लिए तोपखाने फायरिंग टेबल की गणना करने हेतु डिजाइन किया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ENIAC ने आधुनिक कंप्यूटिंग युग की शुरुआत की।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">यूनाइटेड किंगडम</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> यह कोलोसस (Colossus) के लिए जाना जाता है, जिसका उपयोग द्वितीय विश्व युद्ध के दौरान कोड-ब्रेकिंग के लिए किया गया था, न कि ENIAC।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जर्मनी</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> कोनराड ज़ूस ने एक शुरुआती प्रोग्राम योग्य कंप्यूटर Z3 विकसित किया था, लेकिन ENIAC अमेरिकी था।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जापान</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> यहाँ शुरुआती मैकेनिकल कैलकुलेटर थे, लेकिन ENIAC नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">संयुक्त राज्य अमेरिका</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; 1945 में ENIAC का जन्मस्थान।</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">'राइट लाइवलीहुड अवार्ड', जिसे लोकप्रिय रूप से वैकल्पिक नोबेल पुरस्कार के रूप में जाना जाता है, की स्थापना 1980 में निम्नलिखित देश में हुई थी:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नॉर्वे</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्वीडन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्विट्जरलैंड</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डेनमार्क</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: स्वीडन (Sweden)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राइट लाइवलीहुड अवार्ड (Right Livelihood Award)</span><span style=\"font-family:'Nirmala UI'\">, जिसे अक्सर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">वैकल्पिक नोबेल पुरस्कार</span><span style=\"font-family:'Nirmala UI'\"> कहा जाता है, की स्थापना 1980 में परोपकारी जैकब वॉन उक्सकुल द्वारा </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्वीडन</span><span style=\"font-family:'Nirmala UI'\"> में की गई थी।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उद्देश्य:</span><span style=\"font-family:'Nirmala UI'\"> उन व्यक्तियों और संगठनों को सम्मानित करना जो पर्यावरण संरक्षण, मानवाधिकार, सतत विकास और शांति जैसी वैश्विक समस्याओं के लिए व्यावहारिक और अनुकरणीय समाधान प्रदान करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह पुरस्कार प्रतिवर्ष स्टॉकहोम में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्वीडिश संसद (रिक्सडैग)</span><span style=\"font-family:'Nirmala UI'\"> में प्रदान किया जाता है।</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डिजिटल सिग्नल को एनालॉग सिग्नल में और एनालॉग सिग्नल को डिजिटल सिग्नल में बदलने के लिए किस उपकरण का उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राउटर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्विच</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्कैनर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मोडेम</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: Modem (मॉडेम)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">modem</span><span style=\"font-family:'Nirmala UI'\"> (मॉड्यूलेटर-डिमोड्यूलेटर का संक्षिप्त रूप) वह उपकरण है जिसका उपयोग डिजिटल संकेतों (digital signals) को एनालॉग संकेतों (analogue signals) में और इसके विपरीत बदलने के लिए किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कंप्यूटर से डिजिटल संकेतों (बाइनरी डेटा) को टेलीफोन लाइनों या अन्य संचार चैनलों पर प्रसारण के लिए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एनालॉग संकेतों</span><span style=\"font-family:'Nirmala UI'\"> में परिवर्तित किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्राप्त करने वाले छोर पर, मॉडेम एनालॉग संकेतों को वापस </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">डिजिटल रूप</span><span style=\"font-family:'Nirmala UI'\"> में डिमॉड्यूलेट करता है ताकि कंप्यूटर उन्हें संसाधित (process) कर सके।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Router</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> नेटवर्क को जोड़ता है और डेटा पैकेट को निर्देशित करता है, लेकिन डिजिटल-टू-एनालॉग रूपांतरण नहीं करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Switch</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> एक LAN के भीतर उपकरणों को जोड़ता है और MAC एड्रेस के आधार पर डेटा भेजता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Scanner</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> भौतिक दस्तावेजों/छवियों को डिजिटल रूप में बदलता है, संकेतों (signals) को नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Modem</span><span style=\"font-family:'Nirmala UI ांक उन्नयन (Boiling point elevation)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हिमांक अवनमन (Freezing point depression)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">o </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">वाष्प दाब अवनमन (Vapor pressure lowering)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पृष्ठ तनाव (Surface tension)</span><span style=\"font-family:'Nirmala UI'\"> एक अणुसंख्य गुणधर्म नहीं है। यह तरल की प्रकृति और अंतर-आणविक बलों पर निर्भर करता है, न कि केवल विलेय कणों की संख्या पर।</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यदि P का अर्थ ×, Q का अर्थ ÷, R का अर्थ − और S का अर्थ + है, तो मान ज्ञात कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">29 S 9 P 3 R 13 P 4 S 55 = ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">59</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">27</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">83</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">41</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1",
