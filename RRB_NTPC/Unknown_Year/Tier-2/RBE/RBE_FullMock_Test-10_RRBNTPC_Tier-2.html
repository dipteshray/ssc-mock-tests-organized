<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>20.) Reasoning Sectional Mock Test-10 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

 की ऊँचाइयाँ अलग-अलग हैं। R ठीक 4 लोगों से लंबा है। T ठीक 4 लोगों से छोटा है। S, Q से लंबा है। Q, P से लंबा है। P सबसे छोटा नहीं है। P से छोटे कितने लोग हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">क्रम: S&gt;R&gt;Q&gt;P&gt;T&gt;U. </span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">P से छोटे (रैंक 4): T और U = 2 व्यक्ति।</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक प्रश्न के साथ दो कथन (I) और (II) दिए गए हैं। यह तय करें कि प्रश्न का उत्तर देने के लिए दिए गए डेटा पर्याप्त हैं या नहीं।</span></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पाँच व्यक्ति A, B, C, D और E एक सीधी पंक्ति में उत्तर की ओर मुख किए बैठे हैं। अत्यंत बाएँ छोर पर कौन बैठा है?</span></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन I:</span><span style=\"font-family:'Nirmala UI'\"> A और D के बीच ठीक तीन लोग बैठते हैं। B, A के तुरंत बाएँ बैठता है। </span></p><p style=\"margin-top:14pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन II:</span><span style=\"font-family:'Nirmala UI'\"> C, E का तात्कालिक पड़ोसी है। D और C के बीच ठीक एक व्यक्ति बैठता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल कथन I पर्याप्त है; केवल कथन II पर्याप्त नहीं है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल कथन II पर्याप्त है; कथन I अकेले पर्याप्त नहीं है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दोनों कथन साथ</span><span style=\"font-family:'Cambria Math'\">‑</span><span style=\"font-family:'Nirmala UI'\">साथ पर्याप्त हैं, परंतु कोई भी अकेले पर्याप्त नहीं है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दोनों कथन साथ</span><span style=\"font-family:'Cambria Math'\">‑</span><span style=\"font-family:'Nirmala UI'\">साथ भी पर्याप्त नहीं हैं।</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कथन I से: |pos(A)_ _</span><span style=\"font-family:'Nirmala UI'\">  </span><span style=\"font-family:'Nirmala UI'\">_pos(D)| </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> एक pos1 पर, दूसरा pos5 पर। A के तुरंत बाएँ B होने से A</span><span style=\"font-family:'Cambria Math'\">≠</span><span style=\"font-family:'Nirmala UI'\">pos1, अतः A=pos5, B=pos4, D=pos1। D अत्यंत बाएँ सिरे पर है — अद्वितीय रूप से निर्धारित। कथन II से पर्याप्त जानकारी नहीं मिलती।</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक कथन दिया गया है, उसके बाद दो कार्यवाहियाँ दी गई हैं। तय करें कि कौन-सी कार्यवाही तार्किक रूप से अनुसरण करती है/करती हैं।</span></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कथन</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">:</span><span style=\"font-family:'Nirmala UI'\"> शहरी क्षेत्रों में अनेक बुजुर्ग लोग सामुदायिक समर्थन की कमी और अपर्याप्त चिकित्सीय सुविधाओं के कारण अकेलेपन तथा स्वास्थ्य समस्याओं से जूझते हैं।</span></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कार्यवाहियाँ:</span><span style=\"font-family:'Nirmala UI'\"> </span></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. बुजुर्ग नागरिकों के लिए नियमित सामाजिक और स्वास्थ्य-सेवा गतिविधियाँ उपलब्ध कराने हेतु सामुदायिक केंद्र स्थापित किए जाने चाहिए। </span></p><p style=\"margin-top:14pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. सभी बुजुर्गों को तुरंत सरकारी संचालित वृद्धाश्रमों में स्थानांतरित कर देना चाहिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो I और न ही II अनुसरण करती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I अनुसरण करती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I और II दोनों अनुसरण करती हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II अनुसरण करती है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कार्यवाही I सीधे दोनों कारणों—अकेलापन और सामुदायिक समर्थन की कमी—को संबोधित करती है और यह व्यावहारिक व लक्षित समाधान है। </span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कार्यवाही II चरम और अव्यावहारिक है, तथा मदद करने के बजाय स्थिति को बिगाड़ सकती है। अतः केवल I अनुसरण करती है।</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक निश्चित कूट भाषा में: A + B का अर्थ है 'A, B की माता है'। A − B का अर्थ है 'A, B का भाई है'। A × B का अर्थ है 'A, B की पत्नी है'। A ÷ B का अर्थ है 'A, B का पिता है'।</span></p><p style=\"margin-top:14pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्न में से कौन-सा यह दर्शाता है कि R, N का पुत्र है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">M ÷ N × R − S + T</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">M × N − R ÷ S − T</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">M ÷ N + R − S × T</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bo \"> यह एक ऐतिहासिक क्षण था क्योंकि वे इंटरनेशनल बुकर जीतने वाली पहली भारतीय महिला बनीं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुख्य तथ्य</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विजेता (जून 2025):</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बानू मुश्ताक</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कृति:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> Heart Lamp: Selected Stories</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अनुवादक:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> दीपा भास्‍थी (यह महत्त्वपूर्ण है, क्योंकि इंटरनेशनल बुकर अंग्रेज़ी अनुवादित कृतियों का सम्मान करता है)।</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कार्यक्रम:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> मई–जून 2025 में टेट मॉडर्न, लंदन में पुरस्कृत।</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">महत्त्व:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> इंटरनेशनल बुकर प्राइज़ जीतने वाली पहली भारतीय महिला लेखिका; इस उपलब्धि ने भारतीय साहित्य की वैश्विक पहचान को रेखांकित किया।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्पों का स्पष्टीकरण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पेरुमल मुरुगन:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">समकालीन तमिल लेखक; प्रमुख कृतियाँ: Pyre और Estuary।</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">उनका उपन्यास Pyre 2023 में इंटरनेशनल बुकर प्राइज़ की लॉन्गलिस्ट में था, पर विजेता नहीं बना।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">गीतांजलि श्री:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">अपने हिंदी उपन्यास रेत समाधि के लिए </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">2022 में इंटरनेशनल बुकर प्राइज़</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> जीता (अंग्रेज़ी अनुवाद: Tomb %;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">हाथीगुम्फा अभिलेख</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भुवनेश्वर, ओडिशा के निकट उदयगिरि पहाड़ियों</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> की एक गुफा में उत्कीर्ण है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">यह </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राजा खारवेल</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> के शासन का विस्तृत विवरण देता है, जो ईसा पूर्व 1वीं शताब्दी में </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कलिंग</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> के शासक थे।</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">यह अभिलेख उनके सैन्य अभियानों, लोक-कल्याण कार्यों, जैन धर्म के संरक्षण तथा कला और संस्कृति में योगदान को रेखांकित करता है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">प्राचीन ओडिशा के इतिहास तथा जैन परंपराओं के पुनर्निर्माण के लिए यह सबसे महत्वपूर्ण स्रोतों में से एक है।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्पों का स्पष्टीकरण</span></p><ul type=\"disc\" style=\"marg li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">उनका उदयगिरि के हाथीगुम्फा अभिलेख से संबंध नहीं है।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अशोक:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">प्रसिद्ध मौर्य सम्राट (ईसा पूर्व 3वीं शताब्दी), जो संपूर्ण भारत में शिलाओं और स्तंभों पर उत्कीर्ण अपने </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">शिलालेखों</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> के लिए जाने जाते हैं।</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">उनके अभिलेख </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">धम्म</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> तथा बौद्ध मूल्यों का प्रसार करते हैं।</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">हालाँकि अशोक के अभिलेख व्यापक रूप से मिलते हैं, पर हाथीगुम्फा अभिलेख विशेष रूप से </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">खारवेल</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> का है, न कि अशोक का।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत का सर्वोच्च न्यायालय किस तिथि को उद्घाटित किया गया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">15 अगस्त 1947 </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">24 जनवरी 1950</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">26 जनवरी 1950</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">28 जनवरी 1950 </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: 28 जनवरी 1950</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भारत के सर्वोच्च न्यायालय</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> का औपचारिक उद्घाटन </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">28 जनवरी 1950</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> को हुआ, जो भारत के संविधान के प्रभाव में आने (26 जनवरी 1950) के दो दिन बाद था।</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">इसने भारत के सर्वोच्च न्यायिक प्राधिकरण के रूप में भारत का संघीय न्यायालय (</span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Federal Court of India</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">) (1937 में स्थापित) और लंदन स्थित प्रिवी काउंसिल की न्यायिक समिति (</span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Judicial Committee of the Privy Council</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">) का स्थान ले लिया।</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">सर्वोच्च न्यायालय की शुरुआत </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मुख्य न्यायाधीश सहित 8 न्यायाधीशों</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> से हुई थी और तब से इसमें उल्लेखनीय वृद्धि हुई है।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्पों का स्पष्टीकरण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">15 अगस्त 1947:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">भारत को इसी दिन स्वतंत्रता मिली।</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">उस समय सर्वोच्च न्यायालय स्थापित नहीं हुआ था; न्यायिक अधिकार अब भी संघीय न्यायालय और प्रिवी काउंसिल के पास थे।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">24 जनवरी 1950:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">इस दिन </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">संविधान सभा ने संविधान को उसके अंतिम रूप में अंगीकृत किया</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">।</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">इसी दिन </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">डॉ. राजेंद्र प्रसाद भारत के प्रथम राष्ट्रपति निर्वाचित हुए</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">।</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">यह सर्वोच्च न्यायालय का उद्घाटन नहीं था।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">26 जनवरी 1950:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">भारतीय संविधान इसी दिन लागू हुआ, जिससे गणतंत्र का जन्म हुआ।</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">सर्वोच्च न्यायालय का उद्घाटन दो दिन बाद, 28 जनवरी को हुआ।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">WTO के अंतर्गत 'TRIPS' समझौता मुख्यतः किससे संबंधित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वस्त्र (टेक्सटाइल) वस्तुओं का व्यापार</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बौद्धिक संपदा अधिकार</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कृषि सब्सिडी की सीमाएँ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विदेशी निवेश के नियम </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: बौद्धिक संपदा अधिकार</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">TRIPS समझौता</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> (Trade-Related Aspects of Intellectual Property Rights) </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विश्व व्यापार संगठन (WTO)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> के अंतर्गत एक प्रमुख समझौता है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">यह बौद्धिक संपदा (IP) के विभिन्न रूपों—जैसे पेटेंट, कॉपीराइट, ट्रेडमार्क, भौगोलिक संकेत और व्यापार रहस्य—के विनियमन हेतु </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">न्यूनतम मानक</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> निर्धारित करता है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">उद्देश्य सदस्य देशों में IP संरक्षण में एकरूपता लाना है ताकि निष्पक्ष व्यापार और नवाचार को बढ़ावा मिले।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्पों का स्पष्टीकरण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">वस्त्र वस्तुओं का व्यापार:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">यह TRIPS के अंतर्गत नहीं, अन्य WTO समझौतों के अधीन आता है।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कृषि सब्सिडी की सीमाएँ:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">यह </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Agreement on Agriculture (AoA)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> द्वारा शासित है, TRIPS द्वारा नहीं।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विदेशी निवेश के नियम:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">ये व्यापार और निवेश नीतियों से संबंधित हैं, पर TRIPS का केंद्र-बिंदु नहीं हैं।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उच्च वर्षा और उच्च तापमान वाले क्षेत्रों में तीव्र लीचिंग के कारण कौन-सी मिट्टी का निर्माण होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जलोढ़</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">काली</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लैटेराइट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">शुष्क</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margi line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्पों का स्पष्टीकरण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">जलोढ़:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">नदी निक्षेपों से बनी, उर्वर, मैदानों में पाई जाती है—लीचिंग के कारण नहीं।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">काली:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">इसे </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">रेगर मिट्टी (Regur soil)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> भी कहते हैं; ज्वालामुखीय चट्टानों से बनी, चिकनी मिट्टी से भरपूर और कपास के लिए उपयुक्त—लीचिंग-आधारित नहीं।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">शुष्क:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">मरुस्थलीय क्षेत्रों में पाई जाती, रेतीली व शुष्क, वाष्पीकरण के :108%;font-size:12pt;font-family:'Nirmala UI'\">इन्होंने </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">नव-वैष्णव आंदोलन</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> की स्थापना की, जो भगवान कृष्ण के प्रति भक्ति पर बल देता था।</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">इन्होंने </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सत्र</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> (मठ-केंद्र) और </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">नामघर</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> (प्रार्थना-सभागार) स्थापित किए, जो असम में सांस्कृतिक व धार्मिक केंद्र बने।</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">इनका योगदान साहित्य, संगीत (बोरगीत), नाटक (अंकिया नाटक) और सामाजिक सुधार तक फैला, जिसने उन्हें असमिया पहचान का केंद्रीय व्यक्तित्व बना दिया।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्पों का स्पष्टीकरण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">चैतन्य महाप्रभु (1486–1534):</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size: adding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उद्घाटनकर्ता:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> प्रधानमंत्री नरेंद्र मोदी</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">थीम:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> “विकसित भारत 2024 के लिए सुदृढ़ ग्रामीण भारत का निर्माण”</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">आयोजक:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> नाबार्ड (NABARD) एवं संबद्ध भागीदार</span></li></ul>", "question_heading": ""}, {"sr_no": 109, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">‘पीलिया (Jaundice)’ रोग से कौन-सा अंग प्रभावित होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वृक्क (Kidney)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हृदय (Heart)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यकृत (Liver) </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">फेफड़े (Lungs)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: यकृत (Liver)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पीलिया (Jaundice)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> एक स्थिति है जो मुख्यतः </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">यकृत</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> को प्रभावित करती है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">यह तब होता है जब रक्त में </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बिलिरुबिन (Bilirubin)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> की अधिकता हो जाती है (यह एक पीला वर्णक है जो लाल रक्त कणिकाओं के अपघटन के दौरान बनता है)।</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">इसके कारणों में </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">यकृत रोग</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> (जैसे हेपेटाइटिस, सिरोसिस), </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पित्त नली में रुकावट</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">, या लाल रक्त कणिकाओं का अत्यधिक अपघटन शामिल हैं।</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">लक्षण: त्वचा और आंखों का पीला पड़ना, गहरा मूत्र, फीके मल, तथा थकान।</span></li></ul>", "question_heading": ""}, {"sr_no": 110, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">‘रॉलेट अधिनियम’ (1919) को ‘काला कानून’ इसलिए कहा गया क्योंकि इसमें निम्न का प्रावधान था:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रेस की स्वतंत्रता पर प्रतिबंध</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बिना मुकदमा चलाए नजरबंदी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनिवार्य सैन्य सेवा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किसानों पर उच्च कर</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: बिना मुकदमा चलाए नजरबंदी</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1919 का रॉलेट अधिनियम</span><span style=\"font-family:'Nirmala UI'\">, जिसका आधिकारिक नाम </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अराजक एवं क्रांतिकारी अपराध अधिनियम (Anarchical and Revolutionary Crimes Act)</span><span style=\"font-family:'Nirmala UI'\"> था, को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“काला कानून”</span><span style=\"font-family:'Nirmala UI'\"> कहा गया क्योंकि इसने ब्रिटिश औपनिवेशिक शासन को राजनीतिक असहमति दबाने के लिए व्यापक अधिकार दे दिए।</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">इसने सरकार को </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बिना मुकदमा चलाए व्यक्तियों को गिरफ्तार कर दो वर्ष तक हिरासत में रखने</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> की अनुमति दी।</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">इसने </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">प्रेस की स्वतंत्रता</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> जैसी नागरिक स्वतंत्रताओं को भी सीमित किया और राजनीतिक गतिविधियों पर अधिक कड़े नियंत्रण की अनुमति दी।</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">इस अधिनियम का पूरे भारत में व्यापक विरोध हुआ, जिससे देशव्यापी प्रदर्शन हुए।</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">इसके प्रतिवाद में महात्मा गांधी ने </span><span style=\"line-height:108%;font-size:12pt;font-weight: =\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ऑस्ट्रेलियाई संविधान</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> से ली गई है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">भारत में, </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सातवीं अनुसूची</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> विषयों को तीन सूचियों में विभाजित करती है:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">संघ सूची</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> (संघ के अनन्य विषय)।</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राज्य सूची</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> (राज्यों के अनन्य विषय)।</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">समवर्ती सूची</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> (वे विषय जिन पर संघ और राज्य—दोनों विधानमंडल कानून बना सकते हैं; परंतु टकराव की स्थिति में संघ का कानून प्रभावी होता है)।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">समवर्ती सूची</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> का यह विचार ऑस्ट्रे
