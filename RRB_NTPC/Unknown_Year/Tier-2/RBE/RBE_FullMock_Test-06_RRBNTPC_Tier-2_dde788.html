<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>10.) GK Sectional Mock Test-6 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

\">दो से अधिक</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Condition: symbol should be immediately preceded by an even number and immediately followed by a symbol.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Only even number = 8</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">8 $ 7 </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> $ is preceded by 8, but followed by 7, not a symbol.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">So, no such symbol is present.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Answer: None</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कुवैत : दीनार :: वियतनाम : ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डोंग</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पेसो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रियाल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बहट</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कुवैत : दीनार</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कुवैत की मुद्रा दीनार है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसी प्रकार,</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वियतनाम : डोंग</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">वियतनाम की मुद्रा डोंग है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डोंग = वियतनाम</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पेसो = फिलीपींस/मेक्सिको</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रियाल = ईरान/ओमान/यमन</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बहत = थाईलैंड</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अंग्रेजी वर्णमाला के क्रम के आधार पर CSVG और SCGV में एक निश्चित संबंध है। इसी प्रकार, KKDY और KKYD में भी संबंध है। इसी तर्क के आधार पर, SCLQ दिए गए विकल्पों में से किससे संबंधित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">CSLQ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">SCQL</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">CSQL</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">SCLQ</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Logic:</span><span style=\"font-family:'Nirmala UI'\"> 1st and 2nd letters are interchanged, and 3rd and 4th letters are interchanged.</span><br><span style=\"font-family:'Nirmala UI'\"> </span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">C S V G </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> S C G V</span><br><span style=\"font-family:'Nirmala UI'\">K K D Y </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> K K Y D</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Now,</span><br><span style=\"font-family:'Nirmala UI'\">S C L Q </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> C S Q L</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Final Answer: (c) CSQL</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">P, Q, R, S, T, U और V में से प्रत्येक की परीक्षा एक ही सप्ताह के सोमवार से शुरू होकर रविवार को समाप्त होने वाले अलग-अलग दिनों में है। R और V के बीच केवल दो व्यक्तियों की परीक्षा है। U की परीक्षा मंगलवार को है। P की परीक्षा V के ठीक पहले वाले दिन और U के ठीक बाद वाले दिन है। S की परीक्षा सोमवार को है। T की परीक्षा R से पहले वाले दिन और Q के बाद वाले दिन है। Q की परीक्षा शुक्रवार को है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से किसकी परीक्षा बुधवार को है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">V</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">T</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">P</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">R</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1778755800419_image021.png\" width=\"278\" height=\"396\" alt ></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अंग्रेजी वर्णमाला क्रम के आधार पर दी गई श्रृंखला में प्रश्न चिह्न (?) के स्थान पर क्या आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">GQ, PZ, YI, HR, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">PB</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">QA</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">QB</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">PA</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Series:</span><span style=\"font-family:'Nirmala UI'\"> GQ, PZ, YI, HR, ?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Logic:</span><br><span style=\"font-family:'Nirmala UI'\">First letter: G + 9 = P, P + 9 = Y, Y + 9 = H, H + 9 = Q</span><br><span style=\"font-family:'Nirmala UI'\">Second letter: Q + 9 = Z, Z + 9 = I, I + 9 = R, R + 9 = A</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">So, next term = </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">QA</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Final Answer: QA</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दी गई श्रृंखला में प्रश्न चिह्न (?) के स्थान पर क्या आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2, 1, 1, 1.5, ?, 7.5</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">5</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Pattern is multiplying by increasing factors:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2 × 0.5 = 1</span><br><span style=\"font-family:'Nirmala UI'\">1 × 1 = 1</span><br><span style=\"font-family:'Nirmala UI'\">1 × 1.5 = 1.5</span><br><span style=\"font-family:'Nirmala UI'\">1.5 × 2 = 3</span><br><span style=\"font-family:'Nirmala UI'\">3 × 2.5 = 7.5</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">So missing term = </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">3</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Answer: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">A) 3</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा शास्त्रीय नृत्य रूप 'महारियों' द्वारा मंदिर सेवा के हिस्से के रूप में किया जाता था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कथक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भरतनाट्यम</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मणिपुरी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ओडिसी</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> ओडिसी</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ओडिशा का ओडिसी नृत्य रूप पारंपरिक रूप से महारियों (महिला मंदिर नर्तकियों) द्वारा मंदिरों में अनुष्ठान सेवा के हिस्से के रूप में किया जाता था, विशेष रूप से पुरी में भगवान जगन्नाथ की भक्ति में।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">महारियों ने आध्यात्मिकता, भक्ति और कला को जोड़ते हुए सेवा के रूप में नृत्य अर्पित किया।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">समय के साथ, ओडिसी एक शास्त्रीय नृत्य रूप में विकसित हुआ जिसे इसकी सुंदर गतिविधियों, मूर्तिकला जैसी मुद्राओं और भक्ति विषयों के लिए पहचाना गया।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का पुनरावलोकन</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कथक </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> उत्तर भारत में उत्पन्न हुआ, कथाकारों (कहानी सुनाने वालों) द्वारा किया जाता था, महारियों द्वारा नहीं।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भरतनाट्यम </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> तमिलनाडु के मंदिरों में देवदासियों द्वारा किया जाता था, महारियों द्वारा नहीं।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मणिपुरी </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> मणिपुर से संबंधित, वैष्णववाद के इर्द-गिर्द भक्ति विषय, लेकिन महारी नहीं।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ओडिसी </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; ओडिशा के मंदिरों में महारियों द्वारा किया जाता था।</span></li></ul>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">MS Excel में, किस प्रकार का सेल संदर्भ (cell reference) फॉर्मूला को किसी अन्य स्थान पर कॉपी करने पर कॉलम अक्षर और रो (row) संख्या दोनों को स्वचालित रूप से बदल देता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एब्सोल्यूट रेफरेंस (Absolute Reference)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मिक्स्ड रेफरेंस (Mixed Reference)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रिलेटिव रेफरेंस (Relative Reference)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सर्कुलर रेफरेंस (Circular Reference)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> रिलेटिव रेफरेंस</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">MS Excel में, रिलेटिव रेफरेंस का अर्थ है कि फॉर्मूला को किसी अन्य सेल में कॉपी करने पर कॉलम अक्षर और रो संख्या दोनों स्वचालित रूप से बदल जाते हैं।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उदाहरण:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">सेल B2 में फॉर्मूला: =A1 + 5</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">यदि इसे C3 में कॉपी किया जाता है, तो यह =B2 + 5 हो जाता है।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">यह एक्सेल में डिफॉल्ट व्यवहार है और एक ही फॉर्मूला को कई रो/कॉलम में लागू करने के लिए उपयोगी है।</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का पुनरावलोकन</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एब्सोल्यूट रेफरेंस </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> $ का उपयोग करता है (जैसे, $A$1), रो और कॉलम दोनों को लॉक करता है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मिक्स्ड रेफरेंस </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> या तो रो या कॉलम को लॉक करता है (जैसे, $A1 या A$1)।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रिलेटिव रेफरेंस </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; रो और कॉलम दोनों स्वचालित रूप से समायोजित होते हैं।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· सर्कुलर रेफरेंस </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> तब होता है जब कोई फॉर्मूला अपने स्वयं के सेल को संदर्भित करता है, जिससे त्रुटि होती है।</span></li></ul>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जनवरी 2026 में किस देश ने G7 की अध्यक्षता ग्रहण की?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">फ्रांस</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कनाडा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इटली</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जापान</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">फ्रांस ने जनवरी 2026 में G7 की अध्यक्षता ग्रहण की, जो 15-17 जून, 2026 को इवियन-लेस-बेन्स, हाउट-सावोई में निर्धारित 52वें G7 शिखर सम्मेलन की मेजबानी करेगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">2026 G7 अध्यक्षता के बारे में मुख्य तथ्य:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अध्यक्षता धारक:</span><span style=\"font-family:'Nirmala UI'\"> फ्रांस</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">शिखर सम्मेलन की तारीखें:</span><span style=\"font-family:'Nirmala UI'\"> 15-17 जून 2026</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्थान:</span><span style=\"font-family:'Nirmala UI'\"> इवियन-लेस-बेन्स, हाउट-सावोई, फ्रांस</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मेजबान नेता:</span><span style=\"font-family:'Nirmala UI'\"> राष्ट्रपति इमैनुएल मैक्रॉन</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रतिभागी:</span><span style=\"font-family:'Nirmala UI'\"> कनाडा, फ्रांस, जर्मनी, इटली, जापान, यूके, यूएसए और यूरोपीय संघ के नेता।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आमंत्रित देश:</span><span style=\"font-family:'Nirmala UI'\"> ब्राजील, भारत, केन्या, दक्षिण कोरिया (चीन की संभावित भागीदारी के बारे में चर्चा के साथ)।</span></li></ul>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पॉल एर्लिच द्वारा खोजी गई कौन सी दवा सिफलिस (syphilis) का पहला सफल उपचार बनी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पेनिसिलिन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">साल्वरसन (Salvarsan)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्ट्रेप्टोमाइसिन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कुनैन (Quinine)</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> साल्वरसन</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1909 में, पॉल एर्लिच (जर्मन चिकित्सक और वैज्ञानिक) ने साल्वरसन (Arsphenamine) की खोज की, जिसे कंपाउंड 606 के रूप में भी जाना जाता है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह सिफलिस के लिए पहला प्रभावी उपचार बना, जो कीमोथेरेपी में एक बड़ी सफलता थी।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एर्लिच की खोज ने \"मैजिक बुलेट\" की अवधारणा की शुरुआत की — एक ऐसी दवा जो मेजबान को नुकसान पहुँचाए बिना विशेष रूप से रोग पैदा करने वाले जीवों को लक्षित करती है।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का पुनरावलोकन</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पेनिसिलिन </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> बाद में अलेक्जेंडर फ्लेमिंग (1928) द्वारा खोजा गया, सिफलिस के खिलाफ प्रभावी लेकिन पहला नहीं।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">साल्वरसन</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; सिफलिस का पहला सफल उपचार, पॉल एर्लिच द्वारा खोजा गया।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्ट्रेप्टोमाइसिन</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> 1943 में खोजा गया, तपेदिक (tuberculosis) के खिलाफ प्रभावी पहला एंटीबायोटिक।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कुनैन</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> मलेरिया के उपचार के लिए उपयोग किया जाता है, सिफलिस के लिए नहीं।</span></li></ul>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वारली पेंटिंग में दीवार तैयार करने के लिए 'लिपाने (Lipane)' नामक पहले चरण में निम्नलिखित में से किसका उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चाक और पानी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लकड़ी की राख</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सफेद चावल का पेस्ट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गेरू लाल मिट्टी</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> गेरू लाल मिट्टी</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span><span style=\"font-family:'Nirmala UI'\">:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वारली पेंटिंग में, दीवार की तैयारी के पहले चरण को लिपाने कहा जाता है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पारंपरिक रूप से, गाँव की झोपड़ियों की दीवारों पर गाय के गोबर और गेरू लाल मिट्टी (लाल मिट्टी) के मिश्रण का लेप लगाया जाता है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह मिश्रण एक चिकनी, मिट्टी जैसी पृष्ठभूमि सतह बनाता है जो कैनवास के रूप में कार्य करती।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लिपाने के बाद, विशिष्ट वारली रूपांकनों (ज्यामितीय आकृतियाँ, दैनिक जीवन, प्रकृति) को बनाने के लिए सफेद चावल के पेस्ट का उपयोग किया जाता है।</span></li></ul>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मंदाकिनी और अलकनंदा नदियाँ किस पवित्र संगम बिंदु पर मिलकर गंगा बनाती हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रुद्रप्रयाग</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कर्णप्रयाग</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">देवप्रयाग</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विष्णुप्रयाग</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> रुद्रप्रयाग</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मंदाकिनी नदी (केदारनाथ से निकलने वाली) उत्तराखंड के रुद्रप्रयाग में अलकनंदा नदी से मिलती है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह संगम अलकनंदा नदी के पंच प्रयाग (पाँच पवित्र संगमों) में से एक है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रुद्रप्रयाग के बाद, अलकनंदा नीचे की ओर बहती रहती है जब तक कि वह अंततः देवप्रयाग में भागीरथी नदी से नहीं मिल जाती, जहाँ से आधिकारिक तौर पर गंगा नदी शुरू होती है।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का पुनरावलोकन</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रुद्रप्रयाग </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; मंदाकिनी और अलकनंदा का संगम।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कर्णप्रयाग </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> अलकनंदा और पिंडर नदियों का संगम।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">देवप्रयाग </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> अलकनंदा और भागीरथी नदियों का संगम (गंगा का जन्मस्थान)।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विष्णुप्रयाग </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> अलकनंदा और धौलीगंगा नदियों का संगम।</span></li></ul>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ग्लोबल डेट रिपोर्ट 2025 (Global Debt Report 2025) के अनुसार, 2025 के लिए OECD देशों में अनुमानित सॉवरेन बॉन्ड जारी करने (sovereign bond issuance) की मात्रा क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">$15 ट्रिलियन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">$17 ट्रिलियन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">$18 ट्रिलियन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">$19 ट्रिलियन</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">OECD की ग्लोबल डेट रिपोर्ट 2025 के अनुसार, OECD देशों में सॉवरेन बॉन्ड जारी करने की मात्रा 2025 में रिकॉर्ड 17 ट्रिलियन अमेरिकी डॉलर तक पहुँचने का अनुमान है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ग्लोबल डेट रिपोर्ट 2025 के मुख्य निष्कर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सॉवरेन बॉन्ड जारी करना</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">OECD देश (2025 अनुमान): 17 ट्रिलियन अमेरिकी डॉलर</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पिछला स्तर:</span><span style=\"font-family:'Nirmala UI'\"> 2023 में 14 ट्रिलियन अमेरिकी डॉलर </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> महत्वपूर्ण वृद्धि की प्रवृत्ति।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कारक:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">बढ़ती पुनर्वित्त आवश्यकताएं (ऋण का बड़ा हिस्सा 2027 तक परिपक्व हो रहा है)।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">पिछले निर्गमों की तुलना में उच्च ब्याज लागत।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">केंद्रीय बैंक की होल्डिंग्स में गिरावट के कारण घरों और विदेशी निवेशकों पर बढ़ती निर्भरता।</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्यापक ऋण बाजार रुझान</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वैश्विक सॉवरेन और कॉर्पोरेट ऋण (2024): 100 ट्रिलियन अमेरिकी डॉलर से अधिक बकाया।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कॉर्पोरेट बॉन्ड:</span><span style=\"font-family:'Nirmala UI'\"> 2024 के अंत में 35 ट्रिलियन अमेरिकी डॉलर का स्टॉक, दीर्घकालिक वृद्धि जारी।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उभरते बाजार:</span><span style=\"font-family:'Nirmala UI'\"> ऋण लगभग 1 ट्रिलियन अमेरिकी डॉलर (2007) से बढ़कर 3 ट्रिलियन अमेरिकी डॉलर (2024) से अधिक हो गया।</span></li></ul>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1937 में प्रस्तावित वर्धा शिक्षा योजना (Wardha Scheme of Basic Education) किस आंदोलन या शैक्षिक विचार से जुड़ी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आर्य समाज</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अलीगढ़ आंदोलन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ब्रह्म समाज</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नई तालीम</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> नई तालीम</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span><span style=\"font-family:'Nirmala UI'\">:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वर्धा शिक्षा योजना (1937) महात्मा गांधी के मार्गदर्शन में वर्धा सम्मेलन में तैयार की गई थी।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह सीधे तौर पर नई तालीम (नई शिक्षा) की अवधारणा से जुड़ी है, जिसे बुनियादी शिक्षा (Basic Education) भी कहा जाता है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुख्य विशेषताएं:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">शिक्षा शिल्प-आधारित शिक्षा (जैसे कताई, बुनाई, कृषि) के माध्यम से प्रदान की जानी चाहिए।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">आत्मनिर्भरता, श्रम की गरिमा और काम के साथ सीखने के एकीकरण पर जोर।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">7-14 वर्ष के बच्चों के लिए मुफ्त और अनिवार्य शिक्षा।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">शिक्षा के माध्यम के रूप में मातृभाषा पर ध्यान।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">इस योजना का उद्देश्य शिक्षा को अधिक व्यावहारिक, उत्पादक और भारतीय संस्कृति से जोड़ना था, जो औपनिवेशिक मॉडलों से दूर हो।</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का पुनरावलोकन</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आर्य समाज </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सुधार आंदोलन, वर्धा योजना से नहीं जुड़ा।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अलीगढ़ आंदोलन </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सर सैयद अहमद खान से जुड़ा, मुसलमानों के लिए आधुनिक शिक्षा पर केंद्रित।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ब्रह्म समाज </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सामाजिक-धार्मिक सुधार आंदोलन, नई तालीम से नहीं जुड़ा।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नई तालीम </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; वर्धा योजना के पीछे का शैक्षिक विचार।</span></li></ul>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत सरकार ने प्रतिभूति लेनदेन कर (STT) किस वर्ष शुरू किया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2002</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2004</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2006</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2008</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सही उत्तर 2004 है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span><span style=\"font-family:'Nirmala UI'\">:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत सरकार ने वित्त अधिनियम, 2004 के माध्यम से प्रतिभूति लेनदेन कर (STT) पेश किया, जिसे 8 जुलाई 2004 को वित्त मंत्री पी. चिदंबरम द्वारा प्रस्तावित किया गया था और इसका कार्यान्वयन 1 अक्टूबर 2004 से शुरू हुआ था। यह कर मान्यता प्राप्त स्टॉक एक्सचेंजों पर इक्विटी शेयरों, डेरिवेटिव्स और इक्विटी-ओरिएंटेड म्यूचुअल फंड जैसी प्रतिभूतियों के लेनदेन पर लागू होता है। इसके मुख्य लक्ष्य पूंजीगत लाभ कर की चोरी को रोकना, प्रतिभूति कराधान को सरल बनाना, व्यापारिक पारदर्शिता सुनिश्चित करना और बाजार से राजस्व उत्पन्न करना था।</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत का सबसे पूर्वी अंतरराष्ट्रीय सीमा बिंदु कौन सा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दीफू</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मोरेह</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्टिलवेल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किबिथू</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> किबिथू</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत का सबसे पूर्वी अंतरराष्ट्रीय सीमा बिंदु किबिथू है, जो अरुणाचल प्रदेश के अंजाव जिले का एक छोटा सा गाँव है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह भारत-चीन सीमा पर स्थित है और रणनीतिक रूप से महत्वपूर्ण है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किबिथू को अक्सर उस स्थान के रूप में जाना जाता है जहाँ भारत में सबसे पहले सूर्योदय होता है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह चीन के साथ वास्तविक नियंत्रण रेखा (LAC) का हिस्सा है और सैन्य महत्व रखता है।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का पुनरावलोकन</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दीफू </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> असम में स्थित है, सबसे पूर्वी सीमा बिंदु नहीं है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मोरेह </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> भारत-म्यांमार सीमा पर मणिपुर का एक सीमावर्ती शहर है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्टिलवेल </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> स्टिलवेल रोड (भारत-म्यांमार-चीन को जोड़ने वाली) को संदर्भित करता है, लेकिन सबसे पूर्वी बिंदु नहीं है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किबिथू </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; भारत का सबसे पूर्वी अंतरराष्ट्रीय सीमा बिंदु।</span></li></ul>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ब्रिटिश भारत में पहला सहकारी ऋण समिति अधिनियम (Cooperative Credit Societies Act) किस वर्ष अधिनियमित किया गया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1902</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1904</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1906</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1908</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> 1904</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ब्रिटिश भारत में पहला सहकारी ऋण समिति अधिनियम 1904 में अधिनियमित किया गया था।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उद्देश्य: सहकारी समितियों के माध्यम से किसानों और ग्रामीण समुदायों को ऋण सुविधाएं प्रदान करना, जिससे साहूकारों पर निर्भरता कम हो सके।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसने भारत में सहकारी आंदोलन की नींव रखी, जिसका ध्यान स्वयं सहायता और आपसी सहायता पर था।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बाद के घटनाक्रम:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सहकारी समिति अधिनियम, 1912 </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> ऋण के अलावा अन्य सहकारी गतिविधियों तक कार्यक्षेत्र का विस्तार किया गया।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्वतंत्रता के बाद, सहकारी समितियाँ भारत की ग्रामीण विकास रणनीति का एक प्रमुख हिस्सा बन गईं।</span></li></ul>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत सरकार द्वारा डिजिटल इंडिया पहल किस वर्ष शुरू की गई थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2013</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2014</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2015</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2016</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> 2015</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डिजिटल इंडिया पहल आधिकारिक तौर पर भारत सरकार द्वारा 1 जुलाई 2015 को शुरू की गई थी।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसका उद्घाटन प्रधान मंत्री नरेंद्र मोदी द्वारा भारत को डिजिटल रूप से सशक्त समाज और ज्ञान अर्थव्यवस्था में बदलने के दृष्टिकोण के साथ किया गया था।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">डिजिटल इंडिया के प्रमुख स्तंभ:</span></li></ul><ol type=\"1\"><li style=\"margin-left:32.07pt;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span>प्रत्येक नागरिक के लिए एक उपयोगिता (utility) के रूप में डिजिटल बुनियादी ढांचा।</span></li><li style=\"margin-left:32.07pt;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span>मांग पर शासन और सेवाएं (ई-गवर्नेंस, ऑनलाइन सेवाएं)।</span></li><li style=\"margin-left:32.07pt;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span>नागरिकों का डिजिटल सशक्तिकरण (डिजिटल साक्षरता, सूचना तक पहुंच)।</span></li></ol><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डिजिटल इंडिया के तहत प्रमुख कार्यक्रमों में डिजिलॉकर, उमंग (UMANG), भारतनेट, ई-हॉस्पिटल, ई-साइन और भीम (BHIM) यूपीआई शामिल हैं।</span></li></ul>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अमरावती स्तूप का निर्माण किस प्राचीन भारतीय राजवंश के शासकों द्वारा किया गया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मौर्य वंश</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चालुक्य वंश</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गुप्त वंश</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सातवाहन वंश</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> सातवाहन वंश</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वर्तमान आंध्र प्रदेश में स्थित अमरावती स्तूप का निर्माण और विस्तार सातवाहन वंश (दूसरी शताब्दी ईसा पूर्व - तीसरी शताब्दी ईस्वी) के तहत किया गया था।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह भारत के सबसे बड़े बौद्ध स्तूपों में से एक है, जो बुद्ध की शिक्षाओं को समर्पित है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह स्तूप अपनी जटिल चूना पत्थर की नक्काशी के लिए प्रसिद्ध है, जिसमें जातक कथाओं और बौद्ध प्रतीकों के दृश्यों को दर्शाया गया है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सातवाहन बौद्ध धर्म के महान संरक्षक थे और उन्होंने दक्कन क्षेत्र में स्तूपों, मठों और गुफा परिसरों के निर्माण का समर्थन किया।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का पुनरावलोकन</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मौर्य वंश </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> बौद्ध धर्म के प्रति अशोक के संरक्षण के लिए जाना जाता है, लेकिन अमरावती स्तूप उनके द्वारा नहीं बनाया गया था।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चालुक्य वंश </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> बाद में (6वीं-12वीं शताब्दी ईस्वी) फला-फूला, अमरावती से जुड़ा नहीं है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गुप्त वंश </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> शास्त्रीय कला और वास्तुकला के लिए जाना जाता है, लेकिन अमरावती उनसे पहले का है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सातवाहन वंश </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; अमरावती स्तूप के निर्माता और संरक्षक।</span></li></ul>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विधिक सेवा प्राधिकरण अधिनियम 1987 की कौन सी धारा स्थायी लोक अदालतों की स्थापना का प्रावधान करती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">धारा 22 A</span></p>", "option2": " <
