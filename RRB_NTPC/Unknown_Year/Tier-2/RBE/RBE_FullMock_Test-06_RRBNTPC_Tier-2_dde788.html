p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">धारा 22 B</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">धारा 22 C</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">धारा 22 D</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> धारा 22 B</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विधिक सेवा प्राधिकरण अधिनियम, 1987 भारत में लोक अदालतों के लिए वैधानिक ढांचा प्रदान करता है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्थायी लोक अदालतें (PLAs) 2002 में एक संशोधन के माध्यम से पेश की गई थीं, विशेष रूप से अधिनियम के अध्याय VI-A के तहत।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">धारा 22B </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सार्वजनिक उपयोगी सेवाओं (परिवहन, डाक, टेलीग्राफ, पानी, बिजली, आदि) से संबंधित विवादों में अधिकार क्षेत्र का प्रयोग करने के लिए स्थायी लोक अदालतों की स्थापना का प्रावधान करती है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ये स्थायी लोक अदालतें नियमित लोक अदालतों से भिन्न होती हैं क्योंकि यदि पक्ष समझौता करने में विफल रहते हैं, तो ये विवादों का न्यायनिर्णयन (adjudicate) कर सकती हैं, जिससे उनका निर्णय बाध्यकारी हो जाता है।</span></li></ul>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">MS PowerPoint 365 में, शुरुआत से स्लाइड शो शुरू करने के लिए किस कीबोर्ड शॉर्टकट का उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Ctrl + Enter</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Shift + F5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">F5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Alt + F5</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> F5</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">MS PowerPoint 365 में, F5 दबाने से स्लाइड शो शुरुआत से शुरू हो जाता है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यदि आप वर्तमान स्लाइड से स्लाइड शो शुरू करना चाहते हैं, तो शॉर्टकट Shift + F5 है।</span></li></ul>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लोरेंज़ वक्र (Lorenz Curve) एक ग्राफिकल प्रतिनिधित्व है जिसका उपयोग निम्नलिखित में से किस आर्थिक माप को दर्शाने के लिए किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जनसंख्या वृद्धि</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आय असमानता</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रति व्यक्ति जीडीपी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मुद्रास्फीति दर</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> आय असमानता</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लोरेंज़ वक्र अर्थशास्त्र में एक ग्राफिकल प्रतिनिधित्व है जिसका उपयोग जनसंख्या के भीतर आय या धन के वितरण को दिखाने के लिए किया जाता है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह परिवारों के संचयी प्रतिशत के मुकाबले अर्जित आय के संचयी प्रतिशत को दर्शाता है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वक्र पूर्ण समानता की रेखा (45° विकर्ण) से जितना अधिक दूर झुकता है, आय असमानता उतनी ही अधिक होती है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह गिनी गुणांक (Gini Coefficient) से निकटता से संबंधित है, जो लोरेंज़ वक्र के आधार पर असमानता को मापता है।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का पुनरावलोकन</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जनसंख्या वृद्धि </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> जनसांख्यिकीय आंकड़ों द्वारा मापी जाती है, लोरेंज़ वक्र द्वारा नहीं।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आय असमानता </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; लोरेंज़ वक्र इसी के लिए बनाया गया है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रति व्यक्ति जीडीपी </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> औसत आय का संकेतक है, वितरण का नहीं।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मुद्रास्फीति दर </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> मूल्य सूचकांकों द्वारा मापी जाती है, लोरेंज़ वक्र द्वारा नहीं।</span></li></ul>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नागरिकता कानून में 'जस सैंग्विनिस' (Jus Sanguinis) की अवधारणा निम्नलिखित में से किसके माध्यम से नागरिकता प्राप्त करने को संदर्भित करती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जन्म स्थान</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नागरिक से विवाह</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दीर्घकालिक निवास</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रक्त द्वारा वंश</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> रक्त द्वारा वंश</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span><span style=\"font-family:'Nirmala UI'\">:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नागरिकता कानून में जस सैंग्विनिस (लैटिन: रक्त का अधिकार) की अवधारणा का अर्थ है कि कोई व्यक्ति जन्म के स्थान की परवाह किए बिना, अपने माता-पिता के वंश के माध्यम से नागरिकता प्राप्त करता है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उदाहरण: यदि कोई बच्चा विदेश में पैदा होता है लेकिन उसके माता-पिता उस देश के नागरिक हैं जो जस सैंग्विनिस का पालन करता है, तो बच्चा स्वतः ही उस देश की नागरिकता प्राप्त कर लेता है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह सिद्धांत 'जस सोली' (Jus Soli - मिट्टी का अधिकार) के विपरीत है, जहाँ नागरिकता जन्म स्थान से निर्धारित होती है।</span></li></ul>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मेंडेलीव ने किस वर्ष आवर्त सारणी (periodic table) प्रकाशित की थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1849</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1859</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1869</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1879</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> 1869</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रूसी रसायनज्ञ दिमित्री मेंडेलीव ने 1869 में तत्वों की आवर्त सारणी का अपना पहला संस्करण प्रकाशित किया था।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उन्होंने तत्वों को बढ़ते परमाणु द्रव्यमान के क्रम में व्यवस्थित किया और आवर्ती रासायनिक गुणों को देखा।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">महत्वपूर्ण रूप से, उन्होंने खोजे जाने वाले तत्वों (जैसे गैलियम और जर्मेनियम) के लिए रिक्त स्थान छोड़े, और उनके गुणों की उल्लेखनीय सटीकता के साथ भविष्यवाणी की।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इस भविष्य कहने वाली शक्ति ने उनकी सारणी को मजबूत वैज्ञानिक विश्वसनीयता दी और आधुनिक आवर्त सारणी (जिसे बाद में मोजले द्वारा परमाणु संख्या का उपयोग करके परिष्कृत किया गया) की नींव रखी।</span></li></ul>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">टेलीकॉम सेक्टर को विनियमित करने के लिए भारतीय दूरसंचार नियामक प्राधिकरण (TRAI) की स्थापना किस वर्ष की गई थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1995</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1997</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1999</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2001</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय दूरसंचार नियामक प्राधिकरण (TRAI) की स्थापना 20 फरवरी 1997 को भारतीय दूरसंचार नियामक प्राधिकरण अधिनियम, 1997 के तहत भारत में दूरसंचार क्षेत्र को विनियमित करने के लिए की गई थी।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुख्य विवरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्थापना का वर्ष:</span><span style=\"font-family:'Nirmala UI'\"> 1997</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कानूनी आधार:</span><span style=\"font-family:'Nirmala UI'\"> भारतीय दूरसंचार नियामक प्राधिकरण अधिनियम, 1997 (1997 का अधिनियम संख्या 24)।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उद्देश्य:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">भारत में दूरसंचार सेवाओं को विनियमित करना।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">निष्पक्ष प्रतिस्पर्धा और समान अवसर सुनिश्चित करना।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">दूरसंचार सेवाओं के लिए टैरिफ तय करना और संशोधित करना (पहले केंद्र सरकार द्वारा संभाला जाता था)।</span></li></ul></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुख्यालय:</span><span style=\"font-family:'Nirmala UI'\"> नई दिल्ली, भारत।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">संरचना:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">एक अध्यक्ष।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">अधिकतम दो पूर्णकालिक सदस्य।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">अधिकतम दो अंशकालिक सदस्य।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सी प्राथमिक विशेषता टंगस्टन को बिजली के बल्ब के फिलामेंट के लिए आदर्श बनाती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उच्च चालकता</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कम तापीय विस्तार</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उच्च लचीलापन (Ductility)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बहुत उच्च गलनांक</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> बहुत उच्च गलनांक</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">टंगस्टन (W) बिजली के बल्ब के फिलामेंट के लिए मुख्य रूप से अपने बहुत उच्च गलनांक (~3422 °C) के कारण आदर्श है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह फिलामेंट को बिना पिघले </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बिजली गुजरने पर उत्पन्न होने वाली अत्यधिक गर्मी</span><span style=\"font-family:'Nirmala UI'\"> का सामना करने की अनुमति देता है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लचीलापन और चालकता जैसे अन्य गुण उपयोगी हैं, लेकिन मुख्य विशेषता बहुत उच्च तापमान पर स्थिर रहने की इसकी क्षमता है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">टंगस्टन में अच्छी तन्यता शक्ति भी होती है और यह वाष्पीकरण का प्रतिरोध करता है, जिससे फिलामेंट का जीवन लंबा हो जाता है।</span></li></ul>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत में पूर्ण पूंजी खाता परिवर्तनीयता (full capital account convertibility) की सिफारिश किस समिति ने की थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नरसिम्हम समिति</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तारापोर समिति</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केलकर समिति</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एन.के. सिंह समिति</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत में पूर्ण पूंजी खाता परिवर्तनीयता की सिफारिश करने वाली समिति तारापोर समिति (1997) थी, जिसकी अध्यक्षता RBI के पूर्व डिप्टी गवर्नर एस.एस. तारापोर ने की थी।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुख्य विवरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">समिति:</span><span style=\"font-family:'Nirmala UI'\"> तारापोर समिति (1997)</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अध्यक्ष:</span><span style=\"font-family:'Nirmala UI'\"> एस.एस. तारापोर</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अधिदेश (Mandate):</span><span style=\"font-family:'Nirmala UI'\"> भारत में पूंजी खाता परिवर्तनीयता (CAC) शुरू करने की व्यवहार्यता की जांच करना।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सिफारिश:</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1999-2000 तक पूर्ण CAC प्राप्त करने के लिए तीन-चरणीय रोडमैप का प्रस्ताव दिया।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कुछ पूर्व शर्तों पर जोर दिया जैसे:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">राजकोषीय सुदृढ़ीकरण (राजकोषीय घाटे को GDP के ~3.5% तक कम करना)।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">राजस्व घाटे का उन्मूलन।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">मुद्रास्फीति नियंत्रण (3-5%)।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">गैर-निष्पादित संपत्ति (NPAs) में कमी।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">वित्तीय बाजारों और विवेकपूर्ण मानदंडों को मजबूत करना।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">पर्याप्त विदेशी मुद्रा भंडार।</span></li></ul></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">परिणाम:</span><span style=\"font-family:'Nirmala UI'\"> वित्तीय स्थिरता, बाहरी झटकों और अस्थिरता जोखिमों की चिंताओं के कारण भारत ने पूर्ण CAC लागू नहीं किया। आज भी आंशिक परिवर्तनीयता लागू है।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का पुनरावलोकन</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नरसिम्हम समिति </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> बैंकिंग क्षेत्र के सुधारों पर केंद्रित, पूंजी खाता परिवर्तनीयता पर नहीं।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तारापोर समिति </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; पूर्ण पूंजी खाता परिवर्तनीयता की सिफारिश की।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केलकर समिति </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> राजकोषीय सुधारों और PPP सिफारिशों के लिए जानी जाती है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एन.के. सिंह समिति </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> राजकोषीय उत्तरदायित्व और बजट प्रबंधन (FRBM) पर केंद्रित।</span></li></ul>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">फाइनल में आमिर सरकोश को हराकर 2025 एशियाई स्नूकर चैंपियनशिप का पुरुष एकल खिताब किसने जीता?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आदित्य मेहता</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लक्ष्मण रावत</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रूपेश शाह</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पंकज आडवाणी</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के दिग्गज क्यूइस्ट पंकज आडवाणी ने दोहा, कतर में फाइनल में ईरान के आमिर सरकोश को हराकर 2025 एशियाई स्नूकर चैंपियनशिप का पुरुष एकल खिताब जीता। यह जीत स्नूकर और बिलियर्ड्स प्रारूपों में उनका 14वां एशियाई खिताब था।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">2025 एशियाई स्नूकर चैंपियनशिप की मुख्य झलकियाँ:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पुरुष एकल विजेता:</span><span style=\"font-family:'Nirmala UI'\"> पंकज आडवाणी (भारत)</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उपविजेता:</span><span style=\"font-family:'Nirmala UI'\"> आमिर सरकोश (ईरान)</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अंतिम परिणाम:</span><span style=\"font-family:'Nirmala UI'\"> आडवाणी ने सरकोश को 4-1 फ्रेम से हराया।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्थान:</span><span style=\"font-family:'Nirmala UI'\"> दोहा, कतर (15-21 फरवरी 2025)।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आयोजक:</span><span style=\"font-family:'Nirmala UI'\"> एशियाई बिलियर्ड्स स्पोर्ट्स फेडरेशन (ACBS)।</span></li></ul>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संविधान की छठी अनुसूची किस क्षेत्र के जनजातीय क्षेत्रों के लिए ग्राम परिषदों के निर्माण का प्रावधान करती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मध्य भारत</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पश्चिमी भारत</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उत्तर-पूर्व भारत</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दक्षिण भारत</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> उत्तर-पूर्व भारत</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संविधान की छठी अनुसूची (अनुच्छेद 244(2) और 275(1)) उत्तर-पूर्व क्षेत्र में जनजातीय क्षेत्रों के प्रशासन का प्रावधान करती है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह विशेष रूप से असम, मेघालय, त्रिपुरा और मिजोरम राज्यों को कवर करती है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुख्य विशेषता:</span><span style=\"font-family:'Nirmala UI'\"> जनजातीय समुदायों के अधिकारों की रक्षा के लिए स्वायत्त जिला परिषदों (ADCs) और ग्राम परिषदों की स्थापना।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इन परिषदों के पास भूमि, जंगल, रीति-रिवाजों और ग्राम शासन जैसे मामलों में विधायी, प्रशासनिक और न्यायिक शक्तियाँ होती हैं।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उद्देश्य:</span><span style=\"font-family:'Nirmala UI'\"> जनजातीय संस्कृति की रक्षा करना, स्वशासन सुनिश्चित करना और जनजातीय क्षेत्रों में सामाजिक-आर्थिक विकास को बढ़ावा देना।</span></li></ul>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन नॉन-वोलेटाइल फ्लैश मेमोरी (Non-Volatile Flash Memory) स्टोरेज की प्राथमिक विशेषता का सही वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बिजली के बिना डेटा बरकरार रखता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रिफ्रेश चक्रों की आवश्यकता होती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बिजली बंद होने पर डेटा खो देता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल अस्थायी डेटा संग्रहीत करता है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> बिजली के बिना डेटा बरकरार रखता है</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span><span style=\"font-family:'Nirmala UI'\">:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">फ्लैश मेमोरी एक प्रकार का नॉन-वोलेटाइल स्टोरेज है, जिसका अर्थ है कि यह बिजली बंद होने पर भी डेटा बरकरार रखता है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह इसे USB ड्राइव, SSD, मेमोरी कार्ड और स्मार्टफोन जैसे उपकरणों के लिए आदर्श बनाता है, जहाँ निरंतर बिजली आपूर्ति के बिना स्थायी स्टोरेज की आवश्यकता होती है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वोलेटाइल मेमोरी (RAM) के विपरीत, जो बिजली बंद होने पर डेटा खो देती है, फ्लैश मेमोरी जानकारी को तब तक सुरक्षित रखती है जब तक कि उसे जानबूझकर मिटाया या दोबारा नहीं लिखा जाता।</span></li></ul>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1921 का मोपला विद्रोह (Moplah Uprising), जो ब्रिटिश शासन और हिंदू जमींदारों के खिलाफ था, किस राज्य में हुआ था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कर्नाटक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तमिलनाडु</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केरल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आंध्र प्रदेश</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> केरल</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span><span style=\"font-family:'Nirmala UI'\">:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1921 का मोपला (या मापिला) विद्रोह केरल के मालाबार क्षेत्र में हुआ था।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह व्यापक खिलाफत और असहयोग आंदोलन का हिस्सा था, लेकिन जल्द ही यह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">इनके खिलाफ एक हिंसक विद्रोह में बदल गया:</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ब्रिटिश औपनिवेशिक अधिकारी, और</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कृषि संबंधी शिकायतों के कारण स्थानीय हिंदू जमींदार (जेनमी)।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मोपला (मुस्लिम किसान) विद्रोह में उठ खड़े हुए, जिससे व्यापक हिंसा हुई और अंग्रेजों द्वारा दमन किया गया।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्वतंत्रता संग्राम के दौरान दक्षिण भारत में इस विद्रोह को सबसे महत्वपूर्ण विद्रोहों में से एक माना जाता है, हालांकि सांप्रदायिक तनाव के कारण यह विवादास्पद बना हुआ है।</span></li></ul>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">खगोलीय वेधशाला स्थल जंतर मंतर, जो यूनेस्को (UNESCO) विश्व धरोहर स्थल भी है, किस राज्य में स्थित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उत्तर प्रदेश</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मध्य प्रदेश</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गुजरात</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राजस्थान</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> राजस्थान</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span><span style=\"font-family:'Nirmala UI'\">:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जयपुर, राजस्थान में स्थित जंतर मंतर एक प्रसिद्ध खगोलीय वेधशाला स्थल है जिसे 18वीं शताब्दी की शुरुआत में महाराजा सवाई जय सिंह द्वितीय द्वारा बनाया गया था।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसमें 19 वास्तुशिल्प खगोलीय उपकरणों का संग्रह है, जिसमें दुनिया की सबसे बड़ी पत्थर की धूपघड़ी (sundial) शामिल है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2010 में, जयपुर जंतर मंतर को इसके वैज्ञानिक और सांस्कृतिक महत्व के लिए यूनेस्को विश्व धरोहर स्थल के रूप में अंकित किया गया था।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जय सिंह द्वितीय ने दिल्ली, उज्जैन, मथुरा और वाराणसी</span><span style=\"font-family:'Nirmala UI'\"> में भी इसी तरह की वेधशालाएं बनाई थीं, लेकिन जयपुर स्थल सबसे बड़ा और सबसे अच्छी तरह से संरक्षित है।</span></li></ul>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राष्ट्रकूट राजवंश मुख्य रूप से किस साम्राज्य के पतन के बाद सत्ता में आया और दक्कन क्षेत्र पर हावी हुआ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मौर्य साम्राज्य</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गुप्त साम्राज्य</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चालुक्य साम्राज्य</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पल्लव साम्राज्य</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> चालुक्य साम्राज्य</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span><span style=\"font-family:'Nirmala UI'\">:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राष्ट्रकूट राजवंश 8वीं शताब्दी ईस्वी के मध्य में दक्कन क्षेत्र में प्रमुखता से उभरा।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उन्होंने मुख्य रूप से बादामी के चालुक्य साम्राज्य (प्रारंभिक चालुक्य) के पतन के बाद अपनी शक्ति स्थापित की।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राष्ट्रकूट राजवंश के संस्थापक दंतिदुर्ग ने चालुक्यों को हराया और दक्कन में शक्ति का संचय किया।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राष्ट्रकूट बाद में भारतीय इतिहास के सबसे प्रभावशाली राजवंशों में से एक बन गए, जिन्होंने मान्यखेत (आधुनिक कर्नाटक) से शासन किया और उत्तर तथा दक्षिण भारत में अपना प्रभाव फैलाया।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वे कला, साहित्य और वास्तुकला के महान संरक्षक थे — जो एलोरा के कैलाश मंदिर जैसे स्मारकों के लिए प्रसिद्ध हैं।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का पुनरावलोकन</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मौर्य साम्राज्य </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> बहुत पहले (दूसरी शताब्दी ईसा पूर्व) पतन हो गया था।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गुप्त साम्राज्य </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> उत्तर भारत में पतन हुआ, राष्ट्रकूटों से सीधे तौर पर नहीं जुड़ा।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चालुक्य साम्राज्य </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; दक्कन में उनके पतन के बाद राष्ट्रकूटों का उदय हुआ।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पल्लव साम्राज्य </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> तमिलनाडु में स्थित था, राष्ट्रकूटों के उदय से सीधे तौर पर जुड़ा नहीं था।</span></li></ul>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मार्च 2025 में प्रधान मंत्री नरेंद्र मोदी के निजी सचिव के रूप में निम्नलिखित में से किसे नियुक्त किया गया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राजीव गौबा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निधि तिवारी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पीके मिश्रा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सुषमा चौहान</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मार्च 2025 में, भारतीय विदेश सेवा (IFS) अधिकारी निधि तिवारी को प्रधान मंत्री नरेंद्र मोदी के निजी सचिव के रूप में नियुक्त किया गया था। वह 2014 बैच की अधिकारी हैं, जो पहले प्रधान मंत्री कार्यालय में उप सचिव के रूप में कार्यरत थीं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुख्य विवरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नियुक्त व्यक्ति:</span><span style=\"font-family:'Nirmala UI'\"> निधि तिवारी</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सेवा:</span><span style=\"font-family:'Nirmala UI'\"> भारतीय विदेश सेवा (IFS), 2014 बैच</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नियुक्ति की तारीख:</span><span style=\"font-family:'Nirmala UI'\"> 29 मार्च, 2025 (कार्मिक एवं प्रशिक्षण विभाग द्वारा जारी आदेश)</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पद: </span><span style=\"font-family:'Nirmala UI'\">प्रधान मंत्री नरेंद्र मोदी के निजी सचिव</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पिछली भूमिका:</span><span style=\"font-family:'Nirmala UI'\"> PMO में उप सचिव (2023 से)</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कार्यकाल:</span><span style=\"font-family:'Nirmala UI'\"> प्रधान मंत्री के कार्यकाल के साथ सह-समाप्ति या अगले आदेश तक।</span></li></ul>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">MS Excel 365 में, कौन सी सुविधा उपयोगकर्ता को सेल की सामग्री को कॉपी करने या एक विशिष्ट पैटर्न को जारी रखने की अनुमति देती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डेटा फ़िल्टर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चार्ट विजार्ड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पिवट टेबल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऑटोफिल टूल (AutoFill Tool)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> ऑटोफिल टूल</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span><span style=\"font-family:'Nirmala UI'\">:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">MS Excel 365 में, ऑटोफिल टूल उपयोगकर्ताओं को निम्न की अनुमति देता है:</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सेल सामग्री को आसन्न सेल में तेज़ी से कॉपी करना।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक विशिष्ट पैटर्न या श्रृंखला (जैसे, संख्याएं, तिथियां, सप्ताह के दिन) को जारी रखना।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संदर्भों को स्वचालित रूप से समायोजित करते हुए फॉर्मूला की प्रतिलिपि बनाना।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उदाहरण:</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सेल A1 में 1 और सेल A2 में 2 टाइप करें।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दोनों सेल का चयन करें और फिल हैंडल (निचले-दाएं कोने में छोटा वर्गाकार) को खींचें।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक्सेल स्वचालित रूप से श्रृंखला जारी रखेगा: 3, 4, 5...</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का पुनरावलोकन</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डेटा फ़िल्टर </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> शर्तों के आधार पर रिकॉर्ड फ़िल्टर करने के लिए उपयोग किया जाता है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चार्ट विजार्ड </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> चार्ट बनाने में मदद करता है, पैटर्न कॉपी करने के लिए नहीं।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पिवट टेबल </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> डेटा को सारांशित और विश्लेषण करता है, कॉपी करने के लिए नहीं।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऑटोफिल टूल </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; सामग्री को कॉपी करता है या पैटर्न जारी रखता है।</span></li></ul>", "question_heading": ""}, {"sr_no": 100, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत का कौन सा राज्य दक्षिण-पश्चिम और उत्तर-पूर्वी दोनों मानसून से वर्षा प्राप्त करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तमिलनाडु</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केरल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कर्नाटक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आंध्र प्रदेश</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> तमिलनाडु</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तमिलनाडु अद्वितीय है क्योंकि यह दोनों मानसून से वर्षा प्राप्त करता है:</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दक्षिण-पश्चिम मानसून (जून-सितंबर):</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">यह तमिलनाडु के पश्चिमी और उत्तरी भागों में वर्षा लाता है, हालांकि राज्य पश्चिमी घाट के वर्षा-छाया (rain-shadow) क्षेत्र में स्थित है, इसलिए वर्षा मध्यम होती है।</span></li></ul></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर-पूर्वी मानसून (अक्टूबर-दिसंबर):</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">यह तमिलनाडु के लिए मुख्य वर्षा ऋतु है।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">यह तटीय जिलों, विशेष रूप से चेन्नई और आसपास के क्षेत्रों में भारी वर्षा लाता है।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">यह दोहरी वर्षा पद्धति तमिलनाडु को कृषि की दृष्टि से महत्वपूर्ण बनाती है, जहाँ चावल जैसी फसलें उत्तर-पूर्वी मानसून पर भारी निर्भर रहती हैं।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 101, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">NFHS-5 डेटा 2019-21 के अनुसार, भारत में कुल प्रजनन दर (Total Fertility Rate) क्या थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2.4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2.2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2.0</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1.8</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> 2.0</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राष्ट्रीय परिवार स्वास्थ्य सर्वेक्षण-5 (NFHS-5) 2019-21 के दौरान आयोजित किया गया था।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसने बताया कि भारत की कुल प्रजनन दर (TFR) घटकर 2.0 हो गई है, जो 2.1 की प्रतिस्थापन स्तर प्रजनन क्षमता (replacement level fertility) से नीचे है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसने एक महत्वपूर्ण जनसांख्यिकीय मील का पत्थर चिह्नित किया, जिससे पता चलता है कि भारत जनसंख्या स्थिरीकरण की ओर बढ़ रहा है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुख्य बिंदु</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">NFHS-4 (2015-16): TFR 2.2 थी।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">NFHS-5 (2019-21): TFR घटकर 2.0 हो गई।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">निहितार्थ:</span><span style=\"font-family:'Nirmala UI'\"> भारत उस चरण में प्रवेश कर चुका है जहाँ जनसंख्या वृद्धि समय के साथ स्वाभाविक रूप से धीमी हो जाएगी।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राज्यों में भिन्नता:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">बिहार (2.98) और उत्तर प्रदेश (2.35) जैसे राज्यों में उच्च TFR।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">केरल (1.8) और तमिलनाडु (1.7) जैसे राज्यों में कम TFR।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 102, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत का निम्नलिखित में से कौन सा लोक नृत्य पुरुष नृत्य रूप 'भांगड़ा' का महिला प्रतिरूप है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जाट जाटिन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गिद्दा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गरबा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डांडिया</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> गिद्दा</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भांगड़ा पंजाब का एक जीवंत पुरुष लोक नृत्य है, जो फसल कटाई और उत्सव के अवसरों पर किया जाता है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसका महिला प्रतिरूप गिद्दा है, जो उतना ही ऊर्जावान है लेकिन महिलाओं द्वारा किया जाता है।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गिद्दा की विशेषताएं:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">महिलाएं घेरे में नृत्य करती हैं और लयबद्ध तालियाँ बजाती हैं।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बोलियाँ (लोक छंद) प्रस्तुत करती हैं जो अक्सर सामाजिक विषयों, हास्य या रोजमर्रा के जीवन को व्यक्त करती हैं।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसकी हलचलें सुंदर और जोरदार होती हैं, जो पंजाबी संस्कृति को प्रदर्शित करती हैं।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का पुनरावलोकन</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जाट जाटिन </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> बिहार का लोक नृत्य, भांगड़ा से संबंधित नहीं।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गिद्दा </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; भांगड़ा का महिला प्रतिरूप।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गरबा </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> गुजरात का लोक नृत्य, नवरात्रि के दौरान किया जाता है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">· डांडिया </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> यह भी गुजरात से है, नवरात्रि के दौरान डंडों के साथ किया जाता है।</span></li></ul>", "question_heading": ""}, {"sr_no": 103, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">थार मरुस्थल के शुष्क मैदानों में कौन सी वृक्ष प्रजाति सबसे अधिक पाई जाती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">खेजड़ी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बबूल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नीम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पीपल</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> खेजड़ी</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">खेजड़ी का पेड़ (प्रोसोपिस सिनेरिया) थार मरुस्थल के शुष्क मैदानों में पाई जाने वाली सबसे आम और सांस्कृतिक रूप से महत्वपूर्ण वृक्ष प्रजाति है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह अत्यधिक सूखा-प्रतिरोधी है और कम वर्षा वाली रेतीली मिट्टी में पनपता है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्थानीय रूप से \"रेगिस्तान का कल्पवृक्ष\" कहा जाने वाला यह पेड़ प्रदान करता है:</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गर्म रेगिस्तानी जलवायु में छाया और आश्रय।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पशुधन के लिए चारा (पत्तियाँ और फलियाँ)।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ग्रामीण समुदायों के लिए ईंधन की लकड़ी और इमारती लकड़ी।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नाइट्रोजन स्थिरीकरण के माध्यम से मिट्टी की उर्वरता।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">खेजड़ी के पेड़ को राजस्थान के बिश्नोई समुदाय में गहरा सम्मान दिया जाता है, जो इसे अपनी पारिस्थितिक परंपराओं के हिस्से के रूप में संरक्षित करते हैं।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का पुनरावलोकन</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">खेजड़ी </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; थार मरुस्थल का प्रमुख वृक्ष।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बबूल </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> शुष्क क्षेत्रों में पाया जाता है लेकिन खेजड़ी की तुलना में कम प्रमुख है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नीम </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> अर्ध-शुष्क और उष्णकटिबंधीय क्षेत्रों में आम है, थार के शुष्क मैदानों में नहीं।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पीपल </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> पवित्र अंजीर का पेड़, उपजाऊ मिट्टी में पनपता है, मरुस्थलीय परिस्थितियों में नहीं।</span></li></ul>", "question_heading": ""}, {"sr_no": 104, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से किसे संगीत में योगदान के लिए 2025 में मरणोपरांत पद्म विभूषण प्राप्त हुआ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पंकज उधास</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">शारदा सिन्हा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भीमसेन जोशी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आशा भोसले</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संगीत में योगदान के लिए 2025 में पद्म विभूषण (मरणोपरांत) बिहार की प्रसिद्ध लोक गायिका शारदा सिन्हा को दिया गया।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुख्य विवरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्राप्तकर्ता: शारदा सिन्हा (1949-2025)</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पुरस्कार: पद्म विभूषण (भारत का दूसरा सबसे बड़ा नागरिक सम्मान)</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रदत्त: राष्ट्रपति द्रौपदी मुर्मू द्वारा 2025 में मरणोपरांत</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">योगदान:</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उन्हें \"बिहार कोकिला\" के रूप में जाना जाता है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भोजपुरी, मैथिली और हिंदी लोक गीतों, विशेष रूप से भक्तिपूर्ण छठ पूजा गीतों के लिए प्रसिद्ध।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उनका संगीत बिहार की सांस्कृतिक पहचान का अभिन्न अंग बन गया।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विरासत:</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इससे पहले पद्म श्री (1991) और पद्म भूषण (2018) से सम्मानित।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उनके गीत जैसे \"कहे तोसे सजना\" (मैने प्यार किया, 1989) और \"बाबुल\" (हम आपके हैं कौन..! 1994) ने राष्ट्रीय लोकप्रियता हासिल की।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का पुनरावलोकन</span><span style=\"font-family:'Nirmala UI'\">:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पंकज उधास </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> गजल गायक, 2025 में मरणोपरांत पद्म भूषण से सम्मानित, पद्म विभूषण नहीं।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">शारदा सिन्हा </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सही; लोक संगीत के लिए 2025 में मरणोपरांत पद्म विभूषण प्राप्त हुआ।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भीमसेन जोशी </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> हिंदुस्तानी शास्त्रीय गायक, 2008 में भारत रत्न से सम्मानित।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आशा भोसले </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> महान पार्श्व गायिका, लेकिन 2025 में पद्म विभूषण से सम्मानित नहीं।</span></li></ul>", "question_heading": ""}, {"sr_no": 105, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संगम साहित्य संकलन 'एत्तुतोगई' (Ettuttokai) में प्राचीन तमिल कविता के कितने संग्रह हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">6</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">10</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> 8</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संगम साहित्य संकलन 'एत्तुतोगई' का शाब्दिक अर्थ है \"आठ संकलन\"।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह 300 ईसा पूर्व - 300 ईस्वी के बीच संकलित संगम कविता के प्रमुख संग्रहों में से एक है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इन संकलनों में प्रेम (अकम) और युद्ध/नैतिकता (पुरम) जैसे विषयों पर कविताएँ हैं।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">'पत्तुप्पाट्टु' (दस इद्दिल) के साथ मिलकर, एत्तुतोगई तमिल शास्त्रीय साहित्य के संगम संग्रह का निर्माण करता है।</span></li></ul>", "question_heading": ""}, {"sr_no": 106, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा जीव स्वपोषी (autotrophic) और विषमपोषी (heterotrophic) दोनों प्रकार का पोषण प्रदर्शित करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यूग्लीना (Euglena)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अमीबा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पैरामीशियम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्लाज्मोडियम</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर:</span><span style=\"font-family:'Nirmala UI'\"> यूग्लीना</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यूग्लीना एक अद्वितीय जीव है जो स्वपोषी और विषमपोषी दोनों प्रकार का पोषण प्रदर्शित करता है।</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्वपोषी मोड:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">इसमें क्लोरोफिल के साथ क्लोरोप्लास्ट होते हैं।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">पौधों की तरह सूर्य के प्रकाश में प्रकाश संश्लेषण कर सकता है।</span></li></ul></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विषमपोषी मोड:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">सूर्य के प्रकाश की अनुपस्थिति में, यूग्लीना अपने पर्यावरण से पोषक तत्वों को अवशोषित कर सकता है।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">कार्बनिक पदार्थों को खाकर एक जानवर की तरह व्यवहार करता है।</span></li><li style=\"margin-left:30.2pt;padding-left:5.8pt\"><span style=\"font-family:'Nirmala UI'\">यह दोहरी क्षमता यूग्लीना को एक 'मिक्सोट्रॉफ़' (स्वपोषण और विषमपोषण दोनों में सक्षम जीव) बनाती है।</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का पुनरावलोकन</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यूग्लीना </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\
