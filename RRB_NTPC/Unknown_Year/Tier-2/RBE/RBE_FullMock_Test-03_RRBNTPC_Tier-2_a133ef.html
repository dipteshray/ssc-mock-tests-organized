tion</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Statement I</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Flash ROM</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> is a type of non-volatile memory, meaning it </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">retains stored data even when power is switched off</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">This makes it suitable for permanent storage of firmware and system boot instructions.</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Statement II</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Flash ROM is </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">slower than CPU cache</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> (which is high-speed memory directly linked to the processor).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">However, it is </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">ideal for firmware storage</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, since firmware does not require frequent high-speed access like cache does.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Which of the following is NOT associated with cricket terminology?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Raider</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Powerplay</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Cover drive</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Leg before wicket</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option A: </span><span>Raider</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Raider</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → This belongs to </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Kabaddi</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, where a player (raider) enters the opponent’s half to tag defenders and return safely. It has no connection with cricket.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Powerplay</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → A cricket term, especially in limited-overs formats, referring to fielding restrictions during certain overs.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Cover drive</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → A classic cricket batting stroke played through the cover region.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Leg before wicket (LBW)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → A mode of dismissal in cricket when the ball strikes the batsman’s leg in line with the stumps and would have hit the wicket.</span></li></ul>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Which authority in an election constituency is responsible for supervising the poll process and declaring the final result?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Booth Level Officer</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Presiding Officer</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Polling Officer</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Returning Officer </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option D: Returning Officer</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Returning Officer (RO)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> →</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Appointed by the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Election Commission of India</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> for each constituency.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Supervises the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">entire poll process</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> including conduct of elections, counting of votes, and declaration of results.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Ensures elections are held in a </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">free and fair manner</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Booth Level Officer (BLO)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Works at the polling booth level, mainly responsible for voter list management and assisting voters.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Presiding Officer</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → In charge of a single polling station, ensures smooth conduct of voting at that booth.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Polling Officer</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Assists the Presiding Officer in managing the polling station, verifying voters, and issuing ballot papers/EVM slips.</span></li></ul>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Tsarap Chu Conservation Reserve, described as India’s largest conservation reserve in 2025, is located in which State/UT?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Arunachal Pradesh</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Himachal Pradesh</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Sikkim</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Meghalaya</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>The Tsarap Chu Conservation Reserve, notified in May 2025, is located in Lahaul-Spiti district of Himachal Pradesh, not Ladakh. It spans 1,585 sq km, making it India’s largest conservation reserve. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Key Facts:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Location:</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> Lahaul-Spiti, </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Himachal Pradesh</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Area:</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> 1,585 sq km (largest conservation reserve in India).</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Notification Date:</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> 7 May 2025, under Section 36A(1) of the Wildlife (Protection) Act, 1972.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Boundaries:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">North:</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> Union Territory of Ladakh</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">East:</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> Kibber Wildlife Sanctuary (up to Malang Nala &amp; Lungar Lumpa)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">South:</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> Kabjima Nala</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">West:</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> Chandratal Wildlife Sanctuary &amp; Baralacha Pass</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Ecological Importance:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Snow Leopard Habitat:</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> Recognized as one of the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">high-density snow leopard zones</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> in Himachal Pradesh.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Other Mammals:</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> Tibetan wolf, Himalayan ibex, bharal (blue sheep), kiang (wild ass), Tibetan argali.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Birds:</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> Rose Finch, Tibetan Raven, Yellow-billed Chough.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Corridor Role:</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> Connects </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Kibber Wildlife Sanctuary</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> and </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Chandratal Wildlife Sanctuary</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, ensuring genetic flow and biodiversity conservation.</span></li></ul>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Consider the following statements about classical languages in India:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>(I) Recognition can encourage research and academic work.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>(II) Recognition automatically makes the language compulsory in every school.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Which of the statements given above is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Only statement I is correct</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Only statement II is correct</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Both statements I and II are correct</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Neither statement I nor II is correct</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option A: Only statement I is correct</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Statement I</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Recognition of a language as </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">classical</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> encourages </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">research, academic work, and preservation</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">The Government of India provides financial assistance for universities and institutions to promote study and research in classical languages.</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Statement II</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → False.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Recognition does </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">not automatically make the language compulsory in schools</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">It only provides </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">support for higher studies, scholarships, and research projects</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, not mandatory inclusion in school curricula.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Which of the following is an example of chemical reaction evidence?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>No change in texture</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Change in container size</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Change in temperature </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Change in external shape only</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option C: Change in temperature</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Evidence of a </span><span style=\"font-weight:bold\">chemical reaction</span><span> includes observable changes such as:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Change in temperature</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Exothermic or endothermic reactions release or absorb heat.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Color change</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Indicates new substances formed.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Gas evolution</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Bubbles or fumes show reaction activity.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Precipitate formation</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Solid formed from mixing solutions.</span></li></ul>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Which of the following is NOT one of the six Fundamental Rights currently provided in Part III?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Right to Equality</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Right to Religious Education</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Right to Freedom</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Right against Exploitation</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>The Fundamental Rights currently provided in </span><span style=\"font-weight:bold\">Part III of the Indian Constitution</span><span> are six in number:</span></p><ol type=\"1\"><li style=\"margin-left:32.11pt;line-height:105%;padding-left:3.89pt;font-size:12pt\"><span style=\"font-weight:bold\">Right to Equality</span><span> (Articles 14–18)</span></li><li style=\"margin-left:32.11pt;line-height:105%;padding-left:3.89pt;font-size:12pt\"><span style=\"font-weight:bold\">Right to Freedom</span><span> (Articles 19–22)</span></li><li style=\"margin-left:32.11pt;line-height:105%;padding-left:3.89pt;font-size:12pt\"><span style=\"font-weight:bold\">Right against Exploitation</span><span> (Articles 23–24)</span></li><li style=\"margin-left:32.11pt;line-height:105%;padding-left:3.89pt;font-size:12pt\"><span style=\"font-weight:bold\">Right to Freedom of Religion</span><span> (Articles 25–28)</span></li><li style=\"margin-left:32.11pt;line-height:105%;padding-left:3.89pt;font-size:12pt\"><span style=\"font-weight:bold\">Cultural and Educational Rights</span><span> (Articles 29–30)</span></li><li style=\"margin-left:32.11pt;line-height:105%;padding-left:3.89pt;font-size:12pt\"><span style=\"font-weight:bold\">Right to Constitutional Remedies</span><span> (Article 32)</span></li></ol><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Right to Religious Education</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Not a Fundamental Right.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">The Constitution provides </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Cultural and Educational Rights</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> (Articles 29–30), which protect minorities’ rights to establish and administer educational institutions.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">But there is </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">no specific Fundamental Right called “Right to Religious Education.”</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>The first World Clean Energy Day was observed by the United Nations on:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>26 January 2021</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>26 January 2022</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>26 January 2023</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>26 January 2024</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>The first World Clean Energy Day (officially called the International Day of Clean Energy) was observed by the United Nations on 26 January 2024.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Key Details:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Date of First Observance:</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">26 January 2024</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Declared By:</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> United Nations General Assembly (Resolution A/77/327).</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Purpose:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Raise awareness about the need for a </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">just and inclusive transition to clean energy</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Highlight the role of clean energy in achieving </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Sustainable Development Goal 7 (SDG7)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> — ensuring access to affordable, reliable, sustainable, and modern energy for all by 2030.</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Global Context:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Around </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">675 million people</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> still lack electricity.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">2.3 billion people</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> rely on polluting fuels (wood, dung) for cooking, causing health and environmental issues.</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">UN Secretary-General’s Message:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Called clean energy “the gift that keeps giving.”</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Stressed the urgency of phasing out fossil fuels and tripling renewable energy capacity by 2030.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Which team won the third edition of the Women’s Premier League in 2025?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Delhi Capitals</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Mumbai Indians </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Gujarat Giants</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Royal Challengers Bengaluru</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>The winner of the third edition of the Women’s Premier League (WPL) in 2025 was the Mumbai Indians Women, who defeated Delhi Capitals Women in the final by 8 runs at the Brabourne Stadium, Mumbai, on 15 March 2025. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Final Match Highlights:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Date &amp; Venue:</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> 15 March 2025, Brabourne Stadium, Mumbai</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Finalists:</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> Mumbai Indians vs Delhi Capitals</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Result:</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> Mumbai Indians won by </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">8 runs</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Scores:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Mumbai Indians → 149/7 (20 overs)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Delhi Capitals → 141/9 (20 overs)</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Player of the Match:</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> Harmanpreet Kaur (Mumbai Indians)</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Key Performers:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Nat Sciver-Brunt (MI):</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> Orange Cap winner with 523 runs (highest in WPL history at the time).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Amelia Kerr (MI):</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> Purple Cap winner with 18 wickets.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>The alternative forms of the same gene located at the same locus are known as:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Genomes</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Gametes</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Alleles</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Ribosomes</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option C: Alleles</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Alleles</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Different versions of the same gene found at the same locus on homologous chromosomes.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Example: Gene for eye color → Alleles may code for </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">blue eyes</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> or </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">brown eyes</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">They can be </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">dominant</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> or </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">recessive</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, influencing traits in offspring.</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Genomes</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → The complete set of genetic material in an organism.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Gametes</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Reproductive cells (sperm and egg) carrying haploid sets of chromosomes.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Ribosomes</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Cellular structures responsible for protein synthesis, not related to gene variants.</span></li></ul>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>What network topology links every node directly to every other node?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Bus Network Topology</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Ring Network Topology</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Star Network Topology</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Mesh Network Topology</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option D: Mesh Network Topology</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Mesh Topology</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Each device (node) is connected to </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">every other device</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> in the network.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Provides </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">high reliability</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> (if one link fails, data can still travel via other paths).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Used in </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">critical systems</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> like military communication, wireless networks, and advanced computer networks.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Downside: Very </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">expensive and complex</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> to implement due to the large number of connections.</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Bus Topology</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → All devices share a single communication line (backbone).</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Ring Topology</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Devices connected in a circular path, data travels in one direction.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Star Topology</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → All devices connected to a central hub/switch.</span></li></ul>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Which river is widely known as the longest river flowing through the Thar desert region of India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Ghaggar river</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Mahi river</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Luni river</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Banas river</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option C: Luni River</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Luni River</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> →</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Originates from the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Pushkar valley near Ajmer, Rajasthan</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Flows southwest through the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Thar Desert</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, covering about </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">495 km</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Ends in the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Rann of Kutch (Gujarat)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, where it dissipates into marshy land.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Known locally as the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">“Salt River”</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> because its water becomes increasingly saline as it flows through arid regions.</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Ghaggar River</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Seasonal river, mainly flows in Haryana and Punjab, not the Thar Desert.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Mahi River</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Flows through Madhya Pradesh, Rajasthan, and Gujarat, but not primarily in the Thar Desert.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Banas River</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Tributary of Chambal, flows in Rajasthan but does not dominate the Thar Desert region.</span></li></ul>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Which Schedule of the Indian Constitution lists the powers, authority and responsibilities of Panchayats?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Ninth Schedule</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Tenth Schedule</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Eleventh Schedule </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Twelfth Schedule</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option C: Eleventh Schedule</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Eleventh Schedule</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Added by the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">73rd Constitutional Amendment Act, 1992</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">It contains </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">29 subjects</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> related to rural development, agriculture, health, sanitation, education, and local governance.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Empowers </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Panchayati Raj Institutions (PRIs)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> to function as units of self-government.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Other options:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Ninth Schedule</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Laws protected from judicial review (added by 1st Amendment, 1951).</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Tenth Schedule</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Anti-Defection Law (added by 52nd Amendment, 1985).</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Twelfth Schedule</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Powers of Municipalities (added by 74th Amendment, 1992).</span></li></ul>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>A person who works for at least six months in a year is classified in Census terminology as a:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Main worker</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Marginal worker</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Casual worker</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Household worker</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option A: </span><span>Main worker</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Main Worker</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → A person who works for </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">183 days or more (at least six months) in a year</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Marginal Worker</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → A person who works for </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">less than 183 days (less than six months)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> in a year.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Casual Worker</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Term used in labour studies, not Census classification.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Household Worker</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Not a Census category; household work is generally considered non-economic activity.</span></li></ul>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Bokaro, Jharkhand is famous for which Industry?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Aluminum</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Mica</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Steel</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Coal</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option C: Steel</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Bokaro Steel Plant</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> →</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Established in </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">1964</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> with Soviet collaboration.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">One of the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">largest steel plants in India</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, operated by </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Steel Authority of India Limited (SAIL)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Produces a wide range of steel products including flat steel, plates, and hot-rolled coils.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Plays a crucial role in India’s industrial development and infrastructure growth.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Other options:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Aluminium</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Prominent in Odisha (NALCO).</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Mica</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Jharkhand is known for mica deposits, but Bokaro is not famous for it.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Coal</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Jharkhand has rich coal reserves, but Bokaro’s identity is tied to steel production.</span></li></ul>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>The Balimela Power Plant is located in which state of India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Odisha</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Jharkhand</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Chhattisgarh</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Andhra Pradesh</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option A: Odisha</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Balimela Hydro-Electric Project</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Situated on the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Sileru River</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, a tributary of the Godavari, in </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Malkangiri district, Odisha</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Commissioned in </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">1973</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, jointly developed by </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Odisha and Andhra Pradesh</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Installed capacity: </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">510 MW</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> (6 units of 60 MW + 2 units of 75 MW).</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Plays a vital role in supplying electricity to southern Odisha and parts of Andhra Pradesh.</span></li></ul>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>What does the shorthand abbreviation 'ALU' stand for in processors?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Advanced Logical Unit</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Arithmetic Logic Unit</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Array Line Interface</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Application Layer Unit</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option B: Arithmetic Logic Unit</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Arithmetic Logic Unit (ALU)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → A fundamental component of the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">CPU</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Performs two main types of operations:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Arithmetic operations</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Addition, subtraction, multiplication, division.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Logical operations</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Comparisons (greater than, equal to, less than), AND, OR, NOT.</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Works closely with the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Control Unit (CU)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> and </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Registers</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> to execute instructions.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Essential for all computational tasks in digital systems.</span></li></ul>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>With reference to the early Vedic economy, the Aryans were primarily:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Urban craftsmen with stone forts</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Maritime traders with coin money</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Pastoral people with cattle wealth</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Imperial officers with land grants</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option C: </span><span>Pastoral people with cattle wealth</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">The </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">early Vedic society (1500–1000 BCE)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> was </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">pastoral and semi-nomadic</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Cattle wealth</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> was the main measure of prosperity.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Cows were considered sacred and central to livelihood.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Terms like “Gavishti” (search for cows) show cattle raids were common.</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Agriculture existed but was secondary; pastoralism dominated.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Trade was limited, and coinage was not yet in use — </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">barter system</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> prevailed.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Urbanization, forts, and land grants came much later in the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">later Vedic and post-Vedic periods</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li></ul>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Assertion (A):</span><span> Directive Principles are important for building a welfare state.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Reason (R):</span><span> They guide the State in framing social and economic policies.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Choose the correct answer.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Both A and R are true, and R explains A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Both A and R are true, but R does not explain A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>A is true, but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>A is false, but R is true</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option A: </span><span>Both A and R are true, and R explains A</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Assertion (A): Directive Principles are important for building a welfare state</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">The </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Directive Principles of State Policy (DPSPs)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, enshrined in </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Part IV of the Constitution (Articles 36–51)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, aim to establish </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">social and economic democracy</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">They guide the State to promote justice, equality, and welfare of the people.</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Reason (R): They guide the State in framing social and economic policies</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">DPSPs are </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">non-justiciable</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> (not enforceable by courts), but they act as </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">guidelines</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> for the government to frame policies ensuring welfare, such as education, health, livelihood, and social justice.</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Since </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">R directly explains A</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, the correct option is: </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Both A and R are true, and R explains A.</span></li></ul>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Under the Citizenship (Amendment) Act, 2019, the notified migrants are from which set of neighbouring countries?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Maldives, Bhutan and Afghanistan</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Nepal, Bhutan and Bangladesh</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Sri Lanka, Myanmar and Pakistan</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Afghanistan, Bangladesh and Pakistan</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>The </span><span style=\"font-weight:bold\">Citizenship (Amendment) Act, 2019 (CAA)</span><span> provides a pathway to Indian citizenship for certain migrants from </span><span style=\"font-weight:bold\">three neighbouring countries</span><span>:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option D: Afghanistan, Bangladesh and Pakistan</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">The Act was passed in </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">December 2019</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">It applies to </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Hindu, Sikh, Buddhist, Jain, Parsi, and Christian migrants</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> from </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Afghani
