stan, Bangladesh, and Pakistan</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> who entered India on or before </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">31 December 2014</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">These groups are considered persecuted minorities in those countries.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">The Act </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">does not cover Muslims</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> from these countries.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">It reduces the minimum residency requirement for citizenship from </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">11 years to 5 years</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> for these migrants.</span></li></ul>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>The garbhagriha of a Hindu temple is best described as which part of the temple architecture?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Outer gateway of the temple complex</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Sanctum chamber housing the deity</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Open hall used for public dance</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Tall entrance tower above courtyard</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option B: Sanctum chamber housing the deity</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Garbhagriha</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> literally means “womb chamber”.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">It is the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">innermost sanctum</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> of the temple where the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">main deity’s idol or image</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> is enshrined.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Usually small, dark, and without much ornamentation, symbolizing the spiritual core.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Access is often restricted to priests, while devotees view the deity from outside.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Architecturally, it is topped by the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">shikhara (tower)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> in Nagara style or </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">vimana</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> in Dravidian style.</span></li></ul>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>What functional layer handles packet routing across different subnets?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Data Link Framework</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Physical Hardware Layer</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Transport Session Layer</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Network Control Layer</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option D: Network Control Layer</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Network Layer</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> (often referred to as the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Network Control Layer</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> in OSI terminology) →</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Responsible for </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">logical addressing (IP addresses)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Handles </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">packet forwarding and routing</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> between different subnets and networks.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Ensures data reaches the correct destination across multiple hops.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Protocols: </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">IP (IPv4/IPv6), ICMP, ARP, RIP, OSPF, BGP</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li></ul></li><li style=\"margin-left:9.6pt;line-heig :105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">It was first held in </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">1941</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, named after </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Sir Manmatha Nath Roy Chowdhury of Santosh</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, a former President of the Indian Football Association.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">The competition features teams representing </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">states, government institutions, and services</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">In the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">2025–26 edition</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Services defeated Kerala in extra-time</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> to clinch the title.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Hockey</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Associated with tournaments like Beighton Cup, Sultan Azlan Shah Cup.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Badminton</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Linked to events like Thomas Cup, Uber Cup.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Cricket</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Domestic tournaments include Ranji Trophy, Vijay Hazare Trophy, not Santosh Trophy.</span></li></ul>", "question_heading": ""}, {"sr_no": 102, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>The principle that every object remains at rest or in uniform motion unless acted upon by an external force is called:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Newton’s First Law of Motion</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Newton’s Third Law of Motion</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Kepler’s First Law of Planetary Motion</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Law of Conservation of Momentum</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option A: Newton’s First Law of Motion</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Newton’s First Law of Motion</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Also called the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Law of Inertia</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">It says: “A body continues to be in its state of rest or of uniform motion in a straight line unless compelled to change that state by an external force.”</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">This explains why objects don’t change their motion on their own — an external force (like friction, gravity, or a push/pull) is required.</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Newton’s Third Law of Motion</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → States “For every action, there is an equal and opposite reaction.”</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Kepler’s First Law of Planetary Motion</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → States that planets move in </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">elliptical orbits</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> with the Sun at one focus.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Law of Conservation of Momentum</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → States that the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">total momentum of a system remains constant</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> if no external force acts on it.</span></li></ul>", "question_heading": ""}, {"sr_no": 103, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>What is the generally accepted maximum email attachment size across many major email providers?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>10 MB</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>25 MB</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>50 MB</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>100 MB</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option B: 25 MB</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Most popular email services like </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Gmail</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Outlook</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, and </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Yahoo Mail</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> set the maximum attachment size at </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">25 MB</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">If a file exceeds this limit, providers usually suggest uploading it to </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">cloud storage</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> (Google Drive, OneDrive, Dropbox) and sharing the link instead.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Smaller limits</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">: Some older or enterprise mail servers may restrict attachments to </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">10 MB</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Larger limits</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">: Few services allow up to </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">50 MB or more</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, but </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">25 MB</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> remains the widely accepted standard.</span></li></ul>", "question_heading": ""}, {"sr_no": 104, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Consider the following statements about Directive Principles of State Policy:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>(I) They are mentioned in Part IV of the Constitution.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>(II) They are directly enforceable by courts like Fundamental Rights.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Which of the statements given above is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Only statement I is correct</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Only statement II is correct</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Both statements I and II are correct</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Neither statement I nor II is correct</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option A: </span><span>Only statement I is correct</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Statement I: They are mentioned in Part IV of the Constitution</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Directive Principles of State Policy (DPSPs)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> are contained in </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Part IV (Articles 36–51)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> of the Indian Constitution.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">They serve as </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">guidelines for governance</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, aiming to establish social and economic democracy.</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Statement II: They are directly enforceable by courts like Fundamental Rights</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> Incorrect.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">DPSPs are </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">non</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">‑</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">justiciable</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, meaning they </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">cannot be enforced by courts</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">They are moral and political directives for the state, unlike </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Fundamental Rights</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> (Part III), which are </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">justiciable</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> and enforceable in courts.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 105, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>ASCII in computer terminology stands for:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>American Standard Code for Information Interchange</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>American Scientific Code for Internet Interaction</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Advanced System Code for Information Indexing</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Applied Standard Code for Internal Interface</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option A: </span><span>American Standard Code for Information Interchange</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">ASCII</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> is a </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">character encoding standard</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> developed in the 1960s.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">It represents </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">text in computers, communication equipment, and other devices</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> that use text.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Each character (letters, digits, punctuation, control codes) is assigned a </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">7</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">‑</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">bit binary number</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> (values 0–127).</span></li></ul>", "question_heading": ""}, {"sr_no": 106, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Mohammad Qasim Nanotavi and Rashid Ahmad Gangohi are associated with the founding of which movement?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Pagal Panthi Movement</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Wahabi Movement</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Deoband Movement</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Faraizi Movement</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option C: </span><span>Deoband Movement</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">The </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Deoband Movement</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> was founded in </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">1866</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> at </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Darul Uloom, Deoband (Uttar Pradesh)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:27.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Leaders: </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Mohammad Qasim Nanotavi</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> and </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Rashid Ahmad Gangohi</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:27.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Aim:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">To </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">revive Islamic learning</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> and protect Muslim identity under British colonial rule.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Promote </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">religious education</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> based on Quran and Hadith.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Oppose Western cultural influence and preserve traditional Islamic values.</span></li></ul></li><li style=\"margin-left:27.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">The movement established </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Darul Uloom Deoband</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, which became a major Islamic seminary influencing South Asian Muslim society.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Why Other Options Are Wrong:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Pagal Panthi Movement</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → A tribal movement in Bengal led by Karam Shah, not linked to Nanotavi or Gangohi.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Wahabi Movement</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Reformist Islamic movement led by Syed Ahmed Barelvi, different leaders.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Faraizi Movement</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Led by Haji Shariatullah in Bengal, focused on Islamic reforms among peasants.</span></li></ul>", "question_heading": ""}, {"sr_no": 107, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Who led the Dandi March in March 1930 as part of the Civil Disobedience Movement?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Jawaharlal Nehru</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Mahatma Gandhi </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Lala Lajpat Rai</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Subhas Chandra Bose</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option B: </span><span>Mahatma Gandhi</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Mahatma Gandhi</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> launched the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Civil Disobedience Movement</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> with the famous </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Dandi March</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">He began the march on </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">12 March 1930</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> from </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Sabarmati Ashram</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> with 78 followers.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">After walking about </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">240 miles (390 km)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, they reached </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Dandi (Navsari district, Gujarat)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> on </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">6 April 1930</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Gandhi broke the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">salt law</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> by making salt from seawater, symbolizing defiance against unjust British laws.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">This act became a </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">mass movement</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, inspiring millions across India to join the struggle for independence.</span></li></ul>", "question_heading": ""}, {"sr_no": 108, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Which Indian state has high population density mainly due to flat plains, fertile soils and abundant rainfall?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Himachal Pradesh</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Rajasthan</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Kerela</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Arunachal Pradesh</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option C: </span><span>Kerala</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Kerala</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> →</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Lies along the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">coastal plains</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> of the Western Ghats.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Has </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">fertile alluvial soils</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> and abundant </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">rainfall</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> from both the southwest and northeast monsoons.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">These conditions support </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">intensive agriculture</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> (rice, coconut, spices, cash crops) and high human settlement.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">As a result, Kerala has one of the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">highest population densities</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> in India.</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Himachal Pradesh</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Moun
