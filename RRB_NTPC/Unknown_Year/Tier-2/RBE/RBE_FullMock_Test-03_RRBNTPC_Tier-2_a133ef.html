<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>5.) GK Sectional Mock Test-3 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

s third to the right of Y.</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">If 29 July 2001 is Sunday, then what will be the day of the week on 20 February 2015?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Tuesday</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Friday</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sunday</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Monday</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Logic:</span><br><span style=\"font-family:'Cambria Math'\">Find the total odd days from </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">29 July 2001 to 20 February 2015</span><span style=\"font-family:'Cambria Math'\">.</span><br><span style=\"font-family:'Cambria Math'\">From 29 July 2001 to 29 July 2014 = 13 years</span><br><span style=\"font-family:'Cambria Math'\">Leap years: 2004, 2008, 2012 = 3 leap years</span><br><span style=\"font-family:'Cambria Math'\">Odd days = 10 normal years + 3 leap years = 10 × 1 + 3 × 2 = 16 = 2 odd days</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">From 29 July 2014 to 20 February 2015:</span><br><span style=\"font-family:'Cambria Math'\">Remaining July 2 + August 31 + September 30 + October 31 + November 30 + December 31 + January 31 + February 20</span><br><span style=\"font-family:'Cambria Math'\">= 206 days = 3 odd days</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Total odd days = 2 + 3 = 5</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sunday + 5 days = </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Friday</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Final Answer:</span><span style=\"font-family:'Cambria Math'\"> (b) Friday</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statements:</span><br><span style=\"font-family:'Cambria Math'\">Some movies are videos.</span><br><span style=\"font-family:'Cambria Math'\">No video is audio.</span><br><span style=\"font-family:'Cambria Math'\">All audios are songs.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Conclusions:</span><br><span style=\"font-family:'Cambria Math'\">(I) All movies can never be audios.</span><br><span style=\"font-family:'Cambria Math'\">(II) No video is a song.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">None of the conclusions follow</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only conclusion II follows</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only conclusion I follows</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both conclusions I and II follow</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1780663698387_image004.png\" width=\"375\" height=\"139\" alt ></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Conclusion I: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">All movies can never be audios</span><br><span style=\"font-family:'Cambria Math'\">Some movies are videos, and no video is audio.</span><br><span style=\"font-family:'Cambria Math'\">So, at least some movies are definitely not audios. Hence, all movies cannot be audios.</span><br><span style=\"font-family:'Cambria Math'\">So, conclusion I follows.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Conclusion II: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">No video is a song</span><br><span style=\"font-family:'Cambria Math'\">No video is audio, and all audios are songs.</span><br><span style=\"font-family:'Cambria Math'\">But this does not mean videos cannot be songs directly.</span><br><span style=\"font-family:'Cambria Math'\">So, conclusion II does not follow.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Final Answer:</span><span style=\"font-family:'Cambria Math'\"> (c) Only conclusion I follows.</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In a certain code language, ‘INDULGE’ is coded as ‘48’ and ‘PURGE’ is coded as ‘24’. How will ‘PUNY’ be coded in that language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">25</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">11</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">18</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">15</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Logic:</span><br><span style=\"font-family:'Cambria Math'\">Code = </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">(Number of letters)² - 1</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Solution:</span><br><span style=\"font-family:'Cambria Math'\">INDULGE has 7 letters:</span><br><span style=\"font-family:'Cambria Math'\">7² - 1 = 49 - 1 = 48</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">PURGE has 5 letters:</span><br><span style=\"font-family:'Cambria Math'\">5² - 1 = 25 - 1 = 24</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">PUNY has 4 letters:</span><br><span style=\"font-family:'Cambria Math'\">4² - 1 = 16 - 1 = </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">15</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Final Answer:</span><span style=\"font-family:'Cambria Math'\"> (d) 15</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">If the year is NOT a leap year, then how is the last day of the year and first day of the same year related?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">First day is Sunday, last day is Friday</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">First day is Sunday, last day is Saturday</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">First day is Tuesday, last day is Saturday</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">They are the same</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Logic:</span><br><span style=\"font-family:'Cambria Math'\">A non-leap year has 365 days, and 365 gives 1 odd day.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Solution:</span><br><span style=\"font-family:'Cambria Math'\">In a non-leap year, the first day is counted as Day 1.</span><br><span style=\"font-family:'Cambria Math'\">After completing 364 days, the weekday cycle repeats exactly because 364 = 52 weeks.</span><br><span style=\"font-family:'Cambria Math'\">So, the 365th day, that is the last day of the year, falls on the same day as the first day.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Final Answer: (d) They are the same.</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Seven people, R, S, T, U, V, W and X, are sitting in a row, facing east. V is seated third from the right end. S is fourth to the left of W. R is seated to the right of V and at one of the ends. Only one person is seated between T and S. U does not sit at any of the extreme ends. Who is seated at the extreme left end?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">V</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">X</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">T</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">W</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1780663698387_image005.png\" width=\"255\" height=\"352\" alt ></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Select the set in which the numbers are related in the same way as are the numbers of the following sets.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(37, 48, 70)</span><br><span style=\"font-family:'Cambria Math'\">(41, 52, 74)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(47, 58, 70)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(32, 43, 54)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(56, 67, 78)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(24, 35, 57)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Logic:</span><br><span style=\"font-family:'Cambria Math'\">In each set, the pattern is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">+11, then +22</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Solution:</span><br><span style=\"font-family:'Cambria Math'\">37 + 11 = 48, 48 + 22 = 70</span><br><span style=\"font-family:'Cambria Math'\">41 + 11 = 52, 52 + 22 = 74</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Option (d):</span><br><span style=\"font-family:'Cambria Math'\">24 + 11 = 35, 35 + 22 = 57</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So, the correct set is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">(24, 35, 57)</span><span style=\"font-family:'Cambria Math'\">.</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Among five persons — P, Q, R, S, and T: P is taller than only T.</span><br><span style=\"font-family:'Cambria Math'\">Q is taller than P but shorter than R. S is the tallest. Who is at the middle position?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">T</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">S</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Q</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">R</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Order: S &gt; R &gt; Q &gt; P &gt; T</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Middle position = Q</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Select the word-pair that best represents a similar relationship to the one expressed in the pair of words given below.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Leaf : Oak</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Berry : Fruit</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bulb : Tulip</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Needle : Pine</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Tree : Forest</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Logic:</span><br><span style=\"font-family:'Cambria Math'\">A </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">leaf</span><span style=\"font-family:'Cambria Math'\"> is a part of an </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">oak</span><span style=\"font-family:'Cambria Math'\"> tree. Similarly, a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">needle</span><span style=\"font-family:'Cambria Math'\"> is a leaf-like part of a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">pine</span><span style=\"font-family:'Cambria Math'\"> tree.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Solution:</span><br><span style=\"font-family:'Cambria Math'\">Leaf : Oak means </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">part of a tree</span><span style=\"font-family:'Cambria Math'\">.</span><br><span style=\"font-family:'Cambria Math'\">Pine trees have needle-like leaves, so </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Needle : Pine</span><span style=\"font-family:'Cambria Math'\"> follows the same relation.</span><br><span style=\"font-family:'Cambria Math'\">Berry is a type of fruit, not part of fruit.</span><br><span style=\"font-family:'Cambria Math'\">Bulb is related to tulip but not in the same “leaf-like part of tree” relation.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Final Answer:</span><span style=\"font-family:'Cambria Math'\"> (c) Needle : Pine</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Select the triad that follows the same pattern as that followed by the two triads given below. Both triads follow the same pattern.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">TY-OT-JO</span><br><span style=\"font-family:'Cambria Math'\">AF-VA-QV</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">LQ-GL-CG</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">PU-LP-FK</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">CH-XC-SX</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">FK-AE-VA</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Logic:</span><br><span style=\"font-family:'Cambria Math'\">In each triad, the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">first letter decreases by 5</span><span style=\"font-family:'Cambria Math'\">, and the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">second letter also decreases by 5</span><span style=\"font-family:'Cambria Math'\"> in every next pair.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Solution:</span><br><span style=\"font-family:'Cambria Math'\">TY → OT → JO</span><br><span style=\"font-family:'Cambria Math'\">T - 5 = O, O - 5 = J</span><br><span style=\"font-family:'Cambria Math'\">Y - 5 = T, T - 5 = O</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">AF → VA → QV</span><br><span style=\"font-family:'Cambria Math'\">A - 5 = V, V - 5 = Q</span><br><span style=\"font-family:'Cambria Math'\">F - 5 = A, A - 5 = V</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Option (c):</span><br><span style=\"font-family:'Cambria Math'\">CH → XC → SX</span><br><span style=\"font-family:'Cambria Math'\">C - 5 = X, X - 5 = S</span><br><span style=\"font-family:'Cambria Math'\">H - 5 = C, C - 5 = X</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So, option </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">(c) CH-XC-SX</span><span style=\"font-family:'Cambria Math'\"> follows the same pattern.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Final Answer:</span><span style=\"font-family:'Cambria Math'\"> (c) CH-XC-SX</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In this question, a question is followed by two statements numbered (I) and (II). You have to decide whether the data provided in the statements are sufficient to answer the question. Read both the statements and decide the appropriate answer.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Q. Arjun, Kunal, Mohit, Prateek, and Saurav, each have different height. Who is the tallest?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(I) Mohit is taller than Arjun and Kunal but shorter than Prateek.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(II) Saurav is taller than Mohit but shorter than Prateek.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Data in Statement I alone is sufficient to answer the question while data in Statement II is not</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both statements I and II together are NOT sufficient to answer the question</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both statements I and II together (and not statement I alone or statement II alone) are sufficient to answer the question</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Data in Statement II alone is sufficient to answer the question while data in Statement I is not</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">From Statement I:</span><br><span style=\"font-family:'Cambria Math'\">Mohit is taller than Arjun and Kunal but shorter than Prateek.</span><br><span style=\"font-family:'Cambria Math'\">So, the order becomes:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Prateek &gt; Mohit &gt; Arjun, Kunal</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">But the position of Saurav is unknown. Hence, Statement I alone is not sufficient.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">From Statement II:</span><br><span style=\"font-family:'Cambria Math'\">Saurav is taller than Mohit but shorter than Prateek.</span><br><span style=\"font-family:'Cambria Math'\">So, the order becomes:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Prateek &gt; Saurav &gt; Mohit</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">But the positions of Arjun and Kunal are unknown. Hence, Statement II alone is not sufficient.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Combining Statements I and II:</span></p><p style=\"margin-to rgin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So, the missing number is 314.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Correct Answer: D</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">While introducing Madhav, Vihaan said, “I am the only son of one of the sons of his mother.” How is Madhav related to Vihaan?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Father or paternal uncle</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Son or brother</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Cousin</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Maternal nephew or paternal nephew</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">“His mother” means Madhav’s mother.</span><br><span style=\"font-family:'Cambria Math'\">“One of the sons of Madhav’s mother” means Madhav or Madhav’s brother.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Solution:</span><br><span style=\"font-family:'Cambria Math'\">Vihaan is the only son of one of the sons of Madhav’s mother.</span><br><span style=\"font-family:'Cambria Math'\">So, Vihaan can be the son of Madhav or the son of Madhav’s brother.</span><br><span style=\"font-family:'Cambria Math'\">Therefore, Madhav can be Jihaan’s father or paternal uncle.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Final Answer: (a) Father or paternal uncle</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In a row of 52 people facing north, Dimple sits 17th from the left end. If only 15 people sit to the right of Avni, then how many people sit between Dimple and Avni?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">17</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">18</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">20</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">19</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Logic:</span><br><span style=\"font-family:'Cambria Math'\">First find Avni’s position from the left end.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Solution:</span><br><span style=\"font-family:'Cambria Math'\">Total people = 52</span><br><span style=\"font-family:'Cambria Math'\">People to the right of Avni = 15</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;f  ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A furniture store marks its items at 80% above the cost price. They offer a 30% discount on the marked price. If a customer receives an additional loyalty discount of ₹250, and the store still makes a 12% profit on the cost price, what is the cost price of the furniture item?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">₹1,785.71</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">₹2,585.36</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">₹1,528.24</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">₹2,879.45</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Let CP = x</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Marked Price = 180% of x = 1.8x</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">After 30% discount:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">SP = 70% of 1.8x = 1.26x</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">After ₹250 loyalty discount:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Final SP = 1.26x - 250</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Given profit = 12%, so:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1.26x - 250 = 1.12x</span><br><span style=\"font-family:'Cambria Math'\">0.14x = 250</span><br><span style=\"font-family:'Cambria Math'\">x = 1785.71</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer: (a) ₹1,785.71</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">If A, B, and C are three amounts of money such that B is the simple interest on A, and C is the simple interest on B, all for the same time and at the same rate of interest, then which of the following is true?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A² = BC</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">B² = AC</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">C² = AB</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A + B = C</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Let common rate-time factor = x</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">B is SI on A:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">B = Ax</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">C is SI on B:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">C = Bx</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So,</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">C = Ax²</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Now,</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">B² = (Ax)² = A²x²</span><br><span style=\"font-family:'Cambria Math'\">AC = A × Ax² = A²x²</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Therefore,</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">B² = AC</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer: (b) B² = AC</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">What is the equation of the perpendicular bisector of the line segment connecting the points (2, 6) and (6, 3)?</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:10 .in/website/bulk_uploader_images/1780663824797_image125.png\" width=\"22\" height=\"29\" alt style=\"vertical-align:middle\" ><span style=\"font-family:'Cambria Math'\">  </span><span style=\"font-family:'Cambria Math'\">= 14000</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Now new selling price = Rs. 15540</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Profit = 15540 - 14000 = 1540</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Profit % = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1780663824797_image126.png\" width=\"36\" height=\"29\" alt style=\"vertical-align:middle\" ><span style=\"font-family:'Cambria Math'\">  </span><span style=\"font-family:'Cambria Math'\">× 100 = 11%</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer: (b) 11% profit</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Which sector stores the initial loading instructions of operating systems?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>File Allocation Table</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Virtual Swap Space</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>System Root Directory</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Master Boot Record</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option D: </span><span>Master Boot Record (MBR)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Master Boot Record (MBR)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> →</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Located in the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">first sector of a storage device (usually sector 0 of a hard disk)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Contains the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">bootloader code</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> that initiates the loading of the operating system.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Also stores the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">partition table</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, which describes how the disk is divided.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">When a computer starts, the BIOS/UEFI reads the MBR to begin the OS boot process.</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">File Allocation Table (FAT)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Used for file system management, not OS boot instructions.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Virtual Swap Space</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Part of virtual memory management, not initial boot.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">System Root Directory</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Stores OS files, but loading begins from the MBR, not directly here.</span></li></ul>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Consider the following statements about Fundamental Rights:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>(I) They are provided in Part III of the Constitution.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>(II) Right to Property is presently not a Fundamental Right.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Which of the statements given above is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Only statement I is correct</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Only statement II is correct</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Both statements I and II are correct</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Neither statement I nor II is correct</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option C: Both statements I and II are correct</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Statement I</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Fundamental Rights are enshrined in </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Part III (Articles 12–35)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> of the Indian Constitution.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">They guarantee civil liberties such as equality, freedom, and protection against exploitation.</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Statement II</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Originally, the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Right to Property</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> was a Fundamental Right under </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Article 31</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">However, the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">44th Constitutional Amendment Act, 1978</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> removed it from Part III.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">It is now a </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">legal right</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> under </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Article 300A</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, meaning property can only be taken by authority of law, but it is no longer enforceable as a Fundamental Right.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Consider the following statements about HDI:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>(I) It includes health, education and standard of living.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>(II) It includes military strength as one of its dimensions.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Which of the statements given above is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Only statement I is correct</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Only statement II is correct</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Both statements I and II are correct</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Neither statement I nor II is correct</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option A: Only statement I is correct</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Statement I</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">The </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Human Development Index (HDI)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, published by the UNDP, measures </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">three dimensions</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">:</span><ol type=\"1\"><li style=\"margin-left:32.11pt;line-height:105%;padding-left:3.89pt;font-family:Cambria;font-size:12pt\"><span style=\"font-weight:bold\">Health</span><span> → Life expectancy at birth.</span></li><li style=\"margin-left:32.11pt;line-height:105%;padding-left:3.89pt;font-family:Cambria;font-size:12pt\"><span style=\"font-weight:bold\">Education</span><span> → Mean years of schooling &amp; expected years of schooling.</span></li><li style=\"margin-left:32.11pt;line-height:105%;padding-left:3.89pt;font-family:Cambria;font-size:12pt\"><span style=\"font-weight:bold\">Standard of living</span><span> → Gross National Income (GNI) per capita (PPP).</span></li></ol></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Statement II</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → False.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Military strength is </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">not</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> a component of HDI.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">HDI focuses on </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">human well-being</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, not defense or military capacity.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Which linguistic group in India is largely associated with the Himalayan belt near international borders?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Central Indo-Aryan languages</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Dravidian languages</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Austro-Asiatic languages</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Tibeto-Burman languages</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option D: </span><span>Tibeto-Burman languages</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Tibeto-Burman languages</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Spoken across the Himalayan belt, especially in states like </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Arunachal Pradesh, Sikkim, Nagaland, Manipur, Mizoram, and parts of Himachal Pradesh and Ladakh</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">These languages belong to the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Sino-Tibetan family</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Examples: Bodo, Lepcha, Meitei, Garo, Mizo, and several tribal dialects.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Their distribution is strongest near </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">international borders with China, Bhutan, Nepal, and Myanmar</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Central Indo-Aryan languages</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Found mainly in the Gangetic plains (Hindi, Bhojpuri, Awadhi).</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Dravidian languages</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Concentrated in South India (Tamil, Telugu, Kannada, Malayalam).</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Austro-Asiatic languages</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Found in eastern/central India (Khasi in Meghalaya, Mundari, Santali), not primarily Himalayan.</span></li></ul>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>The southwest monsoon rainy season for most parts of India generally extends from:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>May to August</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>June to September</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>June to August</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>July to October</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option B: June to September</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">The </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Southwest Monsoon</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> is the principal rainy season in India.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">It usually </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">arrives in Kerala around 1st June</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> and then advances northward, covering most of India by mid-July.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">The season typically </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">withdraws by late September</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, marking the end of the monsoon rains.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">This period is crucial for </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">agriculture</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, as nearly 70–80% of India’s annual rainfall occurs during these months.</span></li></ul>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Consider the following statements about Flash ROM:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>(I) It retains stored data even when power is switched off.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>(II) It is generally slower than CPU cache but suitable for firmware.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Which of the statements given above is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Only statement I is correct</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Only statement II is correct</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Both statements I and II are correct</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Neither statement I nor II is correct</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option C: </span><span>Both statements I and II are correct</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explana
