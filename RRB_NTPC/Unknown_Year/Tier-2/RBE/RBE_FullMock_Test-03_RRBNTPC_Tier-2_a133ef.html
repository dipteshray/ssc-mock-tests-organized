</span><span> </span><span style=\"font-weight:bold\">Option A: Fixing different wage levels for all skills</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>India’s three broad poverty reduction approaches are:</span></p><ol type=\"1\"><li style=\"margin-left:14.11pt;line-height:105%;padding-left:3.89pt;font-size:12pt\"><span style=\"font-weight:bold\">Growth-oriented strategy</span><span> →</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;line-height:105%;padding-left:7pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Focuses on rapid economic growth so that benefits trickle down to the poor.</span></li><li style=\"margin-left:29pt;line-height:105%;padding-left:7pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Example: Industrialization, infrastructure development, agricultural modernization.</span></li></ul></li><li style=\"margin-left:14.11pt;line-height:105%;padding-left:3.89pt;font-size:12pt\"><span style=\"font-weight:bold\">Providing minimum basic public amenities</span><span> →</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;line-height:105%;padding-left:7pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Ensures access to </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">healthcare, education, sanitation, housing, and nutrition</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:29pt;line-height:105%;padding-left:7pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Improves human development indicators and quality of life.</span></li></ul></li><li style=\"margin-left:14.11pt;line-height:105%;padding-left:3.89pt;font-size:12pt\"><span style=\"font-weight:bold\">Generating assets and employment opportunities</span><span> →</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;line-height:105%;padding-left:7pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Directly targets poverty by creating jobs and productive assets.</span></li><li style=\"margin-left:29pt;line-height:105%;padding-left:7pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Example: MGNREGA, land reforms, skill development programs.</span></li></ul></li></ol><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Fixing different wage levels for all skills</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → This is not considered a broad poverty reduction approach. Wage regulation may exist in labor laws, but it is not one of the three recognized strategies for poverty alleviation in India.</span></li></ul>", "question_heading": ""}, {"sr_no": 110, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Which Indian State launched its first ‘Dark Sky Park’ in Kolli Hills to boost astro-tourism?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Karnataka</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Kerala</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Andhra Pradesh</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Tamil Nadu</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option D: Tamil Nadu</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Tamil Nadu</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> inaugurated India’s first </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Dark Sky Park</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> in </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Kolli Hills (Namakkal district)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> in 2026.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Purpose: Encourage </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">astro</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">‑</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">tourism</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> by providing a pollution</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">‑</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">free environment for stargazing and astronomical observations.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Kolli Hills was chosen because of its </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">low light pollution, high altitude, and clear skies</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Initiative supported by the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Tamil Nadu Forest Department</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> and </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Tourism Department</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, combining eco</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">‑</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">tourism with scientific awareness.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Karnataka</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Known for eco</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">‑</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">tourism and heritage sites, but not the first Dark Sky Park.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Kerala</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Famous for backwaters and biodiversity, no Dark Sky Park launched.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Andhra Pradesh</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Focused on coastal and temple tourism, not astro</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">‑</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">tourism.</span></li></ul>", "question_heading": ""}, {"sr_no": 111, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Which logic gate yields an output of 1 exclusively when inputs differ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Standard AND Gate</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Standard NAND Gate</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Exclusive OR Gate</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Universal NOR Gate</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option C: Exclusive OR Gate (XOR Gate)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Exclusive OR Gate</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> →</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Produces output </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">1 (True)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> only when </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">inputs are different</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> (one is 0, the other is 1).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">If both inputs are the same (00 or 11), output is </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">0 (False)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">AND Gate</span><span> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span> → Output is 1 only when both inputs are 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">NAND Gate</span><span> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span> → Output is 1 except when both inputs are 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">NOR Gate</span><span> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span> → Output is 1 only when both inputs are 0.</span></p>", "question_heading": ""}, {"sr_no": 112, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>India is constructing its first-ever riverine lighthouses on National Waterway 2, that is associated to?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Ganga River</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Brahmaputra River</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Godavari River</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Krishna River</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>The </span><span style=\"font-weight:bold\">first-ever riverine lighthouses</span><span> being constructed by India on </span><span style=\"font-weight:bold\">National Waterway 2</span><span> are associated with the:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option B: </span><span>Brahmaputra River</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">National Waterway 2</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Covers the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Brahmaputra River</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> from </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Dhubri to Sadiya</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> in Assam.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">To enhance </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">safe navigation</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, the Government of India announced the construction of </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">riverine lighthouses</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> along this stretch.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">These lighthouses will serve as </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">navigation aids</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> for cargo vessels, ferries, and passenger boats, boosting </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">inland water transport</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> in the Northeast.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">This is part of India’s push to develop </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">inland waterways</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> as eco</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">‑</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">friendly and cost</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">‑</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">effective transport corridors.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Ganga River</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Associated with </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">National Waterway 1</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> (Allahabad–Haldia stretch).</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Godavari River</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Associated with </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">National Waterway 4</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> (Kakinada–Puducherry stretch).</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Krishna River</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Also part of </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">National Waterway 4</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, not NW</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">‑</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">2.</span></li></ul>", "question_heading": ""}, {"sr_no": 113, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Assertion (A):</span><span> Gender equality can improve human development outcomes.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Reason (R):</span><span> It removes barriers to women’s participation in education, health and workforce.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Choose the correct answer.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Both A and R are true, and R explains A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Both A and R are true, but R does not explain A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>A is true, but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>A is false, but R is true</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option A: </span><span>Both A and R are true, and R explains A</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Assertion (A): Gender equality can improve human development outcomes</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Human development is measured by indicators like </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">health, education, and standard of living</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Gender equality ensures that </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">both men and women contribute fully</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, leading to better overall outcomes.</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Reason (R): It removes barriers to women’s participation in education, health and workforce</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">When barriers are removed, women gain </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">equal access to education, healthcare, and employment opportunities</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">This directly enhances </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">literacy rates, workforce participation, family health, and economic growth</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Since </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">R directly explains A</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, the correct option is: </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Both A and R are true, and R explains A.</span></li></ul>", "question_heading": ""}, {"sr_no": 114, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Which fest was organized by Indian Government on 13 March 2026 to celebrate the talent and achievements of Divyangjans (persons with disabilities)?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Violet Fest</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Red Fest</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Pink Fest</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Purple Fest</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option D: </span><span>Purple Fest</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Purple Fest</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> was held at </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Rashtrapati Bhavan, New Delhi</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Hosted by </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">President Droupadi Murmu</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, with participation from over </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">8,000 Divyangjan</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Organized by the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Ministry of Social Justice and Empowerment</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Aim: To showcase and celebrate the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">skills, creativity, and achievements</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> of persons with disabilities.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Activities included:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Cultural performances by Divyangjan.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Fun games and interactive learning activities.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Stalls by organizations working for disability empowerment.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Special visit to </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Amrit Udyan</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> for Divyangjan.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 115, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Who was the symbolic leader of the Revolt of 1857 at Delhi?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Nana Sahib</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Bahadur Shah II </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Kunwar Singh</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Begum Hazrat Mahal</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option B: Bahadur Shah II</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Bahadur Shah II (Zafar)</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">, the last Mughal emperor, was declared the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Emperor of Hindustan</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> by the rebels in Delhi during the Revolt of 1857.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Though he was old and lacked real military power, his name carried immense </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">symbolic legitimacy</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">The sepoys rallied under his banner, making him the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">figurehead of the uprising</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">After the revolt was suppressed, he was captured by the British, tried, and exiled to Rangoon (Burma), where he died in 1862.</span></li></ul>", "question_heading": ""}, {"sr_no": 116, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Consider the following statements about food adulterants:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>(I) They make food unsafe or inferior in quality.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>(II) They are added to decrease nutritional value.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Which of the statements given above is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Only statement I is correct</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Only statement II is correct</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Both statements I and II are correct</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Neither statement I nor II is correct</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option C: </span><span>Both statements I and II are correct</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Statement I: They make food unsafe or inferior in quality</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Food adulterants</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> are substances added to food that reduce its quality, safety, or purity.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Examples: mixing water in milk, adding brick powder to chili powder, or using harmful chemicals like formalin in fish.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">These make food </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">unsafe for consumption</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> or </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">inferior in quality</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Statement II: They are added to decrease nutritional value</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Adulterants often </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">dilute or replace nutritious components</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> with cheaper, non-nutritive substances.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Example: starch mixed in milk reduces protein content; chalk powder in flour reduces nutritional value.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Thus, adulterants </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">decrease the nutritional value</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> of food.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 117, "question": "Cयnौiकधन पुध ीियियथing ौपोपधंधnपौ ोृयहप पुध Oॅधनौधोौ Ciपप्रधn यी Inकiो नधgiौपनोपiयn:(I) Iप ंोद ृध cोncिधिधक ीयन ॅiियोपiयn यी पुध Ciपप्रधnौुiू Acप यन nयपiीiधक िोथौ.(II) Iप giॅधौ ीिहि कहोि ciपप्रधnौुiू ोnक ॅयपing नigुपौ in Inकiो.Wुicु यी पुध ौपोपधंधnपौ giॅधn ोृयॅध iौ/ोनध cयननधcप?", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Only statement I is correct</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Only statement II is correct</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Both statements I and II are correct</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Neither statement I nor II is correct</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option A: Only statement I is correct</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Statement I: It may be cancelled for violation of the Citizenship Act or notified laws</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> Correct.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">The </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Overseas Citizen of India (OCI) registration</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> can be cancelled if the holder violates provisions of the </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Citizenship Act, 1955</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> or any other notified law.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">Other grounds include fraud in obtaining registration, disaffection towards the Constitution, or threat to national security.</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Statement II: It gives full dual citizenship and voting rights in India</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → </span><span style=\"line-height:105%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> Incorrect.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">OCI is </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">not dual citizenship</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">OCI holders enjoy certain benefits (like multiple entry, lifelong visa, parity with NRIs in economic/educational matters), but they </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">do not have political rights</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> such as voting, contesting elections, or holding constitutional posts.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 118, "question": "Cयnौiकधन पुध ीियियथing ौपोपधंधnपौ ोृयहप पनiृहnोिस in Inकiो:(I) Tुधiन cयnौपiपहपiयnोि ृोौiौ थोौ ौपनधngपुधnधक ृद पुध 42nक Aंधnकंधnप Acप.(II) Tुध 42nक Aंधnकंधnप ोककधक ूनयॅiौiयnौ निधोपधक पय पनiृहnोिस.Wुicु यी पुध ौपोपधंधnपौ giॅधn ोृयॅध iौ/ोनध cयननधcप?", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Only statement I is correct</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Only statement II is correct</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Both statements I and II are correct</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Neither statement I nor II is correct</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option C: </span><span>Both statements I and II are correct</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Statement I: Their constitutional basis was strengthened by the 42nd Amendment Act</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">The </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">42nd Constitutional Amendment Act, 1976</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> gave tribunals a </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">constitutional status</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> by inserting </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Articles 323A and 323B</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> in the Constitution.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\">This strengthened their role as specialized adjudicatory bodies outside the regular judiciary.</span></li></ul></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Statement II: The 42nd Amendment added provisions related to tribunals</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → True.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Article 323A</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Allowed the establishment of </span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Administrative Tribunals</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> for service matters.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Article 323B</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Allowed the establishment of tribunals for other matters like taxation, industrial disputes, land reforms, etc.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Thus, both statements are correct, and they complement each other.</span></p>", "question_heading": ""}, {"sr_no": 119, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Lok Adalats are mainly organised to promote which form of dispute settlement?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Amicable compromise between parties</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Long adversarial judicial trials and conviction</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Mandatory imprisonment in disputes</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span>Administrative control by police</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Option A: </span><span>Amicable compromise between parties</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span></p><ul type=\"disc\ ese tributaries make the Kaveri basin agriculturally rich, supporting irrigation and hydroelectric projects.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:105%;font-size:12pt\"><span style=\"font-weight:bold\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Krishna River</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Tributaries include Bhima, Tungabhadra, Ghataprabha, not Amravati/Bhavani.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Godavari River</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Tributaries include Manjira, Indravati, Sabari.</span></li><li style=\"margin-left:9.6pt;line-height:105%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:105%;font-family:Cambria;font-size:12pt;font-weight:bold\">Mahanadi River</span><span style=\"line-height:105%;font-family:Cambria;font-size:12pt\"> → Tributaries include Seonath, Hasdeo, not these four.</span></li></ul>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
