mily:'Cambria Math'\">Section 5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Section 9</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Section 7</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Section 6</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct Answer is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Section 7</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">📘</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Detailed Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Relevant Section:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Section 7 – Citizenship by incorporation of territory</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Context:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">When a new territory is merged or incorporated into India (e.g., Goa in 1961, Sikkim in 1975), the residents of that territory are granted Indian citizenship.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The Central Government specifies the conditions, restrictions, or exceptions under which citizenship is conferred.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Key Point:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Citizenship is </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">not acquired individually</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> through registration or naturalization in such cases.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Instead, it is a </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">collective grant of citizenship</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> to all persons domiciled in the newly added territory.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">🔑</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Other Details:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Section 3–6</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → Birth, descent, registration, naturalization.</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Section 6A &amp; 6B</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → Special provisions (Assam Accord, etc.).</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Section 7</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → Citizenship by incorporation of territory.</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Example:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Goa, Daman &amp; Diu (1961)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → Residents became Indian citizens under Section 7.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sikkim (1975)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → Incorporated into India; residents granted citizenship.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which ruler is known for his significant patronage of Nalanda University, which was visited by the Chinese pilgrim Hiuen Tsang during his reign?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ashoka</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Harshavardhana</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Chandragupta II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kanishka</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Harshavardhana</span><span style=\"font-family:'Cambria Math'\">, the 7th-century ruler of Kanauj, was a major patron of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Nalanda University</span><span style=\"font-family:'Cambria Math'\">, significantly expanding its facilities; this is well documented by the Chinese pilgrim </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Hiuen Tsang</span><span style=\"font-family:'Cambria Math'\">, who studied there during Harsha's reign.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Harsha himself authored several Sanskrit plays, including Ratnavali and Priyadarshika, reflecting his personal interest in literature and learning.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is Harshavardhana.</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements about the Vernacular Press Act, 1878:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. It was introduced by Lord Ripon.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. It imposed restrictions only on English-language newspapers.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the statements given above is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both I and II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither I nor II</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Both statements are incorrect.</span><span style=\"font-family:'Cambria Math'\"> The Vernacular Press Act was introduced by </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Lord Lytton</span><span style=\"font-family:'Cambria Math'\">, not Lord Ripon (who, in fact, repealed it in 1881). It restricted </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">vernacular (Indian-language) newspapers</span><span style=\"font-family:'Cambria Math'\">, not English-language ones, which largely escaped its provisions - a key reason the Act was seen as discriminatory.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">This Act is often confused with other press-related measures; remembering 'Lytton imposed it, Ripon repealed it' helps avoid mixing up the two Viceroys.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'Neither I nor II'.</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Match the following 2025-26 events with their host location:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A. Global Energy Leaders' Summit (GELS) 2025 - 1. Puri, Odisha</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">B. 2nd Global Buddhist Summit - 2. New Delhi</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">C. 7th India International Seaweed Expo &amp; Summit 2026 - 3. Kochi</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">D. Madhya Pradesh Regional AI Impact Conference 2026 - 4. Bhopal</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following combinations is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-2, B-1, C-4, D-3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-4, B-3, C-2, D-1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-1, B-2, C-3, D-4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-3, B-4, C-1, D-2</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">GELS 2025</span><span style=\"font-family:'Cambria Math'\"> (India's first dedicated summit on energy sufficiency and sustainability) was held in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Puri, Odisha</span><span style=\"font-family:'Cambria Math'\">; the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">2nd Global Buddhist Summit</span><span style=\"font-family:'Cambria Math'\"> was held in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">New Delhi</span><span style=\"font-family:'Cambria Math'\">; the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">7th India International Seaweed Expo &amp; Summit</span><span style=\"font-family:'Cambria Math'\"> is set for </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kochi</span><span style=\"font-family:'Cambria Math'\">; and the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Madhya Pradesh Regional AI Impact Conference 2026</span><span style=\"font-family:'Cambria Math'\"> was held in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bhopal</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Tracking host cities of major summits and conferences is a frequently tested current affairs skill, especially for events tied to India's growing role in global forums.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct combination is A-1, B-2, C-3, D-4.</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Who founded the 'Forward Bloc' in 1939, after resigning from the Indian National Congress presidency?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Subhas Chandra Bose</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Jawaharlal Nehru</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sardar Patel</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rajendra Prasad</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Subhas Chandra Bose</span><span style=\"font-family:'Cambria Math'\"> founded the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Forward Bloc</span><span style=\"font-family:'Cambria Math'\"> in 1939, after resigning as Congress President due to ideological differences with Gandhi and the Congress high command over the approach to achieving independence.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bose had earlier won the Congress presidency twice (Haripura 1938, Tripuri 1939), defeating Gandhi's preferred candidate in 1939, but resigned after facing internal opposition.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is Subhas Chandra Bose.</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pandit Jawaharlal Nehru described which of the following as the “temple(s) of modern India”?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Parliament</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Schools</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Hospitals</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Dams</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Nehru referred to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">large dams and irrigation projects</span><span style=\"font-family:'Cambria Math'\"> as the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">“temples of modern India.”</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Context: Post-independence India needed rapid industrialization and agricultural growth.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Dams symbolized:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Economic progress</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> (electricity, irrigation, flood control).</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Self-reliance</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> in food production.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Modernization</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> through science and technology.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Famous examples: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bhakra Nangal Dam, Hirakud Dam, Damodar Valley Project.</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is an example of Customized Software?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">School Management Software</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mozilla Firefox</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Adobe Photoshop</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">LibreOffice</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">School Management Software</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Customized Software</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → Developed for a specific organization’s needs.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Example: </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">School Management Software</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> (tailored for attendance, exams, fees, etc.).</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">General-Purpose Software</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → Designed for broad use by many users.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mozilla Firefox</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → Web browser.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Adobe Photoshop</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → Graphics editing.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">LibreOffice</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → Office suite.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">👉</span><span style=\"font-family:'Cambria Math'\"> Trick: If software is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">made for a particular institution/organization</span><span style=\"font-family:'Cambria Math'\">, it is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">customized</span><span style=\"font-family:'Cambria Math'\">.</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Assertion (A): The Directive Principles of State Policy are not enforceable by courts.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Reason (R): The Indian Constitution is the longest written constitution in the world.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, but R is NOT the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is true, but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is false, but R is true</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Both statements are factually true</span><span style=\"font-family:'Cambria Math'\">: Directive Principles are indeed non-justiciable (Article 37 states they 'shall not be enforceable by any court'), and India's Constitution is indeed the longest written constitution in the world. However, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">R has no logical connection to A</span><span style=\"font-family:'Cambria Math'\"> - the length of the Constitution has nothing to do with why DPSPs are unenforceable, which is simply a deliberate constitutional design choice.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">This is a common Assertion-Reason trap: both statements being independently true doesn't mean one explains the other - always check for a genuine causal or logical connection.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'Both A and R are true, but R is NOT the correct explanation of A'.</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Article of the Constitution, inserted by the 73rd Amendment Act, mandates the constitution of Panchayats at the village, intermediate and district levels?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 243A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 312</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 243B</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 231</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct Answer is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Article 243B</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">73rd Constitutional Amendment Act, 1992</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → gave constitutional status to Panchayati Raj Institutions.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 243B</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → Mandates constitution of </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Panchayats at village, intermediate, and district levels</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Part IX (Articles 243–243O)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → deals with Panchayats.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Other options:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 243A</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → Gram Sabha.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 312</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → All India Services.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 231</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → Establishment of High Courts.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Article authorizes the State to make special provisions for the welfare of women and children?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 23(2)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 15(3)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 16(2)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 19(5)</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Article 15(3)</span><span style=\"font-family:'Cambria Math'\"> → Permits the State to make </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">special provisions for women and children</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It is an </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">exception to the general rule of equality</span><span style=\"font-family:'Cambria Math'\"> under Article 15(1).</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Examples: Reservation in educational institutions, maternity benefits, protective laws for children.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Other options:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 23(2)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → Compulsory service for public purposes.</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 16(2)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → Prohibition of discrimination in public employment.</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 19(5)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → Reasonable restrictions on freedom of movement.</span></li></ul>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following bodies is the 'odd one out', based on the nature of its constitutional/statutory status?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Election Commission of India</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Union Public Service Commission</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Comptroller and Auditor General</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">National Human Rights Commission</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Election Commission of India (Article 324), UPSC (Article 315) and CAG (Article 148)</span><span style=\"font-family:'Cambria Math'\"> are all </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">constitutional bodies</span><span style=\"font-family:'Cambria Math'\">, directly established by provisions of the Constitution itself. The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">National Human Rights Commission</span><span style=\"font-family:'Cambria Math'\">, however, is a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">statutory body</span><span style=\"font-family:'Cambria Math'\">, created by the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Protection of Human Rights Act, 1993</span><span style=\"font-family:'Cambria Math'\"> - an ordinary law of Parliament, not a constitutional provision.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">This distinction matters because constitutional bodies enjoy greater independence and security (their existence/powers cannot be altered without a constitutional amendment), while statutory bodies can be modified by a simple parliamentary majority.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is National Human Rights Commission (the odd one out).</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">According to ____ of the Indian Constitution, the Parliament may by law, constitute a High Court for a Union territory.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 238</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 241</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 240</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 239</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Article 241</span><span style=\"font-family:'Cambria Math'\"> → Empowers Parliament to establish a High Court for Union Territories.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Example:</span><span style=\"font-family:'Cambria Math'\"> Delhi High Court (1966), and jurisdiction of other High Courts extended to UTs like Chandigarh, Puducherry, etc.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Other options:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 238</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → Repealed (related to Part B states).</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 240</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → Power of President to make regulations for certain Union Territories.</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 239</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → Administration of Union Territories by the President.</span></li></ul>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A computer system has a memory capacity of 4K × 8 bits. How many address lines are required on the address bus to identify every byte in this memory uniquely?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">12 lines</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">16 lines</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">10 lines</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">8 lines</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">We are given:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Memory capacity = 4K×8 bits</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">4K = 4096 locations (since 1K = 1024)</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Each location stores </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1 byte (8 bits)</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">👉</span><span style=\"font-family:'Cambria Math'\"> To uniquely address </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">4096 memory locations</span><span style=\"font-family:'Cambria Math'\">, we need:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Number</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Cambria Math'\">of</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Cambria Math'\">address</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Cambria Math'\">lines = log</span><span style=\"line-height:115%;font-size:8pt;vertical-align:sub;font-family:'Cambria Math'\">2 </span><span style=\"font-family:'Cambria Math'\">(4096) = 12</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">📘</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Final Answer: 12 address lines are required.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">🔑</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Key Points:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Address lines</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> determine how many unique memory locations can be accessed.</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Formula: 2</span><span style=\"line-height:115%;font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">n</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">=Number</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">of</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">memory</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">locations.</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Here, 2</span><span style=\"line-height:115%;font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">12 </span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">= 4096.</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Hence, </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">12 address lines</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> are needed to identify each byte uniquely.</span></li></ul>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following best describes 'Freeware'?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Software available with full source code for modification</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Software available for use free of cost, but without access to modify its source code</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Software that must be purchased before use</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Software that expires after a trial period</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Freeware</span><span style=\"font-family:'Cambria Math'\"> is software provided </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">free of cost</span><span style=\"font-family:'Cambria Math'\"> to users, but typically </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">without access to its source code</span><span style=\"font-family:'Cambria Math'\">, meaning users cannot modify or redistribute it - distinguishing it from 'Open Source' software (like Linux), which is free AND allows source code modification.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">'Shareware', by contrast, is usually offered free for a trial period or with limited features, encouraging users to eventually pay for the full version.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'Software available for use free of cost, but without access to modify its source code'.</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements about the Union Budget 2026-27:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. It introduced 'SHE Marts' (Self-Help Entrepreneur Marts) for women's self-help groups.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. It abolished the New Tax Regime, reverting fully to the Old Tax Regime.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the statements given above is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both I and II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither I nor II</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement I is correct</span><span style=\"font-family:'Cambria Math'\"> - Budget 2026-27 introduced </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">'SHE Marts'</span><span style=\"font-family:'Cambria Math'\">, community-owned retail outlets building on the Lakhpati Didi programme for women's self-help groups.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement II is incorrect</span><span style=\"font-family:'Cambria Math'\"> - the Budget did </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">not abolish the New Tax Regime</span><span style=\"font-family:'Cambria Math'\">; rather, it </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">enhanced it further</span><span style=\"font-family:'Cambria Math'\">, raising the full tax rebate threshold to ₹12.75 lakh annual income.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Budget 2026-27 also introduced the India Semiconductor Mission 2.0 and the Biopharma SHAKTI scheme, reflecting a continued push toward domestic manufacturing and innovation.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'Only I'.</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">India was re-elected to the Council of which UN body during the 42nd Assembly held in Montreal in 2025?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">UNESCO</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">ICAO</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">IMO</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">WHO</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">India secured re-election to the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Council of the ICAO</span><span style=\"font-family:'Cambria Math'\">, recognising India's significant contribution to international civil aviation safety, security and sustainability.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">ICAO, a UN specialised agency, sets global standards for air navigation and coordinates international civil aviation development, distinct from the IMO, which handles maritime (shipping) regulation.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is ICAO (International Civil Aviation Organization).</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Sahakar Sarathi' initiative, launched by the Government of India, is primarily related to which of the following?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">AI governance in agriculture</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Renewable energy cooperatives</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Digitisation of cooperative banking</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rural road infrastructure</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">'Sahakar Sarathi'</span><span style=\"font-family:'Cambria Math'\"> focuses on the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">digitisation of cooperative banking</span><span style=\"font-family:'Cambria Math'\">, aiming to modernise and streamline operations of cooperative banks and societies across India.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">This forms part of a broader push under the Ministry of Cooperation (created in 2021) to strengthen and professionalise India's cooperative sector, which plays a crucial role in rural credit and banking access.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is Digitisation of cooperative banking.</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Indian state is the largest producer of bauxite (the primary ore of aluminium)?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Jharkhand</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Gujarat</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Odisha</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Chhattisgarh</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Odisha</span><span style=\"font-family:'Cambria Math'\"> is India's largest producer of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">bauxite</span><span style=\"font-family:'Cambria Math'\">, followed by Gujarat.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Odisha is also a leading producer of other minerals like iron ore, chromite and coal, making it one of India's most mineral-rich states, largely due to its share of the Chota Nagpur and Eastern Ghats mineral belt.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is Odisha.</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:11pt\"><span style=\"font-family:'Cambria Math'\">Who has been appointed as India's new Ambassador to China in March 2026?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Vikram K. Doraiswami</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Nitin Nabin</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Vivek Agrwal</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kanad Das</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In March 2026, senior diplomat </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Vikram K. Doraiswami</span><span style=\"font-family:'Cambria Math'\"> was appointed as India's new Ambassador to China.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A 1992-batch </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Indian Foreign Service (IFS)</span><span style=\"font-family:'Cambria Math'\"> officer, he was formerly the High Commissioner of India to the United Kingdom and succeeds </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Pradeep Kumar Rawat</span><span style=\"font-family:'Cambria Math'\">. Doraiswami officially presented his diplomatic credentials in Beijing in early May 2026. </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:11pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Other Options:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:11pt\"><span style=\"font-family:'Cambria Math'\">National President of the BJP</span><span style=\"color:#7030a0;font-family:'Cambria Math'\"> – Nitin Nabin (16</span><span style=\"line-height:115%;font-size:7.33pt;vertical-align:super;color:#7030a0;font-family:'Cambria Math'\">th</span><span style=\"color:#7030a0;font-family:'Cambria Math'\"> &amp; Youngest president)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:11pt\"><span style=\"font-family:'Cambria Math'\">FATF Vice President – </span><span style=\"color:#7030a0;font-family:'Cambria Math'\">Vivek Agrwal (First Indian to be Appointed)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:11pt\"><span style=\"font-family:'Cambria Math'\">13th Director of the Botanical Survey of India (BSI)</span><span style=\"color:#7030a0;font-family:'Cambria Math'\"> – Kanad Das</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Who won the UN Population Award 2025 in the Institutional Category?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">IUSSP</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">WHO</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">World Population Council</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">UNDP</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">UN Population Award 2025</span><span style=\"font-family:'Cambria Math'\"> in the Institutional Category was won by </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">IUSSP</span><span style=\"font-family:'Cambria Math'\">, recognising its contributions to demographic research and policy globally.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">This award, established by the UN General Assembly in 1981, also has an Individual Category, honouring outstanding contributions to population and development issues.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is IUSSP.</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">India will host the 20th session of the Intergovernmental Committee for the Safeguarding of the Intangible Cultural Heritage (ICH) in December 2025, at which iconic venue in New Delhi?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">India Gate</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rashtrapati Bhavan</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Parliament House</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Red Fort</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">India will host the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">20th session of the ICH Committee</span><span style=\"font-family:'Cambria Math'\"> at the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Red Fort, New Delhi</span><span style=\"font-family:'Cambria Math'\">, a historic and symbolically significant venue given the Red Fort's own status as a UNESCO World Heritage Site.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">This session, under UNESCO's Intangible Cultural Heritage framework, will discuss the safeguarding and inscription of cultural practices and traditions from around the world.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is Red Fort.</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following statements about India's international economic engagements in 2025 is INCORRECT?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The India-EFTA TEPA came into effect, covering Switzerland, Norway, Iceland and Liechtenstein</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">India-Bhutan rail connectivity projects worth ₹4,033 crore were approved</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The RBI maintained the repo rate at 5.5% with a 'Neutral' stance</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">India signed a full Free Trade Agreement with the entire European Union in 2025</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Options A, B and C are accurate. </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option D is incorrect</span><span style=\"font-family:'Cambria Math'\"> - India signed the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">TEPA with EFTA</span><span style=\"font-family:'Cambria Math'\"> (a separate four-nation bloc), </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">not</span><span style=\"font-family:'Cambria Math'\"> a full Free Trade Agreement with the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">entire European Union</span><span style=\"font-family:'Cambria Math'\">, which remained under separate, ongoing negotiations rather than concluded during this period.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">This is an important distinction, as EFTA and the EU are distinct trade blocs despite both being European - a detail commonly tested to check careful reading rather than assumption.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, option D is the incorrect statement.</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Who is credited as the founder of the Indian retail brand 'Westside' (part of the Tata Group's Trent Limited)?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Simone Tata</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kishore Biyani</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ratan Tata</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Ambani family</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Simone Tata</span><span style=\"font-family:'Cambria Math'\"> is credited as the founder of the Indian retail brand </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">'Westside'</span><span style=\"font-family:'Cambria Math'\">, and she played a significant role in shaping organised retail in India.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">She was also the first woman to head a Tata Group company (Lakme), and was honoured with the Padma Shri for her contributions to Indian trade and industry.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is Simone Tata.</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is a compound wind instrument due to its use of two tubes for different functions?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Magudi</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kombu</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Conch</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Clarinet</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Magudi</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Magudi</span><span style=\"font-family:'Cambria Math'\"> → A traditional Tamil Nadu snake</span><span style=\"font-family:'Cambria Math'\">‑</span><span style=\"font-family:'Cambria Math'\">charmer’s instrument.</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">It is a </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">compound wind instrument</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> because it has </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">two tubes</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">One tube produces the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">drone</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The other tube plays the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">melody</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kombu</span><span style=\"font-family:'Cambria Math'\"> → Curved horn, used in temple music.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Conch (Shankha)</span><span style=\"font-family:'Cambria Math'\"> → Blown shell, produces a single resonant note.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Clarinet</span><span style=\"font-family:'Cambria Math'\"> → Western single</span><span style=\"font-family:'Cambria Math'\">‑</span><span style=\"font-family:'Cambria Math'\">reed instrument, but not compound.</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Through his renowned work Jnaneshwari, Sant Gyaneshwar rendered the Bhagavad Gita into which regional language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Marathi</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Malayalam</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Odia</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Punjabi</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Marathi</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">Jnaneshwari</span><span style=\"font-family:'Cambria Math'\"> (also called </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Bhavarth Deepika</span><span style=\"font-family:'Cambria Math'\">) → Commentary on the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bhagavad Gita</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Written by </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sant Gyaneshwar (1275–1296 CE)</span><span style=\"font-family:'Cambria Math'\">, a saint of the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bhakti movement</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Language: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Marathi</span><span style=\"font-family:'Cambria Math'\">, making it one of the earliest major works in Marathi literature.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Purpose: To make the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">philosophy of the Gita accessible to common people</span><span style=\"font-family:'Cambria Math'\"> in their own language.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Significance: Considered a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">spiritual classic</span><span style=\"font-family:'Cambria Math'\"> and foundational text in Marathi devotional literature.</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following correctly explains why the Indian National Congress rejected the 'August Offer' (1940)?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It did not offer immediate independence and gave minorities a virtual veto over constitutional progress</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It proposed complete Dominion Status immediately</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It was rejected only because Gandhi was in jail at the time</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It abolished the Viceroy's Executive Council entirely</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Congress rejected the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">August Offer (1940)</span><span style=\"font-family:'Cambria Math'\"> primarily because it fell far short of full independence, offering only an expanded (Indian-majority) Executive Council and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Dominion Status after the war</span><span style=\"font-family:'Cambria Math'\"> - and crucially, it effectively gave </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">minorities a virtual veto</span><span style=\"font-family:'Cambria Math'\"> over any future constitutional arrangement, which Congress saw as an attempt to stall progress through 'divide and rule'.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">This rejection led Gandhi to launch the Individual Satyagraha shortly after, as a measured protest short of a full mass movement.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'It did not offer immediate independence and gave minorities a virtual veto over constitutional progress'.</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-heigh
