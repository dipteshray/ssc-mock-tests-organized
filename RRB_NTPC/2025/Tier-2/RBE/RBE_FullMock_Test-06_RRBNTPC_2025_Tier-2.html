an><span style=\"font-family:'Cambria Math'\"> in the Indian Constitution is borrowed from </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Canada</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Residual Powers</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> = powers not explicitly mentioned in the Constitution.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">In India, these powers are vested in the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Union (Centre)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> under </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 248</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, allowing Parliament to legislate on matters not enumerated in the Union, State, or Concurrent Lists.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">This concept was borrowed from the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Canadian Constitution</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, where residuary powers also lie with the federal government.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Contrast: In the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">USA</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, residuary powers lie with the states (10th Amendment).</span></li></ul>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements about the Union Budget 2026-27:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. It increased the full income-tax rebate threshold to ₹12.75 lakh for salaried individuals under the New Tax Regime.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. It reduced the effective capital expenditure compared to the previous year's Budget.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the statements given above is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both I and II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither I nor II</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement I is correct</span><span style=\"font-family:'Cambria Math'\"> - the Budget raised the full tax rebate threshold to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">₹12.75 lakh</span><span style=\"font-family:'Cambria Math'\"> for salaried individuals under the New Tax Regime.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement II is incorrect</span><span style=\"font-family:'Cambria Math'\"> - effective capital expenditure was actually </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">increased</span><span style=\"font-family:'Cambria Math'\">, budgeted at </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">₹17.15 lakh crore (4.4% of GDP)</span><span style=\"font-family:'Cambria Math'\">, reflecting continued emphasis on infrastructure investment.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">This distinction between increased vs decreased capital expenditure is a commonly tested detail, since candidates sometimes assume fiscal consolidation implies reduced spending across all categories.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'Only I'.</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Recently India surpassed which country in annual solar capacity addition in 2025 to become the world's second-largest solar growth market?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Germany</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Japan</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">China</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">United States</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">India surpassed the United States in 2025 to become the world’s second-largest solar growth market, behind only China.</span><span style=\"font-family:'Cambria Math'\"> India added about </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">37 GW of solar capacity</span><span style=\"font-family:'Cambria Math'\">, overtaking the US (34 GW), while China remained far ahead with nearly 315 GW.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Facts:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Country Surpassed:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> United States</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">India’s Addition (2025):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> ~37 GW solar capacity</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">US Addition (2025):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> ~34 GW solar capacity</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">China’s Addition (2025):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> ~315 GW solar capacity (global leader)</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">India’s Installed Solar Capacity (2025):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Rose from 98.5 GW (2024) to 135.5 GW (2025).</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Global Context:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Worldwide solar capacity expanded by 512 GW in 2025.</span></li></ul>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">According to the Ethnologue rankings of global languages by usage, how many Indian languages featured among the world's top 20 languages?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Five</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Eight</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">According to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Ethnologue</span><span style=\"font-family:'Cambria Math'\"> rankings, India had </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">five languages</span><span style=\"font-family:'Cambria Math'\"> among the world's top 20 most-spoken languages, reflecting the country's immense linguistic diversity and demographic scale.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">English remained the most widely used global language overall, but India's inclusion of multiple languages in the global top 20 underscores its unique position as a highly multilingual nation.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is Five.</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which is the highest mountain peak in Africa?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mount Kilimanjaro</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mount Kenya</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ras Dashen</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mount Elgon</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Mount Kilimanjaro</span><span style=\"font-family:'Cambria Math'\">, in Tanzania, is Africa's highest peak and the world's highest freestanding mountain (not part of a larger mountain range).</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">Kilimanjaro is a popular destination for climbers worldwide, notable for being accessible to relatively inexperienced trekkers compared to many other peaks of similar height, since it doesn't require technical climbing skills.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is Mount Kilimanjaro.</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Who founded the 'Hindu Mahasabha' in 1915, an organisation advocating for Hindu political and cultural interests?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Vinayak Damodar Savarkar</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lala Lajpat Rai</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bal Gangadhar Tilak</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Madan Mohan Malaviya </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Hindu Mahasabha</span><span style=\"font-family:'Cambria Math'\"> was founded in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1915 by Madan Mohan Malaviya</span><span style=\"font-family:'Cambria Math'\">, a prominent nationalist leader and educationist.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Madan Mohan Malaviya</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Founded the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Hindu Mahasabha</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> in 1915.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Aim: To protect Hindu political, cultural, and religious interests.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">He was also the founder of </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Banaras Hindu University (BHU)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> and a leader in the Indian National Congress.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Vinayak Damodar Savarkar</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Later became a leading ideologue of the Hindu Mahasabha, but </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">not its founder</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Known for his book </span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Cambria Math'\">Hindutva</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> and revolutionary activities.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Lala Lajpat Rai</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Member of the Lal-Bal-Pal trio, strong nationalist leader.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Associated with Arya Samaj and Congress, but not the founder of Hindu Mahasabha.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bal Gangadhar Tilak</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Extremist leader of the Congress, famous for his slogan </span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Cambria Math'\">Swaraj is my birthright</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Not linked to founding Hindu Mahasabha.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is the correct minimum age requirement to become the President of India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">25 years</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">30 years</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">35 years</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">40 years</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A candidate must be at least </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">35 years old</span><span style=\"font-family:'Cambria Math'\"> to be eligible for election as </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">President of India</span><span style=\"font-family:'Cambria Math'\">, as per Article 58.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">This is notably higher than the minimum age for Lok Sabha membership (25 years) or Rajya Sabha membership (30 years), reflecting the seniority expected for the nation's highest constitutional office.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 35 years.</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which classical dance form of India, from Assam, is traditionally performed within Vaishnavite monasteries known as 'Sattras'?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Manipuri</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sattriya</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Odissi</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bihu</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sattriya</span><span style=\"font-family:'Cambria Math'\">, developed by the Vaishnavite saint-reformer Srimanta Sankardeva in the 15th century, is traditionally performed within </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sattras (monasteries)</span><span style=\"font-family:'Cambria Math'\"> in Assam.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">Bihu, though very popular in Assam, is a folk dance associated with harvest festivals, rather than one of the eight classical dance forms recognised by the Sangeet Natak Akademi.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is Sattriya.</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Who remained India's richest person according to the Forbes India Rich List, reflecting continued dominance in the country's wealth rankings?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Shiv Nadar</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Gautam Adani</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Radhakishan Damani</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mukesh Ambani </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Mukesh Ambani</span><span style=\"font-family:'Cambria Math'\"> remained India's richest person according to the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Forbes India Rich List</span><span style=\"font-family:'Cambria Math'\">, continuing his long-standing position at the top of the country's wealth rankings.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">Both the Forbes India Rich List and the Hurun India Rich List, published by different organisations, track and rank India's wealthiest individuals annually, providing insight into shifting fortunes in the country's business landscape.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is Mukesh Ambani.</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Sundarbans', the world's largest mangrove forest, is shared between India and which other country?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Myanmar</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Nepal</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sri Lanka</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bangladesh</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sundarbans</span><span style=\"font-family:'Cambria Math'\">, formed at the delta of the Ganga, Brahmaputra and Meghna rivers, is shared between </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">India</span><span style=\"font-family:'Cambria Math'\"> (West Bengal) and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bangladesh</span><span style=\"font-family:'Cambria Math'\">, and is the world's largest mangrove forest.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">It is home to the Royal Bengal Tiger and is recognised as a UNESCO World Heritage Site in both countries, reflecting its exceptional ecological significance.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is Bangladesh.</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In which of the following airports India’s first SkyCast System was inaugurated?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rajiv Gandhi International Airport, Hyderabad</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Chhatrapati Shivaji Maharaj International Airport, Mumbai</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Indira Gandhi International Airport, Delhi</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kempegowda International Airport, Bengaluru</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">India’s first SkyCast System was inaugurated at </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Indira Gandhi International (IGI) Airport, New Delhi</span><span style=\"font-family:'Cambria Math'\"> in May 2026, making India the 19th country worldwide to deploy such advanced aviation weather monitoring technology. </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Facts about SkyCast System:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Location:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Inaugurated at </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Indira Gandhi International Airport (Delhi)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Date:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> May 29, 2026.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Purpose:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Provides </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">real-time weather intelligence</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> to pilots, airlines, and airport operators.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Impact:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Helps reduce </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">flight delays, diversions, and cancellations</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> caused by fog, turbulence, and poor visibility.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Technology:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Integrates </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Radar Wind Profiler, SODAR, Microwave Radiometer, Ground-based Fog Aerosol Spectrometer (GFAS), and CL61 Lidar-based Ceilometer</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Expansion:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Next facility planned at </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Jewar Airport (Uttar Pradesh)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, followed by rollout to other airports.</span></li></ul>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following classical dance form - originating monastery/institution pairs is CORRECTLY matched?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Odissi - Developed within Sikh Gurdwaras of Odisha</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sattriya - Developed within Vaishnavite Sattras of Assam by Srimanta Sankardeva</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kathak - Developed within Jain temples of Rajasthan</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bharatanatyam - Developed within Buddhist monasteries of Tamil Nadu</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sattriya</span><span style=\"font-family:'Cambria Math'\"> is correctly matched, having developed within </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Vaishnavite Sattras (monasteries)</span><span style=\"font-family:'Cambria Math'\"> of Assam, founded by </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Srimanta Sankardeva</span><span style=\"font-family:'Cambria Math'\">. The other pairs are incorrect: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bharatanatyam</span><span style=\"font-family:'Cambria Math'\"> developed within </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Hindu temples</span><span style=\"font-family:'Cambria Math'\"> (not Buddhist monasteries) of Tamil Nadu; </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kathak</span><span style=\"font-family:'Cambria Math'\"> developed through storytelling traditions associated with </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Hindu temples and later Mughal courts</span><span style=\"font-family:'Cambria Math'\"> (not Jain temples); and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Odissi</span><span style=\"font-family:'Cambria Math'\"> developed within </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Hindu temples</span><span style=\"font-family:'Cambria Math'\"> of Odisha (not Sikh Gurdwaras).</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">This question tests precise knowledge of each dance form's specific religious/institutional origins, rather than generic familiarity with dance names.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'Sattriya - Developed within Vaishnavite Sattras of Assam by Srimanta Sankardeva'.</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following 2025-26 government schemes is the 'odd one out', based on its primary target beneficiary group?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">PM Shram Yogi Maandhan Yojana</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">PM Mudra Yojana</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">RoSCTL Scheme</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">AICTE-VAANI 3.0</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">PM Shram Yogi Maandhan Yojana</span><span style=\"font-family:'Cambria Math'\"> (pension for unorganised sector workers), </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">PM Mudra Yojana</span><span style=\"font-family:'Cambria Math'\"> (loans for micro/small entrepreneurs) and the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">RoSCTL Scheme</span><span style=\"font-family:'Cambria Math'\"> (support for textile exporters) all primarily target </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">economic/livelihood support</span><span style=\"font-family:'Cambria Math'\"> for workers and businesses. </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">AICTE-VAANI 3.0</span><span style=\"font-family:'Cambria Math'\">, however, is focused on </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">promoting Indian languages in higher education</span><span style=\"font-family:'Cambria Math'\">, making it the odd one out, as its target beneficiaries are students and educational institutions rather than workers or exporters.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">Recognising the distinct policy domain (economic livelihood support vs educational/linguistic development) each scheme addresses helps in correctly identifying which one doesn't share the common thread with the others.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is AICTE-VAANI 3.0 (the odd one out).</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Who founded the 'Anjuman-i-Islamia' and other institutions promoting Muslim education and social reform in the late 19th century, alongside establishing the Muhammadan Anglo-Oriental College at Aligarh?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sir Syed Ahmed Khan</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Maulana Abul Kalam Azad</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Muhammad Ali Jinnah</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Badruddin Tyabji</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sir Syed Ahmed Khan</span><span style=\"font-family:'Cambria Math'\"> founded the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Muhammadan Anglo-Oriental College</span><span style=\"font-family:'Cambria Math'\"> at Aligarh in 1875 (later Aligarh Muslim University), promoting modern education and social reform among Indian Muslims.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">His broader reform movement, often called the 'Aligarh Movement', emphasised the importance of English education and scientific learning alongside religious and cultural values.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is Sir Syed Ahmed Khan.</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Tehri Dam is built on which River?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bhagirathi</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mandakini</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Alaknanda</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Nandakini</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Tehri Dam</span><span style=\"font-family:'Cambria Math'\"> is built on the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bhagirathi River</span><span style=\"font-family:'Cambria Math'\"> in Uttarakhand.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bhagirathi River</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Tehri Dam is one of the tallest dams in India (260.5 m).</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">It is a multipurpose project providing </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">hydropower, irrigation, and drinking water</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Located in the Himalayan foothills near Tehri town, Uttarakhand.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mandakini River</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Tributary of Alaknanda, flows near Kedarnath.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Not associated with Tehri Dam.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Alaknanda River</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Major tributary of the Ganga, joins Bhagirathi at Devprayag.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Tehri Dam is not built on Alaknanda.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Nandakini River</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Smaller tributary of Alaknanda.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">No dam of national importance built here.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which statement best explains the Right to Constitutional Remedies guaranteed under Article 32 of the Indian Constitution?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The constitutional right enabling citizens to hold public office under prescribed legal qualifications.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The constitutional right allowing eligible citizens to participate in parliamentary and state elections.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The constitutional right to approach the Supreme Court for enforcement of Fundamental Rights directly.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The constitutional right permitting every citizen to contest elections for the Parliament of India.</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Right to Constitutional Remedies under Article 32 is best explained as the constitutional right to directly approach the Supreme Court for enforcement of Fundamental Rights.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option 1: Hold public office under legal qualifications</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">That relates to eligibility for elections, not Article 32.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option 2: Participate in parliamentary and state elections</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">That is part of </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">political rights</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> under Representation of People Acts, not Article 32.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option 3: Approach the Supreme Court for enforcement of Fundamental Rights directly</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct. Article 32 empowers citizens to move the Supreme Court if their Fundamental Rights are violated.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Dr. B.R. Ambedkar called it the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">“heart and soul of the Constitution.”</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Remedies include writs like </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Habeas Corpus, Mandamus, Prohibition, Certiorari, and Quo Warranto</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option 4: Contest elections for Parliament of India</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">That is governed by election laws, not Article 32.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 86, "question": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The present age of Rahul is twice that of his brother Rohit. Five years ago, the ratio of their ages was </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785932328704_image001.png\" width=\"22\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-family:'Cambria Math'\">. What is Rohit’s present age?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">8 years</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">15 years</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">20 years</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">10 years</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Let Rohit’s present age be </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785932328704_image002.png\" width=\"9\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-family:'Cambria Math'\">years.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rahul’s present age </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1
