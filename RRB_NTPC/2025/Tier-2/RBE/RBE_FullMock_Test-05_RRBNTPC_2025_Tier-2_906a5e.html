;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">East Bengal</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, defeating Inter Kashi 2–1.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Men's T20 World Cup 2026</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Won by </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">India</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, beating New Zealand in the final.</span></li></ul>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements about global rankings released for India between June 2025 and June 2026:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. India ranked 3rd in the Asia Power Index (Lowy Institute).</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. India ranked 38th in the Global Innovation Index.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">III. India topped the World Press Freedom Index.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">How many of the above statements are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only one</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">All three</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only two</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">None</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Two of the above statements are correct (Statements I and II).</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Evaluation of Statements</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I (Correct):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> India ranked 3rd in the Lowy Institute Asia Power Index, coming in behind only the United States and China.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II (Correct):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> India secured the 38th position in the Global Innovation Index, reflecting steady improvements over prior years.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement III (Incorrect):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> India did not top the World Press Freedom Index (which is typically led by countries like Norway); India has historically ranked much lower (e.g., 159th).</span></li></ul>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements about classical dance forms of India:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. Kuchipudi originated in Andhra Pradesh.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. Sattriya, associated with Assam, is performed traditionally within monasteries called 'Sattras'.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">III. All 8 classical dance forms recognised by the Sangeet Natak Akademi are performed exclusively by women.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">How many of the above statements are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">None</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">All three</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only one</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only two</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Two of the three statements are correct (Statements I and II), while Statement III is incorrect because classical dances are performed by both men and women. </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement Analysis</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I (Correct):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><a href=\"https://testbook.com/question-answer/which-of-the-following-classical-dance-forms-origi--6a0ab8d1149e1a445353997f\" target=\"_blank\"><span style=\"line-height:115%;font-size:12pt;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">Kuchipudi</span></a><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> originated in the Krishna district of the southern state of Andhra Pradesh.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II (Correct):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><a href=\"https://testbook.com/question-answer/consider-the-following-statements-about-sattriya-d--69703fe03829ecc958a899fc\" target=\"_blank\"><span style=\"line-height:115%;font-size:12pt;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">Sattriya</span></a><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> is a major classical dance from </span><a href=\"https://testbook.com/question-answer/which-of-the-following-dance-forms-evolved-from-as--67f8e86c3c9fe7f5bd699e12\" target=\"_blank\"><span style=\"line-height:115%;font-size:12pt;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">Assam</span></a><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> that was traditionally performed in Vaishnavite monasteries called Sattras.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement III (Incorrect):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> The eight classical dance forms recognized by the Sangeet Natak Akademi are performed by artists of both genders, not exclusively by women. </span></li></ul>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Assertion (A): Diamond is an excellent conductor of heat despite being an electrical insulator.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Reason (R): Each carbon atom in diamond is covalently bonded to four others in a rigid 3D lattice, allowing efficient transfer of vibrational (heat) energy without free electrons.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, but R is NOT the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is true, but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is false, but R is true</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Both Assertion (A) and Reason (R) are correct, and Reason (R) is the correct explanation for Assertion (A).</span><span style=\"font-family:'Cambria Math'\"> Diamond conducts heat very well through lattice vibrations (phonons) even though it has no free electrons to carry electric current. </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Facts</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Thermal Conductivity</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Diamond has a very high heat transfer rate due to its strong covalent bonds and light carbon atoms.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Electrical Insulation</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: It does not conduct electricity because all outer electrons are locked in tight bonds.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Lattice Structure</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Heat moves as a wave of vibrations through the tight 3D network. </span></li></ul>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Assertion (A): An increase in the Cash Reserve Ratio (CRR) reduces the money supply in the economy.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Reason (R): A higher CRR requires banks to hold more reserves with the RBI, leaving less money available for lending.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, and R is NOT the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, but R is the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is true, but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is false, but R is true</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">🟢</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Both Assertion (A) and Reason (R) are true, and Reason (R) is the correct explanation of Assertion (A)</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Breakdown of the Statements</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🟢</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Assertion (A) is true</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: The Cash Reserve Ratio (CRR) represents the minimum percentage of a commercial bank's total deposits that must be maintained as liquid cash with the Reserve Bank of India (RBI). When the RBI increases this ratio, it contracts liquidity, which directly decreases the broad money supply in the economy.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🟢</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Reason (R) is true</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: A higher CRR physically restricts banks by forcing them to lock up a larger portion of their Net Demand and Time Liabilities (NDTL) with the central bank. Because this money is safely parked with the RBI, it is entirely unavailable for creation of secondary credit through public loans.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why the Reason Correctly Explains the Assertion</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The reason outlines the exact transmission mechanism of how the assertion happens. The reduction in the money supply (Assertion) is the direct, systemic consequence of banks having fewer loanable funds to distribute into the market (Reason).</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Arrange the following Indian mountain passes from north to south: </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Zoji La, Nathu La, Rohtang Pass, Palakkad Gap</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Zoji La - Rohtang Pass - Nathu La - Palakkad Gap</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Nathu La - Zoji La - Rohtang Pass - Palakkad Gap</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Zoji La - Nathu La - Rohtang Pass - Palakkad Gap</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rohtang Pass - Zoji La - Nathu La - Palakkad Gap</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct north-to-south order of these Indian mountain passes is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Zoji La</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Rohtang Pass</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Nathu La</span><span style=\"font-family:'Cambria Math'\">, and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Palakkad Gap</span><span style=\"font-family:'Cambria Math'\">. </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Pass Locations and Latitudes</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Zoji La</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Location:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Union Territory of Ladakh / Kashmir border (Western Himalayas)</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Latitude:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> ~34.3° N</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Connects:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Srinagar to Leh</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Rohtang Pass</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Location:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Himachal Pradesh (Pir Panjal Range)</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Latitude:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> ~32.4° N</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Connects:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Kullu Valley to Lahaul and Spiti Valleys</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Nathu La</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Location:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> East Sikkim district (Himalayas)</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Latitude:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> ~27.4° N</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Connects:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Sikkim to Tibet (China)</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Palakkad Gap (Palghat Gap)</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Location:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Kerala / Tamil Nadu border (Western Ghats)</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Latitude:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> ~10.7° N</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Connects:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Kerala to Tamil Nadu</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following rulers is correctly matched with the administrative/revenue reform they introduced?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Akbar - Permanent Settlement</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sher Shah Suri – Land Revenue Reforms</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Alauddin Khilji - Mansabdari system</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Muhammad bin Tughlaq - Zabti system</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct option is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sher Shah Suri – Land Revenue Reforms</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Detailed Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sher Shah Suri – Land Revenue Reforms:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> This is </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">correctly matched</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">. Sher Shah Suri introduced a systematic and well-organized land revenue system based on the measurement of land (</span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Cambria Math'\">Rai</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> system), classification of land according to its fertility, and fixation of state share (usually one-third of the produce). His agrarian reforms later served as a base for Akbar's revenue system.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Akbar – Permanent Settlement:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> This is </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">incorrectly matched</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">. The Permanent Settlement (Zamindari system) was introduced by </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Lord Cornwallis</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> in 1793, long after Akbar's time. Akbar's revenue system was known as the </span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Cambria Math'\">Zabti</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> or </span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Cambria Math'\">Dahsala</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> system, formulated with the help of Raja Todar Mal.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Alauddin Khilji – Mansabdari System:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> This is </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">incorrectly matched</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">. The Mansabdari system was introduced by </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Akbar</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> as a grading system to fix the rank, military responsibility, and salary of imperial officials. Alauddin Khilji is instead famous for his market control regulations, fixing prices of commodities, and introduction of </span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Cambria Math'\">Dagh</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> (branding of horses) and </span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Cambria Math'\">Huliya</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> (descriptive roll of soldiers).</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Muhammad bin Tughlaq – Zabti System:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> This is </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">incorrectly matched</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">. The </span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Cambria Math'\">Zabti</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> system was developed during the Mughal era under </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Akbar</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">. Muhammad bin Tughlaq is famous for experiments such as the transfer of capital to Daulatabad, the introduction of token currency, and heavy taxation in the Doab region.</span></li></ul>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements regarding the Constitutional Amendment process under Article 368:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. Amendments to the 'Fundamental Rights' provisions require only a simple majority in Parliament.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. Some amendments require ratification by at least half of the State Legislatures.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">III. The President has no power to withhold assent to a Constitutional Amendment Bill once passed by Parliament (post the 24th Amendment).</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">How many of the above statements are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only one</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">All three</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only two</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">None</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Only two</span><span style=\"font-family:'Cambria Math'\"> of the above statements are correct (Statements II and III).</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">📊</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Detailed Breakdown of the Statements</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I is incorrect</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Amendments to the Fundamental Rights provisions (Part III of the Constitution) cannot be made by a simple majority. They explicitly require a </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">special majority in Parliament</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> under </span><a href=\"https://www.constitutionofindia.net/articles/article-368-power-of-parliament-to-amend-the-constitution-and-procedure-therefor/\" target=\"_blank\"><span style=\"line-height:115%;font-size:12pt;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">Article 368</span></a><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">. This means a majority of the total membership of each House along with a majority of not less than two-thirds of the members present and voting.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II is correct</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Amendments that alter the federal features of the Constitution (such as the election of the President, powers of the Supreme Court/High Courts, or the Seventh Schedule lists) require </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">ratification by the legislatures of at least half of the states</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> by a simple majority.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement III is correct</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: The </span><a href=\"https://testbook.com/question-answer/consider-the-following-statements-regarding-the-am--69f5fed96d88bbae0eab5ef7\" target=\"_blank\"><span style=\"line-height:115%;font-size:12pt;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">24th Constitutional Amendment Act of 1971</span></a><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> amended Article 368 to make it </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">obligatory for the President to give assent</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> to a Constitutional Amendment Bill. The President can neither withhold assent nor return the bill to Parliament for reconsideration.</span></li></ul>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 Terabyte (TB) is equal to how many Gigabytes (GB), using the standard binary convention (1024-based)?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2048 GB</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1000 GB</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">100 GB</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1024 GB</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Using the standard binary convention (base-2), </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1 Terabyte (TB)</span><span style=\"font-family:'Cambria Math'\"> is equal to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1,024 Gigabytes (GB).</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Binary Storage Hierarchy</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Computers use binary systems where each unit increases by a factor of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">2¹⁰ (1,024)</span><span style=\"font-family:'Cambria Math'\">:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1 Kilobyte (KB)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> = </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1,024 Bytes</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1 Megabyte (MB)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> = </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1,024 Kilobytes</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1 Gigabyte (GB)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> = </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1,024 Megabytes</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1 Terabyte (TB)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> = </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1,024 Gigabytes</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Binary vs. Decimal Confusion</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Operating systems like Windows calculate capacity using the binary convention. However, hardware manufacturers often use the decimal convention (base-10), where </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1 TB</span><span style=\"font-family:'Cambria Math'\"> is marketed as exactly </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1,000 GB</span><span style=\"font-family:'Cambria Math'\">. This difference is why a branded </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1 TB</span><span style=\"font-family:'Cambria Math'\"> hard drive often displays roughly </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">931 GB</span><span style=\"font-family:'Cambria Math'\"> of usable space when plugged into a computer. </span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following appointments is correctly matched with its effective month/year?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ajay Seth as IRDAI Chairman - March 2025</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Gyanesh Kumar as CEC - July 2025</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Poonam Gupta as RBI Deputy Governor - January 2025</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Justice B.R. Gavai as 52nd CJI - May 2025</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Justice B.R. Gavai as 52nd CJI - May 2025 is the correctly matched appointment.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Justice B.R. Gavai:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Sworn in as the 52nd Chief Justice of India on </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">May 14, 2025</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Gyanesh Kumar:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Took charge as the Chief Election Commissioner (CEC) on </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">February 19, 2025</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> (incorrectly listed as July 2025).</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Poonam Gupta:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Appointed as RBI Deputy Governor effective </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">May 2, 2025</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> / took charge in April/May 2025 (incorrectly listed as January 2025). </span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ajay Seth:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Appointed as IRDAI Chairman in </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">July 2025</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> and assumed charge in September 2025 (incorrectly listed as March 2025, which was when the previous chairman's term ended).</span></li></ul>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements about India's Global Hunger Index (GHI) 2025 performance:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. India ranked 102nd among 123 countries.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. India's GHI score placed it in the 'Alarming' category.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the statements given above is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both I and II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither I nor II</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Only Statement I is correct.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation of Statements</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✔️</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I is correct</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: In the 2025 Global Hunger Index (GHI) report titled </span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Cambria Math'\">\"20 Years of Tracking Progress: Time to Recommit to Zero Hunger\"</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">India is ranked 102nd among 123 countries</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II is incorrect</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: India achieved a GHI score of </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">25.8</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">. According to the GHI severity scale, a score between 20.0 and 34.9 places a nation in the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">'Serious' category</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not the 'Alarming' category. The 'Alarming' category requires a higher score between 35.0 and 49.9.</span></li></ul>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements about India's river systems:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. The Narmada and Tapi are the only two major rivers of peninsular India that flow westward into the Arabian Sea.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. The Godavari is the longest river of peninsular India.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">III. The Kaveri river basin is shared only between Karnataka and Tamil Nadu.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">How many of the above statements are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only two</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">All three</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only one</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">None</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Out of the three statements provided, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">only one</span><span style=\"font-family:'Cambria Math'\"> statement is correct (Statement II).</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Analysis of the Statements</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I is Incorrect:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> While the Narmada and Tapi are the two largest and most prominent west-flowing peninsular rivers, they are </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">not the only ones</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">. Other major peninsular rivers like the </span><a href=\"https://indiawris.gov.in/wiki/doku.php?id=major_river_system_in_india\" target=\"_blank\"><span style=\"line-height:115%;font-size:12pt;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">Mahi River</span></a><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> and </span><a href=\"https://testbook.com/question-answer/which-of-the-following-rivers-falls-in-the-arabian--5f747cefd5f3f70357f30688\" target=\"_blank\"><span style=\"line-height:115%;font-size:12pt;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">Sabarmati River</span></a><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> also flow westward into the Arabian Sea. </span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II is Correct:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> The </span><a href=\"https://testbook.com/question-answer/which-of-the-following-is-the-longest-river-of-pen--69f856178c9b12ad58ba67f3\" target=\"_blank\"><span style=\"line-height:115%;font-size:12pt;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">Godavari River</span></a><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> is indeed the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">longest river of peninsular India</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, stretching about 1,465 kilometers. It is often referred to as the 'Dakshin Ganga' (Ganges of the South) due to its massive scale. </span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement III is Incorrect:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> The </span><a href=\"https://en.wikipedia.org/wiki/Kaveri\" target=\"_blank\"><span style=\"line-height:115%;font-size:12pt;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">Kaveri River basin</span></a><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> is not shared only between Karnataka and Tamil Nadu. Its drainage catchment area spans three states—</span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Karnataka, Tamil Nadu, and Kerala</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">—as well as the Union Territory of </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Puducherry</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following UNESCO World Heritage Site - state pairs is INCORRECTLY matched?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Hampi - Andhra Pradesh</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Khajuraho - Madhya Pradesh</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ellora Caves - Maharashtra</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sun Temple, Konark - Odisha</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Hampi - Andhra Pradesh</span><span style=\"font-family:'Cambria Math'\"> is the incorrectly matched pair.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation of the Correct Option</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Hampi</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> is a </span><a href=\"https://whc.unesco.org/\" target=\"_blank\"><span style=\"line-height:115%;font-size:12pt;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">UNESCO World Heritage Site</span></a><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> located in </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Karnataka</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not Andhra Pradesh. It served as the historic capital of the prominent Vijayanagara Empire during the 14th century and is celebrated worldwide for its stunning Dravidian-style architectural ruins.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation of the Other Options</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Green Checkmark </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Khajuraho - Madhya Pradesh</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: This is </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">correctly</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> matched. The Khajuraho Group of Monuments is located in the Chhatarpur district of Madhya Pradesh and is widely renowned for its Nagara-style Hindu and Jain temples.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Green Checkmark </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ellora Caves - Maharashtra</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: This is </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">correctly</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> matched. Situated in the Aurangabad district of Maharashtra, these ancient rock-cut caves seamlessly bring together Hindu, Buddhist, and Jain monuments.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Green Checkmark </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sun Temple, Konark - Odisha</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: This is </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">correctly</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> matched. Located on the coastline of Odisha, this massive 13th-century monument is uniquely constructed in the shape of a grand chariot dedicated to the Sun God, Surya.</span></li></ul>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Match the following industrial processes with their principal product:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A. Haber process - 1. Ammonia</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">B. Contact process - 2. Sulphuric acid</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">C. Solvay process - 3. Sodium carbonate</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">D. Ostwald process - 4. Nitric acid</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following combinations is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-2, B-1, C-4, D-3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-1, B-2, C-3, D-4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-1, B-3, C-2, D-4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-4, B-2, C-3, D-1</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct combination is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">A - 1, B - 2, C - 3, D - 4</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Detailed Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">A. Haber process – 1. Ammonia:</span><br><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The Haber-Bosch process is an industrial method used to produce </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">ammonia (NH₃)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> by reacting nitrogen gas with hydrogen gas under high temperature and pressure in the presence of a metal catalyst.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">B. Contact process – 2. Sulphuric acid:</span><br><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The Contact process is the current industrial method used to manufacture high-purity </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">sulphuric acid (H₂SO₄)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> through the catalytic oxidation of sulphur dioxide.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">C. Solvay process – 3. Sodium carbonate:</span><br><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The Solvay process is used to produce </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">sodium carbonate</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> (washing soda, Na₂CO₃) using readily available raw materials like brine, ammonia, and limestone.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">D. Ostwald process – 4. Nitric acid:</span><br><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The Ostwald process is a chemical process used for making </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">nitric acid (HNO₃)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> by the catalytic oxidation of ammonia.</span></li></ul>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements regarding inflation measurement in India:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. The Wholesale Price Index (WPI) does not include services in its basket.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. The RBI uses CPI (Combined) as its key measure for inflation targeting.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">III. The base year of the current CPI (Combined) series is 2012.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">How many of the above statements are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only one</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">All three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">None</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">All three</span><span style=\"font-family:'Cambria Math'\"> statements are correct: Statement I, Statement II, and Statement III.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Breakdown of Statements</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I is correct:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> The Wholesale Price Index (WPI) tracks goods only and excludes services.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II is correct:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> The Reserve Bank of India (RBI) uses the Consumer Price Index Combined (CPI-C) as the official measure for inflation targeting.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement III is correct:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> The base year for the current active CPI (Combined) series is 2012.</span></li></ul>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following statements about India's soil types is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. Black soil is formed from the weathering of basaltic lava and is ideal for cotton.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. Laterite soil forms in regions of heavy rainfall and high temperature, through intense leaching.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">III. Alluvial soil is the most widespread soil type in India by area.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">How many of the above statements are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">All three</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only one</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">None</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">All 3</span><span style=\"font-family:'Cambria Math'\"> of the statements are correct.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why the statements are correct:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I is correct</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> : </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🎯</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Black soil</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> (also known as Regur or Black Cotton soil) forms directly from the weathering and denudation of </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">basaltic lava rocks</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> in the </span><a href=\"https://testbook.com/question-answer/the-black-cotton-soil-of-india-has-been-formed-due--61629eea361f733524bf59e2\" target=\"_blank\"><span style=\"line-height:115%;font-size:12pt;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">Deccan Trap region</span></a><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">. Its high clay composition and exceptional moisture-retention capability make it </span><a href=\"https://testbook.com/objective-questions/mcq-on-soils--5eea6a1239140f30f369ec9e\" target=\"_blank\"><span style=\"line-height:115%;font-size:12pt;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">perfectly suited for cotton cultivation</span></a><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II is correct</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> : </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🌧️</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Laterite soil</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> develops specifically in tropical areas experiencing </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">high temperatures and intense seasonal rainfall</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">. Under these climates, heavy rain washes away lime and silica through a process called </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">leaching</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, leaving behind a distinct red soil dense with iron and aluminum oxides. </span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement III is correct</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> : </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🗺️</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Alluvial soil</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> is indeed the single most extensive and vital soil category in India. Deposited across northern plains and coastal areas by major river networks, it blankets roughly </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">43% of the nation's total land area</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements about the Ilbert Bill Controversy (1883):</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. It proposed allowing Indian judges to try British subjects in criminal cases.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. It was withdrawn without any modification due to European opposition.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">III. It contributed to growing Indian political consciousness ahead of the Congress's formation.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">How many of the above statements are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only two</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">All three</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only one</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">None</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">two</span><span style=\"font-family:'Cambria Math'\"> of the above statements (I and III) are correct. Statement I and Statement III are true, while Statement II is false because the bill was not withdrawn, but rather passed with a compromise/modification. </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement Analysis</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I (Correct):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Proposed allowing Indian district magistrates and sessions judges to try British and European subjects in criminal cases.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II (Incorrect):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> It was not withdrawn; instead, it was modified through a compromise allowing European defendants the right to a jury where half the members were European before being enacted in 1884.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement III (Correct):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> The fierce European opposition and racial backlash united Indians and served as a major precursor to the founding of the </span><a href=\"https://www.britannica.com/topic/Indian-National-Congress\" target=\"_blank\"><span style=\"line-height:115%;font-size:12pt;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">Indian National Congress</span></a><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> in 1885.</span></li></ul>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:
