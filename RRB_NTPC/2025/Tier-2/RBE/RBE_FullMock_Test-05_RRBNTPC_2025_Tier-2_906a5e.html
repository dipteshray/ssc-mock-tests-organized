pt;font-weight:bold;font-family:'Cambria Math'\">Smart Town Planning</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Streets crossed at right angles, making a neat grid shape.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Clean Water and Waste</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Every house had a way to carry dirty water away safely through covered drains.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Uniform Building Blocks</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Builders used bricks of the exact same size and baked them hard in fires.</span></li></ul>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements about the Government of India Act, 1935:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. It proposed an All-India Federation, including both British provinces and princely states.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. The federal part of the Act never came into effect because an insufficient number of princely states joined.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the statements given above is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both I and II</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither I nor II</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Both statements I and II are correct.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I is correct</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> (</span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🟢</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">): The </span><a href=\"https://testbook.com/question-answer/with-reference-to-the-government-of-india-act-193--666e9947dd99d5ae1f6cfb98\" target=\"_blank\"><span style=\"line-height:115%;font-size:12pt;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">Government of India Act, 1935</span></a><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> envisioned an All-India Federation comprised of eleven British provinces, six Chief Commissioner's provinces, and those princely states that voluntarily chose to accede. </span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II is correct</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> (</span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🟢</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">): The establishment of this federation was strictly conditional upon a specific quota of princely states joining it. Specifically, states representing at least half of the total princely state population and holding at least 52 seats in the proposed Council of States had to sign instruments of accession. Because the required number of rulers refused to give up their autonomy, this condition was never fulfilled, and the federal structure of the Act was entirely shelved.</span></li></ul>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements about the 'Anti-Defection Law':</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. It applies to both Houses of Parliament and State Legislatures.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. A nominated member who joins a political party within six months of taking their seat is NOT disqualified for defection.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the statements given above is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both I and II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither I nor II</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Both statements I and II are correct.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🟢</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I is correct</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: The </span><a href=\"https://education.vikaspedia.in/viewcontent/education/law-and-constitution/anti-defection-law-in-india?lgn=en\" target=\"_blank\"><span style=\"line-height:115%;font-size:12pt;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">Anti-Defection Law</span></a><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, contained within the Tenth Schedule of the Constitution of India, </span><a href=\"https://testbook.com/question-answer/regarding-anti-defection-law-in-india-consider-th--629dbf7eb6666abf74c865df\" target=\"_blank\"><span style=\"line-height:115%;font-size:12pt;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">applies equally to both Houses of Parliament</span></a><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> (Lok Sabha and Rajya Sabha) as well as State Legislatures (Legislative Assemblies and Legislative Councils). </span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🟢</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II is correct</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: According to the law, a nominated member is given a </span><a href=\"https://lotusarise.com/qna/upsc/q-with-reference-to-anti-defection-law-in-india-consider-the-following-statements\" target=\"_blank\"><span style=\"line-height:115%;font-size:12pt;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">six-month window</span></a><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> from the date of taking their seat to join any political party. If they join a party </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">within</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> these six months, they are </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">NOT disqualified</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">. They only face disqualification if they choose to join a political party </span><a href=\"https://testbook.com/question-answer/a-nominated-member-of-a-house-becomes-disqualified--5fbd391be6230273f59ffac2\" target=\"_blank\"><span style=\"line-height:115%;font-size:12pt;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">after the expiry of six months</span></a><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following best distinguishes a 'Compiler' from an 'Interpreter'?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A compiler translates the entire program before execution; an interpreter translates and executes line-by-line</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A compiler only works with Python; an interpreter only works with C</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">An interpreter is always faster than a compiler for all programs</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A compiler cannot detect syntax errors</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer option is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">A: A compiler translates the entire program before execution; an interpreter translates and executes line-by-line</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why the option is correct:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🟢</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option A</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> accurately describes the fundamental difference in how these two language translators process source code. A </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">compiler</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> scans the entire codebase at once, optimizing and converting it into a separate executable machine code file before the program ever runs. Conversely, an </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">interpreter</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> bypasses a separate compilation phase, directly reading, translating, and executing the source code one statement or line at a time during runtime.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why the other options are incorrect:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🔴</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option B</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> (</span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Cambria Math'\">\"A compiler only works with Python; an interpreter only works with C\"</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">) reverses the typical association. C is primarily a compiled language, whereas Python is generally interpreted. Furthermore, compilers and interpreters are general concepts not restricted to any single language. </span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🔴</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option C</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> (</span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Cambria Math'\">\"An interpreter is always faster than a compiler for all programs\"</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">) is false. Because interpreters must translate code line-by-line on the fly while the program is running, they introduce processing overhead and run significantly </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">slower</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> than pre-compiled machine code.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🔴</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option D</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> (</span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Cambria Math'\">\"A compiler cannot detect syntax errors\"</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">) is incorrect. A compiler scans the entire codebase before translation and will explicitly block execution and generate a report of all detected syntax errors.</span></li></ul>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">India ranked 94th among 167 countries in the 2026 UN Sustainable Development Goals (SDG) Index. Which of the following statements about this ranking is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. It was India's highest-ever rank in the index.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. India ranked above Bhutan, Nepal and Sri Lanka in this edition.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the statements given above is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both I and II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither I nor II</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement I only</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🟢</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I is correct</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: In the </span><a href=\"https://www.drishtiias.com/daily-updates/daily-news-analysis/un-sustainable-development-report-2026\" target=\"_blank\"><span style=\"line-height:115%;font-size:12pt;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">Sustainable Development Report 2026</span></a><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> published by the UN Sustainable Development Solutions Network (SDSN), India secured the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">94th rank</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> among 167 countries. This marks India's </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">highest-ever position</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> in the index since its inception, improving from 99th in 2025 and 109th in 2024. </span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🔴</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II is incorrect</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Despite the record improvement, India still </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">remains behind</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> several of its South Asian neighbors—including </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bhutan, Nepal, Sri Lanka, and the Maldives</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">—in the global rankings.</span></li></ul>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following current affairs facts from the June 2025-June 2026 window is INCORRECTLY stated?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Vice Admiral Krishna Swaminathan was Chief of the Naval Staff throughout 2025</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">NISAR was launched on 30 July 2025</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Educate Girls won the 2025 Ramon Magsaysay Award</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">India will host the 18th BRICS Summit in 2026</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The statement </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">\"Vice Admiral Krishna Swaminathan was Chief of the Naval Staff throughout 2025\"</span><span style=\"font-family:'Cambria Math'\"> is incorrectly stated. Vice Admiral Krishna Swaminathan assumed charge as the 27th Chief of the Naval Staff on May 31, 2026.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Fact Check Breakdown</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Vice Admiral Krishna Swaminathan:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Assumed office on May 31, 2026, succeeding Admiral Dinesh Kumar Tripathi; he did not serve as CNS throughout 2025.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">NISAR Launch:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Launched on July 30, 2025.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ramon Magsaysay Award:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Won by the Indian NGO </span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Cambria Math'\">Educate Girls</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> in 2025.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">BRICS Summit:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> India assumed the chairmanship to host the 18th BRICS Summit in 2026. </span></li></ul>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following pairs of newspaper and its founder/editor is INCORRECTLY matched?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Young India - Bal Gangadhar Tilak</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kesari - Bal Gangadhar Tilak</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Harijan - Mahatma Gandhi</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Al-Hilal - Maulana Abul Kalam Azad</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The incorrectly matched pair is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Young India - Bal Gangadhar Tilak</span><span style=\"font-family:'Cambria Math'\">, because </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Young India</span><span style=\"font-family:'Cambria Math'\"> was published and edited by Mahatma Gandhi (originally founded as a book/journal by Lala Lajpat Rai), whereas the other three pairs are correctly matched.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Pair Details:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kesari</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Founded and edited by Bal Gangadhar Tilak in Marathi.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Harijan</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Weekly newspaper founded and edited by Mahatma Gandhi.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Al-Hilal</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Weekly Urdu newspaper founded and edited by </span><a href=\"https://testbook.com/question-answer/who-was-the-founder-of-the-newspaper-al-hilal--6582afe42ee570e228e9c079\" target=\"_blank\"><span style=\"line-height:115%;font-size:12pt;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">Maulana Abul Kalam Azad</span></a><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Young India</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Edited by Mahatma Gandhi from 1919 to 1931 (after Lala Lajpat Rai's 1916 publication in the US).</span></li></ul>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is India's highest civilian gallantry-equivalent honour specifically for children, awarded for exceptional bravery?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bal Shakti Puraskar</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bharat Ratna</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Padma Shri</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Arjuna Award</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bharat Award</span><span style=\"font-family:'Cambria Math'\"> is India's highest civilian gallantry-equivalent category specifically presented to children for exceptionally outstanding acts of bravery.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It is the pinnacle honor among the </span><a href=\"https://en.wikipedia.org/wiki/National_Bravery_Award\" target=\"_blank\"><span style=\"text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">National Bravery Awards</span></a><span style=\"font-family:'Cambria Math'\"> administered annually by the Indian Council for Child Welfare (ICCW).</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Structure of Child Bravery Honors in India</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The National Bravery Awards are divided into five sub-categories, ranked by precedence: </span></p><ol type=\"1\"><li style=\"margin-left:14.11pt;margin-bottom:10pt;line-height:115%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span style=\"font-weight:bold\">Bharat Award</span><span>: The highest overall honor, instituted in 1987 for exceptionally meritorious acts of life-saving courage.</span></li><li style=\"margin-left:14.11pt;margin-bottom:10pt;line-height:115%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span style=\"font-weight:bold\">Geeta Chopra Award</span><span>: Instituted in 1978 and awarded annually to a girl displaying exemplary valor.</span></li><li style=\"margin-left:14.11pt;margin-bottom:10pt;line-height:115%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span style=\"font-weight:bold\">Sanjay Chopra Award</span><span>: Instituted in 1978 and awarded annually to a boy displaying exemplary valor.</span></li><li style=\"margin-left:14.11pt;margin-bottom:10pt;line-height:115%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span style=\"font-weight:bold\">Bapu Gaidhani Award</span><span>: Instituted in 1988, typically given to three children who show immense presence of mind while facing danger.</span></li><li style=\"margin-left:14.11pt;margin-bottom:10pt;line-height:115%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span style=\"font-weight:bold\">General National Bravery Awards</span><span>: Conferred upon selected children for individual spontaneous acts of selfless courage.</span></li></ol>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A library has an average of 768 visitors on Mondays and 258 visitors on other days. Find the average number of visitors per day in a 30-day month beginning with Tuesday.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">263</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">236</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">362</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">326</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A 30-day month beginning with Tuesday h let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
