115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following Constitutional posts requires a minimum age of 35 years for eligibility?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">President of India</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Member of the Lok Sabha</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Member of a State Legislative Assembly</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Judge of a High Court</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer option is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">President of India</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation of the Correct Option</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">President of India</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: According to Article 58 of the </span><a href=\"http://constitutionofindia.etal.in/article_058/\" target=\"_blank\"><span style=\"line-height:115%;font-size:12pt;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">Constitution of India</span></a><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, a candidate must be a citizen of India, must be qualified to become a member of the Lok Sabha, and must have completed a minimum age of </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">35 years</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> to be eligible for election.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation of the Incorrect Options</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Member of the Lok Sabha</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Under Article 84 of the Constitution, the minimum age required to contest elections for the Lok Sabha (House of the People) is </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">25 years</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Member of a State Legislative Assembly</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Under Article 173 of the Constitution, a person must be at least </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">25 years</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> old to be eligible to become a Member of a Legislative Assembly (MLA).</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Judge of a High Court</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Under Article 217 of the Constitution, there is </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">no minimum age</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> specified to be appointed as a Judge of a High Court. Instead, eligibility is based on experience (such as holding a judicial office in India or practicing as an advocate in a High Court for at least 10 years).</span></li></ul>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following statements about 'HTTPS' is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. It uses SSL/TLS encryption to secure data transmission.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. It operates over a different port than standard HTTP.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">How many of the above statements are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">None of these</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both I and II</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Both statements</span><span style=\"font-family:'Cambria Math'\"> (I and II) are correct. </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation of Statements</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🟢</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I is correct.</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> HTTPS (HyperText Transfer Protocol Secure) establishes an encrypted communication channel by </span><a href=\"https://testbook.com/question-answer/which-of-the-following-statements-is-true-regardin--69675628776d4e178bf5e9d2\" target=\"_blank\"><span style=\"line-height:115%;font-size:12pt;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">running standard HTTP over an SSL/TLS layer</span></a><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">. This protects data integrity and prevents unauthorized interceptors from viewing sensitive data in transit.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🟢</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II is correct.</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Standard unencrypted HTTP operates over network </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">port 80</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> by default, whereas </span><a href=\"https://testbook.com/question-answer/which-of-the-following-is-the-purpose-of-the-http--645c94636720754b8d98d33c\" target=\"_blank\"><span style=\"line-height:115%;font-size:12pt;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">HTTPS traffic defaults to network </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">port 443</span></a><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements about defence exercises held in the June 2025 - June 2026 window:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. Exercise Yudh Abhyas 2025 (India-USA) was held in Alaska.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. Exercise INDRA 2025 (India-Russia) was held at Mahajan Field Firing Range, Rajasthan.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">III. Exercise Cyclone 2025 (India-Egypt) was held in West Bengal.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">How many of the above statements are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only two</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">All three</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only one</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">None</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Two of the above statements are correct (Statements I and II). </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I is correct:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Exercise Yudh Abhyas 2025 (India-USA joint military exercise) was held at Fort Wainwright, Alaska, USA, in September 2025. </span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II is correct:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Exercise INDRA 2025 (India-Russia joint military exercise) was conducted at the Mahajan Field Firing Range in Bikaner, Rajasthan, in October 2025.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement III is incorrect:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Exercise Cyclone 2025 (India-Egypt special forces exercise) was held at the Mahajan Field Firing Range in Rajasthan, not in West Bengal (the 2025 edition took place in February 2025 in Rajasthan).</span></li></ul>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Who became the first woman Director (HR) on the Airports Authority of India (AAI) Board, assuming charge in January 2026?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Nivedita Dubey</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Aparna Garg</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Usha Janakiraman</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sangita Barua</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Nivedita Dubey became the first woman Director (HR) / Member (HR) on the </span><a href=\"https://aviationworld.in/nivedita-dubey-assumes-charge-as-first-woman-board-director-hr-of-aai/\" target=\"_blank\"><span style=\"text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">Airports Authority of India</span></a><span style=\"font-family:'Cambria Math'\"> (AAI) Board, assuming charge in January 2026. </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Background and Career Highlights</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Joined AAI:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Began her career in 1995 as an Airport Manager at Indira Gandhi International Airport.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Prior Role:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Served as the first woman Regional Executive Director (Eastern Region) starting in 2023.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Professional Credentials:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Accredited as an International Airport Professional (IAP) by the International Civil Aviation Organization (ICAO).</span></li></ul>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following statements about the 'Speaker of the Lok Sabha' is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. The Speaker's post falls vacant immediately upon the dissolution of the Lok Sabha.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. The Speaker can vote in the House only in the case of a tie (casting vote).</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the statements given above is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both I and II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither I nor II</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement II is correct, while Statement I is incorrect.</span><span style=\"font-family:'Cambria Math'\"> </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Statement I is incorrect</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">According to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Article 94</span><span style=\"font-family:'Cambria Math'\"> of the Constitution of India, whenever the </span><a href=\"https://testbook.com/question-answer/consider-the-following-statements-about-the-speake--5fba5a6e274e9e29cb549eca\" target=\"_blank\"><span style=\"text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">Lok Sabha</span></a><span style=\"font-family:'Cambria Math'\"> is dissolved, the Speaker </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">does not</span><span style=\"font-family:'Cambria Math'\"> vacate their office immediately. The Speaker remains in office until immediately before the first meeting of the newly elected House after the general elections to ensure administrative continuity. </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement II is correct</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Under </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Article 100(1)</span><span style=\"font-family:'Cambria Math'\"> of the Constitution, the Speaker does not vote in the first instance on any matter in the House. However, in the event of an equal division of votes (a tie), the Speaker exercises a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">casting vote</span><span style=\"font-family:'Cambria Math'\"> to break the deadlock. </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">(Exception: If a resolution for the removal of the Speaker is being considered under Article 96, they can vote in the first instance but cannot cast a deciding vote in a tie).</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which award is presented by the President of India for the highest gallantry displayed by armed forces personnel, even in peacetime?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ashoka Chakra</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Param Vir Chakra</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kirti Chakra</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Shaurya Chakra</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Ashoka Chakra</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation of the Options:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🟢</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ashoka Chakra</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: This is India's highest peacetime gallantry award. It is presented by the President of India to armed forces personnel, or even civilians, for the most conspicuous bravery, daring action, or self-sacrifice away from the battlefield.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🔴</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Param Vir Chakra</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: This is India's highest military decoration, but it is awarded specifically for wartime gallantry (acts of exceptional bravery in the presence of the enemy). </span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🔴</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kirti Chakra</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: This is the second-highest peacetime gallantry award, ranking just below the Ashoka Chakra. </span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🔴</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Shaurya Chakra</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: This is the third-highest peacetime gallantry award in India's order of precedence.</span></li></ul>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A concave mirror forms a real, inverted image that is twice the size of the object, with the object placed 15 cm from the mirror. What is the focal length of the mirror?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">10 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">15 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">20 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">7.5 cm</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Using magnification m = -v/u = -2 and u = -15 cm, we get </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">v = -30 cm</span><span style=\"font-family:'Cambria Math'\">. Applying the mirror formula 1/f = 1/v + 1/u = 1/(-30) + 1/(-15) = -3/30 = -1/10, giving </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">f = -10 cm</span><span style=\"font-family:'Cambria Math'\"> (focal length magnitude = 10 cm).</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 10 cm.</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">As per Census 2011, consider the following statements:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. Kerala recorded the highest literacy rate among Indian states.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. Bihar recorded the lowest literacy rate among Indian states.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">III. India's overall literacy rate crossed 80% for the first time.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">How many of the above statements are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only two</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">All three</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only one</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">None</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Only two</span><span style=\"font-family:'Cambria Math'\"> of the above statements are correct (Statements I and II).</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Here is the detailed breakdown of each statement based on the </span><a href=\"https://testbook.com/question-answer/according-to-the-census-of-india-2011-which-of-th--6a168da9e173a36d85103d97\" target=\"_blank\"><span style=\"text-decoration:underline;color:#0000ff;font-family:'Cambria Math'\">Census of India 2011</span></a><span style=\"font-family:'Cambria Math'\">:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">🟢</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Statement I: Correct</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Evidence</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Kerala recorded the highest overall literacy rate in the country at </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">94.00%</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Details</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: It maintained a high degree of gender parity with a male literacy rate of 96.11% and a female literacy rate of 92.07%. </span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">🟢</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Statement II: Correct</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Evidence</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Bihar recorded the lowest literacy rate among all Indian states at </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">61.80%</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Details</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Its male literacy stood at 71.2% and female literacy at 51.5%. </span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">🔴</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Statement III: Incorrect</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Evidence</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: India's overall literacy rate did not cross 80%. As per the official 2011 data, the national average literacy rate was </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">74.04%</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Details</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: While male literacy crossed the 80% mark (reaching 82.14%), female literacy lagged behind at 65.46%, keeping the combined national average below 80%.</span></li></ul>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Indian state has a coastline touching both the Arabian Sea and forms part of the Malabar Coast?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Tamil Nadu</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kerala</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Andhra Pradesh</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Odisha</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kerala</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option Analysis</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🌟</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kerala</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: This southwestern state directly borders the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Arabian Sea</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> and encompasses almost the entirety of the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Malabar Coast</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, a geographic region known for its unique network of brackish lagoons, estuaries, and backwaters.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Tamil Nadu</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: This state sits on the southeastern tip of India. Its coastline predominantly borders the Bay of Bengal and forms the Coromandel Coast, not the Malabar Coast.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Andhra Pradesh</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Located on the southeastern coast of India, its long shoreline lies entirely along the Bay of Bengal, making up a part of the Northern Circars.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Odisha</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Positioned in the eastern part of the subcontinent, its coastline opens exclusively to the Bay of Bengal.</span></li></ul>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following events is correctly matched with its year?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Formation of the Muslim League - 1906</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Partition of Bengal - 1911</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Jallianwala Bagh Massacre - 1920</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Simon Commission arrival in India - 1930</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correctly matched event is the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Formation of the Muslim League - 1906</span><span style=\"font-family:'Cambria Math'\">, while the other options have incorrect years (Partition of Bengal was in 1905, Jallianwala Bagh was in 1919, and the Simon Commission arrived in 1928). </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Event Details and Correct Years</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Formation of the Muslim League</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: December 30, 1906 (Correct)</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Partition of Bengal</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: July 1905 / October 1905 (Incorrectly listed as 1911)</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Jallianwala Bagh Massacre</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: April 13, 1919 (Incorrectly listed as 1920)</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Simon Commission arrival in India</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: February 3, 1928 (Incorrectly listed as 1930)</span></li></ul>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following powers is NOT available to the Rajya Sabha?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Participating in impeachment of the President</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Passing a No-Confidence Motion against the government</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ratifying a Constitutional Amendment Bill</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Electing the Vice President (as part of the Electoral College)</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct option is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Passing a No-Confidence Motion against the government</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Detailed Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Passing a No-Confidence Motion:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> This power is </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">NOT</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> available to the Rajya Sabha. Under </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 75(3)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> of the Indian Constitution, the Council of Ministers is collectively responsible </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">only to the Lok Sabha</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">. Therefore, a No-Confidence Motion can only be introduced and passed in the Lok Sabha. If it is passed there, the government falls.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Participating in Impeachment of the President:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> The Rajya Sabha </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">has</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> this power. As per </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 61</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, elected members of both the Lok Sabha and the Rajya Sabha participate in the impeachment process of the President.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ratifying a Constitutional Amendment Bill:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> The Rajya Sabha </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">has</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> this power. Under </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 368</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, a Constitutional Amendment Bill must be passed by both houses of Parliament (Lok Sabha and Rajya Sabha) separately by a special majority.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Electing the Vice President:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> The Rajya Sabha </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">has</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> this power. The Vice President is elected by an electoral college consisting of members of </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">both</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Houses of Parliament (Lok Sabha and Rajya Sabha) under </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 66</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following correctly lists the memory hierarchy from FASTEST to SLOWEST access speed?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Registers - Cache - RAM - Hard Disk</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">RAM - Cache - Registers - Hard Disk</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Hard Disk - RAM - Cache - Registers</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Cache - Registers - RAM - Hard Disk</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer option is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Registers - Cache - RAM - Hard Disk</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why this option is correct:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Registers</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: These are located directly inside the CPU. They operate at the same speed as the processor itself, providing the absolute </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">fastest</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> data access.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Cache</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Located very close to or on the CPU die. It uses high-speed Static RAM (SRAM) to temporarily hold frequently used data.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">RAM (Main Memory)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Located on the motherboard outside the CPU. It uses Dynamic RAM (DRAM), which makes it slower than cache memory but much faster than permanent storage.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Hard Disk</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: This is a secondary storage device. It relies on mechanical components or external interfaces, making it the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">slowest</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> layer in this sequence. </span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why the other options are incorrect:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">RAM - Cache - Registers - Hard Disk</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Incorrectly places RAM as faster than Cache and Registers.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Hard Disk - RAM - Cache - Registers</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: This completely reverses the hierarchy, listing the storage components from slowest to fastest.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Cache - Registers - RAM - Hard Disk</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Incorrectly claims that Cache is faster than CPU Registers.</span></li></ul>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following current affairs events occurred FIRST in chronological order?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Axiom Mission-4 (Ax-4) launch</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">17th BRICS Summit in Rio de Janeiro</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">25th SCO Summit in Tianjin</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Vijay Hazare Trophy 2025-26 final</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct option is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Axiom Mission-4 (Ax-4) launch</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Detailed Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Axiom Mission-4 (Ax-4) launch:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> This occurred </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">FIRST</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> among the given options, launching on </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">June 25, 2025</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">. </span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">25th SCO Summit in Tianjin:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> This took place from </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">August 31 to September 1, 2025</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">. </span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Vijay Hazare Trophy 2025-26 final:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> The tournament concluded with the final match on </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">January 18, 2026</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">. </span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">17th BRICS Summit in Rio de Janeiro:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> This was held in </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">July 2026</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Assertion (A): India's Mars Orbiter Mission (Mangalyaan) is regarded as a landmark achievement in space exploration.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Reason (R): It made India the first nation in the world to reach Mars orbit successfully in its very first attempt.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, but R is NOT the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is true, but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is false, but R is true</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Both Assertion (A) and Reason (R) are correct, and Reason (R) is the correct explanation of Assertion (A).</span><span style=\"font-family:'Cambria Math'\"> </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🟢</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Assertion (A) is correct</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: The Mars Orbiter Mission (Mangalyaan), launched by the Indian Space Research Organisation (ISRO), is universally celebrated as a historic milestone. It showcased groundbreaking technological capabilities and high cost-efficiency. </span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🟢</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Reason (R) is correct</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: India made history by becoming the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">first nation globally</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> to successfully guide a spacecraft into Martian orbit on its </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">very first attempt</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">. Previously, other global space programs required multiple attempts to achieve this feat. </span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🤝</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Correct Explanation</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: The main reason why Mangalyaan is viewed as a landmark global achievement in space exploration is precisely because India achieved success on its maiden try. This was a historic engineering feat that had never been accomplished by any other country before.</span></li></ul>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is the correct sequence of stages a Bill passes through to become an Act, after being passed by both Houses of Parliament?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Presidential assent - Publication in the Official Gazette</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Publication in the Official Gazette - Presidential assent</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Judicial review - Presidential assent</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Presidential assent - Judicial review</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer option is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Presidential assent - Publication in the Official Gazette</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation of the Correct Option</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Presidential assent - Publication in the Official Gazette</span><br><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Once a Bill has been passed by both Houses of Parliament (the Lok Sabha and the Rajya Sabha), it is sent to the President for approval. Under Article 111 of the Constitution, the Bill officially transforms into an </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Act</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> the moment the President grants their formal </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Presidential assent</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">. Following this approval, the Act is published in the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Official Gazette</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> of the government to legally notify the public of its enactment and the date of its commencement.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation of the Incorrect Options</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Publication in the Official Gazette - Presidential assent</span><br><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">This sequence is reversed. A Bill cannot be officially published as an active law in the Gazette until it has first received the formal signature and approval of the President.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Judicial review - Presidential assent</span><br><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Judicial review is not an automatic or mandatory legislative stage that a Bill must pass through to become an Act. The judiciary only reviews a law if its constitutional validity is formally challenged in court after it has already been enacted.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Presidential assent - Judicial review</span><br><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">While judicial review occurs after a Bill becomes law, it is not a part of the standard legislative sequence required for a Bill to transform into an Act. A law goes into effect immediately upon presidential assent and gazette notification, regardless of whether it ever undergoes judicial review. </span></li></ul>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements regarding UN agency headquarters:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. WHO and ILO are both headquartered in Geneva.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. UNESCO is headquartered in Paris, while UNICEF is headquartered in New York.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the statements given above is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both I and II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither I nor II</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both statements I and II are correct, meaning WHO, ILO, UNESCO, and UNICEF are located in their respective listed cities.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Headquarters Breakdown</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: WHO (World Health Organization) and ILO (International Labour Organization) are located in Geneva, Switzerland.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: UNESCO (United Nations Educational, Scientific and Cultural Organization) is located in Paris, France, and UNICEF (United Nations Children's Fund) is located in New York, United States.</span></li></ul>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Assertion (A): Sound cannot travel through a vacuum.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Reason (R): Sound is a longitudinal mechanical wave that requires a material medium (solid, liquid or gas) for its propagation.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, but R is NOT the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is true, but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is false, but R is true</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both Assertion (A) and Reason (R) are true, and Reason (R) is the correct explanation of Assertion (A).</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Both Are True</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">No particles in a vacuum</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Sound needs matter to move. A vacuum has no air or particles.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mechanical wave nature</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Sound moves by bumping particles into each other. Solids, liquids, and gases have these particles.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Correct link</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: Because a vacuum lacks particles to pass the vibrations, the reason correctly proves why the assertion is true. You can review a similar breakdown on Filo.</span></li></ul>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements about the Tropic of Cancer in India:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. It passes through exactly 8 states.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. Madhya Pradesh is the state with the longest stretch of the Tropic of Cancer within its boundary.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the statements given above is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither I nor II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both I and II</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Both statements I and II are correct.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement I is correct</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: The Tropic of Cancer passes through exactly </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">8 Indian states</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">. Running from west to east, these states are:</span><ol type=\"1\"><li style=\"margin-left:32.11pt;margin-bottom:10pt;line-height:115%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span>Gujarat</span></li><li style=\"margin-left:32.11pt;margin-bottom:10pt;line-height:115%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span>Rajasthan</span></li><li style=\"margin-left:32.11pt;margin-bottom:10pt;line-height:115%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span>Madhya Pradesh</span></li><li style=\"margin-left:32.11pt;margin-bottom:10pt;line-height:115%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span>Chhattisgarh</span></li><li style=\"margin-left:32.11pt;margin-bottom:10pt;line-height:115%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span>Jharkhand</span></li><li style=\"margin-left:32.11pt;margin-bottom:10pt;line-height:115%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span>West Bengal</span></li><li style=\"margin-left:32.11pt;margin-bottom:10pt;line-height:115%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span>Tripura</span></li><li style=\"margin-left:32.11pt;margin-bottom:10pt;line-height:115%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span>Mizoram </span></li></ol></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement II is correct</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Madhya Pradesh</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> has the maximum length (longest stretch) of the Tropic of Cancer passing through its boundary, spanning across 14 districts. Conversely, Rajasthan has the minimum length.</span></li></ul>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Assertion (A): The Indus Valley Civilisation is regarded as one of the world's earliest urban civilisations.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Reason (R): Its cities like Mohenjo-daro and Harappa featured planned grid layouts, covered drainage systems and standardised burnt-brick construction.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, but R is NOT the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is true, but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is false, but R is true</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Assertion (A) and Reason (R) are true, and Reason (R) is the correct explanation of Assertion (A)</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why this is correct:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Early Urban Status</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">: The civilization built large, advanced cities long before many other parts of the world.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12
