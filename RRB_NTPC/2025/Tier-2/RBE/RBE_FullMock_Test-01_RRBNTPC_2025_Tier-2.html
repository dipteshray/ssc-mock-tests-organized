margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1991 में स्थापित </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">वीमर त्रिकोण</span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">फ्रांस, जर्मनी और पोलैंड</span><span style=\"font-family:'Nirmala UI'\"> का एक त्रिपक्षीय समूह है, जिसका उद्देश्य एक एकजुट, सुरक्षित और लचीला यूरोप बनाना है। भारत ने 2025 में पहली बार इस प्रारूप में भाग लिया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह भारत की पारंपरिक द्विपक्षीय और बहुपक्षीय (G20, BRICS, SCO) संलग्नताओं से परे उसकी राजनयिक पहुंच का एक उल्लेखनीय विस्तार है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर फ्रांस, जर्मनी, पोलैंड है।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के 2025-26 के व्यापार/रेल समझौतों और उनके उद्देश्य के निम्नलिखित युग्मों में से कौन सा सही ढंग से सुमेलित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत-EFTA TEPA - स्विट्जरलैंड, नॉर्वे, आइसलैंड और लिकटेंस्टीन के साथ व्यापार साझेदारी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत-भूटान रेल परियोजनाएं - दिल्ली को सीधे रेल द्वारा थिम्पू से जोड़ना</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत-EFTA TEPA - यूरोपीय देशों के साथ एक रक्षा सहयोग समझौता</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत-भूटान रेल परियोजनाएं - पूरी तरह से पर्यटन संवर्धन के लिए, व्यापार से असंबंधित</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2025 में प्रभावी हुआ </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारत-EFTA TEPA</span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">यूरोपीय मुक्त व्यापार संघ</span><span style=\"font-family:'Nirmala UI'\"> - जिसमें </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्विट्जरलैंड, नॉर्वे, आइसलैंड और लिकटेंस्टीन</span><span style=\"font-family:'Nirmala UI'\"> शामिल हैं - के साथ एक व्यापार साझेदारी है; यह एक व्यापार समझौता है, न कि रक्षा समझौता। भारत-भूटान रेल परियोजनाओं (कोकराझार-गेलेफू और बनारहाट-सामत्से, ₹4,033 करोड़ की लागत से) का उद्देश्य </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">द्विपक्षीय व्यापार को बढ़ावा देना और भारतीय बंदरगाहों तक भूटान की पहुंच में सुधार करना</span><span style=\"font-family:'Nirmala UI'\"> है, न कि दिल्ली को सीधे थिम्पू से जोड़ना या केवल पर्यटन को बढ़ावा देना।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आंशिक परिचितता के आधार पर अनुमान लगाने के बजाय, समझौतों के नामों को ध्यान से पढ़ना समसामयिक मामलों के प्रश्नों में ऐसी विसंगतियों से बचने के लिए आवश्यक है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'भारत-EFTA TEPA - स्विट्जरलैंड, नॉर्वे, आइसलैंड और लिकटेंस्टीन के साथ व्यापार साझेदारी' है।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किस मंदिर के गर्भगृह में चतुर्मुख (चार मुखों वाली) विष्णु प्रतिमा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लक्ष्मण मंदिर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दशावतार मंदिर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बृहदेश्वर मंदिर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मीनाक्षी मंदिर</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लक्ष्मण मंदिर (खजुराहो, मध्य प्रदेश)</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">चंदेल राजा यशोवर्मन</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> (930-950 ई.) द्वारा निर्मित।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">वैकुंठ विष्णु</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> को समर्पित।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">गर्भगृह में एक </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">चतुर्मुख</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विष्णु प्रतिमा</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> है:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">मानव मुख (केंद्र में)।</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">नरसिंह (शेर) मुख।</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">वराह (सूअर) मुख।</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">कपिल (चौथा मुख, पीछे की ओर)।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">यह एक </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पंचायतन</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">योजना</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> (मुख्य मंदिर + 4 सहायक मंदिर) के साथ </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">नागर शैली वास्तुकला</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> का अनुसरण करता है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">जटिल नक्काशी और कामुक मूर्तियों</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> के लिए जाना जाता है, जो चंदेल कला की पहचान है।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प (गलत):</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">दशावतार</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मंदिर (देवगढ़, यूपी):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> गुप्त काल का विष्णु मंदिर, शेषशायी विष्णु भित्तिचित्र के लिए प्रसिद्ध है, लेकिन चतुर्मुख प्रतिमा नहीं है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बृहदेश्वर</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मंदिर (तंजावुर, टीएन):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> चोल वंश, शिव को समर्पित।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मीनाक्षी मंदिर (मदुरै, टीएन):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> द्रविड़ शैली, मीनाक्षी को समर्पित</span></li></ul>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ई-मेल एड्रेस (India@solu.edu) में, India क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पासवर्ड</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डोमेन नाम</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यूजर नेम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सर्वर नाम</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक ईमेल एड्रेस के दो भाग होते हैं:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लोकल पार्ट (@ से पहले)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">यूजर नेम</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> या मेलबॉक्स की पहचान करता है।</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">डोमेन पार्ट (@ के बाद)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मेल सर्वर/डोमेन</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> (जैसे, solu.edu) की पहचान करता है।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">(India@solu.edu) में:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">India</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> यूजर नेम।</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">solu.edu</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> डोमेन नाम।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अन्य विकल्प:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पासवर्ड</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> ईमेल एड्रेस का हिस्सा नहीं है।</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सर्वर नाम</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> डोमेन/सर्वर को संदर्भित करता है, लोकल पार्ट को नहीं।</span></li></ul>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक छात्र देखता है कि घोल X नीले लिटमस पेपर को लाल कर देता है, जबकि घोल Y लाल लिटमस पेपर को नीला कर देता है। निम्नलिखित में से कौन घोल X और Y की सही पहचान करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">X - क्षार, Y - अम्ल</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">X - अम्ल, Y - क्षार</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">X - उदासीन, Y - अम्ल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">X - क्षार, Y - उदासीन</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अम्ल नीले लिटमस को लाल कर देते हैं</span><span style=\"font-family:'Nirmala UI'\">, जबकि </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">क्षार लाल लिटमस को नीला कर देते हैं</span><span style=\"font-family:'Nirmala UI'\"> - इसलिए घोल X (नीले लिटमस को लाल कर देता है) एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अम्ल</span><span style=\"font-family:'Nirmala UI'\"> है, और घोल Y (लाल लिटमस को नीला कर देता है) एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">क्षार</span><span style=\"font-family:'Nirmala UI'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह लिटमस परीक्षण इसलिए काम करता है क्योंकि लिटमस डाई आसपास के घोल के pH के आधार पर रंग बदलता है - अम्लीय परिस्थितियों में लाल (pH 7 से कम) और क्षारीय/बेसिक परिस्थितियों में नीला (pH 7 से अधिक)। शुद्ध पानी जैसे उदासीन घोल किसी भी लिटमस पेपर का रंग नहीं बदलते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'X - अम्ल, Y - क्षार' है।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">व्यतिकरण और विवर्तन में प्रकाश ऊर्जा का क्या होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह घटती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह बढ़ती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसका पुनर्वितरण होता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह कम हो जाता है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्यतिकरण और विवर्तन</span><span style=\"font-family:'Nirmala UI'\"> में, प्रकाश की </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कुल ऊर्जा स्थिर रहती है</span><span style=\"font-family:'Nirmala UI'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऊर्जा </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">न तो नष्ट होती है और न ही उत्पन्न होती है</span><span style=\"font-family:'Nirmala UI'\">, बल्कि </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पुनर्वितरित होती है</span><span style=\"font-family:'Nirmala UI'\">:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">दीप्त फ्रिंज</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> संपोषी व्यतिकरण के क्षेत्र (उच्च तीव्रता)।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अदीप्त फ्रिंज</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> विनाशी व्यतिकरण के क्षेत्र (निम्न तीव्रता)।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह पुनर्वितरण यंग के द्वि-झिरी प्रयोग जैसे प्रयोगों में देखा जाने वाला </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">फ्रिंज पैटर्न</span><span style=\"font-family:'Nirmala UI'\"> बनाता है।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यदि कोई किसान चावल के बजाय गेहूं उगाने के लिए अपनी भूमि का उपयोग करता है, तो छोड़ा गया चावल किस आर्थिक अवधारणा को दर्शाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सीमांत लागत</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अवसर लागत</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्थिर लागत</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लेखा लागत</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अवसर लागत</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> जब कोई विकल्प चुना जाता है तो </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">छोड़े गए अगले सर्वोत्तम विकल्प का मूल्य</span><span style=\"font-family:'Nirmala UI'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यहाँ, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गेहूं</span><span style=\"font-family:'Nirmala UI'\"> चुनना </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">चावल उत्पादन</span><span style=\"font-family:'Nirmala UI'\"> का त्याग करना है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह अर्थशास्त्र में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अदला-बदली (trade-off) सिद्धांत</span><span style=\"font-family:'Nirmala UI'\"> को दर्शाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सीमांत लागत</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> एक अतिरिक्त इकाई के उत्पादन की लागत।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">स्थिर लागत</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> वे लागतें जो उत्पादन के साथ नहीं बदलतीं (जैसे, किराया)।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लेखा लागत</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> खातों में दर्ज वास्तविक मौद्रिक व्यय।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अवसर लागत</span><span style=\"font-family:'Nirmala UI'\"> एक विकल्प चुनने पर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">छोड़े गए अगले सर्वोत्तम विकल्प का मूल्य</span><span style=\"font-family:'Nirmala UI'\"> है - उदाहरण के लिए, किसी व्यवसाय में पैसा निवेश करने का अर्थ है उस ब्याज का त्याग करना जो वह पैसा बैंक में अर्जित कर सकता था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह मूलभूत आर्थिक अवधारणा सभी निर्णय लेने की प्रक्रिया का आधार है, क्योंकि संसाधन (समय, पैसा, श्रम) सीमित (दुर्लभ) होते हैं और एक समय में केवल एक ही तरीके से उपयोग किए जा सकते हैं।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन 'योग्यता वस्तु' (Merit Good) का एक उदाहरण है, जिसका बाजार शक्तियों पर पूरी तरह से छोड़ दिए जाने पर आमतौर पर कम उपभोग होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लग्जरी कारें</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">शिक्षा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हीरे</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ब्रांडेड कपड़े</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">योग्यता वस्तुएं (Merit goods)</span><span style=\"font-family:'Nirmala UI'\">, जैसे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">शिक्षा</span><span style=\"font-family:'Nirmala UI'\"> और स्वास्थ्य सेवा, व्यक्तिगत उपभोक्ता से परे व्यापक सामाजिक लाभ प्रदान करती हैं, लेकिन यदि विशुद्ध रूप से बाजार शक्तियों पर छोड़ दिया जाए तो इनका </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कम उपभोग</span><span style=\"font-family:'Nirmala UI'\"> होता है, क्योंकि लोग दीर्घकालिक लाभों को कम आंक सकते हैं - जिससे सरकारी हस्तक्षेप या सब्सिडी उचित हो जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह 'सार्वजनिक वस्तुओं' (जैसे राष्ट्रीय रक्षा) से भिन्न है, जो गैर-बहिष्करणीय (non-excludable) और गैर-प्रतिस्पर्धी (non-rivalrous) होती हैं। योग्यता वस्तुएं निजी तौर पर प्रदान की जा सकती हैं लेकिन उन्हें प्रोत्साहित करने के लिए सामाजिक रूप से वांछनीय माना जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर शिक्षा है।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जनगणना 2011 के आधार पर निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. केरल ने राज्यों में भारत का उच्चतम लिंगानुपात दर्ज किया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. समग्र बाल लिंगानुपात (0-6 वर्ष) जनगणना 2001 की तुलना में बेहतर हुआ।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I और II दोनों</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो I, न ही II</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन I सही है</span><span style=\"font-family:'Nirmala UI'\"> - केरल ने जनगणना 2011 में भारत का उच्चतम लिंगानुपात (1,000 पुरुषों पर 1,084 महिलाएं) दर्ज किया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन II गलत है</span><span style=\"font-family:'Nirmala UI'\"> - </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बाल लिंगानुपात (0-6 वर्ष) वास्तव में घट गया</span><span style=\"font-family:'Nirmala UI'\">, जो 927 (2001) से 919 (2011) हो गया, यह एक गंभीर जनसांख्यिकीय चिंता का विषय है जो समग्र लिंगानुपात में सुधार के बावजूद लगातार लिंग-चयनात्मक प्रथाओं को दर्शाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह विचलन - एक ही दशक में समग्र लिंगानुपात में सुधार जबकि बाल लिंगानुपात का बिगड़ना - जनगणना-आधारित प्रश्नों में अक्सर परखा जाने वाला एक महत्वपूर्ण सूक्ष्म अंतर है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'केवल I' है।</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित पर्वतीय दर्रों का उन राज्यों/केंद्र शासित प्रदेशों से मिलान करें जहाँ वे स्थित हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A. नाथू ला - 1. सिक्किम</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">B. ज़ोजी ला - 2. लद्दाख</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">C. रोहतांग दर्रा - 3. हिमाचल प्रदेश</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">D. पालक्काड गैप - 4. केरल</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन-सा संयोजन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-2, B-1, C-4, D-3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-1, B-3, C-2, D-4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-1, B-2, C-3, D-4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-3, B-4, C-1, D-2</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नाथू ला</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सिक्किम</span><span style=\"font-family:'Nirmala UI'\"> में है (एक भारत-चीन सीमा व्यापार मार्ग); </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ज़ोजी ला</span><span style=\"font-family:'Nirmala UI'\"> श्रीनगर को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लद्दाख</span><span style=\"font-family:'Nirmala UI'\"> से जोड़ता है; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रोहतांग दर्रा</span><span style=\"font-family:'Nirmala UI'\"> मनाली-लेह राजमार्ग पर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हिमाचल प्रदेश</span><span style=\"font-family:'Nirmala UI'\"> में है; और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पालक्काड गैप</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">केरल</span><span style=\"font-family:'Nirmala UI'\"> में एक प्राकृतिक गलियारा है, जो पश्चिमी घाट की निरंतरता को तोड़ता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इन दर्रा-राज्य संबंधों को जानने से हिमालयी कनेक्टिविटी और पश्चिमी घाट के प्राकृतिक अंतरालों के बारे में भूगोल के कई सवालों के जवाब देने में मदद मिलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही संयोजन A-1, B-2, C-3, D-4 है।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक राज्य का राज्यपाल राज्य विधानमंडल द्वारा पारित एक विधेयक को राष्ट्रपति के विचार के लिए आरक्षित रखता है। निम्नलिखित में से कौन-सा ऐसे मामले में राष्ट्रपति के विकल्पों का सही वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राष्ट्रपति को 6 महीने के भीतर सहमति देनी होगी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राष्ट्रपति केवल सहमति दे सकते हैं, उसे रोक नहीं सकते</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राष्ट्रपति के निर्णय को किसी भी आधार पर सर्वोच्च न्यायालय में चुनौती दी जा सकती है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राष्ट्रपति विधेयक को सहमति दे सकते हैं, सहमति रोक सकते हैं, या (यदि यह धन विधेयक नहीं है) पुनर्विचार के लिए वापस कर सकते हैं</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जब राज्यपाल किसी राज्य विधेयक को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राष्ट्रपति के विचारार्थ</span><span style=\"font-family:'Nirmala UI'\"> (अनुच्छेद 200) आरक्षित करते हैं, तो </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राष्ट्रपति</span><span style=\"font-family:'Nirmala UI'\"> (अनुच्छेद 201) उसे: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सहमति दे सकते हैं</span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सहमति रोक सकते हैं</span><span style=\"font-family:'Nirmala UI'\">, या (यदि यह धन विधेयक नहीं है) </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राज्य विधानमंडल को पुनर्विचार के लिए वापस कर सकते हैं</span><span style=\"font-family:'Nirmala UI'\">। उस छह महीने की समय-सीमा के विपरीत जो राज्यपाल द्वारा वापस किए गए विधेयक पर पुनर्विचार करने पर लागू होती है, अनुच्छेद 201 के तहत राष्ट्रपति के निर्णय पर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कोई निश्चित समय सीमा</span><span style=\"font-family:'Nirmala UI'\"> बाध्यकारी नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">समय-सीमा के इस अभाव के कारण कभी-कभी विधेयक लंबे समय तक लंबित रहते हैं, और हाल ही में यह न्यायिक जांच का विषय रहा है कि क्या अनुचित देरी पर सवाल उठाया जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'राष्ट्रपति विधेयक को सहमति दे सकते हैं, सहमति रोक सकते हैं, या (यदि यह धन विधेयक नहीं है) पुनर्विचार के लिए वापस कर सकते हैं'।</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के अधिकांश हिस्सों में मुख्य रूप से जून-सितंबर के दौरान वर्षा होती है, इसके विपरीत एक क्षेत्र ऐसा है जिसे अपनी वार्षिक वर्षा का अधिकांश भाग अक्टूबर और दिसंबर के बीच प्राप्त होता है। निम्नलिखित में से कौन सा क्षेत्र इस विवरण से मेल खाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पंजाब</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गुजरात</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राजस्थान</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तमिलनाडु</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">तमिलनाडु</span><span style=\"font-family:'Nirmala UI'\"> (और कोरोमंडल तट) अद्वितीय है क्योंकि यह दक्षिण-पश्चिम मानसून (जून-सितंबर) के दौरान पश्चिमी घाट के 'वृष्टि छाया' क्षेत्र में स्थित है, जिससे तब बहुत कम वर्षा होती है। इसके बजाय, इसे अपनी अधिकांश वर्षा </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर-पूर्वी (लौटते हुए) मानसून</span><span style=\"font-family:'Nirmala UI'\"> से, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अक्टूबर और दिसंबर</span><span style=\"font-family:'Nirmala UI'\"> के बीच, मिलती है, जब नमी से लदी हवाएँ बंगाल की खाड़ी को पार करती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह बताता है कि क्यों तमिलनाडु का कृषि कैलेंडर और जलाशय भरने का पैटर्न उत्तरी और मध्य भारत के अधिकांश हिस्सों से काफी भिन्न है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर तमिलनाडु (कोरोमंडल तट) है।</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">'नीलगिरि बायोस्फीयर रिजर्व', भारत का पहला बायोस्फीयर रिजर्व, किस वर्ष स्थापित किया गया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1990</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1982</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1994</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1986</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नीलगिरि बायोस्फीयर रिजर्व</span><span style=\"font-family:'Nirmala UI'\">, जो तमिलनाडु, केरल और कर्नाटक के कुछ हिस्सों में फैला हुआ है, यूनेस्को के मैन एंड बायोस्फीयर कार्यक्रम के तहत भारत के पहले बायोस्फीयर रिजर्व के रूप में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1986</span><span style=\"font-family:'Nirmala UI'\"> में स्थापित किया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बायोस्फीयर रिजर्व राष्ट्रीय उद्यानों/वन्यजीव अभयारण्यों से इस मायने में भिन्न होते हैं कि वे मुख्य पारिस्थितिक क्षेत्रों का संरक्षण करते हुए बफर ज़ोन के भीतर टिकाऊ मानव गतिविधियों की अनुमति देते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 1986 है।</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित भारतीय राज्यों को उनके गठन के कालानुक्रमिक क्रम में व्यवस्थित करें, सबसे पहले से सबसे नवीनतम तक: हरियाणा, सिक्किम, गुजरात, आंध्र प्रदेश।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गुजरात - हरियाणा - आंध्र प्रदेश - सिक्किम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सिक्किम - हरियाणा - गुजरात - आंध्र प्रदेश</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आंध्र प्रदेश - गुजरात - हरियाणा - सिक्किम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हरियाणा - आंध्र प्रदेश - सिक्किम - गुजरात</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सही कालानुक्रमिक क्रम है: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आंध्र प्रदेश (1953)</span><span style=\"font-family:'Nirmala UI'\"> - भाषाई आधार पर गठित पहला राज्य; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गुजरात (1960)</span><span style=\"font-family:'Nirmala UI'\"> - बंबई राज्य के द्विभाजन द्वारा गठित; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हरियाणा (1966)</span><span style=\"font-family:'Nirmala UI'\"> - पंजाब से अलग होकर बना; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सिक्किम (1975)</span><span style=\"font-family:'Nirmala UI'\"> - 36वें संशोधन के माध्यम से भारत का 22वां राज्य बना।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राज्यों के गठन का क्रम जानने से राज्य पुनर्गठन प्रक्रिया से संबंधित राजव्यवस्था और इतिहास के प्रश्नों को हल करने में मदद मिलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही क्रम आंध्र प्रदेश - गुजरात - हरियाणा - सिक्किम है।</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जनगणना 2011 के अनुसार, किस भारतीय राज्य में निरपेक्ष संख्या के आधार पर सबसे बड़ी जनजातीय (अनुसूचित जनजाति) आबादी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मध्य प्रदेश</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">छत्तीसगढ़</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ओडिशा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">झारखंड</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जनगणना 2011 के अनुसार, भारतीय राज्यों में निरपेक्ष संख्या के आधार पर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मध्य प्रदेश</span><span style=\"font-family:'Nirmala UI'\"> में सबसे बड़ी जनजातीय आबादी है, हालांकि मिजोरम और लक्षद्वीप जैसे राज्यों में उनकी कुल आबादी के *प्रतिशत* के रूप में जनजातीय आबादी अधिक है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">'निरपेक्ष संख्या' और 'प्रतिशत हिस्सेदारी' के बीच यह अंतर जनगणना-आधारित प्रश्नों में एक सामान्य गलती का कारण है - हमेशा ध्यान से पढ़ें कि कौन सा मापदंड पूछा गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर मध्य प्रदेश है।</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित प्राचीन ग्रंथों का उनके विषय वस्तु से मिलान करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A. अर्थशास्त्र - 1. राजव्यवस्था और अर्थशास्त्र</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">B. नाट्यशास्त्र - 2. नृत्य, नाटक और संगीत</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">C. सुश्रुत संहिता - 3. शल्य चिकित्सा और औषधि</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">D. ऋग्वेद - 4. देवताओं को स्तुतिगान</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा संयोजन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-2, B-1, C-4, D-3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-3, B-4, C-1, D-2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-4, B-3, C-2, D-1</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-1, B-2, C-3, D-4</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अर्थशास्त्र</span><span style=\"font-family:'Nirmala UI'\"> (कौटिल्य) राज्य-प्रशासन और अर्थशास्त्र से संबंधित है; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नाट्यशास्त्र</span><span style=\"font-family:'Nirmala UI'\"> (भरत) नृत्य, नाटक और संगीत से संबंधित है; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सुश्रुत संहिता</span><span style=\"font-family:'Nirmala UI'\"> प्राचीन शल्य चिकित्सा और औषधि से संबंधित है; और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ऋग्वेद</span><span style=\"font-family:'Nirmala UI'\"> में मुख्य रूप से देवताओं को समर्पित सूक्त हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ये चार ग्रंथ प्राचीन भारतीय ज्ञान की विशिष्ट शाखाओं - क्रमशः राजनीति विज्ञान, प्रदर्शन कला, चिकित्सा विज्ञान और धार्मिक साहित्य का प्रतिनिधित्व करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही संयोजन A-1, B-2, C-3, D-4 है।</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नागरिकता अधिनियम, 1955 के तहत, जब कोई नया क्षेत्र भारत का हिस्सा बन जाता है, तो नागरिकता प्रदान करने को कौन-सी धारा नियंत्रित करती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">धारा 5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">धारा 9</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">धारा 7</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">धारा 6</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सही उत्तर है: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">धारा 7</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">📘</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> विस्तृत व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">प्रासंगिक धारा:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">धारा 7 – क्षेत्र के समामेलन द्वारा नागरिकता</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">संदर्भ:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">जब कोई नया क्षेत्र भारत में विलीन या समामेलित होता है (उदाहरण के लिए, 1961 में गोवा, 1975 में सिक्किम), तो उस क्षेत्र के निवासियों को भारतीय नागरिकता प्रदान की जाती है।</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">केंद्र सरकार उन शर्तों, प्रतिबंधों या अपवादों को निर्दिष्ट करती है जिनके तहत नागरिकता प्रदान की जाती है।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मुख्य बिंदु:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">ऐसे मामलों में पंजीकरण या देशीयकरण के माध्यम से नागरिकता </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">व्यक्तिगत रूप से प्राप्त नहीं</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> की जाती है।</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">इसके बजाय, यह नए जोड़े गए क्षेत्र में अधिवासित सभी व्यक्तियों को नागरिकता का एक </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सामूहिक अनुदान</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> है।</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">🔑</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> अन्य विवरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">धारा 3-6</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> जन्म, वंश, पंजीकरण, देशीयकरण।</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">धारा 6A &amp; 6B</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> विशेष प्रावधान (असम समझौता, आदि)।</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">धारा 7</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> क्षेत्र के समामेलन द्वारा नागरिकता।</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उदाहरण:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">गोवा, दमन और दीव (1961)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> धारा 7 के तहत निवासी भारतीय नागरिक बन गए।</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सिक्किम (1975)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> भारत में समामेलित; निवासियों को नागरिकता प्रदान की गई।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कौन-सा शासक नालंदा विश्वविद्यालय के अपने महत्वपूर्ण संरक्षण के लिए जाना जाता है, जिसकी यात्रा चीनी तीर्थयात्री ह्वेन त्सांग ने उसके शासनकाल के दौरान की थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अशोक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हर्षवर्धन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चंद्रगुप्त द्वितीय</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कनिष्क</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कन्नौज का 7वीं सदी का शासक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हर्षवर्धन</span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नालंदा विश्वविद्यालय</span><span style=\"font-family:'Nirmala UI'\"> का एक प्रमुख संरक्षक था, जिसने इसकी सुविधाओं का महत्वपूर्ण विस्तार किया; इसका अच्छी तरह से दस्तावेजीकरण चीनी तीर्थयात्री </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ह्वेन त्सांग</span><span style=\"font-family:'Nirmala UI'\"> द्वारा किया गया है, जिसने हर्ष के शासनकाल के दौरान वहाँ अध्ययन किया था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हर्ष ने स्वयं कई संस्कृत नाटकों की रचना की थी, जिनमें रत्नावली और प्रियदर्शिका शामिल हैं, जो साहित्य और विद्या में उनकी व्यक्तिगत रुचि को दर्शाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर हर्षवर्धन है।</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वर्नाक्युलर प्रेस अधिनियम, 1878 के बारे में निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. इसे लॉर्ड रिपन द्वारा पेश किया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. इसने केवल अंग्रेजी भाषा के समाचार पत्रों पर प्रतिबंध लगाए।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऊपर दिए गए कथनों में से कौन सा/से सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I और II दोनों</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो I और न ही II</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दोनों कथन गलत हैं।</span><span style=\"font-family:'Nirmala UI'\"> वर्नाक्युलर प्रेस अधिनियम </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लॉर्ड लिटन</span><span style=\"font-family:'Nirmala UI'\"> द्वारा पेश किया गया था, न कि लॉर्ड रिपन द्वारा (जिन्होंने वास्तव में इसे 1881 में निरस्त कर दिया था)। इसने </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्थानीय भाषा (भारतीय भाषा के) समाचार पत्रों</span><span style=\"font-family:'Nirmala UI'\"> को प्रतिबंधित किया था, न कि अंग्रेजी भाषा के समाचार पत्रों को, जो काफी हद तक इसके प्रावधानों से बचे रहे - यह एक मुख्य कारण था कि इस अधिनियम को भेदभावपूर्ण माना गया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इस अधिनियम को अक्सर प्रेस से संबंधित अन्य उपायों के साथ भ्रमित किया जाता है; 'लिटन ने इसे लागू किया, रिपन ने इसे निरस्त किया' याद रखने से दोनों वायसरॉय को मिलाने से बचने में मदद मिलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'न तो I और न ही II' है।</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित 2025-26 की घटनाओं का उनके मेजबान स्थान से मिलान करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A. ग्लोबल एनर्जी लीडर्स समिट (GELS) 2025 - 1. पुरी, ओडिशा</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">B. दूसरा वैश्विक बौद्ध शिखर सम्मेलन - 2. नई दिल्ली</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">C. 7वां भारत अंतर्राष्ट्रीय सीवीड एक्सपो &amp; शिखर सम्मेलन 2026 - 3. कोच्चि</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">D. मध्य प्रदेश क्षेत्रीय AI प्रभाव सम्मेलन 2026 - 4. भोपाल</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा संयोजन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-2, B-1, C-4, D-3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-4, B-3, C-2, D-1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-1, B-2, C-3, D-4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-3, B-4, C-1, D-2</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">GELS 2025</span><span style=\"font-family:'Nirmala UI'\"> (ऊर्जा पर्याप्तता और स्थिरता पर भारत का पहला समर्पित शिखर सम्मेलन) </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पुरी, ओडिशा</span><span style=\"font-family:'Nirmala UI'\"> में आयोजित किया गया था; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दूसरा वैश्विक बौद्ध शिखर सम्मेलन नई दिल्ली</span><span style=\"font-family:'Nirmala UI'\"> में आयोजित किया गया था; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">7वां भारत अंतर्राष्ट्रीय सीवीड एक्सपो &amp; शिखर सम्मेलन कोच्चि</span><span style=\"font-family:'Nirmala UI'\"> के लिए निर्धारित है; और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मध्य प्रदेश क्षेत्रीय AI प्रभाव सम्मेलन 2026 भोपाल</span><span style=\"font-family:'Nirmala UI'\"> में आयोजित किया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रमुख शिखर सम्मेलनों और सम्मेलनों के मेजबान शहरों को ट्रैक करना एक अक्सर पूछा जाने वाला समसामयिक ज्ञान कौशल है, खासकर भारत की वैश्विक मंचों में बढ़ती भूमिका से जुड़ी घटनाओं के लिए।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही संयोजन A-1, B-2, C-3, D-4 है।</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय राष्ट्रीय कांग्रेस के अध्यक्ष पद से इस्तीफा देने के बाद, 1939 में 'फॉरवर्ड ब्लॉक' की स्थापना किसने की थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सुभाष चंद्र बोस</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जवाहरलाल नेहरू</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सरदार पटेल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राजेंद्र प्रसाद</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गांधी और कांग्रेस आलाकमान के साथ स्वतंत्रता प्राप्त करने के दृष्टिकोण को लेकर वैचारिक मतभेदों के कारण कांग्रेस अध्यक्ष पद से इस्तीफा देने के बाद 1939 में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सुभाष चंद्र बोस</span><span style=\"font-family:'Nirmala UI'\"> ने </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">फॉरवर्ड ब्लॉक</span><span style=\"font-family:'Nirmala UI'\"> की स्थापना की थी।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बोस ने पहले दो बार कांग्रेस अध्यक्ष पद जीता था (हरिपुरा 1938, त्रिपुरी 1939), 1939 में गांधी के पसंदीदा उम्मीदवार को हराया था, लेकिन आंतरिक विरोध का सामना करने के बाद इस्तीफा दे दिया था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर सुभाष चंद्र बोस है।</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पंडित जवाहरलाल नेहरू ने निम्नलिखित में से किसे “आधुनिक भारत के मंदिर” के रूप में वर्णित किया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संसद</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विद्यालय</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अस्पताल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बांध</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नेहरू ने </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बड़े बांधों और सिंचाई परियोजनाओं</span><span style=\"font-family:'Nirmala UI'\"> को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“आधुनिक भारत के मंदिर”</span><span style=\"font-family:'Nirmala UI'\"> कहा था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संदर्भ: स्वतंत्रता के बाद भारत को तीव्र औद्योगीकरण और कृषि विकास की आवश्यकता थी।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बांधों ने प्रतीक किया:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">आर्थिक प्रगति</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> (बिजली, सिंचाई, बाढ़ नियंत्रण)।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">खाद्य उत्पादन में </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">आत्मनिर्भरता</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line- pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सत्य हैं, और R, A का सही स्पष्टीकरण है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सत्य हैं, किंतु R, A का सही स्पष्टीकरण नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A सत्य है, किंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A असत्य है, किंतु R सत्य है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दोनों कथन तथ्यात्मक रूप से सत्य हैं</span><span style=\"font-family:'Nirmala UI'\">: राज्य के नीति निदेशक तत्व वास्तव में अप्रवर्तनीय हैं (अनुच्छेद 37 कहता है कि वे 'किसी भी न्यायालय द्वारा प्रवर्तनीय नहीं होंगे'), और भारत का संविधान वास्तव में विश्व का सबसे लंबा लिखित संविधान है। हालांकि, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">R का A से कोई तार्किक संबंध नहीं है</span><span style=\"font-family:'Nirmala UI'\"> - संविधान की लंबाई का इस बात से कोई लेना-देना नहीं है कि नीति निदेशक तत्व अप्रवर्तनीय क्यों हैं, यह केवल एक जानबूझकर किया गया संवैधानिक डिज़ाइन विकल्प है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह एक सामान्य अभिकथन-कारण जाल है: दोनों कथनों का स्वतंत्र रूप से सत्य होना यह नहीं दर्शाता कि एक दूसरे की व्याख्या करता है - हमेशा एक वास्तविक कारण या तार्किक संबंध की जाँच करें।</span></p><p style=\"margin-t
