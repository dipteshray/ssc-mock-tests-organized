bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which website optimization technique most directly improves page loading speed for users and search engines?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Adding additional advertisements throughout the website to increase user engagement and visibility online.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Using a longer and more complex domain name to strengthen website identity and recognition overall.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Increasing the number of external hyperlinks included across different pages of the website.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Compressing images and other files to reduce the amount of data transferred during page loading.</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The website optimization technique that most directly improves </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">page loading speed</span><span style=\"font-family:'Cambria Math'\"> is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">compressing images and other files to reduce the amount of data transferred during page loading.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option A: Adding advertisements</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Ads increase page weight and external requests, which usually </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">slow down loading speed</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option B: Longer, complex domain name</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Domain name length has </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">no impact</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> on loading speed.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option C: Increasing external hyperlinks</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Hyperlinks themselves don’t improve speed; too many external links can even slow performance if they load external resources.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option D: Compressing images and files</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct. Large image and file sizes are a major cause of slow websites.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Compression reduces file size without significant loss of quality, lowering the amount of data transferred.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Techniques: </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">JPEG/PNG compression, WebP format, minifying CSS/JS, enabling GZIP/Brotli compression</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Directly improves </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">user experience and SEO ranking</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> since search engines prioritize fast-loading sites.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Indian city was identified as the 'dirtiest city' in the Swachh Survekshan 2025, conducted by the Ministry of Housing and Urban Affairs?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Patna</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">New Delhi</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kolkata</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Madurai</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Madurai (Tamil Nadu) was officially ranked as the </span><span style=\"font-weight:bold;font-style:italic;font-family:'Cambria Math'\">dirtiest city in India</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> in the Swachh Survekshan 2025 survey conducted by the Ministry of Housing and Urban Affairs.</span><span style=\"font-family:'Cambria Math'\"> It scored the lowest among cities with a population above 10 lakhs, highlighting major issues in waste management and sanitation.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Findings from Swachh Survekshan 2025</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Dirtiest City (Population &gt;10 lakh): Madurai, Tamil Nadu</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Score:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> 4,823 out of 12,500</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Weaknesses: Poor waste processing (only 4%), low cleanliness of public toilets (3%), weak source segregation (26%).</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Strengths: Some improvement in residential zones and water bodies, but not enough to offset sanitation failures.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Other Poor Performers:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ludhiana (Punjab)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> – 5,272 points</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Chennai (Tamil Nadu)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> – 6,822 points</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ranchi (Jharkhand)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> – 6,835 points</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bengaluru (Karnataka)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> – 5,642 points</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Delhi</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> also ranked poorly, placing </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">10th among the dirtiest cities</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, showing sanitation challenges even in the national capital.</span></li></ul>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A website suddenly receives an enormous volume of malicious requests from many compromised systems, causing legitimate users to lose access. Which type of cyberattack does this scenario describe?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A Distributed Denial of Service (DDoS) attack that overwhelms servers with excessive network traffic.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">An SQL injection attack that manipulates database queries through malicious user input fields.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A man-in-the-middle attack that secretly intercepts communication between two connected parties online.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A phishing attack that deceives users into revealing confidential credentials through fraudulent messages.</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The scenario described — </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">an enormous volume of malicious requests from many compromised systems causing legitimate users to lose access</span><span style=\"font-family:'Cambria Math'\"> — is a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Distributed Denial of Service (DDoS) attack</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option A: Distributed Denial of Service (DDoS)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct. In a DDoS attack, attackers use multiple compromised systems (often part of a botnet) to flood a target server or network with traffic.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">This overwhelms resources, making the service unavailable to legitimate users.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Common targets: websites, online services, financial platforms, government portals.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option B: SQL injection attack</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Involves inserting malicious SQL queries into input fields to manipulate databases.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">It compromises data integrity but does not flood servers with traffic.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option C: Man</span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">in</span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">the</span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">middle attack</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Involves intercepting communication between two parties to steal or alter data.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">It’s about eavesdropping, not overwhelming servers.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option D: Phishing attack</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Uses fraudulent emails/messages to trick users into revealing credentials.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">It targets individuals, not servers with traffic overload.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Assertion (A): Astronauts experience weightlessness while orbiting the Earth in the International Space Station (ISS).</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Reason (R): There is no gravitational force acting on the ISS or its occupants at that altitude.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, but R is NOT the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is false, but R is true</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is true, but R is false</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Option: D — A is true, but R is false.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-style:italic;font-family:'Cambria Math'\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Assertion (A): Astronauts experience weightlessness while orbiting the Earth in the ISS.</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">True.</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Astronauts in orbit feel weightless because they are in a continuous state of </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">free fall</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> around Earth. Both the ISS and its occupants fall together, so relative to the spacecraft, astronauts appear weightless.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Reason (R): There is no gravitational force acting on the ISS or its occupants at that altitude.</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">False.</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Gravity </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">does act</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> on the ISS and astronauts. In fact, Earth’s gravity at ISS altitude (~400 km) is about </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">90% as strong</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> as on the surface.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The weightlessness is not due to absence of gravity, but because both the ISS and astronauts are in </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">free fall</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, creating a condition of </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">microgravity</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Under which Article of the Constitution did the Supreme Court issue directions to all High Courts to pronounce reserved judgments within three months?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 124</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 137</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 141</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 142</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Supreme Court issued directions to all High Courts to pronounce reserved judgments within three months under </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Article 142 of the Constitution</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option A: Article 124</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Deals with the establishment and composition of the Supreme Court, not directions to High Courts.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option B: Article 137</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Grants the Supreme Court power to review its own judgments, not to direct High Courts on timelines.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option C: Article 141</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">States that the law declared by the Supreme Court is binding on all courts, but does not specify timelines for pronouncing judgments.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option D: Article 142</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Empowers the Supreme Court to pass any order necessary to do </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">“complete justice”</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> in a case.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Using this extraordinary power, the Court directed High Courts to pronounce reserved judgments within </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">three months</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> to ensure timely justice.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Match the following ancient Indian texts with their primary language of composition:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A. Rigveda - 1. Vedic Sanskrit</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">B. Tripitaka - 2. Pali</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">C. Agamas - 3. Prakrit</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">D. Tolkappiyam - 4. Tamil</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following combinations is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-3, B-4, C-1, D-2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-4, B-3, C-2, D-1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-2, B-1, C-4, D-3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-1, B-2, C-3, D-4</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Combination</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">A</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1, B</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">2, C</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">3, D</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">4</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">A. Rigveda</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Vedic Sanskrit</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The oldest of the four Vedas, composed in archaic Sanskrit around 1500–1200 BCE.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">B. Tripitaka</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pali</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The Buddhist canon, also called </span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Cambria Math'\">Tipitaka</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, preserved in Pali language.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">C. Agamas</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Prakrit</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Jain scriptures, originally composed in Ardhamagadhi Prakrit and other Prakrit dialects.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">D. Tolkappiyam</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Tamil</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The earliest extant Tamil grammar text, foundational to Sangam literature.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Who is the author of the book </span><span style=\"font-style:italic;font-family:'Cambria Math'\">India's First Olympic Gold</span><span style=\"font-family:'Cambria Math'\">?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sharda Ugra</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Anindya Dutta</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ramachandra Guha</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">K. Arumugam</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">The book </span><span style=\"font-weight:bold;font-style:italic;font-family:'Cambria Math'\">India’s First Olympic Gold</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> was authored by noted hockey historian K. Arumugam</span><span style=\"font-family:'Cambria Math'\">, released in May 2026 to commemorate India’s historic hockey triumph at the 1928 Amsterdam Olympics. </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Details about the Book</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Author:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">K. Arumugam</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Release Date:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> May 26–29, 2026</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Released By:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> P. T. Usha (President, Indian Olympic Association) and Dilip Tirkey (President, Hockey India)</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Theme:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Chronicles India’s </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">first Olympic gold medal in hockey (1928 Amsterdam Olympics)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Highlights of the Book</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Historic Victory:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> India defeated the Netherlands 3–0 in the final, beginning a golden era of Indian hockey.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt tion_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Consolidated Fund of India under Article 266 of the Constitution is defined as: a fund into which government revenues, loans, and loan recoveries are credited, and from which most public expenditure is incurred.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option A: Administered exclusively by State Governments</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. The Consolidated Fund of India is maintained by the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Union Government</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not states. States have their own separate Consolidated Funds.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option B: Solely for foreign exchange reserves</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. Foreign exchange reserves are managed by the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Reserve Bank of India</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not through the Consolidated Fund.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option C: Reserved only for emergencies</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. Emergency expenditure is met from the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Contingency Fund of India (Article 267)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not the Consolidated Fund.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option D: Government revenues, loans, and recoveries credited</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct. All revenues received by the Union Government, loans raised, and loan repayments flow into this fund.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Most public expenditure</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> (including salaries, defense, subsidies, development programs) is drawn from it.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Withdrawals require </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Parliamentary approval</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> (via appropriation bills).</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which classical dance form of India, from Andhra Pradesh, includes a distinctive solo item called 'Tarangam', performed while balancing on the rim of a brass plate?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kuchipudi</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Odissi</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kathak</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bharatanatyam</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The classical dance form from </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Andhra Pradesh</span><span style=\"font-family:'Cambria Math'\"> that includes the distinctive solo item </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">‘Tarangam’</span><span style=\"font-family:'Cambria Math'\">, performed while balancing on the rim of a brass plate, is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kuchipudi</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option A: Kuchipudi</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct. Kuchipudi is a dance-drama tradition from Andhra Pradesh.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Tarangam</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> is a hallmark solo performance where the dancer balances on a brass plate and executes rhythmic footwork, often while holding lamps.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Themes are drawn from </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bhakti literature</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, especially stories of Lord Krishna.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option B: Odissi</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Originated in Odisha. Known for </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">tribhanga posture</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> and devotional grace, but no brass plate balancing item.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option C: Kathak</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">North Indian dance form, storytelling through spins and rhythmic footwork, but not associated with Tarangam.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option D: Bharatanatyam</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Tamil Nadu’s classical dance, emphasizes </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">mudras and abhinaya</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, but does not feature Tarangam.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which statement best describes the primary function of the Public Accounts Committee (PAC) of the Indian Parliament?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A parliamentary committee responsible for conducting elections to various constitutional and legislative offices.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A parliamentary committee empowered to appoint judges to the higher judiciary under constitutional provisions.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A parliamentary committee that scrutinises government expenditure using the Comptroller and Auditor General's reports.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A parliamentary committee responsible for preparing and presenting the Annual Union Budget to Parliament.</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Public Accounts Committee (PAC) of the Indian Parliament is primarily tasked with scrutinising government expenditure using the reports of the Comptroller and Auditor General (CAG).</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option A: Conducting elections to constitutional offices</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Elections to offices like the President or Vice President are conducted by the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Election Commission of India</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not PAC.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option B: Appointing judges to higher judiciary</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Judicial appointments are made under constitutional provisions by the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">President</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> in consultation with the judiciary, not by PAC.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option C: Scrutinises government expenditure using CAG reports</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct. PAC examines whether money granted by Parliament has been spent lawfully and efficiently.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">It ensures accountability of the executive to the legislature.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The committee is chaired by a member of the opposition, reinforcing impartial oversight.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option D: Preparing and presenting the Union Budget</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Finance Ministry</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> prepares the Budget, which is presented by the Finance Minister, not PAC.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">‘Bardo Chham’ folk dance belongs to which Indian State?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Arunachal Pradesh</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Tripura</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Manipur</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mizoram</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The folk dance </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">‘Bardo Chham’</span><span style=\"font-family:'Cambria Math'\"> belongs to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Arunachal Pradesh</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bardo Chham</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">A traditional mask dance performed by the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sherdukpen tribe</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> of Arunachal Pradesh.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Symbolizes the victory of good over evil, with performers wearing masks representing different animals, spirits, and mythological figures.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Usually performed during festivals and religious occasions.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Tripura</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → Known for dances like </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Hojagiri</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not Bardo Chham.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Manipur</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → Famous for </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ras Lila</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> and other classical/folk dances.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mizoram</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → Known for </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Cheraw (bamboo dance)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not Bardo Chham.</span></li></ul>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Assertion (A): The Supreme Court of India can review and overturn its own previous judgments.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Reason (R): The doctrine of 'stare decisis' (precedent) is absolutely binding on the Supreme Court, with no exceptions permitted.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is false, but R is true</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, but R is NOT the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is true, but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, and R is the correct explanation of A</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Option:</span><span style=\"font-family:'Cambria Math'\"> C — A is true, but R is false.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Assertion (A): The Supreme Court of India can review and overturn its own previous judgments.</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">True.</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Under </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 137 of the Constitution</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, the Supreme Court has the power to </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">review its own judgments or orders</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Additionally, through larger benches, the Court can </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">overrule its earlier decisions</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> if found inconsistent with constitutional principles.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Reason (R): The doctrine of </span><span style=\"font-weight:bold;font-style:italic;font-family:'Cambria Math'\">stare decisis</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> (precedent) is absolutely binding on the Supreme Court, with no exceptions permitted.</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">False.</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> While </span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Cambria Math'\">stare decisis</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> means courts generally follow precedent for consistency, it is </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">not absolute</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> for the Supreme Court.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The Supreme Court can depart from precedent if it believes an earlier ruling was incorrect or unconstitutional.</span></li></ul>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Where are the headquarters of the 'International Atomic Energy Agency' (IAEA) situated?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Geneva, Switzerland</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Vienna, Austria</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Paris, France</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Washington D.C., USA</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">International Atomic Energy Agency (IAEA)</span><span style=\"font-family:'Cambria Math'\"> headquarters are located in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Vienna, Austria</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanaion:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option A: Geneva, Switzerland</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Geneva hosts many UN agencies (WHO, UNHCR, ILO), but not the IAEA.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option B: Vienna, Austria</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The IAEA was established in </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1957</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> as an autonomous international organization under the UN framework.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Headquarters: </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Vienna International Centre (VIC)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Role: Promotes peaceful use of nuclear energy, ensures nuclear safety, and prevents nuclear weapons proliferation.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option C: Paris, France</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Paris is home to UNESCO, not the IAEA.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option D: Washington D.C., USA</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Washington hosts institutions like the World Bank and IMF, but not the IAEA.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">On which day is 'National Science Day' celebrated every year in India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">12th January</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">28th February</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">8th March</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">15th September</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">National Science Day is celebrated every year in India on 28th February.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">National Science Day</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> marks the discovery of the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Raman Effect</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> by Nobel Laureate </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">C.V. Raman</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> in 1928.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The Government of India designated </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">28 February</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> as National Science Day in </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1986</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The day is observed to:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Spread awareness about the importance of science in daily life.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Inspire students towards scientific innovation.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Celebrate India’s achievements in science and technology.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">What is the national currency of Malaysia?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Baht</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Peso</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ringgit</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Camb 5.png\" width=\"59\" height=\"38\" alt style=\"vertical-align:middle\" ></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Efficiency ratio of Arif and Salman = 3 : 1</span></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Time ratio = 1 : 3</span></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Let their times be x days and 3x days.</span></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3x − x = 15</span></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2x = 15</span></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">x = 15/2 days</span></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Arif’s time = 15/2 days</span></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Salman’s time = 45/2 days</span></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Combined time</span></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786015592048_image026.png\" width=\"123\" height=\"73\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786015592048_image027.png\" width=\"51\" height=\"51\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.i
