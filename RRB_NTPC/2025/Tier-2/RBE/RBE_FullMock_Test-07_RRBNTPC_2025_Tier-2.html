<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>13.) RRB NTPC (UG) 2025-26 CBT-2 Paid Mock 7 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }

\">Based on the English alphabetical order, three of the following four letter-clusters are alike in a certain way and thus form a group. Which letter-cluster DOES NOT belong to that group?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(Note: The odd man out is not based on the number of consonants/vowels or their position in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">HEI</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">QNR</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">DBE</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">GDH</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">HEI → H − 3 = E and H + 1 = I</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">QNR → Q − 3 = N and Q + 1 = R</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">GDH → G − 3 = D and G + 1 = H</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">But,</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">DBE → D − 2 = B and D + 1 = E</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In the other three letter-clusters, the second letter is 3 positions before the first letter, and the third letter is 1 position after the first letter.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Therefore, DBE does not follow the same pattern.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ans: C) DBE</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Seven boxes A, B, C, D, U, V and W are kept one above the other, but not necessarily in the same order. Only D is kept above W. Only C is kept between W and V. Only A is kept below U. How many boxes are kept between B and A?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Four</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">One</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786015529746_image008.png\" width=\"69\" height=\"318\" alt ></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only one box is kept between B and A.</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sam starts from Point A and drives 8 km towards north. He then takes a left turn, drives 9 km, turns left and drives 13 km. He then takes a left turn and drives 11 km. He takes a final left turn, drives 5 km and stops at Point P. How far (shortest distance) and towards which direction should he drive in order to reach Point A again? (All turns are 90-degree turns only unless specified.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 km to the east</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2 km to the east</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2 km to the west</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3 km to the east</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786015529746_image009.png\" width=\"311\" height=\"281\" alt ></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sam has to drive 2 km west from Point P to reach Point A.</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Refer to the following series and answer the question.</span><br><span style=\"font-family:'Cambria Math'\">(All numbers are single-digit numbers only.)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(Left) 5 6 9 7 4 5 3 7 8 3 4 2 1 5 7 9 8 1 2 3 4 3 6 2 1 5 7 (Right)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">How many such odd digits are there, each of which is immediately preceded by an even digit and also immediately followed by an odd digit?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">4</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Required pattern:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Even digit – Odd digit – Odd digit</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The qualifying groups are:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">6 – 9 – 7</span><br><span style=\"font-family:'Cambria Math'\">4 – 5 – 3</span><br><span style=\"font-family:'Cambria Math'\">2 – 1 – 5</span><br><span style=\"font-family:'Cambria Math'\">2 – 1 – 5</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Therefore, the total number of such odd digits is:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">4</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ans: D) 4</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Select the pair that follows the same pattern as that followed by the two sets of pairs given below. Both pairs follow the same pattern.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">ROL–HEB</span><br><span style=\"font-family:'Cambria Math'\">DAX–TQN</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">VRO–KHD</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">VQM–KGD</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">DYV–TOL</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">VQM–LHE</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Each letter of the first cluster is moved 10 positions backward in the English alphabet.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">ROL → HEB</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">R − 10 = H</span><br><span style=\"font-family:'Cambria Math'\">O − 10 = E</span><br><span style=\"font-family:'Cambria Math'\">L − 10 = B</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">DAX → TQN</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">D − 10 = T</span><br><span style=\"font-family:'Cambria Math'\">A − 10 = Q</span><br><span style=\"font-family:'Cambria Math'\">X − 10 = N</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Checking option C:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">DYV → TOL</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">D − 10 = T</span><br><span style=\"font-family:'Cambria Math'\">Y − 10 = O</span><br><span style=\"font-family:'Cambria Math'\">V − 10 = L</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Therefore, DYV–TOL follows the same pattern.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ans: C) DYV–TOL</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In a certain code language, ‘NBSF’ is coded as ‘82’ and ‘IMSR’ is coded as ‘118’. What is the code for ‘AYLC’ in the given code language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">94</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">99</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">86</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">82</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Use the alphabetical positions of the letters and multiply their sum by 2.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">NBSF:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">N = 14, B = 2, S = 19, F = 6</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(14 + 2 + 19 + 6) × 2</span><br><span style=\"font-family:'Cambria Math'\">= 41 × 2</span><br><span style=\"font-family:'Cambria Math'\">= 82</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">IMSR:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I = 9, M = 13, S = 19, R = 18</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(9 + 13 + 19 + 18) × 2</span><br><span style=\"font-family:'Cambria Math'\">= 59 × 2</span><br><span style=\"font-family:'Cambria Math'\">= 118</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Similarly, AYLC:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A = 1, Y = 25, L = 12, C = 3</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(1 + 25 + 12 + 3) × 2</span><br><span style=\"font-family:'Cambria Math'\">= 41 × 2</span><br><span style=\"font-family:'Cambria Math'\">= 82</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ans: D) 82</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">What should come in place of the question mark (?) in the given series based on the English alphabetical order?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">ZXV, PNL, FDB, VTR, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">RQP</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">LJH</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">JIG</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">XVW</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In each letter-cluster, the letters decrease by 2 positions:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">ZXV → Z, X, V</span><br><span style=\"font-family:'Cambria Math'\">PNL → P, N, L</span><br><span style=\"font-family:'Cambria Math'\">FDB → F, D, B</span><br><span style=\"font-family:'Cambria Math'\">VTR → V, T, R</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Also, each corresponding letter moves 10 positions backward cyclically:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Z − 10 = P</span><br><span style=\"font-family:'Cambria Math'\">P − 10 = F</span><br><span style=\"font-family:'Cambria Math'\">F − 10 = V</span><br><span style=\"font-family:'Cambria Math'\">V − 10 = L</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Similarly:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">T − 10 = J</span><br><span style=\"font-family:'Cambria Math'\">R − 10 = H</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Therefore:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">VTR → LJH</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ans: B) LJH</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Eight people are sitting in two parallel rows containing 4 people each %;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">361 × 3 + 1 = 1084</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1084 × 3 + 1 = 3253</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3253 × 3 + 1 = 9760</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Therefore,</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">9760 × 3 + 1</span><br><span style=\"font-family:'Cambria Math'\">= 29280 + 1</span><br><span style=\"font-family:'Cambria Math'\">= 29281</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ans: D) 29281</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Each of D, I, R, E, C, T and S has a holiday on a different day of a week, starting from Monday and ending on Sunday of the same week.</span><span style=\"font-family:'Cambria Math'\">  </span><span style=\"font-family:'Cambria Math'\">Only S has a holiday after T. Only three people have holidays between C and T. Only three people have holidays between D and S. E has a holiday on some day before I and on some day after R.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">How many people have a holiday before D?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Three</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font- y:'Cambria Math'\">5 – 1 – 9</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">54 – 3 – 48</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Third number = [(First number + Second number) ÷ 2] × 3</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">24 – 10 – 51</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">[(24 + 10) ÷ 2] × 3</span><br><span style=\"font-family:'Cambria Math'\">= (34 ÷ 2) × 3</span><br><span style=\"font-family:'Cambria Math'\">= 17 × 3</span><br><span style=\"font-family:'Cambria Math'\">= 51</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">33 – 11 – 66</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">[(33 + 11) ÷ 2] × 3</span><br><span style=\"font-family:'Cambria Math'\">= (44 ÷ 2) × 3</span><br><span style=\"font-family:'Cambria Math'\">= 22 × 3</span><br><span style=\"font-family:'Cambria Math'\">= 66</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Similarly,</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">5 – 1 – 9</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">[(5 + 1) ÷ 2] × 3</span><br><span style=\"font-family:'Cambria Math'\">= (6 ÷ 2) × 3</span><br><span style=\"font-family:'Cambria Math'\">= 3 × 3</span><br><span style=\"font-family:'Cambria Math'\">= 9</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ans: C) 5 – 1 – 9</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In a certain code language,</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">‘A + B’ means ‘A is the daughter of B’,</span><br><span style=\"font-family:'Cambria Math'\">‘A − B’ means ‘A is the brother of B’,</span><br><span style=\"font-family:'Cambria Math'\">‘A × B’ means ‘A is the wife of B’, and</span><br><span style=\"font-family:'Cambria Math'\">‘A ÷ B’ means ‘A is the father of B’.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Based on the above, how is P related to T if:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">P + Q − R ÷ S × T?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Father’s brother’s wife</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Wife’s father’s brother’s wife</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Wife’s father’s brother’s daughter</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Father’s brother’s daughter</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style -height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Answer: Option 4 → K</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">E, F, G, H, K, L and N are sitting around a circular table facing the centre (but not necessarily in the same order). Only two people sit between H and G when counted from the right of H. Only three people sit between L and N when counted from the right of N. G sits to the immediate right of N. K sits to the immediate right of E.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">How many people sit between F and E when counted from the left of F?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Two</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Four</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">One</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786015529746_image013.png\" width=\"286\" height=\"243\" alt ></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Cambria Math'\">3 people sit between F and E when counted from the left of F.</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Seven people, A, B, L, M, N, S and T, are sitting in a row, facing north (but not necessarily in the same order). Only three people sit to the left of T. Only B sits to the right of A. Only three people sit between A and S. L sits at some place to the left of N but at some place to the right of M. How many people sit between M and N?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Three</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">One</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Four</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Two</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786015529746_image014.png\" width=\"408\" height=\"137\" alt ></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3 people sit between M and N.</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">AR 18 is related to HO 31 in a certain way. In the same way, KN 05 is related to RK 18. To which of the given options is QL 15 related, following the same logic?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">XI 27</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">XI 28</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">YK 26</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">WJ 28</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">First letter: Move 7 letters forward.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A + 7 = H</span><br><span style=\"font-family:'Cambria Math'\">K + 7 = R</span><br><span style=\"font-family:'Cambria Math'\">Q + 7 = X</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Second letter: Move 3 letters backward.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">R − 3 = O</span><br><span style=\"font-family:'Cambria Math'\">N − 3 = K</span><br><span style=\"font-family:'Cambria Math'\">L − 3 = I</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Number: Add 13.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">18 + 13 = 31</span><br><span style=\"font-family:'Cambria Math'\">05 + 13 = 18</span><br><span style=\"font-family:'Cambria Math'\">15 + 13 = 28</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Therefore:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">QL 15 → XI 28</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ans: B) XI 28</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which two numbers should be interchanged to make the given equation correct?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">50 × 3 + 12 × 5 − (66 ÷ 2) + 11 × 4 − 22 = 160</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(Note: Interchange should be done for the entire number and not for individual digits of a given number.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">5 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">22 and 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">12 and 11</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Interchange 3 and 2:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">50 × 2 + 12 × 5 − (66 ÷ 3) + 11 × 4 − 22</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">= 100 + 60 − 22 + 44 − 22</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">= 160</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Therefore, the required numbers are 3 and 2.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ans: A) 3 and 2</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Select the set in which the numbers are related in the same way as are the numbers of the following sets.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(Note: Operations should be performed on the whole numbers, without breaking down the numbers into their constituent digits.)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(13, 27, 41)</span><br><span style=\"font-family:'Cambria Math'\">(44, 31, 18)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(15, 13, 14)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(19, 24, 21)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(21, 25, 28)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(18, 16, 14)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The middle number is the average of the first and third numbers.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(13 + 41) ÷ 2 = 54 ÷ 2 = 27</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(44 + 18) ÷ 2 = 62 ÷ 2 = 31</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Checking option D:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(18 + 14) ÷ 2 = 32 ÷ 2 = 16</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Therefore, the correct set is (18, 16, 14).</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ans: D) (18, 16, 14)</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In a certain code language, ‘CALF’ is coded as ‘7904’ and ‘FACE’ is coded as ‘0489’. What is the code for ‘E’ in the given code language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">0</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">4</span></p>", "option3": " <p style=\"margin-t :108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">5163748</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Apply the conditions:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">5 + 2 = 7</span><br><span style=\"font-family:'Cambria Math'\">1 + 2 = 3</span><br><span style=\"font-family:'Cambria Math'\">6 − 2 = 4</span><br><span style=\"font-family:'Cambria Math'\">3 + 2 = 5</span><br><span style=\"font-family:'Cambria Math'\">7 + 2 = 9</span><br><span style=\"font-family:'Cambria Math'\">4 − 2 = 2</span><br><span style=\"font-family:'Cambria Math'\">8 − 2 = 6</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">New number:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">7345926</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Highest digit = 9</span><br><span style=\"font-family:'Cambria Math'\">Lowest digit = 2</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Required sum:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">9 + 2 = 11</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ans: C) 11</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Statements:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">All cages are nests.</span><br><span style=\"font-family:'Cambria Math'\">Some nests are houses.</span><br><span style=\"font-family:'Cambria Math'\">No house is a den.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(I) No cage is a den.</span><br><span style=\"font-family:'Cambria Math'\">(II) Some houses are cages.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both conclusions (I) and (II) follow.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only conclusion (II) follows.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only conclusion (I) follows.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither conclusion (I) nor (II) follows.</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786015529746_image015.png\" width=\"380\" height=\"170\" alt ></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">All cages are nests, but there is no definite relation given between cages and dens.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Therefore, conclusion (I) does not follow.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Some nests are houses, but those nests are not necessarily cages.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Therefore, conclusion (II) also does not follow.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ans: D) Neither conclusion (I) nor (II) follows.</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In a row of people, all facing north, Arjun is 8th from the right end. Mohan is 19th from the right end. Mohan is exactly between Arjun and Karan. If Karan is 7th from the left end of the row, how many people are there in the row?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">36</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">34</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">37</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">35</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Arjun’s position from the right = 8th</span><br><span style=\"font-family:'Cambria Math'\">Mohan’s position from the right = 19th</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Distance between Arjun and Mohan:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">19 − 8 = 11 positions</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Since Mohan is exactly between Arjun and Karan:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Karan’s position from the right:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">19 + 11 = 30th</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Karan is also 7th from the left.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Total number of people:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">30 + 7 − 1 = 36</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ans: A) 36</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">What will come in place of the question mark (?) in the following equation, if ‘+’ and ‘−’ are inter
