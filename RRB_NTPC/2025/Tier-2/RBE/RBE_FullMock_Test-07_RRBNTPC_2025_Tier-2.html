</p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">All salads are food, and all food are rice.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Therefore:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">All salads are rice.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Hence, conclusion (I) follows.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Also, salads are both food and appetizers.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Therefore:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Some foods are appetizers.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Hence, conclusion (II) also follows.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ans: A) Both conclusions (I) and (II) follow.</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which statement best explains the main function of red blood cells (erythrocytes) in the human body?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Producing antibodies to strengthen the body's immune defence against disease-causing microorganisms.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Forming blood clots to reduce excessive bleeding following injury to body tissues and blood vessels.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Destroying harmful microorganisms by directly attacking infectious agents entering the bloodstream regularly.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Carrying oxygen and carbon dioxide throughout the body with the help of haemoglobin molecules.</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The main function of red blood cells (erythrocytes) is to carry oxygen and carbon dioxide throughout the body with the help of haemoglobin molecules.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option A: Producing antibodies</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">That is the role of </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">white blood cells (lymphocytes)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not RBCs.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option B: Forming blood clots</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">That is the function of </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">platelets (thrombocytes)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option C: Destroying harmful microorganisms</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">That is the role of </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">white blood cells (phagocytes)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option D: Carrying oxygen and carbon dioxide</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">RBCs contain </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">haemoglobin</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, a protein that binds oxygen in the lungs and releases it in tissues.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">They also transport </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">carbon dioxide</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> back to the lungs for exhalation.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">This is their </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">primary and vital function</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> in the circulatory system.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which statement most accurately defines the concept of human capital in economics?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The stock of natural resources available within a country's geographical boundaries for economic use.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The network of physical infrastructure supporting production, transport, and public services nationwide.</span></p>", "option3": "Tुध ाnयिथधकgध, ौाiििस, पनोining, ोnक धसूधनiधncध ूयौौधौौधक ृद inकiॅiकहोिस पुोप धnुोncध धcयnयंic ूनयकहcपiॅiपद.", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The financial assets and cash reserves maintained by the government for public expenditure programs.</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The concept of human capital in economics is best defined as: the knowledge, skills, training, and experience possessed by individuals that enhance economic productivity.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option A: Stock of natural resources</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">That refers to </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">natural capital</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not human capital.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option B: Physical infrastructure</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">That is </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">physical capital</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> (roads, factories, transport systems).</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option C: Knowledge, skills, training, experience</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Human capital emphasizes the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">value of education, health, and skill development</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> in boosting productivity and economic growth.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Example: A well</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">trained workforce increases efficiency and innovation.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option D: Financial assets and reserves</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">That refers to </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">financial capital</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not human capital.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which statement most accurately defines a strait in physical geography?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A narrow strip of land connecting two larger landmasses separated by surrounding water bodies.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A narrow water passage linking two larger water bodies while separating adjacent landmasses.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A circular coral formation enclosing a shallow lagoon within warm tropical marine environments.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A deep and steep-sided valley carved over time through prolonged glacial erosion processes.</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">strait in physical geography</span><span style=\"font-family:'Cambria Math'\"> is defined as a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">narrow water passage linking two larger water bodies while separating adjacent landmasses.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option A: A narrow strip of land connecting two larger landmasses</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. That describes an </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">isthmus</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not a strait.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option B: A narrow water passage linking two larger water bodies</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct. Examples include:</span><ul type=\"square\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:27.58pt;margin-bottom:10pt;padding-left:8.42pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Strait of Gibraltar</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> → connects Atlantic Ocean &amp; Mediterranean Sea.</span></li><li style=\"margin-left:27.58pt;margin-bottom:10pt;padding-left:8.42pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Palk Strait</ 115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">fjord</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not a strait.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which ancient Indian dynasty is credited with establishing extensive trade links with the Roman Empire, exporting spices, textiles and gemstones?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kanva dynasty</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Satavahana dynasty</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Shunga dynasty</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Maurya dynasty</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The dynasty credited with establishing extensive trade links with the Roman Empire, exporting spices, textiles, and gemstones, is the </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Satavahana dynasty</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option A: Kanva dynasty</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. The Kanvas ruled briefly in Magadha after the Shungas but are not noted for Indo</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Roman trade.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option B: Satavahana dynasty</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct. The Satavahanas (c. 1st century BCE – 3rd century CE) controlled the Deccan region and major ports like </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kalyan and Sopara</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">They exported </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">pepper, textiles, gemstones, ivory, and steel</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> to Rome.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Roman gold coins and amphorae have been found in Satavahana territories, proving active trade links.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Cambria Math'\">Periplus of the Erythraean Sea</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> (1st century CE) documents this Indo</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Roman commerce.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option C: Shunga dynasty</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. The Shungas were more focused on North India and patronage of art and religion, not maritime trade with Rome.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option D: Maurya dynasty</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. The Mauryas (especially under Ashoka) had diplomatic and trade contacts, but </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">direct Indo</span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Roman trade flourished after the Mauryas</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, particularly under the Satavahanas and Tamil kingdoms.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Why did the Simon Commission (1928) face widespread protests throughout India despite being appointed to recommend constitutional reforms?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It included no Indian members, denying Indians representation in decisions affecting their own governance.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It proposed abolishing provincial legislatures and transferring their powers entirely to the central government.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It was constituted long before India was considered prepared for meaningful constitutional reforms to begin.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It recommended granting immediate complete independence, which many influential political leaders strongly opposed.</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Simon Commission (1928)</span><span style=\"font-family:'Cambria Math'\"> faced widespread protests in India because </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">it included no Indian members, denying Indians representation in decisions affecting their own governance.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option A: No Indian members</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The Commission was entirely composed of </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">British members</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, which outraged Indians.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Leaders across political lines condemned it as an insult, since reforms were being planned </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">without Indian participation</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">This led to nationwide protests, black flag demonstrations, and the slogan </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">“Simon Go Back.”</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option B: Abolishing provincial legislatures</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The Commission did not propose abolishing legislatures; its mandate was to review constitutional reforms.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option C: Constituted too early</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">India was already demanding reforms; the issue was </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">lack of Indian representation</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not timing.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option D: Recommended immediate independence</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The Commission did not recommend independence; in fact, its exclusion of Indians fueled demands for </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">self-rule</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which statement best describes the constitutional role of the Advocate General of a State?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A constitutional office held by an elected member representing a State Legislative Assembly constituency. </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The State Government's chief legal adviser, appointed by the Governor under the Constitution.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The highest judicial authority responsible for supervising all courts functioning within the State.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The principal public prosecutor responsible for conducting all criminal cases on behalf of the State.</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Advocate General of a State</span><span style=\"font-family:'Cambria Math'\"> is the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">State Government’s chief legal adviser, appointed by the Governor under the Constitution.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option A: Constitutional office held by an elected MLA</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Wrong. The Advocate General is </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">not an elected legislator</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">; it is a constitutional office under </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 165</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> of the Indian Constitution.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option B: State Government’s chief legal adviser</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Appointed by the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Governor</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Must be qualified to be a judge of a High Court.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Advises the state government on </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">legal matters</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> and represents it in courts.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option C: Highest judicial authority supervising courts</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">That role belongs to the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">High Court Chief Justice</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not the Advocate General.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option D: Principal public prosecutor for criminal cases</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">That is the role of the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Public Prosecutor</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not the Advocate General.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which statement most accurately explains the function of a router in a computer network?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A software application designed for editing photographs and creating digital graphic illustrations professionally.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A malicious software program created to infect computers and disrupt normal system operations automatically.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A networking device that forwards data packets between different computer networks using routing protocols.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A hardware component designed to reduce processor temperature during prolonged computer system operation.</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The function of a router in a computer network is to act as a networking device that forwards data packets between different computer networks using routing protocols.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option A: A software application for editing photographs</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. This describes a </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">graphics editing tool</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not a router.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option B: A malicious software program</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. That refers to </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">malware (like viruses or worms)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not a router.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option C: A networking device that forwards packets</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct. Routers connect multiple networks (e.g., a home LAN to the internet).</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">They use </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">routing tables and protocols (RIP, OSPF, BGP)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> to determine the best path for data transmission.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">This makes them essential for communication across different subnets and networks.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option D: A hardware component for reducing processor temperature</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. That describes a </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">cooling system (fans or liquid cooling)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not a router.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following national park–flagship species combinations is correctly matched?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sundarbans National Park – Primarily recognised for the conservation of large wild elephant populations. </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kaziranga National Park – The only natural habitat of the Asiatic lion in the wild today.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bandhavgarh National Park – Famous for having one of the highest tiger densities in India.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Gir National Park – Internationally recognised for having the highest density of wild tigers.</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correctly matched national park–flagship species combination is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bandhavgarh National Park – Famous for having one of the highest tiger densities in India.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option A: Sundarbans National Park – Elephants</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. Sundarbans is world</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">famous for its </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Royal Bengal Tigers</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> in mangrove forests, not elephants.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option B: Kaziranga National Park – Asiatic lion</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. Kaziranga (Assam) is renowned for the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">one</span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">horned rhinoceros</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not lions. Asiatic lions are found only in </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Gir National Park, Gujarat</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option C: Bandhavgarh National Park – Tigers</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct. Located in Madhya Pradesh, Bandhavgarh has one of the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">highest tiger densities in India</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, making it a prime destination for tiger sightings.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option D: Gir National Park – Tigers</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. Gir is internationally recognised for the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Asiatic lion</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not tigers.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following gases is primarily responsible for the greenhouse effect and global warming, released significantly through the burning of fossil fuels?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Argon</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Helium</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Nitrogen</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Carbon dioxide</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The gas primarily responsible for the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">greenhouse effect and global warming</span><span style=\"font-family:'Cambria Math'\">, released significantly through the burning of fossil fuels, is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Carbon dioxide (CO₂).</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option A: Argon</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. Argon is an inert noble gas, does not contribute to the greenhouse effect.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option B: Helium</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. Helium is a light, inert gas, not a greenhouse gas.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option C: Nitrogen</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. Nitrogen makes up ~78% of Earth’s atmosphere but is chemically stable and not a greenhouse gas.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option D: Carbon dioxide</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct. CO₂ traps heat in the atmosphere.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Major source: </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">burning fossil fuels (coal, oil, natural gas)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, deforestation, and industrial processes.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">It is the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">primary driver of global warming</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> among human</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">emitted greenhouse gases.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">If a country's currency depreciates substantially against major foreign currencies, what is the most likely impact on its exports?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Import demand increases significantly without producing any noticeable change in export competitiveness abroad.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">National economic output declines immediately regardless of changes in international trade or investment flows.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Exported goods become relatively cheaper for foreign buyers, improving international market competitiveness.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Exported goods become relatively more expensive for foreign buyers, reducing demand in overseas markets.</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">If a country’s currency </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">depreciates substantially against major foreign currencies</span><span style=\"font-family:'Cambria Math'\">, its </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">exports become relatively cheaper for foreign buyers</span><span style=\"font-family:'Cambria Math'\">, thereby improving international competitiveness.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option A: Import demand increases significantly without affecting exports</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. Depreciation makes imports </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">more expensive</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not cheaper, so import demand usually falls.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option B: National economic output declines immediately regardless of trade</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. Output depends on multiple factors; depreciation specifically affects trade flows, not automatic decline.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option C: Exported goods become cheaper abroad</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct. When the domestic currency weakens, foreign buyers can purchase more goods for the same amount of their currency.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">This boosts </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">export competitiveness</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> and often increases demand for the country’s goods in international markets.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option D: Exported goods become more expensive abroad</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. That would happen if the currency </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">appreciates</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not depreciates.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A region experiences hot, dry summers and mild, wet winters, with rainfall concentrated primarily in the winter months rather than summer. Which climate type does this best describe?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Tropical Monsoon climate</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Equatorial climate</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mediterranean climate</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Polar climate</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The climate type described — </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">hot, dry summers and mild, wet winters, with rainfall concentrated in winter months</span><span style=\"font-family:'Cambria Math'\"> — is the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Mediterranean climate.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option A: Tropical Monsoon climate</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. Monsoon climate has </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">heavy rainfall in summer</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> due to monsoon winds, not winter rainfall.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option B: Equatorial climate</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. Equatorial regions experience </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">hot, humid conditions with rainfall throughout the year</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not seasonal dry summers.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option C: Mediterranean climate</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct. Characterised by </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">dry, hot summers</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">mild, wet winters</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Found in regions like </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Southern Europe, California, parts of Australia, and South Africa</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Rainfall is concentrated in the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">winter months</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> due to westerly winds.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option D: Polar climate</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. Polar regions are extremely cold year</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">round, with very little precipitation, not mild winters and hot summers.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which medieval ruler is credited with constructing the Buland Darwaza at Fatehpur Sikri to commemorate a military victory?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Jahangir</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Akbar</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Shah Jahan</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Humayun</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Buland Darwaza at Fatehpur Sikri</span><span style=\"font-family:'Cambria Math'\"> was constructed by </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Akbar</span><span style=\"font-family:'Cambria Math'\"> in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1601</span><span style=\"font-family:'Cambria Math'\"> to commemorate his victory over Gujarat.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option A: Jahangir</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. Jahangir is known for his patronage of art and gardens, not for constructing Buland Darwaza.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option B: Akbar</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct. Akbar built the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Buland Darwaza (Gate of Magnificence)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> at Fatehpur Sikri.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">It is the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">largest gateway in India</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, standing about 54 meters high.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Built to mark his </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">victory over Gujarat in 1601</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option C: Shah Jahan</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. Shah Jahan is famous for the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Taj Mahal</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> and other marble architecture, not Buland Darwaza.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option D: Humayun</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. Humayun did not construct Buland Darwaza; he is remembered for Humayun’s Tomb in Delhi.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following correctly describes the 'Anti-Defection Law's' applicability to independent (non-party) members of a legislature?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">An independent member is disqualified if they join any political party after being elected</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Anti-Defection Law does not apply to independent members at all</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">An independent member automatically becomes a party member after 6 months</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">An independent member can never be disqualified under any circumstances</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Anti</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Defection Law (Tenth Schedule, 1985)</span><span style=\"font-family:'Cambria Math'\"> applies to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">independent members</span><span style=\"font-family:'Cambria Math'\"> as well.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option A: An independent member is disqualified if they join any political party after being elected</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct. The law clearly states that if an </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">independent legislator joins a political party after election</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, they are liable for </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">disqualification</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option B: The law does not apply to independent members</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Wrong. It applies to independents as well as party members.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option C: An independent member automatically becomes a party member after 6 months</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">No such provision exists in the Constitution or the law.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option D: An independent member can never be disqualified</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Incorrect. They can be disqualified if they join a political party post</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">election.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which statement most accurately explains the concept of Big Data?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A small dataset stored in spreadsheets that can be processed easily using ordinary software tools.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A programming language designed primarily for developing websites and internet-based software applications.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Extremely large and complex datasets requiring advanced tools beyond traditional data processing methods.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A hardware component installed inside computers to increase storage capacity and processing performance.</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The concept of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Big Data</span><span style=\"font-family:'Cambria Math'\"> refers to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">extremely large and complex datasets requiring advanced tools beyond traditional data processing methods.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option A: Small dataset in spreadsheets</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7p
