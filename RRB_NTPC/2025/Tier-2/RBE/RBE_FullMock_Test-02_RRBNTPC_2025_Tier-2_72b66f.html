:'Nirmala UI'\">950</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1,010</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारत की जनगणना 2011</span><span style=\"font-family:'Nirmala UI'\"> के अनुसार, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुसूचित जनजाति (ST)</span><span style=\"font-family:'Nirmala UI'\"> की जनसंख्या में लिंगानुपात </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रति 1,000 पुरुषों पर 990 महिलाएँ</span><span style=\"font-family:'Nirmala UI'\"> था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसका अर्थ है कि प्रत्येक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1,000 ST पुरुषों</span><span style=\"font-family:'Nirmala UI'\"> पर लगभग </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">990 ST महिलाएँ</span><span style=\"font-family:'Nirmala UI'\"> थीं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ST लिंगानुपात में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">2001 की जनगणना</span><span style=\"font-family:'Nirmala UI'\"> की तुलना में सुधार हुआ, जब यह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रति 1,000 पुरुषों पर 978 महिलाएँ</span><span style=\"font-family:'Nirmala UI'\"> था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: 990</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित भारतीय हिल स्टेशनों का मिलान उस राज्य से करें जहाँ वे स्थित हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A. मुन्नार - 1. केरल</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">B. ऊटी (उधगमंडलम) - 2. तमिलनाडु</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">C. माउंट आबू - 3. राजस्थान</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">D. कूर्ग (मडिकेरी) - 4. कर्नाटक</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा संयोजन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-3, B-4, C-1, D-2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-4, B-3, C-2, D-1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-2, B-1, C-4, D-3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-1, B-2, C-3, D-4</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुन्नार</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">केरल</span><span style=\"font-family:'Nirmala UI'\"> में एक हिल स्टेशन है; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ऊटी</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">तमिलनाडु</span><span style=\"font-family:'Nirmala UI'\"> (नीलगिरि पहाड़ियाँ) में है; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">माउंट आबू</span><span style=\"font-family:'Nirmala UI'\"> राजस्थान का एकमात्र हिल स्टेशन है, जो अरावली पर्वतमाला में है; और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कूर्ग (मडिकेरी)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कर्नाटक</span><span style=\"font-family:'Nirmala UI'\"> में है, जो अपने कॉफी बागानों के लिए जाना जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">माउंट आबू एक अन्यथा बड़े पैमाने पर शुष्क/अर्ध-शुष्क राज्य में एकमात्र हिल स्टेशन के रूप में उल्लेखनीय है, जिससे यह राजस्थान के भीतर एक लोकप्रिय पर्यटन स्थल बन जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही संयोजन A-1, B-2, C-3, D-4 है।</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कौन सा भारतीय राज्य कॉफी का सबसे बड़ा उत्पादक है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कर्नाटक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तमिलनाडु</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आंध्र प्रदेश</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केरल</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कर्नाटक</span><span style=\"font-family:'Nirmala UI'\">, विशेष रूप से कोडागु (कूर्ग) और चिकमगलूर क्षेत्र, भारत के कॉफी उत्पादन का अधिकांश हिस्सा हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">भारत मुख्य रूप से कॉफी की दो किस्में - अरेबिका और रोबस्टा - उगाता है, जिसमें कर्नाटक, केरल और तमिलनाडु मिलकर देश की लगभग पूरी कॉफी की खेती करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर कर्नाटक है।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पिन नदी __________ की सबसे महत्वपूर्ण दाहिनी तट सहायक नदी है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भागा नदी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चंद्रा नदी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्पीति नदी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">त्सारब नदी</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पिन नदी</span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पीति नदी की</span><span style=\"font-family:'Nirmala UI'\"> सबसे महत्वपूर्ण </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दाहिनी-किनारे की सहायक नदी</span><span style=\"font-family:'Nirmala UI'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पिन नदी हिमाचल प्रदेश में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पिन घाटी</span><span style=\"font-family:'Nirmala UI'\"> से होकर बहती है और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अतरगू/अटारगो</span><span style=\"font-family:'Nirmala UI'\"> के पास </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पीति नदी</span><span style=\"font-family:'Nirmala UI'\"> में मिलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: स्पीति नदी</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक शहर में बहुत गर्म ग्रीष्मकाल, ठंडी सर्दियाँ होती हैं, और इसे अपनी अधिकांश वर्षा एक छोटे मानसून के मौसम में प्राप्त होती है, जिसमें समुद्र से दूरी के कारण वार्षिक तापमान में बड़ी भिन्नता होती है। यह भारत के आंतरिक क्षेत्रों की किस व्यापक जलवायु प्रकार का वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भूमध्यसागरीय जलवायु</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ध्रुवीय जलवायु</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उष्णकटिबंधीय मानसूनी जलवायु (महाद्वीपीय प्रकार)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भूमध्यरेखीय जलवायु</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उष्णकटिबंधीय मानसूनी जलवायु के महाद्वीपीय प्रकार</span><span style=\"font-family:'Nirmala UI'\"> का वर्णन करता है, जो भारत के आंतरिक क्षेत्रों (जैसे दक्कन का पठार और उत्तरी भारत के कुछ हिस्से) की विशेषता है, जिसमें समुद्र के समकारी प्रभाव से दूरी के कारण </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बड़े तापमान भिन्नता</span><span style=\"font-family:'Nirmala UI'\"> और केंद्रित मानसूनी वर्षा होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">इसके विपरीत, तटीय क्षेत्र मानसून जलवायु के अधिक मध्यम 'समुद्रीय' संस्करण का अनुभव करते हैं, जिसमें समुद्र के समकारी प्रभाव के कारण तापमान में कम भिन्नता होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर उष्णकटिबंधीय मानसूनी जलवायु (महाद्वीपीय प्रकार) है।</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कोसी नदी मैदानी इलाकों में बार-बार अपना मार्ग बदलती है, इसका मुख्य कारण है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऊपरी इलाकों के बड़े बांध लगातार उनके प्राकृतिक प्रवाह को संशोधित करते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह विवर्तनिक रूप से विदरित निम्नभूमि के एक लंबे खंड से होकर गुजरती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसका प्रवाह केवल मौसमी मानसूनी वर्षा से बना रहता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह हिमालय से भारी मात्रा में गाद (अवसाद) लाती है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कोसी नदी</span><span style=\"font-family:'Nirmala UI'\"> मैदानी इलाकों में बार-बार अपना रास्ता बदलती है क्योंकि यह युवा और अत्यधिक अपरदनशील हिमालयी पहाड़ों से </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बहुत बड़ी मात्रा में गाद (सिल्ट, रेत और अन्य मलबा)</span><span style=\"font-family:'Nirmala UI'\"> लाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जब नदी बिहार के समतल मैदानों में प्रवेश करती है, तो इसकी गति कम हो जाती है। परिणामस्वरूप, यह अपनी नदी चैनल में इस गाद का अधिकांश भाग जमा कर देती है। लगातार जमाव से नदी तल के कुछ हिस्से ऊँचे हो जाते हैं और अवरुद्ध हो जाते हैं, जिससे नदी को अपना रास्ता बदलना पड़ता है और एक नया चैनल बनाना पड़ता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नदी के मार्ग में इस बार-बार के बदलाव के कारण बिहार में गंभीर बाढ़ आती है। इसलिए, कोसी को लोकप्रिय रूप से </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“बिहार का शोक”</span><span style=\"font-family:'Nirmala UI'\"> के नाम से जाना जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: यह हिमालय से भारी मात्रा में गाद (अवसाद) लाती है</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित भारतीय राज्यों को उनके गठन के कालानुक्रमिक क्रम में, सबसे पहले से नवीनतम तक व्यवस्थित करें: </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">छत्तीसगढ़, नागालैंड, तेलंगाना, गोवा।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">छत्तीसगढ़ - तेलंगाना - नागालैंड - गोवा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गोवा - नागालैंड - तेलंगाना - छत्तीसगढ़</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तेलंगाना - छत्तीसगढ़ - गोवा - नागालैंड</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नागालैंड - गोवा - छत्तीसगढ़ - तेलंगाना</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इन भारतीय राज्यों के गठन का सही कालानुक्रमिक क्रम, सबसे पहले से नवीनतम तक, है </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नागालैंड</span><span style=\"font-family:'Nirmala UI'\"> (1963)</span><span style=\"font-family:'Nirmala UI'\">  </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गोवा</span><span style=\"font-family:'Nirmala UI'\"> (1987)</span><span style=\"font-family:'Nirmala UI'\">  </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">छत्तीसगढ़</span><span style=\"font-family:'Nirmala UI'\"> (2000)</span><span style=\"font-family:'Nirmala UI'\">  </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">तेलंगाना</span><span style=\"font-family:'Nirmala UI'\"> (2014)। </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यहाँ सटीक तिथियाँ और विवरण दिए गए हैं:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">नागालैंड:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1 दिसंबर 1963</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> को भारत के 16वें राज्य के रूप में स्थापित हुआ।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">गोवा:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">30 मई 1987</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> को पूर्ण राज्य का दर्जा प्राप्त किया, जो 25वां राज्य बना।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">छत्तीसगढ़:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1 नवंबर 2000</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> को मध्य प्रदेश से अलग कर बनाया गया।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">तेलंगाना:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">2 जून 2014</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> को आंध्र प्रदेश को विभाजित करके सबसे नए राज्य के रूप में गठित हुआ।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसलिए, सही MCQ विकल्प है:</span><br><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नागालैंड - गोवा - छत्तीसगढ़ - तेलंगाना</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित प्राचीन भारतीय स्थलों का उनके संबंधित सभ्यता/काल से मिलान करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A. लोथल - 1. सिंधु घाटी सभ्यता</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">B. हम्पी - 2. विजयनगर साम्राज्य</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">C. सांची - 3. मौर्य काल (बौद्ध स्तूप)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">D. नालंदा - 4. गुप्त काल से आगे (बौद्ध विश्वविद्यालय)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा संयोजन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-2, B-1, C-4, D-3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-3, B-4, C-1, D-2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-1, B-2, C-3, D-4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-4, B-3, C-2, D-1</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गुजरात में स्थित </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लोथल</span><span style=\"font-family:'Nirmala UI'\">, एक प्रसिद्ध गोदीवाड़ा वाला </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सिंधु घाटी सभ्यता</span><span style=\"font-family:'Nirmala UI'\"> स्थल है; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हम्पी</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विजयनगर साम्राज्य</span><span style=\"font-family:'Nirmala UI'\"> की राजधानी थी; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सांची</span><span style=\"font-family:'Nirmala UI'\"> का प्रसिद्ध स्तूप अशोक के अधीन </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मौर्य काल</span><span style=\"font-family:'Nirmala UI'\"> के दौरान बनवाया गया था; और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नालंदा विश्वविद्यालय</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गुप्त काल</span><span style=\"font-family:'Nirmala UI'\"> से आगे एक प्रमुख बौद्ध शिक्षा केंद्र के रूप में फला-फूला।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">ये चार स्थल भारतीय इतिहास के लगभग 3,000 वर्षों तक फैले हुए हैं, कांस्य युग की सिंधु घाटी सभ्यता से लेकर मध्यकालीन विजयनगर साम्राज्य तक।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही संयोजन A-1, B-2, C-3, D-4 है।</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किस प्राचीन भारतीय गणितज्ञ को शून्य को एक संख्या के रूप में मानने के लिए पहले व्यवस्थित नियम प्रदान करने का श्रेय दिया जाता है, साथ ही बीजगणित में प्रमुख योगदान भी दिया गया है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वराहमिहिर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आर्यभट्ट</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भास्कर प्रथम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ब्रह्मगुप्त</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">7वीं सदी के गणितज्ञ-खगोलशास्त्री, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ब्रह्मगुप्त</span><span style=\"font-family:'Nirmala UI'\"> को अंकगणितीय संक्रियाओं में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">शून्य को एक संख्या के रूप में</span><span style=\"font-family:'Nirmala UI'\"> मानने के लिए पहले व्यवस्थित नियम प्रदान करने, और बीजगणित में महत्वपूर्ण योगदान देने का श्रेय दिया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">एक पूर्व गणितज्ञ, आर्यभट्ट, इसके बजाय स्थानीय मान प्रणालियों और खगोलीय गणनाओं पर अपने काम के लिए सबसे ज्यादा जाने जाते हैं, जिसमें पाई का एक प्रारंभिक अनुमान भी शामिल है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर ब्रह्मगुप्त है।</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सुल्तान बनने से पहले, अलाउद्दीन खिलजी के पास जलालुद्दीन के अधीन कौन सा महत्वपूर्ण पद था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सद्र-उस-सुदूर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अमीर-ए-तुज़ुक</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दीवान-ए-अर्ज़</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वज़ीर</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सुल्तान बनने से पहले, सुल्तान </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जलालुद्दीन खिलजी</span><span style=\"font-family:'Nirmala UI'\"> द्वारा </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अलाउद्दीन खिलजी</span><span style=\"font-family:'Nirmala UI'\"> को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अमीर-ए-तुज़ुक</span><span style=\"font-family:'Nirmala UI'\"> नियुक्त किया गया था। </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अमीर-ए-तुज़ुक</span><span style=\"font-family:'Nirmala UI'\"> का पद </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">शाही समारोहों के प्रमुख (मास्टर ऑफ सेरेमनी)</span><span style=\"font-family:'Nirmala UI'\"> को दर्शाता था, जो शाही समारोहों, दरबारी कार्यों और संबंधित व्यवस्थाओं के प्रबंधन के लिए जिम्मेदार था। </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बाद में, अलाउद्दीन </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कड़ा</span><span style=\"font-family:'Nirmala UI'\"> का गवर्नर भी बना और अधिक सैन्य तथा प्रशासनिक अधिकार प्राप्त किए, इससे पहले कि वह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1296 ईस्वी</span><span style=\"font-family:'Nirmala UI'\"> में सिंहासनारूढ़ हुआ। </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: अमीर-ए-तुज़ुक</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">साइमन कमीशन (1928) के बारे में निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. इसने प्रांतीय स्तर पर द्वैध शासन को समाप्त करने की सिफारिश की।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. इसकी अध्यक्षता एक भारतीय ने की थी, जिसे ब्रिटिश सरकार ने नियुक्त किया था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऊपर दिए गए कथनों में से कौन सा/से सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I और II दोनों</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो I और न ही II</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन I सही है</span><span style=\"font-family:'Nirmala UI'\"> - साइमन कमीशन ने प्रांतीय स्तर पर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">द्वैध शासन</span><span style=\"font-family:'Nirmala UI'\"> को समाप्त करने और उत्तरदायी सरकार का विस्तार करने की सिफारिश की।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन II गलत है</span><span style=\"font-family:'Nirmala UI'\"> - कमीशन की अध्यक्षता ब्रिटिश राजनेता </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सर जॉन साइमन</span><span style=\"font-family:'Nirmala UI'\"> ने की थी, जिसमें </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कोई भी भारतीय सदस्य नहीं था</span><span style=\"font-family:'Nirmala UI'\">, यही कारण था कि इसने 'साइमन गो बैक' के नारे के तहत व्यापक विरोध प्रदर्शनों को जन्म दिया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'केवल I' है।</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा सही ढंग से बताता है कि मुस्लिम लीग के 'प्रत्यक्ष कार्यवाही दिवस' (16 अगस्त 1946) को विभाजन की ओर ले जाने वाली घटनाओं में एक प्रमुख मोड़ क्यों माना जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसने व्यापक सांप्रदायिक हिंसा को जन्म दिया, विशेष रूप से कलकत्ता में, जिससे सांप्रदायिक विभाजन और गहरा हो गया और एक एकजुट भारत को बनाए रखना उत्तरोत्तर कठिन हो गया</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह तुरंत अंग्रेजों द्वारा स्वतंत्रता प्रदान करने का कारण बना</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसके परिणामस्वरूप मुस्लिम लीग ने पाकिस्तान की अपनी मांग वापस ले ली</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह पहली बार था जब कांग्रेस और मुस्लिम लीग ने राजनीतिक रूप से सहयोग किया</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">'</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रत्यक्ष कार्यवाही दिवस</span><span style=\"font-family:'Nirmala UI'\">' के कारण गंभीर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सांप्रदायिक हिंसा</span><span style=\"font-family:'Nirmala UI'\"> हुई, विशेष रूप से 'ग्रेट कलकत्ता किलिंग्स', जिसने हिंदू-मुस्लिम विभाजनों को काफी हद तक कठोर कर दिया और राजनीतिक नेताओं को यह विश्वास दिला दिया कि एक एकजुट, अविभाजित भारत को शांतिपूर्वक बनाए रखना असंभव होता जा रहा था - जिसने अंततः विभाजन की स्वीकृति में सीधे योगदान दिया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">इस घटना को अक्सर एक महत्वपूर्ण मोड़ के रूप में उद्धृत किया जाता है जिसके बाद विभाजन से बचने की संभावना बहुत दूर हो गई, क्योंकि इसने जिस पैमाने पर हिंसा और आपसी अविश्वास पैदा किया था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'इसने व्यापक सांप्रदायिक हिंसा को जन्म दिया, विशेष रूप से कलकत्ता में, जिससे सांप्रदायिक विभाजन और गहरा हो गया और एक एकजुट भारत को बनाए रखना उत्तरोत्तर कठिन हो गया'।</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रंगाबती भारत के निम्नलिखित में से किस राज्य का एक प्रसिद्ध लोक नृत्य है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ओडिशा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उत्तर प्रदेश</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आंध्र प्रदेश</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पश्चिम बंगाल</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सही उत्तर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ओडिशा</span><span style=\"font-family:'Nirmala UI'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रंगाबती के बारे में मुख्य विवरण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उत्पत्ति</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: रंगाबती पश्चिमी ओडिशा की </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">संभलपुरी संस्कृति</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> में गहराई से निहित है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">प्रकृति</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: हालांकि इसने मूल रूप से एक शास्त्रीय संभलपुरी लोकगीत के रूप में अपार लोकप्रियता हासिल की, लेकिन यह इसके साथ किए जाने वाले ऊर्जावान लोक नृत्य कदमों और लयबद्ध आंदोलनों का पर्याय बन गया है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भाषा और विरासत</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: यह प्रदर्शन पारंपरिक रूप से कोसली भाषा में किया जाता है, जो क्षेत्र की ग्रामीण और आदिवासी विरासत को दर्शाता है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">संगीत और वेशभूषा</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: नर्तक </span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Nirmala UI'\">ढोल</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">, </span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Nirmala UI'\">निशान</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> और </span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Nirmala UI'\">तासा</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> जैसे देशी ताल वाद्ययंत्रों की धुन पर प्रदर्शन करते हैं, जबकि वे प्रतिष्ठित संभलपुरी हैंडलूम साड़ियों और वेशभूषा में सजे होते हैं।</span></li></ul>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन भारतीय अदालतों द्वारा प्रयोग किए जाने वाले 'न्यायिक पुनरावलोकन' का सही वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न्यायिक निर्णयों की समीक्षा करने की संसद की शक्ति</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न्यायालय के निर्णयों की समीक्षा करने की राष्ट्रपति की शक्ति</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न्यायालयों की कानूनों या कार्यकारी कार्यों की जांच करने और, यदि आवश्यक हो, तो उन्हें अमान्य करने की शक्ति, जो संविधान का उल्लंघन करते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न्यायालयों की केवल प्रशासनिक नियुक्तियों की समीक्षा करने की शक्ति</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">न्यायिक समीक्षा</span><span style=\"font-family:'Nirmala UI'\"> न्यायालयों को, विशेषकर सर्वोच्च न्यायालय और उच्च न्यायालयों को, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कानूनों और कार्यकारी कार्यों</span><span style=\"font-family:'Nirmala UI'\"> की संवैधानिकता की जांच करने का अधिकार देती है, और यदि वे संवैधानिक प्रावधानों का उल्लंघन करते पाए जाते हैं तो उन्हें रद्द कर देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह शक्ति, यद्यपि किसी एक अनुच्छेद में स्पष्ट रूप से नामित नहीं है, अनुच्छेद 13, 32, 226 और 246 से प्रवाहित होती है, और 'मूल संरचना' सिद्धांत को कायम रखने वाले ऐतिहासिक मामलों के माध्यम से इसे सुदृढ़ किया गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'न्यायालयों की कानूनों या कार्यकारी कार्यों की जांच करने और, यदि आवश्यक हो, तो उन्हें अमान्य करने की शक्ति, जो संविधान का उल्लंघन करते हैं'।</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत में संसदीय और विधानसभा निर्वाचन क्षेत्रों के परिसीमन के लिए निम्नलिखित में से कौन सा निकाय जिम्मेदार है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">परिसीमन आयोग</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत का निर्वाचन आयोग</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वित्त आयोग</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विधि आयोग</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत सरकार द्वारा समय-समय पर गठित </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">परिसीमन आयोग</span><span style=\"font-family:'Nirmala UI'\">, नवीनतम जनगणना के आंकड़ों के आधार पर संसदीय और विधानसभा निर्वाचन क्षेत्रों की सीमाओं को फिर से निर्धारित करने के लिए जिम्मेदार है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यद्यपि निर्वाचन आयोग इन निर्वाचन क्षेत्रों के भीतर चुनाव कराता है, वास्तविक सीमा निर्धारण का कार्य एक अलग परिसीमन आयोग द्वारा किया जाता है, जिसे एक विशिष्ट परिसीमन अधिनियम के तहत नियुक्त किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है परिसीमन आयोग।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संविधान की कौन सी अनुसूची उन विषयों को सूचीबद्ध करती है जिन पर केंद्र और राज्य सरकारें दोनों कानून बना सकती हैं, जिसे समवर्ती सूची के रूप में जाना जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दसवीं अनुसूची</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सातवीं अनुसूची</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आठवीं अनुसूची</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नौवीं अनुसूची</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सातवीं अनुसूची</span><span style=\"font-family:'Nirmala UI'\"> में तीन सूचियां शामिल हैं - संघ सूची, राज्य सूची और समवर्ती सूची - जिसमें से अंतिम सूची </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">संघ और राज्य सरकारों</span><span style=\"font-family:'Nirmala UI'\"> दोनों को एक ही विषयों पर, जैसे शिक्षा और वन, कानून बनाने की अनुमति देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">समवर्ती सूची के विषय पर केंद्र कानून और राज्य कानून के बीच संघर्ष की स्थिति में, अनुच्छेद 254 के अनुसार, केंद्र कानून आम तौर पर प्रभावी होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है सातवीं अनुसूची।</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संवैधानिक ढांचे के संदर्भ में, पद पर नियुक्ति या चयन की विधि के आधार पर 'विषम' का चयन करें:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लोकसभा अध्यक्ष</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के प्रधानमंत्री</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के उपराष्ट्रपति</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के राष्ट्रपति</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: B) भारत के प्रधानमंत्री</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संविधान के तहत पदों को भरने के तरीके के अनुसार वर्गीकृत किया गया है:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">निर्वाचित पद (अप्रत्यक्ष/प्रत्यक्ष):</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भारत के राष्ट्रपति:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> संसद के दोनों सदनों और राज्यों की विधान सभाओं के निर्वाचित सदस्यों से मिलकर बने एक निर्वाचक मंडल द्वारा चुने जाते हैं।</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भारत के उपराष्ट्रपति:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> संसद के दोनों सदनों के सदस्यों से मिलकर बने एक निर्वाचक मंडल द्वारा चुने जाते हैं।</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लोकसभा अध्यक्ष:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> यद्यपि इस पद को अक्सर सदन द्वारा \"चुना हुआ\" (chosen) बताया जाता है, संवैधानिक अभ्यास में, अध्यक्ष </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लोकसभा के सदस्यों द्वारा अपने में से ही चुने जाते हैं</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> (अनुच्छेद 93)।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">नियुक्त पद:</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भारत के प्रधानमंत्री:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> प्रधानमंत्री को राष्ट्रपति द्वारा </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">नियुक्त</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> किया जाता है (अनुच्छेद 75), जो औपचारिक रूप से लोकसभा में बहुमत वाली पार्टी या गठबंधन के नेता को सरकार बनाने के लिए आमंत्रित करते हैं। प्रधानमंत्री को एक अलग मतपत्र के माध्यम से उस विशिष्ट पद के लिए नहीं चुना जाता है; बल्कि, उन्हें संसद सदस्य के रूप में उनकी स्थिति और बहुमत दल के उनके नेतृत्व के बाद नियुक्त किया जाता है।</span></li></ul>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कौन सी मेमोरी सबसे तेज़ है और सीपीयू के अंदर स्थित होती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हार्ड डिस्क</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कैश L3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रैम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रजिस्टर</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रजिस्टर</span><span style=\"font-family:'Nirmala UI'\"> सबसे तेज़ प्रकार की मेमोरी हैं और सीधे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सीपीयू के अंदर</span><span style=\"font-family:'Nirmala UI'\"> स्थित होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वे अस्थायी रूप से धारण करते हैं:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">वर्तमान में संसाधित किया जा रहा डेटा</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">निष्पादित किए जा रहे निर्देश</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">मेमोरी एड्रेस</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">मध्यवर्ती गणना परिणाम</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चूंकि रजिस्टर स्वयं सीपीयू का हिस्सा होते हैं, प्रोसेसर उन्हें कैश, रैम या हार्ड डिस्क की तुलना में बहुत तेज़ी से एक्सेस कर सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">हार्ड डिस्क:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> द्वितीयक भंडारण और बहुत धीमी।</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कैश L3:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> बहुत तेज़, लेकिन सीपीयू रजिस्टरों से धीमी।</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">रैम:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> मुख्य मेमोरी जो सीपीयू के बाहर स्थित होती है और रजिस्टरों से धीमी होती है।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: रजिस्टर</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विंडोज ऑपरेटिंग सिस्टम में, जब समर्पित पावर सेवर योजना सक्रिय की जाती है, तो निम्न में से कौन सा प्राथमिक तकनीकी तंत्र है जिसे ऑपरेटिंग सिस्टम ऊर्जा को महत्वपूर्ण रूप से बचाने के लिए नियोजित करता है, जिसके परिणामस्वरूप सिस्टम की प्रतिक्रियाशीलता और प्रदर्शन में उल्लेखनीय कमी आती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हार्ड डिस्क के स्पिन-डाउन समय को बढ़ाना ताकि यह सुनिश्चित हो सके कि ड्राइव निष्क्रिय रहे और शून्य यांत्रिक शक्ति का उपभोग करे।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अधिकतम प्रोसेसर स्थिति (क्लॉक स्पीड/फ्रीक्वेंसी) को कम करना ताकि चरम गणना क्षमता और थर्मल आउटपुट को सीमित किया जा सके।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">CPU के सबसे तेज़ मेमोरी घटकों द्वारा खपत की जाने वाली शक्ति को कम करने के लिए हर कुछ सेकंड में कैश मेमोरी को आक्रामक रूप से फ्लश करना</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ग्राफिकल प्रोसेसिंग यूनिट (GPU) को पूरी तरह से अक्षम करना और सभी डिस्प्ले रेंडरिंग को CPU पर मजबूर करना</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पावर सेवर</span><span style=\"font-family:'Nirmala UI'\"> योजना मुख्य रूप से प्रोसेसर के अधिकतम प्रदर्शन को सीमित करके बिजली की खपत को कम करती है। यह CPU की अनुमत </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">क्लॉक स्पीड/फ्रीक्वेंसी</span><span style=\"font-family:'Nirmala UI'\"> को कम करती है, जिससे ऊर्जा का उपयोग और गर्मी का उत्पादन कम होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चूंकि प्रोसेसर को अपनी पूरी अधिकतम गति का उपयोग करने से रोका जाता है, इसलिए मांग वाले कार्य धीमी गति से चल सकते हैं, जिससे सिस्टम की प्रतिक्रियाशीलता और प्रदर्शन कम हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: अधिकतम प्रोसेसर स्थिति (क्लॉक स्पीड/फ्रीक्वेंसी) को कम करना ताकि अधिकतम कम्प्यूटेशनल क्षमता और थर्मल आउटपुट को सीमित किया जा सके</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">MS Word जैसे एप्लिकेशन में कीबोर्ड शॉर्टकट Ctrl + H का प्राथमिक कार्य क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\ t:bold;font-family:'Nirmala UI'\">1 संयोजी इलेक्ट्रॉन</span><span style=\"font-family:'Nirmala UI'\"> होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: समान रहता है</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किस भारतीय व्यापारिक नेता को 2026 USISPF लीडरशिप अवार्ड से सम्मानित किया गया?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सुनील भारती मित्तल</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एन. चंद्रशेखरन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मुकेश अंबानी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रतन टाटा</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारती एंटरप्राइजेज के संस्थापक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सुनील भारती मित्तल</span><span style=\"font-family:'Nirmala UI'\"> को भारत-अमेरिका व्यापार संबंधों को मजबूत करने में उनके योगदान को मान्यता देते हुए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">2026 USISPF (यूएस-इंडिया स्ट्रैटेजिक पार्टनरशिप फोरम) लीडरशिप अवार्ड</span><span style=\"font-family:'Nirmala UI'\"> से सम्मानित किया गया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर सुनील भारती मित्तल है।</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">व्हिटली पुरस्कार, जिन्हें अक्सर 'ग्रीन ऑस्कर' कहा जाता है, 2026 में दो भारतीय महिलाओं ने किस क्षेत्र में योगदान के लिए जीते?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दुर्लभ रोग चिकित्सा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अंतरिक्ष प्रौद्योगिकी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पर्यावरण/वन्यजीव संरक्षण</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गरीबी उन्मूलन अर्थशास्त्र</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">व्हिटली फंड फॉर नेचर द्वारा सालाना मान्यता प्राप्त वैश्विक संरक्षणवादियों के एक चुनिंदा समूह में शामिल होते हुए, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दो भारतीय महिलाओं</span><span style=\"font-family:'Nirmala UI'\"> ने 2026 में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पर्यावरण/वन्यजीव संरक्षण</span><span style=\"font-family:'Nirmala UI'\"> में अपने प्रभावशाली जमीनी स्तर के काम के लिए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्हिटली पुरस्कार ('ग्रीन ऑस्कर')</span><span style=\"font-family:'Nirmala UI'\"> जीते।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">व्हिटली पुरस्कार विशेष रूप से ग्लोबल साउथ के संरक्षण नेताओं को सम्मानित करते हैं, स्थानीय स्तर पर चलाए जा रहे संरक्षण परियोजनाओं का समर्थन करते हैं जिन्हें अन्यथा अंतरराष्ट्रीय मान्यता और धन प्राप्त करने में कठिनाई हो सकती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर पर्यावरण/वन्यजीव संरक्षण है।</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2025-26 में अंतर्राष्ट्रीय खेल योग्यताओं में भारत की भागीदारी के बारे में निम्नलिखित में से कौन सा कथन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत की महिला अंडर-20 फुटबॉल टीम ने 20 साल में पहली बार एएफसी अंडर-20 महिला एशियाई कप के लिए क्वालीफाई किया</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत की अंडर-17 पुरुष फुटबॉल टीम ने एएफसी अंडर-17 एशियाई कप जीता</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत की वरिष्ठ महिला फुटबॉल टीम एएफसी महिला एशियाई कप के लिए क्वालीफाई करने में विफल रही</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत की वरिष्ठ पुरुष फुटबॉल टीम ने फीफा विश्व कप 2026 के लिए सीधे क्वालीफाई किया</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत की </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">महिला अंडर-20 फुटबॉल टीम ने 20 साल में पहली बार एएफसी अंडर-20 महिला एशियाई कप के लिए क्वालीफाई किया</span><span style=\"font-family:'Nirmala UI'\">, जो जमीनी स्तर के प्रशिक्षण और विकास में लगातार प्रगति को दर्शाता एक महत्वपूर्ण उपलब्धि है। वरिष्ठ पुरुष टीम ने फीफा विश्व कप के लिए सीधे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">क्वालीफाई नहीं किया</span><span style=\"font-family:'Nirmala UI'\">; अंडर-17 पुरुष टीम ने एएफसी अंडर-17 एशियाई कप </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जीता नहीं बल्कि केवल क्वालीफाई किया</span><span style=\"font-family:'Nirmala UI'\">; और वरिष्ठ महिला टीम वास्तव में एएफसी महिला एशियाई कप के लिए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सीधी योग्यता प्राप्त की</span><span style=\"font-family:'Nirmala UI'\">, न कि क्वालीफाई करने में विफल रही।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'भारत की महिला अंडर-20 फुटबॉल टीम ने 20 साल में पहली बार एएफसी अंडर-20 महिला एशियाई कप के लिए क्वालीफाई किया' है।</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हाल ही में कौन सा देश अफ्रीका में पहला ऐसा देश बन गया जिसे WHO द्वारा ऑनकोसेरका वोल्वलस (नदी अंधता का कारण बनने वाला परजीवी) के संचरण को बाधित करने के लिए मान्यता दी गई?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नाइजीरिया</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नाइजर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केन्या</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मिस्र</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नाइजर</span><span style=\"font-family:'Nirmala UI'\"> अफ्रीका का पहला देश बन गया जिसे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">WHO</span><span style=\"font-family:'Nirmala UI'\"> द्वारा 'नदी अंधता' (ऑनकोसेरसिआजिस) के लिए जिम्मेदार परजीवी </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ऑनकोसेरका वोल्वलस</span><span style=\"font-family:'Nirmala UI'\"> के संचरण को सफलतापूर्वक बाधित करने के लिए मान्यता दी गई।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह उपलब्धि उपेक्षित उष्णकटिबंधीय रोगों को खत्म करने के वैश्विक सार्वजनिक स्वास्थ्य प्रयासों में महत्वपूर्ण है, विशेष रूप से उप-सहारा अफ्रीका में जहां ऑनकोसेरसिआजिस ऐतिहासिक रूप से सबसे अधिक प्रचलित रहा है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर नाइजर है।</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गोपाल कृष्ण गोखले 1897 में किस आयोग के समक्ष साक्ष्य देने के लिए इंग्लैंड गए थे?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हंटर आयोग</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रैले आयोग</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वेल्बी आयोग</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">फ्रेजर आयोग</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गोपाल कृष्ण गोखले </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1897</span><span style=\"font-family:'Nirmala UI'\"> में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">वेल्बी आयोग</span><span style=\"font-family:'Nirmala UI'\"> के समक्ष साक्ष्य देने के लिए इंग्लैंड गए थे।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">वेल्बी आयोग</span><span style=\"font-family:'Nirmala UI'\">, जिसे आधिकारिक तौर पर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">शाही भारतीय व्यय आयोग (Royal Commission on Indian Expenditure)</span><span style=\"font-family:'Nirmala UI'\"> के नाम से जाना जाता है, को ब्रिटिश भारत के वित्तीय प्रशासन की जांच के लिए नियुक्त किया गया था। इसने अत्यधिक सरकारी खर्च और ब्रिटिश नीतियों द्वारा भारत पर डाले गए वित्तीय बोझ जैसे मुद्दों की जांच की।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गोखले ने भारत की खराब वित्तीय स्थिति के संबंध में साक्ष्य प्रस्तुत किए और भारतीयों को प्रभावित करने वाली अनुचित वित्तीय नीतियों की आलोचना की।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: वेल्बी आयोग</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन-सा शास्त्रीय नृत्य रूप - विशिष्ट विशेषता युग्म सही सुमेलित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कुचिपुड़ी - तरंगम (पीतल की थाली के किनारे पर नृत्य करना)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भरतनाट्यम - केवल पुरुषों द्वारा मंदिरों में प्रस्तुत किया जाता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ओडिसी - पूरी तरह से एक युद्ध नृत्य रूप जिसमें कोई धार्मिक विषय नहीं होता</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कथक - विशेष रूप से मुखौटों और विस्तृत चेहरे के रंग-रोगन के साथ प्रस्तुत किया जाता है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पीतल की थाली के किनारे पर संतुलन बनाकर किया जाने वाला </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कुचिपुड़ी का तरंगम</span><span style=\"font-family:'Nirmala UI'\"> सही सुमेलित है। अन्य युग्म गलत हैं: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भरतनाट्यम</span><span style=\"font-family:'Nirmala UI'\"> पुरुषों और महिलाओं दोनों द्वारा किया जाता है, न कि विशेष रूप से पुरुषों द्वारा; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ओडिसी</span><span style=\"font-family:'Nirmala UI'\"> एक भक्ति/कथात्मक नृत्य रूप है जिसमें मजबूत धार्मिक विषय होते हैं, यह केवल युद्ध-संबंधी नहीं है; और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथक</span><span style=\"font-family:'Nirmala UI'\">, कथकली के विपरीत, आमतौर पर मुखौटों या विस्तृत चेहरे के रंग-रोगन का उपयोग </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नहीं</span><span style=\"font-family:'Nirmala UI'\"> करता है - इसके बजाय यह चेहरे के भावों, फुटवर्क और चक्र पर निर्भर करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'कुचिपुड़ी - तरंगम (पीतल की थाली के किनारे पर नृत्य करना)' है।</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन-सा तत्व आघातवर्धनीय (malleable) है और ऊष्मा तथा विद्युत का सुचालक है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आयोडीन (I)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सल्फर (S)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बेरियम (Ba)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नियॉन (Ne)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बेरियम (Ba)</span><span style=\"font-family:'Nirmala UI'\"> एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">धातु</span><span style=\"font-family:'Nirmala UI'\"> है। धातुएँ आमतौर पर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आघातवर्धनीय</span><span style=\"font-family:'Nirmala UI'\"> होती हैं और ऊष्मा तथा </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विद्युत की अच्छी चालक</span><span style=\"font-family:'Nirmala UI'\"> होती हैं।</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">आघातवर्धनीय</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> का अर्थ है कि किसी पदार्थ को पीटकर या बेलकर पतली चादरों में बदला जा सकता है।</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">धातुओं में मुक्त इलेक्ट्रॉन होते हैं, जो ऊष्मा और विद्युत धारा का संचालन करने में मदद करते हैं।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अन्य विकल्प:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">आयोडीन (I):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> अधातु; आघातवर्धनीय नहीं।</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सल्फर (S):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> अधातु; भंगुर और कुचालक।</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">नियॉन (Ne):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> अक्रिय गैस; आघातवर्धनीय नहीं और चालक के रूप में उपयोग नहीं की जाती।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: बेरियम (Ba)</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राष्ट्र-निर्माण की गतिविधियों में स्वैच्छिक नागरिक भागीदारी को प्रोत्साहित करने के लिए 1952 में स्थापित 'भारत सेवक समाज' के संस्थापक कौन थे?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">महात्मा गांधी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सरदार पटेल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राजेंद्र प्रसाद</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जवाहरलाल नेहरू</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जवाहरलाल नेहरू</span><span style=\"font-family:'Nirmala UI'\"> ने 1952 में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारत सेवक समाज</span><span style=\"font-family:'Nirmala UI'\"> की स्थापना की थी, जिसका उद्देश्य स्वतंत्रता के बाद भारत के विकास और राष्ट्र-निर्माण कार्यक्रमों में स्वैच्छिक नागरिक भागीदारी को जुटाना था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह नेहरू की उस व्यापक दृष्टि को दर्शाता है जिसमें उन्होंने सरकार की पंचवर्षीय योजनाओं के पूरक के रूप में सामान्य नागरिकों को नियोजित आर्थिक और सामाजिक विकास में सीधे शामिल करने की बात कही थी।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर जवाहरलाल नेहरू है।</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अभिकथन (A): राज्य सभा किसी संवैधानिक संशोधन विधेयक को अस्वीकृत या अनिश्चित काल के लिए विलंबित नहीं कर सकती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कारण (R): संविधान में संशोधन की प्रक्रिया में राज्य सभा की कोई भूमिका नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन-सा सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A गलत है, लेकिन R सही है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सही हैं, लेकिन R, A का सही स्पष्टीकरण नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सही हैं, और R, A का सही स्पष्टीकरण है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A सही है, लेकिन R गलत है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">A सही है</span><span style=\"font-family:'Nirmala UI'\"> - अनुच्छेद 368 के तहत एक संवैधानिक संशोधन विधेयक को विशेष बहुमत के साथ </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दोनों सदनों द्वारा पारित</span><span style=\"font-family:'Nirmala UI'\"> किया जाना चाहिए, और साधारण विधेयकों के विपरीत, संयुक्त बैठक द्वारा इसे निरस्त करने का कोई तंत्र नहीं है, इसलिए एक बार जब दोनों सदन वास्तव में असहमत होते हैं, तो संशोधन केवल विफल हो जाता है न कि केवल एक सदन द्वारा अनिश्चित काल के लिए 'विलंबित' होता है। </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">R गलत है</span><span style=\"font-family:'Nirmala UI'\"> - राज्य सभा की, वास्तव में, संविधान में संशोधन करने में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बहुत महत्वपूर्ण, अनिवार्य रूप से समान भूमिका</span><span style=\"font-family:'Nirmala UI'\"> है, जो धन विधेयकों के लिए उसकी प्रतिबंधित भूमिका के विपरीत है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह संवैधानिक संशोधन विधेयकों को धन विधेयकों से स्पष्ट रूप से अलग करता है: बाद वाले के लिए, राज्य सभा की भूमिका केवल सिफारिशी होती है, लेकिन संवैधानिक संशोधनों के लिए, दोनों सदनों को विधेयक को विशेष बहुमत से स्वतंत्र रूप से पारित करना होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'A सही है, लेकिन R गलत है' है।</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala
