<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>18.) RRB NTPC (UG) 2025-26 CBT-2 Paid Mock 9 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

, 44वें संशोधन के सुरक्षा उपायों के अनुसार, अनुच्छेद 352 के तहत आपातकाल की घोषणा या चुनाव आयोग के प्रमाणीकरण की आवश्यकता के बिना, किसी राज्य में राष्ट्रपति शासन लगातार कितनी अवधि तक जारी रह सकता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">छह महीने</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक वर्ष</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दो वर्ष</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तीन वर्ष</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प B — एक वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 356 (राष्ट्रपति शासन):</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">राष्ट्रपति को किसी राज्य का नियंत्रण संभालने की अनुमति देता है यदि संवैधानिक तंत्र विफल हो जाता है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">प्रारंभ में, संसदीय अनुमोदन से राष्ट्रपति शासन </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">तीन वर्ष तक</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> जारी रह सकता था।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">44वाँ संवैधानिक संशोधन (1978) सुरक्षा उपाय:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">दुरुपयोग को रोकने के लिए, संशोधन ने राष्ट्रपति शासन के विस्तार को प्रतिबंधित कर दिया।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 352 के तहत राष्ट्रीय आपातकाल या चुनाव आयोग के प्रमाणीकरण के बिना कि चुनाव नहीं कराए जा सकते</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, राष्ट्रपति शासन </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लगातार एक वर्ष से अधिक जारी नहीं रह सकता</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इस प्रकार, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उन विशेष शर्तों के बिना</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> अधिकतम अवधि </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">एक वर्ष</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> है।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">एक वर्ष से अधिक:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">तीन वर्ष</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> तक का विस्तार तभी संभव है जब:</span><ol type=\"1\"><li style=\"margin-left:32.07pt;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span style=\"font-weight:bold\">अनुच्छेद 352 के तहत राष्ट्रीय आपातकाल</span><span> लागू हो, या</span></li><li style=\"margin-left:32.07pt;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span style=\"font-weight:bold\">चुनाव आयोग यह प्रमाणित करे</span><span> कि संबंधित राज्य में चुनाव नहीं कराए जा सकते हैं।</span></li></ol></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वह 'व्यपगत का सिद्धांत', जिसका उपयोग व्यापक रूप से उन रियासतों को हड़पने के लिए किया गया था जिनमें कोई स्वाभाविक पुरुष उत्तराधिकारी नहीं था, भारत के किस गवर्नर-जनरल द्वारा तैयार किया गया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लॉर्ड डलहौजी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लॉर्ड वेलेज़ली</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लॉर्ड कर्जन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लॉर्ड बेंटिंक</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प A — लॉर्ड डलहौज़ी</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">व्यपगत का सिद्धांत (डॉक्ट्रिन ऑफ लैप्स)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लॉर्ड डलहौज़ी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, जो भारत के गवर्नर-जनरल (1848–1856) थे, द्वारा तैयार किया गया था और व्यापक रूप से लागू किया गया था।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इस सिद्धांत के तहत:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यदि कोई रियासती शासक </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बिना किसी स्वाभाविक पुरुष उत्तराधिकारी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के मर जाता था, तो उसका राज्य 'व्यपगत' हो जाता था और अंग्रेजों द्वारा हड़प लिया जाता था।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">गोद लिए गए पुत्रों को वैध उत्तराधिकारी के रूप में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मान्यता नहीं दी जाती थी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इस नीति के कारण कई राज्यों का विलय हुआ, जिनमें शामिल हैं:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सतारा</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (1848)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">जैतपुर और संबलपुर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (1849)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बघाट</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (1850)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उदयपुर (1852)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> – </span><span style=\"font-size:12pt;font-style:italic;font-family:'Nirmala UI'\">नोट: आधुनिक मध्य प्रदेश में एक रियासती राज्य, जो राजस्थान के उदयपुर से भिन्न है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">झाँसी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (1853)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">नागपुर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (1854)</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">(नोट: जबकि </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अवध को 1856 में ब्रिटिश साम्राज्य में मिलाया गया था</span><span style=\"font-family:'Nirmala UI'\">, इसे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथित कुशासन/खराब प्रशासन</span><span style=\"font-family:'Nirmala UI'\"> के आधार पर एक अलग बहाने से अधिग्रहण किया गया था, न कि व्यपगत के सिद्धांत के तहत।)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह आक्रामक विलय नीति असंतोष के प्रमुख कारणों में से एक थी जिसने </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1857 के विद्रोह</span><span style=\"font-family:'Nirmala UI'\"> को बढ़ावा दिया।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कंप्यूटर के OSI मॉडल में, डेटा पैकेट को रूट करने के लिए मुख्य रूप से कौन सी लेयर जिम्मेदार है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सत्र परत</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">परिवहन परत</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नेटवर्क परत</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डेटा लिंक लेयर</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प C — नेटवर्क लेयर</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">OSI मॉडल</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">नेटवर्क लेयर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> मुख्य रूप से विभिन्न नेटवर्क और सबनेट में </span><span style=\"font-size:12pt;font-w oe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प C — 1978 से 1980</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">रोलिंग प्लान</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> को </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1978</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">प्रधानमंत्री मोरारजी देसाई के नेतृत्व वाली जनता सरकार</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> द्वारा पेश किया गया था।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इसने आपातकाल के बाद, चल रही </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पांचवीं पंचवर्षीय योजना</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (1974–79) को बीच में ही बदल दिया था।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अवधारणा:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">निर्धारित पंचवर्षीय लक्ष्यों के बजाय, रोलिंग प्लान में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">वार्षिक योजनाएँ</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> थीं जिन्हें हर साल संशोधित किया जाता था। :10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">एक </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भ्रंश घाटी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> पृथ्वी की पपड़ी के </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भ्रंशन (faulting)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> से बनती है, जिससे एक लंबा गर्त बनता है जिसके माध्यम से नदी बहती है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इस भूवैज्ञानिक संरचना के कारण, नर्मदा डेल्टा नहीं बनाती है, बल्कि इसके बजाय एक एस्चुरी (नदीमुख/ज्वारनदमुख) के माध्यम से अरब सागर में गिरती है।</span></li></ul>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किस संवैधानिक संशोधन अधिनियम ने अनुच्छेद 15 के तहत एक प्रावधान सम्मिलित किया, जिससे सामान्य वर्ग के नागरिकों के बीच आर्थिक रूप से कमजोर वर्गों (EWS) के लिए आरक्षण सक्षम हुआ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">73वां संशोधन अधिनियम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">83वां संशोधन अधिनियम</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">93वां संशोधन अधिनियम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">103वां संशोधन अधिनियम</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही in-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह संशोधन SCs, STs और OBCs के लिए मौजूदा आरक्षणों के अतिरिक्त EWS के लिए </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">10% आरक्षण</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> प्रदान करता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह एक ऐतिहासिक कदम था क्योंकि इसने सकारात्मक कार्रवाई के आधार के रूप में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">आर्थिक मानदंड</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> को पेश किया, जिसे पहले संविधान में मान्यता नहीं दी गई थी।</span></li></ul>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय अर्थव्यवस्था में 'ट्विन बैलेंस शीट' समस्या किन दो क्षेत्रों में एक साथ वित्तीय तनाव को संदर्भित करती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कृषि और विनिर्माण क्षेत्र</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सार्वजनिक और निजी शिक्षा क्षेत्र</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आयात और निर्यात क्षेत्र</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बैंकिंग क्षेत्र और कॉर्पोरेट क्षेत्र </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प D — बैंकिंग क्षेत्र और कॉर्पोरेट क्षेत्र।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ट्विन बैलेंस शीट समस्या</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">एक साथ वित्तीय तनाव</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> शामिल है:</span><ol type=\"1\"><li style=\"margin-left:32.07pt;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span style=\"font-weight:bold\">बैंकिंग क्षेत्र</span><span> </span><span style=\"font-family:Arial\">→</span><span> खराब ऋणों के कारण </span><span style=\"font-weight:bold\">गैर</span><span>-निष्पादित संपत्तियों (NPAs) से बोझिल।</span></li><li style=\"margin-left:32.07pt;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span style=\"font-weight:bold\">कॉर्पोरेट क्षेत्र</span><span> </span><span style=\"font-family:Arial\">→</span><span> अत्यधिक ऋणग्रस्त कंपनियाँ ऋण चुकाने के लिए संघर्ष कर रही हैं।</span></li></ol></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह स्थिति भारत में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">2010 के दशक</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के दौरान प्रमुखता से उभरी, जब आक्रामक कॉर्पोरेट उधार (विशेषकर बुनियादी ढाँचे और बिजली क्षेत्रों में) चूक का कारण बना, जिसने बदले में बैंकों की बैलेंस शीट को कमजोर कर दिया।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इस समस्या ने एक दुष्चक्र पैदा किया:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:47pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">कमजोर कॉर्पोरेट्स </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> ऋण चूक </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> तनावग्रस्त बैंक।</span></li><li style=\"margin-left:47pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">तनावग्रस्त बैंक </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> कम उधार </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> कॉर्पोरेट्स पुनर्जीवित होने में असमर्थ।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">दिवाला और दिवालियापन संहिता (IBC), 2016</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> और सार्वजनिक क्षेत्र के बैंकों का पुनर्पूंजीकरण इस मुद्दे को हल करने के लिए प्रमुख नीतिगत प्रतिक्रियाएँ थीं।</span></li></ul>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केंद्रीय बजट 2026-27 के अनुसार, कंटेनर विनिर्माण के लिए नव प्रस्तावित योजना का पाँच वर्षों में कितना परिव्यय है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">₹5,000 करोड़</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">₹10,000 करोड़</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt op:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राज्यपाल</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प D — राज्यपाल</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">भारतीय संविधान के </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 213</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के तहत, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राज्य के राज्यपाल</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> को तब </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अध्यादेश जारी करने</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का अधिकार है जब </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राज्य विधानमंडल सत्र में न हो</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इन अध्यादेशों का </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">वही बल होता है जो राज्य विधानमंडल द्वारा पारित कानूनों का होता है</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, लेकिन इन्हें विधानमंडल द्वारा </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पुनः समवेत होने के छह सप्ताह</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के भीतर अनुमोदित किया जाना चाहिए, अन्यथा ये निरस्त हो जाते हैं।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह प्रावधान सुनिश्चित करता है कि विधानमंडल के अवकाश के दौरान भी </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राज्य स्तर पर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> तत्काल विधायी कार्रवाई की जा सके।</span></li></ul>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनौपचारिक 'पॉकेट वीटो', जहां राष्ट्रपति किसी विधेयक पर न तो हस्ताक्षर करते हैं, न अस्वीकार करते हैं और न ही वापस भेजते हैं, राष्ट्रपति ज़ैल सिंह ने किस विधेयक के संबंध में उल्लेखनीय रूप से इसका प्रयोग किया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नागरिकता संशोधन विधेयक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय डाकघर विधेयक</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सूचना का अधिकार विधेयक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जीएसटी संशोधन विधेयक</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प B — भारतीय डाकघर विधेयक</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पॉकेट वीटो</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> की अवधारणा उस स्थिति को संदर्भित करती है जहां भारत का राष्ट्रपति संसद द्वारा पारित किसी विधेयक को न तो सहमति देता है, न अस्वीकार करता है और न ही वापस भेजता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">अमेरिकी संविधान के विपरीत, भारतीय संविधान में पॉकेट वीटो का स्पष्ट रूप से उल्लेख नहीं है, लेकिन यह व्यवहार में मौजूद है क्योंकि राष्ट्रपति के लिए किसी विधेयक पर कार्रवाई करने के लिए </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कोई समय सीमा निर्धारित नहीं</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राष्ट्रपति ज़ैल सिंह (1982-1987)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> ने </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भारतीय डाकघर (संशोधन) विधेयक, 1986</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के संबंध में इस अनौपचारिक वीटो का उल्लेखनीय रूप से प्रयोग किया था।</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इस विधेयक का उद्देश्य सार्वजनिक सुरक्षा और राष्ट्रीय सुरक्षा के हित में डाक वस्तुओं को रोकने और हिरासत में लेने के लिए सरकार को व्यापक शक्तियां प्रदान करना था।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">ज़ैल सिंह ने, प्रधान मंत्री राजीव गांधी के साथ राजनीतिक तनाव का सामना करते हुए, विधेयक पर कार्रवाई न करने का विकल्प चुना, जिससे यह अनिश्चित काल के लिए प्रभावी रूप से रुक गया।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भारत में पॉकेट वीटो</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का सबसे अधिक उद्धृत उदाहरण बना हुआ है।</span></li></ul>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दिवालियापन कानून सुधार समिति, जिसने उस ढांचे की सिफारिश की थी जिसे बाद में दिवालियापन और दिवालियापन संहिता के रूप में अधिनियमित किया गया, की अध्यक्षता किसके द्वारा की गई थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एन.के. सिंह</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उर्जित पटेल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">टी.के. विश्वनाथन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रघुराम राजन</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प C — टी.के. विश्वनाथन</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">दिवालियापन कानून सुधार समिति (BLRC)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का गठन भारत सरकार द्वारा </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">2014</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में किया गया था।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इसकी अध्यक्षता पूर्व </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">केंद्रीय कानून सचिव</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">टी.के. विश्वनाथन</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> ने की थी।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">समिति की सिफारिशों ने </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">दिवालियापन और दिवालियापन संहिता (IBC), 2016</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का आधार बनाया, जिसने भारत के दिवालियापन ढांचे को समेकित और आधुनिक बनाया।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">BLRC के प्रमुख योगदान:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">समय</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">बद्ध दिवालियापन समाधान प्रक्रिया का प्रस्ताव।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भारतीय दिवालियापन और दिवालियापन बोर्ड (IBBI)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का निर्माण।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">निर्णायक प्राधिकरण के रूप में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राष्ट्रीय कंपनी कानून न्यायाधिकरण (NCLT)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> की स्थापना।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">दिवालियापन पेशेवरों</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> और </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सूचना उपयोगिताओं</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के लिए ढाँचा।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सिक्स डिग्री चैनल भारत के सबसे दक्षिणी द्वीप, ग्रेट निकोबार को किस देश से अलग करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इंडोनेशिया</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">म्यांमार</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">श्रीलंका</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">थाईलैंड</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प A — इंडोनेशिया</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सिक्स डिग्री चैनल</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">हिंद महासागर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ग्रेट निकोबार द्वीप</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (भारत का सबसे दक्षिणी द्वीप) के दक्षिण में स्थित है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ग्रेट निकोबार (भारत)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> को </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सुमात्रा (इंडोनेशिया)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> से अलग करता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">स्थान: लगभग </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">6° उत्तरी अक्षांश</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> पर, इसलिए इसका यह नाम है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">सामरिक महत्व:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह एक महत्वपूर्ण अंतर्राष्ट्रीय समुद्री संचार मार्ग है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">भारत की समुद्री सुरक्षा और व्यापार मार्गों के लिए महत्वपूर्ण है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">ग्रेट निकोबार की इस चैनल से निकटता इसे भू-राजनीतिक रूप से महत्वपूर्ण बनाती है, खासकर भारत की प्रस्तावित </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ग्रेट निकोबार ट्रांसशिपमेंट पोर्ट परियोजना</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के साथ।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन कंपाइलर और इंटरप्रेटर के बीच मौलिक अंतर का सबसे अच्छा वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दोनों बिना अनुवाद के कोड को पंक्ति दर पंक्ति निष्पादित करते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक कंपाइलर कोड को पंक्ति दर पंक्ति निष्पादित करता है; एक इंटरप्रेटर पहले पूरे प्रोग्राम का अनुवाद करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दोनों निष्पादन से पहले पूरे प्रोग्राम का अनुवाद करते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक कंपाइलर निष्पादन से पहले पूरे प्रोग्राम का अनुवाद करता है; एक इंटरप्रेटर निष्पादन के दौरान लाइन-बाय-लाइन अनुवाद करता है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प D — एक कंपाइलर निष्पादन से पहले पूरे प्रोग्राम का अनुवाद करता है; एक इंटरप्रेटर निष्पादन के दौरान लाइन-बाय-लाइन अनुवाद करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कंपाइलर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">निष्पादन से पहले</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पूरे सोर्स कोड</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> को मशीन कोड में अनुवादित करता है।</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">एक स्वतंत्र निष्पादन योग्य फ़ाइल उत्पन्न करता है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">एक बार कंपाइल होने के बाद निष्पादन तेज़ होता है, लेकिन त्रुटियाँ केवल संकलन के बाद ही रिपोर्ट की जाती हैं।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">इंटरप्रेटर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> प्रोग्राम को </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">रनटाइम पर लाइन-बाय-लाइन</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> अनुवादित और निष्पादित करता है।</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">कोई अलग निष्पादन योग्य फ़ाइल नहीं बनाई जाती है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">डीबगिंग के लिए आसान है क्योंकि त्रुटियाँ निष्पादन के दौरान तुरंत पकड़ी जाती हैं।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नौवीं अनुसूची को मूल रूप से प्रथम संशोधन अधिनियम, 1951 द्वारा संविधान में शामिल किया गया था, जिसका प्राथमिक उद्देश्य कानूनों की किस श्रेणी को न्यायिक समीक्षा से बचाना था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आयकर से संबंधित कानून</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">शिक्षा में आरक्षण से संबंधित कानून</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भूमि सुधार और ज़मींदारी उन्मूलन कानून</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रक्षा खरीद से संबंधित कानून</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प C — भूमि सुधार और ज़मींदारी उन्मूलन कानून</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">नौवीं अनुसूची</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> को </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">प्रथम संवैधानिक संशोधन अधिनियम, 1951</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> द्वारा जोड़ा गया था।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">उद्देश्य: </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भूमि सुधार कानूनों</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (विशेषकर </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ज़मींदारी उन्मूलन अधिनियमों</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">) को मौलिक अधिकारों के उल्लंघन के आधार पर अदालतों में चुनौती दिए जाने से बचाना।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">संदर्भ:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">प्रारंभिक भूमि सुधार उपायों को न्यायिक चुनौतियों का सामना करना पड़ा, विशेष रूप से </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">संपत्ति के अधिकार</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (तब एक मौलिक अधिकार) के तहत।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">कृषि सुधारों के सुचारू कार्यान्वयन को सुनिश्चित करने के लिए, कानूनों को नौवीं अनुसूची में रखा गया था।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">अनुच्छेद </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">31B</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> पेश किया गया था, जिसमें कहा गया था कि नौवीं अनुसूची में शामिल कानूनों को मौलिक अधिकारों का उल्लंघन करने के लिए अमान्य नहीं किया जा सकता है।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कोठारी आयोग भारत में मुख्य रूप से किस विषय से संबंधित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न्यायिक सुधार</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चुनावी सुधार</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पुलिस सुधार</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">शिक्षा सुधार</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प D — शिक्षा सुधार</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt; \">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> उच्च माध्यमिक </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> डिग्री) का सुझाव।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">व्यावसायिक शिक्षा</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> और </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">शिक्षक प्रशिक्षण</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> पर ध्यान।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">शिक्षा के माध्यम से राष्ट्रीय एकता</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> की आवश्यकता पर बल दिया।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इसकी रिपोर्ट ने भारत की पहली शिक्षा नीति, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राष्ट्रीय शिक्षा नीति, 1968</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> की नींव रखी।</span></li></ul>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भू-राजस्व बंदोबस्त की रैयतवाड़ी व्यवस्था, जिसके तहत राज्य ने सीधे व्यक्तिगत कृषकों के साथ राजस्व का निर्धारण किया, मुख्य रूप से किन क्षेत्रों में शुरू की गई थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मध्य प्रांत और बरार</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बंगाल और बिहार</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\" :'Nirmala UI'\"> को भू-धारक के रूप में मान्यता दी गई थी।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">राजस्व का निर्धारण </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सीधे किसान और सरकार के बीच</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> किया जाता था, जिसमें जमींदारों जैसे बिचौलियों को बाईपास किया जाता था।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">मांग </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भूमि के वास्तविक उत्पादन</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> पर आधारित थी, जिसे समय-समय पर संशोधित किया जाता था।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इस व्यवस्था को </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">स्थायी बंदोबस्त</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (बंगाल) और </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">महालवाड़ी व्यवस्था</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (उत्तर-पश्चिमी प्रांत) की तुलना में अधिक लचीला माना जाता था।</span></li></ul>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ग्रेफीन, कार्बन का एक एकल-परत षट्कोणीय जाली अपररूप, ने किस वर्ष भौतिकी में नोबेल पुरस्कार दिलाया, जो आंद्रे गीम और कॉन्स्टेंटिन नोवोसेलोव को प्रदान किया गया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2005</span></p>", "option3": " <p style=\"margin-top:0pt;margin-b ont-weight:bold;font-family:'Nirmala UI'\">एक परमाणु जितना मोटा</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> है फिर भी अत्यधिक मजबूत है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">असाधारण विद्युत चालकता</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> और </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">तापीय गुण</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> दर्शाता है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इसके </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">इलेक्ट्रॉनिक्स, नैनोटेक्नोलॉजी, ऊर्जा भंडारण, और पदार्थ विज्ञान</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में संभावित अनुप्रयोग हैं।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">नोबेल समिति ने उनके “द्वि-आयामी सामग्री ग्रेफीन के संबंध में अभूतपूर्व प्रयोगों” को मान्यता दी।</span></li></ul>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दक्कन ट्रैप, प्रायद्वीपीय भारत के अधिकांश भाग को आच्छादित करने वाला एक विशाल आग्नेय प्रांत, मुख्य रूप से किस भूवैज्ञानिक सीमा के आसपास हुई तीव्र ज्वालामुखी गतिविधि द्वारा निर्मित हुआ था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जुरैसिक-क्रिटेशियस सीमा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पर्मियन-ट्राइएसिक सीमा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirma ;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">₹40,000 करोड़</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">केंद्रीय बजट 2026-27</span><span style=\"font-family:'Nirmala UI'\"> के अनुसार, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">इलेक्ट्रॉनिक्स कंपोनेंट्स मैन्युफैक्चरिंग स्कीम (ECMS)</span><span style=\"font-family:'Nirmala UI'\"> का परिव्यय बढ़ाकर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">₹40,000 करोड़</span><span style=\"font-family:'Nirmala UI'\"> कर दिया गया।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुख्य बिंदु:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मूल परिव्यय</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">: ECMS को </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अप्रैल 2025</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">₹22,919 करोड़</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (लगभग USD 2.7 बिलियन) के प्रारंभिक परिव्यय के साथ लॉन्च किया गया था।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बजट 2026-27 की घोषणा</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">: वित्त मंत्री </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">निर्मला सीतारमण</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> ने परिव्यय को बढ़ाकर </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">₹40,000 करोड़</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> करने का प्रस्ताव रखा, जो मूल आवंटन से लगभग </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">75% की वृद्धि</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (लगभग दोगुना) दर्शाता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">वृद्धि का कारण</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">: इस योजना को पहले ही </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मूल लक्ष्य से दोगुना</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> निवेश प्रतिबद्धताएं (₹59,350 करोड़ के लक्ष्य के मुकाबले ₹1.15 लाख करोड़) मिल चुकी थीं, जिससे सरकार को इस गति का लाभ उठाने के लिए प्रोत्साहन मिला।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उद्देश्य</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">: इस वृद्धि का उद्देश्य भारत की घरेलू इलेक्ट्रॉनिक्स विनिर्माण क्षमता को गहरा करना है, विशेष रूप से डिस्प्ले मॉड्यूल, कैमरा मॉड्यूल और PCBA जैसे उच्च-सटीक घटकों के लिए, और अर्धचालक तथा इलेक्ट्रॉनिक्स पारिस्थितिकी तंत्र को मजबूत करना है।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह कदम भारत को एक वैश्विक इलेक्ट्रॉनिक्स विनिर्माण केंद्र के रूप में स्थापित करने और महत्वपूर्ण इलेक्ट्रॉनिक घटकों के लिए आयात पर निर्भरता कम करने की सरकार की व्यापक रणनीति का हिस्सा है।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Ni
