-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह लगभग </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">5,328 मीटर (17,480 फीट)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> की ऊंचाई पर स्थित, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">दुनिया के सबसे ऊंचे मोटर योग्य पहाड़ी दर्रों</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में से एक होने के लिए उल्लेखनीय है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह दर्रा रणनीतिक रूप से महत्वपूर्ण है, लेह को हिमाचल प्रदेश से जोड़ता है, और साहसिक पर्यटन के लिए भी एक लोकप्रिय मार्ग है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इसकी ऊंचाई इसे एक चुनौतीपूर्ण ड्राइव बनाती है, लेकिन यह सैन्य रसद और नागरिक यात्रा दोनों के लिए एक महत्वपूर्ण कड़ी बनी हुई है।</span></li></ul>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संविधान के अनुच्छेद 112 के तहत संसद के दोनों सदनों के समक्ष वार्षिक वित्तीय विवरण प्रस्तुत करने की जिम्मेदारी किसके पास है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वित्त मंत्री</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रधानमंत्री</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राष्ट्रपति</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के मुख्य न्यायाधीश</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प C — राष्ट्रपति</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">भारतीय संविधान के </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 112</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के तहत, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">वार्षिक वित्तीय विवरण (AFS)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, जिसे आमतौर पर </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">केंद्रीय बजट</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के नाम से जाना जाता है, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भारत के राष्ट्रपति द्वारा संसद के दोनों सदनों के समक्ष रखा जाना</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> अनिवार्य है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">राष्ट्रपति इस विवरण को प्रस्तुत करने की </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">संवैधानिक जिम्मेदारी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> रखते हैं, हालांकि व्यवहार में, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">वित्त मंत्री</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> ही राष्ट्रपति की ओर से संसद में बजट भाषण देते हैं।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">AFS में शामिल हैं:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">आगामी वित्तीय वर्ष के लिए </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राजस्व और व्यय</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का अनुमान।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भारित व्यय</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (जो मतदान के अधीन नहीं है) और </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मतदान योग्य व्यय</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का विवरण।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">विभिन्न मंत्रालयों, योजनाओं और विकास कार्यक्रमों के लिए आवंटन।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बाल गंगाधर तिलक ने किस मराठी समाचार पत्र का संपादन किया था, जो उग्र राष्ट्रवादी विचारों का एक प्रमुख मुखपत्र बन गया?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अमृत बाजार पत्रिका</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केसरी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यंग इंडिया</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हरिजन</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प B — केसरी</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बाल गंगाधर तिलक</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (1856–1920), जिन्हें </span><span style=\"font-size:12pt;font-style:italic;font-family:'Nirmala UI'\">लोकमान्य तिलक</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के नाम से जाना जाता है, भारतीय स्वतंत्रता संग्राम के एक प्रमुख राष्ट्रवादी और उग्रवादी नेता थे।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">उन्होंने </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मराठी समाचार पत्र </span><span style=\"font-size:12pt;font-weight:bold;font-style:italic;font-family:'Nirmala UI'\">केसरी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का संपादन किया, जो </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उग्र राष्ट्रवाद</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का एक शक्तिशाली मुखपत्र बन गया।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-style:italic;font-family:'Nirmala UI'\">केसरी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के माध्यम से, तिलक ने </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">स्वराज (स्व</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">शासन) के विचारों का प्रसार किया, ब्रिटिश नीतियों की आलोचना की और जनता को संगठित किया।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">उन्होंने अंग्रेजी समाचार पत्र </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">महारत्ता</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का भी संपादन किया, लेकिन </span><span style=\"font-size:12pt;font-style:italic;font-family:'Nirmala UI'\">केसरी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> मराठी भाषी जनता के बीच अधिक प्रभावशाली था।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">उनके लेखन ने उन्हें अंग्रेजों से </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">“भारतीय अशांति के जनक”</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> की उपाधि दिलाई।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का मूल्यांकन</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अमृत बाजार पत्रिका </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> सिसिर कुमार घोष और मोतीलाल घोष द्वारा संपादित, बंगाल में आधारित।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt; उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प C — माइक्रोप्रोसेसर</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कंप्यूटर की चौथी पीढ़ी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (1970 के दशक से) </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">माइक्रोप्रोसेसरों</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के आगमन से अलग की जाती है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">एक </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">माइक्रोप्रोसेसर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> हजारों </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">एकीकृत परिपथों (ICs)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> को एक ही सिलिकॉन चिप में एकीकृत करता है, जो </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सीपीयू</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के रूप में कार्य करता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इस नवाचार ने कंप्यूटरों को बनाया:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">छोटे और अधिक पोर्टेबल</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">तेज और अधिक कुशल</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">किफायती और व्यक्तियों के लिए सुलभ (पर्सनल कंप्यूटर युग)</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों का मूल्यांकन</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">वैक्यूम ट्यूब </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पहली पीढ़ी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के कंप्यूटरों (1940-50 के दशक) में उपयोग किए जाते थे।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ट्रांजिस्टर </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">दूसरी पीढ़ी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के कंप्यूटरों (1950-60 के दशक) में उपयोग किए जाते थे।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">एकीकृत परिपथ </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">तीसरी पीढ़ी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के कंप्यूटरों (1960-70 के दशक) में उपयोग किए जाते थे।</span></li></ul>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 368 के तहत, संघीय प्रावधानों (जैसे राष्ट्रपति का चुनाव या राज्यों का प्रतिनिधित्व) को प्रभावित करने वाले एक संवैधानिक संशोधन विधेयक के लिए _______ द्वारा अनुसमर्थन की आवश्यकता होती है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कम से कम आधे राज्य विधानमंडलों द्वारा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कम से कम दो-तिहाई राज्य विधानमंडलों द्वारा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सभी राज्य विधानमंडलों द्वारा सर्वसम्मति से</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कम से कम एक-तिहाई राज्य विधानमंडलों द्वारा</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प A — कम से कम आधे राज्य विधानमंडलों द्वारा</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 368</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के तहत, संवैधानिक संशोधनों को तीन श्रेणियों में वर्गीकृत किया गया है:</span><ol type=\"1\"><li style=\"margin-left:32.07pt;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span style=\"font-weight:bold\">साधारण बहुमत द्वारा</span><span> (उदाहरण के लिए, नए राज्यों का निर्माण)।</span></li><li style=\"margin-left:32.07pt;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span style=\"font-weight:bold\">संसद के विशेष बहुमत द्वारा</span><span> (उदाहरण के लिए, अधिकांश प्रावधान)।</span></li><li style=\"margin-left:32.07pt;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span style=\"font-weight:bold\">संसद के विशेष बहुमत + राज्यों द्वारा अनुसमर्थन द्वारा</span><span> (संघीय प्रावधानों के लिए)।</span></li></ol></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">संघीय प्रावधानों में शामिल हैं:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:47pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राष्ट्रपति का चुनाव</span></li><li style=\"margin-left:47pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">संसद में राज्यों का प्रतिनिधित्व</span></li><li style=\"margin-left:47pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">संघ और राज्यों के बीच विधायी शक्तियों का वितरण</span></li><li style=\"margin-left:47pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">संघीय संरचना को प्रभावित करने वाला कोई भी प्रावधान</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">ऐसे संशोधनों के लिए, विधेयक को राष्ट्रपति की सहमति के लिए प्रस्तुत करने से पहले </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कम से कम आधे</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> राज्य विधानमंडलों द्वारा अनुसमर्थन की आवश्यकता होती है।</span></li></ul>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">'बेस इरोजन एंड प्रॉफिट शिफ्टिंग' (BEPS), एक OECD-नेतृत्व वाली पहल जिसके लिए भारत ने प्रतिबद्धता जताई है, मुख्य रूप से _______ से संबंधित है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मुद्रा हेरफेर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सरकारी उधारियाँ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">व्यापार शुल्क</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कर से बचाव</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प D — कर से बचाव</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बेस इरोजन एंड प्रॉफिट शिफ्टिंग (BEPS)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">OECD (आर्थिक सहयोग और विकास संगठन)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> और </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">G20</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के नेतृत्व वाली एक पहल है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह बहुराष्ट्रीय निगमों द्वारा उच्च-कर क्षेत्राधिकारों से निम्न-कर या शून्य-कर क्षेत्राधिकारों में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लाभ स्थानांतरित करने</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> की रणनीतियों को संबोधित करता है, जिससे उस देश के </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कर आधार को कमजोर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> किया जाता है जहाँ वास्तविक आर्थिक गतिविधि होती है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">सामान्य BEPS प्रथाओं में शामिल हैं:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">स्थानांतरण मूल्य निर्धारण में हेरफेर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (अंतर-समूह लेनदेन के माध्यम से कृत्रिम रूप से लाभ स्थानांतरित करना)।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">संधि शॉपिंग</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (देनदारियों को कम करने के लिए कर संधियों का उपयोग करना)।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span s </span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मादिगा डप्पू</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> आंध्र प्रदेश का एक पारंपरिक </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लोक संगीत रूप</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> है, जो </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मादिगा समुदाय</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (एक दलित उपजाति) से निकटता से जुड़ा है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-style:italic;font-family:'Nirmala UI'\">डप्पू</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> शब्द लकड़ी और चमड़े से बने एक </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ताल वाद्य यंत्र (ढोल)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> को संदर्भित करता है, जिसे छड़ियों से बजाया जाता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इसका उपयोग इसमें किया जाता है:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">सामुदायिक समारोहों और त्योहारों में</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">सामाजिक और सांस्कृतिक लामबंदी में</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">लोक प्रदर्शनों और विरोध आंदोलनों में</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style= -family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कंपाइलर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">निष्पादन से पहले</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पूरे सोर्स कोड</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> को मशीन कोड में अनुवादित करता है।</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">एक स्वतंत्र निष्पादन योग्य फ़ाइल बनाता है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">एक बार कंपाइल होने के बाद निष्पादन तेज़ होता है, लेकिन त्रुटियाँ केवल संकलन के बाद ही रिपोर्ट की जाती हैं।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">इंटरप्रेटर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">रनटाइम पर लाइन-बाय-लाइन</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> प्रोग्राम का अनुवाद और निष्पादन करता है।</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;f ल्ड फेडरेशन (BWF)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> द्वारा आयोजित किए जाते हैं और बैडमिंटन में सबसे प्रतिष्ठित टीम स्पर्धाएं माने जाते हैं।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">भारत ने </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">2022 में अपना पहला थॉमस कप</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> जीतकर इतिहास रचा, जिसमें फाइनल में इंडोनेशिया को हराया।</span></li></ul>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">RBI के लचीले मुद्रास्फीति लक्ष्यीकरण ढांचे के तहत, मुद्रास्फीति के लक्ष्य माप के रूप में आधिकारिक तौर पर किस सूचकांक का उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जीडीपी डिफ्लेटर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">थोक मूल्य सूचकांक (WPI)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उपभोक्ता मूल्य सूचकांक (CPI)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उत्पादक मूल्य सूचकांक (PPI)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प C — उपभोक्ता मूल्य सूचकांक (CPI)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">भारत में अपनाए गए </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लचीले मुद्रास्फीति लक्ष्यीकरण ढांचे</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">RBI अधिनियम संशोधन, 2016</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के माध्यम से) के तहत, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भारतीय रिज़र्व बैंक (RBI)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> आधिकारिक तौर पर </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उपभोक्ता मूल्य सूचकांक (CPI)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> को मुद्रास्फीति के माप के रूप में उपयोग करता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मौद्रिक नीति समिति (MPC)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> CPI मुद्रास्फीति को </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">4%</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> पर लक्षित करती है, जिसमें </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">±2% (अर्थात्, 2%–6%)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का सहिष्णुता बैंड होता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">CPI क्यों?</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">CPI </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">खुदरा मुद्रास्फीति</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> को दर्शाता है, अर्थात्, परिवारों के लिए रहने की लागत।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह WPI या जीडीपी डिफ्लेटर की तुलना में आम जनता द्वारा अनुभव की जाने वाली मुद्रास्फीति का अधिक प्रतिनिधि है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह मुद्रास्फीति लक्ष्यीकरण के लिए वैश्विक सर्वोत्तम प्रथाओं के अनुरूप है।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">GST परिषद, जिसमें केंद्र और राज्य दोनों सरकारों का मतदान प्रतिनिधित्व होता है, को अक्सर किस संवैधानिक अवधारणा के एक प्रमुख उदाहरण के रूप में उद्धृत किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सहकारी संघवाद</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अर्ध-एकात्मक शासन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दोहरा संघवाद</span><span style=\"font-family:'Nirmala UI'\">  </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संसदीय संप्रभुता</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प A — सहकारी संघवाद</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">GST परिषद</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> की स्थापना संविधान के </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 279A</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के तहत की गई थी।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इसमें दोनों से प्रतिनिधित्व शामिल है:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">केंद्र सरकार</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> वित्त मंत्री (अध्यक्ष) + केंद्रीय वित्त राज्य मंत्री।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राज्य सरकारें</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> सभी राज्यों और विधानमंडलों वाले केंद्र शासित प्रदेशों के वित्त/कराधान मंत्री।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">निर्णय </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भारित मतदान प्रणाली</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">⅓</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> केंद्र, </span><span style=\"font-size:12pt;font-family:'Cambria Math'\">⅔</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> राज्य) द्वारा लिए जाते हैं, जिसके लिए </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">¾ बहुमत</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> की आवश्यकता होती है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह व्यवस्था </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सहकारी संघवाद</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का उदाहरण है, जहाँ केंद्र और राज्य सरकारें अलग-थलग कार्य करने के बजाय </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राजकोषीय निर्णय लेने में मिलकर काम करती हैं</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">।</span></li></ul>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">महाबलीपुरम में प्रसिद्ध संरचनात्मक पत्थर का शोर मंदिर किस पल्लव शासक के शासनकाल के दौरान बनाया गया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">महेंद्रवर्मन प्रथम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नरसिंहवर्मन द्वितीय</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नंदीवर्मन द्वितीय</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सिंहविष्णु</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प B — नरसिंहवर्मन द्वितीय</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">महाबलीपुरम का शोर मंदिर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (तमिलनाडु) </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पल्लव वास्तुकला</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के सबसे प्रतिष्ठित उदाहरणों में से एक है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इसका निर्माण </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पल्लव शासक नरसिंहवर्मन द्वितीय (राजसिम्हा)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के शासनकाल के दौरान </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">7वीं-8वीं शताब्दी ईस्वी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में किया गया था।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">विशेषताएँ:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">ग्रेनाइट का उपयोग करके </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">द्रविड़ शैली</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में निर्मित।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भगवान शिव</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> और </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भगवान विष्णु</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> को समर्पित।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">महाबलीपुरम में स्मारकों के समूह</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का एक हिस्सा है, जो एक यूनेस्को विश्व धरोहर स्थल है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह अपने तटीय स्थान के लिए जाना जाता है, जो बंगाल की खाड़ी के सामने एक प्रहरी के रूप में खड़ा है।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अंडमान और निकोबार द्वीप समूह में स्थित बैरन द्वीप, भारत का एकमात्र _________ होने के लिए महत्वपूर्ण है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्राकृतिक बंदरगाह द्वीप</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अपतटीय प्रवाल एटोल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पुष्टि किया गया सक्रिय ज्वालामुखी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मीठे पानी की झील का द्वीप</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प C — पुष्टि किया गया सक्रिय ज्वालामुखी</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बैरन द्वीप</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> बंगाल की खाड़ी में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अंडमान और निकोबार द्वीप समूह</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में स्थित है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भारत का एकमात्र पुष्टि किया गया सक्रिय ज्वालामुखी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> होने के लिए महत्वपूर्ण है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">पहली बार दर्ज विस्फोट: </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1787</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">बाद के विस्फोट: </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1991</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1994-95</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">2005</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, और </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">2017</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> से रुक-रुक कर गतिविधि।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह द्वीप निर्जन है, जिसमें शोधकर्ता और पर्यटक नाव से कभी-कभार ही आते हैं।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इसकी ज्वालामुखी गतिविधि </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भारतीय और बर्मीज़ प्लेटों के सबडक्शन ज़ोन</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का हिस्सा है।</span></li></ul>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अग्नाशय की बीटा कोशिकाओं द्वारा स्रावित इंसुलिन, मुख्य रूप से रक्त शर्करा को नियंत्रित करता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यकृत से ग्लूकोज के स्राव को बढ़ाना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">शरीर की कोशिकाओं में ग्लूकोज के अवशोषण को बढ़ावा देना</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रोटीन को ग्लूकोज में तोड़ना</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गुर्दे में पानी के अवशोषण को कम करना</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प B — शरीर की कोशिकाओं में ग्लूकोज के अवशोषण को बढ़ावा देना</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">इंसुलिन</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> अग्नाशय की </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">β</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">-कोशिकाओं</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (लैंगरहैंस के आइलेट्स) द्वारा स्रावित होता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इसकी </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">प्राथमिक भूमिका</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">रक्त शर्करा के स्तर को कम करना</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> है:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">मांसपेशियों और वसा कोशिकाओं में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ग्लूकोज के अवशोषण</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> को बढ़ावा देना।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यकृत और मांसपेशियों में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ग्लाइकोजन संश्लेषण</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> को उत्तेजित करना।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यकृत में ग्लूकोज उत्पादन (ग्लूकोनियोजेनेसिस) को रोकना।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कौन सी वायुमंडलीय परत सीधे समताप मंडल (Stratosphere) के ऊपर स्थित है और जिसमें ऊंचाई के साथ तापमान लगभग -90°C तक घटता जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">क्षोभमंडल (Troposphere)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तापमंडल (Thermosphere)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मध्यमंडल (Mesosphere)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बाह्यमंडल (Exosphere)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प C — मध्यमंडल (Mesosphere)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मध्यमंडल (Mesosphere)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> सीधे </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">समताप मंडल (Stratosphere) के ऊपर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> स्थित है और पृथ्वी की सतह से लगभग </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">50 किमी से 80–85 किमी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> तक फैला हुआ है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इस परत में, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ऊंचाई के साथ तापमान घटता जाता है</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, जो </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मेसोपॉज़ (मध्यमंडल और तापमंडल के बीच की सीमा) के पास</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">−90°C</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> तक पहुँच जाता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">मुख्य विशेषताएं:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">सबसे ठंडी वायुमंडलीय परत।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">वायु के अणुओं के साथ घर्षण के कारण उल्कापिंड यहीं जल जाते हैं।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">बहुत अधिक ऊंचाई पर नोक्टिलुसेंट बादल होते हैं।</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्प मूल्यांकन</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">क्षोभमंडल (Troposphere) </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> सबसे निचली परत; ऊंचाई के साथ तापमान घटता है लेकिन यह समताप मंडल के नीचे स्थित है, ऊपर नहीं।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">तापमंडल (Thermosphere) </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> मध्यमंडल के ऊपर स्थित है; सौर विकिरण अवशोषण के कारण ऊंचाई के साथ तापमान तेजी से बढ़ता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बाह्यमंडल (Exosphere) </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> सबसे बाहरी परत; अंतरिक्ष में विलीन हो जाती है, तापमान में कमी की विशेषता नहीं है।</span></li></ul>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1942 के क्रिप्स मिशन को भारतीय राष्ट्रीय कांग्रेस ने मुख्य रूप से इसलिए अस्वीकार कर दिया था क्योंकि यह निम्नलिखित में से किसे प्रदान करने में विफल रहा था:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ब्रिटिश सैनिकों की वापसी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अल्पसंख्यकों के लिए आरक्षित सीटें</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नमक कर का उन्मूलन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सत्ता का तत्काल हस्तांतरण</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प D — सत्ता का तत्काल हस्तांतरण।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">क्रिप्स मिशन, 1942</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> को द्वितीय विश्व युद्ध के दौरान भारतीय सहयोग प्राप्त करने के लिए ब्रिटिश सरकार द्वारा भेजा गया था।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इसने पेशकश की:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">युद्ध के बाद भारत के लिए डोमिनियन दर्जा।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">प्रांतों के लिए भारतीय संघ से बाहर निकलने का प्रावधान।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">संविधान बनाने के लिए एक संविधान सभा।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कांग्रेस ने इसे क्यों अस्वीकार किया:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">योजना ने </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सत्ता के तत्काल हस्तांतरण का वादा नहीं किया</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> था; स्वतंत्रता को युद्ध के बाद तक के लिए टाल दिया गया था।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इसने प्रांतों को </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अलग होने</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> की अनुमति दी, जिससे राष्ट्रीय एकता को खतरा था।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">गांधी ने इसे प्रसिद्ध रूप से </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">“एक ध्वस्त होते बैंक का पोस्ट-डेटेड चेक”</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> कहा था।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संविधान के तहत निम्नलिखित में से कौन सा मौलिक अधिकार केवल नागरिकों को प्राप्त है, न कि विदेशी नागरिकों को?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 14 (कानून के समक्ष समानता)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 19 (भाषण, सभा आदि की स्वतंत्रताएँ)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 21 (जीवन का अधिकार)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 25 (धर्म की स्वतंत्रता)</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प B — अनुच्छेद 19 (भाषण, सभा आदि की स्वतंत्रताएँ)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 14</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-style:italic;font-family:'Nirmala UI'\">कानून के समक्ष समानता</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> और </span><span style=\"font-size:12pt;font-style:italic;font-family:'Nirmala UI'\">कानूनों का समान संरक्षण</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">नागरिकों और विदेशियों दोनों</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के लिए उपलब्ध है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 19</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> छह स्वतंत्रताएँ प्रदान करता है (भाषण, सभा, संघ, आवागमन, निवास, पेशा) </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">केवल नागरिकों</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के लिए उपलब्ध है, विदेशियों के लिए नहीं।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 21</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-style:italic;font-family:'Nirmala UI'\">जीवन और व्यक्तिगत स्वतंत्रता का अधिकार</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सभी व्यक्तियों</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, नागरिकों और विदेशियों के लिए समान रूप से उपलब्ध है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 25</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-style:italic;font-family:'Nirmala UI'\">अंतरात्मा और धर्म की स्वतंत्रता</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सभी व्यक्तियों</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, नागरिकों और विदेशियों के लिए उपलब्ध है।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">“दिए गए विकल्पों में, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 19 एकमात्र मौलिक अधिकार है जो विशेष रूप से नागरिकों के लिए उपलब्ध है।</span><span style=\"font-family:'Nirmala UI'\">”</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किस ग्रैंड मास्टर (GM) ने नॉर्वे शतरंज 2026 जीता?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Dommaraju Gukesh</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Javokhir Sindarov</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Rameshbabu Praggnanandhaa</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Wesly So खने का एक व्यापक क्षेत्र</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> कैप्चर कर सकता है, जिससे चालकों को सड़क और उनके पीछे के वाहनों को अधिक देखने में मदद मिलती है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह गुण उत्तल दर्पणों को वाहनों में सुरक्षा के लिए आदर्श बनाता है।</span></li></ul>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उस्ताद बड़े गुलाम अली खान, 'ठुमरी' शैली के लिए जाने जाने वाले एक प्रसिद्ध हिंदुस्तानी शास्त्रीय गायक, किस घराने से संबंधित थे?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पटियाला घराना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ग्वालियर घराना</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किराना घराना</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आगरा घराना</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प A — पटियाला घराना</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उस्ताद बड़े गुलाम अली खान</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (1902–1968) 20वीं सदी के महानतम हिंदुस्तानी शास्त्रीय गायकों में से एक थे।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">वह </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पटियाला घराना</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> से संबंधित थे, जो निम्न के लिए जाना जाता है:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">तान, गामक, और मींड</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (अलंकरण) पर जोर देने वाली समृद्ध, सुरीली शैली।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ख्याल</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ठुमरी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> जैसे हल्के रूपों के साथ संलयन, जिससे शास्त्रीय संगीत अधिक सुलभ बनता है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">सहज, भावनात्मक प्रस्तुति जो संगीत प्रेमियों और आम जनता दोनों को पसंद आई।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">बड़े गुलाम अली खान की </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ठुमरी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, विशेष रूप से </span><span style=\"font-size:12pt;font-style:italic;font-family:'Nirmala UI'\">याद पिया की आए</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> और </span><span style=\"font-size:12pt;font-style:italic;font-family:'Nirmala UI'\">का करूँ सजनी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, प्रतिष्ठित बनी हुई हैं।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">उन्हें भारतीय संगीत में उनके योगदान के लिए </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पद्म भूषण (1962)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> से सम्मानित किया गया था।</span></li></ul>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मानव विकास सूचकांक (HDI) को इसके तीन सामान्यीकृत आयामी सूचकांकों (स्वास्थ्य, शिक्षा और जीवन स्तर) के किस प्रकार के माध्य के रूप में परिकलित किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारित माध्य</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">समांतर माध्य</span><span style=\"font-family:'Nirmala UI'\">   </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गुणोत्तर माध्य</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हरात्मक माध्य</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प C — गुणोत्तर माध्य</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मानव विकास सूचकांक (HDI)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">स्वास्थ्य, शिक्षा और जीवन स्तर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का एक समग्र माप है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">2010 के संशोधन</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के बाद से, UNDP तीन सामान्यीकृत आयामी सूचकांकों के </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">गुणोत्तर माध्य</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का उपयोग करके HDI की गणना करता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">गुणोत्तर माध्य का कारण:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह एक आयाम (जैसे, आय) को दूसरे आयाम (जैसे, शिक्षा) में खराब प्रदर्शन के लिए असंगत रूप से क्षतिपूर्ति करने से रोकता है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">सभी आयामों में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">संतुलित विकास</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> सुनिश्चित करता है।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">सूत्र:</span></li></ul><p style=\"margin
