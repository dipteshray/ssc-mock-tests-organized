tral Processing Unit</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Central Peripheral Unit</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: Option C — Central Processing Unit</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The acronym </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">CPU</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> stands for </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Central Processing Unit</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It is often called the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">“brain of the computer”</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> because it performs all the major operations:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Arithmetic operations</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Addition, subtraction, multiplication, division.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Logical operations</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Comparisons (&gt;, &lt;, =) and Boolean logic (AND, OR, NOT).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Control operations</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Directs the flow of instructions and data between memory and input/output devices.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The CPU consists of:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">ALU (Arithmetic Logic Unit)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Performs calculations and logical decisions.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">CU (Control Unit)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Directs operations of the processor.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Registers</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Small, high-speed storage locations inside the CPU.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Ayushman Bharat' (PM-JAY) scheme primarily aims to provide which benefit to citizens?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Crop insurance cover</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Housing subsidy support</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Free electricity supply</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Health assurance coverage</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option D — Health assurance coverage</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ayushman Bharat – Pradhan Mantri Jan Arogya Yojana (PM-JAY)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">world’s largest government-funded health assurance/healthcare coverage scheme</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, launched in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">2018</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Objective:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> Provide </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">health insurance coverage up to ₹5 lakh per family per year</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> for </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">secondary and tertiary care hospitalization</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Target Group:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> Poor and vulnerable families identified through the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Socio-Economic Caste Census (SECC)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">. And Current PM-Jay Coverage has since been expanded, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">including all citizens aged 70 years and above irrespective of socio-economic status.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Benefits:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Cashless and paperless treatment in empaneled hospitals.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Coverage for over </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1,500 medical procedures</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Both public and private hospitals included.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Reduces </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">out-of-pocket expenditure</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> for healthcare.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rourkela Steel Plant, one of India's earliest integrated steel plants, is located in which state?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Jharkhand</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Odisha</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Chhattisgarh</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">West Bengal</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option B — Odisha</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Rourkela Steel Plant</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is located in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Rourkela, Sundargarh district, Odisha</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It was set up in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1955</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> with collaboration from </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Germany</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and became one of India’s earliest </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">integrated steel plants</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> under the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Steel Authority of India Limited (SAIL)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Key points:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Produces a wide range of steel products including hot-rolled coils, plates, and pipes.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Played a crucial role in India’s industrial development post-independence.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Known for its </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">modernization and expansion projects</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> to increase capacity and efficiency.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Jharkhand </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Famous for Bokaro Steel Plant, not Rourkela.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Chhattisgarh </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Known for Bhilai Steel Plant, not Rourkela.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">West Bengal </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Has Durgapur Steel Plant, not Rourkela.</span></li></ul>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is a Fundamental Duty listed under Article 51A of the Constitution?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria ": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option D — Original Constitution copy</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Nandalal Bose</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, a leading artist of the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bengal School of Art</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, is best remembered for </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">illustrating the original handwritten copy of the Indian Constitution (1950)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">He, along with his team of artists from Shantiniketan, decorated the Constitution with </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">beautiful motifs and illustrations</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> inspired by India’s cultural heritage.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Each part of the Constitution begins with a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">unique artwork</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Depictions of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mohenjo-Daro seals</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> for ancient India.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ajanta murals</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> for classical period.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mughal miniatures</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> for medieval India.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Freedom struggle scenes</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> for modern India.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This made the Constitution not only a legal document but also a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">masterpiece of Indian art and culture</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which approach to poverty reduction focuses on creating productive assets and generating employment?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Employment-generation approach</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Trickle-down approach</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Direct taxation approach</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Disinvestment approach</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option A — Employment-generation approach</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Employment-generation approach</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> to poverty reduction focuses on </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">creating productive assets</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (like land, irrigation facilities, housing, skill development) and </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">generating employment opportunities</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This approach directly targets poverty by ensuring that people have </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">work and income sources</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, rather than relying only on welfare or trickle-down growth.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Examples in India:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">MGNREGA (Mahatma Gandhi National Rural Employment Guarantee Act)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Provides guaranteed wage employment.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Land reforms &amp; self-employment schemes</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Help create assets for the poor.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Under Article 80, the Rajya Sabha can have a maximum of how many nominated members?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Two members</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Five members</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ten members</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Twelve members</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option D — Twelve members</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Under </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 80 of the Indian Constitution</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">President of India</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> can nominate a maximum of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">12 members to the Rajya Sabha</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">These members are chosen for their </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">special knowledge or practical experience</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in fields such as:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Literature</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Science</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Art</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Social service</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This provision ensures that distinguished individuals contribute to parliamentary debates and policymaking, even if they are not directly elected.</span></li></ul>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which ISRO mission successfully landed near the Moon's south pole in August 2023?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Chandrayaan-1 mission</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Chandrayaan-2 mission</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Chandrayaan-3 mission</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Aditya-L1 mission</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option C — Chandrayaan-3 mission</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Chandrayaan-3 mission</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> by ISRO successfully landed near the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Moon’s south pole</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> on </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">23 August 2023</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This historic achievement made </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">India the first country</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> to land in the lunar south pole region.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Key Highlights:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Lander: </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Vikram</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Rover: </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pragyan</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Objective: To demonstrate </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">safe landing</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">rover mobility</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, and conduct </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">in-situ scientific experiments</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Significance: Strengthened India’s position in global space exploration and opened new avenues for studying water ice and minerals in the lunar south pole.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Chandrayaan-1 </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Launched in 2008; orbiter mission, no landing.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Chandrayaan-2 </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Launched in 2019; lander crash</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">landed, mission partially successful.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Aditya-L1 </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Solar mission launched in 2023, studies the Sun, not the Moon.</span></li></ul>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Koyna Hydroelectric Project, one of India's largest completed hydel projects, is located in which state?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kerala state</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Karnataka state</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Maharashtra state</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Gujarat state</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option C — Maharashtra state</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Koyna Hydroelectric Project</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is located in the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Satara district of Maharashtra</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Built on the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Koyna River</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, a tributary of the Krishna River, it is one of India’s largest completed hydropower projects.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Key Facts:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Installed capacity: </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1,960 MW</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (largest in Maharashtra).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Construction began in the 1950s; completed in stages.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The project includes the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Koyna Dam</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, which is a major source of hydroelectric power for western Maharashtra.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It has played a vital role in meeting the electricity needs of Mumbai, Pune, and other industrial regions.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kerala </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Known for Idukki Hydroelectric Project, not Koyna.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Karnataka </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Has Sharavathi and Almatti projects, not Koyna.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Gujarat </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Famous for Sardar Sarovar Dam, not Koyna.</span></li></ul>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Substances added to food to prevent spoilage and extend shelf life without making it unsafe are called:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Toxins added</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Adulterants added</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Contaminants added</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Preservatives added</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option D — Preservatives added</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Substances added to food to </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">prevent spoilage</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">extend shelf life</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> without making it unsafe are called </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Preservatives</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">They work by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">inhibiting microbial growth</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (bacteria, fungi, yeast) or slowing down chemical changes that cause food deterioration.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Examples:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sodium benzoate</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Used in soft drinks, jams, pickles.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Common salt</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Used in pickles, cured meat (draws out moisture).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sugar</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Used in jams, jellies (creates osmotic pressure).</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Toxins added </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Harmful substances, not used intentionally to preserve food.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Adulterants added </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Substances added to reduce quality or cheat consumers (unsafe).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Contaminants added </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Unwanted impurities that enter food accidentally, not for preservation.</span></li></ul>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Digital India' programme, aimed at transforming India into a digitally empowered society, was launched in which year?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Year 2010</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Year 2015</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Year 2019</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Year 2025</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option B — Year 2015</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Digital India Programme</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> was launched on </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1 July 2015</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Prime Minister Narendra Modi</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Objective: To transform India into a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">digitally empowered society and knowledge economy</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Key pillars include:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Digital Infrastructure</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> as a utility to every citizen.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Governance &amp; services on demand</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (e</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">governance, online services).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Digital empowerment of citizens</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (digital literacy, access to information).</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Initiatives under Digital India: </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">UMANG app, DigiLocker, BharatNet, e</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Hospital, MyGov, BHIM UPI, Aadhaar integration</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, etc.</span></li></ul>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which authority officially declares the result of an election from a constituency?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sub Divisional Officer</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Presiding Officer</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Polling Officer</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Returning Officer</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option D — Returning Officer</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Returning Officer (RO)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is the authority officially responsible for </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">declaring the result of an election from a constituency</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Appointed by the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Election Commission of India (ECI)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, the RO supervises the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">entire election process</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in a constituency:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Conduct of polling.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Counting of votes.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Declaration of the final result.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The RO ensures elections are held in a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">free, fair, and transparent manner</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sub Divisional Officer </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Administrative role, not directly responsible for declaring election results unless designated as RO.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Presiding Officer </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Manages a single polling station, not the whole constituency.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Polling Officer </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Assists the Presiding Officer at booth level, does not declare results.</span></li></ul>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Indian river is known as the 'Sorrow of Bihar' due to its frequent devastating floods?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kosi river</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Son river</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Gandak river</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ghaghara river</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option A — Kosi river</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kosi River</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, a tributary of the Ganga, is famously called the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">“Sorrow of Bihar.”</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Reason:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It frequently changes its course due to heavy silt deposition.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Causes </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">devastating floods</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> almost every year in northern Bihar.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Leads to widespread destruction of life, property, and agriculture.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Despite flood control measures like embankments and dams, the Kosi continues to be a major challenge for Bihar’s flood management.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Son River </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Flows through Bihar but not notorious for recurring floods.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Gandak River </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Causes floods occasionally, but not as devastating or frequent as Kosi.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ghaghara River </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Flood-prone in eastern UP and Bihar, but the epithet “Sorrow of Bihar” is specifically for Kosi.</span></li></ul>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which state government launched the 'Ladli Behna Yojana' to provide financial assistance to women?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rajasthan government</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Madhya Pradesh government</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Gujarat government</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Punjab government</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: Option B — Madhya Pradesh government</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ladli Behna Yojana</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> was launched by the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Government of Madhya Pradesh</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">March 2023</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> under Chief Minister Shivraj Singh Chouhan.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Objective:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> To provide </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">direct financial assistance</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> to women and empower them socially and economically.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Key Features:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Monthly financial support of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">₹1,000</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (later raised to ₹1,250).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Beneficiaries: Women aged </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">23–60 years</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> from economically weaker families.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Funds transferred via </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Direct Benefit Transfer (DBT)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Focus on </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">nutrition, health, and financial independence</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Rajasthan </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Runs schemes like </span><span style=\"font-size:12pt;font-style:italic;font-family:'Cambria Math'\">Indira Gandhi Gas Cylinder Subsidy</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, but not Ladli Behna.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Gujarat </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Known for </span><span style=\"font-size:12pt;font-style:italic;font-family:'Cambria Math'\">Vahli Dikri Yojana</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, not Ladli Behna.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Punjab </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Implements schemes like </span><span style=\"font-size:12pt;font-style:italic;font-family:'Cambria Math'\">Shagun Scheme</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, but not Ladli Behna.</span></li></ul>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Sarnath Lion Capital, adopted as India's National Emblem, was originally erected by which emperor?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Emperor Bindusara</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Chandragupta Maurya</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Emperor Ashoka</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Emperor Samudragupta</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: Option C — Emperor Ashoka</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sarnath Lion Capital</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> was originally erected by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Emperor Ashoka</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> around </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">250 BCE</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> at </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sarnath (Uttar Pradesh)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> to commemorate the site where the Buddha delivered his first sermon (</span><span style=\"font-size:12pt;font-style:italic;font-family:'Cambria Math'\">Dhammachakrapravartana</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It is a polished sandstone pillar topped with </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">four lions standing back to back</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, symbolizing </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">power, courage, confidence, and pride</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Below the lions are carvings of a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">bull, horse, elephant, and lion</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, separated by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Dharmachakra (wheel of law)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> motifs.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This Lion Capital was adopted as </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">India’s National Emblem</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> on </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">26 January 1950</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, symbolizing truth, justice, and dharma.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Emperor Bindusara </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Father of Ashoka, but not associated with the Lion Capital.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Chandragupta Maurya </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Founder of the Mauryan Empire, but the Lion Capital was erected later by Ashoka.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Emperor Samudragupta </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Gupta dynasty ruler, not linked to Ashokan pillars.</span></li></ul>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">'Disguised unemployment' is most commonly found in which sector of the Indian economy?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Agriculture sector</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Information technology sector</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Banking sector work</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Aviation sector work</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option A — Agriculture sector</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Disguised unemployment</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> occurs when more people are employed than actually required to produce the given level of output.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It is most common in the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">agriculture sector</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> of India, where family members often work on the same plot of land even though only a fraction of them are truly needed.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The extra workers contribute little or no additional productivity, meaning their employment is “disguised.”</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Example: If 5 workers can cultivate a field but 10 are working, the additional 5 are effectively unemployed, though they appear employed.</span></li></ul>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">India's Unified Payments Interface (UPI) is operated by which authority?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Insurance Regulatory Authority</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Reserve Bank of India</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Securities Exchange Board</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">National Payments Corporation of India</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option D — National Payments Corporation</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">India's </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Unified Payments Interface (UPI)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is operated by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">the </span><a href=\"https://www.npci.org.in/product/upi\" target=\"_blank\"><span style=\"font-size:12pt;font-weight:bold;text-decoration:underline;color:#0563c1;font-family:'Cambria Math'\">National Payments Corporation of India (NPCI)</span></a><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and is regulated under the overarching oversight of the apex banking regulator, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">the Reserve Bank of India (RBI).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">NPCI</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is an umbrella organisation for retail payment systems in India, established in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">2008</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> under the guidance of the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Reserve Bank of India (RBI)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Indian Banks’ Association (IBA)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">UPI was launched in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">2016</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and has since become the backbone of India’s digital payments ecosystem.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">NPCI ensures:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Interoperability</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> across banks and payment apps.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Security standards</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> for transactions.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Innovation</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in digital payment infrastructure.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Insurance Regulatory Authority </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Regulates insurance sector, not payments.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Reserve Bank of India </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Provides oversight and regulation but does not directly operate UPI.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Securities Exchange Board </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Regulates capital markets, not retail payments.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">National Payments Corporation </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">✅</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Correct; NPCI operates UPI.</span></li></ul>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Swami Dayananda Saraswati founded which Hindu reform organisation in 1875?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Prarthana Samaj organisation</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Brahmo Samaj
