li></ul>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The retreating (post-monsoon) season in India occurs during which months?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">March to May</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">June to September</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">October to December</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">January to February</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option C — October to December</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">retreating monsoon season</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, also called the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">post-monsoon season</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, occurs in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">India from October to December</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">During this period:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">southwest monsoon withdraws</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> from most parts of India.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Winds reverse direction, becoming </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">northeast monsoon winds</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">These winds bring </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">rainfall mainly to Tamil Nadu, coastal Andhra Pradesh, and parts of Karnataka and Kerala</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This season is marked by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">clear skies, high humidity, and occasional cyclones</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in the Bay of Bengal.</span></li></ul>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which memory type loses its stored data when the power supply is switched off?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">RAM memory</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">ROM memory</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Flash memory</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Hard disk drive</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: Option A — RAM memory</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">RAM (Random Access Memory)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">volatile memory</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, meaning it </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">loses all stored data once the power supply is switched off</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It serves as the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">temporary working memory</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> of a computer, storing programs and data currently in use by the CPU.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This volatility makes RAM fast but unsuitable for permanent storage.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">ROM memory </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Non</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">volatile; retains data permanently (used for firmware).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Flash memory </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Non</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">volatile; used in SSDs, USB drives, retains data without power.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Hard disk drive </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Non</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">volatile magnetic storage; retains data permanently.</span></li></ul>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which ruler founded the Chalukya dynasty of Badami?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Amoghavarsha I</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Krishna I</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pulakeshin I</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rajaraja I</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option C — Pulakeshin I</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Chalukya dynasty of Badami</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> was founded by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pulakeshin I</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">6th century CE</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">He established his capital at </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Vatapi (modern Badami, Karnataka)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Pulakeshin I consolidated power in the Deccan region and laid the foundation for one of the most influential dynasties in South Indian history.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">His successors, especially </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pulakeshin II</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, expanded the empire and became famous for resisting Harsha in North India.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Amoghavarsha I </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Belonged to the Rashtrakuta dynasty, not the Chalukyas.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Krishna I </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Rashtrakuta ruler, credited with building the Kailasa temple at Ellora.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Rajaraja I </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Famous Chola ruler, not linked to the Chalukyas.</span></li></ul>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which day is observed every year as World Environment Day?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">8 March</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">22 April</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">5 June</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">16 September</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option C — 5 June</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">World Environment Day</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is observed every year on </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">5th June</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It was established by the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">United Nations General Assembly in 1972</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> during the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Stockholm Conference on the Human Environment</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">First celebrated in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1973</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, it has grown into the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">largest global platform for environmental outreach</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, engaging governments, NGOs, businesses, and citizens worldwide.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Each year, a different country hosts the event with a specific </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">theme</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> focusing on pressing environmental issues such as climate change, biodiversity, or plastic pollution.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">8 March </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → International Women’s Day.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">22 April </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Earth Day, not World Environment Day.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">16 September </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → International Day for the Preservation of the Ozone Layer.</span></li></ul>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Under the Indian Constitution, which authority conducts elections to the offices of President and Vice-President?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Election Commission of India</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Supreme Court of India</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Parliament of India</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">NITI Aayog</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: Option A — Election Commission of India</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Under the Indian Constitution, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 324</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> empowers the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Election Commission of India (ECI)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> to conduct elections to:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Parliament</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (Lok Sabha &amp; Rajya Sabha)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">State Legislatures</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (Vidhan Sabha &amp; Vidhan Parishad)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Offices of the President and Vice-President of India</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The ECI ensures </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">free and fair elections</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> across the country.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Supreme Court of India</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> only acts as the adjudicating authority in case of disputes, but it does not conduct elections.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Parliament of India</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">NITI Aayog</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> have no role in conducting elections.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Supreme Court of India </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Judicial body; settles disputes but does not conduct elections.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Parliament of India </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Legislative body; members vote in Presidential elections but do not conduct them.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">NITI Aayog </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Policy think tank; unrelated to elections.</span></li></ul>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which is the largest tributary of the river Godavari by discharge?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Wardha river</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Indravati river</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Manjira river</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pranhita river</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option D — Pranhita river</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pranhita River</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">largest tributary of the Godavari River by discharge</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It is formed by the confluence of the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Wardha</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Wainganga rivers</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> near Sironcha (Maharashtra).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The Pranhita contributes nearly </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">34% of the Godavari’s total water flow</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, making it the most significant tributary in terms of discharge.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It flows through Maharashtra and Telangana before joining the Godavari.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Other Options Are Wrong:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Wardha River </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Important tributary, but it merges into Pranhita, not the largest by discharge individually.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Indravati River </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Major tributary from Chhattisgarh, but contributes less discharge compared to Pranhita.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Manjira River </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Smaller tributary, flows through Karnataka and Telangana, not the largest.</span></li></ul>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">As per Census classification, a 'Marginal Worker' is a person who works for:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">less than 30 days</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">less than 183 days</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">more than 300 days</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">exactly 365 days</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option B — less than 183 days</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">In </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Census of India classification</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Marginal Worker</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is defined as a person who works for </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">less than 183 days (i.e., less than 6 months) in a year</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">By contrast, a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Main Worker</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is one who works for </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">183 days or more (at least 6 months)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in a year.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This distinction helps in measuring the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">work participation rate</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and understanding the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">employment pattern</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in India.</span></li></ul>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which non-volatile memory allows data to be electrically erased and reprogrammed?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">SRAM memory</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">DRAM memory</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">EPROM memory</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">EEPROM memory</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option D — EEPROM memory</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">EEPROM (Electrically Erasable Programmable Read</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Only Memory)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">non</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">volatile memory</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> that allows data to be </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">electrically erased and reprogrammed</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Unlike EPROM (which requires ultraviolet light for erasure), EEPROM can be erased and rewritten using electrical signals, making it more flexible and practical.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It retains data even when the power supply is switched off, and is widely used in embedded systems, microcontrollers, and BIOS chips.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">SRAM memory </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Volatile; loses data when power is off, used for cache.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">DRAM memory </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Volatile; used as main system RAM, requires constant refreshing.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">EPROM memory </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Non</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">volatile, but requires UV light to erase, not electrical signals.</span></li></ul>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which site in Ladakh was declared India's first Dark Sky Reserve to promote astro-tourism?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Hanle Dark Reserve</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pangong Dark Reserve</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Nubra Dark Reserve</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Leh Dark Reserve</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option A — Hanle Dark Reserve</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">India’s </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">first Dark Sky Reserve</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> was declared in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Hanle, Ladakh</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">2022</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Located in the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Changthang Wildlife Sanctuary</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, Hanle is known for its </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">high altitude (4,500 m)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">clear skies</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, and </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">minimal light pollution</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, making it ideal for </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">astro</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">tourism and astronomical research</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The initiative was supported by the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Indian Institute of Astrophysics (IIA)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ladakh Autonomous Hill Development Council (LAHDC)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, and the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Union Ministry of Science &amp; Technology</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Hanle is also home to the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Indian Astronomical Observatory</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, one of the world’s highest observatories.</span></li></ul>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Shikhara' in North Indian (Nagara style) temple architecture refers to which feature?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Tower over sanctum</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Entrance gateway arch</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pillared assembly hall</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sacred water tank</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option A — Tower over sanctum</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">In </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">North Indian (Nagara style) temple architecture</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Shikhara</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> refers to the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">tower or spire built directly above the sanctum (garbhagriha)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It is the most prominent feature of Nagara temples, rising vertically and often curvilinear in shape.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Symbolically, the shikhara represents the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">axis mundi (cosmic axis)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, connecting the earthly realm with the divine.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Famous examples include the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Lingaraja Temple (Bhubaneswar)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kandariya Mahadeva Temple (Khajuraho)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Entrance gateway arch </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Refers to </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Torana</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, not Shikhara.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pillared assembly hall </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Refers to </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mandapa</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, used for gatherings and rituals.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sacred water tank </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Known as </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pushkarini/Kund</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, not Shikhara.</span></li></ul>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which law states that every action has an equal and opposite reaction?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Newton's First Law</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Newton's Second Law</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Newton's Third Law</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Law of Gravitation</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option C — Newton's Third Law</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Newton’s Third Law of Motion</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> states: </span><span style=\"font-size:12pt;font-style:italic;font-family:'Cambria Math'\">“For every action, there is an equal and opposite reaction.”</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This principle explains interactions between two bodies: when one body applies a force, the other body applies an equal force in the opposite direction.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Examples:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">A rocket expels gases downward → gases push the rocket upward.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">When you push against a wall → the wall pushes back with equal force.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Newton’s First Law </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Law of Inertia: A body remains at rest or in uniform motion unless acted upon by an external force.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Newton’s Second Law </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Defines force as </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787316602707_image001.png\" width=\"65\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-size:12pt;font-family:'Cambria Math'\">(Force = mass × acceleration).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Law of Gravitation </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → States that every mass attracts every other mass with a force proportional to their masses and inversely proportional to the square of the distance between them.</span></li></ul>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Tenth Schedule of the Indian Constitution deals with which of the following?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Anti-defection law</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Panchayati Raj powers</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Official language rules</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Emergency provisions list</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option A — Anti-defection law</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Tenth Schedule</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> of the Indian Constitution was added by the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">52nd Constitutional Amendment Act, 1985</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It deals with the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">disqualification of Members of Parliament and State Legislatures on the grounds of defection</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Key provisions:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">A member is disqualified if they </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">voluntarily give up membership</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> of their political party.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Disqualification also applies if they </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">vote or abstain against the party whip</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> without prior permission.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Exception:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> If two</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">thirds of members of a party merge with another, it is not considered defection.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Speaker/Chairman</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> of the House decides disqualification cases.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Panchayati Raj powers </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Covered under the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Eleventh Schedule</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (73rd Amendment, 1992).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Official language rules </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Covered under the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Eighth Schedule</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (recognized languages).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Emergency provisions list </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Found in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Part XVIII of the Constitution</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, not in any Schedule.</span></li></ul>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Indian state recorded the lowest population density as per the 2011 Census?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mizoram </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sikkim</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Arunachal Pradesh </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Nagaland</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option C — Arunachal Pradesh</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">As per the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">2011 Census of India</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Arunachal Pradesh</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> recorded the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">lowest population density among all Indian states</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, with only </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">17 persons per sq. km</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This extremely low density is due to:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Its </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">mountainous terrain</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and dense forests.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Limited arable land and infrastructure.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Sparse settlement patterns compared to other states.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mizoram </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Density ~52 persons/sq. km, higher than Arunachal Pradesh.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sikkim </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Density ~86 persons/sq. km, higher than Arunachal Pradesh.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Nagaland </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Density ~119 persons/sq. km, higher than Arunachal Pradesh.</span></li></ul>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">On which date is National Doctors' Day observed every year across India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 July every year</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2 July every year</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3 July every year</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">4 July every year</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option A — 1 July every year</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">National Doctors' Day</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is observed in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">India on 1st July every year</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It commemorates the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">birth and death anniversary of Dr. Bidhan Chandra Roy (B.C. Roy)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, a renowned physician, freedom fighter, and former Chief Minister of West Bengal.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The day honors doctors for their </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">dedication, compassion, and contribution</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> to healthcare and society.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Theme varies each year, focusing on issues like patient safety, medical ethics, and healthcare innovation.</span></li></ul>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following alone is NOT usually an indicator that a chemical reaction has taken place?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Change in shape only</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Formation of precipitate</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Evolution of a gas</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Change in colour</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option A — Change in shape only</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Indicators of a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">chemical reaction</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> include:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Formation of precipitate</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Solid formed when two solutions react.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Evolution of a gas</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Bubbles/fumes indicate new substance formation.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Change in colour</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Shows new compounds formed.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Change in temperature</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Heat absorbed/released.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Change in shape only</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is usually a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">physical change</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, not a chemical one. For example, cutting paper or molding clay changes shape but does not produce a new substance.</span></li></ul>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is NOT a dimension used to calculate the Human Development Index (HDI)?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A decent living standard</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A long healthy life</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Access to knowledge</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Per capita defence spending</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option D — Per capita defence spending</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Human Development Index (HDI)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, introduced by the UNDP in 1990, measures </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">three key dimensions</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> of human development:</span><ol type=\"1\"><li style=\"margin-left:32.11pt;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span style=\"font-weight:bold\">A long healthy life</span><span> → measured by </span><span style=\"font-style:italic\">life expectancy at birth</span><span>.</span></li><li style=\"margin-left:32.11pt;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span style=\"font-weight:bold\">Access to knowledge</span><span> → measured by </span><span style=\"font-style:italic\">mean years of schooling</span><span> and </span><span style=\"font-style:italic\">expected years of schooling</span><span>.</span></li><li style=\"margin-left:32.11pt;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span style=\"font-weight:bold\">A decent standard of living</span><span> → measured by </span><span style=\"font-style:italic\">Gross National Income (GNI) per capita (PPP)</span><span>.</span></li></ol></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Per capita defence spending</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">not</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> part of HDI. It relates to military expenditure, which is outside the scope of human development indicators.</span></li></ul>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following terms is used in badminton but NOT in cricket?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Shuttlecock</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Boundary </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Innings </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Wicket</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: Option A — Shuttlecock</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The term </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Shuttlecock</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is unique to </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">badminton</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">. It refers to the projectile (made of feathers or synthetic material) that players hit back and forth across the net.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">In </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">cricket</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, the terms used are </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Boundary, Innings, Wicket</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, all of which are integral to the game but have no connection with badminton.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Other Options Are Wrong</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Boundary </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Cricket term; runs scored when the ball crosses the boundary line.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Innings </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Cricket term; the period of play for a team until they are all out or declare.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Wicket </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Cricket term; refers to stumps, dismissal, or the pitch.</span></li></ul>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Who signed the Poona Pact of 1932 on behalf of the depressed classes?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Madan Mohan Malaviya</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mahatma Gandhi</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Jawaharlal Nehru</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">B.R. Ambedkar</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option D — B.R. Ambedkar</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Poona Pact of September 24, 1932</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, was an agreement between </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mahatma Gandhi and Dr. B.R. Ambedkar</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">. Because Gandhi was fasting in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Yerwada Central Jail</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, the document was signed by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Dr. Ambedkar</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> for the Depressed Classes and by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Madan Mohan Malaviya</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and others for caste Hindus. It replaced separate electorates with reserved seats in joint electorates.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Context:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Communal Award (1932)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> by Ramsay MacDonald had granted </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">separate electorates</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> for the Depressed Classes.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Gandhi opposed this, fearing it would divide Hindu society, and went on a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">fast unto death</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Ambedkar, representing the Depressed Classes, negotiated with Gandhi.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Outcome:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Separate electorates were withdrawn.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Instead, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">reserved seats in joint electorates</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> were provided for the Depressed Classes.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This compromise ensured representation while maintaining Hindu unity.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">What does the acronym 'CPU' stand for in computer terminology?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Computer Processing Unit</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Central Program Unit</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Cen
