rmala UI'\">एक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तीन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चार</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784206651572_image010.png\" width=\"225\" height=\"315\" alt ></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">P और U के बीच 2 लोगों की परीक्षा है।</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">श्रृंखला का अगला पद ज्ञात कीजिए।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">PBYJ, SFDP, VJIV, YNNB, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">BSSH</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">CSSH</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">BRSH</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">CRSH</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पहले अक्षर: P + 3 = S, S + 3 = V, V + 3 = Y, Y + 3 = </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">B</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दूसरे अक्षर: B + 4 = F, F + 4 = J, J + 4 = N, N + 4 = </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">R</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तीसरे अक्षर: Y + 5 = D, D + 5 = I, I + 5 = N, N + 5 = </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">S</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चौथे अक्षर: J + 6 = P, P + 6 = V, V + 6 = B, B + 6 = </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">H</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: BRSH</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अंग्रेजी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूह युग्मों में से तीन एक निश्चित तरीके से समान हैं और इस प्रकार एक समूह बनाते हैं। कौन सा अक्षर-समूह युग्म उस समूह से संबंधित नहीं है?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">(नोट: विषम एक व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति पर आधारित नहीं है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">EW – BB</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">HK – DP</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">QC – NH</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">KM – HR</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रत्येक युग्म में, पहला अक्षर 3 स्थान पीछे की ओर और दूसरा अक्षर 5 स्थान आगे की ओर चलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">EW </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> E − 3 = B, W + 5 = B </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> BB</span><br><span style=\"font-family:'Nirmala UI'\">QC </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> Q − 3 = N, C + 5 = H </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> NH</span><br><span style=\"font-family:'Nirmala UI'\">KM </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> K − 3 = H, M + 5 = R </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> HR</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">HK </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> H − 3 = E, K + 5 = P </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> यह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">EP</span><span style=\"font-family:'Nirmala UI'\"> होना चाहिए, लेकिन </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">DP</span><span style=\"font-family:'Nirmala UI'\"> दिया गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: (B) HK – DP</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मानव वृक्काणु (नेफ्रॉन) में, रक्त के परा-निस्पंदन (अल्ट्राफिल्ट्रेशन) के लिए मुख्य रूप से कौन सा भाग उत्तरदायी है, और इस प्रक्रिया के तुरंत बाद निस्पंद (फिल्ट्रेट) कहाँ एकत्र किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हेनले का लूप; संग्राहक नलिका</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ग्लोमेरुलस; बोमन कैप्सूल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">समीपस्थ संवलित नलिका; ग्लोमेरुलस</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दूरस्थ संवलित नलिका; वृक्क श्रोणि</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सही उत्तर: B. ग्लोमेरुलस; बोमन कैप्सूल</span></p><p style=\"margin-top:14pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">व्याख्या:</span><br><span style=\"font-family:'Nirmala UI'\">ग्लोमेरुलस रक्त केशिकाओं का एक जाल है जहाँ रक्त को दबाव में फ़िल्टर किया जाता है। फ़िल्टर किया गया तरल, जिसे ग्लोमेरुलर फिल्ट्रेट कहा जाता है, बोमन कैप्सूल में एकत्र किया जाता है। दोनों संरचनाएँ मिलकर एक वृक्काणु का मैलपीघियन काय या वृक्क कणिका बनाती हैं।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा किसी राज्य के राष्ट्रपति शासन के अधीन आने के लिए चरणों का सही क्रम है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मंत्रिमंडल का निर्णय - राष्ट्रपति की उद्घोषणा - किसी और अनुमोदन की आवश्यकता नहीं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संवैधानिक तंत्र की विफलता पर राज्यपाल की रिपोर्ट - अनुच्छेद 356 के तहत राष्ट्रपति की उद्घोषणा - 2 महीने के भीतर संसदीय अनुमोदन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राष्ट्रपति की उद्घोषणा - सर्वोच्च न्यायालय का अनुमोदन - राज्यपाल की रिपोर्ट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संसदीय अनुमोदन - राज्यपाल की रिपोर्ट - राष्ट्रपति की उद्घोषणा</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 356</span><span style=\"font-family:'Nirmala UI'\"> के तहत, यह प्रक्रिया संवैधानिक तंत्र की विफलता दर्शाने वाली </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राज्यपाल की रिपोर्ट</span><span style=\"font-family:'Nirmala UI'\"> से शुरू होती है, इसके बाद राष्ट्रपति शासन की </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राष्ट्रपति की उद्घोषणा</span><span style=\"font-family:'Nirmala UI'\"> होती है, जिसे प्रभावी रहने के लिए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दो महीने के भीतर संसद द्वारा अनुमोदित</span><span style=\"font-family:'Nirmala UI'\"> किया जाना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यदि संसद द्वारा अनुमोदित नहीं किया जाता है, तो उद्घोषणा दो महीने के बाद समाप्त हो जाती है; यदि अनुमोदित हो जाता है, तो इसे विशिष्ट शर्तों के तहत अधिकतम तीन वर्षों तक किश्तों में बढ़ाया जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'संवैधानिक तंत्र की विफलता पर राज्यपाल की रिपोर्ट - अनुच्छेद 356 के तहत राष्ट्रपति की उद्घोषणा - 2 महीने के भीतर संसदीय अनुमोदन' है।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक धातु तनु हाइड्रोक्लोरिक अम्ल के साथ अभिक्रिया कर तीव्र बुदबुदाहट के साथ हाइड्रोजन गैस उत्पन्न करती है, लेकिन तनु नाइट्रिक अम्ल के साथ अभिक्रिया कर हाइड्रोजन उत्पन्न नहीं करती है। निम्नलिखित में से कौन सा इस व्यवहार को सबसे अच्छी तरह समझाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नाइट्रिक अम्ल हाइड्रोक्लोरिक अम्ल से कमजोर होता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">धातु सभी अम्लों के साथ अक्रियाशील है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हाइड्रोक्लोरिक अम्ल धातुओं के साथ हाइड्रोजन गैस उत्पन्न नहीं करता है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नाइट्रिक अम्ल एक प्रबल ऑक्सीकारक है और सामान्यतः धातुओं के साथ अभिक्रिया करके हाइड्रोजन के बजाय नाइट्रोजन ऑक्साइड उत्पन्न करता है।</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नाइट्रिक अम्ल एक प्रबल ऑक्सीकारक है</span><span style=\"font-family:'Nirmala UI'\">, इसलिए यह हाइड्रोजन को केवल विस्थापित करने के बजाय, आमतौर पर निर्मित हाइड्रोजन गैस को जल में ऑक्सीकृत कर देता है, और स्वयं नाइट्रोजन ऑक्साइड (जैसे NO या NO2) में अपचयित हो जाता है - जिसका अर्थ है कि जब धातुएं नाइट्रिक अम्ल के साथ अभिक्रिया करती हैं तो हाइड्रोजन गैस शायद ही कभी देखी जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यही कारण है कि नाइट्रिक अम्ल को आमतौर पर HCl और तनु H2SO4 जैसे अम्लों के लिए सिखाए जाने वाली विशिष्ट 'धातु + अम्ल = लवण + हाइड्रोजन' अभिक्रियाओं से बाहर रखा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'नाइट्रिक अम्ल एक प्रबल ऑक्सीकारक है और सामान्यतः धातुओं के साथ अभिक्रिया करके हाइड्रोजन के बजाय नाइट्रोजन ऑक्साइड उत्पन्न करता है'।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2026 में भारत के वित्तीय क्षेत्र के विकास के संबंध में निम्नलिखित में से कौन सा कथन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कुल कारोबार में ₹50,000 करोड़ का आंकड़ा पार करने के बाद सारस्वत कोऑपरेटिव बैंक भारत का सबसे बड़ा शहरी सहकारी बैंक बन गया।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आरबीआई की नई एकीकृत लोकपाल योजना 1 जुलाई 2026 से प्रभावी हुई।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पिछले वर्ष की तुलना में FY26 में भारत का बाह्य ऋण कम हुआ।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आयकर अधिनियम, 2025, 1 जनवरी 2026 से लागू हुआ।</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आरबीआई की एकीकृत लोकपाल योजना</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1 जुलाई 2026</span><span style=\"font-family:'Nirmala UI'\"> से प्रभावी हुई, जिसने बैंकिंग, एनबीएफसी (NBFC) और डिजिटल भुगतान ग्राहकों के लिए शिकायत निवारण को एक एकल एकीकृत ढाँचे के तहत सुव्यवस्थित किया। भारत का </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बाह्य ऋण वास्तव में FY26 में बढ़कर</span><span style=\"font-family:'Nirmala UI'\"> 762.8 बिलियन डॉलर हो गया (कम नहीं हुआ); </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सारस्वत को-ऑपरेटिव बैंक</span><span style=\"font-family:'Nirmala UI'\"> ने कुल कारोबार में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">₹1 लाख करोड़</span><span style=\"font-family:'Nirmala UI'\"> (₹50,000 करोड़ नहीं) का आंकड़ा पार किया; और नया आयकर अधिनियम </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1 अप्रैल 2026</span><span style=\"font-family:'Nirmala UI'\"> (1 जनवरी नहीं) से प्रभावी होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'आरबीआई की नई एकीकृत लोकपाल योजना 1 जुलाई 2026 से प्रभावी हुई'।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अभिकथन (A): लोहे से बना एक जहाज पानी पर तैरता है, भले ही लोहा पानी से सघन हो।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कारण (R): जहाज को खोखली संरचना के साथ डिज़ाइन किया गया है ताकि उसका समग्र घनत्व (द्रव्यमान/आयतन) पानी के घनत्व से कम हो जाए।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सत्य हैं, लेकिन R, A की सही व्याख्या नहीं है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A असत्य है, लेकिन R सत्य है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A सत्य है, लेकिन R असत्य है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सत्य हैं, और R, A की सही व्याख्या है।</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक जहाज की </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">खोखली संरचना</span><span style=\"font-family:'Nirmala UI'\"> पानी की एक बड़ी मात्रा को विस्थापित करती है, जिससे घने लोहे से बने होने के बावजूद जहाज का समग्र (औसत) घनत्व कम हो जाता है - जो सीधे तौर पर यह बताता है कि यह क्यों तैरता है, जैसा कि </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्प्लावन के सिद्धांत</span><span style=\"font-family:'Nirmala UI'\"> (आर्किमिडीज़ का सिद्धांत) में बताया गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यदि लोहे के उसी द्रव्यमान को एक ठोस गेंद में संपीड़ित किया जाता, तो वह डूब जाता, क्योंकि तब उसका घनत्व पानी के घनत्व से अधिक हो जाता।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'A और R दोनों सत्य हैं, और R, A की सही व्याख्या है'।</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">'मुद्रास्फीति' का सबसे अच्छा वर्णन निम्नलिखित में से कौन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">धन की आपूर्ति में कमी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आयात की तुलना में निर्यात में वृद्धि</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एकल वस्तु की कीमत में एक बार की वृद्धि</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">समय के साथ वस्तुओं और सेवाओं के सामान्य मूल्य स्तर में निरंतर वृद्धि</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुद्रास्फीति</span><span style=\"font-family:'Nirmala UI'\"> समय के साथ अर्थव्यवस्था में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सामान्य मूल्य स्तर में निरंतर वृद्धि</span><span style=\"font-family:'Nirmala UI'\"> को संदर्भित करती है, जिससे धन की क्रय शक्ति कम हो जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">किसी एक वस्तु में एक बार की कीमत वृद्धि अपने आप में मुद्रास्फीति नहीं है; मुद्रास्फीति पूरे अर्थव्यवस्था में एक व्यापक, निरंतर प्रवृत्ति होनी चाहिए, जिसे आमतौर पर CPI या WPI जैसे सूचकांकों का उपयोग करके मापा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'समय के साथ वस्तुओं और सेवाओं के सामान्य मूल्य स्तर में निरंतर वृद्धि'।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किसी दिए गए वर्ष में एक देश का निर्यात $500 बिलियन का है और आयात $600 बिलियन का है। निम्नलिखित में से कौन इसकी व्यापार स्थिति का सही वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">$100 बिलियन का व्यापार घाटा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संतुलित व्यापार</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">$100 बिलियन का व्यापार अधिशेष</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">$500 बिलियन का व्यापार अधिशेष</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चूंकि </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आयात ($600 बिलियन) निर्यात ($500 बिलियन) से अधिक</span><span style=\"font-family:'Nirmala UI'\"> हैं, देश का </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">$100 बिलियन का व्यापार घाटा</span><span style=\"font-family:'Nirmala UI'\"> है (आयात - निर्यात = $600 बिलियन - $500 बिलियन = $100 बिलियन)।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">व्यापार घाटे का अर्थ है कि देश विदेशों में बेचने से जो कमाता है, उससे अधिक विदेशी वस्तुओं/सेवाओं पर खर्च कर रहा है, जिसे उधार, विदेशी निवेश प्रवाह या भंडार में कमी के माध्यम से वित्तपोषित किया जाना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है '$100 बिलियन का व्यापार घाटा'।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अक्टूबर 2025 में 15+ आयु वर्ग के व्यक्तियों के लिए महिला श्रम बल भागीदारी दर (LFPR) लगभग पहुँच गई:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">33.2%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">34%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">34.2%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">38.2%</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">श्रम बल भागीदारी दर (LFPR)</span><span style=\"font-family:'Nirmala UI'\"> उन लोगों के प्रतिशत को संदर्भित करती है जो या तो:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-top:14pt;margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">रोजगारशुदा</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> हैं, या</span></li><li style=\"margin-left:27.6pt;margin-bottom:14pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बेरोजगार हैं लेकिन सक्रिय रूप से काम की तलाश में हैं</span></li></ul><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसकी गणना इस प्रकार की जाती है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784206737710_image001.png\" width=\"372\" height=\"50\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मासिक आवधिक श्रम बल सर्वेक्षण (PLFS) के आंकड़ों के अनुसार, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">15 वर्ष और उससे अधिक</span><span style=\"font-family:'Nirmala UI'\"> आयु की महिलाओं के लिए, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अक्टूबर 2025</span><span style=\"font-family:'Nirmala UI'\"> में LFPR लगभग </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">34.2%</span><span style=\"font-family:'Nirmala UI'\"> थी।</span></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसका अर्थ है कि </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">15 वर्ष या उससे अधिक</span><span style=\"font-family:'Nirmala UI'\"> आयु की प्रत्येक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">100 महिलाओं</span><span style=\"font-family:'Nirmala UI'\"> में से, लगभग </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">34 महिलाएं श्रम बाजार में भाग ले रही थीं</span><span style=\"font-family:'Nirmala UI'\">, या तो काम करके या सक्रिय रूप से काम की तलाश करके।</span></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अतः:</span></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: 34.2%</span></p><p style=\"margin-top:14pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">महत्वपूर्ण:</span><span style=\"font-family:'Nirmala UI'\"> LFPR केवल रोजगारशुदा व्यक्तियों का प्रतिनिधित्व नहीं करती है। इसमें रोजगारशुदा व्यक्ति और बेरोजगार व्यक्ति दोनों शामिल हैं जो सक्रिय रूप से काम की तलाश में हैं। PLFS सांख्यिकी और कार्यक्रम कार्यान्वयन मंत्रालय (MoSPI) द्वारा आयोजित किया जाता है।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित भारतीय नदियों का उन सागरों/खाड़ियों से मिलान करें जिनमें वे अंततः गिरती हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A. नर्मदा - 1. अरब सागर (खंभात की खाड़ी)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">B. गोदावरी - 2. बंगाल की खाड़ी</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">C. सिंधु - 3. अरब सागर</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">D. महानदी - 4. बंगाल की खाड़ी</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा संयोजन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-4, B-3, C-2, D-1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-2, B-1, C-4, D-3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-3, B-4, C-1, D-2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-1, B-2, C-3, D-4</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नर्मदा</span><span style=\"font-family:'Nirmala UI'\"> पश्चिम की ओर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अरब सागर (खंभात की खाड़ी)</span><span style=\"font-family:'Nirmala UI'\"> में गिरती है; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गोदावरी</span><span style=\"font-family:'Nirmala UI'\"> पूर्व की ओर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बंगाल की खाड़ी</span><span style=\"font-family:'Nirmala UI'\"> में गिरती है; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सिंधु</span><span style=\"font-family:'Nirmala UI'\"> दक्षिण की ओर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अरब सागर</span><span style=\"font-family:'Nirmala UI'\"> (पाकिस्तान में) में गिरती है; और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">महानदी</span><span style=\"font-family:'Nirmala UI'\"> पूर्व की ओर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बंगाल की खाड़ी</span><span style=\"font-family:'Nirmala UI'\"> में गिरती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">प्रायद्वीप के सामान्य ढलान के कारण अधिकांश प्रमुख भारतीय नदियाँ पूर्व की ओर बहती हैं; नर्मदा, तापी और सिंधु प्रणाली पश्चिम की ओर बहने वाली उल्लेखनीय अपवाद हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही संयोजन A-1, B-2, C-3, D-4 है।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जुआरी एस्ट्यूरी (नदीमुख) के प्रवेश द्वार पर स्थित किस भारतीय बंदरगाह ने 1961 में जापान को लौह-अयस्क निर्यात को संभालने के लिए पुनर्गठन (remodelling) के बाद महत्व प्राप्त किया?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मर्मगाओ बंदरगाह</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कांडला बंदरगाह</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जवाहरलाल नेहरू बंदरगाह</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न्यू मैंगलोर बंदरगाह</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मर्मगाओ बंदरगाह</span><span style=\"font-family:'Nirmala UI'\"> (जिसे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मोरमुगाओ बंदरगाह</span><span style=\"font-family:'Nirmala UI'\"> भी लिखा जाता है) </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गोवा</span><span style=\"font-family:'Nirmala UI'\"> में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जुआरी नदी के मुहाने</span><span style=\"font-family:'Nirmala UI'\"> के प्रवेश द्वार पर स्थित है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एस्ट्यूरी (नदीमुख)</span><span style=\"font-family:'Nirmala UI'\"> वह स्थान होता है जहाँ एक नदी समुद्र से मिलती है। क्योंकि मोरमुगाओ बंदरगाह जुआरी नदी के मुहाने के पास स्थित है और इसमें एक अच्छा प्राकृतिक बंदरगाह है, यह बड़े जहाजों को संभालने के लिए उपयुक्त हो गया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1961</span><span style=\"font-family:'Nirmala UI'\"> में इसके पुनर्गठन (remodelling) के बाद, बंदरगाह ने मुख्य रूप से </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लौह-अयस्क</span><span style=\"font-family:'Nirmala UI'\"> के निर्यात के लिए महत्व प्राप्त किया। गोवा से बड़ी मात्रा में लौह-अयस्क इस बंदरगाह के माध्यम से </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जापान</span><span style=\"font-family:'Nirmala UI'\"> जैसे देशों में पहुँचाया जाता था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अतः:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784206737710_image002.png\" width=\"406\" height=\"23\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: मर्मगाओ बंदरगाह</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कांडला बंदरगाह:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> गुजरात में स्थित है, जुआरी एस्ट्यूरी पर नहीं।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">जवाहरलाल नेहरू बंदरगाह:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> मुंबई के पास स्थित है और मुख्य रूप से कंटेनर संभालता है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">न्यू मैंगलोर बंदरगाह:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> कर्नाटक में स्थित है, गोवा में नहीं।</span></li></ul>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दो बड़े भूभागों को जोड़ने वाली भूमि की एक संकीर्ण पट्टी के लिए निम्नलिखित में से कौन सा सही शब्द है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">द्वीपसमूह</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्थलडमरूमध्य</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पठार</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रायद्वीप</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्थलडमरूमध्य</span><span style=\"font-family:'Nirmala UI'\"> भूमि की एक संकीर्ण पट्टी है जो दो बड़े भूभागों को जोड़ती है, जिसके दोनों ओर पानी होता है - उदाहरण के लिए, पनामा का स्थलडमरूमध्य उत्तरी और दक्षिणी अमेरिका को जोड़ता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">इसके विपरीत, एक प्रायद्वीप तीन तरफ से पानी से घिरा हुआ भूमि का भाग होता है लेकिन फिर भी मुख्य भूमि से जुड़ा होता है, जबकि एक द्वीपसमूह द्वीपों का एक समूह/श्रृंखला होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर स्थलडमरूमध्य है।</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत में एक नदी घाटी का वर्णन एक दरार/भ्रंश द्वारा निर्मित होने के रूप में किया गया है न कि सामान्य अपरदनात्मक प्रक्रियाओं द्वारा, जो विंध्य और सतपुड़ा पर्वतमालाओं के बीच एक सीधे, गर्तनुमा मार्ग से बहती है। यह किस नदी का वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नर्मदा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कावेरी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कृष्णा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गोदावरी</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नर्मदा</span><span style=\"font-family:'Nirmala UI'\"> एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भ्रंश घाटी</span><span style=\"font-family:'Nirmala UI'\"> (सामान्य अपरदन से नहीं, बल्कि भ्रंशन से बनी एक भूगर्भीय गर्त) से होकर बहती है, जो इसके उत्तर में विंध्य श्रेणी और इसके दक्षिण में सतपुड़ा श्रेणी के बीच स्थित है - जिससे इसे अधिकांश प्रायद्वीपीय नदियों की तुलना में एक असामान्य रूप से सीधा पूर्व-पश्चिम मार्ग मिलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह भ्रंश घाटी की उत्पत्ति यह भी बताती है कि नर्मदा (तापी की तरह) क्यों अन्य अधिकांश प्रायद्वीपीय नदियों के विपरीत पश्चिम की ओर अरब सागर में बहती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर नर्मदा है।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कौन सा भारतीय राज्य सबसे अधिक पड़ोसी देशों के साथ अपनी सीमा साझा करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राजस्थान</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पंजाब</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पश्चिम बंगाल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गुजरात</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पश्चिम बंगाल</span><span style=\"font-family:'Nirmala UI'\"> भारतीय राज्यों में से सबसे अधिक पड़ोसी देशों - बांग्लादेश, नेपाल और भूटान - के साथ सीमा साझा करता है, जिससे इसे बेजोड़ अंतरराष्ट्रीय सीमा विविधता मिलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह पश्चिम बंगाल को भारत की सीमा प्रबंधन और सीमा पार व्यापार के लिए रणनीतिक रूप से महत्वपूर्ण बनाता है, विशेष रूप से संकरे सिलीगुड़ी कॉरिडोर ('चिकन्स नेक') के माध्यम से।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर पश्चिम बंगाल है।</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सी नदी भारत-बांग्लादेश सीमा के एक हिस्से को परिभाषित करने में मदद करती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गंगा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">महानदी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नर्मदा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ब्रह्मपुत्र</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गंगा नदी</span><span style=\"font-family:'Nirmala UI'\"> भारत-बांग्लादेश सीमा के एक हिस्से को परिभाषित करने में मदद करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गंगा भारत से पूर्व की ओर बहती है और भारत-बांग्लादेश क्षेत्र तक पहुँचती है। बांग्लादेश में प्रवेश करने के बाद, नदी को सामान्यतः </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पद्मा</span><span style=\"font-family:'Nirmala UI'\"> के नाम से जाना जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सीमा के पास अपने प्रवाह के एक हिस्से के साथ, नदी भारत और बांग्लादेश के बीच अंतरराष्ट्रीय सीमा का एक खंड बनाती या उसका अनुसरण करती है। भारत और बांग्लादेश कई सीमा-पार नदियाँ भी साझा करते हैं, और गंगा उनमें से सबसे महत्वपूर्ण में से एक है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अतः:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784206737710_image003.png\" width=\"251\" height=\"23\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: गंगा</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित प्राचीन भारतीय शासकों का उनके संबंधित राजवंश/काल से मिलान करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A. पुष्यमित्र शुंग - 1. शुंग वंश</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">B. कनिष्क - 2. कुषाण वंश</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">C. हर्षवर्धन - 3. पुष्यभूति वंश</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">D. स्कंदगुप्त - 4. गुप्त वंश</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा संयोजन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-2, B-1, C-4, D-3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-1, B-2, C-3, D-4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-4, B-3, C-2, D-1</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-3, B-4, C-1, D-2</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पुष्यमित्र शुंग</span><span style=\"font-family:'Nirmala UI'\"> ने अंतिम मौर्य शासक को उखाड़ फेंकने के बाद </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">शुंग वंश</span><span style=\"font-family:'Nirmala UI'\"> की स्थापना की; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कनिष्क</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कुषाण वंश</span><span style=\"font-family:'Nirmala UI'\"> से संबंधित थे; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हर्षवर्धन</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पुष्यभूति (वर्धना) वंश</span><span style=\"font-family:'Nirmala UI'\"> से संबंधित थे; और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्कंदगुप्त</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गुप्त वंश</span><span style=\"font-family:'Nirmala UI'\"> के एक शासक थे, जो हूण आक्रमणों को खदेड़ने के लिए जाने जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही संयोजन A-1, B-2, C-3, D-4 है।</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">'अजंता गुफाएँ', जो अपनी प्राचीन बौद्ध भित्ति चित्रों और शैलकृत वास्तुकला के लिए प्रसिद्ध हैं, मुख्य रूप से किस व्यापक काल के संरक्षण को दर्शाती हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मुगल काल</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चोल काल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल मौर्य काल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सातवाहन और वाकाटक काल</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अजंता गुफाओं</span><span style=\"font-family:'Nirmala UI'\"> का निर्माण दो मुख्य चरणों में किया गया था, जो मुख्य रूप से </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सातवाहन और बाद के वाकाटक</span><span style=\"font-family:'Nirmala UI'\"> कालों के संरक्षण को दर्शाता है, जो मोटे तौर पर दूसरी शताब्दी ईसा पूर्व से छठी शताब्दी ईस्वी तक फैला हुआ है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">1819 में एक ब्रिटिश अधिकारी द्वारा फिर से खोजे जाने से पहले ये गुफाएँ सदियों तक छिपी और भूली हुई थीं, और अब ये अपनी असाधारण भित्ति चित्रों के लिए प्रसिद्ध यूनेस्को विश्व धरोहर स्थल हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर सातवाहन और वाकाटक काल है।</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा मंदिर परिसर अपने 24 मीटर ऊँचे विमान और शिव की पत्थर की मूर्ति के लिए जाना जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऐरावतेश्वर मंदिर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">महाबोधि मंदिर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कंदरिया महादेव मंदिर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गंगैकोंडाचोलिश्वरम</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सही उत्तर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ऐरावतेश्वर मंदिर</span><span style=\"font-family:'Nirmala UI'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ऐरावतेश्वर मंदिर परिसर</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">तमिलनाडु के दरासुरम</span><span style=\"font-family:'Nirmala UI'\"> में स्थित है। इसका निर्माण 12वीं शताब्दी में चोल शासक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राजाराज द्वितीय</span><span style=\"font-family:'Nirmala UI'\"> ने करवाया था। यह मंदिर अपनी सुंदर चोल वास्तुकला, विस्तृत पत्थर की नक्काशी और मूर्तियों के लिए प्रसिद्ध है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसका </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विमान</span><span style=\"font-family:'Nirmala UI'\">, जिसका अर्थ मुख्य गर्भगृह के ऊपर बना टावर है, लगभग </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">24 मीटर ऊँचा</span><span style=\"font-family:'Nirmala UI'\"> है। मंदिर परिसर में भगवान शिव की एक उल्लेखनीय </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पत्थर की मूर्ति</span><span style=\"font-family:'Nirmala UI'\"> भी है।</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत परिषद अधिनियम, 1909 (मॉर्ले-मिंटो सुधार) के बारे में निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. इसने मुसलमानों के लिए पृथक निर्वाचन मंडल की शुरुआत की।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. इसने भारत को पूर्ण उत्तरदायी सरकार प्रदान की।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऊपर दिए गए कथनों में से कौन सा/से सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो I और न ही II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I और II दोनों</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन I सही है</span><span style=\"font-family:'Nirmala UI'\"> - इस अधिनियम ने </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुसलमानों के लिए पृथक निर्वाचक मंडल</span><span style=\"font-family:'Nirmala UI'\"> की शुरुआत की, एक ऐसा कदम जिसने बाद में औपनिवेशिक भारत में सांप्रदायिक राजनीति को बढ़ावा दिया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन II गलत है</span><span style=\"font-family:'Nirmala UI'\"> - इस अधिनियम ने केवल विधान परिषदों का विस्तार किया और भारतीय प्रतिनिधित्व को सीमित सीमा तक बढ़ाया; इसने पूर्ण उत्तरदायी/स्व-शासन प्रदान </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नहीं</span><span style=\"font-family:'Nirmala UI'\"> किया, जो बहुत बाद के सुधारों के माध्यम से ही आया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">इस अधिनियम को अक्सर भारतीय विधायी इतिहास में सांप्रदायिक प्रतिनिधित्व की दिशा में पहला कदम कहा जाता है, एक ऐसी विरासत जिसके दूरगामी परिणाम हुए।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'केवल I' है।</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रथम \"संस्कृत आयोग\" का गठन किस वर्ष किया गया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2019</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1956</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1952</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2014</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रथम संस्कृत आयोग</span><span style=\"font-family:'Nirmala UI'\"> का गठन </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारत सरकार द्वारा 1956 में</span><span style=\"font-family:'Nirmala UI'\"> किया गया था। इसका गठन भारत में संस्कृत शिक्षा की स्थिति की जांच करने और इसके विकास और प्रोत्साहन के लिए उपायों की सिफारिश करने हेतु किया गया था। आयोग की अध्यक्षता प्रसिद्ध भाषाविद् और विद्वान </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">डॉ. सुनीति कुमार चटर्जी</span><span style=\"font-family:'Nirmala UI'\"> ने की थी।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आयोग ने अपनी रिपोर्ट </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1956-57</span><span style=\"font-family:'Nirmala UI'\"> के दौरान प्रस्तुत की थी, यही कारण है कि इसे आमतौर पर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">संस्कृत आयोग (1956-57)</span><span style=\"font-family:'Nirmala UI'\"> के नाम से भी जाना जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: 1956</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन-सा मुख्य कारण सही ढंग से बताता है कि कांग्रेस ने अंततः कलकत्ता अधिवेशन (1928) में पूर्ण स्वतंत्रता की तत्काल मांग करने के बजाय केवल एक संक्रमणकालीन मांग के रूप में डोमिनियन स्टेटस को क्यों स्वीकार किया?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आंदोलन को तेज करने से पहले नेहरू रिपोर्ट के प्रस्तावों के माध्यम से ब्रिटिश सरकार को स्व-शासन प्रदान करने का अंतिम अवसर देना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">क्योंकि अंग्रेजों ने पहले ही पूर्ण स्वतंत्रता का वादा किया था</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">क्योंकि कांग्रेस का मानना था कि भारत अभी आर्थिक रूप से स्वतंत्रता के लिए तैयार नहीं था</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">क्योंकि गांधी ने व्यक्तिगत रूप से उस समय पूर्ण स्वतंत्रता का विरोध किया था</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कलकत्ता अधिवेशन (1928)</span><span style=\"font-family:'Nirmala UI'\"> में, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नेहरू रिपोर्ट</span><span style=\"font-family:'Nirmala UI'\"> के आधार पर, कांग्रेस ने ब्रिटिशों को डोमिनियन स्टेटस प्रदान करने के लिए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एक वर्ष का अल्टीमेटम</span><span style=\"font-family:'Nirmala UI'\"> दिया, इसे अस्वीकृत होने पर पूर्ण स्वतंत्रता आंदोलन में बदलने से पहले एक अंतिम, मध्यम अवसर के रूप में इरादा किया गया था - जो वास्तव में हुआ, और 1929 में लाहौर में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पूर्ण स्वराज</span><span style=\"font-family:'Nirmala UI'\"> प्रस्ताव पारित हुआ।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'आंदोलन को तेज करने से पहले नेहरू रिपोर्ट के प्रस्तावों के माध्यम से ब्रिटिश सरकार को स्व-शासन प्रदान करने का अंतिम अवसर देना' है।</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा 'गठबंधन धर्म' शब्द का सही वर्णन करता है, जिसका प्रयोग अक्सर भारतीय राजनीतिक विमर्श में किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गठबंधन सरकार में कई सहयोगी दलों के हितों को समायोजित करने और संतुलित करने की प्रथा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राजनीतिक दलों द्वारा अपनाई जाने वाली एक विशिष्ट धार्मिक प्रथा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सभी गठबंधन सहयोगियों के लिए समान कैबिनेट सीटों को अनिवार्य करने वाला एक नियम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गठबंधनों को नियंत्रित करने वाला एक संवैधानिक प्रावधान</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">'गठबंधन धर्म'</span><span style=\"font-family:'Nirmala UI'\"> गठबंधन सरकार के भीतर कई सहयोगी दलों के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हितों को समायोजित करने और संतुलित करने</span><span style=\"font-family:'Nirmala UI'\"> की अनौपचारिक राजनीतिक प्रथा को संदर्भित करता है, जो किसी भी बाध्यकारी कानूनी नियम के बजाय बातचीत और समझौते के माध्यम से स्थिरता सुनिश्चित करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'गठबंधन सरकार में कई सहयोगी दलों के हितों को समायोजित करने और संतुलित करने की प्रथा'।</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हाल के सुधारों ने मुख्य चुनाव आयुक्त (CEC) और चुनाव आयुक्तों (ECs) की नियुक्ति के लिए चयन समिति की संरचना को बदल दिया है। निम्नलिखित में से कौन वर्तमान में इस समिति का सदस्य नहीं है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के मुख्य न्यायाधीश</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लोकसभा में विपक्ष का नेता</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रधानमंत्री</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रधानमंत्री द्वारा नामित एक केंद्रीय कैबिनेट मंत्री</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुख्य चुनाव आयुक्त और अन्य चुनाव आयुक्त (नियुक्ति, सेवा की शर्तें और कार्यकाल) अधिनियम, 2023</span><span style=\"font-family:'Nirmala UI'\"> के तहत, चयन समिति में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रधानमंत्री, लोकसभा में विपक्ष का नेता, और प्रधानमंत्री द्वारा नामित एक केंद्रीय कैबिनेट मंत्री</span><span style=\"font-family:'Nirmala UI'\"> शामिल होते हैं - </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारत के मुख्य न्यायाधीश</span><span style=\"font-family:'Nirmala UI'\"> को इस पैनल से </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हटा दिया गया</span><span style=\"font-family:'Nirmala UI'\"> था, जिसने पहले के सुप्रीम कोर्ट-अनिवार्य संरचना का स्थान लिया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह परिवर्तन सार्वजनिक और कानूनी बहस का एक महत्वपूर्ण विषय रहा है, जिसमें आलोचकों का तर्क है कि यह इन प्रमुख संवैधानिक पदों के लिए चयन प्रक्रिया की स्वतंत्रता को कम करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर भारत के मुख्य न्यायाधीश है।</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भुगतान संतुलन में, विदेशी मुद्रा भंडार में वृद्धि किस श्रेणी के अंतर्गत आती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चालू खाता – डेबिट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चालू खाता – क्रेडिट</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पूंजी खाता – डेबिट</span></p>", "option4": " <p styl च्छेद 51A(g)</span><span style=\"font-family:'Nirmala UI'\"> प्रत्येक नागरिक को 'वनों, झीलों, नदियों और वन्यजीवों सहित प्राकृतिक पर्यावरण की रक्षा और सुधार करने, तथा जीवित प्राणियों के प्रति दया रखने' के लिए बाध्य करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह कर्तव्य अनुच्छेद 48A (एक नीति निर्देशक सिद्धांत) का पूरक है, जो इसी तरह राज्य को पर्यावरण की रक्षा और सुधार के लिए निर्देशित करता है - दोनों मिलकर भारत में पर्यावरणीय न्यायशास्त्र के लिए एक मजबूत संवैधानिक आधार बनाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर अनुच्छेद 51A(g) है।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संविधान का अनुच्छेद 243ZI राज्य विधानमंडल को सहकारी समितियों से संबंधित कानून बनाने का अधिकार देता है। इनमें से कौन सा सिद्धांत इसके दायरे में शामिल नहीं है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लोकतांत्रिक सदस्य नियंत्रण</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनिवार्य राज्य पर्यवेक्षण</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्वैच्छिक गठन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्वायत्त कार्यप्रणाली</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:1 tion": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">CPU निष्पादन के लिए आने वाले निर्देश को किस सिस्टम घटक से प्राप्त करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सिस्टम इनपुट बफर यूनिट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सिस्टम प्रोग्राम काउंटर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सिस्टम सेकेंडरी मेमोरी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सिस्टम आउटपुट रजिस्टर</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">CPU निष्पादित होने वाले अगले निर्देश का पता लगाने के लिए प्रोग्राम काउंटर (PC) का उपयोग करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रोग्राम काउंटर CPU के अंदर एक विशेष रजिस्टर होता है जो आने वाले निर्देश के मेमोरी एड्रेस को संग्रहीत करता है। फेच साइकिल के दौरान, CPU इस एड्रेस को पढ़ता है और मेमोरी से निर्देश प्राप्त करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">तो:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784206737710_image009.png\" width=\"348\" height=\"29\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निर्देश प्राप्त होने के बाद, प्रोग्राम काउंटर को अगले निर्देश को इंगित करने के लिए अपडेट किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: सिस्टम प्रोग्राम काउंटर</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केंद्रीय बजट 2026-27 के बारे में निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. नया आयकर अधिनियम, 2025, 1 अप्रैल 2026 से लागू होने वाला है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. इसने पूर्ण आयकर छूट की सीमा को ₹15 लाख वार्षिक आय तक बढ़ा दिया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऊपर दिए गए कथनों में से कौन सा/से सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो I और न ही II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I और II दोनों</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन I सही है</span><span style=\"font-family:'Nirmala UI'\"> - </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आयकर अधिनियम, 2025</span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1 अप्रैल 2026</span><span style=\"font-family:'Nirmala UI'\"> से प्रभावी होगा, जो पहले के छह दशक पुराने आयकर अधिनियम, 1961 का स्थान लेगा।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन II गलत है</span><span style=\"font-family:'Nirmala UI'\"> - नई कर व्यवस्था के तहत वेतनभोगी करदाताओं के लिए पूर्ण छूट की सीमा </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">₹12.75 लाख</span><span style=\"font-family:'Nirmala UI'\"> तक बढ़ाई गई थी, न कि ₹15 लाख तक।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">छूट की सटीक राशियों के बीच यह अंतर एक सामान्य रूप से परीक्षण किया जाने वाला विवरण है, क्योंकि उम्मीदवार अक्सर सटीक बजट संख्याओं को बढ़ा-चढ़ाकर बताते हैं या गलत याद रखते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">इसलिए, सही उत्तर 'केवल I' है।</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित 2025-26 की खेल उपलब्धियों को उनसे संबंधित एथलीट/टीम के साथ सुमेलित करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A. पहली बार 90 मीटर भाला फेंक का निशान पार किया - 1. नीरज चोपड़ा</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">B. राष्ट्रीय 100 मीटर स्प्रिंट रिकॉर्ड तोड़ा - 2. अनिमेष कुजूर</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">C. 15 साल की उम्र में सबसे कम उम्र के भारतीय क्रिकेट डेब्यूटांट - 3. वैभव सूर्यवंशी</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">D. यूएई में 2025 एशिया कप (आइस हॉकी) में कांस्य पदक जीता - 4. भारतीय महिला आइस हॉकी टीम</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा संयोजन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-1, B-2, C-3, D-4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-4, B-3, C-2, D-1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-2, B-1, C-4, D-3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-3, B-4, C-1, D-2</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नीरज चोपड़ा</span><span style=\"font-family:'Nirmala UI'\"> ने दोहा डायमंड लीग में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">90 मीटर का निशान (90.23 मीटर)</span><span style=\"font-family:'Nirmala UI'\"> पार किया; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनिमेष कुजूर</span><span style=\"font-family:'Nirmala UI'\"> ने भार
