<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>16.) RRB NTPC (UG) 2025-26 CBT-2 Paid Mock 8 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

family:'Nirmala UI'\">कथन I:</span><br><span style=\"font-family:'Nirmala UI'\">तनु मीना के ठीक दाएँ बैठी है, और सुनीता तनु के ठीक दाएँ बैठी है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कथन II:</span><br><span style=\"font-family:'Nirmala UI'\">रिया किसी एक छोर पर है, और कविता रिया के ठीक बाएँ बैठी है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कथन I और II दोनों एक साथ प्रश्न का उत्तर देने के लिए पर्याप्त नहीं हैं।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अकेले कथन I में दिया गया डेटा प्रश्न का उत्तर देने के लिए पर्याप्त है जबकि कथन II में दिया गया डेटा पर्याप्त नहीं है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अकेले कथन II में दिया गया डेटा प्रश्न का उत्तर देने के लिए पर्याप्त है जबकि कथन I में दिया गया डेटा पर्याप्त नहीं है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कथन I और II दोनों मिलकर (और अकेले कथन I या अकेले कथन II नहीं) प्रश्न का उत्तर देने के लिए पर्याप्त हैं।</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कथन I:</span><br><span style=\"font-family:'Nirmala UI'\">मीना </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> तनु </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> सुनीता</span><br><span style=\"font-family:'Nirmala UI'\">मध्य व्यक्ति की स्थिति निश्चित नहीं है।</span><br><span style=\"font-family:'Segoe UI Emoji d;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">नागरिकों के </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मौलिक कर्तव्य</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भारतीय संविधान के अनुच्छेद 51A</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में निहित हैं।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इन्हें </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">स्वर्ण सिंह समिति</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> की सिफारिशों के आधार पर </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">42वें संवैधानिक संशोधन अधिनियम, 1976</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> द्वारा जोड़ा गया था।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">शुरुआत में, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">10 मौलिक कर्तव्यों</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> को सूचीबद्ध किया गया था। बाद में, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">86वें संशोधन अधिनियम, 2002</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> ने एक और कर्तव्य (6-14 वर्ष की आयु के बच्चों की शिक्षा से संबंधित) जोड़ा, जिससे कुल </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">11 कर्तव्य</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> हो गए।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">ये कर्तव्य देशभक्ति, पर्यावरण संरक्षण, संविधान के प्रति सम्मान और सद्भाव को बढ़ावा देने जैसे मूल्यों पर जोर देते हैं।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 21A </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> शिक्षा के अधिकार (6-14 वर्ष की आयु के बच्चों के लिए मुफ्त और अनिवार्य शिक्षा) से संबंधित है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 32 </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> संवैधानिक उपचारों का अधिकार प्रदान करता है (डॉ. अंबेडकर ने इसे संविधान की “हृदय और आत्मा” कहा था)।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 39A </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> निर्देशक सिद्धांत जो समान न्याय और मुफ्त कानूनी सहा ily:'Nirmala UI'\">गोदावरी नदी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">प्रायद्वीपीय भारत की सबसे लंबी नदी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> है, जिसे अक्सर </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">“दक्षिणा गंगा” (दक्षिण की गंगा)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> कहा जाता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लंबाई:</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> लगभग </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1,465 किमी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उद्गम:</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> त्र्यंबकेश्वर (नासिक जिला, महाराष्ट्र)।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">गोदावरी बेसिन महाराष्ट्र, तेलंगाना, आंध्र प्रदेश, छत्तीसगढ़, मध्य प्रदेश, ओडिशा और कर्नाटक तक फैला हुआ है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">समाप्ति बिंदु:</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> राजामुंदरी (आंध्र प्रदेश) के पास </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बंगाल की खाड़ी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में गिरती है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">महत्व:</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> दक्षिणी भारत में सिंचाई, जलविद्युत परियोजनाओं और सांस्कृतिक विरासत का समर्थन करती है।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कृष्णा नदी </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> लंबाई ~1,400 किमी; गोदावरी से छोटी।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कावेरी नदी </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> लंबाई ~800 किमी; महत्वपूर्ण लेकिन सबसे लंबी नहीं।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">नर्मदा नदी </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> लंबाई ~1,312 किमी; पश्चिम में अरब सागर में गिरती है, लेकिन गोदावरी से छोटी।</span></li></ul>", "question_heading": ""}, {"sr_no": 38, "question": " <p an style=\"font-size:12pt;font-family:'Nirmala UI'\">“प्रारंभिक वैदिक समाज मुख्य रूप से जनजातीय था, और बड़ा समुदाय </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">जन</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के रूप में संगठित था। </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">परिवार (कुल) मूल सामाजिक इकाई था।</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">”</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राजन (राजा)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> जन का नेता था, लेकिन ध्यान </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सामूहिक जनजातीय पहचान</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> पर था, न कि केंद्रीकृत राजशाही पर।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">सभा और समिति जैसी सभाएँ निर्णय लेने में मदद करती थीं, जो प्रारंभिक वैदिक समाज की सहभागी प्रकृति को दर्शाती हैं।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राजन </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> राजा नेता था, लेकिन स्वयं प्राथमिक सामाजिक इकाई नहीं।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\ y:'Nirmala UI'\">लौटता हुआ मानसून का मौसम</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, जिसे </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मानसून के बाद का मौसम</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> भी कहा जाता है, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भारत में अक्टूबर से दिसंबर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> तक होता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इस अवधि के दौरान:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">दक्षिण-पश्चिम मानसून</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> भारत के अधिकांश हिस्सों से </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">वापस लौटता</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">हवाएँ दिशा बदल देती हैं और </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उत्तर-पूर्वी मानसूनी हवाएँ</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> बन जाती हैं।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">ये हवाएँ </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मुख्य रूप से तमिलनाडु, तटीय आंध्र प्रदेश और कर्नाटक व केरल के कुछ हिस्सों में वर्षा</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> लाती हैं।</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह मौसम </span><span style=\"font- an style=\"font-size:12pt;font-family:'Nirmala UI'\"> के दौरान स्थापित किया गया था।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">पहली बार </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1973</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में मनाया गया, यह </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पर्यावरण जागरूकता के लिए सबसे बड़ा वैश्विक मंच</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> बन गया है, जो दुनिया भर की सरकारों, गैर-सरकारी संगठनों, व्यवसायों और नागरिकों को जोड़ता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">प्रत्येक वर्ष, एक अलग देश इस आयोजन की मेजबानी एक विशिष्ट </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विषय</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के साथ करता है, जो जलवायु परिवर्तन, जैव विविधता या प्लास्टिक प्रदूषण जैसे तात्कालिक पर्यावरणीय मुद्दों पर केंद्रित होता है।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">8 मार्च </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> अंतर्राष्ट्रीय महिला दिवस।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bol ली इरेजेबल प्रोग्रामेबल रीड-ओनली मेमोरी)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> एक </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">नॉन-वोलाटाइल</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> मेमोरी है जो डेटा को </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विद्युत रूप से मिटाने और पुन: प्रोग्राम करने</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> की अनुमति देती है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">EPROM (जिसे मिटाने के लिए पराबैंगनी प्रकाश की आवश्यकता होती है) के विपरीत, EEPROM को विद्युत संकेतों का उपयोग करके मिटाया और फिर से लिखा जा सकता है, जिससे यह अधिक लचीला और व्यावहारिक हो जाता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह बिजली आपूर्ति बंद होने पर भी डेटा को बरकरार रखता है, और एम्बेडेड सिस्टम, माइक्रोकंट्रोलर और BIOS चिप्स में व्यापक रूप से उपयोग किया जाता है।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">SRAM मेमोरी </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> अस्थिर (Volatile); बिजली बंद होने पर डेटा खो देता है, कैश के लिए उपयोग किया जाता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">DRAM मेमोरी </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> अस्थिर (Volatile); मुख्य सिस्टम रैम के रूप में उपयोग की जाती है, जिसे लगातार रिफ्रेशिंग की आवश्यकता होती है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">EPROM मेमोरी </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> नॉन-वोलाटाइल है, लेकिन इसे मिटाने के लिए UV प्रकाश की आवश्यकता होती है, न कि विद्युत संकेतों की।</span></li></ul>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लद्दाख में किस स्थान को खगोल-पर्यटन (astro-tourism) को बढ़ावा देने के लिए भारत का पहला डार्क स्काई रिजर्व घोषित किया गया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हेनले डार्क रिजर्व</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पैंगोंग डार्क रिजर्व</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नुब्रा डार्क रिजर्व</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लेह डार्क रिजर्व</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प A — हेनले डार्क रिजर्व</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">भारत का </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पहला डार्क स्काई रिजर्व</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">2022</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लद्दाख के हेनले</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में घोषित किया गया था।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">चांगथांग वन्यजीव अभयारण्य</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में स्थित, हेनले अपनी </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उच्च ऊंचाई (4,500 मीटर)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">स्वच्छ आकाश</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> और </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">न्यूनतम प्रकाश प्रदूषण</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के लिए जाना जाता है, जो इसे </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">खगोल-पर्यटन</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> और खगोलीय अनुसंधान के लिए आदर्श बनाता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">इस पहल को </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भारतीय खगोल भौतिकी संस्थान (IIA)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लद्दाख स्वायत्त पहाड़ी विकास परिषद (LAHDC)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, और </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">केंद्रीय विज्ञान और प्रौद्योगिकी मंत्रालय</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> द्वारा समर्थन मिला था।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">हेनले </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भारतीय खगोलीय वेधशाला</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का भी घर है, जो दुनिया की सबसे ऊंची वेधशालाओं में से एक है।</span></li></ul>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उत्तर भारतीय (नागर शैली) मंदिर वास्तुकला में 'शिखर' किस विशेषता को संदर्भित करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गर्भगृह के ऊपर का शिखर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रवेश द्वार मेहराब</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्तंभों वाला सभा कक्ष</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पवित्र जल कुंड</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प A — गर्भगृह के ऊपर का शिखर</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उत्तर भारतीय (नागर शैली) मंदिर वास्तुकला</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> में, </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">शिखर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">गर्भगृह (garbhagriha)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के ठीक ऊपर बनी </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मीनार या चोटी</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> को संदर्भित करता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह नागर मंदिरों की सबसे प्रमुख विशेषता है, जो लंबवत उठती है और अक्सर वक्ररेखीय आकार की होती है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">प्रतीकात्मक रूप से, शिखर </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">एक्सिस मुंडी (ब्रह्मांडीय धुरी)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> का प्रतिनिधित्व करता है, जो पार्थिव लोक को दिव्य लोक से जोड़ता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">प्रसिद्ध उदाहरणों में </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लिंगराज मंदिर (भुवनेश्वर)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> और </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कंदरिया महादेव मंदिर (खजुराहो)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> शामिल हैं।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">प्रवेश द्वार मेहराब </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">तोरण</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> को संदर्भित करता है, शिखर को नहीं।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">स्तंभों वाला सभा कक्ष </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मंडप</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> को संदर्भित करता है, जिसका उपयोग सभाओं और अनुष्ठानों के लिए किया जाता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पवित्र जल कुंड </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पुष्करिणी/कुंड</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> के नाम से जाना जाता है, शिखर नहीं।</span></li></ul>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कौन सा नियम बताता है कि प्रत्येक क्रिया की एक समान और विपरीत प्रतिक्रिया होती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न्यूटन का पहला नियम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न्यूटन का दूसरा नियम</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न्यूटन का तीसरा नियम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गुरुत्वाकर्षण का नियम</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प C — न्यूटन का तीसरा नियम</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">न्यूटन का गति का तीसरा नियम</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> कहता है: </span><span style=\"font-size:12pt;font-style:italic;font-family:'Nirmala UI'\">“प्रत्येक क्रिया के लिए एक समान और विपरीत प्रतिक्रिया होती है।”</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह सिद्धांत दो पिंडों के बीच की अंतःक्रियाओं की व्याख्या करता है: जब एक पिंड बल लगाता है, तो दूसरा पिंड विपरीत दिशा में समान बल लगाता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उदाहरण:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">एक रॉकेट नीचे की ओर गैसें उत्सर्जित करता है </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> गैसें रॉकेट को ऊपर की ओर धकेलती हैं।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">जब आप एक दीवार के खिलाफ धक्का देते हैं </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> तो दीवार समान बल के साथ वापस धक्का देती है।</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">न्यूटन का पहला नियम </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> जड़ता का नियम: एक पिंड तब तक अपनी विराम अवस्था में या एक समान गति में रहता है जब तक कि उस पर कोई बाहरी बल कार्य न करे।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">न्यूटन का दूसरा नियम </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> बल को </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787316712820_image001.png\" width=\"65\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-size:12pt;font-family:'Nirmala UI'\">(बल = द्रव्यमान × त्वरण) के रूप में परिभाषित करता है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">गुरुत्वाकर्षण का नियम </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> कहता है कि प्रत्येक द्रव्यमान दूसरे द्रव्यमान को उनके द्रव्यमानों के समानुपाती और उनके बीच की दूरी के वर्ग के व्युत्क्रमानुपाती बल से आकर्षित करता है।</span></li></ul>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संविधान की दसवीं अनुसूची निम्नलिखित में से किससे संबंधित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दल-बदल विरोधी कानून</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पंचायती राज की शक्तियाँ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राजभाषा नियम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आपातकालीन प्रावधानों की सूची</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> सही उत्तर: </span><span style=\"font-family:'Nirmala UI'\">विकल्प A — दल-बदल विरोधी कानून</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">भारतीय संविधान की </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">दसवीं अनुसूची</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> को </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">52वें संवैधानिक संशोधन अधिनियम, 1985</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> द्वारा जोड़ा गया था।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यह </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">दल-बदल के आधार पर संसद और राज्य विधानमंडलों के सदस्यों की अयोग्यता</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> से संबंधित है।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">प्रमुख प्रावधान:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">एक सदस्य को अयोग्य घोषित किया जाता है यदि वे अपनी राजनीतिक पार्टी की </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सदस्यता स्वेच्छा से छोड़ देते हैं</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">यदि वे पूर्व अनुमति के बिना </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पार्टी व्हिप के खिलाफ मतदान करते हैं या अनुपस्थित रहते हैं</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, तो भी अयोग्यता लागू होती है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अपवाद:</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> यदि किसी पार्टी के दो-तिहाई सदस्य दूसरी पार्टी में विलय कर लेते हैं, तो इसे दल-बदल नहीं माना जाता है।</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">सदन के </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अध्यक्ष/सभापति</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> अयोग्यता के मामलों का निर्णय करते हैं।</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पंचायती राज शक्तियां </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ग्यारहवीं अनुसूची</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (73वां संशोधन, 1992) के तहत शामिल।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राजभाषा नियम </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">आठवीं अनुसूची</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> (मान्यता प्राप्त भाषाएं) के तहत शामिल।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">आपातकालीन प्रावधानों की सूची </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">संविधा
