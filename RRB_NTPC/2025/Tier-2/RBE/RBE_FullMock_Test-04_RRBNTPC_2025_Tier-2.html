pan></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">इसे मुगल साम्राज्य के प्रमुख हिस्सों में लागू किया गया था।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह प्रणाली अकबर के वित्त मंत्री </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राजा टोडरमल</span><span style=\"font-family:'Nirmala UI'\"> से घनिष्ठ रूप से जुड़ी थी और बाद में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दहसाला प्रणाली</span><span style=\"font-family:'Nirmala UI'\"> का आधार बनी।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: विकल्प 1 — अकबर</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मॉर्ले-मिंटो सुधार भारत में ब्रिटिश सरकार द्वारा ______ में पेश किए गए थे।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1909</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1919</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1935</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1905</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: 1909 (विकल्प 1)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मॉर्ले-मिंटो सुधार</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारतीय परिषद अधिनियम, 1909</span><span style=\"font-family:'Nirmala UI'\"> के माध्यम से पेश किए गए थे।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इनका नाम इनके नाम पर रखा गया था:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लॉर्ड मॉर्ले</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> — भारत के राज्य सचिव</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लॉर्ड मिंटो</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> — भारत के वायसराय</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इन सुधारों की एक प्रमुख विशेषता </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुसलमानों के लिए पृथक निर्वाचन मंडल</span><span style=\"font-family:'Nirmala UI'\"> की शुरुआत थी, जिससे मुस्लिम मतदाता अपने प्रतिनिधियों का चुनाव कर सकें।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सुधारों ने केंद्रीय और प्रांतीय विधान परिषदों में सदस्यों की संख्या भी बढ़ाई।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: विकल्प 1 — 1909</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अगस्त 1925 की काकोरी ट्रेन डकैती का आयोजन ______ द्वारा किया गया था:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बंगाल और बिहार में अनुशीलन समिति</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उत्तरी अमेरिका से कार्य करने वाली गदर पार्टी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संयुक्त प्रांत में हिंदुस्तान रिपब्लिकन एसोसिएशन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लाहौर और दिल्ली में स्थित HSRA इकाई</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: संयुक्त प्रांत में हिंदुस्तान रिपब्लिकन एसोसिएशन (विकल्प 3)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">काकोरी ट्रेन डकैती</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">9 अगस्त 1925</span><span style=\"font-family:'Nirmala UI'\"> को लखनऊ के पास, काकोरी में हुई थी। इसका आयोजन </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हिंदुस्तान रिपब्लिकन एसोसिएशन (HRA)</span><span style=\"font-family:'Nirmala UI'\"> के सदस्यों द्वारा किया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">क्रांतिकारियों का लक्ष्य ट्रेन द्वारा ले जाए जा रहे सरकारी पैसे को जब्त करना और ब्रिटिश शासन के खिलाफ क्रांतिकारी गतिविधियों को वित्तपोषित करने के लिए इसका उपयोग करना था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इस घटना से जुड़े महत्वपूर्ण नेताओं में शामिल थे:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राम प्रसाद बिस्मिल</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अशफ़ाकउल्ला खान</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राजेंद्र लाहिड़ी</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">रोशन सिंह</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">चंद्रशेखर आज़ाद</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: विकल्प 3 — संयुक्त प्रांत में हिंदुस्तान रिपब्लिकन एसोसिएशन</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन 'भारत छोड़ो आंदोलन' (1942) को उसके बाद के चरण में अक्सर एक स्वतः स्फूर्त, नेतृत्वविहीन जन आंदोलन के रूप में वर्णित किए जाने का प्राथमिक कारण सबसे अच्छी तरह बताता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह आंदोलन वास्तव में कांग्रेस द्वारा कभी आयोजित ही नहीं किया गया था</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आंदोलन शुरू होने से पहले ब्रिटिश सरकार ने विरोध के सभी रूपों पर प्रतिबंध लगा दिया था</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आंदोलन शुरू होने के तुरंत बाद अधिकांश वरिष्ठ कांग्रेस नेताओं को गिरफ्तार कर लिया गया था, जिससे स्थानीय नेताओं और आम नागरिकों को इसे स्वतंत्र रूप से जारी रखना पड़ा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गांधी ने व्यक्तिगत रूप से देश भर में हर विरोध का नेतृत्व किया था</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">8 अगस्त 1942 को भारत छोड़ो आंदोलन शुरू करने के तुरंत बाद </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अधिकांश वरिष्ठ कांग्रेस नेताओं को गिरफ्तार कर लिया गया था</span><span style=\"font-family:'Nirmala UI'\">, इसलिए आंदोलन के बाद के चरण काफी हद तक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्थानीय नेताओं, छात्रों और आम नागरिकों द्वारा स्वतः स्फूर्त</span><span style=\"font-family:'Nirmala UI'\"> रूप से, बिना किसी केंद्रीकृत राष्ट्रीय निर्देशन के आगे बढ़ाए गए - जिससे इसे इस बाद के चरण में इसका विशिष्ट 'नेतृत्वविहीन' चरित्र मिला।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">इस विकेन्द्रीकृत चरित्र के कारण विभिन्न क्षेत्रों में प्रतिरोध के विविध रूप देखने को मिले, जिनमें सतारा (महाराष्ट्र) और तामलुक (बंगाल) जैसे कुछ क्षेत्रों में समानांतर सरकारें स्थापित की गईं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'आंदोलन शुरू होने के तुरंत बाद अधिकांश वरिष्ठ कांग्रेस नेताओं को गिरफ्तार कर लिया गया था, जिससे स्थानीय नेताओं और आम नागरिकों को इसे स्वतंत्र रूप से जारी रखना पड़ा'।</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन 'कलरबल लेजिस्लेशन के सिद्धांत' (Doctrine of Colourable Legislation) का सही वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह सिद्धांत कि एक विधायिका अप्रत्यक्ष रूप से वह नहीं कर सकती जो उसे प्रत्यक्ष रूप से करने से प्रतिबंधित है, जिसमें कानून के पीछे की वास्तविक विधायी क्षमता की जाँच की जाती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक सिद्धांत जो भारतीय संवैधानिक कानून से असंबंधित है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संसद भवन की रंग योजना को नियंत्रित करने वाला सिद्धांत</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह सिद्धांत कि सभी कानून एक विशिष्ट रंग-कोडित प्रारूप में लिखे जाने चाहिए</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कलरबल लेजिस्लेशन का सिद्धांत</span><span style=\"font-family:'Nirmala UI'\"> यह मानता है कि एक विधायिका </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अप्रत्यक्ष रूप से वह नहीं कर सकती जो उसे संवैधानिक रूप से प्रत्यक्ष रूप से करने से प्रतिबंधित है</span><span style=\"font-family:'Nirmala UI'\"> - अदालतें कानून के पीछे की वास्तविक सार और क्षमता की जांच करती हैं, न कि केवल उसके घोषित रूप की, ताकि विधायिकाओं को असंवैधानिक कानून को अपनी शक्ति के भीतर किसी चीज़ के रूप में छिपाने से रोका जा सके।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह सिद्धांत 'सार और तत्व के सिद्धांत' (Doctrine of Pith and Substance) से निकटता से संबंधित है, ये दोनों ही ऐसे उपकरण हैं जिनका उपयोग अदालतें सरकार के विभिन्न स्तरों के बीच क्षेत्रीय विवादों के मामलों में कानून की वास्तविक प्रकृति की जांच करने के लिए करती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'यह सिद्धांत कि एक विधायिका अप्रत्यक्ष रूप से वह नहीं कर सकती जो उसे प्रत्यक्ष रूप से करने से प्रतिबंधित है, जिसमें कानून के पीछे की वास्तविक विधायी क्षमता की जाँच की जाती है'।</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन भारत के नियंत्रक और महालेखा परीक्षक (CAG) के पद की सही अवधि है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">5 वर्ष निश्चित, कोई आयु सीमा नहीं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">6 वर्ष या 65 वर्ष की आयु तक, जो भी पहले हो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">6 वर्ष निश्चित, आयु के बावजूद</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">62 वर्ष की आयु तक, कोई निश्चित कार्यकाल नहीं</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">CAG</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">6 वर्ष</span><span style=\"font-family:'Nirmala UI'\"> की अवधि के लिए या </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">65 वर्ष की आयु प्राप्त करने तक, जो भी पहले हो</span><span style=\"font-family:'Nirmala UI'\">, पद धारण करता है, जो इस प्रमुख संवैधानिक प्रहरी के लिए एक निश्चित लेकिन लचीला कार्यकाल सुनिश्चित करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह दोहरी शर्त (कार्यकाल की अवधि या आयु सीमा) एक विशिष्ट विशेषता है जो कुछ अन्य संवैधानिक नियुक्तियों में भी देखी जाती है, जो निरंतरता को अंततः अनिवार्य सेवानिवृत्ति के साथ संतुलित करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर '6 वर्ष या 65 वर्ष की आयु तक, जो भी पहले हो' है।</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक विधेयक किसी राज्य की सीमा को उस राज्य की सहमति के बिना बदलना चाहता है। निम्नलिखित में से कौन ऐसे विधेयक को पारित करने के लिए संवैधानिक आवश्यकता का सही वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संसद द्वारा विधेयक पर विचार करने से पहले संबंधित राज्य की स्पष्ट सहमति आवश्यक है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विधेयक के लिए राष्ट्रपति की पूर्व सिफारिश और संबंधित राज्य विधानमंडल को उसके विचारों के लिए संदर्भित करना (हालांकि विचार बाध्यकारी नहीं हैं) आवश्यक है, जिसके बाद संसद में साधारण बहुमत से पारित किया जाता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विधेयक के लिए संसद में दो-तिहाई विशेष बहुमत की आवश्यकता होती है, जो संवैधानिक संशोधन के समान है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह विधेयक केवल राज्य विधानमंडल द्वारा पारित किया जा सकता है, जिसमें संसद की कोई भूमिका नहीं होती</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 3</span><span style=\"font-family:'Nirmala UI'\"> के तहत, किसी राज्य की सीमा को बदलने के लिए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राष्ट्रपति की पूर्व सिफारिश</span><span style=\"font-family:'Nirmala UI'\"> की आवश्यकता होती है, और विधेयक को संबंधित </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राज्य विधानमंडल को उसके विचारों के लिए</span><span style=\"font-family:'Nirmala UI'\"> संदर्भित किया जाना चाहिए - हालांकि, ये विचार संसद पर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बाध्यकारी नहीं</span><span style=\"font-family:'Nirmala UI'\"> होते हैं, जो तब राज्य की वास्तविक सहमति की आवश्यकता के बिना, विधेयक को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">साधारण बहुमत</span><span style=\"font-family:'Nirmala UI'\"> से पारित कर सकती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह प्रावधान भारत की संघीय संरचना में निहित मजबूत एकात्मक झुकाव को दर्शाता है, जो संसद को किसी राज्य की अपनी प्राथमिकताओं के विरुद्ध भी राज्य की सीमाओं को पुनर्गठित करने की महत्वपूर्ण शक्ति देता है, यह विशेषता कई अन्य संघीय प्रणालियों से काफी अलग है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है \"विधेयक के लिए राष्ट्रपति की पूर्व सिफारिश और संबंधित राज्य विधानमंडल को उसके विचारों के लिए संदर्भित करना (हालांकि विचार बाध्यकारी नहीं हैं) आवश्यक है, जिसके बाद संसद में साधारण बहुमत से पारित किया जाता है\"।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संविधान के अनुसार, भारत के कार्यवाहक मुख्य न्यायाधीश की नियुक्ति का प्रावधान किस अनुच्छेद में है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 130</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 120</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 126</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 122</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: अनुच्छेद 126 (विकल्प 3)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संविधान का अनुच्छेद </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">126</span><span style=\"font-family:'Nirmala UI'\"> भारत के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कार्यवाहक मुख्य न्यायाधीश</span><span style=\"font-family:'Nirmala UI'\"> की नियुक्ति से संबंधित है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जब भारत के मुख्य न्यायाधीश का पद रिक्त होता है, या जब मुख्य न्यायाधीश अपने कार्यालय के कर्तव्यों का पालन करने में असमर्थ होते हैं, तो </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राष्ट्रपति सर्वोच्च न्यायालय के किसी अन्य न्यायाधीश को</span><span style=\"font-family:'Nirmala UI'\"> भारत के मुख्य न्यायाधीश के रूप में कार्य करने के लिए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नियुक्त कर सकते हैं</span><span style=\"font-family:'Nirmala UI'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: विकल्प 3 — अनुच्छेद 126</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सी रिट अपने प्राथमिक उद्देश्य के आधार पर 'विषम' है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">क्वो वारंटो</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बंदी प्रत्यक्षीकरण</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">परमादेश</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उत्प्रेषण</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">परमादेश, उत्प्रेषण और क्वो वारंटो</span><span style=\"font-family:'Nirmala UI'\"> सभी रिट मुख्य रूप से </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सार्वजनिक प्राधिकरणों/अधिकारियों के कार्यों को नियंत्रित करने</span><span style=\"font-family:'Nirmala UI'\"> के उद्देश्य से जारी की जाती हैं - परमादेश किसी कर्तव्य के पालन को अनिवार्य करता है, उत्प्रेषण एक अवैध निर्णय को रद्द करता है, और क्वो वारंटो पद धारण करने के अधिकार पर प्रश्नचिह्न लगाता है। हालांकि, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बंदी प्रत्यक्षीकरण</span><span style=\"font-family:'Nirmala UI'\"> का प्राथमिक उद्देश्य </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">किसी व्यक्ति की व्यक्तिगत स्वतंत्रता को सुरक्षित करना</span><span style=\"font-family:'Nirmala UI'\"> है, उसे न्यायालय के समक्ष पेश करने की आवश्यकता के द्वारा, जो इसे इसके मूल उद्देश्य (सार्वजनिक प्राधिकरण के कार्यों की समीक्षा करने के बजाय व्यक्तिगत स्वतंत्रता की रक्षा करना) में मौलिक रूप से भिन्न बनाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह अंतर इस बात पर प्रकाश डालता है कि संविधान के अनुच्छेद 32 और 226 के तहत उपलब्ध पाँच रिटों में से बंदी प्रत्यक्षीकरण को अक्सर सबसे प्रत्यक्ष रूप से स्वतंत्रता-संरक्षक माना जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर बंदी प्रत्यक्षीकरण (विषम विकल्प) है।</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">FORTRAN और COBOL जैसी उच्च-स्तरीय प्रोग्रामिंग भाषाओं के विकास ने कंप्यूटर के उपयोग को किस महत्वपूर्ण तरीके से बदल दिया?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसने कंप्यूटर को केवल वैज्ञानिक गणनाओं के लिए कार्य करने योग्य बनाया।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसने कंपाइलरों की आवश्यकता को समाप्त कर दिया।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसने सभी प्रोग्रामरों को केवल बाइनरी संख्याओं का उपयोग करने के लिए मजबूर किया।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसने कार्यक्रमों को अधिक मानवीय-पठनीय रूपों में लिखने की अनुमति दी, जिससे जटिल सॉफ्टवेयर विकसित करना आसान हो गया।</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: इसने कार्यक्रमों को अधिक मानवीय-पठनीय रूपों में लिखने की अनुमति दी, जिससे जटिल सॉफ्टवेयर विकसित करना आसान हो गया। (विकल्प 4)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">FORTRAN</span><span style=\"font-family:'Nirmala UI'\"> और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">COBOL</span><span style=\"font-family:'Nirmala UI'\"> जैसी उच्च-स्तरीय प्रोग्रामिंग भाषाओं ने प्रोग्रामिंग को बहुत आसान बना दिया क्योंकि प्रोग्रामरों को अब सीधे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मशीन भाषा या बाइनरी कोड</span><span style=\"font-family:'Nirmala UI'\"> में निर्देश लिखने की आवश्यकता नहीं थी।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इन भाषाओं ने ऐसे शब्दों, प्रतीकों और कथनों का उपयोग किया जो मानवीय भाषा के करीब थे। इससे प्रोग्राम बने:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">लिखने और समझने में आसान</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">डीबग और रखरखाव करने में आसान</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">बड़े और जटिल सॉफ्टवेयर विकसित करने के लिए अधिक उपयुक्त</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">FORTRAN</span><span style=\"font-family:'Nirmala UI'\"> को मुख्य रूप से वैज्ञानिक और गणितीय गणनाओं के लिए विकसित किया गया था, जबकि </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">COBOL</span><span style=\"font-family:'Nirmala UI'\"> का व्यापक रूप से व्यावसायिक और वाणिज्यिक अनुप्रयोगों के लिए उपयोग किया जाता था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: विकल्प 4 — इसने कार्यक्रमों को अधिक मानवीय-पठनीय रूपों में लिखने की अनुमति दी, जिससे जटिल सॉफ्टवेयर विकसित करना आसान हो गया।</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा सिस्टम सॉफ्टवेयर का सबसे अच्छा वर्णन करता है? सही विकल्प चुनें।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मल्टीमीडिया फाइलें प्ले करने के लिए सॉफ्टवेयर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वह सॉफ्टवेयर जो हार्डवेयर का प्रबंधन करता है और एप्लीकेशन सॉफ्टवेयर के लिए प्लेटफॉर्म प्रदान करता है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दस्तावेज़ बनाने के लिए उपयोग किया जाने वाला सॉफ्टवेयर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इंटरनेट ब्राउज़ करने के लिए सॉफ्टवेयर</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: हार्डवेयर को प्रबंधित करने और एप्लीकेशन सॉफ्टवेयर के लिए एक प्लेटफॉर्म प्रदान करने वाला सॉफ्टवेयर (विकल्प 2)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सिस्टम सॉफ्टवेयर</span><span style=\"font-family:'Nirmala UI'\"> कंप्यूटर के हार्डवेयर संसाधनों को नियंत्रित और प्रबंधित करता है और एक ऐसा वातावरण प्रदान करता है जिसमें एप्लीकेशन सॉफ्टवेयर चल सके।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सिस्टम सॉफ्टवेयर के उदाहरणों में शामिल हैं:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">ऑपरेटिंग सिस्टम जैसे विंडोज, लिनक्स और मैकओएस</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">डिवाइस ड्राइवर</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">यूटिलिटी प्रोग्राम</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">भाषा अनुवादक</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अन्य विकल्प </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एप्लीकेशन सॉफ्टवेयर</span><span style=\"font-family:'Nirmala UI'\"> का वर्णन करते हैं, जैसे मीडिया प्लेयर, वर्ड प्रोसेसर और वेब ब्राउज़र।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: विकल्प 2 — हार्डवेयर को प्रबंधित करने और एप्लीकेशन सॉफ्टवेयर के लिए एक प्लेटफॉर्म प्रदान करने वाला सॉफ्टवेयर</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक उपयोगकर्ता देखता है कि कई नए प्रोग्राम स्थापित करने के बाद उसका कंप्यूटर काफी धीमा हो गया है, जिनमें से कई को उसे मंजूरी देना याद नहीं है। निम्नलिखित में से सबसे संभावित अंतर्निहित कारण क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इंटरनेट कनेक्शन तेज़ हो गया है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किसी वैध डाउनलोड के साथ मैलवेयर या अवांछित बंडल सॉफ्टवेयर स्थापित हो गया होगा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऑपरेटिंग सिस्टम को हाल ही में एक नए संस्करण में अपडेट किया गया है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कंप्यूटर की रैम भौतिक रूप से आकार में बढ़ गई है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रोग्राम का </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उपयोगकर्ता की स्पष्ट जानकारी या सहमति के बिना</span><span style=\"font-family:'Nirmala UI'\"> दिखाई देना, खासकर डाउनलोड के बाद, दृढ़ता से यह बताता है कि एक वैध प्रोग्राम के साथ </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मैलवेयर या अवांछित बंडल सॉफ्टवेयर</span><span style=\"font-family:'Nirmala UI'\"> स्थापित किया गया था - जो कि अविश्वसनीय सॉफ्टवेयर वितरकों द्वारा उपयोग की जाने वाली एक सामान्य रणनीति है, जो अक्सर सिस्टम के प्रदर्शन को काफी धीमा कर देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह परिदृश्य ऐसी अवांछित बंडल स्थापनाओं से बचने के लिए इंस्टॉलेशन प्रॉम्प्ट को ध्यान से पढ़ने और केवल विश्वसनीय, आधिकारिक स्रोतों से सॉफ्टवेयर डाउनलोड करने के महत्व पर प्रकाश डालता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'किसी वैध डाउनलोड के साथ मैलवेयर या अवांछित बंडल सॉफ्टवेयर स्थापित हो गया होगा'।</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन 'डेटाबेस मैनेजमेंट सिस्टम (DBMS)' का सबसे अच्छा वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक सॉफ्टवेयर जो डेटाबेस में संग्रहीत संरचित डेटा के निर्माण, प्रबंधन और क्वेरी को सक्षम बनाता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक प्रोग्रामिंग भाषा जिसका उपयोग विशेष रूप से वेब डिज़ाइन के लिए किया जाता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक प्रकार का कंप्यूटर वायरस जो डेटाबेस को लक्षित करता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक हार्डवेयर डिवाइस जिसका उपयोग डेटा को भौतिक रूप से संग्रहीत करने के लिए किया जाता है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">DBMS</span><span style=\"font-family:'Nirmala UI'\"> एक सॉफ्टवेयर है जो उपयोगकर्ताओं को MySQL, Oracle या PostgreSQL जैसे डेटाबेस में संग्रहीत </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">संरचित डेटा को बनाने, प्रबंधित करने और क्वेरी करने</span><span style=\"font-family:'Nirmala UI'\"> में सक्षम बनाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">DBMS सॉफ्टवेयर डेटा स्टोरेज, पुनर्प्राप्ति, सुरक्षा और डेटा अखंडता सुनिश्चित करने जैसे महत्वपूर्ण कार्यों को संभालता है, जो अधिकांश आधुनिक एप्लीकेशनों की रीढ़ है जिन्हें जानकारी को स्टोर और प्रबंधित करने की आवश्यकता होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'एक सॉफ्टवेयर जो डेटाबेस में संग्रहीत संरचित डेटा के निर्माण, प्रबंधन और क्वेरी को सक्षम बनाता है'।</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संसद ने वित्तीय अनुशासन को संस्थागत बनाने और दीर्घकालिक समष्टि-आर्थिक स्थिरता सुनिश्चित करने के लिए राजकोषीय उत्तरदायित्व और बजट प्रबंधन अधिनियम किस वर्ष अधिनियमित किया?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2006</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2003</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2009</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: 2003 (विकल्प 2)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संसद ने </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राजकोषीय उत्तरदायित्व और बजट प्रबंधन (FRBM) अधिनियम</span><span style=\"font-family:'Nirmala UI'\"> को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">2003</span><span style=\"font-family:'Nirmala UI'\"> में अधिनियमित किया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अधिनियम के मुख्य उद्देश्य थे:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राजकोषीय अनुशासन</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> को बढ़ावा देना</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">सरकार के </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राजकोषीय घाटे</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> को कम करना</span></li><li style=\"margin-left:27. 6 फाइनल - 3. भारत</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">D. G20 शिखर सम्मेलन 2025 - 4. दक्षिण अफ्रीका</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा संयोजन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-2, B-1, C-4, D-3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-4, B-3, C-2, D-1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-3, B-4, C-1, D-2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-1, B-2, C-3, D-4</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्काईट्रैक्स अवार्ड्स 2026 में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सिंगापुर के चांगी हवाई अड्डे</span><span style=\"font-family:'Nirmala UI'\"> को दुनिया का सर्वश्रेष्ठ स्थान दिया गया; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">फीफा विश्व कप 2026</span><span style=\"font-family:'Nirmala UI'\"> की सह-मेजबानी </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">यूएसए</span><span style=\"font-family:'Nirmala UI'\"> (कनाडा और मैक्सिको के साथ) द्वारा की जाएगी; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">WPL 2026 फाइनल</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारत</span><span style=\"font-family:'Nirmala UI'\"> में आयोजित किया गया था; और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">20वां G20 शिखर सम्मेलन (2025) दक्षिण अफ्रीका</span><span style=\"font-family:'Nirmala UI'\"> द्वारा आयोजित किया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">प्रमुख वैश्विक खेल और राजनयिक आयोजनों के मेजबान देशों/शहरों पर नज़र रखना प्रतियोगी परीक्षाओं में अक्सर परखा जाने वाला एक करेंट अफेयर्स कौशल है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही संयोजन A-1, B-2, C-3, D-4 है।</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किस संगठन ने 2025 में मॉन्ट्रियल में आयोजित 42वीं महासभा के दौरान भारत की अंतरराष्ट्रीय नागरिक उड्डयन में भूमिका को मान्यता देते हुए, भारत के अपने गवर्निंग काउंसिल में फिर से चुने जाने की पुष्टि की?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ICAO (अंतर्राष्ट्रीय नागरिक उड्डयन संगठन)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">IMO (अंतर्राष्ट्रीय समुद्री संगठन)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यूनेस्को</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">WHO</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मॉन्ट्रियल में अपनी </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">42वीं महासभा</span><span style=\"font-family:'Nirmala UI'\"> के दौरान </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ICAO परिषद</span><span style=\"font-family:'Nirmala UI'\"> में भारत को पुनः चुना गया, जो अंतर्राष्ट्रीय नागरिक उड्डयन सुरक्षा, संरक्षा और स्थिरता में भारत के प्रमुख योगदान को मान्यता देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">ICAO, संयुक्त राष्ट्र की एक विशेष एजेंसी, हवाई नेविगेशन के लिए वैश्विक मानक निर्धारित करती है और विश्व स्तर पर नागरिक उड्डयन विकास का समन्वय करती है, जो अंतर्राष्ट्रीय शिपिंग को विनियमित करने वाले IMO से अलग है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर ICAO (अंतर्राष्ट्रीय नागरिक उड्डयन संगठन) है।</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किस संगठन ने 'ग्लोबल रिस्क रिपोर्ट 2025' जारी की, जो वैश्विक खतरों का एक व्यापक रूप से उद्धृत वार्षिक आकलन है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संयुक्त राष्ट्र विकास कार्यक्रम (UNDP)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अंतर्राष्ट्रीय मुद्रा कोष (IMF)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विश्व आर्थिक मंच (WEF)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संयुक्त राष्ट्र पर्यावरण कार्यक्रम (UNEP)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विश्व आर्थिक मंच (WEF)</span><span style=\"font-family:'Nirmala UI'\"> ने </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ग्लोबल रिस्क रिपोर्ट 2025</span><span style=\"font-family:'Nirmala UI'\"> जारी की, जो वैश्विक अर्थव्यवस्था और समाज के सामने आने वाले प्रमुख जोखिमों, भू-राजनीतिक तनावों से लेकर पर्यावरणीय खतरों तक, की पहचान करने वाला एक व्यापक रूप से उद्धृत वार्षिक आकलन है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">WEF कई अन्य प्रभावशाली वार्षिक रिपोर्ट भी प्रकाशित करता है, जिसमें ग्लोबल कॉम्पिटिटिवनेस रिपोर्ट और ग्लोबल जेंडर गैप रिपोर्ट शामिल हैं, जो इसे समसामयिक मामलों की तैयारी के लिए एक महत्वपूर्ण स्रोत बनाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर विश्व आर्थिक मंच (WEF) है।</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वर्ल्ड मॉन्यूमेंट्स फंड द्वारा जारी 'वर्ल्ड मॉन्यूमेंट्स वॉच लिस्ट 2025' में कौन सा भारतीय विरासत स्थल शामिल किया गया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">काजीरंगा राष्ट्रीय उद्यान</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अजंता-एलोरा गुफाएँ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-fam :12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से शास्त्रीय नृत्य शैली - कलाकार परंपरा युग्मों में से कौन-सा सही सुमेलित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मोहिनीअट्टम - पारंपरिक रूप से महिलाओं द्वारा किया जाने वाला एकल नृत्य</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ओडिसी - विशेष रूप से एक समूह नृत्य जिसमें कोई एकल परंपरा नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सत्त्रिया - केवल मठ (सत्त्र) सेटिंग्स के बाहर किया जाता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कथकली - पारंपरिक रूप से महिलाओं द्वारा एकल नृत्य के रूप में प्रदर्शित किया जाता है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मोहिनीअट्टम</span><span style=\"font-family:'Nirmala UI'\"> को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पारंपरिक रूप से महिलाओं द्वारा किया जाने वाला एकल नृत्य</span><span style=\"font-family:'Nirmala UI'\"> के रूप में सही ढंग से पहचाना गया है। अन्य युग्म गलत हैं: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथकली</span><span style=\"font-family:'Nirmala UI'\"> पारंपरिक रूप से </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुख्यतः पुरुषों द्वारा किया जाने वाला एक नृत्य-नाटिका</span><span style=\"font-family:'Nirmala UI'\"> है, न कि महिलाओं का एकल नृत्य; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ओडिसी</span><span style=\"font-family:'Nirmala UI'\"> में एकल और समूह दोनों प्रदर्शन परंपराएँ हैं, न कि विशेष रूप से समूह; और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सत्त्रिया</span><span style=\"font-family:'Nirmala UI'\"> पारंपरिक रूप से असम में मठ (सत्त्र) सेटिंग्स के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भीतर</span><span style=\"font-family:'Nirmala UI'\"> किया जाता था, न कि उनके बाहर।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह प्रश्न प्रत्येक नृत्य शैली के पारंपरिक कलाकार और प्रदर्शन स्थान के सटीक ज्ञान का परीक्षण करता है, जो केवल नाम पहचान से परे जाकर वास्तविक विशिष्ट समझ तक पहुँचता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'मोहिनीअट्टम - पारंपरिक रूप से महिलाओं द्वारा किया जाने वाला एकल नृत्य' है।</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत में सबसे शुरुआती राष्ट्रवादी राजनीतिक संगठनों में से एक माने जाने वाले, 1876 में कलकत्ता में स्थापित 'इंडियन एसोसिएशन' की स्थापना किसने की थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सुरेन्द्रनाथ बनर्जी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डब्ल्यू.सी. बनर्जी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ए.ओ. ह्यूम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दादाभाई नौरोजी</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सुरेन्द्रनाथ बनर्जी</span><span style=\"font-family:'Nirmala UI'\"> ने आनंदमोहन बोस के साथ मिलकर 1876 में कलकत्ता में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">इंडियन एसोसिएशन</span><span style=\"font-family:'Nirmala UI'\"> की स्थापना की, जो भारतीय राष्ट्रीय कांग्रेस के गठन से पहले व्यापक, अखिल भारतीय राजनीतिक चेतना को व्यक्त करने वाले शुरुआती संगठनों में से एक था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">इंडियन एसोसिएशन ने इल्बर्ट बिल विवाद और वर्नाक्युलर प्रेस एक्ट जैसे मुद्दों पर जनमत जुटाने में महत्वपूर्ण भूमिका निभाई, जिससे बाद के राष्ट्रीय आंदोलन के लिए महत्वपूर्ण आधार तैयार हुआ।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर सुरेन्द्रनाथ बनर्जी है।</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संविधान का कौन सा अनुच्छेद नगरपालिकाओं के गठन का प्रावधान करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 243P</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 243R</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 243Q</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 24  अधिकृत डॉक्टरों और नर्सों के लिए ही सुलभ रहें, जिसमें यह भी विस्तृत रूप से दर्ज हो कि किस रिकॉर्ड तक किसने और कब पहुँच प्राप्त की। इस आवश्यकता को लागू करने के लिए अवधारणाओं का कौन सा संयोजन सर्वाधिक प्रासंगिक है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भंडारण स्थान बचाने के लिए पुराने रिकॉर्ड को नियमित रूप से हटाना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक्सेस कंट्रोल (प्रमाणीकरण/प्राधिकरण) के साथ ऑडिट लॉगिंग</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">क्लाउड स्टोरेज के साथ डेटा कंप्रेशन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अस्पताल के सभी कर्मचारियों के लिए एक ही साझा पासवर्ड</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एक्सेस कंट्रोल</span><span style=\"font-family:'Nirmala UI'\"> (प्रमाणीकरण और प्राधिकरण तंत्रों के माध्यम से यह सत्यापित करना कि विशिष्ट डेटा देखने के लिए कौन अधिकृत है) के साथ </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ऑडिट लॉगिंग</span><span style=\"font-family:'Nirmala UI'\"> (यह रिकॉर्ड करना कि किसने, क्या और कब एक्सेस किया) दोनों मिलकर परिदृश्य में वर्णित गोपनीयता और जवाबदेही आवश्यकताओं को पूरा करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह संयोजन स्वास्थ्य सेवा सूचना सुरक्षा में एक मौलिक सिद्धांत है, जो अक्सर विनियमों द्वारा अनिवार्य होता है, क्योंकि रोगी डेटा अत्यधिक संवेदनशील होता है और जहाँ तक संभव हो इस  शिखर सम्मेलन</span><span style=\"font-family:'Nirmala UI'\"> की मेजबानी करेगा।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">'नीली अर्थव्यवस्था' आर्थिक विकास के लिए समुद्री संसाधनों के स्थायी उपयोग को संदर्भित करती है, और समुद्री शैवाल की खेती को खाद्य सुरक्षा, जैव ईंधन और कार्बन पृथक्करण में इसकी क्षमता के लिए तेजी से पहचाना जा रहा है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर कोच्चि है।</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2025-2029 कार्यकाल के लिए नेशनल राइफल एसोसिएशन ऑफ इंडिया (NRAI) के अध्यक्ष के रूप में किसे फिर से चुना गया?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अभिनव बिंद्रा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गगन नारंग</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कालिकेश नारायण सिंह देव</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विजय कुमार</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कालिकेश नारायण सिंह देव को 2025-2029 कार्यकाल के लिए नेशनल राइफल एसोसिएशन ऑफ इंडिया (NRAI) के अध्यक्ष के रूप में चुना गया (और उन्होंने अपना पहला पूर्ण कार्यकाल शुरू किया)। उन्होंने 4 दिसंबर, 2025 को हुए let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

  const resultHTML = resultSection.innerHTML;

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
