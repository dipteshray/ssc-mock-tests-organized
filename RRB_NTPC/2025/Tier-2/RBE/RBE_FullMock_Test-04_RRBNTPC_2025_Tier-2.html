<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>8.) RRB NTPC (UG) 2025-26 CBT-2 Paid Mock 4 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

n><span style=\"font-family:'Nirmala UI'\"> M, N, O, P, Q</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-top:14pt;margin-left:9.6pt;margin-bottom:14pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">संख्या = </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">5 अक्षर</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span></li></ul><p style=\"margin-top:14pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: A </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> 5</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">द्विबीजपत्री पौधों में, किस प्रकार की जड़ प्रणाली में एक मुख्य प्राथमिक जड़ होती है जिससे पार्श्व शाखाएँ निकलती हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रोप मूल तंत्र</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रेशेदार मूल तंत्र</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अपस्थानिक मूल तंत्र</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मूसला मूल तंत्र</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सही उत्तर है </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मूसला मूल तंत्र</span><span style=\"font-family:'Nirmala UI'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">यह सही क्यों है</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अधिकांश </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">द्विबीजपत्री पौधों</span><span style=\"font-family:'Nirmala UI'\"> में, मूलांकुर (radicle) के सीधे बढ़ने से एक स्थायी, प्रमुख केंद्रीय अक्ष बनता है जिसे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्राथमिक जड़</span><span style=\"font-family:'Nirmala UI'\"> (primary root) कहते हैं। यह मुख्य जड़ मिट्टी में लंबवत नीचे की ओर बढ़ती है और कई क्रमों की पार्श्व शाखाएँ (जैसे द्वितीयक और तृतीयक जड़ें) उत्पन्न करती है। प्राथमिक जड़ और उसका शाखा नेटवर्क मिलकर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मूसला मूल तंत्र</span><span style=\"font-family:'Nirmala UI'\"> (tap root system) का निर्माण करते हैं, जो मिट्टी में गहरी पैठ, बेहतर स्थिरीकरण और अवशोषण के लिए अत्यधिक विशिष्ट होता है। सामान्य उदाहरणों में सरसों, गाजर और आम के पौधे शामिल हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प गलत क्यों हैं</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\"> रेशेदार मूल तंत्र</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: यह व्यवस्था </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">एकबीजपत्री पौधों</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> (जैसे गेहूँ और चावल) की विशेषता है। इन पौधों में, प्राथमिक जड़ अल्पकालिक होती है और शीघ्र ही तने के आधार से सीधे निकलने वाली पतली, समान आकार की जड़ों के एक घने गुच्छे द्वारा प्रतिस्थापित हो जाती है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\"> अपस्थानिक मूल तंत्र</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: ये जड़ें </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मूलांकुर के अलावा पौधे के किसी भी हिस्से</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> से विकसित होती हैं, जैसे कि पर्वसंधियों, पत्तियों या तनों से। उदाहरणों में घास या बरगद के पेड़ की जड़ें शामिल हैं।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\"> प्रोप मूल तंत्र</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: यह </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अपस्थानिक जड़ों</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> का एक विशेष रूपांतरण है जिसे पूरी तरह से यांत्रिक सहायता के लिए डिज़ाइन किया गया है। वे भारी क्षैतिज पेड़ की शाखाओं से खंभे जैसी संरचनाओं के रूप में उभरती हैं और जमीन में नीचे की ओर बढ़ती हैं, जो बरगद के पेड़ों में प्रसिद्ध रूप से देखी जाती हैं।</span></li></ul>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से किसका उपयोग पेट्रोल में इंजन के प्रदर्शन को बेहतर बनाने के लिए (पुरानी संरचनाओं में) एक एंटी-नॉकिंग एजेंट के रूप में किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कैल्शियम कार्बोनेट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सोडियम क्लोराइड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अमोनियम नाइट्रेट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">टेट्राएथिल लेड</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">टेट्राएथिल लेड</span><span style=\"font-family:'Nirmala UI'\"> को ऐतिहासिक रूप से पेट्रोल में एक एंटी-नॉकिंग एजेंट के रूप में मिलाया जाता था, जिससे इंजनों में दहन दक्षता में सुधार होता था, हालाँकि इसके विषाक्त पर्यावरणीय और स्वास्थ्य प्रभावों के कारण इसे विश्व स्तर पर चरणबद्ध तरीके से समाप्त कर दिया गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">आधुनिक पेट्रोल निर्माण में सुरक्षित विकल्प उपयोग किए जाते हैं, और सीसा-रहित पेट्रोल में वैश्विक संक्रमण 20वीं सदी के अंत से एक महत्वपूर्ण सार्वजनिक स्वास्थ्य और पर्यावरणीय मील का पत्थर रहा है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर टेट्राएथिल लेड है।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक विलयन का pH 3 है, जबकि दूसरे विलयन का pH 6 है। पहला विलयन दूसरे की तुलना में लगभग कितने गुना अधिक अम्लीय है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">3 गुना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1,000 गुना</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">10 गुना</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">100 गुना</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चूँकि </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">pH पैमाना लघुगणकीय (आधार 10) है</span><span style=\"font-family:'Nirmala UI'\">, इसलिए 3 pH इकाइयों का अंतर हाइड्रोजन आयन सांद्रता में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">10^3 = 1,000 गुना</span><span style=\"font-family:'Nirmala UI'\"> अंतर के बराबर होता है, जिसका अर्थ है कि pH 3 वाला विलयन pH 6 वाले विलयन की तुलना में लगभग </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1,000 गुना अधिक अम्लीय</span><span style=\"font-family:'Nirmala UI'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह लघुगणकीय प्रकृति एक सामान्यतः परीक्षित और अक्सर गलत समझा जाने वाला सिद्धांत है - pH में प्रत्येक एकल इकाई परिवर्तन अम्लीयता/क्षारीयता में दस गुना परिवर्तन को दर्शाता है, न कि एक साधारण रैखिक अंतर को।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 1,000 गुना है।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रकाश की अनुप्रस्थ प्रकृति को ______ का उपयोग करके प्रदर्शित किया जा सकता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लेंस</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दर्पण</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रिज्म</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पोलरॉइड</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: पोलरॉइड (विकल्प 4)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रकाश की अनुप्रस्थ प्रकृति को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ध्रुवण</span><span style=\"font-family:'Nirmala UI'\"> की घटना से प्रदर्शित किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पोलरॉइड</span><span style=\"font-family:'Nirmala UI'\"> केवल एक विशेष दिशा में कंपन करने वाली प्रकाश तरंगों को अपने से होकर गुजरने देता है। चूँकि केवल अनुप्रस्थ तरंगों का ही ध्रुवण किया जा सकता है, यह सिद्ध करता है कि प्रकाश एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुप्रस्थ तरंग</span><span style=\"font-family:'Nirmala UI'\"> है।</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">लेंस — अपवर्तन और प्रतिबिंब निर्माण के लिए उपयोग किया जाता है</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">दर्पण — परावर्तन के लिए उपयोग किया जाता है</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">प्रिज्म — विक्षेपण और अपवर्तन के लिए उपयोग किया जाता है</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: विकल्प 4 — पोलरॉइड</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अभिकथन (A): एक छड़ी को दोनों सिरों से पकड़कर बीच में बल लगाने से उसे तोड़ना आसान होता है, बजाय इसके कि उसी बल को एक सिरे के पास लगाया जाए।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कारण (R): किसी बल का घूर्णन प्रभाव (आघूर्ण/टॉर्क) बल के परिमाण और उसके धुरी बिंदु से लंबवत दूरी दोनों पर निर्भर करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सत्य हैं, लेकिन R, A का सही स्पष्टीकरण नहीं है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सत्य हैं, और R, A का सही स्पष्टीकरण है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A सत्य है, लेकिन R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A असत्य है, लेकिन R सत्य है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">टॉर्क (बल का आघूर्ण) = बल x धुरी से लंबवत दूरी</span><span style=\"font-family:'Nirmala UI'\">; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बीच</span><span style=\"font-family:'Nirmala UI'\"> में बल लगाने (एक सिरे के पास लगाए गए बल की तुलना में निश्चित सिरों से अधिक दूरी) से </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अधिक घूर्णन प्रभाव</span><span style=\"font-family:'Nirmala UI'\"> उत्पन्न होता है, जिससे छड़ी को तोड़ना आसान हो जाता है - जो सीधे A की व्याख्या करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह सिद्धांत रिंच और लीवर जैसे औजारों के व्यावहारिक डिज़ाइन का आधार है, जहाँ धुरी बिंदु से अधिक दूर बल लगाने पर समान घूर्णन प्रभाव प्राप्त करने के लिए कम बल की आवश्यकता होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'A और R दोनों सत्य हैं, और R, A का सही स्पष्टीकरण है' है।</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सांख्यिकी और कार्यक्रम कार्यान्वयन मंत्रालय (MoSPI) के अनुसार, नवंबर 2025 में 15 वर्ष और उससे अधिक आयु के व्यक्तियों के लिए बेरोजगारी दर (UR) घटकर ______ हो गई।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">8.7%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">4.7%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">4.6%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">4.8%</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: 4.7% (विकल्प 2)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सांख्यिकी और कार्यक्रम कार्यान्वयन मंत्रालय (</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">MoSPI</span><span style=\"font-family:'Nirmala UI'\">) द्वारा जारी </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आवधिक श्रम बल सर्वेक्षण (PLFS)</span><span style=\"font-family:'Nirmala UI'\"> के अनुसार, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">15 वर्ष और उससे अधिक</span><span style=\"font-family:'Nirmala UI'\"> आयु के व्यक्तियों के लिए बेरोजगारी दर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नवंबर 2025 में 4.7%</span><span style=\"font-family:'Nirmala UI'\"> तक गिर गई।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बेरोजगारी दर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कुल श्रम बल में बेरोजगार व्यक्तियों के प्रतिशत</span><span style=\"font-family:'Nirmala UI'\"> को संदर्भित करती है। इस दर में गिरावट रोजगार की स्थिति में सुधार का संकेत देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: विकल्प 2 — 4.7%</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन संरचनात्मक बेरोजगारी का एक उदाहरण है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक कपड़ा श्रमिक उद्योग के स्वचालन के कारण अपनी नौकरी खो देता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक व्यक्ति उच्च शिक्षा प्राप्त करने के लिए नौकरी छोड़ देता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मांग में अस्थायी गिरावट के दौरान एक श्रमिक को निकाल दिया जाता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक श्रमिक पर्यटन में मौसमी उतार-चढ़ाव के कारण अपनी नौकरी खो देता है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: एक कपड़ा श्रमिक उद्योग के स्वचालन के कारण अपनी नौकरी खो देता है (विकल्प 1)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">संरचनात्मक बेरोजगारी</span><span style=\"font-family:'Nirmala UI'\"> तब होती है जब प्रौद्योगिकी, उद्योगों या अर्थव्यवस्था में बदलाव श्रमिकों के मौजूदा कौशल को कम उपयोगी या पुराना बना देते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इस मामले में, स्वचालन कुछ कपड़ा श्रमिकों की आवश्यकता को कम कर देता है। श्रमिक बेरोजगार रह सकता है क्योंकि उनके कौशल अब नई नौकरी की आवश्यकताओं से मेल नहीं खाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अन्य विकल्प:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">स्वैच्छिक रूप से नौकरी छोड़ना </span><span style=\"line-height:115%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> संरचनात्मक बेरोजगारी नहीं</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">मांग में अस्थायी गिरावट </span><span style=\"line-height:115%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> चक्रीय बेरोजगारी</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">पर्यटन में मौसमी गिरावट </span><span style=\"line-height:115%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> मौसमी बेरोजगारी</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: विकल्प 1 — एक कपड़ा श्रमिक उद्योग के स्वचालन के कारण अपनी नौकरी खो देता है</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन 'प्रगतिशील कर' प्रणाली का सबसे अच्छा वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक कर प्रणाली जो केवल आयातित वस्तुओं पर लागू होती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक कर प्रणाली जहां कर योग्य आय बढ़ने पर कर की दर बढ़ जाती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक कर प्रणाली जहाँ आय की परवाह किए बिना हर कोई समान निश्चित राशि का भुगतान करता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक कर प्रणाली जहाँ आय बढ़ने पर कर की दर घट जाती है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रगतिशील कर</span><span style=\"font-family:'Nirmala UI'\"> प्रणाली </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उच्च आय वर्ग पर उच्च कर दरें</span><span style=\"font-family:'Nirmala UI'\"> लागू करती है, जिसका अर्थ है कि धनी व्यक्ति कम आय वाले व्यक्तियों की तुलना में अपनी आय का एक बड़ा प्रतिशत कर के रूप में भुगतान करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">भारत की आयकर प्रणाली प्रगतिशील है, जिसमें आय बढ़ने पर बढ़ती दरें लागू होती हैं, यह 'प्रतिगामी' कर जैसे जीएसटी के विपरीत है, जो कम आय वाले लोगों से आय का आनुपातिक रूप से बड़ा हिस्सा लेता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'एक कर प्रणाली जहाँ कर योग्य आय बढ़ने पर कर की दर बढ़ जाती है'।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत की जनगणना 2011 को 1872 से लगातार होने वाली जनगणनाओं की श्रृंखला में आधिकारिक तौर पर कौन से नंबर के रूप में मान्यता प्राप्त है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">14</span><span style=\"line-height:115%;font-size:8pt;vertical-align:super;font-family:'Nirmala UI'\">वीं</span><span style=\"font-family:'Nirmala UI'\"> राष्ट्रीय जनगणना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">16</span><span style=\"line-height:115%;font-size:8pt;vertical-align:super;font-family:'Nirmala UI'\">वीं</span><span style=\"font-family:'Nirmala UI'\"> राष्ट्रीय जनगणना</span></p>", margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">महाराष्ट्र</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गुजरात</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कर्नाटक</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: राजस्थान (विकल्प 1)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भड़ला सौर पार्क थार रेगिस्तान क्षेत्र में, राजस्थान के जोधपुर जिले में स्थित है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">यह दुनिया के सबसे बड़े सौर पार्कों में से एक है और बड़े पैमाने पर सौर ऊर्जा उत्पादन के लिए उपयुक्त है क्योंकि इस क्षेत्र को प्रचुर मात्रा में सूर्य का प्रकाश मिलता है और यहाँ शुष्क भूमि के विशाल विस्तार हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> उत्तर: विकल्प 1 — राजस्थान</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तिब्बती पठार, जिसे अक्सर 'दुनिया की छत' कहा जाता है, किस प्रकार के प्राकृतिक वनस्पति क्षेत्र का प्रतिनिधित्व करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">शीतोष्ण घास का मैदान</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ध्रुवीय रेगिस्तान</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आर्कटिक टुंड्रा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अल्पाइन टुंड्रा</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: अल्पाइन टुंड्रा (विकल्प 4)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">तिब्बती पठार</span><span style=\"font-family:'Nirmala UI'\">, जिसे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“दुनिया की छत”</span><span style=\"font-family:'Nirmala UI'\"> के रूप में जाना जाता है, एक उच्च ऊंचाई वाला क्षेत्र है जहाँ बहुत ठंड का तापमान, तेज हवाएँ और एक छोटा बढ़ता हुआ मौसम होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इन परिस्थितियों के कारण, प्राकृतिक वनस्पति में मुख्य रूप से शामिल हैं:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">छोटी घासें</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">मॉस और लाइकेन</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">छोटे झाड़</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">अन्य कम उगने वाले पौधे</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उच्च पर्वतीय ऊंचाइयों पर पाई जाने वाली इस प्रकार की वनस्पति को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अल्पाइन टुंड्रा</span><span style=\"font-family:'Nirmala UI'\"> कहा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: विकल्प 4 — अल्पाइन टुंड्रा</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक विशेष भारतीय शहर में उष्णकटिबंधीय जलवायु है, लेकिन इसकी उच्च ऊंचाई के कारण अपने अक्षांश के सापेक्ष असामान्य रूप से ठंडा मौसम अनुभव होता है। निम्नलिखित में से कौन इस घटना को सबसे अच्छी तरह समझाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऊंचाई बढ़ने के साथ तापमान घटता है, इस घटना को 'सामान्य ह्रास दर' के रूप में जाना जाता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">शहर को बादल छाए रहने के कारण कम धूप मिलती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह शहर अधिकांश भारतीय शहरों की तुलना में उच्च अक्षांश पर स्थित है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह शहर तट के पास स्थित है, जिससे ठंडक होती है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तापमान सामान्यतः </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ऊंचाई बढ़ने के साथ घटता है</span><span style=\"font-family:'Nirmala UI'\">, इस दर को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">'सामान्य ह्रास दर'</span><span style=\"font-family:'Nirmala UI'\"> (लगभग 6.5°C प्रति 1,000 मीटर) के रूप में जाना जाता है - यह बताता है कि क्यों हिल स्टेशन और अधिक ऊंचाई वाले शहर केवल अपने अक्षांश के कारण अनुमानित तापमान से अधिक ठंडे रहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह सिद्धांत बताता है कि शिमला, ऊटी और दार्जिलिंग जैसे शहर भारत के व्यापक उष्णकटिबंधीय अक्षांश क्षेत्र में स्थित होने के बावजूद सुखद, ठंडी जलवायु क्यों बनाए रखते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है \"ऊंचाई बढ़ने के साथ तापमान घटता है, इस घटना को 'सामान्य ह्रास दर' के रूप में जाना जाता है\"।</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">महान भारतीय रेगिस्तान के कुछ हिस्सों में कौन सी नदी एक उपजाऊ क्षेत्र बनाती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">साबरमती नदी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">घग्गर नदी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नर्मदा नदी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ब्यास नदी</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: घग्गर नदी (विकल्प 2)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">घग्गर नदी</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हरियाणा और राजस्थान</span><span style=\"font-family:'Nirmala UI'\"> के कुछ हिस्सों से होकर बहती है और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">महान भारतीय रेगिस्तान (थार रेगिस्तान)</span><span style=\"font-family:'Nirmala UI'\"> के भीतर एक अपेक्षाकृत उपजाऊ क्षेत्र बनाने में मदद करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हालांकि यह एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मौसमी नदी</span><span style=\"font-family:'Nirmala UI'\"> है, इसका पानी और जमा जलोढ़ मिट्टी आसपास के क्षेत्रों में कृषि का समर्थन करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: विकल्प 2 — घग्गर नदी</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित भारतीय राज्यों/केंद्र शासित प्रदेशों को उनके गठन/पुनर्गठन के कालानुक्रमिक क्रम में, सबसे पहले से सबसे बाद तक व्यवस्थित करें: झारखंड, उत्तराखंड, तेलंगाना, लद्दाख (एक केंद्र शासित प्रदेश के रूप में)।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उत्तराखंड - झारखंड - लद्दाख - तेलंगाना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तेलंगाना - लद्दाख - झारखंड - उत्तराखंड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">झारखंड - उत्तराखंड - तेलंगाना - लद्दाख</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लद्दाख - तेलंगाना - उत्तराखंड - झारखंड</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सही कालानुक्रमिक क्रम है: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">झारखंड और उत्तराखंड (दोनों नवंबर 2000 में बने, उसी महीने में झारखंड का गठन उत्तराखंड से पहले हुआ)</span><span style=\"font-family:'Nirmala UI'\"> - </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">तेलंगाना (2014)</span><span style=\"font-family:'Nirmala UI'\"> - </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लद्दाख (2019)</span><span style=\"font-family:'Nirmala UI'\">, जिसे जम्मू और कश्मीर के पुनर्गठन के बाद एक केंद्र शासित प्रदेश के रूप में बनाया गया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">झारखंड, उत्तराखंड और छत्तीसगढ़ सभी वर्ष 2000 में बने थे, जिससे 2000 भारत के इतिहास में राज्य पुनर्गठन के लिए एक विशेष रूप से महत्वपूर्ण वर्ष बन गया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही क्रम है झारखंड - उत्तराखंड - तेलंगाना - लद्दाख।</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित प्राचीन भारतीय परिषदों का मिलान उस शासक/संदर्भ से करें जिनके अधीन वे आयोजित की गईं:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A. प्रथम बौद्ध संगीति - 1. बुद्ध की मृत्यु के तुरंत बाद, राजा अजातशत्रु के संरक्षण में आयोजित की गई</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">B. तृतीय बौद्ध संगीति - 2. अशोक के शासनकाल के दौरान पाटलिपुत्र में आयोजित की गई</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">C. चतुर्थ बौद्ध संगीति (कश्मीर) - 3. कनिष्क के शासनकाल के दौरान आयोजित की गई</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">D. पाटलिपुत्र में जैन संगीति - 4. जैन धर्मग्रंथ के बारह अंगों का संकलन किया</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा संयोजन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-1, B-2, C-3, D-4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-4, B-3, C-2, D-1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-2, B-1, C-4, D-3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-3, B-4, C-1, D-2</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रथम बौद्ध संगीति</span><span style=\"font-family:'Nirmala UI'\"> बुद्ध की मृत्यु के तुरंत बाद </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राजा अजातशत्रु</span><span style=\"font-family:'Nirmala UI'\"> के संरक्षण में आयोजित की गई थी; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">तृतीय बौद्ध संगीति</span><span style=\"font-family:'Nirmala UI'\"> अशोक के शासनकाल के दौरान पाटलिपुत्र में आयोजित की गई थी; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">चतुर्थ बौद्ध संगीति</span><span style=\"font-family:'Nirmala UI'\"> कश्मीर में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कनिष्क</span><span style=\"font-family:'Nirmala UI'\"> के शासनकाल के दौरान आयोजित की गई थी; और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पाटलिपुत्र में जैन संगीति</span><span style=\"font-family:'Nirmala UI'\"> ने जैन धर्मग्रंथ के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बारह अंगों</span><span style=\"font-family:'Nirmala UI'\"> का संकलन किया था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">इन संगीति ने विभिन्न ऐतिहासिक कालों में बौद्ध धर्म और जैन धर्म के मूल शिक्षाओं के संरक्षण, संकलन और कभी-कभी उनकी पुनर्व्याख्या में महत्वपूर्ण भूमिका निभाई।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:u मुख्य रूप से दर्शाती हैं:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">जातक कथाओं</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> की कहानियाँ</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">गौतम बुद्ध</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> के जीवन की घटनाएँ</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">बौद्ध धार्मिक विषय</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अजंता की चित्रकला और मूर्तियों को प्राचीन भारतीय और बौद्ध कला की कुछ बेहतरीन उत्कृष्ट कृतियों में से एक माना जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: विकल्प 3 — अजंता गुफाएँ</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किस मुगल शासक को साम्राज्य के प्रमुख हिस्सों में 'ज़ब्ती' राजस्व प्रणाली शुरू करने का श्रेय दिया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अकबर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-botto
