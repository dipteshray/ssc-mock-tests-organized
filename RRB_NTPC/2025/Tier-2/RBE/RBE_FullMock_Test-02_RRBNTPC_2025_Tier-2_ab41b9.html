/li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">संघ सूची, राज्य सूची और समवर्ती सूची</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> के माध्यम से विधायी शक्तियों का वितरण</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">कुछ विशेष परिस्थितियों में राज्य विषयों पर कानून बनाने की संसद की शक्ति</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: विधायी संबंध (विकल्प 3)</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन 'दल-बदल विरोधी कानून' के प्राथमिक उद्देश्य का सही वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सभी सांसदों के लिए अपनी अंतरात्मा के अनुसार ही मतदान करना अनिवार्य बनाना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गठबंधन सरकारों के गठन को पूरी तरह से रोकना</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पद के प्रलोभन या अन्य समान विचारों से प्रेरित राजनीतिक दल-बदल पर अंकुश लगाना, जिससे सरकारों की स्थिरता को बढ़ावा मिल सके</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दो राष्ट्रीय दलों को छोड़कर सभी राजनीतिक दलों पर प्रतिबंध लगाना</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दल-बदल विरोधी कानून</span><span style=\"font-family:'Nirmala UI'\"> (दसवीं अनुसूची) का प्राथमिक उद्देश्य राजनीतिक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अवसरवाद से प्रेरित दल-बदल</span><span style=\"font-family:'Nirmala UI'\"> - जैसे कि मंत्री पद का लालच - पर अंकुश लगाना है, जिससे निर्वाचित सरकारों की अधिक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्थिरता</span><span style=\"font-family:'Nirmala UI'\"> को बढ़ावा मिल सके।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'पद के प्रलोभन या अन्य समान विचारों से प्रेरित राजनीतिक दल-बदल पर अंकुश लगाना, जिससे सरकारों की स्थिरता को बढ़ावा मिल सके'।</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हल्दी, एक व्यापक रूप से इस्तेमाल किया जाने वाला मसाला, का सबसे बड़ा उत्पादक भारतीय राज्य कौन सा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तेलंगाना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कर्नाटक</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तमिलनाडु</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केरल</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">तेलंगाना</span><span style=\"font-family:'Nirmala UI'\"> भारत में हल्दी का सबसे बड़ा उत्पादक है, जिसमें निजामाबाद क्षेत्र विशेष रूप से मसाले की बड़े पैमाने पर खेती और व्यापार के लिए जाना जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">भारत दुनिया में हल्दी का सबसे बड़ा उत्पादक, उपभोक्ता और निर्यातक है, जिसका भारतीय संस्कृति में महत्वपूर्ण पाक, औषधीय और धार्मिक महत्व है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर तेलंगाना है।</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कौन सा अनुच्छेद संवैधानिक कामकाज के दौरान राष्ट्रपति को दी गई मंत्रिस्तरीय सलाह की न्यायिक जांच पर रोक लगाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 76</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 72</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 78</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 74</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: अनुच्छेद 74 (विकल्प 4)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">74</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रधानमंत्री के नेतृत्व वाली मंत्रिपरिषद</span><span style=\"font-family:'Nirmala UI'\"> से संबंधित है, जो राष्ट्रपति को सहायता और सलाह देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 74(2)</span><span style=\"font-family:'Nirmala UI'\"> के तहत, न्यायालयों को निम्न की जाँच करने से प्रतिबंधित किया गया है:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">क्या मंत्रिपरिषद द्वारा राष्ट्रपति को कोई सलाह दी गई थी</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">उस सलाह की प्रकृति या सामग्री क्या थी</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह प्रावधान राष्ट्रपति को दी गई </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मंत्रिस्तरीय सलाह की गोपनीयता</span><span style=\"font-family:'Nirmala UI'\"> बनाए रखता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: विकल्प 4 — अनुच्छेद 74</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">MS Word जैसे अनुप्रयोगों में कीबोर्ड शॉर्टकट Ctrl + H का प्राथमिक कार्य क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चयनित टेक्स्ट को हाईलाइट करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हेल्प विंडो खोलता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दस्तावेज़ का इतिहास प्रदर्शित करता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">फाइंड एंड रिप्लेस डायलॉग बॉक्स खोलता है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: फाइंड एंड रिप्लेस डायलॉग बॉक्स खोलता है (विकल्प 4)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">MS Word</span><span style=\"font-family:'Nirmala UI'\"> जैसे अनुप्रयोगों में, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Ctrl + H</span><span style=\"font-family:'Nirmala UI'\"> दबाने पर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">फाइंड एंड रिप्लेस</span><span style=\"font-family:'Nirmala UI'\"> डायलॉग बॉक्स खुलता है, आमतौर पर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रिप्लेस</span><span style=\"font-family:'Nirmala UI'\"> टैब सक्रिय होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसका उपयोग निम्न के लिए किया जाता है:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">किसी दस्तावेज़ में किसी विशिष्ट शब्द, वाक्यांश या वर्ण को खोजना</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">इसे किसी अन्य शब्द, वाक्यांश या वर्ण से बदलना</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">एक या सभी घटनाओं को एक साथ बदलना</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उदाहरण: आप </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“India”</span><span style=\"font-family:'Nirmala UI'\"> के प्रत्येक प्रयोग को खोज सकते हैं और उसे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“Bharat”</span><span style=\"font-family:'Nirmala UI'\"> से बदल सकते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: विकल्प 4 — फाइंड एंड रिप्लेस डायलॉग बॉक्स खोलता है</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जब जिंक के दानों को नीले कॉपर सल्फेट के घोल में मिलाया जाता है, तो नीला रंग धीरे-धीरे फीका पड़ जाता है और एक लाल-भूरा अवक्षेप बनता है। यह किस प्रकार की रासायनिक अभिक्रिया को सबसे अच्छी तरह दर्शाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संयोजन अभिक्रिया, एक नया यौगिक बनाना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विस्थापन अभिक्रिया, जहाँ जिंक कॉपर सल्फेट के घोल से कॉपर को विस्थापित करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अम्ल और क्षार के बीच उदासीनीकरण अभिक्रिया</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कॉपर सल्फेट की वियोजन अभिक्रिया</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह एक क्लासिक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विस्थापन अभिक्रिया</span><span style=\"font-family:'Nirmala UI'\"> है: चूँकि </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जिंक कॉपर से अधिक अभिक्रियाशील</span><span style=\"font-family:'Nirmala UI'\"> है, यह कॉपर सल्फेट के घोल से कॉपर को विस्थापित करता है, जिससे जिंक सल्फेट (रंगहीन) बनता है और लाल-भूरा धात्विक कॉपर अवक्षेपित होता है, जो नीले रंग के फीका पड़ने और कॉपर अवक्षेप बनने की व्याख्या करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'विस्थापन अभिक्रिया, जहाँ जिंक कॉपर सल्फेट के घोल से कॉपर को विस्थापित करता है' है।</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन-सा एक स्प्रेडशीट सॉफ्टवेयर का उदाहरण है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">माइक्रोसॉफ्ट एक्सेल</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वीएलसी मीडिया प्लेयर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एडोब फोटोशॉप</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">माइक्रोसॉफ्ट वर्ड</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">माइक्रोसॉफ्ट एक्सेल</span><span style=\"font-family:'Nirmala UI'\"> एक व्यापक रूप से उपयोग किया जाने वाला स्प्रेडशीट सॉफ्टवेयर है, जो उपयोगकर्ताओं को पंक्तियों और स्तंभों में डेटा को व्यवस्थित करने, गणना करने और विश्लेषण करने की सुविधा देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">एमएस वर्ड डॉक्यूमेंट/वर्ड-प्रोसेसिंग सॉफ्टवेयर है, फोटोशॉप इमेज एडिटिंग के लिए है, और वीएलसी एक मीडिया प्लेयर है - इनमें से कोई भी स्प्रेडशीट का कार्य नहीं करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर माइक्रोसॉफ्ट एक्सेल है।</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रैम (RAM) और रोम (ROM) के संबंध में निम्नलिखित कथनों पर विचार करें और सही विकल्प का चयन करें।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">(i) ROM RAM से तेज़ है क्योंकि यह स्थायी सिस्टम निर्देशों को संग्रहीत करता है, जिन्हें CPU द्वारा कम बार एक्सेस किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">(ii) RAM को CPU द्वारा पढ़ा और लिखा जा सकता है, लेकिन बिजली बंद होने पर इसकी सामग्री मिट जाती है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">(i) असत्य, (ii) असत्य</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">(i) सत्य, (ii) सत्य</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">(i) असत्य, (ii) सत्य</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">(i) सत्य, (ii) असत्य</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\n <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: (i) असत्य, (ii) सत्य (विकल्प 3)</span></p>\n<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कथन </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">(i) असत्य है</span><span style=\"font-family:'Nirmala UI'\"> क्योंकि </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">RAM सामान्यतः ROM से तेज़ होता है</span><span style=\"font-family:'Nirmala UI'\">। RAM CPU द्वारा वर्तमान में उपयोग किए जा रहे डेटा और निर्देशों तक त्वरित पहुँच प्रदान करता है। ROM फर्मवेयर जैसे स्थायी निर्देशों को संग्रहीत करता है, लेकिन यह RAM से तेज़ नहीं होता है।</span></p>\n<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कथन </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">(ii) सत्य है</span><span style=\"font-family:'Nirmala UI'\"> क्योंकि RAM CPU को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">डेटा पढ़ने और लिखने</span><span style=\"font-family:'Nirmala UI'\"> दोनों की अनुमति देता है। हालाँकि, RAM </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अस्थिर मेमोरी</span><span style=\"font-family:'Nirmala UI'\"> है, जिसका अर्थ है कि बिजली बंद होने पर इसकी सामग्री नष्ट हो जाती है।</span></p>\n<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: विकल्प 3 — (i) असत्य, (ii) सत्य</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पद्म पुरस्कार 2026 के संबंध में निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. इनकी घोषणा भारत के 77वें गणतंत्र दिवस की पूर्व संध्या पर की गई थी।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. इन्होंने विभिन्न क्षेत्रों में योगदान के लिए 200 से अधिक व्यक्तियों को सम्मानित किया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I और II दोनों</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो I और न ही II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन I सही है</span><span style=\"font-family:'Nirmala UI'\"> - पद्म पुरस्कार 2026 की घोषणा भारत के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">77वें गणतंत्र दिवस</span><span style=\"font-family:'Nirmala UI'\"> की पूर्व संध्या पर की गई थी।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन II गलत है</span><span style=\"font-family:'Nirmala UI'\"> - उन्होंने कला, सार्वजनिक मामलों, चिकित्सा, साहित्य, खेल, विज्ञान और सामाजिक कार्य सहित विभिन्न क्षेत्रों में 200 से अधिक नहीं, बल्कि </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">131 प्रतिष्ठित व्यक्तियों</span><span style=\"font-family:'Nirmala UI'\"> को सम्मानित किया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">पद्म पुरस्कार, जिनमें पद्म विभूषण, पद्म भूषण और पद्म श्री शामिल हैं, को एक विशेष रूप से गठित पुरस्कार समिति की सिफारिशों के आधार पर राष्ट्रपति द्वारा सालाना अनुमोदित किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'केवल I' है।</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित 2025-26 की घटनाओं को उनके संबंधित संगठन/संस्थान से सुमेलित करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A. अंतर्राष्ट्रीय UPI भुगतानों के लिए रियल-टाइम FX निपटान - 1. NPCI, HSBC इंडिया और JP मॉर्गन पेमेंट्स</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">B. एकीकृत लोकपाल योजना (1 जुलाई 2026 से प्रभावी) - 2. भारतीय रिज़र्व बैंक (RBI)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">C. आपदा चेतावनी प्रणाली के लिए SKOCH अवार्ड 2025 - 3. C-DOT</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">D. राष्ट्रीय ई-गवर्नेंस अवार्ड्स 2026 में स्वर्ण पुरस्कार - 4. भारतीय चिकित्सा अनुसंधान परिषद (ICMR)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा संयोजन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-1, B-2, C-3, D-4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-2, B-1, C-4, D-3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-3, B-4, C-1, D-2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-4, B-3, C-2, D-1</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">NPCI, HSBC इंडिया और JP मॉर्गन पेमेंट्स</span><span style=\"font-family:'Nirmala UI'\"> ने अंतर्राष्ट्रीय UPI भुगतानों के रियल-टाइम FX निपटान के लिए साझेदारी की; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">संशोधित एकीकृत लोकपाल योजना 1 जुलाई 2026 से प्रभावी</span><span style=\"font-family:'Nirmala UI'\"> है; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">C-DOT</span><span style=\"font-family:'Nirmala UI'\"> ने अपनी जीवन रक्षक सेल ब्रॉडकास्ट आपदा चेतावनी प्रणाली के लिए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">SKOCH अवार्ड 2025</span><span style=\"font-family:'Nirmala UI'\"> जीता; और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ICMR</span><span style=\"font-family:'Nirmala UI'\"> ने </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राष्ट्रीय ई-गवर्नेंस अवार्ड्स 2026</span><span style=\"font-family:'Nirmala UI'\"> में स्वर्ण पुरस्कार जीता।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">ये घटनाक्रम एक साथ वित्तीय प्रौद्योगिकी, आपदा प्रबंधन और डिजिटल शासन नवाचार में भारत के निरंतर प्रयासों को दर्शाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही संयोजन A-1, B-2, C-3, D-4 है।</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किस भारतीय संगठन ने अपनी 'जीवन रक्षक सेल ब्रॉडकास्ट आपदा चेतावनी प्रणाली' के लिए SKOCH अवार्ड 2025 जीता?</span></p>", "option1": "<p style=\"margin-top:0pt; _no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय सेना की मेजर स्वाति शांता कुमार को जनवरी 2026 में किस प्रतिष्ठित पुरस्कार से सम्मानित किया गया?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संयुक्त राष्ट्र महासचिव का पुरस्कार</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नोबेल शांति पुरस्कार</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रेमन मैग्सेसे पुरस्कार</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अशोक चक्र</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारतीय सेना की मेजर स्वाति शांता कुमार</span><span style=\"font-family:'Nirmala UI'\"> को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">संयुक्त राष्ट्र महासचिव का पुरस्कार 2025</span><span style=\"font-family:'Nirmala UI'\"> से सम्मानित किया गया, जो संयुक्त राष्ट्र शांति स्थापना अभियानों के संदर्भ में उनकी असाधारण सेवा को मान्यता देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह पुरस्कार दुनिया भर में संयुक्त राष्ट्र शांति स्थापना मिशनों में भारतीय सशस्त्र बलों के कर्मियों के महत्वपूर्ण योगदान पर प्रकाश डालता है, एक ऐसा क्षेत्र जहाँ भारत ऐतिहासिक रूप से सबसे बड़े सैनिक-योगदानकर्ता देशों में से एक रहा है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\  style=\"font-family:'Nirmala UI'\">26वाँ संशोधन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">42वाँ संशोधन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">24वाँ संशोधन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">44वाँ संशोधन</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: 44वाँ संशोधन (विकल्प 4)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">44वें संवैधानिक संशोधन अधिनियम, 1978</span><span style=\"font-family:'Nirmala UI'\"> ने यह अनिवार्य कर दिया कि </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 352</span><span style=\"font-family:'Nirmala UI'\"> के तहत राष्ट्रीय आपातकाल को राष्ट्रपति द्वारा केवल </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">केंद्रीय मंत्रिमंडल की लिखित सलाह</span><span style=\"font-family:'Nirmala UI'\"> के आधार पर ही घोषित किया जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह सुरक्षा उपाय आपातकालीन शक्तियों के दुरुपयोग को रोकने के लिए पेश किया गया था। पहले, राष्ट्रपति पूरे मंत्रिमंडल से औपचारिक लिखित अनुमोदन की आवश्यकता के बिना प्रधानमंत्री की सलाह पर कार्य कर सकते थे।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: विकल्प 4 — 44वाँ संशोधन</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अभिकथन (A): भारत के नियंत्रक और महालेखापरीक्षक (CAG) को आसानी से पद से हटाया नहीं जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कारण (R): CAG को केवल उसी तरीके से और उन्हीं आधारों पर हटाया जा सकता है जैसे सर्वोच्च न्यायालय के न्यायाधीश को।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A सत्य है, लेकिन R असत्य है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सत्य हैं, लेकिन R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A असत्य है, लेकिन R सत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सत्य हैं, और R, A की सही व्याख्या है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">CAG के कार्यकाल की सुरक्षा</span><span style=\"font-family:'Nirmala UI'\"> (A) ठीक इसलिए मौजूद है क्योंकि उसे हटाने के लिए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सर्वोच्च न्यायालय के न्यायाधीश के समान कठोर प्रक्रिया</span><span style=\"font-family:'Nirmala UI'\"> की आवश्यकता होती है - सिद्ध दुर्व्यवहार या अक्षमता जैसे सीमित आधारों पर दोनों सदनों द्वारा विशेष बहुमत से पारित एक प्रस्ताव - जो सीधे तौर पर बताता है कि हटाना मुश्किल क्यों है (R, A की सही व्याख्या करता है)।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह मजबूत सुरक्षा जानबूझकर यह सुनिश्चित करने के लिए डिज़ाइन की गई है कि CAG सरकारी वित्त का स्वतंत्र रूप से ऑडिट कर सके, उस सरकार द्वारा मनमाने ढंग से हटाए जाने के डर के बिना, जिसके खर्चों की वह जाँच करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'A और R दोनों सत्य हैं, और R, A की सही व्याख्या है'।</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक कंपनी को अपनी वेबसाइट पर अचानक ट्रैफ़िक वृद्धि का अनुभव होता है जिसे उसका एकल सर्वर संभाल नहीं पाता है, जिससे साइट क्रैश हो जाती है। निम्नलिखित में से कौन-सा समाधान इस विशिष्ट समस्या का सबसे सीधा समाधान करेगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक नया एंटीवायरस प्रोग्राम स्थापित करना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आने वाले ट्रैफ़िक को वितरित करने के लिए कई सर्वरों में लोड बैलेंसिंग करना</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वेबसाइट का डोमेन नाम बदलना</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वेबसाइट की इमेज फ़ाइलों को कंप्रेस करना</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लोड बैलेंसिंग</span><span style=\"font-family:'Nirmala UI'\"> आने वाले ट्रैफ़िक को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कई सर्वरों</span><span style=\"font-family:'Nirmala UI'\"> में वितरित करता है, किसी भी एक सर्वर को ओवरलोड होने से रोकता है और वेबसाइट को क्रैश हुए बिना ट्रैफ़िक की बढ़ोतरी को संभालने में मदद करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">इस तकनीक का उपयोग बड़ी वेबसाइटों और ऑनलाइन सेवाओं द्वारा विश्वसनीयता और प्रदर्शन बनाए रखने के लिए व्यापक रूप से किया जाता है, विशेषकर प्रमुख बिक्री या ब्रेकिंग न्यूज़ जैसी उच्च-ट्रैफ़िक घटनाओं के दौरान।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'आने वाले ट्रैफ़िक को वितरित करने के लिए कई सर्वरों में लोड बैलेंसिंग करना'।</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा मंदिर परिसर अपने 24 मीटर ऊँचे विमान और शिव की पत्थर की मूर्ति के लिए जाना जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गंगैकोंडाचोलिश्वरम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कंदरिया महादेव मंदिर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">महाबोधि मंदिर</span></p>", "option4": " <p style=\"margin-top:0pt;ma सचिव नियुक्त किया गया था</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रवि अग्रवाल को सीबीडीटी अध्यक्ष के रूप में फिर से नियुक्त किया गया, उनका कार्यकाल दिसंबर 2026 तक बढ़ा दिया गया</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रवि अग्रवाल को सीबीडीटी (केंद्रीय प्रत्यक्ष कर बोर्ड) के अध्यक्ष के रूप में फिर से नियुक्त किया गया था</span><span style=\"font-family:'Nirmala UI'\">, उनका कार्यकाल </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दिसंबर 2026</span><span style=\"font-family:'Nirmala UI'\"> तक बढ़ा दिया गया था, जिससे भारत के प्रत्यक्ष कर प्रशासन में निरंतरता सुनिश्चित हुई।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">सीबीडीटी भारत में प्रत्यक्ष कर कानूनों के प्रशासन के लिए जिम्मेदार शीर्ष निकाय है, जो राजस्व विभाग, वित्त मंत्रालय के तहत कार्य करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'रवि अग्रवाल को सीबीडीटी अध्यक्ष के रूप में फिर से नियुक्त किया गया, उनका कार्यकाल दिसंबर 2026 तक बढ़ा दिया गया'।</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रेशेदार जड़ प्रणाली, जिसमें प्राथमिक जड़ अल्पकालिक होती है और अनेक अपस्थानिक जड़ों द्वारा प्रतिस्थापित हो जाती है, पादपों के किस समूह की विशेषता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">द्विबीजपत्री</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जिम्नोस्पर्म</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एकबीजपत्री</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">टेरिडोफाइट</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: एकबीजपत्री</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एकबीजपत्री पौधों में, प्राथमिक जड़ अल्पकालिक होती है और इसकी जगह कई पतली, समान आकार की अपस्थानिक जड़ें ले लेती हैं। यह एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रेशेदार जड़ प्रणाली</span><span style=\"font-family:'Nirmala UI'\"> बनाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उदाहरण: गेहूं, चावल, मक्का, घास।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">द्विबीजपत्री पौधों में आमतौर पर एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मूसला जड़ प्रणाली</span><span style=\"font-family:'Nirmala UI'\"> होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है एकबीजपत्री</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित 2025-26 की घटनाओं को कालानुक्रमिक क्रम में, सबसे पहले से सबसे बाद तक व्यवस्थित करें: </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पद्म पुरस्कार 2026 घोषित, जेन्सेन हुआंग को IEEE मेडल ऑफ ऑनर प्रदान किया गया, वैरामुथु ने ज्ञानपीठ पुरस्कार जीता, राष्ट्रीय विज्ञान पुरस्कार 2025 प्रस्तुत किया गया।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जेन्सेन हुआंग का IEEE मेडल - राष्ट्रीय विज्ञान पुरस्कार - वैरामुथु का ज्ञानपीठ पुरस्कार - पद्म पुरस्कार</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वैरामुथु का ज्ञानपीठ पुरस्कार - पद्म पुरस्कार - जेन्सेन हुआंग का IEEE मेडल - राष्ट्रीय विज्ञान पुरस्कार</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पद्म पुरस्कार - वैरामुथु का ज्ञानपीठ पुरस्कार - राष्ट्रीय विज्ञान पुरस्कार - जेन्सेन हुआंग का IEEE मेडल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राष्ट्रीय विज्ञान पुरस्कार - जेन्सेन हुआंग का IEEE मेडल - पद्म पुरस्कार - वैरामुथु का ज्ञानपीठ पुरस्कार</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सही कालानुक्रमिक क्रम है: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राष्ट्रीय विज्ञान पुरस्कार 2025 प्रस्तुत किया गया (24 दिसंबर 2025)</span><span style=\"font-family:'Nirmala UI'\"> - </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जेन्सेन हुआंग को IEEE मेडल ऑफ ऑनर प्रदान किया गया (9 जनवरी 2026)</span><span style=\"font-family:'Nirmala UI'\"> - </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पद्म पुरस्कार 2026 घोषित (25 जनवरी 2026, गणतंत्र दिवस की पूर्व संध्या)</span><span style=\"font-family:'Nirmala UI'\"> - </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">वैरामुथु ने ज्ञानपीठ पुरस्कार जीता (16 मार्च 2026)</span><span style=\"font-family:'Nirmala UI'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही क्रम है राष्ट्रीय विज्ञान पुरस्कार - जेन्सेन हुआंग का IEEE मेडल - पद्म पुरस्कार - वैरामुथु का ज्ञानपीठ पुरस्कार।</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा राष्ट्रीय उद्यान - विशिष्ट विशेषता युग्म सही ढंग से सुमेलित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">काजीरंगा राष्ट्रीय उद्यान - बंगाल टाइगर का एकमात्र प्राकृतिक आवास</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गिर राष्ट्रीय उद्यान - एशियाई शेर का एकमात्र प्राकृतिक आवास</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रणथंभौर राष्ट्रीय उद्यान - मुख्य रूप से मध्य प्रदेश में स्थित</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कॉर्बेट राष्ट्रीय उद्यान - भारत का सबसे नया राष्ट्रीय उद्यान, 2020 में स्थापित</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गिर राष्ट्रीय उद्यान</span><span style=\"font-family:'Nirmala UI'\"> को दुनिया में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एशियाई शेर</span><span style=\"font-family:'Nirmala UI'\"> का एकमात्र प्राकृतिक आवास के रूप में सही ढंग से पहचाना गया है। अन्य युग्म गलत हैं: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">काजीरंगा</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एक सींग वाले गैंडे</span><span style=\"font-family:'Nirmala UI'\"> के लिए प्रसिद्ध है, न कि एकमात्र बाघ आवास (भारत के कई अभयारण्यों में बाघ मौजूद हैं); </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रणथंभौर</span><span style=\"font-family:'Nirmala UI'\"> मध्य प्रदेश में नहीं, बल्कि </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राजस्थान</span><span style=\"font-family:'Nirmala UI'\"> में स्थित है; और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कॉर्बेट राष्ट्रीय उद्यान</span><span style=\"font-family:'Nirmala UI'\"> वास्तव में भारत का </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सबसे पुराना</span><span style=\"font-family:'Nirmala UI'\"> राष्ट्रीय उद्यान (1936) है, न कि सबसे नया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह प्रश्न प्रत्येक उद्यान को अद्वितीय बनाने वाली सटीक, विशिष्ट जानकारी का परीक्षण करता है, न कि उद्यानों के नामों की सामान्य परिचितता का।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'गिर राष्ट्रीय उद्यान - एशियाई शेर का एकमात्र प्राकृतिक आवास'।</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत की राष्ट्रीय सब्जी कौन सी है, हालांकि इसे आधिकारिक तौर पर घोषित नहीं किया गया है - यह एक सामान्य करेंट अफेयर्स तथ्य है जिसे अक्सर 'पवित्र अंजीर' या 'कमल' के साथ भ्रमित किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत की कोई आधिकारिक तौर पर घोषित राष्ट्रीय सब्जी नहीं है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कद्दू आधिकारिक राष्ट्रीय सब्जी है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आलू आधिकारिक राष्ट्रीय सब्जी है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बैंगन आधिकारिक राष्ट्रीय सब्जी है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कुछ लोकप्रिय सामान्य ज्ञान के दावों के विपरीत, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारत की कोई आधिकारिक रूप से घोषित राष्ट्रीय सब्जी नहीं है</span><span style=\"font-family:'Nirmala UI'\">, ठीक वैसे ही जैसे इसका कोई आधिकारिक रूप से घोषित राष्ट्रीय खेल नहीं है - ये दोनों ही सामान्य ज्ञान की क्विज़ में भ्रम के आम क्षेत्र हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह एक उपयोगी अनुस्मारक है कि हर लोकप्रिय 'राष्ट्रीय प्रतीक' का दावा आधिकारिक तौर पर सत्यापित नहीं होता है; हमेशा आमतौर पर माने जाने वाले तथ्यों और सरकार द्वारा औपचारिक रूप से घोषित किए गए तथ्यों के बीच अंतर करें।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'भारत की कोई आधिकारिक रूप से घोषित राष्ट्रीय सब्जी नहीं है।'</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक संगठन यह सुनिश्चित करना चाहता है कि यदि उसका मुख्य सर्वर अप्रत्याशित रूप से विफल हो जाए, तो एक बैकअप सर्वर न्यूनतम व्यवधान के साथ संचालन संभाल सके। यह अवधारणा सबसे अच्छे से किसका वर्णन करती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डेटा संपीड़न</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डेटा एन्क्रिप्शन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">फ़ायरवॉल सुरक्षा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रिडंडेंसी / फेलओवर प्रणाली</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रिडंडेंसी/फेलओवर प्रणाली</span><span style=\"font-family:'Nirmala UI'\"> यह सुनिश्चित करती है कि यदि कोई प्राथमिक सर्वर या घटक विफल हो जाता है, तो एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बैकअप प्रणाली स्वचालित रूप से कार्यभार संभाल लेती है</span><span style=\"font-family:'Nirmala UI'\">, जिससे सेवाओं में व्यवधान और डाउनटाइम कम हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह अवधारणा बैंकिंग, स्वास्थ्य सेवा और क्लाउड इन्फ्रास्ट्रक्चर जैसी महत्वपूर्ण प्रणालियों में व्यापक रूप स %;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">₹170</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">₹185</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">₹165</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2 वर्षों के लिए 10% पर:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784456435051_image107.png\" width=\"182\" height=\"143\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: B) ₹170</span></p>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
