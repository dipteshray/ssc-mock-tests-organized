<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>4.) RRB NTPC (UG) 2025-26 CBT-2 Live Mock 2 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A गलत है, लेकिन R सही है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सत्य हैं, और R, A की सही व्याख्या है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A सत्य है, लेकिन R गलत है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सत्य हैं, लेकिन R, A की सही व्याख्या नहीं है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सही विकल्प है: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">A और R दोनों सत्य हैं, और R, A की सही व्याख्या है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अभिकथन (A) सत्य है:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> पानी का क्वथनांक वायुमंडलीय दबाव पर निर्भर करता है। जैसे-जैसे आप अधिक ऊंचाई पर जाते हैं, वायुमंडलीय दबाव कम हो जाता है, जिससे पानी का क्वथनांक मानक 100°C से नीचे गिर जाता है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कारण (R) सत्य है:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> वायुमंडलीय दबाव एक विशिष्ट बिंदु के ऊपर हवा के स्तंभ के वजन के कारण होता है। अधिक ऊंचाई पर, आपके ऊपर हवा कम होती है, जिसके परिणामस्वरूप वायुमंडलीय दबाव कम होता है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">संबंध:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> कारण (R) अभिकथन (A) में वर्णित घटना का सीधा भौतिक कारण है। चूंकि वायुमंडलीय दबाव कम होता है (R), पानी को वाष्प में बदलने के लिए उस दबाव को दूर करने के लिए कम ऊर्जा की आवश्यकता होती है, जिससे क्वथनांक (A) कम हो जाता है।</span></li></ul>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1960 के दशक के मध्य से 1980 तक भारत की औद्योगिक वृद्धि धीमी रही। आर्थिक विकास की इस धीमी गति का वर्णन करने के लिए अक्सर किस शब्द का उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">महान मंदी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">समाजवादी ठहराव</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हिंदू विकास दर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राजकोषीय खिंचाव</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: हिंदू विकास दर</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">यह शब्द 'हिंदू विकास दर' का उपयोग 1950 के दशक से लगभग 1980 तक की अवधि के दौरान भारत की धीमी आर्थिक वृद्धि का वर्णन करने के लिए किया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इस अवधि के दौरान, भारत की अर्थव्यवस्था लगभग 3-3.5% प्रति वर्ष की औसत दर से बढ़ी। चूंकि जनसंख्या वृद्धि भी अधिक थी, इसलिए प्रति व्यक्ति आय में वृद्धि बहुत कम थी।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इस शब्द को अर्थशास्त्री राज कृष्णा ने लोकप्रिय बनाया था। यह हिंदू धर्म को संदर्भित नहीं करता है; यह उस अवधि के दौरान भारत की लगातार धीमी आर्थिक वृद्धि के लिए उपयोग किया जाने वाला एक सामान्य नाम था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> उत्तर: हिंदू विकास दर</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक सरकार आयकर की दरों को कम करती है, यह उम्मीद करते हुए कि इससे उपभोक्ता खर्च को बढ़ावा मिलेगा और इस प्रकार उच्च आर्थिक गतिविधि के माध्यम से कुल कर राजस्व में वृद्धि होगी। यह तर्क किस आर्थिक अवधारणा को सबसे अच्छे से दर्शाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लाफर वक्र</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">फिलिप्स वक्र</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">से का नियम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल गुणक प्रभाव</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह तर्क </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लाफर वक्र</span><span style=\"font-family:'Nirmala UI'\"> को दर्शाता है, जो बताता है कि एक निश्चित बिंदु से परे, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कर दरों को कम करने से</span><span style=\"font-family:'Nirmala UI'\"> अधिक आर्थिक गतिविधि, खर्च और कर योग्य आय को उत्तेजित करके </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कुल कर राजस्व में वृद्धि हो सकती है</span><span style=\"font-family:'Nirmala UI'\"> - हालाँकि यह प्रभाव अकेले सरल गुणक प्रभाव की तुलना में अधिक विवादास्पद और स्थिति-निर्भर है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर लाफर वक्र है।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जनगणना 2011 के आधार पर निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. भारत की जनसंख्या 1.21 बिलियन को पार कर गई।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. दशकीय वृद्धि दर (2001-2011) पिछले दशक (1991-2001) की तुलना में अधिक थी।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उपरोक्त दिए गए कथनों में से कौन सा/से सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I और II दोनों</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो I और न ही II</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन I सही है</span><span style=\"font-family:'Nirmala UI'\"> - जनगणना 2011 के अनुसार, भारत की जनसंख्या </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1.21 बिलियन (121.09 करोड़)</span><span style=\"font-family:'Nirmala UI'\"> तक पहुंच गई।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन II गलत है</span><span style=\"font-family:'Nirmala UI'\"> - दशकीय वृद्धि दर वास्तव में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">घटी</span><span style=\"font-family:'Nirmala UI'\">, जो 21.54% (1991-2001) से घटकर 17.64% (2001-2011) हो गई, जो भारत की जनसंख्या वृद्धि दर में क्रमिक मंदी को दर्शाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'केवल I' है।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पश्चिमी घाट किस क्षेत्र में सबसे ऊँचे हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तमिलनाडु</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केरल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कर्नाटक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गोवा</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: केरल</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पश्चिमी घाट अपनी अधिकतम ऊँचाई </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">केरल</span><span style=\"font-family:'Nirmala UI'\"> में प्राप्त करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पश्चिमी घाट की सबसे ऊँची चोटी </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनामुडी</span><span style=\"font-family:'Nirmala UI'\"> है, जो केरल में स्थित है। इसकी ऊँचाई समुद्र तल से लगभग </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">2,695 मीटर</span><span style=\"font-family:'Nirmala UI'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: केरल</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से भारत की सबसे बड़ी बहुउद्देशीय नदी घाटी परियोजना कौन सी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दामोदर घाटी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हीराकुंड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भाखड़ा नांगल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सरदार सरोवर</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: भाखड़ा नांगल</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भाखड़ा नांगल परियोजना</span><span style=\"font-family:'Nirmala UI'\"> को भारत की सबसे बड़ी बहुउद्देशीय नदी घाटी परियोजना माना जाता है। यह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सतलुज नदी</span><span style=\"font-family:'Nirmala UI'\"> पर बनी है और मुख्य रूप से </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पंजाब, हरियाणा, राजस्थान और हिमाचल प्रदेश</span><span style=\"font-family:'Nirmala UI'\"> को लाभ पहुँचाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह कई उद्देश्यों की पूर्ति करती है, जैसे:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">सिंचाई</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">जलविद्युत ऊर्जा का उत्पादन</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">बाढ़ नियंत्रण</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">घरेलू और औद्योगिक उपयोग के लिए पानी की आपूर्ति</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भाखड़ा बाँध </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गोबिंद सागर जलाशय</span><span style=\"font-family:'Nirmala UI'\"> का निर्माण करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: भाखड़ा नांगल</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के एक विशेष क्षेत्र में किसी पर्वत श्रृंखला के पवनाभिमुख (windward) ढलान पर सबसे अधिक वर्षा होती है, जबकि उस श्रृंखला से परे, प्रतिपवनाभिमुख (leeward) ढलान पर स्थित क्षेत्र अपेक्षाकृत शुष्क रहता है। इस पैटर्न को सबसे अच्छी तरह से कौन सी परिघटना समझाती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पर्वतीय वर्षा और परिणामी वृष्टिछाया प्रभाव</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वाताग्र वर्षा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चक्रवाती वर्षा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संवहनीय वर्षा</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पर्वतीय वर्षा</span><span style=\"font-family:'Nirmala UI'\"> तब होती है जब आर्द्र हवाएँ एक पर्वतीय अवरोध पर ऊपर उठने के लिए विवश होती हैं, ठंडी होती हैं और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पवनाभिमुख (windward) ढलान</span><span style=\"font-family:'Nirmala UI'\"> पर वर्षा करती हैं; अपनी अधिकांश नमी खोने के बाद, हवाएँ </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रतिपवनाभिमुख (leeward) ढलान</span><span style=\"font-family:'Nirmala UI'\"> पर अपेक्षाकृत शुष्क हवा के रूप में नीचे उतरती हैं, जिससे एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">'वृष्टिछाया (rain-shadow)' प्रभाव</span><span style=\"font-family:'Nirmala UI'\"> उत्पन्न होता है - जैसा कि पश्चिमी घाट (नम पवनाभिमुख कोंकण तट बनाम अपेक्षाकृत शुष्क प्रतिपवनाभिमुख दक्कन पठार) द्वारा स्पष्ट रूप से दर्शाया गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह सिद्धांत यह भी बताता है कि पश्चिमी घाट के ठीक पूर्व के क्षेत्र, जैसे आंतरिक महाराष्ट्र और कर्नाटक के कुछ हिस्से, उनके ठीक पश्चिम में स्थित तटीय पट्टी की तुलना में काफी कम वर्षा क्यों प्राप्त करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर पर्वतीय वर्षा और परिणामी वृष्टिछाया प्रभाव है।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कोसी नदी मैदानी इलाकों में अक्सर अपना मार्ग बदलती रहती है, इसका मुख्य कारण है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऊपरी क्षेत्रों में बने बड़े बांध लगातार इसके प्राकृतिक प्रवाह को परिवर्तित करते रहते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह हिमालय से भारी मात्रा में तलछट लाती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह विवर्तनिक रूप से दरार वाले निचले मैदानी क्षेत्र के एक लंबे खिंचाव से होकर गुजरती है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसका प्रवाह केवल मौसमी मानसूनी वर्षा से बना रहता है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: यह हिमालय से भारी मात्रा में तलछट लाती है (विकल्प 2)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कोसी नदी</span><span style=\"font-family:'Nirmala UI'\"> युवा और अत्यधिक अपरदनशील हिमालयी क्षेत्र से निकलती है। यह मैदानी इलाकों में बहुत अधिक मात्रा में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गाद, रेत और तलछट</span><span style=\"font-family:'Nirmala UI'\"> लाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जब नदी समतल मैदानों में प्रवेश करती है, तो इसकी गति कम हो जाती है, जिससे ये तलछट नदी तल पर जमा हो जाते हैं। इससे नदी का तल ऊपर उठ जाता है और मौजूदा मार्ग अवरुद्ध हो जाता है, जिससे नदी को अक्सर अपना रास्ता बदलने के लिए मजबूर होना पड़ता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसकी बार-बार आने वाली बाढ़ और बदलते मार्गों के कारण, कोसी को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“बिहार का शोक”</span><span style=\"font-family:'Nirmala UI'\"> भी कहा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: विकल्प 2 — यह हिमालय से भारी मात्रा में तलछट लाती है</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पर्वत श्रृंखला के आधार पर, जहाँ वे स्थित हैं, निम्नलिखित में से कौन सा भारतीय हिल स्टेशन 'विषम' है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऊटी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मुन्नार</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कूर्ग</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">माउंट आबू</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ऊटी, मुन्नार और कूर्ग</span><span style=\"font-family:'Nirmala UI'\"> सभी </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पश्चिमी घाट</span><span style=\"font-family:'Nirmala UI'\"> पर्वत प्रणाली के अंतर्गत स्थित हैं। हालाँकि, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">माउंट आबू</span><span style=\"font-family:'Nirmala UI'\"> राजस्थान में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अरावली श्रेणी</span><span style=\"font-family:'Nirmala UI'\"> में स्थित है, जो इसे इन चार हिल स्टेशनों में विषम बनाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर माउंट आबू है (विषम)।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सांग नृत्य _____________ का एक अनुष्ठानिक लोकप्रिय पारंपरिक लोक नृत्य है, जो सही मायने में इसकी संस्कृति को दर्शाता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सिक्किम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केरल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हरियाणा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पंजाब</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: हरियाणा (विकल्प 3)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सांग</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हरियाणा</span><span style=\"font-family:'Nirmala UI'\"> का एक लोकप्रिय पारंपरिक लोक नाट्य और नृत्य रूप है। इसमें </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नृत्य, संगीत, संवाद और कहानी सुनाना</span><span style=\"font-family:'Nirmala UI'\"> शामिल है और यह राज्य की संस्कृति, रीति-रिवाजों, सामाजिक जीवन और परंपराओं को दर्शाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह आमतौर पर एक खुले स्थान में प्रस्तुत किया जाता है, जिसमें कलाकार पौराणिक कथाओं, इतिहास और सामाजिक विषयों पर आधारित कहानियाँ प्रस्तुत करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: विकल्प 3 — हरियाणा</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक राज्य सरकार एक नया कर लगाना चाहती है जो संघ सूची में सूचीबद्ध विषय के अंतर्गत आता है। निम्नलिखित में से कौन संवैधानिक स्थिति का सही वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राज्य राज्यपाल की स्वीकृति से ही कर लगा सकता है, संसद को पूरी तरह से दरकिनार करते हुए</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राज्य और संघ दोनों एक साथ कर लगा सकते हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राज्य स्वतंत्र रूप से कर लगा सकता है, क्योंकि कराधान हमेशा राज्य का विषय होता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राज्य ऐसा कर नहीं लगा सकता, क्योंकि संघ सूची के विषयों पर कानून बनाने की शक्ति केवल संसद के पास है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चूंकि विषय </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">संघ सूची</span><span style=\"font-family:'Nirmala UI'\"> के अंतर्गत आता है, इसलिए इस पर कानून (कर लगाना सहित) बनाने का संवैधानिक अधिकार केवल </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">संसद</span><span style=\"font-family:'Nirmala UI'\"> के पास है - </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राज्य विधानमंडल</span><span style=\"font-family:'Nirmala UI'\"> संघ सूची के विषयों पर अतिक्रमण नहीं कर सकते हैं, जो सातवीं अनुसूची के तहत विधायी शक्तियों के स्पष्ट विभाजन को दर्शाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">कराधान शक्तियों का यह विभाजन भारत की संघीय संरचना की एक मूलभूत विशेषता है, जिसमें GST एक उल्लेखनीय अपवाद है जिसे एक विशिष्ट संवैधानिक संशोधन के माध्यम से एक साझा आधार पर समवर्ती संघ-राज्य कराधान की अनुमति देने के लिए डिज़ाइन किया गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'राज्य ऐसा कर नहीं लगा सकता, क्योंकि संघ सूची के विषयों पर कानून बनाने की शक्ति केवल संसद के पास है'।</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत में पत्थर के औजारों का सबसे पहला प्रमाण कहाँ पाया गया है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अतिरमपक्कम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मेहरगढ़</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लोथल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हुंसगी घाटी</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: अतिरमपक्कम (विकल्प 1)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अतिरमपक्कम</span><span style=\"font-family:'Nirmala UI'\">, जो </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">तमिलनाडु में चेन्नई</span><span style=\"font-family:'Nirmala UI'\"> के पास स्थित है, एक महत्वपूर्ण पुरापाषाणकालीन पुरातात्विक स्थल है। यहाँ की खुदाई से भारत में ज्ञात सबसे पुराने पत्थर के औजारों में से कुछ मिले हैं, जिनमें अचूलियन हस्तकुल्हाड़ी और अन्य प्रागैतिहासिक औजार शामिल हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह स्थल भारतीय उपमहाद्वीप में पत्थर के औजारों की तकनीक के शुरुआती विकास के बारे में महत्वपूर्ण साक्ष्य प्रदान करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अन्य विकल्प:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मेहरगढ़</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> — प्रारंभिक कृषि और नवपाषाणकालीन बस्तियों के लिए प्रसिद्ध।</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लोथल</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> — एक महत्वपूर्ण हड़प्पा बंदरगाह शहर।</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">हुंसगी घाटी</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> — एक महत्वपूर्ण पुरापाषाणकालीन स्थल, लेकिन यहाँ सही उत्तर नहीं है।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: विकल्प 1 — अतिरमपक्कम</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2025 में उद्धृत WMO रिपोर्ट के अनुसार, जनवरी-अगस्त 2025 में ग्लोबल वार्मिंग पूर्व-औद्योगिक स्तरों से लगभग कितनी अधिक थी?</span></p>", "option1": "<p style=\"margin-top:0pt;mar "margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लॉर्ड हार्डिंग इस हमले में घायल हो गए थे, लेकिन वे बच गए थे।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: विकल्प 3 — रास बिहारी बोस और सचिंद्रनाथ सान्याल</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">द्वितीय गोलमेज सम्मेलन में निम्नलिखित में से किस समूह ने दावा किया था कि कांग्रेस का उनके क्षेत्रों पर कोई अधिकार नहीं था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय राजकुमार</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ब्रिटिश अधिकारी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ज़मींदार</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रांतीय राज्यपाल</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: भारतीय राजकुमार (विकल्प 1)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दूसरे गोलमेज सम्मेलन (1931)</span><span style=\"font-family:'Nirmala UI'\"> में, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारतीय राजकुमारों</span><span style=\"font-family:'Nirmala UI'\"> ने तर्क दिया कि भारतीय राष्ट्रीय कांग्रेस को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रियासतों</span><span style=\"font-family:'Nirmala UI'\"> के मामलों में प्रतिनिधित्व करने या हस्तक्षेप करने का कोई अधिकार नहीं था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राजकुमारों ने ब्रिटिश आधिपत्य के तहत अपने क्षेत्रों पर अलग से शासन किया और दावा किया कि कांग्रेस मुख्य रूप से </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ब्रिटिश भारत</span><span style=\"font-family:'Nirmala UI'\"> का प्रतिनिधित्व करती थी, न कि रियासतों का।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: विकल्प 1 — भारतीय राजकुमार</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संविधान का कौन सा अनुच्छेद आय और स्थिति असमानताओं को कम करने पर सबसे अधिक जोर देता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 39</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 38(2)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 38(1)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 36</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर: अनुच्छेद 38(2) (विकल्प 2)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संविधान का अनुच्छेद </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">38(2)</span><span style=\"font-family:'Nirmala UI'\"> राज्य को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आय</span><span style=\"font-family:'Nirmala UI'\"> में असमानताओं को कम करने और व्यक्तियों के साथ-साथ लोगों के विभिन्न समूहों के बीच </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्थिति, सुविधाओं और अवसरों</span><span style=\"font-family:'Nirmala UI'\"> में असमानताओं को समाप्त करने का निर्देश देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राज्य के नीति निर्देशक सिद्धांतों (DPSP)</span><span style=\"font-family:'Nirmala UI'\"> के तहत शामिल है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 38(1) व्यापक रूप से न्याय पर आधारित सामाजिक व्यवस्था को बढ़ावा देता है, जबकि अनुच्छेद 38(2) विशेष रूप से आर्थिक और सामाजिक असमानताओं को कम करने पर केंद्रित है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: विकल्प 2 — अनुच्छेद 38(2)</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संविधान के भाग XI के अनुच्छेद 245 से 255 मुख्य रूप से केंद्र-राज्य स
