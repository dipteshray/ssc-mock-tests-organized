<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>6.) RRB NTPC (UG) 2025-26 CBT-2 Live Mock 3 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: B) RVZ</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मानव शरीर में निम्नलिखित में से कौन सा अंग मुख्य रूप से विषहरण (डिटॉक्सिफिकेशन), पित्त उत्पादन और ग्लाइकोजन भंडारण के लिए जिम्मेदार है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्लीहा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यकृत</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गुर्दा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अग्नाशय</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">यकृत</span><span style=\"font-family:'Nirmala UI'\"> कई महत्वपूर्ण कार्य करता है, जिनमें </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हानिकारक पदार्थों का विषहरण करना</span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पित्त का उत्पादन करना</span><span style=\"font-family:'Nirmala UI'\"> (जो वसा के पाचन में सहायता करता है), और ऊर्जा विनियमन के लिए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ग्लाइकोजन का भंडारण करना</span><span style=\"font-family:'Nirmala UI'\"> शामिल है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यकृत मानव शरीर का सबसे बड़ा आंतरिक अंग है और महत्वपूर्ण हिस्सों के हटा दिए जाने या क्षतिग्रस्त हो जाने के बाद भी उल्लेखनीय रूप से पुनर्जीवित होने में सक्षम है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर यकृत है।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संविधान के तहत अनुमत निवारक निरोध का सबसे सटीक वर्णन कौन सा कथन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">देश भर में राष्ट्रीय आपातकाल की औपचारिक घोषणा के बाद ही हिरासत (डिटेंशन) की अनुमति देने वाले कानून।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किसी भी व्यक्ति को कानूनी रूप से हिरासत में लेने से पहले पूर्ण न्यायिक सुनवाई की आवश्यकता वाले कानून।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल विदेशी नागरिकों पर लागू होने वाले कानून जो भारत के क्षेत्र में रह रहे हैं या यात्रा कर रहे हैं।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अप्रत्याशित हानिकारक गतिविधियों को रोकने के लिए सीमित अवधि के लिए बिना मुकदमे के हिरासत की अनुमति देने वाले कानून।</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संविधान में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">निवारक निरोध का अधिकार</span><span style=\"font-family:'Nirmala UI'\"> को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अप्रत्याशित हानिकारक गतिविधियों को रोकने के लिए सीमित अवधि के लिए बिना मुकदमे के हिरासत की अनुमति देने वाले कानूनों</span><span style=\"font-family:'Nirmala UI'\"> के रूप में वर्णित किया गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 1: राष्ट्रीय आपातकाल की घोषणा के बाद ही हिरासत</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">निवारक निरोध </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सामान्य समय</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> में भी मौजूद होता है, न कि केवल आपातकाल के दौरान।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 2: हिरासत से पहले पूर्ण न्यायिक सुनवाई की आवश्यकता</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">यह </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">दंडात्मक निरोध</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> का वर्णन करता है, न कि निवारक निरोध का।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 3: केवल विदेशी नागरिकों पर लागू</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">निवारक निरोध </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">नागरिकों और गैर-नागरिकों दोनों</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> पर लागू होता है।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 4: अप्रत्याशित हानिकारक गतिविधियों को रोकने के लिए सीमित अवधि के लिए बिना मुकदमे के हिरासत</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">सही।</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">अनुच्छेद </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">22(3)–22(7)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> निवारक निरोध की अनुमति देता है।</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">अधिकतम अवधि: </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सलाहकार बोर्ड की मंजूरी के बिना 3 महीने</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">, जिसे </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">12 महीने</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> तक बढ़ाया जा सकता है (या यदि संसद निर्धारित करे तो अधिक भी)।</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">उद्देश्य: </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सार्वजनिक व्यवस्था, राष्ट्रीय सुरक्षा, या आवश्यक आपूर्ति/सेवाओं</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> के लिए खतरों को रोकना।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किसी देश की अर्थव्यवस्था के संदर्भ में मौद्रिक नीति को सबसे सटीक रूप से कौन सा कथन परिभाषित करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सरकारी उपाय जो आयातित वस्तुओं पर अंतरराष्ट्रीय व्यापार शुल्क और सीमा शुल्क को नियंत्रित करते हैं।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आर्थिक विकास और मांग को प्रभावित करने के लिए कराधान और सार्वजनिक व्यय पर सरकारी निर्णय।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केंद्रीय बैंक द्वारा समग्र आर्थिक स्थितियों को विनियमित करने के लिए ब्याज दरों और धन आपूर्ति का उपयोग करके की जाने वाली कार्रवाइयां।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पूरे देश में शेयर बाजार के व्यापार और शेयर मूल्य के उतार-चढ़ाव को नियंत्रित करने के उद्देश्य से नियामक उपाय।</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मौद्रिक नीति</span><span style=\"font-family:'Nirmala UI'\"> में केंद्रीय बैंक द्वारा मुद्रास्फीति, रोजगार और समग्र आर्थिक स्थिरता को नियंत्रित करने के लिए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ब्याज दरों और धन आपूर्ति नियंत्रण</span><span style=\"font-family:'Nirmala UI'\"> जैसे उपकरणों का उपयोग शामिल है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">भारत में, RBI की मौद्रिक नीति समिति (MPC) 2016 में शुरू किए गए लचीले मुद्रास्फीति लक्ष्यीकरण ढांचे का पालन करते हुए रेपो दर और अन्य प्रमुख मौद्रिक नीति उपकरणों का निर्धारण करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'आर्थिक स्थितियों को नियंत्रित करने के लिए केंद्रीय बैंक द्वारा ब्याज दरों और धन आपूर्ति नियंत्रण का उपयोग'।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जनगणना 2011 के आधार पर निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. भारतीय राज्यों में उत्तर प्रदेश में जिलों की संख्या सबसे अधिक थी।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. भारत की शहरी आबादी पहली बार ग्रामीण आबादी से अधिक हो गई।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऊपर दिए गए कथनों में से कौन सा/से सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो I और न ही II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I और II दोनों</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन I सही है</span><span style=\"font-family:'Nirmala UI'\"> - 2011 की प्रशासनिक संरचना के अनुसार, भारतीय राज्यों में उत्तर प्रदेश में जिलों की संख्या सबसे अधिक थी।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन II गलत है</span><span style=\"font-family:'Nirmala UI'\"> - जनगणना 2011 के अनुसार, भारत की जनसंख्या </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुख्यतः ग्रामीण</span><span style=\"font-family:'Nirmala UI'\"> बनी रही, जिसमें शहरी आबादी अभी भी कुल जनसंख्या का एक छोटा हिस्सा (लगभग 31%) थी, न कि ग्रामीण आबादी से अधिक।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">भारत का ग्रामीण-शहरी जनसंख्या संतुलन धीरे-धीरे बदल रहा है, लेकिन ग्रामीण क्षेत्रों में अभी भी देश की अधिकांश आबादी रहती है, यह एक ऐसा तथ्य है जिसे अक्सर गलती से पहले ही उलट दिया गया मान लिया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'केवल I' है।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किसी माध्यम का निरपेक्ष अपवर्तनांक 1.5 है। यदि निर्वात में प्रकाश की चाल 3.0 × 10</span><span style=\"font-family:'Cambria Math'\">⁸</span><span style=\"font-family:'Nirmala UI'\"> m/s है, तो इस माध्यम के भीतर प्रकाश की चाल क्या होगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2.0 × 10</span><span style=\"font-family:'Cambria Math'\">⁸</span><span style=\"font-family:'Nirmala UI'\"> m/s</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2.5 × 10</span><span style=\"font-family:'Cambria Math'\">⁸</span><span style=\"font-family:'Nirmala UI'\"> m/s</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">3.0 × 10</span><span style=\"font-family:'Cambria Math'\">⁸</span><span style=\"font-family:'Nirmala UI'\"> m/s </span></p>", "option4": "  उपयोगकर्ताओं द्वारा देखने, संशोधित करने और पुनर्वितरित करने के लिए सार्वजनिक रूप से उपलब्ध है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वह सॉफ्टवेयर जो विशेष रूप से सरकारी संगठनों और अधिकृत सार्वजनिक संस्थानों द्वारा उपयोग के लिए विकसित किया गया है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वह सॉफ्टवेयर जिसे सामान्य उपयोग की स्थितियों में किसी भी इंटरनेट कनेक्शन की आवश्यकता के बिना संचालित करने के लिए डिज़ाइन किया गया है।</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सही विकल्प: वह सॉफ्टवेयर जिसका सोर्स कोड उपयोगकर्ताओं द्वारा देखने, संशोधित करने और पुनर्वितरित करने के लिए सार्वजनिक रूप से उपलब्ध है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 1: दुनियाभर में पूरी तरह से निःशुल्क प्रदान किया जाने वाला सॉफ्टवेयर</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">भ्रामक। ओपन-सोर्स सॉफ्टवेयर अक्सर मुफ्त होता है, लेकिन “ओपन-सोर्स” का अर्थ </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सोर्स कोड तक पहुंच</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> से है, न कि आवश्यक रूप से लागत-मुक्त लाइसेंसिंग से। कुछ ओपन-सोर्स परियोजनाओं में सशुल्क संस्करण या सहायता सेवाएँ हो सकती हैं।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 2: वह सॉफ्टवेयर जिसका सोर्स कोड देखने, संशोधित करने और पुनर्वितरित करने के लिए सार्वजनिक रूप से उपलब्ध है</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">सही। यह ओपन-सोर्स सॉफ्टवेयर का सार है।</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">उदाहरण: </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लिनक्स</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">, </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अपाचे</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">, </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मोज़िला फ़ायरफ़ॉक्स</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 3: विशेष रूप से सरकारी संगठनों के लिए विकसित सॉफ्टवेयर</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">यह </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">स्वामित्व वाला या प्रतिबंधित उपयोग वाला सॉफ्टवेयर</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> है, न कि ओपन-सोर्स।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 4: इंटरनेट कनेक्शन के बिना संचालित करने के लिए डिज़ाइन किया गया सॉफ्टवेयर</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">ऑफ़लाइन क्षमता का ओपन-सोर्स लाइसेंसिंग से कोई संबंध नहीं है।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केंद्रीय बजट 2026-27 के बारे में निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. इसने 16वें वित्त आयोग की सिफारिशों के अनुसार, राज्यों को वित्त आयोग अनुदान के रूप में ₹1.4 लाख करोड़ प्रदान किए।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. इसे उस भूमिका में अपना पहला कार्यकाल सेवा दे रहे वित्त मंत्री द्वारा प्रस्तुत किया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऊपर दिए गए कथनों में से कौन सा/से सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो I और न ही II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I और II दोनों</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन I सही है</span><span style=\"font-family:'Nirmala UI'\"> - बजट ने </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">16वें वित्त आयोग</span><span style=\"font-family:'Nirmala UI'\"> की सिफारिशों के अनुसार, राज्यों को वित्त आयोग अनुदान के रूप में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">₹1.4 लाख करोड़</span><span style=\"font-family:'Nirmala UI'\"> प्रदान किए।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन II गलत है</span><span style=\"font-family:'Nirmala UI'\"> - बजट 2026-27 </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">निर्मला सीतारमण</span><span style=\"font-family:'Nirmala UI'\"> द्वारा प्रस्तुत किया गया था, जो वास्तव में अपना </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नौवां लगातार बजट</span><span style=\"font-family:'Nirmala UI'\"> प्रस्तुत कर रही थीं, न कि अपना पहला।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह अंतर ज्ञात तथ्यों के विरुद्ध विशिष्ट दावों को सत्यापित करने के महत्व को उजागर करता है, क्योंकि सीतारमण के सुस्थापित कार्यकाल को देखते हुए 'पहली बार' प्रस्तुति मानना एक महत्वपूर्ण तथ्यात्मक त्रुटि होगी।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'केवल I' है।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कालिदास द्वारा रचित कौन सा प्राचीन भारतीय ग्रंथ, राजा दुष्यंत और शकुंतला की कहानी बताते हुए, संस्कृत नाटक की सबसे महान कृतियों में से एक माना जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कुमारसंभव</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रघुवंश</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अभिज्ञानशाकुंतलम्</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मेघदूत</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अभिज्ञानशाकुंतलम्</span><span style=\"font-family:'Nirmala UI'\"> ('शकुंतला की पहचान'), जो </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कालिदास</span><span style=\"font-family:'Nirmala UI'\"> द्वारा रचित है, राजा दुष्यंत और शकुंतला की प्रेम कहानी को बताता है, और इसे शास्त्रीय संस्कृत नाटक के बेहतरीन कार्यों में से एक माना जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">कालिदास, जो गुप्त काल के दौरान फले-फूले, ने मेघदूत (द क्लाउड मैसेंजर) और रघुवंश सहित अन्य प्रसिद्ध कृतियों की भी रचना की, जिससे प्राचीन भारत के महानतम संस्कृत कवि-नाटककार के रूप में उनकी प्रतिष्ठा मजबूत हुई।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर अभिज्ञानशाकुंतलम् है।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन-सा बुझे हुए चूने का रासायनिक सूत्र है, जिसका उपयोग आमतौर पर दीवारों की सफेदी के लिए किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">CaO</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">CaCO3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">CaCl2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Ca(OH)2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बुझा हुआ चूना</span><span style=\"font-family:'Nirmala UI'\">, कैल्शियम हाइड्रॉक्साइड, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Ca(OH)2</span><span style=\"font-family:'Nirmala UI'\"> है, जिसे बिना बुझे चूने (CaO) में पानी मिलाने से बनाया जाता है; इसका उपयोग आमतौर पर दीवारों की सफेदी और विभिन्न निर्माण कार्यों में किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">सफेदी की प्रक्रिया में बुझा हुआ चूना वायुमंडलीय कार्बन डाइऑक्साइड के साथ धीरे-धीरे अभिक्रिया करता है, जिससे कैल्शियम कार्बोनेट की एक पतली, कठोर परत बनती है, जो विशिष्ट चमकदार सफेद फिनिश देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर Ca(OH)2 है।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन संसद की 'प्राक्कलन समिति' का सही वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक संसदीय समिति जो उच्च न्यायपालिका में वरिष्ठ पदों पर नियुक्तियों की सिफारिश करने के लिए जिम्मेदार है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक संसदीय समिति जो बजट अनुमानों की जांच करती है और सार्वजनिक व्यय में मितव्ययिता की सिफारिश करती है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक संसदीय समिति जो आम चुनाव शुरू होने से पहले राष्ट्रव्यापी जनमत सर्वेक्षण आयोजित करने के लिए जिम्मेदार है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक संसदीय समिति जिसे भविष्य की राष्ट्रीय आर्थिक वृद्धि और सकल घरेलू उत्पाद (GDP) के अनुमानों के लिए स्थापित किया गया है।</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्राक्कलन समिति</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">केंद्रीय बजट में अनुमानों</span><span style=\"font-family:'Nirmala UI'\"> की जांच करती है, सरकारी प्रशासन की दक्षता बनाए रखते हुए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सार्वजनिक व्यय में मितव्ययिता</span><span style=\"font-family:'Nirmala UI'\"> प्राप्त करने के तरीके सुझाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">लोक लेखा समिति (जो CAG रिपोर्टों के आधार पर पहले से किए गए व्यय की समीक्षा करती है) के विपरीत, प्राक्कलन समिति प्रस्तावित भविष्य के व्यय की जांच करने पर ध्यान केंद्रित करती है, वास्तव में खर्च होने से पहले।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'एक समिति जो केंद्रीय बजट में शामिल अनुमानों की जांच करती है और सार्वजनिक व्यय में मितव्ययिता का सुझाव देती है'।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक सरकार आर्थिक मंदी के दौरान, धन उधार लेकर भी, बुनियादी ढांचे पर सार्वजनिक खर्च बढ़ाती है। कौन सा आर्थिक सिद्धांत इस नीतिगत दृष्टिकोण का सबसे अच्छा समर्थन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">शास्त्रीय अर्थशास्त्र जो आर्थिक चक्रों के दौरान सीमित सरकारी हस्तक्षेप और आत्म-सुधारक बाजार शक्तियों पर जोर देता है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केनेसियन अर्थशास्त्र जो आर्थिक मंदी के दौर में मांग को प्रोत्साहित करने के लिए उच्च सार्वजनिक खर्च का समर्थन करता है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मुद्रावाद जो अकेले केंद्रीय बैंक के मौद्रिक उपायों के माध्यम से धन आपूर्ति और मुद्रास्फीति के नियंत्रण पर जोर देता है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आपूर्ति-पक्ष अर्थशास्त्र जो कर कटौती और उत्पादन प्रोत्साहन को प्राथमिक विकास रणनीति के रूप में जोर देता है।</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आर्थिक मंदी के दौरान, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">धन उधार लेकर भी, बुनियादी ढांचे पर सार्वजनिक खर्च बढ़ाने</span><span style=\"font-family:'Nirmala UI'\"> की नीति को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">केनेसियन अर्थशास्त्र</span><span style=\"font-family:'Nirmala UI'\"> द्वारा सबसे दृढ़ता से समर्थन मिलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भातखंडे संगीत संस्थान</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर प्रदेश के लखनऊ</span><span style=\"font-family:'Nirmala UI'\"> में स्थित है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लखनऊ</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">सही उत्तर।</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">इसकी स्थापना 1926 में हिंदुस्तानी शास्त्रीय संगीत के प्रणेता </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विष्णु नारायण भातखंडे</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> ने की थी।</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">यह भारतीय शास्त्रीय संगीत के शिक्षण, अनुसंधान और संवर्धन के लिए एक प्रमुख संस्थान है।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">वाराणसी</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बनारस हिंदू विश्वविद्यालय (BHU)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> और उसके प्रदर्शन कला संकाय के लिए प्रसिद्ध है, लेकिन भातखंडे संस्थान का स्थान नहीं है।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कानपुर</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">औद्योगिक शहर, इस संगीत संस्थान से संबंधित नहीं है।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">प्रयागराज (इलाहाबाद)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">साहित्यिक और सांस्कृतिक विरासत के लिए जाना जाता है, लेकिन भातखंडे संगीत संस्थान का मुख्यालय नहीं है।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक छात्र तनु सल्फ्यूरिक अम्ल को सोडियम हाइड्रॉक्साइड विलयन के साथ मिलाता है और देखता है कि परिणामी मिश्रण न तो अम्लीय है और न ही क्षारीय। निम्नलिखित में से कौन इस अभिक्रिया का सबसे अच्छा वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अपघटन अभिक्रिया</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विस्थापन अभिक्रिया</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दहन अभिक्रिया</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उदासीनीकरण अभिक्रिया</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह एक उत्कृष्ट </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उदासीनीकरण अभिक्रिया</span><span style=\"font-family:'Nirmala UI'\"> है: एक अम्ल (सल्फ्यूरिक अम्ल) एक क्षार (सोडियम हाइड्रॉक्साइड) के साथ अभिक्रिया करके </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एक लवण (सोडियम सल्फेट) और जल</span><span style=\"font-family:'Nirmala UI'\"> बनाता है, जिसके परिणामस्वरूप यदि सटीक स्टॉइकियोमेट्रिक मात्रा का उपयोग किया जाता है तो एक ऐसा विलयन बनता है जो न तो अम्लीय होता है और न ही क्षारीय।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">उदासीनीकरण अभिक्रियाओं के व्यापक व्यावहारिक अनुप्रयोग हैं, जैसे कि पेट में अतिरिक्त अम्ल को निष्क्रिय करने वाली एंटासिड गोलियों से लेकर अम्लीय औद्योगिक अपशिष्ट के निपटान से पहले उसका उपचार करना।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'उदासीनीकरण अभिक्रिया, जो एक लवण (सोडियम सल्फेट) और जल उत्पन्न करती है' है।</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यदि किसी सरकारी नीति को अदूरदर्शी या अप्रभावी माना जाता है, लेकिन वह स्पष्ट रूप से संविधान या किसी कानून का उल्लंघन नहीं करती है, तो नागरिकों के लिए उपलब्ध कार्रवाई का सबसे उचित तरीका क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नागरिकों को नीति पर कोई आपत्ति उठाने से पहले संवैधानिक संशोधन लागू होने तक इंतजार करना चाहिए।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नागरिक हर नीतिगत असहमति को मौलिक अधिकारों का उल्लंघन मानते हुए सीधे अनुच्छेद 32 का प्रयोग कर सकते हैं।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नागरिक लोकतांत्रिक तरीकों से नीति का विरोध कर सकते हैं, जब तक कि कोई विशेष कानूनी या संवैधानिक उल्लंघन न हो।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नागरिक राष्ट्रपति से नीति रद्द करने का अनुरोध कर सकते हैं, बिना किसी न्यायिक या विधायी हस्तक्षेप के।</span rgin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">अनुच्छेद 32 तभी लागू होता है जब </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मौलिक अधिकारों का उल्लंघन</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> होता है, न कि सामान्य नीतिगत असहमति के लिए।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 3: उल्लंघन न होने पर लोकतांत्रिक तरीकों से विरोध करें</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">सही है।</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">यदि कोई नीति अविवेकपूर्ण या अप्रभावी है लेकिन असंवैधानिक या अवैध नहीं है, तो नागरिक </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सार्वजनिक बहस, चुनावों, नागरिक समाज आंदोलनों और लोकतांत्रिक भागीदारी</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> के माध्यम से इसका विरोध कर सकते हैं।</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">न्यायिक उपचार तभी उपलब्ध होते हैं जब अधिकारों या कानूनों का उल्लंघन होता है।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;fo tyle=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">शक्ति (Power) = कार्य / समय या ऊर्जा / समय।</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">एसआई इकाई: </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">वॉट (W)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> = जूल/सेकंड।</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">उदाहरण: 100 W का बल्ब प्रति सेकंड 100 जूल ऊर्जा की खपत करता है।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 2: समय को ध्यान में रखे बिना किया गया कुल कार्य</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">यह </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कार्य</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> को परिभाषित करता है, शक्ति को नहीं।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 3: एक वस्तु द्वारा तय की गई कुल दूरी</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">यह </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विस्थापन/दूरी</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> को परिभाषित करता है, शक्ति को नहीं।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 4: लगाए गए बल का परिमाण</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">यह </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बल</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> को परिभाषित करता है, शक्ति को नहीं।</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रशासन के संदर्भ में, निम्नलिखित में से कौन भारत के 'केंद्र शासित प्रदेशों' का सही वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वे पूरी तरह से स्वशासी हैं, जिसमें केंद्र सरकार की कोई भूमिका नहीं है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उन्हें केवल संवैधानिक संशोधन के माध्यम से ही बनाया जा सकता है, न कि सामान्य विधान द्वारा।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इनका प्रशासन सीधे केंद्र सरकार द्वारा किया जाता है, आमतौर पर राष्ट्रपति द्वारा नियुक्त एक प्रशासक के माध्यम से।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सभी मामलों में उनका संवैधानिक दर्जा राज्यों के समान है।</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">केंद्र शासित प्रदेशों</span><span style=\"font-family:'Nirmala UI'\"> का प्रशासन सीधे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">केंद्र सरकार</span><span style=\"font-family:'Nirmala UI'\"> द्वारा किया जाता है, आमतौर पर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राष्ट्रपति</span><span style=\"font-family:'Nirmala UI'\"> द्वारा नियुक्त एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रशासक</span><span style=\"font-family:'Nirmala UI'\"> (जिसे कभी-कभी उपराज्यपाल भी कहा जाता है) के माध्यम से, राज्यों के विपरीत, जिनके अपने निर्वाचित सरकारें होती हैं और उन्हें अधिक स्वायत्तता प्राप्त होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">कुछ केंद्र शासित प्रदेशों, जैसे दिल्ली और पुडुचेरी, को आंशिक विधायी शक्तियां और निर्वाचित विधानसभाएँ प्रदान की गई हैं, जो पूर्ण राज्य का दर्जा और पूर्ण केंद्रीय प्रशासन के बीच एक संकर मॉडल का प्रतिनिधित्व करती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'इनका प्रशासन सीधे केंद्र सरकार द्वारा किया जाता है, आमतौर पर राष्ट्रपति द्वारा नियुक्त एक प्रशासक के माध्यम से'।</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भौतिक भूगोल में कौन सा कथन एक द्वीपसमूह (archipelago) को सबसे अच्छी तरह परिभाषित करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दो बड़े भूभागों को आस-पास के जल निकायों के पार जोड़ने वाला एक संकरा भू-सेतु।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक विस्तृत उठा हुआ भू-आकृति जिसकी चोटी सपाट और चारों ओर ढलानें खड़ी हों।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हिमनदीय अपरदन प्रक्रियाओं द्वारा खड़ी चट्टानों के बीच बनी एक गहरी और संकरी समुद्री खाड़ी।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक समुद्र या विशाल महासागर के भीतर स्थित निकटवर्ती द्वीपों का एक समूह।</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भौतिक भूगोल में एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">द्वीपसमूह</span><span style=\"font-family:'Nirmala UI'\"> की सही परिभाषा है: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एक समुद्र या विशाल महासागर के भीतर स्थित निकटवर्ती द्वीपों का एक समूह।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-wei mily:'Nirmala UI'\"> की स्थापना की, जो ब्रह्म समाज से प्रभावित था और जिसने एकेश्वरवाद, सामाजिक सुधार तथा जाति-आधारित भेदभाव को अस्वीकार करने को बढ़ावा दिया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">प्रार्थना समाज का प्रभाव महाराष्ट्र के व्यापक सामाजिक सुधार आंदोलन तक फैला, और बाद में यह महादेव गोविंद रानाडे जैसे व्यक्तियों से जुड़ा, जिन्होंने इस संगठन में शामिल होकर इसे महत्वपूर्ण रूप से आकार दिया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर आत्माराम पांडुरंग है।</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कौन-सा कथन टू-फैक्टर ऑथेंटिकेशन (2FA) के उद्देश्य को सबसे सटीक रूप से बताता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक प्रोग्रामिंग फ्रेमवर्क जिसका उपयोग सुरक्षित मोबाइल और वेब-आधारित सॉफ्टवेयर एप्लीकेशन विकसित करने के लिए किया जाता है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक दुर्भावनापूर्ण प्रोग्राम जिसे उपकरणों में फैलने और संग्रहीत डिजिटल जानकारी को क्षति पहुँचाने के लिए डिज़ाइन किया गया है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक सुरक्षा विधि जिसमें पहुँच प्रदान करने से पहले सत्यापन के दो स्वतंत्र रूपों की आवश्यकता होती है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक फ़ाइल प्रबंधन तकनीक जिसका उपयोग बड़ी डिजिटल फ़ाइलों को छोटे भंडारण आकार में संपीड़ित
