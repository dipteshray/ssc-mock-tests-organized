<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>12.) RRB NTPC (UG) 2025-26 CBT-2 Paid Mock 6 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

 style=\"font-family:'Nirmala UI'\">केवल कथन I में दिया गया डेटा प्रश्न का उत्तर देने के लिए पर्याप्त है जबकि कथन II में दिया गया डेटा पर्याप्त नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल कथन II में दिया गया डेटा प्रश्न का उत्तर देने के लिए पर्याप्त है जबकि कथन I में दिया गया डेटा पर्याप्त नहीं है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कथन I और II दोनों एक साथ (और केवल कथन I या केवल कथन II नहीं) प्रश्न का उत्तर देने के लिए पर्याप्त हैं</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">चरण 1: केवल कथन I का विश्लेषण करें</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-top:14pt;margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">कथन I से क्रम: मीना </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> तनु </span><span style=\"font-family:Arial;font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> सुनीता (लगातार)।</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">शेष: रिया और कविता।</span></li><li style=\"margin-left:9.6pt;margin-bottom:14pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">हम केवल कथन I से </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बीच के व्यक्ति का निर्धारण नहीं कर सकते</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">।</span><br><span style=\"font-family:Arial;font-size:12p eft:32.07pt;margin-bottom:10pt;line-height:115%;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span style=\"font-weight:bold\">शिक्षा</span><span> </span><span style=\"font-family:Arial\">→</span><span> स्कूली शिक्षा के वर्ष, स्कूल में उपस्थिति।</span></li><li style=\"margin-left:32.07pt;margin-bottom:10pt;line-height:115%;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span style=\"font-weight:bold\">जीवन स्तर</span><span> </span><span style=\"font-family:Arial\">→</span><span> बिजली, स्वच्छता, पेयजल, आवास, खाना पकाने के ईंधन और संपत्ति तक पहुँच।</span></li></ol></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">यह इन आयामों में </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">वंचना का एक समग्र माप</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> प्रदान करता है।</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 2: केवल घरेलू आय और रोजगार रिकॉर्ड।</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> गलत — यह आय-आधारित गरीबी उपायों के करीब है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 3: आर्थिक उत्पादन और विकास प्रवृत्तियों के माध्यम से राष्ट्रीय प्रगति।</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> गलत — यह जीडीपी है, एमपीआई नहीं।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 4: साक्षरता और स्कूल नामांकन डेटा के माध्यम से शैक्षिक विकास।</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> गलत — शिक्षा एमपीआई का केवल एक हिस्सा है, पूरा नहीं।</span></li></ul>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जनगणना 2011 के आधार पर निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. पश्चिम बंगाल में बिहार की तुलना में अधिक जनसंख्या घनत्व दर्ज किया गया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. अरुणाचल प्रदेश में भारतीय राज्यों में सबसे कम जनसंख्या घनत्व दर्ज किया गया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उपर्युक्त कथनों में से कौन सा/से सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I और II दोनों</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो I और न ही II</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन I गलत है</span><span style=\"font-family:'Nirmala UI'\"> - पश्चिम बंगाल की तुलना में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बिहार</span><span style=\"font-family:'Nirmala UI'\"> में जनसंख्या घनत्व अधिक दर्ज किया गया, जिससे बिहार समग्र रूप से सर्वाधिक घनत्व वाला राज्य बन गया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन II सही है</span><span style=\"font-family:'Nirmala UI'\"> - </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अरुणाचल प्रदेश</span><span style=\"font-family:'Nirmala UI'\"> में, अपने पहाड़ी, वन-क्षेत्रीय भूभाग के साथ, भारतीय राज्यों में सबसे कम जनसंख्या घनत्व दर्ज किया गया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">पश्चिम बंगाल में भी बहुत उच्च घनत्व है, लेकिन बिहार का घनत्व थोड़ा अधिक है, जिससे यह तुलना जनगणना-आधारित प्रश्नों में अक्सर पूछा जाने वाला एक महत्वपूर्ण बिंदु बन जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'केवल II' है।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तट पर स्थित होने के आधार पर निम्नलिखित में से कौन सा भारतीय बंदरगाह 'विषम' है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मुंबई पोर्ट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कांडला पोर्ट</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पारादीप पोर्ट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कोच्चि पोर्ट</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कांडला, कोच्चि और मुंबई पोर्ट</span><span style=\"font-family:'Nirmala UI'\"> सभी भारत के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पश्चिमी तट</span><span style=\"font-family:'Nirmala UI'\"> पर, अरब सागर के किनारे स्थित हैं। हालाँकि, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पारादीप पोर्ट</span><span style=\"font-family:'Nirmala UI'\"> पूर्वी तट पर, ओडिशा में, बंगाल की खाड़ी के किनारे स्थित है, जिससे यह विषम है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह पहचानना कि कोई दिया गया भारतीय बंदरगाह पश्चिमी (अरब सागर) या पूर्वी (बंगाल की खाड़ी) तट पर स्थित है, एक अक्सर परखा जाने वाला भूगोल कौशल है, जो कई परीक्षा प्रारूपों में उपयोगी है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर पारादीप पोर्ट (विषम) है।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पूना पैक्ट (1932) को दलित वर्गों के राजनीतिक प्रतिनिधित्व के मुद्दे में एक समझौता क्यों माना जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसने गांधी के प्रस्ताव का पूरी तरह से पालन किया, जिससे अंबेडकर की मांगें बिना किसी सार्थक स्वीकृति के रह गईं।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसने अंबेडकर द्वारा प्रस्तावित पृथक निर्वाचक मंडल को बिना किसी महत्वपूर्ण बदलाव के ठीक वैसे ही अनुमोदित किया।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसने पृथक निर्वाचक मंडल को संयुक्त निर्वाचक मंडल में आरक्षित सीटों से बदल दिया, जिससे दोनों नेताओं की चिंताओं को संतुलित किया गया।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसने अंतिम समझौते से दलित वर्गों के राजनीतिक प्रतिनिधित्व के सभी प्रावधानों को हटा दिया।</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पूना पैक्ट (1932)</span><span style=\"font-family:'Nirmala UI'\"> को एक समझौता माना जाता है क्योंकि इसने पृथक निर्वाचक मंडल के प्रति गांधी के विरोध और दलित वर्गों के लिए राजनीतिक सुरक्षा उपायों की अंबेडकर की मांग के बीच संतुलन स्थापित किया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;  विपरीत, एक सामान्य Delete कुंजी दबाने पर फ़ाइल पहले रीसायकल बिन में चली जाती है, जिससे बिन खाली होने तक उसे पुनर्प्राप्त किया जा सकता है; Alt+F4 एक सक्रिय विंडो को बंद करता है, और Ctrl+Alt+Delete विंडोज सुरक्षा/कार्य प्रबंधक स्क्रीन खोलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर Shift + Delete है।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित वैश्विक रैंकिंग/रिपोर्ट (2025-26) का भारत की अनुमानित रैंक या स्थिति से मिलान करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A. विश्व प्रसन्नता रिपोर्ट 2025 - 1. 118वीं</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">B. वैश्विक शांति सूचकांक 2025 - 2. 115वीं</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">C. वैश्विक नवाचार सूचकांक 2025 - 3. 38वीं</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा संयोजन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-1, B-2, C-3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-2, B-3, C-1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-3, B-1, C-2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12p "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">A सत्य है</span><span style=\"font-family:'Nirmala UI'\"> - राज्यसभा सदस्य सीधे आम जनता द्वारा नहीं चुने जाते हैं। </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">R इसकी सही व्याख्या करता है</span><span style=\"font-family:'Nirmala UI'\">: इसके बजाय, वे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राज्य विधानसभाओं के निर्वाचित सदस्यों</span><span style=\"font-family:'Nirmala UI'\"> द्वारा </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एकल संक्रमणीय मत के माध्यम से आनुपातिक प्रतिनिधित्व</span><span style=\"font-family:'Nirmala UI'\"> प्रणाली का उपयोग करके अप्रत्यक्ष रूप से चुने जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह अप्रत्यक्ष चुनाव पद्धति राज्यसभा सदस्यों को एक विशिष्ट प्रतिनिधि चरित्र प्रदान करने के लिए डिज़ाइन की गई है, जो राजनीतिक इकाइयों के रूप में राज्यों के हितों को दर्शाती है, और सीधे निर्वाचित लोकसभा के पूरक के रूप में कार्य करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'A और R दोनों सत्य हैं, और R, A की सही व्याख्या है'।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">टूटी हुई हड्डियों के लिए प्लास्टर बनाने में व्यापक रूप से उपयोग किए जाने वाले कैल्शियम सल्फेट हेमीहाइड्रेट का सामान्य नाम निम्नलिखित में से क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बुझा हुआ चूना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जिप्सम</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बिना बुझा चूना</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्लास्टर ऑफ पेरिस</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्लास्टर ऑफ पेरिस</span><span style=\"font-family:'Nirmala UI'\"> कैल्शियम सल्फेट हेमीहाइड्रेट है, जिसे जिप्सम को गर्म करके बनाया जाता है; यह पानी के साथ मिश्रित होने पर जल्दी से सख्त हो जाता है, जिससे यह प्लास्टर, साँचे और निर्माण के लिए उपयोगी हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">जिप्सम स्वयं कच्चा खनिज (कैल्शियम सल्फेट डाइहाइड्रेट) है जिससे प्लास्टर ऑफ पेरिस को नियंत्रित ताप द्वारा निर्मित किया जाता है जो इसकी कुछ जल सामग्री को हटा देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर प्लास्टर ऑफ पेरिस है।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक देश का केंद्रीय बैंक बढ़ती मुद्रास्फीति से निपटने के लिए अपनी नीतिगत ब्याज दर बढ़ाता है। इस कार्रवाई का सबसे सीधा अपेक्षित परिणाम निम्नलिखित में से क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सार्वजनिक व्यय धीरे-धीरे बढ़ता है, जिससे अर्थव्यवस्था के विभिन्न क्षेत्रों में मांग बढ़ती है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निर्यात कीमतें अधिक प्रतिस्पर्धी हो जाती हैं, जिससे अंतर्राष्ट्रीय बाजारों में मजबूत मांग को प्रोत्साहन मिलता है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऋण लागत बढ़ती है, जिससे पूरे अर्थव्यवस्था में उपभोक्ता खर्च और व्यावसायिक निवेश में कमी आती है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कर भार धीरे-धीरे कम होता है, जिससे परिवारों और फर्मों को वस्तुओं पर अधिक खर्च करने की अनुमति मिलती है।</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही विकल्प:</span><span style=\"font-family:'Nirmala UI'\"> ऋण लागत बढ़ती है, जिससे पूरे अर्थव्यवस्था में उपभोक्ता खर्च और व्यावसायिक निवेश में कमी आती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 1: सार्वजनिक व्यय धीरे-धीरे बढ़ता है, जिससे विभिन्न क्षेत्रों में मांग बढ़ती है।</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> गलत — उच्च ब्याज दरें आमतौर पर मांग को कम करती हैं, बढ़ाती नहीं हैं।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 2: निर्यात कीमतें अधिक प्रतिस्पर्धी हो जाती हैं, जिससे अंतर्राष्ट्रीय बाजारों में मजबूत मांग को प्रोत्साहन मिलता है।</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> गलत — उच्च ब्याज दरें अक्सर मुद्रा को मजबूत करती हैं, जिससे निर्यात कम प्रतिस्पर्धी हो जाते हैं।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 3: ऋण लागत बढ़ती है, जिससे पूरे अर्थव्यवस्था में उपभोक्ता खर्च और व्यावसायिक निवेश में कमी आती है।</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> सही — यह ब्याज दरें बढ़ाने का तात्कालिक और सीधा प्रभाव है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 4: कर भार धीरे-धीरे कम होता है, जिससे परिवारों और फर्मों को अधिक खर्च करने की अनुमति मिलती है।</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> गलत — ब्याज दर में परिवर्तन सीधे कराधान को प्रभावित नहीं करते हैं।</span></li></ul>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">शेषाचलम पहाड़ियाँ मुख्य रूप से भारत के किस राज्य में स्थित हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केरल</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तमिलनाडु</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कर्नाटक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आंध्र प्रदेश</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">शेषाचलम पहाड़ियाँ</span><span style=\"font-family:'Nirmala UI'\"> मुख्य रूप से </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आंध्र प्रदेश</span><span style=\"font-family:'Nirmala UI'\"> में स्थित हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">शेषाचलम पहाड़ियाँ</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> दक्षिणी आंध्र प्रदेश में </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पूर्वी घाट</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> का हिस्सा हैं।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">वे </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">शेषाचलम बायोस्फीयर रिज़र्व</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> के लिए प्रसिद्ध हैं, जिसे </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">2010</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> में अधिसूचित किया गया था, और यह </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लाल चंदन के पेड़ों</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> (स्थानिक और अत्यधिक मूल्यवान) के लिए जाना जाता है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">ये पहाड़ियाँ सांस्कृतिक रूप से भी महत्वपूर्ण हैं क्योंकि ये भगवान वेंकटेश्वर के निवास स्थान </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">तिरुमाला</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> को घेरे हुए हैं।</span></li></ul>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित प्राचीन भारतीय शिलालेखों/स्तंभों का उनके स्थान से मिलान करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A. अशोक का सिंह स्तंभ शीर्ष - 1. सारनाथ</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">B. गिरनार शिलालेख - 2. गुजरात</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">C. कलिंग शिलालेख - 3. धौली</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">D. लौह स्तंभ शिलालेख - 4. महरौली</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा संयोजन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-2, B-1, C-4, D-3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-4, B-3, C-2, D-1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-1, B-2, C-3, D-4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A-3, B-4, C-1, D-2</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रसिद्ध </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सिंह स्तंभ शीर्ष शिलालेख</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सारनाथ</span><span style=\"font-family:'Nirmala UI'\"> में है; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गिरनार शिलालेख</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गुजरात</span><span style=\"font-family:'Nirmala UI'\"> में स्थित है; </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कलिंग शिलालेख</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">धौली, ओडिशा</span><span style=\"font-family:'Nirmala UI'\"> में पाए जाते हैं; और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लौह स्तंभ शिलालेख</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">महरौली, दिल्ली</span><span style=\"font-family:'Nirmala UI'\"> में है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">अशोक के शिलालेखों को उनके विशाल साम्राज्य में रणनीतिक रूप से रखा गया था, जिसमें स्थानीय रूप से समझी जाने वाली लिपियों और भाषाओं का उपयोग किया गया था, ताकि उनकी 'धम्म' की नीति को विविध आबादी तक पहुँचाया जा सके।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही संयोजन A-1, B-2, C-3, D-4 है।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन 'सामंजस्यपूर्ण व्याख्या के सिद्धांत' (Doctrine of Harmonious Construction) का सही वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न्यायालय यह मानते हैं कि प्रत्येक नया कानून स्वचालित रूप से सभी पहले के कानूनी प्रावधानों को पूरी तरह से रद्द कर देता है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न्यायालय स्पष्ट रूप से विरोधाभासी प्रावधानों की व्याख्या इस प्रकार करते हैं कि प्रत्येक को, जहाँ तक यथोचित संभव हो, प्रभावी बनाया जा सके।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न्यायालय यह मानते हैं कि केवल सर्वोच्च न्यायालय के पास ही संवैधानिक प्रावधानों की विशेष रूप से व्याख्या करने का अधिकार है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न्यायालय प्रत्येक कानूनी प्रावधान को बिना किसी अपवाद के उसके सामान्य व्याकरणिक अर्थ के अनुसार सख्ती से लागू करते हैं।</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सामंजस्यपूर्ण व्याख्या का सिद्धांत (Doctrine of Harmonious Construction)</span><span style=\"font-family:'Nirmala UI'\"> व्याख्या का एक सिद्धांत है जिसका उपयोग न्यायालय कानून या संविधान के विभिन्न प्रावधानों के बीच स्पष्ट विरोधाभासों को हल करने के लिए करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 1:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> गलत — नए कानून स्वचालित रूप से पुराने कानूनों को निरस्त नहीं करते हैं; निरसन स्पष्ट या निहित होना चाहिए।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 2:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> सही — न्यायालय प्रावधानों की व्याख्या इस प्रकार करने का प्रयास करते हैं कि प्रत्येक का प्रभाव हो, जहाँ भी उचित रूप से संभव हो, संघर्ष से बचा जा सके।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 3:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> गलत — व्याख्या सर्वोच्च न्यायालय के लिए अनन्य नहीं है; उच्च न्यायालय भी संवैधानिक प्रावधानों की व्याख्या करते हैं।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 4:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> गलत — सख्त व्याकरणिक अर्थ </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">शाब्दिक नियम (literal rule)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> है, न कि सामंजस्यपूर्ण व्याख्या।</span></li></ul>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन-सा वीडियो कॉन्फ्रेंसिंग एप्लीकेशन का एक उदाहरण है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एडोब फोटोशॉप</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ज़ूम</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऑटोकैड</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">माइक्रोसॉफ्ट एक्सेल</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ज़ूम</span><span style=\"font-family:'Nirmala UI'\"> एक व्यापक रूप से उपयोग किया जाने वाला वीडियो कॉन्फ्रेंसिंग एप्लीकेशन है, जो ऑनलाइन मीटिंग, वेबिनार और वर्चुअल सहयोग को सक्षम बनाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">एक्सेल, फोटोशॉप और ऑटोकैड सभी अलग-अलग उद्देश्यों (क्रमशः स्प्रेडशीट, इमेज एडिटिंग और कंप्यूटर-एडेड डिज़ाइन) के लिए डिज़ाइन किए गए एप्लीकेशन सॉफ्टवेयर हैं, जिनमें से कोई भी वीडियो कॉन्फ्रेंसिंग कार्यक्षमता प्रदान नहीं करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर ज़ूम है।</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वैश्विक शांति सूचकांक 2025 में किस देश ने शीर्ष स्थान प्राप्त किया, जिसने दुनिया के सबसे शांतिपूर्ण देश के रूप में अपनी स्थिति बरकरार रखी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नॉर्वे</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डेनमार्क</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आइसलैंड</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्विट्जरलैंड</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आइसलैंड</span><span style=\"font-family:'Nirmala UI'\"> ने </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">वैश्विक शांति सूचकांक 2025</span><span style=\"font-family:'Nirmala UI'\"> में दुनिया के सबसे शांतिपूर्ण देश के रूप में अपनी स्थिति बरकरार रखी, यह एक ऐसी रैंकिंग है जिसे उसने कई वर्षों से लगातार बनाए रखा है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">इंस्टीट्यूट फॉर इकोनॉमिक्स एंड पीस द्वारा प्रकाशित वैश्विक शांति सूचकांक, हिंसा के स्तर, सैन्यीकरण और पड़ोसी देशों के साथ संबंधों सहित विभिन्न कारकों के आधार पर देशों का आकलन करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर आइसलैंड है।</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक सॉफ्टवेयर एप्लिकेशन को समय-समय पर अपडेट मिलते हैं जो सुरक्षा खामियों और सॉफ्टवेयर बग्स को ठीक करते हैं, जबकि इसकी मुख्य विशेषताओं को अपरिवर्तित रखते हैं। इस प्रक्रिया को क्या कहा जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सॉफ्टवेयर बग्स और सुरक्षा कमजोरियों को ठीक करने वाले नियमित अपडेट के माध्यम से पैच प्रबंधन।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पूरे कंप्यूटर सिस्टम में उन्नत भौतिक घटकों को स्थापित करके हार्डवेयर प्रतिस्थापन।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नए कोड के साथ शुरुआत से एप्लिकेशन का पुनर्निर्माण करके पूर्ण सॉफ्टवेयर पुनर्विकास।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एप्लिकेशन फाइलों और डेटाबेस को एक अलग सर्वर प्लेटफॉर्म पर स्थानांतरित करके डेटा माइग्रेशन।</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सही विकल्प: सॉफ्टवेयर बग्स और सुरक्षा कमजोरियों को ठीक करने वाले नियमित अपडेट के माध्यम से पैच प्रबंधन।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 1: सॉफ्टवेयर बग्स और सुरक्षा कमजोरियों को ठीक करने वाले नियमित अपडेट के माध्यम से पैच प्रबंधन।</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> सही — यह बिल्कुल वही है जो परिदृश्य बताता है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 2: उन्नत भौतिक घटकों को स्थापित करके हार्डवेयर प्रतिस्थापन।</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> गलत — सॉफ्टवेयर अपडेट से असंबंधित।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 3: नए कोड के साथ शुरुआत से एप्लिकेशन का पुनर्निर्माण करके पूर्ण सॉफ्टवेयर पुनर्विकास।</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> गलत — यह पुनर्विकास है, पैचिंग नहीं।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 4: एप्लिकेशन फाइलों और डेटाबेस को एक अलग सर्वर प्लेटफॉर्म पर स्थानांतरित करके डेटा माइग्रेशन।</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> गलत — माइग्रेशन डेटा को स्थानांतरित करने के बारे में है, बग्स को ठीक करने के बारे में नहीं।</span></li></ul>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक चमकदार धूसर धातु ठंडे पानी के साथ तेजी से अभिक्रिया करती है, हाइड्रोजन गैस छोड़ती है और एक प्रबल क्षारीय विलयन बनाती है, और वायुमंडलीय नमी के साथ अभिक्रिया को रोकने के लिए इसे केरोसिन के नीचे संग्रहित किया जाना चाहिए। निम्नलिखित में से कौन सी धातु का यह सबसे अच्छा वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कॉपर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सोडियम</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जिंक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आयरन</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सोडियम</span><span style=\"font-family:'Nirmala UI'\">, एक अत्यधिक अभिक्रियाशील क्षार धातु, ठंडे पानी के साथ तेजी से अभिक्रिया करके </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हाइड्रोजन गैस</span><span style=\"font-family:'Nirmala UI'\"> छोड़ती है और सोडियम हाइड्रॉक्साइड (एक प्रबल क्षारीय विलयन) बनाती है; हवा और नमी के साथ इसकी अत्यधिक अभिक्रियाशीलता के कारण, इसे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">केरोसिन</span><span style=\"font-family:'Nirmala UI'\"> के नीचे संग्रहित किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">आयरन, कॉपर और जिंक सभी बहुत कम अभिक्रियाशील होते हैं और कमरे के तापमान पर ठंडे पानी के साथ तेजी से अभिक्रिया नहीं करते हैं, जो उन्हें सोडियम और पोटेशियम जैसी अत्यधिक अभिक्रियाशील क्षार धातुओं से स्पष्ट रूप से अलग करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर सोडियम है।</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन 'ग्रीन जीडीपी' का सबसे अच्छा वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राष्ट्रीय उत्पादन का एक माप जो पर्यावरणीय क्षति और प्राकृतिक संसाधनों की कमी के लिए समायोजित किया गया है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राष्ट्रीय उत्पादन का एक माप जो केवल नवीकरणीय ऊर्जा उत्पादन और संबंधित गतिविधियों से परिकलित किया जाता है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक ऐसा राष्ट्रीय उत्पादन माप जो सार्वजनिक व्यय और सरकार द्वारा वित्तपोषित विकास कार्यक्रमों को पूरी तरह से बाहर करता है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक ऐसा राष्ट्रीय उत्पादन माप जो केवल कृषि उत्पादन और संबद्ध ग्रामीण आर्थिक गतिविधियों पर विचार करता है।</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सही विकल्प: पर्यावरणीय क्षति और प्राकृतिक संसाधन क्षरण के लिए समायोजित राष्ट्रीय उत्पादन का एक माप।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 1: पर्यावरणीय क्षति और प्राकृतिक संसाधन क्षरण के लिए समायोजित राष्ट्रीय उत्पादन का एक माप।</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> सही — यह ग्रीन जीडीपी की सटीक परिभाषा है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 2: केवल नवीकरणीय ऊर्जा उत्पादन और संबंधित गतिविधियों से गणना की जाती है।</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> गलत — यह बहुत संकीर्ण है; ग्रीन जीडीपी व्यापक पर्यावरणीय लागतों को शामिल करता है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 3: सार्वजनिक व्यय और सरकार द्वारा वित्तपोषित कार्यक्रमों को छोड़कर।</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> गलत — ग्रीन जीडीपी से असंबंधित।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 4: केवल कृषि उत्पादन और ग्रामीण गतिविधियों पर विचार करना।</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> गलत — कृषि केवल एक क्षेत्र है; ग्रीन जीडीपी अर्थव्यवस्था-व्यापी है।</span></li></ul>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कौन सा भारतीय राज्य रेपसीड का सबसे बड़ा उत्पादक है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तमिलनाडु</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गुजरात</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राजस्थान</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आंध्र प्रदेश</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रेपसीड का सबसे बड़ा उत्पादक राजस्थान</span><span style=\"font-family:'Nirmala UI'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">रेपसीड–सरसों भारत में एक प्रमुख </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">तिलहनी फसल</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राजस्थान</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> अपनी </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अर्ध-शुष्क जलवायु</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">, उपयुक्त मिट्टी और व्यापक खेती क्षेत्र के कारण उत्पादन पर हावी है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">अन्य योगदान देने वाले राज्यों में </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उत्तर प्रदेश, मध्य प्रदेश, हरियाणा और गुजरात</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> शामिल हैं, लेकिन राजस्थान लगातार बड़े अंतर से आगे रहता है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">भारत रेपसीड-सरसों के दुनिया के शीर्ष उत्पादकों में से एक है, जिसमें राजस्थान राष्ट्रीय उत्पादन का लगभग </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">40-45%</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> योगदान देता है।</span></li></ul>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किस प्राचीन भारतीय शासक को ग्रीक/सेल्यूसिड आक्रमणकारी सेल्यूकस निकेटर को हराने और इस प्रक्रिया में क्षेत्र प्राप्त करने का श्रेय दिया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">समुद्रगुप्त</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चंद्रगुप्त मौर्य</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बिंदुसार</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अशोक</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">चंद्रगुप्त मौर्य</span><span style=\"font-family:'Nirmala UI'\"> ने लगभग 305 ईसा पूर्व </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सेल्यूकस निकेटर</span><span style=\"font-family:'Nirmala UI'\"> (सिकंदर महान का एक सेनापति जिसने सिकंदर के साम्राज्य के पूर्वी हिस्से को विरासत में प्राप्त किया था) को हराया, और वर्तमान अफगानिस्तान के कुछ हिस्सों सहित महत्वपूर्ण क्षेत्र प्राप्त किए।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">परिणामस्वरूप हुई शांति संधि के हिस्से के रूप में, सेल्यूकस ने अपने राजदूत मेगस्थनीज को चंद्रगुप्त के दरबार में भी भेजा, जिनके लेखन (इंडिका) इस काल के लिए एक महत्वपूर्ण ऐतिहासिक स्रोत बने -family:'Nirmala UI'\">विकल्प 4:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> सही — आयोग का उद्देश्य </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">केंद्र-राज्य संबंधों की समीक्षा करना</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> और संघीय समन्वय को मजबूत करने के तरीके सुझाना था।</span></li></ul>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इंटरनेट पर संचारित होने के दौरान गोपनीय डेटा को इंटरसेप्ट किए जाने पर उसे समझने से सबसे प्रभावी ढंग से कौन-सा तरीका बचाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">समग्र ऑनलाइन संचार सुरक्षा उपायों में सुधार के लिए संगठन के डोमेन नाम को नियमित रूप से बदलना।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संचारित डेटा को एन्क्रिप्ट करना ताकि केवल सही डिक्रिप्शन कुंजी वाले अधिकृत उपयोगकर्ता ही इसे एक्सेस कर सकें।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सुरक्षित डेटा ट्रांसमिशन सेवाओं की गति में सुधार के लिए संगठन की इंटरनेट बैंडविड्थ बढ़ाना।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संचार नेटवर्क पर भेजने से पहले संचारित फ़ाइलों को संपीड़ित करके उनका आकार कम करना।</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही विकल्प:</span><span style=\"font-family:'Nirmala UI'\"> संचारित डेटा को एन्क्रिप्ट करना ताकि केवल सही डिक्रिप्शन कुंजी वाले अधिकृत उपयोगकर्ता ही इसे एक्सेस कर सकें।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्प 1: संगठन के डोमेन नाम को नियमित रूप से बदलना।</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> गलत — डोमेन नाम की संचारित डेटा को सुरक्षित करने में कोई सीधी भूमिका नहीं होती।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्प 2: संचारित डेटा को एन्क्रिप्ट करना ताकि केवल सही डिक्रिप्शन कुंजी वाले अधिकृत उपयोगकर्ता ही इसे एक्सेस कर सकें।</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> सही — एन्क्रिप्शन सुनिश्चित करता है कि यदि डेटा को इंटरसेप्ट भी किया जाता है, तो भी उसे उचित कुंजी के बिना समझा नहीं जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्प 3: गति में सुधार के लिए इंटरनेट बैंडविड्थ बढ़ाना।</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> गलत — बैंडविड्थ गति को प्रभावित करती है, गोपनीयता को नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्प 4: आकार कम करने के लिए संचारित फ़ाइलों को संपीड़ि
