ा बढ़ाना था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह नया रूप सरकार के औपचारिक शिक्षा और उद्योग-आवश्यक कौशल के बीच अंतर को पाटने के चल रहे प्रयासों को दर्शाता है, विशेष रूप से तेजी से विकसित हो रहे प्रौद्योगिकी-संचालित क्षेत्रों में।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर पीएम इंटर्नशिप योजना है।</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">'भीमबेटका शैल आश्रय', जो भारत में मानव जीवन के कुछ शुरुआती ज्ञात निशानों को दर्शाने वाला यूनेस्को विश्व धरोहर स्थल है, किस राज्य में स्थित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राजस्थान</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">छत्तीसगढ़</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मध्य प्रदेश</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">महाराष्ट्र</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भीमबेटका शैल आश्रय</span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मध्य प्रदेश</span><span style=\"font-family:'Nirmala UI'\"> में, भारत में मानव जीवन के कुछ शुरुआती ज्ञात निशान शामिल हैं, जिसमें मेसोलिथिक काल से लेकर ऐतिहासिक काल तक की शैल चित्रकलाएँ हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">1957 में खोजे गए, ये आश्रय एक असाधारण लंबी समयावधि में निरंतर मानव निवास के बहुमूल्य पुरातात्विक और मानवशास्त्रीय प्रमाण प्रदान करते हैं, जिससे इन्हें 2003 में यूनेस्को विश्व धरोहर का दर्जा मिला।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर मध्य प्रदेश है।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन 'गतिज ऊर्जा' का सबसे अच्छा वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक बंद प्रणाली की कुल ऊर्जा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक रासायनिक अभिक्रिया के दौरान निकलने वाली ऊर्जा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किसी वस्तु में उसकी स्थिति या अवस्था के कारण संग्रहित ऊर्जा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किसी वस्तु में उसकी गति के कारण निहित ऊर्जा</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गतिज ऊर्जा</span><span style=\"font-family:'Nirmala UI'\"> वह ऊर्जा है जो किसी वस्तु में उसकी </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गति</span><span style=\"font-family:'Nirmala UI'\"> के कारण होती है, जिसकी गणना KE = (1/2)mv2 के रूप में की जाती है, जहाँ m द्रव्यमान और v वेग है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह 'स्थितिज ऊर्जा' के विपरीत है, जो किसी वस्तु की स्थिति (जैसे उठाई गई वस्तु) या अवस्था (जैसे संपीड़ित स्प्रिंग) के कारण संग्रहित ऊर्जा होती है, न कि उसकी गति के कारण।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'किसी वस्तु में उसकी गति के कारण निहित ऊर्जा' है।</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन 'फियोर्ड' का सही वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उष्णकटिबंधीय समुद्री तटीय जल में एक उथले लैगून को घेरने वाला एक गोलाकार प्रवाल निर्माण।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">खड़ी चट्टानों से घिरा एक गहरा, संकरा समुद्री प्रवेश मार्ग जो हिमनद अपरदन द्वारा निर्मित है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक विस्तृत उठा हुआ पठार जिसकी सतह लगभग सपाट और बाहरी ढलानें पूरे में खड़ी हों।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नदी जनित अवसादों के दीर्घकालिक जमाव से निर्मित एक त्रिकोणीय तटीय मैदान।</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">फियोर्ड</span><span style=\"font-family:'Nirmala UI'\"> समुद्र का एक लंबा, संकरा, गहरा प्रवेश मार्ग है जो खड़ी चट्टानों से घिरा होता है, और यह पिछली हिमयुगों के दौरान </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हिमनद अपरदन</span><span style=\"font-family:'Nirmala UI'\"> द्वारा निर्मित होता है, जो बाद में बढ़ते समुद्र स्तर से भर गया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">नॉर्वे विशेष रूप से अपनी व्यापक और नाटकीय फियोर्ड तटरेखा के लिए प्रसिद्ध है, जो ग्लेशियरों द्वारा गहरी घाटियां तराशने से बनी थी और जो बाद में समुद्र में जलमग्न हो गईं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'ऊँची चट्टानों के बीच समुद्र का एक लंबा, संकरा, गहरा प्रवेश मार्ग, जो हिमनद अपरदन द्वारा निर्मित है'।</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किस मध्यकालीन भारतीय शासक को 'दीन-ए-इलाही' की स्थापना का श्रेय दिया जाता है, जो कई धर्मों के तत्वों को सम्मिश्रित करने वाला एक समन्वयवादी धार्मिक दर्शन था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अकबर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">शाहजहाँ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हुमायूँ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जहाँगीर</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अकबर</span><span style=\"font-family:'Nirmala UI'\"> ने 1582 में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">'दीन-ए-इलाही'</span><span style=\"font-family:'Nirmala UI'\"> की स्थापना की, जो इस्लाम, हिंदू धर्म, पारसी धर्म और अन्य धर्मों के तत्वों को संयोजित करने वाली एक समन्वयवादी विश्वास प्रणाली थी, जो धार्मिक सहिष्णुता (सुलह-ए-कुल) की उनकी व्यापक नीति को दर्शाती थी।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">इस धर्म को कभी व्यापक अनुयायी नहीं मिले और यह काफी हद तक अकबर के तत्काल शाही दरबार तक ही सीमित रहा, लेकिन इसने उनके विविध साम्राज्य में धार्मिक सद्भाव के उनके व्यापक दृष्टिकोण का प्रतीक था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर अकबर है।</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय अदालतों द्वारा व्याख्या की गई संवैधानिक स्थिति के अनुसार, किन परिस्थितियों में आरक्षण आमतौर पर 50% की सीमा से अधिक हो सकता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निर्धारित सीमा से अधिक आरक्षण किसी भी संवैधानिक अपवाद के बिना हर स्थिति में निषिद्ध है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आरक्षण सीमा से अधिक हो सकता है क्योंकि संविधान किसी भी प्रकार की संख्यात्मक सीमा नहीं लगाता है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आरक्षण केवल असाधारण मामलों में ही सीमा से अधिक हो सकता है, जो मजबूत मात्रात्मक साक्ष्य और औचित्य द्वारा समर्थित हों।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आरक्षण सीमाएं विशेष रूप से संसद द्वारा निर्धारित की जाती हैं, जिससे संवैधानिक अदालतों के पास कोई पर्यवेक्षी अधिकार नहीं रहता।</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही विकल्प:</span><span style=\"font-family:'Nirmala UI'\"> आरक्षण केवल असाधारण मामलों में ही सीमा से अधिक हो सकता है, जो मजबूत मात्रात्मक साक्ष्य और औचित्य द्वारा समर्थित हों।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 1:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> गलत — अदालतों ने माना है कि अपवाद संभव हैं; यह पूर्ण प्रतिबंध नहीं है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 2:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> गलत — संविधान बिना जाँच के असीमित आरक्षण की अनुमति नहीं देता; संख्यात्मक सीमाएं न्यायिक रूप से मान्यता प्राप्त हैं।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 3:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> सही — सर्वोच्च न्यायालय (इंद्रा साहनी मामला, 1992) ने 50% की सीमा तय की थी, लेकिन असाधारण परिस्थितियाँ होने पर, मात्रात्मक डेटा द्वारा समर्थित अपवादों की अनुमति दी।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विकल्प 4:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> गलत — अदालतों के पास पर्यवेक्षी अधिकार होता है; संसद अकेले आरक्षण सीमाएं तय नहीं करती है।</span></li></ul>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कौन-सा कथन कंप्यूटर नेटवर्क में फ़ायरवॉल के कार्य की सबसे सटीक व्याख्या करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक सॉफ्टवेयर टूल जिसका  "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हालिया (2026) सरकारी योजना के विकास के बारे में निम्नलिखित में से कौन सा कथन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कम अपनाने के कारण पीएम ई-ड्राइव नीति को 2026 में बंद कर दिया गया था</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एआईसीटीई-वाणी 3.0 एक योजना है जो विशेष रूप से कृषि प्रौद्योगिकी पर केंद्रित है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पीएम ई-ड्राइव और एआईसीटीई-वाणी दोनों को 2026 में एक एकल एकीकृत योजना में विलय कर दिया गया था</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पीएम ई-ड्राइव नीति ने 2028 तक ईवी प्रोत्साहनों का विस्तार किया, जबकि एआईसीटीई-वाणी 3.0 योजना उच्च शिक्षा में भारतीय भाषाओं को बढ़ावा देती है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पीएम ई-ड्राइव नीति</span><span style=\"font-family:'Nirmala UI'\"> ने इलेक्ट्रिक वाहन प्रोत्साहनों को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">2028</span><span style=\"font-family:'Nirmala UI'\"> तक बढ़ाया, जबकि </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एआईसीटीई-वाणी 3.0</span><span style=\"font-family:'Nirmala UI'\"> योजना (अप्रैल 2026 में शुरू की गई) </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उच्च शिक्षा में भारतीय भाषाओं</span><span style=\"font-family:'Nirmala UI'\">, विशेष रूप से तकनीकी पाठ्यक्रमों में उपयोग को मजबूत करती है - ये दो अलग-अलग पहलें हैं जो विभिन्न नीतिगत प्राथमिकताओं को संबोधित करती हैं, इन्हें न तो विलय किया गया और न ही बंद किया गया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">ये योजनाएँ दो अलग-अलग लेकिन पूरक सरकारी प्राथमिकताओं को दर्शाती हैं: स्थायी परिवहन (ईवी) को बढ़ावा देना और तकनीकी/उच्च शिक्षा में भाषाई पहुंच और समावेशन को बढ़ावा देना।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर है 'पीएम ई-ड्राइव नीति ने 2028 तक ईवी प्रोत्साहनों का विस्तार किया, जबकि एआईसीटीई-वाणी 3.0 योजना उच्च शिक्षा में भारतीय भाषाओं को बढ़ावा देती है'।</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के सबसे मूल्यवान कॉर्पोरेट ब्रांड के रूप में 'ब्रांड फाइनेंस इंडिया 100' रैंकिंग में किस कॉर्पोरेट समूह ने शीर्ष स्थान हासिल किया?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रिलायंस इंडस्ट्रीज</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अडानी समूह</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इंफोसिस</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">टाटा समूह</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">टाटा समूह</span><span style=\"font-family:'Nirmala UI'\"> ने </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ब्रांड फाइनेंस इंडिया 100</span><span style=\"font-family:'Nirmala UI'\"> रैंकिंग में शीर्ष स्थान हासिल किया, जिससे भारत के सबसे मूल्यवान कॉर्पोरेट ब्रांड के रूप में उसकी स्थिति की पुष्टि हुई।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">ब्रांड फाइनेंस एक अग्रणी वैश्विक ब्रांड मूल्यांकन परामर्शदाता है, और इसकी इंडिया 100 रिपोर्ट को देश के भीतर कॉर्पोरेट ब्रांड की ताकत और प्रतिष्ठा के एक बैरोमीटर के रूप में बारीकी से देखा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर टाटा समूह है।</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अभिकथन (A): एक पिनहोल कैमरा वस्तु का उलटा प्रतिबिंब बनाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कारण (R): प्रकाश सीधी रेखाओं में यात्रा करता है, इसलिए वस्तु के शीर्ष से ​​किरणें प्रतिबिंब तल के नीचे तक जाती हैं, और इसके विपरीत।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सत्य हैं, और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A असत्य है, लेकिन R सत्य है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A सत्य है, लेकिन R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सत्य हैं, लेकिन R, A की सही व्याख्या नहीं है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">क्योंकि </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रकाश सीधी रेखाओं में यात्रा करता है (ऋजुरेखीय संचरण)</span><span style=\"font-family:'Nirmala UI'\">, वस्तु के शीर्ष से किरणें पिनहोल से होकर प्रतिबिंब स्क्रीन के निचले भाग पर पड़ती हैं, और इसके विपरीत - सीधे A में वर्णित </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उलटा प्रतिबिंब</span><span style=\"font-family:'Nirmala UI'\"> का निर्माण करती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">ऋजुरेखीय संचरण का यह समान सिद्धांत छाया और ग्रहण के निर्माण की भी व्याख्या करता है, जिससे यह मूल प्रकाशिकी में अध्ययन किए गए प्रकाश के सबसे मौलिक गुणों में से एक बन जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'A और R दोनों सत्य हैं, और R, A की सही व्याख्या है' है।</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भूमध्य रेखा के निकट स्थित एक क्षेत्र में पूरे वर्ष लगातार उच्च तापमान और भारी वर्षा होती है, जिसमें कोई विशिष्ट शुष्क मौसम नहीं होता है। यह किस प्रकार की जलवायु का सबसे अच्छा वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भूमध्यरेखीय जलवायु</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उष्णकटिबंधीय मानसूनी जलवायु</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भूमध्यसागरीय जलवायु</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">टुंड्रा जलवायु</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भूमध्य रेखा के करीब के क्षेत्रों (जैसे अमेज़न बेसिन और दक्षिण पूर्व एशिया के कुछ हिस्सों) में पाई जाने वाली </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भूमध्यरेखीय जलवायु</span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">साल भर लगातार उच्च तापमान और भारी वर्षा</span><span style=\"font-family:'Nirmala UI'\"> की विशेषता है, जिसमें कोई अलग शुष्क मौसम नहीं होता है - यह उष्णकटिबंधीय मानसूनी जलवायु से भिन्न है, जिसमें एक स्पष्ट परिभाषित आर्द्र और शुष्क मौसम होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">भारत की जलवायु मुख्य रूप से उष्णकटिबंधीय मानसूनी है न कि वास्तव में भूमध्यरेखीय, क्योंकि यह वर्षा में स्पष्ट मौसमी भिन्नता का अनुभव करती है, जो मुख्य रूप से जून-सितंबर मानसून अवधि के दौरान केंद्रित होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर भूमध्यरेखीय जलवायु है।</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">'रौलट एक्ट' (1919) के बारे में निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. इसने सरकार को व्यक्तियों को बिना मुकदमे के हिरासत में लेने की अनुमति दी।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. भारतीय राजनीतिक नेताओं द्वारा इसे एक प्रगतिशील सुधार के रूप में सराहा गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऊपर दिए गए कथनों में से कौन सा/से सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो I और न ही II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I और II दोनों</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन I सही है</span><span style=\"font-family:'Nirmala UI'\"> - रौलट एक्ट ने </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बिना मुकदमे के हिरासत</span><span style=\"font-family:'Nirmala UI'\"> की अनुमति दी, जिससे नागरिक स्वतंत्रताएँ गंभीर रूप से कम हो गईं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन II गलत है</span><span style=\"font-family:'Nirmala UI'\"> - इस अधिनियम का भारतीय राजनीतिक नेताओं द्वारा </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कड़ा विरोध</span><span style=\"font-family:'Nirmala UI'\"> किया गया था, जिससे व्यापक विरोध प्रदर्शन हुए और अंततः यह दुखद जलियांवाला बाग हत्याकांड में योगदान का कारण बना, इसे किसी भी प्रकार के सुधार के रूप में स्वागत नहीं किया गया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">इस अधिनियम को अक्सर एक ऐसे मोड़ के रूप में उद्धृत किया जाता है जिसने ब्रिटिश शासन के खिलाफ भारतीय जनमत को काफी हद तक कट्टरपंथी बना दिया, जिससे राष्ट्रवादी आंदोलन के लिए लोकप्रिय समर्थन गहरा हुआ।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'केवल I' है।</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संविधान में 'अवशिष्ट शक्तियों' का विचार किस देश से लिया गया है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संयुक्त राज्य अमेरिका</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कनाडा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऑस्ट्रेलिया</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जापान</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय संविधान में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अवशिष्ट शक्तियों</span><span style=\"font-family:'Nirmala UI'\"> का विचार </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कनाडा</span><span style=\"font-family:'Nirmala UI'\"> से लिया गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अवशिष्ट शक्तियाँ</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> = वे शक्तियाँ जो संविधान में स्पष्ट रूप से उल्लिखित नहीं हैं।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">भारत में, ये शक्तियाँ </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 248</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> के तहत </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">संघ (केंद्र)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> में निहित हैं, जिससे संसद को उन मामलों पर कानून बनाने की अनुमति मिलती है जो संघ, राज्य या समवर्ती सूचियों में सूचीबद्ध नहीं हैं।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">यह अवधारणा </span><span style=\"line-height:115%;font- ा मान्यता प्राप्त आठ शास्त्रीय नृत्य रूपों में से एक।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर सत्रिया है।</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">फोर्ब्स इंडिया रिच लिस्ट के अनुसार भारत का सबसे अमीर व्यक्ति कौन रहा, जो देश की धन रैंकिंग में लगातार प्रभुत्व को दर्शाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">शिव नादर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गौतम अडानी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राधाकिशन दमानी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मुकेश अंबानी</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुकेश अंबानी</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">फोर्ब्स इंडिया रिच लिस्ट</span><span style=\"font-family:'Nirmala UI'\"> के अनुसार भारत के सबसे अमीर व्यक्ति बने रहे, देश की धन रैंकिंग में अपनी लंबे समय से चली आ रही शीर्ष स्थिति को बरकरार रखा।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">फोर्ब्स इंडिया रिच लिस्ट और हुरून इंडिया रिच लिस्ट दोनों, जो विभिन्न संगठनों द्वारा प्रकाशित की जाती हैं, भारत के सबसे धनी व्यक्तियों को सालाना ट्रैक और रैंक करती हैं, जिससे देश के व्यावसायिक परिदृश्य में बदलते भाग्य की जानकारी मिलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर मुकेश अंबानी है।</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विश्व का सबसे बड़ा मैंग्रोव वन 'सुंदरबन' भारत और किस अन्य देश के बीच साझा किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">म्यांमार</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नेपाल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">श्रीलंका</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बांग्लादेश</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गंगा, ब्रह्मपुत्र और मेघना नदियों के डेल्टा पर बना </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सुंदरबन</span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारत</span><span style=\"font-family:'Nirmala UI'\"> (पश्चिम बंगाल) और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बांग्लादेश</span><span style=\"font-family:'Nirmala UI'\"> के बीच साझा किया जाता है, और यह विश्व का सबसे बड़ा मैंग्रोव वन है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">यह रॉयल बंगाल टाइगर का घर है और दोनों देशों में यूनेस्को विश्व धरोहर स्थल के रूप में मान्यता प्राप्त है, जो इसके असाधारण पारिस्थितिक महत्व को दर्शाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर बांग्लादेश है।</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से किस हवाई अड्डे पर भारत के पहले स्काईकास्ट सिस्टम का उद्घाटन किया गया?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राजीव गांधी अंतर्राष्ट्रीय हवाई अड्डा, हैदराबाद</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">छत्रपति शिवाजी महाराज अंतर्राष्ट्रीय हवाई अड्डा, मुंबई</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इंदिरा गांधी अंतर्राष्ट्रीय हवाई अड्डा, दिल्ली</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केम्पेगौड़ा अंतर्राष्ट्रीय हवाई अड्डा, बेंगलुरु</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के पहले स्काईकास्ट सिस्टम का उद्घाटन मई 2026 में </span><span style=\"font-style:italic;font-family:'Nirmala UI'\">इंदिरा गांधी अंतर्राष्ट्रीय (IGI) हवाई अड्डे, नई दिल्ली</span><span style=\"font-family:'Nirmala UI'\"> में किया गया, जिससे भारत ऐसी उन्नत विम व:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> कोहरे, अशांति और खराब दृश्यता के कारण होने वाली </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उड़ान में देरी, मार्ग परिवर्तन और रद्दीकरण</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> को कम करने में मदद करता है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">प्रौद्योगिकी:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">रडार विंड प्रोफाइलर, SODAR, माइक्रोवेव रेडियोमीटर, ग्राउंड-बेस्ड फॉग एरोसोल स्पेक्ट्रोमीटर (GFAS), और CL61 लिडार-आधारित सीलोमीटर</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> को एकीकृत करता है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विस्तार:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> अगली सुविधा </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">जेवर हवाई अड्डे (उत्तर प्रदेश)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> में नियोजित है, जिसके बाद अन्य हवाई अड्डों पर भी इसका विस्तार किया जाएगा।</span></li></ul>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से शास्त्रीय नृत्य शैली - उद्गम मठ/संस्था युग्मों में से कौन-सा सही सुमेलित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;fon t-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पीएम श्रम योगी मानधन योजना</span><span style=\"font-family:'Nirmala UI'\"> (असंगठित क्षेत्र के श्रमिकों के लिए पेंशन), </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पीएम मुद्रा योजना</span><span style=\"font-family:'Nirmala UI'\"> (सूक्ष्म/लघु उद्यमियों के लिए ऋण) और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">RoSCTL योजना</span><span style=\"font-family:'Nirmala UI'\"> (वस्त्र निर्यातकों के लिए सहायता) सभी मुख्य रूप से श्रमिकों और व्यवसायों के लिए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आर्थिक/आजीविका सहायता</span><span style=\"font-family:'Nirmala UI'\"> को लक्षित करती हैं। हालांकि, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एआईसीटीई-वाणी 3.0</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उच्च शिक्षा में भारतीय भाषाओं को बढ़ावा देने</span><span style=\"font-family:'Nirmala UI'\"> पर केंद्रित है, जिससे यह विषम है, क्योंकि इसके लक्षित लाभार्थी छात्र और शैक्षणिक संस्थान हैं न कि श्रमिक या निर्यातक।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">प्रत्येक योजना द्वारा संबोधित विशिष्ट नीतिगत क्षेत्र (आर्थिक आजीविका सहायता बनाम शैक्षिक/भाषाई विकास) को पहचानने से यह सही ढंग से पहचानने में मदद मिलती है कि कौन सी योजना दूसरों के साथ समान सूत्र साझा नहीं करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर एआईसीटीई-वाणी 3.0 (विषम विकल्प) है।</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">19वीं शताब्दी के अंत में मुस्लिम शिक्षा और सामाजिक सुधार को बढ़ावा देने वाले 'अंजुमन-ए-इस्ल let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
