argin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Consumer Price Index for Industrial Workers (CPI</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">IW)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is a specialized inflation index in India.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It is primarily used to determine </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">periodic adjustments in Dearness Allowance (DA)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Dearness Relief (DR)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> for:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Central and state government employees</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Public sector undertakings</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Pensioners</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The CPI</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">IW reflects changes in the cost of living for industrial workers, making it the benchmark for wage and pension revisions.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Labour Bureau (Ministry of Labour &amp; Employment)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> publishes CPI</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">IW every month.</span></li></ul>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The demand for 'Purna Swaraj' (complete independence) as the official goal of the Indian National Congress was first adopted at which session?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Nagpur Session, 1920</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lahore Session, 1929</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Calcutta Session, 1928</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Karachi Session, 1931</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option B — Lahore Session, 1929</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The demand for </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Purna Swaraj (Complete Independence)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> was officially adopted by the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Indian National Congress at its Lahore Session in December 1929</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Presided over by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Jawaharlal Nehru</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, this session marked a historic shift:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Congress declared </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">complete independence</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> as its ultimate goal, rejecting Dominion Status.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It resolved to observe </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">26 January 1930</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> as </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Independence Day</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, which later became symbolic when India adopted its Constitution on </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">26 January 1950</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This resolution laid the foundation for the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Civil Disobedience Movement</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> led by Mahatma Gandhi in 1930.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Under Article 213 of the Indian Constitution, who is empowered to promulgate ordinances when the state legislature is not in session?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The President</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Chief Minister</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Advocate General</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Governor</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option D — The Governor</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Under </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 213</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> of the Indian Constitution, the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Governor of a State</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is empowered to </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">promulgate ordinances</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> when the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">State Legislature is not in session</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">These ordinances have the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">same force as laws passed by the State Legislature</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, but they must be approved by the legislature within </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">six weeks of reassembly</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, otherwise they lapse.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This provision ensures that urgent legislative action can be taken at the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">state level</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> even during the recess of the legislature.</span></li></ul>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The informal 'pocket veto', where the President neither signs, rejects, nor returns a bill, was notably exercised by President Zail Singh in relation to which bill?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Citizenship Amendment Bill</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Indian Post Office Bill</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Right to Information Bill</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The GST Amendment Bill</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option B — The Indian Post Office Bill</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The concept of a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">pocket veto</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> refers to a situation where the President of India neither assents to, rejects, nor returns a bill passed by Parliament.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Unlike the U.S. Constitution, the Indian Constitution does not explicitly mention a pocket veto, but it exists in practice because there is </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">no time limit prescribed</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> for the President to act on a bill.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">President Zail Singh (1982–1987)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> famously exercised this informal veto in relation to the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Indian Post Office (Amendment) Bill, 1986</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The bill sought to give the government sweeping powers to intercept and detain postal articles in the interest of public safety and national security.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Zail Singh, facing political tensions with Prime Minister Rajiv Gandhi, chose not to act on the bill, effectively stalling it indefinitely.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This remains the most cited example of the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">pocket veto in India</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Bankruptcy Law Reforms Committee, which recommended the framework later enacted as the Insolvency and Bankruptcy Code, was headed by:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">N.K. Singh</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Urjit Patel</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">T.K. Viswanathan</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Raghuram Rajan</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option C — T.K. Viswanathan</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bankruptcy Law Reforms Committee (BLRC)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> was constituted by the Government of India in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">2014</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It was chaired by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">T.K. Viswanathan</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, former </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Union Law Secretary</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The committee’s recommendations formed the basis of the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Insolvency and Bankruptcy Code (IBC), 2016</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, which consolidated and modernized India’s insolvency framework.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Key contributions of BLRC:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Proposed a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">time</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">bound insolvency resolution process</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Creation of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Insolvency and Bankruptcy Board of India (IBBI)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Establishment of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">National Company Law Tribunal (NCLT)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> as adjudicating authority.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Framework for </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">insolvency professionals</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">information utilities</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Six Degree Channel separates India's southernmost island, Great Nicobar, from which country?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Indonesia</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Myanmar</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sri Lanka </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Thailand</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option A — Indonesia</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Six Degree Channel</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> lies in the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Indian Ocean</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, south of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Great Nicobar Island</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (India’s southernmost island).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It separates </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Great Nicobar (India)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> from </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sumatra (Indonesia)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Location: Around </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">6° North latitude</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, hence the name.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Strategic Importance:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It is a vital international sea lane of communication.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Crucial for India’s maritime security and trade routes.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Great Nicobar’s proximity to this channel makes it geopolitically significant, especially with India’s proposed </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Great Nicobar transshipment port project</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following best describes the fundamental difference between a compiler and an interpreter?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both execute code line by line without translation</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A compiler executes code line by line; an interpreter translates the whole program first</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both translate the entire program before execution</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A compiler translates the entire program before execution; an interpreter translates line by line during execution</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option D — A compiler translates the entire program before execution; an interpreter translates line by line during execution.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Compiler</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Translates the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">entire source code</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> into machine code </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">before execution</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Produces an independent executable file.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Execution is faster once compiled, but errors are reported only after compilation.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Interpreter</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Translates and executes the program </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">line by line at runtime</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">No separate executable file is created.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Easier for debugging since errors are caught immediately during execution.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Ninth Schedule was originally inserted into the Constitution by the First Amendment Act, 1951, primarily to protect which category of laws from judicial review?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Laws relating to income tax</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Laws relating to reservation in education</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Land reform and zamindari abolition laws</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Laws relating to defence procurement</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option C — Land reform and zamindari abolition laws</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ninth Schedule</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> was inserted by the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">First Constitutional Amendment Act, 1951</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Purpose: To protect </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">land reform laws</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (especially </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">zamindari abolition acts</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">) from being challenged in courts on the grounds of violation of Fundamental Rights.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Context:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Early land reform measures faced judicial challenges, particularly under the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Right to Property</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (then a Fundamental Right).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">To ensure smooth implementation of agrarian reforms, laws were placed in the Ninth Schedule.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Article </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">31B</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> was introduced, which stated that laws in the Ninth Schedule cannot be invalidated for violating Fundamental Rights.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Kothari Commission is primarily associated with which subject in India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Judicial reforms </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Electoral reforms</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Police reforms</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Education Reforms</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option D — Education Reforms</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kothari Commission</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (1964–66), officially known as the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Education Commission of India</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, was chaired by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Dr. D.S. Kothari</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, then Chairman of the University Grants Commission (UGC).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It is considered the most comprehensive review of India’s education system post</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">Independence.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Key recommendations:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Establishment of a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">common school system</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> to promote social equality.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Emphasis on </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">science and mathematics education</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Suggested </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">10+2+3 structure</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (school → higher secondary → degree).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Focus on </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">vocational education</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">teacher training</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Stressed the need for </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">national integration through education</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Its report laid the foundation for the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">National Policy on Education, 1968</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, India’s first education policy.</span></li></ul>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Ryotwari system of land revenue settlement, under which the state directly settled revenue with individual cultivators, was primarily introduced in which regions?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Central Provinces and Berar</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bengal and Bihar</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Punjab and Awadh</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Madras and Bombay</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option D — Madras and Bombay</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ryotwari system</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> was pioneered in the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Madras Presidency</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sir Thomas Munro</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in the early 19th century and later extended to the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bombay Presidency</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Key features:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">individual cultivator (ryot)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> was recognized as the landholder.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Revenue was settled </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">directly between the cultivator and the government</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, bypassing intermediaries like zamindars.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The demand was based on the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">actual produce of the land</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, revised periodically.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This system was considered more flexible than the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Permanent Settlement</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (Bengal) and the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mahalwari system</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (North</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">West Provinces).</span></li></ul>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Graphene, a single-layer hexagonal lattice allotrope of carbon, led to a Nobel Prize in Physics in which year, awarded to Andre Geim and Konstantin Novoselov?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2005</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2010</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2015</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option C — 2010</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The discovery and isolation of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Graphene</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, a single</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">layer hexagonal lattice of carbon atoms, earned </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Andre Geim</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Konstantin Novoselov</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Nobel Prize in Physics in 2010</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Graphene is remarkable because:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It is only </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">one atom thick</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> yet extremely strong.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Exhibits </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">extraordinary electrical conductivity</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">thermal properties</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Has potential applications in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">electronics, nanotechnology, energy storage, and materials science</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The Nobel Committee recognized their “groundbreaking experiments regarding the two</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">dimensional material graphene.”</span></li></ul>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Deccan Traps, a vast igneous province covering much of peninsular India, were formed by intense volcanic activity mainly around which geological boundary?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Jurassic-Cretaceous boundary</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Permian-Triassic boundary</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Cretaceous-Paleogene boundary</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Paleogene-Neogene boundary</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option C — Cretaceous–Paleogene</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> </span><span style=\"font-family:'Cambria Math'\">boundary</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Deccan Traps</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> are one of the world’s largest volcanic provinces, covering much of peninsular India.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">They were formed by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">intense volcanic activity around 66 million years ago</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, coinciding with the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Cretaceous–Paleogene (K–Pg) boundary</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This period is significant because:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It marks the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">mass extinction event</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> that wiped out the dinosaurs.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The Deccan volcanism released massive amounts of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">lava, gases, and aerosols</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, contributing to global climate change.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Alongside the Chicxulub asteroid impact in Mexico, the Deccan Traps are considered a major factor in the extinction.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">As per Union Budget 2026–27, the outlay of the Electronics Components Manufacturing Scheme was increased to:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">₹10,000 crore</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">₹20,000 crore</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">₹30,000 crore</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">₹40,000 crore</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: </span><span style=\"font-family:'Cambria Math'\">₹40,000 crore</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">As per </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Union Budget 2026–27</span><span style=\"font-family:'Cambria Math'\">, the outlay of the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Electronics Components Manufacturing Scheme (ECMS)</span><span style=\"font-family:'Cambria Math'\"> was increased to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">₹40,000 crore</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Points:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Original Outlay</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">: The ECMS was launched in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">April 2025</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> with an initial outlay of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">₹22,919 crore</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (approximately USD 2.7 billion)</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Budget 2026–27 Announcement</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">: Finance Minister </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Nirmala Sitharaman</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> proposed increasing the outlay to </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">₹40,000 crore</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, representing a nearly </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">75% increase</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (almost double) from the original allocation</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Reason for Increase</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">: The scheme had already received investment commitments at </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">double the original target</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (₹1.15 lakh crore against target of ₹59,350 crore), prompting the government to capitalize on this momentum</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Objective</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">: This enhancement aims to deepen India's domestic electronics manufacturing capacity, particularly for high-precision components like display modules, camera modules, and PCBAs, and to strengthen the semiconductor and electronics ecosystem</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">This move is part of the government's broader strategy to position India as a global electronics manufacturing hub and reduce dependency on imports for critical electronic components.</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">IPv6, designed to replace IPv4 and expand the available address space, uses addresses of what bit length?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">32-bit</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">64-bit</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">128-bit</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">256-bit</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option C — 128-bit</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">IPv6</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> was developed to replace </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">IPv4</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, which uses </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">32-bit addresses</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and can support about </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">4.3 billion unique addresses</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">IPv6 uses </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">128-bit addresses</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, allowing for an astronomically larger number of unique IP addresses:</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787400048152_image006.png\" width=\"195\" height=\"21\" alt style=\"vertical-align:middle\" ></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This expansion ensures that the world will not run out of IP addresses, even with the explosive growth of internet</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">connected devices (IoT, smartphones, sensors, etc.).</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">IPv6 addresses are represented in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">hexadecimal notation</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, separated by colons (e.g., 2001:0db8:85a3:0000:0000:8a2e:0370:7334).</span></li></ul>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Phillips Curve' in macroeconomics represents an inverse relationship between which two variables?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Inflation and unemployment</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">GDP growth and exports</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Interest rate and savings</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Fiscal deficit and tax revenue</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option A — Inflation and unemployment.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Phillips Curve</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, introduced by economist </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">A.W. Phillips in 1958</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, shows an </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">inverse relationship between the rate of inflation and the rate of unemployment</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Concept:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">When </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">unemployment is low</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, demand for goods and services rises → prices increase → </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">inflation goes up</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">When </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">unemployment is high</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, demand falls → prices stabilize or drop → </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">inflation goes down</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It became a key tool in macroeconomics to understand the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">trade</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">off between inflation and employment</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Tanglang La, on the Leh-Manali highway, is notable for being one of the:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">only passes connecting Ladakh to Tibet</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">lowest mountain passes in the Himalayas</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">only glacier-fed passes in Ladakh</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">highest motorable mountain passes in the world</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option D — Highest motorable mountain passes in the world.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Tanglang La</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> lies on the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Leh–Manali highway</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in Ladakh.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It is notable for being one of the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">highest motorable mountain passes in the world</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, at an elevation of about </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">5,328 m (17,480 ft)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The pass is strategically important, connecting Leh with Himachal Pradesh, and is also a popular route for adventure tourism.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Its altitude makes it a challenging drive, but it remains a vital link for both military logistics and civilian travel.</span></li></ul>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Under Article 112 of the Indian Constitution who holds the responsibility to lay Annual Financial Statement before both the Houses of Parliament?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Finance Minister</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Prime Minister</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The President</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Chief Justice of India</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option C — The President</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Under </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 112</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> of the Indian Constitution, the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Annual Financial Statement (AFS)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, commonly known as the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Union Budget</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, must be </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">laid before both Houses of Parliament by the President of India</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The President holds the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">constitutional responsibility</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> to present the statement, though in practice, it is the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Finance Minister</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> who delivers the Budget speech in Parliament on behalf of the President.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The AFS contains:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Estimates of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">revenue and expenditure</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> for the upcoming financial year.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Details of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">charged expenditure</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (not subject to vote) and </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">votable expenditure</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Allocation for various ministries, schemes, and developmental programs.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bal Gangadhar Tilak edited which Marathi newspaper, which became a leading mouthpiece of extremist nationalism?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Amrita Bazar Patrika</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kesari</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Young India</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Harijan</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option B — Kesari</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bal Gangadhar Tilak</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (1856–1920), known as </span><span style=\"font-size:12pt;font-style:italic;font-family:'Cambria Math'\">Lokmanya Tilak</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, was a leading nationalist and extremist leader in the Indian freedom struggle.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">He edited the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Marathi newspaper </span><span style=\"font-size:12pt;font-weight:bold;font-style:italic;font-family:'Cambria Math'\">Kesari</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, which became a powerful mouthpiece of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">extremist nationalism</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Through </span><span style=\"font-size:12pt;font-style:italic;font-family:'Cambria Math'\">Kesari</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, Tilak spread ideas of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Swaraj (self</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">rule)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, criticized British policies, and mobilized masses.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">He also edited the English newspaper </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mahratta</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, but </span><span style=\"font-size:12pt;font-style:italic;font-family:'Cambria Math'\">Kesari</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> was more influential among the Marathi</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">speaking public.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">His writings earned him the title </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">“Father of Indian Unrest”</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> from the British.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option Evaluation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Amrita Bazar Patrika </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Edited by Sisir Kumar Ghosh and Motilal Ghosh, based in Bengal.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Young India </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Associated with Mahatma Gandhi, not Tilak.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Harijan </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Also Gandhi’s weekly journal, focused on social reform.</span></li></ul>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The fourth generation of computers is primarily distinguished from the third generation by the introduction of which technology?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Vacuum tubes</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Transistors</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Microprocessors </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Integrated circuits </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option C — Microprocessors</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Fourth Generation of Computers</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (1970s onwards) is distinguished by the introduction of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">microprocessors</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">A </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">microprocessor</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> integrates thousands of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">integrated circuits (ICs)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> into a single silicon chip, functioning as the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">CPU</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This innovation made computers:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Smaller and more portable</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Faster and more efficient</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Affordable and accessible to individuals (personal computers era)</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option Evaluation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Vacuum tubes </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Used in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">First Generation</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> computers (1940s–50s).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Transistors </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Used in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Second Generation</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> computers (1950s–60s).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Integrated circuits </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Used in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Third Generation</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> computers (1960s–70s).</span></li></ul>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Under Article 368, a Constitutional Amendment Bill affecting federal
