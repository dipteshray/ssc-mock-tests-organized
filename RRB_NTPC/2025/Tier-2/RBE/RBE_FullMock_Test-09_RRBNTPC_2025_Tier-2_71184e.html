<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>17.) RRB NTPC (UG) 2025-26 CBT-2 Paid Mock 9 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }

umbers are given below. In each set of numbers, certain mathematical operation(s) on the first number results in the second number. Similarly, certain mathematical operation(s) on the second number results in the third number and so on. Which of the given options follows the same set of operations as in the given sets?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">48 - 70 - 92 - 114</span><br><span style=\"font-family:'Cambria Math'\">53 - 75 - 97 - 119 </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">64 - 86 - 98 - 110</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">39 - 61 - 83 - 105</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">21 - 43 - 55 - 77</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">59 - 81 - 93 - 125</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Given sets:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">48 → 70 → 92 → 114</span><br><span style=\"font-family:'Cambria Math'\">53 → 75 → 97 → 119</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pattern:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">48 + 22 = 70</span><br><span style=\"font-family:'Cambria Math'\">70 + 22 = 92</span><br><span style=\"font-family:'Cambria Math'\">92 + 22 = 114</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">53 + 22 = 75</span><br><span style=\"font-family:'Cambria Math'\">75 + 22 = 97</span><br><span style=\"font-family:'Cambria Math'\">97 + 22 = 119</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So, each number is increased by 22.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Check options:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A) 64 → 86 (+22) → 98 (+12) </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">B) 39 → 61 (+22) → 83 (+22) → 105 (+22) </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">C) 21 → 43 (+22) → 55 (+12) </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">D) 59 → 81 (+22) → 93 (+12) </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Answer: B) 39 - 61 - 83 - 105 </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Three of the following four letter-clusters are alike in a certain way and thus form a group. Which is the letter-cluster that does NOT belong to that group?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(Note: The odd one out is not based on the number of consonants/vowels or their positions in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">HQYD</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">UDLQ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">ENVA</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">JSAE</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Check the difference between consecutive letters:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A) HQYD</span><br><span style=\"font-family:'Cambria Math'\">H → Q = +9, Q → Y = +8, Y → D = +5 </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">B) UDLQ</span><br><span style=\"font-family:'Cambria Math'\">U → D = +9, D → L = +8, L → Q = +5 </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">C) ENVA</span><br><span style=\"font-family:'Cambria Math'\">E → N = +9, N → V = +8, V → A = +5 </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">D) JSAE</span><br><span style=\"font-family:'Cambria Math'\">J → S = +9, S → A = +8, A → E = +4 </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Answer: D) JSAE </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">If ‘A’ stands for ‘÷’, ‘B’ stands for ‘×’, ‘C’ stands for ‘+’ and ‘D’ stands for ‘−’, what will be come in place of question mark (?) in the following equation?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3 B 41 A 3 D 34 C 17 = ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">24</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">25</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">26</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">23</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Replace symbols:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">B = ×, A = ÷, D = −, C = +</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3 × 41 ÷ 3 − 34 + 17</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Using BODMAS:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">= 3 × 41 ÷ 3 − 34 + 17</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">= 41 − 34 + 17</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">= 7 + 17= 24</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Answer: (a) 24 </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Select the pair that follows the same pattern as that followed by the two pairs given below. Both pairs follow the same pattern.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">QRU : NTS</span><br><span style=\"font-family:'Cambria Math'\">KVQ : HXO </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">EZM : BBK</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">KAQ : HCT</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">SMY : QNX</span></p>", "option4": " <p :108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787399913197_image010.png\" width=\"369\" height=\"181\" alt ></p><p style=\"margin-top:0pt;margin-bottom:6pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Family Structure:</span><span style=\"font-family:'Cambria Math'\"> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">S (male) married to R (female) </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">U is son of R (and S) </span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Answer: Option 2 → Sister </span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">If 1 is added to each odd digit and 1 is subtracted from each even digit in the number 8375642, what will be the sum of the greatest and smallest digits in the new number thus formed?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">12</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">11</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">9</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Given number = 8375642</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Odd digits +1, Even digits -1</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">8 → 7</span><br><span style=\"font-family:'Cambria Math'\">3 → 4</span><br><span style=\"font-family:'Cambria Math'\">7 → 8</span><br><span style=\"font-family:'Cambria Math'\">5 → 6</span><br><span style=\"font-family:'Cambria Math'\">6 → 5</span><br><span style=\"font-family:'Cambria Math'\">4 → 3</span><br><span style=\"font-family:'Cambria Math'\">2 → 1</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">New number = 7486531</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Greatest digit = 8</span><br><span style=\"font-family:'Cambria Math'\">Smallest digit = 1</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sum = 8 + 1 = 9</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Answer: (d) 9</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Anil ranked 27th from the top and 19th from the bottom in his class. How many students are there in his class?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">43 </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">46 </span></p>", "option ;font-family:'Cambria Math'\">Key Details:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Event:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> Inauguration of the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">72nd National Volleyball Championship</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in Varanasi (January 2026).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Announcement:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> PM Modi declared India’s </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">strong bid for the 2036 Olympics</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, emphasizing readiness and international experience.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Proposed Host City:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ahmedabad</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, with Gandhinagar as a twin</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">city development plan.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Budget:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> Estimated between </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">₹34,700 crore – ₹64,000 crore</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> for infrastructure and facilities.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Supporting Events:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> India will host the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">2030 Commonwealth Games</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, further strengthening its case for the Olympics.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sports Ecosystem:</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> Initiatives like </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Khelo India</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Target Olympic Podium Scheme (TOPS)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> are cited as evidence of India’s athlete</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">centric reforms.</span></li></ul>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Under Article 356, for how long can President's Rule in a state continue at a stretch without requiring a proclamation of Emergency under Article 352 or Election Commission certification, as per the 44th Amendment safeguards?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Six months</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">One year</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Two years</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Three years</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option B — One year</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 356 (President’s Rule):</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Allows the President to assume control of a state if constitutional machinery fails.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Initially, President’s Rule could continue for </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">up to three years</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> with parliamentary approval.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">44th Constitutional Amendment (1978) Safeguards:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">To prevent misuse, the amendment restricted the extension of President’s Rule.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Without a national emergency under Article 352 OR Election Commission certification that elections cannot be held</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, President’s Rule </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">cannot continue beyond one year at a stretch</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Thus, the maximum duration </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">without those special conditions</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">one year</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Beyond one year:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Extension up to </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">three years</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is possible only if:</span><ol type=\"1\"><li style=\"margin-left:32.11pt;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span>A </span><span style=\"font-weight:bold\">National Emergency under Article 352</span><span> is in operation, OR</span></li><li style=\"margin-left:32.11pt;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span>The </span><span style=\"font-weight:bold\">Election Commission certifies</span><span> that elections cannot be held in the concerned state.</span></li></ol></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Doctrine of Lapse', used extensively to annex princely states lacking a natural male heir, was formulated by which Governor-General of India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lord Dalhousie</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lord Wellesley</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lord Curzon</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lord Bentinck</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option A — Lord Dalhousie</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Doctrine of Lapse</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> was formulated and applied extensively by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Lord Dalhousie</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, Governor</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">General of India (1848–1856).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Under this doctrine:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">If a princely ruler died </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">without a natural male heir</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, his kingdom would “lapse” and be annexed by the British.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Adopted sons were </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">not recognized</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> as legitimate successors.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This policy led to the annexation of several states, including:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Satara</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (1848)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Jaitpur and Sambalpur</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (1849)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Baghat</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (1850)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Udaipur (1852)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> – </span><span style=\"font-size:12pt;font-style:italic;font-family:'Cambria Math'\">Note: A princely state in modern-day Madhya Pradesh, distinct from Udaipur in Rajasthan.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Jhansi</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (1853)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Nagpur</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (1854)</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(Note: While </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Awadh was annexed in 1856</span><span style=\"font-family:'Cambria Math'\">, it was taken over on the grounds of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">alleged misrule/maladministration</span><span style=\"font-family:'Cambria Math'\"> under a different pretext, not the Doctrine of Lapse.)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">This aggressive annexation policy was one of the major causes of resentment that fueled the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Revolt of 1857</span><span style=\"font-family:'Cambria Math'\">.</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In the OSI model of computer, which layer is primarily responsible for routing data packets?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Session layer</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Transport layer</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Network layer</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Data link layer</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option C — Network layer</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Network layer</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">OSI model</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is primarily responsible for </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">routing data packets</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> across different networks and subnets.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Key functions:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Logical addressing</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (IP addresses).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Routing</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> packets using protocols like RIP, OSPF, BGP.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Packet forwarding</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> across multiple hops to reach the destination.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option Evaluation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Session layer </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Manages sessions between applications, not routing.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Transport layer </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Ensures reliable end</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">to</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">end communication (TCP/UDP), not routing.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Data link layer </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Deals with frames, MAC addresses, and local subnet delivery, not routing across networks.</span></li></ul>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The concept of the 'Rolling Plan' in India's Five-Year Plan history was introduced during which period?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1951 to 1956</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1966 to 1969</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1978 to 1980</span><span style=\"font-family:'Cambria Math'\">  </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1990 to 1992</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option C — 1978 to 1980</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Rolling Plan</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> was introduced by the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Janata Government under Prime Minister Morarji Desai</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1978</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It replaced the ongoing </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Fifth Five</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Year Plan (1974–79)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> midway, after the Emergency period.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Concept:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Instead of fixed five</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">year targets, the Rolling Plan had </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">annual plans</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> that were revised each year.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Performance was reviewed annually, and targets adjusted accordingly.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The idea was to make planning more </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">flexible and responsive</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> to changing economic conditions.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Outcome:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The Rolling Plan lasted only until </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1980</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, when Indira Gandhi returned to power and launched the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sixth Five</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Year Plan (1980–85)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Unlike most peninsular rivers of India that flow eastward, the Narmada flows westward into the Arabian Sea through a structure formed by which geological feature?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Estuarine plateau</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Delta plain</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Fold mountain</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rift valley</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option D — Rift valley</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Narmada River</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> flows westward into the Arabian Sea, unlike most peninsular rivers that flow eastward.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This unique course is due to the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">rift valley formation</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> between the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Vindhya Range (north)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Satpura Range (south)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">A </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">rift valley</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is formed by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">faulting of the Earth’s crust</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, creating a long depression through which the river flows.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Because of this geological structure, the Narmada does not form a delta but instead flows into the Arabian Sea through an estuary.</span></li></ul>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Constitutional Amendment Act inserted a provision under Article 15 enabling reservation for Economically Weaker Sections (EWS) among general category citizens?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">73rd Amendment Act</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">83rd Amendment Act</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">93rd Amendment Act</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">103rd Amendment Act</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option D — 103rd Amendment Act</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">103rd Constitutional Amendment Act, 2019</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> inserted a provision under </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 15(6)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 16(6)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It enabled </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">reservation for Economically Weaker Sections (EWS)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> among the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">general category citizens</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Educational institutions</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (Article 15)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Government jobs</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (Article 16)</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The amendment provides </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">10% reservation</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> for EWS, over and above the existing reservations for SCs, STs, and OBCs.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This was a landmark move as it introduced </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">economic criteria</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> as a basis for affirmative action, which was not previously recognized in the Constitution.</span></li></ul>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Twin Balance Sheet' problem in the Indian economy refers to simultaneous financial stress in which two sectors?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Agriculture and manufacturing sectors</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Public and private education sectors</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Import and export sectors</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Banking sector and corporate sector </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option D — Banking sector and corporate sector.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Twin Balance Sheet problem</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> refers to </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">simultaneous financial stress</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in:</span><ol type=\"1\"><li style=\"margin-left:32.11pt;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span style=\"font-weight:bold\">Banking sector</span><span> → burdened with </span><span style=\"font-weight:bold\">Non</span><span style=\"font-weight:bold\">‑</span><span style=\"font-weight:bold\">Performing Assets (NPAs)</span><span> due to bad loans.</span></li><li style=\"margin-left:32.11pt;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span style=\"font-weight:bold\">Corporate sector</span><span> → over</span><span>‑</span><span>leveraged companies struggling to repay debts.</span></li></ol></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This situation emerged prominently in India during the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">2010s</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, when aggressive corporate borrowing (especially in infrastructure and power sectors) led to defaults, which in turn weakened banks’ balance sheets.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The problem created a vicious cycle:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:47pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Weak corporates → loan defaults → stressed banks.</span></li><li style=\"margin-left:47pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Stressed banks → reduced lending → corporates unable to revive.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Insolvency and Bankruptcy Code (IBC), 2016</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and recapitalization of public sector banks were major policy responses to address this issue.</span></li></ul>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">As per Union Budget 2026–27, the newly proposed Scheme for Container Manufacturing has an outlay of how much over five years?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">₹5,000 crore</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">₹10,000 crore</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">₹15,000 crore</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">₹25,000 crore</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option B — ₹10,000 crore</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">In the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Union Budget 2026–27</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, the government announced a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">new Scheme for Container Manufacturing</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The scheme has an </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">outlay of ₹10,000 crore spread over five years</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Objective:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Reduce dependence on imported shipping containers.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Strengthen India’s logistics and maritime infrastructure.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Support the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Make in India</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> initiative and boost domestic manufacturing capacity.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This scheme complements other infrastructure pushes like </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">PM Gati Shakti</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and port modernization.</span></li></ul>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">According to Bernoulli's principle, an increase in the speed of a flowing fluid occurs simultaneously with a decrease in which quantity?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mass of the fluid</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Density of the fluid</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Volume of the fluid</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pressure of the fluid</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option D — Pressure of the fluid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">According to </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bernoulli’s principle</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, for an incompressible, non</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">viscous fluid in steady flow:</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787400048152_image001.png\" width=\"194\" height=\"38\" alt style=\"vertical-align:middle\" ></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Here:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787400048152_image002.png\" width=\"10\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-size:12pt;font-family:'Cambria Math'\">= Pressure</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787400048152_image003.png\" width=\"10\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-size:12pt;font-family:'Cambria Math'\">= Density</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787400048152_image004.png\" width=\"9\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-size:12pt;font-family:'Cambria Math'\">= Velocity of fluid</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787400048152_image005.png\" width=\"9\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-size:12pt;font-family:'Cambria Math'\">= Height (potential energy term)</span></li></ul></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This equation shows that when the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">velocity (speed) of the fluid increases</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">pressure decreases</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, provided height remains constant.</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Example:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">In an airplane wing, air moves faster over the curved upper surface → pressure decreases → lift is generated.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">In a Venturi tube, fluid speeds up in the narrow section → pressure drops.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Consumer Price Index for Industrial Workers' (CPI-IW) is primarily used to determine periodic adjustments in:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Dearness Allowance </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Minimum Support Price</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Repo rate by RBI</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Customs duty rates</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option A — Dearness Allowance</span></p><p style=\"m
