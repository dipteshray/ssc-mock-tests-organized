 provisions (such as the election of the President or representation of states) requires ratification by:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">at least half of the state legislatures</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">at least two-thirds of the state legislatures</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">all state legislatures unanimously</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">at least one-third of the state legislatures</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option A — at least half of the state legislatures</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Under </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 368</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, constitutional amendments are classified into three categories:</span><ol type=\"1\"><li style=\"margin-left:32.11pt;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span style=\"font-weight:bold\">By simple majority</span><span> (e.g., creation of new states).</span></li><li style=\"margin-left:32.11pt;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span style=\"font-weight:bold\">By special majority of Parliament</span><span> (e.g., most provisions).</span></li><li style=\"margin-left:32.11pt;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span style=\"font-weight:bold\">By special majority of Parliament + ratification by states</span><span> (for federal provisions).</span></li></ol></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Federal provisions include:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:47pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Election of the President</span></li><li style=\"margin-left:47pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Representation of states in Parliament</span></li><li style=\"margin-left:47pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Distribution of legislative powers between Union and States</span></li><li style=\"margin-left:47pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Any provision affecting the federal structure</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">For such amendments, ratification is required by </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">not less than one</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">half of the state legislatures</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> before the bill can be presented to the President for assent.</span></li></ul>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">'Base Erosion and Profit Shifting' (BEPS), an OECD-led initiative India has committed to, primarily addresses:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Currency manipulation </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Government borrowings</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Trade tariffs</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Tax avoidance</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option D — Tax avoidance</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Base Erosion and Profit Shifting (BEPS)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is an initiative led by the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">OECD (Organisation for Economic Co</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">operation and Development)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">G20</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It addresses strategies used by multinational corporations to </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">shift profits</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> from high</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">tax jurisdictions to low</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">tax or no</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">tax jurisdictions, thereby </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">eroding the tax base</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> of the country where economic activity actually occurs.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Common BEPS practices include:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Transfer pricing manipulation</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (artificially shifting profits through intra</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">group transactions).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Treaty shopping</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (using tax treaties to reduce liabilities).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Use of tax havens</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> for profit parking.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">India has committed to the BEPS framework to ensure </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">fair taxation</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, prevent revenue loss, and strengthen its international tax compliance regime.</span></li></ul>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Madiga Dappu folk music is associated with which of the following state?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Andhra Pradesh</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Odisha</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Madhya Pradesh</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Maharashtra</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option A — Andhra Pradesh</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Madiga Dappu</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is a traditional </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">folk music form of Andhra Pradesh</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, closely associated with the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Madiga community</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (a Dalit sub</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">caste).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The word </span><span style=\"font-size:12pt;font-style:italic;font-family:'Cambria Math'\">Dappu</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> refers to a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">percussion instrument (drum)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> made of wood and leather, played with sticks.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It is used in:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Community gatherings and festivals</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Social and cultural mobilization</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Folk performances and protest movements</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The rhythm of Dappu is considered a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">symbol of Dalit assertion and cultural identity</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in Andhra Pradesh.</span></li></ul>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which statement correctly distinguishes a compiler from an interpreter?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A compiler and an interpreter both execute one statement at a time without prior translation.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A compiler and an interpreter both process the complete program before execution.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A compiler executes one statement at a time, whereas an interpreter processes the complete program.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A compiler processes the complete program, whereas an interpreter executes one statement at a time.</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option D — A compiler processes the complete program, whereas an interpreter executes one statement at a time.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Compiler</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Translates the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">entire source code</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> into machine code </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">before execution</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Produces an independent executable file.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Execution is faster once compiled, but errors are reported only after compilation.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Interpreter</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Translates and executes the program </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">line by line at runtime</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">No separate executable file is created.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Easier for debugging since errors are caught immediately during execution.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Thomas Cup and Uber Cup tournaments are world championships associated with which sport?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lawn Tennis</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Badminton</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Table Tennis</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Hockey</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option B — Badminton</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Thomas Cup</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Uber Cup</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> are the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">world team championships in badminton</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Thomas Cup</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Men’s world team championship, first held in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1949</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, named after </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sir George Thomas</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Uber Cup</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Women’s world team championship, first held in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1957</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, named after </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Betty Uber</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, a British badminton player.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Both tournaments are organized by the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Badminton World Federation (BWF)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and are considered the most prestigious team events in badminton.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">India made history by winning its </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">first-ever Thomas Cup in 2022</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, defeating Indonesia in the final.</span></li></ul>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Under RBI's flexible inflation targeting framework, which index is officially used as the target measure of inflation?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">GDP Deflator</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Wholesale Price Index (WPI)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consumer Price Index (CPI)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Producer Price Index (PPI)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option C — Consumer Price Index (CPI)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Under the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Flexible Inflation Targeting Framework</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> adopted in India (via the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">RBI Act amendment, 2016</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">), the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Reserve Bank of India (RBI)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> officially uses the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Consumer Price Index (CPI)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> as the measure of inflation.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Monetary Policy Committee (MPC)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> targets CPI inflation at </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">4%</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, with a tolerance band of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">±2% (i.e., 2%–6%)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Why CPI?</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">CPI reflects </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">retail inflation</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, i.e., the cost of living for households.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It is more representative of the inflation experienced by the general public compared to WPI or GDP deflator.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It aligns with global best practices for inflation targeting.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The GST Council, in which both the Union and State governments have voting representation, is often cited as a key example of which constitutional concept?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Cooperative federalism</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Quasi-unitary governance</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Dual federalism</span><span style=\"font-family:'Cambria Math'\">  </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Parliamentary sovereignty</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option A — Cooperative federalism</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">GST Council</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> was established under </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 279A</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> of the Constitution.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It includes representation from both:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Union Government</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Finance Minister (Chairperson) + Union Minister of State for Finance.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">State Governments</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Finance/Taxation Ministers of all States and UTs with legislatures.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Decisions are taken by a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">weighted voting system</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (⅓ Union, ⅔ States), requiring a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">¾ majority</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This arrangement exemplifies </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">cooperative federalism</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, where Union and State governments </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">work together in fiscal decision</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">making</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> rather than acting in isolation.</span></li></ul>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The famous Structural stone shore temple at Mahabalipuram was constructed during the reign of which Pallava ruler?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mahendravarman I</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Narasimhavarman II</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Nandivarman II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Simhavishnu</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option B — Narasimhavarman II</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Shore Temple at Mahabalipuram</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (Tamil Nadu) is one of the most iconic examples of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pallava architecture</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It was constructed during the reign of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pallava ruler Narasimhavarman II (Rajasimha)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">7th–8th century CE</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Features:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Built in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Dravidian style</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> using granite.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Dedicated to </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Lord Shiva</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Lord Vishnu</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Part of the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Group of Monuments at Mahabalipuram</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, a UNESCO World Heritage Site.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Known for its coastal location, standing as a sentinel against the Bay of Bengal.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Barren Island, located in the Andaman and Nicobar Islands, is significant for being India's only:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">natural harbour island</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">offshore coral atoll</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">confirmed active volcano</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">freshwater lake island</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option C — Confirmed active volcano</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Barren Island</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is located in the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Andaman and Nicobar Islands</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in the Bay of Bengal.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It is significant for being </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">India’s only confirmed active volcano</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">First eruption recorded: </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1787</span><span style=\"font-size:12pt;font-fa <span style=\"font-family:'Cambria Math'\">promoting glucose uptake into body cells</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">breaking down proteins into glucose</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">reducing water absorption in kidneys</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option B — Promoting glucose uptake into body cells</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Insulin</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is secreted by the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">β</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">cells of the pancreas (Islets of Langerhans)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Its </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">primary role</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is to </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">lower blood glucose levels</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> by:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Promoting </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">uptake of glucose into muscle and fat cells</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Stimulating </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">glycogen synthesis</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> in the liver and muscles.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Inhibiting glucose production (gluconeogenesis) in the liver.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which atmospheric layer lies directly above the Stratosphere and experiences temperature decreasing with altitude down to around −90°C?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Troposphere</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Thermosphere</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mesosphere</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Exosphere</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option C — Mesosphere</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mesosphere</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> lies </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">directly above the Stratosphere</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and extends from about </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">50 km to 80–85 km</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> above Earth’s surface.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">In this layer, the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">temperature decreases with altitude</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, reaching as low as </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">−90°C near the mesopause</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (the boundary between the mesosphere and thermosphere).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Key features:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Coldest atmospheric layer.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Meteors burn up here due to friction with air molecules.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Contains noctilucent clouds at very high altitudes.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option Evaluation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Troposphere </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Lowest layer; temperature decreases with altitude but lies below the stratosphere, not above.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Thermosphere </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Lies above the mesosphere; temperature increases sharply with altitude due to solar radiation absorption.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Exosphere </span><span style=\"font-family:'Segoe UI Emoji';font-size:12pt;font-weight:bold\">❌</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Outermost layer; merges in om of conscience and religion</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> → Available to </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">all persons</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, citizens and foreigners.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">“Among the given options, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Article 19 is the only Fundamental Right available exclusively to citizens.”</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Grand Master (GM) won Norway Chess 2026?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Dommaraju Gukesh</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Javokhir Sindarov</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rameshbabu Praggnanandhaa</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Wesly So</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Grandmaster Rameshbabu Praggnanandhaa won Norway Chess 2026, finishing with 18 points after a decisive final</span><span style=\"font-family:'Cambria Math'\">‑</span><span style=\"font-family:'Cambria Math'\">round classical victory over Vincent Keymer. Wesley So placed second, while Alireza Firouzja secured third.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"fon ia Math'\">, under the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ministry of Finance</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, is the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">nodal agency</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> for managing the government’s disinvestment program in </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Central Public Sector Enterprises (CPSEs)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Functions of DIPAM:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Formulates policies on </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">disinvestment and asset management</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Executes </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">strategic disinvestment</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and minority stake sales.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Manages </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">government equity investments</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Oversees </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">capital restructuring</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> of CPSEs.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Evolution:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Initially handled by the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Department of Economic Affairs</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">In </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1999</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, a separate </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Department of Disinvestment</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> was created.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">In </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">2016</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, it was renamed </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">DIPAM</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> to reflect its broader role in asset management.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Ajanta and Ellora cave complexes, both UNESCO World Heritage Sites in Maharashtra, differ primarily in that:</span></p>", "option1": "<p st an><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Exclusively </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Buddhist</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> — famous for </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">rock</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">cut monasteries, chaityas (prayer halls), and exquisite murals</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> depicting Jataka tales.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">UNESCO World Heritage Site, celebrated for its </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">paintings and sculptures</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ellora Caves</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Located near Aurangabad, Maharashtra, dating from </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">6th to 10th century CE</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Unique because it represents </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">three major religions together</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">:</span><ul type=\"square\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:27.58pt;padding-left:8.42pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Buddhist caves (1–12)</span></li><li style=\"margin-left:27.58pt;padding-left:8.42pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Hindu caves (13–29)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> — including the famous </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kailasa Temple</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> built by the Rashtrakutas.</span></li><li style=\"margin-left:27.58pt;padding-left:8.42pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Jain caves (30–34)</span></li></ul></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">UNESCO World Heritage Site, showcasing </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">religious harmony and architectural diversity</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">What type of mirror is used as a rear-view mirror in vehicles to provide a wider field of view?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Concave Mirror</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Convex Mirror</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Plane Mirror</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Parabolic Mirror</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option B — Convex Mirror</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Vehicles use </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">convex mirrors</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> as rear</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">view mirrors.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">A convex mirror has a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">curved, outward surface</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> that reflects light to form an image that is:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Virtual</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (not real)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Erect</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (upright)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Diminished</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (smaller than the object)</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Because the image is diminished, the mirror can capture a </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">wider field of view</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, allowing drivers to see more of the road and vehicles behind them.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">This property makes convex mirrors ideal for safety in vehicles.</span></li></ul>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ustad Bade Ghulam Ali Khan, a legendary Hindustani classical vocalist known for the 'Thumri' style, belonged to which Gharana?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Patiala Gharana</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Gwalior Gharana</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kirana Gharana</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Agra Gharana</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option A — Patiala Gharana</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ustad Bade Ghulam Ali Khan</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (1902–1968) was one of the greatest Hindustani classical vocalists of the 20th century.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">He belonged to the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Patiala Gharana</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, which is known for:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Rich, melodious style with emphasis on </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">taan, gamak, and meend</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (ornamentation).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Fusion of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">khayal</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> with lighter forms like </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">thumri</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, making classical music more accessible.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Smooth, emotive delivery that appealed to both connoisseurs and the general public.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Bade Ghulam Ali Khan’s </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">thumris</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, especially </span><span style=\"font-size:12pt;font-style:italic;font-family:'Cambria Math'\">Yaad piya ki aaye</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"font-size:12pt;font-style:italic;font-family:'Cambria Math'\">Ka karoon sajni</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, remain iconic.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">He was awarded the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Padma Bhushan (1962)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> for his contribution to Indian music.</span></li></ul>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Human Development Index (HDI) is computed as which type of mean of its three normalised dimension indices (health, education and standard of living)?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Weighted mean</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Arithmetic mean</span><span style=\"font-family:'Cambria Math'\">   </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Geometric mean</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Harmonic mean</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Option C — Geometric mean</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Human Development Index (HDI)</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> is a composite measure of </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">health, education, and standard of living</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Since the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">2010 revision</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, the UNDP computes HDI using the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">geometric mean</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> of the three normalized dimension indices.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Reason for geometric mean:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Prevents one dimension (e.g., income) from compensating disproportionately for poor performance in another (e.g., education).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Ensures </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">balanced development</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> across all dimensions.</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Formula:</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787400048152_image007.png\" width=\"259\" height=\"21\" alt style=\"vertical-align:middle\" ></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Itai-Itai disease is a syndrome caused by severe poisoning from which chemical element?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lead</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mercury</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Arsenic</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\ bria Math'\">‑</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">20th century, it was linked to cadmium contamination of rice fields due to mining activities.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Symptoms include:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Severe pain in bones and joints</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Osteomalacia (softening of bones)</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Kidney damage</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">Fractures due to weakened skeletal structure</span></li></ul></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Cambria Math'\">It is considered one of the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">four major pollution diseases of Japan</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> (alongside Minamata disease, Niigata Minamata disease, and Yokkaichi asthma).</span></li></ul>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">To complete a wall, Ravi takes 50% more time than Mohan. If together they complete the wall in 24 days, then how much time will Ravi alone take to complete it?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">36 days</span></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A square pyramid has a base side of 12 cm and height of 8 cm. Find the total surface area of the pyramid.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">432 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">348 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">384 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">420 cm²</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Base side (a) = 12 cm</span><br><span style=\"font-family:'Cambria Math'\">Height (h) = 8 cm</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Slant height (l) = √[(a/2)² + h²]</span><br><span style=\"font-family:'Cambria Math'\">= √[(12/2)² + 8²]</span><br><span style=\"font-family:'Cambria Math'\">= √(6² + 8²) = √100 = 10 cm</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Total Surface Area = Lateral Surface Area + Base Area</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lateral Surface Area = 1/2 × Perimeter of Base × Slant Height</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">= 1/2 × (4 × on": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Four chimes ring simultaneously at 5:30 a.m. After that, they ring at the intervals of 15 seconds, 20 seconds, 25 seconds and 30 seconds, respectively. How many times will these chimes ring together till 8:15 a.m., including at 5:30 a.m.?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">32</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">34</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">31</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">33</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Time after which all chimes ring together:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">LCM of 15, 20, 25 and 30</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">15 = 3 × 5</span><br><span style=\"font-family:'Cambria Math'\">20 = 2² × 5</span><br><span style=\"font-family:'Cambria Math'\">25 = 5²</span><br><span style=\"font-family:'Cambria Math'\">30 = 2 × 3 × 5</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">LCM = 2² × 3 × 5²</span><br><span style=\"font-family:'Cambria Math'\">= 4 × 3 × 25</span><br><span style=\"font-family:'Cambria Math'\">= 300 sec
