thus form a group. Which letter-cluster pair DOES NOT belong to that group?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">EW – BB</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">HK – DP</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">QC – NH</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">KM – HR</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In each pair, the first letter is moved 3 places backward and the second letter is moved 5 places forward.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">EW → E − 3 = B, W + 5 = B → BB</span><br><span style=\"font-family:'Cambria Math'\">QC → Q − 3 = N, C + 5 = H → NH</span><br><span style=\"font-family:'Cambria Math'\">KM → K − 3 = H, M + 5 = R → HR</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">HK → H − 3 = E, K + 5 = P → It should be </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">EP</span><span style=\"font-family:'Cambria Math'\">, but </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">DP</span><span style=\"font-family:'Cambria Math'\"> is given.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer: (B) HK – DP</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In the human nephron, which part is primarily responsible for ultrafiltration of blood, and where is the filtrate collected immediately after this process?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Loop of Henle; collecting duct</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Glomerulus; Bowman’s capsule</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Proximal convoluted tubule; glomerulus</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Distal convoluted tubule; renal pelvis</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: B. Glomerulus; Bowman’s capsule</span></p><p style=\"margin-top:14pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span><br><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">glomerulus</span><span style=\"font-family:'Cambria Math'\"> is a network of blood capillaries where blood is filtered under pressure. The filtered fluid, called </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">glomerular filtrate</span><span style=\"font-family:'Cambria Math'\">, is collected in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bowman’s capsule</span><span style=\"font-family:'Cambria Math'\">. Both structures together form the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Malpighian body or renal corpuscle</span><span style=\"font-family:'Cambria Math'\"> of a nephron.</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is the correct sequence of steps for a State to come under President's Rule?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Cabinet decision - President's proclamation - No further approval needed</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Governor's report on constitutional breakdown - President's proclamation under Article 356 - Parliamentary approval within 2 months</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">President's proclamation - Supreme Court approval - Governor's report</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Parliamentary approval - Governor's report - Presidential proclamation</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Under </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Article 356</span><span style=\"font-family:'Cambria Math'\">, the process begins with the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Governor's report</span><span style=\"font-family:'Cambria Math'\"> indicating a breakdown of constitutional machinery, followed by the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">President's proclamation</span><span style=\"font-family:'Cambria Math'\"> of President's Rule, which must then be </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">approved by Parliament within two months</span><span style=\"font-family:'Cambria Math'\"> to continue in force.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">If not approved by Parliament, the proclamation lapses after two months; if approved, it can be extended in installments up to a maximum of three years under specific conditions.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'Governor's report on constitutional breakdown - President's proclamation under Article 356 - Parliamentary approval within 2 months'.</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A metal reacts with dilute hydrochloric acid to produce hydrogen gas with brisk effervescence, but does not react with dilute nitric acid to produce hydrogen. Which of the following best explains this behaviour?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Nitric acid is weaker than hydrochloric acid</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The metal is unreactive with all acids</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Hydrochloric acid does not produce hydrogen gas with metals</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Nitric acid is a strong oxidising agent and typically reacts with metals to produce nitrogen oxides instead of hydrogen</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Nitric acid is a strong oxidising agent</span><span style=\"font-family:'Cambria Math'\">, so instead of simply displacing hydrogen, it usually oxidises the hydrogen gas formed into water, itself getting reduced to nitrogen oxides (like NO or NO2) - meaning hydrogen gas is rarely observed when metals react with nitric acid.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">This is why nitric acid is generally excluded from typical 'metal + acid = salt + hydrogen' reactions taught for acids like HCl and dilute H2SO4.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'Nitric acid is a strong oxidising agent and typically reacts with metals to produce nitrogen oxides instead of hydrogen'.</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following statements about India's financial sector developments in 2026 is CORRECT?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Saraswat Co-operative Bank became India's largest Urban Co-operative Bank after crossing ₹50,000 crore in total business</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The RBI's new Integrated Ombudsman Scheme came into effect from 1 July 2026</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">India's External Debt decreased in FY26 compared to the previous year</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Income-tax Act, 2025 came into force from 1 January 2026</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">RBI's Integrated Ombudsman Scheme</span><span style=\"font-family:'Cambria Math'\"> came into effect from </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1 July 2026</span><span style=\"font-family:'Cambria Math'\">, streamlining grievance redressal for banking, NBFC and digital payment customers under a single unified framework. India's </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">External Debt actually rose</span><span style=\"font-family:'Cambria Math'\"> to $762.8 billion in FY26 (not decreased); </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Saraswat Co-operative Bank</span><span style=\"font-family:'Cambria Math'\"> crossed </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">₹1 lakh crore</span><span style=\"font-family:'Cambria Math'\"> (not ₹50,000 crore) in total business; and the new Income-tax Act takes effect from </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1 April 2026</span><span style=\"font-family:'Cambria Math'\"> (not 1 January).</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'The RBI's new Integrated Ombudsman Scheme came into effect from 1 July 2026'.</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Assertion (A): A ship made of iron floats on water, even though iron is denser than water.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Reason (R): The ship is designed with a hollow structure so that its overall density (mass/volume) becomes less than that of water.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, but R is NOT the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is false, but R is true</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is true, but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, and R is the correct explanation of A</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A ship's </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">hollow structure</span><span style=\"font-family:'Cambria Math'\"> displaces a large volume of water, giving the ship a low overall (average) density despite being made of dense iron - directly explaining why it floats, per the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Principle of Flotation</span><span style=\"font-family:'Cambria Math'\"> (Archimedes' Principle).</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">If the same mass of iron were compressed into a solid ball instead, it would sink, since its density would then exceed that of water.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'Both A and R are true, and R is the correct explanation of A'.</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following best describes 'Inflation'?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A decrease in the money supply</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">An increase in exports relative to imports</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A one-time increase in the price of a single good</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A sustained increase in the general price level of goods and services over time</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Inflation</span><span style=\"font-family:'Cambria Math'\"> refers to a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">sustained rise in the general price level</span><span style=\"font-family:'Cambria Math'\"> across the economy over time, reducing the purchasing power of money.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">A one-time price rise in a single good is not inflation by itself; inflation must be a broad, sustained trend across the economy, typically measured using indices like the CPI or WPI.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'A sustained increase in the general price level of goods and services over time'.</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A country's exports are worth $500 billion and imports are worth $600 billion in a given year. Which of the following correctly describes its trade position?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Trade deficit of $100 billion</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Balanced trade</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Trade surplus of $100 billion</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Trade surplus of $500 billion</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Since </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">imports ($600 billion) exceed exports ($500 billion)</span><span style=\"font-family:'Cambria Math'\">, the country has a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">trade deficit of $100 billion</span><span style=\"font-family:'Cambria Math'\"> (Imports - Exports = $600bn - $500bn = $100bn).</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">A trade deficit means the country is spending more on foreign goods/services than it earns from selling abroad, which must be financed through borrowing, foreign investment inflows, or drawing down reserves.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'Trade deficit of $100 billion'.</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The female labour force participation rate (LFPR) for persons aged 15+ in October 2025 reached approximately:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">33.2%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">34%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">34.2%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">38.2%</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">LFPR (Labour Force Participation Rate)</span><span style=\"font-family:'Cambria Math'\"> refers to the percentage of people who are either:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-top:14pt;margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Employed</span><span style=\"font-size:12pt;font-family:'Cambria Math'\">, or </span></li><li style=\"margin-left:27.6pt;margin-bottom:14pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Unemployed but actively looking for work</span><span style=\"font-size:12pt;font-family:'Cambria Math'\"> </span></li></ul><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It is calculated as:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784206487996_image001.png\" width=\"364\" height=\"48\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">For women aged </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">15 years and above</span><span style=\"font-family:'Cambria Math'\">, the LFPR in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">October 2025</span><span style=\"font-family:'Cambria Math'\"> was approximately </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">34.2%</span><span style=\"font-family:'Cambria Math'\">, according to the monthly Periodic Labour Force Survey (PLFS) data.</span></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">This means that out of every </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">100 women aged 15 years or above</span><span style=\"font-family:'Cambria Math'\">, about </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">34 women were participating in the labour market</span><span style=\"font-family:'Cambria Math'\">, either by working or actively seeking work.</span></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Therefore:</span></p><p style=\"margin-top:14pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: 34.2%</span></p><p style=\"margin-top:14pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Important:</span><span style=\"font-family:'Cambria Math'\"> LFPR does not represent only employed persons. It includes both employed persons and unemployed persons who are actively seeking work. The PLFS is conducted by the Ministry of Statistics and Programme Implementation (MoSPI)</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Match the following Indian rivers with the sea/gulf they ultimately drain into:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A. Narmada - 1. Arabian Sea (Gulf of Khambhat)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">B. Godavari - 2. Bay of Bengal</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">C. Indus - 3. Arabian Sea</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">D. Mahanadi - 4. Bay of Bengal</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following combinations is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-4, B-3, C-2, D-1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-2, B-1, C-4, D-3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-3, B-4, C-1, D-2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-1, B-2, C-3, D-4</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Narmada</span><span style=\"font-family:'Cambria Math'\"> flows west into the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Arabian Sea (Gulf of Khambhat)</span><span style=\"font-family:'Cambria Math'\">; </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Godavari</span><span style=\"font-family:'Cambria Math'\"> flows east into the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bay of Bengal</span><span style=\"font-family:'Cambria Math'\">; </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Indus</span><span style=\"font-family:'Cambria Math'\"> flows south into the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Arabian Sea</span><span style=\"font-family:'Cambria Math'\"> (in Pakistan); and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Mahanadi</span><span style=\"font-family:'Cambria Math'\"> flows east into the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bay of Bengal</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">Most major Indian rivers flow eastward due to the general slope of the peninsula; Narmada, Tapi and the Indus system are notable westward-flowing exceptions.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct combination is A-1, B-2, C-3, D-4.</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Indian port situated at the entrance of the Zuari estuary gained significance after remodelling in 1961 to handle iron-ore exports to Japan?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Marmagao Port</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kandla Port</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Jawaharlal Nehru Port</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">New Mangalore Port</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Marmagao Port</span><span style=\"font-family:'Cambria Math'\"> (also written as </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Mormugao Port</span><span style=\"font-family:'Cambria Math'\">) is located in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Goa</span><span style=\"font-family:'Cambria Math'\"> at the entrance of the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Zuari River estuary</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">An </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">estuary</span><span style=\"font-family:'Cambria Math'\"> is the place where a river meets the sea. Because Mormugao Port is situated near the mouth of the Zuari River and has a good natural harbour, it became suitable for handling large ships.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">After its remodelling in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1961</span><span style=\"font-family:'Cambria Math'\">, the port gained importance mainly for the export of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">iron ore</span><span style=\"font-family:'Cambria Math'\">. Large quantities of iron ore from Goa were transported through this port to countries such as </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Japan</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Therefore:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784206487996_image002.png\" width=\"397\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Marmagao Port</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why the other options are incorrect:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kandla Port:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Located in Gujarat, not at the Zuari estuary. </span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Jawaharlal Nehru Port:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Located near Mumbai and mainly handles containers. </span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">New Mangalore Port:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> Located in Karnataka, not in Goa.</span></li></ul>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is the correct term for a narrow strip of land connecting two larger landmasses?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Archipelago</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Isthmus</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Plateau</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Peninsula</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">An </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Isthmus</span><span style=\"font-family:'Cambria Math'\"> is a narrow strip of land connecting two larger landmasses, with water on either side - for example, the Isthmus of Panama connects North and South America.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">A Peninsula, by contrast, is land surrounded by water on three sides but still connected to a mainland, while an Archipelago is a group/chain of islands.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is Isthmus.</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A river valley in India is described as being formed by a rift/fault rather than by normal erosional processes, running through a straight, trough-like course between the Vindhya and Satpura ranges. Which river does this describe?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Narmada</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kaveri</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Krishna</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Godavari</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Narmada</span><span style=\"font-family:'Cambria Math'\"> flows through a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">rift valley</span><span style=\"font-family:'Cambria Math'\"> (a geological trough formed by faulting, not simple erosion), running between the Vindhya Range to its north and the Satpura Range to its south - giving it an unusually straight east-west course compared to most peninsular rivers.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">This rift-valley origin also explains why the Narmada (like the Tapi) flows westward into the Arabian Sea, unlike most other peninsular rivers.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is Narmada.</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Indian state shares its border with the maximum number of neighbouring countries?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rajasthan</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Punjab</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">West Bengal</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Gujarat</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">West Bengal</span><span style=\"font-family:'Cambria Math'\"> shares borders with the maximum number of neighbouring countries among Indian states - Bangladesh, Nepal and Bhutan - giving it unmatched international border diversity.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">This makes West Bengal strategically significant for India's border management and cross-border trade, especially through the narrow Siliguri Corridor ('Chicken's Neck').</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is West Bengal.</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following rivers helps define a portion of the India–Bangladesh border?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ganga</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mahanadi</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Narmada</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Brahmaputra</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Ganga River</span><span style=\"font-family:'Cambria Math'\"> helps define a portion of the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">India–Bangladesh border</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Ganga flows eastward through India and reaches the India–Bangladesh region. After entering Bangladesh, the river is commonly known as the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Padma</span><span style=\"font-family:'Cambria Math'\">. </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Along a part of its course near the border, the river forms or follows a section of the international boundary between India and Bangladesh. India and Bangladesh also share many transboundary rivers, and the Ganga is one of the most important among them. </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Therefore:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784206487996_image003.png\" width=\"244\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Ganga</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Match the following ancient Indian rulers with the dynasty/period they belonged to:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A. Pushyamitra Shunga - 1. Shunga dynasty</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">B. Kanishka - 2. Kushan dynasty</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">C. Harshavardhana - 3. Pushyabhuti dynasty</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">D. Skandagupta - 4. Gupta dynasty</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following combinations is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-2, B-1, C-4, D-3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-1, B-2, C-3, D-4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-4, B-3, C-2, D-1</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-3, B-4, C-1, D-2</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Pushyamitra Shunga</span><span style=\"font-family:'Cambria Math'\"> founded the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Shunga dynasty</span><span style=\"font-family:'Cambria Math'\"> after overthrowing the last Maurya ruler; </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kanishka</span><span style=\"font-family:'Cambria Math'\"> belonged to the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kushan dynasty</span><span style=\"font-family:'Cambria Math'\">; </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Harshavardhana</span><span style=\"font-family:'Cambria Math'\"> belonged to the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Pushyabhuti (Vardhana) dynasty</span><span style=\"font-family:'Cambria Math'\">; and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Skandagupta</span><span style=\"font-family:'Cambria Math'\"> was a ruler of the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Gupta dynasty</span><span style=\"font-family:'Cambria Math'\">, notable for repelling Huna invasions.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct combination is A-1, B-2, C-3, D-4.</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Ajanta Caves', renowned for their ancient Buddhist mural paintings and rock-cut architecture, primarily reflect patronage during which broad period?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mughal period</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Chola period</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Maurya period only</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Satavahana and Vakataka periods</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Ajanta Caves</span><span style=\"font-family:'Cambria Math'\"> were constructed in two main phases, reflecting patronage largely from the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Satavahana and later Vakataka</span><span style=\"font-family:'Cambria Math'\"> periods, spanning roughly the 2nd century BCE to the 6th century CE.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">The caves remained hidden and forgotten for centuries before being rediscovered by a British officer in 1819, and are now a UNESCO World Heritage Site renowned for their exceptional mural paintings.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is Satavahana and Vakataka periods.</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following temple complexes is known for its 24-metre-high vimana and stone image of Shiva?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Airavatesvara Temple</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mahabodhi Temple</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kandariya Mahadeva Temple</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Gangaikondacholisvaram</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Airavatesvara Temple</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Airavatesvara Temple complex</span><span style=\"font-family:'Cambria Math'\"> is located at </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Darasuram in Tamil Nadu</span><span style=\"font-family:'Cambria Math'\">. It was built by the Chola ruler </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Rajaraja II</span><span style=\"font-family:'Cambria Math'\"> in the 12th century. The temple is famous for its beautiful Chola architecture, detailed stone carvings, and sculptures.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Its </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">vimana</span><span style=\"font-family:'Cambria Math'\">, meaning the tower built above the main sanctum, is about </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">24 metres high</span><span style=\"font-family:'Cambria Math'\">. The temple complex also contains a notable </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">stone image of Lord Shiva</span><span style=\"font-family:'Cambria Math'\">.</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements about the Indian Councils Act, 1909 (Morley-Minto Reforms):</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. It introduced separate electorates for Muslims.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. It granted full responsible government to India.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the statements given above is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither I nor II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both I and II</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement I is correct</span><span style=\"font-family:'Cambria Math'\"> - the Act introduced </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">separate electorates for Muslims</span><span style=\"font-family:'Cambria Math'\">, a move that later fuelled communal politics in colonial India.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement II is incorrect</span><span style=\"font-family:'Cambria Math'\"> - the Act only expanded legislative councils and increased Indian representation to a limited extent; it did </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">not</span><span style=\"font-family:'Cambria Math'\"> grant full responsible/self-government, which came only through much later reforms.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">This Act is often called the first step towards communal representation in Indian legislative history, a legacy that had far-reaching consequences.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'Only I'.</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In which year was the first \"Sanskrit Commission\" constituted?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2019</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1956</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1952</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2014</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">first Sanskrit Commission</span><span style=\"font-family:'Cambria Math'\"> was constituted by the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Government of India in 1956</span><span style=\"font-family:'Cambria Math'\">. It was formed to examine the condition of Sanskrit education in India and recommend measures for its development and promotion. The Commission was headed by the renowned linguist and scholar </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Dr. Suniti Kumar Chatterji</span><span style=\"font-family:'Cambria Math'\">. </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Commission submitted its report during </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1956–57</span><span style=\"font-family:'Cambria Math'\">, which is why it is also commonly referred to as the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sanskrit Commission (1956–57)</span><span style=\"font-family:'Cambria Math'\">. </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: 1956</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following correctly explains the primary reason the Congress ultimately accepted Dominion Status only as a transitional demand at the Calcutta Session (1928), rather than immediately demanding full independence?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">To give the British Government a final opportunity to grant self-government through the Nehru Report's proposals before escalating the movement</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Because the British had already promised full independence</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Because the Congress believed India was not yet economically ready for independence</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Because Gandhi personally opposed full independence at that time</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">At the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Calcutta Session (1928)</span><span style=\"font-family:'Cambria Math'\">, based on the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Nehru Report</span><span style=\"font-family:'Cambria Math'\">, Congress offered the British a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">one-year ultimatum</span><span style=\"font-family:'Cambria Math'\"> to grant Dominion Status, intending it as a final, moderate opportunity before escalating to a full independence movement if rejected - which indeed happened, leading to the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Purna Swaraj</span><span style=\"font-family:'Cambria Math'\"> resolution at Lahore in 1929.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'To give the British Government a final opportunity to grant self-government through the Nehru Report's proposals before escalating the movement'.</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following correctly describes the term 'Coalition Dharma', often used in Indian political discourse?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The practice of accommodating and balancing the interests of multiple allied parties in a coalition government</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A specific religious practice followed by political parties</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A rule mandating equal cabinet seats for all coalition partners</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A constitutional provision governing coalitions</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">'Coalition Dharma'</span><span style=\"font-family:'Cambria Math'\"> refers to the informal political practice of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">accommodating and balancing the interests</span><span style=\"font-family:'Cambria Math'\"> of multiple allied parties within a coalition government, ensuring stability through negotiation and compromise rather than any binding legal rule.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'The practice of accommodating and balancing the interests of multiple allied parties in a coalition government'.</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Recent reforms changed the composition of the Selection Committee for appointing the Chief Election Commissioner (CEC) and Election Commissioners (ECs). Which of the following is currently NOT a member of this Committee?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Chief Justice of India</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Leader of the Opposition in the Lok Sabha</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Prime Minister</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A Union Cabinet Minister nominated by the Prime Minister</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Under the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Chief Election Commissioner and Other Election Commissioners (Appointment, Conditions of Service and Term of Office) Act, 2023</span><span style=\"font-family:'Cambria Math'\">, the Selection Committee comprises the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Prime Minister, the Leader of Opposition in the Lok Sabha, and a Union Cabinet Minister nominated by the PM</span><span style=\"font-family:'Cambria Math'\"> - the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Chief Justice of India was removed</span><span style=\"font-family:'Cambria Math'\"> from this panel, replacing an earlier Supreme Court-mandated composition.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">This change has been a subject of considerable public and legal debate, with critics arguing it reduces the independence of the selection process for these key constitutional posts.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is The Chief Justice of India.</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In the Balance of Payments, an increase in foreign exchange reserves appears under which category?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Current Account – Debit</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Current Account – Credit</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Capital Account – Debit</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Capital Account – Credit</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:14pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">An </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">increase in foreign exchange reserves</span><span style=\"font-family:'Cambria Math'\"> means the central bank is purchasing foreign assets. This represents an </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">outflow of foreign currency</span><span style=\"font-family:'Cambria Math'\">, so it is recorded on the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">debit side of the Capital Account</span><span style=\"font-family:'Cambria Math'\"> (more precisely, the Financial Account in modern classification).</span></p><p style=\"margin-top:14pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Capital Account – Debit</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following Fundamental Duties, added by the 42nd Amendment Act, 1976, relates to protecting and improving the natural environment?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 51A(g)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 51A(j)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 51A(a)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 51A(e)</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Article 51A(g)</span><span style=\"font-family:'Cambria Math'\"> obliges every citizen 'to protect and improve the natural environment including forests, lakes, rivers and wildlife, and to have compassion for living creatures'.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">This duty complements Article 48A (a Directive Principle) which similarly directs the State to protect and improve the environment - together forming a strong constitutional basis for environmental jurisprudence in India.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is Article 51A(g).</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 243ZI of the Indian Constitution empowers the State Legislature to make laws regarding co-operative societies. Which principle is NOT included in its scope?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Democratic member control</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Compulsory State supervision</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Voluntary formation</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Autonomous functioning</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Article 243ZI </span><span style=\"font-family:'Cambria Math'\">allows the State Legislature to make laws regarding the incorporation, regulation, and winding up of co-operative societies. These laws should be based on principles such as:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Voluntary formation</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Democratic member control</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Member economic participation</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Autonomous functioning </span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Compulsory State supervision is not mentioned </span><span style=\"font-family:'Cambria Math'\">as a guiding principle under Article 243ZI. In fact, the article emphasizes the autonomous functioning of co-operative societies rather than compulsory government control.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: Compulsory State supervision</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In Google Docs, when you press Ctrl + S, what technical action occurs in the background?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The keyboard shortcut is not recognized</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The document is saved to local storage</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Save As dialog box appears on screen</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">An immediate sync to Drive is triggered</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Google Docs</span><span style=\"font-family:'Cambria Math'\">, documents are saved automatically to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Google Drive</span><span style=\"font-family:'Cambria Math'\"> while you work. When you press </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Ctrl + S</span><span style=\"font-family:'Cambria Math'\">, Google Docs recognizes it as the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Save command</span><span style=\"font-family:'Cambria Math'\"> and ensures that the latest changes are synchronized with Google Drive. It does </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">not</span><span style=\"font-family:'Cambria Math'\"> open a “Save As” dialog box or save the document to local computer storage. </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: An immediate sync to Drive is triggered</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">When using the search term Invoice* in Windows 11 File Explorer, which files will be found?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Files that end with the word “Invoice</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Files that contain exactly the word “Invoice”</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Files that begin with the word “Invoice”</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Files that have “Invoice” anywhere in the name</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The asterisk * is a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">wildcard character</span><span style=\"font-family:'Cambria Math'\"> that represents </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">zero or more characters</span><span style=\"font-family:'Cambria Math'\">. Therefore, the search term:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784206487996_image004.png\" width=\"57\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">means that the file name should </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">start with “Invoice”</span><span style=\"font-family:'Cambria Math'\">, and any number of characters may come after it. </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Examples of files that may be found:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Invoice.docx </span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Invoice2026.pdf </span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Invoice_July.xlsx </span></li><li style=\"margin-lef
