an></li></ul>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मानक बाइनरी कन्वेंशन (1024-आधारित) का उपयोग करते हुए, 1 टेराबाइट (TB) कितने गीगाबाइट (GB) के बराबर होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2048 GB</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1000 GB</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">100 GB</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1024 GB</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मानक बाइनरी कन्वेंशन (बेस-2) का उपयोग करते हुए, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1 टेराबाइट (TB)</span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1,024 गीगाबाइट (GB)</span><span style=\"font-family:'Nirmala UI'\"> के बराबर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बाइनरी स्टोरेज पदानुक्रम</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कंप्यूटर बाइनरी सिस्टम का उपयोग करते हैं जहाँ प्रत्येक इकाई </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">2¹</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">⁰</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> (1,024)</span><span style=\"font-family:'Nirmala UI'\"> के गुणक से बढ़ती है:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1 किलोबाइट (KB)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> = </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1,024 बाइट्स</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1 मेगाबाइट (MB)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> = </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1,024 किलोबाइट्स</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1 गीगाबाइट (GB)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> = </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1,024 मेगाबाइट्स</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1 टेराबाइट (TB)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> = </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1,024 गीगाबाइट्स</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बाइनरी बनाम दशमलव भ्रम</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विंडोज जैसे ऑपरेटिंग सिस्टम बाइनरी कन्वेंशन का उपयोग करके क्षमता की गणना करते हैं। हालांकि, हार्डवेयर निर्माता अक्सर दशमलव कन्वेंशन (बेस-10) का उपयोग करते हैं, जहाँ </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1 TB</span><span style=\"font-family:'Nirmala UI'\"> को ठीक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1,000 GB</span><span style=\"font-family:'Nirmala UI'\"> के रूप में प्रचारित किया जाता है। यह अंतर ही कारण है कि एक ब्रांडेड </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1 TB</span><span style=\"font-family:'Nirmala UI'\"> हार्ड ड्राइव को कंप्यूटर में प्लग करने पर अक्सर लगभग </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">931 GB</span><span style=\"font-family:'Nirmala UI'\"> प्रयोग करने योग्य स्थान दिखाता है।</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सी नियुक्ति उसके प्रभावी महीने/वर्ष के साथ सही सुमेलित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अजय सेठ IRDAI अध्यक्ष के रूप में - मार्च 2025</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ज्ञानेश कुमार मुख्य चुनाव आयुक्त (CEC) के रूप में - जुलाई 2025</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पूनम गुप्ता RBI डिप्टी गवर्नर के रूप में - जनवरी 2025</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न्यायमूर्ति बी.आर. गवई 52वें CJI के रूप में - मई 2025</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न्यायमूर्ति बी.आर. गवई 52वें CJI के रूप में - मई 2025 सही सुमेलित नियुक्ति है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">न्यायमूर्ति बी.आर. गवई:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">14 मई, 2025</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> को भारत के 52वें मुख्य न्यायाधीश के रूप में शपथ ली।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ज्ञानेश कुमार:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">19 फरवरी, 2025</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> को मुख्य चुनाव आयुक्त (CEC) का पदभार संभाला (जुलाई 2025 के रूप में गलत सूचीबद्ध)।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पूनम गुप्ता:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">2 मई, 2025</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> से प्रभावी RBI डिप्टी गवर्नर के रूप में नियुक्त / अप्रैल/मई 2025 में कार्यभार संभाला (जनवरी 2025 के रूप में गलत सूचीबद्ध)।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अजय सेठ:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">जुलाई 2025</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> में IRDAI अध्यक्ष के रूप में नियुक्त हुए और सितंबर 2025 में कार्यभार संभाला (मार्च 2025 के रूप में गलत सूचीबद्ध, जो तब था जब पिछले अध्यक्ष का कार्यकाल समाप्त हुआ था)।</span></li></ul>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के वैश्विक भुखमरी सूचकांक (GHI) 2025 प्रदर्शन के बारे में निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. भारत 123 देशों में 102वें स्थान पर रहा।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. भारत का GHI स्कोर इसे 'चिंताजनक' (Alarming) श्रेणी में रखता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऊपर दिए गए कथनों में से कौन सा/से सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I और II दोनों</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो I और न ही II</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">केवल कथन I सही है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथनों का स्पष्टीकरण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✔️</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कथन I सही है</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: </span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Nirmala UI'\">\"20 इयर्स ऑफ़ ट्रैकिंग प्रोग्रेस: टाइम टू रिकमिट टू जीरो हंगर\"</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> नामक 2025 ग्लोबल हंगर इंडेक्स (GHI) रिपोर्ट में, </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भारत 123 देशों में 102वें स्थान पर है</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कथन II गलत है</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: भारत ने </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">25.8</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> का GHI स्कोर प्राप्त किया। GHI गंभीरता पैमाने के अनुसार, 20.0 और 34.9 के बीच का स्कोर किसी राष्ट्र को </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">'गंभीर' श्रेणी</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> में रखता है, न कि 'खतरनाक' श्रेणी में। 'खतरनाक' श्रेणी के लिए 35.0 और 49.9 के बीच एक उच्च स्कोर की आवश्यकता होती है।</span></li></ul>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत की नदी प्रणालियों के बारे में निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. नर्मदा और तापी प्रायद्वीपीय भारत की केवल दो प्रमुख नदियाँ हैं जो पश्चिम की ओर बहते हुए अरब सागर में गिरती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. गोदावरी प्रायद्वीपीय भारत की सबसे लंबी नदी है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">III. कावेरी नदी बेसिन केवल कर्नाटक और तमिलनाडु के बीच साझा किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उपरोक्त में से कितने कथन सही हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल दो</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सभी तीनों</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल एक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कोई नहीं</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दिए गए तीन कथनों में से, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">केवल एक</span><span style=\"font-family:'Nirmala UI'\"> कथन सही है (कथन II)।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथनों का विश्लेषण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कथन I गलत है:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> जबकि नर्मदा और तापी प्रायद्वीपीय भारत की दो सबसे बड़ी और सबसे प्रमुख पश्चिम-प्रवाह वाली नदियाँ हैं, वे </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">केवल वही नहीं हैं</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">।</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">  </span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">और</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">  </span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">जैसी अन्य प्रमुख प्रायद्वीपीय नदियाँ भी पश्चिम की ओर बहते हुए अरब सागर में गिरती हैं।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कथन II सही है:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">  </span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">वास्तव में </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">प्रायद्वीपीय भारत की सबसे लंबी नदी</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> है, जो लगभग 1,465 किलोमीटर तक फैली हुई है। इसे अक्सर इसकी विशालता के कारण 'दक्षिण गंगा' कहा जाता है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कथन III गलत है:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">  </span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">केवल कर्नाटक और तमिलनाडु के बीच साझा नहीं किया जाता है। इसका जल निकासी बेसिन तीन राज्यों—</span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कर्नाटक, तमिलनाडु और केरल</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">—के साथ-साथ केंद्र शासित प्रदेश </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पुडुचेरी</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> तक फैला हुआ है।</span></li></ul>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा यूनेस्को विश्व धरोहर स्थल - राज्य युग्म गलत सुमेलित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हम्पी - आंध्र प्रदेश</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">खजुराहो - मध्य प्रदेश</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एलोरा गुफाएँ - महाराष्ट्र</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सूर्य मंदिर, कोणार्क - ओडिशा</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हम्पी - आंध्र प्रदेश</span><span style=\"font-family:'Nirmala UI'\"> गलत सुमेलित युग्म है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही विकल्प का स्पष्टीकरण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">हम्पी</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कर्नाटक</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> में स्थित है, न कि आंध्र प्रदेश में। यह 14वीं शताब्दी के दौरान प्रमुख विजयनगर साम्राज्य की ऐतिहासिक राजधानी के रूप में कार्य करता था और अपनी शानदार द्रविड़-शैली की वास्तुशिल्प खंडहरों के लिए विश्व स्तर पर प्रसिद्ध है।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्पों का स्पष्टीकरण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">सही: </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">खजुराहो - मध्य प्रदेश</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: यह </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सही</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> सुमेलित है। खजुराहो स्मारक समूह मध्य प्रदेश के छतरपुर जिले में स्थित है और यह अपनी नागर-शैली के हिंदू और जैन मंदिरों के लिए विश्व स्तर पर प्रसिद्ध है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">सही: </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">एलोरा गुफाएँ - महाराष्ट्र</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: यह </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सही</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> सुमेलित है। महाराष्ट्र के औरंगाबाद जिले में स्थित ये प्राचीन शैल-उत्कीर्ण गुफाएँ हिंदू, बौद्ध और जैन स्मारकों को एक साथ ल rmala UI'\">जनवरी 2026 में कार्यभार संभालने वाली भारतीय विमानपत्तन प्राधिकरण (AAI) बोर्ड में पहली महिला निदेशक (मानव संसाधन) कौन बनीं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निवेदिता दुबे</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अपर्णा गर्ग</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उषा जानकीरमन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संगीता बरुआ</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निवेदिता दुबे (एएआई) बोर्ड में पहली महिला निदेशक (मानव संसाधन) / सदस्य (मानव संसाधन) बनीं, उन्होंने जनवरी 2026 में कार्यभार संभाला।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पृष्ठभूमि और करियर की मुख्य बातें</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">एएआई में शामिल हुईं:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> उन्होंने 1995 में इंदिरा गांधी अंतर्राष्ट्रीय हवाई अड्डे पर हवाई अड्डा प्रबंधक के रूप में अपना करियर शुरू किया।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पिछली भूमिका:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> 2023 से पहली महिला क्षेत्रीय कार्यकारी निदेशक (पूर्वी क्षेत्र) के रूप में कार्य किया।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">व्यावसायिक योग्यताएँ:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> अंतर्राष्ट्रीय नागरिक उड्डयन संगठन (आईसीएओ) द्वारा अंतर्राष्ट्रीय हवाई अड्डा पेशेवर (आईएपी) के रूप में मान्यता प्राप्त।</span></li></ul>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">'लोकसभा अध्यक्ष' के संबंध में निम्नलिखित में से कौन सा/से कथन सही है/हैं?</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. लोकसभा के विघटन पर अध्यक्ष का पद तुरंत रिक्त हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. अध्यक्ष सदन में केवल टाई (निर्णायक मत) होने की स्थिति में ही मतदान कर सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऊपर दिए गए कथनों में से कौन सा/से सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I और II दोनों</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो I और न ही II</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन II सही है, जबकि कथन I गलत है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">❌</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> कथन I गलत है</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के संविधान के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 94</span><span style=\"font-family:'Nirmala UI'\"> के अनुसार, जब भी लोकसभा भंग होती है, अध्यक्ष अपना पद तुरंत रिक्त </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नहीं</span><span style=\"font-family:'Nirmala UI'\"> करता/करती है। प्रशासनिक निरंतरता सुनिश्चित करने के लिए अध्यक्ष आम चुनावों के बाद नव-निर्वाचित सदन की पहली बैठक से ठीक पहले तक पद पर बना रहता है/रहती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन II सही है</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संविधान के </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 100(1)</span><span style=\"font-family:'Nirmala UI'\"> के तहत, अध्यक्ष सदन में किसी भी मामले पर पहली बार में मतदान नहीं करता/करती है। हालांकि, वोटों के बराबर विभाजन (टाई) की स्थिति में, अध्यक्ष गतिरोध को तोड़ने के लिए एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">निर्णायक मत</span><span style=\"font-family:'Nirmala UI'\"> का प्रयोग करता/करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">(अपवाद: यदि अनुच्छेद 96 के तहत अध्यक्ष को हटाने के प्रस्ताव पर विचार किया जा रहा है, तो वे पहली बार में मतदान कर सकते हैं, लेकिन टाई होने की स्थिति में निर्णायक मत नहीं डाल सकते हैं)।</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के राष्ट्रपति द्वारा सशस्त्र बलों के कर्मियों द्वारा, यहां तक कि शांतिकाल में भी, प्रदर्शित की गई सर्वोच्च वीरता के लिए कौन सा पुरस्कार प्रदान किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अशोक चक्र</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">परम वीर चक्र</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कीर्ति चक्र</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">शौर्य चक्र</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सही उत्तर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अशोक चक्र</span><span style=\"font-family:'Nirmala UI'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विकल्पों की व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🟢</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अशोक चक्र</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: यह भारत का सर्वोच्च शांतिकाल वीरता पुरस्कार है। यह भारत के राष्ट्रपति द्वारा सशस्त्र बलों के कर्मियों, या यहां तक कि नागरिकों को, युद्धक्षेत्र से दूर सबसे विशिष्ट बहादुरी, साहसी कार्य या आत्म-बलिदान के लिए प्रदान किया जाता है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🔴</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">परम वीर चक्र</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: यह भारत का सर्वोच्च सैन्य अलंकरण है, लेकिन यह विशेष रूप से युद्धकाल वीरता (शत्रु की उपस्थिति में असाधारण बहादुरी के कार्य) के लिए प्रदान किया जाता है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🔴</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कीर्ति चक्र</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: यह दूसरा सर्वोच्च शांतिकाल वीरता पुरस्कार है, जो अशोक चक्र से ठीक नीचे है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🔴</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">शौर्य चक्र</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: यह भारत की वरीयता क्रम में तीसरा सर्वोच्च शांतिकाल वीरता पुरस्कार है।</span></li></ul>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक अवतल दर्पण एक वास्तविक, उल्टा प्रतिबिंब बनाता है जो वस्तु के आकार का दोगुना है, और वस्तु को दर्पण से 15 सेमी की दूरी पर रखा गया है। दर्पण की फोकस दूरी क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">10 सेमी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">15 सेमी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">20 सेमी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">7.5 सेमी</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आवर्धन m = -v/u = -2 और u = -15 सेमी का उपयोग करने पर, हमें </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">v = -30 सेमी</span><span style=\"font-family:'Nirmala UI'\"> प्राप्त होता है। दर्पण सूत्र 1/f = 1/v + 1/u = 1/(-30) + 1/(-15) = -3/30 = -1/10 लागू करने पर, हमें </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">f = -10 सेमी</span><span style=\"font-family:'Nirmala UI'\"> (फोकस दूरी का परिमाण = 10 सेमी) प्राप्त होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 10 सेमी है।</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जनगणना 2011 के अनुसार, निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. केरल ने भारतीय राज्यों में सर्वाधिक साक्षरता दर दर्ज की।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. बिहार ने भारतीय राज्यों में सबसे कम साक्षरता दर दर्ज की।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">III. भारत की समग्र साक्षरता दर पहली बार 80% को पार कर गई।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उपरोक्त में से कितने कथन सही हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल दो</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सभी तीन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल एक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कोई नहीं</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उपरोक्त कथनों में से </span><span style ht:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">साक्ष्य</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: बिहार ने सभी भारतीय राज्यों में सबसे कम साक्षरता दर </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">61.80%</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> दर्ज की।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विवरण</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: इसकी पुरुष साक्षरता 71.2% और महिला साक्षरता 51.5% थी।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">🔴</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> कथन III: गलत</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">साक्ष्य</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: भारत की समग्र साक्षरता दर 80% को पार नहीं कर पाई थी। आधिकारिक 2011 के आंकड़ों के अनुसार, राष्ट्रीय औसत साक्षरता दर </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">74.04%</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> थी।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विवरण</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: जबकि पुरुष साक्षरता ने 8 ne-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: यह दक्षिण-पश्चिमी राज्य सीधे </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अरब सागर</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> से सटा हुआ है और इसमें लगभग पूरा </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मालाबार तट</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> शामिल है, जो खारे पानी की झीलों, मुहानों और बैकवाटर के अपने अद्वितीय नेटवर्क के लिए जाना जाने वाला एक भौगोलिक क्षेत्र है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">तमिलनाडु</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: यह राज्य भारत के दक्षिण-पूर्वी सिरे पर स्थित है। इसकी तटरेखा मुख्य रूप से बंगाल की खाड़ी से लगी हुई है और यह कोरोमंडल तट का निर्माण करती है, न कि मालाबार तट का।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">आंध्र प्रदेश</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: भारत के दक्षिण-पूर्वी तट पर स्थित, इसकी लंबी तटरेखा पूरी तरह से बंगाल की खाड़ी के किनारे है, जो उत्तरी सरकार का एक हिस्सा है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ओडिशा</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: उपमहाद्वीप के पूर्वी भाग में स्थित, इसकी तटरेखा विशेष रूप से बंगाल की खाड़ी में खुलती है।</span></li></ul>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सी घटना उसके वर्ष के साथ सही सुमेलित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मुस्लिम लीग का गठन - 1906</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बंगाल का विभाजन - 1911</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जलियांवाला बाग नरसंहार - 1920</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत में साइमन कमीशन का आगमन - 1930</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सही सुमेलित घटना </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुस्लिम लीग का गठन - 1906</span><span style=\"font-family:'Nirmala UI'\"> है, जबकि अन्य विकल्पों में गलत वर्ष दिए गए हैं (बंगाल का विभाजन 1905 में हुआ था, जलियांवाला बाग 1919 में हुआ था, और साइमन कमीशन 1928 में आया था)।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">घटनाओं का विवरण और सही वर्ष</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मुस्लिम लीग का गठन</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: 30 दिसंबर, 1906 (सही)</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बंगाल का विभाजन</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: जुलाई 1905 / अक्टूबर 1905 (गलत तरीके से 1911 के रूप में सूचीबद्ध)</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">जलियांवाला बाग नरसंहार</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: 13 अप्रैल, 1919 (गलत तरीके से 1920 के रूप में सूचीबद्ध)</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">भारत में साइमन कमीशन का आगमन</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: 3 फरवरी, 1928 (गलत तरीके से 1930 के रूप में सूचीबद्ध)</span></li></ul>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सी शक्ति राज्यसभा को प्राप्त </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नहीं</span><span style=\"font-family:'Nirmala UI'\"> है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राष्ट्रपति के महाभियोग में भाग लेना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सरकार के विरुद्ध अविश्वास प्रस्ताव पारित करना</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक संवैधानिक संशोधन विधेयक का अनुसमर्थन करना</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उपराष्ट्रपति का चुनाव करना (निर्वाचक मंडल के हिस्से के रूप में)</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सही विकल्प है: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सरकार के विरुद्ध अविश्वास प्रस्ताव पारित करना</span><span style=\"font-family:'Nirmala UI'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विस्तृत व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अविश्वास प्रस्ताव पारित करना:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> यह शक्ति राज्यसभा को </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">प्राप्त नहीं</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> है। भारतीय संविधान के </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 75(3)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> के तहत, मंत्रिपरिषद सामूहिक रूप से </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">केवल लोकसभा के प्रति</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> उत्तरदायी होती है। इसलिए, एक अविश्वास प्रस्ताव केवल लोकसभा में पेश और पारित किया जा सकता है। यदि यह वहाँ पारित हो जाता है, तो सरकार गिर जाती है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राष्ट्रपति के महाभियोग में भाग लेना:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> राज्यसभा को यह शक्ति </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">प्राप्त है</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">। </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 61</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> के अनुसार, लोकसभा और राज्यसभा दोनों के निर्वाचित सदस्य राष्ट्रपति के महाभियोग की प्रक्रिया में भाग लेते हैं।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">एक संवैधानिक संशोधन विधेयक का अनुसमर्थन करना:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> राज्यसभा को यह शक्ति </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">प्राप्त है</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">। </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 368</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> के तहत, एक संवैधानिक संशोधन विधेयक को संसद के दोनों सदनों (लोकसभा और राज्यसभा) द्वारा अलग-अलग विशेष बहुमत से पारित किया जाना चाहिए।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उपराष्ट्रपति का चुनाव करना:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> राज्यसभा को यह शक्ति </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">प्राप्त है</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">। उपराष्ट्रपति का चुनाव एक निर्वाचक मंडल द्वारा किया जाता है जिसमें </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 66</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> के तहत संसद के </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">दोनों</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> सदनों (लोकसभा और राज्यसभा) के सदस्य शामिल होते हैं।</span></li></ul>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन मेमोरी पदानुक्रम को सबसे तेज़ (FASTEST) से सबसे धीमे (SLOWEST) एक्सेस गति तक सही ढंग से सूचीबद्ध करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रजिस्टर - कैश - रैम - हार्ड डिस्क</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रैम - कैश - रजिस्टर - हार्ड डिस्क</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हार्ड डिस्क - रैम - कैश - रजिस्टर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कैश - रजिस्टर - रैम - हार्ड डिस्क</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सही उत्तर विकल्प है: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रजिस्टर - कैश - रैम - हार्ड डिस्क</span><span style=\"font-family:'Nirmala UI'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">यह विकल्प क्यों सही है:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">रजिस्टर</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: ये सीधे सीपीयू के अंदर स्थित होते हैं। वे प्रोसेसर की गति से ही कार्य करते हैं, जिससे डेटा तक सबसे </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">तेज़</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> पहुँच मिलती है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कैश</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: सीपीयू डाई के बहुत करीब या उस पर स्थित होता है। यह अक्सर उपयोग किए जाने वाले डेटा को अस्थायी रूप से रखने के लिए उच्च गति वाले स्टैटिक रैम (SRAM) का उपयोग करता है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">रैम (मुख्य मेमोरी)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: सीपीयू के बाहर मदरबोर्ड पर स्थित होता है। यह डायनेमिक रैम (DRAM) का उपयोग करता है, जो इसे कैश मेमोरी से धीमा लेकिन स्थायी स्टोरेज से कहीं अधिक तेज़ बनाता है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">हार्ड डिस्क</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: यह एक सेकेंडरी स्टोरेज डिवाइस है। यह यांत्रिक घटकों या बाहरी इंटरफेस पर निर्भर करता है, जिससे यह इस क्रम में सबसे </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">धीमी</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> परत बन जाता है।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अन्य विकल्प क्यों गलत हैं:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">रैम - कैश - रजिस्टर - हार्ड डिस्क</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: रैम को कैश और रजिस्टर से तेज़ दिखाना गलत है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">हार्ड डिस्क - रैम - कैश - रजिस्टर</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: यह पदानुक्रम को पूरी तरह से उलट देता है, स्टोरेज घटकों को सबसे धीमे से सबसे तेज़ क्रम में सूचीबद्ध करता है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कैश - रजिस्टर - रैम - हार्ड डिस्क</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: यह गलत दावा करता है कि कैश सीपीयू रजिस्टरों से तेज़ है।</span></li></ul>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सी समसामयिक घटना कालानुक्रमिक क्रम में सबसे पहले हुई?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक्सियोम मिशन-4 (Ax-4) लॉन्च</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रियो डी जनेरियो में 17वां ब्रिक्स शिखर सम्मेलन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तियानजिन में 25वां एससीओ शिखर सम्मेलन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">विजय हजारे ट्रॉफी 2025-26 फाइनल</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सही विकल्प है: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">एक्सियोम मिशन-4 (Ax-4) लॉन्च</span><span style=\"font-family:'Nirmala UI'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विस्तृत स्पष्टीकरण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">एक्सियोम मिशन-4 (Ax-4) लॉन्च:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> दिए गए विकल्पों में से यह </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सबसे पहले</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> हुआ, जिसे </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">25 जून, 2025</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> को लॉन्च किया गया था।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">तियानजिन में 25वां एससीओ शिखर सम्मेलन:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> यह </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">31 अगस्त से 1 सितंबर, 2025</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> तक हुआ था।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विजय हजारे ट्रॉफी 2025-26 फाइनल:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> यह टूर्नामेंट </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">18 जनवरी, 2026</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> को फाइनल मैच के साथ समाप्त हुआ।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">रियो डी जनेरियो में 17वां ब्रिक्स शिखर सम्मेलन:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> यह </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">जुलाई 2026</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> में आयोजित किया गया था।</span></li></ul>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अभिकथन (A): भारत के मंगल ऑर्बिटर मिशन (मंगलयान) को अंतरिक्ष अन्वेषण में एक ऐतिहासिक उपलब्धि माना जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कारण (R): इसने भारत को दुनिया का पहला ऐसा राष्ट्र बना दिया जिसने अपने पहले ही प्रयास में सफलतापूर्वक मंगल की कक्षा में प्रवेश किया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सत्य हैं, और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सत्य हैं, लेकिन R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A सत्य है, लेकिन R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A असत्य है, लेकिन R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अभिकथन (A) और कारण (R) दोनों सही हैं, और कारण (R) अभिकथन (A) की सही व्याख्या है।</span><span style=\"font-family:'Nirmala UI'\"> </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🟢</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अभिकथन (A) सही है</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: भारतीय अंतरिक्ष अनुसंधान संगठन (ISRO) द्वारा लॉन्च किया गया मार्स ऑर्बिटर मिशन (मंगलयान) को सार्वभौमिक रूप से एक ऐतिहासिक मील का पत्थर माना जाता है। इसने अभूतपूर्व तकनीकी क्षमताओं और उच्च लागत-दक्षता का प्रदर्शन किया।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🟢</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कारण (R) सही है</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: भारत ने अपने </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पहले ही प्रयास</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> में सफलतापूर्वक एक अंतरिक्ष यान को मंगल की कक्षा में स्थापित करने वाला </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विश्व का पहला राष्ट्र</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> बनकर इतिहास रचा। इससे पहले, अन्य वैश्विक अंतरिक्ष कार्यक्रमों को इस उपलब्धि को हासिल करने के लिए कई प्रयासों की आवश्यकता पड़ी थी।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🤝</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सही व्याख्या</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: मंगलयान को अंतरिक्ष अन्वेषण में एक ऐतिहासिक वैश्विक उपलब्धि के रूप में देखे जाने का मुख्य कारण यह है कि भारत ने अपने पहले ही प्रयास में सफलता प्राप्त की। यह एक ऐतिहासिक इंजीनियरिंग उपलब्धि थी जिसे पहले किसी अन्य देश द्वारा हासिल नहीं किया गया था।</span></li></ul>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संसद के दोनों सदनों द्वारा पारित होने के बाद, विधेयक को अधिनियम बनने के लिए जिन चरणों से गुजरना पड़ता है, उनका सही क्रम निम्नलिखित में से कौन सा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राष्ट्रपति की स्वीकृति - आधिकारिक राजपत्र में प्रकाशन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आधिकारिक राजपत्र में प्रकाशन - राष्ट्रपति की स्वीकृति</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न्यायिक समीक्षा - राष्ट्रपति की स्वीकृति</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">राष्ट्रपति की स्वीकृति - न्यायिक समीक्षा</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सही उत्तर विकल्प है </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राष्ट्रपति की स्वीकृति - आधिकारिक राजपत्र में प्रकाशन</span><span style=\"font-family:'Nirmala UI'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही विकल्प की व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राष्ट्रपति की स्वीकृति - आधिकारिक राजपत्र में प्रकाशन</span><br><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">एक बार जब संसद के दोनों सदनों (लोकसभा और राज्यसभा) द्वारा एक विधेयक पारित हो जाता है, तो उसे राष्ट्रपति की स्वीकृति के लिए भेजा जाता है। संविधान के अनुच्छेद 111 के तहत, जिस क्षण राष्ट्रपति अपनी औपचारिक </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राष्ट्रपति की स्वीकृति</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> प्रदान करते हैं, विधेयक आधिकारिक तौर पर एक </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अधिनियम</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> में बदल जाता है। इस स्वीकृति के बाद, अधिनियम को सरकार के </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">आधिकारिक राजपत्र</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> में प्रकाशित किया जाता है ताकि जनता को इसके अधिनियमन और इसके प्रारंभ होने की तारीख के बारे में कानूनी रूप से सूचित किया जा सके।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गलत विकल्पों की व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">आधिकारिक राजपत्र में प्रकाशन - राष्ट्रपति की स्वीकृति</span><br><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">यह क्रम उल्टा है। एक विधेयक को आधिकारिक तौर पर राजपत्र में एक सक्रिय कानून के रूप में तब तक प्रकाशित नहीं किया जा सकता जब तक उसे पहले राष्ट्रपति के औपचारिक हस्ताक्षर और स्वीकृति प्राप्त न हो जाए।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">न्यायिक समीक्षा - राष्ट्रपति की स्वीकृति</span><br><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">न्यायिक समीक्षा एक स्वचालित या अनिवार्य विधायी चरण नहीं है जिससे एक विधेयक को अधिनियम बनने के लिए गुजरना पड़ता है। न्यायपालिका किसी कानून की समीक्षा तभी करती है जब उसके अधिनियमित होने के बाद उसकी संवैधानिक वैधता को औपचारिक रूप से अदालत में चुनौती दी जाती है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">राष्ट्रपति की स्वीकृति - न्यायिक समीक्षा</span><br><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">जबकि न्यायिक समीक्षा एक विधेयक के कानून बनने के बाद होती है, यह एक विधेयक को अधिनियम में बदलने के लिए आवश्यक मानक विधायी अनुक्रम का हिस्सा नहीं है। राष्ट्रपति की स्वीकृति और राजपत्र अधिसूचना के तुरंत बाद एक कानून प्रभावी हो जाता है, भले ही उसकी न्यायिक समीक्षा हो या न हो।</span></li></ul>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">संयुक्त राष्ट्र एजेंसी मुख्यालयों के संबंध में निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. WHO और ILO दोनों का मुख्यालय जिनेवा में है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. यूनेस्को का मुख्यालय पेरिस में है, जबकि यूनिसेफ का मुख्यालय न्यूयॉर्क में है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऊपर दिए गए कथनों में से कौन सा/से सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I और II दोनों</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो I और न ही II</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कथन I और II दोनों सही हैं, जिसका अर्थ है कि WHO, ILO, यूनेस्को और यूनिसेफ अपने संबंधित सूचीबद्ध शहरों में स्थित हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुख्यालयों का विवरण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कथन I</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: WHO (विश्व स्वास्थ्य संगठन) और ILO (अंतर्राष्ट्रीय श्रम संगठन) स्विट्जरलैंड के जिनेवा में स्थित हैं।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कथन II</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: यूनेस्को (संयुक्त राष्ट्र शैक्षिक, वैज्ञानिक और सांस्कृतिक संगठन) फ्रांस के पेरिस में स्थित है, और यूनिसेफ (संयुक्त राष्ट्र बाल कोष) संयुक्त राज्य अमेरिका के न्यूयॉर्क में स्थित है।</span></li></ul>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अभिकथन (A): ध्वनि निर्वात में यात्रा नहीं कर सकती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कारण (R): ध्वनि एक अनुदैर्ध्य यांत्रिक तरंग है जिसे संचरण के लिए एक भौतिक माध्यम (ठोस, तरल या गैस) की आवश्यकता होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सत्य हैं, और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सत्य हैं, लेकिन R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A सत्य है, लेकिन R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A असत्य है, लेकिन R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अभिकथन (A) और कारण (R) दोनों सत्य हैं, और कारण (R), अभिकथन (A) की सही व्याख्या है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt; t\"><span style=\"font-family:'Nirmala UI'\">I. इसमें ब्रिटिश प्रांतों और रियासतों दोनों को मिलाकर एक अखिल भारतीय संघ का प्रस्ताव था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. अधिनियम का संघीय भाग कभी लागू नहीं हुआ क्योंकि अपर्याप्त संख्या में रियासतों ने इसमें शामिल होने से इनकार कर दिया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऊपर दिए गए कथनों में से कौन सा/से सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I और II दोनों</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो I और न ही II</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन I और II दोनों सही हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Statement I is correct</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> (</span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🟢</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">): The &amp;nbsp;&amp;nbsp;envisioned an All-India Federation comprised of eleven British provinces, six Chief Commissioner's provinces, and those princely states that voluntarily chose to accede. </span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कथन II सही है</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> (</span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🟢</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">): इस संघ की स्थापना रियासतों के एक विशिष्ट कोटे के इसमें शामिल होने पर सख्ती से सशर्त थी। विशेष रूप से, कम से कम आधी कुल रियासती आबादी का प्रतिनिधित्व करने वाले और प्रस्तावित राज्य परिषद में कम से कम 52 सीटें रखने वाले राज्यों को परिग्रहण के दस्तावेजों पर हस्ताक्षर करना था। चूंकि आवश्यक संख्या में शासकों ने अपनी स्वायत्तता छोड़ने से इनकार कर दिया, इसलिए यह शर्त कभी पूरी नहीं हुई, और अधिनियम की संघीय संरचना को पूरी तरह से रोक दिया गया।</span></li></ul>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">'दल-बदल विरोधी कानून' के बारे में निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. यह संसद के दोनों सदनों और राज्य विधानमंडलों पर लागू होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. एक नामांकित सदस्य जो अपनी सीट ग्रहण करने के छह महीने के भीतर किसी राजनीतिक दल में शामिल होता है, उसे दल-बदल के लिए अयोग्य नहीं ठहराया जाता है
