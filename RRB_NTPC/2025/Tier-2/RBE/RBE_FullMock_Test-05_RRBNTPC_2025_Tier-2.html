<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>10.) RRB NTPC (UG) 2025-26 CBT-2 Paid Mock 5 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

ं है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कथन I और II दोनों एक साथ प्रश्न का उत्तर देने के लिए पर्याप्त नहीं हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कथन I और II दोनों एक साथ (और केवल कथन I या केवल कथन II नहीं) प्रश्न का उत्तर देने के लिए पर्याप्त हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल कथन II में दिया गया डेटा प्रश्न का उत्तर देने के लिए पर्याप्त है जबकि कथन I में दिया गया डेटा पर्याप्त नहीं है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कथन I से:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रतीक &gt; मोहित &gt; अर्जुन, कुणाल</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सौरव की ऊँचाई अज्ञात है। इसलिए, केवल कथन I पर्याप्त नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कथन II से:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रतीक &gt; सौरव &gt; मोहित</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अर्जुन और कुणाल की ऊँचाई अज्ञात है। इसलिए, केवल कथन II पर्याप्त नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दोनों कथनों का प्रयोग करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रतीक &gt; सौरव &gt; मोहित &gt; अर्जुन, कुणाल</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसलिए, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रतीक सबसे लंबा है</span><span style=\"font-family:'Nirmala UI'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: C) कथन I और II दोनों एक साथ पर्याप्त हैं।</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">यह प्रश्न नीचे दिए गए पाँच, तीन अंकों की संख्याओं पर आधारित है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">(बाएँ) 467 975 573 489 947 (दाएँ)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">(उदाहरण- 697 – पहला अंक = 6, दूसरा अंक = 9 और तीसरा अंक = 7)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ध्यान दें - सभी संक्रियाएँ बाएँ से दाएँ की जानी हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यदि सबसे बड़ी संख्या के दूसरे अंक को सबसे छोटी संख्या के तीसरे अंक में जोड़ा जाए तो परिणाम क्या होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">13</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">14</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">15</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">16</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सबसे बड़ी संख्या = 975</span><br><span style=\"font-family:'Nirmala UI'\">975 का दूसरा अंक = 7</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सबसे छोटी संख्या = 467</span><br><span style=\"font-family:'Nirmala UI'\">467 का तीसरा अंक = 7</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वांछित परिणाम = 7 + 7 = 14</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: 14</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक निश्चित कोड भाषा में, GTSU को LYXZ और BRKP को GWPU के रूप में लिखा जाता है। उसी भाषा में ALMO को कैसे लिखा जाएगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">FGST</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">GGRT</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">FQRT</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">GFRT</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">BRKP </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> GWPU</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रत्येक अक्षर को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">5 स्थान आगे</span><span style=\"font-family:'Nirmala UI'\"> बढ़ाया जाता है:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">B + 5 = G</span><br><span style=\"font-family:'Nirmala UI'\">R + 5 = W</span><br><span style=\"font-family:'Nirmala UI'\">K + 5 = P</span><br><span style=\"font-family:'Nirmala UI'\">P + 5 = U</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसी तर्क को लागू करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A + 5 = F</span><br><span style=\"font-family:'Nirmala UI'\">L + 5 = Q</span><br><span style=\"font-family:'Nirmala UI'\">M + 5 = R</span><br><span style=\"font-family:'Nirmala UI'\">O + 5 = T</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसलिए:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ALMO </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> FQRT</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'  "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">GI–JL</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">MO–PR</span><br><span style=\"font-family:'Nirmala UI'\"> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">JL–MO</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">तर्क:</span><span style=\"font-family:'Nirmala UI'\"> तीन युग्मों में, प्रत्येक अक्षर को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">3 स्थान आगे</span><span style=\"font-family:'Nirmala UI'\"> बढ़ाया गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">GI </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> JL</span><br><span style=\"font-family:'Nirmala UI'\">G + 3 = J</span><br><span style=\"font-family:'Nirmala UI'\">I + 3 = L</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">MO </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> PR</span><br><span style=\"font-family:'Nirmala UI'\">M + 3 = P</span><br><span style=\"font-family:'Nirmala UI'\">O + 3 = R</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">JL </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> MO</span><br><span style=\"font-family:'Nirmala UI'\">J + 3 = M</span><br><span style=\"font-family:'Nirmala UI'\">L + 3 = O</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लेकिन:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">BD </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> FH</span><br><span style=\"font-family:'Nirmala UI'\">B + 4 = F</span><br><span style=\"font-family:'Nirmala UI'\">D + 4 = H</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इसलिए, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">BD–FH</span><span style=\"font-family:'Nirmala UI'\"> समान पैटर्न का पालन नहीं करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उत्तर: A) BD–FH</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">शब्द PERBLAD में प्रत्येक स्वर को अंग्रेजी वर्णमाला क्रम में उसके तुरंत बाद आने वाले अक्षर में बदल दिया जाता है, और प्रत्येक व्यंजन को अंग्रेजी वर्णमाला क्रम में उसके तुरंत पहले आने वाले अक्षर में बदल दिया जाता है। इस प्रकार अक्षरों के नए समूह में कितने अक्षर ठीक दो बार दिखाई देंगे?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दो </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तीन </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">श :12pt\"><span style=\"font-family:'Nirmala UI'\">महानदी - बंगाल की खाड़ी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नर्मदा नदी - अरब सागर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तापी नदी - बंगाल की खाड़ी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कृष्णा नदी - बंगाल की खाड़ी</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गलत सुमेलित युग्म </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">तापी नदी - बंगाल की खाड़ी</span><span style=\"font-family:'Nirmala UI'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">तापी नदी - बंगाल की खाड़ी</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: यह युग्म गलत सुमेलित है। तापी (या ताप्ती) मध्य भारत की एक प्रमुख पश्चिम-प्रवाहित नदी है। यह मध्य प्रदेश की सतपुड़ा श्रेणी से निकलती है और महाराष्ट्र तथा गुजरात से होकर पश्चिम की ओर बहती है, खंभात की खाड़ी के माध्यम से </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अरब सागर</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> में गिरती है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">नर्मदा नदी - अरब सागर</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: यह युग्म सही सुमेलित है। तापी के समानांतर, नर्मदा प्रायद्वीपीय भारत की सबसे बड़ी पश्चिम-प्रवाहित नदी है। यह अमरकंटक पठार से निकलती है और </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अरब सागर</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> में गिरती है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">महानदी - बंगाल की खाड़ी</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: यह युग्म सही सुमेलित है। महानदी एक पूर्व-प्रवाहित नदी है जो छत्तीसगढ़ के उच्चभूमि से निकलती है, ओडिशा से होकर बहती है और </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बंगाल की खाड़ी</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> में गिरती है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कृष्णा नदी - बंगाल की खाड़ी</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: यह युग्म सही सुमेलित है। कृष्णा नदी महाबलेश्वर के पास पश्चिमी घाट से निकलती है और दक्षिणी भारत में पूर्व की ओर बहते हुए </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">बंगाल की खाड़ी</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> में गिरती है।</span></li></ul>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दक्षिण भारत में संगम युग के बारे में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. संगम साहित्य मुख्य रूप से तमिल भाषा में रचा गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. संगम युग के तीन प्रमुख राजवंश चेर, चोल और पांड्य थे।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उपर्युक्त कथनों में से कौन-सा/से सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I और II दोनों</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो I और न ही II</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन I और कथन II दोनों सही हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही कथनों की व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt ;font-family:'Nirmala UI'\">, </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">चोल</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> और </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पांड्य</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">।</span></li></ul>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अभिकथन (A): राज्यसभा को भंग नहीं किया जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कारण (R): यह एक स्थायी सदन है, जिसके एक-तिहाई सदस्य प्रत्येक दो वर्ष में सेवानिवृत्त होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन-सा सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A असत्य है, लेकिन R सत्य है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सत्य हैं, लेकिन R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A सत्य है, लेकिन R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सत्य हैं, और R, A की सही व्याख्या है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">क्यो , "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दोनों </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अभिकथन (A) और कारण (R)</span><span style=\"font-family:'Nirmala UI'\"> सत्य हैं, और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कारण (R) अभिकथन (A) का सही स्पष्टीकरण है</span><span style=\"font-family:'Nirmala UI'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कंप्यूटर मेमोरी को समझना</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अस्थिर प्रकृति</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: RAM को डेटा बनाए रखने के लिए बिजली की आवश्यकता होती है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पावर ऑफ प्रभाव</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: कंप्यूटर बंद करने पर RAM में सब कुछ तुरंत मिट जाता है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अस्थायी कार्य स्थान</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: यह केवल सक्रिय फ़ाइलों और चल रहे ऐप्स को रखता है।</span></li></ul>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केंद्रीय बजट m:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल एक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सभी तीन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल दो</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कोई नहीं</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उपरोक्त कथनों में से दो सही हैं (कथन I और II)।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथनों का मूल्यांकन</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कथन I (सही):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> भारत लोवी इंस्टीट्यूट एशिया पावर इंडेक्स में तीसरे स्थान पर रहा, जो केवल संयुक्त राज्य अमेरिका और चीन से पीछे था।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कथन II (सही):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> भारत ने ग्लोबल इनोवेशन इंडेक्स में 38वां स्थान हासिल किया, जो पिछले वर्षों की तुलना में लगातार सुधार को दर्शाता है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कथन III (गलत):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> भारत विश्व प्रेस स्वतंत्रता सूचकांक में शीर्ष पर नहीं रहा (जो आमतौर पर नॉर्वे जैसे देशों द्वारा शीर्ष पर होता है); भारत ऐतिहासिक रूप से काफी निचले स्थान पर रहा है (जैसे 159वें स्थान पर)।</span></li></ul>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के शास्त्रीय नृत्य रूपों के बारे में निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. कुचिपुड़ी की उत्पत्ति आंध्र प्रदेश में हुई थी।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. सत्रिया, जो असम से संबंधित है, पारंपरिक रूप से 'सत्र' नामक मठों के भीतर किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">III. संगीत नाटक अकादमी द्वारा मान्यता प्राप्त सभी 8 शास्त्रीय नृत्य रूप विशेष रूप से महिलाओं द्वारा किए जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उपरोक्त कथनों में से कितने सही हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कोई नहीं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सभी तीन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल एक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल दो</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">तीन कथनों में से दो सही हैं (कथन I और II), जबकि कथन III गलत है क्योंकि शास्त्रीय नृत्य पुरुष और महिला दोनों द्वारा किए जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन विश्लेषण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कथन I (सही):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> आंध्र प्रदेश के दक्षिणी राज्य के कृष्णा जिले में उत्पन्न हुआ।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कथन II (सही):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> एक प्रमुख शास्त्रीय नृत्य है जो पारंपरिक रूप से वैष्णव मठों जिन्हें सत्र कहा जाता है, में किया जाता था।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कथन III (गलत):</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> संगीत नाटक अकादमी द्वारा मान्यता प्राप्त आठ शास्त्रीय नृत्य रूप केवल महिलाओं द्वारा नहीं, बल्कि दोनों लिंगों के कलाकारों द्वारा किए जाते हैं।</span></li></ul>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अभिकथन (A): हीरा एक उत्कृष्ट ऊष्मा चालक है, इसके बावजूद कि यह एक विद्युत रोधक है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कारण (R): हीरे में प्रत्येक कार्बन परमाणु एक दृढ़ 3D जालक में चार अन्य परमाणुओं से सहसंयोजक बंध द्वारा जुड़ा होता है, जिससे मुक्त इलेक्ट्रॉनों के बिना कंपन (ऊष्मा) ऊर्जा का कुशल हस्तांतरण होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सही हैं, और R, A की सही व्याख्या है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सही हैं, लेकिन R, A की सही व्याख्या नहीं है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A सही है, लेकिन R गलत है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A गलत है, लेकिन R सही है।</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अभिकथन (A) और कारण (R) दोनों सही हैं, और कारण (R), अभिकथन (A) की सही व्याख्या है।</span><span style=\"font-family:'Nirmala UI'\"> हीरा जालक कंपन (फोनन) के माध्यम से बहुत अच्छी तरह से ऊष्मा का संचालन करता है, भले ही उसमें विद्युत धारा ले जाने के लिए कोई मुक्त इलेक्ट्रॉन न हों।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुख्य तथ्य</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ऊष्मीय चालकता</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: हीरे में उसके मजबूत सहसंयोजक बंधों और हल्के कार्बन परमाणुओं के कारण ऊष्मा हस्तांतरण की दर बहुत अधिक होती है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">विद्युत रोधन</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: यह बिजली का संचालन नहीं करता है क्योंकि सभी बाहरी इलेक्ट्रॉन मजबूत बंधों में जकड़े होते हैं।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">जालक संरचना</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: ऊष्मा तंग 3D नेटवर्क के माध्यम से कंपन की एक तरंग के रूप में चलती है।</span></li></ul>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अभिकथन (A): नकद आरक्षित अनुपात (CRR) में वृद्धि से अर्थव्यवस्था में मुद्रा आपूर्ति कम हो जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कारण (R): उच्च CRR बैंकों को RBI के पास अधिक आरक्षित राशि रखने के लिए बाध्य करता है, जिससे उधार देने के लिए कम धन उपलब्ध होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सही हैं, और R, A की सही व्याख्या नहीं है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A और R दोनों सही हैं, लेकिन R, A की सही व्याख्या है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A सही है, लेकिन R गलत है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A गलत है, लेकिन R सही है।</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">🟢</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अभिकथन (A) और कारण (R) दोनों सही हैं, और कारण (R), अभिकथन (A) की सही व्याख्या है</span><span style=\"font-family:'Nirmala UI'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथनों का विश्लेषण</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🟢</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अभिकथन (A) सही है</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: नकद आरक्षित अनुपात (CRR) किसी वाणिज्यिक बैंक की कुल जमा राशि का वह न्यूनतम प्रतिशत दर्शाता है जिसे भारतीय रिजर्व बैंक (RBI) के पास तरल नकदी के रूप में बनाए रखना होता है। जब RBI इस अनुपात को बढ़ाता है, तो यह तरलता को कम करता है, जिससे अर्थव्यवस्था में व्यापक मुद्रा आपूर्ति सीधे घट जाती है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🟢</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">कारण (R) सही है</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: उच्च CRR बैंकों को अपनी निवल मांग और सावधि देयताओं (NDTL) का एक बड़ा हिस्सा केंद्रीय बैंक के पास रखने के लिए मजबूर करके उन्हें भौतिक रूप से प्रतिबंधित करता है। क्योंकि यह पैसा RBI के पास सुरक्षित रूप से रखा जाता है, यह सार्वजनिक ऋणों के माध्यम से द्वितीयक ऋण के निर्माण के लिए पूरी तरह से अनुपलब्ध होता है।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कारण अभिकथन की सही व्याख्या क्यों करता है</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कारण इस बात का सटीक संचरण तंत्र बताता है कि अभिकथन कैसे होता है। मुद्रा आपूर्ति में कमी (अभिकथन) सीधे तौर पर बैंकों के पास बाजार में वितरित करने के लिए कम उधार योग्य धन (कारण) होने का प्रणालीगत परिणाम है।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित भारतीय पर्वतीय दर्रों को उत्तर से दक्षिण की ओर व्यवस्थित करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जोजिला, नाथूला, रोहतांग दर्रा, पालक्काड गैप</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जोजिला - रोहतांग दर्रा - नाथूला - पालक्काड गैप</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नाथूला - जोजिला - रोहतांग दर्रा - पालक्काड गैप</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जोजी ला - नाथू ला - रोहतांग दर्रा - पालक्कड़ गैप</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रोहतांग दर्रा - जोजी ला - नाथू ला - पालक्कड़ गैप</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">इन भारतीय पर्वतीय दर्रों का उत्तर से दक्षिण का सही क्रम </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जोजी ला</span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रोहतांग दर्रा</span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नाथू ला</span><span style=\"font-family:'Nirmala UI'\"> और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पालक्कड़ गैप</span><span style=\"font-family:'Nirmala UI'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दर्रों के स्थान और अक्षांश</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">जोजी ला</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">स्थान:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> लद्दाख केंद्र शासित प्रदेश / कश्मीर सीमा (पश्चिमी हिमालय)</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अक्षांश:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> ~34.3° उत्तरी अक्षांश</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">जोड़ता है:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> श्रीनगर को लेह से</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">रोहतांग दर्रा</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">स्थान:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> हिमाचल प्रदेश (पीर पंजाल श्रेणी)</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अक्षांश:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> ~32.4° उत्तरी अक्षांश</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">जोड़ता है:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> कुल्लू घाटी को लाहौल और स्पीति घाटियों से</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">नाथू ला</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">स्थान:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> पूर्वी सिक्किम जिला (हिमालय)</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अक्षांश:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> ~27.4° उत्तरी अक्षांश</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">जोड़ता है:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> सिक्किम को तिब्बत (चीन) से</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पालक्कड़ गैप (पालघाट गैप)</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">स्थान:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> केरल / तमिलनाडु सीमा (पश्चिमी घाट)</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अक्षांश:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> ~10.7° उत्तरी अक्षांश</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">जोड़ता है:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> केरल को तमिलनाडु से</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित में से कौन सा शासक उनके द्वारा किए गए प्रशासनिक/राजस्व सुधार से सही ढंग से सुमेलित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अकबर - स्थायी बंदोबस्त</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">शेर शाह सूरी – भू-राजस्व सुधार</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अलाउद्दीन खिलजी - मनसबदारी प्रणाली</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मुहम्मद बिन तुगलक - ज़ब्ती प्रणाली</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सही विकल्प है: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">शेर शाह सूरी – भू-राजस्व सुधार</span><span style=\"font-family:'Nirmala UI'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">विस्तृत व्याख्या</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">शेर शाह सूरी – भू-राजस्व सुधार:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> यह </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">सही सुमेलित</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> है। शेर शाह सूरी ने भूमि की माप (</span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Nirmala UI'\">रई</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> प्रणाली), उसकी उर्वरता के अनुसार भूमि के वर्गीकरण और राज्य के हिस्से (आमतौर पर उपज का एक-तिहाई) के निर्धारण पर आधारित एक व्यवस्थित और सुव्यवस्थित भू-राजस्व प्रणाली शुरू की। उनके कृषि सुधारों ने बाद में अकबर की राजस्व प्रणाली के लिए एक आधार के रूप में कार्य किया।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अकबर – स्थायी बंदोबस्त:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> यह </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">गलत सुमेलित</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> है। स्थायी बंदोबस्त (जमींदारी प्रणाली) 1793 में </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लॉर्ड कॉर्नवॉलिस</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> द्वारा शुरू की गई थी, जो अकबर के समय के बहुत बाद की बात है। अकबर की राजस्व प्रणाली को </span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Nirmala UI'\">ज़ब्ती</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> या </span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Nirmala UI'\">दहसाला</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> प्रणाली के नाम से जाना जाता था, जिसे राजा टोडरमल की मदद से तैयार किया गया था।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अलाउद्दीन खिलजी – मनसबदारी प्रणाली:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> यह </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">गलत सुमेलित</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> है। </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मनसबदारी</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> प्रणाली </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अकबर</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> द्वारा शाही अधिकारियों के पद, सैन्य जिम्मेदारी और वेतन को निर्धारित करने के लिए एक श्रेणीकरण प्रणाली के रूप में शुरू की गई थी। इसके बजाय, अलाउद्दीन खिलजी अपने बाजार नियंत्रण विनियमों, वस्तुओं की कीमतें निर्धारित करने और </span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Nirmala UI'\">दाग</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> (घोड़ों को दागना) तथा </span><span style=\"line-height:115%;font-size:12pt;font-style:italic;font-family:'Nirmala UI'\">हुलिया</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> (सैनिकों का वर्णनात्मक विवरण) की शुरुआत के लिए प्रसिद्ध है।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मुहम्मद बिन तुगलक – ज़ब्ती प्रणाली:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> यह </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">गलत सुमेलित</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> है। </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ज़ब्ती</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> प्रणाली मुगल काल के दौरान </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">अकबर</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> के अधीन विकसित की गई थी। मुहम्मद बिन तुगलक दौलताबाद में राजधानी का स्थानांतरण, सांकेतिक मुद्रा का प्रचलन और दोआब क्षेत्र में भारी कराधान जैसे प्रयोगों के लिए प्रसिद्ध है।</span></li></ul>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अनुच्छेद 368 के तहत संवैधानिक संशोधन प्रक्रिया के संबंध में निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. 'मौलिक अधिकारों' के प्रावधानों में संशोधन के लिए संसद में केवल साधारण बहुमत की आवश्यकता होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. कुछ संशोधनों के लिए कम से कम आधे राज्य विधानसभाओं द्वारा अनुसमर्थन की आवश्यकता होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">III. एक बार संसद द्वारा पारित
