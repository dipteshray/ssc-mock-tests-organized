"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Western Ghats are highest in which region?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Tamil Nadu</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kerala</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Karnataka</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Goa</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Kerala</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Western Ghats attain their greatest height in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kerala</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The highest peak of the Western Ghats is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Anamudi</span><span style=\"font-family:'Cambria Math'\">, located in Kerala. Its height is about </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">2,695 metres</span><span style=\"font-family:'Cambria Math'\"> above sea level.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer: Kerala</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is the largest multipurpose river valley project in India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Damodar Valley</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Hirakud</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bhakra Nangal</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sardar Sarovar</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Bhakra Nangal</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bhakra Nangal Project</span><span style=\"font-family:'Cambria Math'\"> is regarded as the largest multipurpose river valley project in India. It is built on the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sutlej River</span><span style=\"font-family:'Cambria Math'\"> and benefits mainly </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Punjab, Haryana, Rajasthan, and Himachal Pradesh</span><span style=\"font-family:'Cambria Math'\">. </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It serves several purposes, such as:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Irrigation</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Generation of hydroelectric power</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Flood control</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Supply of water for domestic and industrial use</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Bhakra Dam forms the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Gobind Sagar Reservoir</span><span style=\"font-family:'Cambria Math'\">. </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer: Bhakra Nangal</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A particular region of India experiences its heaviest rainfall on the windward side of a mountain range, while the area just beyond the range, on the leeward side, remains comparatively dry. Which phenomenon best explains this pattern?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Orographic rainfall and the resulting rain-shadow effect</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Frontal rainfall</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Cyclonic rainfall</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Convectional rainfall</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Orographic rainfall</span><span style=\"font-family:'Cambria Math'\"> occurs when moist winds are forced to rise over a mountain barrier, cooling and releasing rain on the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">windward side</span><span style=\"font-family:'Cambria Math'\">; having lost most of their moisture, the winds descend on the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">leeward side</span><span style=\"font-family:'Cambria Math'\"> as relatively dry air, creating a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">'rain-shadow' effect</span><span style=\"font-family:'Cambria Math'\"> - clearly illustrated by the Western Ghats (wet windward Konkan coast vs comparatively dry leeward Deccan Plateau).</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">This same principle explains why regions immediately east of the Western Ghats, like parts of interior Maharashtra and Karnataka, receive significantly less rainfall than the coastal belt just to their west.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is Orographic rainfall and the resulting rain-shadow effect.</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The river Kosi frequently shifts its channel in the plains mainly because:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Large upstream dams constantly modify their natural flow</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It carries huge quantities of sediment from the Himalayas</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It traverses a long stretch of tectonic rifted lowland</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Its flow is sustained only by seasonal monsoon rain</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: It carries huge quantities of sediment from the Himalayas (Option 2)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kosi River</span><span style=\"font-family:'Cambria Math'\"> originates in the young and highly erodible Himalayan region. It carries a very large amount of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">silt, sand, and sediments</span><span style=\"font-family:'Cambria Math'\"> into the plains.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">When the river enters the flat plains, its speed decreases, causing these sediments to be deposited on the riverbed. This raises the riverbed and blocks the existing channel, forcing the river to frequently change its course.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Because of its frequent floods and shifting channels, the Kosi is also known as the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">“Sorrow of Bihar.”</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer: Option 2 — It carries huge quantities of sediment from the Himalayas</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following Indian hill stations is the 'odd one out', based on the mountain range it is located in?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ooty</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Munnar</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Coorg</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mount Abu</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Ooty, Munnar and Coorg</span><span style=\"font-family:'Cambria Math'\"> are all located within the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Western Ghats</span><span style=\"font-family:'Cambria Math'\"> mountain system. </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Mount Abu</span><span style=\"font-family:'Cambria Math'\">, however, is located in the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Aravalli Range</span><span style=\"font-family:'Cambria Math'\"> in Rajasthan, making it the odd one out among these four hill stations.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is Mount Abu (the odd one out).</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Saang dance is a ritualistic popular traditional folk dance of _____________, reflecting its culture in the true sense.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sikkim</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kerala</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Haryana</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Punjab</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Haryana (Option 3)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Saang</span><span style=\"font-family:'Cambria Math'\"> is a popular traditional folk theatre and dance form of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Haryana</span><span style=\"font-family:'Cambria Math'\">. It combines </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">dance, music, dialogue, and storytelling</span><span style=\"font-family:'Cambria Math'\"> and reflects the state’s culture, customs, social life, and traditions.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It is generally performed in an open space, with artists presenting stories based on mythology, history, and social themes.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer: Option 3 — Haryana</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A State Government wants to impose a new tax that falls under a subject listed in the Union List. Which of the following correctly describes the constitutional position?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The State can impose the tax only with the Governor's approval, bypassing Parliament entirely</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both the State and Union can impose the tax simultaneously</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The State can impose the tax freely, since taxation is always a State subject</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The State cannot impose such a tax, since only Parliament has the power to legislate on Union List subjects</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Since the subject falls under the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Union List</span><span style=\"font-family:'Cambria Math'\">, only </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Parliament</span><span style=\"font-family:'Cambria Math'\"> has the constitutional authority to legislate (including imposing taxes) on it - </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">State Legislatures cannot</span><span style=\"font-family:'Cambria Math'\"> encroach upon Union List subjects, reflecting the clear division of legislative powers under the Seventh Schedule.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">This division of taxing powers is a fundamental feature of India's federal structure, with GST being a notable exception designed through a specific constitutional amendment to allow concurrent Union-State taxation on a shared base.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'The State cannot impose such a tax, since only Parliament has the power to legislate on Union List subjects'.</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The earliest evidence of stone tools in India has been found at:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Attirampakkam</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mehrgarh</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lothal</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Hunsgi Valley</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Attirampakkam (Option 1)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Attirampakkam</span><span style=\"font-family:'Cambria Math'\">, located near </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Chennai in Tamil Nadu</span><span style=\"font-family:'Cambria Math'\">, is an important Palaeolithic archaeological site. Excavations here have revealed some of the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">earliest known stone tools in India</span><span style=\"font-family:'Cambria Math'\">, including Acheulian hand axes and other prehistoric tools. </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The site provides important evidence about the early development of stone-tool technology in the Indian subcontinent.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Other options:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mehrgarh</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> — famous for early farming and Neolithic settlements.</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Lothal</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> — an important Harappan port city.</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Hunsgi Valley</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> — an important Palaeolithic site, but not the correct answer here.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer: Option 1 — Attirampakkam</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">According to the WMO report cited in 2025, global warming in Jan–Aug 2025 was approximately how much abovepre-industrial levels?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">0.8°C</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1.42°C</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1.0°C</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2.1°C</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: 1.42°C</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">According to the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">World Meteorological Organization (WMO)</span><span style=\"font-family:'Cambria Math'\">, the global mean near-surface temperature during </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">January–August 2025</span><span style=\"font-family:'Cambria Math'\"> was approximately </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1.42°C above the pre-industrial average</span><span style=\"font-family:'Cambria Math'\"> of 1850–1900. </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer: 1.42°C (Option 2)</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The assassination attempt on Viceroy Lord Hardinge in Delhi in 1912 was organised by revolutionaries led by:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"color:#1d293b;font-family:'Cambria Math'\">Khudiram Bose and Prafulla Chaki</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Madanlal Dhingra and VD Savarkar</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rasbehari Bose and Sachindranath Sanyal</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"color:#1d293b;font-family:'Cambria Math'\">Surya Sen and Jatin Mukherjee</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Rasbehari Bose and Sachindranath Sanyal (Option 3)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The assassination attempt on </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Viceroy Lord Hardinge</span><span style=\"font-family:'Cambria Math'\"> took place on </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">23 December 1912</span><span style=\"font-family:'Cambria Math'\"> in Delhi. A bomb was thrown at him during a ceremonial procession connected with the transfer of the British Indian capital from Calcutta to Delhi.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The revolutionary conspiracy was organised mainly under the leadership of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Rasbehari Bose</span><span style=\"font-family:'Cambria Math'\"> and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sachindranath Sanyal</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lord Hardinge was injured in the attack, but he survived.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer: Option 3 — Rasbehari Bose and Sachindranath Sanyal</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following groups at the Second Round Table Conference claimed that Congress had no authority intheir territories?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Indian princes</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">British officials</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Zamindars</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Provincial governors</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Indian princes (Option 1)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">At the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Second Round Table Conference (1931)</span><span style=\"font-family:'Cambria Math'\">, the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Indian princes</span><span style=\"font-family:'Cambria Math'\"> argued that the Indian National Congress had no authority to represent or interfere in the affairs of the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">princely states</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The princes ruled their territories separately under British paramountcy and claimed that Congress mainly represented </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">British India</span><span style=\"font-family:'Cambria Math'\">, not the princely states.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer: Option 1 — Indian princes</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Article of the Indian Constitution places the most emphasis on reducing income and status disparities?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 39</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 38(2)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 38(1)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 36</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Article 38(2) (Option 2)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">38(2)</span><span style=\"font-family:'Cambria Math'\"> of the Indian Constitution directs the State to minimise inequalities in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">income</span><span style=\"font-family:'Cambria Math'\"> and to eliminate inequalities in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">status, facilities, and opportunities</span><span style=\"font-family:'Cambria Math'\"> among individuals as well as among different groups of people.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It is included under the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Directive Principles of State Policy (DPSP)</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 38(1) broadly promotes a social order based on justice, while Article 38(2) specifically focuses on reducing economic and social disparities.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer: Option 2 — Article 38(2)</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Articles 245 to 255 of Part XI of the Indian Constitution primarily deal with which aspect of Centre-State relations?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Judicial relations</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Administrative relations</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Legislative relations</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Financial relations</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Legislative relations</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Articles </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">245 to 255</span><span style=\"font-family:'Cambria Math'\"> in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Part XI</span><span style=\"font-family:'Cambria Math'\"> of the Indian Constitution deal with the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">legislative relations between the Centre and the States</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">These Articles explain:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The territorial extent of laws made by Parliament and State Legislatures</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The distribution of legislative powers through the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Union List, State List, and Concurrent List</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Parliament’s power to legislate on State subjects in certain special situations</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer: Legislative relations (Option 3)</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following correctly describes the 'Anti-Defection Law's' primary objective?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">To make it mandatory for all MPs to vote exactly as their conscience dictates</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">To prevent the formation of coalition governments entirely</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">To curb political defections motivated by lure of office or other similar considerations, promoting stability of governments</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">To ban all political parties except two national parties</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Anti-Defection Law</span><span style=\"font-family:'Cambria Math'\"> (Tenth Schedule) primarily aims to curb political </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">defections motivated by opportunism</span><span style=\"font-family:'Cambria Math'\"> - such as the lure of ministerial office - thereby promoting greater </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">stability</span><span style=\"font-family:'Cambria Math'\"> of elected governments.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'To curb political defections motivated by lure of office or other similar considerations, promoting stability of governments'.</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Indian state is the largest producer of turmeric, a widely used spice?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Telangana</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Karnataka</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Tamil Nadu</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kerala</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Telangana</span><span style=\"font-family:'Cambria Math'\"> is India's largest producer of turmeric, with the Nizamabad region being especially well known for large-scale cultivation and trade of the spice.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">India is the world's largest producer, consumer and exporter of turmeric, which has significant culinary, medicinal and ceremonial importance in Indian culture.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is Telangana.</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Article prohibits judicial inquiry into ministerial advice tendered to President during constitutionalfunctioning?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 76</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 72</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 78</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 74</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Article 74 (Option 4)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">74</span><span style=\"font-family:'Cambria Math'\"> deals with the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Council of Ministers headed by the Prime Minister</span><span style=\"font-family:'Cambria Math'\">, which aids and advises the President.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Under </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Article 74(2)</span><span style=\"font-family:'Cambria Math'\">, courts are prohibited from inquiring into:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Whether any advice was given by the Council of Ministers to the President</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">What the nature or content of that advice was</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">This provision maintains the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">confidentiality of ministerial advice</span><span style=\"font-family:'Cambria Math'\"> given to the President.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer: Option 4 — Article 74</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">What is the primary function of the keyboard shortcut Ctrl + H in applications like MS Word?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Highlights selected text</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Opens the Help window</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Displays document history</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Opens the Find and Replace dialog box</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Opens the Find and Replace dialog box (Option 4)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In applications like </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">MS Word</span><span style=\"font-family:'Cambria Math'\">, pressing </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Ctrl + H</span><span style=\"font-family:'Cambria Math'\"> opens the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Find and Replace</span><span style=\"font-family:'Cambria Math'\"> dialog box, usually with the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Replace</span><span style=\"font-family:'Cambria Math'\"> tab active.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It is used to:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Find a specific word, phrase, or character in a document</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Replace it with another word, phrase, or character</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Replace one occurrence or all occurrences at once</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Example: You can find every occurrence of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">“India”</span><span style=\"font-family:'Cambria Math'\"> and replace it with </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">“Bharat.”</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer: Option 4 — Opens the Find and Replace dialog box</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">When zinc granules are added to a blue copper sulphate solution, the blue colour gradually fades and a reddish-brown deposit forms. Which type of chemical reaction does this best illustrate?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Combination reaction, forming a new compound</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Displacement reaction, where zinc displaces copper from copper sulphate solution</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neutralisation reaction between an acid and a base</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Decomposition reaction of copper sulphate</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">This is a classic </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">displacement reaction</span><span style=\"font-family:'Cambria Math'\">: since </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">zinc is more reactive than copper</span><span style=\"font-family:'Cambria Math'\">, it displaces copper from the copper sulphate solution, forming zinc sulphate (colourless) and depositing reddish-brown metallic copper, explaining the fading blue colour and copper deposit.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'Displacement reaction, where zinc displaces copper from copper sulphate solution'.</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is an example of a spreadsheet software?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Microsoft Excel</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">VLC Media Player</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Adobe Photoshop</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Microsoft Word</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Microsoft Excel</span><span style=\"font-family:'Cambria Math'\"> is a widely used spreadsheet software, allowing users to organise, calculate and analyse data in rows and columns.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">MS Word is document/word-processing software, Photoshop is for image editing, and VLC is a media player - none of these serve a spreadsheet function.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is Microsoft Excel.</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements regarding RAM and ROM and select the correct option.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(i) ROM is faster than RAM because it stores permanent system instructions accessed less frequently by the CPU.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(ii) RAM can be read from and written to by the CPU, but its contents are erased when the power is turned off.</span></p>", "option1": "(i) Fोिसध, (ii) Fोिसध", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(i) True, (ii) True</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(i) False, (ii) True</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(i) True, (ii) False</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\n <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: (i) False, (ii) True (Option 3)</span></p>\n<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Statement </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">(i) is false</span><span style=\"font-family:'Cambria Math'\"> because </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">RAM is generally faster than ROM</span><span style=\"font-family:'Cambria Math'\">. RAM provides quick access to data and instructions currently being used by the CPU. ROM stores permanent instructions, such as firmware, but it is not faster than RAM.</span></p>\n<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Statement </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">(ii) is true</span><span style=\"font-family:'Cambria Math'\"> because RAM allows the CPU to both </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">read and write data</span><span style=\"font-family:'Cambria Math'\">. However, RAM is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">volatile memory</span><span style=\"font-family:'Cambria Math'\">, meaning its contents are lost when the power is switched off.</span></p>\n<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer: Option 3 — (i) False, (ii) True</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements about the Padma Awards 2026:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. They were announced on the eve of India's 77th Republic Day.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. They recognised over 200 individuals for contributions across various fields.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the statements given above is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both I and II</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither I nor II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement I is correct</span><span style=\"font-family:'Cambria Math'\"> - the Padma Awards 2026 were announced on the eve of India's </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">77th Republic Day</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement II is incorrect</span><span style=\"font-family:'Cambria Math'\"> - they recognised </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">131 distinguished individuals</span><span style=\"font-family:'Cambria Math'\">, not over 200, across fields including art, public affairs, medicine, literature, sports, science and social work.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">The Padma Awards, comprising Padma Vibhushan, Padma Bhushan and Padma Shri, are approved annually by the President based on recommendations from a specially constituted Awards Committee.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'Only I'.</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Match the following 2025-26 developments with their associated organisation/institution:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A. Real-time FX settlement for international UPI payments - 1. NPCI, HSBC India and JP Morgan Payments</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">B. Integrated Ombudsman Scheme (effective 1 July 2026) - 2. Reserve Bank of India (RBI)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">C. SKOCH Award 2025 for a disaster alert system - 3. C-DOT</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">D. Gold Award at National e-Governance Awards 2026 - 4. Indian Council of Medical Research (ICMR)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following combinations is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-1, B-2, C-3, D-4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-2, B-1, C-4, D-3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-3, B-4, C-1, D-2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A-4, B-3, C-2, D-1</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">NPCI, HSBC India and JP Morgan Payments</span><span style=\"font-family:'Cambria Math'\"> partnered for real-time FX settlement of international UPI payments; </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">the revised Integrated Ombudsman Scheme effective from 1 July 2026</span><span style=\"font-family:'Cambria Math'\">; </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">C-DOT</span><span style=\"font-family:'Cambria Math'\"> won the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">SKOCH Award 2025</span><span style=\"font-family:'Cambria Math'\"> for its life-saving Cell Broadcast Disaster Alert System; and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">ICMR</span><span style=\"font-family:'Cambria Math'\"> won the Gold Award at the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">National e-Governance Awards 2026</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">These developments together illustrate India's continued push across financial technology, disaster management, and digital governance innovation.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct combination is A-1, B-2, C-3, D-4.</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Indian organisation won the SKOCH Award 2025 for its 'life-saving Cell Broadcast Disaster Alert System'?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">DRDO</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">ISRO</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">BSNL</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">C-DOT (Centre for Development of Telematics)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">C-DOT (Centre for Development of Telematics)</span><span style=\"font-family:'Cambria Math'\"> won the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">SKOCH Award 2025</span><span style=\"font-family:'Cambria Math'\"> for developing a life-saving </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Cell Broadcast Disaster Alert System</span><span style=\"font-family:'Cambria Math'\">, enabling rapid mass emergency alerts to mobile phone users.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">Cell broadcast technology allows emergency alerts to be sent instantly to all phones within a specific geographic area, without needing individual phone numbers, making it especially valuable during natural disasters.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is C-DOT (Centre for Development of Telematics).</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Indian Army Major Swathi Shantha Kumar was honoured with which prestigious award in January 2026?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">UN Secretary-General's Award<  69, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">According to the Union Budget 2025-26, how many districts will be initially covered under the 'Prime Minister Dhan-Dhaanya Krishi Yojana-Developing Agri Districts Programme'?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">111</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">75</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">51</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">100</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: 100 districts (Option 4)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">According to the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Union Budget 2025–26</span><span style=\"font-family:'Cambria Math'\">, the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Prime Minister Dhan-Dhaanya Krishi Yojana – Developing Agri Districts Programme</span><span style=\"font-family:'Cambria Math'\"> was announced to initially cover </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">100 districts</span><span style=\"font-family:'Cambria Math'\">. </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">These districts are selected mainly on the basis of:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Low agricultural productivity</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Moderate or low crop intensity</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Below-average availability of agricultural credit</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The programme aims to improve agricultural productivity, promote crop diversification, strengthen irrigation and storage facilities, and improve access to credit. </span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer: Option 4 — 100 districts</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Aruna Mohanty, who received the Padma Shree award in 2017, is associated with which of the following danceforms?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bharatanatyam</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kathakali</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Odissi</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Manipuri</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Odissi (Option 3)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Aruna Mohanty </span><span style=\"font-family:'Cambria Math'\">is a renowned Indian classical dancer and choreographer associated with Odissi, the classical dance form of Odisha.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">She received the Padma Shri in 2017 for her contribution to the field of art and dance.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Answer: Option 3 — Odissi</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Who founded the 'Indian Reform Association' in 1870, promoting widow remarriage and women's education?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ishwar Chandra Vidyasagar</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Keshab Chandra Sen</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Debendranath Tagore</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Raja Ram Mohan Roy</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Keshab Chandra Sen</span><span style=\"font-family:'Cambria Math'\"> founded the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Indian Reform Association</span><span style=\"font-family:'Cambria Math'\"> in 1870, promoting social causes including widow remarriage, women's education and temperance.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">Sen was also a prominent leader within the Brahmo Samaj movement, though his later theological views led to divisions within the organisation.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is Keshab Chandra Sen.</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Amendment made written Cabinet advice mandatory for Emergency in India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">26 Amendment</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">42 Amendment</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">24 Amendment</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">44 Amendment</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: 44th Amendment (Option 4)</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">44th Constitutional Amendment Act, 1978</span><span style=\"font-family:'Cambria Math'\"> made it mandatory that a National Emergency under </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Article 352</span><span style=\"font-family:'Cambria Math'\"> can be proclaimed by the President only on the basis of the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">written advice of the Union Cabinet</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">This safeguard was introduced to prevent the misuse of emergency powers. Earlier, the President could act on the advice of the Prime Minister without requiring formal written approval from the entire Cabinet.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer: Option 4 — 44th Amendment</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Assertion (A): The Comptroller and Auditor General (CAG) of India cannot be removed easily from office.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Reason (R): The CAG can only be removed in the same manner and on the same grounds as a Supreme Court judge.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is true, but R is false</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, but R is NOT the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A is false, but R is true</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both A and R are true, and R is the correct explanation of A</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">CAG's security of tenure</span><span style=\"font-family:'Cambria Math'\"> (A) exists precisely because removal requires the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">same rigorous process as a Supreme Court judge</span><span style=\"font-family:'Cambria Math'\"> - a resolution passed by both Houses with a special majority, on limited grounds like proven misbehaviour or incapacity - directly explaining why removal is difficult (R correctly explains A).</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">This strong protection is deliberately designed to ensure the CAG can audit government finances independently, without fear of arbitrary removal by the very government whose spending it scrutinises.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'Both A and R are true, and R is the correct explanation of A'.</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A company experiences a sudden surge in website traffic that its single server cannot handle, causing the site to crash. Which of the following solutions would MOST directly address this specific problem?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Installing a new antivirus programme</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Load balancing across multiple servers to distribute incoming traffic</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Changing the website's domain name</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Compressing the website's image files</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Load balancing</span><span style=\"font-family:'Cambria Math'\"> distributes incoming traffic across </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">multiple servers</span><span style=\"font-family:'Cambria Math'\">, preventing any single server from being overwhelmed and helping the website handle traffic surges without crashing.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">This technique is widely used by large websites and online services to maintain reliability and performance, especially during high-traffic events like major sales or breaking news.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'Load balancing across multiple servers to distribute incoming traffic'.</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following temple complexes is known for its 24-metre-high vimana and stone image of Shiva?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Gangaikondacholisvaram</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kandariya Mahadeva Temple</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mahabodhi Temple</span></p>",
