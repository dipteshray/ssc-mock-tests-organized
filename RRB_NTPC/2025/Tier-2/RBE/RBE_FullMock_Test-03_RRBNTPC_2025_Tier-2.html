margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Varanasi</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kanpur</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Prayagraj</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bhatkhande Music Institute</span><span style=\"font-family:'Cambria Math'\"> is located in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Lucknow, Uttar Pradesh</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Lucknow</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct answer.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Established in 1926 by </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Vishnu Narayan Bhatkhande</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, a pioneer in Hindustani classical music.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">It is a premier institution for teaching, research, and promotion of Indian classical music.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Varanasi</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Famous for </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Banaras Hindu University (BHU)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> and its Faculty of Performing Arts, but not the location of Bhatkhande Institute.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kanpur</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Industrial city, not associated with this music institute.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Prayagraj (Allahabad)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Known for literary and cultural heritage, but not the seat of Bhatkhande Music Institute.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A student mixes dilute sulphuric acid with sodium hydroxide solution and observes that the resulting mixture is neither acidic nor basic. Which of the following best describes this reaction?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Decomposition reaction</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Displacement reaction</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Combustion reaction</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neutralization reaction</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">This is a classic </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Neutralisation reaction</span><span style=\"font-family:'Cambria Math'\">: an acid (sulphuric acid) reacts with a base (sodium hydroxide) to form a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">salt (sodium sulphate) and water</span><span style=\"font-family:'Cambria Math'\">, resulting in a solution that is neither acidic nor basic if exact stoichiometric amounts are used.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">Neutralisation reactions have wide practical applications, from antacid tablets neutralising excess stomach acid to treating acidic industrial waste before disposal.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'Neutralisation reaction, producing a salt (sodium sulphate) and water'.</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">If a government policy is considered unwise or ineffective but does not clearly violate the Constitution or any law, what is the most appropriate course of action available to citizens?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Citizens must wait until a constitutional amendment is enacted before raising any objection to the policy.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Citizens may directly invoke Article 32, treating every policy disagreement as a Fundamental Rights violation.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Citizens may oppose the policy through democratic means unless a specific legal or constitutional violation exists.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Citizens may request the President to cancel the policy without seeking any judicial or legislative intervention.</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct explanation is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Citizens may oppose the policy through democratic means unless a specific legal or constitutional violation exists.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option 1: Wait for constitutional amendment</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Citizens don’t need to wait for amendments; they can use democratic channels like protests, petitions, media, and elections.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option 2: Invoke Article 32 for every disagreement</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Article 32 applies only when </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Fundamental Rights are violated</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not for general policy disagreements.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option 3: Oppose through democratic means unless violation exists</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">If a policy is unwise or ineffective but not unconstitutional or illegal, citizens can oppose it via </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">public debate, elections, civil society movements, and democratic participation</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Judicial remedies are available only when rights or laws are violated.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option 4: Request President to cancel policy directly</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The President cannot unilaterally cancel government policy without legislative or judicial process.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following best describes 'Deflation'?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A persistent decline in the price of a single product within a particular market over time.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A sustained decline in the overall price level of goods and services across the economy.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A sustained expansion in the money supply leading to higher liquidity throughout the economy.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A sustained rise in the overall price level of goods and services across the economy.</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The most accurate description of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Deflation</span><span style=\"font-family:'Cambria Math'\"> is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">a sustained decline in the overall price level of goods and services across the economy.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option 1: Decline in price of a single product</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">That is just a </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">price fall in one market</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not deflation.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option 2: Sustained decline in overall price level</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Deflation means </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">general fall in prices across the economy</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, often linked to reduced demand, excess supply, or contraction in money supply.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">It can lead to </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">lower profits, job losses, and economic slowdown</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option 3: Expansion in money supply → higher liquidity</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">That describes </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">monetary expansion</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not deflation.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option 4: Sustained rise in overall price level</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">That is </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">inflation</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, the opposite of deflation.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Indian state is the largest producer of tobacco?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Andhra Pradesh</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Gujarat</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Karnataka</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Maharashtra</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Andhra Pradesh</span><span style=\"font-family:'Cambria Math'\"> is India's largest producer of tobacco, particularly known for its high-quality flue-cured Virginia tobacco grown in the Guntur region.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">India is among the world's largest producers and exporters of tobacco, though production has faced increasing regulatory and public health scrutiny in recent years.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is Andhra Pradesh.</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements about the 'Non-Cooperation Movement' (1920-22):</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. It was withdrawn by Gandhi following the Chauri Chaura incident.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. It was launched in support of the Khilafat movement, uniting Hindus and Muslims.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the statements given above is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither I nor II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both I and II</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Both statements are correct.</span><span style=\"font-family:'Cambria Math'\"> Gandhi withdrew the movement following the violent </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Chauri Chaura incident</span><span style=\"font-family:'Cambria Math'\">, and the movement had indeed been launched partly in support of the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Khilafat issue</span><span style=\"font-family:'Cambria Math'\">, uniting Hindus and Muslims in a shared campaign against British rule.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">This unity, however, proved relatively short-lived, as Hindu-Muslim political cooperation gradually weakened in subsequent years, eventually contributing to the communal tensions that culminated in Partition.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'Both I and II'.</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which security measure best protects the data on a laptop if the device is stolen and its storage drive is accessed from another computer?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Full-disk encryption that secures all stored data until the correct password or decryption key is provided.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A higher screen resolution that improves display quality and overall visual clarity during daily computer use.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Additional RAM that increases system performance and improves multitasking under heavy software workloads.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A longer charging cable that provides greater flexibility while powering the laptop in different locations.</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Option: Full-disk encryption that secures all stored data until the correct password or decryption key is provided.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option 1: Full-disk encryption</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Encrypts the entire storage drive, making the data unreadable without the correct password or decryption key.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Even if the drive is removed and connected to another computer, the files remain inaccessible.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Examples: </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">BitLocker (Windows)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">FileVault (MacOS)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">LUKS (Linux)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option 2: Higher screen resolution</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Improves display quality only, no security benefit.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option 3: Additional RAM</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Enhances performance and multitasking, but does not protect stored data.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option 4: Longer charging cable</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Provides convenience, not security.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Where is the headquarters of 'UNICEF' located? </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Paris</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Geneva</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">New York</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rome</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The headquarters of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">UNICEF (United Nations International Children’s Emergency Fund)</span><span style=\"font-family:'Cambria Math'\"> is located in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">New York, USA</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115% mily:'Cambria Math'\">Beighton Cup, Sultan Azlan Shah Cup</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not Thomas Cup.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Badminton</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Thomas Cup</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> is the </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">world men’s team championship in badminton</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, first held in </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1949</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Named after </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sir George Thomas</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, a British badminton player.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Held every two years, featuring top national teams competing for the prestigious trophy.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">India won its </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">first-ever Thomas Cup in 2022</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, defeating Indonesia in the final.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following best describes 'Power' in physics?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The rate at which work is performed or energy is transferred from one system to another.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The total amount of work completed by a body without considering the time involved.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The total distance covered by an object while moving from one position to another continuously.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The magnitude of force exerted on an object to change its state of motion.</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The most accurate description of Power in physics is: the rate at which work is performed or energy is transferred from one system to another.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option 1: Rate at which work is performed or energy transferred</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Correct.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Power = Work / Time or Energy / Time.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">SI Unit: </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Watt (W)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> = Joule/second.</span></li><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">Example: A 100 W bulb consumes 100 joules of energy per second.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option 2: Total amount of work completed without time</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">That defines </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Work</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not Power.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option 3: Total distance covered by an object</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">That defines </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Displacement/Distance</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not Power.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option 4: Magnitude of force exerted</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">That defines </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Force</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not Power.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following correctly describes the 'Union Territories' of India, in terms of their administration?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">They are fully self-governing, with no role for the Central Government</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">They can only be created through a Constitutional Amendment, never by ordinary legislation</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">They are directly administered by the Central Government, typically through an Administrator appointed by the President</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">They have the same constitutional status as States in all respects</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Union Territories</span><span style=\"font-family:'Cambria Math'\"> are directly administered by the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Central Government</span><span style=\"font-family:'Cambria Math'\">, typically through an </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Administrator</span><span style=\"font-family:'Cambria Math'\"> (sometimes called a Lieutenant Governor) appointed by the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">President</span><span style=\"font-family:'Cambria Math'\">, unlike States, which have their own elected governments with greater autonomy.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-style:italic;font-family:'Cambria Math'\">Some Union Territories, like Delhi and Puducherry, have been granted partial legislative powers and elected assemblies, representing a hybrid model between full statehood and complete central administration.</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Cambria Math'\">Hence, the correct answer is 'They are directly administered by the Central Government, typically through an Administrator appointed by the President'.</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which statement best defines an archipelago in physical geography?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A narrow land bridge connecting two larger landmasses across adjoining water bodies.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"fon bes an </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">isthmus</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not an archipelago.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option 2: Broad elevated landform with flat summit</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">That defines a </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">plateau</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">, not an archipelago.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Option 3: Deep and narrow sea inlet between cliffs</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:10pt;padding-left:7pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">That is a </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">fjord</span><span style=\"line-height:115%;font-size:12pt;font-family:'Cambria Math'\">,
