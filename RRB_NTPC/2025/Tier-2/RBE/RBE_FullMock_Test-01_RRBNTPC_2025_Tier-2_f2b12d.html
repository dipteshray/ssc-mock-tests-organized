<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2.) RRB NTPC (UG) 2025-26 CBT-2 Live Mock 1 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

rgin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अतिरिक्त जानकारी: NaCl सॉल्वे और क्लोर-क्षार प्रक्रियाओं के माध्यम से क्लोरीन, कास्टिक सोडा (NaOH) और सोडियम कार्बोनेट के औद्योगिक उत्पादन के लिए प्राथमिक कच्चा माल भी है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर सोडियम क्लोराइड है।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सत्ता के हस्तांतरण पर चर्चा करने के लिए 'कैबिनेट मिशन' किस वर्ष भारत आया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1946</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1942</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1935</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1947</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कैबिनेट मिशन</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1946</span><span style=\"font-family:'Nirmala UI'\"> में भारत आया, जिसने भारत के लिए त्रि-स्तरीय संघीय संरचना का प्रस्ताव दिया और भारत के संविधान का मसौदा तैयार करने के लिए एक संविधान सभा बनाने की योजना प्रस्तुत की।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:1 क तकनीकों को अपनाने का नेतृत्व किया, जिससे खाद्यान्न उत्पादन में नाटकीय रूप से वृद्धि हुई।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अतिरिक्त जानकारी: नॉर्मन बोरलॉग, जिन्होंने भारत में उपयोग किए गए HYV गेहूं के बीज विकसित किए, उन्हें वैश्विक 'हरित क्रांति के जनक' कहा जाता है; इसके बजाय वर्गीज कुरियन को 'श्वेत क्रांति के जनक' (ऑपरेशन फ्लड, डेयरी क्षेत्र) के रूप में जाना जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर एम.एस. स्वामीनाथन है।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">'गुणक प्रभाव' की अवधारणा, जो बताती है कि व्यय में प्रारंभिक वृद्धि राष्ट्रीय आय में अधिक अंतिम वृद्धि कैसे करती है, किस अर्थशास्त्री से संबंधित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">डेविड रिकार्डो</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एडम स्मिथ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कार्ल मार्क्स</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जॉन मेनार्ड कीन्स</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जॉन मेनार्ड कीन्स</span><span style=\"font-family:'Nirmala UI'\"> ने अपने माँग-पक्षीय अर्थशास्त्र के सिद्धांत  style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मेघालय</span><span style=\"font-family:'Nirmala UI'\"> के पूर्वी खासी पहाड़ियों में, बंगाल की खाड़ी से आने वाले मानसून बादलों पर खासी पहाड़ियों के फनलिंग प्रभाव के कारण अत्यधिक भारी वर्षा प्राप्त करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अतिरिक्त जानकारी: पास का चेरापूंजी (सोहरा), जो मेघालय में भी है, ने पहले यह रिकॉर्ड अपने नाम किया था और दुनिया के सबसे आर्द्र बसे हुए स्थानों में से एक बना हुआ है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर मेघालय है।</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत में धन विधेयक (Money Bills) के संबंध में निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. धन विधेयक केवल लोकसभा में ही पेश किया जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. राज्य सभा को धन विधेयक में संशोधन करने की शक्ति है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऊपर दिए गए कथनों में से कौन सा/से सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I और II दोनों</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो I और न ही II</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन I सही है</span><span style=\"font-family:'Nirmala UI'\"> - अनुच्छेद 110 के अनुसार, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">धन विधेयक केवल लोकसभा में ही पेश किया जा सकता है</span><span style=\"font-family:'Nirmala UI'\">, और वह भी राष्ट्रपति की पूर्व सिफारिश के साथ।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन II गलत है</span><span style=\"font-family:'Nirmala UI'\"> - </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">राज्य सभा धन विधेयक में संशोधन नहीं कर सकती</span><span style=\"font-family:'Nirmala UI'\">; यह केवल 14 दिनों के भीतर परिवर्तन की सिफारिश कर सकती है, जिसे लोकसभा स्वीकार या अस्वीकार कर सकती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'केवल I' है।</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अंडमान और निकोबार द्वीप समूह द्वारा कवर किया गया कुल क्षेत्रफल लगभग है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">6,249 वर्ग किमी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmal king": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सर सिरिल रेडक्लिफ ने 1947 में विभाजन के दौरान भारत को नवगठित </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पश्चिमी पाकिस्तान और पूर्वी पाकिस्तान (अब बांग्लादेश)</span><span style=\"font-family:'Nirmala UI'\"> से अलग करने वाली सीमा रेखाएँ खींची थीं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अतिरिक्त जानकारी: यह रेखा पाँच सप्ताह से भी कम समय में, सीमित स्थानीय ज्ञान के साथ खींची गई थी, और इसकी मनमानी प्रकृति के कारण विभाजन के दौरान बड़े पैमाने पर विस्थापन और सांप्रदायिक हिंसा हुई थी।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर पाकिस्तान और बांग्लादेश है।</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मार्च 2025 में लेनोवो ने भारत का सबसे बड़ा AI सुपरकंप्यूटर बनाने के लिए किस भारतीय AI फर्म के साथ साझेदारी की घोषणा की?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कृत्रिम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">AI4भारत</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">L &amp; T सेमीकंडक्टर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">QpiAI</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मार्च 2025</span><span style=\"font-family:'Nirmala UI'\"> में, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लेनोवो</span><span style=\"font-family:'Nirmala UI'\"> ने </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारत का सबसे बड़ा AI सुपरकंप्यूटर</span><span style=\"font-family:'Nirmala UI'\"> बनाने के लिए भारतीय AI फर्म </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कृत्रीम</span><span style=\"font-family:'Nirmala UI'\"> (भावेश अग्रवाल द्वारा स्थापित) के साथ एक रणनीतिक साझेदारी की घोषणा की।</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">उद्देश्य:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लार्ज लैंग्वेज मॉडल (LLMs)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> के प्रशिक्षण के लिए उच्च-प्रदर्शन वाले इंफ्रास्ट्रक्चर का विकास करना।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मुख्य तकनीक:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> यह परियोजना ऊर्जा दक्षता को अधिकतम करने के लिए </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">लेनोवो की नेपच्यून लिक्विड कूलिंग तकनीक</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> को शामिल करेगी।</span></li></ul>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत में किस नदी पर राष्ट्रीय जलमार्ग 57 (NW-57) विकसित किया गया है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कोपिली नदी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जुआरी नदी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गंडक नदी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">काली नदी</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नदी:</span><span style=\"font-family:'Nirmala UI'\"> कोपिली नदी (ब्रह्मपुत्र की एक दक्षिण तट सहायक नदी)।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्थान:</span><span style=\"font-family:'Nirmala UI'\"> असम, कामरूप और आस-पास के जिलों से होकर बहती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लंबाई:</span><span style=\"font-family:'Nirmala UI'\"> कोपिली के ब्रह्मपुत्र के साथ संगम से लेकर तेलियागाँव रेलवे ब्रिज तक ~48 किमी का खंड NW57 के रूप में नामित।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">संचालन:</span><span style=\"font-family:'Nirmala UI'\"> 2 अगस्त, 2025, पोत MV VV गिरि द्वारा </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">300 मीट्रिक टन सीमेंट</span><span style=\"font-family:'Nirmala UI'\"> के पहले माल ढुलाई के साथ।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कनेक्टिविटी:</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">NW</span><span style=\"font-family:'Nirmala UI'\">2 (ब्रह्मपुत्र नदी) से जुड़ा हुआ है, जो असम में मल्टीमॉडल परिवहन गलियारों को सक्षम बनाता है।</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पश्चिमी घाट के बारे में निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. इसे विश्व के जैव विविधता हॉटस्पॉट में से एक के रूप में मान्यता प्राप्त है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. यह महाराष्ट्र से कन्याकुमारी तक बिना किसी बड़े अंतराल के एक अटूट श्रृंखला बनाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऊपर दिए गए कथनों में से कौन सा/से सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I और II दोनों</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो I और न ही II</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन I सही है</span><span style=\"font-family:'Nirmala UI'\"> - पश्चिमी घाट एक यूनेस्को विश्व धरोहर स्थल और दुनिया के आठ मान्यता प्राप्त </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">जैव विविधता हॉटस्पॉट</span><span style=\"font-family:'Nirmala UI'\"> में से एक है, जो कई स्थानिक प्रजातियों का घर है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">कथन II गलत है</span><span style=\"font-family:'Nirmala UI'\"> - यह श्रृंखला </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अटूट नहीं है</span><span style=\"font-family:'Nirmala UI'\">; यह केरल में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">पालघाट दर्रे (पालक्काड़ दर्रे)</span><span style=\"font-family:'Nirmala UI'\"> से बाधित है, जो एक प्राकृतिक गलियारा है जिसने ऐतिहासिक रूप से तमिलनाडु और केरल के बीच एक मार्ग के रूप में कार्य किया है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'केवल I' है।</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">दिल्ली के महरौली में स्थित प्रसिद्ध 'लौह स्तंभ', जो जंग के प्रति अपने उल्लेखनीय प्रतिरोध के लिए जाना जाता है, किस काल से संबंधित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मौर्य काल</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गुप्त काल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कुषाण काल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चोल काल</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लौह स्तंभ</span><span style=\"font-family:'Nirmala UI'\"> को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">गुप्त काल</span><span style=\"font-family:'Nirmala UI'\"> के दौरान, संभवतः </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">चंद्रगुप्त द्वितीय</span><span style=\"font-family:'Nirmala UI'\"> के शासनकाल में बनवाया गया था, और यह अपनी उच्च-फास्फोरस, कम-सल्फर संरचना के लिए प्रसिद्ध है जिसने इसे 1,600 से अधिक वर्षों तक जंग से बचाया है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अतिरिक्त जानकारी: यह प्राचीन भारत में प्राप्त उन्नत धातुकर्म कौशल का एक मजबूत प्रमाण है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर गुप्त काल है।</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उस्ताद अहमद लाहौरी किस यूनेस्को विश्व धरोहर स्थल के मुख्य वास्तुकार के रूप में प्रसिद्ध हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हुमायूँ का मकबरा, दिल्ली</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ताजमहल, आगरा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">फतेहपुर सीकरी, आगरा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जैसलमेर किला, राजस्थान</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सही उत्तर है: </span><span style=\"font-family:'Nirmala UI'\">ताजमहल, आगरा</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;line-height:115%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">उस्ताद अहमद लाहौरी</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ताजमहल (1632–1653)</span><span style=\"font-family:'Nirmala UI'\"> के मुख्य वास्तुकार।</span></li><li style=\"margin-left:10.52pt;line-height:115%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मुमताज महल की याद में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">मुगल सम्राट शाहजहाँ</span><span style=\"font-family:'Nirmala UI'\"> द्वारा बनवाया गया।</span></li><li style=\"margin-left:10.52pt;line-height:115%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">यूनेस्को विश्व धरोहर स्थल (1983)</span><span style=\"font-family:'Nirmala UI'\"> के रूप में मान्यता प्राप्त।</span></li><li style=\"margin-left:10.52pt;margin-bottom:10pt;line-height:115%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अपनी </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सफेद संगमरमर वास्तुकला</span><span style=\"font-family:'Nirmala UI'\"> और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">प्रेम के प्रतीक</span><span style=\"font-family:'Nirmala UI'\"> के लिए प्रसिद्ध।</span></li></ul>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मैत्रक वंश के निम्नलिखित शासकों में से किसने प्रयाग में हर्षवर्धन की सभा में भाग लिया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ध्रुवसेन द्वितीय</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">रुद्रसेन द्वितीय</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">प्रभाकरवर्धन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">गृहवर्मन</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सही उत्तर </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ध्रुवसेन द्वितीय</span><span style=\"font-family:'Nirmala UI'\"> (जिसे बालादित्य के नाम से भी जाना जाता है) है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">यह विकल्प क्यों सही है:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">👑</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">मैत्रक शासक</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: ध्रुवसेन द्वितीय ने वल्लभी की अपनी राजधानी से गुजरात और सौराष्ट्र पर शासन किया।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">🤝</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">शाही संबंध</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: वह राजा हर्षवर्धन का समकालीन अधीनस्थ था और हर्ष की पुत्री से विवाहित था।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-family:'Segoe UI Emoji';font-size:12pt\">📜</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ऐतिहासिक अभिलेख</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">: प्रसिद्ध चीनी बौद्ध यात्री ह्वेनसांग (ज़ुआनज़ांग) ने विशेष रूप से दर्ज किया है कि ध्रुवसेन द्वितीय ने प्रयाग में आयोजित हर्षवर्धन की भव्य धार्मिक सभा (महा मोक्ष परिषद) में भाग लिया था।</span></li></ul>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">स्वदेशी आंदोलन (1905) के बारे में निम्नलिखित कथनों पर विचार करें:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I. इसे लॉर्ड कर्जन द्वारा बंगाल के विभाजन के जवाब में शुरू किया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">II. इसने ब्रिटिश वस्तुओं के बहिष्कार और स्वदेशी उद्योगों को बढ़ावा देने पर जोर दिया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ऊपर दिए गए कथनों में से कौन सा/से सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">I और II दोनों</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल I</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">न तो I और न ही II</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">दोनों कथन सही हैं।</span><span style=\"font-family:'Nirmala UI'\"> वायसराय </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लॉर्ड कर्जन</span><span style=\"font-family:'Nirmala UI'\"> द्वारा </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बंगाल का विभाजन (1905)</span><span style=\"font-family:'Nirmala UI'\">, जिसे 'फूट डालो और राज करो' की रणनीति के रूप में देखा गया, ने </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्वदेशी आंदोलन</span><span style=\"font-family:'Nirmala UI'\"> को जन्म दिया, जिसने </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ब्रिटिश वस्तुओं का बहिष्कार</span><span style=\"font-family:'Nirmala UI'\"> और आर्थिक प्रतिरोध के रूप में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्वदेशी उद्योगों</span><span style=\"font-family:'Nirmala UI'\"> को बढ़ावा दिया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अतिरिक्त जानकारी: इस आंदोलन ने राष्ट्रीय शिक्षा आंदोलन को भी जन्म दिया, जिससे बंगाल नेशनल कॉलेज जैसे संस्थानों की स्थापना हुई।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर 'I और II दोनों' है।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">74वें संशोधन अधिनियम, 1992 के संबंध में निम्नलिखित कथनों पर विचार करें।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1. इसने भारत के संविधान में एक नया भाग IX-A जोड़ा है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2. अधिनियम ने संविधान में एक नई 10वीं अनुसूची भी जोड़ी है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">3. यह अधिनियम प्रत्येक राज्य में तीन प्रकार की नगरपालिकाओं के गठन का प्रावधान करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">4. इसमें अनुच्छेद 243-P से 243-ZG तक के प्रावधान शामिल हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उपरोक्त कथनों में से कौन से सही हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल 2 और 4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल 1, 3 और 4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सही उत्तर: केवल 1, 3 और 4</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">स्पष्टीकरण:</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1. इसने भारत के संविधान में एक नया भाग IX</span><span style=\"font-family:'Nirmala UI'\">A जोड़ा है। </span><span style=\"font-family:'Symbol'\">✔</span><span style=\"font-family:'Nirmala UI'\"> सही। भाग IXA </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नगरपालिकाओं</span><span style=\"font-family:'Nirmala UI'\"> से संबंधित है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">2. अधिनियम ने संविधान में एक नई 10वीं अनुसूची भी जोड़ी है।</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Symbol'\">✘</span><span style=\"font-family:'Nirmala UI'\"> गलत। </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">10वीं अनुसूची</span><span style=\"font-family:'Nirmala UI'\"> दलबदल विरोधी कानून (1985) से संबंधित है। 74वें संशोधन ने कोई नई अनुसूची </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नहीं</span><span style=\"font-family:'Nirmala UI'\"> जोड़ी।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">3. यह अधिनियम प्रत्येक राज्य में तीन प्रकार की नगरपालिकाओं के गठन का प्रावधान करता है।</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Symbol'\">✔</span><span style=\"font-family:'Nirmala UI'\"> सही। यह निम्नलिखित का प्रावधान करता है:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">नगर पंचायत (संक्रमणकालीन क्षेत्रों के लिए)</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">नगर परिषद (छोटे शहरी क्षेत्रों के लिए)</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\">नगर निगम (बड़े शहरी क्षेत्रों के लिए)</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">4. इसमें अनुच्छेद 243</span><span style=\"font-family:'Nirmala UI'\">P से 243ZG तक के प्रावधान शामिल हैं। </span><span style=\"font-family:'Symbol'\">✔</span><span style=\"font-family:'Nirmala UI'\"> सही। ये अनुच्छेद नगरपालिकाओं की परिभाषाओं, संरचना, शक्तियों, चुनावों, वित्त आदि को कवर करते हैं।</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत का 'आर्थिक सर्वेक्षण' हर साल, आमतौर पर केंद्रीय बजट से एक दिन पहले, कौन सा निकाय जारी करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वित्त मंत्रालय (आर्थिक कार्य विभाग)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारतीय रिज़र्व बैंक</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नीति आयोग</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">योजना आयोग</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आर्थिक सर्वेक्षण</span><span style=\"font-family:'Nirmala UI'\"> मुख्य आर्थिक सलाहकार (CEA) के मार्गदर्शन में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आर्थिक कार्य विभाग, वित्त मंत्रालय</span><span style=\"font-family:'Nirmala UI'\"> द्वारा तैयार किया जाता है, और पिछले वर्ष के दौरान देश के आर्थिक प्रदर्शन की समीक्षा करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अतिरिक्त जानकारी: इसे संसद में पेश किया जाता है और यह नीतिगत सिफारिशें देता है, हालांकि ये बाद के केंद्रीय बजट पर बाध्यकारी नहीं होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर वित्त मंत्रालय (आर्थिक कार्य विभाग) है।</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">'कानून का शासन' की अवधारणा, जो मनमानी शक्ति पर कानून की सर्वोच्चता पर जोर देती है, किस विधिवेत्ता द्वारा प्रतिपादित की गई थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ए.वी. डाइसी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आइवर जेनिंग्स</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मॉन्टेस्क्यू</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जॉन लॉक</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक ब्रिटिश संवैधानिक सिद्धांतकार </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ए.वी. डाइसी</span><span style=\"font-family:'Nirmala UI'\"> ने अपने कार्य 'इंट्रोडक्शन टू द स्टडी ऑफ द लॉ ऑफ द कॉन्स्टिट्यूशन' (1885) में </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">'कानून का शासन'</span><span style=\"font-family:'Nirmala UI'\"> की आधुनिक अवधारणा का प्रतिपादन किया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अतिरिक्त जानकारी: डाइसी के कानून के शासन में तीन तत्व शामिल हैं - कानून की सर्वोच्चता, कानून के समक्ष समानता और सामान्य कानूनी प्रक्रियाओं की प्रधानता - ये सभी भारतीय संविधान के अनुच्छेद 14 में परिलक्षित होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर ए.वी. डाइसी है।</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">कौन सा निकाय संघ और राज्यों के बीच करों की शुद्ध आय के वितरण की सिफारिश करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">वित्त आयोग</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">योजना आयोग</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नीति आयोग</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जीएसटी परिषद</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">वित्त आयोग</span><span style=\"font-family:'Nirmala UI'\">, जो </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अनुच्छेद 280</span><span style=\"font-family:'Nirmala UI'\"> के तहत हर पांच साल में गठित होता है, यह सिफारिश करता है कि केंद्र और राज्यों के बीच कर राजस्व कैसे साझा किया जाना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अतिरिक्त जानकारी: 16वां वित्त आयोग 2026-31 की अवधि के लिए गठित किया गया है; इसकी सिफारिशें, हालांकि कानूनी रूप से बाध्यकारी नहीं हैं, लेकिन परंपरागत रूप से सरकार द्वारा स्वीकार की जाती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर वित्त आयोग है।</span></p>", "question_headin :'Nirmala UI'\">जब स्रोत डेटा बदलता है तो इसे आसानी से अपडेट किया जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अन्य विकल्प:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">डेटा सत्यापन</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> इनपुट मानों को प्रतिबंधित करता है।</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">डेटा डुप्लीकेट</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> डुप्लीकेट हटाता है।</span></li><li style=\"margin-left:27.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">एक्सेस से</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> MS एक्सेस से डेटा आयात करता है।</span></li></ul>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जनवरी 2026 में ITBP के महानिदेशक (DG height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">योगी आदित्यनाथ</span><span style=\"font-family:'Nirmala UI'\"> और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">हिमंत बिस्वा सरमा</span><span style=\"font-family:'Nirmala UI'\"> जैसे प्रमुख नेताओं के समर्थन के साथ, यह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">समकालीन भारतीय राजनीति के भीतर वैचारिक विमर्श</span><span style=\"font-family:'Nirmala UI'\"> को दर्शाता है।</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नवंबर 2025 में, सैयद मोदी इंडिया इंटरनेशनल बैडमिंटन टूर्नामेंट की मेजबानी किस शहर ने की?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">हैदराबाद</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मुंबई</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लखनऊ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नई दिल्ली</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सैयद मोदी इंडिया इंटरनेशनल बैडमिंटन टूर्नामेंट</span><span style=\"font-family:'Nirmala UI'\"> की मेजबानी </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">लखनऊ</span><span style=\"font-family:'Nirmala UI'\"> में की गई।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">यह आयोजन </s ंज ग्रैंडमास्टर बने।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">16 वर्षीय विलक्षण खिलाड़ी ने स्टॉकहोम, स्वीडन में 8वें जीएम टूर्नामेंट में अपना अंतिम ग्रैंडमास्टर (जीएम) मानदंड हासिल किया और अनिवार्य 2500 एलो रेटिंग अंक को पार कर लिया। इस ऐतिहासिक जीत ने उन्हें </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">भारत का 94वां ग्रैंडमास्टर</span><span style=\"font-family:'Nirmala UI'\"> बनाया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">एक \"ग्रैंडमास्टर\" अंतर्राष्ट्रीय शतरंज महासंघ (FIDE) द्वारा शतरंज खिलाड़ियों को दिया जाने वाला सर्वोच्च आजीवन खिताब है। खिलाड़ियों को यह खिताब अर्जित करने के लिए तीन कड़े प्रदर्शन मानदंड (जिन्हें नॉर्म कहा जाता है) हासिल करने और उच्च कौशल स्कोर बनाए रखने की आवश्यकता होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">95</span><span style=\"line-height:115%;font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Nirmala UI'\">वां</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> – अरोन्याक घोष (कोलकाता), पश्चिम बंगाल से 12</span><span style=\"line-height:115%;font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Nirmala UI'\">वें</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> ग्रैंडमास्टर</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">किस टीम ने फाइनल में केरल को हराकर संतोष ट्रॉफी 2025-26 फुटबॉल चैंपियनशिप जीतकर अपना आठवाँ खिताब हासिल किया?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सेवाएं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केरल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बंगाल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">पंजाब</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">सर्विसेज़</span><span style=\"font-family:'Nirmala UI'\"> ने भारत के प्रमुख अंतर-राज्यीय फुटबॉल टूर्नामेंट </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">संतोष ट्रॉफी 2025-26</span><span style=\"font-family:'Nirmala UI'\"> के फाइनल में केरल को हराकर अपना आठवाँ खिताब जीता।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर सर्विसेज़ है।</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">नवंबर 2025 में लॉन्च की गई सिकल सेल रोग के लिए भारत की पहली स्वदेशी CRISPR-आधारित जीन थेरेपी का नाम क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">GENO-1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">CRISPR-X</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बिरसा 101</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सिकल का इलाज</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सिकल सेल रोग के लिए भारत की पहली स्वदेशी CRISPR-आधारित जीन थेरेपी को </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">बिरसा 101</span><span style=\"font-family:'Nirmala UI'\"> कहा जाता है। इसका नाम जनजातीय स्वतंत्रता सेनानी भगवान बिरसा मुंडा के नाम पर रखा गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">थेरेपी कैसे काम करती है:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">यह रोग:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> सिकल सेल रोग एक आनुवंशिक रक्त विकार है। यह लाल रक्त कोशिकाओं को गोल आकार से बदलकर कठोर \"सिकल\" (हंसिया) आकार में बदल देता है। ये कोशिकाएँ रक्त प्रवाह को अवरुद्ध करती हैं और गंभीर दर्द का कारण बनती हैं।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">यह तकनीक:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> यह थेरेपी </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">CRISPR</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> का उपयोग करती है, जो DNA को संपादित करने के लिए छोटी \"आणविक कैंची\" के रूप में कार्य करने वाला एक उपकरण है। यह मरीज की अपनी स्टेम कोशिकाओं के अंदर दोषपूर्ण जीन को ठीक करता है ताकि शरीर स्वस्थ, गोल रक्त कोशिकाएं बना सके।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">इसका प्रभाव:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> द्वारा विकसित, यह इलाज को काफी सस्ता बनाता है। जबकि विदेशी जीन थेरेपी की लागत लगभग ₹20 करोड़ है, बिरसा 101 का लक्ष्य कीमत को लगभग ₹50 लाख तक कम करना है।</span></li></ul>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">निम्नलिखित कथनों पर विचार करें:</span></p><ol type=\"1\"><li style=\"margin-left:14.07pt;margin-bottom:10pt;line-height:115%;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span>औपनिवेशिक शासन के दौरान गिरावट के बाद 20वीं शताब्दी में ओडिसी नृत्य को पुनर्जीवित किया गया था।</span></li><li style=\"margin-left:14.07pt;margin-bottom:10pt;line-height:115%;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span>गुरु केलुचरण महापात्र को ओडिसी के एक महान प्रतिपादक के रूप में माना जाता है।</span></li><li style=\"margin-left:14.07pt;margin-bottom:10pt;line-height:115%;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span>ओडिसी प्रदर्शन अक्सर रामायण और महाभारत की कहानियों को दर्शाते हैं।</span></li></ol><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">उपरोक्त कथनों में से कौन सा/से सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ये सभी</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">सभी तीनों कथन सही हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">20वीं सदी का पुनरुद्धार:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> ब्रिटिश औपनिवेशिक शासन के दौरान पारंपरिक मंदिर नर्तकियों के दमन के कारण </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ओडिसी नृत्य</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> में गिरावट आई। इसे 20वीं सदी के मध्य में विद्वानों और गुरुओं द्वारा पुनर्जीवित और पुनर्निर्मित किया गया, जिन्होंने प्राचीन ग्रंथों और मंदिर की मूर्तियों का अध्ययन किया।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">महान प्रतिपादक:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">गुरु केलुचरण महापात्र</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> को व्यापक रूप से प्राथमिक वास्तुकार और एक महान गुरु के रूप में मान्यता प्राप्त है, जिन्होंने इस नृत्य को विश्व स्तर पर लोकप्रिय बनाया।</span></li><li style=\"margin-left:9.6pt;margin-bottom:10pt;line-height:115%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पौराणिक विषय-वस्तु:</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">ओडिसी प्रदर्शन</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> अक्सर </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">हिंदू पौराणिक महाकाव्यों</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> को जीवंत करते हैं, जिसमें अक्सर </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">रामायण</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> और </span><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">महाभारत</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> दोनों की प्रमुख कहानियों और भावनात्मक विषयों को दर्शाया जाता है।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भारत के सबसे पुराने शास्त्रीय नृत्य रूपों में से एक </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ओडिसी</span><span style=\"font-family:'Nirmala UI'\">, अपनी विशिष्ट मुद्राओं (जैसे त्रिभंगी मुद्रा) को सीधे ओडिशा में पाए जाने वाले मंदिर की मूर्तियों से लेता है, विशेष रूप से कोणार्क सूर्य मंदिर में।</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">'रॉक गार्डन', एक मूर्तिकला पार्क जो पूरी तरह से औद्योगिक और घरेलू अपशिष्ट पदार्थों से बना है, किस शहर में स्थित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">चंडीगढ़</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जयपुर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">लखनऊ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">भोपाल</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">चंडीगढ़ का रॉक गार्डन</span><span style=\"font-family:'Nirmala UI'\">, जिसे कलाकार </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">नेक चंद</span><span style=\"font-family:'Nirmala UI'\"> ने 1957 में बनाना शुरू किया था, टूटी हुई चूड़ियों, सिरेमिक बर्तनों और औद्योगिक कबाड़ जैसे पुनर्नवीनीकृत अपशिष्ट पदार्थों से बना है।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">अतिरिक्त जानकारी: यह नेक चंद की एक गुप्त शौक परियोजना के रूप में शुरू हुआ और बाद में इसे आधिकारिक मान्यता मिली, जिससे यह भारत के सबसे अधिक देखे जाने वाले पर्यटन स्थलों में से एक बन गया।</span></p><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">अतः, सही उत्तर चंडीगढ़ है।</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">आधुनिक नृत्य शैली के प्रणेता उदय शंकर को 1971 में निम्नलिखित में से किस राष्ट्रीय पुरस्कार से सम्मानित किया गया था?</span></p pt;font-family:serif;font-size:10pt\"><span style=\"line-height:115%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">पद्म विभूषण (1971)</span><span style=\"line-height:115%;font-size:12pt;font-family:'Nirmala UI'\"> – भारत का दूसरा सर्वोच्च नागरिक पुरस्कार।</span></li></ul><p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">महत्व:</span><span style=\"font-family:'Nirmala UI'\"> उनके काम ने </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आधुनिक भारतीय नृत्य</span><span style=\"font-family:'Nirmala UI'\"> की नींव रखी, जिसने उनकी पीढ़ी के कलाकारों को प्रभावित किया, जिनमें उनके भाई </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">रवि शंकर</span><span style=\"font-family:'Nirmala UI'\"> (सितार वादक) और उनके बच्चे </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">आनंद शंकर</span><span style=\"font-family:'Nirmala UI'\"> (संगीतकार) और </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ममता शंकर</span><span style=\"font-family:'Nirmala UI'\"> (नर्तक/अभिनेत्री) शामिल हैं।</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">बास्केटबॉल खेल में कौन सी रक्षात्मक रणनीति प्रत्येक डिफेंडर को आकार और क्षमता के आधार पर एक विशिष्ट आक्रामक खिलाड़ी की रखवाली करने का कार्य देती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">मैन-टू-मैन डिफेंस</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">जोन डिफेंस</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:10pt;line-height:115%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">फुल कोर्ट प्रेस</span></p>", "option4": " <p style=\"margin-top
