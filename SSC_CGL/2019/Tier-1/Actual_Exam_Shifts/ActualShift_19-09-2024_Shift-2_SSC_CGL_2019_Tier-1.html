                    options_hi: ["<p>1.2 km</p>", "<p>1.4 km</p>",
                                "<p>1.8 km</p>", "<p>1.6 km</p>"],
                    solution_en: "<p>72.(c) <br>Relative speed = 10 - 9 = 1 km/h = <math display=\"inline\"><mfrac><mrow><mn>5</mn></mrow><mrow><mn>18</mn></mrow></mfrac></math> m/s<br>Time taken by policeman to catch the thief = <math display=\"inline\"><mfrac><mrow><mn>200</mn></mrow><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>18</mn></mrow></mfrac></mrow></mfrac></math> = 720 second<br>Distance travel by thief in 720 seconds = 720 &times; 9 <math display=\"inline\"><mo>&#215;</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>18</mn></mrow></mfrac></math> m =1800 m or 1.8 km</p>",
                    solution_hi: "<p>72.(c) <br>सापेक्ष गति = 10 - 9 = 1 किमी/घंटा = <math display=\"inline\"><mfrac><mrow><mn>5</mn></mrow><mrow><mn>18</mn></mrow></mfrac></math> मीटर/सेकेंड<br>पुलिसकर्मी द्वारा चोर को पकड़ने में लगा समय = <math display=\"inline\"><mfrac><mrow><mn>200</mn></mrow><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>18</mn></mrow></mfrac></mrow></mfrac></math> = 720 सेकंड<br>चोर द्वारा 720 सेकंड में तय की गई दूरी = 720 &times; 9 <math display=\"inline\"><mo>&#215;</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>18</mn></mrow></mfrac></math> मीटर =1800 मीटर or 1.8 किमी</p>",

                    question_hi: "<p>73. दी गई संख्याओं A, B, C ओं और D में से कौन-सी संख्या 11 से विभाज्य नहीं है?<br>A = 712712 <br>B = 177210 <br>C = 64614 <br>D = 756148</p>",

                    solution_en: "<p>73.(b) Divisibility rule of 11 : Difference between sum of digit odd places and sum of digits at even places is either 0 or multiple of 11 <br>By checking all options one by one option (b) does not satisfy this condition <br>756148 = (7 + 6 + 4) - (5 + 1 + 8 ) <br>= 17 - 14 = 3 <math style=\"font-family:Verdana\" display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8800;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>0</mn><mi mathvariant=\"normal\">&#160;</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><mi>Multiple</mi><mi mathvariant=\"normal\">&#160;</mi><mi>of</mi><mi mathvariant=\"normal\">&#160;</mi><mn>11</mn><mi mathvariant=\"normal\">&#160;</mi></math><br>&there4; Option (b) is not divisible by 11</p>",
                    solution_hi: "<p>73.(b) 11 का विभाज्यता नियम: विषम स्थानों के अंकों के योग और सम स्थानों के अंकों के योग के बीच का अंतर या तो 0 है या 11 का गुणक है <br>सभी विकल्पों को एक-एक करके जांचने पर विकल्प (b) इस शर्त को पूरा नहीं करता है <br>756148 = (7 + 6 + 4) - (5 + 1 + 8 ) <br>= 17 - 14 = 3 <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8800;</mo></math> 0 , 11 से विभाज्य<br>&there4; विकल्प (b) 11 से विभाज्य नहीं है</p>",

                questions.push({
                    id: "74",
                    section: "17",
                    question_en: "<p>74. The price of an item is increased twice successively. The final price is ₹2,295 and initial price was ₹1,000. The percentage increment the second time was twice the percentage increment the first time. By what percentage was the price increased the second time?</p>",
                    question_hi: "<p>74. किसी वस्तु की कीमत लगातार दो बार बढ़ाई जाती है। अंतिम कीमत ₹2,295 है और प्रारंभिक कीमत ₹1,000 थी। दूसरी बार प्रतिशत वृद्धि, पहली बार प्रतिशत वृद्धि से दोगुनी थी। दूसरी बार कीमत में कितने प्रतिशत की वृद्धि की गई?</p>",
                    options_en: ["<p>35%</p>", "<p>65%</p>",

                    solution_en: "<p>74.(c) <br>As we know , percentage increment the second time was twice the percentage increment the first time<br>By using hit and trial method , let first increment = 35%<br><math display=\"inline\"><mo>&#8658;</mo></math> 1000 &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>135</mn><mn>100</mn></mfrac></math> &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>170</mn><mn>100</mn></mfrac></math> = 2295<br><math display=\"inline\"><mo>&#8658;</mo></math> 2295 = 2295 <br>&there4; This satisfy the condition , hence price increased in the second time = 70%</p>",
                    solution_hi: "<p>74.(c) <br>जैसा कि हम जानते हैं, दूसरी बार प्रतिशत वृद्धि पहली बार प्रतिशत वृद्धि से दोगुनी थी<br>हिट और ट्रायल विधि का उपयोग करके, मान लीजिए कि पहली वृद्धि = 35%<br><math display=\"inline\"><mo>&#8658;</mo></math> 1000 &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>135</mn><mn>100</mn></mfrac></math> &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>170</mn><mn>100</mn></mfrac></math> = 2295<br><math display=\"inline\"><mo>&#8658;</mo></math> 2295 = 2295 <br>&there4; यह शर्त को पूरा करता है, इसलिए दूसरी बार कीमत में वृद्धि = 70%</p>",

                    section: "7",
                    question_en: "<p>76. The following sentence has been divided into three segments. One of them may contain an error. Select the option that has the segment with the error. If you don&rsquo;t find any error, select &lsquo;No error&rsquo; as your answer. <br>Mr. Ali&rsquo;s shop / is further to / the hospital.</p>",
                    question_hi: "<p>76. The following sentence has been divided into three segments. One of them may contain an error. Select the option that has the segment with the error. If you don&rsquo;t find any error, select &lsquo;No error&rsquo; as your answer. <br>Mr. Ali&rsquo;s shop / is further to / the hospital.</p>",

                    solution_en: "<p>76.(a) is further to<br>&lsquo;Farther than&rsquo; will be used instead of &lsquo;further to&rsquo;. &lsquo;Further&rsquo; is used for metaphorical distance where &lsquo;farther&rsquo; is used for physical distance. The given sentence is talking about the physical distance between Mr. Ali&rsquo;s shop and the hospital. Hence, &lsquo;farther than&rsquo; is the most appropriate answer.</p>",
                    solution_hi: "<p>76.(a) is further to<br>&lsquo;Further to&rsquo; के स्थान पर &lsquo;Farther than&rsquo; का प्रयोग होगा। &lsquo;Further&rsquo; का प्रयोग metaphorical distance के लिए किया जाता है, जबकि &lsquo;farther&rsquo; का प्रयोग physical distance के लिए किया जाता है। दिया गया sentence, Mr. Ali की दुकान और अस्पताल के बीच की physical distance के बारे में बात कर रहा है। अतः, &lsquo;farther than&rsquo; सबसे उपयुक्त उत्तर है।</p>",

        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
