                questions.push({
                    id: "55",
                    section: "17",
                    question_en: "<p>55. <span style=\"font-family: Times New Roman;\">Fourth proportion to 12, 18 and 6 is the same as the third proportion to k and 6. What is the value of K?</span></p>",
                    question_hi: "<p>5<span style=\"font-family: Times New Roman;\">5. </span><span style=\"font-family: Baloo;\">12, 18 और </span><span style=\"font-family: Baloo;\">6 का चौथा अनुपात k</span><span style=\"font-family: Baloo;\"> और 6 के तीसरे अनुपात के समान है। K का मान क्या है?</span></p>",
                    options_en: ["<p>3&radic;6</p>", "<p>13.5</p>", 
                                "<p>4</p>", "<p>3</p>"],
                    options_hi: ["<p>3&radic;6<span style=\"font-family: Gungsuh;\"> </span></p>", "<p>13.5</p>",
                                "<p>4</p>", "<p>3</p>"],
                    solution_en: "<p>55.(c)<br>Fourth proportion = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>18</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>6</mn></mrow><mn>12</mn></mfrac></math> = 9<br>Third proportion =<strong id=\"docs-internal-guid-8d7151c7-7fff-df9a-5e59-8644399f2b75\"> </strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"normal\">k</mi><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>9</mn></mrow><mrow><mn>6</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>6</mn></mrow></mfrac></math> = 4</p>",
                    solution_hi: "<p>55.(c)<br><span style=\"font-family: Baloo;\">चौथा अनुपात</span><span style=\"font-family: Times New Roman;\"> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>18</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>6</mn></mrow><mn>12</mn></mfrac></math>&nbsp;</span><span style=\"font-family: Times New Roman;\">= 9</span><br><span style=\"font-family: Baloo;\">तीसरा अनुपात</span><span style=\"font-family: Times New Roman;\"> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"normal\">k</mi><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>9</mn></mrow><mrow><mn>6</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>6</mn></mrow></mfrac></math></span><span style=\"font-family: Times New Roman;\">&nbsp;</span><span style=\"font-family: Times New Roman;\">= 4</span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "56",
                    section: "17",
                    question_en: "<p>56. <span style=\"font-family: Times New Roman;\">If a number is first increased by 15% then reduced by 15%, it results in 782. If the same number is first reduced by 25%, then increased by 25% and again reduced by 20%, then what will be the resulting number?</span></p>",
                    question_hi: "<p>5<span style=\"font-family: Times New Roman;\">6. </span><span style=\"font-family: Baloo;\">यदि किसी संख्या में पहले 15% की वृद्धि की जाती है फिर 15% की कमी की जाती है, तो इसका परिणाम 782 होता है। यदि उसी संख्या को पहले 25% घटाया जाता है, फिर 25% बढ़ाया जाता है और फिर से 20% कम किया जाता है, तो परिणामी संख्या क्या होगी?</span></p>",
                    options_en: ["<p>712</p>", "<p>150</p>", 
                                "<p>750</p>", "<p>600</p>"],
                    options_hi: ["<p>712</p>", "<p>150</p>",
                                "<p>750</p>", "<p>600</p>"],
                    solution_en: "<p>56.(d) &nbsp;<br><span style=\"font-weight: 400;\">Change in overall percentage = +15 - 15 - </span><span style=\"font-weight: 400;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>225</mn><mn>100</mn></mfrac></math> </span><span style=\"font-weight: 400;\">= -2.25%</span><br><span style=\"font-weight: 400;\">Number =</span><span style=\"font-weight: 400;\"> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>100</mn><mrow><mn>97</mn><mo>.</mo><mn>75</mn></mrow></mfrac></math> &times; </span><span style=\"font-weight: 400;\">782 </span><span style=\"font-weight: 400;\">= 800</span><br><span style=\"font-weight: 400;\">Required number = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>800</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mfrac><mn>75</mn><mn>100</mn></mfrac><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mfrac><mn>125</mn><mn>100</mn></mfrac><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mfrac><mn>80</mn><mn>100</mn></mfrac></math> </span><span style=\"font-weight: 400;\">= 600</span></p>",
                    solution_hi: "<p>56.(d)<br><span style=\"font-family: Baloo;\">कुल प्रतिशत में बदलाव </span><span style=\"font-family: Times New Roman;\">= +15 - 15 - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>225</mn><mn>100</mn></mfrac></math> </span><span style=\"font-family: Times New Roman;\">= -2.25%</span><br><span style=\"font-family: Baloo;\">संख्या </span><span style=\"font-family: Times New Roman;\">=</span><span style=\"font-family: Times New Roman;\"> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>100</mn><mrow><mn>97</mn><mo>.</mo><mn>75</mn></mrow></mfrac></math> &times; 782 </span><span style=\"font-family: Times New Roman;\">= 800</span><br><span style=\"font-family: Baloo;\">आवश्यक संख्या&nbsp;</span><span style=\"font-family: Times New Roman;\">= <span style=\"font-weight: 400;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>800</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mfrac><mn>75</mn><mn>100</mn></mfrac><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mfrac><mn>125</mn><mn>100</mn></mfrac><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mfrac><mn>80</mn><mn>100</mn></mfrac></math> </span></span><span style=\"font-family: Times New Roman;\">= 600</span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "57",
                    section: "17",
                    question_en: "<p>57. <span style=\"font-family: Cardo;\">In &Delta;ABC, DE ∥ AB, where D and E are the points on sides AC and BC, respectively. If AD = x - 3, AC = 2x, BE = x - 2 and BC = 2x + 3, then what is the value of x ?</span></p>",

                    solution_hi: "<p>57.(d)<br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1667297370/word/media/image30.png\"><br><span style=\"font-family: Times New Roman;\">&Delta;ABC &sim; </span><span style=\"font-family: Times New Roman;\">&Delta;DEC</span><br><span style=\"font-family: Times New Roman;\">इसलिए,</span><span style=\"font-family: Times New Roman;\"> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>DC</mi><mi>AC</mi></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mi>CE</mi><mi>CB</mi></mfrac></math></span><br><span style=\"font-family: Times New Roman;\">&rArr;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>3</mn></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">x</mi></mrow></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mrow><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>5</mn></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>3</mn></mrow></mfrac></math></span><br><span style=\"font-family: Times New Roman;\">हल करने पर,&nbsp; x = 9</span></p>",

                questions.push({
                    id: "58",
                    section: "17",
                    question_en: "<p>58. <span style=\"font-family: Times New Roman;\">In a factory, there are 39 workers who have been categorized into five groups (A, B, C, D, E) on the basis of the range of their daily wages (in multiples of Rs.100). It is ensured that the daily wage of no worker is an exact multiple of Rs.100. The distribution is presented through the given histogram.</span><br><strong id=\"docs-internal-guid-7de785b9-7fff-279a-7483-0f3612654148\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXe0QopVhtxGilZu34yeF-0GnuhVgqfkLzlZAipjIJYy7mWUc3fqueBfbt12HeGf2gnO9mbjz5ovbt9nTF5odn7hK1MRIST6zNwU0Eu3FjPz69tj5MqcBr3ZrRb4NEitZg838Sv-3g?key=GWOWfQC8nsZbpJbEWbJXdhmd\" width=\"316\" height=\"204\"></strong><br><span style=\"font-family: Times New Roman;\">If two managers are engaged to supervise the workers, with daily wages ranging between Rs.700 and Rs.800, then what will be the daily wages (nearest to a Rs.) of all members of staff of the factory ?</span></p>",
                    question_hi: "<p>5<span style=\"font-family: Times New Roman;\">8 . </span><span style=\"font-family: Baloo;\">एक कारखाने में, 39 श्रमिक हैं जिन्हें उनके दैनिक वेतन की सीमा (100 रुपये के गुणकों में) के आधार पर पांच समूहों (ए, बी, सी, डी, ई) में वर्गीकृत किया गया है। यह सुनिश्चित किया जाता है कि किसी भी कर्मचारी का दैनिक वेतन 100 रुपये के ठीक गुणक में न हो। वितरण दिए गए हिस्टोग्राम के माध्यम से प्रस्तुत किया जाता है।</span><br><strong id=\"docs-internal-guid-91bd7e43-7fff-8d16-5a29-ac13d3275c46\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXdaREf5B2QjgBsxojVJvPsgfWtWQ9Ui409hVeElrRy_xb6GlGnlU_JIkSTxvRncacBaoVm7kOHP8lIh-zp4JqnigH6OGBj5obFlQBXSiZunbou4n0jDAZrsTIRNz1vkCPDAr9PZrg?key=GWOWfQC8nsZbpJbEWbJXdhmd\" width=\"323\" height=\"210\"></strong><br><span style=\"font-family: Baloo;\">यदि दो प्रबंधक, 700 रुपये और 800 रुपये के बीच दैनिक मजदूरी वाले श्रमिकों की निगरानी के लिए लगे हुए हैं, तो कारखाने के सभी कर्मचारियों के कर्मचारियों की दैनिक मजदूरी (करीब एक रुपये) क्या होगी ?</span></p>",
                    options_en: ["<p>455</p>", "<p>400</p>",

                    solution_en: "<p>58.(a)<br><span style=\"font-family: Times New Roman;\">Wage of the particular worker = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>Upper</mi><mo>&#160;</mo><mi>limit</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mi>lower</mi><mo>&#160;</mo><mi>limit</mi></mrow><mn>2</mn></mfrac></math> </span><br><span style=\"font-family: Times New Roman;\">Total wage of the workers = (250 &times; 5) + (350 &times; 9) + (450 &times; 12) + (550 &times; 11) + (650 &times; 2) = 17,150</span><br><span style=\"font-family: Times New Roman;\">Total wage of the manager = 750 &times; 2 = 1500</span><br><span style=\"font-family: Times New Roman;\">Total wage of the staff = 18650</span><br><span style=\"font-family: Times New Roman;\">Total number of staff = 41</span><br><span style=\"font-family: Times New Roman;\">Average wage =</span><span style=\"font-family: Times New Roman;\"> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>18650</mn><mn>41</mn></mfrac><mo>&#160;</mo><mo>&#8776;</mo></math>&nbsp;</span><span style=\"font-family: Times New Roman;\">455</span></p>",

                questions.push({
                    id: "64",
                    section: "17",
                    question_en: "<p>64. <span style=\"font-family: Times New Roman;\">The following bar graph represents the production of fertilizers by company A and Company B (in 10000 tonnes) over the years from 2005 to 2010. The X-axis represents the years, and the Y-axis represents the production of Fertilizers (in 10000 tonnes).</span><br><strong id=\"docs-internal-guid-143b546b-7fff-81cb-62eb-a38bd8134b92\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXfGlSITFvDjWDh6_Kg_x90w2LtS3EJa2TOlas5Yp0QGki0iEmz4AUmfmZXfqUUKMTz_anKe0Ry_Omgiy50lHr36D0OPLiQZ6mN96VveO6TQjpsFIMT1bZ4onyMQDPU7jedtAzMq6Q?key=GWOWfQC8nsZbpJbEWbJXdhmd\" width=\"400\" height=\"245\"></strong><br><span style=\"font-family: Times New Roman;\">What is the average production (in 10000 tonnes) of fertilizers in 2008, 2009 and 2010 of company A?</span></p>",
                    question_hi: "<p><span style=\"font-family: Times New Roman;\">64. </span><span style=\"font-family: Baloo;\">निम्नलिखित बार ग्राफ 2005 से 2010 के वर्षों में कंपनी ए और कंपनी बी (10000 टन में) द्वारा उर्वरकों के उत्पादन का प्रतिनिधित्व करता है। X-axis वर्षों का प्रतिनिधित्व करता है, और Y-axis उर्वरकों के उत्पादन का प्रतिनिधित्व करता है (10000 टन में) )</span><br><strong id=\"docs-internal-guid-e13a64e3-7fff-c227-69d7-154ecb54d1f2\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXcIoA7qQneE_7o2hDf1zWkGODvgFh6xDXeunGf_YcOgjfwCY1WmRCp-1eHXuxbji_CuwjfZEjLPfM0MYTq0g_dZ6XLBMmyMB7a68GZbgwcCWcW5kBzDl3rIDTCDWxoFwx8ap8DFow?key=GWOWfQC8nsZbpJbEWbJXdhmd\" width=\"400\" height=\"241\"></strong><br><span style=\"font-family: Baloo;\">कंपनी A का 2008, 2009 और 2010 में उर्वरकों का औसत उत्पादन (10000 टन में) कितना है?</span></p>",
                    options_en: ["<p>590</p>", "<p>600</p>", 
                                "<p>620</p>", "<p>570</p>"],
                    options_hi: ["<p>590</p>", "<p>600</p>",
                                "<p>620</p>", "<p>570</p>"],
                    solution_en: "<p>64.(d) <span style=\"font-family: Times New Roman;\">Total production of fertilizers in 2008, 2009 and 2010 of company A = 460 + 580 + 670 = 1710</span><br><span style=\"font-family: Times New Roman;\">Required Average = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1710</mn><mn>3</mn></mfrac></math> </span><span style=\"font-family: Times New Roman;\">= 570</span></p>",
                    solution_hi: "<p>64.(d) <span style=\"font-family: Baloo;\">कंपनी</span><span style=\"font-family: Baloo;\"> A के 2008, 2009 </span><span style=\"font-family: Baloo;\">और</span><span style=\"font-family: Times New Roman;\"> 2010</span><span style=\"font-family: Baloo;\"> में उर्वरकों का कुल उत्पादन </span><span style=\"font-family: Times New Roman;\">= 460 + 580 + 670 = 1710</span><br><span style=\"font-family: Baloo;\">आवश्यक औसत</span><span style=\"font-family: Times New Roman;\"> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1710</mn><mn>3</mn></mfrac></math> </span><span style=\"font-family: Times New Roman;\">= 570</span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "65",
                    section: "17",
                    question_en: "<p>65. <span style=\"font-family: Times New Roman;\">In a circle with centre O, AB and CD are two parallel chords on the same side of the diameter. If AB = 12 cm, CD = 18 cm and distance between the chords AB and CD is 3 cm, then find the radius of the circle (in cm).</span></p>",
                    question_hi: "<p><span style=\"font-family: Times New Roman;\">65. </span><span style=\"font-family: Baloo;\">केंद्र O वाले एक वृत्त में, AB और CD व्यास के एक ही तरफ दो समानांतर जीवाएँ हैं। यदि AB = 12 सेमी, CD = 18 सेमी और जीवाओं AB और CD के बीच की दूरी 3 सेमी है, तो वृत्त की त्रिज्या (सेमी में) ज्ञात कीजिए।</span></p>",
                    options_en: ["<p>15</p>", "<p>12</p>", 
                                "<p>3&radic;13</p>", "<p>9</p>"],
                    options_hi: ["<p>15</p>", "<p>12</p>",
                                "<p>3&radic;13</p>", "<p>9</p>"],
                    solution_en: "<p>65.(c)<br><img src=\"https://ssccglpinnacle.com/images/mceu_74005854311670221866266.png\" width=\"168\" height=\"127\"><br>PB = 6cm, QD = 9cm Let QO= x<br>Applying pythagoras and then equating it<br>PB<sup>2</sup> + PO<sup>2</sup> = QD<sup>2</sup> + QO<sup>2</sup><br>6<sup>2 </sup>+ (x + 3)<sup>2</sup> = 9<sup>2</sup> + x<sup>3</sup><br>On balancing x = 6<br>Radius =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>36</mn><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>81</mn></msqrt></math> = 3<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>13</mn></msqrt></math>cm</p>",
                    solution_hi: "<p>65.(c)<br><img src=\"https://ssccglpinnacle.com/images/mceu_74005854311670221866266.png\" width=\"168\" height=\"127\"><br>PB = 6cm, QD = 9cm माना QO = x<br>पाइथागोरस लगाने और उसे बराबर करने पर&nbsp;<br>PB<sup>2</sup> + PO<sup>2</sup> = QD<sup>2</sup> + QO<sup>2</sup><br>6<sup>2 </sup>+ (x + 3)<sup>2</sup> = 9<sup>2</sup> + x<sup>3</sup><br>x = 6<br>त्रिज्या =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>36</mn><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>81</mn></msqrt></math>&nbsp;= 3<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>13</mn></msqrt></math>cm</p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "66",
                    section: "17",
                    question_en: "<p>66. <span style=\"font-family: Times New Roman;\">A certain sum amounts to Rs. 2,91,600 in 2 years and to Rs. 3,14,928 in 3 years on compound interest compounded annually. How much will be the simple interest (in Rs.) on Rs. 40,000 at the same rate for 2 years?</span></p>",
                    question_hi: "<p><span style=\"font-family: Times New Roman;\">66. </span><span style=\"font-family: Baloo;\">एक निश्चित राशि सालाना चक्रवृद्धि ब्याज पर 2 साल में 291600 रुपये और 3 साल में 314928 रुपये हो जाती है। 2 वर्ष के लिए समान दर पर 40,000 रुपये पर साधारण ब्याज (रु में) कितना होगा? </span></p>",
                    options_en: ["<p>7500<span style=\"font-family: Times New Roman;\"> </span></p>", "<p>6400</p>", 
                                "<p>8000</p>", "<p>9600</p>"],
                    options_hi: ["<p>7500<span style=\"font-family: Times New Roman;\"> </span></p>", "<p>6400</p>",
                                "<p>8000</p>", "<p>9600</p>"],
                    solution_en: "<p>66.(b)&nbsp;Interest for the third year = 314928 - 291600 = 23328<br>Principal for the third year = 291600<br>Rate of interest = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>23328</mn><mn>291600</mn></mfrac></math> &times; 100 = 8%<br>So simple Interest = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>40000</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>2</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>8</mn></mrow><mn>100</mn></mfrac></math> = 6400</p>",
                    solution_hi: "<p>66.(b)&nbsp;तीसरे वर्ष के लिए ब्याज = 314928 - 291600 = 23328<br>तीसरे वर्ष के लिए मूलधन&nbsp; = 291600<br>ब्याज की दर &nbsp;= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>23328</mn><mn>291600</mn></mfrac></math>&nbsp;&times; 100 = 8%<br>साधारण ब्याज =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>40000</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>2</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>8</mn></mrow><mn>100</mn></mfrac></math>&nbsp;= 6400</p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "67",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Times New Roman;\">67. </span><span style=\"font-family: Cardo;\">&Delta;ABC is inscribed in a circle with center O, such that &ang;ACB = 115&deg;, O is joined to A. What is the measure of &ang;OAB?</span></p>",
                    question_hi: "<p><span style=\"font-family: Times New Roman;\">67. </span><span style=\"font-family: Arial Unicode MS;\">&Delta;ABC केंद्र O वाले एक वृत्त में इस प्रकार अंकित है कि &ang;ACB = 115&deg;, O को A से जोड़ा जाता है। &ang;OAB का माप क्या है?</span></p>",
                    options_en: ["<p>30&deg;</p>", "<p>20&deg;</p>",

                    options_hi: ["<p>30&deg;</p>", "<p>20&deg;</p>",

                    solution_en: "<p>67.(c)<br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1667297370/word/media/image16.png\" width=\"150\" height=\"142\"><br><span style=\"font-family: Times New Roman;\">OA = OB radius of same circle</span><br><span style=\"font-family: Gungsuh;\">On major arc AB, &ang;ACB = 115&deg; then major &ang;AOB = 230&deg;</span><br><span style=\"font-family: Gungsuh;\">&ang;AOB = 360&deg; - 230&deg; = 130&deg;</span><br><span style=\"font-family: Times New Roman;\">In &Delta;</span><span style=\"font-family: Times New Roman;\">OAB </span><br><span style=\"font-family: Gungsuh;\">&ang;OAB = </span><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>180</mn><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mn>130</mn></mrow><mn>2</mn></mfrac></math> </span><span style=\"font-family: Times New Roman;\">= 25&deg;</span></p>",
                    solution_hi: "<p>67.(c)<br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1667297370/word/media/image16.png\" width=\"150\" height=\"142\"><br><span style=\"font-family: Times New Roman;\">OA = OB</span><span style=\"font-family: Baloo;\"> एक ही वृत्त की त्रिज्या</span><br><span style=\"font-family: Baloo;\">दीर्घ चाप</span><span style=\"font-family: Arial Unicode MS;\"> AB पर, &ang;ACB = 115&deg;&nbsp; तब <span style=\"font-family: Baloo;\">चाप </span>&ang;AOB = 230&deg;</span><br><span style=\"font-family: Gungsuh;\">&ang;AOB = 360&deg; - 230&deg; = 130&deg;</span><br><span style=\"font-family: Times New Roman;\">&Delta;OAB &nbsp;में</span><br><span style=\"font-family: Gungsuh;\">&ang;OAB = <span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>180</mn><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mn>130</mn></mrow><mn>2</mn></mfrac></math></span></span><span style=\"font-family: Times New Roman;\">&nbsp;</span><span style=\"font-family: Times New Roman;\">= 25&deg;</span></p>",

                questions.push({
                    id: "68",
                    section: "17",
                    question_en: "<p>68.<span style=\"font-family: Times New Roman;\"> The average height of some students in a group is 156 cm. If 5 students of average height 160 cm join the group, then the average height of all the students in the group increases by 0.8 cm. What is the number of students in the group?</span></p>",
                    question_hi: "<p><span style=\"font-family: Times New Roman;\">68. </span><span style=\"font-family: Baloo;\">एक समूह में कुछ छात्रों की औसत ऊंचाई 156 सेमी है। यदि 160 सेमी की औसत ऊंचाई वाले 5 छात्र समूह में शामिल हो जाते हैं, तो समूह के सभी छात्रों की औसत ऊंचाई 0.8 सेमी बढ़ जाती है। समूह में छात्रों की संख्या कितनी है? </span></p>",
                    options_en: ["<p>20<span style=\"font-family: Times New Roman;\"> </span></p>", "<p>10</p>", 
                                "<p>25</p>", "<p>15</p>"],
                    options_hi: ["<p>20</p>", "<p>10</p>",
                                "<p>25</p>", "<p>15</p>"],
                    solution_en: "<p>68.(a) <span style=\"font-family: Times New Roman;\">Let the number of students = a</span><br><span style=\"font-family: Times New Roman;\">Total height of the group = 156 &times; a</span><br><span style=\"font-family: Times New Roman;\">Total height of the new students = 160 &times; 5 = 800</span><br><span style=\"font-family: Times New Roman;\">New average = 156.8</span><br><span style=\"font-family: Times New Roman;\">According to the question</span><br><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>156</mn><mi mathvariant=\"normal\">a</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>800</mn></mrow><mrow><mi mathvariant=\"normal\">a</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>5</mn></mrow></mfrac></math> = 156.8</span><br><span style=\"font-family: Times New Roman;\">156a + 800 = 156.8a + 784</span><br><span style=\"font-family: Times New Roman;\">0.8a = 16&nbsp;</span><br><span style=\"font-family: Times New Roman;\">a = 20</span></p>",
                    solution_hi: "<p>68.(a) <span style=\"font-family: Baloo;\">माना विद्यार्थियों की संख्या</span><span style=\"font-family: Times New Roman;\"> = a</span><br><span style=\"font-family: Baloo;\">समूह की कुल ऊंचाई </span><span style=\"font-family: Times New Roman;\">= 156 &times; a</span><br><span style=\"font-family: Baloo;\">नए छात्रों की कुल ऊंचाई</span><span style=\"font-family: Times New Roman;\"> = 160 &times; 5 = 800</span><br><span style=\"font-family: Baloo;\">नया औसत</span><span style=\"font-family: Times New Roman;\"> = 156.8</span><br><span style=\"font-family: Baloo;\">प्रश्न के अनुसार</span><br><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>156</mn><mi mathvariant=\"normal\">a</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>800</mn></mrow><mrow><mi mathvariant=\"normal\">a</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>5</mn></mrow></mfrac></math> = 156.8</span><br><span style=\"font-family: Times New Roman;\">156a + 800 = 156.8a + 784</span><br><span style=\"font-family: Times New Roman;\">0.8a = 16&nbsp;</span><br><span style=\"font-family: Times New Roman;\">a = 20</span></p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({

                    section: "17",

                    solution_en: "<p>69.(b) <span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>(</mo><msup><mi>sin</mi><mn>4</mn></msup><mn>30</mn><mo>&#176;</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><msup><mi>cos</mi><mn>4</mn></msup><mn>30</mn><mo>&#176;</mo><mo>)</mo><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mn>3</mn><mo>(</mo><msup><mi>sin</mi><mn>2</mn></msup><mn>45</mn><mo>&#176;</mo><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mn>2</mn><msup><mi>cos</mi><mn>2</mn></msup><mn>45</mn><mo>&#176;</mo><mo>)</mo></math></span><br><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>(</mo><mfrac><mn>1</mn><mn>16</mn></mfrac><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mfrac><mn>9</mn><mn>16</mn></mfrac><mo>)</mo><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mn>3</mn><mo>(</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mn>1</mn><mo>)</mo></math></span><br><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>(</mo><mfrac><mn>10</mn><mn>16</mn></mfrac><mo>)</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>10</mn><mn>4</mn></mfrac><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mfrac><mn>6</mn><mn>4</mn></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>4</mn></math></span></p>",
                    solution_hi: "<p>69.(b) <span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>(</mo><msup><mi>sin</mi><mn>4</mn></msup><mn>30</mn><mo>&#176;</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><msup><mi>cos</mi><mn>4</mn></msup><mn>30</mn><mo>&#176;</mo><mo>)</mo><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mn>3</mn><mo>(</mo><msup><mi>sin</mi><mn>2</mn></msup><mn>45</mn><mo>&#176;</mo><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mn>2</mn><msup><mi>cos</mi><mn>2</mn></msup><mn>45</mn><mo>&#176;</mo><mo>)</mo></math></span><br><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>(</mo><mfrac><mn>1</mn><mn>16</mn></mfrac><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mfrac><mn>9</mn><mn>16</mn></mfrac><mo>)</mo><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mn>3</mn><mo>(</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mn>1</mn><mo>)</mo></math></span><br><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>(</mo><mfrac><mn>10</mn><mn>16</mn></mfrac><mo>)</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>10</mn><mn>4</mn></mfrac><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mfrac><mn>6</mn><mn>4</mn></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>4</mn></math></span></p>",

                questions.push({
                    id: "70",
                    section: "17",
                    question_en: "<p>70.<span style=\"font-family: Times New Roman;\"> If x</span><span style=\"font-family: Times New Roman;\">&sup2;</span><span style=\"font-family: Times New Roman;\"> + 4y</span><span style=\"font-family: Times New Roman;\">&sup2;</span><span style=\"font-family: Times New Roman;\"> = 53 and x - 2y = 5, then what is the value of x</span><span style=\"font-family: Times New Roman;\">&sup3;</span><span style=\"font-family: Times New Roman;\"> - 8y</span><span style=\"font-family: Times New Roman;\">&sup3;</span><span style=\"font-family: Times New Roman;\"> ?</span></p>",
                    question_hi: "<p><span style=\"font-family: Times New Roman;\">70.</span><span style=\"font-family: Baloo;\">यदि</span><span style=\"font-family: Times New Roman;\"> x&sup2; + 4y&sup2; = 53 </span><span style=\"font-family: Baloo;\">और</span><span style=\"font-family: Times New Roman;\"> x - 2y = 5, </span><span style=\"font-family: Baloo;\">तो</span><span style=\"font-family: Times New Roman;\"> x&sup3; - 8y&sup3; </span><span style=\"font-family: Baloo;\">का मान क्या है?</span></p>",
                    options_en: ["<p>-85<span style=\"font-family: Times New Roman;\"> </span></p>", "<p>335</p>", 
                                "<p>155</p>", "<p>85</p>"],
                    options_hi: ["<p>-85</p>", "<p>335</p>",
                                "<p>155</p>", "<p>85</p>"],
                    solution_en: "<p>70.(b)<br>(x - 2y)<sup>2</sup> = x<sup>2</sup> + 4y<sup>2</sup> - 4xy<br>25 = 53 - 4xy<br>xy = 7<br>x&sup3; - 8y&sup3; = (x - 2y)(x<sup>2</sup> + 4y<sup>2</sup> + 2xy)<br>x&sup3; - 8y&sup3; = 5(53 + 14 )<br>x&sup3; - 8y&sup3; = 5 &times; 67 = 335</p>",
                    solution_hi: "<p>70.(b)<br>(x - 2y)<sup>2</sup> = x<sup>2</sup> + 4y<sup>2</sup> - 4xy<br>25 = 53 - 4xy<br>xy = 7<br>x&sup3; - 8y&sup3; = (x - 2y)(x<sup>2</sup> + 4y<sup>2</sup> + 2xy)<br>x&sup3; - 8y&sup3; = 5(53 + 14 )<br>x&sup3; - 8y&sup3; = 5 &times; 67 = 335</p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "71",
                    section: "17",
                    question_en: "<p>71.<span style=\"font-family: Times New Roman;\"> A boat goes 27 km upstream and 33 downstream in 6 hours. </span><span style=\"font-family: Times New Roman;\">In the</span><span style=\"font-family: Times New Roman;\"> same time it can go 36 km upstream and 22 downstream. How much time will it take to go 36 km upstream and 44 km downstream?</span></p>",
                    question_hi: "<p><span style=\"font-family: Times New Roman;\">71.</span><span style=\"font-family: Times New Roman;\"> </span><span style=\"font-family: Baloo;\">एक नाव धारा के प्रतिकूल 27 किमी और धारा के अनुकूल 33 किमी 6 घंटे में जाती है। इसी समय में यह 36 किमी प्रतिकूल और 22 अनुकूल जा सकता है। 36 किमी प्रतिकूल और 44 किमी अनुकूल जाने में कितना समय लगेगा?</span></p>",
                    options_en: ["<p>8 h</p>", "<p>8 h 10 m</p>", 
                                "<p>7 h 50 m</p>", "<p>8 h 30 m</p>"],
                    options_hi: ["<p>8 h</p>", "<p>8 h 10 m</p>",
                                "<p>7 h 50 m</p>", "<p>8 h 30 m</p>"],
                    solution_en: "<p>71.(a)&nbsp;Let the speed of boat = x and stream = y<br>Upstream speed = x - y<br>Downstream speed = x + y<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>27</mn><mrow><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mi mathvariant=\"normal\">y</mi></mrow></mfrac><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mfrac><mn>33</mn><mrow><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mi mathvariant=\"normal\">y</mi></mrow></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>6</mn><mo>&#160;</mo><mo>&#8230;</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>36</mn><mrow><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mi mathvariant=\"normal\">y</mi></mrow></mfrac><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mfrac><mn>22</mn><mrow><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mi mathvariant=\"normal\">y</mi></mrow></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>6</mn><mo>&#160;</mo><mo>&#8230;</mo><mo>.</mo><mfenced><mn>2</mn></mfenced></math><br>On solving x = 10 and y = 1<br>Upstream speed = 9km//hr and downstream speed = 11km/hr<br>Time required = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>36</mn><mn>9</mn></mfrac></math> + <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>44</mn><mn>11</mn></mfrac></math> = 8h</p>",
                    solution_hi: "<p>71.(a)&nbsp;माना नाव की गति = x और धारा = y<br>धारा के प्रतिकूल गति = x - y<br>धारा के अनुकूल गति= x + y<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>27</mn><mrow><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mi mathvariant=\"normal\">y</mi></mrow></mfrac><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mfrac><mn>33</mn><mrow><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mi mathvariant=\"normal\">y</mi></mrow></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>6</mn><mo>&#160;</mo><mo>&#8230;</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>36</mn><mrow><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mi mathvariant=\"normal\">y</mi></mrow></mfrac><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mfrac><mn>22</mn><mrow><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mi mathvariant=\"normal\">y</mi></mrow></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>6</mn><mo>&#160;</mo><mo>&#8230;</mo><mo>.</mo><mfenced><mn>2</mn></mfenced></math><br>हल करने पर,&nbsp;<br>x = 10 और y = 1 .<br>धारा के प्रतिकूल गति = 9 किमी//घंटा&nbsp;<br>धारा के अनुकूल गति = 11 किमी/घंटा<br>आवश्यक समय =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>36</mn><mn>9</mn></mfrac></math> + <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>44</mn><mn>11</mn></mfrac></math>&nbsp;= 8h</p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "72",
                    section: "17",
                    question_en: "<p>72.<span style=\"font-family: Times New Roman;\"> If p - 2q = 3 and pq = 5, then what is the value of (p</span><span style=\"font-family: Times New Roman;\">&sup3;</span><span style=\"font-family: Times New Roman;\"> - 8q</span><span style=\"font-family: Times New Roman;\">&sup3;</span><span style=\"font-family: Times New Roman;\">)?</span></p>",
                    question_hi: "<p><span style=\"font-family: Times New Roman;\">72. </span><span style=\"font-family: Baloo;\">यदि</span><span style=\"font-family: Times New Roman;\"> p - 2q = 3 </span><span style=\"font-family: Baloo;\">और</span><span style=\"font-family: Times New Roman;\"> pq = 5 </span><span style=\"font-family: Baloo;\">हो, तो</span><span style=\"font-family: Times New Roman;\"> (p&sup3; - 8q&sup3;) </span><span style=\"font-family: Baloo;\">का मान क्या होगा?</span></p>",
                    options_en: ["<p>-63<span style=\"font-family: Times New Roman;\"> </span></p>", "<p>117</p>", 
                                "<p>72</p>", "<p>27</p>"],
                    options_hi: ["<p>-63</p>", "<p>117</p>",

                    solution_en: "<p>72.(b)<br><span style=\"font-family: Times New Roman;\">p</span><span style=\"font-family: Times New Roman;\">&sup3;</span><span style=\"font-family: Times New Roman;\"> - 8q</span><span style=\"font-family: Times New Roman;\">&sup3;</span><span style=\"font-family: Times New Roman;\"> = (p - 2q)((p&nbsp; - 2q<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mo>)</mo><mn>2</mn></msup></math> </span><span style=\"font-family: Times New Roman;\">+ 6pq)</span><br><span style=\"font-family: Times New Roman;\">p</span><span style=\"font-family: Times New Roman;\">&sup3;</span><span style=\"font-family: Times New Roman;\"> - 8q</span><span style=\"font-family: Times New Roman;\">&sup3; </span><span style=\"font-family: Times New Roman;\">= 3 (9 + 30)</span><br><span style=\"font-family: Times New Roman;\">p</span><span style=\"font-family: Times New Roman;\">&sup3;</span><span style=\"font-family: Times New Roman;\"> - 8q</span><span style=\"font-family: Times New Roman;\">&sup3;</span><span style=\"font-family: Times New Roman;\"> = 117</span></p>",

                questions.push({
                    id: "75",
                    section: "7",
                    question_en: "<p>75. <span style=\"font-family: Times New Roman;\">A trader bought two articles for Rs.490. He sold one at a loss of 20% and the other at a profit of 16%. If the selling price of both articles is same, then the cost price (in Rs.) of the article sold at 20% loss is:</span></p>",
                    question_hi: "<p>75. <span style=\"font-family: Baloo;\">एक व्यापारी ने 490 रुपये में दो वस्तुएँ खरीदीं। उसने एक को 20% की हानि पर और दूसरे को 16% के लाभ पर बेचा। यदि दोनों वस्तुओं का विक्रय मूल्य समान है, तो 20% हानि पर बेची गई वस्तु का क्रय मूल्य (रु में) है:</span></p>",
                    options_en: ["<p>290</p>", "<p>310</p>", 
                                "<p>280</p>", "<p>300</p>"],
                    options_hi: ["<p>290</p>", "<p>310</p>",
                                "<p>280</p>", "<p>300</p>"],
                    solution_en: "<p>75.(a) <span style=\"font-family: Times New Roman;\">Ratio of CP : SP of first article = 5 : 4</span><br><span style=\"font-family: Times New Roman;\">Ratio of CP : SP of second article </span><span style=\"font-family: Times New Roman;\">= 25 : 29</span><br><span style=\"font-family: Times New Roman;\">Balancing the SP of first article </span><span style=\"font-family: Times New Roman;\">= 145 : 116</span><br><span style=\"font-family: Times New Roman;\">CP : SP of second article = 100 : 116</span><br><span style=\"font-family: Times New Roman;\">Total CP : SP = 245 : 232</span><br><span style=\"font-family: Times New Roman;\">If 245 unit = 490 then 1 unit = Rs.2</span><br><span style=\"font-family: Times New Roman;\">So, 145 unit = Rs.290&nbsp;</span></p>",
                    solution_hi: "<p>75.(a) <span style=\"font-family: Baloo;\">क्रय मूल्य का अनुपात : पहली वस्तु का विक्रय मूल्य</span><span style=\"font-family: Times New Roman;\"> = 5: 4</span><br><span style=\"font-family: Baloo;\">क्रय मूल्य का अनुपात : दूसरी वस्तु का विक्रय मूल्य&nbsp;</span><span style=\"font-family: Times New Roman;\">= 25 : 29</span><br><span style=\"font-family: Baloo;\">प्रथम वस्तु का</span><span style=\"font-family: Times New Roman;\"> SP </span><span style=\"font-family: Baloo;\">संतुलन </span><span style=\"font-family: Times New Roman;\">= 145 : 116</span><br><span style=\"font-family: Baloo;\">क्रय मूल्य : दूसरी वस्तु का विक्रय मूल्य&nbsp;</span><span style=\"font-family: Times New Roman;\">= 100 : 116</span><br><span style=\"font-family: Baloo;\">कुल क्रय मूल्य: विक्रय मूल्य</span><span style=\"font-family: Times New Roman;\"> = 245 : 232</span><br><span style=\"font-family: Baloo;\">यदि</span><span style=\"font-family: Times New Roman;\"> 245</span><span style=\"font-family: Baloo;\"> इकाई </span><span style=\"font-family: Times New Roman;\">= 490 </span><span style=\"font-family: Baloo;\"> तो, </span><span style=\"font-family: Times New Roman;\">1 </span><span style=\"font-family: Baloo;\">इकाई</span><span style=\"font-family: Times New Roman;\"> = 2 </span><span style=\"font-family: Baloo;\">रुपये</span><br><span style=\"font-family: Baloo;\">तो,</span><span style=\"font-family: Times New Roman;\"> 145 </span><span style=\"font-family: Baloo;\">इकाई </span><span style=\"font-family: Baloo;\">= 290 रु</span></p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5

                questions.push({
                    id: "77",
                    section: "7",
                    question_en: "<p>77. Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the right order to form a meaningful and coherent paragraph.<br><span style=\"font-family: Baloo;\">A. Whichever soonest made a traveller take off his cloak should be accounted the more powerful.&nbsp;</span><br><span style=\"font-family: Baloo;\">B. They agreed to put the point to test.&nbsp;</span><br><span style=\"font-family: Baloo;\">C. A dispute once arose between the wind and the sun to decide which was the stronger of the two.&nbsp;</span><br><span style=\"font-family: Baloo;\">D. The wind began, and blew with all his might and sent a blast, cold and fierce as a storm.&nbsp;</span></p>",
                    question_hi: "<p>77. Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the right order to form a meaningful and coherent paragraph.<br><span style=\"font-family: Baloo;\">A. Whichever soonest made a traveller take off his cloak should be accounted the more powerful.&nbsp;</span><br><span style=\"font-family: Baloo;\">B. They agreed to put the point to test.&nbsp;</span><br><span style=\"font-family: Baloo;\">C. A dispute once arose between the wind and the sun to decide which was the stronger of the two.&nbsp;</span><br><span style=\"font-family: Baloo;\">D. The wind began, and blew with all his might and sent a blast, cold and fierce as a storm.&nbsp;</span></p>",
                    options_en: ["<p>CDBA</p>", "<p>ACDB</p>", 
                                "<p>CBAD</p>", "<p>BCDA</p>\n<p><span style=\"font-family: Baloo;\"> </span></p>"],
                    options_hi: ["<p>CDBA</p>", "<p>ACDB</p>",
                                "<p>CBAD</p>", "<p>BCDA</p>"],
                    solution_en: "<p>77.(c) CBAD.&nbsp;<br>Sentence C will be the starting line as it contains the main idea of the parajumble i.e. a dispute between the sun and the wind. However, Sentence B states that they agreed to put the point to test. So, B will follow C. Further, Sentence A states that whichever soonest made a traveller take off his cloak should be accounted the more powerful &amp; Sentence D states that the wind began, and blew with all his might and sent a blast, cold and fierce as a storm. So, D will follow A. Going through the options, option (c) has the correct sequence.&nbsp;</p>",
                    solution_hi: "<p>77.(c) CBAD.&nbsp;<br>Sentence C प्रारम्भिक line होगी क्योंकि इसमें parajumble का main idea &lsquo;a dispute between the sun and the wind&rsquo; निहित है। हालाँकि, Sentence B कहता है कि वे बात को परखने के लिए सहमत हुए। इसलिए, B, C के बाद आएगा। इसके अलावा, Sentence A कहता है कि जो कोई भी यात्री से उसका लबादा (cloak) सबसे पहले उतरवा देगा, उसे अधिक शक्तिशाली माना जाना चाहिए, तथा Sentence D कहता है कि हवा चलने लगी, और अपनी पूरी ताकत से चली तथा तूफान की तरह ठंडी एवं भयंकर आंधी चली। इसलिए, D, A के बाद आएगा। Options के माध्यम से जाने पर, option (c) में सही sequence है।</p>",

        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
