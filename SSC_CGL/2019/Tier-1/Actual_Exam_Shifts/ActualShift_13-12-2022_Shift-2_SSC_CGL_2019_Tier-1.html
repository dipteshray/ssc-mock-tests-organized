                });
                questions.push({
                    id: "56",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Roboto;\">56. A student walked 6 km from his house to reach the metro station, then boarded a </span><span style=\"font-family: Roboto;\">metro that has an average speed of 60km/h, and reached the destination. It took 3 </span><span style=\"font-family: Roboto;\">hours for the entire journey. If the average speed of the entire journey is 32 km/h, then </span><span style=\"font-family: Roboto;\">the speed of walking is ________.</span></p>\n",
                    question_hi: "<p>56. <span style=\"font-family: Palanquin Dark;\">&#2319;&#2325; &#2331;&#2366;&#2340;&#2381;&#2352; &#2309;&#2346;&#2344;&#2375; &#2328;&#2352; &#2360;&#2375; &#2350;&#2375;&#2335;&#2381;&#2352;&#2379; &#2360;&#2381;&#2335;&#2375;&#2358;&#2344; &#2340;&#2325; &#2346;&#2361;&#2369;&#2305;&#2330;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; 6 km &#2330;&#2354;&#2325;&#2352; &#2327;&#2351;&#2366;, &#2347;&#2367;&#2352; &#2319;&#2325; &#2350;&#2375;&#2335;&#2381;&#2352;&#2379; &#2350;&#2375;&#2306; &#2330;&#2397; &#2327;&#2351;&#2366; &#2332;&#2367;&#2360;&#2325;&#2368; &#2324;&#2360;&#2340; &#2330;&#2366;&#2354; 60km/h &#2361;&#2376; &#2324;&#2352; &#2357;&#2361; &#2327;&#2306;&#2340;&#2357;&#2381;&#2351; &#2340;&#2325; &#2346;&#2361;&#2369;&#2305;&#2330; &#2327;&#2351;&#2366;&#2404; &#2360;&#2306;&#2346;&#2370;&#2352;&#2381;&#2339; &#2351;&#2366;&#2340;&#2381;&#2352;&#2366; &#2350;&#2375;&#2306; &#2313;&#2360;&#2375; 3 &#2328;&#2306;&#2335;&#2375; &#2354;&#2327;&#2375;&#2404; &#2351;&#2342;&#2367; &#2360;&#2306;&#2346;&#2370;&#2352;&#2381;&#2339; &#2351;&#2366;&#2340;&#2381;&#2352;&#2366; &#2325;&#2368; &#2324;&#2360;&#2340; &#2330;&#2366;&#2354; 32 km/h &#2361;&#2376;, &#2340;&#2379; &#2346;&#2376;&#2342;&#2354; &#2330;&#2354;&#2344;&#2375; &#2325;&#2368; &#2330;&#2366;&#2354; &#2325;&#2367;&#2340;&#2344;&#2368; &#2361;&#2376;?</span></p>\n",
                    options_en: ["<p>1.5 km/h</p>\n", "<p>3 km/h</p>\n", 
                                "<p>2 km/h</p>\n", "<p>4 km/h</p>\n"],
                    options_hi: ["<p>1.5 km/h</p>\n", "<p>3 km/h</p>\n",
                                "<p>2 km/h</p>\n", "<p>4 km/h</p>\n"],
                    solution_en: "<p>56.(d)</p>\r\n<p><span style=\"font-family: Roboto;\">Let the time taken by train be x</span></p>\r\n<p><span style=\"font-family: Roboto;\">Distance covered by a student = 32&times;3 = 96 km</span></p>\r\n<p><span style=\"font-family: Roboto;\">Distance covered by a train = 60x</span></p>\r\n<p><span style=\"font-family: Roboto;\">ATQ,</span></p>\r\n<p><span style=\"font-family: Roboto;\">6+60x = 96</span></p>\r\n<p><span style=\"font-family: Roboto;\">60x = 96 - 6 = 90</span></p>\r\n<p><span style=\"font-family: Roboto;\">x = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>90</mn><mn>60</mn></mfrac></math></span><span style=\"font-family: Roboto;\"> = 1.5 hrs</span></p>\r\n<p><span style=\"font-family: Roboto;\">Time taken by student to cover 6 km distance = 3-1.5 = 1.5 hrs</span></p>\r\n<p><span style=\"font-family: Roboto;\">So, walking speed of student = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>6</mn><mrow><mn>1</mn><mo>.</mo><mn>5</mn></mrow></mfrac></math></span><span style=\"font-family: Roboto;\"> = 4 km/hr</span></p>\n",
                    solution_hi: "<p>56.(d)</p>\r\n<p><span style=\"font-family: Palanquin;\">&#2350;&#2366;&#2344;&#2366; &#2335;&#2381;&#2352;&#2375;&#2344; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2354;&#2367;&#2351;&#2366; &#2327;&#2351;&#2366; &#2360;&#2350;&#2351; x &#2361;&#2376;</span></p>\r\n<p><span style=\"font-family: Palanquin;\">&#2319;&#2325; &#2331;&#2366;&#2340;&#2381;&#2352; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2340;&#2351; &#2325;&#2368; &#2327;&#2312; &#2342;&#2370;&#2352;&#2368; = 32&times;3 = 96 km</span></p>\r\n<p><span style=\"font-family: Palanquin;\">&#2352;&#2375;&#2354;&#2327;&#2366;&#2337;&#2364;&#2368; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2340;&#2351; &#2325;&#2368; &#2327;&#2312; &#2342;&#2370;&#2352;&#2368; = 60x</span></p>\r\n<p><span style=\"font-family: Palanquin;\">&#2346;&#2381;&#2352;&#2358;&#2381;&#2344; &#2325;&#2375; &#2309;&#2344;&#2369;&#2360;&#2366;&#2352;</span><span style=\"font-family: Roboto;\">,</span></p>\r\n<p><span style=\"font-family: Roboto;\">6+60x = 96</span></p>\r\n<p><span style=\"font-family: Roboto;\">60x = 96 - 6 = 90</span></p>\r\n<p><span style=\"font-family: Roboto;\">x = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>90</mn><mn>60</mn></mfrac></math></span><span style=\"font-family: Roboto;\"> = 1.5 hrs</span></p>\r\n<p><span style=\"font-family: Palanquin;\">&#2331;&#2366;&#2340;&#2381;&#2352; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; 6 &#2325;&#2367;&#2350;&#2368; &#2325;&#2368; &#2342;&#2370;&#2352;&#2368; &#2340;&#2351; &#2325;&#2352;&#2344;&#2375; &#2350;&#2375;&#2306; &#2354;&#2327;&#2366; &#2360;&#2350;&#2351; = 3-1.5 = 1.5 hrs</span></p>\r\n<p><span style=\"font-family: Palanquin;\">&#2340;&#2379;, &#2331;&#2366;&#2340;&#2381;&#2352; &#2325;&#2368; &#2330;&#2354;&#2344;&#2375; &#2325;&#2368; &#2327;&#2340;&#2367; = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>6</mn><mrow><mn>1</mn><mo>.</mo><mn>5</mn></mrow></mfrac></math></span><span style=\"font-family: Roboto;\"> = 4 km/hr</span></p>\n",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "57",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Roboto;\">57. A, B and C can all together do a piece of work in 10 days, in which B takes 3 times as </span><span style=\"font-family: Roboto;\">long as A and C together to do the work. In how many days can B alone do the work?</span></p>\n",
                    question_hi: "<p>57. <span style=\"font-family: Palanquin Dark;\">A, B &#2324;&#2352; C &#2360;&#2349;&#2368; &#2350;&#2367;&#2354;&#2325;&#2352; &#2319;&#2325; &#2325;&#2366;&#2352;&#2381;&#2351; &#2325;&#2379; 10 &#2342;&#2367;&#2344;&#2379;&#2306; &#2350;&#2375;&#2306; &#2325;&#2352; &#2360;&#2325;&#2340;&#2375; &#2361;&#2376;&#2306;, &#2332;&#2367;&#2360;&#2350;&#2375;&#2306; B &#2325;&#2379; &#2357;&#2361; &#2325;&#2366;&#2352;&#2381;&#2351; &#2346;&#2370;&#2352;&#2366; &#2325;&#2352;&#2344;&#2375; &#2350;&#2375;&#2306; &#2354;&#2327;&#2344;&#2375; &#2357;&#2366;&#2354;&#2366; &#2360;&#2350;&#2351; A &#2324;&#2352; C &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2350;&#2367;&#2354;&#2325;&#2352; &#2313;&#2360; &#2325;&#2366;&#2352;&#2381;&#2351; &#2325;&#2379; &#2346;&#2370;&#2352;&#2366; &#2325;&#2352;&#2344;&#2375; &#2350;&#2375;&#2306; &#2354;&#2327;&#2344;&#2375; &#2357;&#2366;&#2354;&#2375; &#2360;&#2350;&#2351; &#2325;&#2366; 3 &#2327;&#2369;&#2344;&#2366; &#2361;&#2376;&#2404; B &#2309;&#2325;&#2375;&#2354;&#2366; &#2313;&#2360; &#2325;&#2366;&#2352;&#2381;&#2351; &#2325;&#2379; &#2325;&#2367;&#2340;&#2344;&#2375; &#2342;&#2367;&#2344;&#2379;&#2306; &#2350;&#2375;&#2306; &#2325;&#2352; &#2360;&#2325;&#2340;&#2366; &#2361;&#2376;?</span></p>\n",
                    options_en: ["<p>50 days</p>\n", "<p>40 days</p>\n", 
                                "<p>10 days</p>\n", "<p>15 days</p>\n"],
                    options_hi: ["<p>50 &#2342;&#2367;&#2344;</p>\n", "<p>40 &#2342;&#2367;&#2344;</p>\n",
                                "<p>10 &#2342;&#2367;&#2344;</p>\n", "<p>15 &#2342;&#2367;&#2344;</p>\n"],
                    solution_en: "<p>57.(b)</p>\r\n<p><span style=\"font-family: Roboto;\">The ratio of the Efficiency of B and (A+C) = 1 : 3</span></p>\r\n<p><span style=\"font-family: Roboto;\">Total work = (3+1)&times;10 = 40 unit</span></p>\r\n<p><span style=\"font-family: Roboto;\">Time taken by B alone to complete the whole work = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>40</mn><mn>1</mn></mfrac></math></span></p>\r\n<p><span style=\"font-family: Roboto;\"> = 40 days</span></p>\n",
                    solution_hi: "<p>57.(b)</p>\r\n<p><span style=\"font-family: Palanquin;\">B &#2324;&#2352; (A+C) &#2325;&#2368; &#2325;&#2381;&#2359;&#2350;&#2340;&#2366; &#2325;&#2366; &#2309;&#2344;&#2369;&#2346;&#2366;&#2340; = 1 : 3</span></p>\r\n<p><span style=\"font-family: Palanquin;\">&#2325;&#2369;&#2354; &#2325;&#2366;&#2352;&#2381;&#2351; = (3+1)&times;10 = 40 &#2311;&#2325;&#2366;&#2312; </span></p>\r\n<p><span style=\"font-family: Palanquin;\">&#2309;&#2325;&#2375;&#2354;&#2375; B &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2346;&#2370;&#2352;&#2375; &#2325;&#2366;&#2352;&#2381;&#2351; &#2325;&#2379; &#2346;&#2370;&#2352;&#2366; &#2325;&#2352;&#2344;&#2375; &#2350;&#2375;&#2306; &#2354;&#2367;&#2351;&#2366; &#2327;&#2351;&#2366; &#2360;&#2350;&#2351;= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>40</mn><mn>1</mn></mfrac></math></span><span style=\"font-family: Roboto;\"> = 40 days</span></p>\n",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "58",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Roboto;\">58. A sum of Rs.10 is lent by a child to his friend to be returned in 11 monthly installments </span><span style=\"font-family: Roboto;\">of Rs.1 each, the interest being simple. The rate of interest is?</span></p>\n",
                    question_hi: "<p>58. <span style=\"font-family: Palanquin Dark;\">&#2319;&#2325; &#2348;&#2330;&#2381;&#2330;&#2375; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2309;&#2346;&#2344;&#2375; &#2350;&#2367;&#2340;&#2381;&#2352; &#2325;&#2379; Rs.10 &#2325;&#2368; &#2352;&#2366;&#2358;&#2367; &#2313;&#2343;&#2366;&#2352; &#2342;&#2368; &#2332;&#2366;&#2340;&#2368; &#2361;&#2376; &#2332;&#2367;&#2360;&#2375; Rs.1 &#2346;&#2381;&#2352;&#2340;&#2381;&#2351;&#2375;&#2325; &#2325;&#2368; 11 &#2350;&#2366;&#2360;&#2367;&#2325; &#2325;&#2367;&#2358;&#2381;&#2340;&#2379;&#2306; &#2350;&#2375;&#2306; &#2354;&#2380;&#2335;&#2366;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; &#2348;&#2381;&#2351;&#2366;&#2332; &#2342;&#2352; &#2360;&#2366;&#2343;&#2366;&#2352;&#2339; &#2361;&#2376;&#2404; &#2348;&#2381;&#2351;&#2366;&#2332; &#2342;&#2352; &#2332;&#2381;&#2334;&#2366;&#2340; &#2325;&#2368;&#2332;&#2367;&#2319;?</span></p>\n",
                    options_en: ["<p>11<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mn>11</mn></mfrac></math><span style=\"font-family: Roboto;\">%</span></p>\n", "<p>21<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mn>11</mn></mfrac></math></p>\n", 
                                "<p>10<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>11</mn></mfrac></math><span style=\"font-family: Roboto;\">%</span></p>\n", "<p>9<span style=\"font-family: Roboto;\"> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>11</mn></mfrac></math>%</span></p>\n"],
                    options_hi: ["<p>11<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mn>11</mn></mfrac></math><span style=\"font-family: Palanquin Dark;\">%</span></p>\n", "<p>21<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mn>11</mn></mfrac></math>%</p>\n",
                                "<p>10<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>11</mn></mfrac></math><span style=\"font-family: Palanquin Dark;\">%</span></p>\n", "<p>9<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>11</mn></mfrac></math><span style=\"font-family: Palanquin Dark;\"> %</span></p>\n"],
                    solution_en: "<p>58.(b)</p>\r\n<p><span style=\"font-family: Roboto;\">Interest paid by student = 11 - 10 = &#8377;1</span></p>\r\n<p><span style=\"font-family: Roboto;\">Now, principal amount = 1 + 2 + 3 + 4&hellip;..10 = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>10</mn><mo>&nbsp;</mo><mo>&times;</mo><mo>&nbsp;</mo><mn>11</mn></mrow><mn>2</mn></mfrac></math></span><span style=\"font-family: Roboto;\"> = &#8377;55 </span></p>\r\n<p><span style=\"font-family: Roboto;\">SI =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>P</mi><mo>&nbsp;</mo><mo>&times;</mo><mo>&nbsp;</mo><mi>R</mi><mo>&nbsp;</mo><mo>&times;</mo><mo>&nbsp;</mo><mi>T</mi></mrow><mn>100</mn></mfrac></math></span></p>\r\n<p><span style=\"font-family: Roboto;\">1 =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>55</mn><mo>&nbsp;</mo><mo>&times;</mo><mo>&nbsp;</mo><mi>R</mi><mo>&nbsp;</mo><mo>&times;</mo><mo>&nbsp;</mo><mn>1</mn></mrow><mrow><mn>12</mn><mo>&nbsp;</mo><mo>&times;</mo><mo>&nbsp;</mo><mn>100</mn></mrow></mfrac><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mfrac><mrow><mn>11</mn><mi>R</mi></mrow><mn>240</mn></mfrac></math></span></p>\r\n<p><span style=\"font-family: Roboto;\">240 = 11R</span></p>\r\n<p><span style=\"font-family: Roboto;\">R = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>240</mn><mn>11</mn></mfrac><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>21</mn><mfrac><mn>9</mn><mn>11</mn></mfrac><mo>%</mo></math></span><span style=\"font-family: Roboto;\">&nbsp;</span></p>\n",
                    solution_hi: "<p>58.(b)</p>\r\n<p><span style=\"font-family: Palanquin;\">&#2331;&#2366;&#2340;&#2381;&#2352; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2349;&#2369;&#2327;&#2340;&#2366;&#2344; &#2325;&#2367;&#2351;&#2366; &#2327;&#2351;&#2366; &#2348;&#2381;&#2351;&#2366;&#2332; = 11 - 10 = &#8377;1</span></p>\r\n<p><span style=\"font-family: Palanquin;\">&#2309;&#2348;, &#2350;&#2370;&#2354; &#2352;&#2366;&#2358;&#2367; = 1 + 2 + 3 + 4&hellip;..10 = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>10</mn><mo>&nbsp;</mo><mo>&times;</mo><mo>&nbsp;</mo><mn>11</mn></mrow><mn>2</mn></mfrac></math></span><span style=\"font-family: Roboto;\"> = &#8377;55 </span></p>\r\n<p><span style=\"font-family: Roboto;\">SI =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>P</mi><mo>&nbsp;</mo><mo>&times;</mo><mo>&nbsp;</mo><mi>R</mi><mo>&nbsp;</mo><mo>&times;</mo><mo>&nbsp;</mo><mi>T</mi></mrow><mn>100</mn></mfrac></math></span></p>\r\n<p><span style=\"font-family: Roboto;\">1 =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>55</mn><mo>&nbsp;</mo><mo>&times;</mo><mo>&nbsp;</mo><mi>R</mi><mo>&nbsp;</mo><mo>&times;</mo><mo>&nbsp;</mo><mn>1</mn></mrow><mrow><mn>12</mn><mo>&nbsp;</mo><mo>&times;</mo><mo>&nbsp;</mo><mn>100</mn></mrow></mfrac><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mfrac><mrow><mn>11</mn><mi>R</mi></mrow><mn>240</mn></mfrac></math></span></p>\r\n<p><span style=\"font-family: Roboto;\">240 = 11R</span></p>\r\n<p><span style=\"font-family: Roboto;\">R =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>240</mn><mn>11</mn></mfrac><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>21</mn><mfrac><mn>9</mn><mn>11</mn></mfrac><mo>%</mo></math></span></p>\n",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "59",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Roboto;\">59. The sum of two numbers is 680. If the bigger number is decreased by 15% and the </span><span style=\"font-family: Roboto;\">smaller number is increased by 15%, then the resultant numbers are equal. Find the </span><span style=\"font-family: Roboto;\">smaller number.</span></p>\n",
                    question_hi: "<p>59. <span style=\"font-family: Palanquin Dark;\">&#2342;&#2379; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366;&#2323;&#2306; &#2325;&#2366; &#2351;&#2379;&#2327; 680 &#2361;&#2376;&#2404; &#2351;&#2342;&#2367; &#2348;&#2337;&#2364;&#2368; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366; &#2350;&#2375;&#2306; 15% &#2325;&#2368; &#2325;&#2350;&#2368; &#2325;&#2368; &#2332;&#2366;&#2340;&#2368; &#2361;&#2376; &#2324;&#2352; &#2331;&#2379;&#2335;&#2368; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366; &#2350;&#2375;&#2306; 15% &#2325;&#2368; &#2357;&#2371;&#2342;&#2381;&#2343;&#2367; &#2325;&#2368; &#2332;&#2366;&#2340;&#2368; &#2361;&#2376;, &#2340;&#2379; &#2346;&#2352;&#2367;&#2339;&#2366;&#2350;&#2368; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366;&#2319;&#2305; &#2360;&#2350;&#2366;&#2344; &#2361;&#2379;&#2340;&#2368; &#2361;&#2376;&#2306;&#2404; &#2331;&#2379;&#2335;&#2368; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366; &#2332;&#2381;&#2334;&#2366;&#2340; &#2325;&#2368;&#2332;&#2367;&#2319; &#2404; </span></p>\n",
                    options_en: ["<p>307</p>\n", "<p>289</p>\n", 
                                "<p>291</p>\n", "<p>304</p>\n"],
                    options_hi: ["<p>307</p>\n", "<p>289</p>\n",
                                "<p>291</p>\n", "<p>304</p>\n"],
                    solution_en: "<p>59.(<span style=\"font-family: Roboto;\">b)</span></p>\r\n<p><span style=\"font-family: Roboto;\">Let the bigger and smaller no be x and y respectively</span></p>\r\n<p><span style=\"font-family: Roboto;\">ATQ, </span></p>\r\n<p><span style=\"font-family: Roboto;\">x &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>17</mn><mn>20</mn></mfrac></math></span><span style=\"font-family: Roboto;\"> = y &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>23</mn><mn>20</mn></mfrac></math></span><span style=\"font-family: Roboto;\"> &rArr;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>X</mi><mi>Y</mi></mfrac><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mfrac><mn>23</mn><mn>17</mn></mfrac></math></span></p>\r\n<p><span style=\"font-family: Roboto;\">and, x + y = 680</span></p>\r\n<p><span style=\"font-weight: 400;\">(23 + 17)&nbsp; </span>unit = 680</p>\r\n<p><span style=\"font-family: Roboto;\">40 unit = 680</span></p>\r\n<p><span style=\"font-family: Roboto;\">1 unit = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>680</mn><mn>40</mn></mfrac></math></span><span style=\"font-family: Roboto;\"> = 17</span></p>\r\n<p><span style=\"font-family: Roboto;\">So, the smaller no = 17 unit = 17&times;17 = 289</span></p>\n",
                    solution_hi: "<p>59.<span style=\"font-family: Roboto;\">(b)</span></p>\r\n<p><span style=\"font-family: Palanquin;\">&#2350;&#2366;&#2344;&#2366; &#2348;&#2337;&#2364;&#2368; &#2324;&#2352; &#2331;&#2379;&#2335;&#2368; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366; &#2325;&#2381;&#2352;&#2350;&#2358;&#2307; x &#2324;&#2352; y &#2361;&#2376;</span></p>\r\n<p><span style=\"font-family: Palanquin;\">&#2346;&#2381;&#2352;&#2358;&#2381;&#2344; &#2325;&#2375; &#2309;&#2344;&#2369;&#2360;&#2366;&#2352;,</span></p>\r\n<p><span style=\"font-family: Roboto;\">x &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>17</mn><mn>20</mn></mfrac></math></span><span style=\"font-family: Roboto;\"> = y &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>23</mn><mn>20</mn></mfrac></math></span><span style=\"font-family: Roboto;\"> &rArr;</span><span style=\"font-family: Roboto;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>X</mi><mi>Y</mi></mfrac><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mfrac><mn>23</mn><mn>17</mn></mfrac></math> </span></p>\r\n<p><span style=\"font-family: Palanquin;\">&#2324;&#2352; , x + y = 680</span></p>\r\n<p><span style=\"font-weight: 400;\">(23 + 17) </span>&#2311;&#2325;&#2366;&#2312; = 680</p>\r\n<p><span style=\"font-family: Palanquin;\">40 &#2311;&#2325;&#2366;&#2312; = 680</span></p>\r\n<p><span style=\"font-family: Palanquin;\">1 &#2311;&#2325;&#2366;&#2312; = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>680</mn><mn>40</mn></mfrac></math></span><span style=\"font-family: Roboto;\"> = 17</span></p>\r\n<p><span style=\"font-family: Palanquin;\">&#2340;&#2379; &#2331;&#2379;&#2335;&#2368; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366; &#2361;&#2376; = 17 &#2311;&#2325;&#2366;&#2312; = 17&times;17 = 289</span></p>\n",
                    correct: "b",

                questions.push({
                    id: "64",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Roboto;\">64. The pie chart given below shows the production of 6 different factories. The total production of all these 6 factories is 15000. The production of a particular factory is shown as a percent of total production of all these 6 factories.</span></p>\r\n<p><span style=\"font-family: Roboto;\"> </span><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1679027574/word/media/image9.png\" width=\"299\" height=\"285\"></p>\r\n<p><span style=\"font-family: Roboto;\">J1 = The value of average production of factory F3 and F6.</span></p>\r\n<p><span style=\"font-family: Roboto;\">J2 = The difference between the production of factory F1 and F4. </span></p>\r\n<p><span style=\"font-family: Roboto;\">What is the value of (J2 - J1)?</span></p>\n",
                    question_hi: "<p>64. <span style=\"font-family: Palanquin Dark;\">&#2344;&#2368;&#2330;&#2375; &#2342;&#2367;&#2351;&#2366; &#2327;&#2351;&#2366; &#2357;&#2371;&#2340;&#2381;&#2340; &#2330;&#2367;&#2340;&#2381;&#2352; 6 &#2357;&#2367;&#2349;&#2367;&#2344;&#2381;&#2344; &#2347;&#2376;&#2325;&#2381;&#2335;&#2381;&#2352;&#2367;&#2351;&#2379; &#2325;&#2375; &#2313;&#2340;&#2381;&#2346;&#2366;&#2342;&#2344; &#2325;&#2379; &#2342;&#2352;&#2381;&#2358;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; &#2311;&#2344; &#2360;&#2349;&#2368; 6 &#2347;&#2376;&#2325;&#2381;&#2335;&#2381;&#2352;&#2367;&#2351;&#2379; &#2325;&#2366; &#2325;&#2369;&#2354; &#2313;&#2340;&#2381;&#2346;&#2366;&#2342;&#2344; 15000 &#2361;&#2376;&#2404; &#2319;&#2325; &#2357;&#2367;&#2358;&#2367;&#2359;&#2381;&#2335; &#2347;&#2376;&#2325;&#2381;&#2335;&#2381;&#2352;&#2368; &#2325;&#2375; &#2313;&#2340;&#2381;&#2346;&#2366;&#2342;&#2344; &#2325;&#2379; &#2311;&#2344; &#2360;&#2349;&#2368; 6 &#2347;&#2376;&#2325;&#2381;&#2335;&#2381;&#2352;&#2367;&#2351;&#2379; &#2325;&#2375; &#2325;&#2369;&#2354; &#2313;&#2340;&#2381;&#2346;&#2366;&#2342;&#2344; &#2325;&#2375; &#2346;&#2381;&#2352;&#2340;&#2367;&#2358;&#2340; &#2325;&#2375; &#2352;&#2370;&#2346; &#2350;&#2375;&#2306; &#2342;&#2352;&#2381;&#2358;&#2366;&#2351;&#2366; &#2327;&#2351;&#2366; &#2361;&#2376;&#2404;</span></p>\r\n<p><span style=\"font-family: Palanquin Dark;\"> </span><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1679027574/word/media/image9.png\" width=\"311\" height=\"297\"></p>\r\n<p><span style=\"font-family: Palanquin Dark;\">J1 = &#2347;&#2376;&#2325;&#2381;&#2335;&#2381;&#2352;&#2368; F3 &#2324;&#2352; F6 &#2325;&#2375; &#2324;&#2360;&#2340; &#2313;&#2340;&#2381;&#2346;&#2366;&#2342;&#2344; &#2325;&#2366; &#2350;&#2366;&#2344;&#2404; </span></p>\r\n<p><span style=\"font-family: Palanquin Dark;\">J2 = &#2347;&#2376;&#2325;&#2381;&#2335;&#2381;&#2352;&#2368; F1 &#2324;&#2352; F4 &#2325;&#2375; &#2313;&#2340;&#2381;&#2346;&#2366;&#2342;&#2344; &#2325;&#2375; &#2348;&#2368;&#2330; &#2325;&#2366; &#2309;&#2306;&#2340;&#2352; | </span></p>\r\n<p><span style=\"font-weight: 400;\">(J2 - J1)&nbsp; </span>&#2325;&#2366; &#2350;&#2366;&#2344; &#2325;&#2381;&#2351;&#2366; &#2361;&#2376;?</p>\n",
                    options_en: ["<p>385</p>\n", "<p>395</p>\n",

                    options_hi: ["<p>385</p>\n", "<p>395</p>\n",
                                "<p>375</p>\n", "<p>305</p>\n"],

                questions.push({
                    id: "67",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Roboto;\">67. If 2p + q = 19 and 8p&sup3;</span><span style=\"font-family: Roboto;\"> + q&sup3;</span><span style=\"font-family: Roboto;\">&nbsp;= 361, then find the value of pq. </span></p>\n",
                    question_hi: "<p>67. <span style=\"font-family: Palanquin Dark;\">&#2351;&#2342;&#2367; 2p + q = 19 &#2324;&#2352; 8p<span style=\"font-family: Roboto;\">&sup3;</span></span><span style=\"font-family: Palanquin Dark;\">&nbsp;</span><span style=\"font-family: Palanquin Dark;\">+ q<span style=\"font-family: Roboto;\">&sup3;</span></span><span style=\"font-family: Palanquin Dark;\">&nbsp;= 361 &#2361;&#2376;, &#2340;&#2379; pq &#2325;&#2366; &#2350;&#2366;&#2344; &#2332;&#2381;&#2334;&#2366;&#2340; &#2325;&#2368;&#2332;&#2367;&#2319; &#2404;</span></p>\n",

                    solution_en: "<p>67.(d)</p>\r\n<p><span style=\"font-family: Roboto;\">8p&sup3;</span><span style=\"font-family: Roboto;\"> + q&sup3;</span><span style=\"font-family: Roboto;\"> = (2p+q)[(2p + q)&sup2; - 6pq]</span></p>\r\n<p><span style=\"font-family: Roboto;\">361 = 19[361 - 6pq]</span></p>\r\n<p><span style=\"font-family: Roboto;\">19 = 361 - 6pq</span></p>\r\n<p><span style=\"font-family: Roboto;\">342 = 6pq</span></p>\r\n<p><span style=\"font-family: Roboto;\">pq = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>342</mn><mn>6</mn></mfrac></math></span><span style=\"font-family: Roboto;\"> = 57</span></p>\n",
                    solution_hi: "<p>67.(d)</p>\r\n<p><span style=\"font-family: Roboto;\">8p&sup3;</span><span style=\"font-family: Roboto;\"> + q&sup3;</span><span style=\"font-family: Roboto;\"> = (2p+q)[(2p + q)&sup2; - 6pq]</span></p>\r\n<p><span style=\"font-family: Roboto;\">361 = 19[361 - 6pq]</span></p>\r\n<p><span style=\"font-family: Roboto;\">19 = 361 - 6pq</span></p>\r\n<p><span style=\"font-family: Roboto;\">342 = 6pq</span></p>\r\n<p><span style=\"font-family: Roboto;\">pq = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>342</mn><mn>6</mn></mfrac></math></span><span style=\"font-family: Roboto;\">= 57</span></p>\n",

                    question_en: "<p><span style=\"font-family: Roboto;\">68. Which of the following statement is correct?</span></p>\r\n<p><span style=\"font-family: Roboto;\">I. If x = 12 , y = - 2 and z = - 10 , then x&sup3;</span><span style=\"font-family: Roboto;\"> + y&sup3;</span><span style=\"font-family: Roboto;\"> + z&sup3;</span><span style=\"font-family: Roboto;\">&nbsp;= 720</span></p>\r\n<p><span style=\"font-family: Roboto;\">II. If x + y = 48 and 4xy = 128 then the value of 4x&sup2;</span><span style=\"font-family: Roboto;\">&nbsp;+ 4y&sup2; is 8960</span></p>\n",

                    solution_en: "<p>68.(c)</p>\r\n<p><span style=\"font-family: Roboto;\">I. x&sup3;</span><span style=\"font-family: Roboto;\"> + y&sup3;</span><span style=\"font-family: Roboto;\"> + z&sup3;</span><span style=\"font-family: Roboto;\">&nbsp;</span><span style=\"font-family: Roboto;\">= 12&sup3; - 2&sup3; - 10&sup3;</span><span style=\"font-family: Roboto;\">&nbsp;</span><span style=\"font-family: Roboto;\">= 1728 - 8 - 1000 = 720</span></p>\r\n<p><span style=\"font-family: Roboto;\">II. 4<span style=\"font-weight: 400;\">(</span><span style=\"font-weight: 400;\">x&sup2;</span><span style=\"font-weight: 400;\">+</span><span style=\"font-weight: 400;\">y&sup2;</span><span style=\"font-weight: 400;\">)</span></span><span style=\"font-family: Roboto;\"> = <span style=\"font-weight: 400;\">4[</span><span style=\"font-weight: 400;\">(x+y</span><span style=\"font-weight: 400;\">)&sup2;</span><span style=\"font-weight: 400;\">-2xy]</span></span><span style=\"font-family: Roboto;\"> = 4[<span style=\"font-weight: 400;\">(4</span><span style=\"font-weight: 400;\">8)&sup2;</span><span style=\"font-weight: 400;\">-64]</span></span><span style=\"font-family: Roboto;\"> = 4</span><span style=\"font-family: Roboto;\"> [<span style=\"font-weight: 400;\">2304-64] </span>= 4&times;2240 </span><span style=\"font-family: Roboto;\">= 8960</span></p>\r\n<p><span style=\"font-family: Roboto;\">Clearly, we can see that both statements I and II are correct.</span></p>\n",

                questions.push({

                    question_hi: "<p>70. <span style=\"font-family: Palanquin Dark;\">&#2344;&#2367;&#2350;&#2381;&#2344;&#2354;&#2367;&#2326;&#2367;&#2340; &#2342;&#2306;&#2337; &#2310;&#2352;&#2375;&#2326; &#2350;&#2375;&#2306; 5 &#2325;&#2306;&#2346;&#2344;&#2367;&#2351;&#2366;&#2306; A, B, C, D &#2324;&#2352; E &#2361;&#2376;&#2306;&#2404; &#2310;&#2352;&#2375;&#2326; &#2319;&#2325; &#2313;&#2340;&#2381;&#2346;&#2366;&#2342; &#2325;&#2368; &#2350;&#2366;&#2306;&#2327; &#2324;&#2352; &#2313;&#2346;&#2352;&#2379;&#2325;&#2381;&#2340;</span></p>\r\n<p><span style=\"font-family: Palanquin Dark;\">&#2346;&#2366;&#2306;&#2330; &#2325;&#2306;&#2346;&#2344;&#2367;&#2351;&#2379;&#2306; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2313;&#2360;&#2325;&#2366; &#2313;&#2340;&#2381;&#2346;&#2366;&#2342;&#2344; &#2342;&#2352;&#2381;&#2358;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\r\n<p><span style=\"font-family: Palanquin Dark;\"> </span><span style=\"font-family: Palanquin Dark;\"> </span><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1679027574/word/media/image22.png\" width=\"405\" height=\"278\"></p>\r\n<p><span style=\"font-family: Palanquin Dark;\">&#2351;&#2342;&#2367; &#2325;&#2306;&#2346;&#2344;&#2368; C &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2313;&#2340;&#2381;&#2346;&#2366;&#2342; &#2325;&#2368; &#2350;&#2366;&#2306;&#2327; &#2325;&#2366; x% &#2325;&#2306;&#2346;&#2344;&#2368; B &#2325;&#2368; &#2350;&#2366;&#2306;&#2327; &#2325;&#2375; &#2348;&#2352;&#2366;&#2348;&#2352; &#2361;&#2376;, &#2340;&#2379; x &#2325;&#2366; &#2350;&#2366;&#2344; &#2332;&#2381;&#2334;&#2366;&#2340; &#2325;&#2368;&#2332;&#2367;&#2319; &#2404;</span></p>\n",

                questions.push({
                    id: "71",

                questions.push({
                    id: "78",

                    question_en: "<p><span style=\"font-family: Roboto;\">78. The following sentence has been split into four segments. Identify the segment that </span><span style=\"font-family: Roboto;\">contains a grammatical error.</span></p>\r\n<p><span style=\"font-family: Roboto;\">Usually, Ratheesh hasn&rsquo;t / take part in these types / of events because of / his hectic </span><span style=\"font-family: Roboto;\">schedule.</span></p>\n",
                    question_hi: " <p><span style=\"font-family:Roboto\">78. The following sentence has been split into four segments. Identify the segment that</span></p> <p><span style=\"font-family:Roboto\">contains a grammatical error.</span></p> <p><span style=\"font-family:Roboto\">Usually, Ratheesh hasn’t / take part in these types / of events because of / his hectic</span></p> <p><span style=\"font-family:Roboto\">schedule.</span></p>",

                    options_hi: [" <p>  take part in these types</span></p>", " <p> of events because of </span></p>",
                                " <p>  his hectic schedule</span></p>", " <p> Usually, Ratheesh hasn’t</span></p>"],
                    solution_en: "<p>78.(d)<span style=\"font-family: Roboto;\"> Usually, Ratheesh hasn&rsquo;t </span></p>\r\n<p><span style=\"font-family: Roboto;\">The given sentence starts with the word &lsquo;Usually&rsquo; which means the sentence is in an habitual action and we use &lsquo;present indefinite tense&rsquo; to show an habitual action. Hence, &ldquo;</span><span style=\"font-family: Roboto;\">hasn&rsquo;t</span><span style=\"font-family: Roboto;\">&rdquo; must be replaced with &ldquo;doesn&rsquo;t&rsquo;&rsquo; &amp; &lsquo;Usually, Ratheesh doesn&rsquo;t&rsquo; becomes the most appropriate answer.</span></p>\n",
                    solution_hi: " <p> 78.(d)</span><span style=\"font-family:Roboto\"> Usually, Ratheesh hasn’t </span></p> <p><span style=\"font-family:Palanquin\">दिया गया sentence ‘Usually’ word से शुरू होता है जिसका अर्थ है कि sentence एक habitual action में है और हम एक habitual action को दर्शाने के लिए ‘present indefinite tense’ का उपयोग करते हैं। इसलिए, “</span><span style=\"font-family:Palanquin\">hasn’t</span><span style=\"font-family:Palanquin\">”  को “doesn’t’’ से बदला जाना चाहिए और ‘Usually, Ratheesh doesn’t’ सबसे उपयुक्त उत्तर बन जाता है।</span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });

        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;

            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
