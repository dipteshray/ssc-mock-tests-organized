                    options_hi: ["<p>2<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math> से.मी.</p>", "<p>5<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math> से.मी.</p>",
                                "<p>4<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math> से.मी.</p>", "<p>3<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math> से. मी.</p>"],
                    solution_en: "<p>55.(d)</p>\n<p><span style=\"font-family: Roboto;\">Radius of circumcircle of an equilateral triangle = </span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">a</mi><msqrt><mn>3</mn></msqrt></mfrac></math> =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><msqrt><mn>3</mn></msqrt></mfrac></math> = 3<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math> cm</p>",
                    solution_hi: "<p>55.(d)<br><span style=\"font-family: Palanquin;\">एक समबाहु त्रिभुज के परिवृत्त की त्रिज्या</span><span style=\"font-family: Roboto;\">&nbsp;= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">a</mi><msqrt><mn>3</mn></msqrt></mfrac></math> =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><msqrt><mn>3</mn></msqrt></mfrac></math> = 3<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math> cm</span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "56",
                    section: "17",
                    question_en: "<p>56. Shiva&rsquo;s monthly salary is Rs.75,000. He spends Rs.12,000 on household items, <span style=\"font-family: Roboto;\">Rs.14,000 on LIC and mutual funds, Rs.15,000 on his children&rsquo;s education, and keeps </span><span style=\"font-family: Roboto;\">Rs.10,000 for miscellaneous expenses. His savings are Rs.21,000 per month and he </span><span style=\"font-family: Roboto;\">donates the rest of the amount to an orphanage. The percentage of his income that he </span><span style=\"font-family: Roboto;\">donates is:</span></p>\n<p><span style=\"font-family: Roboto;\"> </span></p>",
                    question_hi: "<p>56. शिव का मासिक वेतन Rs.75,000 है। वह घरेलू सामानों पर Rs. 12,000, एलआईसी और म्यूचुअल फंड पर Rs.14,000, अपने बच्चों की शिक्षा पर Rs.15,000 खर्च करता है और फुटकर खर्ची के लिए Rs.10,000 रखता है। उसकी बचत Rs. 21,000 प्रति माह है और वह शेष राशि एक अनाथालय को दान कर देता है। उसकी आय का प्रतिशत, जो वह दान करता है वह है:</p>",
                    options_en: ["<p>3%</p>", "<p>6%</p>", 
                                "<p>8%</p>", "<p>4%</p>\n<p><span style=\"font-family: Roboto;\"> </span></p>"],
                    options_hi: ["<p>3%</p>", "<p>6%</p>",
                                "<p>8%</p>", "<p>4%</p>"],
                    solution_en: "<p>56.(d)</p>\n<p><span style=\"font-family: Roboto;\">Total amount spent by Shiva = 12,000 + 14,000 + 15,000 + 10,000 = ₹51,000</span></p>\n<p><span style=\"font-family: Roboto;\">Remaining amount = 75,000 - 51,000 = ₹24,000</span></p>\n<p><span style=\"font-family: Roboto;\">Total money donated to an orphanage = 24,000 - 21,000 = ₹3,000</span></p>\n<p><span style=\"font-family: Roboto;\">Required percentage = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mfrac><mrow><mn>3</mn><mo>,</mo><mn>000</mn></mrow><mrow><mn>75</mn><mo>,</mo><mn>000</mn></mrow></mfrac></math> </span><span style=\"font-family: Roboto;\">&times; 100 = 4%</span></p>",
                    solution_hi: "<p>56.(d)<br><span style=\"font-family: Palanquin;\">शिव द्वारा खर्च की गई कुल राशि = 12,000 + 14,000+ 1 5,000 + 10,000 = ₹51,000</span><br><span style=\"font-family: Palanquin;\">शेष राशि = 75,000 - 51,000 = ₹24,000</span><br><span style=\"font-family: Palanquin;\">अनाथालय को दान की गई कुल धनराशि = 24,000 - 21,000 = ₹3,000</span><br><span style=\"font-family: Palanquin;\">आवश्यक प्रतिशत =<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><mo>,</mo><mn>000</mn></mrow><mrow><mn>75</mn><mo>,</mo><mn>000</mn></mrow></mfrac></math> </span><span style=\"font-family: Roboto;\">&times; 100 = 4%</span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "57",
                    section: "17",
                    question_en: "<p>57. The following line graph displays the ratio of exports to imports (in terms of money in ₹crores) of company A from 2010 to 2015.<br><span style=\"font-family: Roboto;\">Study the graph carefully and answer the question based on the given line graph.<br></span><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675409212/word/media/image15.png\" width=\"332\" height=\"240\"><br><span style=\"font-family: Roboto;\">In how many years, the export of company A was more than the company\'s import?</span></p>",
                    question_hi: "<p>57. निम्नलिखित रेखा आलेख 2010 से 2015 तक कंपनी A के निर्यात और आयात (₹ करोड़ में धन के संदर्भ में) के अनुपात को प्रदर्शित करता है। आलेख का ध्यानपूर्वक अध्ययन कीजिए और दिए गए रेखा आलेख के आधार पर प्रश्न का उत्तर दीजिए ।<br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675409212/word/media/image15.png\" width=\"325\" height=\"236\"><br><span style=\"font-family: Palanquin Dark;\">कितने वर्षों में कंपनी A का निर्यात कंपनी के आयात से अधिक था ?</span></p>",
                    options_en: ["<p>Four</p>", "<p>Two</p>", 
                                "<p>Six</p>", "<p>Three</p>"],
                    options_hi: ["<p>चार</p>", "<p>दो</p>",
                                "<p>छह</p>", "<p>तीन</p>"],
                    solution_en: "<p>57.(a)<br><span style=\"font-family: Roboto;\">The ratio of export and import of company A in 2010 = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mn>10</mn></mfrac></math></span><br><span style=\"font-family: Roboto;\">The ratio of export and import of company A in 2011 = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>12</mn><mn>10</mn></mfrac></math></span><br><span style=\"font-family: Roboto;\">The ratio of export and import of company A in 2012 = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>7</mn><mn>10</mn></mfrac></math></span><br><span style=\"font-family: Roboto;\">The ratio of export and import of company A in 2013 = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>24</mn><mn>10</mn></mfrac></math></span><br><span style=\"font-family: Roboto;\">The ratio of export and import of company A in 2014 = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>36</mn><mn>10</mn></mfrac></math></span><br><span style=\"font-family: Roboto;\">The ratio of export and import of company A in 2015 = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>24</mn><mn>10</mn></mfrac></math></span><br><span style=\"font-family: Roboto;\">Clearly, we can see that the export of company A was more than company&rsquo;s import in 4 years. </span></p>",
                    solution_hi: "<p>57.(a)<br><span style=\"font-family: Palanquin;\">2010 में कंपनी A के निर्यात और आयात का अनुपात = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mn>10</mn></mfrac></math></span><br><span style=\"font-family: Palanquin;\">2011 में कंपनी A के निर्यात और आयात का अनुपात = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>12</mn><mn>10</mn></mfrac></math></span><br><span style=\"font-family: Palanquin;\">2012 में कंपनी A के निर्यात और आयात का अनुपात = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>7</mn><mn>10</mn></mfrac></math></span><br><span style=\"font-family: Palanquin;\">2013 में कंपनी A के निर्यात और आयात का अनुपात = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>24</mn><mn>10</mn></mfrac></math></span><br><span style=\"font-family: Palanquin;\">2014 में कंपनी A के निर्यात और आयात का अनुपात = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>36</mn><mn>10</mn></mfrac></math></span><br><span style=\"font-family: Palanquin;\">2015 में कंपनी A के निर्यात और आयात का अनुपात = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>24</mn><mn>10</mn></mfrac></math> </span><br><br><span style=\"font-family: Palanquin;\">स्पष्ट रूप से, हम देख सकते हैं कि कंपनी A का निर्यात 4 वर्षों में कंपनी के आयात से अधिक था।</span></p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({

                    section: "17",

                    solution_en: "<p>62.(a)<br><span style=\"font-family: Palanquin Dark;\"><span style=\"font-family: Roboto;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">b</mi></mfrac></math> +&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">b</mi><mi mathvariant=\"normal\">a</mi></mfrac></math> = -1<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msup><mi mathvariant=\"normal\">a</mi><mn>2</mn></msup><mo>+</mo><msup><mi mathvariant=\"normal\">b</mi><mn>2</mn></msup></mrow><mi>ab</mi></mfrac></math> <span style=\"font-family: Palanquin Dark;\"><span style=\"font-family: Roboto;\">= -1</span></span></span></span><br>a<sup>2</sup> + b<sup>2</sup> = -ab<br>Now, (a - b)<sup>2</sup> = a<sup>2</sup> + b<sup>2 </sup>- 2ab<br>4 = a<sup>2</sup> + b<sup>2 </sup>- 2ab = - ab - 2ab = -3ab<br>ab = - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>3</mn></mfrac></math><br>a<sup>3</sup> - b<sup>3</sup> = (a - b)(a - b)<sup>2</sup> + 3ab <br>= 24 + 3 &times; (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>-</mo><mn>4</mn></mrow><mn>3</mn></mfrac></math>) = 2 &times; 0 = 0</p>",

                    question_hi: "<p>63. एक व्यक्ति ने 3 समान वार्षिक किस्तों में प्रतिदेय 5% वार्षिक साधारण ब्याज पर ₹2,000 उधार लिए । वार्षिक किस्त क्या होगी ?</p>",

                                "<p>₹640<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>11</mn><mn>63</mn></mfrac></math><span style=\"font-family: Roboto;\"> </span></p>", "<p>₹250<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>10</mn><mn>63</mn></mfrac></math><span style=\"font-family: Roboto;\"> </span></p>"],
                    options_hi: ["<p>₹730<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>10</mn><mn>63</mn></mfrac></math><span style=\"font-family: Palanquin Dark;\"> </span></p>", "<p>₹840<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mn>61</mn></mfrac></math><span style=\"font-family: Palanquin Dark;\"> </span></p>",
                                "<p>₹640<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>11</mn><mn>63</mn></mfrac></math><span style=\"font-family: Palanquin Dark;\"> </span></p>", "<p>₹250<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>10</mn><mn>63</mn></mfrac></math><span style=\"font-family: Palanquin Dark;\"> </span></p>"],
                    solution_en: "<p>63.(a)<br><span style=\"font-family: Roboto;\">Rate = 5% = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>20</mn></mfrac></math></span><span style=\"font-family: Roboto;\"> , principal amount = ₹2,000</span><br><span style=\"font-family: Roboto;\">Due debt = 2000 + 15% of 2000 = ₹2300</span><br><span style=\"font-family: Roboto;\">Now, total due debt = 20 &times; 3 + 1(1 + 2) = 60 + 3 = 63 unit which corresponds to ₹2300</span><br><span style=\"font-family: Roboto;\">So, 20 unit corresponds to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2300</mn><mn>63</mn></mfrac></math> </span><span style=\"font-family: Roboto;\">&times; 20 =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>46000</mn><mn>63</mn></mfrac></math></span><span style=\"font-family: Roboto;\"> = ₹730<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>10</mn><mn>63</mn></mfrac></math></span><br><span style=\"font-family: Roboto;\">So, annual installment of a person= ₹730<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>10</mn><mn>63</mn></mfrac></math></span></p>",
                    solution_hi: "<p>63.(a)<br><span style=\"font-family: Palanquin;\">दर = 5% = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>20</mn></mfrac></math></span><span style=\"font-family: Palanquin;\"> , मूल राशि = ₹2,000</span><br><span style=\"font-family: Palanquin;\">देय ऋण = 2000 + 15% of 2000 = ₹2300</span><br><span style=\"font-family: Palanquin;\">अब, कुल देय ऋण = 20 &times; 3 + 1(1 + 2) = 60 + 3 = 63 इकाई जो ₹2300 के बराबर है</span><br><span style=\"font-family: Palanquin;\">इसलिए, 20 इकाई <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2300</mn><mn>63</mn></mfrac></math></span><span style=\"font-family: Roboto;\">&times;20 = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>46000</mn><mn>63</mn></mfrac><mspace linebreak=\"newline\"></mspace></math></span><span style=\"font-family: Roboto;\"> = ₹730<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>10</mn><mn>63</mn></mfrac></math> </span><span style=\"font-family: Roboto;\"><span style=\"font-family: Palanquin;\">के बराबर है<br></span></span><span style=\"font-family: Palanquin;\">तो, एक व्यक्ति की वार्षिक किस्त = ₹730<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>10</mn><mn>63</mn></mfrac></math></span></p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "64",
                    section: "17",
                    question_en: "<p>64.Two persons A and B working separately can sanitise a building in 6 and 10 hours, <span style=\"font-family: Roboto;\">respectively. They work in stretches of one hour alternately. If A begins at 8 a.m., then </span><span style=\"font-family: Roboto;\">when will the work be finished ?</span></p>\n<p><span style=\"font-family: Roboto;\"> </span></p>",
                    question_hi: "<p>64. दो व्यक्ति A और B अलग-अलग काम करके किसी भवन को क्रमशः 6 और 10 घंटे में स्वच्छ कर सकते हैं। वे बारी-बारी से एक-एक घंटे के अंतराल पर काम करते हैं। यदि 8 a.m पर A कार्य प्रारंभ करता है, तो वह कार्य कितनी देर में समाप्त होगा ?</p>",
                    options_en: ["<p>9<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math><span style=\"font-family: Roboto;\">h</span></p>", "<p>7<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math><span style=\"font-family: Roboto;\">h </span></p>", 
                                "<p>6<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math><span style=\"font-family: Roboto;\">h </span></p>", "<p>8<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math><span style=\"font-family: Roboto;\">h </span></p>"],
                    options_hi: ["<p>9<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math><span style=\"font-family: Palanquin Dark;\">h </span></p>", "<p>7<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math><span style=\"font-family: Palanquin Dark;\">h </span></p>",
                                "<p>6<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math><span style=\"font-family: Palanquin Dark;\">h </span></p>", "<p>8<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math><span style=\"font-family: Palanquin Dark;\">h </span></p>"],
                    solution_en: "<p>64.(b)<br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675409212/word/media/image11.png\" width=\"180\" height=\"154\"><br><span style=\"font-family: Roboto;\">Work done by A and B alone to complete 1 cycle (2hrs) = 5 + 3 = 8 unit</span><br><span style=\"font-family: Roboto;\">Then, work done in 3 cycle (6 hrs) = 8 &times; 3 = 24 unit</span><br><span style=\"font-family: Roboto;\">Remaining work = 30 - 24 = 6 unit i.e. 5 unit work is completed by A in 1 hr and 1 unit work by B in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math></span><span style=\"font-family: Roboto;\"> hrs</span><br><span style=\"font-family: Roboto;\">So, required time taken by them to complete the whole work = 6 + 1 + <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math> </span><span style=\"font-family: Roboto;\">&nbsp;= 7</span><span style=\"font-family: Roboto;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math>hrs</span></p>",
                    solution_hi: "<p>64.(b)<br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675409212/word/media/image11.png\" width=\"154\" height=\"132\"><br><span style=\"font-family: Palanquin;\">1 चक्र (2 घंटे) में A और B द्वारा अकेले किया गया कार्य = 5 + 3 = 8 इकाई</span><br><span style=\"font-family: Palanquin;\">फिर, 3 चक्र (6 घंटे) में किया गया कार्य = 8 &times; 3 = 24 यूनिट</span><br><span style=\"font-family: Palanquin;\">शेष कार्य = 30 - 24 = 6 इकाई अर्थात 5 इकाई का काम A द्वारा 1 घंटे में और 1 यूनिट का काम B द्वारा <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math></span><span style=\"font-family: Palanquin;\"> घंटे में पूरा किया जाता है</span><br><span style=\"font-family: Palanquin;\">इसलिए, पूरे काम को पूरा करने के लिए उनके द्वारा आवश्यक लिया गया समय = 6 + 1 + <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math></span><span style=\"font-family: Roboto;\"> = 7<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math></span><span style=\"font-family: Palanquin;\"> घंटे</span></p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "65",
                    section: "17",
                    question_en: "<p>65. The area of two similar triangles are 324 cm<sup>2</sup>&nbsp;<span style=\"font-family: Palanquin;\">and 289 cm<sup>2</sup>&nbsp;</span><span style=\"font-family: Palanquin;\">, respectively. What is the </span><span style=\"font-family: Palanquin;\">ratio of their corresponding altitudes ?</span></p>",
                    question_hi: "<p>65. किन्हीं दो समरूप त्रिभुजों के क्षेत्रफल क्रमशः 324 cm<sup>2</sup> <span style=\"font-family: Palanquin Dark;\">&nbsp;और 289 cm<sup>2</sup>&nbsp;</span><span style=\"font-family: Palanquin Dark;\">हैं। उनके संगत शीर्षलंबो का अनुपात ज्ञात कीजिए।</span></p>",
                    options_en: ["<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>17</mn><mn>18</mn></mfrac></math><span style=\"font-family: Palanquin;\"> </span></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>17</mn><mn>19</mn></mfrac></math><span style=\"font-family: Palanquin;\"> </span></p>", 
                                "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>19</mn><mn>17</mn></mfrac></math><span style=\"font-family: Palanquin;\"> </span></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>18</mn><mn>17</mn></mfrac></math></p>"],
                    options_hi: ["<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>17</mn><mn>18</mn></mfrac></math><span style=\"font-family: Palanquin Dark;\"> </span></p>", "<p><span style=\"font-family: Palanquin Dark;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>17</mn><mn>19</mn></mfrac></math> </span></p>",
                                "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>19</mn><mn>17</mn></mfrac></math><span style=\"font-family: Palanquin Dark;\"> </span></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>18</mn><mn>17</mn></mfrac></math></p>"],
                    solution_en: "<p>65.(d)<br><span style=\"font-family: Roboto;\">It is given that two triangles are similar. So, ratio of their altitudes </span><span style=\"font-family: Roboto;\">= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msqrt><mn>324</mn></msqrt><msqrt><mn>289</mn></msqrt></mfrac></math> =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>18</mn><mn>17</mn></mfrac></math></span></p>",
                    solution_hi: "<p>65.(d)<br><span style=\"font-family: Palanquin;\">दिया गया है कि दो त्रिभुज समरूप हैं। तो, उनकी ऊंचाई का अनुपात <span style=\"font-family: Roboto;\">= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msqrt><mn>324</mn></msqrt><msqrt><mn>289</mn></msqrt></mfrac></math> =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>18</mn><mn>17</mn></mfrac></math></span></span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "66",
                    section: "17",
                    question_en: "<p>66. The pie-chart shows marks of a student in different subjects out of 100.<br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675409212/word/media/image13.png\" width=\"237\" height=\"229\"><br><span style=\"font-family: Roboto;\">The marks scored in Hindi and Mathematics are more than the marks scored in English and Science by:</span></p>",
                    question_hi: "<p>66. पाई चार्ट एक छात्र के विभिन्न विषयों में 100 में से प्राप्त अंक दर्शाता है।<br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675409212/word/media/image13.png\" width=\"235\" height=\"227\"><br><span style=\"font-family: Palanquin Dark;\">हिंदी और गणित में प्राप्त अंक अंग्रेजी और विज्ञान में प्राप्त अंकों से_____अधिक हैं।</span></p>",
                    options_en: ["<p>35</p>", "<p>25</p>", 
                                "<p>20</p>", "<p>30</p>"],
                    options_hi: ["<p>35</p>", "<p>25</p>",
                                "<p>20</p>", "<p>30</p>"],
                    solution_en: "<p>66.(b)<br><span style=\"font-family: Roboto;\">Marks scored in Hindi and Mathematics = 90 + 70 = 160</span><br><span style=\"font-family: Roboto;\">Marks scored in English and Science = 55 + 80 = 135</span><br><span style=\"font-family: Roboto;\">Required difference = 160 - 135 = 25</span></p>",
                    solution_hi: "<p>66.(b)<br><span style=\"font-family: Palanquin;\">हिंदी और गणित में प्राप्त अंक = 90 + 70 = 160</span><br><span style=\"font-family: Palanquin;\">अंग्रेजी और विज्ञान में प्राप्त अंक = 55 + 80 = 135</span><br><span style=\"font-family: Palanquin;\">आवश्यक अंतर = 160 - 135 = 25</span></p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "67",
                    section: "17",
                    question_en: "<p>67. Train A running at 81 km/h takes 72 sec to overtake train B, when both the trains are&nbsp;<span style=\"font-family: Palanquin;\">running in the same direction, but it takes 36 sec to cross each other if the trains are&nbsp;</span><span style=\"font-family: Palanquin;\">running in the opposite direction. If the length of train B is 600 metres, then find the </span><span style=\"font-family: Palanquin;\">length of train A. (in metres)</span></p>\n<p><span style=\"font-family: Palanquin;\"> </span></p>",
                    question_hi: "<p>67. 81 km/h की चाल से चलने वाली ट्रेन A, ट्रेन B से आगे निकलने में 72 sec का समय तब लेती है, जब दोनों ट्रेनें एक ही दिशा में चल रही होती हैं, लेकिन यदि ट्रेनें विपरीत दिशा में चल रही हैं, तो एक-दूसरे को पार करने में 36 sec का समय लेती हैं। यदि ट्रेन B की लंबाई 600 मीटर है, तो ट्रेन A की लंबाई ज्ञात करें। (मीटर में)</p>",
                    options_en: ["<p>600</p>", "<p>480</p>", 
                                "<p>590</p>", "<p>900</p>"],
                    options_hi: ["<p>600</p>", "<p>480</p>",
                                "<p>590</p>", "<p>900</p>"],
                    solution_en: "<p>67.(b)<br><span style=\"font-family: Roboto;\">Let the speed of B and length of train A be x km/hr and y m respectively</span><br><span style=\"font-family: Roboto;\">Relative speed of train when running in same direction = (81 - x) km/hr</span><br><span style=\"font-family: Roboto;\">Relative speed of train when running in opposite direction = (81 +x) km/hr</span><br><span style=\"font-family: Roboto;\">ATQ,</span><br>(81 - x) &times; 72 &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>18</mn></mfrac></math> = (81 + x) &times; 36 &times;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>18</mn></mfrac></math><br>(81 - x) &times; 20 = (81 + x)10<br>162 - 2x = 81 + x<br>3x = 81<br>x = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>81</mn><mn>3</mn></mfrac></math> = 27 m/sec<br><span style=\"font-family: Roboto;\">Now , the length of (train A + trainB) = (81 + 27)10 = 1080</span><br><span style=\"font-family: Roboto;\">600 + y = 1080&nbsp;</span><br><span style=\"font-family: Roboto;\">y = 1080 - 600 = 480 m</span></p>",
                    solution_hi: "<p>67.(b)<br><span style=\"font-family: Palanquin;\">माना B की गति और ट्रेन A की लंबाई क्रमशः x km/h और y मी है</span><br><span style=\"font-family: Palanquin;\">एक ही दिशा में चलने पर ट्रेन की सापेक्ष गति = (81 - x) km/hr</span><br><span style=\"font-family: Palanquin;\">विपरीत दिशा में चलने पर ट्रेन की सापेक्ष गति= (81 +x) km/hr</span><br><span style=\"font-family: Palanquin;\">प्रश्न के अनुसार</span><span style=\"font-family: Roboto;\"> ,</span><br>(81 - x) &times; 72 &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>18</mn></mfrac></math> = (81 + x) &times; 36 &times;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>18</mn></mfrac></math><br>(81 - x) &times; 20 = (81 + x)10<br>162 - 2x = 81 + x<br>3x = 81<br>x = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>81</mn><mn>3</mn></mfrac></math> = 27 m/sec<br><span style=\"font-family: Palanquin;\">अब , (ट्रेन &nbsp;A + ट्रेन B) की लंबाई = (81 + 27)10 = 1080 मी</span><br><span style=\"font-family: Roboto;\">600 + y = 1080</span><br><span style=\"font-family: Palanquin;\">y = 1080 - 600 = 480 मी </span></p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "68",
                    section: "17",
                    question_en: "<p>68. An airplane goes 14 km due east and then 48 km due north. How far is it from its initial <span style=\"font-family: Palanquin;\">position ?</span></p>",
                    question_hi: "<p>68. एक हवाई जहाज पूर्व की ओर 14 km और फिर उत्तर की ओर 48 km जाता है। यह अपनी प्रारंभिक स्थिति से कितनी दूर है ?</p>",

                    options_hi: ["<p>14 km</p>", "<p>48 km</p>",
                                "<p>50 km</p>", "<p>28 km</p>"],
                    solution_en: "<p>68.(c)<br><span style=\"font-family: Roboto;\">Applying the directions given in the question, we have following figure:<br></span><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675409212/word/media/image18.png\" width=\"144\" height=\"139\"><br><span style=\"font-family: Roboto;\">AC = </span><span style=\"font-family: Roboto;\"> </span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><msup><mn>48</mn><mn>2</mn></msup><mo>+</mo><msup><mn>14</mn><mn>2</mn></msup></msqrt></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2304</mn><mo>+</mo><mn>196</mn></msqrt></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2500</mn></msqrt></math><span style=\"font-family: Roboto;\">&nbsp;</span><span style=\"font-family: Roboto;\">= 50 km</span></p>",
                    solution_hi: "<p>68.(c)<br><span style=\"font-family: Palanquin;\">प्रश्न में दिए गए निर्देशों को लागू करने पर हमें निम्नलिखित आकृति प्राप्त होती है:<br></span><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675409212/word/media/image18.png\" width=\"144\" height=\"139\"><br><span style=\"font-family: Roboto;\">AC = </span><span style=\"font-family: Roboto;\"> </span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><msup><mn>48</mn><mn>2</mn></msup><mo>+</mo><msup><mn>14</mn><mn>2</mn></msup></msqrt></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2304</mn><mo>+</mo><mn>196</mn></msqrt></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2500</mn></msqrt></math><span style=\"font-family: Roboto;\">&nbsp;</span><span style=\"font-family: Roboto;\">= 50 km</span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "69",
                    section: "17",
                    question_en: "<p>69. If ∆ABC &cong; ∆PQR and &ang;ABC = (x + 60)&deg;, &ang;PQR = (85 &ndash; 4x)&deg;, and &ang; RPQ = (3x + 65)&deg;, then the value of &ang;ABC in degree is:</p>",
                    question_hi: "<p>69. यदि ∆ABC &cong; ∆PQRहै और &ang;ABC = (x +60)&deg;, &ang;PQR = (85 - 4x)&deg; और &ang;RPQ = (3x+65)&deg;, तो &ang; ABC का मान डिग्री में_____ है।</p>",
                    options_en: ["<p>15</p>", "<p>5</p>", 
                                "<p>45</p>", "<p>65</p>"],
                    options_hi: ["<p>15</p>", "<p>5</p>",
                                "<p>45</p>", "<p>65</p>"],
                    solution_en: "<p>69.(d)<br><span style=\"font-family: Roboto;\">Since, &Delta;</span><span style=\"font-family: Roboto;\">ABC &cong; &Delta;</span><span style=\"font-family: Nova Mono;\">PQR. then, &ang;A = &ang;P, &ang;B = &ang;Q and &ang;C = &ang;R.</span><br><span style=\"font-family: Roboto;\">ATQ,</span><br><span style=\"font-family: Roboto;\">x + 60 = 85 - 4x</span><br><span style=\"font-family: Roboto;\">5x = 85 - 60 = 25&deg;</span><br><span style=\"font-family: Roboto;\">x = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>25</mn><mn>5</mn></mfrac></math> </span><span style=\"font-family: Roboto;\">= 5&deg;</span><br><span style=\"font-family: Nova Mono;\">So, &ang;ABC = 5 + 60 = 65&deg;</span></p>",
                    solution_hi: "<p>69.(d)<br><span style=\"font-family: Palanquin;\">चूँकि , <span style=\"font-family: Roboto;\">&Delta;</span></span><span style=\"font-family: Roboto;\">ABC &cong; &Delta;</span><span style=\"font-family: Arial Unicode MS;\">PQR. फिर, &ang;A = &ang;P, &ang;B = &ang;Q and &ang;C = &ang;R.</span><br><span style=\"font-family: Palanquin;\">प्रश्न के अनुसार</span><span style=\"font-family: Roboto;\">,</span><br><span style=\"font-family: Roboto;\">x + 60 = 85 - 4x</span><br><span style=\"font-family: Roboto;\">5x = 85 - 60 = 25&deg;</span><br><span style=\"font-family: Roboto;\">x = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>25</mn><mrow><mn>5</mn><mo>&#160;</mo></mrow></mfrac></math></span><span style=\"font-family: Roboto;\"> = 5&deg;</span><br><span style=\"font-family: Nova Mono;\">इसलिए , &ang;ABC = 5 + 60 = 65&deg;</span></p>\n<p><span style=\"font-family: Nova Mono;\"> </span></p>",
                    correct: "d",

                    neg_marks: 0.5

                questions.push({
                    id: "70",
                    section: "17",
                    question_en: "<p>70. If the number 6788934a4 is divisible by 11,then find the smallest whole number in the <span style=\"font-family: Nova Mono;\">place of a.</span></p>\n<p><span style=\"font-family: Nova Mono;\"> </span></p>",
                    question_hi: "<p>70. यदि संख्या 6788934a4, 11 से विभाज्य है, तो a के स्थान पर सबसे छोटी पूर्ण संख्या ज्ञात कीजिए ।</p>",
                    options_en: ["<p>3</p>", "<p>4</p>",

                    options_hi: ["<p>3</p>", "<p>4</p>",
                                "<p>5</p>", "<p>2</p>"],
                    solution_en: "<p>70.(d)<br><span style=\"font-family: Roboto;\">For 6788934a4 to be divisible by 11, the difference of the sum of its alternate digits i.e. (6 + 8 + 9 + 4 + 4) - (7 + 8 + 3 + a) = 31 - 18 - a = 13-a, should be divisible by 11.</span><br><span style=\"font-family: Roboto;\">For this, the value of a should be 2.</span><br><span style=\"font-family: Roboto;\">&rArr; 13 - 2 = 11, divisible by 11.</span></p>",
                    solution_hi: "<p>70.(d)</p>\n<p><span style=\"font-family: Palanquin;\">6788934a4 को 11 से विभाज्य करने पर , इसके एकांतर अंकों के योग का अंतर अर्थात <span style=\"font-family: Roboto;\">(6 + 8 + 9 + 4 + 4) - (7 + 8 + 3 + a) = 31 - 18 - a = 13-a</span>, 11 से विभाज्य होना चाहिए।<br></span><span style=\"font-family: Palanquin;\">इसके लिए a का मान 2 होना चाहिए।<br></span><span style=\"font-family: Palanquin;\"><span style=\"font-family: Roboto;\">&rArr; </span>13 - 2 = 11, 11 से विभाज्य।</span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "71",
                    section: "17",
                    question_en: "<p>71. Ram sold an item costing Rs.1,250 at a gain of 18% to Ramesh. It was again sold by&nbsp;<span style=\"font-family: Palanquin;\">Ramesh to Shyam at a loss of 10%. Find the selling price of Ramesh.</span></p>\n<p><span style=\"font-family: Palanquin;\"> </span></p>",
                    question_hi: "<p>71. राम ने Rs. 1,250 की एक वस्तु रमेश को 18% के लाभ पर बेची। इसे रमेश द्वारा श्याम को फिर से 10% की हानि पर बेच दिया गया। रमेश का विक्रय मूल्य ज्ञात कीजिए ।</p>",

                    solution_en: "<p>71.(d)<br><span style=\"font-family: Roboto;\">Let the CP of an item for Ram be 100 unit</span><br><span style=\"font-family: Roboto;\">Then, SP of an item for Ram = CP of the same item for Ramesh = 100 &times; 118% = 118 unit</span><br><span style=\"font-family: Roboto;\">So, SP of the item for Ramesh = 118 &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mn>10</mn></mfrac></math>&nbsp;</span><span style=\"font-family: Roboto;\">= 106.2 unit</span><br><span style=\"font-family: Roboto;\">Here, 100 unit corresponds to ₹1250</span><br><span style=\"font-family: Roboto;\">Then, 106.2 unit corresponds to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1250</mn><mn>100</mn></mfrac></math> </span><span style=\"font-family: Roboto;\">&times; 106.2 = ₹1327.50</span></p>",

                    correct: "d",
                    pos_marks: 2.0,

                });
                questions.push({

                    question_hi: "<p>100. <strong>Cloze Test : <br></strong><span style=\"font-weight: 400;\">A hummingbird&rsquo;s brilliant throat colour is not caused by feather (96)_____, but rather by </span><span style=\"font-weight: 400;\">iridescence in the arrangement of the feathers. Light level, moisture, angle of viewing, wear </span><span style=\"font-weight: 400;\">and tear and other factors all (97)_____ just how bright and colourful the throat may appear. </span><span style=\"font-weight: 400;\">Hummingbirds cannot walk or hop, though their feet can be used to (98)_____ sideways while </span><span style=\"font-weight: 400;\">they are perched. These birds have evolved smaller feet to be lighter for more (99)_____ </span>flying. They will use their feet for itching and (100)______, however.<br>Select the most appropriate option to fill in blank number 100.</p>\n<p><span style=\"font-family: Palanquin;\"> </span></p>",
                    options_en: ["<p>preening</p>", "<p>devouring</p>", 
                                "<p>flouncing</p>", "<p>scintillating</p>"],
                    options_hi: ["<p>preening</p>", "<p>devouring</p>",
                                "<p>flouncing</p>", "<p>scintillating</p>"],
                    solution_en: "<p>100.(a)<br><span style=\"font-family: Roboto;\">&lsquo;Preening&rsquo; means to clean feathers of a bird. The given passage states that </span><span style=\"font-family: Roboto;\">they will use their feet for itching and preening</span><span style=\"font-family: Roboto;\">. Hence, &lsquo;preening&rsquo; is the most appropriate answer.</span></p>",
                    solution_hi: "<p>100.(a)<br><span style=\"font-family: Palanquin;\">&lsquo;Preening&rsquo; का अर्थ है किसी पक्षी के पंख साफ करना। दिए गए passage में कहा गया है कि वे अपने पैरों का उपयोग खुजली और शिकार के लिए करेंगे। इसलिए, &lsquo;preening&rsquo; सबसे उपयुक्त उत्तर है।</span></p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
