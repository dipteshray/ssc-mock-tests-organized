                    question_en: "<p>61.<span style=\"font-family: Cambria Math;\"> If 8A5146B is divisible by 88, then what is the value of B<sup>A </sup></span><span style=\"font-family: Cambria Math;\">?</span></p>",
                    question_hi: "<p>61.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">यदि</span><span style=\"font-family: Cambria Math;\"> 8A5146B, 88 </span><span style=\"font-family: Mangal;\">से</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">विभाज्य</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">है</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Mangal;\">तो</span><span style=\"font-family: Cambria Math;\"> B<sup>A</sup>&nbsp;</span><span style=\"font-family: Mangal;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">मान</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">क्या</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">है</span><span style=\"font-family: Cambria Math;\">?</span></p>",
                    options_en: ["<p>81</p>", "<p>64</p>", 
                                "<p>15</p>", "<p>12</p>"],
                    options_hi: ["<p>81</p>", "<p>64</p>",
                                "<p>15</p>", "<p>12</p>"],
                    solution_en: "<p>61.(b) <span style=\"font-family: Cambria Math;\">For 8A5146B to be divisible by 88, the given expression should be divisible by 8 and 11.</span><br><span style=\"font-family: Cambria Math;\">For expression 8A5146B to be divisible by 8, the last three digits must be divisible by 8.</span><br><span style=\"font-family: Cambria Math;\">So, last two digits 46B should be such that it should be divisible by 8,</span><br><span style=\"font-family: Cambria Math;\">If we take B = 4, then 46B = 464 which is divisible by 8, hence we got B = 4</span><br><span style=\"font-family: Cambria Math;\">For 8A5146B to</span><span style=\"font-family: Cambria Math;\"> be divisible by 11, either the sum total of odd places must be equals to sum total of even places or the difference between the number at even places and odd places must be divisible by 11.</span><br><span style=\"font-family: Cambria Math;\">So, 8 + 5 + 4 + 4 = 21 and A + 1 + 6 = A + 7</span><br><span style=\"font-family: Cambria Math;\">Here, if we take A +</span><span style=\"font-family: Cambria Math;\"> 7 = 21, then A = 14 which is not possible because A must be single digit number,</span><br><span style=\"font-family: Cambria Math;\">so, 21 &ndash; (A + 7) should be such that it is divisible by 11.</span><br><span style=\"font-family: Cambria Math;\">If we take A = 3 then 21 &ndash; (A + 7) = 21 &ndash; (3 + 7) = 21 &ndash; 10 = 11, so we got A = 3</span><br><span style=\"font-family: Cambria Math;\">Hence, B<sup>A</sup> = 4<sup>3</sup> =&nbsp;</span><span style=\"font-family: Cambria Math;\">64</span></p>",
                    solution_hi: "<p><span style=\"font-family: Cambria Math;\">61.(b) </span><span style=\"font-family: Cambria Math;\">8A5146B </span><span style=\"font-family: Mangal;\">के</span><span style=\"font-family: Cambria Math;\"> 88 </span><span style=\"font-family: Mangal;\">से</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">विभाज्य</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">होने</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">के</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">लिए</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Mangal;\">दिए</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">गए</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">व्यंजक</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">को</span><span style=\"font-family: Cambria Math;\"> 8 </span><span style=\"font-family: Mangal;\">और</span><span style=\"font-family: Cambria Math;\"> 11 </span><span style=\"font-family: Mangal;\">से</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">विभाज्य</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">होना</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">चाहिए।</span><br><span style=\"font-family: Mangal;\">व्यंजक</span><span style=\"font-family: Cambria Math;\"> 8A5146B </span><span style=\"font-family: Mangal;\">को</span><span style=\"font-family: Cambria Math;\"> 8 </span><span style=\"font-family: Mangal;\">से</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">विभाज्य</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">होने</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">के</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">लिए</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Mangal;\">अंतिम</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">तीन</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">अंक</span><span style=\"font-family: Cambria Math;\"> 8 </span><span style=\"font-family: Mangal;\">से</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">विभाज्य</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">होने</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">चाहिए।</span><br><span style=\"font-family: Mangal;\">अत</span><span style=\"font-family: Cambria Math;\">: </span><span style=\"font-family: Mangal;\">अंतिम</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">दो</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">अंक</span><span style=\"font-family: Cambria Math;\"> 46B </span><span style=\"font-family: Mangal;\">ऐसा</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">होना</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">चाहिए</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">कि</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">वह</span><span style=\"font-family: Cambria Math;\"> 8 </span><span style=\"font-family: Mangal;\">से</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">विभाज्य</span><span style=\"fon                     solution_en: "<p>69.(d)<br><span style=\"font-family: Cambria Math;\">Let total number of students in all five schools = 100<br></span><span style=\"font-family: Cambria Math;\">According to the question,<br></span><span style=\"font-family: Cambria Math;\"><strong id=\"docs-internal-guid-3e58c2d2-7fff-0cad-43ba-85f90c9c6721\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXcT8bDVSgwWEbCyHY-m9XBlmkgd2KokSYFWo5z4MfoC5fZnl8ZDqcREzlcK178ejRkwFHlWMm6wvdfXMkgjPK_a8ME04WC2OY-CnNsbscWRCczkxhDKGwk6oy6eX5qI79B2JOVQ0A?key=NAL5o9FIt-yjJDdEV21SuTmc\" width=\"313\" height=\"75\"><br></strong>Here, 51 corresponds to 360&deg;, so desired central angle <br></span><span style=\"font-family: Cambria Math;\">=<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>6</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>360</mn></mrow><mn>51</mn></mfrac></math> </span><span style=\"font-family: Cambria Math;\"> = 42.35 <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8776;</mo></math></span><span style=\"font-family: Cambria Math;\">&nbsp;42&deg;</span></p>",

                questions.push({
                    id: "70",
                    section: "17",
                    question_en: "<p>70.<span style=\"font-family: Cambria Math;\"> A and B are two prime numbers such that A &gt; B and their LCM is 209. The value of A&sup2;-b</span><span style=\"font-family: Cambria Math;\">&nbsp;is:</span></p>",
                    question_hi: "<p>70.<span style=\"font-family: Cambria Math;\"> A </span><span style=\"font-family: Mangal;\">और</span><span style=\"font-family: Cambria Math;\"> B </span><span style=\"font-family: Mangal;\">ऐसी</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">दो</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">अभाज्य</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">संख्याएँ</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">हैं</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">कि</span><span style=\"font-family: Cambria Math;\"> A &gt; B </span><span style=\"font-family: Mangal;\">और</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">उनका</span><span style=\"font-family: Cambria Math;\"> LCM 209 </span><span style=\"font-family: Mangal;\">है।</span><span style=\"font-family: Cambria Math;\"> A&sup2;-b&nbsp;</span><span style=\"font-family: Mangal;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">मान</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">है</span><span style=\"font-family: Cambria Math;\">:</span></p>",
                    options_en: ["<p>350</p>", "<p>372</p>", 
                                "<p>361</p>", "<p>339</p>"],
                    options_hi: ["<p>350</p>", "<p>372</p>",
                                "<p>361</p>", "<p>339</p>"],
                    solution_en: "<p>70.(a)<br><span style=\"font-family: Cambria Math;\">In case of prime numbers, product of prime numbers</span><br><span style=\"font-family: Cambria Math;\">= LCM of prime numbers and HCF = 1</span><br><span style=\"font-family: Cambria Math;\">According to the question,</span><br><span style=\"font-family: Cambria Math;\">A &times; </span><span style=\"font-family: Cambria Math;\">B = LCM &times; </span><span style=\"font-family: Cambria Math;\">HCF = 209 &times; </span><span style=\"font-family: Cambria Math;\">1 = 209</span><br><span style=\"font-family: Cambria Math;\">A &times; </span><span style=\"font-family: Cambria Math;\">B = 19 &times; </span><span style=\"font-family: Cambria Math;\">11</span><br><span style=\"font-family: Cambria Math;\">So, A = 19 and B = 11 &hellip;&hellip;(A &gt; B)</span><br><span style=\"font-family: Cambria Math;\">Hence, </span>A<sup>2 </sup>- B = 192 - 11 = 361 &ndash; 11 = 350</p>",
                    solution_hi: "<p>70.(a)<br><span style=\"font-family: Mangal;\">अभाज्य</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">संख्याओं</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">की</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">स्थिति</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">में</span><span style=\"font-family: Cambria Math;\">,</span><br><span style=\"font-family: Mangal;\">अभाज्य</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">संख्याओं</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">गुणनफल</span><span style=\"font-family: Cambria Math;\"> = </span><span style=\"font-family: Mangal;\">अभाज्य</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">संख्याओं</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">का</span><span style=\"font-family: Cambria Math;\"> LCM </span><span style=\"font-family: Mangal;\">और</span><span style=\"font-family: Cambria Math;\"> HCF = 1</span><br><span style=\"font-family: Mangal;\">प्रश्न</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">के</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">अनुसार</span><span style=\"font-family: Cambria Math;\">,</span><br><span style=\"font-family: Cambria Math;\">A&times;</span><span style=\"font-family: Cambria Math;\">B = LCM &times; </span><span style=\"font-family: Cambria Math;\">HCF = 209 &times; </span><span style=\"font-family: Cambria Math;\">1 = 209</span><br><span style=\"font-family: Cambria Math;\">A&times;</span><span style=\"font-family: Cambria Math;\">B = 19 &times; </span><span style=\"font-family: Cambria Math;\">11</span><br><span style=\"font-family: Mangal;\">इसलिए</span><span style=\"font-family: Cambria Math;\">, A = 19 </span><span style=\"font-family: Mangal;\">और</span><span style=\"font-family: Cambria Math;\"> B = 11 &hellip;&hellip;(A &gt; B)</span><br><span style=\"font-family: Mangal;\">अत</span><span style=\"font-family: Cambria Math;\">: A<sup>2 </sup>- B = 192 - 11 = 361 &ndash; 11 = 350</span></p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });

                    options_en: ["<p>2565</p>", "<p>2024</p>",

                    options_hi: ["<p>desperately</p>", "<p>extremely</p>",
                                "<p>drastically</p>", "<p>terribly</p>"],
                    solution_en: "<p>100.(c)&nbsp;drastically. <br>&lsquo;Drastically&rsquo; means in a way that is severe or sudden. The given passage states that since the new speed limits were enforced the number of accidents in the area have fallen drastically. Hence, &lsquo;drastically&rsquo; is the most appropriate answer.</p>",
                    solution_hi: "<p>100.(c)&nbsp;drastically. <br>&lsquo;Drastically&rsquo; का अर्थ है गंभीर या अचानक तरीके से। दिए गए passage में कहा गया है कि जब से नई गति सीमाएँ लागू की गईं, उस क्षेत्र में दुर्घटनाओं (accidents) की संख्या में काफी गिरावट (drastically) आई है। अतः, &lsquo;drastically&rsquo; सबसे उपयुक्त उत्तर है।</p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
