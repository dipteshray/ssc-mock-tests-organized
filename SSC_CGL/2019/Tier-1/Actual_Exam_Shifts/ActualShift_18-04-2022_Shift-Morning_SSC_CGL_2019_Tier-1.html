                questions.push({
                    id: "52",
                    section: "17",
                    question_en: "<p>52.<span style=\"font-family: Cambria Math;\">&nbsp; The greatest number that divides 126, 224 and 608 leaving remainders 2, 7 and 19, respectively, is:</span></p>",
                    question_hi: "<p>52. <span style=\"font-family: Cambria Math;\">&nbsp;</span><span style=\"font-family: Cambria Math;\">वह सबसे बड़ी संख्या</span><span style=\"font-family: Cambria Math;\">&nbsp; </span><span style=\"font-family: Cambria Math;\">जिससे </span><span style=\"font-family: Cambria Math;\">126, 224 </span><span style=\"font-family: Cambria Math;\">और </span><span style=\"font-family: Cambria Math;\">608 </span><span style=\"font-family: Cambria Math;\">को विभाजित करने पर क्रमशः </span><span style=\"font-family: Cambria Math;\">2, 7 </span><span style=\"font-family: Cambria Math;\">और </span><span style=\"font-family: Cambria Math;\">19 </span><span style=\"font-family: Cambria Math;\">शेषफल प्राप्त होते हैं:</span></p>",
                    options_en: ["<p>27</p>", "<p>31</p>", 
                                "<p>21</p>", "<p>37</p>"],
                    options_hi: ["<p>27</p>", "<p>31</p>",
                                "<p>21</p>", "<p>37</p>"],
                    solution_en: "<p>52.(b)<br><span style=\"font-family: Cambria Math;\">For finding the required greatest number, we need to deduct the remainder from the respective number and then find HCF of numbers so obtained.<br></span><span style=\"font-family: Cambria Math;\">126 &ndash; 2 = 124<br></span><span style=\"font-family: Cambria Math;\">224 &ndash; 7 = 217<br></span><span style=\"font-family: Cambria Math;\">608 &ndash; 19 = 589<br></span><span style=\"font-family: Cambria Math;\">Required greatest number = HCF (124, 217, 589) = 31</span></p>",
                    solution_hi: "<p>52.(b)<br><span style=\"font-family: Cambria Math;\">सबसे बड़ी आवश्यक संख्या ज्ञात करने के लिए</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">हमें शेष को संबंधित संख्या से घटाना होगा और फिर प्राप्त संख्याओं का </span><span style=\"font-family: Cambria Math;\">HCF </span><span style=\"font-family: Cambria Math;\">ज्ञात करना होगा।<br></span><span style=\"font-family: Cambria Math;\">126 &ndash; 2 = 124<br></span><span style=\"font-family: Cambria Math;\">224 &ndash; 7 = 217<br></span><span style=\"font-family: Cambria Math;\">608 &ndash; 19 = 589<br></span><span style=\"font-family: Cambria Math;\">अभीष्ट सबसे बड़ी संख्या = </span><span style=\"font-family: Cambria Math;\">HCF (124, 217, 589) = 31</span></p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "53",
                    section: "17",
                    question_en: "<p>53.&nbsp; <span style=\"font-family: Cambria Math;\">&nbsp;In the following figure, P and Q are centers of two circles. The circles are intersecting at points A and B. PA produced on both the sides meets the circles at C and D. If </span><span style=\"font-family: Cambria Math;\">&ang;</span><span style=\"font-family: Cambria Math;\">CPB = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>100</mn><mo>&#176;</mo></msup></math>, then find the value of x.<br></span><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1653715020/word/media/image37.png\"></p>",
                    question_hi: "<p>53. <span style=\"font-family: Cambria Math;\">&nbsp;</span><span style=\"font-family: Cambria Math;\">निम्नलिखित चित्र में</span><span style=\"font-family: Cambria Math;\">, P </span><span style=\"font-family: Cambria Math;\">और </span><span style=\"font-family: Cambria Math;\">Q </span><span style=\"font-family: Cambria Math;\">दो वृत्तों के केंद्र हैं। वृत्त बिंदु </span><span style=\"font-family: Cambria Math;\">A </span><span style=\"font-family: Cambria Math;\">और </span><span style=\"font-family: Cambria Math;\">B </span><span style=\"font-family: Cambria Math;\">पर प्रतिच्छेद कर रहे हैं। दोनों ओर बढाने पर </span><span style=\"font-family: Cambria Math;\">PA, C </span><span style=\"font-family: Cambria Math;\">और </span><span style=\"font-family: Cambria Math;\">D </span><span style=\"font-family: Cambria Math;\">पर वृत्तों से मिलता है। यदि</span><span style=\"font-family: Cambria Math;\">&ang;</span><span style=\"font-family: Cambria Math;\">CPB =<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>100</mn><mo>&#176;</mo></msup></math> </span><span style=\"font-family: Cambria Math;\">है</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">तो </span><span style=\"font-family: Cambria Math;\">x </span><span style=\"font-family: Cambria Math;\">का मान ज्ञात कीजिये।<br></span><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1653715020/word/media/image37.png\"></p>",
                    options_en: ["<p>115</p>", "<p>120</p>", 
                                "<p>110</p>", "<p>100</p>"],
                    options_hi: ["<p>115</p>", "<p>120</p>",
                                "<p>110</p>", "<p>100</p>"],
                    solution_en: "<p>53.(d)<br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1653715020/word/media/image37.png\"><br><span style=\"font-family: Cambria Math;\">Construction</span><span style=\"font-family: Cambria Math;\"> : we take a point E on the arc such that ABED is a cyclic quadrilateral.<br></span><span style=\"font-family: Cambria Math;\">&ang;</span><span style=\"font-family: Cambria Math;\">PAB = 1/2</span><span style=\"font-family: Cambria Math;\">&ang;</span><span style=\"font-family: Cambria Math;\">BPC (angle subtended at arc is half the angle subtended at the centre.)<br></span><span style=\"font-family: Cambria Math;\">&ang;</span><span style=\"font-family: Cambria Math;\">PAB = 1/2&times;100&deg; = 50&deg;<br></span><span style=\"font-family: Cambria Math;\">&ang;</span><span style=\"font-family: Cambria Math;\">BED = </span><span style=\"font-family: Cambria Math;\">&ang;</span><span style=\"font-family: Cambria Math;\">PAB =&nbsp; 50&deg; (external angle property of cyclic quadrilateral)<br></span><span style=\"font-family: Cambria Math;\">&ang;</span><span style=\"font-family: Cambria Math;\">BQD = 2</span><span style=\"font-family: Cambria Math;\">&ang;</span><span style=\"font-family: Cambria Math;\">BED (angle subtended at centre)<br></span><span style=\"font-family: Cambria Math;\">&ang;</span><span style=\"font-family: Cambria Math;\">BQD = 2&times;50&deg; = 100&deg;</span></p>",
                    solution_hi: "<p>53.(d)<br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1653715020/word/media/image37.png\"><br><span style=\"font-family: Cambria Math;\">रचना</span><span style=\"font-family: Cambria Math;\"> : </span><span style=\"font-family: Cambria Math;\">हम चाप पर एक बिंदु </span><span style=\"font-family: Cambria Math;\">E </span><span style=\"font-family: Cambria Math;\">इस प्रकार लेते हैं कि </span><span style=\"font-family: Cambria Math;\">ABED </span><span style=\"font-family: Cambria Math;\">एक चक्रीय चतुर्भुज है।<br></span><span style=\"font-family: Cambria Math;\">&ang;</span><span style=\"font-family: Cambria Math;\">PAB = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac></math></span><span style=\"font-family: Cambria Math;\">&ang;</span><span style=\"font-family: Cambria Math;\">BPC (</span><span style=\"font-family: Cambria Math;\">चाप पर अंतरित कोण केंद्र पर बने कोण का आधा होता है।)<br></span><span style=\"font-family: Cambria Math;\">&ang;</span><span style=\"font-family: Cambria Math;\">PAB = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac></math>&times;100&deg; = 50&deg;<br></span><span style=\"font-family: Cambria Math;\">&ang;</span><span style=\"font-family: Cambria Math;\">BED = </span><span style=\"font-family: Cambria Math;\">&ang;</span><span style=\"font-family: Cambria Math;\">PAB =&nbsp; 50&deg; (</span><span style=\"font-family: Cambria Math;\">चक्रीय चतुर्भुज का बाह्य कोण गुण)<br></span><span style=\"font-family: Cambria Math;\">&ang;</span><span style=\"font-family: Cambria Math;\">BQD = 2</span><span style=\"font-family: Cambria Math;\">&ang;</span><span style=\"font-family: Cambria Math;\">BED (</span><span style=\"font-family: Cambria Math;\">चक्रीय चतुर्भुज का बाह्य कोण गुण)<br></span><span style=\"font-family: Cambria Math;\">&ang;</span><span style=\"font-family: Cambria Math;\">BQD = 2&times;50&deg; = 100&deg;</span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "54",
                    section: "17",
                    question_en: "<p>54.<span style=\"font-family: Cambria Math;\">&nbsp; A shopkeeper allows a 28% discount on the marked price of an article and still makes a&nbsp; profit of 30%. If he gains Rs. 39.90 on the sale of one article, then what is the marked price(to the nearest Rs.) of the article?&nbsp;</span></p>",
                    question_hi: "<p>54. <span style=\"font-family: Cambria Math;\">&nbsp;</span><span style=\"font-family: Cambria Math;\">एक दुकानदार एक वस्तु के अंकित मूल्य पर </span><span style=\"font-family: Cambria Math;\">28% </span><span style=\"font-family: Cambria Math;\">की छूट देता है और फिर भी </span><span style=\"font-family: Cambria Math;\">30% </span><span style=\"font-family: Cambria Math;\">का लाभ कमाता है। यदि उसे एक</span><span style=\"font-family: Cambria Math;\">&nbsp; </span><span style=\"font-family: Cambria Math;\">वस्तु की बिक्री पर</span><span style=\"font-family: Cambria Math;\">&nbsp; </span><span style=\"font-family: Cambria Math;\">रु. </span><span style=\"font-family: Cambria Math;\">39.90 </span><span style=\"font-family: Cambria Math;\">रूपये का लाभ होता है</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">तो वस्तु का अंकित मूल्य (निकटतम रुपये. में) क्या है</span><span style=\"font-family: Cambria Math;\">?</span></p>",
                    options_en: ["<p>200</p>", "<p>240</p>", 
                                "<p>173</p>", "<p>133</p>"],
                    options_hi: ["<p>200</p>", "<p>240</p>",
                                "<p>173</p>", "<p>133</p>"],
                    solution_en: "<p>54.(b)<br><span style=\"font-family: Cambria Math;\">Let MP = y<br></span><span style=\"font-family: Cambria Math;\">₹39.9 corresponds to 30%, <br></span><span style=\"font-family: Cambria Math;\">So CP = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>39</mn><mo>.</mo><mn>9</mn><mo>&#215;</mo><mn>100</mn></mrow><mn>30</mn></mfrac></math> = ₹133<br></span><span style=\"font-family: Cambria Math;\">According to the question,<br></span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>&#215;</mo><mfrac><mrow><mn>100</mn><mo>-</mo><mn>28</mn></mrow><mn>100</mn></mfrac><mo>=</mo><mn>133</mn><mo>&#215;</mo><mfrac><mrow><mn>100</mn><mo>+</mo><mn>30</mn></mrow><mn>100</mn></mfrac></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>&#215;</mo><mfrac><mn>72</mn><mn>100</mn></mfrac><mo>=</mo><mn>133</mn><mo>&#215;</mo><mfrac><mn>130</mn><mn>100</mn></mfrac></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>240</mn><mo>.</mo><mn>14</mn><mo>&#8776;</mo><mn>240</mn></math></p>",
                    solution_hi: "<p>54.(b)<br><span style=\"font-family: Cambria Math;\">माना , अंकित मूल्य = </span><span style=\"font-family: Cambria Math;\">y<br></span><span style=\"font-family: Cambria Math;\">₹39.9 = 30%&nbsp; <br></span><span style=\"font-family: Cambria Math;\"><span style=\"font-weight: 400;\">अत: क्रय मूल्य </span>= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>39</mn><mo>.</mo><mn>9</mn><mo>&#215;</mo><mn>100</mn></mrow><mn>30</mn></mfrac></math> = ₹133<br></span><span style=\"font-family: Cambria Math;\"><span style=\"font-weight: 400;\">प्रश्न के अनुसार</span>,<br></span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>&#215;</mo><mfrac><mrow><mn>100</mn><mo>-</mo><mn>28</mn></mrow><mn>100</mn></mfrac><mo>=</mo><mn>133</mn><mo>&#215;</mo><mfrac><mrow><mn>100</mn><mo>+</mo><mn>30</mn></mrow><mn>100</mn></mfrac></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>&#215;</mo><mfrac><mn>72</mn><mn>100</mn></mfrac><mo>=</mo><mn>133</mn><mo>&#215;</mo><mfrac><mn>130</mn><mn>100</mn></mfrac></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>240</mn><mo>.</mo><mn>14</mn><mo>&#8776;</mo><mn>240</mn></math></p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "55",
                    section: "17",
                    question_en: "<p>55.<span style=\"font-family: Cambria Math;\">&nbsp; If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><msup><mi>x</mi><mn>2</mn></msup></mfrac><mo>)</mo><mo>=</mo><mn>23</mn></math>, x &gt; 0 What is the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><msup><mi>x</mi><mn>3</mn></msup><mo>+</mo><mfrac><mn>1</mn><msup><mi>x</mi><mn>3</mn></msup></mfrac><mo>)</mo></math> = ?</span></p>",
                    question_hi: "<p>55.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">यदि <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><msup><mi>x</mi><mn>2</mn></msup></mfrac><mo>)</mo><mo>=</mo><mn>23</mn></math></span><span style=\"font-family: Cambria Math;\"> , x &gt; 0 ,&nbsp; तो <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><msup><mi>x</mi><mn>3</mn></msup><mo>+</mo><mfrac><mn>1</mn><msup><mi>x</mi><mn>3</mn></msup></mfrac><mo>)</mo></math> का मान ज्ञात&nbsp;करे ?</span></p>",
                    options_en: ["<p>140</p>", "<p>110</p>", 
                                "<p>- 110</p>", "<p>- 140</p>"],
                    options_hi: ["<p>140</p>", "<p>110</p>",
                                "<p>- 110</p>", "<p>- 140</p>"],
                    solution_en: "<p>55.(b)<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><msup><mi>x</mi><mn>2</mn></msup></mfrac><mo>)</mo><mo>=</mo><mn>23</mn></math><br><span style=\"font-family: Cambria Math;\">Adding 2 on both sides, we get<br></span><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><msup><mi>x</mi><mn>2</mn></msup></mfrac><mo>+</mo><mn>2</mn><mo>)</mo><mo>=</mo><mn>25</mn></math><br></span><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mrow><mo>(</mo><mi>x</mi><mo>+</mo><mfrac><mn>1</mn><mi>x</mi></mfrac><mo>)</mo></mrow><mn>2</mn></msup><mo>=</mo><msup><mn>5</mn><mn>2</mn></msup></math><br></span><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><mfrac><mn>1</mn><mi>x</mi></mfrac><mo>=</mo><mn>5</mn></math><br></span><span style=\"font-family: Cambria Math;\">On cubing, we get<br></span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>3</mn></msup><mo>+</mo><mo>&#160;</mo><mfrac><mn>1</mn><msup><mi>x</mi><mn>3</mn></msup></mfrac><mo>+</mo><mn>3</mn><mo>(</mo><mi>x</mi><mo>)</mo><mo>(</mo><mfrac><mn>1</mn><mi>x</mi></mfrac><mo>)</mo><mo>(</mo><mi>x</mi><mo>+</mo><mfrac><mn>1</mn><mi>x</mi></mfrac><mo>)</mo><mo>=</mo><mn>125</mn></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>3</mn></msup><mo>+</mo><mfrac><mn>1</mn><msup><mi>x</mi><mn>3</mn></msup></mfrac><mo>+</mo><mn>3</mn><mo>(</mo><mn>5</mn><mo>)</mo><mo>=</mo><mn>125</mn></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>3</mn></msup><mo>+</mo><mfrac><mn>1</mn><msup><mi>x</mi><mn>3</mn></msup></mfrac><mo>=</mo><mn>125</mn><mo>-</mo><mn>15</mn><mo>=</mo><mn>110</mn></math></p>",

                    question_en: "<p>59.<span style=\"font-family: Cambria Math;\">&nbsp; A circle is inscribed in &Delta; ABC, touching AB , BC and AC at points P, Q and R, respectively. If AB - BC = 4 cm, AB - AC = 2 cm, and the perimeter of &Delta; ABC = 32 cm, then AC (in cm) = ?</span></p>",
                    question_hi: "<p>59.<span style=\"font-family: Cambria Math;\">&nbsp; &Delta; ABC </span><span style=\"font-family: Cambria Math;\">में एक वृत्त अंकित है</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">जो क्रमशः </span><span style=\"font-family: Cambria Math;\">AB, BC </span><span style=\"font-family: Cambria Math;\">और </span><span style=\"font-family: Cambria Math;\">AC </span><span style=\"font-family: Cambria Math;\">को बिंदु </span><span style=\"font-family: Cambria Math;\">P, Q </span><span style=\"font-family: Cambria Math;\">और </span><span style=\"font-family: Cambria Math;\">R </span><span style=\"font-family: Cambria Math;\">पर स्पर्श करता है। यदि </span><span style=\"font-family: Cambria Math;\">AB - BC = 4 cm, AB - AC = 2 cm, </span><span style=\"font-family: Cambria Math;\">और </span><span style=\"font-family: Cambria Math;\">&Delta; ABC </span><span style=\"font-family: Cambria Math;\">का परिमाप = </span><span style=\"font-family: Cambria Math;\">32 cm, </span><span style=\"font-family: Cambria Math;\">तो </span><span style=\"font-family: Cambria Math;\">AC (cm </span><span style=\"font-family: Cambria Math;\">में) = </span><span style=\"font-family: Cambria Math;\">?</span></p>",
                    options_en: ["<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>35</mn><mn>3</mn></mfrac></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>38</mn><mn>3</mn></mfrac></math></p>", 
                                "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>32</mn><mn>3</mn></mfrac></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>26</mn><mn>3</mn></mfrac></math></p>"],
                    options_hi: ["<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>35</mn><mn>3</mn></mfrac></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>38</mn><mn>3</mn></mfrac></math></p>",
                                "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>32</mn><mn>3</mn></mfrac></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>26</mn><mn>3</mn></mfrac></math></p>"],
                    solution_en: "<p>59.(c)<br><span style=\"font-family: Cambria Math;\">Let AB = y, so BC = y &ndash; 4 and AC = y &ndash; 2<br></span><span style=\"font-family: Cambria Math;\">Perimeter of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo></math>ABC = AB + BC + AC <br></span><span style=\"font-family: Cambria Math;\">32 = y + y &ndash; 4 + y &ndash; 2<br></span><span style=\"font-family: Cambria Math;\">32 = 3y &ndash; 6<br></span><span style=\"font-family: Cambria Math;\">3y = 38<br></span><span style=\"font-family: Cambria Math;\">y = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>38</mn><mn>3</mn></mfrac></math><br></span><span style=\"font-family: Cambria Math;\">So, AC = y &ndash; 2 =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>38</mn><mn>3</mn></mfrac><mo>-</mo><mn>2</mn><mo>=</mo><mfrac><mn>32</mn><mn>3</mn></mfrac></math>cm</span></p>",
                    solution_hi: "<p>59.(c)<br><span style=\"font-family: Cambria Math;\">मान लीजिए </span><span style=\"font-family: Cambria Math;\">AB = y, </span><span style=\"font-family: Cambria Math;\">इसलिए </span><span style=\"font-family: Cambria Math;\">BC = y &ndash; 4 </span><span style=\"font-family: Cambria Math;\">और </span><span style=\"font-family: Cambria Math;\">AC = y &ndash; 2<br></span><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo></math>ABC </span><span style=\"font-family: Cambria Math;\">का परिमाप = </span><span style=\"font-family: Cambria Math;\">AB + BC + AC<br></span><span style=\"font-family: Cambria Math;\">32 = y + y &ndash; 4 + y &ndash; 2<br></span><span style=\"font-family: Cambria Math;\">32 = 3y &ndash; 6<br></span><span style=\"font-family: Cambria Math;\">3y = 38<br></span><span style=\"font-family: Cambria Math;\">y = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>38</mn><mn>3</mn></mfrac></math><br></span><span style=\"font-family: Cambria Math;\">अत: </span><span style=\"font-family: Cambria Math;\">AC = y &ndash; 2 =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>38</mn><mn>3</mn></mfrac><mo>-</mo><mn>2</mn><mo>=</mo><mfrac><mn>32</mn><mn>3</mn></mfrac></math> cm</span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "60",
                    section: "17",
                    question_en: "<p>60.<span style=\"font-family: Cambria Math;\"> If a + b - c = 5 and ab - bc - ac = 10, then find the value of&nbsp; </span><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>a</mi><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup><mo>+</mo><msup><mi>c</mi><mn>2</mn></msup></math> .</span></p>",
                    question_hi: "<p>60. <span style=\"font-family: Cambria Math;\">यदि</span><span style=\"font-family: Cambria Math;\">&nbsp; a + b - c =&nbsp; 5&nbsp; </span><span style=\"font-family: Cambria Math;\">तथा </span><span style=\"font-family: Cambria Math;\">ab - bc - ac = 10, </span><span style=\"font-family: Cambria Math;\">तो</span><span style=\"font-family: Cambria Math;\"> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>a</mi><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup><mo>+</mo><msup><mi>c</mi><mn>2</mn></msup></math> </span><span style=\"font-family: Cambria Math;\">का मान ज्ञात करे :</span><span style=\"font-family: Cambria Math;\">&nbsp;</span></p>",
                    options_en: ["<p>40</p>", "<p>5</p>", 
                                "<p>45</p>", "<p>15</p>"],
                    options_hi: ["<p>40</p>", "<p>5</p>",
                                "<p>45</p>", "<p>15</p>"],
                    solution_en: "<p>60.(b)<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mrow><mo>(</mo><mi>a</mi><mo>+</mo><mi>b</mi><mo>-</mo><mi>c</mi><mo>)</mo></mrow><mn>2</mn></msup><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup><mo>+</mo><msup><mi>c</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mo>(</mo><mi>a</mi><mi>b</mi><mo>-</mo><mi>b</mi><mi>c</mi><mo>-</mo><mi>a</mi><mi>c</mi><mo>)</mo></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mrow><mo>(</mo><mn>5</mn><mo>)</mo></mrow><mn>2</mn></msup><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup><mo>+</mo><msup><mi>c</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mo>(</mo><mn>10</mn><mo>)</mo></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>a</mi><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup><mo>+</mo><msup><mi>c</mi><mn>2</mn></msup><mo>=</mo><mn>25</mn><mo>&#8211;</mo><mn>20</mn><mo>=</mo><mn>5</mn></math></p>",
                    solution_hi: "<p>60.(b)<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mrow><mo>(</mo><mi>a</mi><mo>+</mo><mi>b</mi><mo>-</mo><mi>c</mi><mo>)</mo></mrow><mn>2</mn></msup><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup><mo>+</mo><msup><mi>c</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mo>(</mo><mi>a</mi><mi>b</mi><mo>-</mo><mi>b</mi><mi>c</mi><mo>-</mo><mi>a</mi><mi>c</mi><mo>)</mo></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mrow><mo>(</mo><mn>5</mn><mo>)</mo></mrow><mn>2</mn></msup><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><msup><mi>a</mi><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup><mo>+</mo><msup><mi>c</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mo>(</mo><mn>10</mn><mo>)</mo></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>a</mi><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup><mo>+</mo><msup><mi>c</mi><mn>2</mn></msup><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>25</mn><mo>&#160;</mo><mo>&#8211;</mo><mo>&#160;</mo><mn>20</mn><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>5</mn><mo>&#160;</mo></math></p>",

                questions.push({
                    id: "61",
                    section: "17",
                    question_en: "<p>61. <span style=\"font-family: Cambria Math;\">The sum of three numbers is 98. If the ratio of the first to the second is 2 : 3 and that of the second to the third is 5 : 8, then the third number is:</span></p>",
                    question_hi: "<p>61.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">तीन संख्याओं का योग </span><span style=\"font-family: Cambria Math;\">98 </span><span style=\"font-family: Cambria Math;\">है। यदि पहली से दूसरी का अनुपात </span><span style=\"font-family: Cambria Math;\">2:3 </span><span style=\"font-family: Cambria Math;\">है और दूसरी से तीसरी का अनुपात </span><span style=\"font-family: Cambria Math;\">5:8 </span><span style=\"font-family: Cambria Math;\">है</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">तो तीसरी संख्या है:</span></p>",
                    options_en: ["<p>30</p>", "<p>20</p>", 
                                "<p>49</p>", "<p>48</p>"],
                    options_hi: ["<p>30</p>", "<p>20</p>",
                                "<p>49</p>", "<p>48</p>"],
                    solution_en: "<p>61.(d)<br><span style=\"font-family: Cambria Math;\">Let the three numbers be a, b and c.<br></span><span style=\"font-family: Cambria Math;\">According to the question,<br></span><span style=\"font-family: Cambria Math;\">a : b = 2 : 3 and b : c = 5 : 8<br></span><span style=\"font-family: Cambria Math;\">On balancing, we get<br></span><span style=\"font-family: Cambria Math;\">a : b : c = 10 : 15 : 24<br></span><span style=\"font-family: Cambria Math;\">So, third number = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>24</mn><mn>49</mn></mfrac><mo>&#215;</mo><mn>98</mn></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>48</mn></math></span></p>",
                    solution_hi: "<p>61.(d)<br><span style=\"font-family: Cambria Math;\">माना कि तीन संख्याएँ </span><span style=\"font-family: Cambria Math;\">a, b </span><span style=\"font-family: Cambria Math;\">और </span><span style=\"font-family: Cambria Math;\">c </span><span style=\"font-family: Cambria Math;\">हैं।<br></span><span style=\"font-family: Cambria Math;\">प्रश्न के अनुसार</span><span style=\"font-family: Cambria Math;\">,<br></span><span style=\"font-family: Cambria Math;\">a : b = 2 : 3 </span><span style=\"font-family: Cambria Math;\">और </span><span style=\"font-family: Cambria Math;\">b : c = 5 : 8<br></span><span style=\"font-family: Cambria Math;\">संतुलन करने पर</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">हम प्राप्त करते हैं<br></span><span style=\"font-family: Cambria Math;\">a : b : c&nbsp; = 10 : 15 : 24<br></span><span style=\"font-family: Cambria Math;\">अत: तीसरी संख्या =</span><span style=\"font-family: Cambria Math;\">&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>24</mn><mn>49</mn></mfrac><mo>&#215;</mo><mn>98</mn><mo>=</mo><mn>48</mn></math></span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "62",
                    section: "17",
                    question_en: "<p>62. <span style=\"font-family: Cambria Math;\">The following bar chart shows the number of students enrolled in two Summer Camps A and B from 2014 to 2019. <br></span><span style=\"font-family: Cambria Math;\">Study the chart carefully and answer the questions that follows.<br></span><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1653726595/word/media/image41.png\" width=\"408\" height=\"320\"><br><span style=\"font-family: Cambria Math;\">What is the ratio of the students enrolled in Camp A in 2014, 2016 and 2017 to the students enrolled in Camp B in 2015, 2018 and 2019?</span><span style=\"font-family: Cambria Math;\">&nbsp;</span></p>",
                    question_hi: "<p>62. <span style=\"font-family: Cambria Math;\">निम्नलिखित बार चार्ट </span><span style=\"font-family: Cambria Math;\">2014 </span><span style=\"font-family: Cambria Math;\">से </span><span style=\"font-family: Cambria Math;\">2019 </span><span style=\"font-family: Cambria Math;\">तक दो समर कैंप </span><span style=\"font-family: Cambria Math;\">A </span><span style=\"font-family: Cambria Math;\">और </span><span style=\"font-family: Cambria Math;\">B </span><span style=\"font-family: Cambria Math;\">में नामांकित छात्रों की संख्या को दर्शाता है। चार्ट का ध्यानपूर्वक अध्ययन करें और नीचे दिए गए प्रश्नों के उत्तर दें।<br></span><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1653726595/word/media/image41.png\"><br><span style=\"font-family: Cambria Math;\">2014, 2016 </span><span style=\"font-family: Cambria Math;\">और </span><span style=\"font-family: Cambria Math;\">2017 </span><span style=\"font-family: Cambria Math;\">में कैंप </span><span style=\"font-family: Cambria Math;\">A </span><span style=\"font-family: Cambria Math;\">में नामांकित छात्रों का </span><span style=\"font-family: Cambria Math;\">2015, 2018 </span><span style=\"font-family: Cambria Math;\">और </span><span style=\"font-family: Cambria Math;\">2019 </span><span style=\"font-family: Cambria Math;\">में कैंप </span><span style=\"font-family: Cambria Math;\">B </span><span style=\"font-family: Cambria Math;\">में नामांकित छात्रों से अनुपात कितना है</span><span style=\"font-family: Cambria Math;\">?</span></p>",
                    options_en: ["<p><span style=\"font-family: Cambria Math;\">18 : 13</span></p>", "<p>22 : 15</p>", 
                                "<p>13 : 18</p>", "<p>15 : 22</p>"],
                    options_hi: ["<p>18 : 13</p>", "<p>22 : 15</p>",
                                "<p>13 : 18</p>", "<p>15 : 22</p>"],
                    solution_en: "<p>62.(c)<br><span style=\"font-family: Cambria Math;\">Number of students enrolled in Camp A in 2014, 2016 and 2017 = 160 + 140 + 220 = 520 </span><span style=\"font-family: Cambria Math;\">Number of students enrolled in Camp B in 2015, 2018 and 2019 = 240 + 200 + 280 = 720<br></span><span style=\"font-family: Cambria Math;\">Required ratio = 520 : 720 = 13 : 18</span></p>",
                    solution_hi: "<p>62.(c)<br><span style=\"font-family: Cambria Math;\">2014, 2016 </span><span style=\"font-family: Cambria Math;\">और </span><span style=\"font-family: Cambria Math;\">2017 </span><span style=\"font-family: Cambria Math;\">में कैंप </span><span style=\"font-family: Cambria Math;\">A </span><span style=\"font-family: Cambria Math;\">में नामांकित छात्रों की संख्या = </span><span style=\"font-family: Cambria Math;\">160 + 140 + 220 = 520<br></span><span style=\"font-family: Cambria Math;\">2015, 2018 </span><span style=\"font-family: Cambria Math;\">और </span><span style=\"font-family: Cambria Math;\">2019 </span><span style=\"font-family: Cambria Math;\">में कैंप </span><span style=\"font-family: Cambria Math;\">B </span><span style=\"font-family: Cambria Math;\">में नामांकित छात्रों की संख्या = </span><span style=\"font-family: Cambria Math;\">240 + 200 + 280 = 720<br></span><span style=\"font-family: Cambria Math;\">अभीष्ट अनुपात = </span><span style=\"font-family: Cambria Math;\">520 : 720 = 13 : 18</span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "63",
                    section: "17",
                    question_en: "<p>63.<span style=\"font-family: Cambria Math;\"> What is the amount (in Rs.) of a sum of Rs. 32,000 at 20% per annum for 9 months, compounded quarterly?</span></p>",
                    question_hi: "<p>63.<span style=\"font-family: Cambria Math;\"> 32,000 </span><span style=\"font-family: Cambria Math;\">रुपये की राशि त्रैमासिक आधार पर</span><span style=\"font-family: Cambria Math;\">&nbsp; </span><span style=\"font-family: Cambria Math;\">चक्रवृद्धि की जाने वाली</span><span style=\"font-family: Cambria Math;\">&nbsp; 20% </span><span style=\"font-family: Cambria Math;\">वार्षिक</span><span style=\"font-family: Cambria Math;\">&nbsp; </span><span style=\"font-family: Cambria Math;\">दर पर</span><span style=\"font-family: Cambria Math;\">&nbsp; 9 </span><span style=\"font-family: Cambria Math;\">महीने में कितनी (</span><span style=\"font-family: Cambria Math;\">Rs. </span><span style=\"font-family: Cambria Math;\">में ) हो जाएगी </span><span style=\"font-family: Cambria Math;\">?</span></p>",
                    options_en: ["<p>37,044</p>", "<p>35,087</p>",

                    options_hi: ["<p>37,044</p>", "<p>35,087</p>",
                                "<p>32,000</p>", "<p>30,876</p>"],
                    solution_en: "<p>63.(a)<br><span style=\"font-family: Cambria Math;\">ATQ -<br></span><span style=\"font-family: Cambria Math;\">Since interest rate&nbsp; compounded quarterly then it will come as&nbsp; = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>20</mn><mn>4</mn></mfrac></math>= 5%<br></span><span style=\"font-family: Cambria Math;\">And required time period will be = 9 &times;</span><span style=\"font-family: Cambria Math;\"> 4 = 36 months = 3 years<br></span><span style=\"font-family: Cambria Math;\">Now,<br></span><span style=\"font-family: Cambria Math;\">Amount &nbsp; &nbsp; &nbsp; Sum<br></span><span style=\"font-family: Cambria Math;\">&nbsp; &nbsp; &nbsp;20 &nbsp; &nbsp; : &nbsp; &nbsp; &nbsp; 21<br></span><span style=\"font-family: Cambria Math;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;20 &nbsp; &nbsp; : &nbsp; &nbsp; &nbsp; 21<br></span><span style=\"font-family: Cambria Math;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;20 &nbsp; &nbsp; : &nbsp; &nbsp; &nbsp; 21<br></span><span style=\"font-family: Cambria Math;\">&nbsp; ___________________<br></span><span style=\"font-family: Cambria Math;\">&nbsp;&nbsp;&nbsp;8000 &nbsp; :&nbsp; &nbsp; &nbsp; 9261</span></p>\n<p><span style=\"font-family: Cambria Math;\">1 ratio = </span><span style=\"font-family: Cambria Math;\"> </span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>32000</mn><mn>8000</mn></mfrac></math><span style=\"font-family: Cambria Math;\">= 4</span></p>\n<p><span style=\"font-family: Cambria Math;\">So, 9261 ratio = 9261 &times;</span><span style=\"font-family: Cambria Math;\">&nbsp;</span><span style=\"font-family: Cambria Math;\">4 = 37, 044</span></p>",
                    solution_hi: "<p>63.(a)<br><span style=\"font-family: Cambria Math;\">प्रश्न के अनुसार-<br></span><span style=\"font-family: Cambria Math;\">चूंकि ब्याज दर तिमाही चक्रवृद्धि होती है तो&nbsp; (r)</span><span style=\"font-family: Cambria Math;\">&nbsp; = </span><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>20</mn><mn>4</mn></mfrac></math>= 5%</span><span style=\"font-family: Cambria Math;\"> <br></span><span style=\"font-family: Cambria Math;\">और अभीष्ट समयावधि</span><span style=\"font-family: Cambria Math;\">&nbsp; = 9 &times; 4 = 36 </span><span style=\"font-family: Cambria Math;\">महीने</span><span style=\"font-family: Cambria Math;\">&nbsp; = 3 </span><span style=\"font-family: Cambria Math;\">वर्ष<br></span><span style=\"font-family: Cambria Math;\">अब </span><span style=\"font-family: Cambria Math;\">,<br></span><span style=\"font-family: Cambria Math;\">&nbsp; मूलधन : मिश्रधन&nbsp;</span></p>\n<p><span style=\"font-family: Cambria Math;\">&nbsp; &nbsp; &nbsp;20 &nbsp; &nbsp; : &nbsp; &nbsp; &nbsp; 21<br></span><span style=\"font-family: Cambria Math;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;20 &nbsp; &nbsp; : &nbsp; &nbsp; &nbsp; 21<br></span><span style=\"font-family: Cambria Math;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;20 &nbsp; &nbsp; : &nbsp; &nbsp; &nbsp; 21<br></span><span style=\"font-family: Cambria Math;\">&nbsp; ___________________<br></span><span style=\"font-family: Cambria Math;\">&nbsp;&nbsp;&nbsp;8000 &nbsp; :&nbsp; &nbsp; &nbsp; 9261<br></span><span style=\"font-family: Cambria Math;\">8000 इकाई </span><span style=\"font-family: Cambria Math;\">&nbsp;= 32,000 रुपये <br></span><span style=\"font-family: Cambria Math;\">तो ,&nbsp; 1 इकाई = 4 रुपये<br></span><span style=\"font-family: Cambria Math;\">9261&nbsp;</span><span style=\"font-family: Cambria Math;\">अनुपात = </span><span style=\"font-family: Cambria Math;\">9261 &times; 4 = 37, 044</span></p>",
                    correct: "a",
                    pos_marks: 2.0,

                });
                questions.push({
                    id: "64",
                    section: "17",
                    question_en: "<p>64.<span style=\"font-family: Cambria Math;\"> Exactly midway between the foot of two towers P and Q, the angle of elevation of their tops are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>45</mn><mo>&#176;</mo></msup></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>60</mn><mo>&#176;</mo></msup></math>, respectively. The ratio of the heights of P and Q is:</span></p>",
                    question_hi: "<p>64.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">दो टावर </span><span style=\"font-family: Cambria Math;\">P </span><span style=\"font-family: Cambria Math;\">और</span><span style=\"font-family: Cambria Math;\"> Q </span><span style=\"font-family: Cambria Math;\">के पाद के ठीक बीच &nbsp;से </span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">उनके शीर्षों का उन्नयन कोण क्रमशः</span><span style=\"font-family: Cambria Math;\">&nbsp; 45&deg;&nbsp; </span><span style=\"font-family: Cambria Math;\">और</span><span style=\"font-family: Cambria Math;\"> 60&deg; </span><span style=\"font-family: Cambria Math;\">है। </span><span style=\"font-family: Cambria Math;\">P </span><span style=\"font-family: Cambria Math;\">और </span><span style=\"font-family: Cambria Math;\">Q </span><span style=\"font-family: Cambria Math;\">की ऊँचाइयों का अनुपात है:</span></p>",
                    options_en: ["<p>1 : &radic;3</p>", "<p>3 : 1</p>", 
                                "<p>1 : 3</p>", "<p>&radic;3 : 1</p>"],
                    options_hi: ["<p>1 : &radic;3</p>", "<p>3 : 1</p>",
                                "<p>1 : 3</p>", "<p>&radic;3 : 1</p>"],
                    solution_en: "<p>64.(a)<br><span style=\"font-family: Cambria Math;\">Let PC = CQ = y and AP = h and BQ = H<br></span><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1653726595/word/media/image42.png\"><br><span style=\"font-family: Cambria Math;\">In <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo></math>APC,<br></span><span style=\"font-family: Cambria Math;\">tan45&deg;=&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>h</mi><mi>y</mi></mfrac></math> <br></span><span style=\"font-family: Cambria Math;\">1= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>h</mi><mi>y</mi></mfrac></math> <br></span><span style=\"font-family: Cambria Math;\">h = y <br></span><span style=\"font-family: Cambria Math;\">In <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo></math>BQC,<br></span><span style=\"font-family: Cambria Math;\">tan 60&deg;= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>H</mi><mi>y</mi></mfrac></math><br></span><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math>&nbsp;= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>H</mi><mi>y</mi></mfrac></math><br></span><span style=\"font-family: Cambria Math;\">Putting y = h, we get<br></span><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math>&nbsp;= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>H</mi><mi>h</mi></mfrac></math><br></span><span style=\"font-family: Cambria Math;\">So, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>h</mi><mi>H</mi></mfrac></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msqrt><mn>3</mn></msqrt></mfrac></math></span></p>",
                    solution_hi: "<p>64.(a)<br><span style=\"font-family: Cambria Math;\">मान लीजिए </span><span style=\"font-family: Cambria Math;\">PC = CQ = y </span><span style=\"font-family: Cambria Math;\">और </span><span style=\"font-family: Cambria Math;\">AP = h </span><span style=\"font-family: Cambria Math;\">और </span><span style=\"font-family: Cambria Math;\">BQ = H<br></span><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1653726595/word/media/image42.png\"><br><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo></math>APC </span><span style=\"font-family: Cambria Math;\">में</span><span style=\"font-family: Cambria Math;\">,<br></span><span style=\"font-family: Cambria Math;\">tan45&deg;=&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>h</mi><mi>y</mi></mfrac></math><br></span><span style=\"font-family: Cambria Math;\">1= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>h</mi><mi>y</mi></mfrac></math> <br></span><span style=\"font-family: Cambria Math;\">h = y <br></span><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo></math>BQC </span><span style=\"font-family: Cambria Math;\">में</span><span style=\"font-family: Cambria Math;\">,<br></span><span style=\"font-family: Cambria Math;\">tan 60&deg;= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>H</mi><mi>y</mi></mfrac></math> <br></span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math><span style=\"font-family: \'Cambria Math\';\">= </span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>H</mi><mi>y</mi></mfrac></math><br><span style=\"font-family: Cambria Math;\">y = h </span><span style=\"font-family: Cambria Math;\">रखने पर हमें प्राप्त होता है<br></span><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math>&nbsp;= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>H</mi><mi>h</mi></mfrac></math><br></span><span style=\"font-family: Cambria Math;\">इसलिए</span><span style=\"font-family: Cambria Math;\">,&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>h</mi><mi>H</mi></mfrac></math>&nbsp;= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msqrt><mn>3</mn></msqrt></mfrac></math></span></p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "65",
                    section: "17",
                    question_en: "<p>65.<span style=\"font-family: Cambria Math;\"> Study the given histogram and answer the question that follows.</span></p>\n<p><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1653726595/word/media/image43.png\" width=\"380\" height=\"234\"></p>\n<p><span style=\"font-family: Cambria Math;\">What is the&nbsp; difference between the total number of workers whose daily wages are less than Rs. 450 and the total number of workers whose daily wages are Rs. 650 and above?</span></p>",
                    question_hi: "<p>65. <span style=\"font-family: Cambria Math;\">दिए गए हिस्टोग्राम का अध्ययन करें और नीचे दिए गए प्रश्न का उत्तर दें।</span></p>\n<p><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1653726595/word/media/image43.png\" width=\"340\" height=\"209\"></p>\n<p><span style=\"font-family: Cambria Math;\">450 </span><span style=\"font-family: Cambria Math;\">रूपये से कम दैनिक मजदूरी वाले श्रमिकों की कुल संख्या तथा </span><span style=\"font-family: Cambria Math;\">650 </span><span style=\"font-family: Cambria Math;\">रूपये और उससे अधिक दैनिक मजदूरी वाले श्रमिकों की कुल संख्या के बीच का अंतर कितना है </span><span style=\"font-family: Cambria Math;\">?</span></p>",
                    options_en: ["<p>4</p>", "<p>8</p>",

                    options_hi: ["<p>4</p>", "<p>8</p>",
                                "<p>10</p>", "<p>5</p>"],

                    solution_hi: "<p>65.(d)<br><span style=\"font-family: Cambria Math;\">450 रुपये से कम &nbsp;दैनिक मजदूरी वाले श्रमिकों की संख्या = 30<br></span><span style=\"font-family: Cambria Math;\">650 रुपये और उससे अधिक &nbsp;दैनिक मजदूरी वाले श्रमिकों की संख्या&nbsp; = 35<br></span><span style=\"font-family: Cambria Math;\">अभीष्ट अंतर = </span><span style=\"font-family: Cambria Math;\">35 &ndash; 30 = 5</span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "66",
                    section: "17",
                    question_en: "<p>66.<span style=\"font-family: Cambria Math;\"> A shopkeeper bought a table for Rs. 4,600 and a chair for Rs. 1,800. He sells the table with 10% gain and the chair with 6% gain. Find the overall gain percentage.</span></p>",
                    question_hi: "<p>66.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">एक दुकानदार ने एक टेबल </span><span style=\"font-family: Cambria Math;\">4,600 </span><span style=\"font-family: Cambria Math;\">रुपये और </span><span style=\"font-family: Cambria Math;\">1,800 </span><span style=\"font-family: Cambria Math;\">रूपये</span><span style=\"font-family: Cambria Math;\">&nbsp; </span><span style=\"font-family: Cambria Math;\">एक कुर्सी खरीदी। वह मेज को </span><span style=\"font-family: Cambria Math;\">10% </span><span style=\"font-family: Cambria Math;\">लाभ और कुर्सी को </span><span style=\"font-family: Cambria Math;\">6% </span><span style=\"font-family: Cambria Math;\">लाभ पर बेचता है। कुल लाभ प्रतिशत ज्ञात कीजिए।</span></p>",
                    options_en: ["<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mfrac><mn>3</mn><mn>4</mn></mfrac></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mfrac><mn>7</mn><mn>8</mn></mfrac></math></p>", 
                                "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn></math></p>"],
                    options_hi: ["<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mfrac><mn>3</mn><mn>4</mn></mfrac></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mfrac><mn>7</mn><mn>8</mn></mfrac></math></p>",
                                "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn></math></p>"],
                    solution_en: "<p>66.(b)<br><span style=\"font-family: Cambria Math;\">Profit on table = 4600 <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#215;</mo><mfrac><mn>10</mn><mn>100</mn></mfrac></math> = </span><span style=\"font-family: Cambria Math;\">₹</span><span style=\"font-family: Cambria Math;\">460<br></span><span style=\"font-family: Cambria Math;\">Profit on chair = 1800 <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#215;</mo><mfrac><mn>6</mn><mn>100</mn></mfrac></math> = </span><span style=\"font-family: Cambria Math;\">₹</span><span style=\"font-family: Cambria Math;\">108<br></span><span style=\"font-family: Cambria Math;\">Overall gain percentage = </span><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>460</mn><mo>+</mo><mn>108</mn></mrow><mrow><mn>4600</mn><mo>+</mo><mn>1800</mn></mrow></mfrac><mo>&#215;</mo><mn>100</mn><mo>=</mo><mfrac><mn>568</mn><mn>6400</mn></mfrac><mo>&#215;</mo><mn>100</mn><mo>=</mo><mn>8</mn><mfrac><mn>7</mn><mn>8</mn></mfrac><mo>%</mo></math></span></p>",
                    solution_hi: "<p>66.(b)<br><span style=\"font-family: Cambria Math;\">मेज पर लाभ = </span><span style=\"font-family: Cambria Math;\">4600 <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#215;</mo><mfrac><mn>10</mn><mn>100</mn></mfrac></math>= ₹460<br></span><span style=\"font-family: Cambria Math;\">कुर्सी पर लाभ = </span><span style=\"font-family: Cambria Math;\">1800 <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#215;</mo><mfrac><mn>6</mn><mn>100</mn></mfrac></math> = ₹108<br></span><span style=\"font-family: Cambria Math;\">कुल लाभ प्रतिशत = </span><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>460</mn><mo>+</mo><mn>108</mn></mrow><mrow><mn>4600</mn><mo>+</mo><mn>1800</mn></mrow></mfrac><mo>&#215;</mo><mn>100</mn><mo>=</mo><mfrac><mn>568</mn><mn>6400</mn></mfrac><mo>&#215;</mo><mn>100</mn><mo>=</mo><mn>8</mn><mfrac><mn>7</mn><mn>8</mn></mfrac><mo>%</mo></math></span></p>\n<p>&nbsp;</p>",

                questions.push({
                    id: "67",
                    section: "17",
                    question_en: "<p>67.<span style=\"font-family: Cambria Math;\"> Find the greatest number 234a5b, which is divisible by 22, but NOT divisible by 5.</span></p>",
                    question_hi: "<p>67. <span style=\"font-family: Cambria Math;\">सबसे बड़ी संख्या </span><span style=\"font-family: Cambria Math;\">234a5b </span><span style=\"font-family: Cambria Math;\">ज्ञात कीजिए</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">जो </span><span style=\"font-family: Cambria Math;\">22 </span><span style=\"font-family: Cambria Math;\">से विभाज्य है</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">लेकिन </span><span style=\"font-family: Cambria Math;\">5 </span><span style=\"font-family: Cambria Math;\">से विभाज्य नहीं है।</span></p>",
                    options_en: ["<p>234058</p>", "<p>234850</p>", 
                                "<p>234652</p>", "<p>234751</p>"],
                    options_hi: ["<p>234058</p>", "<p>234850</p>",
                                "<p>234652</p>", "<p>234751</p>"],
                    solution_en: "<p>67.(c)</p>\n<p><span style=\"font-family: Cambria Math;\">For any number to be divisible by 5, the unit digit of that number must be either 5 or 0. <br></span><span style=\"font-family: Cambria Math;\">So, option (b) gets eliminated as there is a 0 at its unit digit.<br></span><span style=\"font-family: Cambria Math;\">For 234a5b to be divisible by 22, the given expression must be divisible by 2 and 11.<br></span><span style=\"font-family: Cambria Math;\">For a given expression to be divisible by 2, the unit digit must be 0, 2, 4, 6, 8. So, option (d) gets eliminated.<br></span><span style=\"font-family: Cambria Math;\">For a given expression to be divisible by 11, either the sum total of numbers at odd places and sum total of numbers at even places must be equal or the difference between sum total of numbers at odd places and even places must be divisible by 11. Considering this we find that both option (a) and option (c) are divisible by 22.<br></span><span style=\"font-family: Cambria Math;\">As we need the greatest number, the correct answer is 234652.</span></p>",
                    solution_hi: "<p>67.(c)<br><span style=\"font-family: Cambria Math;\">किसी भी संख्या को </span><span style=\"font-family: Cambria Math;\">5 </span><span style=\"font-family: Cambria Math;\">से विभाज्य होने के लिए</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">उस संख्या का इकाई अंक या तो </span><span style=\"font-family: Cambria Math;\">5 </span><span style=\"font-family: Cambria Math;\">या </span><span style=\"font-family: Cambria Math;\">0 </span><span style=\"font-family: Cambria Math;\">होना चाहिए।</span><span style=\"font-family: Cambria Math;\">इसलिए</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">विकल्प (</span><span style=\"font-family: Cambria Math;\">b) </span><span style=\"font-family: Cambria Math;\">समाप्त हो जाता है क्योंकि इसके इकाई अंक पर </span><span style=\"font-family: Cambria Math;\">0 </span><span style=\"font-family: Cambria Math;\">होता है।<br></span><span style=\"font-family: Cambria Math;\">234a5b </span><span style=\"font-family: Cambria Math;\">को </span><span style=\"font-family: Cambria Math;\">22 </span><span style=\"font-family: Cambria Math;\">से विभाज्य होने के लिए</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">दिए गए व्यंजक को </span><span style=\"font-family: Cambria Math;\">2 </span><span style=\"font-family: Cambria Math;\">और </span><span style=\"font-family: Cambria Math;\">11 </span><span style=\"font-family: Cambria Math;\">से विभाज्य होना चाहिए।<br></span><span style=\"font-family: Cambria Math;\">किसी दिए गए व्यंजक के </span><span style=\"font-family: Cambria Math;\">2 </span><span style=\"font-family: Cambria Math;\">से विभाज्य होने के लिए</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">इकाई का अंक </span><span style=\"font-family: Cambria Math;\">0, 2, 4, 6, 8 </span><span style=\"font-family: Cambria Math;\">होना चाहिए। इसलिए</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">विकल्प (</span><span style=\"font-family: Cambria Math;\">d) </span><span style=\"font-family: Cambria Math;\">समाप्त हो जाता है। किसी दिए गए व्यंजक के </span><span style=\"font-family: Cambria Math;\">11 </span><span style=\"font-family: Cambria Math;\">से विभाज्य होने के लिए</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">या तो विषम स्थानों पर संख्याओं का योग और सम स्थानों पर संख्याओं का योग बराबर होना चाहिए या विषम स्थानों और सम स्थानों पर संख्याओं के योग के बीच का अंतर </span><span style=\"font-family: Cambria Math;\">11 </span><span style=\"font-family: Cambria Math;\">से विभाज्य होना चाहिए। इसे ध्यान में रखते हुए हम पाते हैं कि विकल्प (</span><span style=\"font-family: Cambria Math;\">a) </span><span style=\"font-family: Cambria Math;\">और विकल्प (</span><span style=\"font-family: Cambria Math;\">c) </span><span style=\"font-family: Cambria Math;\">दोनों </span><span style=\"font-family: Cambria Math;\">22 </span><span style=\"font-family: Cambria Math;\">से विभाज्य हैं।</span></p>\n<p><span style=\"font-family: Cambria Math;\">जैसा कि हमें सबसे बड़ी संख्या की आवश्यकता है</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">सही उत्तर </span><span style=\"font-family: Cambria Math;\">234652 </span><span style=\"font-family: Cambria Math;\">है।</span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });

                    question_en: "<p>71.<span style=\"font-family: Cambria Math;\"> Shyam drives his car 30 km at a speed of 45 km/hr and, for the next 1 h 20 min, he drives it at a speed of 51 km/hr. Find his average speed(in km/hr) for the entire journey.</span></p>",

                    solution_en: "<p>71.(a)<br><span style=\"font-family: Cambria Math;\">Time taken to cover 30km at 45 km/h&nbsp;<br></span><span style=\"font-family: Cambria Math;\">=&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>30</mn><mo>&#215;</mo><mn>60</mn></mrow><mn>45</mn></mfrac></math> = 40 min. =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>3</mn></mfrac></math> hr<br></span><span style=\"font-family: Cambria Math;\">Distance covered at 51 km/h in 1hr 20min.&nbsp;<br></span><span style=\"font-family: Cambria Math;\">=&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>51</mn><mo>&#215;</mo><mn>1</mn><mfrac><mn>20</mn><mn>60</mn></mfrac><mo>=</mo><mn>51</mn><mo>&#215;</mo><mn>1</mn><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>=</mo><mn>51</mn><mo>&#215;</mo><mfrac><mn>4</mn><mn>3</mn></mfrac></math> = 68 km<br></span><span style=\"font-family: Cambria Math;\">Average speed =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>30</mn><mo>+</mo><mn>68</mn></mrow><mrow><mstyle displaystyle=\"true\"><mfrac><mn>2</mn><mn>3</mn></mfrac></mstyle><mo>+</mo><mstyle displaystyle=\"true\"><mfrac><mn>4</mn><mn>3</mn></mfrac></mstyle></mrow></mfrac><mo>=</mo><mfrac><mn>98</mn><mn>2</mn></mfrac></math> = 49 km/h</span></p>",

                    section: "17",
                    question_en: "<p>72.<span style=\"font-family: Cambria Math;\"> In &Delta; ABC, the bisector of </span><span style=\"font-family: Cambria Math;\">&ang;</span><span style=\"font-family: Cambria Math;\">A meets BC at D. If AB = 9.6 cm, AC = 11.2 cm and BD = 4.8 cm, the perimeter of &Delta; ABC is:</span></p>",
                    question_hi: "<p>72. <span style=\"font-family: Cambria Math;\">&Delta; ABC </span><span style=\"font-family: Cambria Math;\">में</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&ang;</span><span style=\"font-family: Cambria Math;\">A&nbsp; </span><span style=\"font-family: Cambria Math;\">का समद्विभाजक </span><span style=\"font-family: Cambria Math;\">BC </span><span style=\"font-family: Cambria Math;\">से </span><span style=\"font-family: Cambria Math;\">D </span><span style=\"font-family: Cambria Math;\">पर मिलता है। यदि </span><span style=\"font-family: Cambria Math;\">AB = 9.6 cm, AC = 11.2 cm </span><span style=\"font-family: Cambria Math;\">और </span><span style=\"font-family: Cambria Math;\">BD = 4.8 cm </span><span style=\"font-family: Cambria Math;\">है</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">तो </span><span style=\"font-family: Cambria Math;\">&Delta; ABC </span><span style=\"font-family: Cambria Math;\">का परिमाप है:</span></p>",
                    options_en: ["<p>30.4 cm</p>", "<p>28.6 cm</p>", 
                                "<p>31.2 cm</p>", "<p>32.8 cm</p>"],
                    options_hi: ["<p>30.4 cm</p>", "<p>28.6 cm</p>",
                                "<p>31.2 cm</p>", "<p>32.8 cm</p>"],
                    solution_en: "<p>72.(c)</p>\n<p><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1653726595/word/media/image46.png\"></p>\n<p><span style=\"font-family: Cambria Math;\">According to the angle bisector theorem,&nbsp;</span><span style=\"font-family: Cambria Math;\">&nbsp;<br></span><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>A</mi><mi>B</mi></mrow><mrow><mi>A</mi><mi>C</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>B</mi><mi>D</mi></mrow><mrow><mi>D</mi><mi>C</mi></mrow></mfrac></math><br></span><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>9</mn><mo>.</mo><mn>6</mn></mrow><mrow><mn>11</mn><mo>.</mo><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn><mo>.</mo><mn>8</mn></mrow><mrow><mi>D</mi><mi>C</mi></mrow></mfrac></math><br></span><span style=\"font-family: Cambria Math;\">DC = 5.6<br></span><span style=\"font-family: Cambria Math;\">So, perimeter = AB + BC + AC&nbsp;<br></span><span style=\"font-family: Cambria Math;\">= 9.6 + (4.8 + 5.6) + 11.2 = 31.2 cm</span></p>",
                    solution_hi: "<p>72.(c)</p>\n<p><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1653726595/word/media/image46.png\"><br><span style=\"font-family: Cambria Math;\">कोण द्विभाजक प्रमेय के अनुसार</span><span style=\"font-family: Cambria Math;\">,</span><span style=\"font-family: Cambria Math;\"> </span></p>\n<p><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>A</mi><mi>B</mi></mrow><mrow><mi>A</mi><mi>C</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>B</mi><mi>D</mi></mrow><mrow><mi>D</mi><mi>C</mi></mrow></mfrac></math><br></span><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>9</mn><mo>.</mo><mn>6</mn></mrow><mrow><mn>11</mn><mo>.</mo><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn><mo>.</mo><mn>8</mn></mrow><mrow><mi>D</mi><mi>C</mi></mrow></mfrac></math><br></span><span style=\"font-family: Cambria Math;\">DC = 5.6<br></span><span style=\"font-family: Cambria Math;\">अतः परिमाप = </span><span style=\"font-family: Cambria Math;\">AB + BC + AC = 9.6 + (4.8 + 5.6) + 11.2 = 31.2 cm</span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "73",
                    section: "17",
                    question_en: "<p>73. <span style=\"font-family: Cambria Math;\">A hemispherical depression of diameter 4 cm is cut out from each face of a cubical block of sides 10 cm. Find the surface area of the remaining solid (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi><msup><mi>m</mi><mn>2</mn></msup></math>).</span></p>",
                    question_hi: "<p>73. <span style=\"font-family: Cambria Math;\">10 cm </span><span style=\"font-family: Cambria Math;\">भुजाओं वाले घनीय खंड के प्रत्येक फलक से</span><span style=\"font-family: Cambria Math;\">&nbsp; 4 cm </span><span style=\"font-family: Cambria Math;\">व्यास का एक अर्धगोलाकार अवनमन काटा जाता है। शेष ठोस का पृष्ठीय क्षेत्रफल ज्ञात कीजिए(<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi><msup><mi>m</mi><mn>2</mn></msup></math></span><span style=\"font-family: Cambria Math;\">&nbsp;</span><span style=\"font-family: Cambria Math;\">में) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#960;</mi><mo>=</mo><mfrac><mn>22</mn><mn>7</mn></mfrac></math></span><span style=\"font-family: Cambria Math;\">&nbsp;</span><span style=\"font-family: Cambria Math;\">लीजिये।</span></p>",
                    options_en: ["<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>900</mn><mfrac><mn>4</mn><mn>7</mn></mfrac></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>112</mn><mfrac><mn>4</mn><mn>7</mn></mfrac></math></p>", 
                                "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>675</mn><mfrac><mn>3</mn><mn>7</mn></mfrac></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>713</mn><mfrac><mn>1</mn><mn>7</mn></mfrac></math></p>"],
                    options_hi: ["<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>900</mn><mfrac><mn>4</mn><mn>7</mn></mfrac></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>112</mn><mfrac><mn>4</mn><mn>7</mn></mfrac></math></p>",
                                "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>675</mn><mfrac><mn>3</mn><mn>7</mn></mfrac></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>713</mn><mfrac><mn>1</mn><mn>7</mn></mfrac></math></p>"],
                    solution_en: "<p>73.(c)<br><span style=\"font-family: Cambria Math;\">Curved surface area of the hemisphere =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup></math><br></span><span style=\"font-family: Cambria Math;\">Base area of the hemisphere =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup></math><br></span><span style=\"font-family: Cambria Math;\">Effective area increase on each face of the cube&nbsp;<br></span><span style=\"font-family: Cambria Math;\">=&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup><mo>-</mo><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup><mo>=</mo><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup></math><br></span><span style=\"font-family: Cambria Math;\">Area of each face of the cube =<br></span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mrow><mo>(</mo><mn>10</mn><mo>)</mo></mrow><mn>2</mn></msup><mo>+</mo><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup><mo>=</mo><mn>100</mn><mo>+</mo><mfrac><mn>22</mn><mn>7</mn></mfrac><mo>&#215;</mo><msup><mn>2</mn><mn>2</mn></msup><mo>=</mo><mn>112</mn><mfrac><mn>4</mn><mn>7</mn></mfrac><mi>c</mi><msup><mi>m</mi><mn>2</mn></msup></math><br><span style=\"font-family: Cambria Math;\">Total surface area of the cube =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&#215;</mo><mn>112</mn><mfrac><mn>4</mn><mn>7</mn></mfrac><mo>=</mo><mn>675</mn><mfrac><mn>3</mn><mn>7</mn></mfrac><mi>c</mi><msup><mi>m</mi><mn>2</mn></msup></math></span></p>",
                    solution_hi: "<p>73.(c)<br><span style=\"font-family: Cambria Math;\">गोलार्द्ध का वक्र पृष्ठीय क्षेत्रफल =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup></math><br></span><span style=\"font-family: Cambria Math;\">गोलार्ध का आधार क्षेत्रफल =</span><span style=\"font-family: Cambria Math;\">&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup></math><br></span><span style=\"font-family: Cambria Math;\">घन के प्रत्येक फलक पर प्रभावी क्षेत्रफल में वृद्धि =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup><mo>-</mo><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup><mo>=</mo><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup></math><br></span><span style=\"font-family: Cambria Math;\">घन के प्रत्येक फलक का क्षेत्रफल =<br></span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mrow><mo>(</mo><mn>10</mn><mo>)</mo></mrow><mn>2</mn></msup><mo>+</mo><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup><mo>=</mo><mn>100</mn><mo>+</mo><mfrac><mn>22</mn><mn>7</mn></mfrac><mo>&#215;</mo><msup><mn>2</mn><mn>2</mn></msup><mo>=</mo><mn>112</mn><mfrac><mn>4</mn><mn>7</mn></mfrac><mi>c</mi><msup><mi>m</mi><mn>2</mn></msup></math><br><span style=\"font-family: Cambria Math;\"><span style=\"font-weight: 400;\">घन का कुल पृष्ठीय क्षेत्रफल</span> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&#215;</mo><mn>112</mn><mfrac><mn>4</mn><mn>7</mn></mfrac><mo>=</mo><mn>675</mn><mfrac><mn>3</mn><mn>7</mn></mfrac><mi>c</mi><msup><mi>m</mi><mn>2</mn></msup></math></span></p>",
                    correct: "c",

                    neg_marks: 0.5
                });
                questions.push({
                    id: "74",
                    section: "17",
                    question_en: "<p>74. <span style=\"font-family: Cambria Math;\">A man, a woman and a boy can complete a work in 3, 4 and 12 days, respectively. How many boys must assist one man and one woman to complete the same work in one day?</span></p>",
                    question_hi: "<p>74. <span style=\"font-family: Cambria Math;\">एक पुरुष</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">एक महिला और एक लड़का एक काम को क्रमशः </span><span style=\"font-family: Cambria Math;\">3, 4 </span><span style=\"font-family: Cambria Math;\">और </span><span style=\"font-family: Cambria Math;\">12 </span><span style=\"font-family: Cambria Math;\">दिनों में पूरा कर सकते हैं। एक ही कार्य को एक दिन में पूरा करने के लिए कितने लड़कों को एक पुरुष और एक महिला की सहायता करनी चाहिए</span><span style=\"font-family: Cambria Math;\">?</span></p>",
                    options_en: ["<p><span style=\"font-family: Cambria Math;\">&nbsp;5</span></p>", "<p>7</p>", 
                                "<p>4</p>", "<p>9</p>"],
                    options_hi: ["<p>5</p>", "<p>7</p>",
                                "<p>4</p>", "<p>9</p>"],
                    solution_en: "<p>74.(a)</p>\n<p><span style=\"font-family: Cambria Math;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; Men &nbsp; &nbsp; Women &nbsp; Boys<br></span><span style=\"font-family: Cambria Math;\">Efficiency :&nbsp; &nbsp; &nbsp; (4)&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; (3) &nbsp; &nbsp; &nbsp; &nbsp; (1)<br></span><span style=\"font-family: Cambria Math;\">Time taken : &nbsp; &nbsp; 3&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 4 &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 12<br></span><span style=\"font-family: Cambria Math;\">Total work = LCM of time taken = LCM (3, 4, 12) = 12 units<br></span><span style=\"font-family: Cambria Math;\">Let the required number of boys = n<br></span><span style=\"font-family: Cambria Math;\">So, [4(1) + 3(1) + n(1)] = 12<br></span><span style=\"font-family: Cambria Math;\">4 + 3 + n = 12<br></span><span style=\"font-family: Cambria Math;\">n&nbsp; = 12 &ndash; 7 = 5 boys</span></p>",
                    solution_hi: "<p>74.(a)</p>\n<p><span style=\"font-family: Cambria Math;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;</span><span style=\"font-family: Cambria Math;\">पुरुष</span><span style=\"font-family: Cambria Math;\"> : </span><span style=\"font-family: Cambria Math;\">महिला</span><span style=\"font-family: Cambria Math;\"> : </span><span style=\"font-family: Cambria Math;\">लड़के<br></span><span style=\"font-family: Cambria Math;\">दक्षता :-</span><span style=\"font-family: Cambria Math;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;(4) &nbsp; &nbsp; (3)&nbsp; &nbsp; &nbsp; (1)<br></span><span style=\"font-family: Cambria Math;\">लिया गया समय :- </span><span style=\"font-family: Cambria Math;\">3 &nbsp; &nbsp; &nbsp; 4 &nbsp; &nbsp; &nbsp; 12<br></span><span style=\"font-family: Cambria Math;\">कुल कार्य = लिए गए समय का </span><span style=\"font-family: Cambria Math;\">LCM = LCM (3, 4, 12) = 12 </span><span style=\"font-family: Cambria Math;\">इकाई<br></span><span style=\"font-family: Cambria Math;\">माना लड़कों की अभीष्ट संख्या = </span><span style=\"font-family: Cambria Math;\">n<br></span><span style=\"font-family: Cambria Math;\">इसलिए</span><span style=\"font-family: Cambria Math;\">, [4(1) + 3(1) + n(1)] = 12<br></span><span style=\"font-family: Cambria Math;\">4 + 3 + n = 12<br></span><span style=\"font-family: Cambria Math;\">n&nbsp; = 12 &ndash; 7 =&nbsp; 5 </span><span style=\"font-family: Cambria Math;\">लड़के</span></p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "75",
                    section: "7",
                    question_en: "<p>75. <span style=\"font-family: Cambria Math;\">A boat can cover a distance of 56 km downstream in 3.5 hours. The ratio of the boat in still water and the speed of the stream is 3 : 1. How much time will it take to cover a distance of 41.6 km downstream?</span></p>",
                    question_hi: "<p>75. <span style=\"font-family: Cambria Math;\">एक नाव धारा के अनुकूल </span><span style=\"font-family: Cambria Math;\">56 km </span><span style=\"font-family: Cambria Math;\">की दूरी </span><span style=\"font-family: Cambria Math;\">3.5 </span><span style=\"font-family: Cambria Math;\">घंटे में तय कर सकती है। शांत जल में नाव <span style=\"font-weight: 400;\">की चाल</span> और धारा की <span style=\"font-weight: 400;\">चाल</span> <span style=\"font-weight: 400;\">का अनुपात </span></span><span style=\"font-family: Cambria Math;\">3 : 1 </span><span style=\"font-family: Cambria Math;\">है। धारा के अनुकूल </span><span style=\"font-family: Cambria Math;\">41.6 km </span><span style=\"font-family: Cambria Math;\">की दूरी तय करने में उसे कितना समय लगेगा</span><span style=\"font-family: Cambria Math;\">? <span style=\"font-weight: 400;\">&nbsp;</span></span></p>",
                    options_en: ["<p>2.1</p>", "<p>1.5</p>", 
                                "<p>2.6</p>", "<p>1.8</p>"],
                    options_hi: ["<p>2.1</p>", "<p>1.5</p>",
                                "<p>2.6</p>", "<p>1.8</p>"],
                    solution_en: "<p>75.(c)<br><span style=\"font-family: Cambria Math;\">Speed of boat in downstream =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>56</mn><mrow><mn>3</mn><mo>.</mo><mn>5</mn></mrow></mfrac></math> = 16 km/h<br></span><span style=\"font-family: Cambria Math;\">Time taken to cover 41.6 km downstream =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>41</mn><mo>.</mo><mn>6</mn></mrow><mn>16</mn></mfrac></math> = 2.6 hrs</span></p>",
                    solution_hi: "<p>75.(c)<br><span style=\"font-family: Cambria Math;\">धारा के अनुकूल नाव की गति =</span><span style=\"font-family: Cambria Math;\">&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>56</mn><mrow><mn>3</mn><mo>.</mo><mn>5</mn></mrow></mfrac></math> = 16 km/h<br></span><span style=\"font-family: Cambria Math;\">धारा के अनुकूल </span><span style=\"font-family: Cambria Math;\">41.6 </span><span style=\"font-family: Cambria Math;\">किमी की दूरी तय करने में लगा समय =</span><span style=\"font-family: Cambria Math;\">&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>41</mn><mo>.</mo><mn>6</mn></mrow><mn>16</mn></mfrac></math> = 2.6 </span><span style=\"font-family: Cambria Math;\">घंटे</span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "76",
                    section: "7",
                    question_en: "<p>76.<span style=\"font-family: Cambria Math;\"> Select the most appropriate option that can substitute the underlined segment in the&nbsp;</span><span style=\"font-family: Cambria Math;\">given sentence. If there is no need to substitute it, select &lsquo;No substitution required&rsquo;.<br></span><span style=\"font-family: Cambria Math;\">This TV channel has a larger viewership </span><span style=\"font-family: Cambria Math;\"><span style=\"text-decoration: underline;\">from another channel</span>.</span></p>",
                    question_hi: "<p>76.<span style=\"font-family: Cambria Math;\"> Select the most appropriate option that can substitute the underlined segment in the&nbsp;</span><span style=\"font-family: Cambria Math;\">given sentence. If there is no need to substitute it, select &lsquo;No substitution required&rsquo;. <br></span><span style=\"font-family: Cambria Math;\">This TV channel has a larger viewership </span><span style=\"text-decoration: underline;\"><span style=\"font-family: Cambria Math;\">from another channel.</span></span></p>",

                                "<p>No substitution required</p>", "<p>from any other channel&nbsp;</p>"],
                    solution_en: "<p>76. (b)<br><span style=\"font-family: Cambria Math;\">We always use &lsquo;than&rsquo; when we do a comparison between two things, people, etc. Similarly in the given sentence, the viewership of a TV channel is being compared with all the other channels. Hence, &lsquo;than any other channel&rsquo; is the most appropriate answer.</span></p>",
                    solution_hi: "<p>76. (b)&nbsp;than any other channel.<br>&lsquo;than&rsquo; का प्रयोग हम हमेशा, दो चीजों, लोगों, आदि के बीच comparison करने के लिए करते हैं। इसी तरह दिए गए sentence में, एक TV channel की दर्शक संख्या (viewership) की तुलना अन्य सभी चैनलों से की जा रही है। अतः, &lsquo;than any other channel&rsquo; सबसे उपयुक्त उत्तर है।</p>",

                questions.push({

                    question_hi: "<p>77.<span style=\"font-family: Cambria Math;\"> Select the option that can be used as a one-word substitute for the given group of words.<br></span><span style=\"font-family: Cambria Math;\">One who can read and write</span></p>",
