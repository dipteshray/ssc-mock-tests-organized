                    options_hi: ["<p>3:40p.m.</p>", "<p>3:54p.m.</p>",
                                "<p>3:10p.m.</p>", "<p>3:24p.m.</p>"],
                    solution_en: "<p><span style=\"font-family: Cambria Math;\">52.(d)</span><br>Distance travelled by thief before he discovered = 48 &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac></math> = 24 km<br>Now, the relative speed of bike owner and thief = 58 - 48 = 10 km/h&nbsp;<br>Time taken by bike owner to catch thief = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>24</mn><mn>10</mn></mfrac></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>12</mn><mn>5</mn></mfrac></math> hr = 2hr 24 min.<br>Time at which thief caught = 12 : 30 pm + 30 min + 2hr 24min =&nbsp; 3 : 24 pm</p>\n<p>&nbsp;</p>",
                    solution_hi: "<p><span style=\"font-family: Cambria Math;\">52.(d)</span><br>चोर द्वारा खोजे जाने से पहले तय की गई दूरी = 48 &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac></math> = 24 किमी<br>अब बाइक मालिक और चोर की सापेक्ष गति = 58 - 48 = 10 किमी/घंटा<br>बाइक मालिक द्वारा चोर को पकड़ने में लगा समय = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>24</mn><mn>10</mn></mfrac></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>12</mn><mn>5</mn></mfrac></math> घंटा = 2घंटे 24 मिनट.<br>जिस समय चोर पकड़ा गया = 12 : 30 pm + 30 मिनट + 2hr 24 मिनट =&nbsp; 3 : 24 pm</p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "53",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">53.</span><span style=\"font-family: Cambria Math;\"> If ∆ABC ~ ∆FDE such that AB = 9 cm, AC = 11 cm, DF = 16 cm and DE = 12 cm, then the </span><span style=\"font-family: Cambria Math;\">length of BC is:</span></p>",
                    question_hi: "<p><span style=\"font-family: Cambria Math;\">53. </span><span style=\"font-family: arial, helvetica, sans-serif;\">यदि &Delta;ABC~&nbsp; &Delta;FDE इस प्रकार है कि AB = 9 cm, AC = 11 cm, DF = 16 cm और DE = 12 cm, तो BC की लंबाई ज्ञात करें।</span></p>",
                    options_en: ["<p>5<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>4</mn></mfrac></math><span style=\"font-family: Cambria Math;\">cm</span></p>", "<p>4<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>5</mn></mfrac></math><span style=\"font-family: Cambria Math;\">cm</span></p>",

                    options_hi: ["<p>5<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>4</mn></mfrac></math><span style=\"font-family: Cambria Math;\">cm</span></p>", "<p>4<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>5</mn></mfrac></math><span style=\"font-family: Cambria Math;\">cm</span></p>",

                    solution_en: "<p><span style=\"font-family: Cambria Math;\">53.(d)</span><br>If two triangles are similar then the ratio of their corresponding&nbsp; sides are equal.<br>If , <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo></math>ABC ~ <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo></math>FDE&nbsp;&nbsp;<br>Then,&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>AB</mi><mi>FD</mi></mfrac></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>BC</mi><mi>DE</mi></mfrac></math> <br>&rArr; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mn>16</mn></mfrac></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>B</mi><mi>C</mi></mrow><mn>12</mn></mfrac></math> &rArr; BC = 6<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>4</mn></mfrac></math>cm</p>",
                    solution_hi: "<p><span style=\"font-family: Cambria Math;\">53.(d)</span><br>यदि दो त्रिभुज समरूप हों तो उनकी संगत भुजाओं का अनुपात बराबर होता है।<br><span style=\"font-family: Cambria Math;\">यदि , <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo></math>ABC ~ <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo></math>FDE &nbsp;<br></span>तब<strong id=\"docs-internal-guid-5af65067-7fff-4a2a-c702-b5d4aeccedc5\">, </strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>AB</mi><mi>FD</mi></mfrac></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>BC</mi><mi>DE</mi></mfrac></math> <br>&rArr; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mn>16</mn></mfrac></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>B</mi><mi>C</mi></mrow><mn>12</mn></mfrac></math> &rArr; BC = 6<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>4</mn></mfrac></math>cm</p>",

                questions.push({
                    id: "54",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">54. The radii of two cylinders are in the ratio 1 : 4 and their heights are in the ratio 4 : 3.&nbsp;</span><span style=\"font-family: Cambria Math;\">Their volumes will be in the ratio ______.</span></p>",
                    question_hi: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">54. दो बेलनों की त्रिज्याएँ 1 : 4 के अनुपात में हैं और उनकी ऊँचाइयाँ 4 : 3 के अनुपात में हैं। उनके आयतनों का अनुपात&nbsp;_____होगा।</span></p>",
                    options_en: ["<p>1 :12</p>", "<p>2 : 9</p>", 
                                "<p>3 :10</p>", "<p>1 : 9</p>"],
                    options_hi: ["<p>1 :12</p>", "<p>2 : 9</p>",
                                "<p>3 :10</p>", "<p>1 : 9</p>"],
                    solution_en: "<p><span style=\"font-family: Cambria Math;\">54.(a)</span><br>Volume of cylinder = &pi;r<sup>2</sup>h&nbsp;<br>Let the radius of cylinders are x and 4x and height of the cylinder are 4y and 3y respectively.<br>&pi;(r<sub>1</sub>)<sup>2</sup>h<sub>1</sub>&nbsp; &nbsp; : &nbsp; &nbsp;&pi;(r<sub>2</sub>)<sup>2</sup>h<sub>2</sub><br>(x)<sup>2 </sup>&times; 4y&nbsp; &nbsp;:&nbsp; &nbsp; (4x)<sup>2 </sup>&times; 3y&nbsp;&nbsp;<br>&nbsp; &nbsp; &nbsp; 4&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;:&nbsp; &nbsp; &nbsp; &nbsp; 48&nbsp;<br>&nbsp; &nbsp; &nbsp; 1&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;:&nbsp; &nbsp; &nbsp; &nbsp; 12&nbsp;</p>",
                    solution_hi: "<p><span style=\"font-family: Cambria Math;\">54.(a)</span><br>बेलन का आयतन = &pi;r<sup>2</sup>h&nbsp;<br>माना बेलन की त्रिज्या x और 4x है और बेलन की ऊंचाई क्रमशः 4y और 3y है।<br>&pi;(r<sub>1</sub>)<sup>2</sup>h<sub>1</sub>&nbsp; &nbsp; : &nbsp; &nbsp;&pi;(r<sub>2</sub>)<sup>2</sup>h<sub>2</sub><br>(x)<sup>2 </sup>&times; 4y&nbsp; &nbsp;:&nbsp; &nbsp; (4x)<sup>2 </sup>&times; 3y&nbsp;&nbsp;<br>&nbsp; &nbsp; &nbsp; 4&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;:&nbsp; &nbsp; &nbsp; &nbsp; 48&nbsp;<br>&nbsp; &nbsp; &nbsp; 1&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;:&nbsp; &nbsp; &nbsp; &nbsp; 12&nbsp;</p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({

                    section: "17",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">55.</span><span style=\"font-family: Cambria Math;\"> If&nbsp; x + <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>x</mi></mfrac></math> = 2 </span><span style=\"font-family: Cambria Math;\">cos&theta; </span><span style=\"font-family: Cambria Math;\">, then&nbsp; x<sup>3</sup> + <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi>x</mi><mn>3</mn></msup></mfrac></math></span><span style=\"font-family: Cambria Math;\"> = ?</span></p>",
                    question_hi: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">55. यदि x + <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>x</mi></mfrac></math> = 2 cos&theta;&nbsp;है, तो x<sup>3</sup> + <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi>x</mi><mn>3</mn></msup></mfrac></math> = ?&nbsp;</span></p>",

                                "<p>2cos 3&theta;</p>", "<p>cos 2&theta;</p>"],
                    solution_en: "<p><span style=\"font-family: Cambria Math;\">55.(c)</span><br>cos3<span style=\"font-family: arial, helvetica, sans-serif;\">&theta;</span>&nbsp;= 4cos<span style=\"font-family: arial, helvetica, sans-serif;\"><sup>3</sup></span><span style=\"font-family: arial, helvetica, sans-serif;\">&theta; </span>- 3cos<span style=\"font-family: arial, helvetica, sans-serif;\">&theta;</span><br>x + <span style=\"font-family: arial, helvetica, sans-serif;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>x</mi></mfrac></math> </span>= 2cos<span style=\"font-family: arial, helvetica, sans-serif;\">&theta;</span> &nbsp; &hellip;..(given)<br>Then, x<span style=\"font-family: arial, helvetica, sans-serif;\"><sup>3</sup></span> + <span style=\"font-family: arial, helvetica, sans-serif;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi>x</mi><mn>3</mn></msup></mfrac></math> </span>= (2cos<span style=\"font-family: arial, helvetica, sans-serif;\">&theta;)<sup>3 </sup></span>- 3 &times; 2 cos<span style=\"font-family: arial, helvetica, sans-serif;\">&theta;</span> &nbsp;= 2(4cos<span style=\"font-family: arial, helvetica, sans-serif;\"><sup>3</sup></span><span style=\"font-family: arial, helvetica, sans-serif;\">&theta; </span>- 3cos<span style=\"font-family: arial, helvetica, sans-serif;\">&theta;)</span> = 2 cos3<span style=\"font-family: arial, helvetica, sans-serif;\">&theta;</span></p>",
                    solution_hi: "<p><span style=\"font-family: Cambria Math;\">55.(c)</span><br>cos3<span style=\"font-family: arial, helvetica, sans-serif;\">&theta;</span>&nbsp;= 4cos<span style=\"font-family: arial, helvetica, sans-serif;\"><sup>3</sup></span><span style=\"font-family: arial, helvetica, sans-serif;\">&theta; </span>- 3cos<span style=\"font-family: arial, helvetica, sans-serif;\">&theta;</span><br>x + <span style=\"font-family: arial, helvetica, sans-serif;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>x</mi></mfrac></math> </span>= 2cos<span style=\"font-family: arial, helvetica, sans-serif;\">&theta;</span> &nbsp; &hellip;..(दिया गया है)<br>तब, x<span style=\"font-family: arial, helvetica, sans-serif;\"><sup>3</sup></span> + <span style=\"font-family: arial, helvetica, sans-serif;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi>x</mi><mn>3</mn></msup></mfrac></math> </span>= (2cos<span style=\"font-family: arial, helvetica, sans-serif;\">&theta;)<sup>3 </sup></span>- 3 &times; 2 cos<span style=\"font-family: arial, helvetica, sans-serif;\">&theta;</span> &nbsp;= 2(4cos<span style=\"font-family: arial, helvetica, sans-serif;\"><sup>3</sup></span><span style=\"font-family: arial, helvetica, sans-serif;\">&theta; </span>- 3cos<span style=\"font-family: arial, helvetica, sans-serif;\">&theta;)</span> = 2 cos3<span style=\"font-family: arial, helvetica, sans-serif;\">&theta;</span></p>",
                    correct: "c",

                questions.push({
                    id: "56",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">56. A and B can do a certain work in 6 hours, and A, B and C together take 4 hours to do&nbsp;</span><span style=\"font-family: Cambria Math;\">the same. How long will it take for C alone to accomplish the task ?</span></p>",
                    question_hi: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">56. A और B एक निश्चित कार्य को 6 घंटे में कर सकते हैं और A, B और C मिलकर उसी कार्य को पूरा करने में 4 घंटे का समय लेते हैं। अकेले C को कार्य पूरा करने में कितना समय लगेगा ?</span></p>",
                    options_en: ["<p>12 hours</p>", "<p>4 hours</p>", 
                                "<p>2 hours</p>", "<p>6 hours</p>"],
                    options_hi: ["<p>12 <span style=\"font-family: Kokila;\">घंटे</span></p>", "<p>4 <span style=\"font-family: Kokila;\">घंटे</span></p>",
                                "<p>2 <span style=\"font-family: Kokila;\">घंटे</span></p>", "<p>6 <span style=\"font-family: Kokila;\">घंटे</span></p>"],
                    solution_en: "<p><span style=\"font-family: Cambria Math;\">56.(a)<br></span><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675230539/word/media/image39.png\" width=\"175\" height=\"77\"><br><br><span style=\"font-family: Cambria Math;\">Now , efficiency of C = efficiency of (A + B + C) - efficiency of (A+B)</span><br><span style=\"font-family: Cambria Math;\">efficiency of C = 3 - 2 = 1</span><br><span style=\"font-family: Cambria Math;\">Total work = 12 units</span><br><span style=\"font-family: Cambria Math;\">Time taken by C to complete task alone = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>12</mn><mn>1</mn></mfrac></math> </span><span style=\"font-family: Cambria Math;\"> = 12 </span><strong><span style=\"font-family: Cambria Math;\">hours</span></strong><span style=\"font-family: Cambria Math;\"> </span></p>",
                    solution_hi: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">56.(a)</span><br><span style=\"font-family: arial, helvetica, sans-serif;\"><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675230539/word/media/image39.png\" width=\"196\" height=\"86\"></span><br><span style=\"font-family: arial, helvetica, sans-serif;\">अब , C की क्षमता = (A + B + C) की क्षमता - (A + B) की क्षमता</span><br><span style=\"font-family: arial, helvetica, sans-serif;\">C की क्षमता = 3 - 2 = 1</span><br><span style=\"font-family: arial, helvetica, sans-serif;\">कुल कार्य = 12 इकाई</span><br><span style=\"font-family: arial, helvetica, sans-serif;\">C द्वारा अकेले कार्य को पूरा करने में लगा समय = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>12</mn><mn>1</mn></mfrac></math> = 12 <strong>घंटे</strong></span></p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "57",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">57. The pie chart given below shows the expenditure incurred by a person on 7 articles. </span><span style=\"font-family: Cambria Math;\">The total expenditure of all these 7 articles are 3600. Expenditure incurred on a </span><span style=\"font-family: Cambria Math;\">particular article is shown in terms of degree with respect to the total expenditure </span><span style=\"font-family: Cambria Math;\">incurred in all these 7 articles.<br></span><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675230539/word/media/image40.png\" width=\"176\" height=\"179\"><br><span style=\"font-family: Cambria Math;\">What is the average expenditure incurred on article P and Q ?</span></p>",
                    question_hi: "<p><span style=\"font-family: Cambria Math;\">57.<span style=\"font-family: arial, helvetica, sans-serif;\"> </span></span><span style=\"font-family: arial, helvetica, sans-serif;\">नीचे दिया गया वृत्त चित्र एक व्यक्ति द्वारा 7 विभिन्न वस्तुओ पर किए गए व्यय को दर्शाता है। इन सभी 7 वस्तुओ का कुल व्यय 3600 है। एक विशिष्ट वस्तु पर किए गए व्यय को इन सभी 7 वस्तुओं पर किए गए कुल व्यय के संदर्भ में डिग्री के रूप में दर्शाया गया है।<br></span><span style=\"font-family: arial, helvetica, sans-serif;\"><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675230539/word/media/image40.png\" width=\"192\" height=\"195\"><br></span><span style=\"font-family: arial, helvetica, sans-serif;\">वस्तु P तथा Q पर किया गया औसत व्यय क्या है&nbsp;?</span></p>",
                    options_en: ["<p>875</p>", "<p>905</p>", 
                                "<p>885</p>", "<p>950</p>"],
                    options_hi: ["<p>875</p>", "<p>905</p>",
                                "<p>885</p>", "<p>950</p>"],
                    solution_en: "<p><span style=\"font-family: Cambria Math;\">57.(d)<br></span><span style=\"font-family: Cambria Math;\">Average expenditure incurred on article P and Q&nbsp;<br></span><span style=\"font-family: Cambria Math;\">=&nbsp;</span>3600 &times; (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>70</mn><mo>&#176;</mo><mo>+</mo><mn>120</mn><mo>&#176;</mo></mrow><mrow><mn>360</mn><mo>&#176;</mo></mrow></mfrac></math>) &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac></math> = 3600 &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>19</mn><mrow><mn>36</mn><mo>&#215;</mo><mn>2</mn></mrow></mfrac></math> = Rs 950</p>",
                    solution_hi: "<p><span style=\"font-family: Cambria Math;\">57.(d)<br></span><span style=\"font-family: arial, helvetica, sans-serif;\">वस्तु P और Q पर किया गया औसत व्यय<br></span><span style=\"font-family: Cambria Math;\">= </span>3600 &times; (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>70</mn><mo>&#176;</mo><mo>+</mo><mn>120</mn><mo>&#176;</mo></mrow><mrow><mn>360</mn><mo>&#176;</mo></mrow></mfrac></math>) &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac></math> = 3600 &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>19</mn><mrow><mn>36</mn><mo>&#215;</mo><mn>2</mn></mrow></mfrac></math> = 950 रुपये</p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({

                    solution_en: "<p><span style=\"font-family: Cambria Math;\">58.(d)</span><br>We&nbsp; know that , cos<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta;</span> = (1 - sin<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta;)</span><br>sin<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta; </span>+ cos<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta;</span> = 1 &hellip;&hellip;eq.(1)<br>On squaring eq.(1) , we get&nbsp;&nbsp;<br>(sin<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta; </span>+ cos<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta;)<sup>2</sup></span> = (1)<sup>2</sup><br>sin<sup>4</sup><span style=\"font-family: Cambria Math;\">&theta; </span>+ cos<sup>4</sup><span style=\"font-family: Cambria Math;\">&theta;</span> + 2sin<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta;</span>cos<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta;</span> = 1<br>sin<sup>4</sup><span style=\"font-family: Cambria Math;\">&theta;</span> + cos<sup>4</sup><span style=\"font-family: Cambria Math;\">&theta; </span>= 1 - 2sin<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta;</span>cos<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta;</span><br>sin<sup>4</sup><span style=\"font-family: Cambria Math;\">&theta;</span> + cos<sup>4</sup><span style=\"font-family: Cambria Math;\">&theta; </span>= 1 - 2sin<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta;(</span>1 - sin<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta;)</span><br>sin<sup>4</sup><span style=\"font-family: Cambria Math;\">&theta;</span> + cos<sup>4</sup><span style=\"font-family: Cambria Math;\">&theta; </span>= 1 - 2sin<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta; </span>+ 2sin<sup>4</sup><span style=\"font-family: Cambria Math;\">&theta;</span></p>",
                    solution_hi: "<p><span style=\"font-family: Cambria Math;\">58.(d)</span><br>हम जानते है कि , cos<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta;</span> = (1 - sin<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta;)</span><br>sin<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta; </span>+ cos<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta;</span> = 1 &hellip;&hellip;समीकरण (1)<br>समीकरण (1) का वर्ग करने पर, हम प्राप्त करते हैं<br>(sin<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta; </span>+ cos<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta;)<sup>2</sup></span> = (1)<sup>2</sup><br>sin<sup>4</sup><span style=\"font-family: Cambria Math;\">&theta; </span>+ cos<sup>4</sup><span style=\"font-family: Cambria Math;\">&theta;</span> + 2sin<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta;</span>cos<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta;</span> = 1<br>sin<sup>4</sup><span style=\"font-family: Cambria Math;\">&theta;</span> + cos<sup>4</sup><span style=\"font-family: Cambria Math;\">&theta; </span>= 1 - 2sin<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta;</span>cos<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta;</span><br>sin<sup>4</sup><span style=\"font-family: Cambria Math;\">&theta;</span> + cos<sup>4</sup><span style=\"font-family: Cambria Math;\">&theta; </span>= 1 - 2sin<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta;(</span>1 - sin<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta;)</span><br>sin<sup>4</sup><span style=\"font-family: Cambria Math;\">&theta;</span> + cos<sup>4</sup><span style=\"font-family: Cambria Math;\">&theta; </span>= 1 - 2sin<sup>2</sup><span style=\"font-family: Cambria Math;\">&theta; </span>+ 2sin<sup>4</sup><span style=\"font-family: Cambria Math;\">&theta;</span></p>",

                questions.push({
                    id: "59",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">59. Three circles of radius 6 cm are kept touching each other. The string is tightly tied&nbsp;</span><span style=\"font-family: Cambria Math;\">around these three circles. What is the length of the string ?</span></p>",
                    question_hi: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">59. 6 से. मी. त्रिज्या वाले तीन वृत्तों को आपस में स्पर्श करते हुए रखा गया है। इन तीन वृत्तों के चारों ओर एक धागा कसकर बाँधा गया है। धागे की लम्बाई क्या है&nbsp;?</span></p>",

                    options_hi: ["<p>36 + 12&pi;<span style=\"font-family: Cambria Math;\">&nbsp;</span><span style=\"font-family: Kokila;\">से</span><span style=\"font-family: Cambria Math;\">.</span><span style=\"font-family: Kokila;\">मी</span><span style=\"font-family: Cambria Math;\">.</span></p>", "<p>36 + 18&pi;<span style=\"font-family: Cambria Math;\">&nbsp;</span><span style=\"font-family: Kokila;\">से</span><span style=\"font-family: Cambria Math;\">. </span><span style=\"font-family: Kokila;\">मी</span><span style=\"font-family: Cambria Math;\">.</span></p>",

                    solution_en: "<p><span style=\"font-family: Cambria Math;\">59.(a)<br></span><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675230539/word/media/image41.png\" width=\"166\" height=\"146\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675230539/word/media/image42.png\" width=\"229\" height=\"136\"><br><span style=\"font-family: Cambria Math;\">Now, the length of string = 3d + 2&pi;</span><span style=\"font-family: Cambria Math;\">r</span><br><span style=\"font-family: Cambria Math;\">Where d = diameter of the circles</span><br><span style=\"font-family: Cambria Math;\">&nbsp;the length of string = 3 &times; 12 + 2&pi; </span><span style=\"font-family: Cambria Math;\">&times; 6 = 36 + 12&pi;</span></p>",
                    solution_hi: "<p><span style=\"font-family: Cambria Math;\">59.(a)</span></p>\n<p><span style=\"font-family: arial, helvetica, sans-serif;\"><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675230539/word/media/image41.png\" width=\"160\" height=\"141\"> &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675230539/word/media/image42.png\" width=\"229\" height=\"136\"></span></p>\n<p><span style=\"font-family: arial, helvetica, sans-serif;\">अब धागे की लंबाई = 3d + 2&pi;r<br></span><span style=\"font-family: arial, helvetica, sans-serif;\">जहां d = व्रतों का व्यास&nbsp;<br></span><span style=\"font-family: arial, helvetica, sans-serif;\">धागे की लंबाई = 3 &times; 12 + 2&pi;&nbsp;&times; 6 = 36 + 12&pi;</span></p>",

                    solution_en: "<p><span style=\"font-family: Cambria Math;\">60.(c)<br></span><span style=\"font-family: \'Cambria Math\';\">x = 3 + 2</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn></msqrt></math><br>x = (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn></msqrt></math>)<sup>2</sup>&nbsp;+ (1)<sup>2</sup> + 2<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn></msqrt></math> &nbsp;= (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn></msqrt></math> + 1)<sup>2</sup><br><em><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mi>x</mi></msqrt></math></em> = (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn></msqrt></math> + 1)&nbsp; &nbsp;&hellip;&hellip;eq.(1)<br>Taking reciprocal of eq.(1) ,&nbsp; we get&nbsp;<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>&#160;</mo><mn>1</mn></mrow><msqrt><mi>x</mi></msqrt></mfrac></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>&#160;</mo><mn>1</mn></mrow><mrow><mo>(</mo><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>1</mn><mo>)</mo></mrow></mfrac></math>&times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>(</mo><msqrt><mn>2</mn></msqrt><mo>-</mo><mn>1</mn><mo>)</mo></mrow><mrow><mo>(</mo><msqrt><mn>2</mn></msqrt><mo>-</mo><mn>1</mn><mo>)</mo></mrow></mfrac></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>(</mo><msqrt><mn>2</mn></msqrt><mo>-</mo><mn>1</mn><mo>)</mo></mrow><mn>1</mn></mfrac></math> = (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn></msqrt></math> - 1)&nbsp; &nbsp; &nbsp; &nbsp;&hellip;&hellip;eq.(2)<br>Now, From eq.(1) and eq.(2), we get,<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mi>x</mi></msqrt></math> -&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>&#160;</mo><mn>1</mn></mrow><msqrt><mi>x</mi></msqrt></mfrac></math> = (<math xm                     question_en: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">64. What will be the remainder when 7<sup>42</sup> is divided by 48 ?</span></p>",
                    question_hi: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">64. जब 7<sup>42</sup>&nbsp;को 48 से विभाजित किया जाए, तो शेष ज्ञात कीजिए ।</span></p>",

                    solution_hi: "<p><span style=\"font-family: Cambria Math;\">64.(c)</span><br>यदि व्यंजक (a + 1)<sup>n</sup>, (a) से विभाज्य है, तो शेषफल हमेशा (+1)<sup>n</sup> होगा<br>(7<sup>42</sup>) = ((7<sup>2</sup>)<sup>21</sup>)&nbsp; = (49)<sup>21</sup> = (48 + 1)<sup>21</sup><br>जब (48 + 1)<sup>21</sup>,&nbsp; 48 से विभाज्य है, तो शेषफल (+1)<sup>21 </sup>= 1 होगा।&nbsp;</p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });

                    solution_en: "<p><span style=\"font-family: Cambria Math;\">66.(d)</span><br>According to the question ,<br>Number p = 150 &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>115</mn><mn>100</mn></mfrac></math> = 172.5&nbsp;<br>Now, Number k = 172.5 &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>85</mn><mn>100</mn></mfrac></math> = 146.625</p>",

                questions.push({
                    id: "67",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">67. What is the HCF of 36 and 198 ?</span></p>",
                    question_hi: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">67. 36 और 198 का महत्तम समापवर्तक (HCF) ज्ञात करें।</span></p>",
                    options_en: ["<p>36</p>", "<p>22</p>", 
                                "<p>18</p>", "<p>9</p>"],
                    options_hi: ["<p>36</p>", "<p>22</p>",
                                "<p>18</p>", "<p>9</p>"],
                    solution_en: "<p><span style=\"font-family: Cambria Math;\">67.(c)</span><br><span style=\"font-family: Cambria Math;\">Factor of 36 and 198 .</span><br><span style=\"font-family: Cambria Math;\">36 = 2 &times; 2 &times; 3 &times; 3</span><br><span style=\"font-family: Cambria Math;\">198 = 2 &times; 3 &times; 3 &times; 11</span><br><span style=\"font-family: Cambria Math;\">H.C.F. (36, 198) = 2 &times; 3 &times; 3 = 18</span></p>",
                    solution_hi: "<p><span style=\"font-family: Cambria Math;\">67<span style=\"font-family: arial, helvetica, sans-serif;\">.(c)<br></span></span><span style=\"font-family: arial, helvetica, sans-serif;\">36 और 198 का गूणनफल</span><br><span style=\"font-family: arial, helvetica, sans-serif;\"><span style=\"font-family: Cambria Math;\">36 = 2 &times; 2 &times; 3 &times; 3</span><br><span style=\"font-family: Cambria Math;\">198 = 2 &times; 3 &times; 3 &times; 11</span><br><span style=\"font-family: Cambria Math;\">H.C.F. (36, 198) = 2 &times; 3 &times; 3 = 1</span>8</span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "68",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">68. The cost of a piece of diamond varies with the square of its weight. A diamond of&nbsp;</span><span style=\"font-family: Cambria Math;\">Rs.6,084 value is cut into 3 pieces whose weights are in the ratio 3 : 2 : 1. Find the loss </span><span style=\"font-family: Cambria Math;\">involved in the cutting.</span></p>",
                    question_hi: "<p><span style=\"font-family: Cambria Math;\">68.<span style=\"font-family: arial, helvetica, sans-serif;\"> </span></span><span style=\"font-family: arial, helvetica, sans-serif;\">हीरे के एक टुकड़े का मूल्य उसके वजन के वर्ग के साथ बदलता रहता है। Rs.6,084 मूल्य के एक हीरे को 3 टुकड़ों में काटा जाता है, जिसका वजन 3 : 2 : 1 के अनुपात में होता है। काटने में होने वाली हानि ज्ञात कीजिए।</span></p>",
                    options_en: ["<p>Rs.3,768</p>", "<p>Rs.3,718</p>", 
                                "<p>Rs.3,168</p>", "<p>Rs.3,518</p>"],
                    options_hi: ["<p>Rs.3,768</p>", "<p>Rs.3,718</p>",
                                "<p>Rs.3,168</p>", "<p>Rs.3,518</p>"],
                    solution_en: "<p><span style=\"font-family: Cambria Math;\">68.(b)</span><br>Given ,&nbsp; the weight of diamond after cutting into 3 pieces is 3x : 2x : x<br>Total weight before cutting be 6x.<br>According to question ,&nbsp;<br>Price varies with the square of its weight ,<br>Then,&nbsp; Price of diamond before cutting = 36x<sup>2</sup><br>Total price after cutting = 9x<sup>2</sup> + 4x<sup>2 </sup>+ x<sup>2</sup> = 14x<sup>2</sup><br>Loss incurred = 36x<sup>2</sup> - 14x<sup>2</sup> = 22x<sup>2</sup><br>Now, 36x<sup>2 </sup>= Rs. 6084&nbsp;<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;x = 13<br>Loss = 22 &times;13 &times;13 = Rs 3718</p>",
                    solution_hi: "<p><span style=\"font-family: Cambria Math;\">68.(b)</span><br>दिया गया है, 3 टुकड़ों में काटने के बाद हीरे का वजन= 3x : 2x : x&nbsp;<br>काटने से पहले कुल वजन= 6x<br>प्रश्न के अनुसार ,&nbsp;<br>मूल्य इसके वजन के वर्ग के साथ बदलता रहता है,<br>तो, काटने से पहले हीरे की कीमत = 36x<sup>2</sup><br>काटने के बाद कुल कीमत = 9x<sup>2</sup> + 4x<sup>2 </sup>+ x<sup>2</sup> = 14x<sup>2</sup><br>नुकसान = 36x<sup>2</sup> - 14x<sup>2</sup> = 22x<sup>2</sup><br>अब, 36x<sup>2 </sup>= 6084 रुपये<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;x = 13<br>हानि = 22 &times; 13 &times; 13 = 3718 रुपये</p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "69",
                    section: "17",
                    question_en: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">69. The marked price of an article is ₹10,927. Due to festive season, a certain percentage of&nbsp;discount is declared. Raju buys an article at reduced price and sells it at ₹10,927, and makes a profit of 11.5%. What was the percentage discount offered ?</span></p>",
                    question_hi: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">69. एक वस्तु का अंकित मूल्य ₹10,927 है। त्योहारों के मौसम के कारण, एक निश्चित प्रतिशत में छूट घोषित की जाती है। राजू एक वस्तु को कम की गई कीमत पर खरीदता है और उसे ₹10,927 पर बेचता है, और 11.5% का लाभ कमाता है। तो बताइए कि कितने प्रतिशत की छूट दी गई थी ?</span></p>",
                    options_en: ["<p>10.3%</p>", "<p>11.3%</p>", 
                                "<p>11.5%</p>", "<p>10.9%</p>"],
                    options_hi: ["<p>10.3%</p>", "<p>11.3%</p>",
                                "<p>11.5%</p>", "<p>10.9%</p>"],
                    solution_en: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">69.(a)</span><br><span style=\"font-family: arial, helvetica, sans-serif;\">Raju makes a profit of 11.5% by selling article at Rs. 10927 .</span><br><span style=\"font-family: arial, helvetica, sans-serif;\">Cost price =<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>10927</mn><mo>&#215;</mo><mn>100</mn></mrow><mrow><mn>111</mn><mo>.</mo><mn>5</mn></mrow></mfrac></math> &nbsp;= Rs. 9800</span><br><span style=\"font-family: arial, helvetica, sans-serif;\">Now , the discount that Raju gets due to festive seasons = 10927 - 9800 = 1127 Rs.</span><br><span style=\"font-family: arial, helvetica, sans-serif;\">Discount % = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1127</mn><mn>10927</mn></mfrac><mo>&#215;</mo><mn>100</mn></math> &nbsp;= 10.3%</span><br><span style=\"font-family: arial, helvetica, sans-serif;\"><strong>Short Tricks:-</strong></span><br><span style=\"font-family: arial, helvetica, sans-serif;\"><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675230539/word/media/image49.png\" width=\"206\" height=\"93\"></span><br><span style=\"font-family: arial, helvetica, sans-serif;\">Discount % = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>23</mn><mn>223</mn></mfrac><mo>&#215;</mo><mn>100</mn></math> = 10.3%</span></p>",
                    solution_hi: "<p><span style=\"font-family: Cambria Math;\">6<span style=\"font-family: arial, helvetica, sans-serif;\">9.(a)</span></span><br><span style=\"font-family: arial, helvetica, sans-serif;\">राजू रुपये 10927 में वस्तु बेचकर 11.5% का लाभ कमाता है।.</span><br><span style=\"font-family: arial, helvetica, sans-serif;\">क्रय मूल्य = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>10927</mn><mo>&#215;</mo><mn>100</mn></mrow><mrow><mn>111</mn><mo>.</mo><mn>5</mn></mrow></mfrac></math> = Rs. 9800</span><br><span style=\"font-family: arial, helvetica, sans-serif;\">अब, त्योहारी सीजन के कारण राजू को मिलने वाली छूट = 10927 - 9800 = 1127 रुपये</span><br><span style=\"font-family: arial, helvetica, sans-serif;\">छूट % = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1127</mn><mn>10927</mn></mfrac><mo>&#215;</mo><mn>100</mn></math> = 10.3%</span><br><strong><span style=\"font-family: arial, helvetica, sans-serif;\">शॉर्ट ट्रिक्स:-</span></strong><br><span style=\"font-family: arial, helvetica, sans-serif;\"><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675230539/word/media/image49.png\" width=\"188\" height=\"85\"></span><br><span style=\"font-family: arial, helvetica, sans-serif;\">छूट % = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>23</mn><mn>223</mn></mfrac><mo>&#215;</mo><mn>100</mn></math> = 10.3%</span></p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({

                questions.push({

                questions.push({
                    id: "72",
                    section: "17",
                    question_en: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">72. If x - y = 1 and x<sup>2</sup> + y<sup>2 </sup>= 41 where x, y &ge; 0, then the value of x + y will be:</span></p>",
                    question_hi: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">72. यदि x &ndash; y = 1 और&nbsp;x<sup>2</sup> + y<sup>2</sup>&nbsp;= 41 है, जहाँ x, y &ge; 0 है, तो x + y का मान _____होगा।</span></p>",
                    options_en: ["<p>9</p>", "<p>8</p>",

                    options_hi: ["<p>9</p>", "<p>8</p>",
                                "<p>6</p>", "<p>7</p>"],
                    solution_en: "<p><span style=\"font-family: Cambria Math;\">72.(a)</span><br>Given that , x - y = 1&nbsp; and x<sup>2 </sup>+ y<sup>2</sup> = 41 <br>Now , (x - y)<sup>2 </sup>= x<sup>2 </sup>+ y<sup>2 </sup>- 2xy<br>1 = 41 - 2xy&nbsp;<br>xy = 20<br>Now by using formula,<br>(x + y)<sup>2 </sup>= x<sup>2 </sup>+ y<sup>2 </sup>+ 2xy<br>(x + y)<sup>2</sup> = 41 + 2 &times; 20 = 81<br>x + y = 9</p>",
                    solution_hi: "<p><span style=\"font-family: Cambria Math;\">72.(a)</span><br>दिया गया है कि , x - y = 1 और&nbsp;x<sup>2 </sup>+ y<sup>2</sup> = 41 <br>अब, (x - y)<sup>2 </sup>= x<sup>2 </sup>+ y<sup>2 </sup>- 2xy<br>1 = 41 - 2xy&nbsp;<br>xy = 20<br>अब सूत्र का प्रयोग करने पर ,<br>(x + y)<sup>2 </sup>= x<sup>2 </sup>+ y<sup>2 </sup>+ 2xy<br>(x + y)<sup>2</sup> = 41 + 2 &times; 20 = 81<br>x + y = 9</p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "73",
                    section: "17",
                    question_en: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">73. &Delta;XYZ ~ &Delta;GST and XY : GS = 2 : 3, XV is the median to the side YZ, and GD is the median to the side ST. The value of (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>Y</mi><mi>V</mi></mrow><mrow><mi>S</mi><mi>D</mi></mrow></mfrac></math>)<sup>2</sup>&nbsp;is _____.</span></p>",

                    solution_en: "<p><span style=\"font-family: Cambria Math;\">7<span style=\"font-family: arial, helvetica, sans-serif;\">3.(a)</span><br></span><span style=\"font-family: arial, helvetica, sans-serif;\"><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675230539/word/media/image50.png\" width=\"192\" height=\"113\"></span><br><span style=\"font-family: arial, helvetica, sans-serif;\">If two triangles are similar then the ratio of their corresponding sides are equal.</span><br><span style=\"font-family: arial, helvetica, sans-serif;\">If , &Delta;XYZ ~ &Delta;GST&nbsp;</span><br><span style=\"font-family: arial, helvetica, sans-serif;\">Then&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>XY</mi><mi>GS</mi></mfrac><mo>&#160;</mo></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>YZ</mi><mi>ST</mi></mfrac></math>&hellip;&hellip;.eq.(1)</span><br><span style=\"font-family: arial, helvetica, sans-serif;\">YV = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>YZ</mi><mn>2</mn></mfrac></math> and SD =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>ST</mi><mn>2</mn></mfrac></math>&hellip;..eq.(2)</span><br><span style=\"font-family: arial, helvetica, sans-serif;\">Putting the value of eq.(2) in eq.(1) , we get&nbsp;</span><br><span style=\"font-family: arial, helvetica, sans-serif;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>XY</mi><mi>GS</mi></mfrac></math>= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mi>YV</mi></mrow><mrow><mn>2</mn><mi>SD</mi></mrow></mfrac></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>3</mn></mfrac></math></span><br><span style=\"font-family: arial, helvetica, sans-serif;\">&rArr; (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>YV</mi><mi>SD</mi></mfrac></math>)<sup>2</sup>&nbsp;= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>9</mn></mfrac></math></span></p>",
                    solution_hi: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">73.(a)</span><br><span style=\"font-family: arial, helvetica, sans-serif;\"><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675230539/word/media/image50.png\" width=\"204\" height=\"120\"></span><br><span style=\"font-family: arial, helvetica, sans-serif;\">अवधारनाये:- यदि दो त्रिभुज समरूप हों तो उनकी आसन्न भुजाओं का अनुपात बराबर होता है।<br>यदि , &Delta;XYZ ~ &Delta;GST&nbsp;<br>तब&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>XY</mi><mi>GS</mi></mfrac><mo>&#160;</mo></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>YZ</mi><mi>ST</mi></mfrac></math>&hellip;&hellip;.समीकरण(1)<br>YV = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>YZ</mi><mn>2</mn></mfrac></math> और&nbsp;SD = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>ST</mi><mn>2</mn></mfrac></math>&hellip;..समीकरण(2)<br></span>समीकरण (2) का मान समीकरण (1) में रखने पर हम प्राप्त करते हैं<br><span style=\"font-family: arial, helvetica, sans-serif;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>XY</mi><mi>GS</mi></mfrac></math>= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mi>YV</mi></mrow><mrow><mn>2</mn><mi>SD</mi></mrow></mfrac></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>3</mn></mfrac></math><br>&rArr; (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>YV</mi><mi>SD</mi></mfrac></math>)<sup>2</sup>&nbsp;= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>9</mn></mfrac></math><br></span></p>",

                    solution_en: "<p>81.(c) <span style=\"font-family: Cambria Math;\"> <strong>Radha often goes to Nagpur.<br></strong></span><span style=\"font-family: Cambria Math;\">An adverb of frequency is a word that can be placed after the noun or pronoun in a sentence to give more information about the verb, adjective or another adverb. Some examples of adverbs of frequency are rarely, often, always, never and sometimes. Similarly, &lsquo;often&rsquo; as an adverb of frequency is perfectly used in option &lsquo;c&rsquo;. Hence, &lsquo;</span><span style=\"font-family: Cambria Math;\">Radha often goes to Nagpur</span><span style=\"font-family: Cambria Math;\">&rsquo; is the most appropriate answer.</span></p>",
                    solution_hi: "<p><span style=\"font-family: Cambria Math;\">81.(c) </span><span style=\"font-family: Cambria Math;\"> <strong>Radha often goes to Nagpur.<br></strong></span><span style=\"font-family: arial, helvetica, sans-serif;\">An adverb of frequency एक ऐसा शब्द है जिसे verb, adjective या किसी अन्य adverb के बारे में अधिक जानकारी देने के लिए एक वाक्य में noun या pronoun के बाद रखा जा सकता है। Adverbs of freuency के कुछ उदाहरण - Rarely, often, always, never और sometimes होते हैं। इसी प्रकार, &lsquo;often&rsquo; , adverb of frequency के रूप में विकल्प \'c\' में उपयोग किया गया है। इसलिए, \'Radha often goes to Nagpur\' सबसे उपयुक्त उत्तर है।</span></p>",

                    solution_hi: "<p>99.(d) <strong><span style=\"font-family: Cambria Math;\">imagined&nbsp;<br></span></strong><span style=\"font-family: arial, helvetica, sans-serif;\">&lsquo;Imagined&rsquo; का अर्थ है अपने दिमाग में एक तस्वीर या विचार बनाना कि कोई चीज़/कोई व्यक्ति कैसा हो सकता है। दिए गए passage में कहा गया है कि लोगों ने कल्पना की ये हड्डियाँ दिग्गजों या विशाल राक्षसों की हैं। इसलिए, &lsquo;imagined&rsquo; सबसे उपयुक्त उत्तर है।</span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "100",
                    section: "misc",
                    question_en: "<p>100. <strong>Cloze Test :<br></strong><span style=\"font-family: arial, helvetica, sans-serif;\">Everything we know about non-avian dinosaurs is_____(96) fossils, which include bones, teeth, footprints, tracks, eggs, and skin impressions. For centuries, people throughout the world have_____(97) amazing fossilized bones and footprints. Early finds inspired _____ (98) and fairy tales, and people_____(99) that these bones belonged to_____(100) or huge monsters.</span><br><span style=\"font-family: Cambria Math;\">Select the most appropriate option to fill in blank number 100.</span></p>",
                    question_hi: "<p>100. <strong>Cloze Test :<br></strong><span style=\"font-family: arial, helvetica, sans-serif;\">Everything we know about non-avian dinosaurs is_____(96) fossils, which include bones, teeth, footprints, tracks, eggs, and skin impressions. For centuries, people throughout the world have_____(97) amazing fossilized bones and footprints. Early finds inspired _____ (98) and fairy tales, and people_____(99) that these bones belonged to_____(100) or huge monsters.</span><br><span style=\"font-family: Cambria Math;\">Select the most appropriate option to fill in blank number 100.</span></p>",
                    options_en: ["<p>spirits</p>", "<p>devils</p>", 
                                "<p>ghosts</p>", "<p>giants</p>"],
                    options_hi: ["<p>spirits</p>", "<p>devils</p>",
                                "<p>ghosts</p>", "<p>giants</p>"],
                    solution_en: "<p>100.(d)<strong> <span style=\"font-family: Cambria Math;\">giants.<br></span></strong><span style=\"font-family: Cambria Math;\">&lsquo;</span><span style=\"font-family: Cambria Math;\">Giant</span><span style=\"font-family: Cambria Math;\">&rsquo; means </span><span style=\"font-family: Cambria Math;\">something that is very large</span><span style=\"font-family: Cambria Math;\">. The given passage states that </span><span style=\"font-family: Cambria Math;\">people imagined that these bones belonged to giants or huge monsters</span><span style=\"font-family: Cambria Math;\">. Hence, &lsquo;</span><span style=\"font-family: Cambria Math;\">giants</span><span style=\"font-family: Cambria Math;\">&rsquo; is the most appropriate answer.</span></p>",
                    solution_hi: "<p>100.(d)<strong> </strong><span style=\"font-family: Cambria Math;\"><strong>giants.</strong><br></span><span style=\"font-family: arial, helvetica, sans-serif;\">&lsquo;Giant&rsquo; का अर्थ है कोई ऐसी चीज जो बहुत बड़ी हो। दिए गए passage में कहा गया है की लोगों ने कल्पना की ये हड्डियाँ दिग्गजों या विशाल राक्षसों की हैं। इसलिए, &lsquo;giants&rsquo; सबसे उपयुक्त उत्तर है।</span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
