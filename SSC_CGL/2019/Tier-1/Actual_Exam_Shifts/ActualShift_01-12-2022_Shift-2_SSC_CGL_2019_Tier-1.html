                    solution_en: "<p><span style=\"font-family: Cambria Math;\">61.(a) </span><span style=\"font-family: Cambria Math;\">x<sup>9</sup> &times; x<sup>5</sup> &times; x<sup>-4</sup> &times; x<sup>0</sup> &times; x<sup>-6</sup></span><br>= x<sup>9</sup> &times; x<sup>5</sup> &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi mathvariant=\"normal\">x</mi><mn>4</mn></msup></mfrac></math>&times; 1 &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi mathvariant=\"normal\">x</mi><mn>6</mn></msup></mfrac></math>&hellip;&hellip;&hellip;..( x<sup>0</sup> = 1 )<br>= x<sup>4</sup>&nbsp;</p>",
                    solution_hi: "<p><span style=\"font-family: Cambria Math;\">61.(a) </span><span style=\"font-family: Cambria Math;\">x<sup>9</sup> &times; x<sup>5</sup> &times; x<sup>-4</sup> &times; x<sup>0</sup> &times; x<sup>-6</sup></span><br>= x<sup>9</sup> &times; x<sup>5</sup> &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi mathvariant=\"normal\">x</mi><mn>4</mn></msup></mfrac></math>&times; 1 &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi mathvariant=\"normal\">x</mi><mn>6</mn></msup></mfrac></math>&hellip;&hellip;&hellip;..( x<sup>0</sup> = 1 )<br>= x<sup>4</sup>&nbsp;</p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "62",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">62. </span><span style=\"font-family: Cambria Math;\">The value of (sin30&deg; cos60&deg; - cos30&deg; sin60&deg;) is equal to:</span></p>",
                    question_hi: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">62. (sin30&deg; cos60&deg;- cos30&deg; sin60&deg;)&nbsp;का मान निम्न में से किसके बराबर है?</span></p>",
                    options_en: ["<p>-cos30&deg;</p>", "<p>-sin30&deg;</p>", 
                                "<p>cos30&deg;</p>", "<p>sin30&deg;</p>"],
                    options_hi: ["<p>-cos30&deg;</p>", "<p>-sin30&deg;</p>",
                                "<p>cos30&deg;</p>", "<p>sin30&deg;</p>"],
                    solution_en: "<p><span style=\"font-family: Cambria Math;\">62.(b)</span><br><span style=\"font-family: Cambria Math;\"><strong>Formula :-</strong><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Sin</mi><mo>(</mo><mi mathvariant=\"normal\">a</mi><mo>&#176;</mo><mo>-</mo><mi mathvariant=\"normal\">b</mi><mo>&#176;</mo><mo>)</mo><mo>=</mo><mfenced><mrow><mi>Sina</mi><mo>&#176;</mo><mi>cosb</mi><mo>&#176;</mo><mo>-</mo><mi>cosa</mi><mo>&#176;</mo><mi>Sinb</mi><mo>&#176;</mo></mrow></mfenced></math><br>Now,<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>Sin</mi><mn>30</mn><mo>&#176;</mo><mi>cos</mi><mn>60</mn><mo>&#176;</mo><mo>-</mo><mi>cos</mi><mn>30</mn><mo>&#176;</mo><mi>Sin</mi><mn>60</mn><mo>&#176;</mo></mrow></mfenced><mo>=</mo><mi>Sin</mi><mo>&#160;</mo><mo>(</mo><mn>30</mn><mo>&#176;</mo><mo>-</mo><mn>60</mn><mo>&#176;</mo><mo>)</mo></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Sin</mi><mo>(</mo><mo>-</mo><mn>30</mn><mo>&#176;</mo><mo>)</mo><mo>=</mo><mo>-</mo><mi>Sin</mi><mo>&#160;</mo><mn>30</mn><mo>&#176;</mo><mo>&#8230;</mo><mo>&#8230;</mo><mo>&#8230;</mo><mo>.</mo><mo>.</mo><mo>&#160;</mo><mo>{</mo><mi>Sin</mi><mo>&#160;</mo><mo>(</mo><mo>-</mo><mi mathvariant=\"normal\">a</mi><mo>&#176;</mo><mo>)</mo><mo>=</mo><mo>-</mo><mi>Sin</mi><mo>&#160;</mo><mi mathvariant=\"normal\">a</mi><mo>&#176;</mo><mo>}</mo></math></span></p>",
                    solution_hi: "<p><span style=\"font-family: Cambria Math;\">62.(b)</span><br><span style=\"font-family: Cambria Math;\"><strong><strong id=\"docs-internal-guid-9bec7de0-7fff-6ae8-9f09-3cc2fa538cde\">सूत्र </strong>:-</strong><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Sin</mi><mo>(</mo><mi mathvariant=\"normal\">a</mi><mo>&#176;</mo><mo>-</mo><mi mathvariant=\"normal\">b</mi><mo>&#176;</mo><mo>)</mo><mo>=</mo><mfenced><mrow><mi>Sina</mi><mo>&#176;</mo><mi>cosb</mi><mo>&#176;</mo><mo>-</mo><mi>cosa</mi><mo>&#176;</mo><mi>Sinb</mi><mo>&#176;</mo></mrow></mfenced></math><br>अब,<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>Sin</mi><mn>30</mn><mo>&#176;</mo><mi>cos</mi><mn>60</mn><mo>&#176;</mo><mo>-</mo><mi>cos</mi><mn>30</mn><mo>&#176;</mo><mi>Sin</mi><mn>60</mn><mo>&#176;</mo></mrow></mfenced><mo>=</mo><mi>Sin</mi><mo>&#160;</mo><mo>(</mo><mn>30</mn><mo>&#176;</mo><mo>-</mo><mn>60</mn><mo>&#176;</mo><mo>)</mo></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Sin</mi><mo>(</mo><mo>-</mo><mn>30</mn><mo>&#176;</mo><mo>)</mo><mo>=</mo><mo>-</mo><mi>Sin</mi><mo>&#160;</mo><mn>30</mn><mo>&#176;</mo><mo>&#8230;</mo><mo>&#8230;</mo><mo>&#8230;</mo><mo>.</mo><mo>.</mo><mo>&#160;</mo><mo>{</mo><mi>Sin</mi><mo>&#160;</mo><mo>(</mo><mo>-</mo><mi mathvariant=\"normal\">a</mi><mo>&#176;</mo><mo>)</mo><mo>=</mo><mo>-</mo><mi>Sin</mi><mo>&#160;</mo><mi mathvariant=\"normal\">a</mi><mo>&#176;</mo><mo>}</mo></math></span></p>",

                questions.push({
                    id: "63",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">63. </span><span style=\"font-family: Cambria Math;\">What is the ratio of the mean proportional between 1.6 and 3.6 and the third proportional of 5 and 8?</span></p>",
                    question_hi: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">63. 1.6 और 3.6 के बीच मध्यानुपाती तथा 5 और 8 के तृतीयानुपाती का अनुपात क्या है?</span></p>",
                    options_en: ["<p>2 :15</p>", "<p>5 :16</p>", 
                                "<p>3 :16</p>", "<p>4 : 15</p>"],
                    options_hi: ["<p>2 :15</p>", "<p>5 :16</p>",
                                "<p>3 :16</p>", "<p>4 : 15</p>"],
                    solution_en: "<p><span style=\"font-family: Cambria Math;\">63.(c)</span><br><span style=\"font-family: Cambria Math;\">Mean Proportion of two number a&nbsp; and b<strong id=\"docs-internal-guid-dcac9fef-7fff-dfae-c703-4342c543361a\"> = </strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mi>a</mi><mi>b</mi></msqrt></math><br>Third Proportion of two number a&nbsp; and b =<strong id=\"docs-internal-guid-d831010f-7fff-e11c-851c-bc9e2a3dc2e4\"> </strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>&#160;</mo><msup><mi mathvariant=\"normal\">b</mi><mn>2</mn></msup></mrow><mi mathvariant=\"normal\">a</mi></mfrac></math><br>Now,&nbsp;</span><br>&nbsp; Mean prop.&nbsp; &nbsp;:&nbsp; &nbsp;third Prop.<br><span style=\"font-family: Cambria Math;\"><strong id=\"docs-internal-guid-7935c745-7fff-3c6d-ee9f-6edada9f67cc\"></strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>1</mn><mo>.</mo><mn>6</mn><mo>&#215;</mo><mn>3</mn><mo>.</mo><mn>6</mn></msqrt><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mfrac><mrow><mo>&#160;</mo><mo>&#160;</mo><msup><mn>8</mn><mn>2</mn></msup></mrow><mn>5</mn></mfrac></math><br>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mn>2</mn><mo>.</mo><mn>4</mn><mo>&#215;</mo><mn>5</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mn>64</mn></math><br>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; </span>3&nbsp; &nbsp; :&nbsp; &nbsp; 16</p>",
                    solution_hi: "<p><span style=\"font-family: Cambria Math;\">63.(c)</span><br><span style=\"font-family: Cambria Math;\">a और b का मध्यानुपात <strong id=\"docs-internal-guid-6ac48e57-7fff-8867-3dfc-08d86f2e37b0\">= </strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mi>a</mi><mi>b</mi></msqrt></math><br>a और b का&nbsp; तृतीयानुपात<strong id=\"docs-internal-guid-d831010f-7fff-e11c-851c-bc9e2a3dc2e4\"><strong id=\"docs-internal-guid-a6ff0368-7fff-d091-4ef1-0949e25309e4\"> =</strong> </strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>&#160;</mo><msup><mi mathvariant=\"normal\">b</mi><mn>2</mn></msup></mrow><mi mathvariant=\"normal\">a</mi></mfrac></math><br>अब,&nbsp;</span><br>&nbsp; &nbsp;मध्यानुपात&nbsp; &nbsp; &nbsp;: &nbsp; &nbsp;तृतीयानुपात<br><strong id=\"docs-internal-guid-1ac4572c-7fff-5cca-d2c1-3b74ea0e37da\"></strong><span style=\"font-family: Cambria Math;\"><strong id=\"docs-internal-guid-7935c745-7fff-3c6d-ee9f-6edada9f67cc\"></strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>1</mn><mo>.</mo><mn>6</mn><mo>&#215;</mo><mn>3</mn><mo>.</mo><mn>6</mn></msqrt><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mfrac><mrow><mo>&#160;</mo><mo>&#160;</mo><msup><mn>8</mn><mn>2</mn></msup></mrow><mn>5</mn></mfrac></math><br>&nbsp; &nbsp; &nbsp; &nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mn>2</mn><mo>.</mo><mn>4</mn><mo>&#215;</mo><mn>5</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mn>64</mn></math><br>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;</span>3&nbsp; &nbsp; :&nbsp; &nbsp; 16</p>",
                    correct: "c",

                });
                questions.push({
                    id: "64",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">64. </span><span style=\"font-family: Cambria Math;\">The difference between the cost price and selling price of a pair of shoes is Rs.1,200. If the profit is 15%, the selling price is:</span></p>",
                    question_hi: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">64. एक जोड़ी जूते के क्रय मूल्य और विक्रय मूल्य के बीच का अंतर Rs.1,200 है। यदि लाभ 15% है, तो विक्रय मूल्य है:</span></p>",
                    options_en: ["<p>Rs.8,200</p>", "<p>Rs.9,200</p>", 
                                "<p>Rs.8,000</p>", "<p>Rs.9,000</p>"],
                    options_hi: ["<p>Rs.8,200</p>", "<p>Rs.9,200</p>",
                                "<p>Rs.8,000</p>", "<p>Rs.9,000</p>"],
                    solution_en: "<p><span style=\"font-family: Cambria Math;\">64.(b)</span><br><span style=\"font-family: Cambria Math;\">Profit % = 15% = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>+</mo><mn>3</mn></mrow><mn>20</mn></mfrac></math></span><br><span style=\"font-family: Cambria Math;\">C.P.&nbsp; &nbsp; :&nbsp; &nbsp; S.P.</span><br><span style=\"font-family: Cambria Math;\">&nbsp;20&nbsp; &nbsp; &nbsp;:&nbsp; &nbsp; 23</span><br><span style=\"font-family: Cambria Math;\">Difference between C.P. and S.P. is 3 units = 1200 Rs.</span><br><span style=\"font-family: Cambria Math;\">Now, S.P. = 23 units = 9200 Rs</span></p>",
                    solution_hi: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">64.(b)</span><br><span style=\"font-family: arial, helvetica, sans-serif;\">लाभ % = 15% =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>+</mo><mn>3</mn></mrow><mn>20</mn></mfrac></math></span><br><span style=\"font-family: arial, helvetica, sans-serif;\">C.P.&nbsp; &nbsp; :&nbsp; &nbsp; S.P.</span><br><span style=\"font-family: arial, helvetica, sans-serif;\">&nbsp;20&nbsp; &nbsp; &nbsp; :&nbsp; &nbsp; 23</span><br><span style=\"font-family: arial, helvetica, sans-serif;\">C.P. और S.P के बीच का अंतर 3 इकाई = 1200 Rs.</span><br><span style=\"font-family: arial, helvetica, sans-serif;\">अब , S.P. = 23 इकाई = 9200 Rs</span></p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "65",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">65.&nbsp;</span><span style=\"font-family: Cambria Math;\">A person lent certain sum of money at the annual rate of 25 percent on simple interest. In 6 years the interest amounted to Rs.360 more than the sum lent. What is the sum lent?</span></p>",
                    question_hi: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">65. एक व्यक्ति किसी निश्चित राशि को 25 प्रतिशत की वार्षिक दर से साधारण ब्याज पर उधार देता है। 6 वर्षों में ब्याज, उधार दी गई राशि से 360 रुपये अधिक हो जाता है। उधार दी गई राशि क्या है?</span></p>",
                    options_en: ["<p>Rs.600</p>", "<p>Rs.360</p>", 
                                "<p>Rs.720</p>", "<p>Rs.540</p>"],
                    options_hi: ["<p>600 रुपये</p>", "<p>360 रुपये</p>",
                                "<p>720 रुपये</p>", "<p>540 रुपये</p>"],
                    solution_en: "<p><span style=\"font-family: Cambria Math;\">65.(c)</span><br><span style=\"font-family: Cambria Math;\">Let , the principal be x Rs.</span><br><span style=\"font-family: Cambria Math;\"><span style=\"font-weight: 400;\">Simple Interest = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>&#160;</mo><mi>P</mi><mo>&#215;</mo><mi>R</mi><mo>&#215;</mo><mi>T</mi></mrow><mn>100</mn></mfrac></math></span></span><br><span style=\"font-family: Cambria Math;\"> x + 360 = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"normal\">x</mi><mo>&#215;</mo><mn>25</mn><mo>&#215;</mo><mn>6</mn></mrow><mn>100</mn></mfrac></math></span><br><span style=\"font-family: Cambria Math;\">2x + 720 = 3x</span><br><span style=\"font-family: Cambria Math;\">x = 720 Rs.</span></p>",
                    solution_hi: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">65.(c)</span><br><span style=\"font-family: arial, helvetica, sans-serif;\">माना, मूलधन x रुपये है ,</span><br><span style=\"font-family: arial, helvetica, sans-serif;\"><span style=\"font-weight: 400;\">साधारण ब्याज = </span>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>&#160;</mo><mi>P</mi><mo>&#215;</mo><mi>R</mi><mo>&#215;</mo><mi>T</mi></mrow><mn>100</mn></mfrac></math></span><br><span style=\"font-family: arial, helvetica, sans-serif;\"> x + 360 = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"normal\">x</mi><mo>&#215;</mo><mn>25</mn><mo>&#215;</mo><mn>6</mn></mrow><mn>100</mn></mfrac></math></span><br><span style=\"font-family: arial, helvetica, sans-serif;\">2x + 720 = 3x</span><br><span style=\"font-family: arial, helvetica, sans-serif;\">x = 720 Rs.</span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "66",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">66.</span><span style=\"font-family: Cambria Math;\"> The side of an equilateral triangle is 12 cm. What is the radius of the circle circumscribing this equilateral triangle?</span></p>",
                    question_hi: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">66. एक समबाहु त्रिभुज की भुजा 12 से.मी. है। इस समबाहु त्रिभुज को परिगत करने वाले वृत्त की त्रिज्या क्या है?</span></p>",
                    options_en: ["<p>6<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math><span style=\"font-family: Cambria Math;\">cm</span></p>", "<p>4<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math><span style=\"font-family: Cambria Math;\">cm</span></p>", 
                                "<p>9<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math><span style=\"font-family: Cambria Math;\">cm</span></p>", "<p>5<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math><span style=\"font-family: Cambria Math;\">cm</span></p>"],
                    options_hi: ["<p>6<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math>&nbsp;से.मी.</p>\n<p>&nbsp;</p>", "<p>4<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math><span style=\"font-family: Cambria Math;\"> से.मी.</span></p>",
                                "<p>9<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math> से.मी.</p>", "<p>5<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math> से.मी.</p>"],
                    solution_en: "<p><span style=\"font-family: Cambria Math;\">66.(b)</span><br><span style=\"font-family: Cambria Math;\">Circumradius of equilateral triangle<strong id=\"docs-internal-guid-56f9c9c0-7fff-d008-23f5-b94450119b2b\">&nbsp; = </strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">a</mi></mrow><msqrt><mn>3</mn></msqrt></mfrac></math></span>&hellip;.. (a = side of equilateral<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo></math>)<br><span style=\"font-family: Cambria Math;\">Now, Circumradius <strong id=\"docs-internal-guid-3c1c6c0e-7fff-79e6-3ee3-6727b552de14\">= </strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>12</mn><msqrt><mn>3</mn></msqrt></mfrac><mo>=</mo><mn>4</mn><msqrt><mn>3</mn></msqrt><mi>cm</mi></math></span><br><strong>Short Tricks:-&nbsp;</strong><br>Golden ratio for equilateral triangle :-<br>Side&nbsp; :&nbsp; inradius&nbsp; :&nbsp; circumradius&nbsp; :&nbsp; height&nbsp; :&nbsp; perimeter&nbsp; :&nbsp; area<span style=\"font-family: Cambria Math;\"><strong id=\"docs-internal-guid-06d9241f-7fff-c396-2cec-486f47ef5d6f\"></strong><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mn>6</mn><mi mathvariant=\"normal\">k</mi><mo>&#160;</mo><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mo>&#160;</mo><msqrt><mn>3</mn></msqrt><mi mathvariant=\"normal\">k</mi><mo>&#160;</mo><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mo>&#160;</mo><mn>2</mn><msqrt><mn>3</mn></msqrt><mi mathvariant=\"normal\">k</mi><mo>&#160;</mo><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mo>&#160;</mo><mn>3</mn><msqrt><mn>3</mn></msqrt><mi mathvariant=\"normal\">k</mi><mo>&#160;</mo><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mo>&#160;</mo><mn>18</mn><mi mathvariant=\"normal\">k</mi><mo>&#160;</mo><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mo>&#160;</mo><mn>9</mn><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><msup><mi mathvariant=\"normal\">k</mi><mn>2</mn></msup><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo></math></span><br>Here.<span style=\"font-family: Cambria Math;\"><strong id=\"docs-internal-guid-97a58465-7fff-4db7-9eb0-80d0a3127c8a\"></strong><br>6 units = 12 cm<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Then</mi><mo>,</mo><mn>2</mn><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mi>units</mi><mo>=</mo><mn>4</mn><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mi>cm</mi></math></span></p>\n<p><span style=\"font-family: Cambria Math;\"> </span></p>",
                    solution_hi: "<p><span style=\"font-family: Cambria Math;\">66.(b)</span><br><span style=\"font-family: Cambria Math;\">समबाहु त्रिभुज की परित्रिज्या <strong id=\"docs-internal-guid-56f9c9c0-7fff-d008-23f5-b94450119b2b\"><strong id=\"docs-internal-guid-7afaccce-7fff-da3e-8f35-129c963c7463\">=</strong> </strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">a</mi></mrow><msqrt><mn>3</mn></msqrt></mfrac></math></span>&hellip;..(a = समबाहु त्रिभुज की भुजा<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo></math>)<br><span style=\"font-family: Cambria Math;\">अब, परित्रिज्या<strong id=\"docs-internal-guid-3c1c6c0e-7fff-79e6-3ee3-6727b552de14\"><strong id=\"docs-internal-guid-6431756c-7fff-a3a8-4b85-60c5813af4ce\"> =</strong> </strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>12</mn><msqrt><mn>3</mn></msqrt></mfrac><mo>=</mo><mn>4</mn><msqrt><mn>3</mn></msqrt><mi>cm</mi></math></span><br><strong>शार्ट ट्रिक:-&nbsp;</strong><br>समबाहु त्रिभुज के लिए स्वर्णिम अनुपात :-<br>भुजा : &nbsp;अन्तःत्रिज्या: &nbsp;परित्रिज्या : &nbsp;ऊँचाई : &nbsp;परिमाप &nbsp; : &nbsp;क्षेत्रफल<br><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mn>6</mn><mi mathvariant=\"normal\">k</mi><mo>&#160;</mo><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mo>&#160;</mo><msqrt><mn>3</mn></msqrt><mi mathvariant=\"normal\">k</mi><mo>&#160;</mo><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mo>&#160;</mo><mn>2</mn><msqrt><mn>3</mn></msqrt><mi mathvariant=\"normal\">k</mi><mo>&#160;</mo><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mo>&#160;</mo><mn>3</mn><msqrt><mn>3</mn></msqrt><mi mathvariant=\"normal\">k</mi><mo>&#160;</mo><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mo>&#160;</mo><mn>18</mn><mi mathvariant=\"normal\">k</mi><mo>&#160;</mo><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mo>&#160;</mo><mn>9</mn><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><msup><mi mathvariant=\"normal\">k</mi><mn>2</mn></msup><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo></math></span><br>यहाँ,<span style=\"font-family: Cambria Math;\"><br>6 इकाई = 12 cm<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#2340;&#2348;</mi><mo>,</mo><mn>2</mn><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mi>&#2311;&#2325;&#2366;&#2312;</mi><mo>=</mo><mn>4</mn><msqrt><mn>3</mn></msqrt><mi>cm</mi></math></span></p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "67",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">67. </span><span style=\"font-family: Cambria Math;\">The following table shows the number of different items in different shops and their respective selling prices per unit.</span><br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675051310/word/media/image45.png\" width=\"437\" height=\"231\"><br><span style=\"font-family: Cambria Math;\">Find the percentage of total revenue which comes from Cooler from shop E, considering all given items are being sold from shop E and from all the given shops only given three items are being sold. (Rounded off to three decimal places)</span></p>",
                    question_hi: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">67. निम्न तालिका विभिन्न दुकानों में विभिन्न वस्तुओं की संख्या और प्रति इकाई उनके संबंधित विक्रय मूल्य को दर्शाती है।</span><br><strong id=\"docs-internal-guid-513757e1-7fff-90f5-d977-cd268ba2984d\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXfi81l9qB0Pck8xuE9c0T81g_eVy4AfKK8lmTEeT-AHnTg8_rumEzyYKtZ69rOUbVsA3jXcDyimKM3jIJ302c3ljgSh0-uIGhcJW3wfGdTMqA_1wydy9xAwvEVUOT8y8F9-s9GQtNO7c_PRVzmMvQ-qVT4?key=cfIEG6gCltJ6I40q7CPWGw\" width=\"376\" height=\"181\"></strong><br><span style=\"font-family: arial, helvetica, sans-serif;\">कुल राजस्व का प्रतिशत ज्ञात करें, जो दुकान E से कूलर की बिक्री से आता है (दशमलव के बाद तीन स्थानों तक पूर्णांकित ), यह मान लें कि दुकान E से सभी वस्तुएं बेची जा रही हैं और दी गई सभी दुकानों से केवल तीन वस्तुओं की बिक्री की जा रही है।</span></p>",
                    options_en: ["<p>4.226%</p>", "<p>3.516%</p>", 
                                "<p>10.45%</p>", "<p>8.910%</p>"],
                    options_hi: ["<p>4.226%</p>", "<p>3.516%</p>",

                    solution_hi: "<p><span style=\"font-family: Cambria Math;\">71.(a)</span><br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675051310/word/media/image51.png\" width=\"149\" height=\"67\"><br><span style=\"font-weight: 400;\">कुल कार्य &nbsp; = 80 इकाई&nbsp;</span><br><span style=\"font-weight: 400;\">पहले तीन दिनों में किया कार्य : - 8 + 8 + (8 + 4 + 2) = 30 इकाई&nbsp;</span><br><span style=\"font-weight: 400;\">अगले तीन दिन का कार्य = 30 इकाई&nbsp;</span><br><span style=\"font-weight: 400;\">सातवें और आठवें दिन का कार्य &nbsp; = 8 + 8 इकाई = 16 इकाई&nbsp;</span><br><span style=\"font-weight: 400;\">शेष&nbsp; कार्य = 80 इकाई - 76 इकाई&nbsp; = 4 इकाई&nbsp;</span><br><span style=\"font-weight: 400;\">अब, 4 इकाइयों को पूरा करने में लगा समय = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>14</mn></mfrac><mo>=</mo><mfrac><mrow><mo>&#160;</mo><mn>2</mn></mrow><mn>7</mn></mfrac></math> </span><span style=\"font-weight: 400;\">&nbsp;दिन&nbsp;</span><br><span style=\"font-weight: 400;\">कुल दिन = 3 + 3 + 2 +</span><span style=\"font-weight: 400;\"> </span><span style=\"font-weight: 400;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>7</mn></mfrac></math></span><span style=\"font-weight: 400;\"> = 8</span><span style=\"font-weight: 400;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>7</mn></mfrac></math></span><span style=\"font-weight: 400;\">दिन&nbsp;</span></p>\n<p>&nbsp;</p>",

                questions.push({
                    id: "73",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">73. </span><span style=\"font-family: Cambria Math;\">A hemisphere of lead of radius 4 cm is cast into a right circular cone of height 72 cm. What is the radius of the base of the cone?</span></p>",

>.</mo><mn>33</mn><mo>&#160;</mo><mi>cm</mi></math></span></p>",

                questions.push({
                    id: "74",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">74.</span><span style=\"font-family: Cambria Math;\"> If the angles of a triangle are (x - 46) degrees, ( x + 96) degrees and 8x degrees, then what is the value of 2x ?</span></p>",
                    question_hi: "<p><span style=\"font-family: arial, helvetica, sans-serif;\">74. यदि एक त्रिभुज के कोण (x &ndash; 46 ) डिग्री, (x + 96 ) डिग्री तथा 8x डिग्री हैं, तो 2x का मान क्या है?</span></p>",
                    options_en: ["<p>15 degrees</p>", "<p>24 degrees</p>", 
                                "<p>26 degrees</p>", "<p>13 degrees</p>"],
                    options_hi: ["<p>15 डिग्री</p>", "<p>24<span style=\"font-family: Cambria Math;\"> डिग्री</span></p>",
                                "<p>26 डिग्री</p>", "<p>13 डिग्री</p>"],
                    solution_en: "<p><span style=\"font-family: Cambria Math;\">74.(c)</span><br><span style=\"font-family: Cambria Math;\">Sum of All angle of triangle is always 180&deg;</span><br><span style=\"font-weight: 400;\">(x - 46</span><span style=\"font-weight: 400;\">&deg;) + (</span><span style=\"font-weight: 400;\">x + 96</span><span style=\"font-weight: 400;\">&deg;) + 8x&deg;&nbsp; = 180&deg;</span><br><span style=\"font-family: Cambria Math;\">10x&deg; = 180&deg; -50&deg;</span><br><span style=\"font-family: Cambria Math;\"> 2x&deg; = 26&deg;</span></p>",
                    solution_hi: "<p><span style=\"font-family: Cambria Math;\">74.(c)</span><br>त्रिभुज के सभी कोणों का योग हमेशा 180&deg; होता है<br><span style=\"font-weight: 400;\">(x - 46</span><span style=\"font-weight: 400;\">&deg;) + (</span><span style=\"font-weight: 400;\">x + 96</span><span style=\"font-weight: 400;\">&deg;) + 8x&deg;&nbsp; = 180&deg;</span><br><span style=\"font-family: Cambria Math;\">10x&deg; = 180&deg; -50&deg;</span><br><span style=\"font-family: Cambria Math;\"> 2x&deg; = 26&deg;</span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "75",
                    section: "7",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">75.</span><span style=\"font-family: Cambria Math;\"> O is the centre of this circle. Tangent drawn from a point P, touches the circle at Q. If PQ = 24 cm and OQ = 10 cm, then what is the value of OP?</span></p>",

                    solution_en: "<p><span style=\"font-family: Cambria Math;\">75.(a)</span><br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675051310/word/media/image52.png\" width=\"188\" height=\"95\"><br><span style=\"font-family: Cambria Math;\">We know the angle formed between tangent and radius is always 90&deg; .</span><br><span style=\"font-family: Cambria Math;\">In &Delta;<span style=\"font-weight: 400;\">OPQ</span>&nbsp;</span><br><span style=\"font-family: Cambria Math;\">Using triplets (10, 24, 26)</span><br><span style=\"font-family: Cambria Math;\">OP = 26 cm</span></p>",

                        optionClass += ' incorrect';

                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
