                    solution_en: "<p>68.(b)&nbsp;<br><strong id=\"docs-internal-guid-1e623866-7fff-1c66-4379-76559034504e\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXdqgsOPhRRKyrEqK6ytBB1QBaGpMSOdNwzLslTyidDrRCdZQtTyVskCn3T6pxbe7jyu5IPqd2E1rzXzG13n8wthJf8x4exDxQ_nHcN0aJPDZCanuULAPoPQdbEinvgtYT9vUhKwaCZCKAxhL-Optq3hjeqO?key=gBeYw05c6ydkcanuoGO4IaXG\" width=\"227\" height=\"164\"></strong><br>If Pipes are opened on alternate hr , than <br>In 2hr , tank fill in = (7 + 3) = 10 unit <br><math display=\"inline\"><mo>&#8658;</mo></math> 12 hr = 60 unit <br>Remaining 3 unit fill by pipe X in <math display=\"inline\"><mfrac><mrow><mn>3</mn></mrow><mrow><mn>7</mn></mrow></mfrac></math> hr<br><math display=\"inline\"><mo>&#8756;</mo></math> Total time taken to full the tank = 12 hr + <math display=\"inline\"><mfrac><mrow><mn>3</mn></mrow><mrow><mn>7</mn></mrow></mfrac></math>hr = 12<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>7</mn></mfrac></math> hr</p>",
                    solution_hi: "<p>68.(b)&nbsp;<br><strong id=\"docs-internal-guid-116a39a6-7fff-c8dc-da0b-40e8d920c87d\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXemoo5BJvvJfjV74NaZKEu_Sy447Pd0EDX6k5zftdUkn6Ulz8E3pn8xjoC5b6orZSlIPwgd_-1LrG3SknQ_9N2h4Qf9Hc6JhYxworlqSGbC1r_ChvL9vaSyaFuzSkAA5SmCwyD8jY99DnB-32GrGmiMI30M?key=gBeYw05c6ydkcanuoGO4IaXG\" width=\"203\" height=\"178\"></strong><br>यदि पाइप वैकल्पिक घंटे पर खोले जाते हैं, तो <br>2 घंटे में, टैंक भरेगा = (7 + 3) = 10 इकाई <br><math display=\"inline\"><mo>&#8658;</mo></math> 12 घंटे = 60 इकाई <br>शेष 3 इकाई , पाइप X द्वारा <math display=\"inline\"><mfrac><mrow><mn>3</mn></mrow><mrow><mn>7</mn></mrow></mfrac></math> घंटे में भरा जाएगा <br><math display=\"inline\"><mo>&#8756;</mo></math> टैंक को पूरा भरने में लगा कुल समय = 12 घंटे + <math display=\"inline\"><mfrac><mrow><mn>3</mn></mrow><mrow><mn>7</mn></mrow></mfrac></math> घंटे = 12<math display=\"inline\"><mfrac><mrow><mn>3</mn></mrow><mrow><mn>7</mn></mrow></mfrac></math> घंटे</p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "69",
                    section: "17",
                    question_en: "<p>69. P, Q and R are the three angles of a triangle. If P &minus; Q = 20&deg; and Q &minus; R = 26&deg;, then &ang;P is equal to:</p>",
                    question_hi: "<p>69. P, Q और R एक त्रिभुज के तीन कोण हैं। यदि P &minus; Q = 20&deg; है और Q &minus; R = 26&deg; है, तो &ang;P निम्नलिखित में से किसके बराबर है?</p>",
                    options_en: ["<p>52&deg;</p>", "<p>46&deg;</p>", 
                                "<p>92&deg;</p>", "<p>82&deg;</p>"],
                    options_hi: ["<p>52&deg;</p>", "<p>46&deg;</p>",
                                "<p>92&deg;</p>", "<p>82&deg;</p>"],
                    solution_en: "<p>69.(d) Here , P &minus; Q = 20&deg; <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#8736;</mo><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">&#160;</mi><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">Q</mi><mi mathvariant=\"normal\">&#160;</mi><mo>+</mo><mo>&#160;</mo><mn>20</mn><mo>&#176;</mo><mi mathvariant=\"normal\">&#160;</mi></math>And Q &minus; R = 26&deg; &rArr; &ang;R = Q - 26&deg;<br><math display=\"inline\"><mo>&#8658;</mo></math> &ang;P + &ang;Q + &ang;R = 180&deg;<br><math display=\"inline\"><mo>&#8658;</mo></math> &ang;Q + 20&deg; + &ang;Q + &ang;Q - 26&deg; = 180&deg;<br><math display=\"inline\"><mo>&#8658;</mo></math> 3&ang;Q = 186&deg; &rArr; &ang;Q = 62&deg;<br>&there4; &ang;P = 62&deg; + 20&deg; = 82&deg;</p>",
                    solution_hi: "<p>69.(d) यहाँ , P &minus; Q = 20&deg; <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#8736;</mo><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">&#160;</mi><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">Q</mi><mi mathvariant=\"normal\">&#160;</mi><mo>+</mo><mo>&#160;</mo><mn>20</mn><mo>&#176;</mo><mi mathvariant=\"normal\">&#160;</mi></math>और Q &minus; R = 26&deg; &rArr; &ang;R = Q - 26&deg;<br><math display=\"inline\"><mo>&#8658;</mo></math> &ang;P + &ang;Q + &ang;R = 180&deg;<br><math display=\"inline\"><mo>&#8658;</mo></math> &ang;Q +20&deg; + &ang;Q + &ang;Q - 26&deg; = 180&deg;<br><math display=\"inline\"><mo>&#8658;</mo></math> 3&ang;Q = 186&deg; &rArr; &ang;Q = 62&deg;<br>&there4; &ang;P = 62&deg; + 20&deg; = 82&deg;</p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "70",
                    section: "17",
                    question_en: "<p>70. Aman invested a sum of money in scheme A at the rate of 8% p.a. for a period of 5 years on simple interest. He invested four times of the sum of scheme A in scheme B at the rate of 5% p.a. for 7 years on simple interest. He received a total interest amount of ₹1,620. How much (in ₹) did he invest in scheme B?</p>",
                    question_hi: "<p>70. अमन ने योजना A में साधारण ब्याज पर 5 वर्ष की अवधि के लिए 8% वार्षिक दर से एक धनराशि निवेश की। उसने साधारण ब्याज पर योजना A की राशि का चार गुना 5% वार्षिक दर से 7 वर्ष के लिए योजना B में निवेश किया। उसे कुल ब्याज राशि के रूप में ₹1,620 प्राप्त हुए।। उसने योजना B में कितनी राशि (₹ में) निवेश की थी?</p>",
                    options_en: ["<p>2,400</p>", "<p>900</p>", 
                                "<p>3,200</p>", "<p>3,600</p>"],
                    options_hi: ["<p>2,400</p>", "<p>900</p>",
                                "<p>3,200</p>", "<p>3,600</p>"],
                    solution_en: "<p>70.(d) Let the sum invested on scheme A = ₹X&nbsp;<br>According to question , <br><math display=\"inline\"><mo>&#8658;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"normal\">X</mi><mo>&#215;</mo><mn>5</mn><mo>&#215;</mo><mn>8</mn></mrow><mn>100</mn></mfrac></math> + <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>4</mn><mi mathvariant=\"normal\">X</mi><mo>&#215;</mo><mn>5</mn><mo>&#215;</mo><mn>7</mn></mrow><mn>100</mn></mfrac></math> = 1620<br><math display=\"inline\"><mo>&#8658;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>4</mn><mi mathvariant=\"normal\">X</mi></mrow><mn>10</mn></mfrac></math> + <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>14</mn><mi mathvariant=\"normal\">X</mi></mrow><mn>10</mn></mfrac></math> = 1620<br><math display=\"inline\"><mo>&#8658;</mo></math> 18X = 16200 &rArr; X = 900<br>&there4; Amount invested in scheme B (4X) = 900 &times; 4 = ₹3600</p>",
                    solution_hi: "<p>70.(d) माना योजना A पर निवेश की गई राशि = ₹X&nbsp;<br>प्रश्न के अनुसार, <br><math display=\"inline\"><mo>&#8658;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"normal\">X</mi><mo>&#215;</mo><mn>5</mn><mo>&#215;</mo><mn>8</mn></mrow><mn>100</mn></mfrac></math> + <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>4</mn><mi mathvariant=\"normal\">X</mi><mo>&#215;</mo><mn>5</mn><mo>&#215;</mo><mn>7</mn></mrow><mn>100</mn></mfrac></math> = 1620<br><math display=\"inline\"><mo>&#8658;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>4</mn><mi mathvariant=\"normal\">X</mi></mrow><mn>10</mn></mfrac></math> + <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>14</mn><mi mathvariant=\"normal\">X</mi></mrow><mn>10</mn></mfrac></math> = 1620<br><math display=\"inline\"><mo>&#8658;</mo></math> 18X = 16200 &rArr; X = 900<br>&there4; योजना B (4X) में निवेश की गई राशि = 900 &times; 4 = ₹3600</p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "71",
                    section: "17",
                    question_en: "<p>71. A student studying in 6th class scored the following marks in 6 subjects.<br>The maximum marks for each subject are 100.<br><strong id=\"docs-internal-guid-e35b4e9d-7fff-4c5b-0ed1-55dc0fdbbaf7\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXcrTQR5ykl68zYZZEqmfqOwB0W5UapxESn5l3Sgd423JGF962rAUarNJsb7XVuXJxZgp4ukjxMrTkY9P6kKxQNLnhcr3mTeB8guqJ0qVD1aJVPjp3TWXidvttM3wqh37lgVLEkw?key=gBeYw05c6ydkcanuoGO4IaXG\" width=\"185\" height=\"151\"></strong><br>What are the average marks scored by the student?</p>",
                    question_hi: "<p>71. छठी कक्षा में पढ़ने वाले एक छात्र ने 6 विभिन्न विषयों में निम्नलिखित अंक प्राप्त किए हैं।&nbsp;<br>प्रत्येक विषय के लिए पूर्णांक 100 हैं।<br><strong id=\"docs-internal-guid-4c69b845-7fff-6d0b-a423-e5468cdf70e5\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXd8KTWbJhpD0_zWsiKTDcQuDyRb_2n4_B4yBTnhHxK7X7F0z1IO3KoUiGkE2SOdQINq3qmp0YmXH0vRgTmIsARuVIYZp24kgMWqFZO7EPKfDmXzdOyBzEX24ePSoRdlfXqiP8GHKQ?key=gBeYw05c6ydkcanuoGO4IaXG\" width=\"155\" height=\"171\"></strong><br>इस छात्र द्वारा प्राप्त किए गए औसत अंक ज्ञात कीजिए।</p>",
                    options_en: ["<p>92.5</p>", "<p>96</p>", 
                                "<p>95</p>", "<p>94.5</p>"],
                    options_hi: ["<p>92.5</p>", "<p>96</p>",
                                "<p>95</p>", "<p>94.5</p>"],
                    solution_en: "<p>71.(d) Average marks scored by the student = <math display=\"inline\"><mfrac><mrow><mn>98</mn><mi>&#160;</mi><mo>+</mo><mi>&#160;</mi><mn>97</mn><mi>&#160;</mi><mo>+</mo><mi>&#160;</mi><mn>93</mn><mi>&#160;</mi><mo>+</mo><mi>&#160;</mi><mn>94</mn><mi>&#160;</mi><mo>+</mo><mi>&#160;</mi><mn>92</mn><mi>&#160;</mi><mo>+</mo><mi>&#160;</mi><mn>93</mn><mi>&#160;</mi></mrow><mrow><mn>6</mn></mrow></mfrac></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>567</mn><mn>6</mn></mfrac></math> = 94.5</p>",
                    solution_hi: "<p>71.(d) छात्र द्वारा प्राप्त औसत अंक = <math display=\"inline\"><mfrac><mrow><mn>98</mn><mi>&#160;</mi><mo>+</mo><mi>&#160;</mi><mn>97</mn><mi>&#160;</mi><mo>+</mo><mi>&#160;</mi><mn>93</mn><mi>&#160;</mi><mo>+</mo><mi>&#160;</mi><mn>94</mn><mi>&#160;</mi><mo>+</mo><mi>&#160;</mi><mn>92</mn><mi>&#160;</mi><mo>+</mo><mi>&#160;</mi><mn>93</mn><mi>&#160;</mi></mrow><mrow><mn>6</mn></mrow></mfrac></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>567</mn><mn>6</mn></mfrac></math> = 94.5</p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "72",
                    section: "17",
                    question_en: "<p>72. Two trains of lengths 150 m and 250 m run on parallel lines. When they run in the same direction, they take 20 seconds to cross each other and, when they run in the opposite direction, they take 5 seconds to cross each other. What is the speed of the two trains?</p>",
                    question_hi: "<p>72. 150 m और 250 m लंबाई की दो रेलगाड़ियाँ समानांतर लाइनों पर चलती हैं। जब वे एक ही दिशा में चलती हैं, तो वे एक-दूसरे को पार करने में 20 सेकंड का समय लेती हैं और जब वे विपरीत दिशा में चलती हैं, तो वे एक-दूसरे को पार करने में 5 सेकंड का समय लेती हैं। दोनों रेलगाड़ियों की चाल क्या है?</p>",
                    options_en: ["<p>150 km/h and 105 km/h</p>", "<p>150 km/h and 250 km/h</p>", 
                                "<p>180 km/h and 108 km/h</p>", "<p>160 km/h and 106 km/h</p>"],
                    options_hi: ["<p>150 km/h और 105 km/h</p>", "<p>150 km/h और 250 km/h</p>",
                                "<p>180 km/h और 108 km/h</p>", "<p>160 km/h और 106 km/h</p>"],
                    solution_en: "<p>72.(c) Let speed of trains = x&nbsp;m/s and y m/s<br>Relative speed , when they run in the same direction = x&nbsp;- y <br>ATQ, <br><math display=\"inline\"><mo>&#8658;</mo></math> x - y = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>150</mn><mo>+</mo><mn>250</mn></mrow><mn>20</mn></mfrac></math> = 20m/s &hellip;.(i)<br>Relative speed , when they run in the opposite direction = x&nbsp;+ y <br><math display=\"inline\"><mo>&#8658;</mo></math> x + y = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>150</mn><mo>+</mo><mn>250</mn></mrow><mn>5</mn></mfrac></math> = 80m/s &hellip;.(ii)<br>After solving (i) and (ii) we get , <br>x = 50m/s or 50 &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>18</mn><mn>5</mn></mfrac></math> = 180km/h<br>y = 30 m/s or 30 &times; <math display=\"inline\"><mfrac><mrow><mn>18</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math> = 108km/h</p>",
                    solution_hi: "<p>72.(c) माना ट्रेन की गति = x&nbsp;m/s और y m/s<br>सापेक्ष गति, जब वे एक ही दिशा में चलती हैं = x&nbsp;- y <br>प्रश्न के अनुसार , <br><math display=\"inline\"><mo>&#8658;</mo></math> x - y = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>150</mn><mo>+</mo><mn>250</mn></mrow><mn>20</mn></mfrac></math> = 20m/s &hellip;.(i)<br>सापेक्ष गति, जब वे विपरीत दिशा में चलती हैं = x&nbsp;+ y<br><math display=\"inline\"><mo>&#8658;</mo></math> x + y = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>150</mn><mo>+</mo><mn>250</mn></mrow><mn>5</mn></mfrac></math> = 80m/s &hellip;.(ii)<br>(i) और (ii) को हल करने के बाद हमें मिलता है,<br>x = 50m/s or 50 &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>18</mn><mn>5</mn></mfrac></math> = 180km/h<br>y = 30 m/s or 30 &times; <math display=\"inline\"><mfrac><mrow><mn>18</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math> = 108km/h</p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "73",
                    section: "17",
                    question_en: "<p>73. Each of Ravi and Kavita had some marbles. Kavita had 12 more marbles than Ravi had. If each of them had one more marble, then three times the number of marbles Kavita would then have had would have been equal to four times the number of marbles Ravi would then have had. How many marbles did Kavita actually have?</p>",
                    question_hi: "<p>73. रवि और कविता में से प्रत्येक के पास कुछ कंचे थे। कविता के पास रवि से 12 कंचे अधिक थे। यदि उनमें से प्रत्येक के पास एक कंचा अधिक होता, तो तब कविता के पास मौजूद कंचों की संख्&zwj;या का तीन गुना, तब रवि के पास मौजूद कंचों की संख्या के चार गुने के बराबर होते। कविता के पास वास्तव में कितने कंचे थे?</p>",
                    options_en: ["<p>43</p>", "<p>47</p>", 
                                "<p>51</p>", "<p>48</p>"],
                    options_hi: ["<p>43</p>", "<p>47</p>",
                                "<p>51</p>", "<p>48</p>"],
                    solution_en: "<p>73.(b) Let number of marbles Ravi had = x<br>Number of Marbles Kavita had = x&nbsp;+ 12<br>According to question , <br><math display=\"inline\"><mo>&#8658;</mo><mi>&#160;</mi></math>3(x + 13 ) = 4 (x + 1 )<br><math display=\"inline\"><mo>&#8658;</mo></math> 3x + 39 = 4x + 4<br><math display=\"inline\"><mo>&#8658;</mo></math> x = 35 <br>&there4; Number of Marbles Kavita had (x&nbsp;+ 12 ) = 35 + 12 = 47</p>",
                    solution_hi: "<p>73.(b) मान लीजिए कि रवि के पास कंचों की संख्या = x<br>कविता के पास कंचों की संख्या = x&nbsp;+ 12<br>प्रश्न के अनुसार, <br><math display=\"inline\"><mo>&#8658;</mo><mi>&#160;</mi></math>3(x + 13 ) = 4 (x + 1 )<br><math display=\"inline\"><mo>&#8658;</mo></math> 3x + 39 = 4x + 4<br><math display=\"inline\"><mo>&#8658;</mo></math> x = 35 <br>&there4; कविता के पास कंचों की संख्या (x&nbsp;+ 12 ) = 35 + 12 = 47</p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "74",
                    section: "17",
                    question_en: "<p>74. 15 kg of ₹10 per kg wheat is mixed with 5 kg of another type of wheat to get a mixture costing ₹30 per kg. Find the price (per kg) of the costlier wheat.</p>",
                    question_hi: "<p>74. ₹10 प्रति kg मूल्&zwj;य वाले 15 kg गेहूँ को 5 kg दूसरे प्रकार के गेहूँ के साथ मिलाकर ₹30 प्रति kg मूल्&zwj;य वाला मिश्रण प्राप्त किया जाता है। महँगे गेहूँ का मूल्&zwj;य (प्रति kg) ज्ञात करें।</p>",
                    options_en: ["<p>₹70</p>", "<p>₹80</p>", 
                                "<p>₹60</p>", "<p>₹90</p>"],
                    options_hi: ["<p>₹70</p>", "<p>₹80</p>",
                                "<p>₹60</p>", "<p>₹90</p>"],
                    solution_en: "<p>74.(d) Let second type wheat ₹x&nbsp;per kg<br>15 &times; 10 + x&nbsp;&times; 5 = 30 &times; 20<br>150 + 5x&nbsp;= 600<br>5x&nbsp;= 450 <br>x = ₹90</p>",
                    solution_hi: "<p>74.(d) दूसरे प्रकार के गेहूँ का मूल्य = ₹x&nbsp;प्रति kg<br>15 &times; 10 + x&nbsp;&times; 5 = 30 &times; 20<br>150 + 5x&nbsp;= 600<br>5x&nbsp;= 450 <br>x = ₹90</p>",
                    correct: "d",

                questions.push({
                    id: "75",
                    section: "7",

                    options_en: ["<p>disapproved</p>", "<p>ceaseless</p>", 
                                "<p>inessential</p>", "<p>required</p>"],
                    options_hi: ["<p>disapproved</p>", "<p>ceaseless</p>",

                    solution_en: "<p>100.(d) required<br>&lsquo;Required&rsquo; means necessary for a particular purpose. The given passage states that Many parents across the United States, like Cruz Banks, may assume that free, full-day kindergarten is a required part of the country&rsquo;s public education system. Hence, &lsquo;required&rsquo; is the most appropriate answer.</p>",
                    solution_hi: "<p>100.(d) required<br>&lsquo;Required&rsquo; का अर्थ है किसी विशेष उद्देश्य के लिए आवश्यक। दिए गए passage में कहा गया है कि Cruz Banks की तरह United States में कई parents यह मान सकते हैं कि निःशुल्क, पूरे दिन की किंडरगार्टन शिक्षा देश के public education system का एक आवश्यक भाग है। अतः, &lsquo;required&rsquo; सबसे उपयुक्त उत्तर है।</p>",
                    correct: "d",

            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
