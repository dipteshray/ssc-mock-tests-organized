                questions.push({
                    id: "61",
                    section: "17",
                    question_en: "<p>61. What i<span style=\"font-family: Cambria Math;\">s the greatest four-digit number which on being divided by 6, 7 and 8 leaves 4, 5 and 6 as remainders, respectively?</span></p>",
                    question_hi: "<p>61. <span style=\"font-family: Nirmala UI;\">चार</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">अंकों</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">की</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">वह</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">सबसे</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">बड़ी</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">संख्या</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">कौन</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">सी</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">है</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">जिसे</span><span style=\"font-family: Cambria Math;\"> 6, 7 </span><span style=\"font-family: Nirmala UI;\">और</span><span style=\"font-family: Cambria Math;\"> 8 </span><span style=\"font-family: Nirmala UI;\">से</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">विभाजित</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">करने</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">पर</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">क्रमशः</span><span style=\"font-family: Cambria Math;\"> 4, 5 </span><span style=\"font-family: Nirmala UI;\">और</span><span style=\"font-family: Cambria Math;\"> 6 </span><span style=\"font-family: Nirmala UI;\">शेष</span><span style=\"font-family: Cambria Math;\"> बचते&nbsp; </span><span style=\"font-family: Nirmala UI;\">हैं</span><span style=\"font-family: Cambria Math;\">?</span></p>",
                    options_en: ["<p>9910</p>", "<p>9920</p>", 
                                "<p>9921</p>", "<p>9912</p>"],
                    options_hi: ["<p>9910</p>", "<p>9920</p>",
                                "<p>9921</p>", "<p>9912</p>"],
                    solution_en: "<p>61.(a)<br><span style=\"font-family: Cambria Math;\">LCM (6, 7 and 8) = 168</span><br>(6 &ndash; 4) = (7 &ndash; 5) = (8 &ndash; 6) = 2<br><span style=\"font-family: Cambria Math;\">Required number = 168k &ndash; 2</span><br><span style=\"font-family: Cambria Math;\">For</span><span style=\"font-family: Cambria Math;\"> k = 59 we have required number = 9910</span></p>",
                    solution_hi: "<p>61.(a)<br><span style=\"font-family: Cambria Math;\">LCM (6, 7 </span><span style=\"font-family: Nirmala UI;\">और</span><span style=\"font-family: Cambria Math;\"> 8) = 168</span><br>(6 &ndash; 4) = (7 &ndash; 5) = (8 &ndash; 6) = 2<br><span style=\"font-family: Nirmala UI;\">आवश्यक</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">संख्या</span><span style=\"font-family: Cambria Math;\"> = 168k &ndash; 2</span><br><span style=\"font-family: Cambria Math;\">k = 59 </span><span style=\"font-family: Nirmala UI;\">के</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">लिए</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">हमारे</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">पास</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">अपेक्षित</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">संख्या</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">है</span><span style=\"font-family: Cambria Math;\"> = 9910</span></p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({

 UI;\">मीटर</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">में</span><span style=\"font-family: Cambria Math;\">) </span><span style=\"font-family: Nirmala UI;\">क्या</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">है</span><span style=\"font-family: Cambria Math;\">?</span></p>",
                    options_en: ["<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mstyle mathsize=\"18px\"><mfrac><mn>25</mn><mn>3</mn></mfrac><mo>(</mo><mn>3</mn><mo>-</mo><mo>&#8730;</mo><mn>3</mn><mo>)</mo></mstyle></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn mathsize=\"18px\">75</mn><mn mathsize=\"18px\">3</mn></mfrac><mo mathsize=\"18px\">(</mo><mn mathsize=\"18px\">3</mn><mo mathsize=\"18px\">-</mo><mo mathsize=\"18px\">&#8730;</mo><mn mathsize=\"18px\">3</mn><mo mathsize=\"18px\">)</mo></math></p>",

                    options_hi: ["<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn mathsize=\"18px\">25</mn><mn mathsize=\"18px\">3</mn></mfrac><mo mathsize=\"18px\">(</mo><mn mathsize=\"18px\">3</mn><mo mathsize=\"18px\">-</mo><mo mathsize=\"18px\">&#8730;</mo><mn mathsize=\"18px\">3</mn><mo mathsize=\"18px\">)</mo></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn mathsize=\"18px\">75</mn><mn mathsize=\"18px\">3</mn></mfrac><mo mathsize=\"18px\">(</mo><mn mathsize=\"18px\">3</mn><mo mathsize=\"18px\">-</mo><mo mathsize=\"18px\">&#8730;</mo><mn mathsize=\"18px\">3</mn><mo mathsize=\"18px\">)</mo></math></p>",

                    solution_en: "<p>62.(d)<br><span style=\"font-family: Cambria Math;\">Let the height of the building be AB and that of the poster be BC.</span><br><span style=\"font-family: Cambria Math;\">&ldquo;P&rdquo; be the position of the standing person.</span><br><span style=\"font-family: Cambria Math;\">By, using</span><span style=\"font-family: Cambria Math;\"> the right angled triangle ratio we get the following figure.</span><br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1653882522/word/media/image46.png\" width=\"220\" height=\"168\"><br><span style=\"font-family: Cambria Math;\">According To Question,</span><br><math style=\"font-family: Verdana;\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mi>units</mi><mo>&#160;</mo><mo>&#8212;</mo><mo>&#160;</mo><mn>50</mn><mo>&#160;</mo><mo>&#160;</mo></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mo>&#8211;</mo><mo>&#160;</mo><mn>1</mn><mo>&#160;</mo><mi>units</mi><mo>&#160;</mo><mo>&#8212;</mo><mo>&#160;</mo><mfrac><mn>50</mn><msqrt><mn>3</mn></msqrt></mfrac><mo>&#215;</mo><mo>(</mo><mo>&#160;</mo><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mo>&#8211;</mo><mo>&#160;</mo><mn>1</mn><mo>)</mo></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>50</mn><msqrt><mn>3</mn></msqrt></mfrac><mo>&#215;</mo><mo>(</mo><mo>&#160;</mo><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mo>&#8211;</mo><mo>&#160;</mo><mn>1</mn><mo>)</mo><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mfrac><msqrt><mn>3</mn></msqrt><msqrt><mn>3</mn></msqrt></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>50</mn><mn>3</mn></mfrac><mo>&#160;</mo><mo>(</mo><mo>&#160;</mo><mn>3</mn><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mo>)</mo></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>%</mo><mo>&#160;</mo><mi>of</mi><mo>&#160;</mo><mi>the</mi><m ><mn>1</mn><mo>)</mo><mo>&#160;</mo><mo>&#160;</mo></math></span><br><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>50</mn><msqrt><mn>3</mn></msqrt></mfrac><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mo>(</mo><mo>&#160;</mo><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mo>&#8211;</mo><mo>&#160;</mo><mn>1</mn><mo>)</mo><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mfrac><msqrt><mn>3</mn></msqrt><msqrt><mn>3</mn></msqrt></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>50</mn><mn>3</mn></mfrac><mo>&#160;</mo><mo>(</mo><mo>&#160;</mo><mn>3</mn><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mo>)</mo></math></span><br><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mi>&#2346;&#2379;&#2360;&#2381;&#2335;&#2352;</mi><mo>&#160;</mo><mi>&#2325;&#2366;</mi><mo>&#160;</mo><mo>&#160;</mo><mn>200</mn><mo>%</mo><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>100</mn><mn>3</mn></mfrac><mo>&#160;</mo><mo>(</mo><mo>&#160;</mo><mn>3</mn><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mo>)</mo><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>.</mo></math></span></p>",

                questions.push({
                    id: "63",
                    section: "17",
                    question_en: "<p>63. The ratio of profit of P and Q is 5 : 8. What is their investment ratio , if their investment <span style=\"font-family: Cambria Math;\">time period ratio is 3 : 5 ?</span></p>",
                    question_hi: "<p>63. P <span style=\"font-family: Nirmala UI;\">और</span><span style=\"font-family: Cambria Math;\"> Q </span><span style=\"font-family: Nirmala UI;\">के</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">लाभ</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">अनुपात</span><span style=\"font-family: Cambria Math;\"> 5 : 8 </span><span style=\"font-family: Nirmala UI;\">है।</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">उनका</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">निवेश</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">अनुपात</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">क्या</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">है</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Nirmala UI;\">यदि</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">उनका</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">निवेश</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">समय</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">अवधि</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">अनुपात</span><span style=\"font-family: Cambria Math;\"> 3 : 5 </span><span style=\"font-family: Nirmala UI;\">है</span><span style=\"font-family: Cambria Math;\">?</span></p>",
                    options_en: ["<p>13 : 25</p>", "<p>12 : 25</p>", 
                                "<p>24 : 25</p>", "<p>25 : 24</p>"],
                    options_hi: ["<p>13 : 25</p>", "<p>12 : 25</p>",
                                "<p>24 : 25</p>", "<p>25 : 24</p>"],
                    solution_en: "<p>63.(d)<br><span style=\"font-family: Cambria Math;\">Let the investment by P and Q be &ldquo;a&rdquo; and &ldquo;b&rdquo;-</span><br><span style=\"font-family: Cambria Math;\">Profit = Investment &times; Time period</span><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>5</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">b</mi></mrow></mfrac></math> =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>8</mn></mfrac></math><br><span style=\"font-family: Cambria Math;\">a : b = 5 &times; 5 : 3 &times; 8 = 25 : 24.</span></p>",
                    solution_hi: "<p>63.(d)<br>माना P और Q द्वारा किया गया निवेश \"a\" और \"b\" है<br>लाभ = निवेश &times; समय अवधि<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>5</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">b</mi></mrow></mfrac></math>&nbsp;= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>8</mn></mfrac></math><br>a : b = 5 &times; 5 : 3 &times; 8 = 25 : 24.</p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "64",
                    section: "17",
                    question_en: "<p>64. If nine digit number 468x5138y is divisible by 72, then the value of &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>4</mn><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>3</mn><mi mathvariant=\"normal\">y</mi></msqrt></math><span style=\"font-family: Cambria Math;\"> is :</span></p>",
                    question_hi: "<p>64. <span style=\"font-family: Nirmala UI;\">यदि</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">नौ</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">अंकों</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">की</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">संख्या</span><span style=\"font-family: Cambria Math;\"> 468x5138y , 72 </span><span style=\"font-family: Nirmala UI;\">से</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">विभाज्य</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">है</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Nirmala UI;\">तो</span><span style=\"font-family: Cambria Math;\"> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>4</mn><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>3</mn><mi mathvariant=\"normal\">y</mi></msqrt></math></span><span style=\"font-family: Cambria Math;\">&nbsp;</span><span style=\"font-family: Nirmala UI;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">मान</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">क्या</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">है</span><span style=\"font-family: Cambria Math;\">?</span></p>",
                    options_en: ["<p>8</p>", "<p>9</p>", 
                                "<p>12</p>", "<p>6</p>"],
                    options_hi: ["<p>8</p>", "<p>9</p>",
                                "<p>12</p>", "<p>6</p>"],
                    solution_en: "<p>64.(d)<br><span style=\"font-family: Cambria Math;\">Given, 468x5138y is divisible by 72.</span><br><span style=\"font-family: Cambria Math;\">72 = 8 &times; 9, so it must be divisible by both 8 and 9.</span><br><span style=\"font-family: Cambria Math;\">For 468x5138y to be divisible by</span><span style=\"font-family: Cambria Math;\"> 8, we must have last 3 digits i.e. 38y be divisible by 8</span><br><span style=\"font-family: Cambria Math;\">y = 4,</span><br><span style=\"font-family: Cambria Math;\">Sum of digits = 4 + 6 + 8 + x + 5 + 1 + 3 + 8 + y = 35 + x + y</span><br><span style=\"font-family: Cambria Math;\">35 + x + 4 = 39 + x</span><br><span style=\"font-family: Cambria Math;\">39 + x = 45</span><br><span style=\"font-family: Cambria Math;\">x = 6</span><br><math style=\"font-family:Verdana\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>4</mn><mo>&#215;</mo><mn>6</mn><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>3</mn><mo>&#215;</mo><mn>4</mn></msqrt></math><br>=&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>4</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>6</mn><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>3</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>4</mn></msqrt></math><br>= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>24</mn><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>12</mn></msqrt></math><br>= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>36</mn></msqrt></math><br>= 6</p>",
                    solution_hi: "<p>64.(d)<br><span style=\"font-family: Nirmala UI;\">दिया</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">गया</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">है</span><span style=\"font-family: Cambria Math;\">, 468x5138y, 72 </span><span style=\"font-family: Nirmala UI;\">से</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">विभाज्य</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">है।</span><br><span style=\"font-family: Cambria Math;\">72 = 8 &times; 9, </span><span style=\"font-family: Nirmala UI;\">इसलिए</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">इसे</span><span style=\"font-family: Cambria Math;\"> 8 </span><span style=\"font-family: Nirmala UI;\">और</span><span style=\"font-family: Cambria Math;\"> 9 </span><span style=\"font-family: Nirmala UI;\">दोनों</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">से</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">विभाज्य</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">होना</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">चाहिए।</span><br><span style=\"font-family: Cambria Math;\">468x5138y </span><span style=\"font-family: Nirmala UI;\">को</span><span style=\"font-family: Cambria Math;\"> 8 </span><span style=\"font-family: Nirmala UI;\">से</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">विभाज्य</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">होने</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">के</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">लिए</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Nirmala UI;\">हमारे</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">पास</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">अंतिम</span><span style=\"font-family: Cambria Math;\"> 3 </span><span style=\"font-family: Nirmala UI;\">अंक</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">होने</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">चाहिए</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">यानी</span><span style=\"font-family: Cambria Math;\"> 38y, 8 </span><span style=\"font-family: Nirmala UI;\">से</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">विभाज्य</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">होना</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">चाहिए।</span><br><span style=\"font-family: Cambria Math;\">y = 4,</span><br><span style=\"font-family: Nirmala UI;\">अंकों</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">योग</span><span style=\"font-family: Cambria Math;\"> = 4 + 6 + 8 + x + 5 + 1 + 3 + 8 + y = 35 + x + y</span><br><span style=\"font-family: Cambria Math;\">35 + x + 4 = 39 + x</span><br><span style=\"font-family: Cambria Math;\">39 + x = 45</span><br><span style=\"font-family: Cambria Math;\">x = 6</span><br><math style=\"font-family:Verdana\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>4</mn><mo>&#215;</mo><mn>6</mn><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>3</mn><mo>&#215;</mo><mn>4</mn></msqrt></math><br>=&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>4</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>6</mn><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>3</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>4</mn></msqrt></math><br>= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>24</mn><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>12</mn></msqrt></math><br>= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>36</mn></msqrt></math><br>= 6</p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "65",
                    section: "17",

        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
