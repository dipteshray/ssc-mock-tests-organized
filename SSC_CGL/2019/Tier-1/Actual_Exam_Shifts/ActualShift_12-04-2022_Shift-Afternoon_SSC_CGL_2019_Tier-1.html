                questions.push({
                    id: "64",
                    section: "17",
                    question_en: "<p>64. <span style=\"font-family: Palanquin Dark;\">&nbsp;The breakup of the total number of employees of a company working in different offices ( A to E) , in degrees, is given in a pie chart.</span><br><span style=\"font-family: Palanquin Dark;\">Total number of employees = 2400</span><br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1653547318/word/media/image18.png\" width=\"255\" height=\"244\"><br><span style=\"font-family: Palanquin Dark;\">In which office is the number of employees 600?</span></p>",
                    question_hi: "<p>64. <span style=\"font-family: Palanquin Dark;\">विभिन्न कार्यालयों (ए से ई) में कार्यरत एक कंपनी के कर्मचारियों की कुल संख्या का, डिग्री में, एक पाई चार्ट में दिया गया है।</span><br><span style=\"font-family: Palanquin Dark;\">कर्मचारियों की कुल संख्या = 2400</span><br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1653547318/word/media/image18.png\" width=\"241\" height=\"230\"><br><span style=\"font-family: Palanquin Dark;\">किस कार्यालय में कर्मचारियों की संख्या 600 है?</span></p>",
                    options_en: ["<p>E</p>", "<p>A</p>", 
                                "<p>C</p>", "<p>D</p>"],
                    options_hi: ["<p>E</p>", "<p>A</p>",
                                "<p>C</p>", "<p>D</p>"],
                    solution_en: "<p>64.(d)<br><span style=\"font-family: Palanquin Dark;\">Here, 2400 employees corresponds to 360&deg;.</span><br><span style=\"font-family: Palanquin Dark;\">So, 600 employees = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>360</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>600</mn></mrow><mn>2400</mn></mfrac></math> &nbsp;</span><span style=\"font-family: Palanquin Dark;\">=&nbsp; 90&deg;, which corresponds to office D. </span></p>",
                    solution_hi: "<p>64.(d)<br><span style=\"font-family: Palanquin Dark;\">यहाँ, 2400 कर्मचारी 360&deg; को संदर्भित करता है</span><br><span style=\"font-family: Palanquin Dark;\">इसलिए, 600 कर्मचारी&nbsp; =&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>360</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>600</mn></mrow><mn>2400</mn></mfrac></math></span><span style=\"font-family: Palanquin Dark;\">&nbsp; =&nbsp; 90&deg;, जो कार्यालय D को संदर्भित करता है</span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "65",
                    section: "17",

                    question_en: "<p>69. A <span style=\"font-family: Arial Unicode MS;\">and B started their journeys from X to Y and Y to X , respectively. After crossing each other, A and B completed remaining parts of their journeys in 6<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>8</mn></mfrac></math></span><span style=\"font-family: Arial Unicode MS;\"> hours and 8 hours, respectively. If the speed of A is 32 km/h then the speed , in km/h of B is:</span></p>",
                    question_hi: "<p>69. <span style=\"font-family: Palanquin Dark;\"> A और B ने क्रमशः X से Y और Y&nbsp; से&nbsp; X&nbsp; तक अपनी यात्रा शुरू की। एक दूसरे को पार करने के बाद, A और B ने अपनी यात्रा के शेष हिस्सों को क्रमशः 6<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>8</mn></mfrac></math></span><span style=\"font-family: Palanquin Dark;\"> घंटे और 8 घंटे में पूरा किया। यदि A की गति 32 km/h है, तो B की km/h में गति क्या है?</span></p>",
                    options_en: ["<p>21</p>", "<p>28</p>",

                    options_hi: ["<p>21</p>", "<p>28</p>",
                                "<p>30</p>", "<p>25</p>"],
                    solution_en: "<p>69.(b)<br><span style=\"font-family: Palanquin Dark;\">According to the question,</span><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>speed</mi><mo>&#160;</mo><mi>of</mi><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></mrow><mrow><mi>Speed</mi><mo>&#160;</mo><mi>of</mi><mo>&#160;</mo><mi mathvariant=\"normal\">B</mi></mrow></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><msqrt><mi>time</mi><mo>&#160;</mo><mi>taken</mi><mo>&#160;</mo><mi>by</mi><mo>&#160;</mo><mi mathvariant=\"normal\">B</mi><mo>&#160;</mo><mi>after</mi><mo>&#160;</mo><mi>crossing</mi></msqrt><msqrt><mi>time</mi><mo>&#160;</mo><mi>taken</mi><mo>&#160;</mo><mi>by</mi><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi><mo>&#160;</mo><mi>after</mi><mo>&#160;</mo><mi>crossing</mi></msqrt></mfrac></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>32</mn><mrow><mi mathvariant=\"normal\">B</mi><mo>\'</mo><mi mathvariant=\"normal\">s</mi><mo>&#160;</mo><mi>speed</mi></mrow></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><msqrt><mn>8</mn></msqrt><msqrt><mstyle displaystyle=\"true\"><mfrac><mn>49</mn><mn>8</mn></mfrac></mstyle></msqrt></mfrac></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>32</mn><mrow><mi mathvariant=\"normal\">B</mi><mo>\'</mo><mi mathvariant=\"normal\">s</mi><mo>&#160;</mo><mi>speed</mi></mrow></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>8</mn><mn>7</mn></mfrac></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>\'</mo><mi mathvariant=\"normal\">s</mi><mo>&#160;</mo><mi>speed</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>28</mn><mo>&#160;</mo><mi>km</mi><mo>/</mo><mi mathvariant=\"normal\">h</mi></math></p>",
                    solution_hi: "<p>69.(b)<br><span style=\"font-family: Palanquin Dark;\">प्रश्न के अनुसार,</span><br><math style=\"font-family:Verdana\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"normal\">A</mi><mo>&#160;</mo><mi>&#2325;&#2368;</mi><mo>&#160;</mo><mo>&#160;</mo><mi>&#2327;&#2340;&#2367;</mi></mrow><mrow><mi mathvariant=\"normal\">B</mi><mo>&#160;</mo><mi>&#2325;&#2368;</mi><mo>&#160;</mo><mo>&#160;</mo><mi>&#2327;&#2340;&#2367;</mi></mrow></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><msqrt><mi mathvariant=\"normal\">B</mi><mo>&#160;</mo><mi>&#2342;&#2381;&#2357;&#2366;&#2352;&#2366;</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>&#2346;&#2366;&#2352;</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>&#2325;&#2352;&#2344;&#2375;</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>&#2325;&#2375;</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>&#2348;&#2366;&#2342;</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>&#2354;&#2367;&#2351;&#2366;</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>&#2327;&#2351;&#2366;</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>&#2360;&#2350;&#2351;</mi></msqrt><msqrt><mi mathvariant=\"normal\">A</mi><mo>&#160;</mo><mi>&#2342;&#2381;&#2357;&#2366;&#2352;&#2366;</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>&#2346;&#2366;&#2352;</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>&#2325;&#2352;&#2344;&#2375;</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>&#2325;&#2375;</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>&#2348;&#2366;&#2342;</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>&#2354;&#2367;&#2351;&#2366;</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>&#2327;&#2351;&#2366;</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>&#2360;&#2350;&#2351;</mi></msqrt></mfrac></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>32</mn><mrow><mi>B</mi><mo>&#160;</mo><mi>&#2325;&#2368;</mi><mo>&#160;</mo>                     correct: "b",

                questions.push({
                    id: "70",
                    section: "17",
                    question_en: "<p>70.<span style=\"font-family: Palanquin Dark;\"> The following bar chart shows the number of students enrolled in two summer camps A and B from 2014 to 2019. Study the chart carefully and answer the question that follows.</span><br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1653547318/word/media/image7.png\"><br><span style=\"font-family: Palanquin Dark;\">The number of students enrolled in Camp A in 2016 and 2019 together is what percentage of the number of students enrolled in Camp B in 2015 and 2017 together?</span></p>",
                    question_hi: "<p>70. <span style=\"font-family: Palanquin Dark;\">निम्नलिखित बार चार्ट 2014 से 2019 तक दो समर कैंप ए और बी में नामांकित छात्रों की संख्या को दर्शाता है। चार्ट का ध्यानपूर्वक अध्ययन करें और नीचे दिए गए प्रश्न का उत्तर दें।</span><br><strong id=\"docs-internal-guid-583bbfbd-7fff-1e77-6b17-35d6f0a69dc4\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXcfNW2DYTfdg5odmCuj62vw27v_akoQI1HLtCbJ9l8kLh4CADEWeSRuriv6GYuTue3Vwt6TTGPUOlLP2Jz2Rxmz-9h-M1yGWftvNBCYOMG3CaTANsUD98cJN5VVZD0DfuP5w1HqPA?key=KwWHK3TKcnBl--gcYtrQaA\" width=\"398\" height=\"284\"></strong><br><span style=\"font-family: Palanquin Dark;\">2016 और 2019 में एक साथ कैंप A में नामांकित छात्रों की संख्या, 2015 और 2017 में एक साथ कैंप B में नामांकित छात्रों की संख्या का कितना प्रतिशत है?</span></p>",
                    options_en: ["<p>64%</p>", "<p>75%</p>", 
                                "<p>60%</p>", "<p>80%</p>"],
                    options_hi: ["<p>64%</p>", "<p>75%</p>",
                                "<p>60%</p>", "<p>80%</p>"],
                    solution_en: "<p>70.(a)<br><span style=\"font-family: Palanquin Dark;\">Number of students enrolled in Camp A in 2016 and 2019 = 140 + 180 = 320</span><br><span style=\"font-family: Palanquin Dark;\">Number of students enrolled in Camp B in 2015 and 2017 = 240 + 260 = 500</span><br><span style=\"font-family: Palanquin Dark;\">Required percentage&nbsp; =&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>320</mn><mn>500</mn></mfrac><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>100</mn></math></span><span style=\"font-family: Palanquin Dark;\"> &nbsp;</span><span style=\"font-family: Palanquin Dark;\">&nbsp;= 64%</span></p>",
                    solution_hi: "<p>70.(a)<br><span style=\"font-family: Palanquin Dark;\">2016 और 2019 में कैंप A में नामांकित छात्रों की संख्या = 140 + 180 = 320</span><br><span style=\"font-family: Palanquin Dark;\">2015 और 2017 में कैंप B में नामांकित छात्रों की संख्या = 240 + 260 = 500</span><br><span style=\"font-family: Palanquin Dark;\">आवश्यक प्रतिशत&nbsp; =&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>320</mn><mn>500</mn></mfrac><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>100</mn></math> &nbsp; = 64%</span></p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "71",
                    section: "17",
                    question_en: "<p>71. <span style=\"font-family: Arial Unicode MS;\"> A cyclic quadrilateral ABCD is drawn in a circle with centre O. A and C are joined to O. If &ang;ABC = 2p&deg; and &ang;ADC = 3p&deg;, what is the measure (in degrees) of the &ang;AOC reflex?</span></p>",
                    question_hi: "<p>71. <span style=\"font-family: Arial Unicode MS;\"> एक चक्रीय चतुर्भुज ABCD केंद्र O वाले एक वृत्त में बनाया गया है। A और C, O से जुड़े हुए हैं। यदि ABC = 2p<span style=\"font-family: Palanquin Dark;\">&deg;</span> और &ang;ADC = 3p<span style=\"font-family: Palanquin Dark;\">&deg;</span> है, तो &ang;AOC प्रतिवर्त का माप (डिग्री में) क्या है?</span></p>",
                    options_en: ["<p>200&deg;</p>", "<p>245&deg;</p>", 
                                "<p>210&deg;</p>", "<p>216&deg;</p>"],
                    options_hi: ["<p>200<span style=\"font-family: Palanquin Dark;\">&deg;</span></p>", "<p>245<span style=\"font-family: Palanquin Dark;\">&deg;</span></p>",
                                "<p>210<span style=\"font-family: Palanquin Dark;\">&deg;</span></p>", "<p>216<span style=\"font-family: Palanquin Dark;\">&deg;</span></p>"],
                    solution_en: "<p>71<span style=\"font-family: Arial Unicode MS;\">.(d)</span><br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1653547318/word/media/image53.png\"><br><span style=\"font-family: Arial Unicode MS;\">As ABCD is a cyclic quadrilateral,</span><br><span style=\"font-family: Arial Unicode MS;\">&nbsp;&ang;B + &ang;D = 180&deg;</span><br><span style=\"font-family: Arial Unicode MS;\">2p + 3p = 180&deg;</span><br><span style=\"font-family: Arial Unicode MS;\">5p = 180&deg;</span><br><span style=\"font-family: Arial Unicode MS;\">p = 36&deg;</span><br><span style=\"font-family: Arial Unicode MS;\">&ang;ABC = 2p = 72&deg;</span><br><span style=\"font-family: Arial Unicode MS;\">&ang;AOC = 2 &times; </span><span style=\"font-family: Arial Unicode MS;\">72 = 144&deg; (the angle at the centre is double the angle at the circumference.)</span><br><span style=\"font-family: Arial Unicode MS;\">Reflex &ang; </span><span style=\"font-family: Arial Unicode MS;\">AOC = 360&deg; &ndash; 144&deg; = 216&deg;</span></p>",
                    solution_hi: "<p>71.(d)<br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1653547318/word/media/image53.png\"><br><span style=\"font-family: Palanquin Dark;\">चूँकि ABCD एक चक्रीय चतुर्भुज है,</span><br><span style=\"font-family: Palanquin Dark;\">&nbsp;<span style=\"font-family: Arial Unicode MS;\">&ang;B + &ang;D </span>= 180&deg;</span><br><span style=\"font-family: Palanquin Dark;\">2p + 3p = 180&deg;</span><br><span style=\"font-family: Palanquin Dark;\">5p = 180&deg;</span><br><span style=\"font-family: Palanquin Dark;\">p = 36&deg;</span><br><span style=\"font-family: Palanquin Dark;\"><span style=\"font-family: Arial Unicode MS;\">&ang;</span>ABC = 2p = 72&deg;</span><br><span style=\"font-family: Palanquin Dark;\"><span style=\"font-family: Arial Unicode MS;\">&ang;</span>AOC = 2 &times; </span><span style=\"font-family: Palanquin Dark;\">72 = 144&deg; (केंद्र का कोण परिधि के कोण का दोगुना है।)</span><br><span style=\"font-family: Palanquin Dark;\">बृहत् कोण <span style=\"font-family: Arial Unicode MS;\">&ang;</span></span><span style=\"font-family: Palanquin Dark;\">AOC = 360&deg; &ndash; 144&deg; = 216&deg;</span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "72",
                    section: "17",
                    question_en: "<p>72. <span style=\"font-family: Palanquin Dark;\"> If 8A5146B is divisible by 88, then what is the value of B - A ?</span></p>",
                    question_hi: "<p>72. <span style=\"font-family: Palanquin Dark;\"> यदि 8A5146B, 88 से विभाज्य है, तो B-A का मान क्या है?</span></p>",
                    options_en: ["<p>0</p>", "<p>-1</p>", 
                                "<p>1</p>", "<p>2</p>"],
                    options_hi: ["<p>0</p>", "<p>-1</p>",
                                "<p>1</p>", "<p>2</p>"],
                    solution_en: "<p>72.(c)<br><span style=\"font-family: Palanquin Dark;\">For 8A5146B to be divisible by 88, the given expression should be divisible by 8 and 11.</span><br><span style=\"font-family: Palanquin Dark;\">For expression 8A5146B to be divisible by 8, the last three digits must be divisible by 8.</span><br><span style=\"font-family: Palanquin Dark;\">So, last two digits 46B should be such that it should be divisible by 8,</span><br><span style=\"font-family: Palanquin Dark;\">If we take B = 4, then 46B = 464 which is divisible by 8, hence we got B = 4</span><br><span style=\"font-family: Palanquin Dark;\">For 8A5146B to be divisible by 11, either the sum total of odd places must be equals to sum total of even places or the difference between the number at even places and odd places must be divisible by 11.</span><br><span style=\"font-family: Palanquin Dark;\">So, 8 + 5 + 4 + 4 = 21 and A + 1 + 6 = A + 7</span><br><span style=\"font-family: Palanquin Dark;\">Here, if we take A + 7 = 21, then A = 14 which is not possible because A must be single digit number,</span><br><span style=\"font-family: Palanquin Dark;\">so, 21 &ndash; (A + 7) should be such that it is divisible by 11.</span><br><span style=\"font-family: Palanquin Dark;\">If we take A = 3 then 21 &ndash; (A + 7) = 21 &ndash; (3 + 7) = 21 &ndash; 10 = 11, so we got A = 3</span><br><span style=\"font-family: Palanquin Dark;\">Hence, B &ndash; A = 4 &ndash; 3 = 1</span></p>",
                    solution_hi: "<p>72.(c)<br><span style=\"font-family: Palanquin Dark;\">8A5146B के 88 से विभाज्य होने के लिए, दिए गए व्यंजक को 8 और 11 से विभाज्य होना चाहिए।</span><br><span style=\"font-family: Palanquin Dark;\">व्यंजक 8A5146B को 8 से विभाज्य होने के लिए, अंतिम तीन अंक 8 से विभाज्य होने चाहिए।</span><br><span style=\"font-family: Palanquin Dark;\">अत: अंतिम दो अंक 46B ऐसा होना चाहिए कि वह 8 से विभाज्य हो,</span><br><span style=\"font-family: Palanquin Dark;\">यदि हम B = 4 लेते हैं, तो 46B = 464 जो 8 से विभाज्य है, इसलिए हमें B = 4 प्राप्त होता है</span><br><span style=\"font-family: Palanquin Dark;\">8A5146B को 11 से विभाज्य होने के लिए, या तो विषम स्थानों का योग सम स्थानों के योग के बराबर होना चाहिए या सम स्थानों और विषम स्थानों की संख्या के बीच का अंतर 11 से विभाज्य होना चाहिए।</span><br><span style=\"font-family: Palanquin Dark;\">तो, 8 + 5 + 4 + 4 = 21 और A + 1 + 6 = A + 7</span><br><span style=\"font-family: Palanquin Dark;\">यहाँ, यदि हम A + 7 = 21 लेते हैं, तो A = 14 जो संभव नहीं है क्योंकि A एक अंक की संख्या होनी चाहिए,</span><br><span style=\"font-family: Palanquin Dark;\">अतः 21 &ndash; (A + 7) ऐसा होना चाहिए कि वह 11 से विभाज्य हो।</span><br><span style=\"font-family: Palanquin Dark;\">यदि हम A = 3 लेते हैं तो 21 &ndash; (A + 7) = 21 &ndash; (3 + 7) = 21 &ndash; 10 = 11, तो हमें A = 3 मिलता है।</span><br><span style=\"font-family: Palanquin Dark;\">इसलिए, B - A = 4 - 3 = 1</span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "73",
                    section: "17",
                    question_en: "<p>73. <span style=\"font-family: Palanquin Dark;\"> If a + b + c = 6, a</span><sup><span style=\"font-family: Palanquin Dark;\">2</span></sup><span style=\"font-family: Palanquin Dark;\"> + b</span><sup><span style=\"font-family: Palanquin Dark;\">2</span></sup><span style=\"font-family: Palanquin Dark;\"> + c</span><sup><span style=\"font-family: Palanquin Dark;\">2</span></sup><span style=\"font-family: Palanquin Dark;\"> = 32 and a</span><sup><span style=\"font-family: Palanquin Dark;\">3</span></sup><span style=\"font-family: Palanquin Dark;\"> + b</span><sup><span style=\"font-family: Palanquin Dark;\">3</span></sup><span style=\"font-family: Palanquin Dark;\"> + c</span><sup><span style=\"font-family: Palanquin Dark;\">3</span></sup><span style=\"font-family: Palanquin Dark;\"> = 189, then the value of abc - 3 is:</span></p>",
                    question_hi: "<p>73. <span style=\"font-family: Palanquin Dark;\">यदि a + b + c = 6, a</span><sup><span style=\"font-family: Palanquin Dark;\">2</span></sup><span style=\"font-family: Palanquin Dark;\"> + b</span><sup><span style=\"font-family: Palanquin Dark;\">2</span></sup><span style=\"font-family: Palanquin Dark;\"> + c</span><sup><span style=\"font-family: Palanquin Dark;\">2</span></sup><span style=\"font-family: Palanquin Dark;\"> = 32 और a</span><sup><span style=\"font-family: Palanquin Dark;\">3</span></sup><span style=\"font-family: Palanquin Dark;\"> + b</span><sup><span style=\"font-family: Palanquin Dark;\">3</span></sup><span style=\"font-family: Palanquin Dark;\"> + c</span><sup><span style=\"font-family: Palanquin Dark;\">3</span></sup><span style=\"font-family: Palanquin Dark;\"> = 189, तो abc - 3 का मान क्या होगा </span></p>",
                    options_en: ["<p>2</p>", "<p>3</p>", 
                                "<p>1</p>", "<p>0</p>"],

                questions.push({
                    id: "74",
                    section: "17",
                    question_en: "<p>74. <span style=\"font-family: Palanquin Dark;\">&nbsp;The cost price of two articles A and B are in the ratio 4 : 5 . While selling these articles ,the shopkeepers gains 10% on article A and 20% on article B and the difference in their selling price is ₹480. The difference in the cost price (in ₹) of article B and A is ; </span></p>",
                    question_hi: "<p>74.<span style=\"font-family: Palanquin Dark;\"> दो वस्तुओं A और B का क्रय मूल्य 4 : 5 के अनुपात में है। इन वस्तुओं को बेचते समय, दुकानदारों को वस्तु A पर 10% और वस्तु B पर 20% का लाभ होता है और उनके विक्रय मूल्य में अंतर ₹480 है। वस्तु B और A के क्रय मूल्य (₹में) में अंतर क्या है?&nbsp;</span></p>",
                    options_en: ["<p>250</p>", "<p>300</p>", 
                                "<p>400</p>", "<p>350</p>"],
                    options_hi: ["<p>250</p>", "<p>300</p>",
                                "<p>400</p>", "<p>350</p>"],
                    solution_en: "<p>74.(b)<br><span style=\"font-family: Palanquin Dark;\">CP ratio of A and B = 4 : 5</span><br><span style=\"font-family: Palanquin Dark;\">Let CP of A = 4x and CP of B = 5x</span><br><span style=\"font-family: Palanquin Dark;\">According to the question,</span><br><span style=\"font-family: Palanquin Dark;\">5x <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#215;</mo><mo>&#160;</mo><mfrac><mn>120</mn><mn>100</mn></mfrac></math> </span><span style=\"font-family: Palanquin Dark;\"> </span><span style=\"font-family: Palanquin Dark;\"> &ndash; 4x <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#215;</mo><mo>&#160;</mo><mfrac><mn>110</mn><mn>100</mn></mfrac></math> </span><span style=\"font-family: Palanquin Dark;\"> </span><span style=\"font-family: Palanquin Dark;\">&nbsp;= 480</span><br><span style=\"font-family: Palanquin Dark;\">6x &ndash; 4.4x = 480</span><br><span style=\"font-family: Palanquin Dark;\">1.6x = 480</span><br><span style=\"font-family: Palanquin Dark;\">x = 300</span><br><span style=\"font-family: Palanquin Dark;\">Difference in CP of B and A = 5x - 4x = x = </span><span style=\"font-family: Palanquin Dark;\">₹</span><span style=\"font-family: Palanquin Dark;\">300</span></p>",
                    solution_hi: "<p>74.(b)<br><span style=\"font-family: Palanquin Dark;\">CP, A और B का अनुपात = 4 : 5</span><br><span style=\"font-family: Palanquin Dark;\">मान लीजिये A का CP = 4x और B का CP = 5x</span><br><span style=\"font-family: Palanquin Dark;\">प्रश्न के अनुसार,</span><br><span style=\"font-family: Palanquin Dark;\">5x <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#215;</mo><mo>&#160;</mo><mfrac><mn>120</mn><mn>100</mn></mfrac></math> </span><span style=\"font-family: Palanquin Dark;\"> </span><span style=\"font-family: Palanquin Dark;\"> &ndash; 4x <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#215;</mo><mo>&#160;</mo><mfrac><mn>110</mn><mn>100</mn></mfrac></math> </span><span style=\"font-family: Palanquin Dark;\"> </span><span style=\"font-family: Palanquin Dark;\">&nbsp;= 480</span><br><span style=\"font-family: Palanquin Dark;\">6x &ndash; 4.4x = 480</span><br><span style=\"font-family: Palanquin Dark;\">1.6x = 480</span><br><span style=\"font-family: Palanquin Dark;\">x = 300</span><br><span style=\"font-family: Palanquin Dark;\">B और A के CP में अंतर = 5x - 4x = x = </span><span style=\"font-family: Palanquin Dark;\">₹</span><span style=\"font-family: Palanquin Dark;\">300</span></p>",

                    options_hi: ["<p>distinguished</p>", "<p>dishevelled</p>",
                                "<p>disgruntled</p>", "<p>disfigured</p>"],
                    solution_en: "<p>99.(c)&nbsp;disgruntled.&nbsp;<br>&lsquo;Disgruntled&rsquo; means disappointed and annoyed. The given passage states that she became disgruntled when she learned that the university was closed to women. Hence, &lsquo;disgruntled&rsquo; is the most appropriate answer.</p>",
                    solution_hi: "<p>99.(c)&nbsp;disgruntled.&nbsp;<br>&lsquo;Disgruntled&rsquo; का अर्थ है निराश एवं नाराज। दिए गए passage में कहा गया है कि जब उसे पता चला कि university महिलाओं के लिए बंद था, तो वह असंतुष्ट (disgruntled) हो गई। अतः, &lsquo;disgruntled&rsquo; सबसे उपयुक्त उत्तर है।university was closed to women. Hence, &lsquo;disgruntled&rsquo; is the most appropriate answer.</p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "100",
                    section: "misc",
                    question_en: "<p>100. <strong>Cloze Test :-</strong><br><span style=\"font-family: Palanquin Dark;\">Marie was born in 1867 in Warsaw, Poland. At an (96)__________ age, she displayed a brilliant mind and a (97)__________ personality. Her great exuberance for learning (98)___________ her to study further. However, she became (99)____________ when she learned that the university was closed (100)___________ women. Determined to receive a higher education, she joined a French university</span></p>\n<p><span style=\"font-family: Palanquin Dark;\">Select the most appropriate option to fill in blank no. 100.</span></p>",
                    question_hi: "<p>100. <strong>Cloze Test :-</strong><br><span style=\"font-family: Palanquin Dark;\">Marie was born in 1867 in Warsaw, Poland. At an (96)__________ age, she displayed a brilliant mind and a (97)__________ personality. Her great exuberance for learning (98)___________ her to study further. However, she became (99)____________ when she learned that the university was closed (100)___________ women. Determined to receive a higher education, she joined a French university</span></p>\n<p><span style=\"font-family: Palanquin Dark;\">Select the most appropriate option to fill in blank no. 100.</span></p>",
                    options_en: ["<p>at</p>", "<p>from</p>", 
                                "<p>to</p>", "<p>by</p>"],
                    options_hi: ["<p>at</p>", "<p>from</p>",
                                "<p>to</p>", "<p>by</p>"],
                    solution_en: "<p>100.(c)&nbsp;to.<br>The preposition &lsquo;to&rsquo; perfectly fits in the context of the passage. The given passage states that she became disgruntled when she learned that the university was closed to women. Hence, &lsquo;to&rsquo; is the most appropriate answer.<br><br></p>",
                    solution_hi: "<p>100.(c)&nbsp;to.<br>दिए गए passage के context में preposition &lsquo;to&rsquo; perfectly fit बैठता है। दिए गए passage में कहा गया है कि जब उसे पता चला कि university, महिलाओं के लिए बंद था, तो वह असंतुष्ट (disgruntled) हो गई। अतः, &lsquo;to&rsquo; सबसे उपयुक्त उत्तर है।</p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
