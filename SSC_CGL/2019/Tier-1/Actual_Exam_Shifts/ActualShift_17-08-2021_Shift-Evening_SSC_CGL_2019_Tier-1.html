                questions.push({
                    id: "63",
                    section: "17",
                    question_en: "<p>63. <span style=\"font-family: Times New Roman;\">The cost price and the marked price of an item are Rs.720 and Rs.900 respectively. When it is sold at a discount of x%, the profit <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>5</mn><mi mathvariant=\"normal\">x</mi></mrow><mn>3</mn></mfrac></math></span><span style=\"font-family: Times New Roman;\">%. What is the value of x ?</span></p>",
                    question_hi: "<p><span style=\"font-family: Times New Roman;\">63. </span><span style=\"font-family: Baloo;\">एक वस्तु का क्रय मूल्य और अंकित मूल्य क्रमशः</span><span style=\"font-family: Times New Roman;\"> 720 </span><span style=\"font-family: Baloo;\">रुपये और</span><span style=\"font-family: Times New Roman;\"> 900 </span><span style=\"font-family: Baloo;\">रुपये है। जब इसे x% की छूट पर बेचा जाता है, तो लाभ<span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>5</mn><mi mathvariant=\"normal\">x</mi></mrow><mn>3</mn></mfrac></math></span></span><span style=\"font-family: Times New Roman;\">&nbsp;</span><span style=\"font-family: Times New Roman;\">% </span><span style=\"font-family: Baloo;\">होता है।</span><span style=\"font-family: Times New Roman;\"> x </span><span style=\"font-family: Baloo;\">का मूल्य क्या है ?</span></p>",
                    options_en: ["<p>7<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>7</mn></mfrac></math><span style=\"font-family: Times New Roman;\"> </span></p>", "<p>8<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>7</mn></mfrac></math><span style=\"font-family: Times New Roman;\"> </span></p>", 
                                "<p>5<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>7</mn></mfrac></math><span style=\"font-family: Times New Roman;\"> </span></p>", "<p>5<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>7</mn></mfrac></math></p>"],
                    options_hi: ["<p>7<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>7</mn></mfrac></math></p>", "<p>8<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>7</mn></mfrac></math></p>",
                                "<p>5<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>7</mn></mfrac></math></p>", "<p>5<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>7</mn></mfrac></math></p>"],
                    solution_en: "<p>63.(b)<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>720</mn><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mo>(</mo><mfrac><mrow><mn>5</mn><mi mathvariant=\"normal\">x</mi></mrow><mn>3</mn></mfrac><mo>%</mo><mo>&#160;</mo><mi>of</mi><mo>&#160;</mo><mn>720</mn><mo>)</mo><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>900</mn><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">x</mi><mo>%</mo><mo>&#160;</mo><mi>of</mi><mo>&#160;</mo><mn>900</mn><mo>)</mo></math><br>&rArr; 5x% of 240 + (x% of 900) = 180<br><strong id=\"docs-internal-guid-69446ba5-7fff-0e02-f5b8-1aab6bcc409e\">&rArr;</strong> 12x + 9x = 180<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>180</mn><mn>21</mn></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>60</mn><mn>7</mn></mfrac></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>8</mn><mfrac><mn>4</mn><mn>7</mn></mfrac></math></p>",
                    solution_hi: "<p>63.(b)<br><math style=\"font-family:Verdana\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>720</mn><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mo>(</mo><mn>720</mn><mo>&#160;</mo><mi>&#2325;&#2366;</mi><mo>&#160;</mo><mfrac><mrow><mn>5</mn><mi mathvariant=\"normal\">x</mi></mrow><mn>3</mn></mfrac><mo>%</mo><mo>)</mo><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>900</mn><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mo>(</mo><mn>900</mn><mo>&#160;</mo><mi>&#2325;&#2366;</mi><mo>&#160;</mo><mi mathvariant=\"normal\">x</mi><mo>%</mo><mo>)</mo></math><br>&rArr; 5x% of 240 + (x% of 900) = 180<br><strong id=\"docs-internal-guid-69446ba5-7fff-0e02-f5b8-1aab6bcc409e\">&rArr;</strong> 12x + 9x = 180<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>180</mn><mn>21</mn></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>60</mn><mn>7</mn></mfrac></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>8</mn><mfrac><mn>4</mn><mn>7</mn></mfrac></math></p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "64",
                    section: "17",
                    question_en: "<p>64. Points A and B are on a circle with center O. PAM and PBN are tangents to the circle at A and B respectively from a point P outside the circle. Point Q is on the major arc AB such that &ang;QAM = 58&deg; and &ang;QBN = 50&deg;, then find the measure of &ang;APB.</p>",
                    question_hi: "<p>64. बिंदु A और B केंद्र O वाले एक वृत्त पर हैं। PAM और PBN वृत्त के बाहर एक बिंदु P से क्रमशः A और B पर वृत्त की स्पर्श रेखाएँ हैं। बिंदु Q दीर्घ चाप AB पर इस प्रकार है कि&nbsp; &ang;QAM = 58&deg; और &ang;QBN = 50&deg; है, तो APB की माप ज्ञात कीजिए।</p>",
                    options_en: ["<p>30&deg;</p>", "<p>32&deg;</p>", 
                                "<p>36&deg;</p>", "<p>40&deg;</p>"],
                    options_hi: ["<p>30&deg;</p>", "<p>32&deg;</p>",
                                "<p>36&deg;</p>", "<p>40&deg;</p>"],
                    solution_en: "<p>64.(c)<br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1667367479/word/media/image30.png\" width=\"200\" height=\"114\"><br>&ang;QAM = &ang;QBA = 58&deg;<br>&ang;QAN = &ang;QAB = 50&deg;<br>&ang;AQB = 180&deg; - 58&deg; - 50&deg; = 72&deg;<br>&ang;AOB = 2 &times; 72&deg; = 144&deg;<br>&ang;APB = 180&deg; - 144&deg; = 36&deg;</p>",
                    solution_hi: "<p>64.(c)<br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1667367479/word/media/image30.png\" width=\"200\" height=\"114\"><br>&ang;QAM = &ang;QBA = 58&deg;<br>&ang;QAN = &ang;QAB = 50&deg;<br>&ang;AQB = 180&deg; - 58&deg; - 50&deg; = 72&deg;<br>&ang;AOB = 2 &times; 72&deg; = 144&deg;<br>&ang;APB = 180&deg; - 144&deg; = 36&deg;</p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "65",
                    section: "17",
                    question_en: "<p>65. <span style=\"font-family: Times New Roman;\">The marked price of an article is Rs.240. A shopkeeper sells it by allowing 18% discount on its marked price and still gains 23%, what is the cost price (in Rs.) of the article ?</span></p>",
                    question_hi: "<p>65. <span style=\"font-family: Baloo;\">एक वस्तु का अंकित मूल्य 240 रुपये है। एक दुकानदार इसे इसके अंकित मूल्य पर 18% की छूट देकर बेचता है और फिर भी 23% का लाभ प्राप्त करता है, वस्तु का लागत मूल्य (रु में) क्या है?</span></p>",
                    options_en: ["<p>200</p>", "<p>180</p>", 
                                "<p>160</p>", "<p>150</p>"],
                    options_hi: ["<p>200</p>", "<p>180</p>",
                                "<p>160</p>", "<p>150</p>"],
                    solution_en: "<p>65.(c)<br><span style=\"font-family: Times New Roman;\">Selling price =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>240</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mfrac><mn>82</mn><mn>100</mn></mfrac></math></span><span style=\"font-family: Times New Roman;\"> </span><span style=\"font-family: Times New Roman;\">= 196.8</span><br><span style=\"font-family: Times New Roman;\">Cost price =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>196</mn><mo>.</mo><mn>8</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mfrac><mn>100</mn><mn>123</mn></mfrac></math></span><span style=\"font-family: Times New Roman;\"> </span><span style=\"font-family: Times New Roman;\">= 160</span></p>",
                    solution_hi: "<p>65.(c)<br><span style=\"font-family: Baloo;\">विक्रय मूल्य</span><span style=\"font-family: Times New Roman;\"> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>240</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mfrac><mn>82</mn><mn>100</mn></mfrac></math> </span><span style=\"font-family: Times New Roman;\">= 196.8</span><br><span style=\"font-family: Baloo;\">लागत मूल्य</span><span style=\"font-family: Times New Roman;\"> =<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>196</mn><mo>.</mo><mn>8</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mfrac><mn>100</mn><mn>123</mn></mfrac></math>&nbsp;</span><span style=\"font-family: Times New Roman;\">= 160</span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "66",
                    section: "17",
                    question_en: "<p>66. <span style=\"font-family: Times New Roman;\">If x<sup>2</sup> + 9y<sup>2</sup> + 4z<sup>2</sup> = 12(x - 2y + 2z) - 88</span><span style=\"font-family: Times New Roman;\">, then the value of (x - 3y + z) is:</span></p>",
                    question_hi: "<p><span style=\"font-family: Times New Roman;\">66. </span><span style=\"font-family: Baloo;\">यदि</span><span style=\"font-family: Times New Roman;\"> x<sup>2</sup> + 9y<sup>2</sup> + 4z<sup>2</sup> = 12(x - 2y + 2z) - 88</span><span style=\"font-family: Times New Roman;\">, </span><span style=\"font-family: Baloo;\">तो</span><span style=\"font-family: Times New Roman;\"> (x - 3y+ z) </span><span style=\"font-family: Baloo;\">का मान है:</span></p>",
                    options_en: ["<p>10<span style=\"font-family: Times New Roman;\"> </span></p>", "<p>13</p>", 
                                "<p>11</p>", "<p>5</p>"],
                    options_hi: ["<p>10<span style=\"font-family: Times New Roman;\"> </span></p>", "<p>13<span style=\"font-family: Times New Roman;\"> </span></p>",
                                "<p>11</p>", "<p>5</p>\n<p><span style=\"font-family: Times New Roman;\"> </span></p>"],
                    solution_en: "<p>66.(b)<br><span style=\"font-family: Times New Roman;\">x&sup2; + 9y&sup2; + 4z&sup2; = 12(x - 2y + 2z) - 88</span><br><span style=\"font-family: Times New Roman;\">&rArr; x&sup2; - 12x + 9y&sup2; + 24y + 4z&sup2; - 24z + 88 = 0</span><br><span style=\"font-family: Times New Roman;\">&rArr; x&sup2; - 12x + 36 + 9y&sup2; + 24y + 16 + 4z&sup2; - 24z + 36 = 0</span><br><span style=\"font-family: Times New Roman;\">&rArr; (x - 6)&sup2;</span>&nbsp;+ (3y + 4)&sup2; + (2z - 6)&sup2; = 0<br><span style=\"font-family: Times New Roman;\">x = 6, y = -<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>3</mn></mfrac></math>, z = 3</span><br>(x - 3y + z) = (6 + 4 + 3) = 13</p>",
                    solution_hi: "<p>66.(b)<br><span style=\"font-family: Times New Roman;\">x&sup2; + 9y&sup2; + 4z&sup2; = 12(x - 2y + 2z) - 88</span><br><span style=\"font-family: Times New Roman;\">x&sup2; - 12x + 9y&sup2; + 24y + 4z&sup2; - 24z + 88 = 0</span><br><span style=\"font-family: Times New Roman;\">x&sup2; - 12x + 36 + 9y&sup2; + 24y + 16 + 4z&sup2; - 24z + 36 = 0</span><br><span style=\"font-family: Times New Roman;\">(x - 6)&sup2;</span> + (3y + 4)&sup2; + (2z - 6)&sup2; = 0<br><span style=\"font-family: Times New Roman;\">x = 6, y = -<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>3</mn></mfrac></math>, z = 3</span><br>(x - 3y + z) = (6 + 4 + 3) = 13</p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "67",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Times New Roman;\">67.</span><span style=\"font-family: Times New Roman;\"> The average score of 40 students in a class test is 45. Later on, it was found that at two places 25 was read as 35 and at one place 38 was read as 32. What is the actual average score of the class?</span></p>",
                    question_hi: "<p>67.<span style=\"font-family: Baloo;\"> एक कक्षा परीक्षा में 40 छात्रों का औसत अंक 45 है। बाद में, यह पाया गया कि दो स्थानों पर 25 को 35 और एक स्थान पर 38 को 32 के रूप में पढ़ा गया था। कक्षा का वास्तविक औसत अंक क्या है?</span></p>",
                    options_en: ["<p>45.35</p>", "<p>39.69</p>", 
                                "<p>44.65</p>", "<p>43.80</p>"],
                    options_hi: ["<p>45.35</p>", "<p>39.69</p>",
                                "<p>44.65</p>", "<p>43.80</p>"],
                    solution_en: "<p><span style=\"font-family: Times New Roman;\">67.(c) </span><span style=\"font-family: Times New Roman;\">Sum of score = 45 &times; 40 = 1800</span><br><span style=\"font-family: Times New Roman;\">Actual score =&nbsp;<span style=\"font-family: Baloo;\">1800 + (25 - 35) + (25 - 35) + (38 - 32)</span> = 1786</span><br><span style=\"font-family: Times New Roman;\">Required Average = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1786</mn><mn>40</mn></mfrac></math> = </span><span style=\"font-family: Times New Roman;\">44.6</span></p>",
                    solution_hi: "<p>67.(c) <span style=\"font-family: Baloo;\">स्कोर का योग = 45 &times; 40 = 1800</span><br><span style=\"font-family: Baloo;\">वास्तविक स्कोर = 1800 + (25 - 35) + (25 - 35) + (38 - 32) = 1786</span><br><span style=\"font-family: Baloo;\">आवश्यक औसत = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1786</mn><mn>40</mn></mfrac></math></span><span style=\"font-family: Times New Roman;\"> = 44.6</span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "68",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Times New Roman;\">68. </span><span style=\"font-family: Times New Roman;\">A man borrowed a certain sum and agrees to repay it by paying Rs.4000 at the end of first year and Rs.7700 at the end of second year. If the rate of compound interest compounded annually is 10% per annum, then find the sum (in Rs.) borrowed?</span></p>",
                    question_hi: "<p><span style=\"font-family: Times New Roman;\">68.</span><span style=\"font-family: Times New Roman;\"> </span><span style=\"font-family: Baloo;\">एक व्यक्ति ने एक निश्चित राशि उधार ली और पहले वर्ष के अंत में 4000 रुपये और दूसरे वर्ष के अंत में 7700 रुपये का भुगतान करके इसे चुकाने के लिए सहमत हो गया। यदि वार्षिक रूप से संयोजित चक्रवृद्धि ब्याज की दर 10% प्रति वर्ष है, तो उधार ली गई राशि (रुपये में) ज्ञात कीजिए?</span></p>",
                    options_en: ["<p>11500</p>", "<p>11000</p>", 
                                "<p>9000</p>", "<p>10,000</p>"],
                    options_hi: ["<p>11500</p>", "<p>11000</p>",
                                "<p>9000</p>", "<p>10,000</p>"],
                    solution_en: "<p>68.(d) <span style=\"font-family: Times New Roman;\">Let the principal borrowed = 100x</span><br><span style=\"font-family: Times New Roman;\">Amount after 1 year = 110x</span><br><span style=\"font-family: Times New Roman;\">After paying amount = 110x - 4000</span><br><span style=\"font-family: Times New Roman;\">Amount after 2<sup>nd</sup></span><span style=\"font-family: Times New Roman;\"> year = (110x - 4000) + 11x - 400</span><br><span style=\"font-family: Times New Roman;\">110x - 4000 + 11x - 400 = 7700</span><br><span style=\"font-family: Times New Roman;\">121x - 4400 = 7700</span><br><span style=\"font-family: Times New Roman;\">121x = 12100</span><br><span style=\"font-family: Times New Roman;\">x = 100 so, Amount = 10,000</span></p>",

                    solution_en: "<p>72.(c) <span style=\"font-family: Times New Roman;\">7cos&sup2;&theta; </span><span style=\"font-family: Times New Roman;\">+ 5sin&sup2;&theta; </span><span style=\"font-family: Times New Roman;\">- 6 = 0</span><br><span style=\"font-family: Times New Roman;\">7(1 - sin&sup2;&theta;</span><span style=\"font-family: Times New Roman;\">) + 5sin&sup2;&theta; </span><span style=\"font-family: Times New Roman;\">- 6 = 0</span><br><span style=\"font-family: Times New Roman;\">7 - 7sin&sup2;&theta; </span><span style=\"font-family: Times New Roman;\">+ 5sin&sup2;&theta; </span><span style=\"font-family: Times New Roman;\">- 6 = 0</span><br><span style=\"font-family: Times New Roman;\">2sin&sup2;&theta; </span><span style=\"font-family: Times New Roman;\">= 1</span><br><span style=\"font-family: Times New Roman;\">&theta; = 45&deg;</span><br><span style=\"font-family: Times New Roman;\">= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><mi>cosec&#952;</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mi>tan&#952;</mi></mrow><mrow><mi>sec&#952;</mi><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mi>cot&#952;</mi></mrow></mfrac></msqrt></math> </span><br><span style=\"font-family: Times New Roman;\">= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><mi>cosec</mi><msup><mn>45</mn><mo>&#8728;</mo></msup><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mi>tan</mi><msup><mn>45</mn><mo>&#8728;</mo></msup></mrow><mrow><mi>sec</mi><msup><mn>45</mn><mo>&#8728;</mo></msup><mo>-</mo><mo>&#160;</mo><mi>cot</mi><msup><mn>45</mn><mo>&#8728;</mo></msup></mrow></mfrac></msqrt></math> </span><span style=\"font-family: Gungsuh;\">= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><mo>&#8730;</mo><mn>2</mn><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>1</mn></mrow><mrow><mo>&#8730;</mo><mn>2</mn><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mn>1</mn></mrow></mfrac></msqrt></math> =&nbsp;</span><math xmlns=\"http://ww                     question_en: "<p><span style=\"font-family: Times New Roman;\">74. </span><span style=\"font-family: Times New Roman;\">The ratio of present ages of A and B is 7 : 8. After 6 years from now, the ratio of their ages will be 8 : 9. If C&rsquo;s present age is 10 years more than the present age of A, then the present age (in years) of C is:</span></p>",
                    question_hi: "<p><span style=\"font-family: Times New Roman;\">74. </span><span style=\"font-family: Baloo;\">A और B की वर्तमान आयु का अनुपात 7 : 8 है। अब से 6 वर्ष बाद, उनकी आयु का अनुपात 8 : 9 होगा। यदि C की वर्तमान आयु A की वर्तमान आयु से 10 वर्ष अधिक है, तो वर्तमान आयु (वर्षों में) C है:</span></p>",
                    options_en: ["<p>56</p>", "<p>52</p>", 
                                "<p>59</p>", "<p>45</p>"],
                    options_hi: ["<p>56</p>", "<p>52</p>",
                                "<p>59</p>", "<p>45</p>"],
                    solution_en: "<p>74.(b)<br><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>7</mn><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>6</mn></mrow><mrow><mn>8</mn><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>6</mn></mrow></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>8</mn><mn>9</mn></mfrac></math></span><br>63x + 54 = 64x + 48<br>x = 6<br>present age of A = 7x = 42<br>Present age of C = 42 + 10 = 52</p>",
                    solution_hi: "<p>74.(b)<br><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>7</mn><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>6</mn></mrow><mrow><mn>8</mn><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>6</mn></mrow></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>8</mn><mn>9</mn></mfrac></math></span><br>63x + 54 = 64x + 48<br>x = 6<br>A की वर्तमान आयु = 7x = 42<br>C की वर्तमान आयु = 42 + 10 = 52<strong id=\"docs-internal-guid-1d166090-7fff-1509-d264-2d6f26fb8924\"></strong></p>",

                questions.push({
                    id: "77",
                    section: "7",
                    question_en: "<p>77. Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the right order to form a meaningful and coherent paragraph.<br><span style=\"font-family: Times New Roman;\">A. In some cases, the problem of the lowering of the river bottom has caused the water table of the surrounding area to drop, which has adversely affected agriculture.&nbsp;</span><br><span style=\"font-family: Times New Roman;\">B. Also, another problem, canalization with its extensive system of locks and navigation dams, often seriously disrupts riverine ecosystems.&nbsp;</span><br><span style=\"font-family: Times New Roman;\">C. The ever-increasing exploitation of rivers has given rise to a variety of problems.&nbsp;</span><br><span style=\"font-family: Times New Roman;\">D. Further, extensive commercial navigation of rivers has resulted in much artificial improvement of natural channels, including increasing the depth of the channels to permit passage of larger vessels.&nbsp;</span></p>",
                    question_hi: "<p>77. Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the right order to form a meaningful and coherent paragraph.<br><span style=\"font-family: Times New Roman;\">A. In some cases, the problem of the lowering of the river bottom has caused the water table of the surrounding area to drop, which has adversely affected agriculture.&nbsp;</span><br><span style=\"font-family: Times New Roman;\">B. Also, another problem, canalization with its extensive system of locks and navigation dams, often seriously disrupts riverine ecosystems.&nbsp;</span><br><span style=\"font-family: Times New Roman;\">C. The ever-increasing exploitation of rivers has given rise to a variety of problems.&nbsp;</span><br><span style=\"font-family: Times New Roman;\">D. Further, extensive commercial navigation of rivers has resulted in much artificial improvement of natural channels, including increasing the depth of the channels to permit passage of larger vessels.&nbsp;</span></p>",
                    options_en: ["<p>BDAC</p>", "<p>DCAB</p>", 
                                "<p>CABD</p>", "<p>CDAB</p>"],
                    options_hi: ["<p>BDAC</p>", "<p>DCAB</p>",
                                "<p>CABD</p>", "<p>CDAB</p>"],
                    solution_en: "<p>77.(c) CABD.<br>Sentence C will be the starting line as it contains the main idea of the parajumble i.e. rise of different problems due to exploitation of rivers. However, Sentence A states that the problem of the lowering of the river bottom has caused the water table of the surrounding area to drop. So, A will follow C. Further, Sentence B states that canalization with its extensive system of locks and navigation dams is another problem that often seriously disrupts riverine ecosystems &amp; Sentence D states that further, extensive commercial navigation of rivers has resulted in increasing the depth of the channels to permit passage of larger vessels. So, D will follow B. Going through the options, option (c)has the correct sequence.</p>",
                    solution_hi: "<p>77.(c) CABD.<br>Sentence C प्रारम्भिक line होगी क्योंकि इसमें parajumble का main idea &lsquo; rise of different problems due to exploitation of rivers&rsquo; शामिल है। हालाँकि, sentence A कहता है कि नदी तल के नीचे जाने की समस्या के कारण आसपास के क्षेत्र का जल स्तर गिर (water table) गया है। इसलिए, A, C के बाद आएगा। इसके अलावा, sentence B कहता है कि नहरीकरण (canalization ), जिसमें तालों (locks) और नौवहन बांधों (navigation dams) की विस्तृत प्रणाली होती है, एक और समस्या है जो अक्सर नदी पारिस्थितिकी तंत्रों (riverine ecosystems) को गंभीर रूप से बाधित करती है, तथा sentence D कहता है कि इसके अलावा, आगे, नदियों के व्यापक वाणिज्यिक नौवहन (commercial navigation) के परिणामस्वरूप बड़े जहाजों के गुजरने की अनुमति देने के लिए चैनलों (जलमार्गों) की गहराई बढ़ाई गई है। इसलिए, D, B के बाद आएगा। Options के माध्यम से जाने पर, option (c) में सही sequence है।</p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({

                    section: "7",
                    question_en: "<p>78. Select the most appropriate ANTONYM of the given word.<br><span style=\"font-family: Times New Roman;\">Dividing </span></p>",
                    question_hi: "<p>78. Select the most appropriate ANTONYM of the given word.<br><span style=\"font-family: Times New Roman;\">Dividing </span></p>",

                questions.push({
                    id: "79",
                    section: "7",
                    question_en: "<p>79. The following sentence has been divided into parts. One of them contains an error. <span style=\"font-family: Times New Roman;\">Select the part that contains the error from the given options.</span><br><span style=\"font-family: Times New Roman;\">He win / several accolades / for his / music compositions. </span></p>",
                    question_hi: "<p>79. The following sentence has been divided into parts. One of them contains an error.<br><span style=\"font-family: Times New Roman;\">Select the part that contains the error from the given options.&nbsp;</span><br><span style=\"font-family: Times New Roman;\">He win / several accolades / for his / music compositions.&nbsp;</span></p>",
                    options_en: ["<p>He win</p>", "<p>music compositions</p>",

                    options_hi: ["<p>He win</p>", "<p>music compositions</p>",
                                "<p>for his</p>", "<p>several accolades</p>"],
                    solution_en: "<p>79.(a) He win.<br>According to the&nbsp;<span style=\"text-decoration: underline;\">&ldquo;<span style=\"font-family: Times New Roman;\">Subject-Verb Agreement Rule</span></span><span style=\"font-family: Times New Roman;\"><span style=\"text-decoration: underline;\">&rdquo;,</span> a singular subject always takes a singular verb and a plural subject always takes a plural verb. In the given sentence, &lsquo;he&rsquo; is a singular subject that will take &lsquo;wins&rsquo; as a singular verb. Hence, &lsquo;he wins&rsquo; is the most appropriate answer.</span></p>",
                    solution_hi: "<p>79.(a) He win.<br>&ldquo;Subject-Verb Agreement Rule&rdquo; के अनुसार, singular subject के साथ हमेशा singular verb का तथा plural subject के साथ हमेशा plural verb का प्रयोग होता है। दिए गए sentence में, &lsquo;he&rsquo; एक singular subject है जिसके साथ &lsquo;wins&rsquo; singular verb का प्रयोग होगा । अतः, &lsquo;he wins&rsquo; सबसे उपयुक्त उत्तर है।</p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });

        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
