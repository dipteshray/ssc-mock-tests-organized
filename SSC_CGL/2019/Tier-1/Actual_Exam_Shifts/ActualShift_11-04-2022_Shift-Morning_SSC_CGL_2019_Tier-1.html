                    section: "17",
                    question_en: "<p>68. <span style=\"font-family: Cambria Math;\">The ratio of the monthly incomes of A and B is 11 : 13 and the ratio of th</span><span style=\"font-family: Cambria Math;\">eir expenditure is 9 : 11. If both of them manage to save ₹ 4,000 per month, then find the difference in their incomes (in ₹).</span></p>",
                    question_hi: "<p>68. <span style=\"font-family: Cambria Math;\">A </span><span style=\"font-family: Mangal;\">और</span><span style=\"font-family: Cambria Math;\"> B </span><span style=\"font-family: Mangal;\">की</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">मासिक</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">आय</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">अनुपात</span><span style=\"font-family: Cambria Math;\"> 11 : 13 </span><span style=\"font-family: Mangal;\">है</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">और</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">उनके</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">व्यय</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">अनुपात</span><span style=\"font-family: Cambria Math;\"> 9 : 11 </span><span style=\"font-family: Mangal;\">है।</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">यदि</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">वे</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">दोनों</span><span style=\"font-family: Cambria Math;\"> ₹4,000 </span><span style=\"font-family: Mangal;\">प्रति</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">माह</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">की</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">बचत</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">करने</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">में</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">सफल</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">हो</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">जाते</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">हैं</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Mangal;\">तो</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">उनकी</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">आय</span><span style=\"font-family: Cambria Math;\"> (₹ </span><span style=\"font-family: Mangal;\">में</span><span style=\"font-family: Cambria Math;\">) </span><span style=\"font-family: Mangal;\">में</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">अंतर</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">ज्ञात</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">कीजिए।</span></p>",
                    options_en: ["<p>2,500</p>", "<p>3,200</p>", 
                                "<p>4,000</p>", "<p>3,000</p>"],
                    options_hi: ["<p>2,500</p>", "<p>3,200</p>",
                                "<p>4,000</p>", "<p>3,000</p>"],
                    solution_en: "<p>68.(c) <span style=\"font-family: Cambria Math;\">According to the question,</span><br><span style=\"font-family: Cambria Math;\">&nbsp; &nbsp;Income = Expenditure + Saving</span><br><span style=\"font-family: Cambria Math;\">A&nbsp; &rarr;&nbsp;</span><span style=\"font-family: Cambria Math;\"> 11x&nbsp; &nbsp; &nbsp;=&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;9y&nbsp; &nbsp; &nbsp; &nbsp;+&nbsp; &nbsp; &nbsp;4000 &hellip;&hellip; (1)</span><br><span style=\"font-family: Cambria Math;\">B&nbsp; &rarr;&nbsp;&nbsp;</span><span style=\"font-family: Cambria Math;\">13x&nbsp; &nbsp; &nbsp;=&nbsp; &nbsp; &nbsp; &nbsp;11y&nbsp; &nbsp; &nbsp; &nbsp;+&nbsp; &nbsp; &nbsp;4000 ..&hellip;. (2)</span><br><span style=\"font-family: Cambria Math;\">On solving equation (1) and (2), we get</span><br><span style=\"font-family: Cambria Math;\">x = 2000</span><br><span style=\"font-family: Cambria Math;\">So, required difference = 13x &ndash; 11x =&nbsp; </span><span style=\"font-family: Cambria Math;\">2x = 2(2000) = </span><span style=\"font-family: Cambria Math;\">₹</span><span style=\"font-family: Cambria Math;\">4,000</span></p>",
                    solution_hi: "<p>68.(c) <span style=\"font-family: Mangal;\">प्रश्न</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">के</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">अनुसार</span><span style=\"font-family: Cambria Math;\">,</span><br><span style=\"font-family: Mangal;\">&nbsp; &nbsp; आय</span><span style=\"font-family: Cambria Math;\"> = </span><span style=\"font-family: Mangal;\">व्यय</span><span style=\"font-family: Cambria Math;\"> + </span><span style=\"font-family: Mangal;\">बचत</span><br><span style=\"font-family: Cambria Math;\">A &rarr;&nbsp; &nbsp; </span><span style=\"font-family: Cambria Math;\">&nbsp;</span><span style=\"font-family: Cambria Math;\">11x = 9y + 4000 &hellip;&hellip;(1)</span><br><span style=\"font-family: Cambria Math;\">B &rarr;&nbsp; &nbsp;</span><span style=\"font-family: Cambria Math;\">13x = 11y + 4000 ..&hellip; ..(2)</span><br><span style=\"font-family: Mangal;\">समीकरण</span><span style=\"font-family: Cambria Math;\"> (1) </span><span style=\"font-family: Mangal;\">और</span><span style=\"font-family: Cambria Math;\"> (2) </span><span style=\"font-family: Mangal;\">को</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">हल</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">करने</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">पर</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Mangal;\">हम</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">प्राप्त</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">करते</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">हैं</span><br><span style=\"font-family: Cambria Math;\">x = 2000</span><br><span style=\"font-family: Mangal;\">अतः</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">अभीष्ट</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">अंतर</span><span style=\"font-family: Cambria Math;\"> = 13x &ndash; 11x&nbsp; </span><span style=\"font-family: Cambria Math;\">= 2x = 2(2000) = ₹4,000</span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "69",
                    section: "17",
                    question_en: "<p>69. <span style=\"font-family: Cambria Math;\">The average weight of P and his three friends is 55 kg. If P is 4 kg more than the average weight of his three friends, what is P&rsquo;s weight (in kg)?</span></p>",
                    question_hi: "<p>69. <span style=\"font-family: Cambria Math;\">P </span><span style=\"font-family: Mangal;\">और</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">उसके</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">तीन</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">दोस्तों</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">औसत</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">वजन</span><span style=\"font-family: Cambria Math;\"> 55 </span><span style=\"font-family: Cambria Math;\">kg</span><span style=\"font-family: Mangal;\">है।</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">यदि</span><span style=\"font-family: Cambria Math;\"> P </span><span style=\"font-family: Mangal;\">अपने</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">तीन</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">दोस्तों</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">के</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">औसत</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">वजन</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">से</span><span style=\"font-family: Cambria Math;\"> 4 </span><span style=\"font-family: Mangal;\">किलो</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">अधिक</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">है</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Mangal;\">तो</span><span style=\"font-family: Cambria Math;\"> P </span><span style=\"font-family: Mangal;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">वजन</span><span style=\"font-family: Cambria Math;\"> (</span><span style=\"font-family: Cambria Math;\">kg</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">में</span><span style=\"font-family: Cambria Math;\">) </span><span style=\"font-family: Mangal;\">क्या</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">है</span><span style=\"font-family: Cambria Math;\">?</span></p>",
                    options_en: ["<p>54</p>", "<p>58</p>", 
                                "<p>62</p>", "<p>60</p>"],
                    options_hi: ["<p>54</p>", "<p>58</p>",
                                "<p>62</p>", "<p>60</p>"],
                    solution_en: "<p>69.(b) <span style=\"font-family: Cambria Math;\">Let , the average weight of three friends = a</span><br><span style=\"font-family: Cambria Math;\">So total weight of three friends = 3a</span><br><span style=\"font-family: Cambria Math;\">And weight of P = a + 4</span><br><span style=\"font-family: Cambria Math;\">According to the question,</span><br><span style=\"font-family: Cambria Math;\">&rArr;<strong id=\"docs-internal-guid-355060c4-7fff-5aee-79b1-2e89176a8514\"> </strong>55 =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>(</mo><mi mathvariant=\"normal\">a</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>4</mn><mo>)</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>3</mn><mi mathvariant=\"normal\">a</mi></mrow><mn>4</mn></mfrac></math></span><br><span style=\"font-family: Cambria Math;\">&rArr; <strong id=\"docs-internal-guid-355060c4-7fff-5aee-79b1-2e89176a8514\"></strong>4a + 4 = 220</span><br><span style=\"font-family: Cambria Math;\">&rArr; <strong id=\"docs-internal-guid-355060c4-7fff-5aee-79b1-2e89176a8514\"></strong>4a = 216</span><br><span style=\"font-family: Cambria Math;\">&rArr; <strong id=\"docs-internal-guid-355060c4-7fff-5aee-79b1-2e89176a8514\"></strong>a = 54</span><br><span style=\"font-family: Cambria Math;\">P&rsquo;s weight = a + 4 = 54 + 4 = 58 kg</span></p>",
                    solution_hi: "<p>69.(b) <span style=\"font-family: Mangal;\">माना</span><span style=\"font-family: Cambria Math;\"> , </span><span style=\"font-family: Mangal;\">तीन</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">मित्रों</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">औसत</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">भार</span><span style=\"font-family: Cambria Math;\"> = a</span><br><span style=\"font-family: Mangal;\">अत</span><span style=\"font-family: Cambria Math;\">: </span><span style=\"font-family: Mangal;\">तीन</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">मित्रों</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">कुल</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">भार</span><span style=\"font-family: Cambria Math;\"> = 3a</span><br><span style=\"font-family: Mangal;\">और</span><span style=\"font-family: Cambria Math;\"> P </span><span style=\"font-family: Mangal;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">भार</span><span style=\"font-family: Cambria Math;\"> = a + 4</span><br><span style=\"font-family: Mangal;\">प्रश्न</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">के</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">अनुसार</span><span style=\"font-family: Cambria Math;\">,</span><br><span style=\"font-family: Cambria Math;\">&rArr; <strong id=\"docs-internal-guid-355060c4-7fff-5aee-79b1-2e89176a8514\"></strong>55 =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>(</mo><mi mathvariant=\"normal\">a</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>4</mn><mo>)</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>3</mn><mi mathvariant=\"normal\">a</mi></mrow><mn>4</mn></mfrac></math></span><br><span style=\"font-family: Cambria Math;\">&rArr; <strong id=\"docs-internal-guid-355060c4-7fff-5aee-79b1-2e89176a8514\"></strong>4a + 4 = 220</span><br><span style=\"font-family: Cambria Math;\">&rArr; <strong id=\"docs-internal-guid-355060c4-7fff-5aee-79b1-2e89176a8514\"></strong>4a = 216</span><br><span style=\"font-family: Cambria Math;\">&rArr; <strong id=\"docs-internal-guid-355060c4-7fff-5aee-79b1-2e89176a8514\"></strong>a = 54</span><br><span style=\"font-family: Cambria Math;\">P </span><span style=\"font-family: Mangal;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">भा</span><span style=\"font-family: Mangal;\">र</span><span style=\"font-family: Cambria Math;\"> = a + 4 = 54 + 4 = 58 kg</span></p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "70",
                    section: "17",
                    question_en: "<p>70.<span style=\"font-family: Cambria Math;\"> If&nbsp; x + y + 3 = 0, then find the value of x<sup>3</sup> + y<sup>3</sup> - 9xy + 9.</span></p>",
                    question_hi: "<p>70. <span style=\"font-family: Mangal;\">यदि</span><span style=\"font-family: Cambria Math;\"> x + y + 3 = 0 </span><span style=\"font-family: Mangal;\">है</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Mangal;\">तो <span style=\"font-family: Cambria Math;\">x<sup>3</sup> + y<sup>3</sup> - 9xy + 9</span></span><span style=\"font-family: Cambria Math;\">&nbsp;</span><span style=\"font-family: Mangal;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">मान</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">ज्ञात</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">कीजिए</span><span style=\"font-family: Cambria Math;\"> ?</span></p>",
                    options_en: ["<p>&ndash;18</p>", "<p>&ndash;36</p>", 
                                "<p>18</p>", "<p>36</p>"],
                    options_hi: ["<p>&ndash;18</p>", "<p>&ndash;36</p>",
                                "<p>18</p>", "<p>36</p>"],
                    solution_en: "<p>70.(a) <span style=\"font-family: Cambria Math;\">x + y + 3 = 0</span><br><span style=\"font-family: Cambria Math;\">x + y = - 3 &hellip;.(1)</span><br><span style=\"font-family: Cambria Math;\">On cubing equation (1), we get</span><br><span style=\"font-family: Cambria Math;\">&rArr;<strong id=\"docs-internal-guid-837d447e-7fff-1719-e9d5-0356ddb77765\"> </strong>x<sup>3</sup> + y<sup>3</sup> + 3xy(x + y) = -27&nbsp;</span><br><span style=\"font-family: Cambria Math;\">&rArr; <strong id=\"docs-internal-guid-837d447e-7fff-1719-e9d5-0356ddb77765\"></strong>x<sup>3</sup> + y<sup>3</sup> + 3xy(-3) = -27</span><br><span style=\"font-family: Cambria Math;\">&rArr; <strong id=\"docs-internal-guid-837d447e-7fff-1719-e9d5-0356ddb77765\"></strong>x<sup>3</sup> + y<sup>3</sup> - 9xy = -27&nbsp; &hellip;..(2)</span><br><span style=\"font-family: Cambria Math;\">Putting value of equation (2) in (x<sup>3</sup> + y<sup>3</sup> - 9xy + 9)</span><span style=\"font-family: Cambria Math;\">, we get</span><br><span style=\"font-family: Cambria Math;\">x<sup>3</sup> + y<sup>3</sup> - 9xy + 9&nbsp; </span><span style=\"font-family: Cambria Math;\">= &ndash;27 + 9 = &ndash;18</span></p>",
                    solution_hi: "<p>70.(a) <span style=\"font-family: Cambria Math;\">x + y + 3</span><span style=\"font-family: Cambria Math;\"> = 0</span><br><span style=\"font-family: Cambria Math;\">x + y = - 3 &hellip;.(1)</span><br><span style=\"font-family: Mangal;\">समीकरण</span><span style=\"font-family: Cambria Math;\"> (1) &nbsp;के </span><span style=\"font-family: Cambria Math;\">दोनों पक्षों &nbsp;को घन करने पर -&nbsp;</span><br><span style=\"font-family: Cambria Math;\">&rArr; <strong id=\"docs-internal-guid-837d447e-7fff-1719-e9d5-0356ddb77765\"></strong>x<sup>3</sup> + y<sup>3</sup> + 3xy(x + y) = -27&nbsp;</span><br><span style=\"font-family: Cambria Math;\">&rArr; <strong id=\"docs-internal-guid-837d447e-7fff-1719-e9d5-0356ddb77765\"></strong>x<sup>3</sup> + y<sup>3</sup> + 3xy(-3) = -27</span><br><span style=\"font-family: Cambria Math;\">&rArr; <strong id=\"docs-internal-guid-837d447e-7fff-1719-e9d5-0356ddb77765\"></strong>x<sup>3</sup> + y<sup>3</sup> - 9xy = -27&nbsp; &hellip;..(2)</span><br><span style=\"font-family: Mangal;\">समीकरण</span><span style=\"font-family: Cambria Math;\"> (2) </span><span style=\"font-family: Mangal;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">मान</span><span style=\"font-family: Cambria Math;\"> (x<sup>3</sup> + y<sup>3</sup> - 9xy + 9) </span><span style=\"font-family: Mangal;\">में</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">रखने</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">पर</span><span style=\"font-family: Mangal;\"><span style=\"font-family: Cambria Math;\"> -&nbsp;</span></span><br><span style=\"font-family: Cambria Math;\">&rArr; <strong id=\"docs-internal-guid-837d447e-7fff-1719-e9d5-0356ddb77765\"></strong>x<sup>3</sup> + y<sup>3</sup> - 9xy + 9 </span><span style=\"font-family: Cambria Math;\">= &ndash;27 + 9 = &ndash;18</span></p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "71",

                questions.push({
                    id: "74",
                    section: "17",
                    question_en: "<p>74. <span style=\"font-family: Cambria Math;\">The LCM of the two numbers is 56 times their HCF, with the sum of their HCF and LCM being 1710. If one of the two numbers is 240, then what is the other number ?</span></p>",
                    question_hi: "<p>74. <span style=\"font-family: Mangal;\">दो</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">संख्याओं</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">का</span><span style=\"font-family: Cambria Math;\"> LCM </span><span style=\"font-family: Mangal;\">उनके</span><span style=\"font-family: Cambria Math;\"> HCF </span><span style=\"font-family: Mangal;\">का</span><span style=\"font-family: Cambria Math;\"> 56 </span><span style=\"font-family: Mangal;\">गुना</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">है</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Mangal;\">उनके</span><span style=\"font-family: Cambria Math;\"> HC</span><span style=\"font-family: Cambria Math;\">F </span><span style=\"font-family: Mangal;\">और</span><span style=\"font-family: Cambria Math;\"> LCM </span><span style=\"font-family: Mangal;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">योग</span><span style=\"font-family: Cambria Math;\"> 1710 </span><span style=\"font-family: Mangal;\">है।</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">यदि</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">दो</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">संख्याओं</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">में</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">से</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">एक</span><span style=\"font-family: Cambria Math;\"> 240 </span><span style=\"font-family: Mangal;\">है</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Mangal;\">तो</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">दूसरी</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">संख्या</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">क्या</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">है</span><span style=\"font-family: Cambria Math;\"> ?</span></p>",
                    options_en: ["<p>57</p>", "<p>171</p>", 
                                "<p>1680</p>", "<p>210</p>"],
                    options_hi: ["<p>57</p>", "<p>171</p>",
                                "<p>1680</p>", "<p>210</p>"],
                    solution_en: "<p>74.(d) <span style=\"font-family: Cambria Math;\">Let LCM = a and HCF = b</span><br><span style=\"font-family: Cambria Math;\">According to the question,</span><br><span style=\"font-family: Cambria Math;\">a = 56b and a + b = 1710</span><br><span style=\"font-family: Cambria Math;\">So, we get 56b + b = 1710</span><br><span style=\"font-family: Cambria Math;\">57b = 17</span><span style=\"font-family: Cambria Math;\">10</span><br><span style=\"font-family: Cambria Math;\">b = 30</span><br><span style=\"font-family: Cambria Math;\">a = 56b = 56(30) = 1680</span><br><span style=\"font-family: Cambria Math;\">Let second number = y</span><br><span style=\"font-family: Cambria Math;\">As we know that,</span><br><span style=\"font-family: Cambria Math;\">First number &times; </span><span style=\"font-family: Cambria Math;\">Second number = LCM &times;&nbsp;</span><span style=\"font-family: Cambria Math;\">HCF</span><br><span style=\"font-family: Cambria Math;\">240 &times;&nbsp;</span><span style=\"font-family: Cambria Math;\"> y = 1680 &times;</span><span style=\"font-family: Cambria Math;\"> 30</span><br><span style=\"font-family: Cambria Math;\">y = 210 </span></p>",
                    solution_hi: "<p>74.(d) <span style=\"font-family: Mangal;\">माना</span><span style=\"font-family: Cambria Math;\"> LCM = a </span><span style=\"font-family: Mangal;\">और</span><span style=\"font-family: Cambria Math;\"> HCF = b</span><br><span style=\"font-family: Mangal;\">प्रश्न</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">के</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">अनुसार</span><span style=\"font-family: Cambria Math;\">,</span><br><span style=\"font-family: Cambria Math;\">a = 56b </span><span style=\"font-family: Mangal;\">और</span><span style=\"font-family: Cambria Math;\"> a + b = 1710</span><br><span style=\"font-family: Mangal;\">अतः</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Mangal;\">हमें</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">प्राप्त</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">होता</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">है</span><span style=\"font-family: Cambria Math;\"> 56b + b = 1710</span><br><span style=\"font-family: Cambria Math;\">57b = 1710</span><br><span style=\"font-family: Cambria Math;\">b = 30</span><br><span style=\"font-family: Cambria Math;\">a = 56b = 56 (30) = 1680</span><br><span style=\"font-family: Mangal;\">माना</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">दूसरी</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">संख्या</span><span style=\"font-family: Cambria Math;\"> = y</span><br><span style=\"font-family: Mangal;\">जैसा</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">कि</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">हम</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">जानते</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">हैं</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">कि</span><span style=\"font-family: Cambria Math;\">,</span><br><span style=\"font-family: Mangal;\">पहली</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">संख्या</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">दूसरी</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Mangal;\">संख्या</span><span style=\"font-family: Cambria Math;\"> = LCM &times;</span><span style=\"font-family: Cambria Math;\">&nbsp;HCF</span><br><span style=\"font-family: Cambria Math;\">240 &times; </span><span style=\"font-family: Cambria Math;\">y = 1680 &times;</span><span style=\"font-family: Cambria Math;\">&nbsp;30</span><br><span style=\"font-family: Cambria Math;\">y = 210</span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });

                    solution_hi: "<p>99.(b) <span style=\"font-family: Cambria Math;\">Whereas.</span><br><span style=\"font-family: Cambria Math;\">&lsquo;Moreover&rsquo; का प्रयोग एक और तथ्य को जोड़ने के लिए किया जाता है, तथा यह दिए गए रिक्त स्थान (blank) में perfectly fit होगा क्योंकि दिए गए sentence में इसका प्रयोग COVID-19 lockdown के बारे में एक और तथ्य जोड़ने के लिए किया जा रहा है। अतः, &lsquo;Moreover&rsquo; सबसे उपयुक्त उत्तर है।</span><span style=\"font-family: Cambria Math;\">&nbsp;</span></p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "100",
                    section: "misc",
                    question_en: "<p>100. <span style=\"font-family: Cambria Math;\"><strong>Cloze test :</strong></span><br><span style=\"font-family: Cambria Math;\">The rise in the Irrawaddy dolphin (96) ______ in Chilika can be attributed to the eviction of (97)</span><span style=\"font-family: Cambria Math;\">______ fish enclosures. After thousands of hect</span><span style=\"font-family: Cambria Math;\">ares of Chilika lake were made (98) ______</span><span style=\"font-family: Cambria Math;\">free, Irrawaddy dolphins found unobstructed area for movement. (99) ______, due to the </span><span style=\"font-family: Cambria Math;\">COVID-19 lockdown last year, there were comparatively fewer tourist boats on Chilika lake, </span><span style=\"font-family: Cambria Math;\">which made it (100) ______ for dolphins</span><span style=\"font-family: Cambria Math;\"> to move from one part of the lake to another.</span><br><span style=\"font-family: Cambria Math;\">Select the most appropriate option to fill in blank no.100.</span></p>",
                    question_hi: "<p>100. <span style=\"font-family: Cambria Math;\"><strong>Cloze test :</strong></span><br><span style=\"font-family: Cambria Math;\">The rise in the Irrawaddy dolphin (96) ______ in Chilika can be attributed to the eviction of (97)</span><span style=\"font-family: Cambria Math;\">______ fish enclosures. After thousands of hect</span><span style=\"font-family: Cambria Math;\">ares of Chilika lake were made (98) ______</span><span style=\"font-family: Cambria Math;\">free, Irrawaddy dolphins found unobstructed area for movement. (99) ______, due to the </span><span style=\"font-family: Cambria Math;\">COVID-19 lockdown last year, there were comparatively fewer tourist boats on Chilika lake, </span><span style=\"font-family: Cambria Math;\">which made it (100) ______ for dolphins</span><span style=\"font-family: Cambria Math;\"> to move from one part of the lake to another.</span><br><span style=\"font-family: Cambria Math;\">Select the most appropriate option to fill in blank no.100.</span></p>",
                    options_en: ["<p>conducive</p>", "<p>hurtful</p>", 
                                "<p>detrimental</p>", "<p>disturbing</p>\n<p><span style=\"font-family: Cambria Math;\"> </span></p>"],
                    options_hi: ["<p>conducive</p>", "<p>hu<span style=\"font-family: Cambria Math;\">rtful</span></p>",
                                "<p>detrimental</p>", "<p>disturbing</p>"],
                    solution_en: "<p>100.(a) <span style=\"font-family: Cambria Math;\">conducive.</span><br><span style=\"font-family: Cambria Math;\">&lsquo;Conducive&rsquo; means helping or making something happen. The given passage states that fewer tourist boats on Chilika lake made it conducive for dolphins to move from one part of the lake to another. Hence, &lsquo;conducive&rsquo; is the most appropriate answer.</span></p>",
                    solution_hi: "<p>100.(a) <span style=\"font-family: Cambria Math;\">conducive.</span><br><span style=\"font-family: Cambria Math;\">&lsquo;Conducive&rsquo; का अर्थ है, अनुकूल या सहायक होना (किसी चीज़ के होने में)। दिए गए passage में कहा गया है कि Chilika lake में, कम पर्यटक नौकाओं (tourist boats) ने, इसे dolphins के, झील के एक हिस्से से दूसरे हिस्से तक जाने के लिए अनुकूल बना दिया। अतः &lsquo;conducive&rsquo; सबसे उपयुक्त उत्तर है।</span></p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
