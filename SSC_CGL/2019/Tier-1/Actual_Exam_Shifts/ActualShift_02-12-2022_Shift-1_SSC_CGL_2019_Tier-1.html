                    question_en: "<p>51. In the given figure, a circle is inscribed in<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo></math><span style=\"font-family: Cambria Math;\">PQR, such that it touches the sides PQ, QR and RP at points D, E, F, respectively. If the lengths of the sides PQ = 15 cm, QR = 11 cm and RP = 13</span><span style=\"font-family: Cambria Math;\"> cm, then find the length of PD.</span><br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675062038/word/media/image41.png\" width=\"126\" height=\"106\"></p>",
                    question_hi: "<p><span style=\"font-family: Cambria Math;\">51. </span><span style=\"font-family: Nirmala UI;\">दी</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">गई</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">आकृति</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">में</span><span style=\"font-family: Cambria Math;\">,<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo></math></span><span style=\"font-family: Cambria Math;\">PQR </span><span style=\"font-family: Nirmala UI;\">में</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">एक</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">अंतःवृत्त</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">इस</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">प्रकार</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">खींचा</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">गया</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">है</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">कि</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">भुजाएँ</span><span style=\"font-family: Cambria Math;\"> PQ, QR </span><span style=\"font-family: Nirmala UI;\">और</span><span style=\"font-family: Cambria Math;\"> RP </span><span style=\"font-family: Nirmala UI;\">क्रमश</span><span style=\"font-family: Cambria Math;\">: D, E, F </span><span style=\"font-family: Nirmala UI;\">पर</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">स्पर्श</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">करती</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">हैं।</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">यदि</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">भुजा</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">की</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">लंबाइयाँ</span><span style=\"font-family: Cambria Math;\"> PQ = 15 cm, QR = 11 cm </span><span style=\"font-family: Nirmala UI;\">और</span><span style=\"font-family: Cambria Math;\"> RP = 13 cm </span><span style=\"font-family: Nirmala UI;\">हैं</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Nirmala UI;\">तो</span><span style=\"font-family: Cambria Math;\"> PD </span><span style=\"font-family: Nirmala UI;\">की</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">लंबाई</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">ज्ञात</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">कीजिए</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">।</span><br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675062038/word/media/image41.png\" width=\"126\" height=\"106\"></p>",
                    options_en: ["<p>9 cm</p>", "<p>8 cm</p>", 
                                "<p>7.5 cm</p>", "<p>8.5 cm</p>"],
                    options_hi: ["<p>9 cm</p>", "<p>8 cm</p>",
                                "<p>7.5 cm</p>", "<p>8.5 cm</p>"],
                    solution_en: "<p><span style=\"font-family: Cambria Math;\">51.(d)</span><br><span style=\"font-family: Cambria Math;\">Length of tangents drawn from a common external point to the circle is always equal.</span><br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675062038/word/media/image42.png\" width=\"156\" height=\"109\"><br>Perimeter = PQ + QR + RP =&nbsp; 2x + 2y + 2z<strong id=\"docs-internal-guid-075d504d-7fff-3156-3e39-f174e2c00144\"></strong><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>+</mo><mi mathvariant=\"normal\">y</mi><mo>+</mo><mi mathvariant=\"normal\">z</mi><mo>=</mo><mfrac><mn>39</mn><mn>2</mn></mfrac><mo>&#8230;</mo><mo>&#8230;</mo><mo>&#8230;</mo><mo>&#160;</mo><mi>eq</mi><mo>.</mo><mo>&#160;</mo><mo>(</mo><mn>1</mn><mo>)</mo></math><br>RF = RE &hellip;&hellip;.. (tangent from external point)<br>y + z = 11 &hellip;&hellip;&nbsp; eq.(2)<br>On solving eq.(1) and eq. (2), we get&nbsp;<strong id=\"docs-internal-guid-1167be1f-7fff-acfb-8e48-648e143f241a\"></strong><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>the</mi><mo>&#160;</mo><mi>length</mi><mo>&#160;</mo><mi>of</mi><mo>&#160;</mo><mi>PD</mi><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">x</mi><mo>)</mo><mo>=</mo><mfrac><mn>39</mn><mn>2</mn></mfrac><mo>-</mo><mn>11</mn><mo>=</mo><mfrac><mrow><mn>39</mn><mo>-</mo><mn>22</mn></mrow><mn>2</mn></mfrac><mo>=</mo><mn>8</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi>cm</mi></math><br><strong><span style=\"font-family: Cambria Math;\">Short Tricks:-</span></strong><br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675062038/word/media/image43.png\" width=\"143\" height=\"121\"><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>PD</mi><mo>=</mo><mfrac><mrow><mi>PQ</mi><mo>+</mo><mi>PR</mi><mo>-</mo><mi>RQ</mi></mrow><mn>2</mn></mfrac><mo>=</mo><mfrac><mrow><mn>15</mn><mo>+</mo><mn>13</mn><mo>-</mo><mn>11</mn></mrow><mn>2</mn></mfrac><mo>=</mo><mo>&#160;</mo><mn>8</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi>cm</mi></math></p>",
                    solution_hi: "<p><span style=\"font-family: Cambria Math;\">51.(d)</span><br>किसी उभयनिष्ठ बाह्य बिंदु से वृत्त पर खींची गई स्पर्श रेखाओं की लंबाई सदैव बराबर होती है।<br><strong id=\"docs-internal-guid-08731b1a-7fff-bad2-9047-b3d746d4829e\"></strong><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675062038/word/media/image42.png\" width=\"156\" height=\"109\"><br>परिमाप = PQ + QR + RP =&nbsp; 2x + 2y + 2z<strong id=\"docs-internal-guid-075d504d-7fff-3156-3e39-f174e2c00144\"></strong><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>+</mo><mi mathvariant=\"normal\">y</mi><mo>+</mo><mi mathvariant=\"normal\">z</mi><mo>=</mo><mfrac><mn>39</mn><mn>2</mn></mfrac></math>&hellip;&hellip;&hellip;&nbsp; समीकरण (1)<br>RF = RE&nbsp; &nbsp; &hellip;&hellip;..&nbsp; (बाहरी बिंदु से स्पर्शरेखा)<br>y + z = 11&nbsp; &nbsp; &nbsp; &hellip;&hellip; &nbsp; समीकरण(2)<br>समीकरण (1) और समीकरण (2) को हल करने पर हमे प्राप्त होता है<br><strong id=\"docs-internal-guid-c6530479-7fff-aa99-75fa-1ddcf33a0047\"></strong><strong id=\"docs-internal-guid-af747695-7fff-92ed-401a-8955ffd89786\">&nbsp;</strong>PD (x) की लंबाई = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>39</mn><mn>2</mn></mfrac><mo>-</mo><mn>11</mn><mo>=</mo><mfrac><mrow><mn>39</mn><mo>-</mo><mn>22</mn></mrow><mn>2</mn></mfrac><mo>=</mo><mn>8</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi>cm</mi></math><br><strong>शॉर्ट ट्रिक्स:-</strong><br><strong id=\"docs-internal-guid-2335f114-7fff-7db4-b02b-9eee5a90024f\"></strong><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675062038/word/media/image43.png\" width=\"143\" height=\"121\"><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>PD</mi><mo>=</mo><mfrac><mrow><mi>PQ</mi><mo>+</mo><mi>PR</mi><mo>-</mo><mi>RQ</mi></mrow><mn>2</mn></mfrac><mo>=</mo><mfrac><mrow><mn>15</mn><mo>+</mo><mn>13</mn><mo>-</mo><mn>11</mn></mrow><mn>2</mn></mfrac></math> = 8.5 सेमी</p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "52",
                    section: "17",
                    question_en: "<p>52.<span style=\"font-family: Cambria Math;\"> If cot x - tan x = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac></math></span><span style=\"font-family: Cambria Math;\">, then what will be the value of cot x + tan x ?</span></p>",
                    question_hi: "<p><span style=\"font-family: Cambria Math;\">52. </span><span style=\"font-family: Nirmala UI;\">यदि</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">cot x - tan x = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac></math></span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Nirmala UI;\">है</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Nirmala UI;\">तो</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\"> cot x + tan x</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">मान</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">क्या</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">होगा</span><span style=\"font-family: Cambria Math;\">?</span></p>",
                    options_en: ["<p>3</p>", "<p>2</p>", 
                                "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>2</mn></mfrac></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>7</mn><mn>2</mn></mfrac></math></p>"],
                    options_hi: ["<p>3</p>", "<p>2</p>",
                                "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>2</mn></mfrac></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>7</mn><mn>2</mn></mfrac></math></p>"],
                    solution_en: "<p>52.(c)<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Cot</mi><mo>&#160;</mo><mi mathvariant=\"normal\">x</mi><mo>-</mo><mi>Tanx</mi><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>&#8230;</mo><mo>&#8230;</mo><mo>&#160;</mo><mo>(</mo><mi>given</mi><mo>)</mo></math><br>On squaring, we get&nbsp;<strong id=\"docs-internal-guid-969fc1ff-7fff-191e-176e-4b7b32c9556f\"></strong><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Cot</mi><mn>2</mn></msup><mi mathvariant=\"normal\">x</mi><mo>+</mo><msup><mi>Tan</mi><mn>2</mn></msup><mi mathvariant=\"normal\">x</mi><mo>-</mo><mn>2</mn><mi>Cotx</mi><mo>.</mo><mi>Tanx</mi><mo>=</mo><mfrac><mn>9</mn><mn>4</mn></mfrac></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Cot</mi><mn>2</mn></msup><mi mathvariant=\"normal\">x</mi><mo>+</mo><msup><mi>Tan</mi><mn>2</mn></msup><mi mathvariant=\"normal\">x</mi><mo>=</mo><mfrac><mn>9</mn><mn>4</mn></mfrac><mo>+</mo><mn>2</mn><mo>=</mo><mfrac><mn>17</mn><mn>4</mn></mfrac></math><br>Adding 2 both sides,<strong id=\"docs-internal-guid-24cd2fe6-7fff-4228-d398-f4d878425953\"></strong><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>cot</mi><mn>2</mn></msup><mi mathvariant=\"normal\">x</mi><mo>+</mo><msup><mi>Tan</mi><mn>2</mn></msup><mi mathvariant=\"normal\">x</mi><mo>+</mo><mn>2</mn><mo>=</mo><mfrac><mn>17</mn><mn>4</mn></mfrac><mo>+</mo><mn>2</mn></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Cot</mi><mn>2</mn></msup><mi mathvariant=\"normal\">x</mi><mo>+</mo><msup><mi>Tan</mi><mn>2</mn></msup><mi mathvariant=\"normal\">x</mi><mo>+</mo><mn>2</mn><mi>Cotx</mi><mo>.</mo><mi>Tanx</mi><mo>=</mo><mfrac><mn>25</mn><mn>4</mn></mfrac><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi>cotx</mi><mo>.</mo><mi>Tanx</mi><mo>=</mo><mn>1</mn><mo>)</mo></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Cotx</mi><mo>+</mo><mi>Tanx</mi><mo>=</mo><msqrt><mfrac><mn>25</mn><mn>4</mn></mfrac></msqrt><mo>=</mo><mfrac><mn>5</mn><mn>2</mn></mfrac></math><br><strong>Short Tricks:-&nbsp;</strong><br>Using identity ,<strong id=\"docs-internal-guid-d53005b3-7fff-e133-775e-dfefdd5ed112\"></strong><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Cot</mi><mo>&#160;</mo><mi mathvariant=\"normal\">x</mi><mo>+</mo><mi>Tan</mi><mo>&#160;</mo><mi mathvariant=\"normal\">x</mi><mo>=</mo><msqrt><msup><mrow><mo>(</mo><mi>Cot</mi><mo>&#160;</mo><mi mathvariant=\"normal\">x</mi><mo>-</mo><mi>Tan</mi><mo>&#160;</mo><mi mathvariant=\"normal\">x</mi><mo>)</mo></mrow><mn>2</mn></msup><mo>+</mo><mn>4</mn></msqrt></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Cot</mi><mo>&#160;</mo><mi mathvariant=\"normal\">x</mi><mo>+</mo><mi>Tan</mi><mo>&#160;</mo><mi mathvariant=\"normal\">x</mi><mo>=</mo><msqrt><msup><mfenced><mfrac><mn>3</mn><mn>2</mn></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><mn>4</mn></msqrt><mo>=</mo><msqrt><mfrac><mn>25</mn><mn>4</mn></mfrac><mo>&#160;</mo></msqrt><mo>=</mo><mfrac><mn>5</mn><mn>2</mn></mfrac></math></p>",
                    solution_hi: "<p>52.(c)<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Cotx</mi><mo>-</mo><mi>Tanx</mi><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac></math>&hellip;&hellip; (दिया गया है)<br>वर्ग करने पर, हमे प्राप्त है<br><strong id=\"docs-internal-guid-95e2919e-7fff-3b73-4431-5de64f3cb6c6\"></strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Cot</mi><mn>2</mn></msup><mi mathvariant=\"normal\">x</mi><mo>+</mo><msup><mi>Tan</mi><mn>2</mn></msup><mi mathvariant=\"normal\">x</mi><mo>-</mo><mn>2</mn><mi>Cotx</mi><mo>.</mo><mi>Tanx</mi><mo>=</mo><mfrac><mn>9</mn><mn>4</mn></mfrac></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Cot</mi><mn>2</mn></msup><mi mathvariant=\"normal\">x</mi><mo>+</mo><msup><mi>Tan</mi><mn>2</mn></msup><mi mathvariant=\"normal\">x</mi><mo>=</mo><mfrac><mn>9</mn><mn>4</mn></mfrac><mo>+</mo><mn>2</mn><mo>=</mo><mfrac><mn>17</mn><mn>4</mn></mfrac></math><br>दोनों तरफ 2 जोड़ने पर,<br><strong id=\"docs-internal-guid-8e739ec2-7fff-8e61-5d7c-e6cda4ffca73\"></strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>cot</mi><mn>2</mn></msup><mi mathvariant=\"normal\">x</mi><mo>+</mo><msup><mi>Tan</mi><mn>2</mn></msup><mi mathvariant=\"normal\">x</mi><mo>+</mo><mn>2</mn><mo>=</mo><mfrac><mn>17</mn><mn>4</mn></mfrac><mo>+</mo><mn>2</mn></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Cot</mi><mn>2</mn></msup><mi mathvariant=\"normal\">x</mi><mo>+</mo><msup><mi>Tan</mi><mn>2</mn></msup><mi mathvariant=\"normal\">x</mi><mo>+</mo><mn>2</mn><mi>Cotx</mi><mo>.</mo><mi>Tanx</mi><mo>=</mo><mfrac><mn>25</mn><mn>4</mn></mfrac><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi>cotx</mi><mo>.</mo><mi>Tanx</mi><mo>=</mo><mn>1</mn><mo>)</mo></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Cotx</mi><mo>+</mo><mi>Tanx</mi><mo>=</mo><msqrt><mfrac><mn>25</mn><mn>4</mn></mfrac></msqrt><mo>=</mo><mfrac><mn>5</mn><mn>2</mn></mfrac></math><br><strong>शॉर्ट ट्रिक्स:-&nbsp;</strong><br>Identity का प्रयोग करने पर ,<br><strong id=\"docs-internal-guid-49be4671-7fff-df74-4394-f7003c4ce8e6\"></strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Cot</mi><mo>&#160;</mo><mi mathvariant=\"normal\">x</mi><mo>+</mo><mi>Tan</mi><mo>&#160;</mo><mi mathvariant=\"normal\">x</mi><mo>=</mo><msqrt><msup><mrow><mo>(</mo><mi>Cot</mi><mo>&#160;</mo><mi mathvariant=\"normal\">x</mi><mo>-</mo><mi>Tan</mi><mo>&#160;</mo><mi mathvariant=\"normal\">x</mi><mo>)</mo></mrow><mn>2</mn></msup><mo>+</mo><mn>4</mn></msqrt></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Cot</mi><mo>&#160;</mo><mi mathvariant=\"normal\">x</mi><mo>+</mo><mi>Tan</mi><mo>&#160;</mo><mi mathvariant=\"normal\">x</mi><mo>=</mo><msqrt><msup><mfenced><mfrac><mn>3</mn><mn>2</mn></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><mn>4</mn></msqrt><mo>=</mo><msqrt><mfrac><mn>25</mn><mn>4</mn></mfrac><mo>&#160;</mo></msqrt><mo>=</mo><mfrac><mn>5</mn><mn>2</mn></mfrac></math></p>\n<p><span style=\"font-family: Cambria Math;\"> </span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "53",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">53. The table given below shows the production of beauty products by five different companies.</span><br>&nbsp;<img src=\"https://ssccglpinnacle.com/images/skpr.PNG\" alt=\"\" width=\"155\" height=\"167\"><br><span style=\"font-family: Cambria Math;\">The production of beauty product by T is what percent of the production of beauty product by S?</span></p>",

                    solution_en: "<p>59.(b)<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">x</mi><mn>4</mn></msup><mo>+</mo><mfrac><mn>1</mn><msup><mi mathvariant=\"normal\">x</mi><mn>4</mn></msup></mfrac><mo>=</mo><mn>2207</mn><mo>&#8230;</mo><mo>&#8230;</mo><mi>eq</mi><mo>.</mo><mo>(</mo><mn>1</mn><mo>)</mo></math><br>Adding 2 in eq.(1), we get,<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">x</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><msup><mi mathvariant=\"normal\">x</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>47</mn><mo>&#8230;</mo><mo>&#8230;</mo><mi>eq</mi><mo>.</mo><mo>(</mo><mn>2</mn><mo>)</mo></math><br>Adding 2 in eq.(2), we get ,<br><strong id=\"docs-internal-guid-eb6740fa-7fff-e774-f661-714e5164309a\"></strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>+</mo><mfrac><mn>1</mn><mi mathvariant=\"normal\">x</mi></mfrac><mo>=</mo><mn>7</mn></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Then</mi><mo>,</mo><mo>&#160;</mo><msup><mi mathvariant=\"normal\">x</mi><mn>3</mn></msup><mo>+</mo><mfrac><mn>1</mn><msup><mi mathvariant=\"normal\">x</mi><mn>3</mn></msup></mfrac><mo>=</mo><msup><mn>7</mn><mn>3</mn></msup><mo>-</mo><mn>3</mn><mo>&#215;</mo><mn>7</mn><mo>=</mo><mn>322</mn></math><br>Now, using Identities :-<br><strong id=\"docs-internal-guid-16dbfe91-7fff-1a0b-1a8b-7909ef96c770\"></strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">x</mi><mn>7</mn></msup><mo>+</mo><mfrac><mn>1</mn><msup><mi mathvariant=\"normal\">x</mi><mn>7</mn></msup></mfrac><mo>=</mo><mfenced><mrow><msup><mi mathvariant=\"normal\">x</mi><mn>3</mn></msup><mo>+</mo><mfrac><mn>1</mn><msup><mi mathvariant=\"normal\">x</mi><mn>3</mn></msup></mfrac></mrow></mfenced><mo>&#160;</mo><mfenced><mrow><msup><mi mathvariant=\"normal\">x</mi><mn>4</mn></msup><mo>+</mo><mfrac><mn>1</mn><msup><mi mathvariant=\"normal\">x                 questions.push({
                    id: "60",
                    section: "17",
                    question_en: "<p>60.<span style=\"font-family: Cambria Math;\"> Which of the following two will provide more volume?</span><br><span style=\"font-family: Cambria Math;\">&nbsp;I) A cuboid of edges 6 cm, 7 cm and 8 cm</span><br><span style=\"font-family: Cambria Math;\">II) A cube of edge 7 cm</span></p>",
                    question_hi: "<p>60.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">निम्नलिखित</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">में</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">से</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">कौन</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">अधिक</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">आयतन</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">प्रदान</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">करेगा</span><span style=\"font-family: Cambria Math;\">?</span><br><span style=\"font-family: Cambria Math;\">I) 6 cm, 7 cm&nbsp;</span><span style=\"font-family: Nirmala UI;\">और</span><span style=\"font-family: Cambria Math;\"> 8 cm </span><span style=\"font-family: Nirmala UI;\">वाले</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">किनारों</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">एक</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">घनाभ</span><br><span style=\"font-family: Cambria Math;\">II) 7 cm </span><span style=\"font-family: Nirmala UI;\">किनारे</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">एक</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">घन</span></p>",
                    options_en: ["<p>Cube will have more volume</p>", "<p>Both will have equal volume</p>",

                    options_hi: ["<p><span style=\"font-family: Nirmala UI;\">घन</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">आयतन</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">अधिक</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">होगा</span></p>", "<p><span style=\"font-family: Nirmala UI;\">दोनों</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">आयतन</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">बराबर</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">होगा</span></p>",

                    solution_en: "<p>60.(a)<br><strong>Statement 1 :-&nbsp;</strong><strong id=\"docs-internal-guid-596be1eb-7fff-53af-100f-b8c39af9dcd7\"></strong><br>volume of cuboid = Length &times; Breadth &times; height<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>6</mn><mo>&#215;</mo><mn>7</mn><mo>&#215;</mo><mn>8</mn><mo>=</mo><mn>336</mn><msup><mi>cm</mi><mn>3</mn></msup></math><br><strong id=\"docs-internal-guid-38b5152d-7fff-78f7-ca56-f7bfd0cf06f4\">Statement 2 :-</strong><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>volume</mi><mo>&#160;</mo><mi>of</mi><mo>&#160;</mo><mi>cube</mi><mo>=</mo><msup><mrow><mo>(</mo><mi>Side</mi><mo>)</mo></mrow><mn>3</mn></msup><mo>=</mo><msup><mrow><mo>(</mo><mn>7</mn><mo>)</mo></mrow><mn>3</mn></msup><mo>=</mo><mn>343</mn><msup><mi>cm</mi><mn>3</mn></msup></math><br>Clearly, the cube has max. volume&nbsp;<strong id=\"docs-internal-guid-a8662ffe-7fff-9f1a-f098-4f27722b05f7\"> </strong></p>\n<p><span style=\"font-family: Cambria Math;\"> </span></p>",
                    solution_hi: "<p>60.(a)<br><strong>कथन 1 :-&nbsp;</strong><strong id=\"docs-internal-guid-a10f4c69-7fff-34bb-d4f6-2eaab169d5fb\"></strong><br>घनाभ का आयतन = लंबाई &times; चौड़ाई &times; ऊँचाई<br><strong id=\"docs-internal-guid-abe4edc4-7fff-7d33-8fb6-a36b930a3f50\"></strong>= 6 &times; 7 &times; 8 = 336 सेमी<sup>3</sup><br><strong>कथन&nbsp; 2 :-&nbsp;&nbsp;</strong><br><strong id=\"docs-internal-guid-d32eab0a-7fff-58d3-8d7b-06f32d60b080\"></strong>घन का आयतन = (भुजा)<sup>3</sup> = (7)<sup>3</sup> = 343 सेमी<sup>3</sup><br>स्पष्ट रूप से, घन में अधिकतम मात्रा है।</p>",
                    correct: "a",

                });

                    solution_en: "<p>65.(a)<br><strong id=\"docs-internal-guid-788df2bf-7fff-9f0a-4f85-731a15c47e84\">Formula :-</strong> Tan(A - B) =<strong id=\"docs-internal-guid-788df2bf-7fff-9f0a-4f85-731a15c47e84\"> </strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>tanA</mi><mo>-</mo><mi>tanB</mi></mrow><mrow><mn>1</mn><mo>+</mo><mi>tanA</mi><mo>.</mo><mi>tanB</mi></mrow></mfrac></math><br>sin(A + B) = cos(A + B)&hellip;&hellip;(given)<strong id=\"docs-internal-guid-291b88fb-7fff-6b7a-a0a2-1cef2b91fbe6\"></strong><br>Clearly value of sin<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi></math> and cos<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi></math> are equal at 45&deg;<br>(A + B) = 45&deg;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo></math>A = 45&deg; - B<br>Now, tanA = tan(45&deg; - B) =<strong id=\"docs-internal-guid-321c0852-7fff-03c7-92c8-1edf9de25ea5\"> </strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>tan</mi><mn>45</mn><mo>&#176;</mo><mo>-</mo><mi>tanB</mi></mrow><mrow><mn>1</mn><mo>+</mo><mi>tan</mi><mn>45</mn><mo>&#176;</mo><mo>.</mo><mi>tanB</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn><mo>-</mo><mi>tanB</mi></mrow><mrow><mn>1</mn><mo>+</mo><mi>tanB</mi></mrow></mfrac></math></p>\n<p><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\"> </span></p>",

                    solution_en: "<p>68.(c<span style=\"font-family: Cambria Math;\">)</span><br><span style=\"font-family: Cambria Math;\">Let, the total no. votes = 100%</span><br><span style=\"font-family: Cambria Math;\">Then , total votes cast = 100% - 8% = 92%</span><br><span style=\"font-family: Cambria Math;\">Now winner got 48 % of total votes = 48 %</span><br><span style=\"font-family: Cambria Math;\">Then , defeated candidates got total votes = 92% - 48% = 44%</span><br><span style=\"font-family: Cambria Math;\">Difference between winner and defeated candidates = 4%<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8594;</mo></math> </span><span style=\"font-family: Cambria Math;\">&nbsp;1100 votes</span><br><span style=\"font-family: Cambria Math;\">Total no. of voters = 100% <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8594;</mo></math></span><span style=\"font-family: Cambria Math;\"> 27500 Votes</span></p>",
                    solution_hi: "<p>68.(c)<br><span style=\"font-family: Nirmala UI;\">माना</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Nirmala UI;\">कुल</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">संख्या</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">वोट</span><span style=\"font-family: Cambria Math;\"> = 100%</span><br><span style=\"font-family: Nirmala UI;\">फिर</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Nirmala UI;\">डाले</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">गए</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">कुल</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">वोट</span><span style=\"font-family: Cambria Math;\"> = 100% - 8% = 92%</span><br><span style=\"font-family: Nirmala UI;\">अब</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">विजेता</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">को</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">कुल</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">वोटों</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">का</span><span style=\"font-family: Cambria Math;\"> 48 % = 48 %</span><br><span style=\"font-family: Nirmala UI;\">फिर</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Nirmala UI;\">पराजित</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">उम्मीदवारों</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">को</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">कुल</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">वोट</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">मिले</span><span style=\"font-family: Cambria Math;\"> = 92% - 48% = 44%</span><br><span style=\"font-family: Nirmala UI;\">विजेता</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">और</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">पराजित</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">उम्मीदवारों</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">के</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">बीच</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">अंतर</span><span style=\"font-family: Cambria Math;\"> = 4% &rarr;</span><span style=\"font-family: Cambria Math;\"> 1100 </span><span style=\"font-family: Nirmala UI;\">वोट</span><br><span style=\"font-family: Nirmala UI;\">कुल</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">संख्या</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">मतदाताओं</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">की</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">संख्या </span><span style=\"font-family: Cambria Math;\">= 100% &rarr;</span><span style=\"font-family: Cambria Math;\"> 27500 </span><span style=\"font-family: Nirmala UI;\">वोट</span></p>",

                questions.push({

                    options_hi: ["<p>18 <span style=\"font-family: Nirmala UI;\">लीटर</span></p>", "<p>14 <span style=\"font-family: Nirmala UI;\">लीटर</span></p>",

                    solution_hi: "<p>69.(d)<br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1675062038/word/media/image49.png\" width=\"191\" height=\"87\"><br><span style=\"font-family: Cambria Math;\">60 </span><span style=\"font-family: Nirmala UI;\">लीटर</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">घोल</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">में</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">पानी</span><span style=\"font-family: Cambria Math;\"> (1</span><span style=\"font-family: Nirmala UI;\">इकाई</span><span style=\"font-family: Cambria Math;\">) = 6 </span><span style=\"font-family: Nirmala UI;\">लीटर</span><br><span style=\"font-family: Nirmala UI;\">घोल</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">बनाने</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">के</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">लिए</span><span style=\"font-family: Cambria Math;\"> 25 % </span><span style=\"font-family: Nirmala UI;\">पा</span><span style=\"font-family: Nirmala UI;\">नी</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">की</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">मात्रा</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">बढ़ाने</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">के</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">लिए</span><span style=\"font-family: Cambria Math;\">= 2 </span><span style=\"font-family: Nirmala UI;\">इकाई</span><span style=\"font-family: Cambria Math;\">= 12 </span><span style=\"font-family: Nirmala UI;\">लीटर</span><span style=\"font-family: Cambria Math;\"> </span></p>",

                questions.push({
                    id: "70",
                    section: "17",
                    question_en: "<p>70. If 6 women can complete a work in 3 days, and 9 girls can complete the same work in 2 days, then find the time taken to complete the same work by 8 women and 6 girls?</p>",
                    question_hi: "<p>70.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">यदि</span><span style=\"font-family: Cambria Math;\"> 6 </span><span style=\"font-family: Nirmala UI;\">महिलाएँ</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">किसी</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">कार्य</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">को</span><span style=\"font-family: Cambria Math;\"> 3 </span><span style=\"font-family: Nirmala UI;\">दिनों</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">में</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">पूरा</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">कर</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">सकती</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">हैं</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">और</span><span style=\"font-family: Cambria Math;\"> 9 </span><span style=\"font-family: Nirmala UI;\">लड़कियाँ</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">उसी</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">कार्य</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">को</span><span style=\"font-family: Cambria Math;\"> 2 </span><span style=\"font-family: Nirmala UI;\">दिनों</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">में</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">पूरा</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">कर</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">सकती</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">हैं</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Nirmala UI;\">तो</span><span style=\"font-family: Cambria Math;\"> 8 </span><span style=\"font-family: Nirmala UI;\">महिलाओं</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">और</span><span style=\"font-family: Cambria Math;\"> 6 </span><span style=\"font-family: Nirmala UI;\">लड़कियों</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">द्वारा</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">उस</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">कार्य</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">को</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">पूरा</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">करने</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">में</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">लिया</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">गया</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">समय</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">ज्ञात</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">कीजिए।</span></p>",
                    options_en: ["<p>3 days</p>", "<p>4 days</p>", 
                                "<p>6 days</p>", "<p><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mn>7</mn></mfrac></math>days</span></p>"],
                    options_hi: ["<p>3 <span style=\"font-family: Nirmala UI;\">दिन</span></p>", "<p>4 <span style=\"font-family: Nirmala UI;\">दिन</span></p>",
                                "<p>6 <span style=\"font-family: Nirmala UI;\">दिन</span></p>", "<p><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\"> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mn>7</mn></mfrac></math> </span><span style=\"font-family: Nirmala UI;\">दिन</span></p>"],
                    solution_en: "<p>70.(d)<br>Let , the efficiency of women be W and the efficiency of girls be G.&nbsp;<br>According to the Question ,<br>&nbsp;Total Work<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo></math>6W &times; 3&nbsp; = 9G &times; 2<br>Ratio of efficiency<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mi mathvariant=\"normal\">W</mi><mi mathvariant=\"normal\">G</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>1</mn></mfrac><mo>&#8230;</mo><mo>&#8230;</mo><mo>&#8230;</mo><mo>&#8230;</mo><mi>eq</mi><mo>.</mo><mo>&#160;</mo><mo>(</mo><mn>1</mn><mo>)</mo></math><br>&nbsp;Total Work<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo></math>6W &times; 3 = 6 &times; 1 &times; 3 = 18 units&nbsp;<br>Time taken by 8Women and 6 Girls to complete 18 unit work<strong id=\"docs-internal-guid-8b2611f0-7fff-125d-77f8-9401ef7cef35\"></strong><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>18</mn><mi>unit</mi></mrow><mrow><mn>8</mn><mi mathvariant=\"normal\">W</mi><mo>&#160;</mo><mo>+</mo><mn>6</mn><mi mathvariant=\"normal\">G</mi></mrow></mfrac><mo>=</mo><mfrac><mn>18</mn><mrow><mn>8</mn><mo>&#215;</mo><mn>1</mn><mo>+</mo><mn>6</mn><mo>&#215;</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mn>9</mn><mn>7</mn></mfrac><mo>&#160;</mo><mi>days</mi></math></p>",
                    solution_hi: "<p>70.(d)<br>माना, महिलाओं की क्षमता W है और लड़कियों की क्षमता G है।&nbsp;<br>प्रश्न के अनुसार,<br><strong id=\"docs-internal-guid-cfcc2447-7fff-36a4-c96a-bebb03bb4094\"></strong>&nbsp;कुल कार्य<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo></math>6W &times; 3&nbsp; = 9G &times; 2<br>क्षमता का अनुपात<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mi mathvariant=\"normal\">W</mi><mi mathvariant=\"normal\">G</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>1</mn></mfrac></math>&hellip;&hellip;&hellip; समीकरण (1)<br><strong id=\"docs-internal-guid-3470d1d3-7fff-dec1-5d0d-c78dd575bfca\"></strong>&nbsp;कुल कार्य<strong id=\"docs-internal-guid-3a9119fa-7fff-397c-30b2-dc22be1ff602\"> </strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo></math>6W &times; 3 = 6 &times; 1 &times; 3 = 18 <strong id=\"docs-internal-guid-7589494c-7fff-7558-2bef-7b66a000dcb7\">&nbsp;</strong>इकाई<strong id=\"docs-internal-guid-7589494c-7fff-7558-2bef-7b66a000dcb7\"> </strong><br>8 महिलाओं और 6 लड़कियों द्वारा 18 इकाई कार्य को पूरा करने में लगा समय<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>18</mn><mo>&#160;</mo><mi>&#2311;&#2325;&#2366;&#2312;</mi><mo>&#160;</mo></mrow><mrow><mn>8</mn><mi mathvariant=\"normal\">W</mi><mo>&#160;</mo><mo>+</mo><mn>6</mn><mi mathvariant=\"normal\">G</mi></mrow></mfrac><mo>=</mo><mfrac><mn>18</mn><mrow><mn>8</mn><mo>&#215;</mo><mn>1</mn><mo>+</mo><mn>6</mn><mo>&#215;</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mn>9</mn><mn>7</mn></mfrac></math>दिन</p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "71",
                    section: "17",

        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
