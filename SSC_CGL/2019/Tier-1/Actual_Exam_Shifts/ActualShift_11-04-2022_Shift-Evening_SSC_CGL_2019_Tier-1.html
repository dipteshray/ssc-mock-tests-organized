                questions.push({
                    id: "65",
                    section: "17",
                    question_en: "<p>65. <span style=\"font-family: Cambria Math;\">AB is the diameter of a circle with center O , C and D are two points on the circumference</span><span style=\"font-family: Cambria Math;\">of the circle on either side of AB such that &ang;CAB = 42&deg;&nbsp;</span><span style=\"font-family: Cambria Math;\"> and </span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&ang;ABD = 57&deg;&nbsp;</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">. </span><span style=\"font-family: Cambria Math;\">What is the measure of &ang;CAD and &ang;CBD?</span></p>",
                    question_hi: "<p>65. <span style=\"font-family: Cambria Math;\">AB </span><span style=\"font-family: Nirmala UI;\">एक</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">वृत्त</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">व्यास</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">है</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">जिसका</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">केंद्र</span><span style=\"font-family: Cambria Math;\"> O </span><span style=\"font-family: Nirmala UI;\">है</span><span style=\"font-family: Cambria Math;\">, C </span><span style=\"font-family: Nirmala UI;\">और</span><span style=\"font-family: Cambria Math;\"> D </span><span style=\"font-family: Nirmala UI;\">दो</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">बिंदु</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">हैं</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">जो</span><span style=\"font-family: Cambria Math;\"> AB </span><span style=\"font-family: Nirmala UI;\">के</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">दोनों</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">ओर</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">वृत्त</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">की</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">परिधि</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">पर</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">इस</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">प्रकार</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">हैं</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">कि</span><span style=\"font-family: Cambria Math;\"> &ang;CAB = 42&deg; </span><span style=\"font-family: Nirmala UI;\">और</span><span style=\"font-family: Cambria Math;\"> &ang;</span><span style=\"font-family: Cambria Math;\">ABD</span><span style=\"font-family: Cambria Math;\"> = 57&deg;</span><span style=\"font-family: Nirmala UI;\">।</span><span style=\"font-family: Cambria Math;\"> &ang;CAD </span><span style=\"font-family: Nirmala UI;\">और</span><span style=\"font-family: Cambria Math;\"> &ang;CBD </span><span style=\"font-family: Nirmala UI;\">के</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">माप</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">में</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">क्या</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">(</span><span style=\"font-family: Nirmala UI;\">डिग्री</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">में</span><span style=\"font-family: Cambria Math;\">) </span><span style=\"font-family: Nirmala UI;\">है</span><span style=\"font-family: Cambria Math;\">?</span></p>",

                    options_hi: ["<p>105 <span style=\"font-family: Nirmala UI;\">और</span><span style=\"font-family: Cambria Math;\"> 75</span></p>", "<p>75 <span style=\"font-family: Nirmala UI;\">और</span><span style=\"font-family: Cambria Math;\"> 105</span></p>",

                    solution_en: "<p>65.(b) <span style=\"font-family: Cambria Math;\">As AB is the diameter, &ang;C = &ang;D = 90&deg;</span><br><span style=\"font-family: Cambria Math;\">&ang;BAD = 90&deg; &ndash; &ang;DBA = 90&deg; &ndash; 57&deg; = 33&deg;</span><br><span style=\"font-family: Cambria Math;\">&ang;CBA = 90&deg; &ndash; &ang;CAB = </span><span style=\"font-family: Cambria Math;\">90&deg; &ndash; 42&deg; = 48&deg;</span><br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1653539655/word/media/image46.png\" width=\"133\" height=\"106\"><br><span style=\"font-family: Cambria Math;\">&ang;CAD = &ang;BAD + &ang;CAB = 33&deg; + 42&deg; = 75&deg;</span><br><span style=\"font-family: Cambria Math;\">&ang;CBD = &ang;DBA + &ang;CBA = 57&deg; + 48&deg; = 105&deg;</span></p>",
                    solution_hi: "<p>65.(b) <span style=\"font-family: Nirmala UI;\">चूँकि</span><span style=\"font-family: Cambria Math;\"> AB </span><span style=\"font-family: Nirmala UI;\">व्यास</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">है</span><span style=\"font-family: Cambria Math;\">, &ang;C = &ang;D = 90&deg;</span><br><span style=\"font-family: Cambria Math;\">&ang;BAD = 90&deg; &ndash; &ang;DBA = 90&deg; &ndash; 57&deg; = 33&deg;</span><br><span style=\"font-family: Cambria Math;\">&ang;CBA = 90&deg; &ndash; &ang;CAB = </span><span style=\"font-family: Cambria Math;\">90&deg; &ndash; 42&deg; = 48&deg;</span><br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1653539655/word/media/image46.png\" width=\"133\" height=\"106\"><br><span style=\"font-family: Cambria Math;\">&ang;CAD = &ang;BAD + &ang;CAB = 33&deg; + 42&deg; = 75&deg;</span><br><span style=\"font-family: Cambria Math;\">&ang;CBD = &ang;DBA + &ang;CBA = 57&deg; + 48&deg; = 105&deg;</span></p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "66",
                    section: "17",
                    question_en: "<p>66.<span style=\"font-family: Cambria Math;\"> If &nbsp;a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> </span><span style=\"font-family: Cambria Math;\">= 6.25 and (ab + bc + ca) = 0.52 , what is the value of (a + b + c) , if </span><span style=\"font-family: Cambria Math;\">(a + b + c) </span>&lt; 0?</p>",
                    question_hi: "<p>66. <span style=\"font-family: Nirmala UI;\">यदि</span><span style=\"font-family: Cambria Math;\"> &nbsp;a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup></span><span style=\"font-family: Cambria Math;\">&nbsp;</span><span style=\"font-family: Cambria Math;\">= 6.25 </span><span style=\"font-family: Nirmala UI;\">और</span><span style=\"font-family: Cambria Math;\"> (ab + bc + ca) = 0.52 </span><span style=\"font-family: Nirmala UI;\">है।</span><span style=\"font-family: Cambria Math;\"> तो&nbsp;(a + b + c) </span><span style=\"font-family: Nirmala UI;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">मान</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">ज्ञात</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">कीजिए <span style=\"font-family: Cambria Math;\">?</span></span><span style=\"font-family: Cambria Math;\">&nbsp; जहाँ </span><span style=\"font-family: Cambria Math;\">(a + b + c) &lt; 0 हो ।&nbsp;</span></p>",
                    options_en: ["<p>&plusmn; 2.7</p>", "<p>&ndash; 2.7</p>", 
                                "<p>&ndash; 2.8</p>", "<p>&plusmn; 2.8</p>"],
                    options_hi: ["<p>&plusmn; 2.7</p>", "<p>&ndash; 2.7</p>",
                                "<p>&ndash; 2.8</p>", "<p>&plusmn; 2.8</p>"],
                    solution_en: "<p>66.(b)<span style=\"font-family: Cambria Math;\">&nbsp;(a + b + c)<sup>2</sup> = a<sup>2</sup>+ b<sup>2</sup> + c<sup>2</sup> + 2(ab + bc + ca)</span><br><span style=\"font-family: Cambria Math;\">= 6.25 + 2</span><span style=\"font-family: Cambria Math;\">(0.52) </span><span style=\"font-family: Cambria Math;\">= 6.25 + 1.04&nbsp; </span><span style=\"font-family: Cambria Math;\">= 7.29</span><br><span style=\"font-family: Cambria Math;\">a + b + c&nbsp; &nbsp; &nbsp;</span><span style=\"font-family: Cambria Math;\">= &plusmn;<math style=\"font-family:Verdana\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mstyle mathsize=\"18px\"><msqrt><mn>7</mn><mo>.</mo><mn>29</mn></msqrt></mstyle></math> = &plusmn;2.7</span><br><span style=\"font-family: Cambria Math;\">So, a + b + c&nbsp; &nbsp;&nbsp;</span><span style=\"font-family: Cambria Math;\"> =&nbsp; -2.7 (</span><span style=\"font-family: Cambria Math;\"> a + b + c &lt; 0) </span></p>",
                    solution_hi: "<p>66.(b)<span style=\"font-family: Cambria Math;\">&nbsp;(a + b + c)<sup>2</sup> = a<sup>2</sup>+ b<sup>2</sup> + c<sup>2</sup> + 2(ab + bc + ca)</span><br><span style=\"font-family: Cambria Math;\">= 6.25 + 2</span><span style=\"font-family: Cambria Math;\">(0.52) </span><span style=\"font-family: Cambria Math;\">= 6.25 + 1.04&nbsp; </span><span style=\"font-family: Cambria Math;\">= 7.29</span><br><span style=\"font-family: Cambria Math;\">a + b + c&nbsp; &nbsp; &nbsp;</span><span style=\"font-family: Cambria Math;\">= &plusmn;<math style=\"font-family:Verdana\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mstyle mathsize=\"18px\"><msqrt><mn>7</mn><mo>.</mo><mn>29</mn></msqrt></mstyle></math> = &plusmn;2.7</span><br><span style=\"font-family: Cambria Math;\">इसलिए, a + b + c&nbsp; &nbsp;&nbsp;</span><span style=\"font-family: Cambria Math;\"> =&nbsp; -2.7 (</span><span style=\"font-family: Cambria Math;\"> a + b + c &lt; 0)</span></p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5

                questions.push({
                    id: "67",
                    section: "17",
                    question_en: "<p>67. <span style=\"font-family: Cambria Math;\">What is the greater number by which</span><span style=\"font-family: Cambria Math;\"> when 156, 181 and 331 are divided, the remainder is 6 in each case?</span></p>",
                    question_hi: "<p>67. <span style=\"font-family: Nirmala UI;\">वह</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">कौन</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">सी</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">बड़ी</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">संख्या</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">है</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">जिससे</span><span style=\"font-family: Cambria Math;\"> 156, 181 </span><span style=\"font-family: Nirmala UI;\">और</span><span style=\"font-family: Cambria Math;\"> 331 </span><span style=\"font-family: Nirmala UI;\">को</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">विभाजित</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">करने</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">पर</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">प्रत्येक</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">स्थिति</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">में</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">शेषफल</span><span style=\"font-family: Cambria Math;\"> 6 </span><span style=\"font-family: Nirmala UI;\">आता</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">है</span><span style=\"font-family: Cambria Math;\">?</span></p>",
                    options_en: ["<p>26</p>", "<p>17</p>", 
                                "<p>25</p>", "<p>13</p>"],
                    options_hi: ["<p>26</p>", "<p>17</p>",
                                "<p>25</p>", "<p>13</p>"],
                    solution_en: "<p>67.(c) <span style=\"font-family: Cambria Math;\">For finding the required greatest number we need to deduct remainder from numbers given in question and then take HCF of numbers so obtained.</span><br><span style=\"font-family: Cambria Math;\">156 &ndash; 6 = 150</span><br><span style=\"font-family: Cambria Math;\">181 &ndash; 6 = 175</span><br><span style=\"font-family: Cambria Math;\">331 &ndash; 6 = 325</span><br><span style=\"font-family: Cambria Math;\">Required greatest number = HCF (150, 175, 325) = 25</span></p>",
                    solution_hi: "<p>67.(c) <span style=\"font-family: Nirmala UI;\">सबसे</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">बड़ी</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">अपेक्षित</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">संख्या</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">ज्ञात</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">करने</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">के</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">लिए</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">हमें</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">प्रश्न</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">में</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">दी</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">गई</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">संख्याओं</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">में</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">से</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">शेष</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">को</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">घटाना</span><span style=\"font-family: Cambria Math;\"> </span                                 "<p>29.10%</p>", "<p>53.70%</p>"],

ont-family: Cambria Math;\">)]</span><br><span style=\"font-family: Cambria Math;\">= [</span><span style=\"font-family: Cambria Math;\"><math style=\"font-family: Verdana;\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn mathsize=\"18px\">14</mn><msqrt><mn mathsize=\"18px\">50</mn></msqrt></mfrac></math> + <math style=\"font-family: Verdana;\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mstyle mathsize=\"18px\"><mfrac><mn>5</mn><msqrt><mn>50</mn></msqrt></mfrac></mstyle></math></span><span style=\"font-family: Cambria Math;\">] =&nbsp;<math style=\"font-family: Verdana;\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn mathsize=\"18px\">19</mn><msqrt><mn mathsize=\"18px\">50</mn></msqrt></mfrac></math></span></p>",
                    solution_hi: "<p>72.(c) <span style=\"font-family: Cambria Math;\">tan<sup>2</sup>A + 2 tan A &ndash; 63 = 0</span><br><span style=\"font-family: Cambria Math;\">tan<sup>2</sup>A + 9 tan A &ndash; 7 tan A &ndash;</span><span style=\"font-family: Cambria Math;\"> 63 = 0</span><br><span style=\"font-family: Cambria Math;\">tanA(tanA + 9) &ndash; 7 (tan A + 9) = 0</span><br><span style=\"font-family: Cambria Math;\">(tanA + 9)</span>(tanA &ndash; 7) = 0<br><span style=\"font-family: Cambria Math;\">tanA = &ndash;9 </span><span style=\"font-family: Nirmala UI;\">संभव</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">नहीं</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">है</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">क्योंकि</span><span style=\"font-family: Cambria Math;\"> 0 &lt; A &lt;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>2</mn></mfrac></math> <a><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Nirmala UI;\">इसलिए</span><span style=\"font-family: Cambria Math;\"> tan A = 7</span></a></span><br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1653539655/word/media/image50.png\" width=\"105\" height=\"116\"><br><span style=\"font-family: Cambria Math;\">AC =&nbsp;<math style=\"font-family: Verdana;\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><msup><mn mathsize=\"18px\">7</mn><mn mathsize=\"18px\">2</mn></msup><mo mathsize=\"18px\">&#160;</mo><mo mathsize=\"18px\">&#160;</mo><mo mathsize=\"18px\">+</mo><mo mathsize=\"18px\">&#160;</mo><msup><mn mathsize=\"18px\">1</mn><mn mathsize=\"18px\">2</mn></msup></msqrt></math> =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn mathsize=\"18px\">50</mn></msqrt></math></span><br><span style=\"font-family: Nirmala UI;\">                 questions.push({
                    id: "73",
                    section: "17",
                    question_en: "<p>73. <span style=\"font-family: Cambria Math;\">In a manufacturing unit, it was noted that the price of raw material has increased by 25% </span><span style=\"font-family: Cambria Math;\">and the labor cost has gone up from 30% of the cost of raw material to 38% of the cost </span><span style=\"font-family: Cambria Math;\">of raw material. What percentage of the consumption of raw material be reduced </span><span style=\"font-family: Cambria Math;\">to keep </span><span style=\"font-family: Cambria Math;\">the cost the same as that before the increase?</span></p>",

=\"font-family: Nirmala UI;\">श्रम</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">लागत</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">कच्चे</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">माल</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">की</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">लागत</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">के</span><span style=\"font-family: Cambria Math;\"> 30% </span><span style=\"font-family: Nirmala UI;\">से</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">बढ़कर</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">कच्चे</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">माल</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">की</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">लागत</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">का</span><span style=\"font-family: Cambria Math;\"> 38% </span><span style=\"font-family: Nirmala UI;\">हो</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">गई</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">है।</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">कच्चे</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">माल</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">की</span><span styl a Math;\">, </span><span style=\"font-family: Nirmala UI;\">जहाँ</span><span style=\"font-family: Cambria Math;\"> x </span><span style=\"font-family: Nirmala UI;\">और</span><span style=\"font-family: Cambria Math;\"> y </span><span style=\"font-family: Nirmala UI;\">प्राकृत</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">संख्याएँ</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">हैं</span><span style=\"font-family: Cambria Math;\">?</span></p>",

                                "<p>55</p>", "<p>70</p>"],
                    options_hi: ["<p>33</p>", "<p>44</p>",
                                "<p>55</p>", "<p>70</p>"],
                    solution_en: "<p>74.(c) <span style=\"font-family: Cambria Math;\">56 = 7 &times; 8</span><br><span style=\"font-family: Cambria Math;\">For x8942y4 to be divisible by 56, it must be divisible by both 7 and 8.</span><br><span style=\"font-family: Cambria Math;\">For 8, last 3 digits 2y4 is divisible by 8</span><br><span style=\"font-family: Cambria Math;\">y = 2 or 6, for maximum value we take y = 6.</span><br><span style=\"font-family: Cambria Math;\">For divisibility by 7, the number is first split into group of 3 numbers and the difference of sum of alternate 3 digit numbers so formed must be divisible by 7.</span><br><strong id=\"docs-internal-guid-1d1b14d5-7fff-9abf-bf03-49cc5eb6ea09\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXfx6X4-Lc7PG7I7kHSQh0d8wU_5Wx-gdwO2gCyCO6Bz3WUo2YxnbD1a4GRzzk4XW1IyYsMJDFgnf-0yEmkCEJwAbW7bvhsC4-__Yg9FB5sEGzXvnhCFLaV5Ag4gSRiqYBvgYYHKWw?key=4n7Qd_LUBSOm3ZE8hxOQLg\" width=\"141\" height=\"40\"></strong><br><span style=\"font-family: Cambria Math;\">Difference = 894 &ndash; (264 + x) = 630 &ndash; x</span><br><span style=\"font-family: Cambria Math;\">For (630 &ndash; x) to be divisible by 7 we must have x = 7</span><span style=\"font-family: Cambria Math;\">.</span><br><span style=\"font-family: Cambria Math;\">x<sup>2</sup> + y = 7<sup>2</sup>&nbsp;</span><span style=\"font-family: Cambria Math;\"> + 6 = 55.</span></p>",

                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
