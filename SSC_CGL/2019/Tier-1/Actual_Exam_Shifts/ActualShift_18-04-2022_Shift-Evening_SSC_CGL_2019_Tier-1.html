                questions.push({
                    id: "70",
                    section: "17",
                    question_en: "<p>70. <span style=\"font-family: Palanquin Dark;\"> LCM of two numbers is 22 times their HCF. If one of the numbers is 132 and the sum of LCM and HCF is 276, then what is the other number?</span></p>",
                    question_hi: "<p>70.<span style=\"font-family: Palanquin Dark;\"> दो संख्याओं का LCM उनके HCF का 22 गुना है। यदि संख्याओं में से एक 132 है और LCM और HCF का योग 276 है, तो दूसरी संख्या क्या है?</span></p>",
                    options_en: ["<p>24</p>", "<p>30</p>", 
                                "<p>25</p>", "<p>20</p>"],
                    options_hi: ["<p>24</p>", "<p>30</p>",
                                "<p>25</p>", "<p>20</p>"],
                    solution_en: "<p>70.(a)<br><span style=\"font-family: Palanquin Dark;\">Let second number = b, LCM = x and HCF = y<br></span><span style=\"font-family: Palanquin Dark;\">According to the question,<br></span><span style=\"font-family: Palanquin Dark;\">x = 22y<br></span><span style=\"font-family: Palanquin Dark;\">x + y = 276<br></span><span style=\"font-family: Palanquin Dark;\">So, 22y + y = 276&nbsp;<br></span><span style=\"font-family: Palanquin Dark;\">23y = 276<br></span><span style=\"font-family: Palanquin Dark;\">y = 12<br></span><span style=\"font-family: Palanquin Dark;\">So, x = 22y = 22(12) = 264<br></span><span style=\"font-family: Palanquin Dark;\">Now, product of two numbers = LCM &times; </span><span style=\"font-family: Palanquin Dark;\">HCF<br></span><span style=\"font-family: Palanquin Dark;\">132 &times;&nbsp;</span><span style=\"font-family: Palanquin Dark;\"> b = 264 &times; </span><span style=\"font-family: Palanquin Dark;\">12<br></span><span style=\"font-family: Palanquin Dark;\">= 24</span></p>",
                    solution_hi: "<p>70.<span style=\"font-family: Palanquin Dark;\">(a)<br></span><span style=\"font-family: Palanquin Dark;\">माना दूसरी संख्या = b, LCM = x और HCF = y<br></span><span style=\"font-family: Palanquin Dark;\">प्रश्न के अनुसार,<br></span><span style=\"font-family: Palanquin Dark;\">x = 22y<br></span><span style=\"font-family: Palanquin Dark;\">x + y = 276<br></span><span style=\"font-family: Palanquin Dark;\">इसलिए, 22y + y = 276&nbsp;<br></span><span style=\"font-family: Palanquin Dark;\">23y = 276<br></span><span style=\"font-family: Palanquin Dark;\">y = 12<br></span><span style=\"font-family: Palanquin Dark;\">अत: x = 22y = 22(12) = 264<br></span><span style=\"font-family: Palanquin Dark;\">अब, दो संख्याओं का गुणनफल = LCM &times;</span><span style=\"font-family: Palanquin Dark;\">HCF<br></span><span style=\"font-family: Palanquin Dark;\">132 &times;&nbsp;</span><span style=\"font-family: Palanquin Dark;\"> b = 264 &times; </span><span style=\"font-family: Palanquin Dark;\">12<br></span><span style=\"font-family: Palanquin Dark;\">b = 24</span></p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "71",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Palanquin Dark;\">71. </span><span style=\"font-family: Palanquin Dark;\"> The average of a set of 18 consecutive integers is 22.5. What is the largest in the set?</span></p>",
                    question_hi: "<p>71.<span style=\"font-family: Palanquin Dark;\"> 18 क्रमागत पूर्णांकों के समुच्चय का औसत 22.5 है। </span><span style=\"font-family: Palanquin Dark;\">समुच्चय </span><span style=\"font-family: Palanquin Dark;\">में सबसे बड़ा क्या है?</span></p>",
                    options_en: ["<p>14</p>", "<p>13</p>", 
                                "<p>31</p>", "<p>17</p>"],
                    options_hi: ["<p>14</p>", "<p>13</p>",
                                "<p>31</p>", "<p>17</p>"],
                    solution_en: "<p>71.<span style=\"font-family: Palanquin Dark;\">(c)<br></span><span style=\"font-family: Palanquin Dark;\">Let first number be x </span><span style=\"font-family: Palanquin Dark;\">, so largest number = x + 17<br></span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mo>(</mo><mi>x</mi><mo>+</mo><mn>1</mn><mo>)</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mo>(</mo><mi>x</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>2</mn><mo>)</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>+</mo><mo>(</mo><mi>x</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>17</mn><mo>)</mo></math><br>according to the question,&nbsp;</p>\n<p><span style=\"font-family: Palanquin Dark;\">&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mo>+</mo><mo>(</mo><mi>x</mi><mo>+</mo><mn>1</mn><mo>)</mo><mo>+</mo><mo>(</mo><mi>x</mi><mo>+</mo><mn>2</mn><mo>)</mo><mo>+</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>+</mo><mo>(</mo><mi>x</mi><mo>+</mo><mn>17</mn><mo>)</mo></mrow><mn>18</mn></mfrac><mo>=</mo><mn>22</mn><mo>.</mo><mn>5</mn></math><br></span><span style=\"font-family: Palanquin Dark;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>18</mn><mi>x</mi><mo>+</mo><mo>(</mo><mn>1</mn><mo>+</mo><mn>2</mn><mo>+</mo><mn>3</mn><mo>+</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>+</mo><mn>17</mn><mo>)</mo></mrow><mn>18</mn></mfrac><mo>=</mo><mn>22</mn><mo>.</mo><mn>5</mn></math><br></span><span style=\"font-family: Palanquin Dark;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>18</mn><mi>x</mi><mo>+</mo><mstyle displaystyle=\"true\"><mfrac><mn>17</mn><mn>2</mn></mfrac></mstyle><mo>(</mo><mn>1</mn><mo>+</mo><mn>17</mn><mo>)</mo></mrow><mn>18</mn></mfrac><mo>=</mo><mn>22</mn><mo>.</mo><mn>5</mn></math><br></span><span style=\"font-family: Palanquin Dark;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>18</mn><mi>x</mi><mo>+</mo><mn>153</mn></mrow><mn>18</mn></mfrac><mo>=</mo><mn>22</mn><mo>.</mo><mn>5</mn></math><br></span>18x + 153 = 405<br>18x = 252<br>x = 14<br><span style=\"font-family: Palanquin Dark;\">So, largest number = x+17 = 14 + 17 = 31</span></p>",
                    solution_hi: "<p>71.<span style=\"font-family: Palanquin Dark;\">(c)</span></p>\n<p><span style=\"font-family: Palanquin Dark;\">माना पहली संख्या x है, इसलिए सबसे बड़ी संख्या = x + 17</span></p>\n<p><span style=\"font-family: Palanquin Dark;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mo>(</mo><mi>x</mi><mo>+</mo><mn>1</mn><mo>)</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mo>(</mo><mi>x</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>2</mn><mo>)</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>+</mo><mo>(</mo><mi>x</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>17</mn><mo>)</mo></math></span></p>\n<p><span style=\"font-family: Palanquin Dark;\">प्रश्न के अनुसार,</span></p>\n<p><span style=\"font-family: Palanquin Dark;\">&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mo>+</mo><mo>(</mo><mi>x</mi><mo>+</mo><mn>1</mn><mo>)</mo><mo>+</mo><mo>(</mo><mi>x</mi><mo>+</mo><mn>2</mn><mo>)</mo><mo>+</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>+</mo><mo>(</mo><mi>x</mi><mo>+</mo><mn>17</mn><mo>)</mo></mrow><mn>18</mn></mfrac><mo>=</mo><mn>22</mn><mo>.</mo><mn>5</mn></math><br></span><span style=\"font-family: Palanquin Dark;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>18</mn><mi>x</mi><mo>+</mo><mo>(</mo><mn>1</mn><mo>+</mo><mn>2</mn><mo>+</mo><mn>3</mn><mo>+</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>+</mo><mn>17</mn><mo>)</mo></mrow><mn>18</mn></mfrac><mo>=</mo><mn>22</mn><mo>.</mo><mn>5</mn></math><br></span><span style=\"font-family: Palanquin Dark;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>18</mn><mi>x</mi><mo>+</mo><mstyle displaystyle=\"true\"><mfrac><mn>17</mn><mn>2</mn></mfrac></mstyle><mo>(</mo><mn>1</mn><mo>+</mo><mn>17</mn><mo>)</mo></mrow><mn>18</mn></mfrac><mo>=</mo><mn>22</mn><mo>.</mo><mn>5</mn></math><br></span><span style=\"font-family: Palanquin Dark;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>18</mn><mi>x</mi><mo>+</mo><mn>153</mn></mrow><mn>18</mn></mfrac><mo>=</mo><mn>22</mn><mo>.</mo><mn>5</mn></math><br></span>18x + 153 = 405<br>18x = 252<br>x = 14<br><span style=\"font-family: Palanquin Dark;\">अत: सबसे बड़ी संख्या = x + 17 = 14 + 17 = 31</span></p>\n<p><span style=\"font-family: Palanquin Dark;\">&nbsp;</span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "72",
                    section: "17",
                    question_en: "<p>72.<span style=\"font-family: Palanquin Dark;\"> A number &lsquo;n</span><span style=\"font-family: Palanquin Dark;\">&rsquo; when divided by 6 leaves remainder 2. What will be the remainder when&nbsp;<span style=\"font-size: 13.3333px;\"> (n<sup>2</sup> + n + 2)&nbsp; </span></span>is divided by 6?</p>",
                    question_hi: "<p>72.<span style=\"font-family: Palanquin Dark;\"> किसी संख्या \'n\' को 6 से विभाजित करने पर 2 शेष रहता है। <span style=\"font-size: 13.3333px;\">(n<sup>2</sup> + n + 2)</span></span><span style=\"font-family: Palanquin Dark;\">&nbsp;को 6 से विभाजित करने पर शेषफल क्या होगा?</span></p>",
                    options_en: ["<p>4</p>", "<p>6</p>", 
                                "<p>0</p>", "<p>2</p>"],
                    options_hi: ["<p>4</p>", "<p>6</p>",
                                "<p>0</p>", "<p>2</p>"],
                    solution_en: "<p>72.<span style=\"font-family: Palanquin Dark;\">(d)<br></span><span style=\"font-family: Palanquin Dark;\">Let </span><span style=\"font-family: Palanquin Dark;\">&nbsp;= 8<br></span><span style=\"font-family: Palanquin Dark;\">So, when 8 is divided by 6, it leaves remainder = 2<br></span><span style=\"font-family: Palanquin Dark;\"><span style=\"font-size: 13.3333px;\">(n<sup>2</sup> + n + 2) </span></span>= (<span style=\"font-family: Palanquin Dark;\"> 8<sup>2</sup> + 8 + 2) = 64 + 8 + 2 = 74<br></span><span style=\"font-family: Palanquin Dark;\">When 74 is divided by 6, we get remainder = 2</span></p>",
                    solution_hi: "<p>72.<span style=\"font-family: Palanquin Dark;\">(d)<br></span><span style=\"font-family: Palanquin Dark;\">मान लीजिए n = 8<br></span><span style=\"font-family: Palanquin Dark;\">अतः, जब 8 को 6 से विभाजित किया जाता है, तो शेषफल बचता है = 2<br></span><span style=\"font-family: Palanquin Dark;\"><span style=\"font-size: 13.3333px;\">(n<sup>2</sup> + n + 2) </span>= ( 8<sup>2</sup> + 8 + 2) = 64 + 8 + 2 = 74<br></span><span style=\"font-family: Palanquin Dark;\">जब 74 को 6 से विभाजित किया जाता है, तो हमें शेषफल प्राप्त होता है = 2</span></p>\n<p><span style=\"font-family: Palanquin Dark;\"> </span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "73",
                    section: "17",
                    question_en: "<p>73. <span style=\"font-family: Palanquin Dark;\"> A can do a piece of work in 15 days, while B can do the same work in 21 days. If they work together, then in how many days will the same work be completed?</span></p>",
                    question_hi: "<p>73.<span style=\"font-family: Palanquin Dark;\"> A एक काम को 15 दिनों में कर सकता है, जबकि B उसी काम को 21 दिनों में कर सकता है। यदि वे एक साथ कार्य करते हैं, तो समान कार्य कितने दिनों में पूरा होगा?</span></p>",
                    options_en: ["<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mfrac><mn>3</mn><mn>4</mn></mfrac></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mfrac><mn>3</mn><mn>4</mn></mfrac></math></p>", 
                                "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mfrac><mn>3</mn><mn>4</mn></mfrac></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mfrac><mn>3</mn><mn>4</mn></mfrac></math></p>"],
                    options_hi: ["<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mfrac><mn>3</mn><mn>4</mn></mfrac></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mfrac><mn>3</mn><mn>4</mn></mfrac></math></p>",
                                "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mfrac><mn>3</mn><mn>4</mn></mfrac></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mfrac><mn>3</mn><mn>4</mn></mfrac></math></p>"],
                    solution_en: "<p>73.<span style=\"font-family: Palanquin Dark;\">(d)<br></span><span style=\"font-family: \'Palanquin Dark\';\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; A&nbsp; &nbsp; &nbsp; B<br></span><span style=\"font-family: Palanquin Dark;\">Efficiency :&nbsp; (7)&nbsp; &nbsp; (5) <br></span><span style=\"font-family: Palanquin Dark;\">Time taken : 15&nbsp; &nbsp; &nbsp;21 <br></span><span style=\"font-family: Palanquin Dark;\">Total work = LCM of time taken = LCM (15, 21) = 105 units<br></span><span style=\"font-family: Palanquin Dark;\">Time taken to complete the work together = </span><span style=\"font-family: Palanquin Dark;\"> </span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>105</mn><mrow><mn>7</mn><mo>+</mo><mn>5</mn></mrow></mfrac><mo>=</mo><mfrac><mn>105</mn><mn>12</mn></mfrac><mo>=</mo><mfrac><mn>35</mn><mn>4</mn></mfrac><mo>=</mo><mn>8</mn><mfrac><mn>3</mn><mn>4</mn></mfrac><mo>&#160;</mo><mi>d</mi><mi>a</mi><mi>y</mi><mi>s</mi></math><span style=\"font-family: Palanquin Dark;\">&nbsp;</span></p>",
                    solution_hi: "<p>73.<span style=\"font-family: Palanquin Dark;\">(d)<br></span><span style=\"font-family: \'Palanquin Dark\';\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; A&nbsp; &nbsp; &nbsp; B<br></span><span style=\"font-family: Palanquin Dark;\">दक्षता&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;:&nbsp; (7)&nbsp; &nbsp; (5) <br></span><span style=\"font-family: Palanquin Dark;\">लिया गया समय :&nbsp; 5&nbsp; &nbsp; &nbsp; 21 <br></span><span style=\"font-family: Palanquin Dark;\">कुल कार्य = लिए गए समय का LCM = LCM (15, 21) = 105 इकाई<br></span><span style=\"font-family: Palanquin Dark;\">एक साथ कार्य को पूरा करने में लिया गया समय = </span><span style=\"font-family: Palanquin Dark;\"> </span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>105</mn><mrow><mn>7</mn><mo>+</mo><mn>5</mn></mrow></mfrac><mo>=</mo><mfrac><mn>105</mn><mn>12</mn></mfrac><mo>=</mo><mfrac><mn>35</mn><mn>4</mn></mfrac><mo>=</mo><mn>8</mn><mfrac><mn>3</mn><mn>4</mn></mfrac></math><span style=\"font-family: Palanquin Dark;\">दिन</span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "74",
                    section: "17",
                    question_en: "<p>74.<span style=\"font-family: Arial Unicode MS;\"> In &Delta;PQR, S is a point on the side QR such that PS is the bisector of ㄥQPR . If PQ = 12 cm , QS = 3 cm and QR = 7 cm. What is the length of PR?</span></p>",
                    question_hi: "<p>74.<span style=\"font-family: Arial Unicode MS;\"> &Delta;PQR में, S भुजा QR पर इस प्रकार एक बिंदु है कि PS, ㄥQPR का समद्विभाजक है। यदि PQ= 12 </span><span style=\"font-family: Arial Unicode MS;\">cm </span><span style=\"font-family: Arial Unicode MS;\">, QS = 3 </span><span style=\"font-family: Arial Unicode MS;\">cm </span><span style=\"font-family: Palanquin Dark;\">और QR = 7 </span><span style=\"font-family: Palanquin Dark;\">cm </span><span style=\"font-family: Palanquin Dark;\">। PR की लंबाई क्या है?</span></p>",
                    options_en: ["<p>18 cm</p>", "<p>14 cm</p>", 
                                "<p>15 cm</p>", "<p>16 cm</p>"],
                    options_hi: ["<p>18 cm</p>", "<p>14 cm</p>",

                    solution_en: "<p>74.(d)</p>\n<p><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1653737174/word/media/image47.png\" width=\"165\" height=\"161\"><br><span style=\"font-family: Palanquin Dark;\">Let PR = y&nbsp;<br></span><span style=\"font-family: Palanquin Dark;\">SR = QR &ndash; QS = 7 &ndash; 3 = 4 cm<br></span><span style=\"font-family: Palanquin Dark;\">According to the angle bisector theorem,<br></span><span style=\"font-family: Palanquin Dark;\">&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>P</mi><mi>Q</mi></mrow><mrow><mi>P</mi><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>Q</mi><mi>S</mi></mrow><mrow><mi>S</mi><mi>R</mi></mrow></mfrac></math><br></span><span style=\"font-family: Palanquin Dark;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>12</mn><mi>y</mi></mfrac><mo>=</mo><mfrac><mn>3</mn><mn>4</mn></mfrac></math><br></span><span style=\"font-family: Palanquin Dark;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>16</mn><mo>&#160;</mo><mi>c</mi><mi>m</mi></math></span></p>",

                questions.push({

                    question_en: "<p>75.<span style=\"font-family: Palanquin Dark;\"> Three years ago, the ratio of the age of the father to that </span><span style=\"font-family: Palanquin Dark;\">of son</span><span style=\"font-family: Palanquin Dark;\"> </span><span style=\"font-family: Palanquin Dark;\">was 8</span><span style=\"font-family: Palanquin Dark;\"> : 3. After 4 years, their ages will be in the ratio of 11 : 5. What is the present age of the father ?</span></p>",

                    options_hi: ["<p>52</p>", "<p>51</p>",

                    solution_en: "<p><span style=\"font-family: Arial Rounded;\">100.(b)<br></span><span style=\"font-family: Arial Rounded;\">&lsquo;Context&rsquo; means </span><span style=\"font-family: Arial Rounded;\">the situation in which something happens. </span><span style=\"font-family: Arial Rounded;\">The given passage states that he should also concentrate on what is being spoken and then evaluate it with reference to the context. Hence, &lsquo;context&rsquo; is the most appropriate answer</span><span style=\"font-family: Arial Rounded;\">.</span></p>",
                    solution_hi: "<p><span style=\"font-family: Arial Rounded;\">100.(b) </span>context.<br>&lsquo;Context&rsquo; का अर्थ है वह स्थिति जिसमें कुछ घटित होता है। दिए गए passage में कहा गया है कि उसे जो बोला जा रहा है उस पर भी ध्यान केंद्रित करना चाहिए और फिर context के reference में उसका मूल्यांकन (evaluation) करना चाहिए। अतः, &lsquo;context&rsquo; सबसे उपयुक्त उत्तर है।</p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
