                    solution_hi: "<p>36.(a) <strong>&#2348;&#2381;&#2354;&#2366;&#2311;&#2306;&#2337; &#2360;&#2381;&#2344;&#2375;&#2325;</strong><span style=\"font-family: Palanquin;\">&#2404; &#2347;&#2366;&#2311;&#2354;&#2350; - &#2325;&#2377;&#2352;&#2381;&#2337;&#2375;&#2335;&#2366;, &#2346;&#2352;&#2367;&#2357;&#2366;&#2352; - &#2335;&#2366;&#2311;&#2347;&#2381;&#2354;&#2379;&#2346;&#2367;&#2337;&#2375;&#2404; &#2335;&#2366;&#2311;&#2347;&#2381;&#2354;&#2377;&#2346;&#2381;&#2360; &#2309;&#2306;&#2343;&#2375; &#2360;&#2366;&#2306;&#2346; (&#2348;&#2367;&#2344;&#2366; &#2332;&#2364;&#2361;&#2352;&#2368;&#2354;&#2375; &#2360;&#2366;&#2305;&#2346;&#2379;&#2306;) &#2325;&#2368; &#2319;&#2325; &#2346;&#2381;&#2352;&#2332;&#2366;&#2340;&#2367; &#2361;&#2376;&#2404; &#2360;&#2366;&#2306;&#2346;&#2379;&#2306; &#2325;&#2375; &#2325;&#2369;&#2331; &#2309;&#2344;&#2381;&#2351; &#2346;&#2381;&#2352;&#2325;&#2366;&#2352;:- &#2360;&#2350;&#2369;&#2342;&#2381;&#2352;&#2368; &#2360;&#2366;&#2306;&#2346;: &#2346;&#2352;&#2367;&#2357;&#2366;&#2352; - &#2319;&#2354;&#2366;&#2346;&#2367;&#2337;&#2375;, &#2332;&#2366;&#2340;&#2367; - &#2361;&#2366;&#2311;&#2337;&#2381;&#2352;&#2379;&#2347;&#2367;&#2360;&#2404; &#2328;&#2366;&#2360; (Grass) &#2360;&#2366;&#2305;&#2346;: &#2346;&#2352;&#2367;&#2357;&#2366;&#2352; - &#2325;&#2379;&#2354;&#2369;&#2348;&#2381;&#2352;&#2367;&#2337;&#2375;, &#2332;&#2366;&#2340;&#2367; - &#2344;&#2376;&#2335;&#2381;&#2352;&#2367;&#2325;&#2381;&#2360;&#2404; &#2327;&#2381;&#2354;&#2366;&#2360; &#2360;&#2366;&#2306;&#2346;: &#2346;&#2352;&#2367;&#2357;&#2366;&#2352; - &#2319;&#2306;&#2327;&#2369;&#2311;&#2337;&#2375;, &#2332;&#2366;&#2340;&#2367; - &#2323;&#2347;&#2367;&#2360;&#2377;&#2352;&#2360;&#2404;</span></p>\\n",

                questions.push({
                    id: "37",
                    section: "18",
                    question_en: "<p>37. <span style=\"font-family: Palanquin;\">Which of the following periods is referred to as a period of stagnant or stationary phase of growth of India\'s population?</span></p>\\n",
                    question_hi: "<p>37. <span style=\"font-family: Palanquin Dark;\">&#2344;&#2367;&#2350;&#2381;&#2344;&#2354;&#2367;&#2326;&#2367;&#2340; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2367;&#2360; &#2309;&#2357;&#2343;&#2367; &#2325;&#2379; &#2349;&#2366;&#2352;&#2340; &#2325;&#2368; &#2332;&#2344;&#2360;&#2306;&#2326;&#2381;&#2351;&#2366; &#2357;&#2371;&#2342;&#2381;&#2343;&#2367; &#2325;&#2375; &#2352;&#2369;&#2325;&#2375; &#2361;&#2369;&#2319; &#2351;&#2366; &#2360;&#2381;&#2341;&#2367;&#2352; &#2330;&#2352;&#2339; &#2325;&#2368; &#2309;&#2357;&#2343;&#2367; &#2325;&#2375; &#2352;&#2370;&#2346; &#2350;&#2375;&#2306; &#2332;&#2366;&#2344;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;?</span></p>\\n",
                    options_en: ["<p>1921-1941</p>\\n", "<p>1901-1921</p>\\n", 
                                "<p>1961-1981</p>\\n", "<p><span style=\"font-weight: 400;\">1941-1961</span></p>\\n"],
                    options_hi: ["<p>1921-1941</p>\\n", "<p>1901-1921</p>\\n",
                                "<p>1961-1981</p>\\n", "<p><span style=\"font-weight: 400;\">1941-1961</span></p>\\n"],
                    solution_en: "<p>37.(b) <strong>1901-1921. </strong><span style=\"font-family: Roboto;\">The population of India recorded a negative growth rate in 1911-1921. The year 1921 is known as the year demographic divide because it is the only census year when there was a decrease in the growth of population. First Census of India - 1872 (Lord Mayo). First regular Census of India - 1881(Lord Ripon). The first census of Independent India - 1951.</span></p>\\n",
                    solution_hi: "<p>37.(b) <strong>1901-1921</strong> <span style=\"font-family: Palanquin;\">&#2404; 1911-1921 &#2350;&#2375;&#2306; &#2349;&#2366;&#2352;&#2340; &#2325;&#2368; &#2332;&#2344;&#2360;&#2306;&#2326;&#2381;&#2351;&#2366; &#2350;&#2375;&#2306; &#2344;&#2325;&#2366;&#2352;&#2366;&#2340;&#2381;&#2350;&#2325; &#2357;&#2371;&#2342;&#2381;&#2343;&#2367; &#2342;&#2352; &#2342;&#2352;&#2381;&#2332; &#2325;&#2368; &#2327;&#2312;&#2404; &#2357;&#2352;&#2381;&#2359; 1921 &#2325;&#2379; &#2332;&#2344;&#2360;&#2366;&#2306;&#2326;&#2381;&#2351;&#2367;&#2325;&#2368;&#2351; &#2357;&#2367;&#2349;&#2366;&#2332;&#2344; &#2357;&#2352;&#2381;&#2359; &#2325;&#2375; &#2352;&#2370;&#2346; &#2350;&#2375;&#2306; &#2332;&#2366;&#2344;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376; &#2325;&#2381;&#2351;&#2379;&#2306;&#2325;&#2367; &#2351;&#2361; &#2319;&#2325;&#2350;&#2366;&#2340;&#2381;&#2352; &#2332;&#2344;&#2327;&#2339;&#2344;&#2366; &#2357;&#2352;&#2381;&#2359; &#2361;&#2376; &#2332;&#2348; &#2332;&#2344;&#2360;&#2306;&#2326;&#2381;&#2351;&#2366; &#2325;&#2368; &#2357;&#2371;&#2342;&#2381;&#2343;&#2367; &#2350;&#2375;&#2306; &#2325;&#2350;&#2368; &#2310;&#2312; &#2341;&#2368;&#2404; &#2349;&#2366;&#2352;&#2340; &#2325;&#2368; &#2346;&#2381;&#2352;&#2341;&#2350; &#2332;&#2344;&#2327;&#2339;&#2344;&#2366; - 1872 (&#2354;&#2377;&#2352;&#2381;&#2337; &#2350;&#2375;&#2351;&#2379;)&#2404; &#2349;&#2366;&#2352;&#2340; &#2325;&#2368; &#2346;&#2381;&#2352;&#2341;&#2350; &#2344;&#2367;&#2351;&#2350;&#2367;&#2340; &#2332;&#2344;&#2327;&#2339;&#2344;&#2366; - 1881 (&#2354;&#2377;&#2352;&#2381;&#2337; &#2352;&#2367;&#2346;&#2344;)&#2404; &#2360;&#2381;&#2357;&#2340;&#2306;&#2340;&#2381;&#2352; &#2349;&#2366;&#2352;&#2340; &#2325;&#2368; &#2346;&#2381;&#2352;&#2341;&#2350; &#2332;&#2344;&#2327;&#2339;&#2344;&#2366; - 1951&#2404; </span></p>\\n",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "38",
                    section: "18",
                    question_en: "<p>38. <span style=\"font-family: Palanquin;\">In which Five-Year Plan was the process of economic reforms introduced in India?</span></p>\\n",
                    question_hi: "<p>38. <span style=\"font-family: Palanquin Dark;\">&#2349;&#2366;&#2352;&#2340; &#2350;&#2375;&#2306; &#2310;&#2352;&#2381;&#2341;&#2367;&#2325; &#2360;&#2369;&#2343;&#2366;&#2352;&#2379;&#2306; &#2325;&#2368; &#2346;&#2381;&#2352;&#2325;&#2381;&#2352;&#2367;&#2351;&#2366; &#2325;&#2367;&#2360; &#2346;&#2306;&#2330;&#2357;&#2352;&#2381;&#2359;&#2368;&#2351; &#2351;&#2379;&#2332;&#2344;&#2366; &#2350;&#2375;&#2306; &#2346;&#2381;&#2352;&#2366;&#2352;&#2306;&#2349; &#2325;&#2368; &#2327;&#2312; &#2341;&#2368; ?</span></p>\\n",
                    options_en: ["<p>Tenth</p>\\n", "<p>Fifth</p>\\n", 
                                "<p>Eighth</p>\\n", "<p>Sixth</p>\\n"],
                    options_hi: ["<p>&#2342;&#2360;&#2357;&#2368;&#2306;</p>\\n", "<p>&#2346;&#2366;&#2306;&#2330;&#2357;&#2368;&#2306;</p>\\n",
                                "<p>&#2310;&#2336;&#2357;&#2368;&#2306;</p>\\n", "<p>&#2331;&#2336;&#2368;&#2306;</p>\\n"],
                    solution_en: "<p>38.(c) <strong>Eighth</strong><span style=\"font-family: Roboto;\"><strong> </strong>(1992 - 1997). First five-year plan (1951 to 1956): Focused on the agricultural growth of the country, It was based on the Harrod-Domar model. Second Five-Year Plan (1956 to 1961): Focused on the industrial growth of the country. Fifth Five-Year Plan (1974 to 1978): Focussed on Garibi Hatao, employment, justice, agricultural production and defense. Sixth five-year plan (1980 to 1985). Tenth five-year plan ( 2002 to 2007). </span></p>\\n",
                    solution_hi: "<p>38.(c) <strong>&#2310;&#2336;&#2357;&#2368;&#2306; </strong><span style=\"font-family: Palanquin;\">(1992 - 1997)&#2404; &#2346;&#2381;&#2352;&#2341;&#2350; &#2346;&#2306;&#2330;&#2357;&#2352;&#2381;&#2359;&#2368;&#2351; &#2351;&#2379;&#2332;&#2344;&#2366; (1951 &#2360;&#2375; 1956): &#2342;&#2375;&#2358; &#2325;&#2375; &#2325;&#2371;&#2359;&#2367; &#2357;&#2367;&#2325;&#2366;&#2360; &#2346;&#2352; &#2325;&#2375;&#2306;&#2342;&#2381;&#2352;&#2367;&#2340;, &#2351;&#2361; &#2361;&#2376;&#2352;&#2379;&#2337;-&#2337;&#2379;&#2350;&#2352; &#2350;&#2377;&#2337;&#2354; &#2346;&#2352; &#2310;&#2343;&#2366;&#2352;&#2367;&#2340; &#2341;&#2368;&#2404; &#2342;&#2370;&#2360;&#2352;&#2368; &#2346;&#2306;&#2330;&#2357;&#2352;&#2381;&#2359;&#2368;&#2351; &#2351;&#2379;&#2332;&#2344;&#2366; (1956 &#2360;&#2375; 1961): &#2311;&#2360;&#2350;&#2375;&#2306; &#2342;&#2375;&#2358; &#2325;&#2375; &#2324;&#2342;&#2381;&#2351;&#2379;&#2327;&#2367;&#2325; &#2357;&#2367;&#2325;&#2366;&#2360; &#2346;&#2352; &#2343;&#2381;&#2351;&#2366;&#2344; &#2325;&#2375;&#2306;&#2342;&#2381;&#2352;&#2367;&#2340; &#2325;&#2367;&#2351;&#2366; &#2327;&#2351;&#2366; &#2341;&#2366;&#2404; &#2346;&#2366;&#2306;&#2330;&#2357;&#2368;&#2306; &#2346;&#2306;&#2330;&#2357;&#2352;&#2381;&#2359;&#2368;&#2351; &#2351;&#2379;&#2332;&#2344;&#2366; (1974 &#2360;&#2375; 1978): &#2327;&#2352;&#2368;&#2348;&#2368; &#2361;&#2335;&#2366;&#2323;, &#2352;&#2379;&#2332;&#2327;&#2366;&#2352;, &#2344;&#2381;&#2351;&#2366;&#2351;, &#2325;&#2371;&#2359;&#2367; &#2313;&#2340;&#2381;&#2346;&#2366;&#2342;&#2344; &#2324;&#2352; &#2352;&#2325;&#2381;&#2359;&#2366; &#2346;&#2352; &#2343;&#2381;&#2351;&#2366;&#2344; &#2325;&#2375;&#2306;&#2342;&#2381;&#2352;&#2367;&#2340; &#2325;&#2367;&#2351;&#2366; &#2327;&#2351;&#2366; &#2341;&#2366;&#2404; &#2331;&#2336;&#2368; &#2346;&#2306;&#2330;&#2357;&#2352;&#2381;&#2359;&#2368;&#2351; &#2351;&#2379;&#2332;&#2344;&#2366; (1980 &#2360;&#2375; 1985)&#2404; &#2342;&#2360;&#2357;&#2368;&#2306; &#2346;&#2306;&#2330;&#2357;&#2352;&#2381;&#2359;&#2368;&#2351; &#2351;&#2379;&#2332;&#2344;&#2366; (2002 &#2360;&#2375; 2007)&#2404;</span></p>\\n",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });

                questions.push({

                    question_en: "<p>40. <span style=\"font-family: Palanquin;\">Who among the following leaders led the Bardoli Satyagraha?</span></p>\\n",

                    options_hi: ["<p>&#2354;&#2366;&#2354;&#2366; &#2354;&#2366;&#2332;&#2346;&#2340; &#2352;&#2366;&#2351;</p>\\n", "<p>&#2350;&#2379;&#2340;&#2368;&#2354;&#2366;&#2354; &#2344;&#2375;&#2361;&#2352;&#2370;</p>\\n",

                    solution_en: "<p>40.(d) <strong>Sardar Vallabhbhai Patel</strong> <span style=\"font-family: Roboto;\">(The Iron Man of India) - First Home Minister and Deputy Prime Minister of India. Bardoli satyagraha (1928) - It was against the increased taxation of farmers by the colonial government. Champaran Satyagraha (1917) - It was against the cultivation of indigo (The first non-violent protest in India by Mahatma Gandhi). Other </span><span style=\"font-family: Roboto;\">movements</span><span style=\"font-family: Roboto;\">:- Khilafat (1919) and Non-cooperation Movement (1920), Quit India Movement (1942), etc.</span></p>\\n",
                    solution_hi: "<p>40.(d) <strong>&#2360;&#2352;&#2342;&#2366;&#2352; &#2357;&#2354;&#2381;&#2354;&#2349;&#2349;&#2366;&#2312; &#2346;&#2335;&#2375;&#2354;</strong> <span style=\"font-family: Palanquin;\">(&#2349;&#2366;&#2352;&#2340; &#2325;&#2375; &#2354;&#2380;&#2361; &#2346;&#2369;&#2352;&#2369;&#2359;) - &#2351;&#2375; &#2349;&#2366;&#2352;&#2340; &#2325;&#2375; &#2346;&#2381;&#2352;&#2341;&#2350; &#2327;&#2371;&#2361; &#2350;&#2306;&#2340;&#2381;&#2352;&#2368; &#2324;&#2352; &#2313;&#2346; &#2346;&#2381;&#2352;&#2343;&#2366;&#2344; &#2350;&#2306;&#2340;&#2381;&#2352;&#2368; &#2341;&#2375;&#2404; <span style=\"font-family: Palanquin Dark;\">&#2348;&#2366;&#2352;&#2342;&#2379;&#2354;&#2368; </span>&#2360;&#2340;&#2381;&#2351;&#2366;&#2327;&#2381;&#2352;&#2361; (1928) - &#2351;&#2361; &#2324;&#2346;&#2344;&#2367;&#2357;&#2375;&#2358;&#2367;&#2325; &#2360;&#2352;&#2325;&#2366;&#2352; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2325;&#2367;&#2360;&#2366;&#2344;&#2379;&#2306; &#2346;&#2352; &#2348;&#2338;&#2364;&#2366;&#2319; &#2327;&#2319; &#2325;&#2352;&#2366;&#2343;&#2366;&#2344; &#2325;&#2375; &#2326;&#2367;&#2354;&#2366;&#2347; &#2341;&#2366;&#2404; &#2330;&#2306;&#2346;&#2366;&#2352;&#2339; &#2360;&#2340;&#2381;&#2351;&#2366;&#2327;&#2381;&#2352;&#2361; (1917) - &#2351;&#2361; &#2344;&#2368;&#2354; &#2325;&#2368; &#2326;&#2375;&#2340;&#2368; &#2325;&#2375; &#2326;&#2367;&#2354;&#2366;&#2347; &#2341;&#2366; (&#2350;&#2361;&#2366;&#2340;&#2381;&#2350;&#2366; &#2327;&#2366;&#2306;&#2343;&#2368; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2349;&#2366;&#2352;&#2340; &#2350;&#2375;&#2306; &#2346;&#2381;&#2352;&#2341;&#2350; &#2309;&#2361;&#2367;&#2306;&#2360;&#2325; &#2357;&#2367;&#2352;&#2379;&#2343;)&#2404; &#2309;&#2344;&#2381;&#2351; &#2310;&#2306;&#2342;&#2379;&#2354;&#2344;:- &#2326;&#2367;&#2354;&#2366;&#2347;&#2340; (1919) &#2324;&#2352; &#2309;&#2360;&#2361;&#2351;&#2379;&#2327; &#2310;&#2306;&#2342;&#2379;&#2354;&#2344; (1920), &#2349;&#2366;&#2352;&#2340; &#2331;&#2379;&#2337;&#2364;&#2379; &#2310;&#2306;&#2342;&#2379;&#2354;&#2344; (1942) &#2310;&#2342;&#2367;&#2404;</span></p>\\n",

                questions.push({

                                "<p>Traders</p>\\n", "<p>Commercial banks</p>\\n"],

                    solution_en: "<p>41.(d) <strong>Commercial banks</strong> <span style=\"font-family: Roboto;\">-</span><span style=\"font-family: Roboto;\"> </span><span style=\"font-family: Roboto;\">These are profit-based institutions that provide financial services like loans, as well as services like deposits, electronic transfers of funds, etc. Other Institution sources of credit in India:- Regional rural banks (RRBs), cooperatives, land development banks. Regional rural banks (RRBs) were set up in 1975 under the recommendations of the Narasimham Committee.</span></p>\\n",
                    solution_hi: "<p>41.(d) <strong>&#2357;&#2366;&#2339;&#2367;&#2332;&#2381;&#2351;&#2367;&#2325; &#2348;&#2376;&#2306;&#2325;</strong> - <span style=\"font-family: Palanquin;\">&#2351;&#2375; &#2354;&#2366;&#2349;-&#2310;&#2343;&#2366;&#2352;&#2367;&#2340; &#2360;&#2306;&#2360;&#2381;&#2341;&#2366;&#2344; &#2361;&#2376;&#2306; &#2332;&#2379; &#2309;&#2346;&#2344;&#2375; &#2327;&#2381;&#2352;&#2366;&#2361;&#2325;&#2379;&#2306; &#2325;&#2379; &#2315;&#2339; &#2332;&#2376;&#2360;&#2368; &#2357;&#2367;&#2340;&#2381;&#2340;&#2368;&#2351; &#2360;&#2375;&#2357;&#2366;&#2323;&#2306; &#2325;&#2375; &#2360;&#2366;&#2341;-&#2360;&#2366;&#2341; &#2332;&#2350;&#2366;, &#2343;&#2344; &#2325;&#2375; &#2311;&#2354;&#2375;&#2325;&#2381;&#2335;&#2381;&#2352;&#2377;&#2344;&#2367;&#2325; &#2361;&#2360;&#2381;&#2340;&#2366;&#2306;&#2340;&#2352;&#2339; &#2310;&#2342;&#2367; &#2332;&#2376;&#2360;&#2368; &#2360;&#2375;&#2357;&#2366;&#2319;&#2306; &#2349;&#2368; &#2346;&#2381;&#2352;&#2342;&#2366;&#2344; &#2325;&#2352;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404; &#2349;&#2366;&#2352;&#2340; &#2350;&#2375;&#2306; &#2315;&#2339; &#2325;&#2375; &#2309;&#2344;&#2381;&#2351; &#2360;&#2306;&#2360;&#2381;&#2341;&#2366;&#2344; &#2360;&#2381;&#2352;&#2379;&#2340;: - &#2325;&#2381;&#2359;&#2375;&#2340;&#2381;&#2352;&#2368;&#2351; &#2327;&#2381;&#2352;&#2366;&#2350;&#2368;&#2339; &#2348;&#2376;&#2306;&#2325; ( RRB), &#2360;&#2361;&#2325;&#2366;&#2352;&#2368; &#2360;&#2350;&#2367;&#2340;&#2367;&#2351;&#2366;&#2306;, &#2349;&#2370;&#2350;&#2367; &#2357;&#2367;&#2325;&#2366;&#2360; &#2348;&#2376;&#2306;&#2325;&#2404; &#2325;&#2381;&#2359;&#2375;&#2340;&#2381;&#2352;&#2368;&#2351; &#2327;&#2381;&#2352;&#2366;&#2350;&#2368;&#2339; &#2348;&#2376;&#2306;&#2325;&#2379;&#2306; (RRBs) &#2325;&#2368; &#2360;&#2381;&#2341;&#2366;&#2346;&#2344;&#2366; 1975 &#2350;&#2375;&#2306; &#2344;&#2352;&#2360;&#2367;&#2350;&#2381;&#2361;&#2350; &#2360;&#2350;&#2367;&#2340;&#2367; &#2325;&#2368; &#2360;&#2367;&#2347;&#2366;&#2352;&#2367;&#2358;&#2379;&#2306; &#2325;&#2375; &#2310;&#2343;&#2366;&#2352; &#2346;&#2352; &#2325;&#2368; &#2327;&#2312; &#2341;&#2368;&#2404;</span></p>\\n",
                    correct: "d",

                                "<p>&#2352;&#2366;&#2332;&#2381;&#2351;&#2346;&#2366;&#2354;</p>\\n", "<p>&#2350;&#2369;&#2326;&#2381;&#2351;&#2350;&#2306;&#2340;&#2381;&#2352;&#2368;</p>\\n"],
                    solution_en: "<p>42.(c) <strong>Governor</strong>. <span style=\"font-family: Roboto;\">The State Election Commission is a constitutional body under Article 243K (Elections to the Panchayats). Article 324 - Superintendence, direction and control of elections to be vested in an Election Commission. Some Other appointments: Chief Justice of India appointed by President, President - Chief Justice of India, Governor - President, Chief Minister - Governor. </span></p>\\n",
                    solution_hi: "<p>42.(c) <strong>&#2352;&#2366;&#2332;&#2381;&#2351;&#2346;&#2366;&#2354;</strong><span style=\"font-family: Palanquin;\">&#2404; &#2352;&#2366;&#2332;&#2381;&#2351; &#2330;&#2369;&#2344;&#2366;&#2357; &#2310;&#2351;&#2379;&#2327; &#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 243K (&#2346;&#2306;&#2330;&#2366;&#2351;&#2340;&#2379;&#2306; &#2325;&#2375; &#2330;&#2369;&#2344;&#2366;&#2357;) &#2325;&#2375; &#2340;&#2361;&#2340; &#2319;&#2325; &#2360;&#2306;&#2357;&#2376;&#2343;&#2366;&#2344;&#2367;&#2325; &#2344;&#2367;&#2325;&#2366;&#2351; &#2361;&#2376;&#2404; &#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 324 - &#2330;&#2369;&#2344;&#2366;&#2357;&#2379;&#2306; &#2325;&#2366; &#2309;&#2343;&#2368;&#2325;&#2381;&#2359;&#2339;, &#2344;&#2367;&#2352;&#2381;&#2342;&#2375;&#2358;&#2344; &#2324;&#2352; &#2344;&#2367;&#2351;&#2306;&#2340;&#2381;&#2352;&#2339; &#2319;&#2325; &#2330;&#2369;&#2344;&#2366;&#2357; &#2310;&#2351;&#2379;&#2327; &#2350;&#2375;&#2306; &#2344;&#2367;&#2361;&#2367;&#2340; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2319;&#2327;&#2366;&#2404; &#2325;&#2369;&#2331; &#2309;&#2344;&#2381;&#2351; &#2344;&#2367;&#2351;&#2369;&#2325;&#2381;&#2340;&#2367;&#2351;&#2366;&#2305;: &#2349;&#2366;&#2352;&#2340; &#2325;&#2375; &#2350;&#2369;&#2326;&#2381;&#2351; &#2344;&#2381;&#2351;&#2366;&#2351;&#2366;&#2343;&#2368;&#2358; &#2325;&#2368; &#2344;&#2367;&#2351;&#2369;&#2325;&#2381;&#2340;&#2367; &#2352;&#2366;&#2359;&#2381;&#2335;&#2381;&#2352;&#2346;&#2340;&#2367; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2325;&#2368; &#2332;&#2366;&#2340;&#2368; &#2361;&#2376;, &#2352;&#2366;&#2359;&#2381;&#2335;&#2381;&#2352;&#2346;&#2340;&#2367; - &#2349;&#2366;&#2352;&#2340; &#2325;&#2375; &#2350;&#2369;&#2326;&#2381;&#2351; &#2344;&#2381;&#2351;&#2366;&#2351;&#2366;&#2343;&#2368;&#2358;, &#2352;&#2366;&#2332;&#2381;&#2351;&#2346;&#2366;&#2354; - &#2352;&#2366;&#2359;&#2381;&#2335;&#2381;&#2352;&#2346;&#2340;&#2367;, &                 questions.push({
                    id: "43",
                    section: "18",
                    question_en: "<p>43. <span style=\"font-family: Palanquin;\">Which scientist revised the nebular hypothesis in 1796?</span></p>\\n",
                    question_hi: "<p>43. <span style=\"font-family: Palanquin Dark;\">1796 &#2350;&#2375;&#2306; &#2325;&#2367;&#2360; &#2357;&#2376;&#2332;&#2381;&#2334;&#2366;&#2344;&#2367;&#2325; &#2344;&#2375; &#2344;&#2368;&#2361;&#2366;&#2352;&#2367;&#2325;&#2366; - &#2346;&#2352;&#2367;&#2325;&#2354;&#2381;&#2346;&#2344;&#2366; (nebular hypothesis) &#2325;&#2379; &#2360;&#2306;&#2358;&#2379;&#2343;&#2367;&#2340; &#2325;&#2367;&#2351;&#2366;?</span></p>\\n",
                    options_en: ["<p>Neville Chamberlain</p>\\n", "<p>Edwin Hubble</p>\\n", 
                                "<p>Pierre Laplace</p>\\n", "<p>Harold Jeffrey</p>\\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&#2344;&#2375;&#2357;&#2367;&#2354; &#2330;&#2375;&#2350;&#2381;&#2348;&#2352;&#2354;&#2375;&#2344; (Neville Chamberlain)</span></p>\\n", "<p><span style=\"font-weight: 400;\">&#2317;&#2337;&#2357;&#2367;&#2344; &#2361;&#2348;&#2354; (Edwin Hubble)</span></p>\\n",
                                "<p><span style=\"font-weight: 400;\">&#2346;&#2367;&#2351;&#2352;&#2375; &#2354;&#2366;&#2346;&#2381;&#2354;&#2366;&#2360; (Pierre Laplace)</span></p>\\n", "<p><span style=\"font-weight: 400;\">&nbsp;&#2361;&#2375;&#2352;&#2379;&#2354;&#2381;&#2337; &#2332;&#2375;&#2347;&#2352;&#2368; (Harold Jeffrey)</span></p>\\n"],
                    solution_en: "<p>43.(c) <strong>Pierre Laplace</strong> - <span style=\"font-family: Roboto;\">He formulated </span><strong><span style=\"font-family: Roboto;\">Laplace\'s equation</span></strong><span style=\"font-family: Roboto;\">, and pioneered the Laplace transform which appears in many branches of mathematical physics </span><span style=\"font-family: Roboto;\">and also</span><span style=\"font-family: Roboto;\"> the first scientist to suggest an idea similar to that of a black hole. </span><span style=\"font-family: Roboto;\"><strong>Nebular hypothesis</strong> </span><span style=\"font-family: Roboto;\">- The formation of our solar system from a nebula cloud made from a collection of dust and gas. The Big Bang Theory about the expansion of the Universe was proposed by Georges Lemaitre. </span></p>\\n",
                    solution_hi: "<p>43.(c) <strong>&#2346;&#2367;&#2351;&#2352;&#2375; &#2354;&#2366;&#2346;&#2381;&#2354;&#2366;&#2360;</strong> - <span style=\"font-family: Palanquin;\">&#2311;&#2344;&#2381;&#2361;&#2379;&#2344;&#2375; </span><span style=\"font-family: Palanquin;\"><strong>&#2354;&#2366;&#2346;&#2381;&#2354;&#2366;&#2360; &#2325;&#2366; &#2360;&#2350;&#2368;&#2325;&#2352;&#2339;</strong> </span><span style=\"font-family: Palanquin;\">&#2340;&#2376;&#2351;&#2366;&#2352; &#2325;&#2367;&#2351;&#2366;, &#2324;&#2352; &#2354;&#2366;&#2346;&#2381;&#2354;&#2366;&#2360; &#2346;&#2352;&#2367;&#2357;&#2352;&#2381;&#2340;&#2344; &#2325;&#2366; &#2344;&#2375;&#2340;&#2371;&#2340;&#2381;&#2357; &#2325;&#2367;&#2351;&#2366; &#2332;&#2379; &#2325;&#2367; &#2346;&#2381;&#2354;&#2366;&#2360;&#2381;&#2335;&#2352; &#2346;&#2381;&#2354;&#2377;&#2335;&#2381;&#2360; &#2325;&#2368; &#2325;&#2312; &#2358;&#2366;&#2326;&#2366;&#2323;&#2306; &#2350;&#2375;&#2306; &#2342;&#2367;&#2326;&#2366;&#2312; &#2342;&#2375;&#2340;&#2366; &#2361;&#2376; &#2340;&#2341;&#2366; &#2351;&#2375; &#2348;&#2381;&#2354;&#2376;&#2325; &#2361;&#2379;&#2354; &#2325;&#2375; &#2360;&#2350;&#2366;&#2344; &#2357;&#2367;&#2330;&#2366;&#2352; &#2325;&#2366; &#2360;&#2369;&#2333;&#2366;&#2357; &#2342;&#2375;&#2344;&#2375; &#2357;&#2366;&#2354;&#2375; &#2346;&#2381;&#2352;&#2341;&#2350; &#2357;&#2376;&#2332;&#2381;&#2334;&#2366;&#2344;&#2367;&#2325; &#2349;&#2368; &#2341;&#2375;&#2404; </span><strong><span style=\"font-family: Palanquin;\">&#2344;&#2367;&#2361;&#2366;&#2352;&#2367;&#2325;&#2366; &#2346;&#2352;&#2367;&#2325;&#2354;&#2381;&#2346;&#2344;&#2366;</span></strong><span style=\"font-family: Palanquin;\"> (Nebular hypothesis)- &#2361;&#2350;&#2366;&#2352;&#2375; &#2360;&#2380;&#2352; &#2350;&#2306;&#2337;&#2354; &#2325;&#2366; &#2344;&#2367;&#2352;&#2381;&#2350;&#2366;&#2339; &#2343;&#2370;&#2354; &#2324;&#2352; &#2327;&#2376;&#2360; &#2325;&#2375; &#2360;&#2306;&#2327;&#2381;&#2352;&#2361; &#2360;&#2375; &#2348;&#2344;&#2375; &#2344;&#2367;&#2361;&#2366;&#2352;&#2367;&#2325;&#2366; &#2348;&#2366;&#2342;&#2354; &#2360;&#2375; &#2361;&#2369;&#2310; &#2361;&#2376;&#2404; &#2348;&#2381;&#2352;&#2361;&#2381;&#2350;&#2366;&#2306;&#2337; &#2325;&#2375; &#2357;&#2367;&#2360;&#2381;&#2340;&#2366;&#2352; &#2325;&#2375; &#2348;&#2366;&#2352;&#2375; &#2350;&#2375;&#2306; &#2348;&#2367;&#2327; &#2348;&#2376;&#2306;&#2327; &#2360;&#2367;&#2342;&#2381;&#2343;&#2366;&#2306;&#2340; &#2332;&#2377;&#2352;&#2381;&#2332;&#2375;&#2360; &#2354;&#2375;&#2350;&#2376;&#2340;&#2381;&#2352;&#2375; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2346;&#2381;&#2352;&#2360;&#2381;&#2340;&#2366;&#2357;&#2367;&#2340; &#2325;&#2367;&#2351;&#2366; &#2327;&#2351;&#2366; &#2341;&#2366;&#2404;</span></p>\\n",
                    correct: "c",

                    solution_en: "<p>44.(d) <strong>Ranjitsinh <span style=\"font-family: Roboto;\">Disale</span></strong><span style=\"font-family: Roboto;\"> - </span><span style=\"font-family: Roboto;\">He is a primary teacher from Solapur (Maharashtra) who won the Global Teacher Prize in 2020. </span><strong><span style=\"font-family: Roboto;\">World Bank</span></strong><span style=\"font-family: Roboto;\">: An international financial institution that provides loans and grants to the governments of low- and middle-income countries for the purpose of pursuing capital projects. Established - July 1944, Headquarters - Washington, D.C. President - Ajay Banga (As of July 2023).</span></p>\\n",

                questions.push({
                    id: "45",
                    section: "18",
                    question_en: "<p>45. <span style=\"font-family: Palanquin;\">Which region has the maximum concentration of iron and steel industries in India?</span></p>\\n",
                    question_hi: "<p>45. <span style=\"font-family: Palanquin Dark;\">&#2349;&#2366;&#2352;&#2340; &#2350;&#2375;&#2306; &#2354;&#2380;&#2361; &#2324;&#2352; &#2311;&#2360;&#2381;&#2346;&#2366;&#2340; &#2313;&#2342;&#2381;&#2351;&#2379;&#2327;&#2379;&#2306; &#2325;&#2366; &#2360;&#2352;&#2381;&#2357;&#2366;&#2343;&#2367;&#2325; &#2360;&#2306;&#2325;&#2375;&#2306;&#2342;&#2381;&#2352;&#2339; &#2325;&#2367;&#2360; &#2325;&#2381;&#2359;&#2375;&#2340;&#2381;&#2352; &#2350;&#2375;&#2306; &#2361;&#2376;?</span></p>\\n",
                    options_en: ["<p>Deccan Plateau</p>\\n", "<p>Malwa Plateau</p>\\n", 
                                "<p>Chhota Nagpur plateau</p>\\n", "<p>Chhattisgarh Plateau</p>\\n"],
                    options_hi: ["<p>&#2342;&#2325;&#2381;&#2325;&#2344; &#2325;&#2366; &#2346;&#2336;&#2366;&#2352;</p>\\n", "<p>&#2350;&#2366;&#2354;&#2357;&#2366; &#2325;&#2366; &#2346;&#2336;&#2366;&#2352;</p>\\n",
                                "<p>&#2331;&#2379;&#2335;&#2366; &#2344;&#2366;&#2327;&#2346;&#2369;&#2352; &#2325;&#2366; &#2346;&#2336;&#2366;&#2352;</p>\\n", "<p>&#2331;&#2340;&#2381;&#2340;&#2368;&#2360;&#2327;&#2397; &#2325;&#2366; &#2346;&#2336;&#2366;&#2352;</p>\\n"],
                    solution_en: "<p>45.(c) <strong>Chota Nagpur plateau</strong> <span style=\"font-family: Roboto;\">- This plateau is mostly made up of Gondwana rocks. The Damodar River flows through the center of this region, forming a rift valley from west to east. </span><strong><span style=\"font-family: Roboto;\">Deccan </span></strong><span style=\"font-family: Roboto;\">Plateau - It covers most of the southern part of the country and extends into parts of central India. </span><strong><span style=\"font-family: Roboto;\">Malwa </span></strong><span style=\"font-family: Roboto;\">Plateau - It is bounded by the Madhya Bharat Plateau and Bundelkhand Upland to the north, the Vindhya Range to the east and south, and the Gujarat Plains to the west. </span></p>\\n",
                    solution_hi: "<p>45.(c) <strong>&#2331;&#2379;&#2335;&#2366; &#2344;&#2366;&#2327;&#2346;&#2369;&#2352; &#2346;&#2336;&#2366;&#2352;</strong><span style=\"font-family: Palanquin;\"> - &#2351;&#2361; &#2346;&#2336;&#2366;&#2352; &#2350;&#2369;&#2326;&#2381;&#2351;&#2340;&#2307; &#2327;&#2379;&#2306;&#2337;&#2357;&#2366;&#2344;&#2366; &#2330;&#2335;&#2381;&#2335;&#2366;&#2344;&#2379;&#2306; &#2360;&#2375; &#2348;&#2344;&#2366; &#2361;&#2376;&#2404; &#2342;&#2366;&#2350;&#2379;&#2342;&#2352; &#2344;&#2342;&#2368; &#2311;&#2360; &#2325;&#2381;&#2359;&#2375;&#2340;&#2381;&#2352; &#2325;&#2375; &#2350;&#2343;&#2381;&#2351; &#2360;&#2375; &#2361;&#2379;&#2325;&#2352; &#2348;&#2361;&#2340;&#2368; &#2361;&#2376;, &#2332;&#2379; &#2346;&#2358;&#2381;&#2330;&#2367;&#2350; &#2360;&#2375; &#2346;&#2370;&#2352;&#2381;&#2357; &#2325;&#2368; &#2323;&#2352; &#2319;&#2325; &#2349;&#2381;&#2352;&#2306;&#2358; &#2328;&#2366;&#2335;&#2368; &#2325;&#2366; &#2344;&#2367;&#2352;&#2381;&#2350;&#2366;&#2339; &#2325;&#2352;&#2340;&#2368; &#2361;&#2376;&#2404; </span><strong><span style=\"font-family: Palanquin;\">&#2342;&#2325;&#2381;&#2325;&#2344; </span></strong><span style=\"font-family: Palanquin;\">&#2325;&#2366; &#2346;&#2336;&#2366;&#2352; - &#2351;&#2361; &#2342;&#2375;&#2358; &#2325;&#2375; &#2309;&#2343;&#2367;&#2325;&#2366;&#2306;&#2358; &#2342;&#2325;&#2381;&#2359;&#2367;&#2339;&#2368; &#2349;&#2366;&#2327; &#2325;&#2379; &#2325;&#2357;&#2352; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376; &#2324;&#2352; &#2350;&#2343;&#2381;&#2351; &#2349;&#2366;&#2352;&#2340; &#2325;&#2375; &#2325;&#2369;&#2331; &#2361;&#2367;&#2360;&#2381;&#2360;&#2379;&#2306; &#2340;&#2325; &#2347;&#2376;&#2354;&#2366; &#2361;&#2369;&#2310; &#2361;&#2376;&#2404; </span><strong><span style=\"font-family: Palanquin;\">&#2350;&#2366;&#2354;&#2357;&#2366; </span></strong><span style=\"font-family: Palanquin;\">&#2325;&#2366; &#2346;&#2336;&#2366;&#2352; - &#2351;&#2361; &#2313;&#2340;&#2381;&#2340;&#2352; &#2350;&#2375;&#2306; &#2350;&#2343;&#2381;&#2351; &#2349;&#2366;&#2352;&#2340; &#2346;&#2336;&#2366;&#2352; &#2324;&#2352; &#2348;&#2369;&#2344;&#2381;&#2342;&#2375;&#2354;&#2326;&#2339;&#2381;&#2337; &#2313;&#2346;&#2349;&#2370;&#2350;&#2367;, &#2346;&#2370;&#2352;&#2381;&#2357; &#2324;&#2352; &#2342;&#2325;&#2381;&#2359;&#2367;&#2339; &#2350;&#2375;&#2306; &#2357;&#2367;&#2306;&#2343;&#2381;&#2351; &#2346;&#2352;&#2381;&#2357;&#2340;&#2350;&#2366;&#2354;&#2366; &#2324;&#2352; &#2346;&#2358;&#2381;&#2330;&#2367;&#2350; &#2350;&#2375;&#2306; &#2327;&#2369;&#2332;&#2352;&#2366;&#2340; &#2325;&#2375; &#2350;&#2376;&#2342;&#2366;&#2344; &#2360;&#2375; &#2328;&#2367;&#2352;&#2366; &#2361;&#2376;&#2404;</span></p>\\n",
                    correct: "c",

                questions.push({
                    id: "46",
                    section: "18",
                    question_en: "<p>46. <span style=\"font-family: Palanquin;\">The Indian Railways on October 7, 2021, launched and operated two long-haul freight trains named _____________, to provide a very effective solution to the problem of capacity constraints in critical rail sections.</span></p>\\n",
                    question_hi: "<p>46. 7 <span style=\"font-family: Palanquin Dark;\">&#2309;&#2325;&#2381;&#2335;&#2370;&#2348;&#2352;, 2021 &#2325;&#2379; &#2349;&#2366;&#2352;&#2340;&#2368;&#2351; &#2352;&#2375;&#2354;&#2357;&#2375; &#2344;&#2375; &#2350;&#2361;&#2340;&#2381;&#2357;&#2346;&#2370;&#2352;&#2381;&#2339; &#2352;&#2375;&#2354; &#2326;&#2306;&#2337;&#2379;&#2306; &#2350;&#2375;&#2306; &#2325;&#2381;&#2359;&#2350;&#2340;&#2366; &#2325;&#2368; &#2325;&#2350;&#2368; &#2325;&#2368; &#2360;&#2350;&#2360;&#2381;&#2351;&#2366; &#2325;&#2366; &#2319;&#2325; &#2348;&#2361;&#2369;&#2340; &#2346;&#2381;&#2352;&#2349;&#2366;&#2357;&#2368; &#2360;&#2350;&#2366;&#2343;&#2366;&#2344; &#2346;&#2381;&#2352;&#2342;&#2366;&#2344; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; _______</span><span style=\"font-family: Palanquin Dark;\">&#2344;&#2366;&#2350; &#2325;&#2368; &#2342;&#2379; &#2354;&#2306;&#2348;&#2368; &#2342;&#2370;&#2352;&#2368; &#2325;&#2368; &#2350;&#2366;&#2354;&#2327;&#2366;&#2337;&#2364;&#2367;&#2351;&#2379;&#2306; &#2325;&#2366; &#2358;&#2369;&#2349;&#2366;&#2352;&#2306;&#2349; &#2324;&#2352; &#2360;&#2306;&#2330;&#2366;&#2354;&#2344; &#2325;&#2367;&#2351;&#2366;&#2404; </span><span style=\"font-family: Palanquin Dark;\"> </span></p>\\n",
                    options_en: ["<p>Himalaya and Thar</p>\\n", "<p>Aakash and Vijay</p>\\n", 
                                "<p>Sagar and Prithvi</p>\\n", "<p>Trishul and Garuda</p>\\n"],
                    options_hi: ["<p>&#2361;&#2367;&#2350;&#2366;&#2354;&#2351; &#2324;&#2352; &#2341;&#2366;&#2352;</p>\\n", "<p>&#2310;&#2325;&#2366;&#2358; &#2324;&#2352; &#2357;&#2367;&#2332;&#2351;</p>\\n",
                                "<p>&#2360;&#2366;&#2327;&#2352; &#2324;&#2352; &#2346;&#2371;&#2341;&#2381;&#2357;&#2368;</p>\\n", "<p>&#2340;&#2381;&#2352;&#2367;&#2358;&#2370;&#2354; &#2324;&#2352; &#2327;&#2352;&#2369;&#2337;&#2364;</p>\\n"],
                    solution_en: "<p>46.(d) <strong>Trishul and Garuda.</strong><span style=\"font-family: Roboto;\"> Long haul trains, which are twice or multiple times longer than the normal composition of freight trains. </span><strong><span style=\"font-family: Roboto;\">Trishul </span></strong><span style=\"font-family: Roboto;\">is SCR\'s (South-Central Railway) first long haul comprising three freight trains. The train </span><span style=\"font-family: Roboto;\">\'<strong>Garuda</strong>\' </span><span style=\"font-family: Roboto;\">was launched from Raichur of Guntakal division to Manuguru of Secunderabad division. The Indian Railway System has 70 Divisions and 19 Zones.</span></p>\\n",
                    solution_hi: "<p>46.(d) <strong>&#2340;&#2381;&#2352;&#2367;&#2358;&#2370;&#2354; &#2324;&#2352; &#2327;&#2352;&#2369;&#2337;&#2364;</strong>&#2404;<span style=\"font-family: Palanquin;\"> &#2351;&#2375; &#2354;&#2306;&#2348;&#2368; &#2342;&#2370;&#2352;&#2368; &#2325;&#2368; &#2352;&#2375;&#2354;&#2327;&#2366;&#2337;&#2364;&#2367;&#2351;&#2366;&#2305; &#2361;&#2376;, &#2332;&#2379; &#2350;&#2366;&#2354;&#2327;&#2366;&#2337;&#2364;&#2367;&#2351;&#2379;&#2306; &#2325;&#2368; &#2360;&#2366;&#2350;&#2366;&#2344;&#2381;&#2351; &#2360;&#2306;&#2352;&#2330;&#2344;&#2366; &#2360;&#2375; &#2342;&#2379;&#2327;&#2369;&#2344;&#2368; &#2351;&#2366; &#2325;&#2312; &#2327;&#2369;&#2344;&#2366; &#2354;&#2306;&#2348;&#2368; &#2361;&#2379;&#2340;&#2368; &#2361;&#2376;&#2306;&#2404; </span><strong><span style=\"font-family: Palanquin;\">&#2340;&#2381;&#2352;&#2367;&#2358;&#2370;&#2354; </span></strong><span style=\"font-family: Palanquin;\">SCR (&#2342;&#2325;&#2381;&#2359;&#2367;&#2339;-&#2350;&#2343;&#2381;&#2351; &#2352;&#2375;&#2354;&#2357;&#2375;) &#2325;&#2368; &#2346;&#2381;&#2352;&#2341;&#2350; &#2354;&#2306;&#2348;&#2368; &#2342;&#2370;&#2352;&#2368; &#2325;&#2368; &#2335;&#2381;&#2352;&#2375;&#2344; &#2361;&#2376; &#2332;&#2367;&#2360;&#2350;&#2375;&#2306; &#2340;&#2368;&#2344; &#2350;&#2366;&#2354;&#2327;&#2366;&#2337;&#2364;&#2367;&#2351;&#2366;&#2306; &#2358;&#2366;&#2350;&#2367;&#2354; &#2361;&#2376;&#2306;&#2404; &#2335;&#2381;&#2352;&#2375;&#2344; </span><span style=\"font-family: Palanquin;\">\'<strong>&#2327;&#2352;&#2369;&#2337;&#2364;</strong>\' </span><span style=\"font-family: Palanquin;\">&#2325;&#2379; &#2327;&#2369;&#2306;&#2340;&#2325;&#2354; &#2337;&#2367;&#2357;&#2368;&#2332;&#2344; &#2325;&#2375; &#2352;&#2366;&#2351;&#2330;&#2370;&#2352; &#2360;&#2375; &#2360;&#2367;&#2325;&#2306;&#2342;&#2352;&#2366;&#2348;&#2366;&#2342; &#2337;&#2367;&#2357;&#2368;&#2332;&#2344; &#2325;&#2375; &#2350;&#2344;&#2369;&#2327;&#2369;&#2352;&#2369; &#2340;&#2325; &#2358;&#2369;&#2352;&#2370; &#2325;&#2367;&#2351;&#2366; &#2327;&#2351;&#2366; &#2341;&#2366;&#2404; &#2349;&#2366;&#2352;&#2340;&#2368;&#2351; &#2352;&#2375;&#2354;&#2357;&#2375; &#2346;&#2381;&#2352;&#2339;&#2366;&#2354;&#2368; &#2350;&#2375;&#2306; 70 &#2350;&#2306;&#2337;&#2354; &#2324;&#2352; 19 &#2332;&#2379;&#2344; &#2361;&#2376;&#2306;&#2404;</span></p>\\n",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "47",
                    section: "18",
                    question_en: "<p>47. <span style=\"font-family: Palanquin;\">Maximum how many overs can a bowler bowl in ODI cricket matches?</span></p>\\n",
                    question_hi: "<p>47. <span style=\"font-family: Palanquin Dark;\">&#2319;&#2325;&#2342;&#2367;&#2357;&#2360;&#2368;&#2351; &#2325;&#2381;&#2352;&#2367;&#2325;&#2375;&#2335; &#2350;&#2376;&#2330; &#2350;&#2375;&#2306; &#2319;&#2325; &#2327;&#2375;&#2306;&#2342;&#2348;&#2366;&#2332; &#2309;&#2343;&#2367;&#2325;&#2340;&#2350; &#2325;&#2367;&#2340;&#2344;&#2375; &#2323;&#2357;&#2352; &#2347;&#2375;&#2306;&#2325; &#2360;&#2325;&#2340;&#2366; &#2361;&#2376;?</span></p>\\n",
                    options_en: ["<p>11</p>\\n", "<p>9</p>\\n", 
                                "<p>10</p>\\n", "<p>8</p>\\n"],
                    options_hi: ["<p>11</p>\\n", "<p>9</p>\\n",
                                "<p>10</p>\\n", "<p>8</p>\\n"],
                    solution_en: "<p>47.(c) <strong>10</strong>. <span style=\"font-family: Roboto;\">The minimum number of bowlers in a 50 over ODI match has to be 5. The maximum number of overs per bowler in T20 Cricket is 4. Breaks between sessions (test cricket match) - 40 minutes for Lunch, and 20 minutes for Tea. The first ODI was played on </span><span style=\"font-family: Roboto;\"><strong>5 January 1971</strong> </span><span style=\"font-family: Roboto;\">between Australia and England at the Melbourne Cricket Ground.</span></p>\\n",
                    solution_hi: "<p>47.(c) <strong>10 </strong><span style=\"font-family: Palanquin;\">&#2404; 50 &#2323;&#2357;&#2352; &#2325;&#2375; &#2357;&#2344;&#2337;&#2375; &#2350;&#2376;&#2330; &#2350;&#2375;&#2306; &#2327;&#2375;&#2306;&#2342;&#2348;&#2366;&#2332;&#2379;&#2306; &#2325;&#2368; &#2344;&#2381;&#2351;&#2370;&#2344;&#2340;&#2350; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366; 5 &#2361;&#2379;&#2344;&#2368; &#2330;&#2366;&#2361;&#2367;&#2319;&#2404; T20 &#2325;&#2381;&#2352;&#2367;&#2325;&#2375;&#2335; &#2350;&#2375;&#2306; &#2346;&#2381;&#2352;&#2340;&#2367; &#2327;&#2375;&#2306;&#2342;&#2348;&#2366;&#2332; &#2323;&#2357;&#2352;&#2379;&#2306; &#2325;&#2368; &#2309;&#2343;&#2367;&#2325;&#2340;&#2350; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366; 4 &#2361;&#2376;&#2404; &#2360;&#2340;&#2381;&#2352;&#2379;&#2306; &#2325;&#2375; &#2348;&#2368;&#2330; &#2325;&#2366; &#2348;&#2381;&#2352;&#2375;&#2325; (&#2335;&#2375;&#2360;&#2381;&#2335; &#2325;&#2381;&#2352;&#2367;&#2325;&#2375;&#2335; &#2350;&#2376;&#2330;) - &#2342;&#2379;&#2346;&#2361;&#2352; &#2325;&#2375; &#2349;&#2379;&#2332;&#2344; &#2325;&#2375; &#2354;&#2367;&#2319; 40 &#2350;&#2367;&#2344;&#2335; &#2324;&#2352; &#2330;&#2366;&#2351; &#2325;&#2375; &#2354;&#2367;&#2319; 20 &#2350;&#2367;&#2344;&#2335;&#2404; &#2346;&#2381;&#2352;&#2341;&#2350; &#2357;&#2344;&#2337;&#2375; &#2350;&#2376;&#2330; </span><span style=\"font-family: Palanquin;\"><strong>5 &#2332;&#2344;&#2357;&#2352;&#2368; 1971</strong> </span><span style=\"font-family: Palanquin;\">&#2325;&#2379; &#2321;&#2360;&#2381;&#2335;&#2381;&#2352;&#2375;&#2354;&#2367;&#2351;&#2366; &#2324;&#2352; &#2311;&#2306;&#2327;&#2381;&#2354;&#2376;&#2306;&#2337; &#2325;&#2375; &#2348;&#2368;&#2330; &#2350;&#2375;&#2354;&#2348;&#2352;&#2381;&#2344; &#2325;&#2381;&#2352;&#2367;&#2325;&#2375;&#2335; &#2327;&#2381;&#2352;&#2366;&#2313;&#2306;&#2337; &#2346;&#2352; &#2326;&#2375;&#2354;&#2366; &#2327;&#2351;&#2366; &#2341;&#2366;&#2404;</span></p>\\n",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({

                    solution_en: "<p>49.(d) <strong>Sayyid Ahmad Khan</strong>. <span style=\"font-family: Roboto;\">He established the Mohammedan Anglo-Oriental College (also known as Aligarh Muslim University) at Aligarh in 1875. Mirza Ghulam Ahmad - Founder of the Ahmadiyya movement. Abdul Gaffar Khan (also known as Frontier Gandhi) - Founder of the Khudai Khidmatgar movement (1929). Muhammad Allama Iqbal wrote the famous song \'</span><span style=\"font-family: Roboto;\">Saare</span><span style=\"font-family: Roboto;\"> jahan se achha\'. He is also known for giving birth to the \'idea of Pakistan\'.</span></p>\\n",

                    solution_en: "<p>50.(c) <strong>Boron, silicon, antimony. Metalloids</strong> - <span style=\"font-family: Roboto;\">Chemical elements whose physical and chemical properties fall in between the metal and non-metal categories</span><span style=\"font-family: Roboto;\">. </span><span style=\"font-family: Roboto;\">Seven most widely recognized metalloids - Boron, germanium, silicon, antimony, arsenic, tellurium and polonium. Properties: Shiny, brittle solids with intermediate to relatively good electrical conductivity and the electronic band structure of a semimetal (semiconductor).</span></p>\\n",

                    question_hi: "<p>51. <span style=\"font-family: Palanquin Dark;\">&#2351;&#2342;&#2367; &#2342;&#2379; &#2360;&#2350;&#2352;&#2370;&#2346; &#2340;&#2381;&#2352;&#2367;&#2349;&#2369;&#2332;&#2379;&#2306; &#2325;&#2375; &#2325;&#2381;&#2359;&#2375;&#2340;&#2381;&#2352;&#2347;&#2354;&#2379;&#2306; &#2325;&#2366; &#2309;&#2344;&#2369;&#2346;&#2366;&#2340; 196 : 625 &#2361;&#2376;, &#2340;&#2379; &#2360;&#2306;&#2327;&#2340; &#2349;&#2369;&#2332;&#2366;&#2323;&#2306; &#2325;&#2366; &#2309;&#2344;&#2369;&#2346;&#2366;&#2340; &#2325;&#2381;&#2351;&#2366; &#2361;&#2379;&#2327;&#2366;?</span></p>\\n",

><mo>&nbsp;</mo></msqrt><mo>&nbsp;</mo><mo>:</mo><mo>&nbsp;</mo><msqrt><mo>&nbsp;</mo><mn>625</mn></msqrt></math> </span><span style=\"font-family: Palanquin Dark;\"> </span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">= 14 : 25</span></p>\\n",

                    options_hi: ["<p>&#8377;2,000</p>\\n", "<p>&#8377;1,800</p>\\n",

                    solution_en: "<p>56.(c)</p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Let , the profit earned by selling the article at 2000 &#8377; be x </span><span style=\"font-family: Palanquin Dark;\">Rs.</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Then , according to the question , </span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Cost Price = 2000 - x </span><span style=\"font-family: Palanquin Dark;\">= 1200 + x</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">x = 400 &#8377;</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Cost price = 2000 -&nbsp; x&nbsp;</span><span style=\"font-family: Palanquin Dark;\"> </span><span style=\"font-family: Palanquin Dark;\"> = 1600 &#8377;</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Required price at which 20% profit gained = </span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">1600 &times;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>6</mn><mn>5</mn></mfrac></math></span><span style=\"font-family: Palanquin Dark;\"> = 1920 &#8377;</span></p>\\n",

                questions.push({
                    id: "60",
                    section: "17",
                    question_en: "<p>60. <span style=\"font-family: Palanquin Dark;\">A policeman follows a thief who is 600 m ahead of the policeman. If the policeman and the thief run at speeds of 10 km/h and 8 km/h, respectively, in how much time (in minutes), will the policeman catch the thief?</span></p>\\n",
                    question_hi: "<p>60. <span style=\"font-family: Palanquin Dark;\">&#2319;&#2325; &#2346;&#2369;&#2354;&#2367;&#2360;&#2325;&#2352;&#2381;&#2350;&#2368; &#2319;&#2325; &#2330;&#2379;&#2352; &#2325;&#2366; &#2346;&#2368;&#2331;&#2366; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376; &#2332;&#2379; &#2346;&#2369;&#2354;&#2367;&#2360;&#2325;&#2352;&#2381;&#2350;&#2368; &#2360;&#2375; 600 m &#2310;&#2327;&#2375; &#2361;&#2376;&#2404; &#2351;&#2342;&#2367; &#2346;&#2369;&#2354;&#2367;&#2360;&#2325;&#2352;&#2381;&#2350;&#2368; &#2324;&#2352; &#2330;&#2379;&#2352; &#2325;&#2381;&#2352;&#2350;&#2358;: 10 km/h &#2324;&#2352; 8 km/h &#2325;&#2368; &#2330;&#2366;&#2354; &#2360;&#2375; &#2342;&#2380;&#2337;&#2364;&#2340;&#2375; &#2361;&#2376;&#2306;, &#2340;&#2379; &#2346;&#2369;&#2354;&#2367;&#2360;&#2325;&#2352;&#2381;&#2350;&#2368; &#2325;&#2367;&#2340;&#2344;&#2375; &#2360;&#2350;&#2351; (&#2350;&#2367;&#2344;&#2335; &#2350;&#2375;&#2306;) &#2350;&#2375;&#2306; &#2330;&#2379;&#2352; &#2325;&#2379; &#2346;&#2325;&#2337;&#2364; &#2354;&#2375;&#2327;&#2366;?</span></p>\\n",
                    options_en: ["<p>16</p>\\n", "<p>14</p>\\n", 
                                "<p>18</p>\\n", "<p>12</p>\\n"],
                    options_hi: ["<p>16</p>\\n", "<p>14</p>\\n",
                                "<p>18</p>\\n", "<p>12</p>\\n"],
                    solution_en: "<p>60.(c)</p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Distance between policeman and thief = 600 m</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Speed of policeman = 10 km/hr</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Speed of thief = 8 km/hr</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Their relative speed = (10 - </span><span style=\"font-family: Palanquin Dark;\">8) = 2 km/hr</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Required time when policeman caught thief =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>0</mn><mo>.</mo><mn>6</mn><mo>&nbsp;</mo><mi>k</mi><mi>m</mi></mrow><mrow><mn>2</mn><mo>&nbsp;</mo><mi>k</mi><mi>m</mi><mo>/</mo><mi>h</mi><mi>r</mi></mrow></mfrac></math></span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">= 0.3 hr = 18 minutes</span></p>\\n",
                    solution_hi: "<p>60.(c)</p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">&#2346;&#2369;&#2354;&#2367;&#2360;&#2325;&#2352;&#2381;&#2350;&#2368; &#2324;&#2352; &#2330;&#2379;&#2352; &#2325;&#2375; &#2348;&#2368;&#2330; &#2325;&#2368; &#2342;&#2370;&#2352;&#2368; = 600 &#2350;&#2368;&#2335;&#2352;</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">&#2346;&#2369;&#2354;&#2367;&#2360;&#2325;&#2352;&#2381;&#2350;&#2368; &#2325;&#2368; &#2327;&#2340;&#2367; = 10 &#2325;&#2367;&#2350;&#2368;/&#2328;&#2306;&#2335;&#2366;</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">&#2330;&#2379;&#2352; &#2325;&#2368; &#2327;&#2340;&#2367; = 8 &#2325;&#2367;&#2350;&#2368;/&#2328;&#2306;&#2335;&#2366;</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">&#2313;&#2344;&#2325;&#2368; &#2360;&#2366;&#2346;&#2375;&#2325;&#2381;&#2359; &#2327;&#2340;&#2367; = (10 - </span><span style=\"font-family: Palanquin Dark;\">8) = 2 &#2325;&#2367;&#2350;&#2368;/&#2328;&#2306;&#2335;&#2366;</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">&#2346;&#2369;&#2354;&#2367;&#2360;&#2325;&#2352;&#2381;&#2350;&#2368; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2330;&#2379;&#2352; &#2325;&#2379; &#2346;&#2325;&#2337;&#2364;&#2344;&#2375; &#2350;&#2375;&#2306; &#2354;&#2327;&#2366; &#2310;&#2357;&#2358;&#2381;&#2351;&#2325; &#2360;&#2350;&#2351; =&nbsp;<math style=\"font-family:Verdana\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mfrac><mrow><mn>0</mn><mo>.</mo><mn>6</mn><mo>&nbsp;</mo><mi>&#2325;&#2367;&#2350;&#2368;</mi></mrow><mrow><mn>2</mn><mo>&nbsp;</mo><mi>&#2325;&#2367;&#2350;&#2368;</mi><mo>/</mo><mi>&#2328;&#2306;&#2335;&#2366;</mi></mrow></mfrac></math> </span><span style=\"font-family: Palanquin Dark;\">= 0.3 &#2328;&#2306;&#2335;&#2366; = 18 &#2350;&#2367;&#2344;&#2335;</span></p>\\n",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5

                questions.push({
                    id: "61",

                    question_en: "<p>61. <span style=\"font-family: Palanquin Dark;\">Which of the following numbers is divisible by 36?</span></p>\\n",

                                "<p>54732</p>\\n", "<p>87064</p>\\n"],
                    options_hi: ["<p>47502</p>\\n", "<p>29412</p>\\n",
                                "<p>54732</p>\\n", "<p>87064</p>\\n"],
                    solution_en: "<p>61.(b)</p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Given numbers are 47502 , 29412 , 54732 and 87064 .</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">A number divisible by 36 , only when it is divisible by 9 and 4.</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Divisibility of 4 :- last two digits of given no. must be divisible by 4</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Divisibility of 9 :- sum of digits of given no. must be divisible by 9</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">47502 - not divisible by 4</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">54732 - not divisible by 9 </span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">87064 - not divisible by 9 </span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">29412 - divisible by 9 and 4 , hence 29412 divisible by 36 also.</span></p>\\n",
                    solution_hi: "<p>61.(b)</p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">&#2342;&#2368; &#2327;&#2312; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366;&#2319;&#2305; 47502, 29412, 54732 &#2324;&#2352; 87064 &#2361;&#2376;&#2306;&#2404;</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">&#2319;&#2325; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366; 36 &#2360;&#2375; &#2357;&#2367;&#2349;&#2366;&#2332;&#2381;&#2351; &#2361;&#2379;&#2327;&#2368; , &#2325;&#2375;&#2357;&#2354; &#2340;&#2349;&#2368; &#2332;&#2348; &#2357;&#2361; 9 &#2324;&#2352; 4 &#2360;&#2375; &#2357;&#2367;&#2349;&#2366;&#2332;&#2381;&#2351; &#2361;&#2379;&#2404;</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">4 &#2325;&#2368; &#2357;&#2367;&#2349;&#2366;&#2332;&#2381;&#2351;&#2340;&#2366;:- &#2342;&#2368; &#2327;&#2312; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366; &#2325;&#2375; &#2309;&#2306;&#2340;&#2367;&#2350; &#2342;&#2379; &#2309;&#2306;&#2325; 4 &#2360;&#2375; &#2357;&#2367;&#2349;&#2366;&#2332;&#2381;&#2351; &#2361;&#2379;&#2344;&#2366; &#2330;&#2366;&#2361;&#2367;&#2319;</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">9 &#2325;&#2368; &#2357;&#2367;&#2349;&#2366;&#2332;&#2381;&#2351;&#2340;&#2366;:- &#2342;&#2368; &#2327;&#2312; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366; &#2325;&#2375; &#2309;&#2306;&#2325;&#2379;&#2306; &#2325;&#2366; &#2351;&#2379;&#2327; 9 &#2360;&#2375; &#2357;&#2367;&#2349;&#2366;&#2332;&#2381;&#2351; &#2361;&#2379;&#2344;&#2366; &#2330;&#2366;&#2361;&#2367;&#2319;</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">47502 - 4 &#2360;&#2375; &#2357;&#2367;&#2349;&#2366;&#2332;&#2381;&#2351; &#2344;&#2361;&#2368;&#2306; &#2361;&#2376;&#2404; </span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">54732 - 9 &#2360;&#2375; &#2357;&#2367;&#2349;&#2366;&#2332;&#2381;&#2351; &#2344;&#2361;&#2368;&#2306; &#2361;&#2376;&#2404; </span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">87064 -                     correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5

                questions.push({
                    id: "62",
                    section: "17",

                    solution_en: "<p>62.(a)</p>\\r\\n<p><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1696409627/word/media/image20.png\" width=\"194\" height=\"113\"></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Work done in one cycle (2 days ), starting with Amar = 4 + 5 = 9 units</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Work done in six cycle (12 days) = 9 &times; 6 = 54 units</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Work done till 13th days = 54 + 4 = 58 units</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Work completed in = 13 +<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>60</mn><mo>&nbsp;</mo><mo>-</mo><mo>&nbsp;</mo><mn>58</mn></mrow><mn>5</mn></mfrac></math> </span><span style=\"font-family: Palanquin Dark;\"> = 13<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>5</mn></mfrac></math></span><span style=\"font-family: Palanquin Dark;\"> days</span></p>\\n",

                questions.push({
                    id: "63",
                    section: "17",

                    solution_en: "<p>63.(b)</p>\\r\\n<p><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1696409627/word/media/image41.png\" width=\"223\" height=\"132\"></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Work done in one cycle (2 days ), starting with B = 4 + 9 = 13 units</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Work done in two cycle (4 days ) = 13 &times; 2 = 26 units </span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Work done till 5th days = 26 + 4 = 30 units</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Work completed in = 5 + </span><span style=\"font-family: Palanquin Dark;\"> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>36</mn><mo>-</mo><mn>30</mn></mrow><mn>9</mn></mfrac><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>5</mn><mfrac><mn>2</mn><mn>3</mn></mfrac></math></span><span style=\"font-family: Palanquin Dark;\"> days</span></p>\\n",

                questions.push({
                    id: "64",
                    section: "17",
                    question_en: "<p>64. <span style=\"font-family: Palanquin Dark;\">If two qualities of pulses \'X\' and \'Y\' of prices &#8377;100 and &#8377;150 per kg are mixed in the ratio 7: 20, then what is the price (in &#8377;) of this mixture of pulses (correct to the nearest Rupee)?</span></p>\\n",
                    question_hi: "<p>64. <span style=\"font-family: Palanquin Dark;\">&#2351;&#2342;&#2367; &#8377;100 &#2324;&#2352; &#8377;150 &#2346;&#2381;&#2352;&#2340;&#2367; kg &#2350;&#2370;&#2354;&#2381;&#2351; &#2357;&#2366;&#2354;&#2368; &#2342;&#2379; &#2346;&#2381;&#2352;&#2325;&#2366;&#2352; &#2325;&#2368; &#2342;&#2366;&#2354;&#2379;&#2306; \'X\' &#2324;&#2352; \'Y\' &#2325;&#2379; 7 : 20 &#2325;&#2375; &#2309;&#2344;&#2369;&#2346;&#2366;&#2340; &#2350;&#2375;&#2306; &#2350;&#2367;&#2354;&#2366;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;, &#2340;&#2379; &#2342;&#2366;&#2354;&#2379;&#2306; &#2325;&#2375; &#2311;&#2360; &#2350;&#2367;&#2358;&#2381;&#2352;&#2339; &#2325;&#2366; &#2346;&#2381;&#2352;&#2340;&#2367; kg &#2350;&#2370;&#2354;&#2381;&#2351; (&#8377; &#2350;&#2375;&#2306;) (&#2344;&#2367;&#2325;&#2335;&#2340;&#2350; &#2352;&#2369;&#2346;&#2351;&#2375; &#2340;&#2325; &#2360;&#2361;&#2368; ) &#2325;&#2381;&#2351;&#2366; &#2361;&#2379;&#2327;&#2366;?</span></p>\\n",
                    options_en: ["<p>137</p>\\n", "<p>135</p>\\n", 
                                "<p>134</p>\\n", "<p>136</p>\\n"],
                    options_hi: ["<p>137</p>\\n", "<p>135</p>\\n",

                    question_hi: "<p>69.<span style=\"font-family: Arial Unicode MS;\"> &#8377;3,600 &#2346;&#2352; 35% &#2325;&#2368; &#2331;&#2370;&#2335; &#2324;&#2352; &#2311;&#2360;&#2368; &#2352;&#2366;&#2358;&#2367; &#2346;&#2352; 30% &#2324;&#2352; 5% &#2325;&#2368; &#2342;&#2379; &#2325;&#2381;&#2352;&#2350;&#2367;&#2325; &#2331;&#2370;&#2335;&#2379;&#2306; &#2325;&#2375; &#2348;&#2368;&#2330; &#2325;&#2366; &#2309;&#2306;&#2340;&#2352; (&#8377; &#2350;&#2375;&#2306;) &#2332;&#2381;&#2334;&#2366;&#2340; &#2325;&#2352;&#2375;&#2306;&#2404;</span></p>\\n",

                    options_hi: ["<p>54</p>\\n", "<p>78</p>\\n",
                                "<p>82</p>\\n", "<p>52</p>\\n"],
                    solution_en: "<p>69.(a)</p>\\r\\n<p><span style=\"font-family: Arial Unicode MS;\">Price after 35% discount on 3600 &#8377; = 3600 &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>65</mn><mn>100</mn></mfrac></math></span><span style=\"font-family: Arial Unicode MS;\"> = 36&times;65 = 2340 &#8377;</span></p>\\r\\n<p><span style=\"font-family: Arial Unicode MS;\">Price after two successive discount 30% and 5%</span></p>\\r\\n<p><span style=\"font-family: Arial Unicode MS;\"> =&nbsp; 3600 &times; </span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>70</mn><mn>100</mn></mfrac><mo>&times;</mo><mo>&nbsp;</mo><mfrac><mn>95</mn><mn>100</mn></mfrac><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>36</mn><mo>&nbsp;</mo><mo>&times;</mo><mfrac><mrow><mn>7</mn><mo>&times;</mo><mn>95</mn></mrow><mn>10</mn></mfrac><mo>&nbsp;</mo></math> <span style=\"font-family: \'Arial Unicode MS\';\">= 36 &times; 66.5 = 2394 &#8377;</span></p>\\r\\n<p><span style=\"font-family: Arial Unicode MS;\">Required difference = 2394 - </span><span style=\"font-family: Arial Unicode MS;\">2340 = 54 &#8377;</span></p>\\n",

                questions.push({
                    id: "70",
                    section: "17",
                    question_en: "<p>70. <span style=\"font-family: Palanquin Dark;\">Raja and Rocky together can complete painting work in 5 days. Together they both start painting, but after 2 days, Rocky falls sick and leaves the work. If Raja completes the remaining painting in 4 days, find the number of days in which Rocky alone can do the work.</span></p>\\n",
                    question_hi: "<p>70. <span style=\"font-family: Palanquin Dark;\">&#2352;&#2366;&#2332;&#2366; &#2324;&#2352; &#2352;&#2377;&#2325;&#2368; &#2350;&#2367;&#2354;&#2325;&#2352; &#2346;&#2375;&#2306;&#2335;&#2367;&#2306;&#2327; &#2325;&#2366; &#2325;&#2366;&#2352;&#2381;&#2351; 5 &#2342;&#2367;&#2344;&#2379;&#2306; &#2350;&#2375;&#2306; &#2346;&#2370;&#2352;&#2366; &#2325;&#2352; &#2360;&#2325;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404; &#2357;&#2375; &#2342;&#2379;&#2344;&#2379;&#2306; &#2350;&#2367;&#2354;&#2325;&#2352; &#2346;&#2375;&#2306;&#2335;&#2367;&#2306;&#2327; &#2325;&#2352;&#2344;&#2366; &#2310;&#2352;&#2306;&#2349; &#2325;&#2352;&#2340;&#2375; &#2361;&#2376;&#2306;, &#2346;&#2352;&#2306;&#2340;&#2369; 2 &#2342;&#2367;&#2344; &#2348;&#2366;&#2342;, &#2352;&#2377;&#2325;&#2368; &#2348;&#2368;&#2350;&#2366;&#2352; &#2346;&#2337;&#2364; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376; &#2324;&#2352; &#2325;&#2366;&#2352;&#2381;&#2351; &#2331;&#2379;&#2337;&#2364; &#2342;&#2375;&#2340;&#2366; &#2361;&#2376;&#2404; &#2351;&#2342;&#2367; &#2352;&#2366;&#2332;&#2366; &#2358;&#2375;&#2359; &#2346;&#2375;&#2306;&#2335;&#2367;&#2306;&#2327; &#2325;&#2379; 4 &#2342;&#2367;&#2344;&#2379;&#2306; &#2350;&#2375;&#2306; &#2346;&#2370;&#2352;&#2366; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;, &#2340;&#2379; &#2352;&#2377;&#2325;&#2368; &#2309;&#2325;&#2375;&#2354;&#2375; &#2313;&#2360; &#2325;&#2366;&#2352;&#2381;&#2351; &#2325;&#2379; &#2325;&#2367;&#2340;&#2344;&#2375; &#2342;&#2367;&#2344;&#2379;&#2306; &#2350;&#2375;&#2306; &#2346;&#2370;&#2352;&#2366; &#2325;&#2352; &#2360;&#2325;&#2340;&#2366; &#2361;&#2376;?</span></p>\\n",
                    options_en: ["<p>12 days</p>\\n", "<p>15 days</p>\\n", 
                                "<p>20 days</p>\\n", "<p>10 days</p>\\n"],
                    options_hi: ["<p>12 &#2342;&#2367;&#2344;</p>\\n", "<p>15 &#2342;&#2367;&#2344;</p>\\n",

                    solution_en: "<p>70.(c)</p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Raja and Rocky complete the work in 5 days.</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">They work together for 2 days , and Rocky leaves the work .</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Raja complete the remaining work in 4 days , it means </span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">3 days of Rocky&rsquo;s work completed by Raja in 1 day . </span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Their efficiency ratio :- Rocky : Raja = 1 : 3</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Total work = (1+ 3) &times; 5 = 20 units </span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Number of days required by Rocky alone to complete the total work alone = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>20</mn><mn>1</mn></mfrac></math></span><span style=\"font-family: \'Palanquin Dark\';\">= 20 days</span></p>\\n",
                    solution_hi: "<p>70.(c)</p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">&#2352;&#2366;&#2332;&#2366; &#2324;&#2352; &#2352;&#2377;&#2325;&#2368; 5 &#2342;&#2367;&#2344;&#2379;&#2306; &#2350;&#2375;&#2306; &#2325;&#2366;&#2350; &#2346;&#2370;&#2352;&#2366; &#2325;&#2352;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404;</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">&#2357;&#2375; 2 &#2342;&#2367;&#2344;&#2379;&#2306; &#2340;&#2325; &#2319;&#2325; &#2360;&#2366;&#2341; &#2325;&#2366;&#2350; &#2325;&#2352;&#2340;&#2375; &#2361;&#2376;&#2306;, &#2324;&#2352; &#2352;&#2377;&#2325;&#2368; &#2325;&#2366;&#2350; &#2331;&#2379;&#2337;&#2364; &#2342;&#2375;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">&#2352;&#2366;&#2332;&#2366;, &#2358;&#2375;&#2359; &#2325;&#2366;&#2352;&#2381;&#2351; &#2325;&#2379; 4 &#2342;&#2367;&#2344;&#2379;&#2306; &#2350;&#2375;&#2306; &#2346;&#2370;&#2352;&#2366; &#2325;&#2352;&#2375;&#2306;, &#2311;&#2360;&#2325;&#2366; &#2350;&#2340;&#2354;&#2348; &#2361;&#2376;</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">&#2352;&#2377;&#2325;&#2368; &#2325;&#2375; 3 &#2342;&#2367;&#2344; &#2325;&#2366; &#2325;&#2366;&#2350; &#2352;&#2366;&#2332;&#2366; &#2344;&#2375; 1 &#2342;&#2367;&#2344; &#2350;&#2375;&#2306; &#2346;&#2370;&#2352;&#2366; &#2325;&#2367;&#2351;&#2366;&#2404;</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">&#2313;&#2344;&#2325;&#2366; &#2342;&#2325;&#2381;&#2359;&#2340;&#2366; &#2309;&#2344;&#2369;&#2346;&#2366;&#2340; :- &#2352;&#2377;&#2325;&#2368; : &#2352;&#2366;&#2332;&#2366; = 1 : 3</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">&#2325;&#2369;&#2354; &#2325;&#2366;&#2352;&#2381;&#2351; =&nbsp; (1+ 3) &times; 5 = 20 &#2311;&#2325;&#2366;&#2312;</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">&#2352;&#2377;&#2325;&#2368; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2309;&#2325;&#23                     solution_en: "<p>73.(d)</p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Let the speed of boat be x </span><span style=\"font-family: Palanquin Dark;\">km/hr. And speed of stream be y </span><span style=\"font-family: Palanquin Dark;\">km/hr. </span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">So , Speed in upstream = (x - y</span><span style=\"font-family: Palanquin Dark;\">) km/hr.</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">Speed in downstream = (x + y</span><span style=\"font-family: Palanquin Dark;\">) km/hr.</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">According to the question , </span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">In upstream , </span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\"> </span></p>\\r\\n<p><math style=\"font-family:Verdana\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>144</mn><mrow><mo>(</mo><mi mathvariant=\"normal\">x</mi><mo>-</mo><mi mathvariant=\"normal\">y</mi><mo>)</mo></mrow></mfrac><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>12</mn><mo>&nbsp;</mo><mi>hours</mi><mo>&nbsp;</mo><mo>&rArr;</mo><mo>&nbsp;</mo><mo>(</mo><mi mathvariant=\"normal\">x</mi><mo>-</mo><mi mathvariant=\"normal\">y</mi><mo>)</mo><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mfrac><mn>144</mn><mn>12</mn></mfrac><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>12</mn><mo>&nbsp;</mo><mi>km</mi><mo>/</mo><mi>hr</mi><mo>.</mo><mo>&nbsp;</mo><mspace linebreak=\"newline\"></mspace><mi>In</mi><mo>&nbsp;</mo><mi>downstream</mi><mo>&nbsp;</mo><mo>,</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mspace linebreak=\"newline\"></mspace><mfrac><mn>144</mn><mrow><mo>(</mo><mi mathvariant=\"normal\">x</mi><mo>+</mo><mi mathvariant=\"normal\">y</mi><mo>)</mo></mrow></mfrac><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>9</mn><mo>&nbsp;</mo><mi>hours</mi><mo>&nbsp;</mo><mo>&rArr;</mo><mo>&nbsp;</mo><mo>(</mo><mi mathvariant=\"normal\">x</mi><mo>+</mo><mi mathvariant=\"normal\">y</mi                     question_hi: "<p>80. <span style=\"font-family: Palanquin Dark;\">The following sentence has been split into four segments. Identify the segment that contains a grammatical error.</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">I fell asleep while / I read / the book.</span></p>\\n",

                    solution_en: "<p>80.(b) <strong>I read</strong></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">&lsquo;I read&rsquo; must be replaced with &lsquo;I was reading&rsquo; as we generally use continuous tense(helping verb + V-ing) in the &lsquo;while&rsquo; clause when something interrupts or occurs during the progress of another action. Similarly in the given sentence, the progress of reading the book is interrupted by the action of falling asleep. Hence, &lsquo;I was reading&rsquo; is the most appropriate answer.</span></p>\\n",

                    question_en: "<p>85. <span style=\"font-family: Palanquin Dark;\">Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">A</span><span style=\"font-family: Palanquin Dark;\">. After a few months, the two countries engaged in the Kargil war, </span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">B. </span><span style=\"font-family: Palanquin Dark;\">Furthermore, a number of violent wars were fought between India and Pakistan. </span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">C. </span><span style=\"font-family: Palanquin Dark;\">In February 1999, during the winter invasion, India and Pakistan signed the Lahore </span><span style=\"font-family: Palanquin Dark;\">Declaration, which was predicated on peace. </span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">D.</span><span style=\"font-family: Palanquin Dark;\">The engagements were extremely challenging for the Indian army since they had to fight on rough rocky terrain.</span></p>\\n",
                    question_hi: "<p>85. <span style=\"font-family: Palanquin Dark;\">Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">A</span><span style=\"font-family: Palanquin Dark;\">. After a few months, the two countries engaged in the Kargil war, </span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">B. </span><span style=\"font-family: Palanquin Dark;\">Furthermore, a number of violent wars were fought between India and Pakistan. </span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">C. </span><span style=\"font-family: Palanquin Dark;\">In February 1999, during the winter invasion, India and Pakistan signed the Lahore </span><span style=\"font-family: Palanquin Dark;\">Declaration, which was predicated on peace. </span></p>\\r\\n<p><span style=\"font-family: Palanquin Dark;\">D.</span><span style=\"font-family: Palanquin Dark;\">The engagements were extremely challenging for the Indian army since they had to fight on rough rocky terrain.</span></p>\\n",
