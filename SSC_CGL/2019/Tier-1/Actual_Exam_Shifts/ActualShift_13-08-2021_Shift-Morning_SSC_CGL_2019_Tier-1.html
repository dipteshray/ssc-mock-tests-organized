                questions.push({
                    id: "64",
                    section: "17",
                    question_en: "<p>64.<span style=\"font-family: Times New Roman;\"> If the 5-digit number 676xy is divisible by 3, 7 and 11, then what is the value of (3x - 5y)?</span></p>",
                    question_hi: "<p>64. <span style=\"font-family: Baloo;\">यदि 5 अंकों की संख्या </span><span style=\"font-family: Times New Roman;\">676xy, 3, 7 </span><span style=\"font-family: Baloo;\">और </span><span style=\"font-family: Times New Roman;\">11</span><span style=\"font-family: Baloo;\"> से विभाज्य है, तो </span><span style=\"font-family: Times New Roman;\">(3x - 5y)</span><span style=\"font-family: Baloo;\"> का मान क्या होगा?</span></p>",
                    options_en: ["<p>10</p>", "<p>7</p>", 
                                "<p>9</p>", "<p>11</p>"],
                    options_hi: ["<p>10</p>", "<p>7</p>",
                                "<p>9</p>", "<p>11</p>"],
                    solution_en: "<p>64.(c)&nbsp;<span style=\"font-family: Times New Roman;\">For a number to be divisible by 3, 7 and 11 it should be divisible by 231</span><br><span style=\"font-family: Times New Roman;\">And on dividing 67600 by 231 we get remainder as 148</span><br><span style=\"font-family: Times New Roman;\">So the next multiple is at the distance of 231 - 148 = 83&nbsp;</span><br><span style=\"font-family: Times New Roman;\">The next multiple is 67600 + 83 = 67683&nbsp;</span><br><span style=\"font-family: Times New Roman;\">So, x = 8 and y = 3</span><br><span style=\"font-family: Times New Roman;\">3x - 5y = 24 -15 = 9</span></p>",
                    solution_hi: "<p>64. (c) <span style=\"font-family: Baloo;\">किसी संख्या के</span><span style=\"font-family: Times New Roman;\"> 3, 7 </span><span style=\"font-family: Baloo;\">और</span><span style=\"font-family: Times New Roman;\"> 11 </span><span style=\"font-family: Baloo;\">से विभाज्य होने के लिए उसे</span><span style=\"font-family: Times New Roman;\"> 231</span><span style=\"font-family: Baloo;\"> से विभाज्य होना चाहिए और</span><span style=\"font-family: Times New Roman;\"> 67600 </span><span style=\"font-family: Baloo;\">को</span><span style=\"font-family: Times New Roman;\"> 231 </span><span style=\"font-family: Baloo;\">से भाग देने पर शेषफल के</span><span style=\"font-family: Times New Roman;\"> </span><span style=\"font-family: Baloo;\">रूप में</span><span style=\"font-family: Times New Roman;\"> 148 </span><span style=\"font-family: Baloo;\">प्राप्त होता है |</span><br><span style=\"font-family: Baloo;\">तो अगला गुणज</span><span style=\"font-family: Times New Roman;\"> 231 - 148 = 83 </span><span style=\"font-family: Baloo;\">की दूरी पर है</span><br><span style=\"font-family: Baloo;\">अगला गुणज</span><span style=\"font-family: Times New Roman;\"> 67600 + 83 = 67683 </span><span style=\"font-family: Baloo;\">. है</span><br><span style=\"font-family: Baloo;\">तो,</span><span style=\"font-family: Times New Roman;\"> x = 8 </span><span style=\"font-family: Baloo;\">और</span><span style=\"font-family: Times New Roman;\"> y = 3</span><br><span style=\"font-family: Times New Roman;\">3x - 5y = 24 - 15 = 9</span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "65",
                    section: "17",
                    question_en: "<p>65. <span style=\"font-family: Times New Roman;\">A chord 21 cm long is drawn in a circle of diameter 25 cm. The perpendicular distance of the chord from the center is:</span></p>",
                    question_hi: "<p>65. <span style=\"font-family: Times New Roman;\"> </span><span style=\"font-family: Baloo;\">25 सेमी व्यास वाले एक वृत्त में 21 सेमी लंबी एक जीवा खींची जाती है। केंद्र से जीवा की लंबवत दूरी है:</span></p>",
                    options_en: ["<p><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>41</mn></msqrt></math> </span></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>23</mn></msqrt></math></p>", 
                                "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>56</mn></msqrt></math><span style=\"font-family: Times New Roman;\"> </span></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>46</mn></msqrt></math></p>"],
                    options_hi: ["<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>41</mn></msqrt></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>23</mn></msqrt></math></p>",
                                "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>56</mn></msqrt></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>46</mn></msqrt></math></p>"],
                    solution_en: "<p>65. (d)<br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1667218332/word/media/image11.png\"><br><span style=\"font-family: Times New Roman;\">The perpendicular distance from the centre bisects the chord into two equal half</span><br><span style=\"font-family: Times New Roman;\">Applying Pythagoras in △COB</span><br>OB<sup>2</sup> = CB<sup>2</sup> + CO<sup>2</sup><br><span style=\"font-family: Baloo;\"><span style=\"font-family: Times New Roman;\">OC<sup>2 </sup>= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>625</mn><mn>4</mn></mfrac></math> -&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>441</mn><mn>4</mn></mfrac></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>184</mn><mn>4</mn></mfrac></math></span></span><br><span style=\"font-family: Times New Roman;\">OC = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>46</mn></msqrt></math></span></p>",
                    solution_hi: "<p>65. (d)<br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1667218332/word/media/image11.png\"><br><span style=\"font-family: Baloo;\">केन्द्र से लम्बवत दूरी जीवा को दो बराबर भागों में समद्विभाजित करती है।</span><br><span style=\"font-family: Times New Roman;\">△COB </span><span style=\"font-family: Baloo;\">में पाइथागोरस लगाने पर,</span><br><span style=\"font-family: Baloo;\">OB<sup>2</sup> = CB<sup>2</sup> + CO<sup>2</sup><br><span style=\"font-family: Times New Roman;\"><span style=\"font-family: Baloo;\"><span style=\"font-family: Times New Roman;\">OC<sup>2 </sup></span></span>= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>625</mn><mn>4</mn></mfrac></math> -&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>441</mn><mn>4</mn></mfrac></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>184</mn><mn>4</mn></mfrac></math></span></span><br><span style=\"font-family: Times New Roman;\">OC = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>46</mn></msqrt></math></span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "66",
                    section: "17",
                    question_en: "<p>66. <span style=\"font-family: Times New Roman;\">Let &Delta;</span><span style=\"font-family: Times New Roman;\">ABC ~ &Delta; </span><span style=\"font-family: Times New Roman;\">PQR, and </span><span style=\"font-family: Times New Roman;\">= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>ar</mi><mo>(</mo><mo>&#8710;</mo><mi>ABC</mi><mo>)</mo></mrow><mrow><mi>ar</mi><mo>(</mo><mo>&#8710;</mo><mi>PQR</mi><mo>)</mo></mrow></mfrac><mo>=</mo><mfrac><mn>144</mn><mn>49</mn></mfrac></math></span><span style=\"font-family: Times New Roman;\">. If AB = 12 cm, BC = 7cm and AC = 9cm , then PR (in cm) is equal to :</span></p>",
                    question_hi: "<p>66. <span style=\"font-family: Baloo;\">माना</span><span style=\"font-family: Times New Roman;\"> &Delta;ABC ~ &Delta; PQR,&nbsp;</span><span style=\"font-family: Baloo;\">और<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>ar</mi><mo>(</mo><mo>&#8710;</mo><mi>ABC</mi><mo>)</mo></mrow><mrow><mi>ar</mi><mo>(</mo><mo>&#8710;</mo><mi>PQR</mi><mo>)</mo></mrow></mfrac><mo>=</mo><mfrac><mn>144</mn><mn>49</mn></mfrac></math></span><span style=\"font-family: Times New Roman;\">&nbsp;</span><span style=\"font-family: Baloo;\">। यदि AB = 12 सेमी, BC = 7 </span><span style=\"font-family: Baloo;\">सेमी और</span><span style=\"font-family: Times New Roman;\"> AC = 9</span><span style=\"font-family: Baloo;\"> सेमी है, तो </span><span style=\"font-family: Times New Roman;\">PR </span><span style=\"font-family: Baloo;\">(सेमी में) बराबर है:</span></p>",
                    options_en: ["<p>12</p>", "<p><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>49</mn><mn>12</mn></mfrac></math> </span></p>", 
                                "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>108</mn><mn>7</mn></mfrac></math><span style=\"font-family: Times New Roman;\"> </span></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>21</mn><mn>4</mn></mfrac></math></p>"],
                    options_hi: ["<p>12</p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>49</mn><mn>12</mn></mfrac></math></p>",
                                "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>108</mn><mn>7</mn></mfrac></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>21</mn><mn>4</mn></mfrac></math></p>"],
                    solution_en: "<p>66.(d) <span style=\"font-family: Times New Roman;\">As, both the triangle are similar so their area is in the ratio of the square of their sides</span><br><span style=\"font-family: Times New Roman;\">Side ratio of &Delta;</span><span style=\"font-family: Times New Roman;\">ABC : &Delta;&nbsp;</span><span style=\"font-family: Times New Roman;\">PQR = 12 : 7</span><br><span style=\"font-family: Times New Roman;\">If AC = 9 then its corresponding side PR =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mn>12</mn></mfrac></math> &times; </span><span style=\"font-family: Times New Roman;\">7 = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>21</mn><mn>4</mn></mfrac></math></span><span style=\"font-family: Times New Roman;\"> </span></p>",
                    solution_hi: "<p>66.(d) चूँकि दोनों त्रिभुज समरूप हैं इसलिए उनका क्षेत्रफल उनकी भुजाओं के वर्ग के अनुपात में है। <br>त्रिभुज&nbsp; की भुजा का अनुपात&nbsp; = 12 : 7&nbsp;<br>यदि&nbsp;AC = 9 है तो उसकी संगत भुजा = <span style=\"font-family: Times New Roman;\">PR =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mn>12</mn></mfrac></math> &times; </span><span style=\"font-family: Times New Roman;\">7 = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>21</mn><mn>4</mn></mfrac></math></span></p>\n<p dir=\"rtl\">&nbsp;</p>\n<p dir=\"rtl\">&nbsp;</p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "67",
                    section: "17",
                    question_en: "<p>67. <span style=\"font-family: Times New Roman;\">To do a certain work. A and B work on alternate days with B beginning the work on the first day. </span><span style=\"font-family: Times New Roman;\">A Alone</span><span style=\"font-family: Times New Roman;\"> can complete the same work in 24 days. If the work gets completed in 11<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math></span><span style=\"font-family: Times New Roman;\"> days, then B alone can complete <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>7</mn><mn>9</mn></mfrac></math>th</span><span style=\"font-family: Times New Roman;\">&nbsp;</span><span style=\"font-family: Times New Roman;\">part of the original work in:</span></p>",
                    question_hi: "<p>67. <span style=\"font-family: Baloo;\">एक निश्चित कार्य को करते हुए A और B बारी-बारी से काम करते हैं और B पहले दिन काम शुरू करता है। A अकेला उसी कार्य को 24 दिनों में पूरा कर सकता है। यदि कार्य 11<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math></span><span style=\"font-family: Baloo;\"> दिनों में पूरा हो जाता है, तो B अकेला मूल कार्य का <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>7</mn><mn>9</mn></mfrac></math> </span><span style=\"font-family: Baloo;\">वां भाग कितने समय में पूरा कर सकता है?</span></p>",
                    options_en: ["<p>5<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac></math><span style=\"font-family: Times New Roman;\">days</span></p>", "<p>4 days</p>", 
                                "<p>4<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac></math><span style=\"font-family: Times New Roman;\">days </span></p>", "<p>6 days</p>"],
                    options_hi: ["<p>5<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac></math><span style=\"font-family: Baloo;\">दिन</span></p>", "<p>4 <span style=\"font-family: Baloo;\">दिन</span><span style=\"font-family: Times New Roman;\"> </span></p>",
                                "<p>4<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac></math><span style=\"font-family: Baloo;\">दिन </span><span style=\"font-family: Times New Roman;\"> </span></p>", "<p>6 <span style=\"font-family: Baloo;\">दिन</span></p>"],
                    solution_en: "<p>67.(d)<br>Let the total work be 72 Units&nbsp;<br>In 11<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math> A worked for 5<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math> days and B worked for 6 days<br>A&rsquo;s efficiency = 3<br>Work left by A = 56 units&nbsp;<br>B completed the work in 6 days = 56 units&nbsp;<br>B&rsquo;s efficiency = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>56</mn><mn>6</mn></mfrac></math><br><span style=\"font-family: Times New Roman;\">Total time taken by B =<strong id=\"docs-internal-guid-dc9d165c-7fff-27a9-0ef8-776903743d7d\"> </strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>72</mn><mstyle displaystyle=\"true\"><mfrac><mn>56</mn><mn>6</mn></mfrac></mstyle></mfrac></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>72</mn><mo>&#215;</mo><mn>6</mn></mrow><mn>56</mn></mfrac></math></span><br><span style=\"font-family: Times New Roman;\">To do <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>7</mn><mn>9</mn></mfrac></math>th of the work <strong id=\"docs-internal-guid-e60de1f1-7fff-4b4e-b323-1786b96ed4de\">= </strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>72</mn><mo>&#215;</mo><mn>6</mn></mrow><mn>56</mn></mfrac><mo>&#215;</mo><mfrac><mn>7</mn><mn>9</mn></mfrac></math> = 6 days</span></p>",
                    solution_hi: "<p>67.(d)<br>माना कुल कार्य = 72 इकाई<br>11<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math> में, A ने 5<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math> दिनों तक कार्य किया और B ने 6 दिनों तक कार्य किया<br>A की क्षमता = 3<br>A द्वारा छोड़ा गया कार्य = 56 इकाई&nbsp;<br>B ने 6 दिनों में कार्य पूरा किया = 56 इकाई&nbsp;<br>B की&nbsp; क्षमता =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>56</mn><mn>6</mn></mfrac></math><br><span style=\"font-family: Times New Roman;\">B द्वारा लिया गया कुल समय = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>72</mn><mstyle displaystyle=\"true\"><mfrac><mn>56</mn><mn>6</mn></mfrac></mstyle></mfrac></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>72</mn><mo>&#215;</mo><mn>6</mn></mrow><mn>56</mn></mfrac></math></span><br><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>7</mn><mn>9</mn></mfrac></math>B द्वारा लिया गया कुल समय =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>72</mn><mo>&#215;</mo><mn>6</mn></mrow><mn>56</mn></mfrac><mo>&#215;</mo><mfrac><mn>7</mn><mn>9</mn></mfrac></math> = 6 दिन</span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({

                    section: "17",

                questions.push({
                    id: "70",
                    section: "17",
                    question_en: "<p>70.&nbsp;<span style=\"font-family: Times New Roman;\">If&nbsp; x + <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>x</mi></mfrac></math> = 4</span><span style=\"font-family: Times New Roman;\">, then the value of x<sup>5</sup><strong id=\"docs-internal-guid-03961e28-7fff-512c-b4d5-d714c72b0707\">&nbsp;+</strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi>x</mi><mn>5</mn></msup></mfrac></math> </span><span style=\"font-family: Times New Roman;\"> </span><span style=\"font-family: Times New Roman;\">is:</span></p>",
                    question_hi: "<p>70. <span style=\"font-family: Baloo;\">यदि</span><span style=\"font-family: Times New Roman;\"> <span style=\"font-family: Baloo;\"><span style=\"font-family: Times New Roman;\">x + <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>x</mi></mfrac></math> = 4</span></span></span><span style=\"font-family: Times New Roman;\">, </span><span style=\"font-family: Baloo;\">तो</span><span style=\"font-family: Times New Roman;\">&nbsp;<span style=\"font-family: Baloo;\"><span style=\"font-family: Times New Roman;\"> x<sup>5</sup><strong id=\"docs-internal-guid-03961e28-7fff-512c-b4d5-d714c72b0707\">&nbsp;+</strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi>x</mi><mn>5</mn></msup></mfrac></math> </span></span></span><span style=\"font-family: Baloo;\">का मान है:&nbsp;</span></p>",

                                "<p>684</p>", "<p>724</p>"],
                    options_hi: ["<p>736</p>", "<p>776</p>",
                                "<p>684</p>", "<p>724</p>"],
                    solution_en: "<p>70.(d)<br><span style=\"font-family: Times New Roman;\"><span style=\"font-family: Baloo;\"><span style=\"font-family: Times New Roman;\">x + <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>x</mi></mfrac></math> = 4</span></span></span><span style=\"font-family: Times New Roman;\">&nbsp;</span><br><span style=\"font-family: Times New Roman;\">so,&nbsp;</span><span style=\"font-family: Times New Roman;\"><span style=\"font-family: Baloo;\"><span style=\"font-family: Times New Roman;\">x<sup>2</sup><strong id=\"docs-internal-guid-03961e28-7fff-512c-b4d5-d714c72b0707\">&nbsp;+</strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi>x</mi><mn>2</mn></msup></mfrac></math> = 4<sup>2 </sup>- 2 = 16 - 2 = 14</span></span></span><br><span style=\"font-family: Times New Roman;\"><span style=\"font-family: Baloo;\"><span style=\"font-family: Times New Roman;\"><span style=\"font-family: Baloo;\"><span style=\"font-family: Times New Roman;\">x<sup>3&nbsp;</sup></span></span>+ <span style=\"font-family: Baloo;\"><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi>x</mi><mn>3</mn></msup></mfrac></math> </span></span><strong id=\"docs-internal-guid-7a7f2032-7fff-ed4c-f989-1d382bfd6070\">= </strong>4<sup>3</sup> - 3 &times; 4 = 52</span></span></span><br><span style=\"font-family: Times New Roman;\"><span style=\"font-family: Baloo;\"><span style=\"font-family: Times New Roman;\"><span style=\"font-family: Baloo;\"><span style=\"font-family: Times New Roman;\"><span style=\"font-family: Baloo;\"><span style=\"font-family: Times New Roman;\">x<sup>5 </sup></span></span>+ <span style=\"font-family: Baloo;\"><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi>x</mi><mn>5</mn></msup></mfrac></math> = (<span style=\"font-family: Baloo;\"><span style=\"font  4 = 724</span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></p>",

                    options_hi: ["<p>18</p>", "<p>19</p>",
                                "<p>21</p>", "<p>16</p>"],
                    solution_en: "<p>71.(b)<br><span style=\"font-family: Times New Roman;\"><span style=\"font-family: Baloo;\"><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>x</mi></mfrac></math> + <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>y</mi></mfrac></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>16</mn><mn>15</mn></mfrac></math></span></span></span><span style=\"font-family: Times New Roman;\"> &nbsp;</span><br><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mo>+</mo><mi>y</mi></mrow><mrow><mo>&#160;</mo><mi>x</mi><mi>y</mi></mrow></mfrac></math> =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>16</mn><mn>15</mn></mfrac></math>&nbsp;</span><br><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mrow><mi>x</mi><mi>y</mi></mrow></mfrac></math> =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>16</mn><mn>15</mn></mfrac></math>, xy = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>15</mn><mn>4</mn></mfrac></math></span><br>x<sup>3</sup> + y<sup>3</sup> = (x + y) (x<sup>2</sup> + y<sup>2</sup> - xy)<br>= (x + y) ((x+y)<sup>2</sup> - 3xy)<br><span style=\"font-family: Times New Roman;\">x<sup>3</sup> + y<sup>3</sup> &nbsp;= 4 (4<sup>2 </sup>- 3 &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>15</mn><mn>4</mn></mfrac></math>) = 19</span></p>",
                    solution_hi: "<p>71.(b)<br><span style=\"font-family: Times New Roman;\"><span style=\"font-family: Baloo;\"><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>x</mi></mfrac></math> + <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>y</mi></mfrac></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>16</mn><mn>15</mn></mfrac></math></span></span></span><span style=\"font-family: Times New Roman;\"> &nbsp;</span><br><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mo>+</mo><mi>y</mi></mrow><mrow><mo>&#160;</mo><mi>x</mi><mi>y</mi></mrow></mfrac></math> =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>16</mn><mn>15</mn></mfrac></math>&nbsp;</span><br><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mrow><mi>x</mi><mi>y</mi></mrow></mfrac></math> =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>16</mn><mn>15</mn></mfrac></math>, xy = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>15</mn><mn>4</mn></mfrac></math></span><br>x<sup>3</sup> + y<sup>3</sup> = (x + y) (x<sup>2</sup> + y<sup>2</sup> - xy)<br>= (x + y) ((x+y)<sup>2</sup> - 3xy)<br><span style=\"font-family: Times New Roman;\">x<sup>3</sup> + y<sup>3</sup> &nbsp;= 4 (4<sup>2 </sup>- 3 &times; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>15</mn><mn>4</mn></mfrac></math>) = 19</span></p>",

                questions.push({
                    id: "72",
                    section: "17",
                    question_en: "<p>72.<span style=\"font-family: Times New Roman;\"> The value of 20 &divide; 5 of 8 &times; [9 &divide; 6 &times; (6 - 3)] - (10&nbsp;&divide; 2 of 20)</span><span style=\"font-family: Times New Roman;\">&nbsp;is :</span></p>",
                    question_hi: "<p>72. <span style=\"font-family: Times New Roman;\">20 &divide; 5 <span style=\"font-family: Baloo;\">का&nbsp;</span>8 &times; [9 &divide; 6 &times; (6 - 3)] - (10 &divide; 2 <span style=\"font-family: Baloo;\">का </span>20)</span><span style=\"font-family: Baloo;\">&nbsp;का मान है</span><span style=\"font-family: Times New Roman;\"> : </span></p>",
                    options_en: ["<p>6</p>", "<p>1</p>",

                    options_hi: ["<p>6</p>", "<p>1</p>",

                    solution_en: "<p>72.(d)<br><span style=\"font-family: Times New Roman;\">20 &divide; 5 <span style=\"font-family: Baloo;\">of </span>8 &times; [9 &divide; 6 &times; (6 - 3)] - (10 &divide; 2 <span style=\"font-family: Baloo;\">of </span>20)</span><span style=\"font-family: Baloo;\">&nbsp;</span><br>20 <span style=\"font-family: Times New Roman;\">&divide; </span>40 <span style=\"font-family: Times New Roman;\">&times; </span>[9&nbsp;<span style=\"font-family: Times New Roman;\">&divide; </span>6 <span style=\"font-family: Times New Roman;\">&times; </span>3] - (10&nbsp;<span style=\"font-family: Times New Roman;\">&divide; </span>40)<br>20 <span style=\"font-family: Times New Roman;\">&divide; </span>40 <span style=\"font-family: Times New Roman;\">&times; </span>4.5 - 0.25<br><span style=\"font-family: Baloo;\">0.5 <span style=\"font-family: Times New Roman;\">&times; </span>4.5 - 0.25</span><br><span style=\"font-family: Baloo;\">= 2.25 - 0.25 = 2</span></p>",
                    solution_hi: "<p>72.(d)<br><span style=\"font-family: Times New Roman;\">20 &divide; 5 <span style=\"font-family: Baloo;\">का&nbsp;</span>8 &times; [9 &divide; 6 &times; (6 - 3)] - (10 &divide; 2 <span style=\"font-family: Baloo;\">का </span>20)</span><span style=\"font-family: Baloo;\">&nbsp;</span><br>20 <span style=\"font-family: Times New Roman;\">&divide; </span>40 <span style=\"font-family: Times New Roman;\">&times; </span>[9&nbsp;<span style=\"font-family: Times New Roman;\">&divide; </span>6 <span style=\"font-family: Times New Roman;\">&times; </span>3] - (10&nbsp;<span style=\"font-family: Times New Roman;\">&divide; </span>40)<br>20 <span style=\"font-family: Times New Roman;\">&divide; </span>40 <span style=\"font-family: Times New Roman;\">&times; </span>4.5 - 0.25<br><span style=\"font-family: Baloo;\">0.5 <span style=\"font-family: Times New Roman;\">&times; </span>4.5 - 0.25</span><br><span style=\"font-family: Baloo;\">= 2.25 - 0.25 = 2</span></p>",

                questions.push({
                    id: "73",
                    section: "17",
                    question_en: "<p>73. <span style=\"font-family: Times New Roman;\">X, Y are two points in a river. Points P and Q divide the straight line XY into three equal parts. The river flows along XY and the time taken by a boat to row from X to Q and from Y to Q are in the ratio 4 : 5. The ratio of the speed of the boat downstream to that of the river current is equal to:</span></p>",
                    question_hi: "<p>73. <span style=\"font-family: Times New Roman;\">X, Y </span><span style=\"font-family: Baloo;\">एक नदी में दो बिंदु हैं। बिंदु</span><span style=\"font-family: Times New Roman;\"> P </span><span style=\"font-family: Baloo;\">और </span><span style=\"font-family: Times New Roman;\">Q </span><span style=\"font-family: Baloo;\">सीधी रेखा XY को तीन बराबर भागों में विभाजित करते हैं। नदी</span><span style=\"font-family: Times New Roman;\"> XY </span><span style=\"font-family: Baloo;\">के साथ बहती है और एक नाव द्वारा</span><span style=\"font-family: Times New Roman;\"> X</span><span style=\"font-family: Baloo;\"> से</span><span style=\"font-family: Times New Roman;\"> Q </span><span style=\"font-family: Baloo;\">और</span><span style=\"font-family: Times New Roman;\"> Y </span><span style=\"font-family: Baloo;\">से</span><span style=\"font-family: Times New Roman;\"> Q </span><span style=\"font-family: Baloo;\">तक एक पंक्ति में लगने वाले समय का अनुपात </span><span style=\"font-family: Times New Roman;\">4:5 </span><span style=\"font-family: Baloo;\">है। धारा के अनुकूल नाव की गति और नदी की धारा की गति का अनुपात बराबर है:</span></p>",
                    options_en: ["<p>3 : 10</p>", "<p>3 : 4</p>", 
                                "<p>10 : 3</p>", "<p>4 : 3</p>"],
                    options_hi: ["<p>3 : 10</p>", "<p>3 : 4</p>",
                                "<p>10 : 3</p>", "<p>4 : 3</p>"],
                    solution_en: "<p>73.(c) <span style=\"font-family: Times New Roman;\">Let each equal distance be 1 Unit</span><br><span style=\"font-family: Times New Roman;\">So, the time taken for 2 units downstream is 4 and 1 unit is 2</span><br><span style=\"font-family: Times New Roman;\">And time taken for 1 unit upstream is 5</span><br><span style=\"font-family: Times New Roman;\">Speed of the boat = x and speed of the current = y</span><br><span style=\"font-family: Times New Roman;\">Downstream speed = x + y</span><br><span style=\"font-family: Times New Roman;\">Upstream speed = x - y</span><br><span style=\"font-family: Times New Roman;\">According to the question</span><br><span style=\"font-family: Times New Roman;\">2(x + y) = 5(x - y)</span><br><span style=\"font-family: Times New Roman;\">x = 3.5 and y = 1.5</span><br><span style=\"font-family: Times New Roman;\">Ratio of downstream and current </span><span style=\"font-family: Times New Roman;\">= 5 : 1.5 = 10 : 3</span></p>",
                    solution_hi: "<p>73.(c) <span style=\"font-family: Baloo;\">मान लीजिए कि प्रत्येक समान दूरी</span><span style=\"font-family: Times New Roman;\"> = 1 </span><span style=\"font-family: Baloo;\">इकाई है।</span><br><span style=\"font-family: Baloo;\">तो,</span><span style=\"font-family: Times New Roman;\"> 2 </span><span style=\"font-family: Baloo;\">इकाई डाउनस्ट्रीम के लिए लिया गया समय</span><span style=\"font-family: Times New Roman;\"> 4 </span><span style=\"font-family: Baloo;\">है ।</span><br><span style=\"font-family: Baloo;\">फिर</span><span style=\"font-family: Times New Roman;\"> 1 </span><span style=\"font-family: Baloo;\">इकाई</span><span style=\"font-family: Times New Roman;\"> = 2</span><br><span style=\"font-family: Baloo;\">और धारा के प्रतिकूल 1 इकाई के लिए लिया गया समय</span><span style=\"font-family: Times New Roman;\"> 5</span><span style=\"font-family: Baloo;\"> है।</span><br><span style=\"font-family: Baloo;\">नाव की गति</span><span style=\"font-family: Times New Roman;\"> = x </span><span style=\"font-family: Baloo;\">और धारा की गति</span><span style=\"font-family: Times New Roman;\"> = y</span><br><span style=\"font-family: Baloo;\">धारा के साथ गति </span><span style=\"font-family: Times New Roman;\">= x + y</span><br><span style=\"font-family: Baloo;\">धारा के प्रतिकूल गति</span><span style=\"font-family: Times New Roman;\"> = x - y</span><br><span style=\"font-family: Baloo;\">प्रश्न के अनुसार,</span><br><span style=\"font-family: Times New Roman;\">2(x + y) = 5(x - y)</span><br><span style=\"font-family: Baloo;\">x = 3.5 और y = 1.5</span><br><span style=\"font-family: Baloo;\">अनुप्रवाह और धारा का अनुपात</span><span style=\"font-family: Times New Roman;\"> = 5 : 1.5 =&nbsp;</span><span style=\"font-family: Times New Roman;\">10 : 3</span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "74",
                    section: "17",
                    question_en: "<p>74. <span style=\"font-family: Times New Roman;\">What is the compound interest (in Rupee) on a sum of 8192 rupee for 1<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>4</mn></mfrac></math> </span><span style=\"font-family: Times New Roman;\">years at 15% per annum, if interest is compounded 5-monthly?</span></p>",
                    question_hi: "<p>74. <span style=\"font-family: Baloo;\">8192 रुपये की राशि पर </span><span style=\"font-family: Times New Roman;\">1<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>4</mn></mfrac></math></span><span style=\"font-family: Times New Roman;\"> </span><span style=\"font-family: Baloo;\">वर्षों के लिए 15% प्रति वर्ष की दर से चक्रवृद्धि ब्याज (रुपये में) क्या है, यदि ब्याज 5-मासिक चक्रवृद्धि है?</span></p>",
                    options_en: ["<p>1640</p>", "<p>1740</p>", 
                                "<p>1634</p>", "<p>1735</p>"],
                    options_hi: ["<p>1640<span style=\"font-family: Times New Roman;\"> </span></p>", "<p>1740</p>",
                                "<p>1634<span style=\"font-family: Times New Roman;\"> </span></p>", "<p>1735</p>"],
                    solution_en: "<p>74.(c)<br>Total time = 15 months and 5-monthly is calculated so it has 3 compounding periods<br>Rate = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>15</mn><mn>12</mn></mfrac></math> &times; 5 = 6.25%<br>6.25% is a ratio of 1 : 16&nbsp;<br>Principle : Amount = 16<sup>3</sup> : 17<sup>3</sup> = 4096 : 4913<br>Interest 4913 - 4096 = 817<br>4096 unit is 8192 similarly 817 unit is 1634</p>",
                    solution_hi: "<p>74.(c)<br>कुल समय = 15 महीने और 5-मासिक गणना की जाती है, इसलिए इसमें 3 चक्रवृद्धि अवधि होती है<br>दर = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>15</mn><mn>12</mn></mfrac></math> &times; 5 = 6.25%<br>6.25% = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>16</mn></mfrac></math><br>मूलधन : राशि = 16<sup>3</sup> : 17<sup>3</sup> = 4096 : 4913<br>ब्याज &nbsp;4913 - 4096 = 817<br>4096 इकाई = 8192, 817 इकाई = 1634</p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "75",
                    section: "7",
                    question_en: "<p>75. <span style=\"font-family: Times New Roman;\">&nbsp;If 8(x + y)<sup>3</sup> - 27(x - y)<sup>3</sup> = (5y - x)(Ax<sup>2</sup> + By<sup>2</sup> + Cxy)</span><span style=\"font-family: Times New Roman;\">&nbsp;then what is the value of (A + B - C)?</span></p>",
                    question_hi: "<p>75. <span style=\"font-family: Baloo;\">यदि <span style=\"font-family: Times New Roman;\">8(x + y)<sup>3</sup> - 27(x - y)<sup>3</sup> = (5y - x)(Ax<sup>2</sup> + By<sup>2</sup> + Cxy)</span></span><span style=\"font-family: Times New Roman;\">, </span><span style=\"font-family: Baloo;\">तो</span><span style=\"font-family: Times New Roman;\"> (A + B - C) </span><span style=\"font-family: Baloo;\">का मान क्या है?</span></p>",
                    options_en: ["<p>16<span style=\"font-family: Times New Roman;\"> </span></p>", "<p>-26</p>", 
                                "<p>36</p>", "<p>-16</p>"],
                    options_hi: ["<p>16</p>", "<p>-26</p>",
                                "<p>36</p>", "<p>-16</p>"],
                    solution_en: "<p>75.(c) <span style=\"font-family: Times New Roman;\">8(x + y)<sup>3</sup> - 27(x - y)<sup>3</sup> = (5y - x)(Ax<sup>2</sup> + By<sup>2</sup> + Cxy)</span><br>a<sup>3</sup> - b<sup>3</sup> = (a - b) (a<sup>2</sup> + b<sup>2 </sup>+ ab)<br>a = 2x + 2y and b = 3x - 3y<br>(a - b) = 2x + 2y - 3x + 3y = (5y - x)<br>(a<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> + b<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> + ab) = (4x<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> + 4y<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> + 8xy + 9x<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> + 9y<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> - 18xy + 6x<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> - 6xy + 6xy - 6y<span style=\"font-family: Times New Roman;\"><sup>2</sup></span>)<br>(a<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> + b<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> + ab) =(19x<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> + 7y<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> - 10xy)<br>8(x + y)<span style=\"font-family: Times New Roman;\"><sup>3</sup></span> - 27(x - y)<span style=\"font-family: Times New Roman;\"><sup>3 </sup></span>= (5y - x)(19x<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> + 7y<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> - 10xy)<br>A = 19, B = 7 and C = -10<br>A+ B - C = 19 + 7 -(-10)&nbsp; = 26 + 10 = 36</p>",
                    solution_hi: "<p>75.(c) <span style=\"font-family: Times New Roman;\">8(x + y)<sup>3</sup> - 27(x - y)<sup>3</sup> = (5y - x)(Ax<sup>2</sup> + By<sup>2</sup> + Cxy)</span><br>a<sup>3</sup> - b<sup>3</sup> = (a - b) (a<sup>2</sup> + b<sup>2 </sup>+ ab)<br>a = 2x + 2y और&nbsp; b = 3x - 3y<br>(a - b) = 2x + 2y - 3x + 3y = (5y - x)<br>(a<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> + b<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> + ab) = (4x<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> + 4y<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> + 8xy + 9x<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> + 9y<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> -18xy + 6x<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> - 6xy +6xy - 6y<span style=\"font-family: Times New Roman;\"><sup>2</sup></span>)<br>(a<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> + b<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> + ab) =(19x<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> +7y<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> -10xy)<br>8(x + y)<span style=\"font-family: Times New Roman;\"><sup>3</sup></span> - 27(x - y)<span style=\"font-family: Times New Roman;\"><sup>3 </sup></span>= (5y - x)(19x<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> + 7y<span style=\"font-family: Times New Roman;\"><sup>2</sup></span> - 10xy)<br>A = 19, B = 7 और C = -10<br>A + B - C = 19 + 7 -(-10)&nbsp;= 26 + 10 = 36</p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({

                    question_en: "<p>100. <span style=\"font-family: Roboto;\"><strong>Cloze test :-</strong><br><span style=\"font-weight: 400;\">What every tourist must take back from Bhutan is pure honey, especially Putka, &ldquo;Antibiotic&rdquo;&nbsp;</span><span style=\"font-weight: 400;\">honey produced (96)______ Melipona Bees (stingless bees) a breed found in protected areas </span><span style=\"font-weight: 400;\">(97)______ 700 to 1,500 metres above sea level. Due (98)______ their small size, they can get </span><span style=\"font-weight: 400;\">larger nutrients (99)______ regular honeybees. It has a tangy/sour taste and can (100)______ your&nbsp;</span><span style=\"font-weight: 400;\">sore throat in a matter of minutes.</span></span><br><span style=\"font-weight: 400;\">Select the most appropriate option to fill in blank number 100.</span></p>\n<p>&nbsp;</p>\n<p><span style=\"font-family: Roboto;\"> </span></p>",
                    question_hi: "<p>100. <span style=\"font-family: Roboto;\"><strong>Cloze test :-</strong><br><span style=\"font-weight: 400;\">What every tourist must take back from Bhutan is pure honey, especially Putka, &ldquo;Antibiotic&rdquo;&nbsp;</span><span style=\"font-weight: 400;\">honey produced (96)______ Melipona Bees (stingless bees) a breed found in protected areas </span><span style=\"font-weight: 400;\">(97)______ 700 to 1,500 metres above sea level. Due (98)______ their small size, they can get </span><span style=\"font-weight: 400;\">larger nutrients (99)______ regular honeybees. It has a tangy/sour taste and can (100)______ your&nbsp;</span><span style=\"font-weight: 400;\">sore throat in a matter of minutes.</span></span><br><span style=\"font-weight: 400;\">Select the most appropriate option to fill in blank number 100.</span></p>",
                    options_en: ["<p>calm</p>", "<p>pacify</p>", 
                                "<p>appease</p>", "<p>soothe</p>"],
                    options_hi: ["<p>calm</p>", "<p>pacify</p>",
                                "<p>appease</p>", "<p>soothe</p>"],
                    solution_en: "<p>100.(d) soothe.&nbsp;<br>Soothe means to reduce pain or discomfort; relieve or ease pain. The given passage states that the honey has a tangy/sour taste and can make your sore(painful or aching) throat feel relieved of pain. Hence, &lsquo;soothe&rsquo; is the most appropriate answer.</p>",
                    solution_hi: "<p>100.(d)&nbsp;soothe.&nbsp;<br>Soothe&rsquo; का अर्थ है दर्द या बेचैनी को कम करना; दर्द से राहत देना या उसे हल्का करना। दिए गए passage में कहा गया है कि शहद का स्वाद तीखा/खट्टा होता है और यह आपके गले की खराश (दर्द या पीड़ा वाले) को दर्द से राहत महसूस करा सकता है। अतः, &lsquo;soothe&rsquo; सबसे उपयुक्त उत्तर है।</p>\n<p>&nbsp;</p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
